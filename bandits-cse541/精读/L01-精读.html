完全是被动的</b>。</b> <span class='w'>它选的那个 <code>h_t</code> 只代表「某一个仍然可能正确的假设」，一旦错了，你只学到「这<b>一个</b>不对」</span>。<b>⇒ 信息效率是 <code>O(1)</code>——每犯一次错只换来一个假设的淘汰。</b>", "<b>⇒ 而修复的方向因此也很明确：<b>让每一次犯错都淘汰<b>一大批</b>假设</b>。</b> <span class='k'>如果每错一次能砍掉<b>一半</b>，那么犯错数就是 <code>log_2|ℋ|</code> 而不是 <code>|ℋ|</code></span>。<b>⇒ 这正是下一块减半算法的全部想法。</b>", "⚠️ <b>这一块的教训比那个具体的界更重要，而且对你的课题直接适用：<b>「选当前看起来最好的那个」在非独立同分布下可能灾难性地失败</b>。</b> <span class='w'>FTL 的问题不是「不够聪明」，而是它<b>把全部赌注押在一个候选上</b>，于是对手只要盯着那一个打</span>。<b>⇒ 稳健的做法要么是<b>保留一个候选集合</b>（减半算法 / 逐次淘汰），要么是<b>按分布随机化</b>（指数权重）。</b><span class='k'>这两条路后面都会走到。</span>"], "eq": "p28/p29 = 上一块的幻灯片**原样重贴**，只改两处：\n   设定 IID → **Adversarial**，句末多一个**红色问号**\n   ⚠ y_t = h_*(x_t) **仍然保留**\n     ⇒ 失败**不是**因为没有完美假设，**纯粹**因为数据不是 i.i.d.（控制变量很干净）\n\n**p30 Claim**：存在一个序列与一种平局打破方式，使 FTL 犯 **min{|ℋ|, T}** 次错\n   T < |ℋ| 时就是 T —— **每一轮都错**，完全没学到东西\n   对比上一块：|ℋ|=T=10⁶ 时 383 次  vs  **100 万次**\n\n构造的关键（红字提示）：**平局**\n   「很多分类器都达到最小值，假设对手知道你打破平局的策略」\n   ⇒ 回想 p9：幻灯片写 ĥ **∈** argmin 而不是 = ，因为 argmin 是**集合**\n\n构造思路：**让你永远处在平局状态，然后专挑你会选的那一个来打**\n   开局：所有 h 的经验错误都是 0，全部并列第一\n   你挑了 h_1 → 对手构造 (x_1,y_1) 使 **h_1 错、其余对**\n   ⇒ 你错一次，h_1 被淘汰出领先集合\n   下一轮同样：剩下的仍全部并列，你挑 h_2，对手让 h_2 错\n   ⇒ **每轮恰好淘汰一个假设，而你每轮都错一次**\n   一直到只剩 h_*，共错 |ℋ|−1 次（或 T 次，若 T 更小）\n\n问题出在哪：**FTL 每次只排除一个假设，而且完全被动**\n   它选的 h_t 只代表「某一个仍然可能正确的假设」\n   一旦错了，你只学到「这**一个**不对」⇒ 信息效率 O(1)\n\n⇒ 修复方向很明确：**让每一次犯错都淘汰一大批假设**\n   每错一次砍掉**一半** ⇒ 犯错数 **log₂|ℋ|** 而不是 |ℋ|\n   = 下一块减半算法的全部想法\n\n⚠⚠ 这一块的教训比那个界更重要，且对课题直接适用：\n   **「选当前看起来最好的那个」在非 i.i.d. 下可能灾难性失败**\n   FTL 的问题不是不够聪明，而是**把全部赌注押在一个候选上**\n   ⇒ 稳健做法：**保留一个候选集合**（减半 / 逐次淘汰）\n                或 **按分布随机化**（指数权重）\n   两条路后面都会走到", "tbl": {"head": ["", "独立同分布（p27）", "对抗（p30）"], "rows": [["策略", "<b>跟随领先者（FTL）</b>", "<b>同一个</b>"], ["有完美假设吗", "<b>有</b>", "<b>有（没变）</b>"], ["犯错数", "<b>2 + 2log|ℋ|·log T</b>", "<b>min{|ℋ|, T}</b>"], ["|ℋ|=T=10⁶ 时", "<b>约 383 次</b>", "<span class='w'>100 万次</span>"], ["每错一次淘汰几个", "—", "<span class='w'>恰好 1 个</span>"], ["根源", "—", "<b>赌注全押在一个候选上</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页是全讲对你<b>最有警示价值</b>的一块，因为你的采集流程里很可能正藏着一个 FTL。</b><br><span class='k'>任何形如「<b>先测一轮，然后把后续预算集中到当前 <code>Ĝ</code> 最高的那个配置上</b>」的做法，都是跟随领先者</span>。<b>⇒ 在独立同分布下它没问题（上一块证了）；但只要有一点非平稳，它就可能系统性地错下去。</b><br><b>而你的设定<b>确实</b>有非平稳的来源，这不是杞人忧天：</b><br><b>① <b>query 不是随机到达的</b></b>——<span class='w'>你是按 benchmark 顺序或按难度分组跑的，前 100 条和后 100 条可能系统性不同</span>；<b>② <b>LLM 服务端会漂移</b></b>（版本、负载、温度采样）；<b>③ <b>最要命的一条：你自己的筛选会改变后续数据的分布</b></b>——<span class='k'>砍掉一批配置之后，剩下的测量就只覆盖幸存者所在的那块区域了</span>。<br><b>⇒ 第 ③ 条正是 p22 那个「反馈回路」在你问题里的样子，而它<b>不可避免</b>。</b><br><b>所以这一页给的两条修复路线，你都该知道该用哪条：</b><br><b>· <b>保留候选集合</b>（减半 / 逐次淘汰）——<b>这就是你正在用的</b></b>。<span class='w'>好处是它不把赌注押在一个上，而且淘汰是<b>有凭据</b>的（置信区间不重叠才砍）</span>。<b>⇒ 你的方法在这一点上是对的，值得在论文里明确说出理由，而不是当成「大家都这么做」。</b><br><b>· <b>随机化</b>（指数权重 / <code>γλ</code> 混合）——<b>作为补充</b></b>。<span class='k'>L14 那个概率下界的理由（保住离策评估的能力）和这里的理由（不被对手盯住）其实是同一件事的两面</span>。<br><b>⚠ 最后一条很具体的建议：<b>把「平局怎么打破」写进方法里，而且要随机打破</b>。</b> <span class='w'>p30 的构造完全建立在「对手知道你的平局规则」上</span>；<b>你的「对手」虽然不是真的恶意，但<b>按固定顺序（比如配置编号）打破平局</b>会和 benchmark 的顺序产生虚假关联。<b>随机打破平局是一行代码的事，却能挡掉一类很难查的偏差。</b></b>", "ref": "本讲 p30（逐字核对）· p22 · p27 · L14 p3（γλ 混合）· 简报 §4b §4e（已核）"}},
{"r": [31, 33], "t": "减半算法：每错一次砍掉一半", "star": 3, "quote": "<b>Halving Algorithm</b><br><em>Input: ℋ with |ℋ| &lt; ∞ &nbsp; Initialize: <b>V₁ = ℋ</b><br>for t = 1,2,…<br>&nbsp;&nbsp;x<sub>t</sub> arrives<br>&nbsp;&nbsp;Player picks a h<sub>t</sub> ∈ V<sub>t</sub> : <b>Σ<sub>h∈V<sub>t</sub></sub>1{h(x<sub>t</sub>)=h<sub>t</sub>(x<sub>t</sub>)} &gt; Σ<sub>h∈V<sub>t</sub></sub>1{h(x<sub>t</sub>)=−h<sub>t</sub>(x<sub>t</sub>)}</b><br>&nbsp;&nbsp;y<sub>t</sub> is revealed &nbsp; Player receives loss <b>1</b>{h<sub>t</sub>(x<sub>t</sub>) ≠ y<sub>t</sub>}<br>&nbsp;&nbsp;<b>Update V<sub>t+1</sub> = {h ∈ V<sub>t</sub> : h(x<sub>t</sub>) = y<sub>t</sub>}</b></em><br>〔橙字〕<em><b>Either the algorithm doesn't make mistake, or <i>at least half</i> of hypotheses are discarded</b></em><br>〔p33 定理〕<em>…if h<sub>t</sub> is recommended by the Halving algorithm, we have that <b>Σ<sub>t=1</sub><sup>T</sup> 1{h<sub>t</sub>(x<sub>t</sub>) ≠ y<sub>t</sub>} ≤ log₂(|ℋ|)</b></em>", "one": "<b>两个改动就够了：维护一个「还没被证伪的假设」集合，每轮按多数票作答。于是犯错和「砍掉一半」被绑在了一起——而一半只能砍 log₂|ℋ| 次。</b>", "pts": ["<b>算法只比 FTL 多了两样东西，而这两样是配套的。</b> <span class='k'>① 维护一个集合 <b><code>V_t</code></b>（<b>版本空间</b>，version space），初始 <code>V_1 = ℋ</code>；② 作答时按 <code>V_t</code> 里的<b>多数票</b>，而不是挑某一个</span>。", "<b>那个多数票的条件写得有点绕，但意思很简单。</b> <span class='w'><code>Σ_{h∈V_t}1{h(x_t)=h_t(x_t)} > Σ_{h∈V_t}1{h(x_t)=−h_t(x_t)}</code>：挑一个 <code>h_t</code>，使得<b>与它预测相同的假设数，多于与它相反的</b></span>。<b>⇒ 既然是二分类，这就是「<b>按 <code>V_t</code> 的多数意见作答</b>」。</b>", "<b>更新规则是<b>纯粹的证伪</b>：<code>V_{t+1} = {h ∈ V_t : h(x_t) = y_t}</code>。</b> <span class='k'>把这一轮答错的假设<b>全部</b>扔掉，一个不留</span>。<b>⇒ ⚠ 注意这一步之所以合法，全靠可实现假设 <code>y_t = h_*(x_t)</code>——它保证 <b><code>h_*</code> 永远不会被扔掉</b>。</b><span class='w'>没有这条，扔掉的可能正是最好的那个。</span>", "<b>橙字那句话是整个算法的全部直觉，而且它是一个<b>二选一</b>：<b>要么这一轮不犯错，要么至少一半的假设被淘汰</b>。</b> <span class='k'>理由很干净：你按多数票作答，所以如果你<b>错了</b>，说明多数派错了——而多数派<b>至少占一半</b>，它们全部在更新里被扔掉</span>。", "<b>⇒ 于是「犯错」和「进展」被<b>绑死</b>了：<b>每犯一次错，<code>|V_t|</code> 至少减半</b>。</b> <span class='w'>而 <code>|V_1| = |ℋ|</code>，且 <code>|V_t| ≥ 1</code>（<code>h_*</code> 永远在里面）</span>；<b>⇒ 减半最多只能发生 <code>log_2|ℋ|</code> 次，这就是定理。</b>", "<b>这个论证的结构值得单独点出来，因为它是一个<b>势函数</b>论证。</b> <span class='k'>势是 <code>log_2|V_t|</code>：它<b>单调不增</b>，<b>有下界 0</b>，而且<b>每次犯错至少降 1</b></span>。<b>⇒ 「单调 + 有界 + 每次事件都推进」⇒ 事件次数有限。</b><span class='w'>L14 p5 的 <code>log W_t</code> 和 L10 p4 的 <code>log|V_t|</code>（信息矩阵行列式）是同一个套路的另外两个实例。</b>", "<b>对比 FTL 就能看清差别在哪：<b>FTL 每错一次淘汰 1 个，减半算法每错一次淘汰 <code>|V_t|/2</code> 个</b>。</b> <span class='k'>前者是<b>线性</b>搜索，后者是<b>二分</b>搜索</span>。<b>⇒ <code>|ℋ|</code> vs <code>log_2|ℋ|</code> 的差距就是线性查找与二分查找的差距，而代价只是「作答时问一下全体的意见」。</b>", "<b>还有一个常被忽略的好处：<b>这条界完全不含 <code>T</code></b>。</b> <span class='w'>不管跑多少轮，犯错数都 <code>≤ log_2|ℋ|</code></span>——<b>⇒ 甚至比独立同分布那条 <code>2log|ℋ|log T</code> 还要好（后者随 <code>T</code> 缓慢增长）。</b><span class='k'>⚠ 这是一个相当反直觉的结论：<b>在对抗设定下，用对了算法反而拿到了更强的保证</b>。</b>", "<b>⚠ 但别被这个结论误导，差别的来源是<b>算法</b>不是<b>设定</b>。</b> <span class='w'>减半算法在独立同分布下也能用，而且同样给 <code>log_2|ℋ|</code>；是 FTL 在对抗下崩了，不是对抗设定本身更容易</span>。<b>⇒ 正确的总结是：<b>对抗设定需要更好的算法，而那个算法恰好在两种设定下都更好</b>。</b>", "<b>最后记一下这个算法的局限，p35 之后要处理的正是它：<b>可实现假设一旦去掉，减半算法会把所有假设都扔光</b>。</b> <span class='k'>没有完美假设时，每个 <code>h</code> 迟早都会错一次，于是 <code>V_t</code> 变成空集，算法无法继续</span>。<b>⇒ 修复的办法是把「硬淘汰」换成「软降权」——这正是指数权重（p41–48）。</b>"], "eq": "算法只比 FTL 多两样（配套的）：\n   ① 维护集合 **V_t**（**版本空间** version space），V_1 = ℋ\n   ② 作答按 V_t 里的**多数票**，而不是挑某一个\n\n多数票条件（写得绕，意思简单）：\n   挑 h_t 使 **与它预测相同的假设数 > 与它相反的**\n   二分类 ⇒ 就是「按 V_t 的多数意见作答」\n\n更新 = **纯粹的证伪**：V_{t+1} = { h ∈ V_t : h(x_t) = y_t }\n   把这轮答错的假设**全部**扔掉，一个不留\n   ⚠ 合法性全靠可实现假设 y_t = h_*(x_t) ——它保证 **h_* 永远不会被扔掉**\n     没有这条，扔掉的可能正是最好的那个\n\n**橙字 = 全部直觉**（一个二选一）：\n   **要么这轮不犯错，要么至少一半的假设被淘汰**\n   理由：按多数票作答 ⇒ 若你错了，说明多数派错了\n         而多数派**至少占一半** ⇒ 它们全部在更新里被扔掉\n\n⇒ 「犯错」与「进展」被**绑死**：每犯一次错，|V_t| 至少减半\n   |V_1| = |ℋ|，|V_t| ≥ 1（h_* 永远在里面）\n   ⇒ 减半最多 **log₂|ℋ|** 次 ✓\n\n论证结构 = **势函数**论证：\n   势取 log₂|V_t| —— **单调不增 · 有下界 0 · 每次犯错至少降 1**\n   ⇒「单调 + 有界 + 每次事件都推进」⇒ 事件次数有限\n   （L14 p5 的 log W_t、L10 p4 的 log|V_t| 是同一套路的另两个实例）\n\n对比 FTL：\n   FTL     每错一次淘汰 **1** 个         = **线性**搜索  ⇒ |ℋ|\n   减半     每错一次淘汰 **|V_t|/2** 个   = **二分**搜索  ⇒ log₂|ℋ|\n   代价只是「作答时问一下全体的意见」\n\n常被忽略的好处：**这条界完全不含 T**\n   不管跑多少轮，犯错数 ≤ log₂|ℋ|\n   ⇒ 甚至比 i.i.d. 那条 2log|ℋ|log T 还好（后者随 T 缓慢增长）\n   ⚠ 反直觉：**对抗设定下用对了算法，反而拿到更强的保证**\n\n⚠ 但差别来源是**算法**不是**设定**：\n   减半算法在 i.i.d. 下也能用，同样给 log₂|ℋ|\n   是 FTL 在对抗下崩了，不是对抗设定本身更容易\n   ⇒ 正确总结：**对抗设定需要更好的算法，而那个算法恰好两种设定下都更好**\n\n局限（p35 之后要处理的）：**可实现假设一去掉，V_t 会被扔光**\n   没有完美假设时每个 h 迟早错一次 ⇒ V_t 变空集，算法无法继续\n   ⇒ 修复：把**硬淘汰**换成**软降权** = 指数权重（p41–48）", "tbl": {"head": ["", "跟随领先者（FTL）", "减半算法"], "rows": [["维护什么", "<span class='w'>只有当前最优的一个</span>", "<b>整个版本空间 V<sub>t</sub></b>"], ["怎么作答", "<span class='w'>用那一个</span>", "<b>V<sub>t</sub> 的多数票</b>"], ["每错一次淘汰", "<span class='w'>1 个</span>", "<b>至少一半</b>"], ["对抗下的犯错数", "<span class='w'>min{|ℋ|,T}</span>", "<b>log₂|ℋ|</b>"], ["界含 T 吗", "<b>含</b>", "<b>不含</b>"], ["⚠ 依赖可实现吗", "<span class='w'>依赖</span>", "<b>依赖（否则 V<sub>t</sub> 会空）</b>"]]}, "res": {"tag": "推断", "v": "<b>减半算法就是你那套<b>逐次淘汰</b>的最纯粹形态，而把这个对应关系写清楚对你论文的「方法动机」一节很有用。</b><br><span class='k'>对应关系是逐项的：<b><code>ℋ</code> ↔ 你的配置集合</b>；<b><code>V_t</code> ↔ 存活候选集</b>；<b>「证伪」↔ 置信区间不重叠时砍掉</b>；<b>「多数票」↔ 用存活集合的共识来决定下一步测什么</b></span>。<br><b>而那个势函数论证可以<b>直接搬</b>，这是最值得带走的东西</b>：<span class='w'>找一个单调、有界、且「每次发生坏事就推进一步」的量</span>。<b>⇒ 你的版本：势取 <code>log|V_ℓ|</code>（存活候选数），证「每一轮至少砍掉一个常数比例」，就能得出「轮数 ≤ log|𝒳| = H·log2」。</b><span class='k'>⚠ 注意这给的是<b>轮数</b>的界，不是<b>调用次数</b>的界——后者还要乘每轮的预算，而那正是 L07 的 G-最优设计在管的事。</span><br><b>⚠ 但有一条关键差异必须在论文里讲明，否则会被审稿人抓住：<b>减半算法的淘汰是「确定性证伪」，你的淘汰是「统计性证伪」</b>。</b><br><span class='w'>这里 <code>h(x_t) ≠ y_t</code> 就<b>一定</b>排除 <code>h</code>，零错误率；而你砍掉一个配置靠的是「它的置信上界低于别人的置信下界」，<b>有 <code>δ</code> 的概率砍错</b></span>。<b>⇒ 后果有两个：① 你必须用<b>随时有效</b>的置信界（L12 那套），否则多轮下来 <code>δ</code> 会累加；② 「<code>h_*</code> 永远在 <code>V_t</code> 里」这条在你这里只是<b>高概率</b>成立，而整个论证都挂在它上面。</b><br><b>⇒ 所以你的定理陈述必须是「以概率 <code>≥ 1−δ</code>，最优配置始终存活，且轮数 <code>≤ …</code>」，<b>把好事件显式写进去</b>。</b> <span class='k'>这正是 L12 主线卡里强调的那件事，两讲在这里合流。</span><br><b>最后一条实际的：<b>可实现假设对应「存在一个配置严格最优」，而你多半不满足</b></b>（<span class='w'>不同 query 偏好不同配置</span>）。<b>⇒ 所以纯粹的硬淘汰对你是危险的——两个配置的 <code>G</code> 真的相等时，硬淘汰会把其中一个错砍掉。<b>更稳的做法是像指数权重那样「软降权」，或者在淘汰判据里留一个 <code>ε</code> 的宽容带（只砍劣于最优者超过 <code>2ε_ℓ</code> 的），而后者正是 L07 p6 那个算法做的。</b></b>", "ref": "本讲 p31–p33（逐字核对）· L07 p6 · L12 主线卡 · L09 p11 · 简报 §4c §4d（已核）"}, "link": {"t": "你学过的对应：本课 L07 精读（p6 那个分轮算法：每轮重算 G-最优设计、砍掉劣于最优者超过 2ε_ℓ 的——就是减半算法的「统计版 + 带宽容带」）", "href": "L07-精读.html"}},
{"r": [34, 36], "t": "小结，然后换一个目标：从犯错数到遗憾", "star": 3, "quote": "〔p34 小结，逐字〕<em><b>Assuming that your data is IID is a <u>very</u> strong assumption that is almost never true in practice. Online learning is a different paradigm that makes no assumptions but still yields meaningful guarantees.</b></em><br><em>Assuming there exists a perfect classifier h<sub>*</sub>: — When x<sub>t</sub> is drawn <b>IID</b>, empirical risk minimization results in only a number of mistakes that grows like <b>log(T)log(H)</b>. — When x<sub>t</sub> is chosen <b>adversarially</b> empirical risk minimization can do <b>arbitrarily badly</b>. But there exist smarter approaches (like Halving algorithm) that make only <b>log(H)</b> mistakes</em><br>〔p36 新目标，橙框〕<em><b>Goal: Minimize regret wrt best &nbsp; max<sub>h∈ℋ</sub> Σ<sub>t=1</sub><sup>T</sup> 1{h<sub>t</sub>(x<sub>t</sub>) ≠ y<sub>t</sub>} − 1{h(x<sub>t</sub>) ≠ y<sub>t</sub>}</b></em>", "one": "<b>前面全部压在「存在完美假设」上。一旦去掉它，「犯错数」就不再是个能压到 0 的指标——于是目标必须换成「比最好的那个固定假设多犯了多少」，这就是遗憾。</b>", "pts": ["<b>p34 那句总结值得逐字记下来，因为它是这门课的立场声明</b>：<b>「假设你的数据是独立同分布的，是一个<b>非常</b>强的假设，在实践中几乎从不成立。在线学习是另一种范式，它<b>不作任何假设</b>，却仍然给出有意义的保证。」</b>", "<b>下面两条并列把本块的成果说清了，而关键在那个前提上：<b>「假设存在一个完美分类器 <code>h_*</code>」</b>。</b> <span class='k'>独立同分布 ⇒ ERM 的犯错数按 <code>log(T)log(H)</code> 增长；对抗 ⇒ <b>ERM 可以差到任意程度</b>，但有更聪明的办法（减半算法）只犯 <code>log(H)</code> 次错</span>。", "<b>⇒ 所以 p21–p34 的真正结论不是「对抗很难」，而是<b>「对抗不是不能做，只是不能用朴素的办法做」</b>。</b> <span class='w'>这个区分很重要，也是后面每一讲反复出现的模式</span>。", "<b>p35 的小节标题点明了下一步要拿掉什么：<b>Online learning in non-separable case</b>（不可分情形）。</b> <span class='k'>「可分」(separable) 就是「存在完美假设」的另一种说法，对应前半讲的「可实现」(realizable)</span>。<b>⇒ 两个词在不同语境下混用，但指的是同一件事，查文献时都会遇到。</b>", "<b>为什么去掉它之后目标必须换？因为「犯错数」失去了意义。</b> <span class='w'>没有完美假设时，<b>最好的那个假设自己也会犯错</b>——比如最好的 <code>h</code> 错误率 30%，那么任何算法在 <code>T</code> 轮里都至少错 <code>0.3T</code> 次</span>。<b>⇒ 再去追求「犯错数小」就是在追求一个不可能的目标。</b>", "<b>于是 p36 把目标换成<b>遗憾</b>：<code>max_{h∈ℋ}Σ_{t=1}^T [1{h_t(x_t)≠y_t} − 1{h(x_t)≠y_t}]</code>。</b> <span class='k'>读法：<b>我犯的错，减去事后最好的那个固定假设犯的错</b></span>。<b>⇒ 那 <code>0.3T</code> 次不可避免的错在相减时抵消掉了，剩下的才是「因为我不知道哪个最好而多付的代价」。</b>", "<b>这个改动和前半讲从 <code>R(ĥ)</code> 改成 <code>R(ĥ)−R(h_*)</code>（超额风险）是<b>完全同一件事</b>，值得对照着记。</b> <span class='w'>可实现时谈绝对量，不可实现时只能谈<b>相对量</b></span>。<b>⇒ 「超额风险」和「遗憾」是同一个思想在两种设定下的名字。</b>", "<b>⚠ 注意比较对象是<b>事后最好的那个<b>固定</b>假设</b>，不是「每轮各自最好的」。</b> <span class='k'>后者等于要求预知未来，做不到；<b>而且它会让遗憾必然线性增长</b></span>。<b>⇒ 这和 L14 p1 里讲的是同一回事：对抗 bandit 的基准被压低到一个可达成的水平，否则整套理论不成立。</b>", "<b>最后记一下这个目标的一个性质，它决定了后面算法的形态：<b>遗憾可以是负的</b>。</b> <span class='w'>如果你运气好或算法确实比任何单个固定假设都强（比如在不同阶段切换），遗憾可以小于 0</span>。<b>⇒ 所以「遗憾 ≤ 某个正数」这种界，本质上是在说「你不会比最好的固定假设差太多」，而不是「你会接近它」。</b>"], "eq": "**p34 立场声明**（逐字）：\n   「假设你的数据是独立同分布的，是一个**非常**强的假设，在实践中几乎从不成立。\n     在线学习是另一种范式，它**不作任何假设**，却仍然给出有意义的保证。」\n\n两条并列（前提：**假设存在一个完美分类器 h_***）：\n   x_t **i.i.d.**      ⇒ ERM 的犯错数按 **log(T)·log(H)** 增长\n   x_t **对抗**        ⇒ **ERM 可以差到任意程度**\n                         但有更聪明的办法（减半算法）只犯 **log(H)** 次错\n\n⇒ p21–p34 的真正结论不是「对抗很难」，而是\n   **「对抗不是不能做，只是不能用朴素的办法做」** —— 后面每讲反复出现的模式\n\np35 小节标题：**Online learning in non-separable case**（不可分情形）\n   「可分」(separable) = 「存在完美假设」= 前半讲的「可实现」(realizable)\n   ⚠ 两个词在不同语境混用，指同一件事，查文献都会遇到\n\n为什么去掉它目标必须换：**「犯错数」失去意义**\n   没有完美假设时，**最好的那个假设自己也会犯错**\n   最好的 h 错误率 30% ⇒ 任何算法在 T 轮里至少错 0.3T 次\n   ⇒ 再追求「犯错数小」是在追求一个不可能的目标\n\n**p36 新目标 = 遗憾**：\n   **max_{h∈ℋ} Σ_{t=1}^T [ 1{h_t(x_t)≠y_t} − 1{h(x_t)≠y_t} ]**\n   读法：**我犯的错，减去事后最好的那个固定假设犯的错**\n   ⇒ 那 0.3T 次不可避免的错相减时抵消，剩下的才是\n     「因为我不知道哪个最好而多付的代价」\n\n与前半讲的对应（完全同一件事）：\n   可实现   → 谈绝对量   R(ĥ)\n   不可实现 → 只能谈相对量 R(ĥ) − R(h_*)（**超额风险**）\n   ⇒ **「超额风险」与「遗憾」是同一思想在两种设定下的名字**\n\n⚠ 比较对象是**事后最好的那个固定假设**，不是「每轮各自最好的」\n   后者等于要求预知未来，且会让遗憾必然线性增长\n   （与 L14 p1 同一回事：基准被压到可达成的水平，否则整套理论不成立）\n\n性质：**遗憾可以是负的**\n   若算法比任何单个固定假设都强（比如在不同阶段切换），遗憾 < 0\n   ⇒ 「遗憾 ≤ 某正数」本质是说「**你不会比最好的固定假设差太多**」\n     而不是「你会接近它」", "tbl": {"head": ["", "可分 / 可实现", "不可分 / 不可实现"], "rows": [["存在完美的那个吗", "<b>存在</b>", "<span class='w'>不存在</span>"], ["泛化界那边的指标", "<b>R(ĥ)</b>", "<b>R(ĥ) − R(h<sub>*</sub>)（超额风险）</b>"], ["在线学习这边的指标", "<b>犯错数</b>", "<b>遗憾</b>"], ["为什么必须换", "—", "<b>最好的那个自己也会错 0.3T 次</b>"], ["减半算法还能用吗", "<b>能</b>", "<span class='w'>⚠ 不能（V<sub>t</sub> 会被扔空）</span>"]]}},
{"r": [37, 40], "t": "两条遗憾界并排：不作假设的那条，常数反而更小", "star": 3, "quote": "〔p37 独立同分布〕<em>Choose h<sub>t</sub> ∈ arg min<sub>h∈ℋ</sub> Σ<sub>s=1</sub><sup>t−1</sup>1{h(x<sub>s</sub>)≠y<sub>s</sub>}</em>；由推论 𝔼[R(ĥ)]−R(h<sub>*</sub>) ≤ √(8log(|ℋ|)/n) <em>⟹ <b>max<sub>h∈ℋ</sub> 𝔼[ Σ<sub>t=1</sub><sup>T</sup>1{h<sub>t</sub>(x<sub>t</sub>)≠y<sub>t</sub>} − 1{h(x<sub>t</sub>)≠y<sub>t</sub>} ] ≤ √( 8 T log(|ℋ|) )</b></em><br>〔p38 对抗〕<b>Theorem</b>: <em>If z<sub>t</sub> ∈ [0,1]<sup>d</sup> ∀t, and I<sub>t</sub>, p<sub>t</sub> are chosen by <b>exponential weights</b> then max<sub>i∈[d]</sub>𝔼[Σ<sub>t=1</sub><sup>T</sup>⟨I<sub>t</sub>,z<sub>t</sub>⟩ − ⟨e<sub>i</sub>,z<sub>t</sub>⟩] = max<sub>i∈[d]</sub>Σ<sub>t=1</sub><sup>T</sup>⟨p<sub>t</sub>,z<sub>t</sub>⟩ − ⟨e<sub>i</sub>,z<sub>t</sub>⟩ ≤ <b>√( T log(d)/2 )</b></em><br><em>⟹ <b>max<sub>h∈ℋ</sub>𝔼[ Σ<sub>t=1</sub><sup>T</sup>1{h<sub>t</sub>(x<sub>t</sub>)≠y<sub>t</sub>} − 1{h(x<sub>t</sub>)≠y<sub>t</sub>} ] ≤ √( T log(|ℋ|)/2 )</b></em>", "one": "<b>√(8T log|ℋ|) 对 √(T log|ℋ|/2)——两条界同阶，但不作任何分布假设的那一条，常数小了 4 倍。这不是笔误，而是说明「先证泛化界再转成遗憾」是一条有损的路。</b>", "pts": ["<b>p37 走的是「借道泛化界」这条路，而它只有一步，很值得看清。</b> <span class='k'>独立同分布下第 <code>t</code> 轮的超额风险是 <code>√(8log|ℋ|/(t−1))</code>，对 <code>t</code> 求和：<code>Σ_{t=2}^T 1/√(t−1) ≈ 2√T</code></span>。<b>⇒ 乘起来得 <code>√(8T log|ℋ|)</code> 量级，幻灯片就写成这个形式。</b>", "<b>注意这里求和出来的是 <code>√T</code> 而不是 <code>log T</code>，和 p27 的犯错界形成对比。</b> <span class='w'>p27 那边每轮是 <code>1/(t−1)</code>，求和得调和和 <code>log T</code>；这边每轮是 <code>1/√(t−1)</code>，求和得 <code>√T</code></span>。<b>⇒ 快率慢率的差别，在求和之后就变成了 <code>log T</code> 与 <code>√T</code> 的差别。</b>", "<b>p38 走的是完全不同的路：<b>不经过泛化界，直接对在线问题设计算法</b>。</b> <span class='k'>定理说的是：若 <code>z_t ∈ [0,1]^d</code>，用<b>指数权重</b>选 <code>I_t, p_t</code>，则遗憾 <code>≤ √(T log(d)/2)</code></span>。<b>⇒ 把 <code>d</code> 换成 <code>|ℋ|</code>（每个假设当一个「专家」），就得到 <code>√(T log(|ℋ|)/2)</code>。</b>", "<b>⚠ 定理里那个等号值得单独注意：<code>max_i E[Σ⟨I_t,z_t⟩ − ⟨e_i,z_t⟩] = max_i Σ⟨p_t,z_t⟩ − ⟨e_i,z_t⟩</code>。</b> <span class='w'>左边是「随机抽一个专家 <code>I_t ∼ p_t</code>」的期望损失，右边是「按 <code>p_t</code> 加权平均」的损失</span>——<b>两者相等，因为 <code>E[⟨e_{I_t},z_t⟩] = ⟨p_t,z_t⟩</code>。</b><span class='k'>⇒ 所以「随机化地选一个」和「取加权平均」在期望意义上没区别，这在后面（L14 的 bandit 情形）会变得很要紧。</span>", "<b>现在把两条并排（p39 正是这么做的），而结果相当出人意料。</b> <b>独立同分布：<code>√(8T log|ℋ|)</code>；对抗：<code>√(T log(|ℋ|)/2)</code>。</b><span class='w'>两者同阶，但<b>对抗那条的常数小 4 倍</b>（<code>√8</code> vs <code>√0.5</code>）。</span>", "<b>⇒ <b>不作任何分布假设的那条界，反而更紧</b>。这不是笔误，而且理由很清楚，值得想明白。</b>", "<b>原因在于 p37 那条路是<b>绕远</b>了：它先证一个<b>比需要的更强</b>的结论，再把它转成遗憾。</b> <span class='k'>泛化界保证的是「<b>对所有 <code>h</code> 同时</b>，经验风险接近真实风险」——这叫<b>一致收敛</b>，比「我这个算法的累计损失不比最好的 <code>h</code> 差太多」强得多</span>。<b>⇒ 多证的那部分就是浪费掉的常数。</b>", "<b>而指数权重是<b>直接</b>对目标下手：它从头到尾只关心累计损失的差，不关心任何单个 <code>h</code> 的风险估计准不准。</b> <span class='w'>所以它不需要一致收敛，也就不付那个代价</span>。<b>⇒ 这是一个很通用的教益：<b>绕道一个更强的中间结论，往往要付常数甚至阶的代价</b>。</b>", "<b>⚠ 但不要把这个对比过度解读成「对抗设定更好」。</b> <span class='k'>两条界<b>同阶</b>，差的只是常数；而独立同分布下其实还能做得更好（比如利用问题相关的差距得到 <code>log T</code> 型的界）——只是 p37 那条朴素路线没去拿</span>。<b>⇒ 准确的说法是：<b>这里对比的是两种<b>证法</b>，不是两种设定的本质难度</b>。</b>", "<b>p40 用和 p34 同样的一句话收尾（「假设独立同分布是一个非常强的假设……」），只是这次下面是空的。</b> <span class='w'>⇒ 两次用同一句话收尾，说明这就是老师要你记住的那一条。</span>"], "eq": "**p37（独立同分布，借道泛化界）**：\n   第 t 轮的超额风险 sqrt( 8log|ℋ| / (t−1) )\n   对 t 求和：Σ_{t=2}^T 1/sqrt(t−1) ≈ **2·sqrt(T)**\n   ⇒ **max_h E[ Σ_t 1{h_t≠y_t} − 1{h≠y_t} ] ≤ sqrt( 8·T·log(|ℋ|) )**\n\n   ⚠ 求和出来是 sqrt(T) 而不是 log T，和 p27 对比：\n     p27：每轮 1/(t−1)      ⇒ 调和和 ⇒ **log T**\n     这里：每轮 1/sqrt(t−1)  ⇒ **sqrt(T)**\n   ⇒ 快率慢率的差别，求和后变成 log T 与 sqrt(T) 的差别\n\n**p38（对抗，不经泛化界，直接设计算法）**：\n   若 z_t ∈ [0,1]^d，用**指数权重**选 I_t, p_t，则\n   max_i E[ Σ_t ⟨I_t,z_t⟩ − ⟨e_i,z_t⟩ ] = max_i Σ_t ⟨p_t,z_t⟩ − ⟨e_i,z_t⟩ ≤ **sqrt( T·log(d)/2 )**\n   把 d 换成 |ℋ|（每个假设当一个专家）⇒ **sqrt( T·log(|ℋ|)/2 )**\n\n   ⚠ 那个**等号**值得注意：\n     左 = 「随机抽一个专家 I_t ∼ p_t」的期望损失\n     右 = 「按 p_t 加权平均」的损失\n     相等，因为 E[⟨e_{I_t}, z_t⟩] = ⟨p_t, z_t⟩\n     ⇒ 「随机化地选一个」与「取加权平均」在期望意义上**没区别**\n       （这在 L14 的 bandit 情形会变得很要紧）\n\n**p39 并排**：\n   独立同分布  sqrt(8·T·log|ℋ|)        常数 sqrt(8) ≈ 2.83\n   对抗        sqrt(T·log(|ℋ|)/2)      常数 sqrt(0.5) ≈ 0.71\n   ⇒ **不作任何分布假设的那条，常数反而小 4 倍**\n\n原因（不是笔误）：p37 那条路**绕远**了\n   它先证一个**比需要的更强**的结论，再转成遗憾\n   泛化界保证的是「**对所有 h 同时**，经验风险接近真实风险」= **一致收敛**\n   比「我的累计损失不比最好的 h 差太多」**强得多**\n   ⇒ 多证的那部分就是浪费掉的常数\n\n   而指数权重**直接**对目标下手：只关心累计损失的差，\n   不关心任何单个 h 的风险估计准不准 ⇒ 不需要一致收敛，也就不付那个代价\n\n⇒ 通用教益：**绕道一个更强的中间结论，往往要付常数甚至阶的代价**\n\n⚠ 别过度解读成「对抗设定更好」：\n   两条界**同阶**，差的只是常数\n   而 i.i.d. 下其实还能更好（利用问题相关的差距得 log T 型界），只是 p37 没去拿\n   ⇒ 准确说法：**这里对比的是两种证法，不是两种设定的本质难度**\n\np40 用与 p34 同样的一句话收尾，下面是空的\n   ⇒ 两次同一句话收尾 = 老师要你记住的那一条", "tbl": {"head": ["", "p37 独立同分布", "p38 对抗"], "rows": [["路线", "<b>先证泛化界，再转遗憾</b>", "<b>直接对在线目标设计算法</b>"], ["算法", "<b>跟随领先者（ERM）</b>", "<b>指数权重</b>"], ["遗憾界", "<b>√(8T log|ℋ|)</b>", "<b>√(T log|ℋ|/2)</b>"], ["常数", "<span class='w'>√8 ≈ 2.83</span>", "<b>√0.5 ≈ 0.71（小 4 倍）</b>"], ["中间多证了什么", "<b>⚠ 一致收敛（对所有 h 同时）</b>", "<span class='w'>没有</span>"], ["分布假设", "<b>需要 i.i.d.</b>", "<b>不需要</b>"]]}, "res": {"tag": "推断", "v": "<b>p39 这个对比对你的课题有一条很具体的方法论含义：<b>别绕道一致收敛</b>。</b><br><span class='k'>绕道的那条路是这样的：先对<b>每一个</b>配置都建一个置信区间、保证「所有配置的 <code>Ĝ</code> 同时接近真 <code>G</code>」，再由此推出「我选的那个接近最优」</span>。<b>⇒ 这是最自然、也最容易写的做法，而且它正是你现在多半在用的</b>（<span class='w'>并集界 + 每个配置一个区间</span>）。<br><b>但它证的东西<b>比你需要的强</b>：你并不需要「所有配置的估计都准」，你只需要「<b>我选的那个不比最优的差太多</b>」。</b> <span class='k'>⇒ 多证的部分就是白付的常数，而 p39 显示这个常数可以是 4 倍</span>。<br><b>⇒ 在你的预算里，4 倍常数是实打实的钱。</b> <span class='w'>需要 <code>T</code> 次调用还是 <code>4T</code> 次，直接决定实验做不做得起。</span><br><b>那么怎么不绕道？两个方向，都在你能力范围内：</b><br><b>① <b>只对「还有可能是最优」的配置建区间</b></b>——<span class='k'>这正是逐次淘汰在做的事：被砍掉的配置不再需要准确估计，于是并集界里的 <code>|𝒳|</code> 随轮次缩小</span>。<b>⇒ 你可以把界写成按轮分段的形式（第 <code>ℓ</code> 轮用 <code>log|V_ℓ|</code> 而不是 <code>log|𝒳|</code>），这会实打实地收紧。</b><br><b>② <b>直接对「差值」建区间，而不是对每个 <code>G</code> 建区间再相减</b></b>——<span class='w'>你真正关心的是 <code>G(x_i) − G(x_j)</code>，而配对测量（同一批 query 上比较）的方差远小于两个独立估计之差</span>。<b>⇒ 这是 L09 那个 <code>ρ_*</code> 按<b>差向量</b>定义的原因，而它在实现上只是「别先平均再相减」这一个决定。</b><br><b>⚠ 最后记一下 p38 那个等号对你的意义：<b>「随机抽一个」与「取加权平均」在期望上等价</b>。</b> <span class='k'>⇒ 如果你最终要<b>部署</b>一个配置，你可以报「按权重随机选」的期望表现，而这个数等于加权平均——两种说法可以互换，挑对审稿人更好解释的那个说。</b></span>", "ref": "本讲 p37–p39（逐字核对）· L07 p6 · L09 p11 · L12 主线卡 · 简报 §4c §4d（已核）"}},
{"r": [41, 42], "t": "专家预测：把「跟谁学」变成一个在线决策问题", "star": 2, "quote": "Exponential weights. Expert prediction: Suppose b_t ∈ [0,1]^d is a vector of d experts' predictions of tomorrow's temperature.", "one": "<b>d 个专家每天各报一个数，你得报一个。</b>事后看，你想和「<span class='k'>那个事后最准的专家</span>」比起来别差太多——这就是 regret。", "pts": ["<b>这个设定看着小，但它是整条在线学习线的起点。</b>把「专家」换成「策略」就是博弈论里的 no-regret dynamics；换成「臂」并把反馈砍成一个数，就是 EXP3（本课 L14）。", "<b>关键在于不假设任何概率模型</b>：专家的预测可以是任意的，甚至可以是故意跟你作对的。<span class='w'>前面几讲（L05–L12）都假设奖励来自固定分布，这里不假设。</span>", "<b>要比的对象是「事后最优的单个专家」</b>，不是「事后最优的策略序列」。<span class='k'>后者是做不到的</span>——对手可以让你每一步都猜错。所以 regret 的参照系必须限制住。", "p42 到 p44 是同一张幻灯在逐步显现（Beamer 叠加）：先摆出专家矩阵，再标出真实温度，最后写出目标。<b>本精读按内容合并，不逐页重复。</b>", "<b>温度这个例子里损失是连续的</b>（预测值与真值之差），所以后面会要求 <code>z_t(i) ∈ [0,1]</code> ——<span class='w'>有界，于是 Hoeffding 引理又能用上</span>。", "<b>为什么用随机化（按 p_t 抽一个专家）而不是直接报加权平均</b>：对连续的预测确实可以取平均，但框架要能覆盖「只能选一个」的情形（下注、路由、选一条臂）。<span class='k'>随机化让「分数解」变得可执行</span>，而 regret 只在期望意义上成立。", "<b>注意 regret 里出现的是 ⟨p_t, z_t⟩ 而不是 z_t(I_t)</b>：前者是期望损失。<span class='w'>两者的差是鞅，用集中不等式可以转成高概率结论</span>——本讲只做期望版本。"], "tbl": {"cap": "同一个框架，换三个名词就是三个问题", "head": ["「专家」是", "反馈是", "得到的是", "在哪一讲"], "rows": [["d 个预测者", "<b>全部</b>专家的损失", "指数权重 / Hedge", "<b>本讲 p45–48</b>"], ["K 条臂", "<b>只有选中那条</b>的损失", "EXP3", "本课 L14"], ["一个玩家的策略", "对手策略下的收益", "no-regret dynamics", "条目 7（6.S890）"], ["凸集里的点", "损失函数的梯度", "在线梯度下降", "<b>本讲 p52–53</b>"]]}, "say": "<b>为什么这一讲对你的清单很要紧</b>：学习清单里条目 7（MIT 6.S890）的理由写着「<span class='k'>它直接复用梯队 1 学到的 online learning 和 regret 工具</span>」。<b>那套工具就是这一节</b>——指数权重与 OGD。<br><br>而条目 7 的验收标准是「在 Kuhn poker 上实现 vanilla CFR」。<span class='w'>CFR 的每个决策点放的正是一个 regret minimizer</span>，最常见的实现就是 regret matching 或指数权重。所以这一节不是支线，是博弈论那三条的共同地基。<br><br><b>一个记号提醒</b>：这里用的是<span class='k'>损失</span> z_t（越小越好）而不是奖励，所以权重更新是 <code>exp(−η z)</code> 带负号。前面几讲（L05–L10）用的是奖励，符号相反。<span class='w'>看文献时这两套记号都会遇到，换算时别把符号弄丢。</span>"},
{"r": [43, 48], "t": "指数权重：势函数两头夹，六行出一个 √(T log d)", "star": 3, "quote": "Goal: Minimize regret wrt best: max_{i∈[d]} Σ_{t=1}^T ⟨p_t, z_t⟩ − ⟨e_i, z_t⟩. Exponential weights algorithm, proof: Let W_t = Σ_{i=1}^d w_t(i) so that …", "one": "<b>算法一行，证明一招。</b>算法：按 <code>exp(−η·累计损失)</code> 给专家加权；证明：盯住总权重 <code>W_t</code> 的对数，<span class='k'>从上下两头各夹一次</span>。", "eq": "算法：\n  w_1(i) = 1，  w_{t+1}(i) = w_t(i)·exp( −η·z_t(i) )\n  W_t = Σ_i w_t(i)，   p_t(i) = w_t(i)/W_t      ← 按权重随机选一个专家 I_t\n\n目标： max_{i∈[d]} Σ_t ⟨p_t, z_t⟩ − ⟨e_i, z_t⟩\n\n【上界】逐项展开 log(W_{T+1}/W_1)：\n  = Σ_t log(W_{t+1}/W_t)\n  = Σ_t log( Σ_i p_t(i)·exp(−η z_t(i)) )                      ← 代入更新式并约掉 W_t\n  = Σ_t log( exp(−ηE[z_t(I_t)])·Σ_i p_t(i)exp(−η(z_t(i)−E[z_t(I_t)])) )   ← 提出均值\n  = Σ_t −η·E[z_t(I_t)] + log( E[ exp(−η(z_t(I_t) − E[z_t(I_t)])) ] )\n  ≤ Σ_t −η·E[z_t(I_t)] + η²/8                                 ← **Hoeffding 引理**\n\n【下界】只留一项（任意固定的专家 i）：\n  log(W_{T+1}/W_1) ≥ log( w_{T+1}(i)/W_1 ) = −log d − Σ_t η·z_t(i)\n\n【合并】\n  Σ_t η·E[z_t(I_t)] − Σ_t η·z_t(i)  ≤  log(d) + η²T/8\n  两边除以 η：  Regret ≤ log(d)/η + ηT/8\n  取 η = √(8log d / T)：  Regret ≤ √( T·log(d)/2 )", "pts": ["<b>「势函数两头夹」是这一族证明的通用招式</b>，值得单独记住：<span class='k'>找一个随时间演化的量（这里是 log W_t），一头用算法的更新规则算出它的变化，另一头用「它至少不小于某个固定选项的贡献」</span>。两头一夹，regret 就出来了。", "<b>下界那一步是整个证明最省力也最关键的地方</b>：<code>W_{T+1} = Σ_i w_{T+1}(i) ≥ w_{T+1}(i)</code> 对<span class='w'>任意</span> i 成立。于是「和事后最好的专家比」这件事不需要知道谁最好——<b>对所有 i 都成立，自然对最好的那个也成立</b>。", "<b>η²/8 里的 8 又是 Hoeffding 引理</b>：被取期望的那个量 <code>z_t(I_t) − E[z_t(I_t)]</code> 均值为零、落在长度 ≤ 1 的区间里，所以 <code>log E[exp(−ηX)] ≤ η²·1²/8</code>。<span class='k'>和 L05 p9 是同一条引理</span>。", "<b>两项的取舍很清楚</b>：<code>log(d)/η</code> 是「要从 d 个专家里学出来的代价」（η 越大学得越快），<code>ηT/8</code> 是「步子太大带来的不稳」。<span class='w'>求导置零得 η* = √(8log d/T)。</span>", "<b>结果 √(T log d) 的形状要记住</b>：<span class='k'>专家数 d 只进对数</span>——哪怕有一百万个专家，代价也只多 √(log 10⁶) ≈ 3.7 倍。这正是「指数权重」这个名字的价值所在。", "<b>第三行「提出均值」那一步容易看漏</b>：把 <code>exp(−ηz_t(i))</code> 写成 <code>exp(−ηE[z_t(I_t)])·exp(−η(z_t(i)−E[z_t(I_t)]))</code>，前一个因子与 i 无关可以提到求和号外。<span class='k'>这一步的目的就是把「中心化」的那部分孤立出来，好对它用 Hoeffding 引理。</span>", "<b>Σ_i p_t(i)·exp(−η(z_t(i)−E)) 恰好就是一个期望</b>：按 p_t 抽 I_t，所以它等于 <code>E[exp(−η(z_t(I_t)−E[z_t(I_t)]))]</code>。<span class='w'>这是「把求和认成期望」的典型一步</span>，认不出来整条链就断了。", "<b>这个算法有很多名字</b>：指数权重、Hedge、乘性权重更新（MWU）、Multiplicative Weights。<span class='k'>在博弈论文献里通常叫 MWU，在在线学习里叫 Hedge</span> —— 条目 7 的 6.S890 讲义用的是前者。", "<b>它与 Thompson 采样、softmax 探索形式上像，机制完全不同</b>：这里没有任何概率模型，权重是<span class='w'>按累计损失的指数</span>定的，保证来自势函数论证而不是后验推断。"], "tbl": {"cap": "两头夹的两端，各自用掉什么", "head": ["", "用的是", "给出什么"], "rows": [["<b>上界</b>", "算法的更新式 + Hoeffding 引理", "≤ −η·Σ E[z_t(I_t)] + η²T/8"], ["<b>下界</b>", "W = Σ_i w(i) ≥ w(i)，对<b>任意</b> i", "≥ −log d − η·Σ z_t(i)"], ["合并", "两者相减", "<b>Regret ≤ log(d)/η + ηT/8</b>"], ["调 η", "一元二次取顶点", "<b>√(T·log(d)/2)</b>"]]}, "say": "<b>这个 η 又是一个「只存在于分析里」的参数吗？不是。</b>与 L06 的 ν、L09 的 λ 不同，<span class='w'>η 是算法真的要设的超参数</span>，而最优取法 <code>√(8log d/T)</code> <b>依赖 T</b>——所以它要求你事先知道要跑多久。<br><br><span class='k'>不知道 T 怎么办</span>：标准做法是 doubling trick（把时间切成 2 的幂次段，每段重启并用该段长度定 η），或者用随时间衰减的 <code>η_t ∝ √(log d/t)</code>。本讲没讲，但这是实现时必然碰到的第一个问题。<br><br><b>再记一个可自检的边界情形</b>：η → 0 时算法退化成「永远均匀随机」，regret 界里 <code>log(d)/η → ∞</code>；η → ∞ 时退化成「只押当前累计损失最小的那个」（follow-the-leader），<code>ηT/8 → ∞</code>。<span class='k'>两端都坏，中间最优</span> —— 而 follow-the-leader 在对抗设定下确实会被打穿（可以构造一个序列让它每步都错），<b>这正是为什么需要随机化与适度的 η</b>。", "link": {"t": "你学过的对应：本课 L05 p9（Hoeffding 引理：有界 ⟹ (b−a)²/4-sub-Gaussian）", "href": "L05-精读.html"}, "res": {"tag": "推断", "v": "<b>「势函数两头夹」这个招式，很可能是你写 bound 时最省力的模板。</b>它不要求分布假设、不要求独立、不要求有界之外的任何条件 —— <span class='k'>只要你的算法有一个可以写成「乘性更新」或「逐步累积」的内部量</span>，就能套。<br><br>对照你的问题：若搜索过程维护的是「每个配置的累计分数」并按它采样（AFlow 的 Boltzmann 采样<b>正是</b>这个形状，简报 §2 已核实），那么<span class='w'>它在形式上就是一个指数权重算法</span>。这意味着你可以直接给它套一个 no-regret 保证 —— <b>而 AFlow 原文的 Appendix G 没有任何定理</b>（简报 §2 已核）。这是一个成本极低、可信度很高的贡献点。", "ref": "本讲 p45–48；你的科研简报 §2「AFlow 的选择规则是 Boltzmann + uniform 的爬山搜索」"}},
{"r": [49, 51], "t": "为什么要换成凸的：前面那两个算法都算不动", "star": 3, "quote": "Previous section for the adversarial case suggested using multiplicative weights over the |H| hypotheses, which is completely intractable in practice. And in the stochastic case we used h_t ∈ argmin_{h∈H} Σ_{s=1}^{t−1} 1{h(x_s) ≠ y_s} which is also intractable to compute! So it seems we have no practical algorithm! Solution: relax the objective.", "one": "<b>一页纸的坏消息：前面讲的两个算法都没法真用。</b>指数权重要对 |𝓗| 个假设各维护一个权重；而 ERM 要最小化 0/1 损失，<span class='w'>那是 NP 难的</span>。", "pts": ["<b>第一个问题是规模</b>：指数权重的保证是 <code>√(T log|𝓗|)</code>，log 很友好——<span class='k'>但算法本身要显式维护 |𝓗| 个权重</span>。假设类稍大一点（比如所有线性分类器），|𝓗| 是无穷。", "<b>第二个问题是优化</b>：随机情形下用的 ERM <code>argmin_h Σ 1{h(x_s) ≠ y_s}</code>，目标函数是<span class='w'>分段常数的、非凸的</span>，最小化它是 NP 难问题。", "<b>解法不是找更好的算法，是换一个目标。</b>讲义原话：<b>“Solution: relax the objective.”</b> —— 把 0/1 损失换成一个<span class='k'>凸的替代损失</span>（hinge、logistic、平方），把假设类换成一个凸集。", "<b>这个「放松」是有代价的</b>，而讲义这里没展开：凸替代损失小，不等于 0/1 损失小。<span class='w'>两者之间的关系（calibration / surrogate regret bound）是另一个话题。</span>", "<b>但换来的东西很实在</b>：目标凸了之后，<span class='k'>梯度下降就能用</span>，而且下一页会证明它在<b>对抗</b>设定下也有 regret 保证——不只是随机设定。", "<b>「凸替代」具体换了两样东西</b>：① 损失从 0/1 换成凸的（hinge、logistic、平方）；② 假设类从离散集合换成<span class='k'>凸集</span>（比如权重向量的欧氏球）。两样都换了，梯度下降才用得上。", "<b>代价要说清楚</b>：凸替代损失小 ⇏ 0/1 损失小。<span class='w'>两者的关系叫 surrogate calibration</span>，本讲没展开。你只能说「我在替代目标上没有 regret」，不能直接说「我分类错得少」。", "<b>但在很多实际场景里这个代价不重要</b>，因为你本来关心的就是那个凸损失（回归的平方误差、概率预测的对数损失）。<span class='k'>只有分类任务才有「替代」这回事。</span>"], "tbl": {"cap": "两个算法各自卡在哪", "head": ["算法", "保证", "卡在哪"], "rows": [["指数权重（p45–48）", "√(T log|𝓗|)", "<b>要维护 |𝓗| 个权重</b>，|𝓗| 可能无穷"], ["ERM（随机情形）", "泛化界", "<b>最小化 0/1 损失是 NP 难</b>"], ["<b>OGD（放松之后）</b>", "<b>R·B·√T</b>", "<b>只要一次梯度，可算</b>"]]}, "say": "<b>这一页在整讲里的位置很特别</b>：前面四十多页建立起来的理论，在这里被一句「<span class='w'>So it seems we have no practical algorithm!</span>」否掉了实用性。<br><br>这种「<b>先把理论推到底，再诚实地说它算不动</b>」的讲法值得学。<span class='k'>它比直接讲 OGD 有说服力得多</span>——因为你知道了 OGD 是为了绕开什么而存在的，而不是「又一个优化算法」。<br><br>顺带一提，这正是你在 CS234 L10 见过的同一种修辞：那里是「理论常数 C 大到没法用（γ=0.99 时是 39600ε），于是惩罚变成硬约束」。<b>先给理论，再给它的价格标签，再给工程解法。</b>", "link": {"t": "你学过的对应：CS234 L10（理论常数大到没法用，于是改成信赖域）", "href": "../../reinforcement learning/theater/影片/L10-策略梯度III与TRPO.html"}},
{"r": [52, 53], "t": "在线梯度下降：一步更新，一个定理，两项取舍", "star": 3, "quote": "Online gradient descent. Input: 𝓗 ⊂ ℝ^d, convex loss function ℓ, step size η > 0. Initialize: Choose any h_1 ∈ 𝓗. for t = 1,2,…: Player plays h_t ∈ 𝓗; Adversary simultaneously reveals (x_t,y_t); Player pays loss ℓ_t(h_t) := ℓ(h_t,(x_t,y_t)); Player updates w_{t+1} = Π_𝓗(w_t − η∇_h ℓ_t(h_t)). Theorem: Σ_t ℓ(h_t,(x_t,y_t)) − ℓ(h_*,(x_t,y_t)) ≤ ‖h_*‖²/(2η) + (η/2)Σ_t ‖∇_h ℓ_t(h_t)‖². If max_{h∈𝓗}‖h_*‖₂ ≤ R and ℓ(·) is G-Lipschitz then regret ≤ R·B·√T.", "one": "<b>就是梯度下降，只是每一步的损失函数都不同、而且由对手现给。</b>而它居然还有 regret 保证。", "eq": "算法：\n  h_1 ∈ 𝓗 任取\n  for t = 1,2,…\n    玩家出 h_t ∈ 𝓗\n    对手**同时**给出 (x_t, y_t)\n    玩家付出 ℓ_t(h_t) := ℓ(h_t, (x_t,y_t))\n    更新  w_{t+1} = Π_𝓗( w_t − η·∇_h ℓ_t(h_t) )      ← Π 是到凸集 𝓗 的投影\n\n定理（对任意 h_* ∈ 𝓗）：\n  Σ_{t=1}^T ℓ(h_t,(x_t,y_t)) − ℓ(h_*,(x_t,y_t))\n      ≤  ‖h_*‖²₂ / (2η)  +  (η/2)·Σ_{t=1}^T ‖∇_h ℓ_t(h_t)‖²₂\n\n推论：若 max‖h_*‖₂ ≤ R 且 ℓ 是 G-Lipschitz，则 regret ≤ R·B·√T", "pts": ["<b>「Adversary simultaneously reveals」里的 simultaneously 是要害</b>：对手<span class='w'>不能看着你这一步出什么再决定</span>，但可以看着你之前所有的出牌。这个时序假设去掉的话，任何算法都做不出次线性 regret。", "<b>定理的形状与指数权重完全同构</b>：<code>（起点到比较对象的距离）/η + η·（梯度大小）</code>。<span class='k'>第一项随 η 增大而减小，第二项随 η 增大而增大</span>，又是一次取舍。", "<b>第一项 <code>‖h_*‖²/(2η)</code> 的含义</b>：你要「走到」h_* 那么远，步子越大走得越快。<span class='w'>对照指数权重的 log(d)/η —— 那里的「距离」是从均匀分布到单点分布的 KL 散度，恰好是 log d。</span>", "<b>投影 Π_𝓗 不能省</b>：梯度一步可能把你推出凸集，必须投回来。<span class='k'>而投影这一步在证明里是「免费」的</span>——因为投影到凸集不会增加到集合内任何点的距离。", "<b>幻灯最后那行 <code>regret ≤ R·B·√T</code> 里的 B 应当是 G</b>（Lipschitz 常数）：条件里写的是「ℓ 是 G-Lipschitz」，结论里却冒出一个未定义的 B。<span class='w'>按前后文这是笔误，取 η = R/(G√T) 代入定理正好得到 R·G·√T。</span>", "<b>投影那一步「免费」的理由值得写清楚</b>：凸集上的投影是<span class='k'>非扩张的</span>（non-expansive），即 <code>‖Π(a)−Π(b)‖ ≤ ‖a−b‖</code>。于是证明里「到 h_* 的距离」那一项在投影后只会更小，不等式方向不变。", "<b>定理对任意 h_* 成立，所以对最优的那个也成立</b> —— 与指数权重下界那一步是同一个手法。<span class='w'>「对任意比较对象成立」是在线学习所有 regret 界的共同形式。</span>", "<b>为什么 regret 是 √T 而不是更快</b>：两项取舍下 <code>min_η (R²/2η + ηG²T/2) = R·G·√T</code>。<span class='k'>√T 是对抗设定下的一般最优速率</span>，要更快必须加额外假设（强凸、exp-concave 等）——那是第 3–4 讲的内容。"], "tbl": {"cap": "指数权重与 OGD：同一个骨架", "head": ["", "指数权重", "OGD"], "rows": [["决策空间", "d 个专家上的分布", "凸集 𝓗 ⊂ ℝᵈ"], ["更新", "w ← w·exp(−η z)", "w ← Π_𝓗(w − η∇ℓ)"], ["第一项（距离）", "log d / η", "<b>‖h_*‖²/(2η)</b>"], ["第二项（步长代价）", "ηT/8", "<b>(η/2)Σ‖∇ℓ‖²</b>"], ["最优 η", "√(8log d/T)", "R/(G√T)"], ["regret", "√(T log d/2)", "<b>R·G·√T</b>"]]}, "say": "<b>这两个算法的「同构」不是巧合。</b>它们都是 <span class='k'>online mirror descent</span> 的特例：换一个「距离度量」（Bregman 散度）就换出一个算法 —— 用欧氏距离得到 OGD，用 KL 散度得到指数权重。<span class='w'>本讲没有讲这个统一视角</span>（那是第 3–4 讲的内容），但知道它存在，这两页就不会被当成两个互不相干的技巧。<br><br><b>对条目 7 的直接意义</b>：6.S890 的前几讲（Learning in Games: Foundations / Algorithms）讲的正是这套 regret minimizer 的通用框架，而 CFR 就是把它装在博弈树的每个决策点上。<span class='k'>这两页看懂了，那门课的前半你基本不用再学一遍。</span><br><br><b>和你学过的梯度下降的差别</b>：离线的梯度下降每一步用的是<span class='k'>同一个</span>目标函数，收敛性讲的是「离最优点多远」；这里每一步的损失函数<span class='w'>都不同、而且是对手现给的</span>，根本没有「最优点」可言，所以只能讲 regret。<b>换句话说：离线优化问「收敛到哪」，在线学习问「和事后最好的固定选择比差多少」。</b>"}

var TH = {"title": "L01 接上课题的哪一段：博弈论那三条的共同地基", "arc": "这一讲是全课最长的一份（54 页），但对你的清单来说，<b>最该读的是 p41–53 那一段</b>：指数权重与在线梯度下降。<br><br>理由直接写在学习清单里：条目 7（MIT 6.S890）被列为「博弈论部分对你最重要的一门」，<span class='k'>第一条理由就是「它直接复用梯队 1 学到的 online learning 和 regret 工具」</span>。<b>那套工具就是这一节。</b>而条目 7 的验收标准是「在 Kuhn poker 上实现 vanilla CFR」—— CFR 的做法正是「在博弈树的每个决策点放一个 regret minimizer，再把它们组合成整棵树的 regret minimizer」，<span class='w'>那个 regret minimizer 通常就是指数权重（博弈论文献里叫 MWU）或 regret matching</span>。<br><br><b>所以这一节学扎实，条目 6/7/8 的前半可以直接跳过。</b>反过来，跳过它去读 6.S890，会在第 4–8 讲（Learning in Games: Foundations / Algorithms）卡住。<br><br>与前面各讲的关系：L05–L12 都假设奖励来自<b>固定分布</b>（随机设定）；这一讲不假设任何概率模型，对手可以<b>故意跟你作对</b>（对抗设定）。<span class='k'>同一个 bandit 问题，两套理论、两族算法</span>。本课 L14 的 EXP3 正是把这一节的指数权重装上 bandit 反馈（只看得到选中那条臂的损失）得来的。<br><br>⚠ <b>材料形态提醒</b>：这一讲是排版幻灯 + Beamer 叠加，54 页只有 36 张不同的幻灯。读的时候会发现连着好几页是同一张在逐步显现 —— 本精读按内容合并，<span class='w'>停在叠加区间任何一页看到的都是同一条讲解，这是对的，不是漏写</span>。", "pitfalls": [{"v": "<b>把对抗设定的结论套到随机设定上，或反过来。</b> 这一讲的 √(T log d) 不假设任何分布；而 L06 的 Σ Δ_i⁻¹ log T 依赖差距、只在随机设定下成立。<span class='w'>两者的最优算法不同、下界也不同</span>。写论文时说「我的问题是对抗的还是随机的」是必须交代的一句。", "tag": "已核", "ref": "本讲 p24「Settings of interest: IID / Adversarial」；对照 L06"}, {"v": "<b>以为 follow-the-leader（永远押当前最好的）就够了。</b> 讲义 p34 专门有一页说明：对手可以构造序列让 ERM/FTL <span class='k'>每一步都错</span>。<b>随机化与适度的 η 不是优化技巧，是对抗设定下的必需品。</b>", "tag": "已核", "ref": "本讲 p34「When chosen adversarially empirical risk minimization can…」"}, {"v": "<b>把指数权重的 η 当成「只存在于分析里」的参数。</b> 与 L06 的 ν、L09 的 λ 不同，<span class='w'>η 是算法真要设的超参数</span>，而最优取法 √(8log d/T) <b>依赖 T</b>。不知道 T 就要用 doubling trick 或衰减步长 —— 本讲没讲，但这是实现时碰到的第一个问题。", "tag": "推断", "ref": "本讲 p45–48"}, {"v": "<b>忘了凸替代的代价。</b> p49–51 把 0/1 损失换成凸损失是为了可算，但<span class='k'>凸替代损失小 ⇏ 0/1 损失小</span>。你只能说「我在替代目标上没有 regret」。若你的论文里把某个代理指标优化好了就宣称真实目标也好了，这是同一类问题。", "tag": "已核", "ref": "本讲 p49–51"}], "ammo": [{"q": "你凭什么给 AFlow 那种搜索加一个理论保证？", "a": "因为它在形式上<b>就是一个指数权重算法</b>。简报 §2 已核实：AFlow 的选择规则是对已评估 workflow 的分数做 <code>softmax(α(s_i − s_max))</code> 再与均匀分布混合 —— <span class='k'>这正是带探索项的乘性权重更新</span>。<br><br>而这一讲 p45–48 的势函数论证<span class='w'>不需要任何分布假设</span>，只要损失有界。所以可以直接给它套一个 no-regret 保证 —— <b>而 AFlow 原文 Appendix G 只有三条 bullet、没有任何定理</b>（简报 §2 已核）。这是成本极低、可信度很高的一个贡献点。", "tag": "推断", "ref": "本讲 p45–48；科研简报 §2"}, {"q": "你的搜索目标是对抗的还是随机的？", "a": "用 p24 那一页的二分法正面答：<b>你的评估噪声来自 LLM 采样，是随机的</b>（同一配置重复跑，分数围绕一个均值波动），所以随机设定成立，L06/L09 那一套适用。<br><br><span class='w'>但要留一个口子</span>：若 benchmark 本身在换、或模型在更新，那分布会漂移，此时对抗设定的保证更稳妥（代价是界更松）。<span class='k'>说清楚你站在哪一侧、以及为什么，比默认不提要好。</span>", "tag": "推断", "ref": "本讲 p24；L06 的随机设定"}, {"q": "为什么你的 bound 里专家/配置的数量只进 log？", "a": "可以引这一讲作为最干净的先例：指数权重的 <code>√(T log d/2)</code> 里 <span class='k'>d 只进对数</span> —— 乘性更新的本质就是让候选数以对数代价进入。<br><br>这与 L09 那条「<b>n 只进 log，d 在根号里</b>」是两个不同的机制（那边靠线性结构，这边靠乘性更新），<span class='w'>但对你的论文都适用，看你的算法长什么样</span>。两条都可以引，别混。", "tag": "已核", "ref": "本讲 p45–48；L09 p3"}], "papers": [{"t": "Cesa-Bianchi & Lugosi, Prediction, Learning, and Games", "id": "教材", "why": "<b>专家预测与在线学习的标准参考</b>，这一讲 p41–48 基本是它第 2–4 章的浓缩。<span class='k'>书名里的 Games 不是装饰</span> —— 后半直接讲到博弈中的学习，正是条目 7 的前置。"}, {"t": "Hazan, Introduction to Online Convex Optimization", "id": "免费电子书", "why": "p49–53 那一段的系统版本。<b>online mirror descent 的统一视角</b>（指数权重与 OGD 都是它的特例）在那里讲得最清楚 —— 本讲没展开的正是这一点。"}, {"t": "Arora, Hazan & Kale, The Multiplicative Weights Update Method: a Meta-Algorithm and Applications", "id": "Theory of Computing 2012", "why": "把指数权重当作<b>元算法</b>来看：同一套更新在博弈求解、线性规划、Boosting 里各出现一次。<span class='w'>读完会明白为什么 6.S890 把它当地基。</span>"}, {"t": "本课 L14：对抗式 bandit · EXP3", "id": "lecture_14.pdf（已有精读）", "why": "这一节的直接下游：<b>把指数权重装上 bandit 反馈</b>（只看得到选中那条臂的损失）就是 EXP3。<span class='k'>先读这一讲再读 L14，会发现只多了一个重要性加权的损失估计。</span>"}]};

        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
