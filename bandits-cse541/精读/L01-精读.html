<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSE541 第 1–2 讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cse541-l01">

<div id="bar">
  <h1>CSE541 第 1–2 讲 · <span>课程概览 · 在线学习导论 · 指数权重</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 54</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../corpus/slides/lecture_1.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>bandits-cse541</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/L01-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
8: [{"q": "经验风险 R̂_n(h) 是真实风险 R(h) 的无偏估计。那为什么还需要整套泛化理论？", "o": ["因为 ĥ 是按这批数据挑出来的、依赖数据，所以 R̂_n(ĥ) 会系统性偏低 —— 无偏性只对固定的 h 成立", "因为 n 有限，估计总有误差", "因为 0/1 损失不可导", "因为分布 ν 未知"], "a": 0, "why": "<b>这是整个泛化理论存在的理由。</b><span class='k'>你事先不知道 ĥ 会是谁，所以只能把 |ℋ| 个事件全部盖住——而「全都盖住」的代价就是并集界带来的那个 log|ℋ|。</span>"}, {"q": "幻灯片写的是 ĥ ∈ arg min 而不是 ĥ = arg min。这个细节什么时候会变得要紧？", "o": ["当 ℋ 无限时", "当多个 h 同时达到最小经验风险时 argmin 是一个集合；在 i.i.d. 下平局怎么打破无所谓，但在对抗设定下会被对手利用", "当损失不是 0/1 时", "永远不要紧，只是记号习惯"], "a": 1, "why": "<span class='w'>p30 那个「跟随领先者会犯 min{|ℋ|,T} 次错」的反例正是这么构造的——提示里明说了「假设对手知道你的平局打破策略」。</span>"}],
10: [{"q": "可实现情形的界是 log(|ℋ|/δ)/n。候选数从 1000 增加到 100 万，样本量大约要增加多少？", "o": ["100 万倍", "大约 2 倍 —— 因为 |ℋ| 只进 log，log|ℋ| 从约 6.9 变成约 13.8", "1000 倍", "不变"], "a": 1, "why": "<b>这是整个有限类理论最重要的一条直觉。</b><span class='k'>同理 log(1/δ)：置信度从 95% 提到 99.9%，代价只是样本量翻一倍多一点——所以「把 δ 取小」几乎从不是瓶颈。</span>"}, {"q": "这条界保证 ĥ 就是那个完美分类器 h_* 吗？", "o": ["保证，当 n 足够大时", "保证，因为只有 h_* 的经验风险为 0", "保证，这是 PAC 的含义", "不保证 —— 它只保证 ĥ 的真实风险小。可能还有别的 h 也在数据上零错误，你挑中了其中一个「几乎完美」的"], "a": 3, "why": "<b>「找到最优解」和「找到一个足够好的解」是两件事，PAC 只承诺后者。</b><span class='w'>PAC = Probably（以概率 1−δ）Approximately（误差 ≤ ε 而非 0）Correct——两个让步各对应一个参数，而两个参数都只进 log。</span>"}],
11: [{"q": "证明第一步把 P(R(ĥ)≥ε) 写成 P(R(ĥ)≥ε 且 ∩{ĥ(x_i)=y_i})。加上去的那个条件为什么不改变概率？", "o": ["因为 ε 很小", "因为两个事件独立", "因为用了并集界", "因为可实现假设保证 R̂_n(h_*)=0，而 ĥ 是经验风险最小者，所以 ĥ 的经验风险也必为 0 —— 那个条件恒成立"], "a": 3, "why": "<b>这是整个论证的转轴：加一个概率为 1 的条件不改变概率，却把关于 ĥ 的陈述变成了可以对每个 h 单独检验的陈述。</b><span class='k'>没有这一步，后面的并集界无从下手。</span>"}, {"q": "证明里的独立同分布假设具体用在哪一步？", "o": ["全程都要用", "用在 1−x ≤ e^{−x} 那一步", "用在并集界那一步", "用在「固定 h 时，n 个样本全对的概率 ≤ (1−ε)^n」这一步 —— 独立性让 n 次「答对」可以连乘"], "a": 3, "why": "<b>这是整个证明里唯一用到 i.i.d. 的地方，而本讲后半要去掉的正是它。</b><span class='w'>注意独立性用在<b>样本之间</b>，不是候选之间——候选之间的相关性被并集界完全忽略了。</span>"}],
13: [{"q": "从高概率界得到期望界，用的是哪个恒等式？为什么被积函数要取 min{1, |ℋ|e^{−nε}}？", "o": ["用分部积分；取 min 是为了换元", "用切比雪夫；取 min 是为了对称", "用 Jensen；取 min 是为了收敛", "用 E[Z] = ∫P(Z>ε)dε（对非负随机变量）；取 min 是因为概率天然 ≤ 1，而 ε 很小时 |ℋ|e^{−nε} 会大于 1，不取 min 会高估"], "a": 3, "why": "<span class='k'>分界点在 |ℋ|e^{−nε}=1 即 ε₀=log|ℋ|/n：第一段贡献 ε₀，第二段积出 1/n。</span><b>两段相加是 log|ℋ|/n + 1/n，只要 |ℋ| ≥ e 就 ≤ 2log|ℋ|/n——那个常数 2 就是这么来的。</b>"}],
14: [{"q": "ERM 的三项分解里，中间那项 R̂_n(ĥ) − R̂_n(h_*) ≤ 0 的理由是什么？它的地位为什么特殊？", "o": ["因为 h_* 是真实风险最小者；它消去了偏差", "因为可实现假设；它保证了快率", "因为 ĥ 是经验风险的最小者；它是整个论证里唯一用到「ĥ 是怎么选出来的」的地方 —— 算法的全部作用浓缩在这一个不等号里", "靠 Hoeffding；它提供了主要的界"], "a": 2, "why": "<b>其余两项与算法无关。</b><span class='w'>而剩下两项性质不同：h_* 是<b>固定</b>的，一次 Hoeffding 即可；ĥ <b>依赖数据</b>，必须放大成 max_h 再对 |ℋ| 个并集界。</span>"}, {"q": "从可实现到不可知，速率从 1/n 掉到 1/√n。要达到 ε=0.01 的精度，样本量差多少？", "o": ["差约 100 倍 —— 可实现要 n ≈ log(·)/ε，不可知要 n ≈ 2log(·)/ε²", "差 2 倍", "差 10 倍", "一样多"], "a": 0, "why": "<b>这个差别在实践里非常大。</b><span class='k'>而「可实现」要求存在一个候选<b>完美</b>——不是「最好的那个」，是「一个错都不犯的那个」。一旦不成立这条界完全失效，不是常数变差而是结论不对。</span>"}, {"q": "Hoeffding 不等式里，指数的分母是 |b−a|²。p15 手写部分给了什么直觉？", "o": ["把 Hoeffding 看成中心极限定理的非渐近版：R̂_n(h)−R(h) → 𝒩(0, Var(Z₁)/n)，而 Var(Z_i)=R(h)(1−R(h)) ≤ 1/4，标准差约 1/(2√n)", "它来自方差的定义", "它保证了无偏性", "它来自切比雪夫不等式"], "a": 0, "why": "<b>⚠ 但 Var ≤ 1/4 是最坏情况——这正是 p18 要改进的地方。</b><span class='w'>如果 R(h) 很小（好假设），Var=R(h)(1−R(h)) 也很小，用 Hoeffding 就浪费了。</span>"}],
16: [{"q": "本片四条界（可实现/不可知 × 高概率/期望）里，哪一项是始终不变的？为什么？", "o": ["log|ℋ| —— 因为它来自并集界，而并集界与用哪个集中不等式无关", "δ", "常数 2", "1/n 这个速率"], "a": 0, "why": "<b>两个维度各管一件事：有没有完美假设决定 1/n 还是 1/√n；要高概率还是期望决定 δ 在不在。</b><span class='k'>而「候选集有多大」的代价永远是 log|ℋ|。</span>"}],
18: [{"q": "插值定理 √(2R(h_*)log(2|ℋ|/δ)/n) + log(2|ℋ|/δ)/n 为什么叫「插值」？", "o": ["因为它用了插值多项式", "因为它需要内插样本", "因为它在两个 ℋ 之间插值", "因为同一条式子随 R(h_*) 从 0 连续变到 1，速率从 1/n 连续滑到 1/√n —— R(h_*)=0 时第一项消失退回快率，R(h_*) 大时第一项主导就是慢率"], "a": 3, "why": "<b>两档不是两个世界，而是一条谱的两端。</b><span class='w'>原文的证明只有一句话：Use Bernstein's inequality instead of Hoeffding——说明证明<b>结构</b>一点没变，只换了那个集中不等式。</span>"}, {"q": "Bernstein 比 Hoeffding 强在哪里？在这个问题里强在哪？", "o": ["Bernstein 用真实方差 σ²，Hoeffding 只用区间长度；而这里 Var(Z_i)=R(h)(1−R(h))，好假设犯错少、方差也小，Hoeffding 一律按 ≤1/4 处理就浪费了", "Bernstein 的常数更小", "Bernstein 不要求独立", "Bernstein 不要求有界"], "a": 0, "why": "<span class='k'>⚠ 第二项 log(2|ℋ|/δ)/n 没法去掉（Bernstein 里 ε/3 项的产物），所以 1/n 是这类问题的下限。</span><b>文献里这类界叫 first-order bound / small-loss bound / variance-adaptive——三个名字同一件事。</b>"}],
19: [{"q": "|ℋ| 无限时前面的界全部失效。三条出路的共同想法是什么？", "o": ["找一个「有效的候选数」替换 |ℋ| —— 因为无限多个假设在 n 个固定点上只能产生有限多种标注，标注相同的假设对分析而言就是同一个", "改用贝叶斯方法", "增加样本量直到界有意义", "限制假设类为凸集"], "a": 0, "why": "<span class='w'>VC 维走的就是这条路：Sauer–Shelah 说 VC 维为 d 的类在 n 个点上最多产生 O(n^d) 种标注，于是 log|ℋ| → d·log n。</span><b>⚠ 注意 |ℋ|=∞ 时失效的不是精度而是结论本身——界变成「R(ĥ) ≤ ∞」，什么都没说。</b>"}, {"q": "MDL 那条路对「并集界」提出了什么一般性的启发？", "o": ["并集界在无限类上仍然成立", "δ 不必均匀分配给每个候选：只要 Σ_h δ_h ≤ δ 就合法，于是可以给先验上更看好的候选多分一点、界更紧", "并集界可以去掉", "并集界可以用切尔诺夫界代替"], "a": 1, "why": "<b>⚠ 但先验必须事先定好，不能看了数据再定——这是合法性的唯一前提。</b><span class='k'>而且这个技巧改善的是常数和 log 里的那个数，不会把 √n 变成 n。</span>"}],
21: [{"q": "p22 说前面所有保证「关键地」依赖独立同分布。这个依赖具体落在证明的哪一步？", "o": ["落在 ĥ 的定义上", "落在并集界那一步", "落在「固定 h 时，n 个样本全对的概率 ≤ (1−ε)^n」的连乘上 —— 去掉独立性那一步就塌，不是常数变差而是论证断掉", "落在 1−x ≤ e^{−x} 那一步"], "a": 2, "why": "<span class='k'>p23 那张垃圾邮件过滤器的漫画解释了为什么要关心：发送者被拦了就换写法，会<b>主动适应</b>你的过滤器。</span><b>这种数据根本性地不是独立同分布的，不是「近似不是」。</b>"}, {"q": "在线学习协议里，每一轮的顺序是什么？为什么顺序要紧？", "o": ["先揭晓 y_t 再选 h_t；顺序不重要", "同时给出 x_t 和 y_t", "先看到 x_t，再选假设 h_t，然后才揭晓 y_t —— 你是在知道问题、但不知道答案的情况下作答", "先选 h_t 再看 x_t"], "a": 2, "why": "<span class='w'>⚠ 另外注意 p25–p33 整段都额外假设 y_t = h_*(x_t)（可实现/可分）——正因为有完美假设存在，「犯错数」才是个有意义的指标，否则永远降不到 0。</span>"}],
25: [{"q": "独立同分布下 FTL 的犯错界 2 + 2log(|ℋ|)log(T)，那个 log T 是从哪里来的？", "o": ["从调和和来：第 t 轮的错误率是 2log|ℋ|/(t−1)，求和 Σ1/(t−1) ≤ 1 + log T", "从 |ℋ| 的对数来", "从并集界来", "从 Hoeffding 来"], "a": 0, "why": "<b>L14 p3 里 MAB 那个 d·log T 用的是同一个调和和，可以对照着看。</b><span class='k'>物理含义：错误几乎全部发生在早期——t 大时单轮错误率已可忽略，「学习」在前几十轮就基本完成了。</span>"}, {"q": "p27 推导的第二步 E[1{h_t(x_t)≠y_t}] = E[ℙ(h_t(x_t)≠y_t)] 用了什么？它在对抗下还成立吗？", "o": ["用了线性性；对抗下仍成立", "用了无偏性；对抗下成立", "用了 Jensen；对抗下成立", "用了塔性质，要求 x_t 与 h_t 独立（h_t 只依赖前 t−1 个样本，x_t 是新抽的）；对抗下直接废掉 —— 这正是下一块崩溃的根源"], "a": 3, "why": "<b>这整块有两个前提：① 独立同分布（这一步用到）；② 存在完美假设（p13 推论的前提）。</b><span class='w'>下一块只拿掉第 ①，结果就已经是灾难性的。</span>"}],
28: [{"q": "对抗下 FTL 会犯 min{|ℋ|,T} 次错。构造这个反例的关键是什么？", "o": ["利用平局：开局所有 h 的经验错误都是 0、全部并列，对手知道你的平局打破规则，就专挑你会选的那一个来打 —— 每轮恰好淘汰一个，而你每轮都错", "让 h_* 不在 ℋ 里", "让 T 远大于 |ℋ|", "让数据分布缓慢漂移"], "a": 0, "why": "<b>⚠ 注意 y_t = h_*(x_t) 仍然保留——失败不是因为没有完美假设，纯粹因为数据不是独立同分布的。</b><span class='k'>这个控制变量设计得很干净：同一个策略、同样有完美假设，只换数据怎么来。</span>"}, {"q": "FTL 在对抗下失败的根本原因是什么？修复方向是什么？", "o": ["学习率太大；应该调小", "它把全部赌注押在一个候选上，每错一次只淘汰 1 个（信息效率 O(1)）；修复方向是让每次犯错淘汰一大批 —— 每错一次砍一半就是 log₂|ℋ|", "样本量不够；应该多测几轮", "它用了经验风险；应该用真实风险"], "a": 1, "why": "<b>两条稳健路线：保留一个候选集合（减半/逐次淘汰），或按分布随机化（指数权重）。</b><span class='w'>两条路后面都会走到——而你的逐次淘汰正是第一条。</span>"}],
31: [{"q": "减半算法「要么不犯错，要么至少一半被淘汰」的理由是什么？", "o": ["因为按多数票作答：若你错了，说明多数派错了，而多数派至少占一半，它们在更新 V_{t+1}={h∈V_t: h(x_t)=y_t} 里被全部扔掉", "因为 h_* 永远在 V_t 里", "因为可实现假设", "因为 V_t 每轮都减半"], "a": 0, "why": "<b>于是「犯错」与「进展」被绑死了。</b><span class='k'>这是一个势函数论证：势取 log₂|V_t|，单调不增、有下界 0、每次犯错至少降 1 ⇒ 犯错数 ≤ log₂|ℋ|。L14 p5 的 log W_t 和 L10 p4 的 log|V_t| 是同一套路。</span>"}, {"q": "更新规则 V_{t+1} = {h ∈ V_t : h(x_t) = y_t} 把答错的假设全部扔掉。这一步凭什么合法？", "o": ["凭多数票", "凭 |ℋ| 有限", "凭可实现假设 y_t = h_*(x_t) —— 它保证 h_* 永远不会被扔掉；没有这条，扔掉的可能正是最好的那个", "凭独立同分布"], "a": 2, "why": "<b>⚠ 这也是减半算法的局限：可实现假设一去掉，每个 h 迟早都会错一次，V_t 会被扔空、算法无法继续。</b><span class='w'>修复办法是把「硬淘汰」换成「软降权」——这正是指数权重。</span>"}, {"q": "减半算法的界 log₂|ℋ| 有一个常被忽略的性质，是什么？", "o": ["它依赖 T", "它完全不含 T —— 不管跑多少轮犯错数都 ≤ log₂|ℋ|，甚至比独立同分布那条 2log|ℋ|log T 还好", "它依赖 δ", "它只在 T < |ℋ| 时成立"], "a": 1, "why": "<b>⚠ 但差别的来源是<b>算法</b>不是<b>设定</b>：减半算法在独立同分布下也给 log₂|ℋ|，是 FTL 在对抗下崩了。</b><span class='k'>正确总结是：对抗设定需要更好的算法，而那个算法恰好在两种设定下都更好。</span>"}],
34: [{"q": "去掉「存在完美假设」之后，为什么目标必须从「犯错数」换成「遗憾」？", "o": ["因为最好的那个假设自己也会犯错（比如错误率 30%，则任何算法在 T 轮里至少错 0.3T 次），再追求「犯错数小」就是在追求不可能的目标", "因为 T 可能无穷", "因为对抗设定下犯错数无定义", "因为犯错数不可导"], "a": 0, "why": "<b>遗憾把那 0.3T 次不可避免的错在相减时抵消掉，剩下的才是「因为我不知道哪个最好而多付的代价」。</b><span class='k'>这和前半讲从 R(ĥ) 换成 R(ĥ)−R(h_*)（超额风险）是完全同一件事——两个名字，一个思想。</span>"}],
37: [{"q": "独立同分布那条界是 √(8T log|ℋ|)，对抗那条是 √(T log|ℋ|/2)。不作任何分布假设的反而常数小 4 倍，为什么？", "o": ["因为 p37 那条路绕远了：它先证「对所有 h 同时，经验风险接近真实风险」（一致收敛），这比「我的累计损失不比最好的 h 差太多」强得多，多证的部分就是浪费掉的常数", "因为对抗设定其实更简单", "因为指数权重用了更好的集中不等式", "因为 √8 和 √0.5 的计算有误"], "a": 0, "why": "<b>通用教益：绕道一个更强的中间结论，往往要付常数甚至阶的代价。</b><span class='w'>⚠ 但别过度解读成「对抗设定更好」——两条界同阶，而且独立同分布下其实还能更好，只是 p37 那条朴素路线没去拿。这里对比的是两种<b>证法</b>。</span>"}, {"q": "p38 定理里 max_i E[Σ⟨I_t,z_t⟩−⟨e_i,z_t⟩] = max_i Σ⟨p_t,z_t⟩−⟨e_i,z_t⟩ 这个等号说明了什么？", "o": ["p_t 必须是均匀分布", "指数权重是确定性算法", "z_t 必须有界", "「随机抽一个专家 I_t ∼ p_t」与「按 p_t 取加权平均」在期望意义上没有区别，因为 E[⟨e_{I_t},z_t⟩] = ⟨p_t,z_t⟩"], "a": 3, "why": "<b>这一点在 L14 的 bandit 情形会变得很要紧</b>——<span class='k'>那里你<b>必须</b>真的随机抽一个（因为只能观察到抽中的那个），而全信息下两种说法可以互换。</span>"}],
41: [{"q": "专家预测里，regret 的参照系是「事后最优的单个专家」而不是「事后最优的策略序列」，为什么？", "o": ["单个专家更容易计算", "因为损失有界", "专家数 d 是有限的", "和策略序列比是做不到的 —— 对手可以让你每一步都猜错"], "a": 3, "why": "在对抗设定下不加限制的参照系会让 regret 必然线性增长。所以 regret 的定义里必须把比较对象限制住，这是整个在线学习框架的前提。"}],
43: [{"q": "指数权重证明里，下界那一步 log(W_{T+1}/W_1) ≥ log(w_{T+1}(i)/W_1) 的妙处在哪？", "o": ["它用到了 Hoeffding 引理", "它对任意 i 成立，所以不需要事先知道哪个专家最好", "它消掉了 η", "它给出最紧的界"], "a": 1, "why": "W 是所有权重之和，当然不小于其中任何一项。于是「和事后最好的专家比」这件事自动成立 —— 对所有 i 成立，自然对最好的那个也成立。"}, {"q": "上界里那个 η²/8 是从哪来的？", "o": ["Cauchy-Schwarz", "对 η 求导", "Jensen 不等式", "Hoeffding 引理：均值为零、落在长度 ≤1 的区间里的量，log E[exp(−ηX)] ≤ η²/8"], "a": 3, "why": "和 L05 p9 是同一条引理。(b−a)²/8 在 b−a = 1 时就是 1/8 —— 所以损失必须有界在 [0,1]，这个假设在这里被用掉。"}, {"q": "指数权重的 regret 界 √(T log d/2) 里，专家数 d 以什么形式出现？", "o": ["平方根", "线性", "只进对数", "不出现"], "a": 2, "why": "哪怕有一百万个专家，代价也只多 √(log 10⁶) ≈ 3.7 倍。这正是指数权重这个名字的价值 —— 乘性更新让专家数只以对数代价进入。"}],
49: [{"q": "讲义说前面两个算法都「no practical algorithm」，各自卡在哪？", "o": ["都是样本复杂度太高", "都需要知道 T", "都只在随机设定下成立", "指数权重要维护 |𝓗| 个权重（可能无穷），ERM 要最小化 0/1 损失（NP 难）"], "a": 3, "why": "一个卡在规模，一个卡在优化。解法不是找更好的算法，而是「relax the objective」—— 换成凸替代损失与凸假设类。"}],
52: [{"q": "OGD 的设定里「Adversary simultaneously reveals」的 simultaneously 为什么要紧？", "o": ["为了让投影有定义", "为了让算法可并行", "为了保证凸性", "对手不能看着你这一步出什么再决定；去掉这个时序假设，任何算法都做不出次线性 regret"], "a": 3, "why": "对手可以看你之前所有的出牌，但不能看当前这一步。这是在线学习所有正面结果的前提。"}, {"q": "OGD 定理 ‖h_*‖²/(2η) + (η/2)Σ‖∇ℓ‖² 与指数权重的界是什么关系？", "o": ["OGD 是指数权重的特例", "同构：都是「（到比较对象的距离）/η + η·（步长代价）」，只是距离的度量不同", "两者的最优 η 相同", "完全不同的两件事"], "a": 1, "why": "两者都是 online mirror descent 的特例：用欧氏距离得 OGD，用 KL 散度得指数权重（那里的「距离」log d 正是从均匀分布到单点分布的 KL）。"}, {"q": "幻灯最后一行写 regret ≤ R·B·√T，而条件里说 ℓ 是 G-Lipschitz。这里的 B 是什么？", "o": ["噪声上界", "应当是 G —— 这是幻灯的笔误，取 η = R/(G√T) 代入定理正好得 R·G·√T", "批量大小", "边界常数，与 G 无关"], "a": 1, "why": "条件里定义了 R 和 G，结论里却冒出一个未定义的 B。按前后文对照，这是笔误 —— 自己推一遍就能确认。"}]
};

{"r": [1, 3], "t": "这门课的地图：四条线，和一本书", "star": 2, "quote": "<b>CSE 541: Interactive Learning</b> — <em>Kevin Jamieson</em>, University of Washington, Spring 2025<br><em>We will cover selected topics from [SzepesvariLattimore]:</em><br><em>• (Non-)stochastic <b>Online learning</b><br>• (Non-)stochastic <b>Multi-armed Bandits</b><br>• (Non-)stochastic <b>Linear Bandits and experimental design</b><br>• (Non-)stochastic <b>Contextual bandits (model-free and model-based)</b></em><br><em>[SzepesvariLattimore] <b>Bandit Algorithms</b> course notes, Csaba Szepesvari and Tor Lattimore</em><br><em>The course will be analysis heavy, with a focus on methods that work well in practice.</em>", "one": "<b>四条线，每条都有「随机」和「非随机」两个版本——而那个括号里的 (Non-) 就是这门课真正的主轴：同一个问题，假设分布与不假设分布，各能走多远。</b>", "pts": ["⚠️ <b>先说一件会影响你怎么读的事：<b>这一讲和本门课其余 15 份讲义不是一个形态</b>。</b> <span class='k'>其余全是手写扫描件（没有可用文本层，只能看图读）；<b>而 L01 是印刷体幻灯片 + 课上手写批注</b></span>。<b>⇒ 好处是引文可以逐字抄；代价是要分清哪些是幻灯片上印好的、哪些是当堂加的——后者往往才是老师真正想强调的。</b>", "<b>课程大纲那四条线值得逐条对照你已经读过的讲次，因为它就是这门课的骨架。</b> <span class='w'>① <b>在线学习</b>（本讲后半 + L03/L04）；② <b>多臂老虎机</b>（L05–L09、L14）；③ <b>线性老虎机与实验设计</b>（L07、L10、L12、L16）；④ <b>上下文老虎机</b>（L18、L20）</span>。", "<b>而每条线前面那个 <code>(Non-)</code> 前缀才是真正的主轴。</b> <span class='k'>它的意思是：同一个问题问两遍——<b>假设数据独立同分布</b>时能证出什么，<b>什么都不假设</b>（对抗）时又能证出什么</span>。<b>⇒ 你读过的 L14（EXP3）正是「非随机多臂老虎机」那一格，而本讲后半是「非随机在线学习」那一格。</b>", "<b>注意这门课的顺序安排：<b>先讲在线学习，再讲老虎机</b>。</b> <span class='w'>原因在后面会很清楚：在线学习是<b>全信息</b>的（每轮能看到所有候选的损失），老虎机是<b>部分信息</b>的（只能看到你选的那个）</span>。<b>⇒ 老虎机的算法几乎都是「在线学习算法 + 一个把部分信息补成全信息的估计量」，而 L14 的 EXP3 就是最干净的例子（指数权重 + 重要性加权）。</b>", "<b>教材只有一本：Lattimore &amp; Szepesvári 的 <em>Bandit Algorithms</em>。</b> <span class='k'>⚠ 这件事对你写论文有直接用处：讲义是板书，不适合当引文，而这本书把课上讲的几乎每条结论都写成了可引用的标准形式</span>。<b>任务清单的条目 1 已经把这本列进来了。</b>", "<b>幻灯片上那句「<em>analysis heavy, with a focus on methods that work well in practice</em>」不是客套。</b> <span class='w'>这门课的每一讲几乎都是「给一个算法 + 证一条界」，而且界里的每个因子都会被追问来历</span>——<b>这正是你那条「写 bound」的验收标准需要的训练。</b>", "<b>⚠ 最后一条关于本讲自身的结构：<b>L01 实际上是把六讲塞进了一份讲义</b>。</b> <span class='k'>① 课程概览（p1–3）；② 标准范式的动机（p4–7）；③ <b>泛化界</b>（p8–20，本片）；④ 在线学习的犯错界（p21–34）；⑤ 遗憾（p35–40）；⑥ <b>指数权重</b>（p41–48）与在线凸优化（p49–54）</span>。<b>所以这份精读分成三片做，本片是第 ③ 块。</b>"], "eq": "⚠ 形态提醒：L01 是**印刷体幻灯片 + 手写批注**，其余 15 份讲义都是手写扫描件\n   ⇒ 引文可逐字抄；但要分清「幻灯片印的」与「课上手写加的」\n     后者往往才是老师真正想强调的\n\n课程四条线（每条都有 (Non-) 两个版本）：\n   ① **在线学习**                    ← 本讲后半 + L03 / L04\n   ② **多臂老虎机**                  ← L05–L09、L14\n   ③ **线性老虎机与实验设计**         ← L07、L10、L12、L16\n   ④ **上下文老虎机**（model-free / model-based） ← L18、L20\n\n   (Non-) 前缀 = 真正的主轴：\n     同一个问题问两遍 —— **假设独立同分布** vs **什么都不假设（对抗）**\n     L14（EXP3）= 「非随机多臂老虎机」那一格\n     本讲后半 = 「非随机在线学习」那一格\n\n为什么先讲在线学习再讲老虎机：\n   在线学习 = **全信息**（每轮看到所有候选的损失）\n   老虎机   = **部分信息**（只看到你选的那个）\n   ⇒ 老虎机算法 ≈ 在线学习算法 + 把部分信息补成全信息的估计量\n     L14 的 EXP3 = 指数权重 + 重要性加权，最干净的例子\n\n教材：Lattimore & Szepesvári《Bandit Algorithms》\n   ⚠ 讲义是板书不宜当引文；这本把课上结论写成了可引用的标准形式\n\n⚠ L01 自身 = 六讲塞进一份讲义：\n   ① 课程概览 p1–3    ② 动机 p4–7      ③ **泛化界 p8–20（本片）**\n   ④ 犯错界 p21–34    ⑤ 遗憾 p35–40    ⑥ 指数权重 p41–48 + 在线凸优化 p49–54", "tbl": {"head": ["课程的四条线", "随机版（假设 i.i.d.）", "非随机版（对抗）", "你读过的"], "rows": [["在线学习", "ERM / 跟随领先者", "<b>指数权重</b>", "<b>本讲 p21–54</b>"], ["多臂老虎机", "UCB · 逐次淘汰", "<b>EXP3</b>", "L05–L09 · <b>L14</b>"], ["线性老虎机 + 实验设计", "LinUCB · G-最优设计", "—", "L07 · L10 · L12 · L16"], ["上下文老虎机", "model-based", "SquareCB", "L18 · L20"]]}, "link": {"t": "你学过的对应：本课 L14 精读（EXP3 = 本讲的指数权重 + 重要性加权 + 强制探索；读完本片第三块 p41–48 再回去看 L14 会顺很多）", "href": "L14-精读.html"}},
{"r": [4, 7], "t": "标准范式，和那个把全课问出来的问号", "star": 2, "quote": "<b>Standard Machine Learning Paradigm</b><br><em>• <b>Data</b>: past observations<br>• <b>Hypotheses/Models</b>: devised to capture the patterns in data<br>• <b>Prediction</b>: apply model to forecast future observations</em><br>〔图上三次渐进：<em>Unlabeled data</em> → <em>Some labeled data</em> → <em>Decision rule learned based on labeled data and applied to future unlabeled data</em>〕<br>〔p7 整页只有一句话，配着 Netflix / Spotify / Amazon / 信用卡 / 法槌 / 药物 / 自动驾驶 / Facebook 广告的图〕<br><em><b>Do these applications actually fall into the standard machine learning paradigm?</b></em>", "one": "<b>标准范式的隐含前提是「数据先给定、模型后学、预测再应用」——三个阶段互不影响。而 p7 列的那些应用全都不满足它：你的预测会改变你下一步看到的数据。</b>", "pts": ["<b>p4–p6 是同一张幻灯片的三次渐进，讲的是教科书式的监督学习。</b> <span class='k'>先是一堆无标注数据；然后标注其中一部分；最后学出一条决策规则，应用到将来的无标注数据上</span>。<b>⇒ 三个阶段严格分开，而这正是要被质疑的地方。</b>", "<b>p7 整页只有一句话，而它是全课的出发点</b>：<b>「这些应用真的落在标准机器学习范式里吗？」</b><span class='w'>配图是 Netflix 推荐、Spotify 每周发现、Amazon「你可能也喜欢」、信用卡、司法判决、药物、自动驾驶、Facebook 广告。</span>", "<b>答案当然是「不」，而不落在里面的理由只有一条，但它很致命：<b>你的决策会改变你接下来收到的数据</b>。</b> <span class='k'>Netflix 推荐了什么，用户就只可能点什么；你没推荐的那些，你永远不知道用户会不会喜欢</span>。<b>⇒ 数据不再是「天上掉下来的样本」，而是你自己行为的产物。</b>", "<b>这件事有一个标准名字叫<b>反馈回路</b>，而它破坏的恰恰是标准范式最依赖的那条假设：数据独立同分布、且与模型无关。</b> <span class='w'>一旦模型影响采样，后来的数据就依赖于前面的模型，<b>独立性没了</b></span>。<b>⇒ 本讲后半要处理的正是这件事。</b>", "<b>还有第二个问题，p7 的图里也藏着：<b>你只观察到你选的那个选项的结果</b>。</b> <span class='k'>推荐了电影 A，你知道用户点没点 A；但「如果推荐 B 会怎样」永远观察不到</span>。<b>⇒ 这就是<b>部分信息</b>（bandit 反馈），是这门课后半程的全部内容。</b>", "<b>⚠ 但要留意本片的安排：<b>讲这个问号之后，老师并没有马上去解决它，而是先花了 12 页讲标准范式下的泛化界</b>（p8–20）。</b> <span class='w'>这不是跑题</span>——<b>因为后面证在线学习的界时，用的工具（并集界、Hoeffding、ERM 的三项分解）与这里一模一样</b>。<span class='k'>⇒ 先把工具打磨好，再去碰难设定。</span>", "<b>对你的课题，这一页的问号恰好是你那套方法的立论基础，值得记一下措辞。</b> <span class='w'>你做的是：在一个 agentic 工作流里，<b>为每个节点选模型档位</b>——而这个选择会决定你观察到什么（你只知道所选配置的准确率）</span>。<b>⇒ 「这不是标准监督学习，因为我们的决策决定了我们的数据」这句话，是开题时最省力的一句开场白。</b>"], "eq": "p4–p6（同一张幻灯片的三次渐进）= 教科书式监督学习：\n   无标注数据 → 标注一部分 → 学出决策规则 → 应用到将来的无标注数据\n   ⇒ **三个阶段严格分开** —— 这正是要被质疑的地方\n\np7（整页只有一句话，全课的出发点）：\n   **Do these applications actually fall into the standard machine learning paradigm?**\n   配图：Netflix · Spotify · Amazon · 信用卡 · 司法 · 药物 · 自动驾驶 · Facebook 广告\n\n答案是「不」，理由只有一条但很致命：\n   **你的决策会改变你接下来收到的数据**\n   Netflix 推荐了什么，用户就只可能点什么；没推荐的那些，永远不知道\n   ⇒ 数据不再是「天上掉下来的样本」，而是**你自己行为的产物**\n\n   标准名字：**反馈回路**\n   破坏的正是标准范式最依赖的假设：数据 i.i.d. 且与模型无关\n   一旦模型影响采样，后来的数据依赖前面的模型 ⇒ **独立性没了**\n\n第二个问题（图里也藏着）：\n   **你只观察到你选的那个选项的结果**\n   推荐了 A，知道点没点 A；「如果推荐 B 会怎样」永远观察不到\n   ⇒ **部分信息**（bandit 反馈）= 这门课后半程的全部内容\n\n⚠ 注意安排：讲完这个问号，老师**没有**马上解决它，\n   而是先花 12 页讲标准范式下的泛化界（p8–20）\n   不是跑题 —— 后面证在线学习的界，用的工具完全一样\n   （并集界、Hoeffding、ERM 的三项分解）\n   ⇒ 先把工具打磨好，再碰难设定"},
{"r": [8, 9], "t": "可实现情形的设定：两个风险，一个 argmin", "star": 3, "quote": "<b>Realizable case</b><br><em>Fix a finite hypothesis class ℋ = {h₁, h₂, …, } where h(x) ∈ {−1,1}.</em><br><em>You are given a data set (x₁,y₁), …, (x<sub>n</sub>,y<sub>n</sub>) <sup>iid</sup>∼ ν where <b>y<sub>i</sub> = h<sub>*</sub>(x<sub>i</sub>) for some h<sub>*</sub> ∈ ℋ</b></em><br><em>Let ĥ ∈ arg min<sub>h∈ℋ</sub> (1/n) Σ<sub>i=1</sub><sup>n</sup> <b>1</b>{h(x<sub>i</sub>) ≠ y<sub>i</sub>} &nbsp; how “good” is ĥ?</em><br>〔手写批注〕<em>R̂<sub>n</sub>(h) &nbsp;“empirical risk”</em> &nbsp;·&nbsp; <em>(x,y) ∼ ν, &nbsp; ℙ(ĥ(x) ≠ y) = R(ĥ) &nbsp;“true risk”</em>", "one": "<b>两个风险要分清：经验风险是你在手上这 n 个样本上数错了几个，真实风险是在整个分布上会错多少。ERM 最小化前者，而定理要控制的是后者。</b>", "pts": ["<b>设定有三个限制，每一个都在后面被用到，值得逐条点出来。</b> <span class='k'>① <b>ℋ 有限</b>（<code>|ℋ| < ∞</code>）——并集界要对它求和；② <b>二分类</b>（<code>h(x) ∈ {−1,1}</code>）——损失是 0/1，有界；③ <b>独立同分布</b>（<code>(x_i,y_i) ∼ ν</code>）——集中不等式的前提</span>。", "<b>而「可实现」这个词专指第四条：<b>存在 <code>h_* ∈ ℋ</code> 使 <code>y_i = h_*(x_i)</code></b>。</b> <span class='w'>翻译过来是「<b>真相就在你的候选集合里，而且它一点错都不犯</b>」</span>。<b>⇒ 这是一个很强的假设，后面 p14 会把它去掉（那就是「不可知」情形）。</b>", "<b>两个风险的定义必须分清楚，这是整块内容的记号基础。</b> <span class='k'><b>经验风险</b> <code>R̂_n(h) = (1/n)Σ_i 1{h(x_i) ≠ y_i}</code>——在你手上这 n 个样本里数错了几个，<b>你算得出来</b></span>；<b><code>真实风险 R(h) = P(h(X) ≠ Y)</code>，<code>(X,Y) ∼ ν</code>——在整个分布上会错多少，<b>你算不出来</b></b>。", "<b>两者的关系是一句话：<code>R(h) = E[R̂_n(h)]</code>（p10 的手写批注写明了）。</b> <span class='w'>经验风险是真实风险的<b>无偏估计</b>，因为每一项 <code>1{h(x_i)≠y_i}</code> 的期望就是 <code>R(h)</code></span>。<b>⇒ 于是问题变成「一个无偏估计离真值能差多远」，这正是集中不等式回答的。</b>", "⚠️ <b>但这里有一个<b>关键的陷阱</b>，它是整个泛化理论存在的理由：<b><code>R(ĥ) ≠ E[R̂_n(ĥ)]</code></b>。</b> <span class='k'>对<b>固定</b>的 <code>h</code>，<code>R̂_n(h)</code> 是 <code>R(h)</code> 的无偏估计；但 <code>ĥ</code> 是<b>按这批数据挑出来的</b>，它依赖数据</span>。<b>⇒ <code>ĥ</code> 是「在这批数据上看起来最好的那个」，所以 <code>R̂_n(ĥ)</code> 会<b>系统性地偏低</b>。</b>", "<b>这就是为什么证明里必须对<b>所有</b> <code>h ∈ ℋ</code> 同时控制，而不能只对 <code>ĥ</code> 控制。</b> <span class='w'>你事先不知道 <code>ĥ</code> 会是谁，所以只能把 <code>|ℋ|</code> 个事件全都盖住</span>——<b>而「全都盖住」的代价就是并集界带来的那个 <code>log|ℋ|</code>。</b>", "<b>幻灯片上写的是 <code>ĥ ∈ arg min</code> 而不是 <code>=</code>，这个细节在 p30 会变得要紧。</b> <span class='k'>因为可能有<b>多个</b> <code>h</code> 同时达到最小经验风险，<code>argmin</code> 是一个<b>集合</b></span>。<b>⇒ 「平局怎么打破」在独立同分布下无所谓，但在对抗设定下会被对手利用（p30 的那个 <code>min{|ℋ|,T}</code> 反例正是这么构造的）。</b>", "<b>p9 右下角那张手绘图画的是几条候选分类曲线 <code>h_1, h_2, h_3</code> 穿过一堆 +/− 点。</b> <span class='w'>意思很直白：<b>多条曲线都能把训练点分对，你该挑哪条、挑错了会怎样</b></span>——<b>而答案就是下一页那条界。</b>"], "eq": "设定的三个限制（每条后面都被用到）：\n   ① **ℋ 有限**（|ℋ| < ∞）        ← 并集界要对它求和\n   ② **二分类** h(x) ∈ {−1,1}      ← 损失是 0/1，有界\n   ③ **独立同分布** (x_i,y_i) ∼ ν  ← 集中不等式的前提\n\n**可实现**（realizable）专指第四条：\n   存在 h_* ∈ ℋ 使 y_i = h_*(x_i)\n   = 「**真相就在你的候选集合里，而且它一点错都不犯**」\n   ⇒ 很强的假设；p14 会去掉它（那就是「不可知」情形）\n\n两个风险（记号基础，必须分清）：\n   **经验风险** R̂_n(h) = (1/n) Σ_i 1{h(x_i) ≠ y_i}   在手上 n 个样本里错几个 —— **算得出**\n   **真实风险** R(h)   = P(h(X) ≠ Y),  (X,Y) ∼ ν     在整个分布上错多少 —— **算不出**\n\n   关系：**R(h) = E[ R̂_n(h) ]**（p10 手写批注）\n     经验风险是真实风险的**无偏估计**（每项 1{h(x_i)≠y_i} 的期望就是 R(h)）\n     ⇒ 问题变成「无偏估计离真值能差多远」= 集中不等式回答的\n\n⚠⚠ 关键陷阱（整个泛化理论存在的理由）：**R(ĥ) ≠ E[R̂_n(ĥ)]**\n   对**固定**的 h，R̂_n(h) 无偏\n   但 ĥ 是**按这批数据挑出来的**，它依赖数据\n   ⇒ ĥ = 「在这批数据上看起来最好的那个」⇒ R̂_n(ĥ) **系统性偏低**\n\n   ⇒ 所以证明必须对**所有** h ∈ ℋ 同时控制，不能只对 ĥ 控制\n     事先不知道 ĥ 是谁 ⇒ 只能把 |ℋ| 个事件全盖住\n     「全盖住」的代价 = 并集界带来的 **log|ℋ|**\n\n⚠ 幻灯片写的是 ĥ **∈** arg min 而不是 = ：argmin 是一个**集合**\n   可能有多个 h 同时达到最小经验风险\n   平局怎么打破，在 i.i.d. 下无所谓，**但对抗下会被对手利用**\n   （p30 那个 min{|ℋ|,T} 的反例正是这么构造的）", "tbl": {"head": ["", "经验风险 R̂<sub>n</sub>(h)", "真实风险 R(h)"], "rows": [["定义", "(1/n)Σ<b>1</b>{h(x<sub>i</sub>)≠y<sub>i</sub>}", "ℙ(h(X)≠Y)"], ["你算得出来吗", "<b>算得出</b>", "<span class='w'>算不出</span>"], ["对<b>固定</b> h", "<b>是 R(h) 的无偏估计</b>", "—"], ["对<b>选出来的</b> ĥ", "<span class='w'>⚠ 系统性偏低</span>", "<b>定理要控制的就是它</b>"], ["谁最小化它", "<b>ERM（算法）</b>", "<span class='w'>你真正想要的</span>"]]}},
{"r": [10, 10], "t": "可实现情形的定理：log(|ℋ|/δ)/n，以及 PAC 这三个字", "star": 3, "quote": "<b>Theorem</b>: <em>Fix a finite hypothesis class ℋ so that |ℋ| &lt; ∞ and for all h ∈ ℋ we have h(x) ∈ {−1,1}. Let (x₁,y₁),…,(x<sub>n</sub>,y<sub>n</sub>) <sup>iid</sup>∼ ν where y<sub>i</sub> ∈ {−1,1}. For any h ∈ ℋ define R̂<sub>n</sub>(h) = (1/n)Σ<sub>i=1</sub><sup>n</sup><b>1</b>{h(x<sub>i</sub>) ≠ y<sub>i</sub>} and R(h) = ℙ(h(X) ≠ Y) where (X,Y) ∼ ν. <u>Assume there exists an h<sub>*</sub> ∈ ℋ such that R(h<sub>*</sub>) = 0</u>. If ĥ = arg min<sub>h∈ℋ</sub> R̂<sub>n</sub>(h) then with probability at least 1 − δ we have</em><br><em><b>R(ĥ) ≤ log(|ℋ|/δ) / n</b></em><br>〔手写批注〕<em>R(h) = 𝔼[R̂<sub>n</sub>(h)]</em> · <em>ℙ( R(ĥ) &gt; log(|ℋ|/δ)/n ) ≤ δ</em> · <em><b>Probably Approximately Correct (PAC)</b></em>", "one": "<b>两个旋钮：|ℋ| 只进 log，所以候选再多也不太贵；δ 也只进 log，所以把置信度从 95% 提到 99.9% 几乎免费。贵的是 n，而它在分母上是一次方——这是「快率」。</b>", "pts": ["<b>先读那个形状：<code>R(ĥ) ≤ log(|ℋ|/δ)/n</code>，分母是 <code>n</code> 的<b>一次方</b>。</b> <span class='k'>这叫<b>快率</b>（fast rate），对比 p14 不可知情形的 <code>1/√n</code>（慢率）</span>。<b>⇒ 要把误差减半，这里只需 2 倍样本；慢率那边要 4 倍。</b>", "<b>拆开 <code>log(|ℋ|/δ) = log|ℋ| + log(1/δ)</code>，两项各有含义。</b> <span class='w'><code>log|ℋ|</code> 是「候选集有多大」的代价，<code>log(1/δ)</code> 是「你要多有把握」的代价</span>——<b>⇒ 两个都只进 <code>log</code>，所以都很便宜。</b>", "<b><code>log(1/δ)</code> 便宜到什么程度值得感受一下：<code>δ</code> 从 <code>0.05</code> 到 <code>0.001</code>，<code>log(1/δ)</code> 从约 3 变成约 6.9。</b> <span class='k'>置信度从 95% 提到 99.9%，代价只是样本量翻一倍多一点</span>。<b>⇒ 所以在这类界里，「把 δ 取得很小」几乎从来不是瓶颈。</b>", "<b><code>log|ℋ|</code> 同理：候选从 1000 个增加到 100 万个，<code>log|ℋ|</code> 只从约 6.9 变成约 13.8。</b> <span class='w'><b>候选数翻 1000 倍，样本量只需翻一倍</b></span>。<b>⇒ 这是整个有限类理论最重要的一条直觉，而它对你那个「<code>2^H</code> 个配置」的问题有直接含义（见右侧科研格）。</b>", "<b>⚠ 那条被下划线的假设 <code>R(h_*) = 0</code> 是「可实现」的全部内容，而它比看上去强。</b> <span class='k'>它要求存在一个候选<b>完美</b>——不是「最好的那个」，是「一个错都不犯的那个」</span>。<b>⇒ 一旦不成立，这条界<b>完全失效</b>（不是常数变差，是结论不对），必须换成 p14 的版本。</b>", "<b>手写那行 <code>P(R(ĥ) > log(|ℋ|/δ)/n) ≤ δ</code> 是把定理反过来写，而这个形式更接近证明实际做的事。</b> <span class='w'>证明是先固定一个 <code>ε</code>、算出「<code>R(ĥ) ≥ ε</code>」的概率上界 <code>|ℋ|e^{−nε}</code>，再令它等于 <code>δ</code> 反解 <code>ε</code></span>。<b>⇒ <code>|ℋ|e^{−nε} = δ ⟺ ε = log(|ℋ|/δ)/n</code>，定理里那个式子就是这么来的。</b>", "<b><b>PAC</b>（Probably Approximately Correct，「大概、差不多、对」）这个名字把界的结构说得很准。</b> <span class='k'><b>Probably</b> = 以概率 <code>1−δ</code>（允许小概率失败）；<b>Approximately</b> = 误差 <code>≤ ε</code> 而非 0；<b>Correct</b> = 确实接近最优</span>。<b>⇒ 两个「让步」各对应一个参数，而两个参数都只进 <code>log</code>。</b>", "<b>⚠ 一个容易忽略的点：这条界<b>不保证 <code>ĥ = h_*</code></b>。</b> <span class='w'>它只保证 <code>ĥ</code> 的真实风险小，<b>没说你找到的就是那个完美分类器</b></span>——<b>可能还有别的 <code>h</code> 也在数据上零错误，而你挑中了其中一个「几乎完美」的。</b><span class='k'>⇒ 「找到最优解」和「找到一个足够好的解」是两件事，而 PAC 只承诺后者。这个区分在 L09 的纯探索里会再出现一次。</b>"], "eq": "**R(ĥ) ≤ log(|ℋ|/δ) / n**     分母是 n 的**一次方** = **快率**（fast rate）\n   对比 p14 不可知情形的 1/sqrt(n)（慢率）\n   ⇒ 误差减半：这里只需 2 倍样本；慢率那边要 4 倍\n\n拆开 log(|ℋ|/δ) = **log|ℋ|** + **log(1/δ)**\n   log|ℋ|   = 「候选集有多大」的代价\n   log(1/δ) = 「你要多有把握」的代价\n   ⇒ 两个都只进 log，都很便宜\n\n   感受一下有多便宜：\n     δ: 0.05 → 0.001       log(1/δ): 约 3 → 约 6.9\n       置信度 95% → 99.9%，样本量只翻一倍多一点\n     |ℋ|: 1000 → 1,000,000  log|ℋ|: 约 6.9 → 约 13.8\n       **候选数翻 1000 倍，样本量只需翻一倍**\n\n⚠ 被下划线的假设 **R(h_*) = 0** 比看上去强：\n   要求存在一个候选**完美** —— 不是「最好的那个」，是「一个错都不犯的那个」\n   一旦不成立，这条界**完全失效**（不是常数变差，是结论不对）\n\n手写的反写形式（更接近证明实际做的事）：\n   P( R(ĥ) > log(|ℋ|/δ)/n ) ≤ δ\n   证明：先固定 ε，算出 P(R(ĥ) ≥ ε) ≤ |ℋ|e^{−nε}，再令它 = δ 反解\n   **|ℋ|e^{−nε} = δ  ⟺  ε = log(|ℋ|/δ)/n**    ← 定理那个式子的来历\n\n**PAC** = Probably Approximately Correct（大概、差不多、对）\n   **Probably**      = 以概率 1−δ（允许小概率失败）\n   **Approximately** = 误差 ≤ ε 而非 0\n   **Correct**       = 确实接近最优\n   ⇒ 两个「让步」各对应一个参数，而两个参数都只进 log\n\n⚠ 这条界**不保证 ĥ = h_***：\n   只保证 ĥ 的真实风险小，没说你找到的就是那个完美分类器\n   可能还有别的 h 也在数据上零错误，你挑中了其中一个「几乎完美」的\n   ⇒ 「找到最优解」≠「找到一个足够好的解」，PAC 只承诺后者\n     （这个区分在 L09 的纯探索里会再出现）", "tbl": {"head": ["界里的量", "进去的方式", "翻 1000 倍要多少样本", "是瓶颈吗"], "rows": [["候选数 |ℋ|", "<b>log</b>", "<b>约 2 倍</b>", "<span class='w'>不是</span>"], ["置信度 1/δ", "<b>log</b>", "<b>约 2 倍</b>", "<span class='w'>不是</span>"], ["样本量 n", "<b>1/n（一次方）</b>", "—", "<b>是</b>"], ["⚠ 可实现假设", "<b>要么成立要么全垮</b>", "—", "<b>是（见 p14）</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页给了你一个可以立刻算出来的数，而它可能会改变你对「<code>2^H</code> 个配置」这件事的焦虑程度。</b><br><span class='k'>候选数只进 <code>log</code>。你的配置空间是 <code>2^H</code> 个（<code>H</code> 个节点、每个二选一），于是 <b><code>log|𝒳| = log(2^H) = H·log 2 ≈ 0.69·H</code></b></span>。<b>⇒ <code>H = 10</code> 时这个数是 <b>6.9</b>；<code>H = 20</code> 时是 <b>13.9</b>。</b><span class='w'>换句话说：<b>「候选集有 2^H 个」在统计上的代价只是线性于 H，不是指数</b>。</span><br><b>⇒ 这件事值得在论文里明说，因为它把问题的难点定位准了</b>：<span class='k'>如果你能<b>免费</b>获得每个配置在每条 query 上的表现，那么选出近最优配置所需的 query 数只按 <code>H</code> 线性增长，<code>2^H</code> 完全不是障碍</span>。<b>真正的障碍是<b>每次测量要花钱</b>——你不能对每个配置都跑一遍。</b><br><b>⚠ 所以要把两个「复杂度」分开讲，否则会被审稿人问住：</b><br><b>① <b>统计复杂度</b>（需要多少条 query）：<code>log|𝒳| = H log2</code>，便宜；</b><br><b>② <b>计算/预算复杂度</b>（需要多少次 LLM 调用）：朴素做法是 <code>|𝒳| × query 数</code>，<b>这才是指数的那一项</b>。</b><br><span class='w'>⇒ 而你的方法（线性结构 + 最优设计 + 逐次淘汰）攻的正是第 ②，不是第 ①。</span><br><b>另外两条直接可用的：</b><br><b>· <code>log(1/δ)</code> 很便宜 ⇒ <b>把 <code>δ</code> 取小一点，别为了好看的界牺牲置信度</b></b>。<span class='k'>从 0.05 到 0.001 只多一倍样本，而审稿人对 <code>δ=0.001</code> 的信任度高得多。</span><br><b>· ⚠ <b>「可实现」在你这里几乎必然不成立</b></b>——<span class='w'>不存在一个配置在<b>每条</b> query 上都最优（不同 query 难度不同）</span>。<b>⇒ 所以你该用的是 p14 的不可知版本（<code>1/√n</code>），而不是这一页。别不小心引错了那条更漂亮的界。</b>", "ref": "本讲 p10（逐字核对）· p14 · L14 p4（log|ℋ| 与 n 的来历对照）· 简报 §1 §4c（已核）"}},
{"r": [11, 12], "t": "证明：并集界 + 一个指数不等式，两件工具而已", "star": 3, "quote": "<em><b>Union bound</b>: ℙ(A ∪ B) = ℙ(A) + ℙ(B) − ℙ(A ∩ B) ≤ ℙ(A) + ℙ(B)</em><br><em>ℙ(R(ĥ) ≥ ϵ) = ℙ(R(ĥ) ≥ ϵ <b>and</b> ∩<sub>i=1</sub><sup>n</sup>{ĥ(x<sub>i</sub>) = y<sub>i</sub>})</em><br><em>&nbsp;≤ ℙ( ∪<sub>h∈ℋ</sub> { R(h) ≥ ϵ and ∩<sub>i=1</sub><sup>n</sup>{h(x<sub>i</sub>) = y<sub>i</sub>} } )</em><br><em>&nbsp;≤ Σ<sub>h∈ℋ</sub> ℙ( R(h) ≥ ϵ and ∩<sub>i=1</sub><sup>n</sup>{h(x<sub>i</sub>) = y<sub>i</sub>} )</em><br><em>&nbsp;≤ Σ<sub>h∈ℋ</sub> (1 − ϵ)<sup>n</sup> &nbsp;≤&nbsp; <b>|ℋ| exp(−nϵ)</b></em><br>〔右侧配图与注〕<em>exp(−x) ≥ (1 − x) &nbsp; ∀x</em>", "one": "<b>五行，每一行只做一件事：先补上一个恒成立的条件，再把「我选的那个」放大成「所有候选的并」，然后并集界拆开，最后对单个候选用一个初等概率计算。</b>", "pts": ["<b>第一行是整个证明里最巧的一步，而它看起来像什么都没做：<code>P(R(ĥ) ≥ ε) = P(R(ĥ) ≥ ε <b>且</b> ∩_i{ĥ(x_i) = y_i})</code>。</b> <span class='k'>加上去的那个条件「<code>ĥ</code> 在全部训练点上都对」是<b>恒成立</b>的</span>——<b>因为可实现假设保证 <code>h_*</code> 的经验风险为 0，而 <code>ĥ</code> 是经验风险最小者，所以 <code>ĥ</code> 的经验风险也必须是 0。</b>", "<b>⇒ 加一个概率为 1 的条件不改变概率，但<b>把一个关于 <code>ĥ</code> 的陈述变成了一个可以对每个 <code>h</code> 单独检验的陈述</b>。</b> <span class='w'>这是整个论证的转轴：没有这一步，后面的并集界无从下手</span>。", "<b>第二行把 <code>ĥ</code> 换成 <code>∪_{h∈ℋ}</code>，而这里用的逻辑值得说清。</b> <span class='k'><code>ĥ</code> 是 <code>ℋ</code> 里的某一个（你不知道是哪个）；所以「<code>ĥ</code> 满足某性质」<b>蕴含</b>「<b>存在</b>某个 <code>h ∈ ℋ</code> 满足该性质」</b></span>。<b>⇒ 事件变大，概率只增不减，不等号方向对。</b>", "<b>这一步的代价就是后面那个 <code>|ℋ|</code>，而它本质上是在为「<code>ĥ</code> 依赖数据」付费。</b> <span class='w'>如果 <code>h</code> 是事先固定的，根本不需要并集界，<code>log|ℋ|</code> 这一项就不会出现</span>。<b>⇒ 这呼应了 p9 那条陷阱：<code>ĥ</code> 是挑出来的，所以必须对所有候选同时控制。</b>", "<b>第三行就是<b>并集界</b>，幻灯片把它单独写在了顶上。</b> <span class='k'><code>P(A∪B) = P(A)+P(B)−P(A∩B) ≤ P(A)+P(B)</code>，推广到 <code>|ℋ|</code> 个就是 <code>P(∪_h A_h) ≤ Σ_h P(A_h)</code></span>。<b>⇒ 它是最粗糙的工具之一（完全忽略事件之间的相关性），但也最通用。</b>", "<b>第四行是对<b>单个固定</b> <code>h</code> 的计算，而这正是前面费那么大劲换来的。</b> <span class='k'>固定一个 <code>h</code>，若 <code>R(h) ≥ ε</code>，则它在一个随机样本上<b>答对</b>的概率 <code>≤ 1−ε</code>；n 个样本独立，<b>全对</b>的概率 <code>≤ (1−ε)^n</code></span>。<b>⇒ 「坏的假设恰好在所有训练点上蒙对」这件事指数地不可能。</b>", "<b>⚠ 这一步的独立性用在哪里要看清：用在 <code>n</code> 个样本之间，不是候选之间。</b> <span class='w'><code>(x_i,y_i)</code> 独立同分布 ⇒ n 次「答对」可以连乘</span>。<b>⇒ 这是整个证明里唯一用到独立同分布的地方，而本讲后半要去掉的正是它。</b>", "<b>第五行用 <code>1−x ≤ e^{−x}</code>（幻灯片写成 <code>exp(−x) ≥ 1−x</code>，右边还画了两条曲线）。</b> <span class='k'>这个不等式对所有 <code>x</code> 成立，是切换到指数形式的标准手法</span>。<b>⇒ <code>(1−ε)^n ≤ e^{−nε}</code>，于是总和 <code>≤ |ℋ|e^{−nε}</code>。</b>", "<b>最后令 <code>|ℋ|e^{−nε} = δ</code> 反解即得定理：<code>ε = log(|ℋ|/δ)/n</code>。</b> <span class='w'>注意 <code>|ℋ|</code> 和 <code>1/δ</code> 在这里是<b>乘</b>在一起的，取 log 后才变成加法</span>——<b>这解释了为什么它们俩在界里总是以 <code>log(|ℋ|/δ)</code> 这个组合出现。</b>", "<b>⚠ 把全局看一眼：整个证明只用了<b>两件工具</b>——并集界，和一个关于单个假设的概率计算。</b> <span class='k'>后面 p14 的不可知情形结构<b>完全一样</b>，只是第四行换成 Hoeffding；p18 再换成 Bernstein</span>。<b>⇒ 「换哪个集中不等式，就得到哪一档的界」——这个模板你会反复用到。</b>"], "eq": "① 补一个恒成立的条件（整个证明最巧的一步，看起来什么都没做）：\n   P(R(ĥ) ≥ ε) = P( R(ĥ) ≥ ε **且** ∩_i {ĥ(x_i) = y_i} )\n\n   为什么恒成立：可实现 ⇒ R̂_n(h_*) = 0；ĥ 是经验风险最小者 ⇒ R̂_n(ĥ) = 0\n   ⇒ 加一个概率为 1 的条件不改变概率，\n     但**把关于 ĥ 的陈述变成了可以对每个 h 单独检验的陈述**\n     这是整个论证的转轴\n\n② ĥ → ∪_{h∈ℋ}：\n   ĥ 是 ℋ 里某一个（不知是哪个）\n   ⇒「ĥ 满足 P」**蕴含**「**存在** h ∈ ℋ 满足 P」⇒ 事件变大，概率只增不减\n   代价 = 后面那个 |ℋ|，本质是在为「ĥ 依赖数据」付费\n     （若 h 事先固定，根本不需要并集界，log|ℋ| 不会出现）\n\n③ **并集界**：P(A∪B) = P(A)+P(B)−P(A∩B) ≤ P(A)+P(B)\n   推广：P(∪_h A_h) ≤ Σ_h P(A_h)\n   最粗糙的工具之一（完全忽略相关性），但最通用\n\n④ 对**单个固定** h 的计算（前面费劲换来的）：\n   若 R(h) ≥ ε，则它在一个随机样本上**答对**的概率 ≤ 1−ε\n   n 个样本独立 ⇒ **全对**的概率 ≤ (1−ε)^n\n   = 「坏假设恰好在所有训练点上蒙对」指数地不可能\n\n   ⚠ 独立性用在**样本之间**，不是候选之间\n     这是整个证明里**唯一**用到 i.i.d. 的地方 —— 本讲后半要去掉的正是它\n\n⑤ **exp(−x) ≥ (1−x)  ∀x** ⇒ (1−ε)^n ≤ e^{−nε}\n   ⇒ 总和 ≤ **|ℋ|·exp(−nε)**\n\n令 |ℋ|e^{−nε} = δ 反解：**ε = log(|ℋ|/δ)/n** ✓\n   注意 |ℋ| 与 1/δ 在这里是**乘**在一起的，取 log 后才变加法\n   ⇒ 解释了为什么它们总以 log(|ℋ|/δ) 这个组合出现\n\n⚠ 全局：整个证明只用了**两件工具** —— 并集界 + 单个假设的概率计算\n   p14 不可知情形结构**完全一样**，只是 ④ 换成 Hoeffding\n   p18 再换成 Bernstein\n   ⇒ **换哪个集中不等式，就得到哪一档的界**"},
{"r": [13, 13], "t": "从「高概率」到「期望」：一个积分技巧", "star": 2, "quote": "<b>Corollary</b> <em>Under the conditions of the theorem (i.e., there exists an h<sub>*</sub> ∈ ℋ such that R(h<sub>*</sub>) = 0, (x<sub>i</sub>,y<sub>i</sub>) <sup>iid</sup>∼ ν, and ĥ = arg min<sub>h∈ℋ</sub> (1/n)Σ<sub>i=1</sub><sup>n</sup><b>1</b>{h(x<sub>i</sub>) ≠ y<sub>i</sub>}) we have</em><br><em><b>𝔼[R(ĥ)] ≤ ∫<sub>ϵ=0</sub><sup>1</sup> ℙ(R(ĥ) ≥ ϵ) dϵ ≤ 2 log(|ℋ|) / n</b></em><br>〔手写批注〕<em>𝔼[Z] = ∫<sub>0</sub><sup>∞</sup> ℙ(Z &gt; ϵ) dϵ</em> · <em>被积函数 ≤ min{1, |ℋ|e<sup>−nϵ</sup>}</em>", "one": "<b>高概率界和期望界之间只隔一个恒等式：E[Z] = ∫P(Z>ε)dε。把尾概率积掉，δ 就自己消失了——代价是常数 2。</b>", "pts": ["<b>为什么要有期望版本？因为高概率界里那个 <code>δ</code> 是个自由参数，报结果时总要解释「我们取 δ=0.05」。</b> <span class='k'>期望界没有这个参数，更干净，也更容易和别的结果比较</span>。<b>⇒ 两种形式各有用处，而它们之间的转换是机械的。</b>", "<b>用的恒等式是 <code>E[Z] = ∫_0^∞ P(Z > ε)dε</code>，对<b>非负</b>随机变量成立。</b> <span class='w'>直觉：把 <code>Z</code> 的图像按水平线切片，每一片的面积就是 <code>P(Z > ε)dε</code>，加起来就是期望</span>。<b>⇒ 这是概率论里最常用的小技巧之一，值得当成反射。</b>", "<b>这里 <code>R(ĥ) ∈ [0,1]</code>，所以积分上限是 1 而不是 <code>∞</code>。</b> <span class='k'>幻灯片写的就是 <code>∫_{ε=0}^{1}</code>（手写批注里还纠结过上限，划掉又改过）</span>。", "<b>关键一步是手写批注那行：<b>被积函数 <code>≤ min{1, |ℋ|e^{−nε}}</code></b>。</b> <span class='w'>概率天然 <code>≤ 1</code>，而定理给了 <code>≤ |ℋ|e^{−nε}</code>——取两者的较小值</span>。<b>⇒ 这个 <code>min</code> 是必需的：当 <code>ε</code> 很小时 <code>|ℋ|e^{−nε}</code> 会大于 1，直接积分会高估。</b>", "<b>于是积分被分成两段，而分界点正好在 <code>|ℋ|e^{−nε} = 1</code>，即 <code>ε_0 = log|ℋ|/n</code>。</b> <span class='k'><b>第一段</b> <code>[0, ε_0]</code>：被积函数取 1，贡献 <code>ε_0 = log|ℋ|/n</code>；<b>第二段</b> <code>[ε_0, 1]</code>：被积函数取 <code>|ℋ|e^{−nε}</code>，积出来是 <code>(|ℋ|/n)e^{−nε_0} = 1/n</code></span>。", "<b>两段加起来是 <code>log|ℋ|/n + 1/n</code>，而幻灯片给的是 <code>2log|ℋ|/n</code>。</b> <span class='w'>只要 <code>|ℋ| ≥ e</code>（即 <code>log|ℋ| ≥ 1</code>），就有 <code>1/n ≤ log|ℋ|/n</code>，于是和 <code>≤ 2log|ℋ|/n</code></span>。<b>⇒ 那个常数 2 就是这么来的，是一步「把小项并进大项」的粗放。</b>", "<b>⚠ 注意期望版里 <code>δ</code> 不见了，但代价不是零：<b>多了一个常数 2</b>，而且丢掉了「失败时有多糟」的信息。</b> <span class='k'>高概率界告诉你「<code>1−δ</code> 的情况下不超过多少」；期望界只给平均值，<b>可能被罕见的坏情况拖累而你看不出来</b></span>。<b>⇒ 报结果时两种都给，是最稳妥的做法。</b>", "<b>这一页的技巧在本片后面还会再用一次（p17 的不可知推论 <code>√(8log|ℋ|/n)</code>），而且在你自己写界时几乎一定会用到。</b> <span class='w'>凡是手上有一条形如「以概率 <code>1−δ</code>，误差 <code>≤ f(δ)</code>」的界，都可以这样积出期望版</span>。"], "eq": "为什么要期望版本：高概率界里的 δ 是自由参数，报结果时总要解释「我们取 δ=0.05」\n   期望界没有这个参数，更干净，也更容易和别的结果比较\n\n恒等式（对**非负**随机变量）：**E[Z] = ∫_0^∞ P(Z > ε) dε**\n   直觉：把 Z 的图像按水平线切片，每片面积 = P(Z>ε)dε，加起来就是期望\n   这里 R(ĥ) ∈ [0,1] ⇒ 积分上限是 1\n\n关键（手写批注）：被积函数 ≤ **min{ 1, |ℋ|e^{−nε} }**\n   概率天然 ≤ 1，而定理给了 ≤ |ℋ|e^{−nε}，取较小者\n   ⚠ 这个 min 是必需的：ε 很小时 |ℋ|e^{−nε} > 1，直接积分会高估\n\n分界点在 |ℋ|e^{−nε} = 1，即 **ε_0 = log|ℋ| / n**\n   第一段 [0, ε_0]：被积函数取 1        ⇒ 贡献 ε_0 = log|ℋ|/n\n   第二段 [ε_0, 1]：取 |ℋ|e^{−nε}      ⇒ 积出 (|ℋ|/n)e^{−n·ε_0} = 1/n\n\n   和 = log|ℋ|/n + 1/n\n   只要 |ℋ| ≥ e（即 log|ℋ| ≥ 1）⇒ 1/n ≤ log|ℋ|/n\n   ⇒ **≤ 2·log(|ℋ|)/n**        ← 那个常数 2 的来历（把小项并进大项）\n\n⚠ δ 不见了，但代价不是零：\n   多了常数 2，而且**丢掉了「失败时有多糟」的信息**\n   高概率界：「1−δ 的情况下不超过多少」\n   期望界：只给平均值，**可能被罕见的坏情况拖累而你看不出来**\n   ⇒ 报结果时两种都给最稳妥\n\n这个技巧后面还会用（p17 的 sqrt(8log|ℋ|/n)），你自己写界时几乎一定用得到：\n   凡是手上有「以概率 1−δ，误差 ≤ f(δ)」的界，都可以这样积出期望版"},
{"r": [14, 15], "t": "不可知情形：去掉完美假设，快率掉成慢率", "star": 3, "quote": "<b>Agnostic (Non-realizable) case</b> — <b>Theorem</b>: <em>〔同样设定，但<b>不</b>假设存在完美分类器〕If ĥ = arg min<sub>h∈ℋ</sub> R̂<sub>n</sub>(h) then with probability at least 1 − δ we have</em><br><em><b>R(ĥ) − R(h<sub>*</sub>) ≤ √( 2 log(|ℋ|/δ) / n )</b></em> 〔手写标注：<b>“Excess Risk”</b>，h<sub>*</sub> = arg min<sub>h∈ℋ</sub> R(h)〕<br>〔手写的分解〕<em>R(ĥ) − R(h<sub>*</sub>) = R(ĥ) − R̂<sub>n</sub>(ĥ) + <u>R̂<sub>n</sub>(ĥ) − R̂<sub>n</sub>(h<sub>*</sub>)</u> + R̂<sub>n</sub>(h<sub>*</sub>) − R(h<sub>*</sub>) &nbsp;〔中间一项标注 ≤ 0〕</em><br><b>Lemma (Hoeffding's inequality)</b>: <em>Let Z₁,…,Z<sub>n</sub> <sup>iid</sup>∼ ν where 𝔼[Z<sub>i</sub>] = μ and Z<sub>i</sub> ∈ [a,b] almost surely. Then &nbsp;ℙ( (1/n)Σ<sub>i=1</sub><sup>n</sup> Z<sub>i</sub> ≥ μ + ϵ ) ≤ exp( −2nϵ² / |b−a|² )</em>", "one": "<b>没有完美分类器，就不能再说「坏假设蒙对所有点的概率是 (1−ε)ⁿ」。换成 Hoeffding 之后，n 从分母的一次方掉到根号里——这就是快率与慢率的全部区别。</b>", "pts": ["<b>先看变了什么：<b>只去掉了「存在 <code>h_* </code> 使 <code>R(h_*) = 0</code>」这一条</b>，其余设定一字未改。</b> <span class='k'>于是 <code>h_*</code> 的含义也随之改变——现在它是 <code>argmin_{h∈ℋ}R(h)</code>，即<b>类里最好的那个</b>，而不是「完美的那个」</span>。", "<b>结论的形式也必须跟着变：不能再说 <code>R(ĥ)</code> 小，只能说 <code>R(ĥ)</code> 离 <code>R(h_*)</code> 不远。</b> <span class='w'>手写标注给了这个差一个名字：<b>超额风险</b>（Excess Risk）</span>。<b>⇒ 道理很简单：如果你的假设类里最好的也有 30% 错误率，那谁也不能让你低于 30%，只能保证你接近它。</b>", "<b>而代价是速率从 <code>1/n</code> 掉到 <code>1/√n</code>，这个差别在实践里非常大。</b> <span class='k'>要达到 <code>ε</code> 的精度：可实现情形需要 <code>n ≈ log(|ℋ|/δ)/ε</code>；不可知情形需要 <code>n ≈ 2log(|ℋ|/δ)/ε²</code></span>。<b>⇒ <code>ε = 0.01</code> 时，后者比前者多要 <b>100 倍</b>样本。</b>", "<b>手写那个三项分解是整块内容最该带走的东西，因为它是 ERM 分析的通用模板。</b> <b><code>R(ĥ) − R(h_*) = [R(ĥ) − R̂_n(ĥ)] + [R̂_n(ĥ) − R̂_n(h_*)] + [R̂_n(h_*) − R(h_*)]</code></b><span class='w'>——纯粹的加减零，没有任何不等式。</span>", "<b>⚠ 而<b>中间那项 <code>≤ 0</code></b>，理由只有一句：<code>ĥ</code> 是经验风险的最小者，所以 <code>R̂_n(ĥ) ≤ R̂_n(h_*)</code>。</b> <span class='k'>这是整个论证里<b>唯一</b>用到「<code>ĥ</code> 是怎么选出来的」的地方</span>。<b>⇒ 算法的全部作用就浓缩在这一个不等号里，其余两项与算法无关。</b>", "<b>剩下两项的性质完全不同，必须分开对待。</b> <span class='w'><b>第三项</b> <code>R̂_n(h_*) − R(h_*)</code>：<code>h_*</code> 是<b>固定</b>的（不依赖数据），直接用一次 Hoeffding 即可</span>；<b><b>第一项</b> <code>R(ĥ) − R̂_n(ĥ)</code>：<code>ĥ</code> <b>依赖数据</b>，必须放大成 <code>max_{h∈ℋ}(R(h) − R̂_n(h))</code> 再对 <code>|ℋ|</code> 个用并集界。</b>", "<b>⇒ 两项各贡献 <code>√(log(2|ℋ|/δ)/(2n))</code>，加起来就是 <code>√(2log(|ℋ|/δ)/n)</code> 量级（手写最后一行写的正是这两项相加）。</b> <span class='k'>那个 <code>2|ℋ|</code> 里的 2 来自把 <code>δ</code> 分一半给两项。</span>", "<b>Hoeffding 不等式本身要记住三件事：<b>独立同分布、有界、指数尾</b>。</b> <span class='w'><code>P((1/n)ΣZ_i ≥ μ+ε) ≤ exp(−2nε²/|b−a|²)</code>——<b>注意分母是区间长度的<b>平方</b></b></span>。<b>⇒ 这里 <code>Z_i = 1{h(x_i)≠y_i}</code> 取值在 <code>[0,1]</code>，<code>|b−a| = 1</code>，于是是 <code>exp(−2nε²)</code>。</b>", "<b>p15 手写部分还给了一个很有用的直觉：<b>把 Hoeffding 看成中心极限定理的「非渐近版」</b>。</b> <span class='k'>手写写着 <code>R̂_n(h) − R(h) → 𝒩(0, Var(Z_1)/n)</code>，而 <code>Var(Z_i) = R(h)(1−R(h)) ≤ 1/4</code></span>；<b>⇒ 标准差约 <code>√(1/(4n)) = 1/(2√n)</code>，正好对上 Hoeffding 给的 <code>√(log(1/δ)/(2n))</code> 的量级。</b>", "<b>⚠ 但那个 <code>Var ≤ 1/4</code> 是<b>最坏情况</b>，而这正是下一页（p18）要改进的地方。</b> <span class='w'>如果 <code>R(h)</code> 很小（好假设），<code>Var = R(h)(1−R(h))</code> 也很小，用 Hoeffding 就浪费了</span>。<b>⇒ 换成能利用方差的 Bernstein，就能把界收紧——这是 p18 的全部内容。</b>"], "eq": "只去掉一条：「存在 h_* 使 R(h_*) = 0」，其余设定一字未改\n   ⇒ h_* 的含义随之改变：现在是 **argmin_{h∈ℋ} R(h)** = 类里**最好的**那个，不是完美的那个\n\n结论形式也必须变：不能说 R(ĥ) 小，只能说它离 R(h_*) 不远\n   手写标注给这个差一个名字：**超额风险**（Excess Risk）\n   道理：类里最好的也有 30% 错误率，谁也不能让你低于 30%\n\n**R(ĥ) − R(h_*) ≤ sqrt( 2·log(|ℋ|/δ) / n )**     速率从 1/n 掉到 **1/sqrt(n)**\n   达到精度 ε 所需样本：\n     可实现   n ≈ log(|ℋ|/δ) / ε\n     不可知   n ≈ 2log(|ℋ|/δ) / ε²\n   ⇒ ε = 0.01 时后者多要 **100 倍**样本\n\n**三项分解**（ERM 分析的通用模板，纯粹加减零，无不等式）：\n   R(ĥ) − R(h_*) = [ R(ĥ) − R̂_n(ĥ) ] + [ **R̂_n(ĥ) − R̂_n(h_*)** ] + [ R̂_n(h_*) − R(h_*) ]\n\n   ⚠ **中间项 ≤ 0**：ĥ 是经验风险最小者 ⇒ R̂_n(ĥ) ≤ R̂_n(h_*)\n     这是整个论证里**唯一**用到「ĥ 是怎么选出来的」的地方\n     ⇒ **算法的全部作用浓缩在这一个不等号里**，其余两项与算法无关\n\n   剩下两项性质完全不同：\n     第三项 R̂_n(h_*) − R(h_*)：h_* **固定**（不依赖数据）⇒ 直接一次 Hoeffding\n     第一项 R(ĥ) − R̂_n(ĥ)：ĥ **依赖数据** ⇒ 放大成 max_h(R(h) − R̂_n(h)) 再并集界\n\n   两项各贡献 sqrt( log(2|ℋ|/δ) / (2n) )  ⇒ 合起来 sqrt( 2log(|ℋ|/δ)/n ) 量级\n   （2|ℋ| 里的 2 = 把 δ 分一半给两项）\n\n**Hoeffding**：Z_i i.i.d.，E[Z_i] = μ，Z_i ∈ [a,b] a.s.\n   P( (1/n)ΣZ_i ≥ μ + ε ) ≤ exp( −2nε² / |b−a|² )\n   记三件事：**独立同分布、有界、指数尾**；⚠ 分母是区间长度的**平方**\n   这里 Z_i = 1{h(x_i)≠y_i} ∈ [0,1] ⇒ |b−a| = 1 ⇒ exp(−2nε²)\n\np15 手写的直觉：把 Hoeffding 看成中心极限定理的**非渐近版**\n   R̂_n(h) − R(h) → 𝒩(0, Var(Z_1)/n)，而 **Var(Z_i) = R(h)(1−R(h)) ≤ 1/4**\n   ⇒ 标准差约 sqrt(1/(4n)) = 1/(2sqrt(n))，对上 Hoeffding 的量级\n\n⚠ 但 Var ≤ 1/4 是**最坏情况** —— 正是下一页 (p18) 要改进的：\n   R(h) 很小（好假设）时 Var = R(h)(1−R(h)) 也很小，用 Hoeffding 就浪费了\n   ⇒ 换成能利用方差的 **Bernstein** 就能收紧", "tbl": {"head": ["", "可实现（p10）", "不可知（p14）"], "rows": [["假设", "<b>存在 h<sub>*</sub>，R(h<sub>*</sub>)=0</b>", "<span class='w'>无</span>"], ["h<sub>*</sub> 的含义", "<b>完美的那个</b>", "<b>类里最好的那个</b>"], ["结论控制什么", "<b>R(ĥ)</b>", "<b>R(ĥ) − R(h<sub>*</sub>)（超额风险）</b>"], ["速率", "<b>log(|ℋ|/δ)/n（快）</b>", "<b>√(2log(|ℋ|/δ)/n)（慢）</b>"], ["达到 ε=0.01 的样本量", "<b>≈ 100·log(·)</b>", "<span class='w'>≈ 20000·log(·)</span>"], ["用的集中不等式", "<b>(1−ε)<sup>n</sup></b>", "<b>Hoeffding</b>"]]}, "res": {"tag": "推断", "v": "<b>那个三项分解是你论文里<b>一定</b>会用到的东西，因为<b>你的配置选择程序本身就是一个 ERM</b>。</b><br><span class='k'>你做的事情是：在一批 query 上测量每个候选配置的 <code>Ĝ</code>，然后挑 <code>Ĝ</code> 最大的那个。把 <code>−G</code> 当成损失，这<b>字面上</b>就是经验风险最小化</span>。<b>⇒ 于是「我们选出的配置有多接近真正最优」这个问题，答案就是那个三项分解：</b><br><b><code>G(x_*) − G(x̂) = [Ĝ(x̂) − G(x̂)] + [G(x_*) − Ĝ(x_*)] + [Ĝ(x_*) − Ĝ(x̂)]</code></b><br><span class='w'>最后一项 <code>≤ 0</code>（因为 <code>x̂</code> 是 <code>Ĝ</code> 的最大者），前两项各用一次集中不等式</span>。<b>⇒ 这就是一个完整的、可写进论文的保证，而且推导只有三行。</b><br><b>⚠ 但要注意两项的<b>不对称</b>，这是最容易出错的地方：</b> <span class='k'><code>x_*</code> 是<b>固定</b>的（它不依赖你的数据），所以对它只需一次集中不等式；而 <code>x̂</code> 是<b>你挑出来的</b>，必须对所有候选取 max 再并集界</span>。<b>⇒ 代价就是那个 <code>log|𝒳| = H log 2</code>（见 p10 科研格）。<b>如果你只对 <code>x̂</code> 用一次集中不等式而不做并集界，那是一个真实的错误</b>，而且因为 <code>x̂</code> 的 <code>Ĝ</code> 系统性偏高，这个错误会让你<b>高估</b>所选配置的好处。</b><br><b>⇒ 这正是「赢家的诅咒」在你问题里的形式：<b>你报告的那个最优配置的 <code>Ĝ</code>，几乎必然比它的真实 <code>G</code> 高</b>。</b> <span class='w'>一个干净的做法是<b>样本分割</b>：用一半数据选配置，用另一半<b>重新估</b>它的 <code>G</code> 再报告</span>——<b>那一半上 <code>x̂</code> 已经是固定的了，不需要并集界，报出来的数无偏。</b><br><b>最后一条：「可实现 vs 不可知」在你这里对应「存不存在一个配置在所有 query 上都最优」。</b> <span class='k'>几乎必然<b>不</b>存在（不同 query 难度不同，有的要大模型有的不用）</span>。<b>⇒ 所以你处在<b>不可知</b>这一档，速率是 <code>1/√n</code>，而且该报的是<b>超额风险</b>而不是绝对风险。</b>", "ref": "本讲 p14（逐行核对）· p10 科研格 · p15 · L09 p11 · 简报 §2 §4c §4d（已核）"}},
{"r": [16, 17], "t": "干净版与期望推论：√(8log|ℋ|/n)", "star": 2, "quote": "〔p16 是一张只有标题的空白页：<b>Agnostic (Non-realizable) case - Proof</b>〕<br>〔p17 是 p14 的干净版（去掉手写），加上一条推论〕<br><b>Corollary</b> <em>Under the conditions of the theorem (i.e., (x<sub>i</sub>,y<sub>i</sub>) <sup>iid</sup>∼ ν, and ĥ = arg min<sub>h∈ℋ</sub> (1/n)Σ<sub>i=1</sub><sup>n</sup><b>1</b>{h(x<sub>i</sub>) ≠ y<sub>i</sub>}) and <b>|ℋ| ≥ n</b>, we have &nbsp; <b>𝔼[R(ĥ)] − R(h<sub>*</sub>) ≤ √( 8 log(|ℋ|) / n )</b></em>", "one": "<b>和 p13 同一个积分技巧，只是这回被积的是 √ 型的尾界。多出来的条件 |ℋ| ≥ n 是为了让那个粗放的常数 8 成立。</b>", "pts": ["<b>p16 是一张只有标题的空白页（<em>Agnostic case - Proof</em>），课上应该是在黑板上推的。</b> <span class='k'>⚠ 这类空白页在这份讲义里有好几张（p47、p53 也是），<b>它们不是缺页，而是「板书在别处」的标记</b></span>。<b>⇒ 对照 p14 的手写批注就能看出那天实际推了什么：正是那个三项分解。</b>", "<b>p17 把 p14 的定理重抄了一遍（这次没有手写干扰），然后加了一条<b>期望形式</b>的推论。</b> <span class='w'>做法与 p13 完全一样：用 <code>E[Z] = ∫P(Z>ε)dε</code> 把 <code>δ</code> 积掉</span>。", "<b>但这次被积的尾界是 <code>√</code> 型的，所以反解方向要小心。</b> <span class='k'>从 <code>R(ĥ)−R(h_*) ≤ √(2log(|ℋ|/δ)/n)</code> 反解出 <code>P(超额风险 ≥ ε) ≤ |ℋ|·exp(−nε²/2)</code></span>——<b>注意指数里是 <code>ε²</code> 而不是 <code>ε</code>，这是慢率的特征。</b>", "<b>积分同样分两段，分界点在 <code>|ℋ|e^{−nε²/2} = 1</code>，即 <code>ε_0 = √(2log|ℋ|/n)</code>。</b> <span class='w'>第一段贡献 <code>ε_0</code>，第二段是一个高斯型尾巴的积分，贡献同阶的一项</span>。<b>⇒ 合起来是 <code>√(log|ℋ|/n)</code> 的常数倍，幻灯片取的常数是 <code>√8</code>。</b>", "<b>⚠ 多出来的那个条件 <b><code>|ℋ| ≥ n</code></b> 值得留意，它在 p13 的推论里是没有的。</b> <span class='k'>它的作用和 p13 里「<code>|ℋ| ≥ e</code>」一样：保证第二段积分的那一项能被并进第一项，于是常数可以写成一个干净的 8</span>。<b>⇒ 这是一个纯技术性的条件，不影响理解，但引用时不能漏掉。</b>", "<b>把本片到这里的四条界并排看，<b>整个有限假设类理论的骨架就齐了</b>。</b> <span class='w'>可实现·高概率 <code>log(|ℋ|/δ)/n</code>；可实现·期望 <code>2log|ℋ|/n</code>；不可知·高概率 <code>√(2log(|ℋ|/δ)/n)</code>；不可知·期望 <code>√(8log|ℋ|/n)</code></span>。<b>⇒ 两个维度：有没有完美假设（决定 <code>1/n</code> 还是 <code>1/√n</code>），要高概率还是期望（决定 <code>δ</code> 在不在）。</b>", "<b>⚠ 而四条界里 <code>log|ℋ|</code> 这一项<b>始终不变</b>，这件事值得单独记住。</b> <span class='k'>不管快率慢率、不管高概率还是期望，「候选集有多大」的代价永远是 <code>log|ℋ|</code></span>。<b>⇒ 因为它来自并集界，而并集界与用哪个集中不等式无关。</b>"], "eq": "p16 = 只有标题的空白页（Agnostic case - Proof），课上在黑板推的\n   ⚠ 这类空白页讲义里有好几张（p47、p53 也是）\n     **不是缺页，是「板书在别处」的标记**\n     对照 p14 的手写批注就知道那天推了什么：正是三项分解\n\np17 = p14 的干净版 + 一条**期望形式**的推论\n   做法与 p13 完全一样：用 E[Z] = ∫P(Z>ε)dε 把 δ 积掉\n\n⚠ 但这次尾界是 sqrt 型的，反解方向要小心：\n   从 R(ĥ)−R(h_*) ≤ sqrt(2log(|ℋ|/δ)/n)\n   反解 ⇒ P(超额风险 ≥ ε) ≤ |ℋ|·exp( −nε²/2 )\n   注意指数里是 **ε²** 而不是 ε —— 这是慢率的特征\n\n积分分两段，分界点 |ℋ|e^{−nε²/2} = 1 ⇒ **ε_0 = sqrt(2log|ℋ|/n)**\n   第一段贡献 ε_0；第二段是高斯型尾巴的积分，贡献同阶\n   ⇒ **E[R(ĥ)] − R(h_*) ≤ sqrt( 8·log(|ℋ|) / n )**\n\n⚠ 多出来的条件 **|ℋ| ≥ n**（p13 的推论里没有）：\n   作用和 p13 里「|ℋ| ≥ e」一样 —— 保证第二段能并进第一项，常数写成干净的 8\n   纯技术性条件，不影响理解，但引用时不能漏\n\n**本片四条界的骨架**：\n                  高概率                        期望\n   可实现    log(|ℋ|/δ)/n              2·log|ℋ|/n\n   不可知    sqrt(2log(|ℋ|/δ)/n)      sqrt(8·log|ℋ|/n)\n\n   两个维度：① 有没有完美假设 ⇒ 1/n 还是 1/sqrt(n)\n             ② 高概率还是期望 ⇒ δ 在不在\n\n⚠ 四条界里 **log|ℋ| 这一项始终不变**\n   不管快率慢率、不管高概率还是期望，「候选集有多大」的代价永远是 log|ℋ|\n   因为它来自**并集界**，而并集界与用哪个集中不等式无关", "tbl": {"head": ["", "高概率（含 δ）", "期望（δ 已积掉）"], "rows": [["<b>可实现</b>（有完美假设）", "<b>log(|ℋ|/δ)/n</b>", "<b>2log|ℋ|/n</b>"], ["<b>不可知</b>（无）", "<b>√(2log(|ℋ|/δ)/n)</b>", "<b>√(8log|ℋ|/n)</b>"], ["额外条件", "<span class='w'>无</span>", "<b>|ℋ| ≥ e / |ℋ| ≥ n</b>"], ["log|ℋ| 这一项", "<b>始终不变（来自并集界）</b>", "<b>始终不变</b>"]]}},
{"r": [18, 18], "t": "插值：用 Bernstein 换 Hoeffding，把两档界统一起来", "star": 3, "quote": "<b>Agnostic (Non-realizable) case - <span style='color:#8b5cf6'>Interpolation</span></b><br><b>Theorem</b>: <em>〔同前设定〕If ĥ = arg min<sub>h∈ℋ</sub> R̂<sub>n</sub>(h) then with probability at least 1 − δ we have</em><br><em><b>R(ĥ) − R(h<sub>*</sub>) ≤ √( 2 R(h<sub>*</sub>) log(2|ℋ|/δ) / n ) + log(2|ℋ|/δ) / n</b></em><br><em><b>Proof: Use Bernstein's inequality instead of Hoeffding.</b></em>", "one": "<b>一条界同时覆盖两种情形：R(h_*)=0 时第一项消失、退回 1/n 的快率；R(h_*) 大时第一项主导、就是 1/√n 的慢率。中间的情形自动插值——所以叫 Interpolation。</b>", "pts": ["<b>这一页是本片最漂亮的一条，因为它把前面两档界<b>合成了一条</b>。</b> <span class='k'>界是 <code>√(2R(h_*)log(2|ℋ|/δ)/n) + log(2|ℋ|/δ)/n</code>，<b>两项</b></span>：<b>第一项带 <code>√</code> 且含 <code>R(h_*)</code>，第二项是干净的 <code>1/n</code>。</b>", "<b>先代入 <code>R(h_*) = 0</code>（可实现情形）：<b>第一项整个消失</b>，只剩 <code>log(2|ℋ|/δ)/n</code>。</b> <span class='w'>这就是 p10 那条快率界（差一个常数 2 在 <code>|ℋ|</code> 上）</span>。<b>⇒ 可实现情形被<b>包含</b>了，不是另一条定理。</b>", "<b>再看 <code>R(h_*)</code> 比较大的情形：第一项 <code>√(2R(h_*)log(·)/n)</code> 主导，而 <code>R(h_*) ≤ 1</code>，于是它 <code>≤ √(2log(·)/n)</code>。</b> <span class='k'>这就是 p14 那条慢率界</span>。<b>⇒ 不可知情形也被包含了。</b>", "<b>⇒ 所以「插值」这个名字名副其实：<b>同一条式子，随 <code>R(h_*)</code> 从 0 连续变到 1，速率从 <code>1/n</code> 连续滑到 <code>1/√n</code></b>。</b> <span class='w'>两档不是两个世界，而是一条谱的两端</span>。", "<b>原文的证明只有一句话：<b><em>Use Bernstein's inequality instead of Hoeffding.</em></b></b> <span class='k'>这句话值得当真——它说明前面那套证明的<b>结构</b>一点没变，只换了第四步那个集中不等式</span>。<b>⇒ 这正是我在 p11 结尾说的那个模板：换哪个集中不等式，就得到哪一档的界。</b>", "<b>Bernstein 与 Hoeffding 的区别只有一处，但很关键：<b>Bernstein 用方差，Hoeffding 只用范围</b>。</b> <span class='w'>Hoeffding：<code>exp(−2nε²/|b−a|²)</code>，只认区间长度；Bernstein：<code>exp(−nε²/(2σ² + 2ε/3))</code> 量级，<b>认真实方差 <code>σ²</code></b></span>。", "<b>而 p15 已经算过那个方差：<code>Var(Z_i) = R(h)(1−R(h))</code>。</b> <span class='k'><b>当 <code>R(h)</code> 很小时，方差也很小</b>——好假设犯错少，所以它的「犯不犯错」这个随机变量几乎是常数 0</span>。<b>⇒ Hoeffding 一律按 <code>Var ≤ 1/4</code> 处理，在好假设上<b>浪费得很厉害</b>；Bernstein 把这块捡了回来。</b>", "<b>⚠ 注意第二项 <code>log(2|ℋ|/δ)/n</code> 是<b>没法去掉</b>的，它是 Bernstein 界里那个 <code>ε/3</code> 项的产物。</b> <span class='w'>所以这条界永远至少有 <code>1/n</code> 这一项</span>——<b>⇒ 这也说明 <code>1/n</code> 是这类问题的下限，快率快不过它。</b>", "<b>这类界在文献里有几个名字，查资料时都会撞上：<b>一阶界</b>（first-order bound）、<b>小损失界</b>（small-loss bound）、<b>方差自适应界</b>（variance-adaptive）。</b> <span class='k'>它们说的是同一件事：<b>当最优者本身表现很好时，界自动变紧</b></span>。"], "eq": "**R(ĥ) − R(h_*) ≤ sqrt( 2·R(h_*)·log(2|ℋ|/δ) / n ) + log(2|ℋ|/δ) / n**\n   两项：第一项带 sqrt 且含 R(h_*)；第二项是干净的 1/n\n\n代入 **R(h_*) = 0**（可实现）：\n   第一项整个**消失** ⇒ 只剩 log(2|ℋ|/δ)/n = p10 那条**快率**界\n   ⇒ 可实现情形被**包含**了，不是另一条定理\n\n**R(h_*) 较大**时：\n   第一项主导，而 R(h_*) ≤ 1 ⇒ ≤ sqrt(2log(·)/n) = p14 那条**慢率**界\n   ⇒ 不可知情形也被包含了\n\n⇒ 「插值」名副其实：**同一条式子，R(h_*) 从 0 连续变到 1，\n   速率从 1/n 连续滑到 1/sqrt(n)** —— 两档不是两个世界，是一条谱的两端\n\n原文证明只有一句：**Use Bernstein's inequality instead of Hoeffding.**\n   说明前面那套证明的**结构**一点没变，只换了第四步的集中不等式\n   ⇒ 正是 p11 结尾那个模板：**换哪个集中不等式，就得到哪一档的界**\n\n**Bernstein vs Hoeffding**（区别只有一处，但关键）：\n   Hoeffding：exp( −2nε² / |b−a|² )        只认**区间长度**\n   Bernstein：exp( −nε² / (2σ² + 2ε/3) )    认**真实方差 σ²**\n\n   而 p15 已经算过：**Var(Z_i) = R(h)(1 − R(h))**\n     R(h) 很小时方差也很小 —— 好假设犯错少，\n     所以它的「犯不犯错」这个随机变量几乎是常数 0\n   ⇒ Hoeffding 一律按 Var ≤ 1/4 处理，在好假设上**浪费得厉害**\n     Bernstein 把这块捡了回来\n\n⚠ 第二项 log(2|ℋ|/δ)/n **没法去掉**（Bernstein 里那个 ε/3 项的产物）\n   ⇒ 这条界永远至少有 1/n 这一项 ⇒ **1/n 是这类问题的下限，快率快不过它**\n\n文献里的几个名字（查资料会撞上，说的是同一件事）：\n   **一阶界**（first-order）· **小损失界**（small-loss）· **方差自适应界**（variance-adaptive）\n   = **当最优者本身表现很好时，界自动变紧**", "tbl": {"head": ["R(h<sub>*</sub>) 的大小", "第一项 √(2R(h<sub>*</sub>)log/n)", "第二项 log/n", "总速率", "退回哪条"], "rows": [["<b>= 0</b>", "<b>消失</b>", "<b>主导</b>", "<b>1/n（快）</b>", "<b>p10</b>"], ["<b>很小</b>", "<span class='w'>小</span>", "可比", "<b>介于两者</b>", "<span class='w'>（插值区）</span>"], ["<b>≈ 1</b>", "<b>主导</b>", "<span class='w'>可忽略</span>", "<b>1/√n（慢）</b>", "<b>p14</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页对你有一条很实在的用处：<b>你的界可以「自己变紧」，而且不需要你事先知道问题有多容易</b>。</b><br><span class='k'>把 <code>R(h_*)</code> 映射到你的设定，它对应的是<b>最优配置的那个「不确定性尺度」</b>——比如最优配置的 <code>G</code> 在各条 query 上的方差，或者（若你做的是「挑出所有满足约束的配置」）最优者的违约率</span>。<b>⇒ 若这个量小，界自动从 <code>1/√n</code> 升级到接近 <code>1/n</code>，<b>而算法一个字都不用改</b>。</b><br><b>为什么这对你特别有价值：<b>你报的是实测的界，而不是最坏情况的界</b>。</b> <span class='w'>最坏情况界（Hoeffding 那档）在论文里看着保险，但往往比实际松几倍，于是「理论需要 10 万次调用、实际 3000 次就够了」这种尴尬就出现了</span>。<b>⇒ 方差自适应的界能把这个差距收窄，让理论预测和实验曲线对得上——而这正是审稿人最喜欢看到的。</b><br><b>⚠ 但要先确认一件事：<b>Bernstein 要求你能界住方差，而你的 <code>G</code> 的方差未必好界</b>。</b> <span class='k'>这里之所以干净，是因为损失是 0/1 的，<code>Var = R(1−R)</code> 有闭式；<b>而你的 <code>G = Acc − λ·Cost</code> 是连续的</b></span>。<b>⇒ 两条出路：① 若 Acc 是逐 query 的 0/1 正确性，那它<b>就是</b>伯努利，方差同样有闭式；② Cost 那一半你知道上下界，可以用经验 Bernstein（用样本方差代替真方差，多付一个 <code>1/n</code> 项）。</b><br><b>⇒ 建议：<b>优先走第 ① 条</b>。</b> <span class='w'>把 Acc 保持成逐 query 的 0/1，不要先在 query 上平均再处理——平均会把伯努利结构弄丢，之后就只能用 Hoeffding 了</span>。<b>这是一个数据管线上的设计决定，而且做错了很难补救。</b><br><b>最后记一下这三个检索词，你一定会需要查文献：<b>first-order bound · small-loss bound · empirical Bernstein</b>。</b>", "ref": "本讲 p18（逐字核对）· p15（Var = R(1−R)）· p14 科研格 · 简报 §4b §4d（已核）"}},
{"r": [19, 20], "t": "无限类：三条出路，和它们共同的那件事", "star": 2, "quote": "〔红字〕<em><b>What if |ℋ| is <i>infinite</i> such as the space of all hyperplane classifiers?</b></em><br>〔蓝字〕<em>Lots of tools to address this:<br>- <b>minimum description length</b><br>- <b>VC-dimension and Rademacher complexity</b><br>- <b>Covering number / log-entropy bounds</b></em>", "one": "<b>前面所有界都靠 log|ℋ|，而 |ℋ| 无限时它就爆了。三条出路的共同做法是：找一个「有效的候选数」来替换 |ℋ|——因为无限多个假设里，真正互相区分得开的只有有限多个。</b>", "pts": ["<b>问题提得很具体：<b>所有超平面分类器</b>的集合是连续统，<code>|ℋ| = ∞</code>，于是 <code>log|ℋ| = ∞</code>，前面四条界<b>全部失效</b>。</b> <span class='k'>⚠ 注意失效的不是结论的精度，是结论本身——界变成了「<code>R(ĥ) ≤ ∞</code>」，什么都没说</span>。", "<b>但直觉上这不该是对的，而想清楚「为什么不该」正是三条出路的共同起点。</b> <span class='w'><code>ℝ^d</code> 里有无穷多个超平面，<b>但在 <code>n</code> 个固定的点上，它们只能产生有限多种标注方式</b></span>。<b>⇒ 两个超平面若在你这 <code>n</code> 个样本上给出完全相同的标注，对你的分析而言它们<b>就是同一个假设</b>。</b>", "<b>⇒ 所以真正该出现在界里的不是 <code>|ℋ|</code>，而是<b>「有效的候选数」</b>——在 <code>n</code> 个点上能区分出多少种不同的行为。</b> <span class='k'>这个数通常是 <code>n</code> 的<b>多项式</b>（而不是指数），于是 <code>log</code> 之后就是 <code>d·log n</code> 量级，完全可用</span>。", "<b><b>VC 维</b> 走的就是这条路，而它给的是最经典的结论。</b> <span class='w'>Sauer–Shelah 引理说：VC 维为 <code>d</code> 的类在 <code>n</code> 个点上最多产生 <code>O(n^d)</code> 种标注</span>；<b>⇒ 代进去 <code>log|ℋ| → d·log n</code>，于是界变成 <code>√(d log n/n)</code> 量级</b>。<span class='k'>而 <code>d</code> 维超平面的 VC 维正好是 <code>d+1</code>。</span>", "<b><b>覆盖数 / log-熵</b> 是同一思路的连续版本，也是三条里最通用的。</b> <span class='k'>做法：在 <code>ℋ</code> 上定义一个距离，问「要多少个球才能把 <code>ℋ</code> 盖住到 <code>ε</code> 精度」，那个数的 <code>log</code> 就替换 <code>log|ℋ|</code></span>。<b>⇒ 对你有用的是：<b>它不要求假设类是 0/1 的，连续值的类也能处理</b>。</b>", "<b><b>Rademacher 复杂度</b> 换了个角度：不数候选，而是直接问「这个类能多好地拟合<b>纯噪声</b>」。</b> <span class='w'>给每个样本一个随机的 ±1 标签，看类里最好的假设能拟合到什么程度</span>；<b>⇒ 拟合噪声的能力越强，过拟合风险越大，界越松。</b><span class='k'>好处是它<b>依赖具体的数据分布</b>，所以往往比 VC 维紧。</span>", "<b><b>最小描述长度</b>（MDL）是最不一样的一条：它给每个假设分配一个<b>编码长度</b>，复杂的假设编码长。</b> <span class='k'>界里出现的是 <code>编码长度</code> 而不是 <code>log|ℋ|</code>，相当于给每个假设一个<b>非均匀的先验</b></span>。<b>⇒ ⚠ 这条对你最有启发：<b>并集界不一定要均匀地分 <code>δ</code></b>。</b>", "<b>那个「非均匀分配」的想法值得展开一句，因为它是一个你可能真的用得上的技巧。</b> <span class='w'>标准并集界把 <code>δ</code> 平均分给 <code>|ℋ|</code> 个候选，每个得 <code>δ/|ℋ|</code>；但你可以分得不均匀——给你更看好的候选多分一点，代价是别的候选少分</span>。<b>⇒ 只要 <code>Σ_h δ_h ≤ δ</code> 就合法，而这就是 MDL 和 PAC-Bayes 的核心。</b>", "<b>⚠ 最后提醒一句边界：<b>本门课后面不会用到这三条</b>。</b> <span class='k'>老虎机那部分的「候选集」是臂的集合，通常是有限的或者有线性结构（L07/L10/L12 的 <code>d</code> 维参数）</span>；<b>⇒ 所以这一页是「知道有这回事」的性质，真要用时去查 Lattimore &amp; Szepesvári 或任何一本统计学习理论的教材。</b>"], "eq": "问题：所有超平面分类器的集合是连续统 ⇒ |ℋ| = ∞ ⇒ log|ℋ| = ∞\n   ⚠ 前面四条界**全部失效** —— 失效的不是精度，是结论本身\n     界变成「R(ĥ) ≤ ∞」，什么都没说\n\n但直觉上不该如此（三条出路的共同起点）：\n   ℝ^d 里有无穷多超平面，**但在 n 个固定的点上，它们只能产生有限多种标注**\n   两个超平面若在这 n 个样本上标注完全相同，对分析而言**就是同一个假设**\n   ⇒ 真正该出现在界里的是**「有效的候选数」**\n     通常是 n 的**多项式**（非指数）⇒ log 之后 ≈ d·log n，完全可用\n\n**① VC 维**（最经典）：\n   Sauer–Shelah：VC 维为 d 的类在 n 个点上最多产生 O(n^d) 种标注\n   ⇒ log|ℋ| → **d·log n** ⇒ 界变成 sqrt( d·log n / n ) 量级\n   （d 维超平面的 VC 维正好是 d+1）\n\n**② 覆盖数 / log-熵**（同一思路的连续版，三条里最通用）：\n   在 ℋ 上定义距离，问「多少个球能把 ℋ 盖到 ε 精度」，那个数的 log 替换 log|ℋ|\n   ⇒ 好处：**不要求假设类是 0/1 的，连续值也能处理**\n\n**③ Rademacher 复杂度**（换角度：不数候选）：\n   直接问「这个类能多好地拟合**纯噪声**」\n   给每个样本一个随机 ±1 标签，看类里最好的假设能拟合到什么程度\n   拟合噪声能力越强 ⇒ 过拟合风险越大 ⇒ 界越松\n   好处：**依赖具体数据分布**，往往比 VC 维紧\n\n**④ 最小描述长度 MDL**（最不一样的一条）：\n   给每个假设一个**编码长度**，复杂的假设编码长\n   界里出现编码长度而不是 log|ℋ| = 给每个假设一个**非均匀的先验**\n\n   ⚠ 这条最有启发：**并集界不一定要均匀地分 δ**\n     标准做法：δ 平均分给 |ℋ| 个候选，每个 δ/|ℋ|\n     但可以不均匀 —— 看好的候选多分一点，别的少分\n     **只要 Σ_h δ_h ≤ δ 就合法** ⇒ 这就是 MDL 和 PAC-Bayes 的核心\n\n⚠ 边界：**本门课后面不会用到这三条**\n   老虎机的「候选集」是臂的集合，通常有限或有线性结构（L07/L10/L12 的 d 维参数）\n   ⇒ 这一页是「知道有这回事」；真要用去查 Lattimore & Szepesvári 或统计学习理论教材", "tbl": {"head": ["出路", "用什么替换 log|ℋ|", "核心想法", "对你有用吗"], "rows": [["<b>VC 维</b>", "<b>d·log n</b>", "n 个点上只有有限种标注", "<span class='w'>间接</span>"], ["<b>覆盖数 / log-熵</b>", "<b>log N(ε)</b>", "用 ε-球把类盖住", "<b>能处理连续值</b>"], ["<b>Rademacher</b>", "<b>ℜ<sub>n</sub>(ℋ)</b>", "能多好地拟合纯噪声", "<span class='w'>依赖分布，更紧</span>"], ["<b>MDL</b>", "<b>编码长度</b>", "<b>δ 可以非均匀地分</b>", "<b>是（见右）</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页里真正能搬到你问题上的是 MDL 那条，而它其实是一个很简单的技巧：<b>并集界的 <code>δ</code> 不必均匀分配</b>。</b><br><span class='k'>标准做法把 <code>δ</code> 平分给 <code>|𝒳|</code> 个配置，每个得 <code>δ/|𝒳|</code>，于是界里出现 <code>log|𝒳|</code>。但合法性的全部要求只是 <b><code>Σ_x δ_x ≤ δ</code></b></span>。<b>⇒ 你可以给「先验上更可能好」的配置分更多的 <code>δ</code>（界更紧），给不太可能的分少一点。</b><br><b>而你恰好<b>有</b>这样一个先验，这是关键</b>：<span class='w'>配置是「每个节点选哪个档位」，而<b>偏离基线越少的配置越可能是好的</b>（成本低且准确率接近）</span>。<b>⇒ 一个自然的分配：按偏离基线的节点数 <code>k</code> 给权重，比如 <code>δ_x ∝ 2^{-k}/C(H,k)</code>。</b><span class='k'>于是「只改 1 个节点」的那 <code>H</code> 个配置各自拿到的 <code>δ</code> 比「改 10 个节点」的配置大得多，前者的区间会明显更紧。</span><br><b>⇒ 效果是：<b>你最关心、也最可能选中的那些配置，得到更紧的界</b>，而代价由那些你本来就不看好的配置承担。</b> <span class='w'>总的 <code>δ</code> 预算没变，保证仍然成立。</span><br><b>⚠ 两条要注意的：</b><br><b>① <b>先验必须事先定好，不能看了数据再定</b></b>——<span class='k'>这是整个技巧合法性的唯一前提，违反了就是 p 值操纵</span>。<b>所以要在预注册/方法一节里把分配规则写死。</b><br><b>② <b>别指望它改变阶</b></b>。<span class='w'>这个技巧改善的是<b>常数和 <code>log</code> 里的那个数</b>，不会把 <code>√n</code> 变成 <code>n</code></span>；<b>而对你来说 <code>log|𝒳| = H log2</code> 本来就不大（p10 科研格算过），所以收益有限。</b><br><b>⇒ 结论：这是一条「锦上添花、写起来漂亮」的技巧，值得知道，但<b>不该</b>是你方法的主线。主线仍然是线性结构 + 最优设计。</b>", "ref": "本讲 p20（逐字核对）· p10 科研格 · p11（并集界）· L07 p5 · 简报 §4c（已核）"}},
{"r": [21, 24], "t": "转折点：把独立同分布这条假设摘掉", "star": 3, "quote": "〔p22 蓝字，本讲的转折点〕<em><b>All the guarantees of the previous section (and the entirety of this class so far) has relied <u>critically</u> on (x,y) being drawn IID. Can we say anything if (x,y) are chosen <b>adversarially</b>?</b></em><br>〔p24 印刷体协议〕<em>Input: ℋ with |ℋ| &lt; ∞<br>for t = 1,2,…<br>&nbsp;&nbsp;x<sub>t</sub> arrives<br>&nbsp;&nbsp;Player picks h<sub>t</sub> ∈ ℋ<br>&nbsp;&nbsp;y<sub>t</sub> is revealed<br>&nbsp;&nbsp;Player receives loss ℓ(h<sub>t</sub>,(x<sub>t</sub>,y<sub>t</sub>)) = <b>1</b>{h<sub>t</sub>(x<sub>t</sub>) ≠ y<sub>t</sub>}</em><br>〔橙框〕<em><b>Goal: Minimize mistakes &nbsp; Σ<sub>t=1</sub><sup>T</sup> 1{h<sub>t</sub>(x<sub>t</sub>) ≠ y<sub>t</sub>}</b></em><br>〔两种设定〕<em><b>IID</b> (x<sub>t</sub>,y<sub>t</sub>) ∼ ν &nbsp;·&nbsp; <b>Adversarial</b> (x<sub>t</sub>,y<sub>t</sub>) arbitrary</em>", "one": "<b>前半讲所有的界都压在「数据独立同分布」这一条上。这一页把它摘掉，然后问：还能证出什么吗？——答案是能，而且不比原来差多少。</b>", "pts": ["<b>p22 是全讲的枢纽，而它的做法很直白：<b>把前面那条定理原样重贴一遍，然后把 <code>iid ∼ ν</code> 那几个字用黄色高亮</b>。</b> <span class='k'>配的蓝字是：「前一节的全部保证（以及这门课到目前为止的全部内容）<b>关键地</b>依赖于 (x,y) 是独立同分布抽取的。如果 (x,y) 是<b>对抗地</b>选出来的，我们还能说点什么吗？」</span>", "<b>注意措辞里那个 <code>critically</code>（关键地）——它不是修辞。</b> <span class='w'>p11 的证明里，独立同分布<b>只</b>用在一处：「固定 <code>h</code> 时，n 个样本全对的概率 <code>≤ (1−ε)^n</code>」那一步的连乘</span>。<b>⇒ 去掉独立性，那一步就塌了，整条界跟着塌。不是常数变差，是论证断掉。</b>", "<b>p23 用一张垃圾邮件过滤器的漫画解释了为什么要关心这件事，而这个例子选得很准。</b> <span class='k'>图上有两个发信方：<b>垃圾邮件发送者</b>（恶魔）和<b>正常邮件</b>（邮差）；邮件 <code>x_t</code> 进入分类器，输出 <code>ŷ_t</code>，再反馈回来</span>。<b>⇒ 垃圾邮件发送者会<b>主动适应</b>你的过滤器——他看到自己被拦了就换写法。</b><span class='w'>这种数据天然不是独立同分布的，而且不是「近似不是」，是根本性地不是。</span>", "<b>p24 给出的协议要逐行看清，因为后面每个算法都在这个框架里。</b> <span class='k'>每一轮：<b>先</b>看到 <code>x_t</code>，<b>再</b>选假设 <code>h_t</code>，<b>然后</b>才揭晓 <code>y_t</code></span>。<b>⇒ 顺序很要紧：你是在知道问题、但不知道答案的情况下作答。</b>", "<b>⚠ 一处容易看错的地方：<b>玩家每轮选的是一个<b>假设</b> <code>h_t ∈ ℋ</code>，不是直接给一个预测</b>。</b> <span class='w'>两者等价（选了 <code>h_t</code> 就等于预测 <code>h_t(x_t)</code>），但写成选假设更方便分析——因为 <code>h_t</code> 必须在看到 <code>x_t</code> 之后、<code>y_t</code> 之前确定</span>。", "<b>目标也变了，而这个变化比看上去大：<b>不再是「泛化误差小」，而是「犯错的<b>总次数</b>少」</b>。</b> <span class='k'><code>Σ_{t=1}^T 1{h_t(x_t) ≠ y_t}</code>——这是一个<b>累计</b>量，而且<b>每一轮的错都算数</b></span>。<b>⇒ 前半讲是「训练完之后部署，只关心最终那个分类器好不好」；这里是「边学边用，学习过程中犯的错也要付代价」。</b>", "<b>这个区别对你的课题正好是两种场景的分界，值得对号入座。</b> <span class='w'><b>离线筛选</b>（你的主线）更像前半讲：评估阶段跑错配置不心疼，只关心最后选出来的那个好不好；<b>线上部署</b>才像这里：每一次调用都真的在服务用户</span>。<b>⇒ 两者该用的算法不同，这一点在 L14 和 L10 的主线卡里都强调过。</b>", "<b>最后，<code>Settings of interest</code> 那两行把后面的结构定下来了：<b>同一个协议，问两遍</b>。</b> <span class='k'><b>IID</b>：<code>(x_t,y_t) ∼ ν</code>；<b>Adversarial</b>：<code>(x_t,y_t)</code> 任意</span>。<b>⇒ 接下来 p25–p27 做独立同分布那一格，p28–p33 做对抗那一格，而对比的结果相当戏剧化。</b>", "⚠️ <b>还有一条贯穿 p25–p33 的隐含假设必须记住：<b><code>y_t = h_*(x_t)</code></b>（可实现 / 可分）。</b> <span class='w'>也就是说<b>存在一个完美的假设</b>，只是你不知道是哪个</span>。<b>⇒ 这一段讨论的是「犯错数」而不是「遗憾」，正因为有完美假设存在，「犯错数」才是个有意义的指标（否则最好的假设自己也会犯错，你永远降不到 0）。</b><span class='k'>p35 之后去掉这条假设，目标就必须改成遗憾。</span>"], "eq": "p22（全讲枢纽）：把前面的定理原样重贴，把 `iid ∼ ν` 用黄色高亮，配蓝字：\n   **「前一节的全部保证（以及这门课到目前为止的全部内容）关键地依赖于\n     (x,y) 是独立同分布抽取的。如果 (x,y) 是对抗地选出来的，我们还能说点什么吗？」**\n\n   ⚠ `critically` 不是修辞：p11 的证明里 i.i.d. **只**用在一处 ——\n     「固定 h 时，n 个样本全对的概率 ≤ (1−ε)^n」那一步的**连乘**\n     去掉独立性那一步就塌 ⇒ **不是常数变差，是论证断掉**\n\np23 垃圾邮件过滤器漫画（例子选得准）：\n   垃圾邮件发送者（恶魔）+ 正常邮件（邮差）→ x_t → 分类器 → ŷ_t → 反馈\n   ⇒ 发送者会**主动适应**你的过滤器：被拦了就换写法\n     这种数据**根本性地**不是 i.i.d.，不是「近似不是」\n\n**p24 协议**（后面每个算法都在这框架里）：\n   for t = 1,2,…\n     **先**看到 x_t  →  **再**选假设 h_t ∈ ℋ  →  **然后**才揭晓 y_t\n     损失 ℓ(h_t,(x_t,y_t)) = 1{h_t(x_t) ≠ y_t}\n   ⇒ 顺序要紧：在**知道问题、不知道答案**的情况下作答\n\n   ⚠ 玩家选的是一个**假设** h_t，不是直接给预测\n     两者等价，但写成选假设更方便分析\n\n**目标**（橙框）：Minimize mistakes **Σ_{t=1}^T 1{h_t(x_t) ≠ y_t}**\n   这个变化比看上去大：不再是「泛化误差小」，而是「犯错**总次数**少」\n   是**累计**量，而且**每一轮的错都算数**\n   前半讲 = 训练完部署，只关心最终那个分类器\n   这里   = 边学边用，**学习过程中犯的错也要付代价**\n\n   对号入座：**离线筛选**（你的主线）像前半讲；**线上部署**才像这里\n\n两种设定（后面的结构）：\n   **IID**         (x_t,y_t) ∼ ν        ← p25–p27\n   **Adversarial** (x_t,y_t) arbitrary  ← p28–p33\n\n⚠⚠ 贯穿 p25–p33 的隐含假设：**y_t = h_*(x_t)**（可实现 / 可分）\n   = **存在一个完美的假设**，只是你不知道是哪个\n   ⇒ 正因为有完美假设，「犯错数」才是有意义的指标（否则永远降不到 0）\n     p35 之后去掉它，目标就必须改成**遗憾**", "tbl": {"head": ["", "前半讲（泛化界 p8–20）", "本块（在线学习 p21–34）"], "rows": [["数据怎么来", "<b>独立同分布</b>", "<b>i.i.d. 或任意（两种都做）</b>"], ["学习方式", "<span class='w'>先给 n 个样本，再学</span>", "<b>边来边学，每轮一个</b>"], ["关心什么", "<b>最终那个 ĥ 的真实风险</b>", "<b>全程犯错的总次数</b>"], ["学习中的错算不算", "<span class='w'>不算</span>", "<b>算</b>"], ["对应你的场景", "<b>离线筛选（主线）</b>", "<span class='w'>线上部署</span>"]]}, "link": {"t": "你学过的对应：本课 L14 精读（EXP3）—— 那一讲的 p1 把「健忘对手」讲透了，正是这里 Adversarial 那一行的精确含义", "href": "L14-精读.html"}},
{"r": [25, 27], "t": "独立同分布下：跟随领先者就够了，犯错数只按 log(T)·log(|ℋ|) 长", "star": 3, "quote": "〔p25 黄色高亮〕<em><b>We know learning theory! Choose h<sub>t</sub> ∈ arg min<sub>h∈ℋ</sub> Σ<sub>s=1</sub><sup>t−1</sup> 1{h(x<sub>s</sub>) ≠ y<sub>s</sub>}</b></em><br>〔p26 推论〕<em>𝔼[R(ĥ)] ≤ ∫<sub>ϵ=0</sub><sup>d</sup> ℙ(R(ĥ) ≥ ϵ) ≤ 2 log(|ℋ|)/n</em><br>〔p27 橙框〕<em>𝔼[ Σ<sub>t=1</sub><sup>T</sup> 1{h<sub>t</sub>(x<sub>t</sub>) ≠ y<sub>t</sub>} ] ≤ 1 + Σ<sub>t=2</sub><sup>T</sup> 𝔼[ℙ(h<sub>t</sub>(x<sub>t</sub>) ≠ y<sub>t</sub>)]</em><br><em>&nbsp;≤ 1 + Σ<sub>t=2</sub><sup>T</sup> 𝔼[R(h<sub>t</sub>)] ≤ 1 + Σ<sub>t=2</sub><sup>T</sup> 2log(|ℋ|)/(t−1) ≤ <b>2 + 2 log(|ℋ|) log(T)</b></em><br>〔红字〕<em><b># of mistakes grows only logarithmically!</b></em>", "one": "<b>策略朴素到不像话：每一轮就用过去全部数据做一次 ERM。而它之所以够用，是因为第 t 轮时你已经有 t−1 个样本，泛化界给出的错误率是 2log|ℋ|/(t−1)——求和就是一个调和和。</b>", "pts": ["<b>p25 那句黄色高亮的口气值得注意：<b>「我们懂学习理论！」</b>——老师在这里是认真的，前半讲那套工具直接就能用。</b> <span class='k'>策略是 <code>h_t ∈ argmin_{h∈ℋ} Σ_{s=1}^{t−1}1{h(x_s) ≠ y_s}</code>：<b>拿过去全部 <code>t−1</code> 个样本做一次 ERM</b></span>。<b>⇒ 这个策略有个通用名字叫<b>跟随领先者</b>（Follow The Leader, FTL）。</b>", "<b>它为什么在独立同分布下够用？因为每一轮你手上的数据量都在涨，而泛化界会自动跟着变紧。</b> <span class='w'>第 <code>t</code> 轮时你有 <code>t−1</code> 个样本，p13 那条推论直接给出 <code>E[R(h_t)] ≤ 2log|ℋ|/(t−1)</code></span>。<b>⇒ 这就是 p26 把那条推论重贴一遍的原因。</b>", "<b>p27 那四行推导要逐行跟，因为每一步都有一个明确的理由。</b> <span class='k'><b>第一行</b>：第 1 轮没有任何数据，最多犯 1 次错，所以单独拎出来写成 <code>1 +</code>，从 <code>t=2</code> 开始求和</span>。", "<b><b>第二行</b> <code>E[1{h_t(x_t)≠y_t}] = E[P(h_t(x_t)≠y_t)]</code> 用的是<b>塔性质</b>（先对 <code>x_t</code> 取条件期望）。</b> <span class='w'>⚠ 这一步是独立同分布<b>必需</b>的：它要求 <code>x_t</code> 与 <code>h_t</code> 独立——而 <code>h_t</code> 只依赖前 <code>t−1</code> 个样本，<code>x_t</code> 是新抽的，所以成立</span>。<b>⇒ 对抗设定下这一步直接废掉，这正是下一块崩溃的根源。</b>", "<b><b>第三行</b> <code>P(h_t(x_t)≠y_t) = R(h_t)</code> 只是真实风险的定义；<b>第四行</b>代入推论得 <code>2log|ℋ|/(t−1)</code>。</b>", "<b>最后一步是<b>调和和</b>，而这是 <code>log T</code> 的唯一来源。</b> <span class='k'><code>Σ_{t=2}^T 1/(t−1) = Σ_{s=1}^{T−1}1/s ≤ 1 + log T</code></span>；<b>⇒ 乘上 <code>2log|ℋ|</code> 得 <code>2 + 2log(|ℋ|)log(T)</code>。</b><span class='w'>（L14 p3 里 MAB 那个 <code>d log T</code> 用的是同一个调和和，可以对照着看。）</span>", "<b>红字那句「犯错数只按<b>对数</b>增长」值得停一下感受数量级。</b> <span class='k'><code>|ℋ| = 10^6</code>、<code>T = 10^6</code> 时，界给的是 <code>2 + 2×13.8×13.8 ≈ 383</code> 次</span>。<b>⇒ 一百万轮里只犯三百多次错，而且<b>再跑一百万轮也只多犯几十次</b>——因为 <code>log T</code> 增长极慢。</b>", "<b>这个结论的物理含义值得说清：<b>错误几乎全部发生在早期</b>。</b> <span class='w'><code>t</code> 大的时候单轮错误率是 <code>2log|ℋ|/(t−1)</code>，已经小到可以忽略</span>；<b>⇒ 「学习」这件事在前几十轮就基本完成了，后面只是在兑现。</b>", "⚠️ <b>但要记住这整块的两个前提，它们在下一块都会被拿掉：<b>① 独立同分布（第二行用到）；② 存在完美假设 <code>y_t = h_*(x_t)</code>（p13 推论的前提）</b>。</b> <span class='k'>两条缺一条，这个论证就不成立</span>。<b>⇒ 而下一块只拿掉第 ①，结果就已经是灾难性的。</b>"], "eq": "**策略**（p25 黄色高亮）：h_t ∈ arg min_{h∈ℋ} Σ_{s=1}^{t−1} 1{h(x_s) ≠ y_s}\n   = 拿过去全部 t−1 个样本做一次 ERM\n   通用名字：**跟随领先者**（Follow The Leader, FTL）\n\n为什么在 i.i.d. 下够用：每轮数据量在涨，泛化界自动跟着变紧\n   第 t 轮手上有 t−1 个样本 ⇒ p13 推论给 **E[R(h_t)] ≤ 2log|ℋ|/(t−1)**\n   （p26 把那条推论重贴一遍，就是为了这个）\n\n**p27 四行推导**（每步一个理由）：\n   E[ Σ_{t=1}^T 1{h_t(x_t)≠y_t} ]\n     ≤ 1 + Σ_{t=2}^T E[ P(h_t(x_t)≠y_t) ]      ① 第 1 轮无数据，最多错 1 次，单独拎出\n                                               ② **塔性质**（先对 x_t 取条件期望）\n     ≤ 1 + Σ_{t=2}^T E[ R(h_t) ]               ③ 真实风险的定义\n     ≤ 1 + Σ_{t=2}^T 2log(|ℋ|)/(t−1)           ④ 代入推论，n = t−1\n     ≤ **2 + 2·log(|ℋ|)·log(T)**                ⑤ **调和和**\n\n   ⚠ 第 ② 步是 i.i.d. **必需**的：要求 x_t 与 h_t 独立\n     h_t 只依赖前 t−1 个样本，x_t 是新抽的 ⇒ 成立\n     **对抗设定下这一步直接废掉** —— 下一块崩溃的根源\n\n   ⑤ 调和和是 log T 的**唯一**来源：\n     Σ_{t=2}^T 1/(t−1) = Σ_{s=1}^{T−1} 1/s ≤ 1 + log T\n     （L14 p3 里 MAB 那个 d·log T 用的是同一个调和和）\n\n红字：**# of mistakes grows only logarithmically!**\n   感受数量级：|ℋ| = 10⁶、T = 10⁶ ⇒ 2 + 2×13.8×13.8 ≈ **383 次**\n   一百万轮只错三百多次，**再跑一百万轮也只多犯几十次**（log T 增长极慢）\n\n物理含义：**错误几乎全部发生在早期**\n   t 大时单轮错误率 2log|ℋ|/(t−1) 已可忽略\n   ⇒「学习」在前几十轮就基本完成，后面只是在兑现\n\n⚠ 这整块的两个前提（下一块都会被拿掉）：\n   ① **独立同分布**（第 ② 步用到）\n   ② **存在完美假设** y_t = h_*(x_t)（p13 推论的前提）\n   ⇒ 下一块只拿掉 ①，结果就已经是灾难性的", "tbl": {"head": ["p27 的推导步骤", "靠什么", "拿掉 i.i.d. 后还成立吗"], "rows": [["1 + Σ<sub>t≥2</sub>（第 1 轮单列）", "<span class='w'>第 1 轮无数据</span>", "<b>成立</b>"], ["<b>E[1{·}] = E[ℙ(·)]</b>", "<b>塔性质（x<sub>t</sub> 与 h<sub>t</sub> 独立）</b>", "<b>⚠ 废掉</b>"], ["ℙ(h<sub>t</sub>(x<sub>t</sub>)≠y<sub>t</sub>) = R(h<sub>t</sub>)", "<span class='w'>定义</span>", "<b>⚠ R(·) 无定义</b>"], ["≤ 2log|ℋ|/(t−1)", "<b>p13 推论</b>", "<b>⚠ 废掉</b>"], ["≤ 2 + 2log|ℋ|log T", "<b>调和和</b>", "<span class='w'>（纯代数，成立）</span>"]]}},
{"r": [28, 30], "t": "对抗下：同一个策略会犯 min{|ℋ|, T} 次错", "star": 3, "quote": "〔p29〕<em>We know learning theory! Choose h<sub>t</sub> ∈ arg min<sub>h∈ℋ</sub> Σ<sub>s=1</sub><sup>t−1</sup> 1{h(x<sub>s</sub>) ≠ y<sub>s</sub>} <b><span style='color:#c00'>?</span></b></em><br>〔p30 红框〕<b>Claim</b> <em>There exists a sequence {(x<sub>t</sub>,y<sub>t</sub>)}<sub>t=1</sub><sup>T</sup> and ĥ<sub>t</sub> ∈ arg min<sub>h∈ℋ</sub> Σ<sub>s=1</sub><sup>t−1</sup> 1{h(x<sub>s</sub>) ≠ y<sub>s</sub>} such that the strategy makes <b>min{|ℋ|, T}</b> mistakes.</em><br>〔红字提示〕<em>Hint: many classifiers achieve minimum, assume adversary knows your tie-breaking strategy</em>", "one": "<b>上一块那句「我们懂学习理论！」原样重贴，只在末尾加了一个红色问号。答案是：同一个策略，在对抗下会把 log 换成线性——这是能想象到的最糟的退化。</b>", "pts": ["<b>p28/p29 把上一块的幻灯片原样重贴，只改了两处：设定从 <code>IID</code> 换成 <code>Adversarial</code>，句末多了一个<b>红色问号</b>。</b> <span class='k'>⚠ 注意 <code>y_t = h_*(x_t)</code> 这条<b>仍然保留</b>——所以失败<b>不是</b>因为没有完美假设，而<b>纯粹</b>是因为数据不是独立同分布的</span>。<b>⇒ 这个控制变量设计得很干净，值得留意。</b>", "<b>p30 给出的答案是 <code>min{|ℋ|, T}</code> 次错误，而这个数的含义要说透。</b> <span class='w'><code>T < |ℋ|</code> 时它就是 <code>T</code>——<b>每一轮都错</b>，策略完全没有学到任何东西</span>。<b>⇒ 对比上一块的 <code>2log|ℋ|log T</code>（<code>|ℋ|=T=10^6</code> 时约 383 次），这里是 <b>100 万次</b>。</b>", "<b>构造的关键在那条红字提示里，而它指向一个很容易被忽略的细节：<b>平局</b>。</b> <span class='k'>「<b>很多分类器都达到最小值</b>，假设对手知道你打破平局的策略」</span>——<b>⇒ 回想 p9 那条：幻灯片写的是 <code>ĥ ∈ argmin</code> 而不是 <code>=</code>，因为 argmin 是一个<b>集合</b>。</b>", "<b>构造的思路可以这样想：<b>对手让你永远处在平局状态，然后专挑你会选的那一个来打</b>。</b> <span class='w'>开局时所有 <code>h ∈ ℋ</code> 的经验错误都是 0，全部并列第一；你按某个规则挑了 <code>h_1</code>，对手就构造 <code>(x_1,y_1)</code> 使 <code>h_1</code> 错、而其余的对</span>。<b>⇒ 于是你错了一次，而 <code>h_1</code> 被淘汰出领先集合。</b>", "<b>下一轮同样的事情再来一遍：剩下的假设仍然全部并列（经验错误都是 0），你挑了 <code>h_2</code>，对手让 <code>h_2</code> 错。</b> <span class='k'>⇒ 每一轮<b>恰好淘汰一个</b>假设，而你每一轮都<b>错一次</b></span>。<b>⇒ 这样一直进行到只剩 <code>h_*</code>，总共错了 <code>|ℋ|−1</code> 次（或者 <code>T</code> 次，若 <code>T</code> 更小先用完）。</b>", "<b>看出问题出在哪了：<b>FTL 每次只排除<b>一个</b>假设，而它
