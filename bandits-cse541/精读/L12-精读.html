<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSE541 第 12–13 讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cse541-l12">

<div id="bar">
  <h1>CSE541 第 12–13 讲 · <span>鞅型置信界 · 混合法（续）</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 13</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../corpus/slides/lecture_12.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>bandits-cse541</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/L12-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "臂集不可数时，覆盖论证怎么把无穷变成有限？代价为什么不致命？", "o": ["降维到 d'<d；代价是信息损失", "用随机采样近似 sup；代价是方差", "只取有限个臂，忽略其余；代价是有偏", "用 (3/ε)ᵈ 个点把单位球面铺满到 ε 精度，对这些点用并集界；而界里出现的是 log|C| = d·log(3/ε)，取对数后维数只是线性"], "a": 3, "why": "<b>覆盖的指数大小不致命，正是因为界里出现的是 log。</b><span class='k'>而拆分出来的残差项 ε‖θ̂−θ*‖_A 里又出现了要估的量本身——这个自指下一页靠移项解开。</span>"}],
2: [{"q": "σ-代数的三条性质，在「信息」这个解读下分别是什么意思？", "o": ["是纯技术要求，没有直观含义", "对应期望的线性性", "σ-代数是「信息」的化身：事件在 𝓕_t 里 = 到第 t 步你已能判断它发没发生；补封闭 = 能判断 A 发生就能判断 A 没发生；可数并封闭 = 能判断每个 A_n 就能判断「至少一个发生」", "对应概率的三条公理"], "a": 2, "why": "<b>没有这个解读，后面「滤流 = 知道的越来越多」就是一句空话。</b><span class='w'>而概率测度的「可数可加」（不是有限可加）是后面「对所有 t∈ℕ 同时成立」那类陈述的基础。</span>"}],
3: [{"q": "连续情形下条件期望为什么不能用 P(Y,X)/P(X) 定义？替代定义的直观是什么？", "o": ["因为 P(X=x)=0，分母是零；替代定义把条件期望定成一个函数 g，要求它在 σ(X) 的每个事件上与 Y 积分相等 —— 即 g 是 Y 在 σ(X) 上的投影", "因为 Y 可能不可测；替代定义用可测包络", "因为积分不收敛；替代定义用极限", "因为 X 可能无界；替代定义用截断"], "a": 0, "why": "<b>「投影」这个读法顺带解释了塔性质 E[E[Y|X]] = E[Y]——投影不改变总量。</b><span class='k'>⚠ 而定义里那个「any function satisfying」意味着条件期望不唯一，只是几乎处处相等——这解释了教科书里到处是「a.s.」。</span>"}],
4: [{"q": "上鞅（supermartingale）的定义是哪个方向？怎么记才不会反？", "o": ["E[X_{t+1}|𝓕_t] ≤ X_t，期望往下走；记法是「上鞅被初值从上面压住」——「上」指界在上面，不是走势", "取决于是否非负", "E[X_{t+1}|𝓕_t] ≥ X_t；名字和方向一致", "E[X_{t+1}] = E[X_t]；没有方向"], "a": 0, "why": "<b>本讲全程用上鞅，因为我们要的是上界</b>：期望只会变小 ⇒「它曾经变得很大」的概率就很小 ⇒ 极大不等式。<span class='w'>而那个乘积鞅的反例值得记：E[X_t] 恒为 1，但它几乎必然趋于 0——鞅的期望恒定不代表轨迹不塌。</span>"}],
5: [{"q": "Π exp(λε_s) 是下鞅。减掉什么就变成上鞅？为什么能这么减？", "o": ["减掉 S_t；因为要中心化", "每项减掉 λ²/2（即 exp(λS_t − tλ²/2)）；因为那个漂移 e^{λ²/2} 是确定的、已知的、不依赖数据", "减掉方差；因为要标准化", "减掉 log t；因为要校正时间"], "a": 1, "why": "<b>这一个表达式是后面所有结果的发动机</b>（随时有效界、混合法、可预测方差版、向量版、LinUCB 椭球全是它的变形）。<span class='k'>而它好用的理由是：它把「尾概率」变成了「期望」——这就是 Chernoff 方法的鞅版本。</span>"}],
6: [{"q": "τ = min{t : S_t ≥ ε} 是停时，τ = max{t : S_t ≥ ε} 不是。区别在哪？这条在实践中怎么被违反？", "o": ["前者有限后者可能无穷", "停的决定只能依赖已看到的数据：第一次越过当场就知道，最后一次越过要走完全程才知道；实践中「跑完全部实验再回头找最早分出胜负的时刻」就违反了", "前者可测后者不可测，但都是停时", "前者是整数后者不是"], "a": 1, "why": "<span class='w'>违反之后所有保证失效，而且报出来的样本复杂度会系统性偏小。</span>⚠ Doob 可选停止还需要前提（停时有界，或 E[τ]<∞ 且增量一致有界）——「一直赌到赢一次为止」正是钻这个空子。"}, {"q": "极大不等式相比马尔可夫不等式强在哪？代价是多少？", "o": ["强在适用于连续时间；代价是要求连续性", "强在它控住整条轨迹的最大值（而马尔可夫只控某一个固定时刻），而右边的代价一模一样 —— 「对所有 t 同时成立」是免费的", "强在不需要非负；代价是只对鞅成立", "强在常数更小；代价是要求独立"], "a": 1, "why": "<b>这是整讲最关键的那个「免费」。</b><span class='k'>直觉：上鞅的期望只会往下走，要想在某刻变得很大，必须先「借」到足够期望，而初值的期望把总量卡死了。</span>⚠ 下鞅版只能取到 n，因为它的期望在涨。"}],
7: [{"q": "P(∃t : S_t ≥ tλ/2 + (1/λ)log(1/δ)) ≤ δ。这条界的三个要点是什么？", "o": ["① 它是下界；② 右端是 √t；③ λ 可以随时间变", "它只在 t=n 成立；右端是常数；λ 由数据决定", "① 它需要高斯；② 右端是 log t；③ λ 由 δ 决定", "① ∃t —— 对所有 t 同时成立；② 右端是 t 的线性函数（斜率 λ/2、截距 (1/λ)log(1/δ)）；③ λ 是你自己事先挑的"], "a": 3, "why": "<b>几何上：你在随机游走上方画一条直线，整条轨迹被它罩住。</b><span class='w'>而 λ 的取舍是——大则早期紧晚期松，小则反之；一条直线不可能处处最紧，只能挑一个最关心的时刻调到最优。</span>"}],
8: [{"q": "取 λ = √(2log(1/δ)/n) 之后，这条直线界与固定时刻 Chernoff 比，差在哪？", "o": ["右端一模一样（都是 √(2n log(1/δ))），但左边 Chernoff 只管 t=n 这一个时刻，而它管 t=1..n 的最大值 —— 「随时有效」在这里一分钱没多花", "两者完全等价", "右端小一半，所以更好", "右端大一倍"], "a": 0, "why": "<b>这不是近似相同，是同一个数。</b><span class='k'>所以「边跑边看、随时可能停」在正确构造下不花钱——整讲最值得带走的一条。</span>而混合法要解决的是它的剩余局限：必须事先挑 λ（= 事先猜 n）。"}, {"q": "混合法为什么可行？它的精神是什么？", "o": ["因为上鞅的混合还是上鞅（交换积分与条件期望，再逐个用上鞅性质）；精神是「与其在多个候选间做并集界（付 log 个数），不如对它们取平均（付更小的代价）」", "因为高斯积分有闭式；精神是共轭先验", "因为 λ 可以优化；精神是梯度下降", "因为 λ 的分布可以任意；精神是贝叶斯"], "a": 0, "why": "<b>M̄_t 也是非负上鞅、M̄_0 = 1，所以极大不等式照用。</b><span class='w'>而它对应的边界不再是直线——因为 M̄_t 在每个 t 上都「借用」了最适合该 t 的 λ。</span>"}],
9: [{"q": "图 (a) 里为什么「固定时刻 Chernoff」画成虚线？", "o": ["因为它是近似", "因为它需要更多假设", "因为它只对高斯成立", "因为它在每个 t 单独成立，但不对 t ≤ 500 同时成立 —— 而图里其他曲线都是同时成立的"], "a": 3, "why": "<b>图 (a) 要读出的是：三条直线各自在不同的 t 处与虚线相切</b>（λ=0.11 在 t≈400 最贴，λ=0.30 在早期最贴）——<span class='k'>这是「一条直线只能在一个地方最紧」的可视化，而在最紧那点它与 Chernoff 几乎重合。</span>"}, {"q": "图 (b) 里混合法的弯曲边界与「union bound 2t²」比，结论是什么？这对实践意味着什么？", "o": ["两者差不多；随便用哪个", "弯曲边界只在早期更紧", "弯曲边界明显比并集界低（更紧），而两者都全程有效；而「union bound 2t²」正是本课 L06/L07 那套 δ/(2ℓ²)+Basel 的做法 —— 说明它可以改进", "并集界更紧；应该用它"], "a": 2, "why": "<b>混合法的形状是 √(t·log t)，比固定时刻的 √(t·log(1/δ)) 多一个 log t</b>——<span class='w'>那正是「不事先猜 n」的代价（也正是 L16 重对数律刻画的量级）。t=1000 时约合 2.6 倍的区间宽度。</span>"}],
10: [{"q": "「可预测」（predictable）的定义是什么？为什么这个条件对自适应算法恰到好处？", "o": ["σ_t 关于 𝓕_{t−1} 可测 —— 在看到 ε_t 之前就已确定；而算法第 t 步选哪条臂、投入多少都只能依赖历史，正好是可预测", "σ_t 关于 𝓕_t 可测；因为要用当前信息", "σ_t 独立于历史；因为要保证无偏", "σ_t 是常数；因为要保证一致性"], "a": 0, "why": "<b>注意是 t−1 不是 t。</b>有了这个放松，构造只改一个字：t → V_t = Σσ_s²。<span class='k'>于是界按累计方差而不是步数增长——噪声小的那些步几乎不加宽界，界自动「认出」哪些观测有信息。</span>"}],
11: [{"q": "自归一化界 ‖S_t‖_{(V_t+γI)⁻¹} ≤ √(2log(1/δ)+log(|V_t+γI|/γᵈ)) 的几何含义是什么？", "o": ["S_t 的长度被常数界住", "S_t 落在一个超立方体里", "S_t 的各分量独立", "白化：做 (V_t+γI)^{−1/2} 变换后，细长的椭圆变成圆，整条轨迹被一个固定半径的球罩住 —— 测得多的方向压扁、测得少的方向放大，于是所有方向平等"], "a": 3, "why": "<b>γI 是必需的正则化</b>（刚开始 V_t 可能奇异），代价出现在 log(|V_t+γI|/γᵈ) 这一项。<span class='w'>量级约 d·log t —— 这正是 LinUCB 遗憾界里那个 d log T 的来源。</span>"}],
12: [{"q": "验证 E[exp(⟨λ, x_s ε_s⟩)|𝓕_{s−1}] ≤ exp(‖λ‖²_{x_s x_sᵀ}/2) 时，哪一步是枢纽？它依赖什么？", "o": ["交换期望与积分；依赖 Fubini", "用 ε_s 的次高斯性那一步，因为它要求 ⟨λ,x_s⟩ 在给定 𝓕_{s−1} 时是已知常数 —— 这依赖「x_t 关于 𝓕_{t−1} 可测」", "矩阵求逆那一步；依赖正定性", "配方那一步；依赖高斯"], "a": 1, "why": "<b>这把「可预测」落成了一句具体的话：必须在看到这一轮结果之前决定这一轮测什么。</b><span class='k'>而在线算法天然满足——你不可能先看结果再选动作。所以这套界对任何合法的在线/自适应算法都成立。</span>"}, {"q": "岭回归的误差分解 θ̂ = (V_t+γI)⁻¹V_tθ* + (V_t+γI)⁻¹S_t，两项分别是什么？", "o": ["都是噪声项", "第一项是正则化带来的收缩偏差（注意它不等于 θ*），第二项是噪声项；γ→0 时偏差消失但矩阵可能不可逆 —— 这就是 γ 的取舍", "第一项是先验，第二项是后验", "第一项是方差，第二项是偏差"], "a": 1, "why": "<span class='w'>而噪声项里的 S_t = Σ_s x_s ε_s 正好是上一页那个向量鞅的形状</span>——<b>于是只要验证它满足条件，整条自归一化界就直接套上。</b>"}],
13: [{"q": "最终置信界有两项，它们随 γ 的变化方向相反。具体是什么？", "o": ["两项都随 γ 减小", "偏差项 √γ‖θ*‖₂ 随 γ 增大而增大（且不随 t 变），噪声项 √(2log(1/δ)+log(|V_t+γI|/γᵈ)) 随 γ 减小而发散 —— 两头都不能走极端", "两项都与 γ 无关", "两项都随 γ 增大"], "a": 1, "why": "⚠ 偏差项还依赖 ‖θ*‖₂ —— 一个你不知道的量，<b>实践中必须假设一个上界 B 并在论文里声明</b>。<span class='k'>而 d≈20、t≈1000 时噪声项约 9，γ=1 且 ‖θ*‖₂≈1 时偏差项约 1，所以 γ 取 1 量级是安全的。</span>"}, {"q": "LinUCB 的 UCB_t(x) = max_{θ∈C_t}⟨θ,x⟩ 有闭式。是什么？它和 L07 有什么关系？", "o": ["= β_t‖x‖₂；与 L07 无关", "= ⟨θ̂_t,x⟩；与 L07 无关", "= ⟨θ̂_t,x⟩ + β_t‖x‖_{(V_t+γI)⁻¹}，即「当前估值 + 这条臂方向上的不确定度×半径」；而 ‖x‖_{A⁻¹} 正是 L07 的 G-最优设计要最小化的那个量 —— 两讲在这里合流", "= max_x⟨θ̂_t,x⟩；L07 是它的特例"], "a": 2, "why": "<b>L07 问「怎么分配测量使它的最大值小」，本讲问「怎么用它来选动作」。</b><span class='w'>⚠ 而本讲没给 LinUCB 的遗憾界——讲义到「算法长什么样」为止，要引用必须查 OFUL 原文。</span><b>⇒ 但要理解它，<b>本课 L10 讲了</b>：p2 那条界 + p4 的椭圆势引理。三讲（L07 → L12 → L10）到此闭环。</b>"}]
};

{"r": [1, 1], "t": "承上：臂集无限时，用覆盖把 sup 换成有限个点", "star": 2, "quote": "<em>Suppose 𝒳 is <b>uncountable</b>. Can we still bound?</em><br><em>max<sub>x∈𝒳</sub>|⟨θ̂−θ<sub>*</sub>, x⟩| = max<sub>x</sub>|(θ̂−θ<sub>*</sub>)ᵀA<sup>1/2</sup>A<sup>−1/2</sup>x| ≤ <b>‖θ̂−θ<sub>*</sub>‖<sub>A</sub> · max<sub>x</sub>‖x‖<sub>A<sup>−1</sup></sub></b></em><br><b>Lemma</b> <em>∃ cover C ⊂ ℝᵈ : <b>|C| ≤ (3/ε)ᵈ</b> and x∈C, ‖x‖₂=1, and ∀x w/ ‖x‖₂=1 we have ‖y−x‖₂ ≤ ε for some y∈C.</em> 〔红字：<em>In other words, ∪<sub>x∈C</sub>B(x,ε) ⊃ S<sup>d−1</sup></em>〕<br><em>‖θ̂−θ<sub>*</sub>‖<sub>A</sub> = sup<sub>u:‖u‖=1</sub>uᵀA<sup>1/2</sup>(θ̂−θ<sub>*</sub>) = sup<sub>u</sub>min<sub>y∈C</sub>(u−y)ᵀA<sup>1/2</sup>(θ̂−θ<sub>*</sub>) + yᵀA<sup>1/2</sup>(θ̂−θ<sub>*</sub>)</em>", "one": "<b>臂有无穷多条时，并集界没法用。覆盖论证的办法是：先把单位球用有限个点铺满，对这些点用并集界，再把「离最近的点有多远」那部分吸收掉。</b>", "pts": ["⚠️ <b>先说一件省时间的事：本讲 p1–p2 与 <code>lecture_11.pdf</code> 的 p1–p2 <b>逐字节相同</b></b>（<span class='k'>实测 L11 ⊂ L12 全包含，5/5 页</span>）。<b>做了 L12 就不必单独做 L11。</b>", "<b>问题是从 L07/L09 那套接过来的：臂集 <code>𝒳</code> 如果是<b>不可数</b>的（比如整个单位球），怎么办？</b> <span class='w'>之前所有的界里都有一个 <code>log|𝒳|</code>，而现在 <code>|𝒳| = ∞</code></span>。", "<b>第一步是一个很标准的拆分：把 <code>A^{1/2}A^{-1/2}</code> 插进去，再用 Cauchy–Schwarz。</b> <span class='k'><code>max_x|⟨θ̂−θ_*, x⟩| ≤ ‖θ̂−θ_*‖_A · max_x‖x‖_{A^{-1}}</code></span>——<b>把「参数的误差」和「臂的几何」<b>分开</b>了</b>。<span class='w'>右边那一项由 G-最优设计控住（<code>≤ √(d/T)</code> 量级，L07 讲过）；难的是左边。</span>", "<b>左边 <code>‖θ̂−θ_*‖_A</code> 写成 sup 之后，问题就变成「对单位球上<b>所有</b>方向同时成立」。</b> <span class='k'><code>= sup_{u:‖u‖=1} uᵀA^{1/2}(θ̂−θ_*)</code></span>——<b>这又是一个无穷多个事件的并集。</b>", "<b>覆盖引理把这个无穷变成有限：用 <code>(3/ε)^d</code> 个点就能把单位球面铺满到 ε 精度。</b> <span class='w'>红字那句说得更直白：<code>∪_{x∈C}B(x,ε) ⊃ S^{d−1}</code>——以 C 中每个点为心、半径 ε 的球，合起来盖住整个球面</span>。<b>页上那张红色的小图画的就是这件事。</b>", "<b>那个 <code>(3/ε)^d</code> 的形状要留意：<b>指数依赖维数</b>。</b> <span class='k'>所以 <code>log|C| = d·log(3/ε)</code>——<b>取对数之后维数变成线性</b></span>。<b>而界里出现的正是 <code>log|C|</code>，所以覆盖的指数大小<b>不致命</b>。</b><span class='w'>这是覆盖论证能用的根本原因。</span>", "<b>第三步是把 sup 拆成「最近的覆盖点」加「残差」。</b> <code>uᵀ(·) = (u−y)ᵀ(·) + yᵀ(·)</code>，<span class='k'>其中 y 是 C 中离 u 最近的点</span>。<b>第一项用 Cauchy–Schwarz 界成 <code>‖u−y‖·‖θ̂−θ_*‖_A ≤ ε·‖θ̂−θ_*‖_A</code>；第二项是<b>有限</b>个固定方向，可以用并集界 <code>≤ √(2log(|C|/δ))</code>。</b>", "<b>注意第一项里又出现了 <code>‖θ̂−θ_*‖_A</code> 本身——这是一个<b>自指</b>，而下一页正是靠它解出来。</b> <span class='w'>得到 <code>‖θ̂−θ_*‖_A ≤ ε‖θ̂−θ_*‖_A + √(2log(|C|/δ))</code>，移项即可</span>。<b>这种「把要估的量放到不等式两边再解出来」的手法，在这类证明里很常见。</b>"], "eq": "⚠ 本讲 p1–p2 与 lecture_11.pdf 的 p1–p2 **逐字节相同**（L11 ⊂ L12 全包含）\n   ⇒ 做了 L12 就不必单独做 L11\n\n问题：臂集 𝒳 **不可数**时怎么办？（之前的界里都有 log|𝒳|，而现在 |𝒳| = ∞）\n\n第一步（分开两件事）：插入 A^{1/2}A^{−1/2} 再用 Cauchy–Schwarz\n   max_x |⟨θ̂−θ_*, x⟩| ≤ **‖θ̂−θ_*‖_A** · **max_x ‖x‖_{A^{−1}}**\n                          └ 参数的误差 ┘   └ 臂的几何（G-最优设计管，≤ sqrt(d/T)）┘\n\n第二步：左边写成 sup ⇒ 又是无穷多个事件\n   ‖θ̂−θ_*‖_A = sup_{u:‖u‖=1} u^T A^{1/2}(θ̂−θ_*)\n\n第三步：**覆盖引理** —— 用 **(3/ε)^d** 个点把单位球面铺满到 ε 精度\n   ∪_{x∈C} B(x, ε) ⊃ S^{d−1}\n   ⚠ (3/ε)^d 指数依赖维数，但界里出现的是 **log|C| = d·log(3/ε)**\n     ⇒ 取对数后维数只是线性 ⇒ 覆盖的指数大小**不致命**（覆盖论证能用的根本原因）\n\n第四步：把 sup 拆成「最近的覆盖点 + 残差」\n   u^T(·) = (u−y)^T(·) + y^T(·)        y = C 中离 u 最近的点\n     第一项 ≤ ‖u−y‖·‖θ̂−θ_*‖_A ≤ **ε·‖θ̂−θ_*‖_A**       （Cauchy–Schwarz）\n     第二项 = **有限**个固定方向 ⇒ 并集界 ≤ sqrt(2log(|C|/δ))\n\n   ⚠ 第一项里又出现了 ‖θ̂−θ_*‖_A **本身** —— 自指\n     ⇒ 下一页移项解出来（「把要估的量放到不等式两边再解」是这类证明的常用手法）", "tbl": {"head": ["", "有限臂集（L07/L09）", "不可数臂集（本页）"], "rows": [["界里的那一项", "log|𝒳|", "<b>log|C| = d·log(3/ε)</b>"], ["怎么来的", "<b>并集界</b>", "<b>覆盖 + 并集界</b>"], ["覆盖多大", "—", "<span class='w'>(3/ε)<sup>d</sup>，指数依赖维数</span>"], ["为什么不致命", "—", "<b>界里出现的是 log，取对数后维数只是线性</b>"], ["额外代价", "—", "<b>残差项 ε‖θ̂−θ*‖<sub>A</sub>（下一页移项吸收）</b>"]]}, "link": {"t": "你学过的对应：本课 L07 精读（max_x‖x‖_{A⁻¹} 那一项正是 G-最优设计要最小化的东西，Kiefer–Wolfowitz 给它 = d）", "href": "L07-精读.html"}},
{"r": [2, 2], "t": "覆盖论证收尾，然后从零搭概率空间", "star": 2, "quote": "<em>≤ ε‖θ̂−θ<sub>*</sub>‖<sub>A</sub> + √(2log(|C|/δ)) &nbsp;⟹&nbsp; <b>‖θ̂−θ<sub>*</sub>‖<sub>A</sub> ≤ (1/(1−ε))·√(2d log(3/ε) + 2log(1/δ))</b></em><br><b>Stochastic Processes</b> — <em>Flip two coins. Sample/outcome space Ω = {HH, HT, TH, TT}</em><br><em><b>σ-algebra</b> of a set Ω called 𝓕 satisfies: 1. Ω ∈ 𝓕; 2. F ∈ 𝓕 ⟹ F<sup>c</sup> ∈ 𝓕; 3. F<sub>n</sub> ∈ 𝓕 ∀n then ∪F<sub>n</sub> ∈ 𝓕</em><br><em><b>Probability measure</b> P assigns number to 𝓕 (P: 𝓕 → ℝ): P(F) ≥ 0 ∀F; P(∅)=0, P(Ω)=1; P(∪F<sub>n</sub>) = ΣP(F<sub>n</sub>) （F<sub>n</sub> disjoint）</em>", "one": "<b>移项就解出了无限臂集的界。然后整讲换挡——从这里开始重新搭概率论的地基，因为后面要讲的鞅离不开它。</b>", "pts": ["<b>上半页只是把上一页那个自指解开。</b> <span class='k'><code>X ≤ εX + b</code> ⟹ <code>X ≤ b/(1−ε)</code></span>，<b>代入 <code>|C| ≤ (3/ε)^d</code> 得到 <code>‖θ̂−θ_*‖_A ≤ (1/(1−ε))√(2d log(3/ε) + 2log(1/δ))</code></b>。", "<b>注意这个界的形状：<code>√d</code> 而不是 <code>√(log|𝒳|)</code>。</b> <span class='w'>有限臂时是 <code>√(log n)</code>，无限臂时换成了 <code>√d</code></span>——<b>而 <code>ε</code> 是一个可以自由选的旋钮</b>：<span class='k'><code>ε</code> 小则覆盖密、<code>log(3/ε)</code> 大；<code>ε</code> 大则 <code>1/(1−ε)</code> 炸。取 <code>ε = 1/2</code> 一类的常数就行。</span>", "<b>然后整讲换挡，而这个换挡是有理由的。</b> <span class='w'>前面所有的界都是「对<b>固定</b>的样本量 T 成立」</span>；<b>而真正的算法是<b>自适应</b>的——边采边看、随时可能停</b>。<span class='k'>要处理「随时都成立」就必须有鞅，而鞅要先有滤流，滤流要先有 σ-代数。所以从地基搭起。</span>", "<b>σ-代数的三条，用「掷两枚硬币」这个最小例子就能看懂。</b> <span class='k'><code>Ω = {HH, HT, TH, TT}</code> 是所有可能结果</span>；<b>而 <code>𝓕</code> 是「我们能谈论其概率的那些<b>事件</b>」的集合</b>。<span class='w'>三条要求是：全集在里面；<b>对补封闭</b>；<b>对可数并封闭</b>。</span>", "<b>为什么要这么讲究？因为后面「<b>到第 t 步为止我知道了什么</b>」这件事，就是用 σ-代数表示的。</b> <span class='k'>σ-代数不是一堆集合的随意堆砌，它是「信息」的数学化身</span>——<b>一个事件在 <code>𝓕_t</code> 里，意思就是「到第 t 步你已经能判断它发没发生」。</b>", "<b>那三条的含义也因此变得直观</b>：<span class='w'>「补封闭」= 你能判断 A 发生，就能判断 A 没发生；「可数并封闭」= 你能判断每一个 <code>A_n</code>，就能判断「至少一个发生」</span>。<b>这两条正是「知道」这件事应有的性质。</b>", "<b>概率测度的三条是把「概率」这个词定义出来：非负、全集为 1、<b>可数可加</b>。</b> <span class='k'>⚠ 注意是<b>可数</b>可加而不是有限可加</span>——<b>这一条看着技术，但它是极限论证能做的全部基础</b>。<span class='w'>后面「对所有 <code>t ∈ ℕ</code> 同时成立」那类陈述，依赖的正是它。</span>", "<b>页面右侧还有一段紫色的小推导，是上一页那个 <code>√(2log(|C|/δ))</code> 的根据。</b> <span class='k'><code>E[(yᵀA^{-1/2}(θ̂−θ_*))²] = yᵀA^{-1/2}·E[Σx_tx_tᵀε_t²]·A^{-1/2}y = yᵀy = 1</code></span>——<b>中间用了 <code>E[ε²]=1</code> 和 <code>E[Σx_tx_tᵀε_t²] = A</code></b>。<span class='w'>也就是说：<b>白化之后，每个固定方向上的误差都是标准的 1-次高斯</b></span>，<b>所以可以直接套次高斯的尾界。这一步叫「自归一化」，而它是后面 p11 的主题。</b>"], "eq": "解开自指：X ≤ εX + b  ⟹  X ≤ b/(1−ε)\n   ⇒ ‖θ̂−θ_*‖_A ≤ (1/(1−ε))·sqrt( 2d·log(3/ε) + 2log(1/δ) )\n\n   形状：有限臂是 sqrt(log n)，无限臂换成 **sqrt(d)**\n   ε 是自由旋钮：小则覆盖密、log(3/ε) 大；大则 1/(1−ε) 炸 ⇒ 取 ε = 1/2 一类常数即可\n\n为什么整讲在这里换挡：\n   前面所有界都是「对**固定**样本量 T 成立」\n   而真正的算法是**自适应**的 —— 边采边看、随时可能停\n   ⇒ 要「随时都成立」就要鞅；要鞅就要滤流；要滤流就要 σ-代数 ⇒ 从地基搭起\n\nσ-代数（用「掷两枚硬币」看）：Ω = {HH, HT, TH, TT}\n   ① Ω ∈ 𝓕    ② F ∈ 𝓕 ⇒ F^c ∈ 𝓕    ③ F_n ∈ 𝓕 ∀n ⇒ ∪F_n ∈ 𝓕\n\n   ⇒ σ-代数是**「信息」的数学化身**：事件在 𝓕_t 里 = 到第 t 步你已能判断它发没发生\n     「补封闭」 = 能判断 A 发生就能判断 A 没发生\n     「可数并封闭」 = 能判断每个 A_n 就能判断「至少一个发生」\n\n概率测度：P(F) ≥ 0 · P(∅)=0, P(Ω)=1 · **可数**可加\n   ⚠ 是**可数**可加不是有限可加 —— 后面「对所有 t∈ℕ 同时成立」依赖的正是它\n\n紫色小推导（上一页 sqrt(2log(|C|/δ)) 的根据）：\n   E[(y^T A^{−1/2}(θ̂−θ_*))²] = y^T A^{−1/2}·E[Σ x_tx_t^T ε_t²]·A^{−1/2} y = y^T y = 1\n                                              └── = A ──┘        （用 E[ε²]=1）\n   ⇒ **白化之后，每个固定方向上的误差都是标准 1-次高斯** ⇒ 可直接套尾界\n     这一步叫**自归一化**，是 p11 的主题"},
{"r": [3, 3], "t": "条件期望：为什么要绕这么大一个圈子定义它", "star": 2, "quote": "<em>Random variable X is a function mapping Ω → ℝ</em><br><em>Conditional expectation: P(Y|X) = P(Y,X)/P(X)</em><br><em>If X is finite 〔discrete〕 then E[Y|X=x] = Σ<sub>y</sub> y·P(Y=y|X=x)</em><br><em>but otherwise: <b>E[Y|X](ω) = g(ω)</b> where g is <b>any</b> function satisfying &nbsp;∫<sub>ω∈H</sub>g(ω)dP(ω) = ∫<sub>ω∈H</sub>Y(ω)dP(ω) &nbsp;<b>for all H ∈ σ(X)</b></em>", "one": "<b>离散情形条件期望就是加权平均。连续情形下「给定 X=x」这个事件概率为零，除法没法用——于是改用一个间接的定义：在 σ(X) 的每个事件上积分相等。</b>", "pts": ["<b>离散情形没什么可说的：<code>E[Y|X=x] = Σ_y y·P(Y=y|X=x)</code>，而条件概率就是 <code>P(Y,X)/P(X)</code>。</b> <span class='k'>只要 <code>P(X=x) &gt; 0</code>，一切照常。</span>", "⚠️ <b>而连续情形下这个定义直接垮掉：<code>P(X = x) = 0</code>，分母是零。</b> <span class='w'>所以「给定 <code>X = x</code>」这个条件本身没有初等的意义</span>——<b>必须换一个说法。</b>", "<b>换的说法是把「条件期望」定义成一个<b>函数</b>，而不是一个数。</b> <span class='k'><code>E[Y|X]</code> 是 <code>ω</code> 的函数 <code>g(ω)</code></span>，<b>而它要满足的性质是：<b>在 <code>σ(X)</code> 的每一个事件 H 上，<code>g</code> 的积分与 <code>Y</code> 的积分相等</b></b>。", "<b>这个定义的直观读法值得花点时间，它其实很自然。</b> <span class='w'><code>σ(X)</code> 是「只看 X 能分辨的那些事件」</span>；<b>而条件期望要的是「<b>在只能看到 X 的分辨率下，对 Y 的最佳猜测</b>」</b>。<span class='k'>「积分相等」说的就是：在任何你分辨得出来的区域里，用 <code>g</code> 替代 <code>Y</code> 不会改变总量。</b>", "<b>换句话说：<code>g</code> 是 <code>Y</code> 在 <code>σ(X)</code> 上的<b>投影</b>。</b> <span class='w'>它把 <code>Y</code> 里「X 看不见的那部分变化」抹平了，而保留了 X 看得见的全部</span>。<b>这就是为什么条件期望满足塔性质 <code>E[E[Y|X]] = E[Y]</code>——投影不改变总量。</b>", "<b>注意定义里那个「<b>any</b> function satisfying」：条件期望不是唯一的。</b> <span class='k'>任何两个满足条件的 <code>g</code> 只在一个零测集上不同（<b>几乎处处</b>相等）</span>——<b>所以严格说条件期望是一个<b>等价类</b></b>。<span class='w'>这在实践中无所谓，但解释了为什么教科书里到处是「a.s.」。</span>", "<b>页底那条紫色补充说的是同一件事的另一面</b>：<span class='k'>存在可测函数 <code>f</code> 使 <code>f(X(ω)) = E[Y|X](ω)</code></span>——<b>也就是说这个「对 Y 的最佳猜测」确实只通过 X 的值依赖 ω</b>。<span class='w'>这正是「只看 X」这句话的精确含义。</span>", "<b>为什么本讲要在这里花一页讲它？因为鞅的定义 <code>E[X_{t+1}|𝓕_t] = X_t</code> 里那个条件期望，正是这个一般版本。</b> <span class='k'>条件不是「给定某个数值」，而是「<b>给定一整个 σ-代数</b>」——给定「到 t 为止我知道的所有事」</span>。<b>没有这一页，下一页的定义就是一句看不懂的话。</b>"], "eq": "离散：E[Y|X=x] = Σ_y y·P(Y=y|X=x)，而 P(Y|X) = P(Y,X)/P(X)\n   ⚠ 连续情形垮掉：P(X=x) = 0，分母是零\n     ⇒ 「给定 X=x」没有初等意义，必须换说法\n\n一般定义（把条件期望定义成**函数**而非数）：\n   E[Y|X](ω) = g(ω)，其中 g 是**任何**满足\n       ∫_{ω∈H} g dP = ∫_{ω∈H} Y dP     **对所有 H ∈ σ(X)**\n   的函数\n\n   直观：σ(X) = 「只看 X 能分辨的那些事件」\n         条件期望 = 「在只能看到 X 的分辨率下，对 Y 的最佳猜测」\n         「积分相等」= 在任何你分辨得出的区域里，用 g 替代 Y 不改变总量\n\n   ⇒ g 是 Y 在 σ(X) 上的**投影**：抹平 X 看不见的变化，保留 X 看得见的全部\n     （这就是塔性质 E[E[Y|X]] = E[Y] 的来源 —— 投影不改变总量）\n\n⚠ 「**any** function satisfying」：条件期望**不唯一**\n   任何两个满足条件的 g 只在零测集上不同（**几乎处处**相等）\n   ⇒ 严格说它是一个**等价类** —— 这解释了教科书里到处是「a.s.」\n\n紫色补充：存在可测函数 f 使 f(X(ω)) = E[Y|X](ω)\n   ⇒ 这个「最佳猜测」确实**只通过 X 的值**依赖 ω（「只看 X」的精确含义）\n\n为什么要花一页讲：鞅的定义 E[X_{t+1}|𝓕_t] = X_t 里的条件期望正是这个一般版本\n   条件不是「给定某个数值」，而是「**给定一整个 σ-代数**」= 给定「到 t 为止我知道的所有事」"},
{"r": [4, 4], "t": "滤流与鞅：把「信息随时间增加」写成数学", "star": 3, "quote": "<em>𝓕<sub>t</sub> = σ({X<sub>s</sub>}<sub>s≤t</sub>), &nbsp; 𝓕₁ ⊂ 𝓕₂ ⊂ 𝓕₃ ⋯ &nbsp; <b>Filtration</b>: {𝓕<sub>t</sub>}<sub>t=1</sub><sup>∞</sup> = 𝔽</em><br><em>X<sub>t</sub> is 𝔽-<b>adapted</b> if X<sub>t</sub> is 𝓕<sub>t</sub> measurable. &nbsp; E[X<sub>t+1</sub>|𝓕<sub>t</sub>] = X<sub>t</sub> &nbsp;⟹&nbsp; E[X<sub>t+1</sub>] = E[E[X<sub>t+1</sub>|𝓕<sub>t</sub>]] = E[X<sub>t</sub>] = E[X₁]</em><br><em>An 𝔽-adapted sequence of R.V.s is a <b>martingale</b> if E[X<sub>t+1</sub>|𝓕<sub>t</sub>] = X<sub>t</sub> ∀t and E[|X<sub>t</sub>|] &lt; ∞</em><br><em>If E[X<sub>t+1</sub>|𝓕<sub>t</sub>] <b>≤</b> X<sub>t</sub> we say it's <b>supermartingale</b>; &nbsp; if <b>≥</b> X<sub>t</sub>, <b>sub-martingale</b></em>", "one": "<b>滤流是一串越来越大的 σ-代数——「知道的越来越多」。鞅就是「下一步的期望等于现在」，而上鞅是「期望只会往下走」。</b>", "pts": ["<b>滤流的定义只有一行，而它表达的事很根本</b>：<code>𝓕_t = σ({X_s}_{s≤t})</code>，<span class='k'>而 <code>𝓕_1 ⊂ 𝓕_2 ⊂ ⋯</code></span>。<b>「包含」在这里的意思是「分辨得更细」</b>——<span class='w'>时间往前走，你能判断的事件只增不减。</span>", "<b><b>适应</b>（adapted）的意思是「<code>X_t</code> 不偷看未来」</b>：<span class='k'><code>X_t</code> 关于 <code>𝓕_t</code> 可测，也就是说它的值由「到 t 为止发生的事」完全决定</span>。<b>这听起来显然，但它排除掉的东西很重要</b>——<span class='w'>比如「最终的最大值」就不是适应的，因为它要看完全程才知道。</span>", "<b>鞅的定义是 <code>E[X_{t+1}|𝓕_t] = X_t</code>：<b>给定现在知道的一切，下一步的期望就是现在的值</b>。</b> <span class='k'>直观：公平赌局——不管你已经看到了什么，你的期望财富都不变</span>。<b>外加一个技术条件 <code>E[|X_t|] &lt; ∞</code>（否则条件期望可能没定义）。</b>", "<b>页上那行紫字是鞅最常用的推论，一定要会</b>：<code>E[X_{t+1}] = E[E[X_{t+1}|𝓕_t]] = E[X_t] = ⋯ = E[X_1]</code>。<span class='w'>由塔性质，<b>鞅的无条件期望恒定</b></span>——<b>这是后面所有论证的起点。</b>", "⚠️ <b>上鞅与下鞅的方向极易记反，这里给一个记法。</b> <span class='k'><b>上</b>鞅（supermartingale）是 <code>E[X_{t+1}|𝓕_t] ≤ X_t</code>——<b>期望往<b>下</b>走</b></span>。<b>名字和方向是反的</b>。<span class='w'>⚠ 记法：上鞅的轨迹被它的初值<b>从上面压住</b>（<code>E[X_t] ≤ E[X_1]</code>），所以「上」指的是<b>界</b>在上面，不是走势。</span>", "<b>而这一讲全程要用的是<b>上鞅</b>，理由很简单：我们要的是上界。</b> <span class='k'>上鞅的期望只会变小，所以「它曾经变得很大」这件事概率就很小</span>——<b>这正是极大不等式（p6）的内容。</b>", "<b>页下那个红色的例子最基本：<code>ε_t ~ N(0,1)</code> 时 <code>X_t = Σ_{s≤t}ε_s</code> 是鞅。</b> <span class='w'>验证只有一行：<code>E[X_{t+1}|𝓕_t] = E[ε_{t+1}|𝓕_t] + Σ_{s≤t}ε_s = 0 + X_t</code></span>——<b>因为 <code>ε_{t+1}</code> 与过去独立、而且零均值。</b>", "<b>紫色那个例子是另一类：<code>z_t</code> 以各 1/2 的概率取 2 或 0，<code>X_t = Π_{s≤t}z_s</code>，<code>X_0 = 1</code>。</b> <span class='k'><code>E[z] = 1</code>，所以乘积也是鞅</span>；<b>⚠ 但它<b>几乎必然</b>趋于 0（只要出现一次 0 就永远是 0），而期望却恒为 1</b>。<span class='w'>这个反例很值得记：<b>鞅的期望恒定，不代表它的轨迹不塌</b></span>——<b>期望被那些概率极小、数值极大的路径撑着。</b>"], "eq": "**滤流** 𝔽 = {𝓕_t}：𝓕_t = σ({X_s}_{s≤t})，𝓕_1 ⊂ 𝓕_2 ⊂ ⋯\n   「包含」= 分辨得更细 ⇒ 时间往前走，能判断的事件只增不减\n\n**适应**（adapted）：X_t 关于 𝓕_t 可测 = X_t **不偷看未来**\n   ⚠ 排除掉的例子：「最终的最大值」不是适应的（要看完全程才知道）\n\n**鞅**：𝔽-适应 且 **E[X_{t+1}|𝓕_t] = X_t** ∀t，且 E[|X_t|] < ∞\n   直观：公平赌局 —— 不管已经看到什么，期望财富不变\n\n   最常用的推论（塔性质）：\n      E[X_{t+1}] = E[E[X_{t+1}|𝓕_t]] = E[X_t] = ⋯ = **E[X_1]**\n      ⇒ **鞅的无条件期望恒定** —— 后面所有论证的起点\n\n⚠ 方向极易记反：\n   **上**鞅 supermartingale：E[X_{t+1}|𝓕_t] **≤** X_t   —— 期望往**下**走\n   **下**鞅 sub-martingale：  E[X_{t+1}|𝓕_t] **≥** X_t\n   记法：上鞅被初值**从上面压住**（E[X_t] ≤ E[X_1]）⇒ 「上」指**界**在上面，不是走势\n\n   本讲全程用**上鞅**，因为我们要的是上界：\n   期望只会变小 ⇒ 「它曾经变得很大」的概率就很小 ⇒ 极大不等式（p6）\n\n例一（红）：ε_t ~ N(0,1) ⇒ X_t = Σ_{s≤t} ε_s 是鞅\n   E[X_{t+1}|𝓕_t] = E[ε_{t+1}|𝓕_t] + X_t = 0 + X_t\n\n例二（紫）：z_t = 2 或 0 各 1/2，X_t = Π_{s≤t} z_s，X_0 = 1\n   E[z] = 1 ⇒ 乘积也是鞅\n   ⚠ 但它**几乎必然趋于 0**（出现一次 0 就永远是 0），而期望恒为 1\n     ⇒ **鞅的期望恒定，不代表轨迹不塌** —— 期望被概率极小、数值极大的路径撑着", "tbl": {"head": ["", "定义", "期望怎么走", "本讲用它做什么"], "rows": [["<b>鞅</b>", "E[X<sub>t+1</sub>|𝓕<sub>t</sub>] = X<sub>t</sub>", "<b>恒定</b>", "Doob 可选停止"], ["<b>上鞅</b>", "E[X<sub>t+1</sub>|𝓕<sub>t</sub>] <b>≤</b> X<sub>t</sub>", "<b>只会往下</b>", "<b>极大不等式 ⇒ 上界</b>"], ["下鞅", "E[X<sub>t+1</sub>|𝓕<sub>t</sub>] ≥ X<sub>t</sub>", "只会往上", "本讲少用"], ["⚠ 记法", "<b>「上」指界在上面，不是走势</b>", "—", "—"]]}},
{"r": [5, 5], "t": "指数鞅：减掉 λ²/2 把下鞅压成上鞅", "star": 3, "quote": "<em>Ex. ε<sub>t</sub> ~ N(0,1), X<sub>t</sub> = Π<sub>s=1</sub><sup>t</sup>exp(λε<sub>s</sub>), λ &gt; 0</em><br><em>E[X<sub>t+1</sub>|𝓕<sub>t</sub>] = Π<sub>s≤t</sub>exp(λε<sub>s</sub>)·<u>E[exp(λε<sub>t+1</sub>)|𝓕<sub>t</sub>]</u><sub>e<sup>λ²/2</sup></sub> = X<sub>t</sub>·e<sup>λ²/2</sup> ≥ X<sub>t</sub> &nbsp;⟹&nbsp; X<sub>t</sub> is <b>sub-martingale</b></em><br><em><b>X<sub>t</sub> = Π<sub>s=1</sub><sup>t</sup>exp(λε<sub>s</sub> − λ²/2)</b> &nbsp;⟹&nbsp; X<sub>t</sub> is <b>supermartingale</b></em><br><em>X(ω), ω ∈ Ω: &nbsp; E[X] = Σ<sub>ω</sub>X(ω)P(ω)</em>", "one": "<b>把 exp(λε) 连乘起来是下鞅（它每步往上漂 e^{λ²/2}）。减掉那个漂移，就成了上鞅——而这个小改动是整讲所有界的发动机。</b>", "pts": ["<b>第一个例子先看清楚「为什么会往上漂」。</b> <span class='k'><code>X_t = Π_{s≤t}exp(λε_s)</code>，而 <code>E[exp(λε)] = e^{λ²/2} &gt; 1</code>（高斯的矩母函数）</span>——<b>所以每乘一项，期望就乘上一个大于 1 的数</b>。<span class='w'>于是 <code>E[X_{t+1}|𝓕_t] = X_t·e^{λ²/2} ≥ X_t</code>，这是<b>下</b>鞅。</b>", "<b>注意这个漂移是<b>确定的</b>、而且是已知的：<code>e^{λ²/2}</code> 不依赖数据。</b> <span class='k'>所以把它除掉就行</span>——<b>这就是第二行那个改动：<code>X_t = Π_{s≤t}exp(λε_s − λ²/2) = exp(λS_t − tλ²/2)</code></b>。<span class='w'>每一项里减掉 <code>λ²/2</code>，正好抵消掉那个漂移。</span>", "<b>改完之后它就是上鞅（对高斯恰好是鞅，对一般的次高斯是上鞅）。</b> <span class='k'>而次高斯的定义 <code>E[exp(λε)] ≤ e^{λ²/2}</code> 里的那个 <code>≤</code>，正好让它变成上鞅而不是鞅</span>——<b>这也是为什么本讲全程只需要「次高斯」而不需要「高斯」。</b>", "<b>把这个构造的分量说透：<code>exp(λS_t − tλ²/2)</code> 这一个表达式，是本讲后面<b>所有</b>结果的发动机。</b> <span class='w'>p7 的随时有效界、p9 的混合法、p10 的可预测方差版、p11 的向量版、p13 的 LinUCB 椭球</span>——<b>全部是在同一个式子上做变形。</b>", "<b>而它为什么好用，有一个很简洁的理由：<b>它把「尾概率」变成了「期望」</b>。</b> <span class='k'>直接问 <code>P(S_t 很大)</code> 不好办；而 <code>exp(λS_t − tλ²/2)</code> 很大 ⟺ <code>S_t</code> 相对 <code>tλ/2</code> 很大</span>，<b>于是用「上鞅的期望不增 + 马尔可夫」就能一步控住</b>。<span class='w'>这就是 Chernoff 方法的鞅版本。</span>", "<b>再留意一个细节：<code>X_0 = 1</code>。</b> <span class='k'>空乘积等于 1，所以 <code>E[X_0] = 1</code></span>——<b>而极大不等式右边是 <code>E[X_0]/ε</code>，所以这个 1 让后面的界异常干净</b>（<span class='w'>取 <code>ε = 1/δ</code> 直接得到 δ</span>）。", "<b>页下那个 <code>E[X] = Σ_ω X(ω)P(ω)</code> 和那张图，是在给期望一个几何直观。</b> <span class='k'>图上两条曲线：一条是 <code>X(ω)</code>（随机变量的取值），一条是 <code>P(ω)</code>（概率密度）</span>——<b>期望就是两者的「重叠积分」</b>。<span class='w'>画出来是为了下一页讲停时的时候有个参照：停时改变的是「在哪些 ω 上停下来取值」。</span>"], "eq": "为什么会往上漂：\n   X_t = Π_{s≤t} exp(λ ε_s)，而 E[exp(λε)] = e^{λ²/2} > 1（高斯的矩母函数）\n   ⇒ E[X_{t+1}|𝓕_t] = X_t · e^{λ²/2} ≥ X_t     ⇒ **下**鞅\n\n漂移是**确定的、已知的**（e^{λ²/2} 不依赖数据）⇒ 除掉它：\n\n   **M_t(λ) = Π_{s≤t} exp(λ ε_s − λ²/2) = exp( λ S_t − t λ²/2 )**     ⇒ **上**鞅\n\n   次高斯定义 E[exp(λε)] **≤** e^{λ²/2} 里那个 ≤，正好让它成为上鞅而非鞅\n   ⇒ 本讲全程只需要「次高斯」，不需要「高斯」\n\n这一个表达式是后面**所有**结果的发动机：\n   p7 随时有效界 · p9 混合法 · p10 可预测方差版 · p11 向量版 · p13 LinUCB 椭球\n   —— 全部是在它上面做变形\n\n为什么好用：**它把「尾概率」变成了「期望」**\n   直接问 P(S_t 很大) 不好办\n   而 exp(λS_t − tλ²/2) 很大 ⟺ S_t 相对 tλ/2 很大\n   ⇒ 「上鞅的期望不增 + 马尔可夫」一步控住（= Chernoff 方法的鞅版本）\n\n细节：**M_0(λ) = 1**（空乘积）\n   而极大不等式右边是 E[X_0]/ε ⇒ 取 ε = 1/δ 直接得到 δ，界异常干净"},
{"r": [6, 6], "t": "停时、可选停止、极大不等式", "star": 3, "quote": "<b>Def</b> <em>A random variable 𝒯 ∈ ℕ is a <b>stopping time</b> if <b>1{𝒯 ≤ t} is 𝓕<sub>t</sub> measurable</b>.</em><br><em>Ex. 𝒯 = min{t : S<sub>t</sub> ≥ ε} <b>is</b> a stopping time. &nbsp; Ex. 𝒯 = max{t : S<sub>t</sub> ≥ ε} is <b>not</b> a stopping time.</em><br><b>Lemma (Doob's Optional Stopping)</b> <em>… If ∃N: P(𝒯 ≤ N)=1, or E[𝒯] &lt; ∞ and E[|X<sub>t+1</sub>−X<sub>t</sub>|] ≤ c … Then X<sub>𝒯</sub> is well-defined and <b>E[X<sub>𝒯</sub>] = E[X₀]</b>. Furthermore if X<sub>t</sub> is supermartingale E[X<sub>𝒯</sub>] ≤ E[X₀]</em><br><b>Lemma (Maximal inequality)</b> <em>X<sub>t</sub> ≥ 0 ∀t a.s. Then for any ε&gt;0: &nbsp;<b>P(max<sub>t∈ℕ</sub>X<sub>t</sub> ≥ ε) ≤ E[X₀]/ε</b> if X<sub>t</sub> is supermartingale; &nbsp;P(max<sub>t∈{1..n}</sub>X<sub>t</sub> ≥ ε) ≤ E[X<sub>n</sub>]/ε if sub-martingale</em>", "one": "<b>停时是「不偷看未来就能决定停不停」的时刻。而极大不等式说：非负上鞅<b>曾经</b>变大过的概率，被它的初值直接控住——注意是「曾经」，不是「某一刻」。</b>", "pts": ["<b>停时的定义只有一句，而它的要点在「<code>𝓕_t</code> 可测」这五个字上</b>：<span class='k'>「到第 t 步为止，你<b>已经</b>能判断自己是否已经停了」</span>。<b>换句话说，停的决定只能依赖已经看到的数据。</b>", "<b>两个例子把界线划得很清楚，值得记死。</b> <span class='w'><code>𝒯 = min{t : S_t ≥ ε}</code>——<b>是</b>停时（第一次越过门槛，当场就知道）</span>；<span class='w'><code>𝒯 = max{t : S_t ≥ ε}</code>——<b>不是</b>（「最后一次越过」要等到全程走完才知道）</span>。", "<b>⚠ 这条区分在实践里极容易被违反，而违反之后所有保证都失效。</b> <span class='k'>「跑完全部实验，再回头找一个最早能分出胜负的时刻」——那个时刻<b>不是</b>停时</span>（<b>因为你是看着全部数据挑的</b>）。<span class='w'>这正是我在 L16 主线卡里标出的那条坑。</span>", "<b>Doob 可选停止说的是：鞅在<b>停时</b>上取值，期望仍然等于初值。</b> <span class='k'><code>E[X_𝒯] = E[X_0]</code></span>——<b>也就是说「你没法靠选一个聪明的停止规则来占便宜」</b>。<span class='w'>这是公平赌局不可战胜的精确表述。</span>", "<b>⚠ 但它有前提，而且前提是必需的。</b> <span class='k'>要么停时<b>有界</b>（<code>∃N: P(𝒯 ≤ N)=1</code>），要么 <code>E[𝒯] &lt; ∞</code> 且增量一致有界</span>。<b>没有这类条件时结论会错</b>——<span class='w'>经典反例是「一直赌到赢一次为止」：那个停时的期望是有限的，但增量无界，于是 <code>E[X_𝒯] ≠ E[X_0]</code></span>。<b>「赌徒的必胜法」正是钻这个空子。</b>", "<b>而本讲真正要用的是<b>极大不等式</b>，它比可选停止更直接。</b> <b><code>P(max_{t∈ℕ} X_t ≥ ε) ≤ E[X_0]/ε</code></b>（<span class='k'>X_t 非负上鞅</span>）。<b>注意左边是「<b>曾经</b>达到过 ε」，而且 max 取遍<b>所有</b> <code>t ∈ ℕ</code>。</b>", "<b>把它和马尔可夫不等式对比，就知道它强在哪了。</b> <span class='w'>马尔可夫只给 <code>P(X_t ≥ ε) ≤ E[X_t]/ε</code>——<b>某一个固定时刻</b></span>；<b>极大不等式给的是<b>整条轨迹的最大值</b>，而右边的代价<b>一模一样</b></b>（<span class='k'>对上鞅 <code>E[X_t] ≤ E[X_0]</code>）</span>。<b>「对所有 t 同时成立」在这里是<b>免费</b>的。</b>", "<b>这就是整讲最关键的那个「免费」，而它的来源正是上鞅那个单调性。</b> <span class='w'>上鞅的期望只会往下走，所以它要想在<b>某个</b>时刻变得很大，必须在那之前就「借」到足够的期望——而初值的期望把总量卡死了</span>。<b>这个直觉值得记住。</b>", "<b>注意两条的区别：上鞅版 max 取遍 <code>t ∈ ℕ</code>（无穷），下鞅版只能取到 <code>n</code>，而且右边是 <code>E[X_n]</code>。</b> <span class='k'>因为下鞅的期望在涨，取遍无穷就没有有限的界了</span>——<b>这也解释了 p9 那张图里「极大不等式」那条线为什么只画到 t ≤ 500。</b>"], "eq": "**停时**：1{𝒯 ≤ t} 关于 𝓕_t 可测\n   = 「到第 t 步为止，你**已经**能判断自己是否已经停了」\n   = 停的决定只能依赖已看到的数据\n\n   𝒯 = min{t : S_t ≥ ε}   **是**停时（第一次越过，当场就知道）\n   𝒯 = max{t : S_t ≥ ε}   **不是**（「最后一次越过」要走完全程才知道）\n\n   ⚠ 实践中极易违反：「跑完全部实验，再回头找最早能分出胜负的时刻」\n     —— 那**不是**停时（你是看着全部数据挑的），所有保证失效\n\n**Doob 可选停止**：鞅在**停时**上取值，期望仍等于初值  E[X_𝒯] = E[X_0]\n   = 「你没法靠选一个聪明的停止规则来占便宜」（公平赌局不可战胜）\n   ⚠ 前提是必需的：停时**有界**，或 E[𝒯] < ∞ 且增量一致有界\n     反例：「一直赌到赢一次为止」—— 停时期望有限但增量无界\n           ⇒ E[X_𝒯] ≠ E[X_0]（「赌徒必胜法」钻的正是这个空子）\n\n**极大不等式**（本讲真正要用的）：X_t 非负\n   上鞅： **P( max_{t∈ℕ} X_t ≥ ε ) ≤ E[X_0]/ε**          ← max 取遍**所有** t\n   下鞅： P( max_{t=1..n} X_t ≥ ε ) ≤ E[X_n]/ε           ← 只能取到 n\n\n   与马尔可夫对比：\n      马尔可夫：  P(X_t ≥ ε) ≤ E[X_t]/ε          **某一个固定时刻**\n      极大不等式：P(max_t X_t ≥ ε) ≤ E[X_0]/ε     **整条轨迹的最大值**\n      而右边代价**一模一样**（上鞅 E[X_t] ≤ E[X_0]）\n   ⇒ **「对所有 t 同时成立」在这里是免费的** —— 整讲最关键的那个「免费」\n\n   直觉：上鞅的期望只会往下走，要想在某刻变得很大，必须先「借」到足够期望，\n         而初值的期望把总量卡死了\n\n   ⚠ 下鞅版只能取到 n：因为它的期望在涨，取遍无穷就没有有限的界\n     （这也解释了 p9 图里「极大不等式」那条线为什么只画到 t ≤ 500）", "tbl": {"head": ["", "马尔可夫不等式", "极大不等式（上鞅）"], "rows": [["控住什么", "<b>某一个固定时刻</b> X<sub>t</sub>", "<b>整条轨迹的最大值</b>"], ["右边", "E[X<sub>t</sub>]/ε", "<b>E[X₀]/ε</b>"], ["代价差多少", "—", "<b>一模一样</b>"], ["t 的范围", "单点", "<b>所有 t ∈ ℕ</b>"], ["⇒ 结论", "—", "<b>「随时有效」是免费的</b>"]]}, "res": {"tag": "推断", "v": "<b>那条「停时」的定义，直接判定了你的实验设计合不合法——而这是一个很容易在不知不觉中违反的条件。</b><br><span class='k'>合法：「每跑完一批 query 就检查一次区间，一旦某个配置的区间完全低于领跑者就淘汰它」——淘汰的决定只依赖已看到的数据，<b>是</b>停时</span>。<br><span class='w'>⚠ 不合法：「把全部 query 跑完，事后找出最早能分出胜负的那一刻，然后报告那个样本量」——那<b>不是</b>停时</span>，<b>因为你是看着全部数据挑的那一刻</b>。<b>报出来的样本复杂度会系统性偏小，而且偏多少无法估计。</b><br><b>而极大不等式那条「免费」是这一讲对你最实惠的东西。</b> <span class='k'>它说：把界从「在第 n 步成立」加强到「对<b>所有</b> t 同时成立」，右边的代价<b>一模一样</b></span>。<b>翻译：你完全不必为「边跑边看」付额外的代价——只要把界构造成上鞅的形式</b>。<span class='w'>而你现在多半用的是「固定样本量的 Hoeffding + 反复查看」，那是无效的；或者用了「每轮分 δ/(2ℓ²)」的并集界，那是有效但偏保守的（p9 会量化它有多保守）。</span><br><b>⚠ 而 Doob 可选停止那个前提，对你有一个具体的提醒：你的停时必须<b>有界</b>。</b> <span class='k'>实际上它天然有界——你的 query 预算是有限的</span>。<b>所以第一个条件（<code>∃N: P(𝒯 ≤ N)=1</code>）自动满足</b>，<span class='w'>这是个好消息：你不必去验证那个更麻烦的「增量一致有界」条件</span>。<b>在论文里写一句「停时被总预算 N 界住，故可选停止定理的条件满足」就够了。</b><br>标【推断】：合法/不合法的判定与「预算有界自动满足」是我推的；自适应淘汰与预算有限在简报／前面讲里是【已核】。", "ref": "本讲 p6（逐行核对）· L16 主线卡 · CSE 541 L09 · 简报 §4c（已核）"}},
{"r": [7, 7], "t": "★ 随时有效的界：一条直线罩住整条轨迹", "star": 3, "quote": "<em>Let ε<sub>t</sub> be IID mean-zero 1-sub-Gaussian R.V. so that E[exp(λε<sub>t</sub>)] ≤ e<sup>λ²/2</sup>. S<sub>t</sub> = Σ<sub>s≤t</sub>ε<sub>s</sub></em><br><em><b>M<sub>t</sub>(λ) = exp(λS<sub>t</sub> − tλ²/2)</b> &nbsp;is supermartingale: &nbsp;E[M<sub>t+1</sub>(λ)|𝓕<sub>t</sub>] = exp(λS<sub>t</sub>−tλ²/2)·<u>E[e<sup>λε<sub>t+1</sub>−λ²/2</sup>|𝓕<sub>t</sub>]</u><sub>≤1</sub> ≤ M<sub>t</sub>(λ). &nbsp; M₀(λ) = 1</em><br><em>By maximal inequality: P(max<sub>t∈ℕ</sub>exp(λS<sub>t</sub>−tλ²/2) ≥ 1/δ) ≤ E[M₀(λ)]/(1/δ) = δ</em><br><em>⟹ <b>P( ∃t : S<sub>t</sub> ≥ tλ/2 + (1/λ)log(1/δ) ) ≤ δ</b></em>", "one": "<b>把指数上鞅塞进极大不等式，立刻得到一条对所有 t 同时成立的边界——而它是一条直线：斜率 λ/2，截距 (1/λ)log(1/δ)。</b>", "pts": ["<b>前两行是把 p5 的构造和 p6 的工具接起来，而接起来之后结果几乎是白送的。</b> <span class='k'><code>M_t(λ) = exp(λS_t − tλ²/2)</code> 是非负上鞅，<code>M_0(λ) = 1</code></span>；<b>极大不等式取 <code>ε = 1/δ</code>，直接得到 <code>P(max_t M_t(λ) ≥ 1/δ) ≤ δ</code>。</b>", "<b>然后只要把 <code>M_t(λ) ≥ 1/δ</code> 这个条件翻译回 <code>S_t</code> 的语言。</b> <span class='w'>取对数：<code>λS_t − tλ²/2 ≥ log(1/δ)</code>，解出 <code>S_t ≥ tλ/2 + (1/λ)log(1/δ)</code></span>。<b>于是：<code>P(∃t : S_t ≥ tλ/2 + (1/λ)log(1/δ)) ≤ δ</code>。</b>", "<b>这个式子要看清三件事，每一件都重要。</b> ① <b>它是 <code>∃t</code>——对<b>所有</b> t 同时成立</b>（<span class='k'>一次付费，终身有效</span>）；② <b>右端是 t 的<b>线性</b>函数</b>：斜率 <code>λ/2</code>，截距 <code>(1/λ)log(1/δ)</code>；③ <b><code>λ</code> 是你自己挑的</b>，挑完就固定。", "<b>第 ② 点的几何图像很清楚，页上那张图画的就是它。</b> <span class='w'>随机游走 <code>S_t</code> 上下乱走，而你在它上方画一条<b>直线</b></span>——<b>这条直线被整条轨迹（而不是某一点）以 1−δ 的概率罩住</b>。", "<b>而 <code>λ</code> 的选择是一个取舍，这是本页最该体会的一点。</b> <span class='k'><code>λ</code> 大 ⇒ 斜率大、截距小（早期紧、晚期松）；<code>λ</code> 小 ⇒ 斜率小、截距大（早期松、晚期紧）</span>。<b>一条直线不可能处处最紧——你只能挑一个「最关心的时刻」把它调到最优。</b>", "<b>页底那行写的正是这件事：<code>Fix n ∈ ℕ, let λ = √(2log(1/δ)/n)</code>。</b> <span class='w'>这个 <code>λ</code> 是为「我大概会在 n 步左右停」而调的</span>——<b>代进去会让这条直线在 <code>t = n</code> 处恰好触到最优值</b>（下一页验证）。", "<b>把这件事的实际含义说透：<b>如果你大致知道会跑多久，那么「随时有效」几乎不要钱</b>。</b> <span class='k'>你付出的只是「在别的时刻松一点」，而在你真正关心的那个时刻，界和固定时刻的 Chernoff 一样紧</span>。<b>这正是 p9 图 (a) 要展示的。</b>", "<b>注意假设有多弱：<code>ε_t</code> 只需要是<b>独立、零均值、1-次高斯</b>。</b> <span class='w'>不需要同分布、不需要高斯、不需要有界</span>。<b>⚠ 而「独立」这一条在下一步还会被进一步放松</b>（<span class='k'>p10 换成条件次高斯，连独立都不要了，只要<b>可预测</b>的方差</span>）。"], "eq": "把 p5 的构造塞进 p6 的工具：\n   M_t(λ) = exp(λS_t − tλ²/2) 是非负上鞅，M_0(λ) = 1\n   极大不等式取 ε = 1/δ：\n       P( max_{t∈ℕ} M_t(λ) ≥ 1/δ ) ≤ E[M_0(λ)]/(1/δ) = **δ**\n\n翻译回 S_t 的语言（取对数、解出 S_t）：\n   λS_t − tλ²/2 ≥ log(1/δ)   ⟺   S_t ≥ tλ/2 + (1/λ)log(1/δ)\n\n⇒ **P( ∃t : S_t ≥ t·λ/2 + (1/λ)·log(1/δ) ) ≤ δ**\n\n三件事：\n   ① **∃t** —— 对**所有** t 同时成立（一次付费，终身有效）\n   ② 右端是 t 的**线性**函数：斜率 λ/2，截距 (1/λ)log(1/δ)\n      几何：随机游走上下乱走，你在它上方画一条**直线**，整条轨迹被罩住\n   ③ λ 是你自己挑的，挑完固定\n\nλ 的取舍（一条直线不可能处处最紧）：\n   λ 大 ⇒ 斜率大、截距小  （早期紧、晚期松）\n   λ 小 ⇒ 斜率小、截距大  （早期松、晚期紧）\n   ⇒ 只能挑一个「最关心的时刻」调到最优\n\n   页底：**Fix n ∈ N, let λ = sqrt( 2log(1/δ) / n )**\n   —— 为「大概在 n 步左右停」而调；代进去会让直线在 t = n 处恰好触到最优（下一页）\n\n⇒ **如果你大致知道会跑多久，「随时有效」几乎不要钱**\n   你付出的只是「在别的时刻松一点」\n\n假设有多弱：ε_t 只需**独立、零均值、1-次高斯**\n   不需要同分布、不需要高斯、不需要有界\n   ⚠ 「独立」下一步还会被放松（p10：条件次高斯 + **可预测**的方差）", "res": {"tag": "推断", "v": "<b>这一页直接给了你 L16 主线卡里那条「自适应淘汰必须用随时有效的界」的<b>具体实现</b>，而且代价比你以为的小得多。</b><br><span class='k'>做法只有一行</span>：<b>把你现在用的「<code>|均值误差| ≤ √(2log(1/δ)/n)</code>」换成「<code>Σ_{s≤t}(X_s − μ) ≤ tλ/2 + (1/λ)log(1/δ)</code> 对所有 t 同时成立」，其中 <code>λ = √(2log(1/δ)/n_目标)</code></b>。<span class='w'><code>n_目标</code> 取你预计会跑的 query 数即可</span>。<br><b>而关键的好消息是：如果 <code>n_目标</code> 猜得差不多，这条界在那附近和固定样本量的 Hoeffding <b>一样紧</b></b>——<span class='k'>你白得了「随时可以停、随时可以淘汰」的合法性</span>。<b>⚠ 猜错了也不会失效，只是在远离 <code>n_目标</code> 的地方松一些。</b><br><b>这替换掉你现在多半在做的两件事之一，而两件都有问题</b>：<span class='w'>① 「固定样本量的界 + 反复查看一达标就停」——<b>无效</b>，实际失败概率远高于 δ；② 「每轮分 <code>δ/(2ℓ²)</code> 的并集界」——有效但保守</span>。<b>直线边界比 ② 更紧，而且实现更简单（不用分轮）。</b><br><b>⚠ 一处要当心：这一页的 <code>ε_t</code> 要求<b>独立</b>。</b> <span class='k'>你按 query 采样时，同一条 query 在不同配置下的结果是<b>相关</b>的</span>——<b>所以要把「一条 query 上的全部配置结果」打包成一个单位来算 <code>ε_t</code></b>，<b>而不能把它们当成独立的样本</b>。<span class='w'>这和 L13 那条「必须按 query 重采样」是同一条约束</span>。<b>好在 p10 会把独立性进一步放松成「条件次高斯」，那时打包就更自然了。</b><br>标【推断】：替换方案与打包的提醒是我推的；按 query 的相关性在前面讲里是【已核】。", "ref": "本讲 p7（逐行核对）· L16 主线卡 · CS234 L13 p32 · 简报 §4c（已核）"}},
{"r": [8, 8], "t": "和固定时刻的 Chernoff 对照，然后混合法登场", "star": 3, "quote": "<em>⟹ P(∃t : S<sub>t</sub> ≥ (t/√n + √n)√(log(1/δ)/2)) ≤ δ &nbsp;⟹&nbsp; <b>P(max<sub>t=1..n</sub> S<sub>t</sub> ≥ √(2n·log(1/δ))) ≤ δ</b></em><br><em><b>Chernoff Bound says P(S<sub>n</sub> ≥ √(2n log(1/δ))) ≤ δ</b></em><br><b>Method of Mixtures</b> — <em>Let h(λ) be a probability distribution over λ. Define &nbsp;<b>M̄<sub>t</sub> = E<sub>λ</sub>[M<sub>t</sub>(λ)] = ∫<sub>λ</sub>M<sub>t</sub>(λ)h(λ)dλ</b></em><br><em>M̄<sub>t</sub> is a supermartingale if M<sub>t</sub>(λ) is a superm.: &nbsp;E[M̄<sub>t+1</sub>|𝓕<sub>t</sub>] = ∫E[M<sub>t+1</sub>(λ)|𝓕<sub>t</sub>]h(λ)dλ ≤ ∫M<sub>t</sub>(λ)h(λ)dλ = M̄<sub>t</sub></em>", "one": "<b>把 λ 调到目标 n 上，这条直线在 t=n 处给出的正是固定时刻 Chernoff 的那个值——但它多给了「对 t=1..n 的最大值」。随时有效在这里<b>一分钱没多花</b>。</b>", "pts": ["<b>第一步是把 <code>λ = √(2log(1/δ)/n)</code> 代进上一页那条直线。</b> <span class='k'>算出来右端是 <code>(t/√n + √n)·√(log(1/δ)/2)</code></span>——<b>仍然是 t 的线性函数，只是系数展开了。</b>", "<b>第二步把 <code>t ≤ n</code> 代进去，就得到了本页的关键对照。</b> <span class='w'><code>t ≤ n</code> 时 <code>t/√n ≤ √n</code>，所以右端 <code>≤ 2√n·√(log(1/δ)/2) = √(2n log(1/δ))</code></span>；<b>于是 <code>P(max_{t=1..n} S_t ≥ √(2n log(1/δ))) ≤ δ</code>。</b>", "<b>而固定时刻的 Chernoff 界给的是 <code>P(S_n ≥ √(2n log(1/δ))) ≤ δ</code>——<b>右端一模一样</b>。</b> <span class='k'>区别只在左边：Chernoff 只管 <code>t = n</code> 这<b>一个</b>时刻，而上面那条管 <code>t = 1,…,n</code> 的<b>最大值</b></span>。", "<b>把这件事说到位：<b>「对前 n 步的最大值成立」和「只对第 n 步成立」，价钱完全相同。</b></b> <span class='w'>这不是近似相同，是同一个数</span>。<b>所以「我边跑边看、随时可能停」这件事，在正确构造下<b>不花钱</b></b>——<span class='k'>这是整讲最值得带走的一条。</span>", "<b>但一条直线仍然有局限，而这就是混合法的动机。</b> <span class='w'>你必须<b>事先</b>挑一个 <code>λ</code>，也就是事先猜一个 <code>n</code></span>；<b>猜错了，在远处就很松</b>。<span class='k'>而真正自适应的算法根本不知道自己会跑多久。</span>", "<b>最笨的办法是对一串 <code>λ</code> 做并集界，但那要付 <code>log(个数)</code>。</b> <b>混合法的办法更聪明：对 <code>λ</code> 取一个<b>概率分布</b> <code>h(λ)</code>，然后把 <code>M_t(λ)</code> <b>平均</b>起来</b>——<span class='w'><code>M̄_t = ∫M_t(λ)h(λ)dλ</code></span>。", "<b>而这件事之所以可行，靠的是一个两行的验证：<b>上鞅的混合还是上鞅</b>。</b> <span class='k'><code>E[M̄_{t+1}|𝓕_t] = ∫E[M_{t+1}(λ)|𝓕_t]h(λ)dλ ≤ ∫M_t(λ)h(λ)dλ = M̄_t</code></span>——<b>交换积分与条件期望（Fubini），再逐个用上鞅性质。</b>", "<b>于是 <code>M̄_t</code> 也是非负上鞅、<code>M̄_0 = 1</code>，极大不等式照样能用。</b> <span class='w'>而它对应的边界<b>不再是直线</b></span>——<b>因为 <code>M̄_t</code> 是对所有 λ 的平均，它在每个 t 上都「借用」了那个最适合该 t 的 λ</b>。<span class='k'>下一页会把积分算出来，看到一条弯曲的边界。</span>", "<b>这个想法的精神值得单独点一句：<b>与其在多个候选之间做并集界（付 log 个数），不如对它们取平均（付一个更小的代价）</b>。</b> <span class='w'>这是统计里反复出现的一个技巧</span>——<b>而下一页那两张图会把「省了多少」画出来。</b>"], "eq": "代入 λ = sqrt(2log(1/δ)/n)：\n   右端 = (t/sqrt(n) + sqrt(n))·sqrt(log(1/δ)/2)\n   t ≤ n 时 t/sqrt(n) ≤ sqrt(n) ⇒ 右端 ≤ 2sqrt(n)·sqrt(log(1/δ)/2) = **sqrt(2n·log(1/δ))**\n\n   ⇒ P( **max_{t=1..n}** S_t ≥ sqrt(2n log(1/δ)) ) ≤ δ\n   而 Chernoff：P( **S_n** ≥ sqrt(2n log(1/δ)) ) ≤ δ\n                 └ 右端**一模一样** ┘\n\n⇒ **「对前 n 步的最大值成立」与「只对第 n 步成立」，价钱完全相同**\n   不是近似相同，是同一个数\n   ⇒ 「边跑边看、随时可能停」在正确构造下**不花钱** ← 整讲最值得带走的一条\n\n一条直线的局限：必须**事先**挑 λ（= 事先猜 n），猜错了在远处很松\n   而真正自适应的算法根本不知道自己会跑多久\n\n**混合法**：对 λ 取概率分布 h(λ)，把 M_t(λ) **平均**起来\n   M̄_t = E_λ[M_t(λ)] = ∫ M_t(λ) h(λ) dλ\n\n   可行性（两行验证）：**上鞅的混合还是上鞅**\n      E[M̄_{t+1}|𝓕_t] = ∫ E[M_{t+1}(λ)|𝓕_t] h(λ)dλ ≤ ∫ M_t(λ)h(λ)dλ = M̄_t\n      （交换积分与条件期望 = Fubini，再逐个用上鞅性质）\n\n   ⇒ M̄_t 也是非负上鞅、M̄_0 = 1 ⇒ 极大不等式照用\n     而它对应的边界**不再是直线** —— M̄_t 在每个 t 上都「借用」了最适合该 t 的 λ\n\n精神：**与其在多个候选间做并集界（付 log 个数），不如对它们取平均（付更小的代价）**", "tbl": {"head": ["", "固定时刻 Chernoff", "直线边界（p7）", "混合法（p9）"], "rows": [["在哪些 t 成立", "<span class='w'>只在 t = n</span>", "<b>所有 t ∈ ℕ</b>", "<b>所有 t ∈ ℕ</b>"], ["在 t = n 处的值", "√(2n log(1/δ))", "<b>一样</b>", "略大"], ["要事先猜 n 吗", "<b>要</b>", "<b>要</b>（挑 λ）", "<b>不要</b>"], ["边界形状", "—", "直线", "<b>弯曲</b>"], ["猜错了", "<span class='w'>无效</span>", "远处很松", "<b>各处都还行</b>"]]}},
{"r": [9, 9], "t": "混合法算出来：弯曲的边界，和那两张对照图", "star": 3, "quote": "<em>define h(λ) = (1/√(2πν²))e<sup>−λ²/(2ν²)</sup></em><br><em>M̄<sub>t</sub> = ∫exp(λS<sub>t</sub>−tλ²/2)·h(λ)dλ = <b>√(ν<sup>−2</sup>/(t+ν<sup>−2</sup>))·exp(S<sub>t</sub>²(t+ν<sup>−2</sup>)<sup>−1</sup>/2)</b></em><br><em>P(∃t : |S<sub>t</sub>| ≥ √(2(t+ν<sup>−2</sup>)(log(1/δ) + ½log((t+ν<sup>−2</sup>)/ν<sup>−2</sup>)))) = P(∃t : M̄<sub>t</sub> ≥ 1/δ) ≤ δ</em><br><b>图 (a)</b>〔δ=0.05〕 <em>The '<b>fixed time Chernoff</b>' represents √(2t log(1/δ)) which holds at each t <b>but not all t ≤ 500 simultaneously</b> (which is why it is dotted). The '<b>max inequality</b>' holds for all t ≤ 500, and the <b>linear boundaries</b> hold for all t ∈ ℕ simultaneously.</em><br><b>图 (b)</b> <em>… All other curves do hold for all t ∈ ℕ simultaneously. “<b>union bound 2t²</b>” plots √(2log(2t²/δ)).</em>", "one": "<b>取 λ 的高斯先验，积分有闭式——得到一条弯曲的边界。而那两张图把所有做法画在一起：弯曲边界比并集界紧得多，而且全程有效。</b>", "pts": ["<b>取 <code>h(λ) = N(0, ν²)</code>，<code>M̄_t</code> 的积分就是一个高斯积分，能算出闭式。</b> <span class='k'><code>∫exp(λS_t − tλ²/2)·exp(−λ²/(2ν²))dλ</code> 是「指数里关于 λ 的二次型」，配方即可</span>。<b>结果是 <code>M̄_t = √(ν^{-2}/(t+ν^{-2}))·exp(S_t²/(2(t+ν^{-2})))</code>。</b>", "<b>令 <code>M̄_t ≥ 1/δ</code> 反解出 <code>S_t</code>，就得到边界</b>：<b><code>|S_t| ≥ √(2(t+ν^{-2})(log(1/δ) + ½log((t+ν^{-2})/ν^{-2})))</code></b>。<span class='w'>⚠ 板书上 <code>ν²</code> 与 <code>ν^{-2}</code> 混用了几处，本精读按「先验方差为 <code>ν²</code>、而 <code>ν^{-2}</code> 起正则化作用」来读；<b>要的是形状，不是常数</b>。</span>", "<b>看这个形状：<code>√(t·log t)</code> 量级。</b> <span class='k'>对比固定时刻的 <code>√(t·log(1/δ))</code>，多出来的是一个 <code>log t</code></span>——<b>而那正是「不事先猜 n、对所有 t 都有效」的代价</b>。<span class='w'>这也正是 CSE541 L16 讲的重对数律所刻画的那个量级。</span>", "<b>而 <code>ν²</code> 的作用是「你觉得 <code>λ</code> 大概多大」，也就是间接地「你大概会跑多久」。</b> <span class='k'>它不像直线边界那样<b>必须</b>猜准——猜偏了只是在某些区段略松</span>。<b>图 (b) 里画了 <code>ν²=0.03</code> 与 <code>ν²=10</code> 两条，正是在展示这个敏感性。</b>", "⚠️ <b>下半页那两张排版图是这一讲最该看的东西，而它们的说明文字把每条线的有效范围标得很清楚。</b>", "<b>图 (a)（δ=0.05，t 到 500）比较四类</b>：<span class='w'><b>固定时刻 Chernoff</b> <code>√(2t log(1/δ))</code>——<b>画成虚线，因为它在每个 t 成立但<b>不对 t ≤ 500 同时成立</b></b></span>；<b><b>极大不等式</b>——对 t ≤ 500 成立（图上是一条水平线，约 55）</b>；<b>三条<b>直线</b>边界（λ = 0.11 / 0.20 / 0.30）——对<b>所有</b> t ∈ ℕ 同时成立</b>。", "<b>图 (a) 要读出的那件事是：三条直线各自在不同的 t 处与虚线相切。</b> <span class='k'>λ=0.11 那条在 t≈400 附近最贴，λ=0.30 那条在早期最贴</span>——<b>这就是 p7 说的「一条直线只能在一个地方最紧」的可视化</b>。<span class='w'>而在它最紧的那个点上，它和固定时刻 Chernoff 几乎重合——「随时有效几乎免费」就是这个意思。</span>", "<b>图 (b) 换成全程 <code>t ∈ ℕ</code>，比较的是三类「真正全程有效」的做法。</b> <span class='k'><b>并集界 <code>2t²</code></b>：画的是 <code>√(2log(2t²/δ))</code>——<b>对每个 t 分配 <code>δ/(2t²)</code> 的失败预算，再用 Basel 求和</b></span>；<b>两条<b>弯曲边界</b>（混合法，<code>ν²=0.03</code> 与 <code>ν²=10</code>）</b>；<b>以及作为参照的虚线固定时刻 Chernoff。</b>", "<b>图 (b) 的结论一眼就能看出：<b>弯曲边界明显比并集界低</b></b>（<span class='w'>图上橙色的 union bound 一路在最上面，而两条弯曲边界夹在它和虚线之间</span>）。<b>也就是说：混合法比「每轮分 <code>δ/(2t²)</code>」的做法更紧，而两者都是全程有效的。</b>", "<b>⚠ 这一点对实践很重要，因为「并集界 <code>2t²</code>」正是本课 L06/L07 那套 <code>δ/(2ℓ²)</code> + Basel 的做法。</b> <span class='k'>那套做法简单、好实现、而且本课一直在用</span>；<b>但图 (b) 说明它是<b>可以改进</b>的，而改进的办法就是混合法</b>。<span class='w'>代价是那个积分要算（高斯先验下有闭式，所以也不算贵）。</span>"], "eq": "取 h(λ) = N(0, ν²)，积分有闭式（指数里关于 λ 的二次型，配方即可）：\n   M̄_t = sqrt( ν^{−2} / (t + ν^{−2}) ) · exp( S_t² / (2(t + ν^{−2})) )\n\n令 M̄_t ≥ 1/δ 反解：\n   **|S_t| ≥ sqrt( 2(t+ν^{−2})·( log(1/δ) + ½log((t+ν^{−2})/ν^{−2}) ) )**\n   ⚠ 板书 ν² 与 ν^{−2} 混用了几处；本精读按形状读，不按常数\n\n形状：**sqrt( t·log t )** 量级\n   对比固定时刻的 sqrt(t·log(1/δ))，多出一个 **log t**\n   = 「不事先猜 n、对所有 t 都有效」的代价（正是 L16 重对数律刻画的量级）\n\nν² 的作用：「你觉得 λ 大概多大」= 间接地「大概会跑多久」\n   不像直线那样**必须**猜准 —— 猜偏了只是某些区段略松\n\n══ 两张排版对照图（δ = 0.05）══\n\n图 (a)（t 到 500）：\n   固定时刻 Chernoff  sqrt(2t log(1/δ))   **虚线** —— 每个 t 成立但**不对 t≤500 同时成立**\n   极大不等式                              对 t ≤ 500 成立（水平线，约 55）\n   三条**直线**边界 λ=0.11/0.20/0.30       对**所有** t∈N 同时成立\n\n   要读出的：三条直线各自在不同 t 处与虚线相切\n     λ=0.11 在 t≈400 附近最贴；λ=0.30 在早期最贴\n   ⇒ 「一条直线只能在一个地方最紧」的可视化\n     而在最紧的那点上它与固定时刻 Chernoff 几乎重合 ⇒ **随时有效几乎免费**\n\n图 (b)（全程 t∈N）：\n   **并集界 2t²**：sqrt(2log(2t²/δ)) —— 给每个 t 分 δ/(2t²)，再 Basel 求和\n   两条**弯曲边界**（混合法，ν²=0.03 与 ν²=10）\n   虚线固定时刻 Chernoff 作参照\n\n   结论一眼可见：**弯曲边界明显比并集界低**\n     （橙色 union bound 一路在最上面，两条弯曲边界夹在它与虚线之间）\n\n   ⚠ 「并集界 2t²」正是本课 L06/L07 那套 δ/(2ℓ²) + Basel 的做法\n     它简单、好实现，但图 (b) 说明**可以改进** —— 改进的办法就是混合法\n     （代价是那个积分，高斯先验下有闭式，不算贵）", "tbl": {"head": ["做法", "有效范围", "紧不紧", "要猜 n 吗"], "rows": [["固定时刻 Chernoff", "<span class='w'>只在单个 t</span>", "<b>最紧（基准）</b>", "要"], ["极大不等式", "t ≤ n", "水平线，远处很松", "要"], ["直线边界", "<b>所有 t</b>", "<b>在调好的那点几乎=基准</b>", "要（挑 λ）"], ["并集界 2t²", "<b>所有 t</b>", "<span class='w'>最松</span>", "<b>不要</b>"], ["<b>混合法（弯曲）</b>", "<b>所有 t</b>", "<b>比并集界紧得多</b>", "<b>不要</b>（只要个 ν²）"]]}, "res": {"tag": "已核", "v": "<b>图 (b) 直接告诉你：你现在用的那套「每轮分 δ/(2ℓ²) + Basel 求和」是可以改进的，而且改进幅度是画出来的。</b><br><span class='k'>图里那条橙色的 <b>union bound 2t²</b>（<code>√(2log(2t²/δ))</code>）正是本课 L06/L07 那套做法——而我在 L16 主线卡里还把它当成「省事的替代」推荐给你</span>。<b>图 (b) 显示它一路在最上面，而两条混合法的弯曲边界明显更低。</b><br><b>所以更准确的建议是三档</b>：<span class='w'>① <b>最省事</b>：<code>δ/(2ℓ²)</code> 并集界——实现最简单，但最松；② <b>最紧且几乎免费</b>：<b>直线边界</b>，<code>λ = √(2log(1/δ)/n_目标)</code>——只要你大致知道会跑多少 query，它在那附近和固定样本量的 Hoeffding 一样紧；③ <b>不想猜</b>：混合法的弯曲边界，代价是算一个高斯积分（有闭式）</span>。<b>⇒ 对你，<b>②</b> 多半是最佳选择：你的 query 预算是事先定的，所以 <code>n_目标</code> 你知道。</b><br><b>而那个 <code>√(t log t)</code> 的形状给了你一个可以直接算的数。</b> <span class='k'>「不猜 n」相对「猜对 n」要多付一个 <code>√(log t)</code> 的因子</span>——<b><code>t = 1000</code> 时 <code>log t ≈ 7</code>，<code>√7 ≈ 2.6</code></b>。<span class='w'>也就是说完全自适应要付约 2.6 倍的宽度，而猜对 n 则几乎不付</span>。<b>这个数值得在选方案时算一下：2.6 倍的区间宽度意味着约 7 倍的样本量，不是小数目。</b><br><b>⚠ 最后提醒一处容易混的：图 (a) 里那条「极大不等式」的水平线<b>不是</b> p6 那条引理本身，而是它用在一个<b>有界</b>的构造上的结果。</b> <span class='k'>p6 的极大不等式是工具，图里那条线是某个具体用法</span>——<b>而它只对 t ≤ 500 有效（下鞅版的限制），所以别把它当成全程有效的方案。</b><br>标【已核】：三张图的有效范围与各条曲线的身份均为图说明文字逐句核对；三档建议与 2.6 倍的估算是我据此推的。", "ref": "本讲 p9 两张图及其说明文字（逐句核对）· L16 主线卡（此处作了细化）· L06 · L07 p6 · 简报 §4c（已核）"}},
{"r": [10, 10], "t": "可预测的方差：把 t 换成 V_t", "star": 3, "quote": "<em>We say σ<sub>t</sub> is <b>predictable</b> if σ<sub>t</sub> is 𝓕<sub>t−1</sub>-measurable.</em><br><em>Suppose for any λ we have E[ε<sub>t</sub>|𝓕<sub>t−1</sub>] = 0 and <b>E[exp(λε<sub>t</sub>)|𝓕<sub>t−1</sub>] ≤ exp(λ²σ<sub>t</sub>²/2)</b>, and define S<sub>t</sub> = Σ<sub>s≤t</sub>ε<sub>s</sub>. Then with <b>V<sub>t</sub> = Σ<sub>s≤t</sub>σ<sub>s</sub>²</b>, &nbsp;<b>M<sub>t</sub>(λ) = exp(λS<sub>t</sub> − λ²V<sub>t</sub>/2)</b> is a supermartingale.</em><br><em>P(∃t : S<sub>t</sub> ≥ λV<sub>t</sub>/2 + (1/λ)log(1/δ)) ≤ δ</em><br><em>Define M̄<sub>t</sub> = E<sub>λ~h</sub>[M<sub>t</sub>(λ)], h(λ) = (1/√(2π))e<sup>−λ²/2</sup>: &nbsp;<b>P(∃t : |S<sub>t</sub>| ≥ √((V<sub>t</sub>+1)log((V<sub>t</sub>+1)/δ))) ≤ δ</b></em>", "one": "<b>把「样本数 t」换成「累计方差 V_t」，整套机器照样转。于是界会自动适应——方差小的那些步，几乎不往界里加东西。</b>", "pts": ["<b>这一页做了两处放松，而两处都很有价值。</b> <span class='k'>① 不再要求 <code>ε_t</code> <b>独立同分布</b>，只要求<b>条件</b>零均值与<b>条件</b>次高斯；② 每一步的次高斯参数 <code>σ_t</code> 可以不同，而且可以<b>依赖历史</b></span>。", "<b>第 ② 条里「依赖历史」要加一个限定，这就是<b>可预测</b>的意思</b>：<span class='w'><code>σ_t</code> 必须是 <code>𝓕_{t−1}</code> 可测的——<b>在看到 <code>ε_t</code> 之前就已经确定</b></span>。<b>⚠ 注意是 <code>t−1</code> 不是 <code>t</code></b>：<span class='k'>你可以根据「到上一步为止的一切」来决定这一步的方差尺度，但不能用这一步的结果</span>。", "<b>这个区别听起来技术，但它正是「自适应算法」能被分析的原因。</b> <span class='w'>你的算法在第 t 步选哪条臂、投入多少，都可以依赖历史——这正是可预测</span>；<b>而只要它是可预测的，整套鞅机器就照样成立。</b>", "<b>有了这两处放松，构造只改一个字：把 <code>t</code> 换成 <code>V_t = Σ_{s≤t}σ_s²</code>。</b> <b><code>M_t(λ) = exp(λS_t − λ²V_t/2)</code></b>，<span class='k'>验证上鞅的那一行和 p7 一模一样</span>。<b>于是界也只改一个字：<code>P(∃t : S_t ≥ λV_t/2 + (1/λ)log(1/δ)) ≤ δ</code>。</b>", "<b>而这一个字的替换，带来的实际差别很大。</b> <span class='w'>原来的界按<b>步数</b>增长；现在按<b>累计方差</b>增长</span>——<b>如果某些步的噪声很小（<code>σ_s</code> 小），它们对界的贡献就很小</b>。<span class='k'>界因此自动「认出」哪些观测是有信息的。</span>", "<b>混合之后得到 <code>P(∃t : |S_t| ≥ √((V_t+1)log((V_t+1)/δ))) ≤ δ</code>。</b> <span class='w'>⚠ 常数按板书录</span>；<b>要记的是形状：<code>√(V_t·log V_t)</code>，而不是 <code>√(t·log t)</code>。</b>", "<b>页下那个红色的例子（梯度下降分析）是在展示这套工具的另一个用处。</b> <span class='k'><code>w_{t+1} = w_t − η∇f_t(w_t)</code>，其中 <code>E[f_t(w)] = f(w)</code>（随机梯度）</span>；<b>要证的是 <code>E[f(w_t) − f(w_*)] ≤ RG/√t</code>，其中 <code>R = ‖w_1 − w_*‖₂</code>、<code>G = ‖∇f_t(w)‖₂</code></b>。", "<b>而接法是：令 <code>ε_t = f(w_t) − E[f(w_t)|𝓕_{t−1}]</code>，它是一个<b>鞅差</b>序列。</b> <span class='w'>于是「随机梯度下降的收敛分析」就变成了「给一个鞅差和找上界」</span>——<b>正是这一页的工具。</b><span class='k'>这说明鞅型置信界不只用于 bandit，它是在线学习分析的通用件。</span>", "<b>⚠ 注意这里的 <code>ε_t</code> 定义本身就体现了「可预测」：<code>E[f(w_t)|𝓕_{t−1}]</code> 是用历史算的</b>，<span class='w'>所以 <code>ε_t</code> 自动是条件零均值的</span>。<b>这种「减去自己的条件期望」的构造，是把任何适应序列变成鞅差的标准手法，值得单独记。</b>"], "eq": "两处放松：\n   ① 不要求 ε_t **独立同分布**，只要**条件**零均值 + **条件**次高斯：\n        E[ε_t|𝓕_{t−1}] = 0,   E[exp(λ ε_t)|𝓕_{t−1}] ≤ exp(λ² σ_t² / 2)\n   ② 每步的次高斯参数 σ_t 可不同，且可**依赖历史**\n\n   ⚠ 「依赖历史」的限定 = **可预测**：σ_t 关于 **𝓕_{t−1}** 可测\n     —— 在看到 ε_t **之前**就已确定；是 t−1 不是 t\n     可以用「到上一步为止的一切」决定这一步的方差尺度，但不能用这一步的结果\n\n   ⇒ 这正是「自适应算法」能被分析的原因：\n     算法第 t 步选哪条臂、投入多少，都可依赖历史 = 可预测\n     只要可预测，整套鞅机器照样成立\n\n构造只改一个字：t ──▶ **V_t = Σ_{s≤t} σ_s²**\n   **M_t(λ) = exp( λ S_t − λ² V_t / 2 )**        （上鞅的验证与 p7 一模一样）\n   ⇒ P( ∃t : S_t ≥ λV_t/2 + (1/λ)log(1/δ) ) ≤ δ\n\n   实际差别很大：界按**累计方差**增长，不按**步数**增长\n   ⇒ 噪声小的那些步（σ_s 小）对界的贡献就小\n     ⇒ 界自动「认出」哪些观测是有信息的\n\n混合后：P( ∃t : |S_t| ≥ sqrt( (V_t+1)·log((V_t+1)/δ) ) ) ≤ δ\n   ⚠ 常数按板书录；要记的是形状 **sqrt(V_t·log V_t)** 而非 sqrt(t·log t)\n\n红字例（梯度下降）：w_{t+1} = w_t − η∇f_t(w_t)，E[f_t(w)] = f(w)\n   要证 E[f(w_t) − f(w_*)] ≤ R·G/sqrt(t)，R = ‖w_1−w_*‖₂，G = ‖∇f_t(w)‖₂\n   接法：令 ε_t = f(w_t) − E[f(w_t)|𝓕_{t−1}] ⇒ **鞅差**序列\n   ⇒ 「SGD 的收敛分析」变成「给鞅差和找上界」= 这一页的工具\n     （鞅型置信界不只用于 bandit，是在线学习分析的通用件）\n\n⚠ 「减去自己的条件期望」把任何适应序列变成鞅差 —— 标准手法，值得单独记", "tbl": {"head": ["", "p7 的版本", "本页的版本"], "rows": [["对 ε<sub>t</sub> 的要求", "<b>独立</b>、1-次高斯", "<b>条件</b>零均值 + <b>条件</b>次高斯"], ["方差", "固定为 1", "<b>σ<sub>t</sub>²，可随历史变</b>"], ["要求", "—", "<b>σ<sub>t</sub> 可预测（𝓕<sub>t−1</sub> 可测）</b>"], ["界里出现", "t", "<b>V<sub>t</sub> = Σσ<sub>s</sub>²</b>"], ["好处", "—", "<b>噪声小的步几乎不加宽界</b>"]]}, "res": {"tag": "推断", "v": "<b>把 <code>t</code> 换成 <code>V_t</code> 这一下，对你的意义比看起来大——因为你的观测方差<b>极不均匀</b>。</b><br><span class='k'>你的 Acc 是伯努利的，方差是 <code>p(1−p)</code></span>。<b>而「全对」或「全错」的 query 上 <code>p</code> 贴近 1 或 0，方差<b>接近零</b></b>；<span class='w'>只有中间那层难度的 query 方差大</span>。<b>⇒ 用按 <code>t</code> 增长的界，每条 query 都同样加宽区间；而用按 <code>V_t</code> 增长的界，<b>那些没信息的 query 几乎不加宽</b>。</b><br><b>这把我前面给你的两条建议合成了一条、而且更好。</b> <span class='k'>我先前说「按 <code>σ(1−σ)</code> 给 query 加权筛选」（L09 科研格）、又说「按难度分层」（S&amp;B 第 8 章）</span>——<b>而 <code>V_t</code> 版的界<b>自动</b>做到了这件事，不需要你显式筛</b>：<span class='w'>你照常跑，没信息的 query 自己就不占预算（在界的意义上）</span>。<b>当然显式筛掉它们能省真实的 API 调用，所以两者都要：显式筛省钱，<code>V_t</code> 版的界省区间宽度。</b><br><b>而「可预测」那个条件，正好是你的自适应淘汰能被分析的原因。</b> <span class='k'>你第 t 轮测哪些配置、各测多少，是根据<b>前几轮</b>的结果定的——这是 <code>𝓕_{t−1}</code> 可测，正是可预测</span>。<b>⚠ 要当心的是别用上「这一轮的结果」来决定「这一轮测什么」</b>，<span class='w'>那会破坏可预测性</span>。<b>听起来不可能违反，但有一种写法会</b>：<b>「先把这一轮的全部结果拿到，再决定这一轮哪些算数」</b>——<b>那就违反了。</b><br><b>最后那个「减去自己的条件期望就得到鞅差」的手法，你应该收进工具箱。</b> <span class='k'>任何适应序列 <code>Y_t</code>，令 <code>ε_t = Y_t − E[Y_t|𝓕_{t−1}]</code> 就是鞅差</span>——<b>于是任何「随时间累积、而且每步依赖历史」的量，都能套这一页的界</b>。<span class='w'>你的累计成本、累计准确率、甚至「到目前为止领跑者的优势」，都可以这么处理。</span>", "ref": "本讲 p10（逐行核对）· CSE 541 L09 p5 科研格 · S&B 第 8 章 C08.b p14 科研格 · 简报 §4e §4f（已核）"}},
{"r": [11, 11], "t": "向量版：自归一化界与白化图", "star": 3, "quote": "<em>Suppose ε₁,ε₂,… ∈ ℝᵈ is 𝔽-adapted satisfying <b>E[exp(⟨λ,ε<sub>t</sub>⟩)|𝓕<sub>t−1</sub>] ≤ exp(‖λ‖²<sub>Σ<sub>t</sub></sub>/2)</b> for all λ ∈ ℝᵈ, where Σ<sub>t</sub> ∈ ℝ<sup>d×d</sup> is a <b>predictable</b> sequence. &nbsp; S<sub>t</sub> = Σ<sub>s≤t</sub>ε<sub>s</sub>, V<sub>t</sub> = Σ<sub>s≤t</sub>Σ<sub>s</sub></em><br><em><b>M<sub>t</sub>(λ) = exp(⟨λ,S<sub>t</sub>⟩ − ‖λ‖²<sub>V<sub>t</sub></sub>/2)</b> &nbsp; P(∃t : ⟨λ,S<sub>t</sub>⟩ − ‖λ‖²<sub>V<sub>t</sub></sub>/2 ≥ log(1/δ)) ≤ δ</em><br><em>M̄<sub>t</sub> = E<sub>λ~h</sub>[M<sub>t</sub>(λ)], &nbsp; h(λ) = N(0, (1/γ)I<sub>d</sub>)</em><br><em><b>P( ∃t : ‖S<sub>t</sub>‖<sub>(V<sub>t</sub>+γI)<sup>−1</sup></sub> ≥ √( 2log(1/δ) + log(|V<sub>t</sub>+γI| / γᵈ) ) ) ≤ δ</b></em>", "one": "<b>把标量换成向量，λ 的先验换成 d 维高斯，混合之后得到的就是著名的自归一化界——而它的几何含义是：白化之后，整条轨迹被一个固定半径的球罩住。</b>", "pts": ["<b>向量化的改动是机械的，但要看清对应关系。</b> <span class='k'>标量的 <code>λ²σ_t²</code> 换成 <code>‖λ‖²_{Σ_t} = λᵀΣ_tλ</code>；<code>V_t = Σ_sσ_s²</code> 换成 <code>V_t = Σ_sΣ_s</code>（矩阵求和）</span>；<b><code>M_t(λ) = exp(⟨λ,S_t⟩ − ‖λ‖²_{V_t}/2)</code>。</b>", "<b>⚠ 注意 <code>Σ_t</code> 仍然要求<b>可预测</b>——这一条在下一页会变得极关键。</b> <span class='w'>因为在在线线性回归里 <code>Σ_t = x_tx_tᵀ</code>，而 <code>x_t</code> 是算法<b>自己选</b>的</span>；<b>「可预测」正好允许这件事（选 <code>x_t</code> 只能用历史），而「独立」就不允许。</b>", "<b>固定一个 λ 的界只是中间产物，真正要的是对<b>所有</b> λ 同时成立——这就是混合法在这里的作用。</b> <span class='k'>取 <code>h(λ) = N(0, (1/γ)I_d)</code></span>，<b>积分仍有闭式（高斯的二次型积分）</b>。", "<b>结果就是那条有名的<b>自归一化界</b></b>：<br><b><code>P(∃t : ‖S_t‖_{(V_t+γI)^{-1}} ≥ √(2log(1/δ) + log(|V_t+γI|/γ^d))) ≤ δ</code></b>。<span class='w'>「自归一化」的意思是：左边不是 <code>‖S_t‖</code> 本身，而是 <code>S_t</code> 用它<b>自己</b>累积的方差矩阵归一化之后的长度。</span>", "<b>页下那两张图把这件事画得很好，值得对着看。</b> <span class='k'><b>左图</b>：一个<b>细长的椭圆</b>（<code>V_t + γI</code> 的形状），里面是乱走的 <code>S_t</code>——<b>某些方向上走得远，某些方向上走得近</b></span>；<span class='k'><b>右图</b>：做了 <code>(V_t+γI)^{-1/2}</code> 变换之后，椭圆变成<b>圆</b>，而轨迹被一个固定半径 <code>√(2log(1/δ) + log(·))</code> 的圆罩住</span>。", "<b>这就是「白化」的几何含义：<b>把各方向的不确定性拉成一样大</b>。</b> <span class='w'>测得多的方向 <code>V_t</code> 大、除下来就压扁；测得少的方向 <code>V_t</code> 小、除下来就放大</span>——<b>于是在白化后的坐标里，所有方向平等，一个球就够了。</b>", "<b>那个 <code>γI</code> 的作用要说一句：它是<b>正则化</b>，而且是必需的。</b> <span class='k'>刚开始时 <code>V_t</code> 可能奇异（某些方向还没测过），<code>V_t^{-1}</code> 不存在</span>；<b>加上 <code>γI</code> 保证可逆</b>。<span class='w'>而它在界里的代价出现在 <code>log(|V_t+γI|/γ^d)</code> 这一项上。</span>", "<b>看那一项的量级：<code>log(|V_t+γI|/γ^d)</code>，而行列式是 d 个特征值的乘积。</b> <span class='k'>若各方向大致均衡地增长到 <code>t/d</code>，则 <code>|V_t+γI| ≈ (t/d+γ)^d</code>，于是这一项 ≈ <code>d·log(t/(dγ)+1)</code></span>——<b><b>维数 d 乘以 <code>log t</code></b></b>。<span class='w'>这正是 LinUCB 一类算法遗憾界里那个 <code>d log T</code> 的来源。</span>", "<b>把这一页放回全讲的脉络：从 p5 的一个指数上鞅出发，经过「随时有效 → 混合 → 可预测方差 → 向量」四步放松，得到了一个可以直接驱动算法的置信集。</b> <span class='k'>每一步都只改一处，而最终的东西（椭球）和起点（<code>exp(λS_t − tλ²/2)</code>）看起来毫无关系</span>——<b>这种「小步推进、终点很远」的结构，是这一讲最值得学的东西。</b>"], "eq": "向量化（机械的对应）：\n   λ²σ_t²  ──▶  ‖λ‖²_{Σ_t} = λ^T Σ_t λ\n   V_t = Σ_s σ_s²  ──▶  V_t = Σ_s Σ_s（矩阵求和）\n   **M_t(λ) = exp( ⟨λ, S_t⟩ − ‖λ‖²_{V_t}/2 )**\n\n   ⚠ Σ_t 仍要求**可预测** —— 下一页极关键：\n     在线线性回归里 Σ_t = x_t x_t^T，而 x_t 是算法**自己选**的\n     「可预测」正好允许（选 x_t 只能用历史）；「独立」就不允许\n\n混合（h(λ) = N(0, (1/γ)I_d)，积分仍有闭式）⇒ **自归一化界**：\n\n   **P( ∃t : ‖S_t‖_{(V_t+γI)^{−1}} ≥ sqrt( 2log(1/δ) + log( |V_t+γI| / γ^d ) ) ) ≤ δ**\n\n   「自归一化」：左边不是 ‖S_t‖ 本身，而是 S_t 用它**自己**累积的方差矩阵归一化后的长度\n\n两张图（白化的几何）：\n   左：**细长的椭圆**（V_t+γI 的形状），里面乱走的 S_t —— 各方向走得远近不同\n   右：做 (V_t+γI)^{−1/2} 变换后椭圆变**圆**，轨迹被半径 sqrt(2log(1/δ)+log(·)) 的圆罩住\n\n   ⇒ 白化 = **把各方向的不确定性拉成一样大**\n     测得多的方向 V_t 大、除下来压扁；测得少的方向 V_t 小、除下来放大\n     ⇒ 白化后所有方向平等，一个球就够\n\nγI 的作用：**正则化**，必需的\n   刚开始 V_t 可能奇异（某些方向还没测过），V_t^{−1} 不存在；加 γI 保证可逆\n   代价出现在 log(|V_t+γI|/γ^d) 这一项\n\n   量级：行列式 = d 个特征值之积；若各方向均衡增长到 t/d\n         则 |V_t+γI| ≈ (t/d+γ)^d ⇒ 该项 ≈ **d·log(t/(dγ)+1)** = 维数 × log t\n         ⇒ 这正是 LinUCB 遗憾界里那个 **d log T** 的来源\n\n全讲脉络：从 p5 一个指数上鞅出发，经「随时有效 → 混合 → 可预测方差 → 向量」四步放松，\n          得到可以直接驱动算法的置信集。每步只改一处，而终点与起点看起来毫无关系。", "tbl": {"head": ["放松的步骤", "改了什么", "换来什么"], "rows": [["p7 随时有效", "极大不等式替代马尔可夫", "<b>对所有 t 同时成立（免费）</b>"], ["p8–p9 混合", "对 λ 取先验再平均", "<b>不必事先猜 n</b>"], ["p10 可预测方差", "t → V<sub>t</sub>", "<b>界自动适应实际方差</b>"], ["p11 向量", "标量 → ℝᵈ，λ 的先验 → N(0,I/γ)", "<b>自归一化界 / 置信椭球</b>"], ["⇒ 代价项", "log(|V<sub>t</sub>+γI|/γᵈ)", "<b>≈ d·log t</b>"]]}, "res": {"tag": "推断", "v": "<b>这条自归一化界就是你那套做法最终该用的置信集，而「可预测」那个条件正是它允许自适应采样的原因。</b><br><span class='k'>⚠ 这一点值得单独强调，因为它解决了一个你一定会遇到的麻烦</span>：<b>你的配置是<b>自己挑</b>的（一步偏离扫描、逐次淘汰都在挑），所以观测<b>不是</b> i.i.d. 的</b>。<span class='w'>按普通的集中不等式，自己挑的样本会让界失效</span>——<b>而这一页的条件只要求 <code>Σ_t = x_tx_tᵀ</code> <b>可预测</b>，也就是「挑 <code>x_t</code> 时只用历史」</b>。<b>你的做法天然满足。</b><br><b>⇒ 所以你可以<b>一边自适应地选配置、一边保持置信界有效</b></b>，<span class='k'>而这在固定设计的框架里是做不到的</span>。<b>这是一个值得在方法一节里明说的技术点，因为审稿人很可能会问「你自己挑的样本，置信界还成立吗」。</b><br><b>而那个 <code>log(|V_t+γI|/γ^d) ≈ d·log t</code> 的量级，给了你一个可以直接算的代价。</b> <span class='w'>你的 <code>d = H×k</code>，若 H=10、k=2 则 d=20</span>；<b>跑 1000 条 query 时这一项约 <code>20·log(50) ≈ 78</code>，而 <code>2log(1/δ)</code> 在 δ=0.05 时约 6</b>。<span class='k'>⇒ 代价项是主导的，比置信水平那一项大一个数量级</span>。<b>这说明：在你的规模下，<b>维数</b>而不是<b>置信水平</b>决定了区间宽度</b>——<b>所以压低 d（减少档位数、合并节点）比放松 δ 有用得多。这是一个很实际的设计结论。</b><br><b>⚠ 还有一条要注意：γ 不能太小。</b> <span class='w'><code>log(|V_t+γI|/γ^d)</code> 里 <code>γ^d</code> 在分母上，<code>γ → 0</code> 时这一项发散</span>——<b>而 <code>γ</code> 太大又会在 p13 的界里带来 <code>√γ‖θ_*‖₂</code> 的偏差项</b>。<span class='k'>标准做法是取 <code>γ</code> 为 1 量级</span>，<b>而你应该把它当成一个要报告的超参数，不是随手设的。</b>", "ref": "本讲 p11（逐行核对）· p13 · 简报 §4c §4d（已核）· CSE 541 L07 p4 科研格"}},
{"r": [12, 12], "t": "在线线性回归：把那套机器接到岭回归上", "star": 3, "quote": "<b>Online Linear Regression</b> — <em>for t=1,2,…: Observe x<sub>t</sub> ∈ ℝᵈ; Player predicts ŷ<sub>t</sub> = ⟨x<sub>t</sub>,θ̂<sub>t</sub>⟩; Observe y<sub>t</sub> = ⟨x<sub>t</sub>,θ<sub>*</sub>⟩ + ε<sub>t</sub></em><br><em>θ̂<sub>t+1</sub> = argmin<sub>θ</sub>Σ<sub>s≤t</sub>(y<sub>s</sub> − ⟨θ,x<sub>s</sub>⟩)² + <b>γ‖θ‖²₂</b> = (<u>Σ<sub>s</sub>x<sub>s</sub>x<sub>s</sub>ᵀ</u><sub>V<sub>t</sub></sub> + γI)<sup>−1</sup>Σ<sub>s</sub>x<sub>s</sub>y<sub>s</sub> = <b>(V<sub>t</sub>+γI)<sup>−1</sup>V<sub>t</sub>θ<sub>*</sub> + (V<sub>t</sub>+γI)<sup>−1</sup>S<sub>t</sub></b>, &nbsp; S<sub>t</sub> = Σ<sub>s≤t</sub>x<sub>s</sub>ε<sub>s</sub></em><br><em>x<sub>t</sub> is 𝓕<sub>t−1</sub> measurable. &nbsp; 取 ε<sub>s</sub> ← x<sub>s</sub>ε<sub>s</sub>, Σ<sub>s</sub> ← x<sub>s</sub>x<sub>s</sub>ᵀ: &nbsp; E[exp(⟨λ,x<sub>s</sub>ε<sub>s</sub>⟩)|𝓕<sub>s−1</sub>] ≤ exp(⟨λ,x<sub>s</sub>⟩²/2) = exp(‖λ‖²<sub>x<sub>s</sub>x<sub>s</sub>ᵀ</sub>/2)</em>", "one": "<b>岭回归的误差分解出一个 S_t = Σ x_s ε_s。而只要把上一页的 ε 换成 x_s ε_s、Σ 换成 x_s x_sᵀ，那条自归一化界就直接套上了。</b>", "pts": ["<b>设定是<b>在线</b>的，而且顺序很关键。</b> <span class='k'>每一轮：先观察到 <code>x_t</code>，再用当前的 <code>θ̂_t</code> 预测，再看到 <code>y_t</code></span>。<b>⚠ 注意 <code>x_t</code> 可以是对手给的，也可以是算法自己选的——下一页的 LinUCB 就是自己选。</b>", "<b>估计量是<b>岭回归</b>（加了 <code>γ‖θ‖²₂</code> 的正则项），解有闭式。</b> <span class='w'><code>θ̂_{t+1} = (V_t + γI)^{-1}Σ_s x_sy_s</code>，其中 <code>V_t = Σ_s x_sx_sᵀ</code></span>——<b>而那个 <code>γI</code> 正是上一页说的正则化，它保证了 <code>t</code> 很小时也可逆。</b>", "<b>接下来把 <code>y_s = ⟨θ_*,x_s⟩ + ε_s</code> 代回去，得到一个很有意思的分解。</b> <b><code>θ̂_{t+1} = (V_t+γI)^{-1}V_tθ_* + (V_t+γI)^{-1}S_t</code></b>，<span class='k'>其中 <code>S_t = Σ_{s≤t}x_sε_s</code></span>。", "<b>这两项各有名字，分清很有用。</b> <span class='w'>第一项 <code>(V_t+γI)^{-1}V_tθ_*</code> 是<b>正则化带来的收缩偏差</b>——注意它<b>不</b>等于 <code>θ_*</code>（差一个 <code>(V_t+γI)^{-1}V_t ≠ I</code>）</span>；<b>第二项 <code>(V_t+γI)^{-1}S_t</code> 是<b>噪声项</b></b>。<span class='k'>γ→0 时第一项趋于 θ_*、偏差消失，但矩阵可能不可逆——这就是 γ 的取舍。</span>", "<b>而噪声项里那个 <code>S_t = Σ_s x_sε_s</code>，正好是上一页那个向量鞅的形状。</b> <span class='w'>它是一串向量 <code>x_sε_s</code> 的和</span>——<b>于是只要验证它满足上一页的条件，整条界就直接套上。</b>", "<b>验证只有三行，而且很漂亮。</b> <span class='k'>取 <code>ε_s ← x_sε_s</code>、<code>Σ_s ← x_sx_sᵀ</code></span>：<br><code>E[exp(⟨λ, x_sε_s⟩)|𝓕_{s−1}] = E[exp(⟨λ,x_s⟩·ε_s)|𝓕_{s−1}] ≤ exp(⟨λ,x_s⟩²/2) = exp(λᵀx_sx_sᵀλ/2) = exp(‖λ‖²_{x_sx_sᵀ}/2)</code>。", "<b>看清每一步用了什么</b>：<span class='w'>第一个等号把内积提出来（<code>⟨λ, x_sε_s⟩ = ⟨λ,x_s⟩·ε_s</code>，因为 <code>ε_s</code> 是标量）</span>；<b>第二步用 <code>ε_s</code> 的 1-次高斯性，<b>而 <code>⟨λ,x_s⟩</code> 在给定 <code>𝓕_{s−1}</code> 时是已知常数</b></b>；<span class='k'>后两步是纯粹的改写。</span>", "⚠️ <b>第二步那个「<code>⟨λ,x_s⟩</code> 是已知常数」正是整页的枢纽，而它依赖于「<code>x_t</code> 关于 <code>𝓕_{t−1}</code> 可测」。</b> <span class='w'>页上专门写了这一句</span>。<b>如果 <code>x_s</code> 可以依赖 <code>ε_s</code>（也就是看到噪声之后再选测量点），这一步就垮了。</b>", "<b>这就把「可预测」这个抽象条件落成了一句具体的话：<b>你必须在看到这一轮的结果<b>之前</b>决定这一轮测什么</b>。</b> <span class='k'>而这正是在线算法天然满足的——你当然不可能先看结果再选动作</span>。<b>所以这套界对任何合法的在线/自适应算法都成立，不需要额外假设。</b>", "<b>最后两行开始把 <code>θ̂ − θ_*</code> 的范数拆开</b>：<span class='w'><code>‖θ̂_{t+1} − θ_*‖_{(V_t+γI)} = ‖S_t − γθ_*‖_{(V_t+γI)^{-1}} ≤ ‖S_t‖_{(V_t+γI)^{-1}} + γ‖θ_*‖_{(V_t+γI)^{-1}}</code></span>——<b>噪声项 + 偏差项，而下一页分别处理。</b>"], "eq": "在线线性回归（顺序关键）：\n   每轮：先观察 x_t ──▶ 用当前 θ̂_t 预测 ŷ_t = ⟨x_t, θ̂_t⟩ ──▶ 观察 y_t = ⟨x_t,θ_*⟩ + ε_t\n   ⚠ x_t 可以是对手给的，也可以是算法**自己选**的（下一页 LinUCB 就是自己选）\n\n岭回归（加 γ‖θ‖²₂）：\n   θ̂_{t+1} = (V_t + γI)^{−1} Σ_s x_s y_s,      V_t = Σ_{s≤t} x_s x_s^T\n\n   代入 y_s = ⟨θ_*,x_s⟩ + ε_s 得分解：\n   θ̂_{t+1} = **(V_t+γI)^{−1} V_t θ_***  +  **(V_t+γI)^{−1} S_t**,   S_t = Σ_{s≤t} x_s ε_s\n              └ 正则化的收缩**偏差** ┘      └ **噪声**项 ┘\n              （≠ θ_*，因为 (V_t+γI)^{−1}V_t ≠ I；γ→0 偏差消失但可能不可逆）\n\n噪声项里的 S_t = Σ_s x_s ε_s 正好是上一页那个向量鞅的形状\n   ⇒ 验证条件（三行）：取 ε_s ← x_s ε_s，Σ_s ← x_s x_s^T\n\n   E[ exp(⟨λ, x_s ε_s⟩) | 𝓕_{s−1} ]\n     = E[ exp( ⟨λ,x_s⟩ · ε_s ) | 𝓕_{s−1} ]        内积提出（ε_s 是标量）\n     ≤ exp( ⟨λ,x_s⟩² / 2 )                        ε_s 是 1-次高斯，\n                                                  **而 ⟨λ,x_s⟩ 给定 𝓕_{s−1} 时是已知常数**\n     = exp( λ^T x_s x_s^T λ / 2 ) = exp( ‖λ‖²_{x_s x_s^T} / 2 )\n\n⚠ 「⟨λ,x_s⟩ 是已知常数」是整页的枢纽，它依赖「x_t 关于 𝓕_{t−1} 可测」\n   若 x_s 可依赖 ε_s（看到噪声再选测量点），这一步就垮了\n   ⇒ 「可预测」落成一句具体的话：**必须在看到这一轮结果之前决定这一轮测什么**\n     而在线算法天然满足 ⇒ 这套界对任何合法的在线/自适应算法都成立\n\n最后拆范数：\n   ‖θ̂_{t+1} − θ_*‖_{(V_t+γI)} = ‖S_t − γθ_*‖_{(V_t+γI)^{−1}}\n                               ≤ ‖S_t‖_{(V_t+γI)^{−1}} + γ‖θ_*‖_{(V_t+γI)^{−1}}\n                                 └ 噪声 ┘             └ 偏差 ┘"},
{"r": [13, 13], "t": "置信椭球与 LinUCB", "star": 3, "quote": "<em>≤ ‖S<sub>t</sub>‖<sub>(V<sub>t</sub>+γI)<sup>−1</sup></sub> + <b>√γ‖θ<sub>*</sub>‖₂</b></em><br><em><b>P( ∃t : ‖θ̂<sub>t+1</sub> − θ<sub>*</sub>‖<sub>(V<sub>t</sub>+γI)</sub> ≥ √γ‖θ<sub>*</sub>‖₂ + √( 2log(1/δ) + log(|V<sub>t</sub>+γI|/γᵈ) ) ) ≤ δ</b></em><br><b>UCB</b>: <em>x<sub>t</sub> = argmax<sub>x∈𝒳</sub> UCB<sub>t</sub>(x), &nbsp; <b>UCB<sub>t</sub>(x) = max<sub>θ∈C<sub>t</sub></sub>⟨θ, x⟩</b>, &nbsp; <b>C<sub>t</sub> = {θ : ‖θ − θ̂<sub>t</sub>‖<sub>(V<sub>t</sub>+γI)</sub> ≤ β<sub>t</sub>}</b></em>", "one": "<b>把噪声项和偏差项合起来，得到一个对所有 t 同时成立的置信椭球。然后 LinUCB 只有一行：在椭球里取最乐观的 θ，选它下最好的那条臂。</b>", "pts": ["<b>先把偏差项收干净：<code>γ‖θ_*‖_{(V_t+γI)^{-1}} ≤ √γ‖θ_*‖₂</code>。</b> <span class='k'>因为 <code>(V_t+γI)^{-1} ⪯ (1/γ)I</code>（<code>V_t</code> 半正定），所以那个范数 <code>≤ ‖θ_*‖₂/√γ</code>，再乘 γ 得 <code>√γ‖θ_*‖₂</code></span>。", "<b>于是最终的界有两项，而且各自的性质很不一样。</b> <span class='w'><b>偏差项 <code>√γ‖θ_*‖₂</code></b>：<b>不随 t 变化</b>，是一个常数——正则化的固定代价</span>；<span class='w'><b>噪声项 <code>√(2log(1/δ) + log(|V_t+γI|/γ^d))</code></b>：随 t 缓慢增长（<code>≈ √(d log t)</code>）</span>。", "<b>注意偏差项依赖 <code>‖θ_*‖₂</code>——一个你不知道的量。</b> <span class='k'>实践中要么假设一个上界 <code>‖θ_*‖₂ ≤ B</code>（这是标准做法，而且必须在论文里声明），要么把 γ 取得很小</span>。<b>⚠ 而 γ 太小又会让 <code>log(|V_t+γI|/γ^d)</code> 发散（p11 那条）——两头都不能走极端。</b>", "<b>整条界的含义是：<b>以 1−δ 的概率，对<b>所有</b> t，真参数 <code>θ_*</code> 都落在以 <code>θ̂_t</code> 为心的那个椭球里</b>。</b> <span class='w'>椭球的形状由 <code>V_t+γI</code> 决定（测得多的方向窄、测得少的方向宽），半径由右端那个 <code>β_t</code> 决定</span>。", "<b>而 LinUCB 只有一行，但那一行把前面十三页全用上了。</b> <code>C_t = {θ : ‖θ − θ̂_t‖_{(V_t+γI)} ≤ β_t}</code> 是置信椭球；<b><code>UCB_t(x) = max_{θ∈C_t}⟨θ,x⟩</code> 是「在椭球里取最乐观的 θ」；<code>x_t = argmax_x UCB_t(x)</code> 选上界最高的臂。</b>", "<b>那个 <code>max_{θ∈C_t}⟨θ,x⟩</code> 有闭式，值得记。</b> <span class='k'>在椭球上最大化线性函数：<code>= ⟨θ̂_t, x⟩ + β_t·‖x‖_{(V_t+γI)^{-1}}</code></span>——<b>「当前估值」加「<b>这条臂方向上的不确定度</b>乘以半径」</b>。<span class='w'>这就是 UCB 那个熟悉的「均值 + 加成」形式，只是加成项换成了马氏范数。</span>", "<b>而 <code>‖x‖_{(V_t+γI)^{-1}}</code> 正是 L07 一路在用的那个量。</b> <span class='k'>G-最优设计要最小化它的最大值；这里它直接出现在动作选择里</span>——<b>两讲在这里合流了：L07 问「怎么分配测量使它小」，本讲问「怎么用它来选动作」。</b>", "<b>把整讲从头看一遍，这条线很清楚</b>：<span class='w'>指数上鞅（p5）→ 随时有效（p7）→ 混合（p9）→ 可预测方差（p10）→ 向量（p11）→ 岭回归（p12）→ 椭球与 LinUCB（p13）</span>。<b>每一步只改一处，而终点是一个能跑的算法。</b>", "⚠️ <b>最后记一条本讲<b>没</b>给的东西：LinUCB 的遗憾界。</b> <span class='k'>讲义到「算法长什么样」为止，没有分析它</span>。<b>而那个分析的主项正是 <code>β_T·√(T·d log T)</code> 量级</b>——<span class='w'>其中 <code>β_T ≈ √(d log T)</code> 来自本页的界</span>。<b>要引用遗憾界必须查原文（Abbasi-Yadkori 等人的 OFUL），不能引讲义。</b>", "✅ <b>补记（2026-10-12）：那条界<b>本课有</b>——就在 <b>L10</b>，不必只靠原文理解了。</b> <span class='k'>L10 p2 给出 <code>R_T ≤ √(8T·β_T·log(|V_T|/|V_0|)) ≤ √(8dT·β_T·log((dλ+TL²)/(dλ)))</code>，p4 给出证它所需的<b>椭圆势引理</b></span>。<b>⇒ 两讲的分工是：<b>本讲给 β_T（置信集有多大），L10 给「有了 β_T 之后遗憾是多少」</b></b>。<span class='w'>⚠ <b>引用</b>仍然该引 OFUL 原文——L10 也是手写板书，常数与精确条件都在原文里。</span>", "⚠️ <b>读 L10 之前先注意一处记号冲突，否则两边的数会差一个平方。</b> <span class='k'><b>本讲的 <code>β_t</code> 是<b>半径</b></b>（<code>‖θ̂−θ_*‖_{V} ≤ β_t</code>）；<b>而 L10 的 <code>β_t</code> 是<b>半径的平方</b></b>（<code>C_t = {θ : ‖θ−θ̂_t‖²_{V_t} ≤ β_t}</code>）</span>。<b>所以本讲的 <code>β_T ≈ √(d log T)</code> 与 L10 的 <code>β_T ≈ d log T</code> 说的是同一件事。</b><span class='w'>代进去两边都得到 <code>d·√T·log T</code>，是一致的——但<b>照抄哪一边的公式都必须先确认用的是哪个约定</b>。</span>"], "eq": "收干净偏差项：γ‖θ_*‖_{(V_t+γI)^{−1}} ≤ **sqrt(γ)·‖θ_*‖₂**\n   （因 (V_t+γI)^{−1} ⪯ (1/γ)I，故该范数 ≤ ‖θ_*‖₂/sqrt(γ)，再乘 γ）\n\n**最终的置信界**（对所有 t 同时成立）：\n   ‖θ̂_{t+1} − θ_*‖_{(V_t+γI)} ≤ **sqrt(γ)‖θ_*‖₂** + **sqrt( 2log(1/δ) + log(|V_t+γI|/γ^d) )**\n                                 └ 偏差：**不随 t 变** ┘  └ 噪声：≈ sqrt(d log t) ┘\n\n   ⚠ 偏差项依赖 ‖θ_*‖₂ —— 一个你不知道的量\n     实践：假设上界 ‖θ_*‖₂ ≤ B（标准做法，必须在论文里声明），或 γ 取小\n     ⚠ 但 γ 太小会让 log(|V_t+γI|/γ^d) 发散（p11）⇒ 两头都不能走极端\n\n含义：以 1−δ 的概率，对**所有** t，θ_* 都落在以 θ̂_t 为心的椭球里\n      椭球形状由 V_t+γI 定（测得多的方向窄、少的方向宽），半径是 β_t\n\n**LinUCB**（一行，但用上了前面十三页）：\n   C_t = { θ : ‖θ − θ̂_t‖_{(V_t+γI)} ≤ β_t }          置信椭球\n   UCB_t(x) = max_{θ∈C_t} ⟨θ, x⟩                      在椭球里取最乐观的 θ\n   x_t = argmax_{x∈𝒳} UCB_t(x)\n\n   闭式（在椭球上最大化线性函数）：\n   UCB_t(x) = ⟨θ̂_t, x⟩ + β_t · **‖x‖_{(V_t+γI)^{−1}}**\n              └ 当前估值 ┘   └ 这条臂方向上的不确定度 × 半径 ┘\n   = UCB 熟悉的「均值 + 加成」，只是加成换成了马氏范数\n\n   而 ‖x‖_{(V_t+γI)^{−1}} 正是 L07 一路在用的量：\n      L07 问「怎么分配测量使它的最大值小」\n      本讲问「怎么用它来选动作」                    ⇒ 两讲在这里合流\n\n全讲的线：指数上鞅(p5) → 随时有效(p7) → 混合(p9) → 可预测方差(p10)\n          → 向量(p11) → 岭回归(p12) → 椭球与 LinUCB(p13)\n          每步只改一处，终点是一个能跑的算法\n\n⚠ 本讲**没**给 LinUCB 的遗憾界（讲义到「算法长什么样」为止）\n   那个分析的主项是 β_T·sqrt(T·d log T) 量级，其中 β_T ≈ sqrt(d log T) 来自本页\n   要引用必须查原文（Abbasi-Yadkori 等人的 OFUL），不能引讲义\n\n✅ 补记（2026-10-12）：那条界**本课有** —— 就在 **L10**\n   L10 p2：R_T ≤ sqrt(8T·β_T·log(|V_T|/|V_0|)) ≤ sqrt(8dT·β_T·log((dλ+TL²)/(dλ)))\n   L10 p4：**椭圆势引理** Σ_t (1 ∧ ‖x_t‖²_{V_{t−1}^{−1}}) ≤ 2log(|V_T|/|V_0|)\n           ⚠ 它对**任意**序列成立（不要求随机/独立/由算法产生）—— 纯线性代数\n   ⇒ 分工：**本讲给 β_T，L10 给「有了 β_T 之后遗憾是多少」**\n   ⚠ 引用仍该引 OFUL 原文（L10 也是手写板书）\n\n⚠⚠ 记号冲突，否则两边的数差一个平方：\n   **本讲 β_t = 半径**（‖θ̂−θ_*‖_V ≤ β_t）\n   **L10  β_t = 半径的平方**（C_t = {θ : ‖θ−θ̂_t‖²_{V_t} ≤ β_t}）\n   ⇒ 本讲 β_T ≈ sqrt(d log T) 与 L10 β_T ≈ d log T 是同一件事\n     两边代进去都得到 d·sqrt(T)·log T，一致；但照抄公式前必须确认用的是哪个约定", "tbl": {"head": ["", "偏差项", "噪声项"], "rows": [["形式", "<b>√γ‖θ*‖₂</b>", "<b>√(2log(1/δ) + log(|V<sub>t</sub>+γI|/γᵈ))</b>"], ["随 t 变吗", "<b>不变（常数）</b>", "<span class='w'>缓慢增长 ≈ √(d log t)</span>"], ["γ 变大", "<span class='w'>变大</span>", "<b>变小</b>"], ["γ 变小", "<b>变小</b>", "<span class='w'>发散</span>"], ["⚠ 依赖未知量吗", "<b>依赖 ‖θ*‖₂，要假设上界 B</b>", "不依赖"]]}, "res": {"tag": "推断", "v": "<b>这个置信椭球是你那套方法该用的最终形式，而它和 CSE541 L07 在这里合流——两讲各管一半。</b><br><span class='k'>L07 问「怎么分配测量预算，使 <code>max_x ‖x‖_{A(λ)^{-1}}</code> 最小」；本讲问「有了测量之后，怎么把 <code>‖x‖_{(V_t+γI)^{-1}}</code> 变成一个<b>随时有效</b>的置信区间」</span>。<b>⇒ 完整的流程是：用 L07 解设计、用本讲算区间、用 L09 的 ρ_* 判何时停。三讲各出一块。</b><br><b>而那个闭式 <code>UCB_t(x) = ⟨θ̂_t,x⟩ + β_t‖x‖_{(V_t+γI)^{-1}}</code> 可以直接用在你的配置上</b>：<span class='w'>把配置写成指示向量 <code>x</code>，<code>⟨θ̂_t,x⟩</code> 就是该配置的 G 估计，而 <code>β_t‖x‖_{(V_t+γI)^{-1}}</code> 是它的不确定度</span>。<b>⚠ 但注意：UCB 是为<b>遗憾最小化</b>设计的（L09 p12 那条），所以你不该用它来<b>选测哪个</b>——你该用它来<b>算区间</b>，然后按 L16 p47 的信息价值去分配预算。</b><span class='k'>同一个量，两种用法，别混。</span><br><b>而两项代价的取舍给了你一个具体的调参指引。</b> <span class='w'>偏差项 <code>√γ‖θ_*‖₂</code> 不随 t 变，噪声项随 <code>√(d log t)</code> 增长</span>；<b>⇒ 在你的规模下（d≈20、t≈1000），噪声项约 <code>√(78+6) ≈ 9</code>，而偏差项是 <code>√γ·‖θ_*‖₂</code></b>。<span class='k'>若 <code>‖θ_*‖₂</code> 是 1 量级、γ 取 1，则偏差项约 1——比噪声项小一个数量级</span>。<b>⇒ γ 取 1 量级是安全的，不必为了压偏差而冒矩阵奇异的风险。</b><br><b>⚠ 两处必须在论文里声明的。</b> ① <b><code>‖θ_*‖₂ ≤ B</code> 这个假设</b>——<span class='w'>它是必需的、而且无法从数据验证</span>，<b>要说清你取的 B 是怎么来的（比如由 Acc∈[0,1] 与 Cost 上限推出的自然界）</b>；② <b>本讲没给 LinUCB 的遗憾界</b>——<span class='k'>要引用必须查 OFUL 原文，不能引讲义</span>；<b>⇒ 但要<b>理解</b>它，本课 L10 讲了（p2 的界 + p4 的椭圆势引理）</b>，<span class='w'>⚠ 注意 L10 的 <code>β</code> 是本讲 <code>β</code> 的<b>平方</b></span>。<br>标【推断】：三讲分工、两种用法的区分与 γ 的数值估算是我推的；配置的指示向量表示在前面讲里是【已核】。", "ref": "本讲 p13（逐行核对）· CSE 541 L07 · L09 p12 科研格 · CS234 L16 p47 · 简报 §4c §4d（已核）"}, "link": {"t": "你学过的对应：本课 L07 精读（‖x‖_{A⁻¹} 这个量在那里是「要最小化的设计目标」，在这里是「动作选择里的加成项」——两讲在这里合流）", "href": "L07-精读.html"}}
