var TH = {"title": "L12 接上课题的哪一段：自适应淘汰的置信界，到底该用哪一条", "arc": "<b>我在 L16 主线卡里提出过一条需求：<b>自适应淘汰必须用「随时有效」的界</b>，否则一边跑一边看、一达标就停，实际失败概率会远高于名义的 δ。这一讲就是那套机器，而且它给出的答案比我当时推荐的更好。</b><br><br><b>最该带走的一句话：<b>「随时有效」几乎是免费的。</b></b> <span class='k'>p8 的对照很干净——取 <code>λ = √(2log(1/δ)/n)</code> 之后，那条直线边界在 <code>t ≤ n</code> 上给出的右端是 <code>√(2n·log(1/δ))</code>，<b>与固定时刻 Chernoff 一模一样</b></span>；<b>区别只在左边：Chernoff 只管 <code>t = n</code> 这一个时刻，而它管 <code>t = 1…n</code> 的<b>最大值</b></b>。<span class='w'>不是近似相同，是同一个数。</span><br><br><b>⇒ 于是选哪条界成了一个三档的工程决定，而 p9 那两张排版图把它们画在了一起：</b><br>· <b>① 最省事</b>：<code>δ/(2ℓ²)</code> 并集界 + Basel 求和（本课 L06/L07 一直在用，也是我先前推荐给你的）。<span class='w'>⚠ 图 (b) 显示它就是那条「union bound 2t²」，一路在最上面，<b>最松</b></span>。<br>· ⭐ <b>② 最紧且几乎免费</b>：<b>直线边界</b>，<code>λ = √(2log(1/δ)/n_目标)</code>。<span class='k'>只要你大致知道会跑多少 query，它在那附近和固定样本量的 Hoeffding 一样紧</span>。<b>你的预算是事先定的，所以 <code>n_目标</code> 你知道 ⇒ 这多半是你的最佳选择。</b><br>· <b>③ 不想猜 n</b>：混合法的弯曲边界（对 λ 取高斯先验再平均，有闭式）。<span class='w'>形状是 <code>√(t·log t)</code>，比 ② 多一个 <code>√(log t)</code> —— <code>t=1000</code> 时约 2.6 倍的区间宽度，折算成样本量约 7 倍</span>。<b>不小，所以能猜就猜。</b><br><br><b>而「可预测」这个条件（p10–p12）解决了你一个一定会被问到的麻烦：<b>自己挑的样本，置信界还成立吗？</b></b> <span class='k'>你的配置是自己挑的（一步偏离扫描、逐次淘汰都在挑），所以观测<b>不是</b> i.i.d.</span>。<b>而这套界只要求 <code>Σ_t = x_tx_tᵀ</code> <b>可预测</b>——「挑 <code>x_t</code> 时只用历史」</b>，<span class='w'>而在线算法天然满足（你不可能先看结果再选动作）</span>。<b>⇒ 你可以一边自适应地选配置、一边保持置信界有效，而这在固定设计的框架里做不到。</b><br><br><b>另外两样可以直接用上的。</b><br>· <b><code>V_t</code> 而不是 <code>t</code></b>（p10）：界按<b>累计方差</b>而不是<b>步数</b>增长。<span class='k'>你的 Acc 是伯努利的、方差是 <code>p(1−p)</code>，而「全对/全错」的 query 方差接近零</span>——<b>⇒ 用 <code>V_t</code> 版的界，那些没信息的 query <b>自动</b>几乎不加宽区间，不需要你显式去筛</b>。<span class='w'>（显式筛仍然要做，那是省真实的 API 调用；两件事不冲突。）</span><br>· <b>置信椭球与 LinUCB</b>（p13）：<code>UCB_t(x) = ⟨θ̂_t,x⟩ + β_t‖x‖_{(V_t+γI)^{-1}}</code>。<span class='k'>而 <code>‖x‖_{A^{-1}}</code> 正是 L07 的 G-最优设计要最小化的那个量</span>——<b>两讲在这里合流：L07 问「怎么分配测量使它小」，本讲问「怎么用它算区间」。</b><br><br><b>⚠ 但别把 UCB 当成选测哪个的规则。</b> <span class='w'>L09 p12 说过：UCB/Thompson 是为<b>遗憾最小化</b>设计的，它们把样本集中在「看起来好」的臂上；而你要的是<b>识别</b>，该按 CS234 L16 p47 的信息价值分配</span>。<b>同一个 <code>‖x‖_{A^{-1}}</code>，一个拿去算区间（用），一个拿去选动作（不用）——别混。</b>", "pitfalls": [{"v": "<b>用固定样本量的置信界，却在过程中反复查看、一达标就停。</b> <span class='w'>这是自适应淘汰最常见、也最致命的错误——实际失败概率远高于名义 δ</span>。<b>⚠ 而它看起来完全无害，因为每一次单独查看都「是对的」</b>。<span class='k'>正确做法见上面那三档，而 ② 几乎不要钱。</span>", "tag": "已核", "ref": "本讲 p7–p9（逐行核对）· L16 主线卡"}, {"v": "<b>事后挑一个「最早能分出胜负的时刻」当作停止时刻。</b> <span class='k'>停时要求「停的决定只依赖<b>已看到</b>的数据」</span>——<b><code>τ = min{t : …}</code> 是停时，<code>τ = max{t : …}</code> <b>不是</b></b>。<span class='w'>「跑完全部 query 再回头找最早分出胜负的那一刻」属于后者</span>，<b>报出来的样本复杂度会系统性偏小，而且偏多少无法估计。</b>", "tag": "已核", "ref": "本讲 p6（两个例子，逐行核对）· L16 主线卡"}, {"v": "<b>在看到这一轮结果之后，再决定这一轮哪些算数。</b> <span class='w'>这破坏<b>可预测性</b>，而可预测性正是 p12 那一步推导的枢纽（「<code>⟨λ,x_s⟩</code> 给定 <code>𝓕_{s−1}</code> 时是已知常数」）</span>。<b>⚠ 听起来不可能违反，但有一种写法会</b>：<b>「先把这一轮的全部结果拿到，再决定哪些纳入统计」</b>。<span class='k'>合法的做法是：先定规则，再跑，结果一律纳入。</span>", "tag": "已核", "ref": "本讲 p10 · p12（逐行核对）"}, {"v": "<b>把一条 query 上不同配置的结果当成独立样本。</b> <span class='w'>它们是<b>相关</b>的（同一道题的难度）</span>——<b>要把「一条 query 上的全部配置结果」打包成一个单位</b>。<span class='k'>这和 CS234 L13 那条「必须按 query 重采样」是同一条约束</span>。<b>好在 p10 把独立性放松成了条件次高斯，打包之后反而更自然。</b>", "tag": "推断", "ref": "本讲 p7 · p10 · CS234 L13 p32 科研格"}, {"v": "<b>γ 取得太小以求减少偏差。</b> <span class='k'>最终界有两项：偏差 <code>√γ‖θ_*‖₂</code>（不随 t 变）与噪声 <code>√(2log(1/δ)+log(|V_t+γI|/γ^d))</code></span>；<b>⚠ <code>γ → 0</code> 时后者<b>发散</b>（<code>γ^d</code> 在分母上）</b>。<span class='w'>d≈20、t≈1000 时噪声项约 9，而 γ=1、‖θ_*‖₂≈1 时偏差项约 1</span>——<b>⇒ γ 取 1 量级是安全的，不必为压偏差冒矩阵奇异的风险。而 γ 是要报告的超参数，不是随手设的。</b>", "tag": "推断", "ref": "本讲 p11 · p13（逐行核对）"}, {"v": "<b>用 LinUCB 来决定「下一步测哪个配置」。</b> <span class='w'>UCB 是为<b>遗憾最小化</b>设计的，它把样本集中在「看起来好」的臂上</span>；<b>而你是离线识别，该按信息价值分配预算（CS234 L16 p47），那可能要去测一条你永远不会部署的配置</b>。<span class='k'>⇒ <code>‖x‖_{A^{-1}}</code> 拿去<b>算区间</b>是对的，拿去<b>选动作</b>就错了目标。</span>", "tag": "推断", "ref": "本讲 p13 · CSE 541 L09 p12 科研格 · CS234 L16 p47"}, {"v": "<b>引用 LinUCB 的遗憾界时引讲义。</b> <span class='k'>⚠ 本讲到「算法长什么样」为止，<b>没有</b>给任何遗憾分析</span>。<b>要引用必须查 OFUL 原文（Abbasi-Yadkori 等）</b>——<span class='w'>而那个分析的主项是 <code>β_T√(T·d log T)</code> 量级，其中 <code>β_T ≈ √(d log T)</code> 才是来自本讲的。</span><br>✅ <b>补记（2026-10-12）：要<b>理解</b>那条界不必只靠原文了——<b>本课 L10</b> 把它讲完了</b>（<span class='k'>p2 的界、p3 的求和、p4 的<b>椭圆势引理</b>、p5 的 AM–GM 收尾</span>）。<b>⇒ 分工：本讲给 <code>β_T</code>，L10 给「有了 <code>β_T</code> 之后遗憾是多少」。</b><br><b>⚠⚠ 但读 L10 时有一处记号冲突会让数差一个平方</b>：<span class='w'><b>本讲的 <code>β_t</code> 是半径</b>（<code>‖θ̂−θ_*‖_V ≤ β_t</code>），<b>L10 的 <code>β_t</code> 是半径的平方</b>（<code>‖θ−θ̂_t‖²_{V_t} ≤ β_t</code>）</span>。<b>所以「本讲 <code>β_T ≈ √(d log T)</code>」与「L10 <code>β_T ≈ d log T</code>」说的是同一件事，两边代进去都得到 <code>d√T·log T</code>。</b><span class='k'>照抄任一边的公式前，先确认用的是哪个约定。</span>", "tag": "已核", "ref": "本讲 p13（逐行核对）· L10 p1 p2 p4（2026-10-12 补记，逐行核对）"}], "ammo": [{"q": "你一边跑一边淘汰配置，那个 1−δ 的保证还成立吗？", "a": "<b>成立，而且我们用的是<b>随时有效</b>（anytime-valid）的界，不是固定样本量的界。</b> <span class='k'>构造是 CSE 541 L12 那条：<code>M_t(λ) = exp(λS_t − λ²V_t/2)</code> 是上鞅，配上<b>极大不等式</b>（而不是马尔可夫），直接得到 <code>P(∃t : S_t ≥ λV_t/2 + (1/λ)log(1/δ)) ≤ δ</code>——对<b>所有</b> t 同时成立</span>。<br><b>而代价几乎为零</b>：<span class='w'>取 <code>λ = √(2log(1/δ)/n_目标)</code>，这条界在 <code>n_目标</code> 附近的右端与固定样本量的 Hoeffding <b>完全相同</b>（不是近似相同）</span>。<b>我们付出的只是「在远离 <code>n_目标</code> 的地方略松」，而 <code>n_目标</code> 就是我们事先定的 query 预算。</b><br><b>⚠ 同时我们保证停止规则是真正的<b>停时</b></b>：<span class='k'>淘汰的决定只依赖已跑完的 query，不存在「跑完全部再回头挑一个最早的时刻」</span>。", "tag": "已核", "ref": "本讲 p6–p9（逐行核对）· 简报 §4c（已核）"}, {"q": "你的样本是自己挑的（自适应地选配置），置信界还成立吗？", "a": "<b>成立，而且这正是鞅型界相对普通集中不等式的优势。</b> <span class='w'>普通的 Hoeffding/Chernoff 要求样本 i.i.d.，自己挑的样本会让它失效</span>；<b>而 CSE 541 L12 的框架只要求 <code>Σ_t = x_tx_tᵀ</code> <b>可预测</b>（predictable）——即 <code>x_t</code> 关于 <code>𝓕_{t−1}</code> 可测，「挑 <code>x_t</code> 时只用历史」</b>。<span class='k'>而任何在线算法都天然满足：你不可能先看到这一轮的结果再决定这一轮测什么。</span><br><b>推导里那一步枢纽很明确</b>：<span class='w'>验证 <code>E[exp(⟨λ,x_sε_s⟩)|𝓕_{s−1}] ≤ exp(‖λ‖²_{x_sx_sᵀ}/2)</code> 时，要用到「<code>⟨λ,x_s⟩</code> 在给定 <code>𝓕_{s−1}</code> 时是已知常数」</span>——<b>这一条成立当且仅当 <code>x_s</code> 可预测。</b><br><b>⚠ 我们唯一需要守住的是：不在看到这一轮结果之后再改这一轮的纳入规则。</b>", "tag": "已核", "ref": "本讲 p10 · p12（逐行核对）· 简报 §4c（已核）"}, {"q": "为什么不用更简单的并集界（每轮分 δ/(2ℓ²)）？", "a": "<b>可以用，但它是三档里最松的那一档，而这件事是<b>画出来</b>的。</b> <span class='k'>CSE 541 L12 的图 (b) 把三类全程有效的做法画在一起：那条「union bound 2t²」（即 <code>√(2log(2t²/δ))</code>，正是 <code>δ/(2ℓ²)</code>+Basel 的做法）一路在最上面，而混合法的弯曲边界明显更低</span>。<br><b>而我们选的是中间那一档：<b>直线边界</b></b>，<span class='w'>因为我们的 query 预算是事先定的，所以可以把 <code>λ</code> 调到目标样本量上——那时它与固定样本量的界<b>一样紧</b>，比并集界紧得多，而且实现比混合法简单（不用算积分）</span>。<b>⇒ 三档的取舍我们是算过的，不是随手挑的。</b>", "tag": "已核", "ref": "本讲 p9 两张图及说明（逐句核对）· L06 · L07 p6"}, {"q": "你的置信区间会不会因为跑了很多「没有区分度」的 query 而被不必要地撑宽？", "a": "<b>不会——我们用的是按<b>累计方差</b> <code>V_t</code> 而不是按<b>步数</b> <code>t</code> 增长的版本。</b> <span class='k'>CSE 541 L12 p10：只要每步的次高斯参数 <code>σ_t</code> 是<b>可预测</b>的，就可以把界里的 <code>t</code> 换成 <code>V_t = Σσ_s²</code></span>。<br><b>而我们的 Acc 是伯努利的、方差是 <code>p(1−p)</code></b>：<span class='w'>「所有配置都答对」或「都答错」的 query 上 <code>p</code> 贴近 1 或 0，方差<b>接近零</b>，于是它们<b>几乎不加宽区间</b></span>。<b>⇒ 界自动「认出」哪些观测有信息，不需要我们显式去筛。</b><br><b>⚠ 当然我们仍然显式地筛掉它们——但那是为了省真实的 API 调用（钱），和这里省区间宽度是两件事，不冲突。</b>", "tag": "推断", "ref": "本讲 p10（逐行核对）· CSE 541 L09 p5 科研格 · 简报 §4e（已核）"}], "papers": [{"t": "Abbasi-Yadkori, Pál &amp; Szepesvári — OFUL / 自归一化界", "id": "⚠ <b>讲义未点名</b>；本讲 p11–p13 给的正是这条线的推导", "why": "<b><code>P(∃t : ‖S_t‖_{(V_t+γI)^{-1}} ≥ √(2log(1/δ)+log(|V_t+γI|/γ^d))) ≤ δ</code> 的标准出处</b>，也是 LinUCB 遗憾界的出处。<span class='w'>⚠ 本讲只给到「算法长什么样」，<b>没有</b>遗憾分析</span>——<b>要引用 <code>β_T√(T d log T)</code> 那个界必须查原文。</b><span class='k'>标「未点名」是因为本精读只认讲义写了的出处；这一条是我按内容补的。</span><br>✅ <b>补记：这篇的<b>两块</b>正好对应本课两讲</b>——<span class='w'>自归一化界在<b>本讲</b> p11–p13，遗憾分析（含<b>椭圆势引理</b>）在 <b>L10</b></span>。<b>⇒ 两讲合读等于覆盖了这篇论文的主干，而引用时仍统一引这篇。</b><span class='k'>⚠ 椭圆势引理在文献里还叫 elliptical potential lemma / determinant-trace inequality，查的时候三个名字都试。</span>"}, {"t": "Ville 不等式 / 上鞅的极大不等式", "id": "本讲 p6 的引理", "why": "<b>整讲最关键那个「免费」的来源</b>：<span class='k'><code>P(max_{t∈ℕ}X_t ≥ ε) ≤ E[X_0]/ε</code> 对非负上鞅成立，而右边的代价与马尔可夫不等式<b>一模一样</b></span>。<b>「对所有 t 同时成立」因此不要钱</b>。<b>这是「随时有效推断」（anytime-valid inference）整个领域的地基，而那个领域近年很活跃，值得顺着查下去。</b>"}, {"t": "混合法（method of mixtures）", "id": "本讲 p8–p9；Robbins 与 Lai 一脉的经典技巧", "why": "<b>精神是：与其在多个候选 λ 之间做并集界（付 <code>log</code> 个数），不如对它们取<b>平均</b>（付更小的代价）。</b> <span class='w'>高斯先验下积分有闭式</span>。<b>⚠ 对你的用处取决于你知不知道 <code>n_目标</code></b>：<span class='k'>知道就用直线边界（更紧更简单），不知道才用它</span>。<b>代价是 <code>√(log t)</code> 的因子——<code>t=1000</code> 时约 2.6 倍宽度、7 倍样本量。</b>"}, {"t": "Doob 可选停止定理", "id": "本讲 p6", "why": "<b>「你没法靠选一个聪明的停止规则来占便宜」的精确表述。</b> <span class='k'>⚠ 它有前提：停时<b>有界</b>，或 <code>E[𝒯] &lt; ∞</code> 且增量一致有界</span>——<b>而你的停时被总 query 预算 N 界住，所以第一个条件<b>自动满足</b></b>。<span class='w'>在论文里写一句「停时被总预算界住，故定理条件满足」即可，不必去验那个更麻烦的增量条件。</span>"}, {"t": "⚠ 本讲用到、但<b>属于 L11</b> 的那一段", "id": "p1–p2 与 lecture_11.pdf 的 p1–p2 <b>逐字节相同</b>", "why": "<b>覆盖论证（臂集不可数时用 <code>(3/ε)^d</code> 个点铺满单位球面）。</b> <span class='k'>实测 L11 ⊂ L12 全包含（5/5 页）</span>——<b>做了 L12 就不必单独做 L11</b>。<span class='w'>而覆盖论证对你暂时用不上（你的配置空间是有限的、而且不大）</span>，<b>它的价值在于说明「<code>log|𝒳|</code> 在无限情形下会换成 <code>d</code>」这个一般规律。</b>"}]};

     两门课都用 "l01quiz" 会互相覆盖。 */
  var KEY = document.body.dataset.key;
  try {                       // 一次性迁移：早期版本用的是不带课程前缀的键
    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("l12quiz");
      if(_old){
        localStorage.setItem(KEY+"quiz", _old);
        var _p = localStorage.getItem("l12p");
        if(_p) localStorage.setItem(KEY+"p", _p);
      }
      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，
         用户「清空全部记录」之后下次打开又被复活一遍。 */
      localStorage.removeItem("l12quiz");
      localStorage.removeItem("l12p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      var nf=frame.cloneNode(false); nf.removeAttribute("src");
      frame.parentNode.replaceChild(nf,frame); frame=nf;
      frame.src=SRC+HASH;
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
