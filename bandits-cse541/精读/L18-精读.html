</code>。</b> <span class='w'>策略类大一万倍，只多 <code>log(10⁴) ≈ 9.2</code> 的因子；动作多一倍，样本量直接翻倍</span>。<b>⇒ 预算该花在「减少动作」上，不是「缩小策略类」上</b>——<span class='k'>这个结论和直觉常常相反，值得单独记一笔</span>。", "<b>页下半那三行代数是全讲最实用的一招。</b> <code>argmax_π (1/T)Σ 1{π(c_t)=x_t}y_t/p_t</code>，<span class='k'>把指示函数写成 <code>1 − 1{π(c_t) ≠ x_t}</code></span>，<b>常数项 <code>(1/T)Σ y_t/p_t</code> 与 <code>π</code> 无关可以丢掉</b>，<span class='w'>于是 <code>argmax</code> 变成 <code>argmin_π (1/T)Σ 1{π(c_t) ≠ x_t}·y_t/p_t</code></b>。", "<b>这个形式的意义：它是一个<b>加权的 0/1 分类损失</b>。</b> <span class='k'>样本是 <code>(c_t, x_t)</code>，「正确标签」是日志实际走的那个动作 <code>x_t</code>，权重是 <code>y_t/p_t</code></span>；<b>你要找一个「分类器」<code>π</code>，让它尽量在<b>回报高、倾向低</b>的那些样本上同意日志的选择</b>。<span class='w'>⚠ 权重可以是负的（<code>y_t &lt; 0</code>），那时它会<b>推开</b>而不是靠近</b></span>——<b>这是它与普通分类唯一的结构差别</b>。"], "eq": "C_T(π) := √( 2log(2|Π|/δ) · E_{c~ν}[1/μ(π(c)|c)] / T )  +  2V̄ log(2|Π|/δ)/(3T)\n          ╰─ 沿 π 走的平均，进根号 ─╯                        ╰ 全表最坏，进线性 ╯\n\n均匀探索 μ = 1/|𝒳|：\n  C_T(π) ≤ √( 4 |𝒳| log(2|Π|/δ) / T )\n  反过来：要宽度 ≤ ε  ⇒  T ≳ 4|𝒳|log(2|Π|/δ)/ε²\n     策略类 ×10⁴ ⇒ 只多 log(10⁴) ≈ 9.2 倍      动作数 ×2 ⇒ 样本量 ×2\n\n离线挑策略 = 加权分类：\n  argmax_π ⅟T Σ_t 1{π(c_t)=x_t}·y_t/p_t\n   = argmax_π ⅟T Σ_t (1 − 1{π(c_t)≠x_t})·y_t/p_t      ← 常数项与 π 无关，丢掉\n   = argmin_π ⅟T Σ_t 1{π(c_t)≠x_t} · y_t/p_t\n                 ╰ 0/1 损失 ╯  ╰ 样本权重 ╯", "tbl": {"head": ["界里的量", "含义", "进哪一项", "怎么变小"], "rows": [["E_{c~ν}[1/μ(π(c)|c)]", "沿目标策略走，日志有多不愿意走", "根号项（主项）", "让 μ 更像 π —— 但 π 是未知的，所以只能靠覆盖广"], ["V̄ = max_{c,x} 1/μ(x|c)", "全表最小倾向的倒数（最坏情形）", "线性项（T 小时主导）", "给 μ 设一个概率下限，别让任何动作的倾向过小"], ["log(2|Π|/δ)", "对 Π 做并集界的代价", "两项都有", "⚠ 几乎不必管 —— 它只进 log"], ["|𝒳|", "动作数（均匀探索时 E[1/μ] = V̄ = |𝒳|）", "两项都有", "⭐ 真正要压的就是这个 —— 一次方"]]}, "say": "<b>补一处讲义没点明、但不说会读漏的：为什么 <code>C_T(π)</code> 写成<b>逐策略</b>的函数，而不是一个统一的数？</b><br>因为根号项里的 <code>E[1/μ(π(c)|c)]</code> <b>依赖 <code>π</code></b>。<span class='k'>日志策略 <code>μ</code> 覆盖得好的那些策略，宽度小；覆盖得差的，宽度大，甚至无穷</span>。<b>⇒ 同一份数据，对不同策略的「可信程度」差别可以极大</b>。<span class='w'>⚠ 而这正是下一页「悲观」能赢的全部原因</span>：<b>如果你只拿一个统一的宽度 <code>max_π C_T(π)</code>，那么悲观与直接 argmax 的保证一模一样，一点好处也没有</b>。<span class='k'>悲观买到的东西，恰恰来自「宽度是逐策略不同的」这件事</span>——<b>它把「我对这个策略有多没把握」当成了一个可以权衡的代价，而不是一个统一的安全边际</b>。", "res": {"tag": "推断", "v": "<b>两条可以直接写进你实验设计的话。</b> <b>① 样本量公式给你一个可报的数</b>：<span class='k'>按简报 §4c 随机化 <code>k=4</code> 个节点、每节点两档 ⇒ 有效「动作数」<code>2⁴ = 16</code>，策略类取「按难度三档」<code>|Π| = 2^{30}</code>（<code>log|Π| ≈ 21</code>）⇒ 要 <code>ε = 0.02</code> 的宽度需 <code>T ≳ 4·16·(21+log(2/δ))/0.0004 ≈ 4×10⁶</code></span>——<b>⚠ 这个数说明<b>纯 IPS 在你的预算下不可行</b>，而这恰恰是简报 §4d「穷举 oracle 碾压任何估计量」的量化支撑</b>。<b>② 加权分类那个等价式，是你真正该实现的东西</b>：<span class='w'>不要去写一个「估计 V̂ 再 argmax」的循环（<code>|Π|</code> 太大）</span>，<b>而是把日志变成一个带权分类数据集 <code>(c_t, x_t, w_t = y_t/p_t)</code>，扔给现成的分类器</b>。<span class='k'>这同时解释了 p14 为什么突然去讲 softmax —— 它在交代「这一步用你已有的工具就行」</span>。", "ref": "本讲 p13 · 简报 §4c · 简报 §4d（穷举 oracle 当 ground truth）"}},
{"r": [14, 14], "t": "归约到分类：用现成的 softmax 交叉熵去解它；再把 MLE 的保证推一遍", "star": 2, "quote": "<em>Consider generic machine learning problem {(x<sub>i</sub>,y<sub>i</sub>)}<sub>i=1</sub><sup>n</sup>, x<sub>i</sub> ∈ ℝ<sup>d</sup>, y<sub>i</sub> ∈ [k]. Find a classifier that predicts y<sub>i</sub> from x<sub>i</sub>. E.g., find a classifier that minimizes <b>⅟n Σ<sub>i</sub> 1{h(x<sub>i</sub>) ≠ y<sub>i</sub>}</b></em><br><em>≈ ⅟n Σ<sub>i=1</sub><sup>n</sup> −log( exp([f<sub>θ</sub>(x<sub>i</sub>)]<sub>y<sub>i</sub></sub>) / Σ<sub>k</sub> exp([f<sub>θ</sub>(x<sub>i</sub>)]<sub>k</sub>) )　f<sub>θ</sub>: ℝ<sup>d</sup> → ℝ<sup>k</sup></em><br><em>Prediction P(y=j|x) = exp([f<sub>θ</sub>(x)]<sub>j</sub>)/Σ<sub>k</sub>exp([f<sub>θ</sub>(x)]<sub>k</sub>)</em><br><em>V(π̂<sub>MLE</sub>) = V̂(π̂<sub>MLE</sub>) + V(π̂<sub>MLE</sub>) − V̂(π̂<sub>MLE</sub>) ≥ V̂(π̂<sub>MLE</sub>) − C<sub>T</sub>(π̂<sub>MLE</sub>) ≥ V̂(π̄<sub>*</sub>) − C<sub>T</sub>(π̂<sub>MLE</sub>)</em>", "one": "<b>上半页在说一句很朴素但很重要的话：上一页那个加权 0/1 损失，和你平时训分类器时最小化的东西<span class='k'>是同一个东西</span>，所以直接用交叉熵的替代损失去优化它。下半页开始走「加减同一项」的标准三步，给 <code>π̂_MLE</code> 一个保证。</b>", "pts": ["<b>上半页乍看像离题的机器学习复习，其实是在交代「这一步不需要新算法」。</b> <span class='k'>离线挑策略 = <code>argmin_π Σ_t 1{π(c_t)≠x_t}w_t</code>，而这正是<b>带权的多类分类</b></span>；<b>0/1 损失不可微，于是照老规矩换成 softmax 交叉熵这个替代损失</b>，<span class='w'><code>f_θ: ℝ^d → ℝ^k</code> 打分，softmax 归一</b></span>。", "<b>⚠ 这里有一个讲义没说、但实现时一定撞上的落差：替代损失优化的不是原目标。</b> <span class='k'>交叉熵是 0/1 的上界替代，两者的 <code>argmin</code> 一般<b>不相同</b></span>；<b>而前面那套保证（<code>C_T(π)</code>、并集界）是对<b>精确</b> <code>argmax V̂</code> 证的</b>。<span class='w'>⇒ 你用分类器求出来的 <code>π̂</code> 严格说不满足那个保证，中间差一个「优化误差」</b></span>。<b>这是理论与实现之间一道真实的缝，论文里该明说而不是含糊过去</b>。", "<b>下半页的三步是 CSE541 里反复出现的同一个套路：加减同一项。</b> <code>V(π̂) = V̂(π̂) + [V(π̂) − V̂(π̂)]</code>，<span class='k'>方括号里那一项用 <code>C_T</code> 界住</span>，<b>于是 <code>V(π̂) ≥ V̂(π̂) − C_T(π̂)</code></b>。<span class='w'>⚠ 这一步要求 <code>C_T</code> 对 <code>π̂</code> 也成立，而 <code>π̂</code> 是用数据挑出来的</b></span>——<b>所以上一页那个<b>并集界</b>是必需的，不是为了好看</b>。", "<b>第二步用 <code>π̂_MLE</code> 的定义：它最大化 <code>V̂</code>，所以 <code>V̂(π̂_MLE) ≥ V̂(π_*)</code>，其中 <code>π_*</code> 是真正最优的那个策略。</b> <span class='k'>这是唯一用到「<code>π̂</code> 是 argmax」的地方</span>，<b>而下一页的悲观原则改的正是这一步</b>。", "<b>第三步再对 <code>π_*</code> 用一次置信界：<code>V̂(π_*) ≥ V(π_*) − C_T(π_*)</code>。</b> <span class='w'>三步串起来：<code>V(π̂_MLE) ≥ V(π_*) − C_T(π_*) − C_T(π̂_MLE)</code></span>，<b>而 <code>π̂_MLE</code> 是谁你事先不知道，只能放成最坏的：<code>≥ V(π_*) − 2max_{π∈Π}C_T(π)</code></b>。", "<b>⭐ 盯住最后这个 <code>max_π</code>，它是全讲的转折点。</b> <span class='k'>你付的代价由<b>策略类里最难评估的那个策略</b>决定，而那个策略你可能根本不想要</b></span>。<b>只要 <code>Π</code> 里有<b>一个</b>策略被日志覆盖得极差（<code>E[1/μ]</code> 巨大），<code>max_π C_T(π)</code> 就爆掉，整个保证变成废话</b>——<span class='w'>哪怕 <code>π_*</code> 本身被覆盖得很好</span>。"], "eq": "归约：argmin_π ⅟T Σ_t 1{π(c_t) ≠ x_t} · (y_t/p_t)\n        = 带权多类分类，样本 (c_t, x_t)，权 w_t = y_t/p_t\n        ⇒ 0/1 不可微，换 softmax 交叉熵替代损失\n        ⚠ 替代损失的 argmin ≠ 原目标的 argmin，差一个「优化误差」\n\nMLE 的保证（加减同一项，三步）：\n  V(π̂)  = V̂(π̂) + [ V(π̂) − V̂(π̂) ]\n        ≥ V̂(π̂) − C_T(π̂)                      ① 置信界（需并集界，因为 π̂ 由数据挑）\n        ≥ V̂(π_*) − C_T(π̂)                     ② π̂ = argmax V̂ 的定义\n        ≥ V(π_*) − C_T(π_*) − C_T(π̂)          ③ 再用一次置信界\n        ≥ V(π_*) − 2·max_{π∈Π} C_T(π)         ④ π̂ 事先未知，只能放成最坏\n                      ╰── ⚠ 由「最难评估的那个策略」决定 ──╯", "tbl": {"head": ["这一步", "用掉了什么", "⚠ 代价 / 隐患"], "rows": [["① V(π̂) ≥ V̂(π̂) − C_T(π̂)", "对 Π 的并集界", "log|Π| 的因子 —— 便宜"], ["② V̂(π̂) ≥ V̂(π_*)", "π̂ 是 V̂ 的 argmax", "⭐ 下一页悲观原则改的就是这一步"], ["③ V̂(π_*) ≥ V(π_*) − C_T(π_*)", "再一次置信界", "无额外代价（π_* 是固定的）"], ["④ 放成 max_π C_T(π)", "π̂ 的身份事先未知", "⚠ 致命 —— Π 里有一个难评估的策略就爆掉"]]}, "say": "<b>补一处讲义只画了等号、但值得想清楚的：为什么要写成 <code>V = V̂ + (V − V̂)</code> 这种看起来多余的形式？</b><br>因为你有<b>两样</b>东西：一个<b>能算</b>的量 <code>V̂</code>，和一个<b>能界</b>的差 <code>V − V̂</code>。<span class='k'>目标 <code>V</code> 两者都不是，所以要把它拆成「能算的」加「能界的」</span>。<b>这套「加减同一项」在 CSE541 里出现过至少三次</b>：<span class='w'>L07 p3 的 simple regret 分解 <code>(x_*−x̂)ᵀθ_* = (x_*−x̂)ᵀθ̂ + (x_*−x̂)ᵀ(θ_*−θ̂)</code>（第一项 ≤ 0 因为 x̂ 是 argmax，第二项用置信界）</span>，<b>和这一页逐字同构</b>。<span class='k'>⇒ 值得当成一个固定招式记住：<b>凡是「我挑了一个最大化估计量的东西，想说它的真值也不差」，就是这三步</b></span>。", "link": {"t": "你学过的对应：CSE 541 L07 线性 bandit 与实验设计（p3 的 simple regret 分解与这一页逐字同构：都是「加减同一项」，一半靠 argmax 的定义给出 ≤ 0，另一半靠置信界。认出这个招式之后，这类证明就不必再推了）", "href": "L07-精读.html"}, "res": {"tag": "推断", "v": "<b>第 ④ 步那个 <code>max_π C_T(π)</code> 对你是一条硬警告：策略类里<b>不许</b>塞进日志覆盖不到的策略。</b> <span class='k'>按简报 §4c，你只在 top-3~4 个敏感节点上随机化，其余节点<b>钉死</b></span>；<b>那么任何「在被钉死的节点上换档位」的策略，<code>μ(π(c)|c) = 0</code>、<code>C_T(π) = ∞</code>，<span class='w'>只要它在 <code>Π</code> 里，MLE 的保证就直接失效</span></b>。<b>⇒ <code>Π</code> 的定义必须和 <code>μ</code> 的随机化范围<b>严格对齐</b>：只在随机化过的那几个节点上变化</b>。⚠ <b>这一条很容易在实现里违反</b>——<span class='k'>写策略类时自然会写成「所有 <code>2^H</code> 个配置」，而随机化只做了 4 个节点</span>，<b>于是理论保证在第一行就没了，而代码跑起来一点报错都不会有</b>。", "ref": "本讲 p14 第 ④ 步 · 简报 §4c（其余节点按扫描结果钉死）"}},
{"r": [15, 15], "t": "悲观原则：把置信宽度减进目标里，代价就从「最坏策略」变成「最优策略」", "star": 3, "quote": "<em>≥ V(π̄<sub>*</sub>) − C<sub>T</sub>(π̄<sub>*</sub>) − C<sub>T</sub>(π̂<sub>MLE</sub>) ≥ V(π<sub>*</sub>) − max<sub>π∈Π</sub> 2C(π)</em><br><em><b>Principle of Pessimism</b></em><br><em>π̂<sub>pes</sub> = argmax<sub>π∈Π</sub> V̂(π) − C<sub>T</sub>(π)</em><br><em>V(π̂<sub>pes</sub>) = V̂(π̂<sub>pes</sub>) + V(π̂<sub>pes</sub>) − V̂(π̂<sub>pes</sub>) ≥ V̂(π̂<sub>pes</sub>) − C<sub>T</sub>(π̂<sub>pes</sub>) ≥ V̂(π<sub>*</sub>) − C<sub>T</sub>(π<sub>*</sub>) ≥ V(π<sub>*</sub>) − 2C<sub>T</sub>(π<sub>*</sub>)</em>", "one": "<b>改动只有一处：选的时候把宽度<span class='k'>减掉</span>。证明几乎逐行照抄，唯独第二步变了——<code>π̂_pes</code> 最大化的是 <code>V̂ − C_T</code>，于是那一步直接带出 <code>V̂(π_*) − C_T(π_*)</code>，<code>max_π</code> 再也不出现。代价从<span class='w'>最难评估的策略</span>变成<span class='k'>最优策略本身</span>。</b>", "pts": ["<b>算法的改动只有一处：<code>π̂_pes = argmax_π V̂(π) − C_T(π)</code>。</b> <span class='k'>不选「估计值最高的」，选「<b>保守估计</b>最高的」</span>。<b>一个被日志覆盖得差的策略，即使 <code>V̂</code> 很高，减掉它那个很宽的 <code>C_T</code> 之后也排不上去</b>。", "<b>证明的前三步与上一页逐字相同，变的只有第二步。</b> <span class='w'>上一页：<code>V̂(π̂) ≥ V̂(π_*)</code>（用 argmax <code>V̂</code>）</span>；<b>这一页：<code>V̂(π̂_pes) − C_T(π̂_pes) ≥ V̂(π_*) − C_T(π_*)</code>（用 argmax <code>V̂ − C_T</code>）</b>。<span class='k'>⇒ 右边自带一个 <code>−C_T(π_*)</code>，它<b>正好</b>是你想要的那一项，而不是一个需要放大的未知量</b></span>。", "<b>于是结论是 <code>V(π̂_pes) ≥ V(π_*) − 2C_T(π_*)</code>。</b> <span class='w'>与 MLE 的 <code>V(π_*) − 2max_π C_T(π)</code> 相比，<code>max_π</code> 消失了</span>。<b>⭐ 这是悲观买到的<b>全部</b>东西，但它够大：只要日志覆盖了 <code>π_*</code>，保证就成立，<span class='k'><code>Π</code> 里有多少个覆盖极差的策略都<b>无所谓</b></span></b>。", "<b>反过来说也要讲清楚，否则会把悲观当万灵药：它<b>不能</b>让你评估一个没覆盖的策略。</b> <span class='w'>如果 <code>π_*</code> 本身就没被 <code>μ</code> 覆盖，<code>C_T(π_*) = ∞</code>，两种办法一样完蛋</span>。<b>悲观解决的是「别被坏覆盖的策略骗走」，不是「从没有信息的地方榨出信息」</b>。", "<b>页末那张图把机制画得很清楚，值得逐笔看。</b> <span class='k'>黑线是真实的 <code>f(x)</code>；红线是估计 <code>f̂(x)</code>，在某些点上有尖锐的高峰（那些点样本少）；蓝虚线是上置信带 <code>f̂(x) + c(x)</code></span>。<b>直接取 <code>argmax f̂</code> 会跳到那根红色尖峰上（图里用黑点标出）</b>，<span class='w'>而取 <code>argmax (f̂ − c)</code> 会落在一个估计不那么高、但置信带窄的地方（紫点）</b></span>。", "<b>⚠ 和在线算法的直觉<b>正好相反</b>，这一点不说清楚会一直别扭。</b> <span class='k'>在线用<b>乐观</b>（UCB：<code>argmax f̂ + c</code>），因为猜错了下一轮还能纠正，而且「去没测过的地方」本身有信息价值</span>；<b>离线必须<b>悲观</b>，因为你只有一次输出机会、没有纠正的轮次，不确定性是纯风险不是机会</b>。<span class='w'>⇒ 同一个 <code>c(x)</code>，在线加、离线减</span>。"], "eq": "MLE：      π̂_MLE = argmax_π V̂(π)\n           V(π̂_MLE) ≥ V(π_*) − 2·max_{π∈Π} C_T(π)     ← 由最难评估的策略决定\n\n悲观：     π̂_pes = argmax_π [ V̂(π) − C_T(π) ]\n           V(π̂_pes) = V̂(π̂_pes) + [V(π̂_pes) − V̂(π̂_pes)]\n                    ≥ V̂(π̂_pes) − C_T(π̂_pes)\n                    ≥ V̂(π_*)  − C_T(π_*)                ← ⭐ 变的就是这一步\n                    ≥ V(π_*)  − 2 C_T(π_*)              ← 只看最优策略处的宽度\n\n在线 vs 离线，同一个 c(x)：\n  在线（UCB）  argmax f̂(x) + c(x)      不确定性是机会（下一轮能纠正）\n  离线（悲观） argmax f̂(x) − c(x)      不确定性是风险（只有一次输出）", "tbl": {"head": ["", "π̂_MLE = argmax V̂", "π̂_pes = argmax (V̂ − C_T)"], "rows": [["保证", "V(π_*) − 2·max_{π∈Π}C_T(π)", "V(π_*) − 2·C_T(π_*)"], ["谁决定代价", "Π 里最难评估的那个策略", "⭐ 只有最优策略 π_* 本身"], ["Π 里塞一个没覆盖的策略", "⚠ 保证直接失效", "✓ 毫无影响 —— 它会被自己的宽度压下去"], ["π_* 自己没被覆盖", "⚠ 完蛋", "⚠ 一样完蛋 —— 悲观不造信息"], ["要算什么额外的量", "只要 V̂", "还要逐策略的 C_T(π)，即 E[1/μ(π(c)|c)]"]]}, "tip": {"t": "⚠ 方向相反", "v": "<b>在线加置信宽度，离线减置信宽度。</b> UCB 之所以乐观，是因为「去没测过的地方」有信息价值、而且猜错下一轮能纠正；离线只有一次输出机会，不确定性是纯风险。<b>把这两件事记成「同一个 c(x)，符号不同」最省脑子</b>，也最不容易在写代码时搞反。", "w": 1}, "res": {"tag": "推断", "v": "<b>这一页给你的不是一个算法，是对 AFlow 选择规则的一条<b>有定理撑着</b>的批评，以及一个现成的替代。</b> <span class='k'>简报 §2【已核】：AFlow 的选择是「把已评估的 workflow 按分数排序取 top-k（k=3），再按 softmax 采样」—— 这是 <code>argmax V̂</code> 那一类，<b>没有任何宽度修正</b></span>；<b>而每个 workflow 的分数是在 <code>D_V</code> 上跑 5 次得来的【已核，§3】，<span class='w'>5 次的标准误差不小，且<b>各 workflow 的样本量相同但方差不同</b></span>（难 query 上的方差大得多）</b>。<b>⇒ 按本页的推理，AFlow 的 top-k 系统性地偏向「方差大、碰巧跑高」的那些 workflow</b>。<b>替代方案是现成的：把选择规则改成 <code>argmax (score − c·se)</code></b>，<span class='k'>而 <code>se</code> 它<b>已经在算了</b>（5 次重复），只是没用</span>。⚠ <b>这条要当作可检验的假设而不是结论来写</b>——<span class='w'>必须实测：按 <code>score − c·se</code> 重选，最终 workflow 的留出集表现是不是真的更好</span>。<b>这是一个成本很低、而且与 AFlow 原作者的代码改动量极小的实验</b>。", "ref": "本讲 p15 · 简报 §2（Algorithm 1 的 top-k + softmax 选择）· 简报 §3（Executor 在 D_V 上跑 5 次）"}},
{"r": [16, 16], "t": "优化者的诅咒：argmax 一个有噪声的估计，估计值会系统性虚高", "star": 3, "quote": "<em>x̂ = argmax<sub>x</sub> f̂(x)</em><br><em>E[f(x̂)] ≤ max<sub>x</sub> f(x)</em><br><em>E[f̂(x̂)] ≫ max<sub>x</sub> f(x)</em><br><em>(图) 纵轴 V(π)，横轴 Π：一条上包络线与一片散点</em>", "one": "<b>三行式子说完一件事：你挑出来的那个东西，<span class='k'>真值不如你以为的好</span>（第二行），而<span class='w'>你报出的数比真正的最优还高</span>（第三行）。前者是难免的，后者是一个会让你把结论写错的偏差。</b>", "pts": ["<b>第二行 <code>E[f(x̂)] ≤ max_x f(x)</code> 是平凡的：<code>f(x̂)</code> 对任何 <code>x̂</code> 都不超过 <code>max f</code>。</b> <span class='k'>它的内容是「你挑出来的东西的<b>真值</b>，平均而言不如真正的最优」</span>——<b>这叫选择的代价，是你为「不知道 <code>f</code>」付的钱，无法消除</b>。", "<b>第三行才是要命的：<code>E[f̂(x̂)] ≫ max_x f(x)</code>。</b> <span class='w'>你<b>报出</b>的那个数，期望上不仅高于 <code>f(x̂)</code>，还高于<b>真正的最优值</b></span>。<b>机制很简单：<code>argmax</code> 会挑中那些「真值一般、但这次噪声往上偏」的点</b>，<span class='k'>候选越多，这种「幸运的噪声」越容易出现，虚高越严重</span>。", "<b>这就是优化者的诅咒（optimizer's curse），也叫胜者的诅咒。</b> <b>它和过拟合是同一件事的两种说法</b>：<span class='w'>在同一批数据上<b>选</b>模型，又在同一批数据上<b>报</b>它的分数</span>。<b>⚠ 注意它是一个<b>偏差</b>，不是方差——加大样本会减小它，但不会改变它的符号</b>。", "<b>页末那张图把「候选越多越严重」画了出来：横轴是策略类 <code>Π</code>，纵轴是 <code>V(π)</code>，一片散点加一条上包络。</b> <span class='k'>散点是各策略的真值，上包络是各策略的<b>估计</b>的最大值</span>；<b>包络线随 <code>|Π|</code> 增大而抬高，而真值的最大值不会</b>。<span class='w'>⇒ 两者的缝隙就是虚高的量</span>。", "<b>修法有两类，而它们不是一回事。</b> <span class='k'>① <b>换数据</b>：在留出集上重新评估选出的那一个 —— 这<b>完全</b>消除虚高（选与报用了独立的数据），代价是要留出样本；② <b>修正目标</b>：悲观（p15），在选择时就减掉宽度</span>。<b>⚠ ② 让<b>选择</b>更稳健，但它<b>不</b>自动给出一个无偏的报告值</b>——<span class='w'>要报数还是得靠 ①</span>。", "<b>所以这两页合起来是一条完整的操作规程，而不是两个技巧。</b> <b><span class='k'>用悲观去<b>选</b>，用独立的留出集去<b>报</b></span></b>；<span class='w'>⚠ 只做前者会得到一个虚高的数字，只做后者会在选择阶段就被坏覆盖的策略骗走</span>。<b>两件事缺一不可，而且顺序不能换</b>。"], "eq": "x̂ = argmax_x f̂(x)\n\n  E[ f(x̂) ]  ≤  max_x f(x)        ← 平凡：选择的代价，无法消除\n  E[ f̂(x̂) ]  ≫  max_x f(x)        ← ⚠ 优化者的诅咒：报出的数比真正的最优还高\n\n机制：argmax 偏爱「真值一般、这次噪声往上偏」的点；候选越多越严重\n     ⇒ 和过拟合是同一件事：在同一批数据上既「选」又「报」\n\n两类修法（不是一回事）：\n  ① 换数据：留出集上重评选出的那一个   → 完全消除虚高，能用来报数\n  ② 修正目标：悲观 argmax(V̂ − C_T)     → 让选择稳健，但不自动给无偏的报告值\n  ⇒ 用 ② 选，用 ① 报。顺序不能换，缺一不可。", "tbl": {"head": ["现象", "式子", "性质", "怎么办"], "rows": [["选出来的真值不如最优", "E[f(x̂)] ≤ max f", "选择的代价，无法消除", "扩大样本 / 缩小候选集"], ["报出的数虚高", "E[f̂(x̂)] ≫ max f", "⚠ 偏差，符号固定向上", "⭐ 在独立留出集上重评"], ["候选越多虚高越严重", "上包络随 |Π| 抬高", "与 log|Π| 同源", "悲观（选择端）+ 留出（报告端）"]]}, "say": "<b>补一个讲义没写、但一算就记牢的数值例子。</b><br>设 <code>m</code> 个候选的真值<b>完全相同</b>（都等于 0），估计误差 iid 标准正态。<span class='k'>那么 <code>max_i f̂_i</code> 的期望约为 <code>√(2 log m)</code></span>：<b><code>m = 10</code> 时约 1.5 个标准差，<code>m = 100</code> 时约 2.1，<code>m = 1000</code> 时约 2.6</b>。<span class='w'>⚠ 而真正的最优值是 0 —— 虚高的全部就是那 1.5~2.6 个标准差</span>。<b>⇒ 两条很实用的推论</b>：① <span class='k'>候选从 10 个加到 1000 个，虚高只从 1.5σ 涨到 2.6σ（<code>√log m</code> 很慢）</span>——<b>所以「候选太多」不是主要矛盾</b>；② <b><code>σ</code> 是线性进的</b>，<span class='w'>把每个候选的评估噪声减半，虚高就减半</span>。<b>⇒ 与其砍候选集，不如把每个候选评得准一点</b>——<span class='k'>而这正好也是 <code>√(|𝒳|log|Π|/T)</code> 那个速率在说的话：<code>|Π|</code> 进 log，样本量 <code>T</code> 进根号</span>。", "res": {"tag": "推断", "v": "<b>这一页给你一条几乎可以照抄的审稿人预案，而且它同时适用于<b>你自己</b>的实验。</b> <span class='k'>任何「搜了一大批 workflow，报告最好那个在验证集上的分数」的论文，报出来的数都带着 <code>≈σ√(2log m)</code> 的向上偏差</span>——<b>AFlow 的流程正是这样【已核，§3：Executor 在 <code>D_V</code> 上跑 5 次；§2：按分数排序取 top-k】</b>，<span class='w'>而 <code>m</code> 是它搜索过的 workflow 数</span>。<b>⇒ 两个动作</b>：① <b>对你自己的结果：选与报必须用<b>不同</b>的数据</b>，<span class='k'>这和简报 §4d 的穷举 oracle 配得很好 —— 用 200–300 条留出 query 建的那张精确表，天然就是独立的报告集</span>；② <b>对基线：复现 AFlow 时，把它选出的 workflow 在<b>新</b>留出集上重评一次</b>，<span class='w'>如果分数明显低于它论文里报的，那个差额就是这一页量化的偏差</span>——<b>这是一个很有说服力、成本又低的对照，而且它不需要质疑原作者的任何实现</b>。⚠ <b>务必把它写成「方法学差异」而不是「他们错了」</b>：<span class='k'>这个偏差是流程带来的，在当时的通行做法下不算疏漏</b>。", "ref": "本讲 p16 · 简报 §2（top-k 选择）· 简报 §3（D_V 上跑 5 次）· 简报 §4d（留出 query 的穷举 oracle）"}}
];

var TH = {"title": "L18 接上课题的哪一段：离线评估那一半，以及「选」与「报」必须分开", "arc": "<b>这一讲是全课里离你那条「拿现成日志评估没跑过的配置」最近的一讲，而且它同时给了三样东西：一个否决、一个速率、一条可以反打基线的批评。</b><br><br><span class='w'><b>一、否决（p11–p12）。</b></span> 你简报 §4a 的结论是「现有日志做不了 IS —— 不是方差大，是估计量不存在」。<b>这一讲把它写成了一行式子</b>：<code>V̂(π) = (1/T)Σ_t 1{x_t = π(c_t)}/p_t · y_t</code>，<span class='k'>确定性日志下那个指示函数只在「目标策略恰好等于日志策略」时非零</span>。<b>方差界 <code>(1/T)E_{c~ν}[1/μ(π(c)|c)]</code> 则给出同一件事的定量版本</b>：<span class='w'>某个上下文上 <code>μ(π(c)|c) = 0</code> ⇒ 这个量是 <b>+∞</b></span>。<b>⇒ 要做任何离线评估，执行器必须先改三处：① 动作按一个<b>随机</b>策略 <code>μ</code> 抽；② <code>p_t = μ(x_t|c_t)</code> <b>当场</b>写进日志；③ <code>μ</code> 的定义本身要存档。</b><span class='k'>第 ③ 条简报里没写但一样是硬的 —— 没有 <code>μ</code> 的定义，连「覆盖了哪些配置」都说不清，更算不出 <code>E[1/μ]</code>。</span><br><br><span class='k'><b>二、速率（p13）。</b></span> <b><code>|V̂(π) − V(π)| ≤ √(4|𝒳|log(2|Π|/δ)/T)</code></b>（均匀探索下）。<span class='w'>动作数 <code>|𝒳|</code> 一次方，策略类 <code>|Π|</code> 只进 log</span>。<b>反过来读成样本量：<code>T ≳ 4|𝒳|log(2|Π|/δ)/ε²</code></b>。<span class='k'>按简报 §4c 随机化 <code>k=4</code> 个节点、每节点两档 ⇒ 有效动作数 16；策略类取「按难度三档」<code>log|Π| ≈ 21</code> ⇒ 要 <code>ε = 0.02</code> 的宽度需 <code>T ≈ 4×10⁶</code></span>。<b>⚠ 这个数说明纯 IPS 在你的预算下不可行 —— 而这正是简报 §4d「穷举 oracle 碾压任何估计量」的量化支撑。</b><span class='w'>⇒ 这一讲最大的用处可能不是「教你做 OPE」，而是让你能在论文里<b>有根据地</b>说明为什么不做 OPE 而去穷举。</span><br><br><span class='k'><b>三、可以反打基线的批评（p15–p16）。</b></span> <b>优化者的诅咒</b>：<code>x̂ = argmax f̂(x)</code> ⇒ <code>E[f̂(x̂)] ≫ max_x f(x)</code>。<span class='w'>而简报 §2【已核】记着 AFlow 的选择规则就是「按分数排序取 top-k、再 softmax 采样」，§3【已核】记着每个 workflow 的分数是在 <code>D_V</code> 上跑 5 次得来的</span>——<b>5 次的标准误差不小，而且各 workflow 的样本量相同但<b>方差不同</b>（难 query 上方差大得多）</b>。<b>⇒ 它的 top-k 系统性地偏向「方差大、碰巧跑高」的那些 workflow。</b><span class='k'>替代是现成的：把选择规则改成 <code>argmax (score − c·se)</code>，而 <code>se</code> 它已经在算了（5 次重复），只是没用。</span><br><br><b>⭐ 而整讲最该带走的一条操作规程只有一句：<span class='k'>用悲观去「选」，用独立的留出集去「报」</span>。</b><span class='w'>只做前者会得到一个虚高的数字，只做后者会在选择阶段就被坏覆盖的策略骗走。两件事缺一不可，顺序不能换。</span><br><br><b>另外，前十页（在线那一半）给的是一个<b>形式化上的硬约束</b>，比它的算法更有用。</b><span class='k'>遗憾 <code>√(12·|𝒜|·T·log|Π|)</code> ——动作数一次方、策略类只进 log，而 p10 的下界 <code>min_λ max_i ≥ d</code> 是<b>无条件</b>的</span>。<b>⇒ 若把「动作」定义成<b>整条配置</b>（<code>d = k^H</code>），任何 model-free 路线都要为 <code>√(k^H·T)</code> 买单，直接不可行；必须把动作定义在<b>节点级</b>（<code>d = k</code>），把组合结构推进策略类 <code>Π</code> 里去</b>。<span class='w'>同一个问题，组合性放在动作上不可行、放在策略类上可行 —— 这是「怎么形式化」的硬约束，不是调参建议。</span>", "pitfalls": [{"v": "<b>⚠ 记号在这一讲里换了两次，<code>d</code> 和 <code>n</code> 都换了含义。</b> <span class='k'>p1–p4：<code>n</code> = 臂数 <code>|𝒳|</code>，<code>d</code> = 向量空间维数；p7–p10：<code>n</code> = 策略数 <code>|Π|</code>，<code>d</code> = 动作数 <code>|𝒜|</code></span>（讲义 p7 页边用一行小字写着 <code>d → actions, n → policies</code>）。<b>于是同一个结论 <code>√(12dT log n)</code> 在两段里读法完全不同</b>。<span class='w'>另外 p11 起 <code>p_t</code> 从「策略分布向量」变成了「倾向分数标量」</span>。<b>引用这一讲的任何公式前，先确认自己在哪一段。</b>", "tag": "已核", "ref": "本讲 p7 页边批注 · p1 与 p7 的两版 Theorem 17"}, {"v": "<b>⚠ 「倾向分数」不是被抽中那个策略给动作的概率，而是算法整体走出这个动作的<b>混合</b>概率。</b> <code>Σ_k q_{t,k}π_k(a_t|c_t)</code>，<span class='k'>而不是 <code>π_{I_t}(a_t|c_t)</code></span>。<b>p8 的无偏性证明之所以成立，全靠这个分母与 <code>P(a_t = j)</code> 逐字相同</b>。<span class='w'>两者在「多个策略会走同一动作」时差别巨大，而那在 workflow 场景里是常态</b></span>（<b>大多数配置在大多数节点上相同，只在少数节点分叉</b>）。<b>⇒ 日志里要存的不是一个数，而是「这一轮的 <code>q_t</code> 与各 <code>π_k(·|c_t)</code> 足以重算出那个混合概率」</b>。<span class='k'>副作用：倾向依赖于当时的<b>整个候选集合</b>，事后往 <code>Π</code> 里加策略，旧日志的倾向就不再对得上。</span>", "tag": "已核", "ref": "本讲 p7–p8（混合倾向与 P(a_t=j) = Σ_s π_s(j|c_t)q_{t,s}）"}, {"v": "<b>⚠ 策略类 <code>Π</code> 必须与随机化范围严格对齐，否则 MLE 的保证在第一行就没了。</b> <span class='k'>MLE 的代价是 <code>2·max_{π∈Π}C_T(π)</code> —— 由<b>最难评估的那个策略</b>决定</span>；<b>按简报 §4c 你只在 top-3~4 个节点上随机化、其余钉死，那么任何「在被钉死的节点上换档位」的策略都有 <code>C_T(π) = ∞</code></b>，<span class='w'>只要它在 <code>Π</code> 里，整个保证失效 —— 哪怕 <code>π_*</code> 本身覆盖得很好</span>。<b>⚠ 这一条极易在实现里违反</b>：<span class='k'>写策略类时自然会写成「所有 <code>k^H</code> 个配置」，而随机化只做了 4 个节点</span>，<b>于是保证没了，而代码一点报错都不会有</b>。<span class='w'>（用悲观可以免掉这个 <code>max_π</code>，这也是选悲观的第二个理由。）</span>", "tag": "推断", "ref": "本讲 p14 第 ④ 步 · p15 · 简报 §4c"}, {"v": "<b>⚠ 在线加置信宽度，离线减置信宽度 —— 符号相反，写代码时最容易搞反。</b> <span class='k'>UCB 乐观，是因为「去没测过的地方」有信息价值、而且猜错下一轮能纠正；离线只有一次输出机会，不确定性是<b>纯风险</b></span>。<b>把它记成「同一个 <code>c(x)</code>，在线 <code>+</code>、离线 <code>−</code>」最省脑子。</b><span class='w'>⚠ 而你的课题<b>两种都要用</b>：自适应淘汰阶段是在线的（该乐观 / 该用随时有效的界，见 CSE541 L12），最终输出配置是离线的一次性决定（该悲观）</span>——<b>同一个项目里两个阶段符号相反，这是一处真实的混淆风险</b>。", "tag": "推断", "ref": "本讲 p15 的 tip · CSE541 L12 主线卡（随时有效的界）"}, {"v": "<b>⚠ <code>C_T(π)</code> 里有<b>两个</b>关于倾向的量，混起来会把样本量算错一个数量级。</b> <span class='k'><code>E_{c~ν}[1/μ(π(c)|c)]</code> 是<b>沿目标策略走</b>的平均，进<b>根号</b>项、以 <code>1/√T</code> 收敛；<code>V̄ = max_{c,x}1/μ(x|c)</code> 是<b>全表最坏</b>，进<b>线性</b>项、以 <code>1/T</code> 收敛</span>。<b>均匀探索是个特例（两者都等于 <code>|𝒳|</code>），所以从那个式子看不出区别</b>——<span class='w'>而你的 <code>μ</code> 一旦不均匀（简报 §4c 建议按扫描结果倾斜），两者会差很远</span>。<b>⇒ 报样本量时必须分别算。</b>", "tag": "已核", "ref": "本讲 p13 Corollary"}, {"v": "<b>⚠ 替代损失那一步有一道理论与实现之间的真缝，讲义没说。</b> <span class='k'>p13 把离线挑策略归约成加权 0/1 分类，p14 接着说「换成 softmax 交叉熵」—— 但交叉熵的 <code>argmin</code> 与 0/1 的 <code>argmin</code> 一般<b>不相同</b></span>，<b>而 <code>C_T(π)</code>、并集界那一整套保证是对<b>精确</b> <code>argmax V̂</code> 证的</b>。<span class='w'>⇒ 你用分类器求出来的 <code>π̂</code> 严格说不满足那个保证，中间差一个「优化误差」</span>。<b>论文里该明说而不是含糊过去</b>——<span class='k'>审稿人若懂这一块，这是他会问的第一个问题</span>。", "tag": "推断", "ref": "本讲 p13–p14（归约与替代损失）"}, {"v": "<b>⚠ 重尾会让你同时拿到「偏低的点估计」和「偏窄的置信区间」，两个错误同向叠加。</b> <span class='k'>重要性权重的分布极度偏斜：大部分轮次为 0，少部分很大（p12 页末那根贴着 0 的尖峰）</span>；<b>于是<b>样本方差这个估计量本身</b>也偏斜 —— 若那条长尾在你的 T 个样本里一次都没抽到，算出的样本方差远小于真方差</b>。<span class='w'>⇒ 结果看起来又准又稳，其实两头都错</span>。<b>所以 Bernstein 里那个 <code>B</code>（最坏倾向的倒数）必须按 <code>μ</code> 的<b>定义</b>算，不能用样本里见到的最大权重去估。</b>", "tag": "推断", "ref": "本讲 p12（方差界与页末的尖峰图）"}], "ammo": [{"q": "你为什么不做 off-policy evaluation，而要去穷举？那不是很笨吗？", "a": "<b>因为算过，而且差了两个数量级。</b> <span class='k'>IPS 的置信宽度是 <code>√(4|𝒳|log(2|Π|/δ)/T)</code>（CSE541 L18 p13）。在我的设定里随机化 4 个节点、每节点两档，有效动作数 16；策略类「按难度三档」<code>log|Π| ≈ 21</code></span>。<b>要把宽度压到 0.02，需要约 <code>4×10⁶</code> 条 query —— 而穷举 oracle 用 200–300 条留出 query、跨分支共享前缀，约 9000 次节点调用就能把精确表 <code>R(x, a_1..a_k)</code> 建出来，估计量方差<b>为零</b></b>。<span class='w'>⇒ 在我付得起的规模上，全因子实验碾压任何估计量</span>。<b>我把 IPS 那条路算到底，正是为了能有根据地说这句话</b>；<span class='k'>而且那张精确表同时充当独立的报告集，顺手解决了优化者的诅咒</span>。", "tag": "推断", "ref": "本讲 p13 · 简报 §4d（穷举 oracle）· 简报 §4b（ESS = n·2^{−k}）"}, {"q": "你的配置空间是组合的（k^H 个），上下文 bandit 那套理论怎么可能用得上？", "a": "<b>用得上，但前提是把组合性放在<b>策略类</b>里而不是放在<b>动作</b>里 —— 而这不是技巧，是一条硬约束。</b> <span class='k'>CSE541 L18 的遗憾是 <code>√(12·|𝒜|·T·log|Π|)</code>：<b>动作数一次方，策略类只进 log</b></span>。<b>若把「动作」定义成整条配置，<code>|𝒜| = k^H</code>，任何 model-free 路线都要为 <code>√(k^H T)</code> 买单，直接不可行</b>；<span class='w'>而把动作定义在<b>节点级</b>（<code>|𝒜| = k</code>，两三个档位），组合性进 <code>Π</code>，只付 <code>log|Π| = O(H log k)</code></span>。<b><code>H=10, k=2</code> 时 <code>log|Π| ≈ 21</code> —— 相对于忽略上下文只多约 4.6 倍的根号因子</b>。<b>而且这不是我挑的最优写法：p10 证了 <code>min_λ max_i ≥ d</code> 是<b>无条件</b>的下界</b>，<span class='k'>也就是说「探索开销正比于动作数」没法靠设计绕开，所以动作必须定义在节点级</span>。", "tag": "推断", "ref": "本讲 p6 三行对照 · p7 页边（d→actions, n→policies）· p10 的无条件下界"}, {"q": "AFlow 报告的最佳 workflow 分数，你凭什么说它虚高？", "a": "<b>凭一个有定理撑着的机制，而且两边的事实都核过。</b> <span class='k'>AFlow 的选择规则是「把已评估的 workflow 按分数排序取 top-k（k=3），再按 softmax 采样」【已核，Algorithm 1】；每个 workflow 的分数是在 <code>D_V</code> 上跑 5 次得来的【已核，§4 + Appendix D】</span>。<b>CSE541 L18 p16：<code>x̂ = argmax f̂(x)</code> ⇒ <code>E[f̂(x̂)] ≫ max_x f(x)</code> —— <code>argmax</code> 偏爱「真值一般、这次噪声往上偏」的点，这是一个<b>方向固定向上</b>的偏差，不是方差</b>。<span class='w'>量级可以估：<code>m</code> 个候选、误差 iid 标准正态，虚高约 <code>σ√(2log m)</code></span>。<b>⇒ 我的对照实验很便宜：把它选出的 workflow 在<b>新</b>留出集上重评一次，差额就是这个偏差</b>。<span class='k'>⚠ 我会把它写成「方法学差异」而不是「他们错了」——这个偏差来自流程，在当时的通行做法下不算疏漏；而且修法对原作者的代码改动极小：<code>argmax(score − c·se)</code>，<code>se</code> 他们已经在算了。</span>", "tag": "推断", "ref": "本讲 p16 · 简报 §2（top-k + softmax）· 简报 §3（D_V 上跑 5 次）"}, {"q": "你既然要做自适应淘汰，为什么最后一步又要用悲观？这两个方向不是矛盾吗？", "a": "<b>不矛盾，因为两个阶段对「不确定性」的定价本来就不同，而这一讲把分界写得很清楚。</b> <span class='k'>在线阶段（淘汰）用乐观：不确定 = 还没探索 = 有信息价值，而且猜错了下一轮能纠正 —— 这是 UCB，<code>argmax f̂ + c</code></span>；<b>最终输出配置是一次性的离线决定：不确定 = 没有证据 = 纯风险，所以 <code>argmax f̂ − c</code></b>（CSE541 L18 p15）。<span class='w'>⚠ 同一个 <code>c(x)</code>，符号相反</span>。<b>而悲观买到的东西是具体的：保证从 <code>V(π_*) − 2max_{π∈Π}C_T(π)</code> 变成 <code>V(π_*) − 2C_T(π_*)</code>，<code>max_π</code> 消失</b>——<span class='k'>也就是说「策略类里有多少个覆盖极差的配置」不再影响我的保证，只要最优那个被覆盖了就行</span>。<b>这对我特别重要，因为我的策略类是组合的，里面必然有大量从没跑过的配置。</b>", "tag": "推断", "ref": "本讲 p15（悲观原则与两种保证的对比）· CSE541 L12 主线卡（随时有效的界）"}, {"q": "你的「按难度分档」策略类是拍脑袋定的吗？凭什么说它里面有好策略？", "a": "<b>遗憾界确实<b>不</b>保证这件事，我不会拿它来撑。</b> <span class='k'>CSE541 L18 p6 的界只认策略类的<b>大小</b>（<code>log|Π|</code>），对它的<b>内容</b>一无所知</span>；<b>「<code>Π</code> 里有没有好策略」是<b>近似误差</b>，界里看不见它，而在应用里它通常才是主要误差来源</b>。<span class='w'>⇒ 这一项必须靠实验挣，不能靠定理</span>。<b>我的做法是简报 §5 的 P2 vs P3 消融：策略只看 (query, 节点 id) vs 也看部分轨迹</b>，<span class='k'>若序贯信息带来的提升不到 2 个百分点，就不用 MDP 框架；同理若「按难度分档」相对单一配置的提升不到阈值，这个策略类就不成立，我会如实报告</span>。<b>界的作用只有一个：告诉我把 <code>Π</code> 做大几乎不要钱（只进 log），所以该把预算花在<b>设计</b> <code>Π</code> 上，而不是花在控制它的大小上。</b>", "tag": "推断", "ref": "本讲 p6 的 say（遗憾与最优的分家）· 简报 §5（P2 vs P3 消融与可加性检验）"}], "papers": [{"t": "Auer, Cesa-Bianchi, Freund &amp; Schapire — EXP3 与对抗式 bandit", "id": "1995 / 2002（讲义的 Theorem 17 就是它的那一族界）", "why": "<b>本讲两段内容共用的那个接口的出处。</b> <span class='k'>值得引用的不是算法而是<b>定理的形状</b>：遗憾 <code>≤ 2γT + log(n)/η + (1−γ)η E[ΣΣ pℓ̂²]</code>，三项各自对应「强制探索 / 在候选里定位 / 估计量的方差」</span>。<b>你要用它说明「候选个数只进 log」这件事的来源</b>。⚠ <b>引用常数或精确条件时查原文</b>，讲义这两页是板书形式、并且把 <code>γ</code> 与 <code>λ</code> 的角色做了简化。"}, {"t": "Kiefer &amp; Wolfowitz — 等价定理（G-最优设计）", "id": "1960（CSE541 L07 p5 的 Lemma 10 点名）", "why": "<b>本讲 p3 那一步 <code>max_j‖x_j‖²_{A(λ)⁻¹} = d</code> 的依据。</b> <span class='k'>而 p9 的 Proposition（<code>min_λ max_i Σ_j p_{i,j}/(Σ_k λ_k p_{k,j}) = d</code>）是它在<b>策略空间</b>上的同构版本，用的是同一套「对数势函数 + 一阶最优性」</span>。<b>两条摆在一起读，能看出这类结论的共同机制：log 的梯度恰好产生「被自己的值除」的结构，于是要界的量与梯度是同一个东西。</b>"}, {"t": "Sachdeva, Su &amp; Joachims — Off-policy Bandits with Deficient Support", "id": "KDD 2020（简报 §4a 点名）", "why": "<b>你那条「确定性日志下 IS 无定义」的正式引用来源。</b> <span class='k'>本讲 p11–p12 给出的是它的充分条件那一侧（<code>E[1/μ(π(c)|c)]</code> 有限才有方差界）；这篇讲的是<b>支撑不足时该怎么办</b></span>——<b>三类处理：限制策略类到被支撑的那部分、估计量做截断/重加权、或者承认不可识别</b>。<b>⇒ 与本讲 p14 那条「<code>Π</code> 必须与随机化范围对齐」说的是同一件事，而这篇给了它名字和正式处理</b>。⚠ <b>具体方法与条件要查原文</b>，这里只核过它存在且主题相符。"}, {"t": "Smith &amp; Winkler — The Optimizer's Curse", "id": "Management Science 2006（本讲 p16 讲的正是这件事，讲义未点名）", "why": "<b>p16 那三行式子的标准引用。</b> <span class='k'>它的贡献是把「在同一批数据上既选又报」造成的向上偏差讲成了一个决策分析问题，并给出贝叶斯修正</span>。<b>你用它来给「AFlow 的 top-k 选择导致报告值虚高」这条批评一个正式的名字和出处</b>——<span class='w'>有名字的批评和没名字的批评，在审稿人眼里分量不同</span>。⚠ <b>讲义没点名这篇，引用前自行核对作者、年份与它到底证了什么</b>（本条属<b>待核</b>的那一类，只是主题高度吻合）。"}, {"t": "Jin, Yang &amp; Wang — Is Pessimism Provably Efficient for Offline RL?", "id": "ICML 2021（本讲 p15 的「悲观原则」在离线 RL 里的代表作，讲义未点名）", "why": "<b>本讲 p15 只给了一个两行证明；这一篇把同一个想法做成了离线 RL 的完整理论。</b> <span class='k'>核心结论与 p15 同构：悲观的次优性由<b>最优策略处</b>的不确定性决定，而不是由整个策略类的最坏情况决定</span>。<b>⇒ 你若要在论文里主张「最终输出该用悲观」，这是比讲义更合适的引用</b>；<span class='w'>而且它处理的是序贯情形，万一简报 §5 的可加性检验把你推向 MDP 形式化，这一篇正好在那一侧</span>。⚠ <b>讲义未点名，引用前核对。</b>"}]};

(function(){

  var PDF_REMOTE="https://courses.cs.washington.edu/courses/cse541/25sp/resources/lecture_18.pdf", PAGEOFF=0;

      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，

      localStorage.removeItem("l18quiz");

  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——

    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+

    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），

    if(n.res) h+='<div class="res"><span class="t">科研连接'+

  if(USE_REMOTE){

  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      var nf=frame.cloneNode(false); nf.removeAttribute("src");
      frame.parentNode.replaceChild(nf,frame); frame=nf;
      frame.src=SRC+HASH;
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
