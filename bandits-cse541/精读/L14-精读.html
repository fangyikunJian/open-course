<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSE541 第 14–15 讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cse541-l14">

<div id="bar">
  <h1>CSE541 第 14–15 讲 · <span>对抗式 bandit · EXP3</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 5</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <a class="btn" id="openpdf" hidden target="_blank" rel="noopener"
     title="在新标签页打开原课件 —— 跨域 PDF 能不能内嵌取决于浏览器">原课件 ↗</a>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../corpus/slides/lecture_14.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>bandits-cse541</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/L14-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "对抗设定里，对手被限制成「开局之前就把损失定死」（健忘对手）。为什么必须有这个限制？", "o": ["为了保证算法收敛", "为了让损失有界", "为了让期望可以交换", "否则遗憾的定义会失去意义：对手若能随你的行为改表，它可以让你走过的路永远差、而让某条你没走的臂事后看起来很好，遗憾必然线性"], "a": 3, "why": "<span class='k'>注意比较对象是<b>事后最好的那条固定臂</b>，不是「每轮各自最好的那一格」——后者等于要求预知未来。</span><b>目标被压低到一个可达成的基准上，这是整套理论能成立的前提。</b>"}, {"q": "对抗设定与随机设定的根本区别是什么？", "o": ["对抗设定里臂数更多", "对抗设定根本不假设有分布：格子里的数可以是任意的，没有分布、没有独立性、没有均值 —— 而随机设定要求 E[X_{i,t}] = μ_i 对所有 t", "对抗设定里奖励范围不同", "对抗设定的分布更难"], "a": 1, "why": "<b>这是本门课到目前为止唯一一个不假设分布的设定。</b><span class='w'>⚠ 另注意两处细节：损失区间是 [−1,1] 不是 [0,1]（损失可以为负）；而从这一讲起约定用「损失」不用「奖励」，<code>exp(−η·)</code> 里那个负号就来自这个约定。</span>"}],
2: [{"q": "重要性加权估计量 ℓ̂ = 1{I_t=i}/P_{t,i} · ℓ_{t,i} 为什么对「这一轮没被拉到的臂」也无偏？", "o": ["因为没拉到的臂估计值取 0 恰好等于真值", "因为用了条件期望", "因为 P_{t,i} > 0", "因为「无偏」是对随机性求平均说的：大多数轮次这个估计是 0，偶尔是一个被放大 1/P 倍的大数，平均下来刚好等于 ℓ_{t,i}"], "a": 3, "why": "<b>⇒ 无偏不等于准。</b><span class='k'>放大 1/P 倍正好抵消「它只有 P 的概率被看到」这件事，但代价全部记在方差上。</span>"}, {"q": "Var(ℓ̂_{t,i}) = ℓ²_{t,i}(1/P_{t,i} − 1)。这个公式最重要的含义是什么？", "o": ["方差总是小于 1", "方差随 1/P 爆炸：P=0.5 时是 ℓ²，P=0.01 时是 99ℓ²，P→0 时趋于无穷 —— 所以光要求 P>0 不够，必须给 P 一个下界", "方差随 P 线性增长", "方差与 P 无关"], "a": 1, "why": "<b>这就是 p3 那个 γλ 混合项存在的全部理由。</b><span class='w'>另注意方差能按时间直接相加，是因为不同轮次的抽取独立——而这<b>不</b>需要损失独立，损失是固定的，随机性只来自你自己的抽样。</span>"}],
3: [{"q": "EXP3 里重要性加权除的是 q_{t,i} 还是 p_{t,i}？为什么？", "o": ["q_{t,i}，因为 q_t = (1−γ)p_t + γλ 才是真正抽样用的分布，除错了就不是无偏估计", "两者都可以", "取决于 γ 的大小", "p_{t,i}，因为它是指数权重的归一化结果"], "a": 0, "why": "<span class='k'>两个分布的分工：<code>p_t</code> 是「我认为该怎么选」（内部信念），<code>q_t</code> 是「我实际怎么选」。</span><b>而定理里 E[ΣΣ p ℓ̂²] 用的是 p、估计量除的是 q —— 这个不对称在放缩里恰好起作用（用 q ≥ (1−γ)p）。</b>"}, {"q": "定理的三项分别是什么的代价？", "o": ["2γT 是强制探索的代价 · log(n)/η 是「一开始不知道哪条臂好」的代价（只进 log）· (1−γ)ηE[ΣΣpℓ̂²] 是重要性加权的方差代价", "都是探索的代价", "三项都来自 bandit 反馈", "2γT 是方差 · log(n)/η 是探索 · 第三项是偏差"], "a": 0, "why": "<b>⇒ η 的两难就在于：它在第二项的<b>分母</b>、第三项的<b>分子</b>。</b><span class='w'>η 大 = 学得快但方差大；η 小 = 稳但学得慢。p4 就是在解这个权衡。</span>"}, {"q": "条件 −η ℓ̂_{t,i} ≤ 1 是干什么用的？在多臂特例下它化成什么？", "o": ["保证算法收敛；化成 η ≤ 1", "保证 p_t 是概率分布；化成 γ ≥ 0", "它是 p5 那个 exp(x) ≤ 1+x+x²（仅对 x ≤ 1）的使用前提；λ 取均匀时 q_{t,i} ≥ γ/n，于是化成 η ≤ γ/n", "保证损失非负；化成 γ ≤ 1"], "a": 2, "why": "<b>没有它，证明的最后一步不成立，所以定理必须把它写进假设里。</b><span class='k'>而 p4 取参数时这条约束会被取成等号（γ = ηn），因为 γ 只出现在递增的 2γT 项里。</span>"}],
4: [{"q": "三项配平之后得到 √(12 nT log n)。这个结果与随机设定下的 UCB（√(nT log T)）相比说明了什么？", "o": ["对抗设定严格更差", "两者不可比较", "对抗设定严格更好", "阶是一样的 —— 完全不假设分布，付出的代价只是 log n 换 log T；但不能据此说「对抗免费」，因为这是期望遗憾、对手是健忘的、而且差距再大它也不会变好"], "a": 3, "why": "<span class='w'>随机设定下还能谈高概率界与问题相关界（Σ Δ⁻¹ log T，差距大时远小于 √(nT)）；而 EXP3 的界是<b>最坏情况</b>的。</span><b>你的问题恰恰是「候选之间差距可能很大」，那正是随机界能大幅获益、对抗界完全无动于衷的情形。</b>"}, {"q": "为什么 γ 要取成约束的等号 γ = ηn？", "o": ["为了让 q_t 均匀", "为了让方差最小", "因为 η 和 γ 必须相等", "因为 γ 只出现在 2γT 这个递增的项里，所以要取尽量小，而约束 η ≤ γ/n 给的下限就是 γ = ηn"], "a": 3, "why": "<b>约束取等号不是凑巧，是因为那个参数在目标里单调。</b><span class='k'>代进去后只剩一个参数：3ηnT + log(n)/η，是 aη + b/η 的标准形，在 η = √(b/a) 处取极小、极小值 2√(ab)。</span>"}, {"q": "对你那个有 2^H 个配置的问题，这一页最关键的信息是什么？", "o": ["log n 这一项太大", "n 进了根号而不是 log：√(2^H) 是彻底不可用的，而线性结构下出现的是 d = H×k（几十）—— 放弃分布假设的真正账单是同时放弃了利用结构的能力", "T 进了根号，所以要减少轮数", "对抗算法更稳健，应该优先用"], "a": 1, "why": "<b>⇒ 必须依赖线性假设，这不是偷懒而是唯一可行的路。</b><span class='w'>这反过来抬高了那个可加性检验实验的分量——它不只是「做得更好」，而是整个方法能不能成立的前提。</span>"}],
5: [{"q": "势函数论证的核心是什么？", "o": ["把同一个量 log(W_{T+1}/W_1) 估两次：下界用某条固定臂（出现「固定臂的累计损失」），上界用算法每轮的实际表现（出现「算法的累计损失」），两边一夹就是遗憾", "对势函数求导找极值", "构造一个鞅再用集中不等式", "用归纳法逐轮推进"], "a": 0, "why": "<b>L10 的椭圆势引理是同一个套路，那里的势是 log|V_t|，这里的势是 log W_t。</b><span class='k'>两讲放在一起看，这个「造势 → 证它涨不快 → 夹出结论」的模板就立起来了。</span>"}, {"q": "上界推导里，W_{t+1}/W_t 代换成 Σ_i p_{t,i}exp(−η ℓ̂_{t,i}) 这一步为什么关键？", "o": ["因为 w_{t,i}/W_t 正是 p_{t,i}，于是权重的比值变成了按算法自己的分布取期望 —— 势函数法自动把算法的行为装进了式子里", "因为它消去了 η", "因为它用到了无偏性", "因为它把连乘变成了连加"], "a": 0, "why": "<span class='w'>接下来两个初等不等式各管一边：蓝字 exp(x) ≤ 1+x+x²（<b>仅对 x ≤ 1</b>，这就是那个条件的用处）把指数换成二次多项式；红字 log(1+x) ≤ x（对所有 x）把 log 脱掉。</span>"}, {"q": "最终界里出现了两个 n（log n 和 √n）。它们的来历相同吗？", "o": ["相同，都来自臂数", "两个都来自重要性加权", "log n 来自方差，n 来自初始化", "不同：log(n)/η 来自初始化（W_1 = n，对 n 条臂一视同仁的一次性入场费，与 T 无关），而真正的瓶颈 √n 来自方差项 nT/(1−γ)，是 bandit 反馈的代价"], "a": 3, "why": "<b>记混了就会错判该优化哪一项。</b><span class='k'>映射到你的问题：log|𝒳| 是「候选集有多大」的代价（便宜），|𝒳| 或 d 是「每次只能测一个配置」的代价（贵）——而线性结构能把后者从 |𝒳| 降到 d，却<b>不</b>能降低前者。</span>"}]
};

var N = [
{"r": [1, 1], "t": "对抗设定：把「分布」这个假设整个拿掉", "star": 3, "quote": "<em>Regret = max<sub>i</sub> Σ<sub>t=1</sub><sup>T</sup> X<sub>i,t</sub> − X<sub>I<sub>t</sub>,t</sub></em><br><em><b>Stochastic case</b>: 𝔼[X<sub>i,t</sub>] = μ<sub>i</sub> ∀t</em><br><em><b>Adversarial Setting</b>: X<sub>i,t</sub> is arbitrary ∀ i,t but chosen <u><b>before</b></u> start of game.</em><br>〔蓝字〕<em><b>Convention</b>: going to use <u>losses</u> instead of rewards.</em><br><em>Adversary chooses losses {ℓ<sub>t</sub>}<sub>t=1</sub><sup>T</sup> ∈ [−1,1]<sup>n</sup>. &nbsp; for t=1,2,…,T: Player chooses I<sub>t</sub> ∈ [n], gets loss ℓ<sub>t,I<sub>t</sub></sub> ∈ [−1,1]. &nbsp; <b>Regret = max<sub>i</sub> Σ<sub>t=1</sub><sup>T</sup> ℓ<sub>t,I<sub>t</sub></sub> − ℓ<sub>t,i</sub></b></em>", "one": "<b>对抗设定不是「换一个更难的分布」，而是<b>根本不假设有分布</b>。而令人意外的是，去掉这个假设之后还能证出界来。</b>", "pts": ["<b>先看那张图，它把整门课的设定画成了一个格子。</b> <span class='k'>纵向 <code>n</code> 行（臂），横向 <code>T</code> 列（时间），每个格子里是一个数 <code>X_{i,t}</code>；<b>每一列你只能揭开一格</b></span>。<b>随机设定与对抗设定的区别，只在于「这些数是怎么填进去的」。</b>", "<b>随机设定：<code>E[X_{i,t}] = μ_i</code> 对所有 <code>t</code>。</b> <span class='w'>同一行的数来自<b>同一个分布</b>，均值不随时间变</span>——<b>这是前面每一讲（L05 的集中不等式、L07 的最优设计、L09 的纯探索、L10/L12 的线性 bandit）共同的前提。</b>", "<b>对抗设定：<code>X_{i,t}</code> 是<b>任意</b>的。</b> <span class='k'>没有分布、没有独立性、没有均值——格子里可以填任何数</span>。<b>⇒ 这是本门课到目前为止<b>唯一</b>一个不假设分布的设定，而这件事本身比算法更值得记住。</b>", "⚠️ <b>但有一个关键限制，原文特意把它下划线了：<code>chosen <u>before</u> start of game</code>。</b> <span class='w'>对手必须在开局<b>之前</b>把整张表填完，不能看着你的选择临时改</span>——<b>这叫<b>健忘对手</b>（oblivious adversary）</b>。<span class='k'>⇒ 如果对手能看你历史再填，叫适应性对手（adaptive），结论要另说。</span>", "<b>「健忘」这个限制为什么必需？因为没有它，遗憾的定义本身会失去意义。</b> <span class='w'>遗憾是跟「事后最好的那条固定臂」比：<code>max_i Σ_t ℓ_{t,i}</code></span>；<b>若对手能随你的行为改表，它可以让「你走过的路」永远差、而让某条你没走的臂事后看起来很好，于是遗憾必然线性。</b>", "<b>注意比较对象：是<b>事后最好的那一条固定臂</b>，不是「每轮各自最好的那一格」。</b> <span class='k'>后者（逐轮最优）是做不到的——那等于要求你预知未来</span>。<b>⇒ 对抗 bandit 的目标被压低到了一个可达成的基准上，而这个基准的选择是整套理论能成立的前提。</b>", "<b>蓝字那句约定要当真：<b>从这一讲起用「损失」而不是「奖励」</b>。</b> <span class='w'>两者只差一个负号，但整讲的公式、指数权重的方向（<code>exp(−η·)</code>）都是按损失写的</span>——<b>⚠ 看到 <code>exp(−η ℓ̂)</code> 里那个负号时，记得它来自这个约定，不是某种技巧。</b>", "⚠️ <b>还有一处容易看漏：损失的取值范围是 <b><code>[−1,1]</code></b>，不是 <code>[0,1]</code>。</b> <span class='k'>这影响后面所有常数</span>，<b>而且它意味着损失<b>可以是负的</b>（相当于奖励）</b>。<span class='w'>⇒ 照抄常数之前先确认区间。</span>", "<b>为什么要费劲研究一个这么悲观的设定？因为它给出的保证<b>不依赖任何建模假设</b>。</b> <span class='k'>随机设定下的界，前提是「均值不随时间变」——现实里这条常常是错的（分布漂移、非平稳）</span>；<b>而对抗设定下的界，不管现实是什么样都成立。</b><span class='w'>这是一种「最坏情况下也不垮」的稳健性，代价是界更松。</span>"], "eq": "那张图 = 整门课的设定：n 行（臂）× T 列（时间），**每列只能揭开一格**\n   随机与对抗的区别，只在于「这些数是怎么填进去的」\n\n**随机设定**：E[X_{i,t}] = μ_i **对所有 t**\n   同一行来自同一个分布，均值不随时间变\n   ← L05 / L07 / L09 / L10 / L12 共同的前提\n\n**对抗设定**：X_{i,t} **任意**（无分布、无独立性、无均值）\n   ⇒ 本门课到目前为止**唯一**不假设分布的设定\n\n⚠ 关键限制（原文下划线）：chosen **before** start of game\n   = **健忘对手**（oblivious）：开局前把整张表填完，不能看你的选择临时改\n   （能看历史再填的叫适应性对手 adaptive，结论另说）\n\n   为什么必需：遗憾是跟**事后最好的那条固定臂**比 —— max_i Σ_t ℓ_{t,i}\n   若对手能随你的行为改表，它可以让你走过的路永远差、\n   而让某条没走的臂事后很好 ⇒ 遗憾必然线性，定义失去意义\n\n   ⚠ 比较对象是**事后最好的一条固定臂**，不是「每轮各自最好的那一格」\n     后者等于要求预知未来 ⇒ 目标被压到一个可达成的基准上\n\n**约定**（蓝字，要当真）：从这一讲起用**损失**而不是奖励\n   整讲公式、指数权重的方向 exp(−η·) 都按损失写\n   ⚠ 看到那个负号时，记得它来自这个约定，不是技巧\n\n⚠ 损失区间是 **[−1,1]**，不是 [0,1] —— 影响后面所有常数，且损失**可以为负**\n\n协议：对手选 {ℓ_t}_{t=1}^T ∈ [−1,1]^n（开局前定死）\n      for t = 1…T：玩家选 I_t ∈ [n]，吃到 ℓ_{t,I_t}\n      **R_T = max_i Σ_{t=1}^T ℓ_{t,I_t} − ℓ_{t,i}**\n\n为什么研究这么悲观的设定：**保证不依赖任何建模假设**\n   随机设定的前提「均值不随时间变」现实里常是错的（漂移、非平稳）\n   对抗设定的界不管现实什么样都成立 —— 稳健，代价是界更松", "tbl": {"head": ["", "随机设定（前面各讲）", "对抗设定（本讲）"], "rows": [["格子里的数怎么来", "<b>同一行同一个分布</b>，E[X<sub>i,t</sub>]=μ<sub>i</sub>", "<b>任意</b>，无任何分布假设"], ["限制是什么", "分布不随时间变", "<b>开局前就定死</b>（健忘对手）"], ["跟谁比", "最优臂 μ<sub>*</sub>", "<b>事后最好的那条固定臂</b>"], ["保证的性质", "依赖建模假设", "<b>不依赖任何分布假设</b>"], ["代价", "—", "<b>界更松</b>（见 p4）"]]}, "res": {"tag": "推断", "v": "<b>这一页正面撞上你简报里写的那条验收标准：<b>distribution-free guarantees</b>。</b><br><span class='k'>对抗设定就是「分布无关」这四个字最严格的形式——它连「有一个分布」都不假设</span>。<b>⇒ 所以如果审稿人问「你的保证依赖什么分布假设」，这一讲给了你一个可以明确定位自己的坐标系</b>：<span class='w'>完全无分布（本讲）↔ 独立同分布（L05–L12）↔ 带结构的独立同分布（L07/L10 的线性）</span>。<br><b>⚠ 但先说清楚：你<b>不</b>该直接用对抗设定，理由在 p4 那条界里——它是 <code>√(nT log n)</code>，<b>臂数进根号</b></b>。<span class='k'>你有 <code>2^H</code> 个配置，<code>√(2^H)</code> 是灾难</span>；<b>而线性结构下（L10）是 <code>d</code> 而不是 <code>n</code>，<code>d = H×k</code> 只有几十</b>。<span class='w'>⇒ <b>对抗稳健性与结构利用是互斥的</b>，这个取舍值得在论文里明说。</span><br><b>那这一页对你的真正用处是什么？是<b>给「分布漂移」一个说法</b>。</b> <span class='k'>你的设定里有一件事确实不满足独立同分布：<b>同一条 query 在不同节点上的难度是相关的，而且 LLM 的输出随版本漂移</b></span>。<b>⇒ 你可以这样写：主结果在独立同分布下给紧的界（利用线性结构），而<b>作为稳健性讨论</b>指出在完全对抗下仍有 <code>√(nT log n)</code> 的退化保证。</b><span class='w'>两段式的论证比只报一个界可信得多。</span><br><b>而「健忘对手」这个限制对你恰好是<b>满足</b>的，值得点出来。</b> <span class='k'>你的 benchmark 是一个<b>固定</b>的 query 集合，在你开始实验之前就存在，不会因为你测了什么而改变</span>——<b>⇒ 这正是 oblivious 的定义</b>。<span class='w'>⚠ 唯一的例外是如果你边跑边改 benchmark（比如按难度筛题），那就变成适应性了，保证会失效。</span>", "ref": "本讲 p1（逐行核对）· p4 · L10 p5 · 简报 §1 §4d（已核）"}, "link": {"t": "你学过的对应：本课 L05 精读（集中不等式——那一整套机器的前提正是这一页要拿掉的「有分布」）", "href": "L05-精读.html"}},
{"r": [2, 2], "t": "重要性加权：无偏是免费的，方差不是", "star": 3, "quote": "<em>Suppose I<sub>t</sub> ∼ P<sub>t</sub> ∈ Δ<sub>n</sub></em> &nbsp;〔紫框〕<em><b>ℓ̂<sub>t,i</sub> = ( 𝟙{I<sub>t</sub>=i} / P<sub>t,i</sub> ) · ℓ<sub>t,i</sub></b></em> &nbsp;〔蓝框〕<em>P<sub>t,i</sub> &gt; 0 ∀i</em><br><em>𝔼[ℓ̂<sub>t,i</sub> | P<sub>t</sub>] = Σ<sub>j=1</sub><sup>n</sup> P<sub>t,j</sub> (𝟙{j=i}/P<sub>t,i</sub>) ℓ<sub>t,i</sub> = ℓ<sub>t,i</sub></em><br><em>Var(ℓ̂<sub>t,i</sub>) = 𝔼[ℓ̂²<sub>t,i</sub>] − 𝔼[ℓ̂<sub>t,i</sub>]² = ℓ²<sub>t,i</sub>/P<sub>t,i</sub> − ℓ²<sub>t,i</sub> = <b>ℓ²<sub>t,i</sub>(1/P<sub>t,i</sub> − 1)</b></em><br><em>Var( Σ<sub>t=1</sub><sup>T</sup> ℓ̂<sub>t,i</sub> ) = Σ<sub>t=1</sub><sup>T</sup> ℓ²<sub>t,i</sub>(1/P<sub>t,i</sub> − 1)</em>", "one": "<b>你只看见被拉的那条臂，却想估计<b>所有</b>臂的损失。除以「被选中的概率」就能做到无偏——代价全部记在方差上，而且是 1/P 这么猛。</b>", "pts": ["<b>先看问题：bandit 反馈意味着你每轮<b>只</b>看到 <code>ℓ_{t,I_t}</code> 一个数。</b> <span class='k'>但指数权重算法要更新<b>所有</b> n 条臂的权重，它需要 <code>ℓ_{t,i}</code> 对每个 <code>i</code></span>。<b>⇒ 必须把一个观测「摊」成 n 个估计，而重要性加权就是那个摊法。</b>", "<b>估计量只有一行：<code>ℓ̂_{t,i} = 1{I_t=i}/P_{t,i} · ℓ_{t,i}</code>。</b> <span class='w'>读法很直白：<b>没被选中的臂记 0；被选中的那条，把它的损失放大 <code>1/P</code> 倍</b></span>。<b>放大的倍数正好抵消「它只有 <code>P</code> 的概率被看到」这件事。</b>", "<b>无偏性的验算只有一步，但值得自己过一遍。</b> <span class='k'><code>E[ℓ̂_{t,i}] = Σ_j P_{t,j}·(1{j=i}/P_{t,i})·ℓ_{t,i}</code>——求和里只有 <code>j=i</code> 那一项非零，给出 <code>P_{t,i}·(1/P_{t,i})·ℓ_{t,i} = ℓ_{t,i}</code></span>。<b>⇒ 对每一条臂都无偏，<b>包括那些这一轮没被拉到的</b>。</b>", "<b>这件事初看是反直觉的：你没观测到第 i 条臂，却得到了它损失的无偏估计。</b> <span class='w'>关键在于「无偏」是对<b>随机性求平均</b>说的——大多数轮次里这个估计是 0，偶尔是一个很大的数，平均下来刚好对</span>。<b>⇒ 无偏不等于准，这正是下面方差要说的事。</b>", "<b>方差的计算也是一步：<code>E[ℓ̂²] = Σ_j P_{t,j}(1{j=i}/P²_{t,i})ℓ²_{t,i} = ℓ²_{t,i}/P_{t,i}</code>。</b> <span class='k'>注意分母是 <code>P²</code>（因为平方了），而求和只留下一个 <code>P</code>，所以净剩 <code>1/P</code></span>。<b>减去 <code>E[ℓ̂]² = ℓ²</code>，得 <code>Var = ℓ²(1/P − 1)</code>。</b>", "⚠️ <b>这个公式是整页的要害：<b>方差随 <code>1/P</code> 爆炸</b>。</b> <span class='w'><code>P = 0.5</code> 时方差是 <code>ℓ²</code>；<code>P = 0.01</code> 时是 <code>99ℓ²</code>；<code>P → 0</code> 时趋于无穷</span>。<b>⇒ 一条臂越少被拉，对它的估计越不可靠——而「越不可靠」是按倒数、不是按对数。</b>", "<b>蓝框那个条件 <code>P_{t,i} > 0 ∀i</code> 因此不是形式上的讲究，它是必需的。</b> <span class='k'>某条臂的概率真到 0，它的估计量就没定义（除以 0），而且永远得不到任何信息</span>。<b>⇒ 而光是「大于 0」还不够——方差要可控，需要 <code>P</code> 有一个<b>下界</b>。</b><span class='w'>这就是 p3 那个 <code>γλ</code> 混合项存在的全部理由。</span>", "<b>最后一行把方差按时间求和：<code>Var(Σ_t ℓ̂_{t,i}) = Σ_t ℓ²_{t,i}(1/P_{t,i} − 1)</code>。</b> <span class='k'>能直接相加，是因为不同轮次的随机抽取相互独立</span>（<b>注意这里<b>不</b>需要损失独立——损失是固定的，随机性只来自你自己的抽样</b>）。<span class='w'>⇒ 这是对抗设定下一个很舒服的性质：唯一的随机性是你自己制造的，所以你完全掌握它。</span>"], "eq": "问题：bandit 反馈 ⇒ 每轮只看到 ℓ_{t,I_t} 一个数\n     但指数权重要更新**所有** n 条臂的权重\n     ⇒ 必须把一个观测「摊」成 n 个估计\n\n**重要性加权估计量**（紫框）：\n   **ℓ̂_{t,i} = ( 1{I_t = i} / P_{t,i} ) · ℓ_{t,i}**\n   读法：没被选中的臂记 0；被选中的那条，损失放大 1/P 倍\n         放大倍数正好抵消「它只有 P 的概率被看到」\n\n**无偏**（一步验算）：\n   E[ℓ̂_{t,i} | P_t] = Σ_j P_{t,j}·(1{j=i}/P_{t,i})·ℓ_{t,i}\n                    = P_{t,i}·(1/P_{t,i})·ℓ_{t,i} = **ℓ_{t,i}**\n   ⇒ 对每条臂都无偏，**包括这一轮没被拉到的**\n   反直觉之处：没观测到却得到无偏估计\n     —— 「无偏」是对随机性求平均说的：大多数轮次为 0，偶尔很大，平均刚好对\n     ⇒ **无偏 ≠ 准**\n\n**方差**：\n   E[ℓ̂²] = Σ_j P_{t,j}·(1{j=i}/P²_{t,i})·ℓ²_{t,i} = ℓ²_{t,i}/P_{t,i}\n     （分母 P² 是因为平方了，求和只留一个 P ⇒ 净剩 1/P）\n   **Var(ℓ̂_{t,i}) = ℓ²_{t,i}·( 1/P_{t,i} − 1 )**\n\n⚠ 整页的要害：**方差随 1/P 爆炸**\n   P = 0.5  ⇒ Var = ℓ²\n   P = 0.01 ⇒ Var = 99ℓ²\n   P → 0    ⇒ Var → ∞\n   ⇒ 越少被拉，估计越不可靠 —— 按**倒数**，不是按对数\n\n蓝框 P_{t,i} > 0 ∀i 因此是必需的，而且光「大于 0」还不够：\n   方差要可控需要 P 有**下界** ⇒ 这就是 p3 那个 γλ 混合项存在的全部理由\n\n按时间求和：Var( Σ_t ℓ̂_{t,i} ) = Σ_t ℓ²_{t,i}(1/P_{t,i} − 1)\n   能直接相加是因为不同轮次的抽取独立\n   ⚠ **不**需要损失独立 —— 损失是固定的，随机性只来自你自己的抽样\n     ⇒ 对抗设定下很舒服的性质：唯一的随机性是你自己制造的", "res": {"tag": "已核", "v": "<b>这一页是整讲对你最直接有用的，因为<b>重要性加权就是离策评估</b>（off-policy evaluation / IPS），而你一定会用到它。</b><br><span class='k'>场景：你用某个采集策略跑了一批 (query, 配置) 的真实调用，现在想估计<b>另一个</b>配置（或另一个 λ 下的最优配置）的 <code>G</code>，而不重新跑</span>。<b>⇒ 标准做法正是 <code>Ĝ = (1/N)Σ (1{选中了它}/倾向性) · G_观测</code>，和这一页一字不差。</b><br><b>而这一页给了你那个必须知道的代价公式</b>：<b><code>Var = ℓ²(1/P − 1)</code></b>。<span class='w'>翻译：<b>某个配置在你的采集数据里出现的频率是 1%，那么对它的离策估计方差要乘 99</b></span>。<b>⇒ 这解释了一个你很可能会遇到的现象：重用历史数据去评估冷门配置时，估计值会剧烈跳动，而那不是 bug，是 <code>1/P</code>。</b><br><b>三条可以直接执行的推论：</b><br><b>① <b>记录倾向性</b>。</b> <span class='k'>离策估计需要 <code>P_{t,i}</code> 这个数，而它必须在采集<b>当时</b>就记下来</span>——<b>事后是补不出来的</b>。<span class='w'>⚠ 这是实验脚本层面的要求，漏了就整批数据作废，值得现在就去加。</span><br><b>② <b>给采集策略一个概率下界</b>（就是 p3 的 <code>γλ</code>）。</b> <span class='k'>哪怕你的主策略想集中在少数配置上，也要留 <code>γ</code> 的质量均匀撒出去</span>；<b>⇒ 这保证 <code>P ≥ γ/n</code>，于是方差被 <code>n/γ</code> 卡住，而不是无界。</b><br><b>③ <b>报方差时用这个公式而不是经验方差</b>。</b> <span class='w'>冷门配置的样本量小，经验方差本身就估不准，而且会<b>系统性偏小</b>（没采到那条尾巴）</span>；<b>⇒ 用 <code>ℓ²(1/P−1)</code> 这个解析式更稳妥，也更容易在论文里讲清楚。</b>", "ref": "本讲 p2（逐行核对）· p3（γλ 下界）· 简报 §4b §4e（已核）"}, "link": {"t": "你学过的对应：CS234 L05 精读（离策评估与重要性采样——那里是「用行为策略的轨迹估目标策略的值」，这里是「用抽样的那条臂估所有臂」，同一个式子）", "href": "../../reinforcement learning/corpus/cs234-2019/中文精读/L05-精读.html"}},
{"r": [3, 3], "t": "EXP3：指数权重 + 重要性加权 + 强制探索", "star": 3, "quote": "<b>EXP3(γ): Exponential Weights for Exploration Exploitation</b><br><em><b>Input:</b> Time horizon T, n arms, η &gt; 0, γ ∈ [0,1], λ ∈ △<sub>n</sub>.<br><b>Initialize:</b> Player sets p<sub>1</sub> = (1/n,…,1/n) ∈ △<sub>n</sub>. Adversary chooses {ℓ<sub>t</sub>}<sub>t=1</sub><sup>T</sup> ⊂ [−1,1]<sup>n</sup>.<br><b>for:</b> t = 1,⋯,T<br>&nbsp;&nbsp;Player draws I<sub>t</sub> ∼ <u>q<sub>t</sub> := (1−γ)p<sub>t</sub> + γλ</u> and suffers (and observes) loss ℓ(I<sub>t</sub>,ℓ<sub>t</sub>) = ℓ<sub>t,I<sub>t</sub></sub><br>&nbsp;&nbsp;Player computes ℓ̂<sub>t,i</sub> = (𝟙{I<sub>t</sub>=i}/q<sub>t,i</sub>)ℓ<sub>t,i</sub><br>&nbsp;&nbsp;Update iterates: &nbsp; <b>w<sub>t+1,i</sub> = w<sub>t,i</sub>exp(−η ℓ̂<sub>t,i</sub>)</b>, &nbsp; <b>p<sub>t+1,i</sub> = w<sub>t+1,i</sub>/Σ<sub>j=1</sub><sup>n</sup> w<sub>t+1,j</sub></b></em><br><b>Thm</b> <em>For any loss sequence, and η,γ ≥ 0 where <u>−η ℓ̂<sub>t,i</sub> ≤ 1</u> for all i,t, then &nbsp;<b>𝔼[Σ<sub>t</sub> ℓ<sub>t,I<sub>t</sub></sub> − ℓ<sub>t,i</sub>] ≤ 2γT + log(n)/η + (1−γ)η 𝔼[Σ<sub>t</sub>Σ<sub>i</sub> p<sub>t,i</sub>ℓ̂²<sub>t,i</sub>]</b></em>", "one": "<b>算法是三个零件拼的：指数权重负责「学得快」，重要性加权负责「从一个观测推出 n 个」，而 γλ 那一项负责「别让任何概率掉到 0」——因为上一页说了，掉到 0 方差就炸。</b>", "pts": ["<b>先把三个零件分清楚，因为定理的三项正好一一对应。</b> <span class='k'>① <b>指数权重</b> <code>w_{t+1,i} = w_{t,i}exp(−ηℓ̂_{t,i})</code>：损失大的臂权重指数衰减；② <b>重要性加权</b>（上一页）：把一个观测摊成 n 个估计；③ <b>混合</b> <code>q_t = (1−γ)p_t + γλ</code>：强制留一点概率给每条臂</span>。", "<b>第 ③ 件是这一讲名字里那个 <code>(γ)</code> 的来历，也是「bandit 版」区别于「全信息版」的地方。</b> <span class='w'>全信息下（每轮看到所有臂的损失）不需要它，指数权重直接就能用</span>；<b>⇒ 而 bandit 下必须有它，因为 p2 的方差 <code>1/P</code> 要求 <code>P</code> 有下界。</b>", "<b>⚠ 注意一处很容易看错的细节：<b>重要性加权除的是 <code>q_{t,i}</code>，不是 <code>p_{t,i}</code></b>。</b> <span class='k'><code>q_t</code> 才是你真正抽样用的分布</span>——<b>除错了就不是无偏估计了</b>。<span class='w'>而权重更新 <code>w</code> 与归一化得到的 <code>p</code> 是算法的「内部信念」，抽样前还要再和 <code>λ</code> 混一次。</span>", "<b>两个分布的分工值得单说：<code>p_t</code> 是「我认为该怎么选」，<code>q_t</code> 是「我实际怎么选」。</b> <span class='k'>定理里 <code>E[Σ p_{t,i}ℓ̂²]</code> 用的是 <code>p</code>，而估计量除的是 <code>q</code></span>——<b>⇒ 这个不对称在 p3 末尾那个放缩里恰好起作用（用 <code>q ≥ (1−γ)p</code>）。</b>", "<b>再看那个条件 <code>−η ℓ̂_{t,i} ≤ 1</code>，它不是装饰，而是 p5 那个初等不等式 <code>exp(x) ≤ 1+x+x²</code>（仅对 <code>x ≤ 1</code>）的使用前提。</b> <span class='w'>⇒ 定理必须把它写进假设里，否则证明的最后一步不成立。</span>", "<b>多臂特例把这个条件化成了对 <code>η</code> 的约束，而推导只有一行。</b> <span class='k'>取 <code>λ</code> 均匀 ⇒ <code>q_{t,i} = (1−γ)p_{t,i} + γ/n ≥ γ/n</code>；于是 <code>|ηℓ̂_{t,i}| ≤ η·1/(γ/n) = ηn/γ</code></span>。<b>⇒ 要它 <code>≤ 1</code>，就要 <b><code>η ≤ γ/n</code></b>。</b><span class='w'>这条约束在 p4 取参数时会被取成等号。</span>", "<b>定理的三项各有名字，记住它们比记住式子有用。</b> <b><code>2γT</code></b> ——<span class='k'>强制探索的代价：有 <code>γ</code> 的概率你在瞎选，每轮最多亏 2（损失区间 <code>[−1,1]</code>）</span>；<b><code>log(n)/η</code></b> ——<span class='w'>「一开始不知道哪条臂好」的代价，<b>只进 <code>log</code></b></span>；<b><code>(1−γ)η·E[ΣΣ p ℓ̂²]</code></b> ——<b>重要性加权的方差代价</b>。", "<b>⇒ 看出 <code>η</code> 的两难了：它在第二项的<b>分母</b>、第三项的<b>分子</b>。</b> <span class='k'><code>η</code> 大 = 学得快（快速忘掉差臂）但方差大；<code>η</code> 小 = 稳但学得慢</span>。<b>p4 就是在解这个权衡。</b>", "<b>最后那个方差项的放缩有两步，都值得看清楚。</b> <span class='w'>① <code>p_{t,i} ≤ q_{t,i}/(1−γ)</code>（因为 <code>q = (1−γ)p + γλ ≥ (1−γ)p</code>），用它把 <code>p/q²</code> 换成 <code>1/((1−γ)q)</code></span>；<b>② <code>E[1{I_t=i}/q_{t,i}] = 1</code>，于是整个期望塌成 <code>ΣΣℓ²_{t,i}</code></b>。<span class='k'>再用 <code>ℓ² ≤ 1</code> 得 <code>≤ nT/(1−γ)</code>。</span>", "<b>注意第 ② 步那个「期望塌掉」：重要性加权的<b>平方</b>项，期望之后只剩一个 <code>1/q</code> 的量级。</b> <span class='w'>这正是 p2 方差公式的另一种写法</span>——<b>⇒ 而 <code>q ≥ γ/n</code> 把它卡在了 <code>n/γ</code>，所以最终是 <code>nT</code> 而不是无穷。</b><span class='k'>整个算法的设计就是为了让这一步成立。</span>"], "eq": "三个零件（定理三项正好一一对应）：\n   ① **指数权重** w_{t+1,i} = w_{t,i}·exp(−η ℓ̂_{t,i})     损失大的臂指数衰减\n   ② **重要性加权**（p2）                              一个观测摊成 n 个估计\n   ③ **混合** q_t = (1−γ)p_t + γλ                      强制留概率给每条臂\n\n   ③ 是名字里那个 (γ) 的来历，也是 bandit 版区别于全信息版的地方\n     全信息下不需要它；bandit 下必须有，因为 p2 的 1/P 要求 P 有下界\n\n⚠ 重要性加权除的是 **q_{t,i}**，不是 p_{t,i}\n   q_t 才是真正抽样用的分布，除错了就不无偏\n   p_t = 「我认为该怎么选」（内部信念）；q_t = 「我实际怎么选」\n   ⇒ 这个不对称在末尾放缩里恰好起作用（用 q ≥ (1−γ)p）\n\n条件 **−η ℓ̂_{t,i} ≤ 1** 不是装饰：\n   它是 p5 那个 exp(x) ≤ 1+x+x²（仅对 x ≤ 1）的使用前提\n\n多臂特例 ⇒ 对 η 的约束（一行）：\n   λ 均匀 ⇒ q_{t,i} = (1−γ)p_{t,i} + γ/n ≥ **γ/n**\n   ⇒ |η ℓ̂_{t,i}| ≤ η·1/(γ/n) = ηn/γ ≤ 1  ⟺  **η ≤ γ/n**\n\n**定理三项各有名字**（记名字比记式子有用）：\n   **2γT**                  强制探索的代价（γ 概率在瞎选，每轮最多亏 2，因区间 [−1,1]）\n   **log(n)/η**             「一开始不知道哪条好」的代价 —— **只进 log**\n   **(1−γ)η·E[ΣΣ p ℓ̂²]**    重要性加权的方差代价\n\n   ⇒ η 的两难：在第二项**分母**、第三项**分子**\n     η 大 = 学得快但方差大；η 小 = 稳但学得慢   ⇒ p4 解这个权衡\n\n方差项的放缩（两步）：\n   ① p_{t,i} ≤ q_{t,i}/(1−γ)      （因 q = (1−γ)p + γλ ≥ (1−γ)p）\n      ⇒ p/q² 换成 1/((1−γ)q)\n   ② E[ 1{I_t=i}/q_{t,i} ] = 1    ⇒ 期望塌成 ΣΣ ℓ²_{t,i}\n   ⇒ ≤ **nT/(1−γ)**              （再用 ℓ² ≤ 1）\n\n   ⚠ 第 ② 步：重要性加权的**平方**项，期望之后只剩 1/q 的量级\n     而 q ≥ γ/n 把它卡在 n/γ ⇒ 最终是 nT 而不是无穷\n     **整个算法的设计就是为了让这一步成立**", "tbl": {"head": ["定理的项", "它是什么的代价", "谁让它变大", "谁让它变小"], "rows": [["<b>2γT</b>", "<b>强制探索</b>（γ 概率瞎选）", "<span class='w'>γ 大</span>", "γ 小"], ["<b>log(n)/η</b>", "<b>不知道哪条臂好</b>（只进 log）", "<span class='w'>η 小</span>", "η 大"], ["<b>(1−γ)η·E[ΣΣpℓ̂²]</b>", "<b>重要性加权的方差</b>", "<span class='w'>η 大 · γ 小</span>", "η 小 · γ 大"], ["约束", "<b>η ≤ γ/n</b>", "—", "—"]]}, "res": {"tag": "推断", "v": "<b>那个 <code>q_t = (1−γ)p_t + γλ</code> 是你该直接抄进采集脚本的一行，而且它比看上去重要。</b><br><span class='k'>你的筛选过程会越来越集中——逐次淘汰砍掉候选之后，剩下的预算都压在少数几个配置上</span>。<b>⇒ 而一旦某个配置的采样概率趋于 0，你就<b>永久</b>失去了用这批数据离策评估它的能力（p2 的 <code>1/P</code>）</b>。<span class='w'>混合项是在为「以后可能想回头看」买保险，成本是 <code>γ</code> 的预算。</span><br><b>而 <code>λ</code> 是可以自己挑的，这一点讲义写明了（<code>λ ∈ Δ_n</code> 是输入），对你有用。</b> <span class='k'>算法<b>不</b>要求 <code>λ</code> 均匀——多臂特例才取均匀</span>。<b>⇒ 你可以把 <code>λ</code> 取成 <b>L07 那个 G-最优设计的解</b></b>：<span class='w'>既保住了「每个配置都有概率下界」，又让这部分探索预算花在信息量最大的方向上</span>。<b>这是两讲能直接拼起来的一处，而且是免费的——<code>λ</code> 不依赖任何测量结果。</b><br><b>⚠ 但要诚实说清这个组合<b>没有</b>现成定理。</b> <span class='k'>本讲的界只在 <code>λ</code> 均匀时算到了 <code>nT</code>；换成 G-最优的 <code>λ</code>，那个 <code>q_{t,i} ≥ γλ_i</code> 的下界对 <code>λ_i</code> 小的臂会更差</span>。<b>⇒ 要么重算那个放缩，要么取「均匀与 G-最优各半」的折中。写进论文前这一步必须自己推一遍。</b><br><b>最后一条实际的：<b>三项的分解本身就是一张很好的消融表</b>。</b> <span class='w'><code>2γT</code>（探索）· <code>log(n)/η</code>（学习）· <code>ηnT</code>（方差）</span>——<b>⇒ 你可以按这三项把实测的预算消耗拆开报，说明每一份钱花在哪。</b><span class='k'>审稿人问「你的 γ 为什么取这个值」时，这张表就是答案。</span>", "ref": "本讲 p3（算法框与定理，逐字核对）· p2 · L07 p4 p5 · 简报 §4b §4c（已核）"}},
{"r": [4, 4], "t": "调参：三项配平，得 √(12 nT log n)", "star": 3, "quote": "<em>Regret ≤ 2γT + log(n)/η + ηnT &nbsp;=&nbsp; <b>3ηnT + log(n)/η</b> &nbsp;≤&nbsp; <b>√( 12 nT log(n) )</b> &nbsp; w/ &nbsp; <b>η = √( log(n) / (3nT) )</b></em><br>〔红字〕<em>q<sub>t,i</sub> = (1−γ)p<sub>t,i</sub> + γλ<sub>i</sub></em><br><em>𝔼[Σ<sub>t</sub> ℓ<sub>t,I<sub>t</sub></sub> − ℓ<sub>t,i</sub>] = 𝔼[Σ<sub>t</sub>(Σ<sub>i</sub> q<sub>t,i</sub>ℓ<sub>t,i</sub>) − ℓ<sub>t,i</sub>] ≤ γT + 𝔼[Σ<sub>t</sub>((1−γ)Σ<sub>i</sub> p<sub>t,i</sub>ℓ<sub>t,i</sub>) − ℓ<sub>t,i</sub>] ≤ 2γT + (1−γ)𝔼[Σ<sub>t</sub>(Σ<sub>i</sub> p<sub>t,i</sub>ℓ<sub>t,i</sub>) − ℓ<sub>t,i</sub>] = 2γT + (1−γ)𝔼[Σ<sub>t</sub>(Σ<sub>i</sub> p<sub>t,i</sub>ℓ̂<sub>t,i</sub>) − ℓ̂<sub>t,i</sub>]</em><br><em>W<sub>t</sub> = Σ<sub>i=1</sub><sup>n</sup> w<sub>t,i</sub>; &nbsp; log(W<sub>T+1</sub>/W<sub>1</sub>) ≥ −log(n) + log(w<sub>T+1,i</sub>)</em>", "one": "<b>三项里有两个参数，而约束 η ≤ γ/n 把它们绑成一个。取等号、再对 η 求极值，整个界就塌成一个数：√(12 nT log n)。</b>", "pts": ["<b>第一步是把定理里那个期望项换成 p3 算出来的界，而关键是两个 <code>(1−γ)</code> 正好抵消。</b> <span class='k'><code>(1−γ)·η·[nT/(1−γ)] = ηnT</code></span>。<b>⇒ 于是三项变成干净的 <code>2γT + log(n)/η + ηnT</code>，<b>γ 只剩在第一项里</b>。</b>", "<b>第二步是用掉那个约束。</b> <span class='w'>p3 要求 <code>η ≤ γ/n</code>，而 <code>γ</code> 只出现在 <code>2γT</code> 这个<b>递增</b>的项里，所以 <code>γ</code> 当然要取得尽量小</span>——<b>⇒ 取等号 <b><code>γ = ηn</code></b></b>。<span class='k'>这一步值得记：约束取等号不是凑巧，是因为那个参数在目标里单调。</span>", "<b>代进去：<code>2γT = 2ηnT</code>，加上 <code>ηnT</code>，得 <code>3ηnT + log(n)/η</code>。</b> <span class='w'>现在只剩<b>一个</b>参数 <code>η</code>，而形式是 <code>aη + b/η</code> 的标准形</span>。", "<b>第三步是那个到处都会遇到的配平：<code>aη + b/η</code> 在 <code>η = √(b/a)</code> 处取极小，极小值 <code>= 2√(ab)</code>。</b> <span class='k'>这里 <code>a = 3nT</code>、<code>b = log n</code></span>；<b>⇒ <code>η_* = √(log n/(3nT))</code>，值 <code>= 2√(3nT·log n) = √(12 nT log n)</code>。</b><span class='w'>（<code>2√x = √(4x)</code>，<code>4×3 = 12</code>。）</span>", "<b>看这个结果的形状：<b><code>√(nT log n)</code></b>。</b> <span class='k'>和随机设定下的 UCB 比（<code>√(nT log T)</code>），<b>阶是一样的</b></span>——<b>⇒ 这是一个相当惊人的结论：<b>完全不假设分布，付出的代价只是 <code>log n</code> 换 <code>log T</code></b>。</b>", "⚠️ <b>但不要据此说「对抗设定免费」，差别藏在别处：<b>这是期望遗憾，而且对手是健忘的</b>。</b> <span class='w'>随机设定下还能谈高概率界、问题相关界（<code>Σ Δ^{-1}log T</code>，差距大时远小于 <code>√(nT)</code>）</span>；<b>⇒ 而 EXP3 的界是<b>最坏情况</b>的，臂之间差距再大它也不会变好。</b>", "<b>⚠ 还有一处对你尤其重要：<b><code>n</code> 进了根号</b>，不是 <code>log</code>。</b> <span class='k'>臂数从 100 变成 10000，界就乘 10</span>；<b>而 L07/L10 的线性结构下出现的是 <code>d</code> 而不是 <code>n</code>（臂数只进 <code>log</code>）</b>。<span class='w'>⇒ 这是「放弃分布假设」真正的账单：<b>你同时放弃了利用结构的能力</b>。</span>", "<b>下半页开始证定理，前三个不等号都在处理「<code>q</code> 和 <code>p</code> 不是同一个分布」这件事。</b> <span class='k'>① 把 <code>q</code> 换成 <code>p</code>：<code>Σ_i q_{t,i}ℓ_{t,i} = (1−γ)Σ_i p_{t,i}ℓ_{t,i} + γΣ_iλ_iℓ_{t,i}</code>，而后一项 <code>≤ γ</code>（因 <code>|ℓ| ≤ 1</code>），T 轮共 <code>γT</code></span>。", "<b>② 第二个 <code>γT</code> 来自把 <code>(1−γ)</code> 从 <code>ℓ_{t,i}</code> 那一项里也提出来</b>：<span class='w'><code>−ℓ_{t,i} = −(1−γ)ℓ_{t,i} − γℓ_{t,i}</code>，后一项同样 <code>≤ γ</code></span>。<b>⇒ 两处各贡献 <code>γT</code>，合起来就是定理里那个 <code>2γT</code>。</b>", "<b>③ 第三步把 <code>ℓ</code> 换成 <code>ℓ̂</code>，而这是<b>等号</b>不是不等号。</b> <span class='k'>因为 <code>ℓ̂</code> 无偏（p2），取期望后两者相同</span>。<b>⇒ 换成 <code>ℓ̂</code> 之后才能接上指数权重的标准分析，因为算法真正用来更新的是 <code>ℓ̂</code>。</b>", "<b>最后两行开始势函数论证，<code>W_t = Σ_i w_{t,i}</code> 是全部权重之和。</b> <span class='w'>下界那一步 <code>log(W_{T+1}/W_1) ≥ −log(n) + log(w_{T+1,i})</code> 用的是 <code>W_{T+1} ≥ w_{T+1,i}</code>（单项不超过总和）与 <code>W_1 = n</code></span>。<b>⇒ 对<b>任意</b> <code>i</code> 都成立，所以可以挑事后最好的那条——这正是遗憾定义里那个 <code>max_i</code> 的来处。</b>"], "eq": "① 把期望项换成 p3 的界 —— 两个 (1−γ) 正好抵消：\n   (1−γ)·η·[ nT/(1−γ) ] = **ηnT**\n   ⇒ 三项变成 2γT + log(n)/η + ηnT，**γ 只剩在第一项**\n\n② 用掉约束 η ≤ γ/n：\n   γ 只出现在 2γT 这个**递增**项里 ⇒ γ 取尽量小 ⇒ **取等号 γ = ηn**\n   （约束取等号不是凑巧，是因为那个参数在目标里单调）\n\n   ⇒ 2γT = 2ηnT，加 ηnT ⇒ **3ηnT + log(n)/η**，只剩一个参数\n\n③ 标准配平：aη + b/η 在 η = sqrt(b/a) 处取极小，极小值 = 2·sqrt(ab)\n   a = 3nT，b = log n\n   ⇒ **η_* = sqrt( log(n) / (3nT) )**\n   ⇒ 值 = 2·sqrt(3nT·log n) = **sqrt( 12·n·T·log(n) )**     （2√x = √(4x)，4×3=12）\n\n结果的形状：**sqrt(nT log n)**\n   与随机设定的 UCB（sqrt(nT log T)）**同阶**\n   ⇒ 完全不假设分布，代价只是 log n 换 log T\n\n⚠ 但别说「对抗免费」，差别在别处：\n   这是**期望**遗憾，而且对手**健忘**\n   随机设定下还能谈高概率界、问题相关界（Σ Δ^{−1} log T，差距大时远小于 sqrt(nT)）\n   ⇒ EXP3 的界是**最坏情况**的，臂间差距再大也不变好\n\n⚠⚠ **n 进了根号**，不是 log\n   臂数 100 → 10000，界乘 10\n   而 L07/L10 线性结构下出现的是 **d** 而非 n（臂数只进 log）\n   ⇒ 放弃分布假设真正的账单：**同时放弃了利用结构的能力**\n\n定理证明（前三步都在处理「q 与 p 不是同一个分布」）：\n   ① Σ_i q_{t,i}ℓ_{t,i} = (1−γ)Σ_i p_{t,i}ℓ_{t,i} + γΣ_i λ_i ℓ_{t,i}\n      后一项 ≤ γ（因 |ℓ| ≤ 1）⇒ T 轮共 **γT**\n   ② −ℓ_{t,i} = −(1−γ)ℓ_{t,i} − γℓ_{t,i}，后一项同样 ≤ γ ⇒ 再 **γT**\n      ⇒ 两处合起来正是定理里的 **2γT**\n   ③ ℓ → ℓ̂ 是**等号**不是不等号（ℓ̂ 无偏，取期望后相同）\n      换成 ℓ̂ 才能接上指数权重的标准分析（算法真正用来更新的是 ℓ̂）\n\n势函数：W_t = Σ_{i=1}^n w_{t,i}\n   **下界**：log(W_{T+1}/W_1) ≥ −log(n) + log(w_{T+1,i})\n     用 W_{T+1} ≥ w_{T+1,i}（单项 ≤ 总和）与 W_1 = n\n     ⇒ 对**任意** i 成立 ⇒ 可以挑事后最好的那条 = 遗憾定义里 max_i 的来处", "tbl": {"head": ["", "EXP3（本讲，对抗）", "UCB（随机，L05 那套）", "线性 bandit（L07/L10）"], "rows": [["分布假设", "<b>完全没有</b>", "<span class='w'>独立同分布</span>", "<span class='w'>独立同分布 + 线性</span>"], ["遗憾界", "<b>√(nT log n)</b>", "<b>√(nT log T)</b>", "<b>d√T·log T</b>"], ["臂数怎么进", "<b>√n</b>", "<b>√n</b>", "<b>只进 log</b>（维数 d 主导）"], ["差距大时会变好吗", "<span class='w'>不会（最坏情况）</span>", "<b>会（Σ Δ⁻¹log T）</b>", "<b>会</b>"], ["保证的类型", "<span class='w'>期望 · 健忘对手</span>", "<b>高概率</b>", "<b>高概率</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页给了你一张可以直接写进论文的对照表，而它回答的是「为什么不用对抗算法」。</b><br><span class='k'>EXP3：<code>√(nT log n)</code>，无任何分布假设；UCB：<code>√(nT log T)</code>，要独立同分布；线性：<code>d√T log T</code>，要独立同分布 + 线性</span>。<b>⇒ 对你最致命的是中间那一列：<b><code>n</code> 进根号</b></b>。<span class='w'>你有 <code>2^H</code> 个配置，<code>√(2^H)</code> 是彻底不可用的</span>；<b>而线性结构把它换成 <code>d = H×k</code>（几十）。</b><br><b>⇒ 结论很干脆：<b>你必须依赖线性假设，这不是偷懒而是唯一可行的路</b>。</b> <span class='k'>而这反过来抬高了那个可加性检验实验的分量——它不只是「做得更好」，它是整个方法能不能成立的前提</span>。<b>这句话值得原样写进论文的方法一节。</b><br><b>但这一页还给了你一个<b>退路</b>，而有退路的论文比没有的可信。</b> <span class='w'>如果可加性检验的残差偏大，你不必推倒重来：可以在「结构化（线性）」与「无结构（对抗）」之间取一个中间物</span>——<b>比如在<b>节点</b>层面假设线性（<code>d</code> 小），而对<b>节点内</b>的档位不作假设</b>。<span class='k'>⇒ 这样界的形状会是 <code>√(d·k·T·log(…))</code> 之类，介于两者之间。</span><br><b>⚠ 最后一条是写作上的提醒：<b>别把「同阶」说成「一样好」</b>。</b> <span class='w'>EXP3 与 UCB 都是 <code>√(nT·log)</code>，但 EXP3 给的是<b>期望</b>遗憾、对手<b>健忘</b>、而且<b>差距再大也不变好</b></span>；<b>你的问题恰恰是「候选之间差距可能很大」（好配置与坏配置的 G 差得远），那正是随机设定下问题相关界 <code>Σ Δ^{-2}</code> 能大幅获益、而对抗界完全无动于衷的情形。</b><span class='k'>⇒ 你的设定明确站在随机那一边，这一点要说明白。</span>", "ref": "本讲 p4（逐行核对）· p3 · L16 p9（Σ Δ^{-2}）· L10 p5 · L07 p5 · 简报 §4c §4d（已核）"}},
{"r": [5, 5], "t": "势函数：把 log(W_{T+1}/W_1) 夹在两边", "star": 2, "quote": "<em>= −log(n) + log( Π<sub>t=1</sub><sup>T</sup> exp(−η ℓ̂<sub>t,i</sub>) ) = <b>−log(n) − η Σ<sub>t=1</sub><sup>T</sup> ℓ̂<sub>t,i</sub></b></em><br><em>log(W<sub>T+1</sub>/W<sub>1</sub>) = Σ<sub>t=1</sub><sup>T</sup> log(W<sub>t+1</sub>/W<sub>t</sub>) = Σ<sub>t</sub> log( Σ<sub>i</sub> w<sub>t,i</sub>exp(−ηℓ̂<sub>t,i</sub>)/W<sub>t</sub> ) = <b>Σ<sub>t</sub> log( Σ<sub>i</sub> p<sub>t,i</sub>exp(−η ℓ̂<sub>t,i</sub>) )</b></em><br>〔蓝字〕<em>for x ≤ 1 &nbsp; <b>exp(x) ≤ 1 + x + x²</b></em><br><em>≤ Σ<sub>t</sub> log( 1 − η Σ<sub>i</sub> p<sub>t,i</sub>ℓ̂<sub>t,i</sub> + η² Σ<sub>i</sub> p<sub>t,i</sub>ℓ̂²<sub>t,i</sub> )</em><br>〔红字〕<em>∀x, &nbsp; 1 + x ≤ e<sup>x</sup> &nbsp;⟹&nbsp; <b>x ≥ log(1+x)</b></em><br><em>≤ <b>−η Σ<sub>t</sub>Σ<sub>i</sub> p<sub>t,i</sub>ℓ̂<sub>t,i</sub> + η² Σ<sub>t</sub>Σ<sub>i</sub> p<sub>t,i</sub>ℓ̂²<sub>t,i</sub></b></em>", "one": "<b>同一个量算两次：从下面看它至少有多大（跟任一条固定臂比），从上面看它最多有多大（跟算法自己的加权平均比）。两边一夹，遗憾就出来了。</b>", "pts": ["<b>这是「势函数论证」的标准套路，而它的全部内容就是<b>把同一个量 <code>log(W_{T+1}/W_1)</code> 估两次</b>。</b> <span class='k'>一次给下界（用某条固定臂 <code>i</code>），一次给上界（用算法每轮的实际表现）</span>。<b>⇒ 下界里出现「固定臂的累计损失」，上界里出现「算法的累计损失」，一夹就是遗憾。</b>", "<b>下界这一半已经在 p4 末尾起了头，这里只是把 <code>w_{T+1,i}</code> 展开。</b> <span class='w'><code>w_{T+1,i} = w_{1,i}·Π_{t}exp(−ηℓ̂_{t,i}) = Π_t exp(−ηℓ̂_{t,i})</code>（初始权重取 1）</span>，<b>取 log 把连乘变连加：<code>−ηΣ_tℓ̂_{t,i}</code></b>。<span class='k'>⇒ 下界 <code>= −log(n) − ηΣ_tℓ̂_{t,i}</code>，<b>而这里的 <code>i</code> 可以是任意一条臂</b>。</span>", "<b>上界这一半先做一个望远镜求和：<code>log(W_{T+1}/W_1) = Σ_t log(W_{t+1}/W_t)</code>。</b> <span class='w'>连乘的比值取 log 之后中间项全消掉</span>——<b>这样就把「整程」拆成了「每一轮」。</b>", "<b>然后是最关键的一步代换，而它解释了为什么要做归一化。</b> <span class='k'><code>W_{t+1}/W_t = Σ_i w_{t,i}exp(−ηℓ̂_{t,i})/W_t</code>，而 <code>w_{t,i}/W_t</code> 正是 <code>p_{t,i}</code></span>！<b>⇒ 于是 <code>= Σ_t log(Σ_i p_{t,i}exp(−ηℓ̂_{t,i}))</code>——<b>权重的比值变成了按算法自己的分布取期望</b>。</b><span class='w'>这正是势函数法好用的原因：它自动把算法的行为装进式子里。</span>", "<b>接下来两个初等不等式，各管一边，值得分清楚。</b> <span class='k'>蓝字 <code>exp(x) ≤ 1+x+x²</code>（<b>仅对 <code>x ≤ 1</code></b>）——用来把指数换成二次多项式</span>；<b>⚠ 这就是 p3 那个条件 <code>−ηℓ̂_{t,i} ≤ 1</code> 的用处，没有它这一步不成立。</b>", "<b>代入后得 <code>Σ_t log(1 − ηΣ_i p_{t,i}ℓ̂_{t,i} + η²Σ_i p_{t,i}ℓ̂²_{t,i})</code>。</b> <span class='w'>一次项带 <code>−η</code>，二次项带 <code>+η²</code>——<b>前者是「算法这一轮的加权平均损失」，后者是「二阶矩」</b></span>。<span class='k'>⇒ 定理里那两项的来历就在这里。</span>", "<b>红字那个 <code>1+x ≤ e^x ⟹ log(1+x) ≤ x</code> 用来把 log 脱掉。</b> <span class='w'>它对<b>所有</b> <code>x</code> 成立（无需条件），是这一类证明里最常用的一个</span>；<b>⇒ 于是 <code>log(1 + 那一堆) ≤ 那一堆</b>，得到上界 <code>−ηΣΣp ℓ̂ + η²ΣΣp ℓ̂²</code>。</b>", "<b>把上下界并起来，整理一下，定理方括号里那一项就出来了。</b> <span class='k'><code>−log n − ηΣ_tℓ̂_{t,i} ≤ −ηΣ_tΣ_j p_{t,j}ℓ̂_{t,j} + η²Σ_tΣ_j p_{t,j}ℓ̂²_{t,j}</code></span>；<b>两边除以 <code>η</code> 并移项：<code>Σ_tΣ_j p_{t,j}ℓ̂_{t,j} − Σ_tℓ̂_{t,i} ≤ log(n)/η + ηΣ_tΣ_j p_{t,j}ℓ̂²_{t,j}</code></b>。<span class='w'>⇒ 左边正是「算法 − 固定臂 i」，右边正是定理的后两项。</span>", "<b>回头看，<code>log(n)/η</code> 那一项的来历现在很清楚了：它来自<b>初始化</b>。</b> <span class='k'><code>W_1 = n</code>（n 条臂各给权重 1），而下界里那个 <code>−log(n)</code> 就是它</span>。<b>⇒ 换句话说，<code>log n</code> 是「一开始对 n 条臂一视同仁」所付的一次性入场费，与 <code>T</code> 无关。</b><span class='w'>这也解释了为什么臂数在这一项里只进 log。</span>", "<b>⚠ 而那个 <code>√n</code>（p4 的真正瓶颈）<b>不</b>来自这里，它来自方差项。</b> <span class='k'>方差项 <code>E[ΣΣpℓ̂²] ≤ nT/(1−γ)</code> 里的 <code>n</code> 是重要性加权的代价</span>——<b>⇒ 两个 <code>n</code> 来历完全不同：<code>log n</code> 是初始化的，<code>n</code> 是 bandit 反馈的。记混了就会错判该优化哪一项。</b>"], "eq": "**势函数论证** = 把同一个量 log(W_{T+1}/W_1) 估两次\n   一次给**下界**（用某条固定臂 i）→ 出现「固定臂的累计损失」\n   一次给**上界**（用算法每轮的实际表现）→ 出现「算法的累计损失」\n   一夹 = 遗憾\n\n**下界**（p4 末尾起的头，这里展开）：\n   w_{T+1,i} = w_{1,i}·Π_t exp(−η ℓ̂_{t,i}) = Π_t exp(−η ℓ̂_{t,i})     （初始权重取 1）\n   取 log，连乘变连加：\n   log(W_{T+1}/W_1) ≥ −log(n) + log(w_{T+1,i}) = **−log(n) − η Σ_t ℓ̂_{t,i}**\n   ⚠ 这里的 i 可以是**任意**一条臂 ⇒ 可挑事后最好的\n\n**上界**：\n   ① 望远镜求和：log(W_{T+1}/W_1) = Σ_t log(W_{t+1}/W_t)\n      连乘比值取 log，中间项全消 ⇒ 「整程」拆成「每一轮」\n\n   ② 关键代换（解释了为什么要归一化）：\n      W_{t+1}/W_t = Σ_i w_{t,i}exp(−ηℓ̂_{t,i}) / W_t，而 **w_{t,i}/W_t = p_{t,i}**\n      ⇒ = Σ_t log( Σ_i **p_{t,i}** exp(−η ℓ̂_{t,i}) )\n      **权重的比值变成按算法自己的分布取期望** —— 势函数法好用的原因\n\n   ③ 蓝字：**exp(x) ≤ 1 + x + x²  仅对 x ≤ 1**\n      ⚠ 这就是 p3 那个条件 −η ℓ̂_{t,i} ≤ 1 的用处，没有它这步不成立\n      ⇒ ≤ Σ_t log( 1 − η Σ_i p_{t,i}ℓ̂_{t,i} + η² Σ_i p_{t,i}ℓ̂²_{t,i} )\n        一次项带 −η = 算法这轮的加权平均损失；二次项带 +η² = 二阶矩\n\n   ④ 红字：**∀x, 1+x ≤ e^x ⟹ log(1+x) ≤ x**（无需条件）\n      ⇒ ≤ **−η Σ_tΣ_i p_{t,i}ℓ̂_{t,i} + η² Σ_tΣ_i p_{t,i}ℓ̂²_{t,i}**\n\n**上下界一夹**：\n   −log n − η Σ_t ℓ̂_{t,i} ≤ −η Σ_tΣ_j p_{t,j}ℓ̂_{t,j} + η² Σ_tΣ_j p_{t,j}ℓ̂²_{t,j}\n   除以 η 并移项：\n   Σ_tΣ_j p_{t,j}ℓ̂_{t,j} − Σ_t ℓ̂_{t,i} ≤ **log(n)/η + η Σ_tΣ_j p_{t,j}ℓ̂²_{t,j}**\n   左边 = 「算法 − 固定臂 i」，右边 = 定理的后两项 ✓\n\n⇒ **log(n)/η 的来历是初始化**：W_1 = n（n 条臂各给权重 1）\n   log n = 「一开始对 n 条臂一视同仁」的一次性入场费，**与 T 无关**\n   ⇒ 所以臂数在这一项里只进 log\n\n⚠ 而 p4 真正的瓶颈 sqrt(n) **不**来自这里，来自**方差项** nT/(1−γ)\n   两个 n 来历完全不同：**log n 是初始化的，n 是 bandit 反馈的**\n   记混了就会错判该优化哪一项", "res": {"tag": "推断", "v": "<b>这一页的方法本身比它证的那条界更值得你带走：<b>「同一个量估两次」是写 bound 最通用的一招</b>。</b><br><span class='k'>你简报里的验收标准有一条是「写 bound」，而势函数法给了你一个可套的模板：造一个标量势 <code>Φ_t</code>，证明它<b>每一步变化不大</b>（上界），同时证明它<b>终值与某个基准挂钩</b>（下界），两边一夹</span>。<b>⇒ L10 的椭圆势引理是同一个套路（那里的势是 <code>log|V_t|</code>），这一页的势是 <code>log W_t</code>。</b><span class='w'>两讲放在一起看，这个模板就立起来了。</span><br><b>而对你的问题，一个自然的势是<b><code>log(已存活候选的加权数量)</code></b>。</b> <span class='k'>每一轮测量之后，坏候选的权重按 <code>exp(−η·Ĝ差)</code> 衰减；证「每轮至少衰减多少」给上界，证「最优候选的权重不会掉太多」给下界</span>——<b>⇒ 夹出来的就是「需要多少轮才能把候选集压到 1」。</b><span class='w'>这与逐次淘汰是同一件事的两种写法，而势函数版更容易给出<b>连续</b>的（而非分轮的）保证。</span><br><b>⚠ 但要注意最后那条提醒对你同样成立：<b>搞清楚每个 <code>n</code> 从哪来</b>。</b> <span class='k'>这一页有两个 <code>n</code>——<code>log n</code> 来自初始化（对所有候选一视同仁），<code>n</code> 来自 bandit 反馈（每轮只能测一个）</span>。<b>⇒ 映射到你这里：<b><code>log|𝒳|</code> 是「候选集有多大」的代价，而 <code>|𝒳|</code>（或 <code>d</code>）是「每次只能测一个配置」的代价</b></b>。<span class='w'>前者便宜、后者贵，而线性结构能把后者从 <code>|𝒳|</code> 降到 <code>d</code>、却<b>不</b>能降低前者。</span><b>这个区分在你报复杂度时必须说清，否则会被追问。</b>", "ref": "本讲 p5（逐行核对）· p4 · L10 p4（椭圆势引理，同一套路）· L07 p5 · 简报 §1 §4c（已核）"}, "link": {"t": "你学过的对应：本课 L10 精读（椭圆势引理——同样是「造一个势、证它涨不快、再夹出结论」，那里的势是 log|V_t|）", "href": "L10-精读.html"}}
];

var TH = {"title": "L14 接上课题的哪一段：离策评估的方差公式，和「分布无关」这四个字的价码", "arc": "<b>这一讲在课里是个异类，而正因为是异类才值得读：<b>它是本门课唯一一个不假设分布的设定</b>。</b><br><br><span class='k'>前面每一讲——L05 的集中不等式、L07 的最优设计、L09 的纯探索、L10/L12 的线性 bandit——都建立在「每条臂有一个不变的均值」上</span>。<b>对抗设定把这条整个拿掉：损失可以是任意的，只要求对手在开局前定死（<b>健忘对手</b>）</b>。<span class='w'>而你简报里的验收标准恰好有一条叫 <b>distribution-free guarantees</b>，所以这一讲给了你一个定位自己的坐标系。</span><br><br><b>但先把结论说在前面：<b>你不该用对抗算法，而这一讲正好给出了理由</b>。</b><br><span class='k'>EXP3 的界是 <code>√(12 nT log n)</code>——<b><code>n</code> 进根号</b></span>。<b>你有 <code>2^H</code> 个配置，<code>√(2^H)</code> 彻底不可用</b>；<span class='w'>而线性结构下（L07/L10）出现的是 <code>d = H×k</code>，只有几十</span>。<b>⇒ 这就是「放弃分布假设」的真实账单：<b>你同时放弃了利用结构的能力</b>。</b><br><b>⇒ 可以原样写进方法一节的一句话：<b>我们必须依赖线性假设，这不是为了方便，而是因为无结构的下界使问题不可解</b>。</b><span class='k'>而这反过来把那个可加性检验实验的分量抬高了——它不是「锦上添花」，是方法能否成立的前提。</span><br><br><b>真正要带走的是 <b>p2</b>，而它和对抗设定没有关系：<b>重要性加权就是离策评估</b>（IPS）。</b><br><b><code>ℓ̂_{t,i} = (1{I_t=i}/P_{t,i})·ℓ_{t,i}</code>，无偏；<code>Var = ℓ²·(1/P − 1)</code>。</b><br><span class='w'>你一定会用到它：用某个采集策略跑过的数据，去估计<b>另一个</b>配置（或另一个 λ 下的最优配置）的 <code>G</code>，而不重新花钱跑</span>。<b>而那个方差公式是你必须先知道的代价</b>：<span class='k'><b>某个配置在你的数据里只占 1%，对它的离策估计方差就要乘 99</b></span>。<b>⇒ 这解释了一个你很可能会撞上的现象：重用历史数据评估冷门配置时估计值剧烈跳动——那不是 bug，是 <code>1/P</code>。</b><br><br><b>由此有三件现在就能做的事。</b><br><b>① <b>在采集脚本里记录倾向性 <code>P</code></b></b>——<span class='w'>离策估计需要这个数，而它必须在采集<b>当时</b>记下，事后补不出来</span>。<b>⚠ 漏了就整批数据作废，这是今天就该去加的一行。</b><br><b>② <b>给采集策略一个概率下界</b>，就是 EXP3 那个 <code>q_t = (1−γ)p_t + γλ</code></b>。<span class='k'>你的筛选会越来越集中，而一旦某个配置的采样概率趋于 0，你就<b>永久</b>失去了用这批数据回头评估它的能力</span>。<b>⇒ 混合项是在为「以后可能想回头看」买保险，成本只有 <code>γ</code> 的预算。</b><br><b>③ <b><code>λ</code> 可以取 L07 的 G-最优解</b></b>——<span class='w'>算法<b>不</b>要求 <code>λ</code> 均匀（讲义写明 <code>λ ∈ Δ_n</code> 是输入），均匀只是多臂特例</span>。<b>⇒ 既保住概率下界，又让这部分探索预算花在信息量最大的方向上，而且免费（<code>λ</code> 不依赖测量结果）。</b><span class='k'>⚠ 但这个组合没有现成定理，见下面的坑。</span><br><br><b>最后，<b>p5 的势函数论证</b>是写 bound 的通用模板，和 L10 的椭圆势引理是同一招</b>：<span class='w'>造一个标量势，证它<b>每步涨不快</b>（上界），再证它<b>终值与某个基准挂钩</b>（下界），两边一夹</span>。<b>L10 的势是 <code>log|V_t|</code>，这一讲的势是 <code>log W_t</code>。</b><span class='k'>⇒ 两讲并读，这个模板就立起来了，而你那条「写 bound」的验收标准正需要一个可套的模板。</span>", "pitfalls": [{"v": "<b>把 EXP3 的「分布无关」当成免费的稳健性。</b> <span class='k'>它确实不假设分布，但代价在 <code>n</code> 上：<code>√(nT log n)</code>，<b>臂数进根号</b></span>。<b>⚠ 你有 <code>2^H</code> 个配置，这条路是死的</b>；<span class='w'>线性结构把 <code>n</code> 换成 <code>d = H×k</code>，这才是你唯一能走的路</span>。<b>⇒ 「对抗稳健」与「利用结构」在这里是互斥的，别指望两头都要。</b>", "tag": "已核", "ref": "本讲 p4（逐行核对）· L10 p5 · L07 p5"}, {"v": "<b>把「同阶」说成「一样好」。</b> <span class='w'>EXP3 的 <code>√(nT log n)</code> 与 UCB 的 <code>√(nT log T)</code> 同阶，但三处不同</span>：<b>① EXP3 给的是<b>期望</b>遗憾（不是高概率）；② 对手必须<b>健忘</b>；③ <b>臂间差距再大它也不变好</b></b>。<span class='k'>⚠ 第三条对你最要紧——你的好配置与坏配置的 <code>G</code> 差得远，那正是随机设定下 <code>Σ Δ^{-2}</code> 能大幅获益、而对抗界完全无动于衷的情形</span>。<b>⇒ 你的问题明确站在随机那一边，要说明白。</b>", "tag": "推断", "ref": "本讲 p4 · L16 p9（Σ Δ^{-2}）· 简报 §4c"}, {"v": "<b>做离策评估却没记下倾向性。</b> ⚠ <span class='k'><code>ℓ̂ = (1{选中}/P)·ℓ</code> 里的 <code>P</code> 必须在采集<b>当时</b>记录</span>——<b>事后无论如何补不出来，因为它依赖当时的策略状态</b>。<span class='w'>⇒ 这是实验脚本层面的硬要求，漏了整批数据就只能当「在线」数据用，不能回头评估别的配置</span>。<b>现在就去加这一列。</b>", "tag": "推断", "ref": "本讲 p2（逐行核对）· 简报 §4b §4e"}, {"v": "<b>让采样概率自由趋于 0。</b> <span class='k'>方差是 <code>ℓ²(1/P − 1)</code>，<code>P → 0</code> 时趋于无穷；而蓝框那个 <code>P > 0</code> 只是「有定义」，远不够</span>。<b>必须有<b>下界</b>，这就是 <code>γλ</code> 混合项的全部用处（<code>q_{t,i} ≥ γ/n</code> ⇒ 方差被 <code>n/γ</code> 卡住）</b>。<span class='w'>⚠ 你的逐次淘汰天然会让存活配置的概率集中，所以这条要主动加，不会自己出现。</span>", "tag": "已核", "ref": "本讲 p2（紫框与蓝框）· p3（算法框）"}, {"v": "<b>把 <code>λ</code> 换成 G-最优解却照抄本讲的界。</b> ⚠ <span class='k'>本讲只在 <code>λ</code> <b>均匀</b>时把方差项算到了 <code>nT</code>（靠 <code>q_{t,i} ≥ γ/n</code>）</span>；<b>换成 G-最优的 <code>λ</code>，那个下界对 <code>λ_i</code> 小的臂会差很多，<code>nT</code> 这个结论不再成立</b>。<span class='w'>⇒ 要么自己重算那个放缩，要么取「均匀与 G-最优各半」的折中（保住 <code>γ/(2n)</code> 的下界）</span>。<b>写进论文前这一步必须自己推一遍，不能只说「我们用了 G-最优的 λ」。</b>", "tag": "推断", "ref": "本讲 p3（方差项放缩）· L07 p4 p5"}, {"v": "<b>把两个 <code>n</code> 的来历搞混。</b> <span class='k'><code>log(n)/η</code> 来自<b>初始化</b>（<code>W_1 = n</code>，对 n 条臂一视同仁的一次性入场费，<b>与 T 无关</b>）；而真正的瓶颈 <code>√n</code> 来自<b>方差项</b> <code>nT/(1−γ)</code>，是 bandit 反馈的代价</span>。<b>⇒ 映射到你这里：<code>log|𝒳|</code> 是「候选集有多大」的代价（便宜），<code>|𝒳|</code> 或 <code>d</code> 是「每次只能测一个」的代价（贵）</b>。<span class='w'>⚠ 线性结构能把后者从 <code>|𝒳|</code> 降到 <code>d</code>，却<b>不</b>能降低前者。</span><b>报复杂度时这个区分必须说清，否则会被追问。</b>", "tag": "推断", "ref": "本讲 p5 · p4 · p3"}], "ammo": [{"q": "你的保证依赖什么分布假设？如果现实不满足怎么办？", "a": "<b>我们可以把自己精确定位在一个三档的谱上。</b> <span class='k'>① <b>完全无分布</b>（对抗 / EXP3）：<code>√(nT log n)</code>，什么都不假设；② <b>独立同分布</b>（UCB 那套）：<code>√(nT log T)</code>，可谈高概率与问题相关界；③ <b>独立同分布 + 线性</b>（我们）：<code>d</code> 取代 <code>n</code>，配置数只进 <code>log</code></span>。<br><b>我们取第 ③ 档，而理由是可以量化的：第 ① 档的 <code>√n</code> 在我们这里是 <code>√(2^H)</code>，不可用。</b> <span class='w'>所以线性假设不是为了方便，是因为无结构的情形本身不可解</span>。<b>⇒ 我们用一个专门的实验检验它（用单节点偏离的数据预测双节点偏离的真值），并报告残差<b>分布</b>而不只是均值。</b><br><b>而如果残差偏大，我们有退路而不必推倒重来</b>：<span class='k'>在<b>节点</b>层面保留线性、对<b>节点内</b>的档位不作假设，界的形状会介于两者之间</span>。", "tag": "推断", "ref": "本讲 p1 p4（逐行核对）· L10 p5 · L07 p5 · 简报 §1 §4d"}, {"q": "你怎么重用已有的评估数据去估计一个没专门测过的配置？误差有多大？", "a": "<b>用重要性加权（IPS），而它的代价有闭式。</b> <span class='k'><code>Ĝ = (1/N)Σ (1{选中了它}/P)·G_观测</code>，<b>无偏</b>；方差 <code>= G²·(1/P − 1)</code></span>。<b>⇒ 一句话：<b>某个配置在我们的采集数据里占 1%，对它的估计方差就要乘 99</b></b>。<br><b>所以我们做了三件事</b>：<span class='w'>① <b>采集时就记录倾向性 <code>P</code></b>（事后补不出来）；② <b>给采集策略一个概率下界</b>——按 EXP3 的做法混入 <code>γλ</code>，保证 <code>P ≥ γ/n</code>，于是方差被 <code>n/γ</code> 卡住而不是无界；③ <b>报方差用解析式 <code>G²(1/P−1)</code> 而不是经验方差</b></span>——<b>因为冷门配置样本少，经验方差本身估不准，而且会<b>系统性偏小</b>（没采到那条尾巴）。</b><br><b>⇒ 这三条合起来，我们可以对任何配置给出一个诚实的区间，包括几乎没专门测过的。</b>", "tag": "已核", "ref": "本讲 p2（逐行核对）· p3 · 简报 §4b §4e"}, {"q": "你这个 bound 是怎么证出来的？用的什么技术？", "a": "<b>势函数论证，这是写这类界最通用的一招。</b> <span class='k'>套路是：造一个标量势 <code>Φ_t</code>，然后把<b>同一个量估两次</b>——证它<b>每步涨不快</b>（上界），再证它<b>终值与某个基准挂钩</b>（下界），两边一夹就出结论</span>。<br><b>这门课里出现了两个实例，形式完全一样</b>：<span class='w'>EXP3 的势是 <code>log W_t</code>（权重总和），上界来自 <code>exp(x) ≤ 1+x+x²</code>、下界来自「单项不超过总和」；LinUCB 的势是 <code>log|V_t|</code>（信息矩阵的行列式），上界来自 AM–GM、下界来自秩一更新的递推</span>。<br><b>⇒ 我们的证明用的是同一个模板：势取「存活候选的加权数量」，每轮测量后坏候选按 <code>exp(−η·ΔĜ)</code> 衰减；证「每轮至少衰减多少」给上界，证「最优候选不会掉太多」给下界，夹出「需要多少轮能把候选集压到 1」。</b><span class='k'>这与逐次淘汰是同一件事的两种写法，而势函数版更容易给出连续（而非分轮）的保证。</span>", "tag": "推断", "ref": "本讲 p5（逐行核对）· L10 p4（椭圆势引理）· 简报 §1"}, {"q": "你为什么不用一个对抗算法来应对 LLM 输出的漂移？", "a": "<b>因为代价和收益不匹配，而且我们有更对症的做法。</b> <span class='k'>对抗算法（EXP3）确实对漂移免疫——它什么分布都不假设。但它的界是 <code>√(nT log n)</code>，<b>配置数进根号</b></span>；<b>我们有 <code>2^H</code> 个配置，这条路在数量级上就不成立。</b><br><b>而漂移这个问题本身有更便宜的处理方式</b>：<span class='w'>① <b>固定模型版本与解码参数</b>，把漂移源头锁住（这是工程问题，不是统计问题）；② <b>在同一批 query 上做配对比较</b>，漂移对所有配置是共同的，差值里会抵消掉大部分；③ 必要时<b>周期性重标定</b></span>。<br><b>⇒ 我们在论文里把这一点写成稳健性讨论：主结果在独立同分布下给紧的界（利用线性结构），同时指出在完全对抗下仍有 <code>√(nT log n)</code> 的退化保证。</b><span class='k'>两段式比只报一个界可信得多。</span><br><b>⚠ 另外值得说明：我们的 benchmark 是<b>固定</b>的 query 集合，在实验开始前就存在，不会因为我们测了什么而改变——这正好满足「健忘对手」的定义。</b>", "tag": "推断", "ref": "本讲 p1（健忘对手）· p4 · 简报 §1 §4d"}], "papers": [{"t": "Auer, Cesa-Bianchi, Freund &amp; Schapire — The Nonstochastic Multiarmed Bandit Problem", "id": "⚠ <b>讲义未点名</b>，但 EXP3 这个名字与这条界就出自这篇", "why": "<b>对抗 bandit 的奠基论文，也是 <code>√(nT log n)</code> 这条界的标准出处。</b> <span class='k'>讲义给的是 EXP3(γ) 的一个教学版本（带一般的 <code>λ</code>），原文还给了下界 <code>Ω(√(nT))</code>——说明这条界在 <code>n</code> 和 <code>T</code> 上都是紧的（只差 <code>√(log n)</code>）</span>。<b>⇒ 你要引「无结构情形下配置数必然进根号」这句话时，引它的<b>下界</b>比引上界有力得多——那正是你论证「必须依赖线性假设」的依据。</b>"}, {"t": "Lattimore &amp; Szepesvári — Bandit Algorithms，对抗 bandit 那几章", "id": "任务清单 条目 1 已把这本列进来", "why": "<b>EXP3 与势函数论证在这本书里有干净、可引用的版本</b>（<span class='w'>讲义是手写板书，不适合当引文</span>）。<span class='k'>书里还把「健忘对手 vs 适应性对手」的区别讲清楚了，而那一点你在论文里要用到——你的 benchmark 固定，正好落在健忘那一侧。</span>"}, {"t": "Horvitz &amp; Thompson 估计量 / 逆倾向加权（IPS）", "id": "本讲 p2 的 <code>ℓ̂ = 1{I_t=i}/P_{t,i}·ℓ_{t,i}</code> 就是它", "why": "<b>这个估计量比 bandit 早几十年，出自抽样调查，而你用它时该引那条线而不是 bandit 文献。</b> <span class='w'>方差公式 <code>ℓ²(1/P − 1)</code> 也是那边的经典结果</span>。<span class='k'>⇒ 顺着查下去还有两个你用得上的改进：<b>加权 IPS</b>（有偏但方差有界）与 <b>doubly robust</b>（结合一个回归模型，方差更小）</b>。<b>⚠ 尤其是 doubly robust——你<b>已经有</b>一个线性模型了（<code>G(x) = xᵀθ</code>），把它和 IPS 结合几乎是免费的，很可能显著压低冷门配置的估计方差。这是一条值得试的具体改进。</b>"}, {"t": "CS234 L05（离策评估与重要性采样）", "id": "与本讲 p2 是同一个式子的两种场合", "why": "<b>那里是「用行为策略的轨迹估目标策略的值」，这里是「用抽样到的那条臂估所有臂」——<b>同一个估计量</b>。</b> <span class='k'>两处并读的好处是看清它的两张面孔：在 RL 里它因为轨迹长度导致 <code>Π ρ_t</code> 连乘而方差爆炸；在 bandit 里只有一步，方差是干净的 <code>1/P − 1</code></span>。<b>⇒ 你的场景更接近后者（单步决策），所以不必继承 RL 那边关于「长轨迹 IS 不可用」的悲观结论。</b>"}, {"t": "CSE 541 L10（椭圆势引理）", "id": "与本讲 p5 是同一个证明模板", "why": "<b>两讲都在用势函数论证，而把它们并读，模板就从「一个技巧」变成了「一套方法」。</b> <span class='w'>L14 的势是 <code>log W_t</code>（权重总和），L10 的势是 <code>log|V_t|</code>（信息矩阵行列式）；两边都是「证它每步涨不快，再夹出结论」</span>。<b>⇒ 你那条「写 bound」的验收标准正需要一个可套的模板，而这两讲给的是同一个。</b>"}]};

      pnum=document.getElementById("pnum"), strip=document.getElementById("strip"),
      right=document.getElementById("right");
  var cur=0, map={}, cells=[];
  /* 科研格出处档位 → 类名。三档与 research/00-BRIEFING 的原始标注一致。 */
  var RESC={"已核":"t1","推断":"t2","待核":"t3"};

  /* 存档键带课程前缀 —— file:// 下所有本地页面共用一个 origin，
     两门课都用 "l01quiz" 会互相覆盖。 */
  var KEY = document.body.dataset.key;
  try {                       // 一次性迁移：早期版本用的是不带课程前缀的键
    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("l14quiz");
      if(_old){
        localStorage.setItem(KEY+"quiz", _old);
        var _p = localStorage.getItem("l14p");
        if(_p) localStorage.setItem(KEY+"p", _p);
      }
      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，
         用户「清空全部记录」之后下次打开又被复活一遍。 */
      localStorage.removeItem("l14quiz");
      localStorage.removeItem("l14p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      // ⚠ 不能换掉 iframe 元素：error/load 两个监听器是初始化时挂上去的，
      //   换元素会把它们孤儿化，「打不开？」面板就再也不会弹，
      //   读者只剩一个空白框、毫无线索（2026-10-23 我就是这么写错的）。
      //   先 about:blank、下一个 tick 再设真地址 —— 同样是新导航，元素不动。
      frame.src="about:blank";
      setTimeout(function(){ frame.src=SRC+HASH; }, 0);
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
