句核对）· Precup, Sutton & Dasgupta (2001)（书给的出处）· 简报 §4b「WIS 精确退化为拒绝采样」· 简报 §4e · bridge-threads [0]", "v": "<b>简报 §4b 那条「WIS 精确退化为拒绝采样」的推论，在本页和下一页得到了书的直接确认——而且书把它当成加权 IS 的<b>优点</b>在讲。</b><br><span class='k'><b>你的推导：均匀日志 + 确定性目标策略下，匹配轨迹权重 w = 2^k、不匹配 w = 0，于是 WIS 字面上就是「碰巧和你的策略一致的那些轨迹的平均回报」。</b></span><br><span class='w'><b>书在 Example 5.5 的描述：「加权重要性采样算法产生的是<b>只由那些与目标策略一致的回报</b>构成的加权平均」。</b></span><b>⇒ 同一件事，两种说法。你把它当成坏消息（ESS 坍塌），书把它当成好消息（方差有界）。<b>两边都对，取决于你问的是「估计准不准」还是「要多少样本」。</b></b><br><b>三条：</b><br>① ⭐ <b>「任一单条回报的最大权重是 1」这句话，给了 ESS 一个直观解释。</b><b>加权 IS 的方差有界，是因为没有任何一条样本能主导结果。</b><span class='k'><b>而这正是为什么 ESS 等于匹配轨迹数 m：每条匹配轨迹的权重都一样（都是 2^k），归一化之后就是均匀的 1/m。</b></span><b>⇒ 报 ESS 时可以引本页：加权 IS 的有效样本量<b>就是</b>匹配样本数，这不是实现问题，是估计量的定义使然。</b><br>② <b>书对普通 IS 那个「比值 10 ⇒ 估计是回报的 10 倍」的讽刺，值得搬进论文。</b><span class='w'><b>「越能代表目标策略，估计偏得越离谱」——这对审稿人是个很好的直觉说明，解释为什么你不用普通 IS。</b></span><br>③ ⚠ <b>但有一条边界必须说清楚，否则会误用书的结论。</b><b>「回报有界时加权版方差收敛到零，即使比值方差无穷」这个强结论的前提是<b>回报有界</b>。你的 G = Acc − λ·Cost：Acc ∈ [0,1] 有界，<b>而 Cost 的上界取决于你有没有给 token 数设上限</b>。</b><span class='k'><b>⇒ 如果某个配置可能产生极长输出（例如自洽采样 k=8 配上长推理），Cost 实际上是重尾的，「回报有界」这个前提就需要你自己去保证（设 max_tokens，并在论文里写明）。这是一个具体的、可执行的要求。</b></span>"}},
{"r": [16, 16], "t": "两个例子：单状态离策估值，和一个方差真的无穷的构造", "star": 2, "quote": "<em>Recall that <b>one of the advantages of Monte Carlo methods is that they can be used to evaluate a single state without forming estimates for any other states.</b></em><br><em>The estimates of ordinary importance sampling will typically have <b>infinite variance</b>, and thus unsatisfactory convergence properties, <b>whenever the scaled returns have infinite variance—and this can easily happen in off-policy learning when trajectories contain loops</b>.</em>", "one": "<b>Example 5.4 在一个二十一点状态上同时跑两种 IS，加权版一开始误差就低得多。Example 5.5 则构造了一个只有一个非终止状态的 MDP，让普通 IS 的方差真的变成无穷——而起因只是轨迹里有环。</b>", "pts": ["<b>Example 5.4 先用上了 5.1 节那条性质，这一点书特意点了出来。</b> <span class='k'><b>「回想蒙特卡洛方法的优点之一是：它们可以用来<b>只评估一个状态</b>，而不必为任何其他状态形成估计。」</b></span><b>被评估的状态很具体：<b>庄家明牌是 2，玩家手牌点数和为 13，且玩家有可用的 A</b>（也就是手里是 A 加 2，或等价地三张 A）。</b>", "<b>实验的设置值得完整记下来，因为它是一个干净的离策评估范例。</b> <span class='k'><b>行为策略：从该状态出发，以<b>相等概率</b>随机选要牌或停牌。</b></span><b>目标策略：只在点数 20 或 21 时停牌（就是 Example 5.1 那个）。</b><span class='w'><b>真值 ≈ <b>−0.27726</b>，是<b>另外单独</b>用目标策略生成<b>一亿</b>幕、取回报平均得到的。</b></span><b>⚠ 注意这个「一亿幕求真值」的做法——它是为了让横轴上的误差有意义，而不是算法的一部分。</b>", "<b>结果的报告方式同样值得学。</b> <b>两种离策方法在 <b>1000</b> 幕之后都已经很接近真值。</b><span class='k'><b>「为了确认它们可靠地做到这一点，我们做了 <b>100 次独立运行</b>，每次从零估计开始、学 <b>10,000</b> 幕。」</b></span><b>图 5.3 画的是「估计的<b>平方误差</b>随幕数的变化，在 100 次运行上取平均」。</b><b>「两种算法的误差都趋近零，<b>但加权重要性采样方法在<b>开始阶段</b>误差低得多</b>，这在实践中是典型的。」</b>", "<b>⚠ 习题 5.7 顺带留了一个值得想的问题。</b> <b>图 5.3 里普通 IS 的误差是单调下降的，<b>而加权 IS 的误差是先升后降</b>——习题问这是为什么。</b><span class='k'><b>提示（本页没给，但从上一页可推）：加权版在样本极少时等于观察到的回报本身，也就是偏向 v_b；随着样本增多，它才逐渐把权重分配正确。</b></span>", "<b>Example 5.5 换了个目的：不是比较两者，而是<b>构造</b>一个让普通 IS 失败的例子。</b> <span class='w'><b>「普通重要性采样的估计<b>通常</b>会有无穷方差、因而收敛性质不令人满意，只要缩放后的回报有无穷方差——<b>而这在离策学习里很容易发生，当轨迹里含有环的时候</b>。」</b></span><b>⚠「含有环」这个条件要记住：它是无穷方差的来源，而不是什么病态的巧合。</b>", "<b>构造本身极简，只有一个非终止状态。</b> <b>状态 s，两个动作 right 和 left。</b><span class='k'><b>right：<b>确定性地</b>转移到终止。</b></span><span class='k'><b>left：以概率 <b>0.9</b> 回到 s，以概率 <b>0.1</b> 转到终止。</b></span><b>奖励：只在 left 转到终止的那一步是 <b>+1</b>，其余都是 0。</b><b>目标策略：<b>永远选 left</b>。于是该策略下的每一幕都是「若干次（可能零次）回到 s，然后以 +1 终止」，<b>回报恒为 1</b>，故 v_π(s) = 1（γ = 1）。</b><b>行为策略：以<b>相等概率</b>选 right 和 left。</b>"], "eq": "Example 5.4 离策估一个二十一点状态：\n   被评估的状态：庄家明牌 **2** · 玩家点数和 **13** · **有可用 A**\n                （即 A + 2，或等价地三张 A）\n   行为策略 b：从该状态出发，**等概率**随机要牌/停牌\n   目标策略 π：只在 20 或 21 停牌（Example 5.1 那个）\n   真值 ≈ **−0.27726**（另外单独用 π 生成**一亿**幕取平均得到）\n   两法在 **1000** 幕后都已接近；做 **100 次独立运行** × **10,000** 幕\n   图 5.3 画**平方误差**随幕数变化，100 次运行取平均\n   ⇒ 「两者误差都趋近零，但**加权版在开始阶段误差低得多**」\n   ⚠ 习题 5.7：为什么加权版的误差曲线**先升后降**？\n\nExample 5.5 构造无穷方差：\n\n   只有一个非终止状态 s，两个动作：\n      right  **确定性**转移到终止\n      left   以 **0.9** 回到 s，以 **0.1** 转到终止\n   奖励：只在 **left 转到终止**那一步是 **+1**，其余为 0\n\n   目标策略 π：**永远选 left**\n      ⇒ 每幕 = 若干次（可能零次）回到 s，然后以 +1 终止\n      ⇒ 回报**恒为 1** ⇒ v_π(s) = **1**（γ = 1）\n   行为策略 b：**等概率**选 right / left\n\n   ⚠ 无穷方差的来源：「**轨迹里含有环**」—— 不是病态巧合，\n      而是离策学习里**很容易发生**的情形", "tbl": {"head": ["Example 5.4 的设置", "值"], "rows": [["被评估的状态", "庄家明牌 2 · 玩家 13 点 · 有可用 A"], ["行为策略", "<b>等概率</b>要牌 / 停牌"], ["目标策略", "只在 20 或 21 停牌"], ["真值", "<b>≈ −0.27726</b>（单独用目标策略跑<b>一亿</b>幕求得）"], ["实验规模", "<b>100 次独立运行 × 10,000 幕</b>，画平方误差"], ["结论", "<b>加权版在开始阶段误差低得多</b>"], ["⚠ 习题 5.7", "加权版误差为何<b>先升后降</b>"]]}},
{"r": [17, 18], "t": "⭐ 无偏却永不收敛：一个把「无偏」和「可用」分开的例子", "star": 3, "quote": "<em>Even after <b>millions of episodes</b>, the estimates <b>fail to converge</b> to the correct value of 1. In contrast, the weighted importance-sampling algorithm would give an estimate of <b>exactly 1 forever after the first episode that ended with the left action</b>.</em><br><em>All returns not equal to 1 … would have a ρ of zero and <b>contribute neither to the numerator nor denominator</b> of (5.6). <b>The weighted importance-sampling algorithm produces a weighted average of only the returns consistent with the target policy</b>, and all of these would be exactly 1.</em>", "one": "<b>图 5.4 上十条独立运行，跑了几百万幕，普通 IS 的估计仍然不收敛到 1——而这个量的期望恰好就是 1。原因是方差无穷。加权 IS 则在第一幕以 left 结束之后就永远给出精确的 1。</b>", "pts": ["<b>先看实验结果，它比任何论证都直观。</b> <span class='w'><b>「图 5.4 的下半部分展示了用普通重要性采样的首次访问 MC 算法的<b>十次独立运行</b>。<b>即使在几百万幕之后，这些估计仍然没能收敛到正确值 1。</b>」</b></span><b>⚠ 而图注把这件事的吊诡之处点明了：「正确估计是 1，<b>而且尽管这正是（重要性采样之后的）一个样本回报的期望值</b>，样本的方差却是无穷的，于是估计不收敛到这个值。」</b><span class='k'><b>⇒ 无偏 ≠ 可用。这是这一页存在的全部理由。</b></span>", "<b>加权 IS 在同一个问题上的表现，反差极大。</b> <span class='k'><b>「加权重要性采样算法会在<b>第一幕以 left 动作结束之后</b>，就永远给出<b>恰好为 1</b> 的估计。」</b></span><b>理由是机械的：所有不等于 1 的回报（也就是以 right 结束的那些）与目标策略<b>不一致</b>，因此它们的 ρ 是<b>零</b>，<b>对 (5.6) 的分子和分母都不贡献</b>。</b>", "<b>⚠ 书对加权 IS 在这里的行为给了一句很值得记的描述。</b> <span class='w'><b>「加权重要性采样算法产生的，是<b>只由那些与目标策略一致的回报</b>构成的加权平均，而这些回报全都恰好是 1。」</b></span><span class='k'><b>⇒ 换句话说：在目标策略确定、不一致的轨迹权重为零时，加权 IS <b>字面上就是「把不匹配的样本丢掉，对剩下的取平均」</b>。</b></span><b>这是一个拒绝采样的形状，而书是把它当成<b>优点</b>在讲的（方差有界）。右边的科研格展开这一点。</b>", "<b>然后书证明方差真的是无穷，而第一步是一个教科书恒等式。</b> <b>Var[X] ≐ E[(X − X̄)²] = E[X² − 2X X̄ + X̄²] = <b>E[X²] − X̄²</b>。</b><span class='k'><b>「因此，<b>若均值有限</b>（本例中正是如此），<b>方差无穷当且仅当该随机变量平方的期望无穷</b>。」</b></span><b>⇒ 于是只需证明「重要性采样缩放后的回报的平方期望」是无穷的。</b>", "<b>计算本身只用到两条化简，之后就是一个几何级数。</b> <span class='k'><b>化简一：以 right 结束的幕，重要性采样比是<b>零</b>（目标策略永不选 right），对期望<b>毫无贡献</b>，可以忽略。</b></span><span class='k'><b>化简二：剩下的幕全都回报为 1，所以 G₀ 这个因子<b>也可以忽略</b>。</b></span><b>于是只需按幕长分类，把「该幕出现的概率 × 其重要性采样比的平方」加起来。</b>", "<b>把三项写出来，规律就看见了。</b> <b>长度 1 的幕：½ · 0.1 · (1/0.5)²。长度 2 的幕：½ · 0.9 · ½ · 0.1 · (1/0.5 · 1/0.5)²。长度 3 的幕：½ · 0.9 · ½ · 0.9 · ½ · 0.1 · (1/0.5 · 1/0.5 · 1/0.5)²。⋯</b><span class='w'><b>合起来是 0.1 · Σ_{k=0}^{∞} 0.9^k · 2^k · 2 = <b>0.2 · Σ_{k=0}^{∞} 1.8^k = ∞</b>。</b></span><b>⚠ 关键在 <b>1.8 > 1</b>：每多走一步，幕的概率乘 0.9，而比值的平方乘 4，<b>0.9 × 4 = 3.6，再被行为策略那个 ½ 分掉一半，净得 1.8</b>——级数发散。</b><b>⇒ 「轨迹里有环」之所以危险，就在于它让「概率衰减」跑不过「比值增长」。</b>", "<b>本节末尾的三道习题，各指向一个不同的方向，值得记一下去处。</b> <b>习题 5.6：把 (5.6) 改写成关于<b>动作值</b> Q(s,a) 的形式（5.7 节的离策控制要用）。</b><span class='k'><b>习题 5.7：图 5.3 里加权 IS 的误差为什么<b>先升后降</b>（提示在上一页：样本极少时它等于观察到的回报本身，也就是偏向 v_b）。</b></span><b>习题 5.8：若 Example 5.5 改用<b>每次访问</b> MC，方差还会是无穷的吗？——这一题直接考「环」与「每次访问」叠加之后会发生什么。</b>"], "eq": "实验结果（图 5.4）：\n   普通 IS 的首次访问 MC，**十次独立运行**\n   **几百万幕之后仍然没能收敛到正确值 1**\n   ⚠ 图注的吊诡之处：1 **正是**（IS 之后）一个样本回报的期望值，\n      但样本**方差无穷**，于是估计不收敛\n   ⇒ **无偏 ≠ 可用**\n\n加权 IS 在同一问题上：\n   **第一幕以 left 结束之后，就永远给出恰好为 1 的估计**\n   理由：以 right 结束的幕与目标策略不一致 ⇒ ρ = **0**\n        ⇒ 对 (5.6) 的**分子和分母都不贡献**\n   ⇒ 「加权 IS 产生的是**只由与目标策略一致的回报**构成的加权平均」\n      ⚠ 目标策略确定时，这**字面上**就是\n        「丢掉不匹配的样本，对剩下的取平均」= 拒绝采样的形状\n\n证明方差无穷 —— 第一步是恒等式：\n   Var[X] ≐ E[(X − X̄)²] = E[X² − 2X X̄ + X̄²] = **E[X²] − X̄²**\n   ⇒ **均值有限时，方差无穷 ⟺ 平方的期望无穷**\n\n两条化简：\n   ① 以 right 结束的幕：ρ = 0 ⇒ **毫无贡献**，忽略\n   ② 剩下的幕回报全是 1 ⇒ **G₀ 因子也可忽略**\n   ⇒ 只需「幕出现的概率 × 其 ρ 的平方」按幕长求和\n\n计算（照 ch05.pdf p18 渲染图抄）：\n\n   = ½ · 0.1 · (1/0.5)²                                    （长度 1）\n   + ½ · 0.9 · ½ · 0.1 · (1/0.5 · 1/0.5)²                  （长度 2）\n   + ½ · 0.9 · ½ · 0.9 · ½ · 0.1 · (1/0.5 · 1/0.5 · 1/0.5)²（长度 3）\n   + ⋯\n\n               ∞                        ∞\n   = 0.1 ·     Σ   0.9^k · 2^k · 2 = 0.2 ·  Σ  **1.8^k**  = **∞**\n              k=0                      k=0\n\n   ⚠ 关键在 **1.8 > 1**：每多走一步\n        幕的概率 × 0.9，比值的平方 × 4，再被行为策略的 ½ 分掉一半\n        ⇒ 净得 **1.8** ⇒ 级数发散\n   ⇒ 「轨迹里有环」危险，是因为它让**概率衰减跑不过比值增长**\n\n三道习题的去处：\n   5.6  把 (5.6) 改写成**动作值** Q(s,a) 的形式 → 5.7 节离策控制要用\n   5.7  加权 IS 的误差为何**先升后降** → 样本少时它偏向 v_b\n   5.8  改用**每次访问**，方差还无穷吗 → 考「环 + 每次访问」", "tbl": {"head": ["", "普通 IS", "加权 IS"], "rows": [["在 Example 5.5 上", "<span class='w'>几百万幕后仍不收敛</span>", "<b>第一幕之后就恒为 1</b>"], ["为什么", "<b>方差无穷</b>（1.8 > 1，级数发散）", "不匹配的样本 ρ = 0，上下都不贡献"], ["它实际在算什么", "按比值缩放后<b>简单平均</b>", "<b>只对与目标策略一致的回报取加权平均</b>"], ["这个形状叫什么", "—", "<b>目标策略确定时就是拒绝采样</b>"], ["这一页的结论", "<b>无偏 ≠ 可用</b>", "<b>有偏但有界，实践中强烈推荐</b>"], ["⚠ 无穷方差的来源", "<b>轨迹里有环</b>", "—"]]}, "res": {"tag": "推断", "ref": "原书 Example 5.5 与 p18 的计算（逐式核对渲染图）· 简报 §4b「ESS = m，E[m] = n·2^(−k)」· 简报 §4a · bridge-threads [0] OPE / batch RL", "v": "<b>⚠ 这一页最有用的地方，是让你能<b>精确地说出自己的问题<b>不是</b>哪一种</b>——而这个区分会直接影响你该引谁、该做什么。</b><br><span class='w'><b>书这里的病症是<b>无穷方差</b>，而病根是<b>轨迹里有环</b>：幕可以任意长，于是 ρ 可以任意大（2^k），而幕的概率衰减（0.9^k）跑不过比值平方的增长 ⇒ 0.2 Σ 1.8^k 发散。</b></span><br><span class='k'><b>而你的管道<b>没有环</b>：H 是固定的（≤ 5–10 个决策节点），轨迹条数有限，ρ 的取值也有限（均匀行为策略下匹配的恰为 2^k、不匹配的为 0）。<b>⇒ 你的方差是<b>有限</b>的，Example 5.5 那个病你<b>没有</b>。</b></b></span><br><b>你的病是另一个，而简报 §4b 已经算准了：<b>ESS = m，E[m] = n·2^(−k)</b>——不是方差无穷，是<b>有效样本量指数级地小</b>。</b><br>⇒ <b>这个区分有三个实际后果：</b><br>① ⭐ <b>别引 Example 5.5 来论证你的困难，那是引错了病例。</b><b>审稿人若熟悉这一章，会看出「有限时域、无环」的问题不会有无穷方差，从而怀疑你没搞清自己的处境。</b><span class='k'><b>该引的是覆盖假设（p13）与「加权 IS 只对一致的回报取平均」（本页）——两者合起来正好推出 ESS = 匹配样本数。</b></span><br>② <b>方差有限这件事是个<b>好消息</b>，应该主动说出来。</b><b>它意味着你的估计量有定义、有有限方差、置信区间可算——问题纯粹是「样本不够」，而样本不够是可以用<b>钱和时间</b>解决的，或者用简报 §4c 的降维（k 从 10 到 4，ESS 涨 64 倍）解决。</b><span class='w'><b>这和「估计量根本不存在」（§4a 的确定性日志）是两个量级的问题，论文里必须分开讲。</b></span><br>③ <b>书这里的「无偏 ≠ 可用」仍然是你要借的那条结论，只是理由换了。</b><b>你不能说「因为方差无穷」，但可以说「因为 ESS = n·2^(−k)，在可行的 n 下置信区间宽到无法区分候选策略」。</b><span class='k'><b>⇒ 这正是简报 §4d 那个穷举 oracle 的理由：它不是估计量，是真值，<b>ESS 这个概念对它不适用</b>。「在你付得起的规模上，它碾压任何估计量」这句话，在本页之后更站得住。</b></span>"}, "link": {"t": "你学过的对应：CS234 L15 精读（只有一份旧数据，怎么在上线之前就知道新策略更好 —— 那一讲是本节在 OPE 方向上的完整展开，含 doubly robust、FQE、MAGIC、高置信 OPE）", "href": "../../cs234-2019/中文精读/L15-精读.html"}},
{"r": [19, 20], "t": "增量实现：加权平均需要另一条更新式，外加一个累积权重", "star": 2, "quote": "<em>The algorithm is nominally for the off-policy case, using weighted importance sampling, but <b>applies as well to the on-policy case just by choosing the target and behavior policies as the same</b> (in which case π = b, <b>W is always 1</b>).</em><br><em>An advantage of this separation is that <b>the target policy may be deterministic (e.g., greedy), while the behavior policy can continue to sample all possible actions</b>.</em>", "one": "<b>普通 IS 可以直接套第 2 章的增量平均，只要把奖励换成缩放后的回报。加权 IS 不行——它需要 (5.8) 那条更新式，外加为每个状态维护一个累积权重 C。</b>", "pts": ["<b>先把三种情形分清楚，书是按这个顺序交代的。</b> <span class='k'><b>① 在策蒙特卡洛：和第 2 章<b>完全一样</b>，只是把「平均奖励」换成「平均回报」。</b></span><span class='k'><b>② 离策 + 普通 IS：仍然用第 2 章的增量方法，只是把该章的奖励换成<b>缩放后的回报</b>（按 ρ 缩放）。</b></span><span class='w'><b>③ 离策 + 加权 IS：<b>需要一条略有不同的增量算法</b>，因为这里要形成的是加权平均。</b></span>", "<b>加权平均的增量形式，关键是多维护一个量。</b> <b>设有一列回报 G₁, …, G_{n−1}，都从同一状态出发，各带一个随机权重 W_i（例如 W_i = ρ_{t_i : T(t_i)−1}）。要维持的估计是 (5.7)：V_n ≐ Σ_{k=1}^{n−1} W_k G_k / Σ_{k=1}^{n−1} W_k。</b><span class='k'><b>「除了跟踪 V_n，我们还必须为每个状态维护<b>给前 n 个回报的权重的累积和 C_n</b>。」</b></span>", "<b>更新式本身只有两行，形状和第 2 章那条很像。</b> <b>(5.8)：V_{n+1} ≐ V_n + (W_n / C_n)·[G_n − V_n]，n ≥ 1；以及 C_{n+1} ≐ C_n + W_{n+1}，其中 C₀ ≐ 0。</b><span class='k'><b>⚠ 对比第 2 章的无权版本 (2.3)：那里的步长是 1/n，这里是 W_n/C_n。也就是说「这一条样本的权重占迄今全部权重的份额」。</b></span><b>V₁ 是任意的、不必指定（因为第一次更新会把它整个替掉）。习题 5.10 就是请读者从 (5.7) 推出 (5.8)。</b>", "<b>伪代码里有两处细节值得盯。</b> <b>① 内层循环的条件是「t = T−1, …, 0，<b>且 W ≠ 0</b>」</b>——<span class='w'><b>一旦 W 变成零，后面的步就再也不会有贡献，提前退出。</b></span><b>② 权重的更新放在循环<b>末尾</b>：W ← W · π(A_t|S_t)/b(A_t|S_t)。</b><span class='k'><b>因为是倒着走的，所以 t 时刻用的 W 是 t+1 到 T−1 那段的乘积，恰好对应 ρ_{t+1:T−1}——而当前这一步的比值要到更新完 Q 之后才乘进去。</b></span>", "<b>这个算法有一个很好的性质：它把在策当成特例包含了。</b> <span class='k'><b>「这个算法名义上是给离策情形的、用加权重要性采样，但<b>只要把目标策略与行为策略选成同一个，它同样适用于在策情形</b>（此时 π = b，<b>W 恒为 1</b>）。」</b></span><b>⇒ W 恒为 1 时，W/C = 1/n，退回第 2 章那条样本平均——一行代码两种用法。</b>", "<b>5.7 节开头重述了离策的分工，而且点出了它最实在的那个好处。</b> <b>「在策方法的特征是：<b>一边用某个策略做控制，一边估计它的值</b>。离策方法把这两件事<b>分开</b>了。」</b><span class='w'><b>「这种分离的一个<b>好处</b>是：<b>目标策略可以是确定性的（例如贪心），而行为策略可以继续对所有可能的动作采样</b>。」</b></span><b>⚠ 但要求也随之而来：行为策略必须对目标策略<b>可能选中的所有动作</b>有非零概率（覆盖）；而「为了探索所有可能性，我们要求行为策略是<b>软</b>的」。</b><b>书还补了一句很宽松的话：行为策略 b <b>可以是任何东西</b>，而且「它可以在幕<b>之间</b>、甚至幕<b>之内</b>改变」——只要保证每个状态–动作对能拿到无穷多回报（取 b 为 ε-软即可）。</b>"], "eq": "三种情形的增量实现：\n   ① 在策           与第 2 章**完全一样**，只把「平均奖励」换成「平均回报」\n   ② 离策 + 普通 IS  仍用第 2 章方法，把奖励换成**按 ρ 缩放后的回报**\n   ③ 离策 + 加权 IS  **需要另一条更新式**（下面）\n\n要维持的估计（5.7）：\n              Σ_{k=1}^{n−1} W_k G_k\n   V_n ≐  ─────────────────────── ，  n ≥ 2\n              Σ_{k=1}^{n−1} W_k\n   （W_i 是第 i 条回报的随机权重，例如 W_i = ρ_{t_i : T(t_i)−1}）\n\n增量更新（5.8）：\n                      W_n\n   V_{n+1} ≐ V_n + ────── [ G_n − V_n ] ，  n ≥ 1\n                      C_n\n   C_{n+1} ≐ C_n + W_{n+1} ，   C₀ ≐ 0 ，  V₁ 任意\n\n   ⚠ 对比第 2 章无权版 (2.3)：那里步长是 **1/n**，这里是 **W_n / C_n**\n      ——「这一条样本的权重占迄今**全部**权重的份额」\n\n离策 MC 预测伪代码（估计 Q ≈ q_π）：\n   初始化 Q(s,a) 任意；**C(s,a) ← 0**\n   永远循环（每一幕）：\n       b ← **任何对 π 有覆盖的**策略\n       按 b 生成一幕；G ← 0；**W ← 1**\n       倒着循环 t = T−1, …, 0，**且 W ≠ 0**：     ← W 归零就提前退出\n           G ← γG + R_{t+1}\n           C(S_t,A_t) ← C(S_t,A_t) + W\n           Q(S_t,A_t) ← Q(S_t,A_t) + (W / C(S_t,A_t)) [ G − Q(S_t,A_t) ]\n           **W ← W · π(A_t|S_t) / b(A_t|S_t)**       ← 放在循环**末尾**\n\n   ⭐ 「只要把目标与行为策略选成同一个，它同样适用于**在策**情形\n      （此时 π = b，**W 恒为 1**）」⇒ W/C = 1/n，退回第 2 章的样本平均\n\n5.7 开篇：离策把「控制」与「估值」分开\n   好处：**目标策略可以确定（例如贪心），而行为策略继续对所有动作采样**\n   要求：b 对 π 可能选中的所有动作有非零概率（**覆盖**）；b 必须是**软**的\n   ⚠ b **可以是任何东西**，且「可以在幕**之间**、甚至幕**之内**改变」", "tbl": {"head": ["", "第 2 章 / 在策", "离策 + 普通 IS", "离策 + 加权 IS"], "rows": [["平均什么", "奖励 / 回报", "<b>按 ρ 缩放后的回报</b>", "<b>带权重的回报</b>"], ["用哪条更新式", "(2.3)，步长 1/n", "同 (2.3)", "<b>(5.8)，步长 W_n/C_n</b>"], ["额外要维护", "计数 n", "计数 n", "<b>累积权重 C</b>"], ["W 的值", "—", "ρ", "ρ；<b>π = b 时恒为 1</b>"], ["⚠ 提前退出", "—", "—", "<b>W 归零后不再贡献</b>"]]}},
{"r": [21, 21], "t": "⭐ 离策控制：只从幕的尾巴学，而且前面的状态学得最少", "star": 3, "quote": "<em>A potential problem is that <b>this method learns only from the tails of episodes, when all of the remaining actions in the episode are greedy</b>. <b>If nongreedy actions are common, then learning will be slow, particularly for states appearing in the early portions of long episodes.</b> Potentially, this could greatly slow learning. <b>There has been insufficient experience with off-policy Monte Carlo methods to assess how serious this problem is.</b></em>", "one": "<b>离策 MC 控制的伪代码里有一行「若 A_t ≠ π(S_t) 就退出内层循环」。它的后果是：这个方法只从幕的尾巴学——只有当后续动作恰好全是贪心的那一段才算数。而越靠前的状态，吃到这一刀的概率越大。</b>", "pts": ["<b>先看算法，它和上一页的预测版只差三行。</b> <b>多出来的是：初始化时 π(s) ← argmax_a Q(s,a)（平局一致地打破）；每步更新 Q 之后立刻 π(S_t) ← argmax_a Q(S_t,a)；以及那行<b>提前退出</b>。</b><span class='k'><b>而 b 的要求放宽成「<b>任何软策略</b>」。</b></span>", "<b>⚠ 那行提前退出是这一页的全部要害。</b> <span class='w'><b>「<b>若 A_t ≠ π(S_t)，则退出内层循环（转入下一幕）</b>。」</b></span><b>翻译：倒着走的时候，一旦遇到一个<b>行为策略没有按当前贪心策略走</b>的步，这一幕里<b>它以及它之前</b>的所有步就全部作废。</b>", "<b>由此也解释了权重更新为什么不是 π/b。</b> <b>伪代码里写的是 <b>W ← W · 1/b(A_t|S_t)</b>，而不是 W ← W · π(A_t|S_t)/b(A_t|S_t)。</b><span class='k'><b>原因：能走到这一行，说明 A_t = π(S_t)；而目标策略是<b>确定性</b>的贪心策略，所以 π(A_t|S_t) = <b>1</b>，分子就省掉了。</b></span><b>⚠ 习题 5.11 问的正是这一点——书把它留成了习题，但理由就在那行提前退出里。</b>", "<b>⚠ 现在是后果，而书说得相当直白。</b> <span class='w'><b>「一个潜在的问题是：<b>这个方法只从幕的<b>尾巴</b>学</b>——只有当这一幕<b>剩下的所有动作都是贪心的</b>时候才学得到。」</b></span><b>「<b>如果非贪心动作很常见，学习就会很慢，<b>对那些出现在长幕<b>靠前部分</b>的状态尤其如此</b></b>。这有可能大大拖慢学习。」</b>", "<b>把这件事量化一下，结构就清楚了。</b> <span class='k'><b>设行为策略在每步以概率 q 选中当前贪心动作。那么一个距离幕尾还有 m 步的状态，它这一次被学到的概率是 <b>q^m</b>。</b></span><b>⇒ <b>靠前的状态被学到的概率随距离指数衰减</b>。这不是「数据少一点」，是「数据量沿着幕的位置系统性地倾斜」。</b><b>右边的科研格说明这条对你的管道意味着什么。</b>", "<b>书对这个问题的态度很诚实，而且给了两条出路。</b> <span class='w'><b>「<b>关于离策蒙特卡洛方法的经验还不够，无法评估这个问题有多严重。</b>」</b></span><span class='k'><b>出路一：「如果严重，最重要的应对办法<b>大概是引入时序差分学习</b>——也就是下一章要发展的那个算法思想。」</b></span><span class='k'><b>出路二：「另外，<b>如果 γ 小于 1</b>，下一节（5.8 折扣感知 IS）发展的想法也可能有显著帮助。」</b></span><b>⚠ 记住第二条的前提是 γ < 1——这一点在 5.8 节会再强调一次，而它决定了那一节对你有没有用。</b>"], "eq": "离策 MC 控制（估计 π ≈ π_*）—— 与预测版的三处差别：\n\n   初始化多一行：π(s) ← argmax_a Q(s,a)（平局**一致地**打破）\n   b ← **任何软策略**\n   倒着循环 t = T−1, …, 0：\n       G ← γG + R_{t+1}\n       C(S_t,A_t) ← C(S_t,A_t) + W\n       Q(S_t,A_t) ← Q(S_t,A_t) + (W / C(S_t,A_t)) [ G − Q(S_t,A_t) ]\n       π(S_t) ← argmax_a Q(S_t,a)                    ← 当场改进\n       **若 A_t ≠ π(S_t) 则退出内层循环（转入下一幕）**   ← 提前退出\n       **W ← W · 1 / b(A_t|S_t)**                     ← 分子是 1，不是 π\n\n   为什么分子是 1（习题 5.11）：\n      能走到这一行 ⇒ A_t = π(S_t)；而 π 是**确定性**贪心策略\n      ⇒ π(A_t|S_t) = **1**，分子省掉\n\n⭐ 后果：**只从幕的尾巴学**\n   只有当这一幕**剩下的所有动作都是贪心的**时候才学得到\n   「如果非贪心动作很常见，学习就会很慢，\n     **对出现在长幕靠前部分的状态尤其如此**」\n\n   量化：设行为策略每步以概率 q 选中当前贪心动作\n        ⇒ 距幕尾还有 m 步的状态，被学到的概率是 **q^m**\n        ⇒ **靠前的状态被学到的概率随距离指数衰减**\n        ⚠ 不是「数据少一点」，是「数据量沿幕的位置**系统性倾斜**」\n\n书给的两条出路（注意前提）：\n   ① 引入**时序差分学习**（下一章）——「最重要的应对办法」\n   ② **如果 γ < 1**，5.8 节的折扣感知 IS 也可能显著帮助\n      ⚠ 前提是 γ < 1\n\n⚠ 书的自评：「关于离策 MC 方法的**经验还不够**，无法评估这个问题有多严重」", "tbl": {"head": ["状态在幕中的位置", "被学到需要什么", "概率（每步贪心概率 q）"], "rows": [["最后一步", "无额外条件", "<b>1</b>"], ["距幕尾 1 步", "后面 1 步是贪心的", "q"], ["距幕尾 m 步", "后面 m 步<b>全是</b>贪心的", "<b>q^m</b>"], ["⇒ 结构性后果", "<b>靠前的状态指数级地少被学到</b>", "<span class='w'>不是数据少，是沿位置系统性倾斜</span>"], ["书给的出路", "① 时序差分（下一章）· ② γ &lt; 1 时用 5.8 节", "<span class='w'>⚠ 第二条的前提是 γ &lt; 1</span>"]]}, "res": {"tag": "推断", "ref": "原书 5.7 节（逐句核对）· 简报 §4b「ESS = m，E[m] = n·2^(−k)」· 简报 §4c「只保留 top k=3~4 作为随机化决策节点」· 简报 §5「P2 vs P3 消融」", "v": "<b>「只从幕的尾巴学」这条，给你的 ESS 估算补上了一个你之前没算进去的<b>结构</b>：数据不是均匀地少，而是<b>沿管道位置倾斜</b>的。</b><br><span class='k'><b>简报 §4b 算的是整条轨迹的匹配率：E[m] = n·2^(−k)。</b></span><b>那是「从头到尾全都匹配」的概率。</b><span class='w'><b>但本页指出：如果你估的是<b>节点级</b>的值（哪个节点该用哪个档位），那么<b>第 j 个节点</b>的可用数据量取决于「它<b>之后</b>的节点有没有全部匹配」，而不是整条轨迹。</b></span><br>⇒ <b>具体地：设 k 个决策节点、均匀二选一、目标策略确定。</b><span class='k'><b>最后一个决策节点的匹配率是 1/2⁰ = <b>1</b>（它之后没有决策了）；倒数第二个是 1/2；倒数第 j 个是 <b>2^(−(j−1))</b>。</b></span><b>⇒ <b>管道越靠前的节点，可用样本越少，而且是指数级的。</b></b><br><b>三条可用的：</b><br>① ⭐ <b>这条应该直接写进你的实验设计。</b><b>「我们按节点位置分别报告有效样本量，因为离策蒙特卡洛只从轨迹的尾部学（Sutton & Barto §5.7），靠前的节点可用数据随位置指数衰减。」</b><span class='w'><b>⚠ 如果你只报一个全局 ESS，审稿人若熟悉这一章会问「那第一个节点呢」。</b></span><br>② <b>它也改变了 §4c 的取舍。</b><b>简报说按敏感度排序取 top k=3~4 个节点随机化。</b><span class='k'><b>本页提示还要考虑<b>位置</b>：同样敏感度的两个节点，<b>靠后的那个数据效率高得多</b>。⇒ 排序时不该只看 Δ_h，而该看 Δ_h 与「它之后还有几个随机化节点」的组合。</b></span><b>一个具体的建议：把随机化节点尽量<b>集中在管道后段</b>，前段按敏感度扫描的结果钉死——这既符合覆盖假设（前段 π = b），又最大化数据效率。</b><br>③ ⚠ <b>但要注意书给的两条出路对你的适用性。</b><span class='w'><b>出路二（γ < 1 时用 5.8 节）<b>对你不成立</b>：你的 γ = 1。</b></span><b>出路一（时序差分）需要你的问题真有序贯结构——而这正是简报 §5 那个可加性检验要回答的。<b>⇒ 若可加性成立，根本没有「尾巴」可言（每个节点独立），这条坑自动消失；若不成立，TD 才值得考虑。又一次，实验先行。</b></b>"}},
{"r": [22, 23], "t": "折扣感知 IS：那 99 个因子期望是 1，却贡献了全部的方差", "star": 3, "quote": "<em>say that episodes last 100 steps and that γ = 0. The return from time 0 will then be just G₀ = R₁, but its importance sampling ratio will be <b>a product of 100 factors</b> … <b>The other 99 factors … are irrelevant</b> because after the first reward the return has already been determined. <b>These later factors are all independent of the return and of expected value 1; they do not change the expected update, but they add enormously to its variance.</b></em><br><em>They take into account the discount rate but <b>have no effect … if γ = 1</b>.</em>", "one": "<b>前面几节都把回报当成一个整块来加权，没有利用它「是折扣奖励之和」这个内部结构。一个极端例子：100 步的幕、γ=0，回报就是 R₁，却要乘 100 个比值——后 99 个期望都是 1，不改变期望，却贡献了巨量的方差。</b>", "pts": ["<b>先看这一节要攻的是什么。</b> <span class='k'><b>「到目前为止考虑的离策方法，都是把回报当成<b>一个整块</b>来形成重要性采样权重的，<b>没有考虑回报内部「折扣奖励之和」的结构</b>。」</b></span><b>本节「简要考虑利用这个结构来<b>显著降低</b>离策估计量方差的<b>前沿研究想法</b>」。</b><b>⚠ 注意书自己把这一节标成 *（选读）并称之为 cutting-edge research ideas。</b>", "<b>那个极端例子把浪费说得非常清楚。</b> <b>设幕长 100 步、γ = 0。那么从时刻 0 起的回报<b>就是 G₀ = R₁</b>，<span class='w'><b>但它的重要性采样比却是 <b>100 个因子的连乘</b>：π(A₀|S₀)/b(A₀|S₀) · π(A₁|S₁)/b(A₁|S₁) ⋯ π(A₉₉|S₉₉)/b(A₉₉|S₉₉)。</b></span><span class='k'><b>「普通重要性采样会用<b>整个</b>乘积去缩放这个回报，而其实<b>只需要用第一个因子</b> π(A₀|S₀)/b(A₀|S₀)。」</b></span>", "<b>⚠ 那另外 99 个因子的性质，是这一页最该记住的一句。</b> <b>「其余 99 个因子是<b>无关的</b>，因为在第一个奖励之后回报就已经确定了。」</b><span class='w'><b>「这些后来的因子<b>全都与回报独立、且期望值为 1</b>；<b>它们不改变更新的期望，却极大地增加了它的方差</b>。在某些情形下它们甚至可能让方差变成无穷。」</b></span><b>⇒ 「期望是 1」听起来无害，但「期望是 1」和「恒等于 1」是两回事——<b>前者只保证不偏，不保证不抖</b>。</b>", "<b>这一节的想法很优雅：把折扣重新解释成「终止的概率」。</b> <span class='k'><b>「把折扣看成是在决定一个<b>终止的概率</b>，或者等价地，一个<b>部分终止的程度</b>。」</b></span><b>对任意 γ ∈ [0,1)：G₀ 以程度 <b>1 − γ</b> 在一步后部分终止（产生回报 R₁）；以程度 <b>(1 − γ)γ</b> 在两步后部分终止（产生 R₁ + R₂）；以此类推。</b><b>第三步的终止程度是 (1 − γ)γ²——那个 γ² 反映「前两步都没有终止」。</b>", "<b>由此定义<b>平坦部分回报</b>，名字里两个词各有所指。</b> <b>Ḡ_{t:h} ≐ R_{t+1} + R_{t+2} + ⋯ + R_h，其中 0 ≤ t < h ≤ T。</b><span class='k'><b>「<b>平坦</b>」指<b>没有折扣</b>；「<b>部分</b>」指这些回报<b>不一直延伸到终止</b>，而是停在 h —— h 叫做<b>视界</b>（horizon），T 是该幕的终止时刻。</b></span><b>于是常规的完整回报 G_t 可以写成这些平坦部分回报的加权和：G_t = (1−γ) Σ_{h=t+1}^{T−1} γ^{h−t−1} Ḡ_{t:h} + γ^{T−t−1} Ḡ_{t:T}。</b>", "<b>有了这个分解，比值就可以跟着<b>截断</b>，这正是全节的要点。</b> <span class='k'><b>「由于 Ḡ_{t:h} 只涉及到视界 h 为止的奖励，我们<b>只需要到 h−1 为止</b>的概率之比。」</b></span><b>于是 (5.9) 给出普通版、(5.10) 给出加权版的<b>折扣感知重要性采样估计量</b>，两式里把 ρ_{t:T(t)−1} 换成了与各段视界匹配的 ρ_{t:h−1}。</b><span class='w'><b>⚠⚠ 但最后一句话决定了它对谁有用：「它们把折扣率考虑了进去，<b>但在 γ = 1 时没有任何效果（与 5.5 节的离策估计量相同）</b>。」</b></span>"], "eq": "这一节要攻的浪费（γ = 0、幕长 100 的极端例子）：\n\n   回报 G₀ = **R₁**（γ=0，只有第一个奖励）\n   但 ρ 是 **100 个因子的连乘**：\n      π(A₀|S₀)/b(A₀|S₀) · π(A₁|S₁)/b(A₁|S₁) ⋯ π(A₉₉|S₉₉)/b(A₉₉|S₉₉)\n   其实**只需要第一个因子**\n\n   ⚠ 其余 99 个因子的性质（最该记住的一句）：\n      **与回报独立，且期望值为 1**\n      **不改变更新的期望，却极大地增加方差**\n      「在某些情形下甚至可能让方差变成无穷」\n      ⇒ 「期望是 1」≠「恒等于 1」：前者只保证不偏，**不保证不抖**\n\n想法：把**折扣**重新解释成**终止的概率**（部分终止的程度）\n   G₀ 以程度 **1 − γ**     在一步后部分终止  → 回报 R₁\n      以程度 **(1−γ)γ**    在两步后部分终止  → 回报 R₁ + R₂\n      以程度 **(1−γ)γ²**   在三步后部分终止  → …\n      （γ² 反映「前两步都没终止」）\n\n**平坦部分回报**：\n   Ḡ_{t:h} ≐ R_{t+1} + R_{t+2} + ⋯ + R_h ，  0 ≤ t < h ≤ T\n   「**平坦**」= 没有折扣 ；「**部分**」= 不延伸到终止，停在 **h**（视界）\n\n   完整回报的分解：\n                    T−1\n   G_t = (1−γ)      Σ    γ^{h−t−1} Ḡ_{t:h}  +  γ^{T−t−1} Ḡ_{t:T}\n                  h=t+1\n\n关键：**比值跟着截断**\n   Ḡ_{t:h} 只涉及到 h 为止的奖励 ⇒ **只需要到 h−1 为止**的概率之比 ρ_{t:h−1}\n   ⇒ (5.9) 普通版 · (5.10) 加权版 **折扣感知重要性采样估计量**\n\n⚠⚠ 适用边界（决定它对谁有用）：\n   「它们把折扣率考虑进去，**但在 γ = 1 时没有任何效果**\n     （与 5.5 节的离策估计量相同）」", "tbl": {"head": ["γ = 0、幕长 100 时", "需要的", "实际用的（5.5 节）"], "rows": [["回报", "<b>R₁</b>", "R₁"], ["比值", "<b>1 个因子</b>", "<span class='w'>100 个因子的连乘</span>"], ["多出的 99 个因子", "—", "<b>与回报独立，期望为 1</b>"], ["对期望的影响", "—", "<b>没有</b>（所以无偏）"], ["对方差的影响", "—", "<span class='w'>极大增加，甚至可能无穷</span>"], ["⚠ 折扣感知 IS 在 γ = 1 时", "—", "<b>没有任何效果</b>"]]}, "res": {"tag": "已核", "ref": "原书 5.8 节（逐句核对，末句 “have no effect … if γ = 1” 逐字核对）· 简报 §4e「per-decision IS 对准确率那一半买不到任何东西」· bridge-threads [0]", "v": "<b>⚠ 这一节对你<b>明确无效</b>，而且这是书自己写明的，不是我的推断。</b><br><span class='w'><b>书的末句：「它们把折扣率考虑进去，<b>但在 γ = 1 时没有任何效果</b>（与 5.5 节的离策估计量相同）」。</b></span><b>而你的 G = Acc − λ·Cost <b>没有自然的折扣</b>——一条 query 里第三个节点的成本不该比第一个打折，γ = 1。</b><br><span class='k'><b>⇒ 结论很干脆：5.8 节的两个估计量 (5.9)(5.10) 你<b>用不上</b>，不必花时间读 Mahmood (2017) 那条线。</b></span><br><b>但这一节有两样东西仍然值得你带走：</b><br>① ⭐ <b>那句关于「期望为 1 的因子」的判断，是一条可以直接复用的诊断原则。</b><span class='k'><b>「这些因子与回报<b>独立</b>、期望为 <b>1</b>；<b>不改变期望，却极大增加方差</b>。」</b></span><b>⇒ 凡是你的估计量里出现「乘了一个期望为 1 但不恒为 1 的随机量」，就该问：<b>它和被估的量真的相关吗？</b>不相关就该去掉。</b><b>这正是下一节（5.9 逐决策 IS）要系统地做的事，而那一节<b>在 γ = 1 时仍然有效</b>。</b><br>② <b>「把折扣看成终止概率」这个重新解释，对你有一个<b>非折扣</b>的类比。</b><span class='w'><b>你的管道里，每个节点的输出<b>有可能提前定下最终答案</b>（例如某个验证节点直接判定失败、或某个早期节点已经给出正确答案）。</b></span><b>如果能识别出「从哪一步起结果就已经定了」，那么<b>那一步之后的比值全都是无关因子</b>——和本页那 99 个因子是同一回事。</b><span class='k'><b>⚠ 这是一个<b>推断</b>而非书里的话，而且它需要一个前提：你得能判定「结果已定」。但这件事在你的场景里未必不可行——§4d 的 oracle 表里，前缀共享用的正是「拓扑前缀一致则输出可复用」这个性质。</b></span>"}},
{"r": [24, 25], "t": "⭐ 逐决策 IS：第 k 个奖励只需要它之前的比值——而终局奖励一个都省不掉", "star": 3, "quote": "<em>a way that may be able to reduce variance <b>even in the absence of discounting (that is, even if γ = 1)</b>.</em><br><em>E[π(A_k|S_k)/b(A_k|S_k)] ≐ Σ_a b(a|S_k)·π(a|S_k)/b(a|S_k) = Σ_a π(a|S_k) = <b>1</b>.</em><br><em>Is there a per-decision version of weighted importance sampling? <b>This is less clear.</b> So far, <b>all the estimators that have been proposed for this that we know of are not consistent</b> (that is, they do not converge to the true value with infinite data).</em>", "one": "<b>逐决策 IS 的洞察是：回报里第 k 个奖励，只跟「它之前」的那些比值有关；它之后的那些期望都是 1，可以在期望意义下去掉。好处是即使 γ=1 也有效——但代价是：终局奖励需要全部比值，一个都省不掉。</b>", "pts": ["<b>先看它和上一节的分工，书把这一点放在第一句。</b> <span class='k'><b>「还有一种方式可以利用『回报是奖励之和』这个结构，而这种方式<b>即使在没有折扣的情况下（也就是即使 γ = 1）也可能降低方差</b>。」</b></span><b>⇒ 上一节靠 γ < 1 才有效，这一节不需要。对 γ = 1 的问题，这是唯一可用的那一节。</b>", "<b>出发点是把 (5.11) 那个乘积<b>分配</b>到每个奖励上。</b> <b>ρ_{t:T−1} G_t = ρ_{t:T−1}(R_{t+1} + γR_{t+2} + ⋯ + γ^{T−t−1}R_T)= ρ_{t:T−1}R_{t+1} + γρ_{t:T−1}R_{t+2} + ⋯ + γ^{T−t−1}ρ_{t:T−1}R_T。</b><span class='k'><b>每个子项都是「一个随机奖励 × 一个随机重要性采样比」的乘积。</b></span>", "<b>观察第一个子项，就能看出哪些因子是多余的。</b> <b>(5.12)：ρ_{t:T−1}R_{t+1} = [π(A_t|S_t)/b(A_t|S_t)] · [π(A_{t+1}|S_{t+1})/b(A_{t+1}|S_{t+1})] ⋯ [π(A_{T−1}|S_{T−1})/b(A_{T−1}|S_{T−1})] · R_{t+1}。</b><span class='w'><b>「在所有这些因子当中，人们可能会<b>怀疑</b>只有<b>第一个</b>和<b>最后一个（那个奖励）</b>是相关的；<b>其余的都是发生在那个奖励<b>之后</b>的事件</b>。」</b></span>", "<b>这个怀疑可以被证实，而关键只是一行期望计算。</b> <span class='k'><b>(5.13)：E[π(A_k|S_k)/b(A_k|S_k)] ≐ Σ_a b(a|S_k) · π(a|S_k)/b(a|S_k) = Σ_a π(a|S_k) = <b>1</b>。</b></span><b>⚠ 注意这一步的结构：期望是在<b>行为策略</b> b 下取的，于是 b(a|S_k) 恰好把分母约掉，剩下 π 对动作求和 = 1。<b>这就是为什么「期望为 1」——它是概率归一化的直接后果。</b></b><b>习题 5.13 请读者补出从 (5.12) 到 (5.14) 的完整步骤。</b>", "<b>结论写成 (5.14) 和它的一般形式。</b> <span class='k'><b>E[ρ_{t:T−1} R_{t+1}] = E[<b>ρ_{t:t}</b> R_{t+1}]；一般地 E[ρ_{t:T−1} R_{t+k}] = E[<b>ρ_{t:t+k−1}</b> R_{t+k}]。</b></span><b>⇒ 「第 k 个奖励只被<b>它之前</b>的那些比值加权」。</b><b>于是整项的期望可以写成 E[ρ_{t:T−1}G_t] = E[G̃_t]，其中<b>G̃_t = ρ_{t:t}R_{t+1} + γρ_{t:t+1}R_{t+2} + γ²ρ_{t:t+2}R_{t+3} + ⋯ + γ^{T−t−1}ρ_{t:T−1}R_T</b>。</b><b>由此得到 (5.15)：V(s) ≐ Σ_{t∈T(s)} G̃_t / |T(s)|，它与 (5.5) 有<b>相同的无偏期望</b>（首次访问情形），而「我们<b>可以期待</b>它有时方差更低」。</b>", "<b>⚠ 但这一节结尾有一个书自己承认的空洞，对你尤其重要。</b> <span class='w'><b>「有没有<b>加权</b>重要性采样的逐决策版本？<b>这就不那么清楚了</b>。到目前为止，我们所知道的<b>所有</b>为此提出的估计量<b>都不是相合的</b>（也就是说，<b>即使数据无穷也不收敛到真值</b>）。」</b></span><b>⇒ 于是你面临一个取舍：<b>加权</b>（方差有界、实践推荐）与<b>逐决策</b>（去掉无关因子）<b>目前无法兼得</b>。习题 5.14 让读者去改造 (5.10)，但那是折扣感知版、不是逐决策版。</b>"], "eq": "与上一节的分工：\n   5.8 折扣感知   靠 γ < 1 才有效（γ = 1 时**无效果**）\n   5.9 逐决策     **即使 γ = 1 也可能降低方差**  ← γ=1 的问题只能用这节\n\n出发点（5.11）—— 把乘积**分配**到每个奖励上：\n   ρ_{t:T−1} G_t = ρ_{t:T−1}R_{t+1} + γρ_{t:T−1}R_{t+2} + ⋯ + γ^{T−t−1}ρ_{t:T−1}R_T\n\n观察第一个子项（5.12）：\n   ρ_{t:T−1}R_{t+1} = [π(A_t|S_t)/b(A_t|S_t)] ·\n                      [π(A_{t+1}|S_{t+1})/b(A_{t+1}|S_{t+1})] ⋯ · R_{t+1}\n   ⚠ 只有**第一个**和**最后一个（奖励）**相关；\n      其余都是发生在那个奖励**之后**的事件\n\n关键的一行（5.13）：\n                        π(a|S_k)\n   E[π/b] ≐ Σ_a b(a|S_k) ───────  =  Σ_a π(a|S_k)  =  **1**\n                        b(a|S_k)\n   ⚠ 期望在**行为策略 b** 下取 ⇒ b 把分母约掉 ⇒ π 求和 = 1\n      「期望为 1」是**概率归一化**的直接后果\n\n结论（5.14 及一般形式）：\n   E[ρ_{t:T−1} R_{t+1}]   = E[ **ρ_{t:t}**     R_{t+1}]\n   E[ρ_{t:T−1} R_{t+k}]   = E[ **ρ_{t:t+k−1}** R_{t+k}]\n   ⇒ **第 k 个奖励只被「它之前」的那些比值加权**\n\n   G̃_t = ρ_{t:t}R_{t+1} + γρ_{t:t+1}R_{t+2} + γ²ρ_{t:t+2}R_{t+3}\n         + ⋯ + γ^{T−t−1}**ρ_{t:T−1}**R_T        ← 最后一项仍需**全部**比值\n\n   (5.15) V(s) ≐ Σ_{t∈T(s)} G̃_t / |T(s)|\n          与 (5.5) **相同的无偏期望**（首次访问），「**可以期待**有时方差更低」\n\n⚠⚠ 书承认的空洞：\n   「有没有**加权**重要性采样的逐决策版本？**这就不那么清楚了**。\n     到目前为止我们所知的**所有**这类估计量**都不是相合的**\n     （**即使数据无穷也不收敛到真值**）」\n   ⇒ **加权**（方差有界）与**逐决策**（去无关因子）**目前无法兼得**", "tbl": {"head": ["奖励的位置", "逐决策 IS 需要的比值", "省掉了多少"], "rows": [["R_{t+1}（第 1 个）", "<b>ρ_{t:t}</b>，只有 1 个因子", "<b>省掉 T−t−1 个</b>"], ["R_{t+k}（第 k 个）", "<b>ρ_{t:t+k−1}</b>，k 个因子", "省掉 T−t−k 个"], ["R_T（终局，k = T−t）", "<b>ρ_{t:T−1}</b>，<b>全部</b>因子", "<span class='w'>一个都省不掉</span>"], ["⇒ 对逐步产生奖励的问题", "<b>大量节省</b>", "—"], ["⇒ 对只有终局奖励的问题", "<span class='w'>完全没有节省</span>", "<b>算术上等同于轨迹 IS</b>"], ["⚠ 加权版", "<b>目前所有提案都不相合</b>", "——即使数据无穷也不收敛"]]}, "res": {"tag": "已核", "ref": "原书 5.9 节 (5.11)–(5.15) 与末段（逐式逐句核对）· 简报 §4e「per-decision IS 对准确率这一半买不到任何东西（奖励在 t=H，算术上等同于轨迹 IS），只对成本那一半有用」", "v": "<b>简报 §4e 那条判断，在这一节得到了<b>逐式的确认</b>——而且书还顺带给出了一个你当时没写进去的、更麻烦的后果。</b><br><span class='k'><b>你的原话：「per-decision IS 对准确率这一半<b>买不到任何东西</b>（奖励在 t=H，算术上等同于轨迹 IS），<b>只对成本那一半有用</b>。」</b></span><br><b>书的依据：E[ρ_{t:T−1} R_{t+k}] = E[<b>ρ_{t:t+k−1}</b> R_{t+k}]。</b><span class='w'><b>第 k 个奖励只需要它<b>之前</b>的比值。</b></span><b>⇒ 终局奖励 R_T 的 k = T−t，需要的是 ρ_{t:T−1}——<b>全部</b>比值，一个都省不掉。<b>你的判断完全正确，而且这是算术恒等式，不是经验观察。</b></b><br><b>两条此前没算进去的：</b><br>① ⭐ <b>成本那一半能省多少，现在可以精确算了。</b><span class='k'><b>成本是<b>逐节点</b>产生的：第 j 个节点的成本只需要 ρ_{t:t+j−1}，即 j 个因子。</b></span><b>k 个决策节点、均匀二选一时，第 j 项的权重上界是 2^j 而不是 2^k。</b><b>⇒ 总方差从「k 项全按 2^k 加权」降到「第 j 项按 2^j 加权」——<b>前面的节点几乎不受惩罚，惩罚集中在最后几项</b>。</b><span class='w'><b>⚠ 这和上一页那条「只从尾巴学」正好<b>方向相反</b>：估<b>值</b>时靠后的节点数据多，而逐决策 IS 的<b>权重</b>惩罚也集中在靠后。两件事都指向同一个结论：<b>管道后段是信息最密、也最需要小心的地方</b>。</b></span><br>② ⚠ <b>但有一个坏消息，书写得很明确，你的简报里没有：</b><span class='w'><b>「有没有<b>加权</b>重要性采样的逐决策版本？这就不那么清楚了。到目前为止我们所知的<b>所有</b>这类估计量<b>都不是相合的</b>——即使数据无穷也不收敛到真值。」</b></span><br><b>⇒ 这意味着你<b>不能</b>同时要「加权」（方差有界、5.5 节强烈推荐）和「逐决策」（去掉无关因子）。必须二选一，或者去查这一条是否已被 2018 年之后的工作解决。</b><span class='k'><b>这是一个具体的、可执行的文献检索任务，而且它直接影响你成本那一半的估计量选择。</b></span>"}},
{"r": [26, 26], "t": "⭐ 小结里那条第四优势：不自举，于是对马尔可夫性被破坏不那么敏感", "star": 3, "quote": "<em>A <b>fourth advantage</b> of Monte Carlo methods … is that <b>they may be less harmed by violations of the Markov property</b>. This is because <b>they do not update their value estimates on the basis of the value estimates of successor states</b>. In other words, <b>it is because they do not bootstrap</b>.</em><br><em>Ordinary importance sampling produces unbiased estimates, but has larger, possibly infinite, variance, whereas <b>weighted importance sampling always has finite variance and is preferred in practice</b>. <b>Despite their conceptual simplicity, off-policy Monte Carlo methods … remain unsettled and are a subject of ongoing research.</b></em>", "one": "<b>小结把蒙特卡洛相对动态规划的优势列成四条，前三条前面都见过。第四条是新的，而且分量不小：因为不自举，它对「马尔可夫性被破坏」不那么敏感。</b>", "pts": ["<b>前三条优势是前面各节的归总，顺序值得记。</b> <span class='k'><b>① 可以<b>直接从与环境的交互</b>中学最优行为，<b>完全不需要环境动力学的模型</b>。</b></span><span class='k'><b>② 可以配合<b>模拟或样本模型</b>使用——「对多得出奇的应用来说，<b>模拟样本幕很容易，而构造 DP 所需的那种显式转移概率模型却很难</b>」。</b></span><span class='k'><b>③ <b>容易且高效地把注意力集中在状态的一个小子集上</b>：「一个<b>特别关注的区域</b>可以被精确评估，<b>而不必付出精确评估其余状态集合的代价</b>」（第 8 章会进一步探讨）。</b></span>", "<b>⚠ 第四条是本页的新东西，而且它的论证只有一句话。</b> <span class='w'><b>「蒙特卡洛方法的<b>第四个优势</b>……是它们<b>可能较少受到「马尔可夫性被破坏」的伤害</b>。这是因为<b>它们不以后继状态的值估计为依据来更新自己的值估计</b>。换句话说，是因为<b>它们不自举</b>。」</b></span><b>⚠ 注意措辞是 may be less harmed，不是「不受影响」——这是一个程度判断，不是定理。</b>", "<b>把这条的逻辑补全：为什么不自举就不怕非马尔可夫？</b> <span class='k'><b>自举的做法是「用 v̂(S_{t+1}) 去更新 v̂(S_t)」，而这一步<b>隐含假设 S_{t+1} 这个标签足以概括未来</b>——这正是马尔可夫性。</b></span><b>如果状态表示不完整（真实的未来还依赖没被记进状态的东西），那么 v̂(S_{t+1}) 就是一个对错误对象的估计，而这个错误会沿着自举链一路传开。</b><span class='w'><b>蒙特卡洛不碰 v̂(S_{t+1})：它直接用<b>这一幕实际拿到的回报</b>。回报是真实发生的，不管状态标签是否完整。</b></span>", "<b>控制方法部分的归总，把三种探索安排并排放了一次。</b> <b>「维持足够的探索是蒙特卡洛控制方法的一个问题。<b>只选当前估计最好的动作是不够的</b>，因为那样就拿不到其他动作的回报，也就<b>可能永远学不到它们其实更好</b>。」</b><span class='k'><b>试探性出发：「在用模拟幕的应用里<b>有时可以安排</b>，但在从<b>真实经验</b>学习时<b>不太可能</b>」。</b></span><span class='k'><b>在策：「智能体<b>承诺永远探索</b>，并试图找到<b>仍在探索的策略当中</b>最好的那个」。</b></span><span class='k'><b>离策：「智能体也探索，但学的是一个<b>确定性的最优策略</b>，它<b>可能与所遵循的策略毫无关系</b>」。</b></span>", "<b>离策预测的归总把两个估计量的账又结了一次，措辞比 5.5 节更干脆。</b> <b>「普通重要性采样给出<b>无偏</b>估计，但有<b>更大的、可能无穷的</b>方差；<span class='w'><b>而加权重要性采样<b>总是有有限方差</b>，实践中更受偏爱。」</b></span><b>⚠ 注意这里说的是 always has finite variance——比 5.5 节那个「最大权重是 1」的说法更直接。</b><b>而接下来那句自评值得记住：「<b>尽管概念上简单，离策蒙特卡洛方法（预测与控制两方面）<b>仍未定型</b>，是<b>正在进行的研究课题</b></b>。」</b>", "<b>最后书把本章与动态规划的两条差别<b>解耦</b>了，这一点是下一章的伏笔。</b> <span class='k'><b>「本章的蒙特卡洛方法与上一章的 DP 方法有<b>两大</b>差别。第一，它们在<b>样本经验</b>上运作，因而可以<b>无模型</b>地直接学习。第二，它们<b>不自举</b>。」</b></span><span class='w'><b>「<b>这两个差别并非紧密相连，是可以分开的。</b>下一章我们将考虑这样一类方法：它们像蒙特卡洛一样<b>从经验学</b>，但也像 DP 一样<b>自举</b>。」</b></span><b>⇒ 把「无模型」和「不自举」当成两个独立的轴，是读第 6 章（时序差分）的正确姿势。</b>"], "eq": "蒙特卡洛相对动态规划的**四条**优势：\n   ① 直接从**与环境的交互**学最优行为，**完全不需要模型**\n   ② 可配合**模拟或样本模型**——「模拟样本幕容易，\n      而构造 DP 所需的显式转移概率模型很难」\n   ③ **容易且高效地聚焦于状态的一个小子集**——\n      「特别关注的区域可被精确评估，**不必付出评估其余状态的代价**」\n   ④ ⭐ **可能较少受「马尔可夫性被破坏」的伤害**\n      理由只有一句：**它们不以后继状态的值估计为依据来更新**\n                    ——换句话说，**因为它们不自举**\n      ⚠ 措辞是 **may be less harmed**，是程度判断不是定理\n\n   第④条的逻辑补全：\n      自举 = 用 v̂(S_{t+1}) 更新 v̂(S_t)\n           ⇒ **隐含假设 S_{t+1} 这个标签足以概括未来**（即马尔可夫性）\n      状态表示不完整时，v̂(S_{t+1}) 是对**错误对象**的估计，\n      而错误会**沿自举链一路传开**\n      蒙特卡洛直接用**这一幕实际拿到的回报** —— 回报是真实发生的，\n      **不管状态标签是否完整**\n\n三种探索安排：\n   试探性出发  「用模拟幕时**有时可以安排**，\n                从**真实经验**学习时**不太可能**」\n   在策        「智能体**承诺永远探索**，\n                找**仍在探索的策略当中**最好的那个」\n   离策        「也探索，但学的是一个**确定性的最优策略**，\n                它**可能与所遵循的策略毫无关系**」\n\n两个估计量的账（比 5.5 节更干脆的措辞）：\n   普通 IS  **无偏**，但方差**更大、可能无穷**\n   加权 IS  **总是有有限方差**（always has finite variance），实践中更受偏爱\n   ⚠ 自评：「尽管概念上简单，离策蒙特卡洛方法（预测与控制）\n            **仍未定型**，是**正在进行的研究课题**」\n\n⭐ 与 DP 的两条差别，**可以分开**：\n   ① 在**样本经验**上运作 ⇒ **无模型**\n   ② **不自举**\n   「这两个差别**并非紧密相连，是可以分开的**」\n   ⇒ 下一章：像 MC 一样**从经验学**，但像 DP 一样**自举**（时序差分）", "tbl": {"head": ["", "动态规划", "蒙特卡洛", "时序差分（下一章）"], "rows": [["要模型吗", "<b>要</b>（完整分布）", "<b>不要</b>", "<b>不要</b>"], ["自举吗", "<b>自举</b>", "<span class='k'>不自举</span>", "<b>自举</b>"], ["对非马尔可夫", "<span class='w'>敏感</span>", "<b>可能较少受害</b>", "<span class='w'>敏感</span>"], ["能聚焦小子集吗", "<span class='w'>不能，要全扫</span>", "<b>能</b>", "—"], ["⇒ 两条差别", "—", "<b>并非紧密相连，可以分开</b>", "<b>正是分开后的另一种组合</b>"]]}, "res": {"tag": "推断", "ref": "原书 5.10 小结（逐句核对）· 简报 §5「可加性检验 · MDP 框架必须被实验挣得」· 简报 §8「难度是 query 的属性，还是三元组的属性」· 简报 §4d 穷举 oracle", "v": "<b>第四条优势——「不自举，于是对马尔可夫性被破坏不那么敏感」——恰好对上你那个「可能根本不是 MDP」的处境，而且它给了一个<b>不必先回答那个问题</b>的做法。</b><br><span class='k'><b>你的处境（简报 §5）：MDP 框架必须被实验挣得，不能预设；而可加性检验的结果要到第 2 周才有。</b></span><span class='w'><b>问题是：在那之前你总得先做点什么，而「先做什么」通常会隐含一个形式化选择。</b></span><br>⇒ <b>本页给了一个出路：<b>蒙特卡洛式的估计不需要你先决定这个问题</b>。</b><br><b>因为它不自举，它<b>从不假设「(query, 节点 id) 这个标签足以概括未来」</b>——它只是把实际跑出来的终局回报记下来、平均。</b><span class='k'><b>⇒ 即使你的状态表示严重不完整（P2 混叠、难度其实依赖部分轨迹），蒙特卡洛的估计<b>仍然是对「在这个表示下、在这个行为分布下的真实平均回报」的无偏估计</b>。它估的东西可能不是你最终想要的，但它<b>不会悄悄地错</b>。</b></span><br><b>三条：</b><br>① ⭐ <b>这为「先用蒙特卡洛/oracle，后决定形式化」提供了正当性。</b><b>简报 §4d 的穷举 oracle 本质上就是一个纯蒙特卡洛估计（而且是真值）。</b><b>按本页，它<b>不依赖</b>马尔可夫假设——所以你可以先把它做出来，再用它的数据去回答「这问题是不是 MDP」。<b>顺序上没有循环依赖。</b></b><br>② ⚠ <b>反过来，这条也是对 FQE 的一个警告。</b><span class='w'><b>FQE 是<b>自举</b>的（它用后继状态的拟合值做回归目标）。按本页的逻辑，<b>一旦你的状态表示不完整，FQE 的误差会沿自举链传开</b>，而蒙特卡洛不会。</b></span><b>⇒ 若你同时跑 FQE 与 oracle，两者的差距里<b>既有估计误差也有表示不完整的代价</b>，而本页提示这两部分可以用「换成不自举的估计量看差距变不变」来分离。<b>这是一个具体的、可做的消融。</b></b><br>③ <b>第三条优势「聚焦小子集」在小结里被再次强调，并指向第 8 章。</b><span class='k'><b>「一个特别关注的区域可以被精确评估，而不必付出评估其余状态的代价」。</b></span><b>你已经读过第 8 章（规划与学习）——那里的 rollout 与 MCTS 正是这条的展开。<b>两章合起来支持同一个判断：在你付得起的规模上，针对性地精确评估少数配置，优于在全空间上做一个粗估计。</b></b>"}},
{"r": [27, 27], "t": "文献注：重要性采样与因果推断是同一件事的两个名字", "star": 2, "quote": "<em>Efficient off-policy learning has become recognized as an important challenge that arises in <b>several fields</b>. For example, it is <b>closely related to the idea of “interventions” and “counterfactuals” in probabilistic graphical (Bayesian) models</b> (e.g., Pearl, 1995; Balke and Pearl, 1994). <b>Off-policy methods using importance sampling have a long history and yet still are not well understood.</b></em><br><em><b>Weighted importance sampling, which is also sometimes called normalized importance sampling</b> (e.g., Koller and Friedman, 2009) …</em>", "one": "<b>这一页最值钱的一条是：书明确把离策学习接到了 Pearl 的干预与反事实上。另外它给了「加权重要性采样」的两个别名，以及逐决策 IS 的出处。</b>", "pts": ["<b>先看「蒙特卡洛」这个词的来历，它比想象的晚。</b> <span class='k'><b>「『Monte Carlo』这个词源自 1940 年代，当时洛斯阿拉莫斯的物理学家设计了一些可以研究的<b>机会游戏</b>，以帮助理解与原子弹相关的复杂物理现象。」</b></span><b>这个意义上的蒙特卡洛方法在若干教科书里有覆盖（Kalos and Whitlock, 1986；Rubinstein, 1981）。</b>", "<b>5.1–2 条目把本章几个例子的出处都交代了，其中一个值得单独记。</b> <b>Singh and Sutton (1996) 区分了每次访问与首次访问 MC，并证明了把这些方法与强化学习算法联系起来的结果。</b><span class='k'><b>二十一点例子基于 Widrow, Gupta, and Maitra (1973)；<b>肥皂泡例子是一个经典的<b>狄利克雷问题</b></b>，它的蒙特卡洛解法最早由Kakutani (1945) 提出（另见 Hersh and Griego, 1969；Doyle and Snell, 1984）。</b></span><b>⚠ 还有一条对「为什么蒙特卡洛在大问题上算得过 DP」的引用：Barto and Duff (1994) 在「用经典蒙特卡洛算法解线性方程组」的语境下讨论了策略评估，并用 <b>Curtiss (1954)</b> 的分析指出了蒙特卡洛策略评估<b>在大问题上的计算优势</b>。</b>", "<b>5.3–4 条目里有一条关于本书自身的历史。</b> <span class='k'><b>「Monte Carlo ES 是在本书 <b>1998 年版</b>中引入的。那<b>可能是蒙特卡洛估计与基于策略迭代的控制方法之间的<b>第一个显式联系</b></b>。」</b></span><b>更早在强化学习语境下用蒙特卡洛估计动作值的是 Michie and Chambers (1968)：在倒立摆上，他们<b>用各幕持续时间的平均</b>来评估每个状态下每个动作的价值（期望的平衡「寿命」），再用这些评估来控制动作选择。</b><b>「他们的方法在精神上类似于配合每次访问 MC 估计的 Monte Carlo ES。」</b><b>另有 Narendra and Wheeler (1986)。</b>", "<b>⭐ 5.5 条目是这一页最值钱的部分，它把离策学习接到了另一个领域。</b> <span class='w'><b>「<b>高效的离策学习已被认识到是一个在<b>若干领域</b>都出现的重要挑战</b>。例如，它<b>与概率图（贝叶斯）模型中『<b>干预</b>』与『<b>反事实</b>』的想法密切相关</b>（例如 Pearl, 1995；Balke and Pearl, 1994）。</b></span><span class='w'><b>「<b>用重要性采样的离策方法有很长的历史，然而至今仍未被很好地理解</b>。」</b></span><b>⚠ 这句自评和小结里那句「仍未定型」是一对，分量不轻。</b>", "<b>同一条目还给了两个很实用的<b>别名</b>，不知道会检索不到。</b> <span class='k'><b>①「<b>加权重要性采样</b>，有时也叫<b>归一化重要性采样</b>（normalized importance sampling，例如 Koller and Friedman, 2009）」。</b></span><b>相关讨论见 Rubinstein (1981)、Hesterberg (1988)、Shelton (2001)、Liu (2001)。</b><span class='k'><b>②「离策学习里的<b>目标策略</b>，在文献中有时被称作『<b>estimation 策略</b>』——本书<b>第一版</b>里就是这么叫的。」</b></span>", "<b>最后两节的出处，正好对应前两条 note。</b> <b>5.8 折扣感知 IS：「我们对这个想法的处理基于 Sutton, Mahmood, Precup, and van Hasselt (2014) 的分析。<b>到目前为止它被 Mahmood (2017; Mahmood, van Hasselt, and Sutton, 2014) 展开得最充分</b>。」</b><span class='k'><b>5.9 逐决策 IS：「由 <b>Precup, Sutton, and Singh (2000)</b> 引入。他们还把离策学习与<b>时序差分学习、资格迹、逼近方法</b>结合起来，引出了一些<b>微妙的问题</b>，我们在后面的章节里考虑。」</b></span><b>⚠ 「微妙的问题」这个说法配上 5.9 节末尾那句「所有已知的逐决策加权估计量都不相合」，提示这条线上有真正未解决的东西。</b>"], "eq": "按「对你有没有用」分类：\n\n⭐ **最值钱的一条（5.5 条目）**\n   离策学习 ↔ **Pearl 的「干预」与「反事实」**\n      Pearl (1995) · Balke and Pearl (1994)\n   「用重要性采样的离策方法有**很长的历史**，\n     然而**至今仍未被很好地理解**」\n\n⭐ **两个别名（不知道会检索不到）**\n   加权重要性采样 = **归一化重要性采样**\n      （normalized importance sampling；Koller and Friedman, 2009）\n      另见 Rubinstein (1981) · Hesterberg (1988) · Shelton (2001) · Liu (2001)\n   目标策略 = **「estimation 策略」**（本书第一版的叫法）\n\n⭐ **前两条 note 的出处**\n   5.8 折扣感知 IS   Sutton, Mahmood, Precup & van Hasselt (2014)\n                     **展开得最充分：Mahmood (2017)**\n   5.9 逐决策 IS     **Precup, Sutton & Singh (2000)**\n                     他们还把离策与 **TD / 资格迹 / 逼近方法**结合，\n                     「引出了一些**微妙的问题**」\n\n○ **本章例子的出处**\n   首次/每次访问之分   Singh and Sutton (1996)\n   二十一点            Widrow, Gupta & Maitra (1973)\n   肥皂泡              经典**狄利克雷问题**；MC 解法最早 Kakutani (1945)\n   Monte Carlo ES      本书 **1998 年版**引入 ——\n                       「可能是 MC 估计与基于策略迭代的控制之间的\n                         **第一个显式联系**」\n   更早的动作值估计    Michie and Chambers (1968)：倒立摆上\n                       **用各幕持续时间的平均**评估动作\n   「Monte Carlo」一词 1940 年代洛斯阿拉莫斯的**机会游戏**\n\n○ **「为什么大问题上 MC 算得过 DP」的引用**\n   Barto and Duff (1994)，用 **Curtiss (1954)** 的分析", "tbl": {"head": ["线索", "文献", "对你的用处"], "rows": [["<b>离策 ↔ 因果推断</b>", "Pearl (1995) · Balke &amp; Pearl (1994)", "<b>⭐ 把你的 OPE 工作接到因果推断文献上</b>"], ["<b>加权 IS 的别名</b>", "normalized importance sampling（Koller &amp; Friedman, 2009）", "<b>⭐ 检索时必须两个名字都试</b>"], ["<b>逐决策 IS 的出处</b>", "Precup, Sutton &amp; Singh (2000)", "<b>⭐ 5.9 节的原始文献；还结合了 TD 与资格迹</b>"], ["折扣感知 IS", "Sutton 等 (2014)；<b>Mahmood (2017)</b> 展开最充分", "<span class='w'>γ = 1 时无效，你用不上</span>"], ["目标策略的旧称", "「estimation 策略」（本书第一版）", "读老文献时别认错"], ["⚠ 书的自评", "「有很长的历史，<b>却仍未被很好地理解</b>」", "—"]]}, "res": {"tag": "已核", "ref": "原书 p27 文献与历史注（逐条核对）· bridge-threads [0] OPE / batch RL · 简报 §6 抢占风险表 · 简报 §8 开放问题", "v": "<b>「离策学习与 Pearl 的干预、反事实密切相关」这一句，是你在相关工作一节里可以用来<b>扩大引用面</b>的一条教科书依据。</b><br><span class='k'><b>书的原话：「高效的离策学习已被认识到是一个在<b>若干领域</b>都出现的重要挑战。例如，它与概率图（贝叶斯）模型中『干预』与『反事实』的想法<b>密切相关</b>（Pearl, 1995；Balke and Pearl, 1994）。」</b></span><br>⇒ <b>两条用法：</b><br>① ⭐ <b>你的 ACL/NLP 审稿人未必熟悉 RL 的 OPE 文献，但<b>多半熟悉因果推断</b>。</b><span class='k'><b>把「节点级保真度分配的离策评估」同时用因果推断的语言描述一次（「每个节点的档位选择是一次<b>干预</b>；我们要估的是<b>反事实</b>准确率」），可以让方法对另一半读者可读。</b></span><b>而且这<b>不是</b>你在攀关系——是 Sutton & Barto 自己写下的联系，可以直接引。</b><br>② <b>它也提示了一个检索方向：倾向性得分、deficient support、overlap 这些词在因果推断那边有独立的、更成熟的文献。</b><span class='w'><b>⚠ 简报 §4a 用的「deficient support」正是因果推断的术语（Sachdeva/Su/Joachims），而 §6 的抢占风险表里全是 NLP 的论文。<b>这两边的文献你都要覆盖，而本页给了把它们并置的正当理由。</b></b></span><br><b>另外两条实际的：</b><br><b>· <b>「归一化重要性采样」这个别名必须记住。</b></b><span class='k'><b>统计与机器学习文献里（Koller and Friedman, 2009 等）用的是这个名字，只检索 weighted importance sampling 会漏掉一大片。</b></span><br><b>· <b>Precup, Sutton & Singh (2000) 值得真的去读一遍</b>，不只是因为它是逐决策 IS 的出处。</b><span class='w'><b>书说他们「还把离策学习与<b>时序差分学习、资格迹、逼近方法</b>结合起来，引出了一些<b>微妙的问题</b>」。</b></span><b>配上 5.9 节末尾那句「所有已知的逐决策<b>加权</b>估计量都不相合」，这条线上确实有未解决的东西——而你恰好需要「加权 + 逐决策」那个组合。<b>这是一个值得确认现状的具体问题，而不是泛泛的「多读文献」。</b></b>"}}
];

var TH = {"title": "第 5 章接上课题的哪一段：你那个问题的教科书名字，和一条算术恒等式", "arc": "<b>这一章比第 13 章更直接地压在你的课题上——5.5 到 5.9 整整六页就是离策评估，也就是 bridge-thread 0 的正题。它给你的东西有五件，而且其中两件是<b>确认</b>而不是新信息：你此前的判断是对的，现在有了逐式的依据。</b><br><br><b>① 你那个问题有教科书名字：<b>覆盖假设</b>。</b> <span class='k'><b>π(a|s) > 0 ⟹ b(a|s) > 0。</b></span><b>而真正有用的是它的<b>精确范围</b>：书说由覆盖推出「<b>在 b 与 π 不相同的那些状态上</b>，b 必须是随机的」——<span class='w'><b>不是「b 处处必须随机」。</b></span><b>⇒ 简报 §4c 那个「只随机化 top k=3~4 个节点、其余钉死」因此<b>不是</b>一个为省样本而牺牲覆盖的妥协：只要你把候选策略类<b>限定</b>在「只在那 k 个节点上与基线不同」，覆盖就是<b>完全满足</b>的。<b>关键在于先限定策略类，再谈覆盖。</b></b><b>而且书明说目标策略<b>可以是确定性的</b>，「这正是控制应用中特别值得关注的情形」——你上线的路由器不必随机，需要随机的只有采数据的那个。</b><br><br><b>② 你的可加性检验，测的是书对 MDP 的<b>定义</b>本身。</b> <span class='k'><b>5.1 节开篇：MDP = 多个状态，每个像一个<b>上下文老虎机</b>，而这些老虎机<b>互相关联</b>；「关联」的确切含义是<b>回报依赖同一幕里下游所采取的动作</b>。</b></span><b>⇒ 简报 §5 的 Week 2 实验量的正是这个关联。<b>可加性成立 = 老虎机之间没有关联 = 按书的定义，这不是 MDP。</b>你可以引 Sutton & Barto 来说明这个检验在测什么，而不必自己定义「可加性」。</b><br><br><b>③ 简报 §4e 那条关于逐决策 IS 的判断，得到了<b>算术上的</b>确认。</b> <b>你写的是「per-decision IS 对准确率这一半买不到任何东西（奖励在 t=H），只对成本那一半有用」。</b><span class='k'><b>书的依据是 (5.14) 的一般形式：E[ρ_{t:T−1} R_{t+k}] = E[<b>ρ_{t:t+k−1}</b> R_{t+k}]——第 k 个奖励只被<b>它之前</b>的比值加权。</b></span><span class='w'><b>终局奖励的 k = T−t，需要的是<b>全部</b>比值，一个都省不掉。你的判断完全正确。</b></span><b>而成本那一半能省多少现在也能精确算：第 j 个节点的成本只需 j 个因子，权重上界是 2^j 而非 2^k，<b>惩罚集中在最后几项</b>。</b><b>⚠ 顺带一条坏消息，你的简报里没有：书说「所有已知的<b>加权</b>+<b>逐决策</b>估计量<b>都不相合</b>」——两者目前无法兼得。</b><br><br><b>④ 「只从幕的尾巴学」：你的 ESS 不是均匀地小，是<b>沿管道位置倾斜</b>的。</b> <span class='w'><b>离策 MC 控制只有当「这一幕剩下的所有动作都是贪心的」时才学得到，「对出现在长幕<b>靠前部分</b>的状态尤其」慢。</b></span><b>⇒ 第 j 个决策节点的匹配率是 2^(−(j−1))：<b>最后一个节点匹配率为 1，越靠前越指数级地少</b>。<b>这条应该直接进你的实验设计：按节点位置分别报 ESS，而不是只报一个全局数。</b>而且它改变了 §4c 的取舍——同样敏感度的两个节点，<b>靠后的那个数据效率高得多</b>。</b><br><br><b>⑤ 蒙特卡洛<b>不自举</b>，于是「对马尔可夫性被破坏不那么敏感」。</b> <span class='k'><b>小结的第四条优势，论证只有一句：它们不以后继状态的值估计为依据来更新。</b></span><b>⇒ 这给了「先做 oracle、后定形式化」一个正当性：<b>蒙特卡洛式的估计不需要你先回答「这是不是 MDP」</b>。即使 P2 表示严重混叠，它仍是对「在这个表示下的真实平均回报」的无偏估计——<b>估的可能不是你最终想要的，但它不会悄悄地错</b>。</b><span class='w'><b>反过来这也是对 FQE 的警告：FQE <b>是</b>自举的，表示不完整时误差会沿自举链传开。</b></span>", "pitfalls": [{"v": "<b>拿 Example 5.5 的无穷方差来论证自己的困难——那是引错了病例。</b> <span class='w'><b>书那个例子的病根是「<b>轨迹里有环</b>」：幕可以任意长，ρ 可以任意大，而幕的概率衰减（0.9^k）跑不过比值平方的增长 ⇒ 0.2 Σ 1.8^k 发散。</b></span><span class='k'><b>你的管道<b>没有环</b>：H 固定、轨迹条数有限、ρ 取值有限（均匀行为策略下匹配的恰为 2^k、不匹配的为 0）⇒ <b>你的方差是有限的</b>。</b></span><b>你的病是 <b>ESS = n·2^(−k)</b>，不是方差无穷。</b><b>⚠ 熟悉这一章的审稿人会看出「有限时域、无环」不会有无穷方差，从而怀疑你没搞清自己的处境。该引的是<b>覆盖假设</b>与<b>「加权 IS 只对一致的回报取平均」</b>——两者合起来正好推出 ESS = 匹配样本数。</b>", "tag": "推断", "ref": "原书 Example 5.5 与 p18 计算（逐式核对）· 简报 §4b"}, {"v": "<b>只报一个全局 ESS，不按节点位置拆。</b> <span class='k'><b>离策 MC「只从幕的尾巴学」：第 j 个决策节点的可用数据取决于「它<b>之后</b>的节点有没有全部匹配」，匹配率是 2^(−(j−1))。</b></span><span class='w'><b>⇒ 最后一个节点匹配率为 1，倒数第二个 1/2，越靠前越指数级地少。</b></span><b>报一个平均数会同时高估前段、低估后段。</b><b>⇒ 正确做法：<b>按节点位置分别报 ESS</b>，并在方法节引 Sutton & Barto §5.7 说明原因。</b><b>⚠ 这还有一个设计上的推论：随机化节点应尽量<b>集中在管道后段</b>，前段按敏感度扫描钉死——既满足覆盖（前段 π = b），又最大化数据效率。</b>", "tag": "推断", "ref": "原书 5.7 节（逐句核对）· 简报 §4b §4c"}, {"v": "<b>想同时要「加权」和「逐决策」。</b> <span class='w'><b>书写得很明确：「有没有<b>加权</b>重要性采样的<b>逐决策</b>版本？这就不那么清楚了。到目前为止我们所知的<b>所有</b>这类估计量<b>都不是相合的</b>——即使数据无穷也不收敛到真值。」</b></span><span class='k'><b>而 5.5 节又说加权版「总是有有限方差，实践中更受偏爱」，5.9 节说逐决策能去掉无关因子。<b>两个好处目前无法兼得。</b></b></span><b>⇒ 你必须二选一，<b>或者</b>去确认这一条是否已被 2018 年之后的工作解决。这是一个具体的检索任务，而且它直接决定你<b>成本那一半</b>的估计量选择（准确率那一半用不上逐决策，所以不受影响）。</b>", "tag": "已核", "ref": "原书 5.9 节末段（逐字核对）· 5.5 节 · 5.10 小结"}, {"v": "<b>指望 5.8 的折扣感知 IS 来降方差。</b> <span class='w'><b>书的末句：「它们把折扣率考虑进去，<b>但在 γ = 1 时没有任何效果</b>（与 5.5 节的离策估计量相同）」。</b></span><span class='k'><b>而你的 G = Acc − λ·Cost <b>没有自然的折扣</b>——一条 query 里第三个节点的成本不该比第一个打折，γ = 1。</b></span><b>⇒ (5.9)(5.10) 你用不上，不必花时间读 Mahmood (2017) 那条线。</b><b>⚠ 但那一节有一条<b>可复用的诊断原则</b>要带走：「这些因子与回报<b>独立</b>、期望为 <b>1</b>；不改变期望，却极大增加方差」。凡是估计量里出现「期望为 1 但不恒为 1 的随机量」，就该问它和被估的量是否真的相关。</b>", "tag": "已核", "ref": "原书 5.8 节末句（逐字核对）"}, {"v": "<b>只检索 “weighted importance sampling”。</b> <span class='k'><b>文献注明说：「加权重要性采样，<b>有时也叫归一化重要性采样</b>（normalized importance sampling，例如 Koller and Friedman, 2009）」。</b></span><b>统计与概率图模型那边用的是后一个名字，只用前一个检索会漏掉一大片（Rubinstein 1981、Hesterberg 1988、Shelton 2001、Liu 2001）。</b><span class='w'><b>⚠ 同理：目标策略在老文献里有时叫「<b>estimation 策略</b>」——这是本书<b>第一版</b>的叫法。</b></span>", "tag": "已核", "ref": "原书 p27 文献注 5.5 条目（逐字核对）"}, {"v": "<b>把「我们完全知道管道的动力学」当成「所以可以用基于模型的方法」。</b> <span class='k'><b>二十一点那一段正面堵了这条：「虽然我们对环境有<b>完全的</b>知识，要用动态规划算这个值函数却<b>并不容易</b>」——因为 DP 要的是<b>显式的概率分布</b>，而把它写出来「<b>往往复杂且容易出错</b>」。</b></span><b>⇒ 你的准确率那一半正是这种情形：原则上你「知道」模型、提示、温度，但写出「这个配置在这条 query 上答对的概率」的显式分布，和算二十一点那个 p 是同一类事。</b><span class='w'><b>这给了你一个<b>不基于「我们不知道」</b>的理由来为采样辩护——审稿人问「你们自己跑的管道，为什么说准确率只有样本模型」时，答案是「显式分布的计算复杂且易错，而采样容易」，而不是「我们不了解模型」。</b></span>", "tag": "已核", "ref": "原书 5.1 节 Example 5.1 之后一段（逐句核对）· 简报 §4e"}, {"v": "<b>把前缀共享的 oracle 结果当成独立样本来算置信区间。</b> <span class='k'><b>首次访问 MC 收敛性的<b>全部依据</b>是「回报<b>独立</b>同分布、方差有限」（大数律 ⇒ 误差标准差按 1/√n 下降）。</b></span><span class='w'><b>而简报 §4d 的 oracle 表<b>跨分支共享前缀</b>（拓扑前缀一致的分支逐字复用节点输出）——这意味着同一条 query 下不同配置的结果<b>不独立</b>。</b></span><b>⇒ 对 oracle 表本身无害（它要的是真值不是估计），但拿这些结果算<b>置信区间</b>时必须<b>按 query 聚类</b>（cluster-robust，或按 query 做 bootstrap），不能当成独立样本。</b><b>这正好接上简报 §7 第 6 拳要的 paired bootstrap CI。</b>", "tag": "推断", "ref": "原书 5.1 节收敛性论证（逐句核对）· 简报 §4d · 简报 §7 第 6 拳"}], "ammo": [{"q": "你们为什么要给节点选择加随机化？这不是故意让线上系统变差吗？", "a": "<b>三点，而且第三点说明上线的系统<b>不会</b>变差。</b><br><b>① 这个要求有教科书名字：<b>覆盖假设</b></b>（Sutton & Barto §5.5）。<span class='k'><b>π(a|s) > 0 必须蕴含 b(a|s) > 0</b></span>——目标策略会选的动作，行为策略也得至少偶尔选到。不满足它，估计量不是方差大，是<b>不存在</b>。<br><b>② 而且更早、更朴素的说法在 §5.2：</b><span class='w'><b>「若 π 是确定性策略，每个状态只观察到<b>一个</b>动作的回报；没有回报可平均，其余动作的估计<b>不会随经验改善</b>。」</b></span><b>这是关于<b>数据本身</b>的陈述，与你用什么估计量无关——所以换估计量绕不过去。</b><br><b>③ <b>上线的策略不必随机。</b></b><span class='k'><b>书明说目标策略「<b>可以是确定性的</b>，事实上这正是控制应用中特别值得关注的情形」。</b></span><b>需要随机的只有<b>采数据</b>的那个行为策略。而且覆盖只要求「在 b 与 π <b>不相同</b>的那些状态上」随机——我们把候选策略类限定在少数几个节点上，<b>其余节点 π = b，确定性是无害的</b>。</b>"}, {"q": "既然有逐决策重要性采样，为什么不用它来降低准确率估计的方差？", "a": "<b>因为它在只有终局奖励时<b>算术上</b>等同于轨迹重要性采样，一点都省不掉。</b><br><span class='k'><b>Sutton & Barto §5.9 的恒等式：E[ρ_{t:T−1} R_{t+k}] = E[<b>ρ_{t:t+k−1}</b> R_{t+k}]</b></span>——第 k 个奖励只被<b>它之前</b>的比值加权。<br><span class='w'><b>我们的准确率是终局奖励（k = T−t），需要的是 <b>全部</b> 比值的连乘，没有任何因子可去。</b></span><br><b>⇒ 但这条对<b>成本</b>那一半<b>确实</b>有用：成本是逐节点产生的，第 j 个节点的成本只需 j 个因子，权重上界是 2^j 而非 2^k。</b><b>这也是我们把目标函数拆成两半分别估计的理由之一：<b>两半能用的方差缩减手段不同</b>。</b><br><b>⚠ 我们也明确不主张什么：</b>我们<b>没有</b>使用「加权 + 逐决策」的组合，因为书指出「所有已知的这类估计量<b>都不是相合的</b>」。"}, {"q": "你们说这个问题可能不是 MDP。那到底是不是？你们凭什么判断？", "a": "<b>我们用一个实验来判断，而这个实验测的正是 Sutton & Barto 对 MDP 的<b>定义</b>本身。</b><br><span class='k'><b>书 §5.1 开篇把 MDP 描述成：多个状态，<b>每个像一个上下文老虎机</b>，而这些老虎机<b>互相关联</b>；「关联」的确切含义是<b>在一个状态采取动作之后的回报，依赖同一幕里后续状态所采取的动作</b>。</b></span><br><b>⇒ 我们的 Week 2 实验直接测这个依赖：对每个节点 h 跑（全强，h 降级）与（全弱，h 升级），比较 Σ_h Δ_h 与 Acc(全强) − Acc(全弱)。</b><span class='w'><b>若在置信区间内一致，则各节点效应可加 = 老虎机之间<b>没有</b>关联 = 按书的定义，这<b>不是</b> MDP，诚实的形式化是每节点代价敏感选择。</b></span><br><b>⚠ 我们不预设框架：MDP 必须被实验挣得。而且两种结论我们都各写一份形式化，用数据选。</b>"}, {"q": "在可以做离策评估的情况下，为什么你们宁可花钱穷举？", "a": "<b>三条，前两条都是书自己给的。</b><br><b>① <b>离策方法「方差更大、收敛更慢」是方法固有的</b></b>（§5.5 原话），不是我们实现得不好。而穷举 oracle <b>不是</b>离策方法——它直接跑目标配置，是<b>在策</b>的。<br><b>② <b>蒙特卡洛的第三条优势正是「聚焦于状态的一个小子集」</b></b>：<span class='k'><b>「估计单个状态的计算量<b>与状态总数无关</b>」，「一个特别关注的区域可以被精确评估，<b>而不必付出评估其余状态的代价</b>」。</b></span><b>当我们关心的那个子集恰好就是全部（k=4 时只有 16 个配置），穷举不是妥协，是这条性质的正确用法。</b><br><b>③ <b>oracle 给的是真值，不是估计</b>——ESS、方差、置信区间这些概念对它都不适用。</b><span class='w'><b>而我们的离策数据有效样本量是 n·2^(−k)，在可行的 n 下置信区间宽到无法区分候选策略。</b></span><b>⚠ 这不是说 OPE 没用：它是我们扩大规模之后唯一的路。但在<b>现在这个规模</b>上，先用真值把问题弄清楚，比在估计量上堆假设更划算。</b>"}, {"q": "你们的有效样本量为什么这么小？是不是数据收集设计有问题？", "a": "<b>不是设计问题，是确定性目标策略下加权重要性采样的<b>定义</b>使然。</b><br><span class='k'><b>书在 Example 5.5 里描述得很清楚：「加权重要性采样算法产生的是<b>只由那些与目标策略一致的回报</b>构成的加权平均」</b></span>——不一致的轨迹 ρ = 0，对分子分母都不贡献。<b>目标策略确定时，这字面上就是拒绝采样。</b><br><b>⇒ 于是 ESS <b>等于</b>匹配轨迹数 m，而 k 个节点均匀二选一时 E[m] = n·2^(−k)。</b><br><span class='w'><b>⚠ 而且它<b>沿管道位置倾斜</b>：离策 MC「只从幕的尾巴学」（§5.7），第 j 个决策节点的匹配率是 2^(−(j−1))——最后一个节点为 1，越靠前越指数级地少。<b>所以我们按节点位置分别报 ESS，而不是报一个平均数。</b></b></span><br><b>可做的改进有两条，我们都做了：<b>降有效时域</b>（k 从 10 到 4，ESS 涨 64 倍），以及<b>把随机化节点集中在管道后段</b>。</b>"}], "papers": [{"t": "Precup, Sutton & Singh — 逐决策重要性采样", "id": "2000（本章 5.9 节的出处）", "why": "⭐ <b>你必须读的那一篇。</b> <span class='k'><b>5.9 节那个恒等式 E[ρ_{t:T−1}R_{t+k}] = E[ρ_{t:t+k−1}R_{t+k}] 出自这里，而它正是你判断「per-decision IS 帮不了准确率那一半」的依据。</b></span><b>⚠ 书还说他们「把离策学习与<b>时序差分、资格迹、逼近方法</b>结合起来，引出了一些<b>微妙的问题</b>」——配上 5.9 节末尾那句「所有已知的逐决策<b>加权</b>估计量都不相合」，<b>这条线上有真正未解决的东西，而你恰好需要那个组合。</b></b>"}, {"t": "Precup, Sutton & Dasgupta — 加权重要性采样的方差", "id": "2001（本章 5.5 节引用）", "why": "<b>那个强结论的出处：<b>假设回报有界</b>，加权重要性采样估计量的方差收敛到零，<b>即使比值本身的方差是无穷的</b>。</b> <span class='w'><b>⚠ 前提是<b>回报有界</b>。你的 G = Acc − λ·Cost：Acc ∈ [0,1] 有界，<b>而 Cost 的上界取决于你有没有给 token 数设上限</b>。</b></span><b>若某配置可能产生极长输出（自洽采样 k=8 配长推理），Cost 实际是重尾的，这个前提需要你自己保证——<b>设 max_tokens，并在论文里写明</b>。</b>"}, {"t": "Pearl — 干预与反事实 · Balke &amp; Pearl", "id": "1995 / 1994（本章 p27 文献注 5.5 条目明确点名）", "why": "⭐ <b>书自己把离策学习接到了因果推断上，这是你扩大引用面的教科书依据。</b> <span class='k'><b>原话：「高效的离策学习……<b>与概率图（贝叶斯）模型中『干预』与『反事实』的想法密切相关</b>」。</b></span><b>⇒ 你的 ACL/NLP 审稿人未必熟悉 RL 的 OPE 文献，但多半熟悉因果推断。</b><b>把「节点级保真度分配的离策评估」同时用因果语言描述一次（每个节点的档位选择是一次<b>干预</b>，要估的是<b>反事实</b>准确率），能让方法对另一半读者可读——而且这不是攀关系，是书写下的联系。</b><b>⚠ 顺带：简报 §4a 用的「deficient support」本来就是因果推断的术语，那边的 overlap / 倾向性得分文献更成熟。</b>"}, {"t": "Koller &amp; Friedman — 「归一化重要性采样」这个别名", "id": "2009（本章 p27 文献注点名；另见 Rubinstein 1981 · Hesterberg 1988 · Shelton 2001 · Liu 2001）", "why": "<b>检索用。</b> <span class='w'><b>「加权重要性采样，<b>有时也叫归一化重要性采样</b>」——统计与概率图模型那边用的是后一个名字。</b></span><b>只检索 weighted importance sampling 会漏掉一大片。</b><b>⚠ 同理：目标策略在本书<b>第一版</b>里叫「estimation 策略」，读老文献时别认错。</b>"}, {"t": "Singh &amp; Sutton — 首次访问与每次访问的区分", "id": "1996（本章 5.1–2 节的出处）", "why": "<b>首次访问 MC 的收敛性来自「回报<b>独立同分布</b>、方差有限」+ 大数律，误差标准差按 <b>1/√n</b> 下降；每次访问 MC「不那么直接，但也<b>二次</b>收敛」出自这篇。</b> <span class='k'><b>⚠ 对你的用处是<b>反向</b>的：独立性是收敛论证的全部依据，而你的 oracle 表<b>跨分支共享前缀</b>，同一 query 下不同配置的结果<b>不独立</b>。</b></span><b>⇒ 算置信区间时必须按 query 聚类，不能当独立样本。</b>"}, {"t": "Tsitsiklis — Monte Carlo ES 收敛性的部分解答", "id": "2002（本章 5.3 节点名）", "why": "<b>一个「怎么写『我们不主张什么』」的范本。</b> <span class='w'><b>书说 Monte Carlo ES「不可能收敛到次优」已论证，但「一定收敛到最优不动点」<b>尚未被正式证明</b>，并主动把它标成<b>「强化学习里最根本的开放理论问题之一」</b>，再给出这个部分解答。</b></span><b>⇒ 简报 §7 第 2 拳要你写一小节「我们不主张什么」（线性可实现性论证不了，也别试）。</b><span class='k'><b>本页就是那一小节的写法：精确说出哪一条证明了、哪一条没有、缺口在哪、谁做了部分解答。这个引用方式让「尚未证明」显得是查过文献的结论，而不是偷懒。</b></span>"}, {"t": "Sutton, Mahmood, Precup &amp; van Hasselt · Mahmood — 折扣感知重要性采样", "id": "2014 / 2017（本章 5.8 节的出处，Mahmood 2017 展开最充分）", "why": "<span class='w'><b>⚠ 这一条列出来是为了告诉你<b>不必读</b>。</b></span><b>书的原话：折扣感知估计量「把折扣率考虑进去，<b>但在 γ = 1 时没有任何效果</b>（与 5.5 节的离策估计量相同）」。</b><span class='k'><b>而你的 G = Acc − λ·Cost 没有自然的折扣，γ = 1。</b></span><b>⇒ 省下的时间该花在简报 §6 那张抢占风险表上（六篇必读）。</b>"}, {"t": "Barto &amp; Duff · Curtiss — 大问题上蒙特卡洛策略评估的计算优势", "id": "1994 / 1954（本章 5.1–2 节文献注）", "why": "<b>「为什么在大状态空间上蒙特卡洛算得过动态规划」的<b>定量</b>依据。</b> <span class='k'><b>Barto and Duff (1994) 在「用经典蒙特卡洛算法解线性方程组」的语境下讨论策略评估，用 Curtiss (1954) 的分析指出了计算优势。</b></span><b>⇒ 如果你要论证「2^k 的配置空间上采样优于枚举」（当 k 大到枚举不起时），这是比 Sutton & Barto 正文更早、更定量的出处。</b><b>⚠ 但注意你现在的 k 很小，枚举反而是对的——这条是为<b>加宽档位集合之后</b>准备的。</b>"}]};

(function(){

  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");

  }

  function navHtml(){

           '<button class="btn" id="n2">下一页 →</button></div>';

  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      // ⚠ 不能换掉 iframe 元素：error/load 两个监听器是初始化时挂上去的，
      //   换元素会把它们孤儿化，「打不开？」面板就再也不会弹，
      //   读者只剩一个空白框、毫无线索（2026-10-23 我就是这么写错的）。
      //   先 about:blank、下一个 tick 再设真地址 —— 同样是新导航，元素不动。
      frame.src="about:blank";
      setTimeout(function(){ frame.src=SRC+HASH; }, 0);
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
