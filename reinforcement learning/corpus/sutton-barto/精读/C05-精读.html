<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB 第 5 章 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="suttonbarto-c05">

<div id="bar">
  <h1>SB 第 5 章 · <span>蒙特卡洛方法</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 28</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <a class="btn" id="openpdf" hidden target="_blank" rel="noopener"
     title="在新标签页打开原课件 —— 跨域 PDF 能不能内嵌取决于浏览器">原课件 ↗</a>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../chapters/ch05.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>sutton-barto</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/C05-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "蒙特卡洛方法用模型时，对模型的要求和动态规划有什么不同？", "o": ["两者要求相同", "要求模型是表格形式", "要求模型可微", "只需要模型能产生样本转移，不需要所有可能转移的完整概率分布"], "a": 3, "why": "<span class='k'>书还补了一句很实在的观察：「在多得出奇的情形下，按所需概率分布生成经验是容易的，而把那个分布显式地写出来却做不到。」</span>"}, {"q": "书在 5.1 节开篇怎么描述 MDP 与老虎机的关系？", "o": ["MDP = 多个状态，每个像一个不同的上下文老虎机，而这些老虎机互相关联", "两者没有关系", "MDP 是老虎机的特例", "老虎机是 MDP 在状态数无穷时的极限"], "a": 0, "why": "「关联」的确切含义：<span class='k'>在一个状态采取动作之后的回报，依赖同一幕里后续状态所采取的动作。</span>由此导出非平稳——因为所有动作选择都在学习中。"}, {"q": "为什么蒙特卡洛方法只对分幕任务定义？", "o": ["因为持续任务没有动作值", "因为折扣因子必须为 1", "因为持续任务的状态空间太大", "为了保证有定义良好的回报；而且只有在一幕完成时值估计和策略才改变"], "a": 3, "why": "<span class='w'>后果是：蒙特卡洛在逐幕的意义上可以是增量的，但在逐步（在线）的意义上不是。</span>"}],
2: [{"q": "首次访问 MC 与每次访问 MC 在伪代码上差别有多大？", "o": ["差在是否需要动作值", "只差一行：是否检查 S_t 在本幕中更早出现过", "完全是两个算法", "差在折扣因子的处理"], "a": 1, "why": "但书说两者「非常相似，却有略有不同的理论性质」——<span class='k'>首次访问的收敛性一眼可见，每次访问的则不那么直接。</span>"}, {"q": "书给了选择这两者的什么理由？", "o": ["首次访问研究得最多（可追到 1940 年代）；每次访问更自然地推广到函数逼近与资格迹", "两者完全等价，随便选", "每次访问总是更好", "首次访问总是更好"], "a": 0, "why": "<span class='k'>这不是「一个更好」，而是「两条路各通向不同的后续章节」（第 9、12 章）。</span>"}, {"q": "伪代码里为什么要倒着循环 t = T−1, …, 0？", "o": ["为了让折扣因子生效", "为了节省内存", "为了让 G 以一次乘加递推出来——正着走的话每个 t 都要重新把后面的奖励加一遍", "为了保证首次访问的判断正确"], "a": 2, "why": "顺带：因为是倒着走的，「除非 S_t 更早出现过」这个检查恰好对应「这是不是首次访问」。"}],

5: [{"q": "「蒙特卡洛不自举」是什么意思？", "o": ["它不需要模型", "它不使用折扣因子", "一个状态的估计不建立在任何其他状态的估计之上——更新只用这一幕实际拿到的奖励", "它不更新策略"], "a": 2, "why": "<span class='k'>这是回溯图的直接后果：蒙特卡洛的图只画这一幕采到的转移，且一直走到幕结束。</span>"}, {"q": "蒙特卡洛相对动态规划的「第三条」优势是什么？", "o": ["估计单个状态的计算量与状态总数无关——只需要一个或一小部分状态的值时特别有吸引力", "不需要折扣因子", "收敛更快", "可以处理连续状态"], "a": 0, "why": "前两条是：能从真实经验学、能从模拟经验学。<span class='w'>⚠ 注意它说的是「不随状态数增长」，不是「小」——每个关心的状态仍要 n 条幕。</span>"}, {"q": "肥皂泡那个例子说明了什么？", "o": ["肥皂膜的形状无法计算", "蒙特卡洛方法只适用于物理问题", "迭代法总是优于随机游走", "随机游走到边界取平均，恰好等于网格迭代算出的值；只关心少数点时可以高效得多"], "a": 3, "why": "<span class='k'>常规的网格迭代「很像动态规划的迭代策略评估」；而随机游走版本是「代价与状态总数无关」这条性质的几何版本。</span>"}],
6: [{"q": "按一个确定性策略收集数据，会出什么问题？", "o": ["数据量不够", "每个状态只观察到一个动作的回报；没有回报可平均，其余动作的估计不会随经验改善", "方差太大", "回报会有偏"], "a": 1, "why": "<span class='w'>书紧接着点明为什么致命：学动作值的全部目的就是在动作之间做选择，而比较需要所有动作的值。</span><span class='k'>⇒ 确定性策略收集的数据，在结构上无法服务于它自己的目的。</span>"}, {"q": "什么是「试探性出发」？", "o": ["在策略里加一个 ε 概率的随机动作", "从值函数最大的状态开始", "每幕从一个状态–动作对开始，且每一对都有非零概率被选为起点", "先用随机策略跑一段再切换"], "a": 2, "why": "这保证了无穷多幕的极限下所有状态–动作对都被访问无穷多次。<span class='k'>它是把覆盖问题「挪到起点上解决」——不改策略，只改从哪开始。</span>"}, {"q": "书对试探性出发打了什么折扣？", "o": ["它只在表格情形下成立", "它需要折扣因子为 1", "「一般而言不能依赖它，特别是在直接从与环境的真实交互中学习的时候」", "它会引入偏差"], "a": 2, "why": "最常见的替代办法是只考虑随机策略——每个状态选所有动作的概率都非零。<span class='k'>这条路通向 5.4 与 5.5 节。</span>"}, {"q": "为什么无模型时光有状态值不够？", "o": ["因为状态值只对分幕任务有定义", "因为要贪心就得向前看一步，而向前看一步需要模型 p；所以必须显式估计每个动作的值", "因为状态值不收敛", "状态值的方差太大"], "a": 1, "why": "<span class='k'>这正是 (5.1) 那个「有动作值函数时构造贪心策略不需要模型」的来由。</span>"}],
7: [{"q": "书怎么描述 GPI 里策略改进与值函数评估的关系？", "o": ["两者在某种程度上互相对抗，因为每一个都为另一个制造了一个「移动的靶子」", "评估必须先完成才能改进", "两者完全独立", "改进总是先于评估"], "a": 0, "why": "<span class='k'>「移动的靶子」是 5.1 节那个「非平稳」在控制语境下的再现。</span>但合在一起，它们使策略和值函数都趋向最优。"}, {"q": "书说自己作了哪两个「不太可能的假设」？", "o": ["状态空间有限；以及奖励有界", "环境是平稳的；以及回报独立", "折扣因子小于 1；以及策略是确定性的", "试探性出发；以及策略评估可以用无穷多幕"], "a": 3, "why": "<span class='w'>「要得到一个实用的算法，我们必须把两个都去掉。」</span>第二个在本节拆（逐幕交替），第一个推迟到 5.4 节。"}, {"q": "拆「无穷多幕」这个假设的两条路里，书为什么不走第一条？", "o": ["第一条大概可做到令人满意，但很可能需要太多的幕，在除最小问题外的任何问题上都不实用", "第一条在理论上不成立", "第一条需要模型", "第一条会引入偏差"], "a": 0, "why": "<span class='k'>第二条路是「放弃在回到策略改进之前完成策略评估」，极端形式是值迭代；对蒙特卡洛，自然的粒度是逐幕交替。</span>"}],
9: [{"q": "Monte Carlo ES 的正确性，书证明到什么程度？", "o": ["「不可能收敛到次优」已论证；但「一定收敛到最优不动点」尚未被正式证明", "只证明了在表格情形下收敛", "完全证明了收敛到最优", "两者都没有证明"], "a": 0, "why": "<span class='w'>书还说：「在我们看来，这是强化学习里最根本的开放理论问题之一」（部分解答见 Tsitsiklis, 2002）。</span><span class='k'>两者之间差着「会不会根本不收敛」这个可能性。</span>"}, {"q": "Monte Carlo ES 的伪代码里，策略改进发生在什么时候？", "o": ["只在算法开始时做一次", "每隔固定幕数做一次", "等策略评估完全收敛之后", "每幕结束后，对这一幕访问过的每个状态当场做"], "a": 3, "why": "这就是上一节说的「逐幕交替」。<span class='k'>⚠ 习题 5.4 指出这个伪代码低效：它维护整张回报列表并反复算均值，应改成只维护均值与计数的增量形式（5.6 节正式给出）。</span>"}, {"q": "MC ES 解出的二十一点策略与 Thorp (1966) 不一致时，书是怎么处理的？", "o": ["断言 Thorp 的策略有错", "重新跑了实验直到一致", "回避了这个差异", "指出差异的确切位置、承认不知道原因、把自己的确信限定在「我们所描述的这个版本」上"], "a": 3, "why": "<span class='k'>一个值得学的表述方式：既不硬说对方错，也不含糊自己的结论。</span>书有能力断言对方错却没有那么说，而这恰恰让它的结论更可信。"}],
10: [{"q": "要去掉试探性出发，书说唯一的一般办法是什么？", "o": ["让智能体持续地去选所有动作——起点只能安排一次，不够", "增大折扣因子", "改用每次访问 MC", "增加幕数"], "a": 0, "why": "<span class='k'>由此分出在策（评估/改进的就是用来做决策的那个策略）与离策（评估/改进的是不同于生成数据的那个）。</span>"}, {"q": "ε-软策略的定义是什么？", "o": ["π(a|s) ≥ ε/|A(s)| 对所有状态与动作，某个 ε > 0——只是一个下界", "策略以概率 ε 随机、以 1−ε 贪心", "π(a|s) > 0 对所有状态与动作", "π(a|s) = ε/|A(s)| 对所有非贪心动作"], "a": 0, "why": "<span class='k'>ε-软是约束，ε-贪心是在该约束下尽可能贪心的解——「在 ε-软策略当中，ε-贪心在某种意义上最接近贪心」。</span>"}, {"q": "ε-贪心策略里，贪心动作分到的概率是多少？", "o": ["1 − ε", "ε/|A(s)|", "1", "1 − ε + ε/|A(s)|"], "a": 3, "why": "非贪心动作各得 ε/|A(s)|。<span class='k'>贪心那一项里也含 ε/|A(s)|，因为「随机选一个」时它也可能被选中；把 |A(s)| 项加起来恰为 1。</span>"}],
11: [{"q": "在策方法为什么不把策略一路推到贪心？", "o": ["贪心策略收敛太慢", "贪心策略会引入偏差", "贪心策略不可微", "没有试探性出发时，直接贪心会阻止对非贪心动作的进一步探索"], "a": 3, "why": "<span class='k'>「幸运的是，GPI 不要求把策略一路推到贪心策略，只要求把它朝贪心策略挪。」</span>"}, {"q": "书用什么技巧证明「等号只在 ε-软最优时成立」？", "o": ["用重要性采样", "用压缩映射定理", "造一个新环境，把「策略必须 ε-软」挪进环境内部——于是受约束的优化变成无约束的", "对 ε 取极限"], "a": 2, "why": "新环境：在 s 采取 a 时以概率 1−ε 照旧走、以概率 ε 等概率重新随机挑一个动作再走。<span class='k'>然后用 Bellman 最优方程解的唯一性收尾。</span>"}, {"q": "在策首次访问 MC 控制最终达到的是什么？", "o": ["全局最优策略", "不保证收敛", "ε-软策略当中的最优策略——代价是只在这个类里最优，但消除了试探性出发的假设", "任意局部最优"], "a": 2, "why": "<span class='w'>⚠ 而且这个分析假设动作值函数是精确算出来的。</span>"}],
13: [{"q": "「覆盖假设」的内容是什么？", "o": ["π(a|s) > 0 必须蕴含 b(a|s) > 0", "b 必须处处随机", "π 必须是随机的", "π 与 b 必须有相同的支撑集"], "a": 0, "why": "<span class='k'>直接推论是：在 b 与 π 不相同的那些状态上，b 必须是随机的。</span><span class='w'>⚠ 注意不是「b 处处必须随机」——两者本来一致的状态上确定性无害。</span>"}, {"q": "关于目标策略能不能是确定性的，书怎么说？", "o": ["书里没有讨论", "只在表格情形下可以", "可以——「事实上这正是控制应用中特别值得关注的情形」", "不可以，目标策略也必须随机"], "a": 2, "why": "<span class='k'>控制里目标策略通常就是对当前 Q 的确定性贪心策略，而行为策略保持随机、更具探索性（例如 ε-贪心）。</span>"}, {"q": "书给离策方法记了什么账？", "o": ["只在无环的 MDP 上成立", "只能用于预测，不能用于控制", "方差更大、收敛更慢；但更有力、更一般，且在策是其特例", "方差更小、收敛更快，但实现复杂"], "a": 2, "why": "<span class='k'>额外用途之一：可以从非学习的控制器或人类专家产生的数据中学习。</span>"}, {"q": "所有学习控制方法面对的那个两难，书是怎么表述的？", "o": ["模型精度与计算量无法兼顾", "偏差与方差不能同时减小", "想学的动作值以「之后按最优行为走」为条件，却必须非最优地行动才能探索所有动作", "探索与利用无法同时最大化"], "a": 2, "why": "<span class='w'>而在策的办法「其实是一个妥协」——它学的不是最优策略的动作值，而是一个仍在探索的、接近最优的策略的动作值。</span>"}],
14: [{"q": "重要性采样比 ρ 为什么不依赖 MDP？", "o": ["因为用了状态值而不是动作值", "因为假设了转移概率已知", "因为对转移概率做了近似", "因为轨迹概率里的转移概率 p 在分子分母里完全相同，相互抵消"], "a": 3, "why": "<span class='k'>「ρ 只依赖那两个策略和那个序列，不依赖 MDP。」⇒ 做离策修正不需要知道环境。</span>"}, {"q": "ρ_{t:T−1} 的表达式是什么？", "o": ["Σ_{k=t}^{T−1} π(A_k|S_k) / b(A_k|S_k)", "v_π(s) / v_b(s)", "∏_{k=t}^{T−1} π(A_k|S_k) / b(A_k|S_k)", "π(A_t|S_t) / b(A_t|S_t)"], "a": 2, "why": "<span class='w'>⚠ 它是一个连乘——每多一步多乘一个比值，这就是离策「方差更大」的来源。</span>"}, {"q": "为什么行为策略产生的回报不能直接平均来估 v_π？", "o": ["它们可能是负的", "它们不是独立同分布的", "它们的方差太大", "它们的期望是错的：E[G_t|S_t=s] = v_b(s) 而不是 v_π(s)"], "a": 3, "why": "重要性采样就是来修这件事的：(5.4) 说 E[ρ G_t | S_t=s] = v_π(s)。<span class='k'>⚠ 但这只是关于期望的陈述，对方差什么都没说。</span>"}],
15: [{"q": "普通 IS 与加权 IS 的差别在哪？", "o": ["分母：普通是 |T(s)|（简单平均），加权是 Σρ（按比值加权）", "普通用状态值，加权用动作值", "分子不同", "普通用首次访问，加权用每次访问"], "a": 0, "why": "<span class='k'>加权版分母为零时取零。</span>"}, {"q": "两者的偏差与方差怎么对换？", "o": ["两者都有偏", "普通无偏但方差一般无界；加权有偏（渐近→0）但方差有界", "普通有偏但方差有界；加权无偏但方差无界", "两者都无偏，只是方差不同"], "a": 1, "why": "<span class='k'>加权版方差有界的理由是「任一单条回报上的最大权重是 1」。</span>更强的结论：假设回报有界，加权版方差收敛到零，即使比值本身方差无穷（Precup, Sutton & Dasgupta 2001）。"}, {"q": "只观察到一条回报时，加权 IS 给出什么？", "o": ["无定义", "比值乘以那条回报", "零", "观察到的那条回报本身——ρ 在分子分母里约掉了；但期望是 v_b 而非 v_π，故有偏"], "a": 3, "why": "<span class='w'>而普通 IS 此时无偏但可以很极端：比值 10 则估计是回报的 10 倍。</span><span class='k'>讽刺之处：越能代表目标策略，偏得越离谱。</span>"}, {"q": "关于每次访问版，结论和首次访问版有什么不同？", "o": ["每次访问版不能用于离策", "每次访问版只有加权是有偏的", "每次访问版两者都无偏", "每次访问版的普通与加权都是有偏的（偏差渐近→0），但实践中常被偏爱"], "a": 3, "why": "<span class='k'>理由：免去跟踪哪些状态被访问过，且更易推广到近似方法。⇒ 实用组合常是「每次访问 + 加权」。</span>"}],
16: [{"q": "Example 5.4 里那个状态的真值是怎么确定的？", "o": ["用动态规划精确算出", "用加权 IS 的极限", "另外单独用目标策略生成一亿幕，取回报平均", "从 Thorp (1966) 的表里查到"], "a": 2, "why": "<span class='k'>⚠ 这个做法是为了让横轴上的误差有意义，不是算法的一部分。</span>真值 ≈ −0.27726。"}, {"q": "Example 5.5 构造无穷方差，书说病根是什么？", "o": ["折扣因子等于 1", "奖励无界", "轨迹里含有环——这在离策学习里很容易发生", "行为策略是确定性的"], "a": 2, "why": "<span class='w'>「普通 IS 的估计通常会有无穷方差，只要缩放后的回报有无穷方差——而这在离策学习里很容易发生，当轨迹里含有环的时候。」</span>"}, {"q": "Example 5.5 里 left 动作的转移概率是多少？", "o": ["以 0.9 回到 s，以 0.1 转到终止", "确定性地回到 s", "以 0.5 回到 s，以 0.5 转到终止", "以 0.1 回到 s，以 0.9 转到终止"], "a": 0, "why": "right 则确定性地转移到终止。奖励只在 left 转到终止那一步是 +1。<span class='k'>目标策略永远选 left ⇒ 回报恒为 1 ⇒ v_π(s) = 1。</span>"}],
17: [{"q": "图 5.4 里最吊诡的一点是什么？", "o": ["正确值 1 恰好就是（重要性采样之后）一个样本回报的期望值，但样本方差无穷，估计仍不收敛", "十次运行结果完全一致", "估计收敛到了错误的值", "加权 IS 也不收敛"], "a": 0, "why": "<span class='k'>⇒ 无偏 ≠ 可用。这是这一页存在的全部理由。</span>"}, {"q": "加权 IS 在 Example 5.5 上的行为是什么？", "o": ["第一幕以 left 结束之后就永远给出恰好为 1——不一致的轨迹 ρ = 0，对分子分母都不贡献", "收敛到 0.5", "需要上百万幕才收敛", "和普通 IS 一样不收敛"], "a": 0, "why": "<span class='w'>书的描述：「加权 IS 产生的是只由与目标策略一致的回报构成的加权平均」。</span><span class='k'>⇒ 目标策略确定时，这字面上就是拒绝采样的形状。</span>"}, {"q": "那个发散的级数，关键的数是什么？", "o": ["0.9，因为它小于 1", "0.5，因为行为策略是均匀的", "1.8，因为它大于 1——概率衰减（×0.9）跑不过比值平方的增长（×4），再被 ½ 分掉一半", "0.1，因为终止概率太小"], "a": 2, "why": "0.1 · Σ 0.9^k·2^k·2 = 0.2 · Σ 1.8^k = ∞。<span class='k'>第一步是恒等式 Var[X] = E[X²] − X̄²：均值有限时，方差无穷当且仅当平方的期望无穷。</span>"}],
19: [{"q": "加权 IS 的增量更新式 (5.8)，步长是什么？", "o": ["1/n，和第 2 章一样", "W_n / C_n——这条样本的权重占迄今全部权重的份额", "ρ_n", "固定的 α"], "a": 1, "why": "<span class='k'>C 是「给前 n 个回报的权重的累积和」，C₀ ≐ 0。</span>习题 5.10 请读者从 (5.7) 推出 (5.8)。"}, {"q": "离策 MC 预测的伪代码怎么把在策情形包含为特例？", "o": ["把折扣因子设为 1", "把目标与行为策略选成同一个——此时 π = b，W 恒为 1，W/C 退回 1/n", "需要另写一个分支", "把 C 固定为 1"], "a": 1, "why": "<span class='k'>一行代码两种用法。</span>"}, {"q": "5.7 节说离策把哪两件事分开了？分开的好处是什么？", "o": ["控制与估值；好处是目标策略可以是确定性的，而行为策略继续对所有动作采样", "评估与改进；好处是收敛更快", "偏差与方差；好处是两者都能减小", "模型与数据；好处是不需要模型"], "a": 0, "why": "<span class='w'>代价是行为策略必须对目标策略可能选中的所有动作有非零概率（覆盖），且必须是软的。</span>"}],
21: [{"q": "离策 MC 控制里「若 A_t ≠ π(S_t) 则退出内层循环」这一行的后果是什么？", "o": ["只会丢掉少量数据", "需要更多内存", "算法会更快收敛", "这个方法只从幕的尾巴学——只有剩下的动作全是贪心的那一段才算数"], "a": 3, "why": "<span class='w'>「如果非贪心动作很常见，学习就会很慢，对出现在长幕靠前部分的状态尤其如此。」</span><span class='k'>每步贪心概率为 q 时，距幕尾 m 步的状态被学到的概率是 q^m。</span>"}, {"q": "为什么权重更新写成 W ← W · 1/b(A_t|S_t) 而不是 W ← W · π/b？", "o": ["因为行为策略是均匀的", "这是书里的笔误", "因为能走到这一行说明 A_t = π(S_t)，而 π 是确定性贪心策略，所以 π(A_t|S_t) = 1", "因为用了加权 IS"], "a": 2, "why": "习题 5.11 问的正是这个。<span class='k'>理由就在那行提前退出里。</span>"}, {"q": "书对「只从尾巴学」这个问题给了哪两条出路？", "o": ["改用每次访问 MC；或换成普通 IS", "引入时序差分学习（下一章）；或在 γ < 1 时用 5.8 节的折扣感知 IS", "没有给出路", "增大 ε；或增加幕数"], "a": 1, "why": "<span class='w'>⚠ 第二条的前提是 γ < 1。</span>而书自评：「关于离策 MC 方法的经验还不够，无法评估这个问题有多严重。」"}],
22: [{"q": "5.8 节那个 γ=0、幕长 100 的例子说明了什么？", "o": ["折扣因子不能取零", "普通 IS 在长幕上一定发散", "加权 IS 在这种情况下无偏", "回报就是 R₁，却要乘 100 个比值；其余 99 个与回报独立、期望为 1，不改变期望却极大增加方差"], "a": 3, "why": "<span class='k'>「期望是 1」和「恒等于 1」是两回事——前者只保证不偏，不保证不抖。</span>"}, {"q": "「平坦部分回报」Ḡ_{t:h} 里的两个词各指什么？", "o": ["「平坦」指没有折扣；「部分」指不延伸到终止，而是停在视界 h", "「平坦」指线性；「部分」指只用一半数据", "两个词都是指近似", "「平坦」指奖励恒定；「部分」指只取部分状态"], "a": 0, "why": "<span class='k'>这一节的想法是把折扣重新解释成「终止的概率」或「部分终止的程度」。</span>"}, {"q": "折扣感知 IS 估计量在 γ = 1 时怎么样？", "o": ["没有任何效果——与 5.5 节的离策估计量完全相同", "变成加权 IS", "方差降到零", "无定义"], "a": 0, "why": "<span class='w'>这是书自己写明的，决定了这一节对哪些问题有用。</span>"}],
24: [{"q": "逐决策 IS 与折扣感知 IS 的分工是什么？", "o": ["逐决策需要模型，折扣感知不需要", "逐决策即使 γ = 1 也可能降低方差；折扣感知在 γ = 1 时无效", "逐决策只用于控制，折扣感知只用于预测", "两者等价"], "a": 1, "why": "<span class='k'>对 γ = 1 的问题，逐决策 IS 是唯一可用的那一节。</span>"}, {"q": "(5.13) 那个「期望为 1」是怎么来的？", "o": ["期望在行为策略 b 下取，b(a|S_k) 恰好把分母约掉，剩下 π 对动作求和 = 1", "假设两个策略相同", "由大数律得到", "由折扣因子的几何级数得到"], "a": 0, "why": "<span class='k'>「期望为 1」是概率归一化的直接后果。</span>习题 5.13 请读者补出从 (5.12) 到 (5.14) 的完整步骤。"}, {"q": "逐决策 IS 的结论 E[ρ_{t:T−1} R_{t+k}] = E[ρ_{t:t+k−1} R_{t+k}] 意味着什么？", "o": ["第 k 个奖励只被它之前的比值加权；但终局奖励需要全部比值，一个都省不掉", "只有折扣情形下才成立", "比值可以完全去掉", "所有奖励都只需要一个比值"], "a": 0, "why": "<span class='w'>⇒ 对只有终局奖励的问题，逐决策 IS 算术上等同于轨迹 IS，完全没有节省。</span>"}, {"q": "关于「加权 + 逐决策」的组合，书说了什么？", "o": ["书里没有讨论", "这就不那么清楚了——到目前为止所有提出的这类估计量都不是相合的，即使数据无穷也不收敛", "它比两者单独用都好", "这是标准做法"], "a": 1, "why": "<span class='k'>⇒ 加权（方差有界）与逐决策（去无关因子）目前无法兼得。</span>"}],
26: [{"q": "小结里蒙特卡洛的「第四条优势」是什么？", "o": ["可以处理连续状态", "收敛速度更快", "不需要折扣因子", "可能较少受到「马尔可夫性被破坏」的伤害——因为它们不自举"], "a": 3, "why": "<span class='w'>⚠ 措辞是 may be less harmed，是程度判断不是定理。</span><span class='k'>逻辑：自举隐含假设「后继状态这个标签足以概括未来」，表示不完整时错误会沿自举链传开；而 MC 直接用实际拿到的回报。</span>"}, {"q": "书说蒙特卡洛与动态规划的两条差别有什么关系？", "o": ["并非紧密相连，是可以分开的——下一章就是「从经验学 + 自举」的组合", "第一条蕴含第二条", "两者是同一件事的不同说法", "两者互为充要条件"], "a": 0, "why": "<span class='k'>把「无模型」和「不自举」当成两个独立的轴，是读第 6 章的正确姿势。</span>"}, {"q": "小结里对加权 IS 的措辞是什么？", "o": ["只在首次访问情形下有限", "无偏且方差有限", "方差比普通 IS 小一些", "总是有有限方差（always has finite variance），实践中更受偏爱"], "a": 3, "why": "比 5.5 节那个「最大权重是 1」的说法更直接。<span class='w'>而书的自评：「尽管概念上简单，离策蒙特卡洛方法仍未定型，是正在进行的研究课题。」</span>"}],
27: [{"q": "文献注把离策学习接到了哪个领域？", "o": ["概率图（贝叶斯）模型中的「干预」与「反事实」（Pearl, 1995；Balke and Pearl, 1994）", "统计物理", "信息论", "组合优化"], "a": 0, "why": "<span class='k'>书还说：「用重要性采样的离策方法有很长的历史，然而至今仍未被很好地理解。」</span>"}, {"q": "「加权重要性采样」在其他文献里还叫什么？", "o": ["自归一化蒙特卡洛", "稳健重要性采样", "归一化重要性采样（normalized importance sampling）", "截断重要性采样"], "a": 2, "why": "<span class='w'>只检索 weighted importance sampling 会漏掉一大片（Koller and Friedman, 2009 等用的是前者）。</span>另外目标策略在本书第一版里叫「estimation 策略」。"}, {"q": "逐决策重要性采样是谁引入的？", "o": ["Mahmood (2017)", "Singh and Sutton (1996)", "Pearl (1995)", "Precup, Sutton, and Singh (2000)"], "a": 3, "why": "<span class='k'>他们还把离策学习与时序差分、资格迹、逼近方法结合起来，「引出了一些微妙的问题」。</span>配上 5.9 节末尾那句「所有已知的逐决策加权估计量都不相合」，这条线上确实有未解决的东西。"}]
};

{"r": [1, 1], "t": "只要经验，不要模型——而且书把 MDP 说成一组互相关联的上下文老虎机", "star": 3, "quote": "<em>Monte Carlo methods require <b>only experience</b>—sample sequences of states, actions, and rewards from actual or simulated interaction with an environment. … <b>Although a model is required, the model need only generate sample transitions, not the complete probability distributions</b> of all possible transitions that is required for dynamic programming.</em><br><em>… now there are multiple states, <b>each acting like a different bandit problem (like an associative-search or contextual bandit)</b> and <b>the different bandit problems are interrelated</b>. That is, the return after taking an action in one state <b>depends on the actions taken in later states in the same episode</b>.</em>", "one": "<b>蒙特卡洛方法只需要「经验」——状态、动作、奖励的样本序列。而本页最后一段给了 MDP 一个非常朴素的描述：它就是一组上下文老虎机，只不过这些老虎机彼此关联。</b>", "pts": ["<b>先看这一章和上一章（动态规划）的分界。</b> <span class='k'><b>「与上一章不同，这里我们<b>不</b>假设对环境有完全的知识。」</b></span><b>蒙特卡洛方法只要求经验：来自真实或模拟交互的状态、动作、奖励的样本序列。</b><b>从真实经验学是「引人注目的」，因为它完全不需要环境动力学的先验知识，却仍能达到最优行为。</b>", "<b>从模拟经验学也很有力，而这里有一个常被读快的区别。</b> <span class='w'><b>「虽然需要一个模型，但这个模型只需要产生<b>样本转移</b>，而不需要动态规划所要求的、所有可能转移的<b>完整概率分布</b>。」</b></span><b>这正是第 8 章那个「分布模型 vs 样本模型」的二分，只不过在这里是第一次出现。</b><b>书还补了一句很实在的观察：「在多得出奇的情形下，按所需概率分布生成经验是容易的，而把那个分布显式地写出来却做不到。」</b>", "<b>适用范围被明确限定了：只对分幕任务定义。</b> <b>「为了保证有定义良好的回报，这里我们只对分幕任务定义蒙特卡洛方法。」</b><span class='k'><b>而且假设<b>所有幕最终都会终止，不管选了什么动作</b>。</b></span><b>「只有在一幕完成时，值估计和策略才会改变。」</b><b>⇒ 于是蒙特卡洛方法「在逐幕的意义上可以是增量的，但在逐步（在线）的意义上不是」。</b>⚠ <b>书还澄清了术语：「Monte Carlo」在更广的用法里指任何带显著随机成分的估计方法，<b>这里专指基于「对完整回报取平均」的方法</b>（与下一章那些从部分回报学的方法相对）。</b>", "<b>⚠ 最后一段是本页最值得停下来的地方，它给了 MDP 一个很低姿态的描述。</b> <b>「蒙特卡洛方法对每个状态–动作对采样并平均回报，<b>很像第 2 章那些老虎机方法对每个动作采样并平均奖励</b>。</b><span class='k'><b>主要的差别在于，现在有多个状态，<b>每一个都像一个不同的老虎机问题（像联想搜索或上下文老虎机）</b>，而<b>这些不同的老虎机问题是互相关联的</b>。」</b></span>", "<b>「互相关联」这四个字被书自己解释了，而解释得很具体。</b> <span class='w'><b>「也就是说，在一个状态里采取一个动作之后的回报，<b>依赖于同一幕里后续状态中所采取的动作</b>。」</b></span><b>「因为所有的动作选择都在学习之中，从较早那个状态的角度看，问题变成了<b>非平稳</b>的。」</b><b>⇒ 两句话给出了「MDP 比上下文老虎机多出来的东西」的全部内容：<b>关联</b>（回报依赖下游动作）与由它导出的<b>非平稳</b>（下游还在变）。</b>", "<b>把这两句话倒过来读，就得到一个判据。</b> <span class='k'><b>如果回报<b>不</b>依赖下游动作，那么这些老虎机就<b>没有</b>关联，问题也就不是 MDP，而是若干个独立的上下文老虎机。</b></span><b>⚠ 注意这不是一个比喻，而是书自己给出的构造性描述——它把「什么时候该用 MDP」变成了一个可以检验的命题。</b>右边的科研格说明这条判据怎么落到你那个可加性检验上。"], "eq": "本章的前提（与第 4 章动态规划的分界）：\n\n   动态规划   需要**完整概率分布** p(s′,r|s,a)\n   蒙特卡洛   只需要**经验**：状态/动作/奖励的**样本序列**\n              从模拟经验学时也只需模型能产生**样本转移**\n              ⚠ 「在多得出奇的情形下，按所需分布**生成**经验容易，\n                 把那个分布**显式写出来**却做不到」\n\n适用范围（硬限制）：\n   只对**分幕任务**定义；假设所有幕最终都会终止，不管选了什么动作\n   只有在**一幕完成时**值估计与策略才改变\n   ⇒ 逐幕增量 ✓   逐步（在线）增量 ✗\n\n⭐ 书给 MDP 的构造性描述（本页最后一段）：\n\n   MDP = 多个状态，**每个像一个不同的老虎机问题**\n         （像联想搜索 / **上下文老虎机**）\n         而这些老虎机问题**互相关联**\n\n   「关联」的确切含义：\n      在一个状态采取动作之后的回报，\n      **依赖同一幕里后续状态所采取的动作**\n   由它导出的后果：\n      因为所有动作选择都在学习中，\n      **从较早那个状态看，问题变成非平稳的**\n\n   ⇒ 倒过来读就是判据：\n      回报**不**依赖下游动作 ⇒ 老虎机**无**关联\n                            ⇒ 不是 MDP，是若干独立的上下文老虎机", "tbl": {"head": ["", "动态规划（第 4 章）", "蒙特卡洛（本章）"], "rows": [["需要什么", "<b>完整概率分布</b> p(s′,r|s,a)", "<b>只要经验</b>（样本序列）"], ["用模型时的要求", "分布", "<b>只需产生样本转移</b>"], ["适用任务", "分幕与持续", "<span class='w'>只对分幕定义</span>"], ["何时更新", "随时", "<b>只在一幕完成时</b>"], ["增量性", "逐步", "<b>逐幕</b>，不是逐步"], ["与第 2 章的关系", "—", "<b>MDP = 互相关联的上下文老虎机</b>"], ["「关联」指什么", "—", "<b>回报依赖同一幕里下游的动作</b>"]]}, "res": {"tag": "推断", "ref": "原书 5.1 节开篇（逐句核对）· 简报 §5「Week 2 可加性检验 · the load-bearing experiment」· bridge-threads [1] 多臂与上下文老虎机 · S&B 第 8 章精读 p1 科研格（分布 / 样本模型）", "v": "<b>书这段话把你那个可加性检验从「一个聪明的实验设计」升格成了「对教科书定义的直接检验」。</b><br><span class='k'><b>书的说法：MDP 就是一组上下文老虎机，差别只在于它们<b>互相关联</b>；而「关联」的确切含义是「回报依赖同一幕里下游的动作」。</b></span><br><b>简报 §5 的 Week 2 实验量的正是这个关联：</b>对每个节点 h 跑（全强，h 降级）与（全弱，h 升级），得到 Δ_h^down 与 Δ_h^up，再比较 Σ_h Δ_h^down 与 Acc(全强) − Acc(全弱)。<br><span class='w'><b>⇒ 若两者在置信区间内一致，那就是说「各节点的效应可加」，也就是「一个节点的回报贡献<b>不</b>依赖其他节点选了什么」——<b>按本页的定义，这恰好就是「老虎机之间没有关联」。</b></b></span><br><b>三条可用的：</b><br>① ⭐ <b>你可以引用 Sutton & Barto 来说明这个检验在测什么。</b><b>「我们检验的是 Sutton & Barto (2018, §5.1) 所说的那种<b>关联</b>是否存在：MDP 相对上下文老虎机多出来的全部内容，就是回报对下游动作的依赖。我们直接测量这个依赖。」</b><b>这比自己定义一个「可加性」要有力得多——它把你的实验锚在一个标准教材的定义上。</b><br>② <b>书还顺带给了「非平稳」的来源，而这条对你的实验设计有直接约束。</b><b>非平稳的原因是「所有动作选择都在学习之中」。</b><span class='k'><b>⇒ 你做一步偏离扫描时<b>固定了其余所有节点</b>，所以在那个实验里<b>没有</b>非平稳——这是好事，它让 Δ_h 是干净可测的。</b></span><b>⚠ 但如果你之后做联合优化（同时改多个节点的策略），非平稳就回来了，那时 Δ_h 不再是常数。<b>把这两个阶段分开写，别让读者以为可加性一旦测到就永远成立。</b></b><br>③ ⚠ <b>注意一个方向上的限制：可加性成立只说明「在你测的那个范围内」没有关联。</b><b>Δ_h^down 是在「其余全强」的背景下测的，Δ_h^up 是在「其余全弱」的背景下测的——书的建议是两个都测，正是因为关联可能只在某一侧显现。<b>若两侧结论不一致，那本身就是关联存在的证据，而且比单侧更有信息量。</b></b>"}, "link": {"t": "你学过的对应：CS234 L03 精读（无模型策略评估 —— 那一讲从 CS234 的角度讲同一批内容，重要性采样部分可以对照）", "href": "../../cs234-2019/中文精读/L03-精读.html"}},
{"r": [2, 2], "t": "首次访问与每次访问：差别很小，但理论性质不同", "star": 2, "quote": "<em>The <b>first-visit MC method</b> estimates v_π(s) as the average of the returns following <b>first</b> visits to s, whereas the <b>every-visit MC method</b> averages the returns following <b>all</b> visits to s. These two … are very similar but have <b>slightly different theoretical properties</b>. First-visit MC has been most widely studied, <b>dating back to the 1940s</b> … <b>Every-visit MC extends more naturally to function approximation and eligibility traces</b>.</em>", "one": "<b>一个状态在一幕里可能被访问多次。只取第一次的叫首次访问 MC，全都取的叫每次访问 MC。两者差别只是伪代码里一行判断，但理论性质不同——而且各自有各自更顺手的去处。</b>", "pts": ["<b>先把「访问」这个词钉死，因为后面全靠它。</b> <b>一幕里状态 s 的每一次出现叫做对 s 的一次<b>访问</b>；同一幕里 s 当然可能被访问多次；其中第一次叫<b>首次访问</b>。</b><span class='k'><b>首次访问 MC 用「首次访问之后的回报」的平均来估 v_π(s)；每次访问 MC 用「所有访问之后的回报」的平均。</b></span>", "<b>两者的差别在伪代码里只有一行。</b> 书说得很干脆：<b>「每次访问 MC 会是一样的，只是去掉对 S_t 是否在本幕中更早出现过的那个检查。」</b><span class='w'><b>——但「两者非常相似，却有<b>略有不同的理论性质</b>」。</b></span><b>⚠ 这句话是伏笔，下一页会兑现：首次访问的收敛性一眼可见，每次访问的则不那么直接。</b>", "<b>书对这两者的选择给了历史与去向两条理由，值得分开记。</b> <span class='k'><b>历史：首次访问 MC 被研究得最多，<b>可以追到 1940 年代</b>，本章以它为主。</b></span><span class='k'><b>去向：每次访问 MC <b>更自然地推广到函数逼近与资格迹</b>（第 9、12 章）。</b></span><b>⇒ 也就是说这不是「一个更好」，而是「两条路各通向不同的后续章节」。</b>", "<b>伪代码本身只有七行，但有两处值得盯。</b> <b>① 循环是<b>倒着</b>走的</b>：t = T−1, T−2, …, 0，每步 G ← γG + R_{t+1}。<span class='k'><b>倒着走是为了让 G 以一次乘加就递推出来——正着走的话每个 t 都要重新把后面的奖励加一遍。</b></span><b>② 「除非 S_t 在 S_0, S_1, …, S_{t−1} 里出现过」</b>——<b>这一行就是首次访问与每次访问的全部区别。</b><b>注意因为是倒着走的，这个检查看的是「更早」的那一段，恰好对应「这是不是首次访问」。</b>", "<b>还有一个实现上的细节，书用 Returns(s) 这个列表写出来了。</b> <b>每个状态维护一个回报列表，每次把 G 追加进去，然后 V(S_t) ← average(Returns(S_t))。</b><span class='w'><b>⚠ 这是为了讲清楚而写的低效版本——习题 5.4 会专门要求把它改成只维护均值与计数的增量形式（照 2.4 节的办法）。</b></span><b>5.6 节会正式给出增量实现。</b>"], "eq": "首次访问 MC 预测（估计 V ≈ v_π）：\n\n   输入：待评估的策略 π\n   初始化：\n       V(s) ∈ R 任意，对所有 s ∈ S\n       Returns(s) ← 空列表，对所有 s ∈ S\n   永远循环（每一幕）：\n       按 π 生成一幕：S₀, A₀, R₁, S₁, A₁, R₂, …, S_{T−1}, A_{T−1}, R_T\n       G ← 0\n       **倒着**循环 t = T−1, T−2, …, 0：\n           G ← γG + R_{t+1}\n           **除非** S_t 出现在 S₀, S₁, …, S_{t−1} 里：\n               把 G 追加进 Returns(S_t)\n               V(S_t) ← average( Returns(S_t) )\n\n   ⚠ 倒着走是为了让 G 一次乘加递推出来\n   ⚠ 「除非…」这一行**就是**首次访问与每次访问的全部区别\n      （每次访问 MC = 去掉这一行）\n   ⚠ Returns 列表是讲解用的低效写法；习题 5.4 要求改成增量形式，\n      5.6 节正式给出\n\n两者的分工（不是优劣）：\n   首次访问   研究得最多，**可追到 1940 年代**，本章以它为主\n   每次访问   **更自然地推广到函数逼近与资格迹**（第 9、12 章）", "tbl": {"head": ["", "首次访问 MC", "每次访问 MC"], "rows": [["取哪些回报", "<b>每幕中第一次访问之后的</b>", "<b>所有访问之后的</b>"], ["伪代码差别", "有「除非 S_t 更早出现过」这一行", "<b>去掉那一行</b>"], ["历史", "<b>研究得最多，可追到 1940 年代</b>", "—"], ["更自然地推广到", "—", "<b>函数逼近与资格迹（第 9、12 章）</b>"], ["收敛性（下一页）", "<b>一眼可见</b>（iid + 大数律）", "<span class='w'>不那么直接</span>，但也收敛"]]}},
{"r": [3, 4], "t": "收敛快慢，和一个反直觉的例子：知道全部动力学，仍然该用蒙特卡洛", "star": 3, "quote": "<em>In this case each return is an <b>independent, identically distributed</b> estimate of v_π(s) with <b>finite variance</b>. By the law of large numbers … Each average is itself an <b>unbiased</b> estimate, and <b>the standard deviation of its error falls as 1/√n</b> … Every-visit MC is less straightforward, but its estimates also converge <b>quadratically</b> to v_π(s) (Singh and Sutton, 1996).</em><br><em><b>Although we have complete knowledge of the environment in the blackjack task, it would not be easy to apply DP methods</b> … All of the probabilities must be computed before DP can be applied, and such computations are <b>often complex and error-prone</b>. In contrast, generating the sample games … <b>is easy</b>.</em>", "one": "<b>首次访问的收敛性一眼可见：回报是独立同分布、方差有限，大数律直接给结论，误差标准差按 1/√n 下降。而二十一点这个例子说明一件反直觉的事——哪怕你完全知道环境的动力学，用蒙特卡洛仍可能更划算。</b>", "pts": ["<b>首次访问的收敛性为什么「一眼可见」？因为独立性。</b> <span class='k'><b>每个回报都是 v_π(s) 的一个<b>独立同分布</b>、<b>方差有限</b>的估计。</b></span><b>于是大数律直接给出：这些估计的平均序列收敛到它们的期望值。</b><b>而且每个平均本身是<b>无偏</b>的，它的误差标准差按 <b>1/√n</b> 下降（n 是被平均的回报个数）。</b><b>⚠ 独立性来自「每幕只取一个」——同一幕里的多次访问显然不独立，这正是每次访问 MC 麻烦的地方。</b>", "<b>每次访问的结论书只给了一句，但那一句信息量不小。</b> <span class='w'><b>「每次访问 MC 不那么直接，但它的估计也<b>二次</b>收敛到 v_π(s)（Singh and Sutton, 1996）。」</b></span><b>⇒ 两者最终都对，只是证明的难度与收敛的刻画方式不同。</b>⚠ <b>注意书在 5.2 节讲动作值时会再说一次「这些方法照旧二次收敛」，措辞对两种访问方式是合并的。</b>", "<b>二十一点这个例子被选得很有讲究，它的参数值得记住。</b> <b>每局一幕；赢/输/平的奖励是 +1 / −1 / 0；局内其余奖励全为零；<b>不打折（γ = 1）</b>，所以这些终局奖励同时也就是回报。</b><span class='k'><b>状态由三个变量决定：玩家当前点数（12–21，共 10 种）、庄家明牌（A–10，共 10 种）、是否持有可用的 A（2 种）⇒ <b>共 200 个状态</b>。</b></span><b>被评估的策略是「点数 20 或 21 就停，否则要牌」，图 5.1 给出它的状态值函数。</b>", "<b>图 5.1 还藏了一条关于「数据量」的实感。</b> <b>书说：持有可用 A 的那些状态，估计「更不确定、也更不规则，因为这些状态更少见」；</b><span class='k'><b>而「总之，在 50 万局之后，值函数已经逼近得很好了」。</b></span><b>⚠ 200 个状态、50 万幕——平均每个状态 2500 次访问，而且分布极不均匀。</b><b>这个数量级值得记住：蒙特卡洛的「慢」不是抽象的。</b>", "<b>⚠ 现在是本页最反直觉的一段，而它恰恰是蒙特卡洛的第一条实质优势。</b> <span class='w'><b>「虽然我们对二十一点的环境有<b>完全的</b>知识，要用动态规划算这个值函数却<b>并不容易</b>。」</b></span><b>原因是动态规划需要「下一事件的分布」，也就是那个四参数函数 p——而它对二十一点并不好确定。</b><b>书举的例子很具体：玩家点数是 14 且选择停牌，他以 +1 结束的概率是庄家明牌的什么函数？</b><b>「所有这些概率都必须在应用动态规划<b>之前</b>算出来，而这类计算往往<b>复杂且容易出错</b>。」</b>", "<b>而与之相对的那一句，是这一章反复要讲的主题。</b> <span class='k'><b>「相比之下，生成蒙特卡洛方法所需的样本对局是<b>容易</b>的。这种情况出奇地常见；蒙特卡洛方法仅凭样本幕就能工作的能力，<b>即使在你完全知道环境动力学的时候，也可能是一个显著的优势</b>。」</b></span><b>⇒ 「有没有模型」和「模型好不好用」是两回事。右边的科研格说明这条对你意味着什么。</b>"], "eq": "收敛性：\n\n   首次访问 MC\n      每个回报是 v_π(s) 的**独立同分布**、**方差有限**的估计\n      ⇒ 大数律 ⇒ 平均序列收敛到期望\n      每个平均**无偏**；误差标准差按 **1/√n** 下降\n      ⚠ 独立性来自「每幕只取一个」\n\n   每次访问 MC\n      「不那么直接，但估计也**二次**收敛」（Singh and Sutton, 1996）\n\n二十一点（Example 5.1）的参数：\n   一局 = 一幕；奖励 赢 +1 / 输 −1 / 平 0；局内其余奖励全零\n   **不打折（γ = 1）** ⇒ 终局奖励**就是**回报\n   状态 = 玩家点数(12–21，10) × 庄家明牌(A–10，10) × 可用 A(2)\n        = **200 个状态**\n   被评估的策略：点数 20 或 21 就停，否则要牌\n   ⚠ **50 万局**之后值函数逼近得很好（平均每状态 2500 次，且分布极不均匀）\n   ⚠ 可用 A 的那些状态「更不确定、更不规则，因为更少见」\n\n⭐ 反直觉的一条（本页要害）：\n   二十一点的环境我们**完全知道**，但用动态规划算值函数**并不容易**\n      DP 需要四参数函数 p —— 「玩家 14 点停牌，以 +1 结束的概率\n      是庄家明牌的什么函数？」\n      所有这些概率必须在 DP **之前**算出，而这类计算\n      「**往往复杂且容易出错**」\n   相比之下生成样本对局**容易**\n   ⇒ 「这种情况出奇地常见；蒙特卡洛仅凭样本幕工作的能力，\n      **即使在你完全知道动力学时也可能是显著优势**」", "tbl": {"head": ["", "首次访问 MC", "每次访问 MC"], "rows": [["回报之间", "<b>独立同分布</b>，方差有限", "<span class='w'>同幕内不独立</span>"], ["收敛依据", "<b>大数律，一眼可见</b>", "不那么直接（Singh & Sutton, 1996）"], ["每个平均是否无偏", "<b>是</b>", "—"], ["误差标准差", "<b>按 1/√n 下降</b>", "二次收敛"], ["二十一点规模", "<b>200 个状态 · 50 万局</b>", "—"], ["⚠ 反直觉的一条", "<b>完全知道动力学，DP 仍可能不好用</b>", "<b>因为 p 必须先算出来，而那往往复杂且易错</b>"]]}, "res": {"tag": "推断", "ref": "原书 5.1 节（逐句核对）· Singh & Sutton (1996)（书给的出处）· 简报 §4d 穷举 oracle · 简报 §4e 成本模型 R² > 0.95 · S&B 第 8 章精读 p1 科研格（分布 / 样本模型）", "v": "<b>二十一点那一段是你「为什么不直接把成本模型推广到准确率」这个问题的现成答案。</b><br><span class='k'><b>书的论点：知道动力学 ≠ 能用动态规划。</b></span><b>因为 DP 要的是<b>显式的概率分布</b>，而把它写出来「往往复杂且容易出错」，即使所有信息原则上都在你手里。</b><br><b>映射到你的两半：</b><br><span class='k'><b>成本那一半</b></span>：给定配置，各节点调用哪个档位、大致多少 token，<b>分布是能写出来的</b>（简报 §4e：回归 R² > 0.95）⇒ 可以做「期望更新」，不需要采样。<b>这对应书里的 DP 那一侧。</b><br><span class='w'><b>准确率那一半</b></span>：原则上你也「知道」动力学——模型是确定的、提示是确定的、温度是你设的。<b>但要写出「这个配置在这条 query 上答对的概率」的显式分布，和算二十一点那个 p 是同一类事：可做，而且复杂且容易出错到不值得做。</b><br>⇒ <b>三条：</b><br>① <b>这给了你一个<b>不基于「我们不知道」的理由</b>来为采样辩护。</b><b>审稿人若问「你们自己跑的管道，为什么说准确率只有样本模型」，答案不是「我们不了解模型」，而是「显式分布的计算复杂且易错，而采样容易——这正是 Sutton & Barto §5.1 对二十一点给的理由」。</b><br>② <b>1/√n 这个速率要老老实实带进预算估算。</b><b>书的二十一点用了 50 万幕换 200 个状态的好估计。你的一「幕」是一次真实的多节点 LLM 调用</b><span class='w'><b>——按 1/√n，要把准确率估计的标准差减半需要<b>四倍</b>的 query。</b></span><b>⇒ 简报 §4d 那个「200–300 条留出 query 的穷举 oracle」之所以是对的路线，正是因为它把「减方差」换成了「消方差」（真值没有采样误差），而不是在 1/√n 上硬堆。</b><br>③ ⚠ <b>注意一个会被问到的边界：前缀共享会破坏独立性。</b><b>首次访问 MC 收敛性的全部依据是「回报独立同分布」。而 §4d 的 oracle 表<b>跨分支共享前缀</b>（拓扑前缀一致的分支逐字复用节点输出）——这意味着同一条 query 下不同配置的结果<b>不独立</b>。</b><span class='k'><b>这对 oracle 表本身没问题（它要的是真值不是估计），但如果你拿这些共享前缀的结果去算<b>置信区间</b>，就必须按 query 聚类（cluster-robust / 按 query 做 bootstrap），不能当成独立样本。</b></span><b>这正好接上简报 §7 第 6 拳要的 paired bootstrap CI。</b>"}},
{"r": [5, 5], "t": "不自举，而且算一个状态的代价与状态总数无关", "star": 3, "quote": "<em>An important fact about Monte Carlo methods is that <b>the estimates for each state are independent</b>. The estimate for one state <b>does not build upon the estimate of any other state</b>, as is the case in DP. In other words, <b>Monte Carlo methods do not bootstrap</b>.</em><br><em>In particular, note that <b>the computational expense of estimating the value of a single state is independent of the number of states</b>. This can make Monte Carlo methods particularly attractive when <b>one requires the value of only one or a subset of states</b>.</em>", "one": "<b>蒙特卡洛的回溯图是「一整幕走到底的那一条路径」，不是动态规划那种「所有可能的一步转移」。由此来的两个性质：不自举；以及——算一个状态的值，代价与状态总数无关。</b>", "pts": ["<b>先看回溯图的两处差别，它们准确地反映了算法的根本差别。</b> <b>回溯图的通则是：顶上画要更新的根节点，下面画所有「其奖励与估值参与这次更新」的转移与叶节点。</b><span class='k'><b>① 动态规划的图画的是<b>所有可能</b>的转移；蒙特卡洛的图只画<b>这一幕上采到</b>的那些。</b></span><span class='k'><b>② 动态规划的图只含<b>一步</b>转移；蒙特卡洛的图<b>一直走到幕结束</b>。</b></span>", "<b>第一个重要性质：各状态的估计是<b>独立</b>的。</b> <span class='w'><b>「一个状态的估计<b>不</b>建立在任何其他状态的估计之上，而动态规划里是这样的。换句话说，蒙特卡洛方法<b>不自举</b>。」</b></span><b>⚠ 「不自举」在这里不是一句口号，它是上面那个回溯图的直接后果：既然更新只用这一幕上实际拿到的奖励，就没有任何「别人的估值」被代进来。</b>", "<b>第二个性质是本页最该记住的，而它常被读快。</b> <span class='k'><b>「特别注意：估计<b>单个</b>状态的值所需的计算量，<b>与状态的个数无关</b>。」</b></span><b>理由很直接：你只要从关心的那些状态出发生成许多样本幕，只对这些状态的回报取平均，<b>其余的一概不管</b>。</b><b>书把这列为蒙特卡洛相对动态规划的<b>第三条</b>优势（前两条是：能从真实经验学、能从模拟经验学）。</b>", "<b>⚠ 把这条性质和动态规划并排，差别是量级上的。</b> <b>动态规划做一次完整的策略评估，必须扫过<b>每一个</b>状态——哪怕你只关心其中一个。</b><span class='w'><b>而蒙特卡洛可以只盯着那一个。</b></span><b>书的措辞是「当你只需要一个状态或一小部分状态的值时，这可以让蒙特卡洛方法特别有吸引力」。</b><b>右边的科研格说明这条为什么正好打在你的问题上。</b>", "<b>Example 5.2 的肥皂泡例子，把「为什么随机游走能代替迭代」讲得很直观。</b> <b>铁丝圈浸肥皂水形成的曲面，其性质是每点所受邻点合力为零——也就是<b>曲面在任一点的高度等于它周围小圆上各点高度的平均</b>，再加上边界必须贴合铁丝框。</b><span class='k'><b>常规解法是打网格迭代：边界点固定，其余点反复调向四个最近邻的平均——「很像动态规划的迭代策略评估」。</b></span>", "<b>而蒙特卡洛的做法是：站在曲面上随机游走，直到走到边界。</b> <span class='w'><b>「结果是：边界处高度的<b>期望值</b>，就是所求曲面在起点处高度的一个很好的近似（事实上，它<b>恰好</b>等于上述迭代方法算出的值）。」</b></span><b>于是只要从某点出发走很多次、把边界高度平均一下，就能逼近该点的高度。</b><b>「如果你只关心一个点的值、或任何固定的一小组点，那么这个蒙特卡洛方法可以比基于局部一致性的迭代方法<b>高效得多</b>。」</b><b>⇒ 这个例子就是上面那条性质的几何版本。</b>"], "eq": "回溯图的两处差别：\n\n   动态规划   画**所有可能**的转移   只含**一步**\n   蒙特卡洛   只画**这一幕采到**的   **一直走到幕结束**\n\n由此来的两个性质：\n\n   ① 各状态的估计**独立**\n      一个状态的估计不建立在任何其他状态的估计之上\n      ⇒ **蒙特卡洛不自举**\n\n   ② ⭐ 估计**单个**状态的计算量，**与状态总数无关**\n      只从关心的状态出发生成样本幕，只平均这些状态的回报，其余不管\n      ⇒ 「只需要一个或一小部分状态的值时，蒙特卡洛特别有吸引力」\n      （这是蒙特卡洛相对 DP 的**第三条**优势；\n        前两条：能从真实经验学、能从模拟经验学）\n\n肥皂泡（Example 5.2）—— 上面那条性质的几何版：\n   曲面性质：任一点高度 = 周围小圆上各点高度的**平均**，边界贴合铁丝框\n   常规解法：打网格迭代，边界固定，其余调向四近邻的平均\n            （「很像 DP 的迭代策略评估」）\n   蒙特卡洛：从该点**随机游走**到边界，平均边界高度\n            ⚠ 它**恰好**等于迭代法算出的值\n            ⇒ 只关心一个点或一小组点时，可以**高效得多**", "tbl": {"head": ["", "动态规划", "蒙特卡洛"], "rows": [["回溯图画什么", "<b>所有可能</b>的转移", "<b>这一幕采到</b>的那条路径"], ["走多深", "<b>一步</b>", "<b>到幕结束</b>"], ["自举吗", "<b>自举</b>", "<span class='k'>不自举</span>"], ["估一个状态的代价", "<span class='w'>要扫过每一个状态</span>", "<b>与状态总数无关</b>"], ["只关心少数状态时", "<span class='w'>仍要全扫</span>", "<b>可以只盯着它们</b>"], ["几何版的例子", "网格迭代（局部一致性）", "<b>随机游走到边界取平均</b>"]]}, "res": {"tag": "推断", "ref": "原书 5.1 节末与 Example 5.2（逐句核对）· 简报 §4d「穷举 oracle，跨分支共享前缀」· 简报 §7 第 3 拳「构型空间 ≤32，可穷举」", "v": "<b>「估一个状态的代价与状态总数无关」这条，正是你那张穷举 oracle 表能成立的理由，而且它给了那个做法一个教科书名分。</b><br><span class='k'><b>你的「状态空间」是 2^k 个配置（k 个决策节点各二选一）。</b></span><b>动态规划式的思路会说：要评估策略就得把这个空间扫一遍，k 一大就爆炸。</b><span class='w'><b>而本页说：蒙特卡洛不必。你只要从关心的那几个配置出发采样，其余的一概不管，代价与 2^k 无关。</b></span><br><b>⇒ 简报 §4d 的做法（200–300 条留出 query，枚举 k 个节点的全部 2^k 种分配，跨分支共享前缀）正是这条性质的极端用法：</b><b>当你关心的「那一小部分状态」恰好<b>就是全部</b>（k=4 时只有 16 个），穷举就不再是妥协，而是最优解。</b><br><b>三条：</b><br>① <b>这给了简报 §7 第 3 拳一个更体面的回答。</b>那一拳是「|M|=2、H≤5 时构型空间 ≤32，可穷举，探索机制显得像表演」。<span class='k'><b>与其辩解「我们的探索机制有用」，不如承认并引用本页：<b>在状态子集很小时，蒙特卡洛的正确用法本来就是直接枚举那个子集——这不是方法的退化，是它的设计意图之一。</b></b></span><b>然后把「加宽保真度集合」作为让问题重新变得非平凡的手段，而不是作为对质疑的回避。</b><br>② <b>「不自举」这条也值得记在账上，因为它和第 13 章那条偏差结论是一对。</b><b>第 13 章说：critic 引入的偏差<b>不是</b>自举造成的，换蒙特卡洛也去不掉。</b><span class='w'><b>而本页说：蒙特卡洛<b>确实</b>不自举。</b></span><b>两条合起来：你用蒙特卡洛（或 oracle 真值）能消掉<b>自举</b>带来的偏差，但消不掉「用一个学到的函数去挑配置」那一条。</b><b>⇒ 只有 oracle 真值能同时消掉两者，这又一次指向 §4d。</b><br>③ ⚠ <b>但别把「代价与状态数无关」理解成「便宜」。</b><b>它说的是<b>不随 |S| 增长</b>，不是<b>小</b>。</b><b>每个关心的状态仍然要 n 条幕才能把标准差压到 1/√n——上一页二十一点用了 50 万局。你的一幕是一次真实的多节点 LLM 调用，所以真正的约束是 n，不是 2^k。</b>"}},
{"r": [6, 6], "t": "⭐ 确定性策略下，别的动作永远学不到——这正是你那个日志的病", "star": 3, "quote": "<em><b>The only complication is that many state–action pairs may never be visited.</b> <b>If π is a deterministic policy, then in following π one will observe returns only for one of the actions from each state.</b> <b>With no returns to average, the Monte Carlo estimates of the other actions will not improve with experience.</b> This is a serious problem because <b>the purpose of learning action values is to help in choosing among the actions</b> available in each state.</em><br><em>… we must assure <b>continual exploration</b>. One way … is by specifying that the episodes start in a state–action pair, and that <b>every pair has a nonzero probability of being selected as the start</b>. We call this the assumption of <b>exploring starts</b>.</em>", "one": "<b>没有模型时，光有状态值不够，必须估动作值。而估动作值立刻撞上一个问题：按一个确定性策略走，每个状态只会观察到一个动作的回报，其余动作的估计「不会随经验改善」。这正是你那份日志的病。</b>", "pts": ["<b>先说为什么必须估动作值。</b> <span class='k'><b>有模型时，光有状态值就够了：向前看一步，选那个「奖励加后继状态」组合最好的动作即可。</b></span><span class='w'><b>没有模型时不行——「必须显式地估计每个动作的值，这些值才对提示策略有用」。</b></span><b>所以蒙特卡洛方法的主要目标之一是估 q_*。</b><b>做法和状态值那边基本相同，只是把「访问一个状态」换成「访问一个状态–动作对」：若某幕中访问了状态 s 并在其中采取了动作 a，就说 s,a 在该幕中被访问。</b>", "<b>⚠ 然后是这一章里最该被记住的一句话，而它出现得比重要性采样早了七页。</b> <span class='w'><b>「<b>唯一的麻烦是，许多状态–动作对可能<b>永远</b>不会被访问。</b>如果 π 是一个<b>确定性</b>策略，那么按 π 走，每个状态只会观察到<b>一个</b>动作的回报。<b>没有回报可平均，其余动作的蒙特卡洛估计就<b>不会随经验改善</b>。</b>」</b></span>", "<b>书紧接着点明了这为什么是致命的，而不只是不方便。</b> <span class='k'><b>「这是一个严重的问题，因为<b>学动作值的全部目的，就是帮你在各状态可用的动作之间做选择</b>。」</b></span><b>「要比较各个备选项，我们需要估计每个状态下<b>所有</b>动作的值，而不只是当前偏好的那一个。」</b><b>⇒ 两句话的逻辑是：目的是比较，而比较需要覆盖；确定性策略提供不了覆盖，于是<b>它收集的数据在结构上就无法服务于它自己的目的</b>。</b>", "<b>书把这件事归到一个有名字的问题下面。</b> <b>「这就是<b>维持探索</b>的一般问题，第 2 章在 k 臂老虎机的语境下讨论过。要让动作值的策略评估能工作，我们必须保证<b>持续的探索</b>。」</b><span class='k'><b>⚠ 注意措辞是 must assure（必须保证），不是 should encourage。</b></span>", "<b>第一种办法是<b>试探性出发</b>，它的定义很具体。</b> <b>规定每一幕都<b>从一个状态–动作对开始</b>，而且<b>每一对都有非零概率被选为起点</b>。</b><span class='k'><b>「这保证了在无穷多幕的极限下，所有状态–动作对都会被访问无穷多次。」</b></span><b>⇒ 这是一个把覆盖问题「挪到起点上解决」的办法：不改变策略本身，只改变从哪开始。</b>", "<b>⚠ 而书立刻对它打了折扣，这个折扣对你尤其重要。</b> <span class='w'><b>「试探性出发的假设有时有用，但<b>一般而言不能依赖它</b>，<b>特别是在直接从与环境的真实交互中学习的时候</b>。在那种情况下，起始条件不太可能那么好心。」</b></span><b>「最常见的替代办法是只考虑<b>随机</b>的策略——在每个状态选择所有动作的概率都非零。」</b><b>⇒ 两条路：改起点（试探性出发，5.3 节用），或改策略（随机策略，5.4 与 5.5 节用）。而第二条正是通向离策与重要性采样的那条。</b>"], "eq": "为什么必须估**动作**值：\n\n   有模型   状态值就够：向前看一步，选「奖励 + 后继状态值」最好的动作\n   无模型   **不够** —— 必须显式估计每个动作的值\n   ⇒ 蒙特卡洛的主要目标之一是估 q_*\n\n⭐ 唯一的麻烦（本页要害，出现在重要性采样之前七页）：\n\n   许多状态–动作对可能**永远**不会被访问\n   若 π 是**确定性**策略 ⇒ 每个状态只观察到**一个**动作的回报\n   ⇒ **没有回报可平均，其余动作的估计不会随经验改善**\n\n   为什么致命（不只是不方便）：\n      学动作值的**全部目的**就是在各动作之间**做选择**\n      要比较就需要**所有**动作的值，不只是当前偏好的那个\n      ⇒ 确定性策略收集的数据，**在结构上无法服务于它自己的目的**\n\n两条出路：\n   ① **试探性出发**（exploring starts）—— 改**起点**\n      每幕从一个状态–动作对开始，**每一对都有非零概率被选为起点**\n      ⇒ 无穷幕极限下所有对都被访问无穷多次\n      ⚠ 「有时有用，但**一般不能依赖**，\n         **特别是直接从真实交互中学习时**」\n   ② **随机策略** —— 改**策略**\n      每个状态选所有动作的概率都非零\n      ⇒ 这条通向 5.4（无试探性出发）与 5.5（离策与重要性采样）", "tbl": {"head": ["", "改起点：试探性出发", "改策略：随机策略"], "rows": [["怎么保证覆盖", "每个 (s,a) 都有非零概率<b>做起点</b>", "每个状态选<b>所有动作</b>的概率都非零"], ["策略本身", "可以是确定性的", "<b>必须随机</b>"], ["书的评价", "<span class='w'>一般不能依赖，真实交互中尤其</span>", "<b>最常见的替代办法</b>"], ["本章在哪用", "5.3 节（Monte Carlo ES）", "<b>5.4、5.5 节</b>"], ["⚠ 不做任何一个会怎样", "<b>其余动作的估计永远不改善</b>", "<b>——而比较正是学动作值的目的</b>"]]}, "res": {"tag": "推断", "ref": "原书 5.2 节（逐句核对）· 简报 §4a「现有日志做不了 IS —— 不是方差大，是估计量不存在」· 简报 §9 动作 1「审计现有日志：有没有记动作分布」", "v": "<b>简报 §4a 那个结论，在这一页得到了一个比「deficient support」更朴素、也更有力的说法。</b><br><span class='k'><b>你的版本</b></span>：AFlow 每次运行固定模型配置，π_b(a|h) ∈ {0,1}；重要性采样要求覆盖，确定性日志下权重恒为 0；<b>「这不是『高方差的 IS』，是 IS 无定义」。</b><br><span class='w'><b>书的版本</b></span>：「如果 π 是确定性策略，每个状态只观察到一个动作的回报。<b>没有回报可平均，其余动作的估计不会随经验改善。</b>这是严重问题，因为<b>学动作值的全部目的就是在动作之间做选择</b>。」<br>⇒ <b>三点，其中第一点是写作上的实质改进：</b><br>① ⭐ <b>书的说法不依赖任何估计量的技术细节，所以更难被绕过。</b><b>「deficient support」是一个关于<b>某个估计量</b>的陈述，审稿人可以问「那换一个估计量呢」。</b><span class='k'><b>而本页的说法是关于<b>数据本身</b>的：没跑过的配置就是没有回报可平均，这与你用什么估计量无关。</b></span><b>⇒ 在论文里先说后者再说前者，逻辑会稳得多：</b><b>「确定性日志在结构上不含『其他配置会怎样』的信息（Sutton & Barto §5.2）；具体到重要性采样，这表现为 deficient support，估计量无定义。」</b><br>② <b>书给的两条出路，恰好对应你可以做的两件事，而且<b>第一条你做得起</b>。</b><span class='k'><b>「试探性出发」= 对每条 query 随机挑一个起始配置再跑完</b></span>——<b>这正是简报 §4d 那张 oracle 表的采样版，而且比全枚举便宜。</b><b>「随机策略」= 在节点执行器里加倾向性采样（§9 动作 2）。</b><span class='w'><b>⚠ 但书对第一条的警告要照搬：「一般不能依赖，特别是直接从真实交互中学习时」——也就是说<b>线上部署时你没法指定起点</b>，试探性出发只在离线实验里成立。</b></span><br>③ <b>「必须保证持续的探索」里的 must 要当真。</b><b>简报 §9 的动作 1 是「审计现有日志：有没有记动作分布，还是只有实际 model id」。</b><span class='w'><b>按本页，这个审计的结论基本是可以预判的——而更重要的是它决定了优先级：若没有记动作分布，那么<b>在补上记录之前，任何离策评估的工作都是空转</b>，不该先去调估计量。</b></span>"}},
{"r": [7, 8], "t": "控制：把策略迭代搬过来，然后承认两个假设都不现实", "star": 2, "quote": "<em>In GPI one maintains both an approximate policy and an approximate value function. … <b>These two kinds of changes work against each other to some extent, as each creates a moving target for the other</b>, but together they cause both policy and value function to approach optimality.</em><br><em><b>We made two unlikely assumptions</b> above in order to easily obtain this guarantee of convergence … One was that the episodes have <b>exploring starts</b>, and the other was that policy evaluation could be done with an <b>infinite number of episodes</b>. <b>To obtain a practical algorithm we will have to remove both.</b></em>", "one": "<b>控制部分完全照搬动态规划那一章的广义策略迭代，连策略改进定理都原样适用。代价是两个假设：试探性出发，和「策略评估可以用无穷多幕」。书立刻承认两个都不现实，并先拆掉第二个。</b>", "pts": ["<b>先看 GPI 这个框架，书对它有一句很坦白的描述。</b> <b>广义策略迭代同时维护一个近似策略和一个近似值函数：值函数被反复改动以更贴近当前策略的值函数，策略被反复改进以贴合当前的值函数。</b><span class='w'><b>「这两种改动在某种程度上<b>互相对抗</b>，因为每一个都为另一个制造了一个<b>移动的靶子</b>，但合在一起，它们使策略和值函数都趋向最优。」</b></span><b>⚠ 「移动的靶子」这个说法值得记——它是上一页那个「非平稳」在控制语境下的再现。</b>", "<b>蒙特卡洛版的经典策略迭代，形状和动态规划那章一模一样。</b> <b>π₀ →E q_{π₀} →I π₁ →E q_{π₁} →I π₂ →E ⋯ →I π_* →E q_*，其中 →E 表示一次<b>完整</b>的策略评估，→I 表示一次<b>完整</b>的策略改进。</b><span class='k'><b>策略评估就照上一节做：经历许多幕，近似动作值函数渐近逼近真值。</b></span><b>这里暂且假设我们确实观察到<b>无穷多</b>幕，而且这些幕是带<b>试探性出发</b>生成的——在这两个假设下，蒙特卡洛方法对任意 π_k 都能<b>精确</b>算出 q_{π_k}。</b>", "<b>策略改进这一步，有一个「没有模型也能做」的好处，值得点出来。</b> <b>做法是让策略对当前值函数<b>贪心</b>。</b><span class='k'><b>「这里我们有的是一个<b>动作</b>值函数，因此构造贪心策略<b>不需要模型</b>。」</b></span><b>即 (5.1)：π(s) ≐ argmax_a q(s,a)。</b><b>⚠ 对照状态值的情形：那里要贪心就得向前看一步，而向前看一步需要 p。这正是上一页「无模型时必须估动作值」的回报。</b>", "<b>策略改进定理原样适用，书把那串不等式完整写了出来。</b> <b>q_{π_k}(s, π_{k+1}(s)) = q_{π_k}(s, argmax_a q_{π_k}(s,a)) = max_a q_{π_k}(s,a) ≥ q_{π_k}(s, π_k(s)) ≥ v_{π_k}(s)。</b><span class='k'><b>定理保证每个 π_{k+1} 一致地不劣于 π_k，或与 π_k 一样好（那时两者都是最优策略）。</b></span><b>「这反过来保证整个过程收敛到最优策略与最优值函数。这样，蒙特卡洛方法就能<b>仅凭样本幕、不需要任何其他关于环境动力学的知识</b>，找到最优策略。」</b>", "<b>⚠ 然后书自己把账摊开了，而且用词很直接。</b> <span class='w'><b>「为了轻易地得到这个收敛保证，我们上面作了<b>两个不太可能的假设</b>。一个是幕有试探性出发，另一个是策略评估可以用<b>无穷多幕</b>来做。<b>要得到一个实用的算法，我们必须把两个都去掉。</b>」</b></span><b>第一个假设推迟到本章后面（5.4 节）处理，本节先拆第二个。</b>", "<b>拆「无穷多幕」有两条路，而书对第一条的评价很冷静。</b> <span class='k'><b>第一条：坚持在每次策略评估里逼近 q_{π_k}。</b></span>做测量与假设以获得误差幅度与概率的界，然后在每次策略评估里走足够多步让这些界足够小。<span class='w'><b>「这个办法大概可以做到完全令人满意，在『保证收敛到某个逼近水平』的意义上。然而它<b>也很可能需要太多的幕</b>，以至于在除最小问题之外的任何问题上都<b>不实用</b>。」</b></span>", "<b>第二条路才是本章实际走的，而它的理由在第 4 章就铺好了。</b> <span class='k'><b>「放弃在回到策略改进之前<b>完成</b>策略评估的想法。」</b></span>每个评估步只把值函数朝 q_{π_k} 挪一点，不指望真的接近。<b>书提醒这正是 4.6 节引入 GPI 时用过的想法；它的极端形式是<b>值迭代</b>（每次策略改进之间只做一次迭代策略评估），而就地版的值迭代更极端（对<b>单个状态</b>交替做改进与评估）。</b><b>⇒ 对蒙特卡洛策略迭代，自然的做法是<b>逐幕</b>交替：每幕结束后用观察到的回报做评估，然后在这一幕访问过的所有状态上改进策略。</b>"], "eq": "广义策略迭代（GPI）：\n\n   同时维护近似策略 π 与近似值函数 Q\n   ⚠ 「这两种改动在某种程度上**互相对抗**，\n      因为每一个都为另一个制造了一个**移动的靶子**」\n   —— 这是 p1 那个「非平稳」在控制语境下的再现\n\n蒙特卡洛版的经典策略迭代：\n\n   π₀ →E q_{π₀} →I π₁ →E q_{π₁} →I π₂ →E ⋯ →I π_* →E q_*\n      →E = 一次**完整**的策略评估   →I = 一次**完整**的策略改进\n\n贪心策略（5.1）：\n   π(s) ≐ argmax_a q(s,a)\n   ⚠ 有**动作**值函数时构造贪心策略**不需要模型**\n      （状态值那边要向前看一步，而那需要 p）\n\n策略改进定理（原样适用）：\n   q_{π_k}(s, π_{k+1}(s))\n     = q_{π_k}(s, argmax_a q_{π_k}(s,a))\n     = max_a q_{π_k}(s,a)\n     ≥ q_{π_k}(s, π_k(s))\n     ≥ v_{π_k}(s)\n   ⇒ 每个 π_{k+1} 一致地不劣于 π_k；若一样好则两者都最优\n\n⚠ 两个**不太可能**的假设（书自己的用词 unlikely）：\n   ① 幕有**试探性出发**            → 推迟到 5.4 节拆\n   ② 策略评估可用**无穷多幕**      → 本节拆\n   「要得到实用算法，我们必须把**两个都**去掉」\n\n拆第二个假设的两条路：\n   路一  坚持逼近 q_{π_k}：求误差界，走足够多步使界足够小\n         ⚠ 「大概可以做到令人满意……然而**也很可能需要太多的幕**，\n            在除最小问题外的任何问题上都**不实用**」\n   路二  **放弃在回到改进之前完成评估**（本章走这条）\n         极端形式 = 值迭代；就地版更极端（对单个状态交替）\n         ⇒ 蒙特卡洛的自然做法：**逐幕**交替", "tbl": {"head": ["", "路一：坚持逼近", "路二：放弃完成（本章）"], "rows": [["做法", "求误差界，走够多步使界足够小", "<b>每步只朝 q_{π_k} 挪一点</b>"], ["理论上", "<b>可做到令人满意</b>（收敛到某逼近水平）", "第 4.6 节的 GPI 思想"], ["实践上", "<span class='w'>很可能需要太多的幕，不实用</span>", "<b>可行</b>"], ["极端形式", "—", "值迭代；就地版对<b>单个状态</b>交替"], ["蒙特卡洛的自然粒度", "—", "<b>逐幕交替</b>"]]}},
{"r": [9, 9], "t": "Monte Carlo ES，和一个书自己说「最根本」的未解决问题", "star": 3, "quote": "<em>Convergence to this optimal fixed point seems inevitable as the changes to the action-value function decrease over time, but <b>has not yet been formally proved</b>. <b>In our opinion, this is one of the most fundamental open theoretical questions in reinforcement learning</b> (for a partial solution, see Tsitsiklis, 2002).</em><br><em>This policy is the same as the “basic” strategy of Thorp (1966) <b>with the sole exception of the leftmost notch</b> in the policy for a usable ace … <b>We are uncertain of the reason for this discrepancy</b>, but confident that what is shown here is indeed the optimal policy.</em>", "one": "<b>Monte Carlo ES 把前面所有零件装成一个算法：逐幕交替评估与改进，起点随机。而书在这一页承认：它收敛到最优不动点「看起来不可避免，但尚未被正式证明」——而且这是作者眼中最根本的开放问题之一。</b>", "pts": ["<b>先把算法读薄，它只比首次访问 MC 多了两行。</b> <b>初始化 π(s)、Q(s,a) 任意，Returns(s,a) 为空列表。每一幕：</b><span class='k'><b>① 随机选 S₀ ∈ S、A₀ ∈ A(S₀)，使得<b>所有对的概率都 > 0</b>（这就是试探性出发）；</b></span><b>② 从 S₀, A₀ 出发按 π 生成一幕；③ 倒着走，G ← γG + R_{t+1}；④ 除非 (S_t, A_t) 在更早出现过，把 G 追加进 Returns(S_t,A_t)，更新 Q(S_t,A_t) ← average(…)，<b>并立刻改进 π(S_t) ← argmax_a Q(S_t,a)</b>。</b>", "<b>第 ④ 步里那个「并立刻改进」就是上一页说的「逐幕交替」。</b> <span class='k'><b>策略改进不等到评估完成，而是在每幕结束后、对这一幕访问过的每个状态当场做。</b></span><b>⚠ 习题 5.4 顺带指出这个伪代码是低效的：它为每个状态–动作对维护一整张回报列表并反复算均值。照 2.4 节的办法改成只维护均值与计数的增量形式即可——5.6 节会正式给出。</b>", "<b>关于正确性，书先给了一个很干净的「不可能收敛到次优」的论证。</b> <b>「在 Monte Carlo ES 里，每个状态–动作对的所有回报都被累积并平均，<b>不管它们被观察到时在执行的是什么策略</b>。」</b><span class='k'><b>「容易看出 Monte Carlo ES <b>不可能</b>收敛到任何次优策略：若它收敛了，那么值函数最终会收敛到那个策略的值函数，而这又会导致策略改变。<b>只有当策略和值函数<b>都</b>最优时，才达到稳定。</b>」</b></span><b>⇒ 这是一个「反证式」的论证：次优是不稳定的。</b>", "<b>⚠ 但书紧接着承认这还不是证明，而且用词相当重。</b> <span class='w'><b>「随着对动作值函数的改动随时间减小，收敛到这个最优不动点<b>看起来不可避免</b>，<b>但尚未被正式证明</b>。<b>在我们看来，这是强化学习里最根本的开放理论问题之一</b>（部分解答见 Tsitsiklis, 2002）。」</b></span><b>⇒ 注意这三段话的层次：「不可能收敛到次优」是证明了的；「一定会收敛到最优」<b>没有</b>。两者之间差着「会不会根本不收敛」这个可能性。</b>", "<b>Example 5.3 把 Monte Carlo ES 用在二十一点上，而它的结论里有一处诚实的保留。</b> <span class='k'><b>因为所有幕都是模拟对局，安排覆盖全部可能的试探性出发很容易：庄家的牌、玩家点数、是否有可用 A，全部等概率随机取。</b></span><b>初始策略用上一个例子里那个「只在 20 或 21 停牌」的策略，初始动作值函数可以全零。</b>", "<b>结果与一份 1966 年的权威策略只差一处，而书没有掩盖这个差异。</b> <b>「这个策略与 Thorp (1966) 的『基本』策略相同，<b>唯一的例外</b>是可用 A 那张图里<b>最左边的那个缺口</b>，它在 Thorp 的策略里没有。」</b><span class='w'><b>「<b>我们不确定这个差异的原因</b>，但确信这里展示的确实是我们所描述的这个版本的二十一点的最优策略。」</b></span><b>⇒ 一个值得学的表述方式：<b>把不一致如实报出来，说明自己确信的范围，并把差异限定在「我们所描述的这个版本」上</b>——既不硬说对方错，也不含糊自己的结论。</b>"], "eq": "Monte Carlo ES（试探性出发），估计 π ≈ π_*：\n\n   初始化：\n       π(s) ∈ A(s) 任意，对所有 s ∈ S\n       Q(s,a) ∈ R 任意，对所有 s ∈ S, a ∈ A(s)\n       Returns(s,a) ← 空列表\n   永远循环（每一幕）：\n       **随机**选 S₀ ∈ S, A₀ ∈ A(S₀)，使**所有对的概率 > 0**   ← 试探性出发\n       从 S₀, A₀ 出发按 π 生成一幕：S₀, A₀, R₁, …, S_{T−1}, A_{T−1}, R_T\n       G ← 0\n       **倒着**循环 t = T−1, …, 0：\n           G ← γG + R_{t+1}\n           除非 (S_t, A_t) 出现在更早的 (S₀,A₀),…,(S_{t−1},A_{t−1}) 里：\n               把 G 追加进 Returns(S_t, A_t)\n               Q(S_t, A_t) ← average( Returns(S_t, A_t) )\n               **π(S_t) ← argmax_a Q(S_t, a)**        ← 当场改进\n\n   ⚠ 习题 5.4：这个伪代码低效（维护整张回报列表并反复算均值），\n      照 2.4 节改成增量形式；5.6 节正式给出\n\n正确性的两个层次（别混）：\n   ✓ **不可能收敛到次优** —— 已论证\n     若收敛到次优，值函数会收敛到该策略的值函数，\n     而那会导致策略改变 ⇒ 只有策略与值函数**都**最优才稳定\n   ✗ **一定收敛到最优** —— 「看起来不可避免，但**尚未被正式证明**」\n     「在我们看来，这是强化学习里**最根本的开放理论问题之一**」\n     （部分解答见 Tsitsiklis, 2002）\n   ⇒ 两者之间差着「会不会根本**不**收敛」这个可能性\n\nExample 5.3 的一处诚实保留：\n   结果与 Thorp (1966) 的「基本」策略相同，\n   **唯一例外**是可用 A 那张图**最左边的缺口**（Thorp 没有）\n   「**我们不确定这个差异的原因**，但确信这里展示的\n     确实是**我们所描述的这个版本**的二十一点的最优策略」", "tbl": {"head": ["结论", "证明了吗", "书的原话"], "rows": [["不可能收敛到次优策略", "<b>是</b>", "easy to see … cannot converge to any suboptimal policy"], ["一定收敛到最优不动点", "<span class='w'>否</span>", "<b>seems inevitable … but has not yet been formally proved</b>"], ["这个缺口有多大", "—", "<b>「强化学习里最根本的开放理论问题之一」</b>（部分解答：Tsitsiklis, 2002）"], ["与 Thorp (1966) 的差异", "<b>如实报出</b>", "唯一例外是可用 A 图最左边的缺口；<b>「我们不确定原因」</b>"]]}, "res": {"tag": "已核", "ref": "原书 5.3 节与 Example 5.3（逐句核对）· 简报 §7 第 6 拳「提升在统计上是真的吗」· 简报 §2「纠正：AFlow 的搜索不是 UCT-MCTS」", "v": "<b>这一页有两条可以直接借用的<b>写作</b>范例，而不是技术内容。</b><br><span class='k'><b>① 把「证明了什么」和「只是看起来对」分开写。</b></span><b>书的处理：「不可能收敛到次优」有论证，就说 easy to see；「一定收敛到最优」没有，就说 seems inevitable but has not yet been formally proved，<b>并且主动把它标成「最根本的开放问题之一」</b>。</b><br><b>⇒ 对照你的处境：简报 §7 第 2 拳说「你的 bound 假设线性可实现性，请论证」，而建议的回答是「<b>论证不了，也别试</b>，写一小节『我们不主张什么』」。</b><span class='w'><b>本页就是那一小节的写法范本：不是含糊过去，而是<b>精确地</b>说出「这一条证明了、那一条没有、缺口在哪、谁做了部分解答」。</b></span><b>Tsitsiklis (2002) 那个「部分解答」的引用方式尤其值得学——它让「尚未证明」这句话显得是查过文献的结论，而不是偷懒。</b><br><span class='k'><b>② 与权威结果不一致时怎么报。</b></span><b>书的结果和 Thorp (1966) 差一个缺口。它的处理是三句话：指出差异的<b>确切位置</b>（可用 A 图最左边）；<b>承认不知道原因</b>（We are uncertain of the reason）；把自己的确信<b>限定在自己定义的版本上</b>（the version of blackjack we have described）。</b><br><b>⇒ 这正是你复现 AFlow 基线时会遇到的情形。简报 §2 已经记录了一次「我先前告诉你 AFlow 的搜索就是 MCTS，这是错的」的更正。</b><span class='w'><b>当你跑出的数字和原论文对不上时，照这个三段式写：差异在哪、原因未知、我们的结论只覆盖我们的设置。</b></span><b>⚠ 特别是<b>不要</b>反过来断言对方错了——书有能力那么说却没有说，而这恰恰让它的结论更可信。</b>"}},
{"r": [10, 10], "t": "在策与离策的分野，以及 ε-软策略的确切定义", "star": 3, "quote": "<em>The only general way to ensure that all actions are selected infinitely often is for <b>the agent to continue to select them</b>. There are two approaches … <b>on-policy</b> methods attempt to evaluate or improve <b>the policy that is used to make decisions</b>, whereas <b>off-policy</b> methods evaluate or improve <b>a policy different from that used to generate the data</b>.</em><br><em>The ε-greedy policies are examples of <b>ε-soft policies</b>, defined as policies for which <b>π(a|s) ≥ ε/|A(s)|</b> for all states and actions, for some ε > 0. Among ε-soft policies, <b>ε-greedy policies are in some sense those that are closest to greedy</b>.</em>", "one": "<b>要去掉试探性出发，唯一的一般办法是让智能体自己持续去选所有动作。由此分出两条路：在策（评估/改进的就是用来做决策的那个策略）与离策（评估/改进的是另一个策略）。本节走在策，下一节走离策。</b>", "pts": ["<b>先看这一节要解决什么，以及为什么只有一条一般的出路。</b> <b>问题是：怎么避开试探性出发这个不太可能的假设？</b><span class='k'><b>「保证所有动作被选中无穷多次的<b>唯一一般办法</b>，是让智能体<b>持续地去选它们</b>。」</b></span><b>⚠ 注意这句话排除了「靠起点」这条路——起点只能安排一次，而「持续」是每一步的事。</b>", "<b>由此分出两类方法，而书给的定义很干净。</b> <span class='k'><b>在策方法：试图评估或改进<b>那个被用来做决策的</b>策略。</b></span><span class='w'><b>离策方法：评估或改进<b>一个不同于用来生成数据的</b>策略。</b></span><b>前面那个 Monte Carlo ES 就是在策方法的例子。</b><b>本节给出一个不用试探性出发的在策控制方法；离策留到下一节。</b>", "<b>在策控制里策略一般是「软」的，而「软」有确切含义。</b> <b>软 = π(a|s) > 0 对所有 s ∈ S 与所有 a ∈ A(s) 成立，但<b>逐渐向一个确定性的最优策略靠拢</b>。</b><span class='k'><b>⚠ 注意这两半：既要处处非零（保证覆盖），又要能收紧（最终接近最优）。第 2 章讨论过的很多方法都提供了这种机制。</b></span>", "<b>本节用的是 ε-贪心策略，它的概率分配值得写清楚。</b> <b>大部分时候选估计动作值最大的那个动作，但以概率 ε 改为随机选一个。</b><span class='k'><b>具体地：所有<b>非贪心</b>动作各分到<b>最小</b>的选择概率 ε/|A(s)|；剩下的大头 <b>1 − ε + ε/|A(s)|</b> 给贪心动作。</b></span><b>⚠ 注意贪心动作那一项里也含 ε/|A(s)|——因为「随机选一个」时它也可能被选中。把 |A(s)| 项加起来恰好是 1。</b>", "<b>ε-贪心只是 ε-软的一个例子，而 ε-软的定义更宽。</b> <span class='w'><b>「ε-软策略定义为：对所有状态与动作，<b>π(a|s) ≥ ε/|A(s)|</b>，其中 ε > 0。」</b></span><b>也就是说只要求一个<b>下界</b>，不规定剩下的概率怎么分。</b><span class='k'><b>而书给了 ε-贪心在这个类里的位置：「在 ε-软策略当中，ε-贪心策略在某种意义上是<b>最接近贪心</b>的那些。」</b></span><b>⇒ ε-软是约束，ε-贪心是在该约束下尽可能贪心的解。</b>", "<b>把这一页和 5.2 节并排看，逻辑链就完整了。</b> <b>5.2 节说：确定性策略下其余动作的估计永不改善，必须保证持续探索。</b><b>本页说：保证持续探索的唯一一般办法是让策略本身处处非零（软）。</b><span class='w'><b>而「软」的代价在本节末尾会结账：你最终只能得到<b>ε-软策略当中</b>的最优，而不是全局最优。</b></span><b>⇒ 这就是在策方法的那个「妥协」，而下一节的离策方法正是为了绕开它。</b>"], "eq": "去掉试探性出发的唯一一般办法：\n   让智能体**持续地去选**所有动作（起点只能安排一次，不够）\n\n两条路：\n   **在策**  评估/改进的就是**用来做决策**的那个策略\n            （Monte Carlo ES 就是在策）\n   **离策**  评估/改进的是**不同于生成数据**的那个策略（下一节）\n\n「软」策略：\n   π(a|s) > 0 对所有 s, a；但**逐渐向确定性最优策略靠拢**\n   ⚠ 两半缺一不可：处处非零（覆盖） + 能收紧（最终接近最优）\n\nε-贪心的概率分配：\n   非贪心动作   各得 **ε/|A(s)|**           ← 最小的选择概率\n   贪心动作     得 **1 − ε + ε/|A(s)|**    ← 剩下的大头\n   ⚠ 贪心那一项里也含 ε/|A(s)|（随机选时它也可能中），加起来恰为 1\n\nε-软策略（更宽的类）：\n   **π(a|s) ≥ ε/|A(s)|** 对所有状态与动作，某个 ε > 0\n   只要求**下界**，不规定剩下的概率怎么分\n   ⇒ 「在 ε-软策略当中，ε-贪心**在某种意义上最接近贪心**」\n   ⇒ ε-软是**约束**，ε-贪心是该约束下尽可能贪心的**解**", "tbl": {"head": ["", "在策（本节）", "离策（下一节）"], "rows": [["评估/改进谁", "<b>用来做决策的那个</b>", "<b>不同于生成数据的那个</b>"], ["怎么保证覆盖", "策略本身<b>处处非零</b>（软）", "行为策略负责覆盖"], ["能达到什么", "<span class='w'>ε-软策略当中的最优</span>", "<b>真正的最优</b>"], ["书的评价", "<b>是一个妥协</b>", "更有力、更一般，但方差更大、收敛更慢"], ["ε-软的定义", "<b>π(a|s) ≥ ε/|A(s)|</b>，只是下界", "—"], ["ε-贪心的位置", "<b>ε-软当中最接近贪心的</b>", "—"]]}},
{"r": [11, 12], "t": "ε-软版的策略改进定理，和那个「把 ε 挪进环境里」的技巧", "star": 2, "quote": "<em>Fortunately, <b>GPI does not require that the policy be taken all the way to a greedy policy, only that it be moved toward a greedy policy</b>. … For any ε-soft policy, π, <b>any ε-greedy policy with respect to q_π is guaranteed to be better than or equal to π</b>.</em><br><em>Consider a new environment that is just like the original environment, except with <b>the requirement that policies be ε-soft “moved inside” the environment</b>. … <b>The best one can do in this new environment with general policies is the same as the best one could do in the original environment with ε-soft policies.</b></em>", "one": "<b>GPI 不要求把策略一路推到贪心，只要求朝贪心<b>挪</b>。于是在策方法只把它挪到 ε-贪心，而策略改进定理照样适用。至于「这个过程停在哪」，书用了一个很漂亮的技巧：把 ε 挪进环境里。</b>", "pts": ["<b>先看为什么不能一路贪心到底。</b> <span class='w'><b>「没有试探性出发的假设，我们就<b>不能</b>简单地让策略对当前值函数贪心，因为那会阻止对非贪心动作的进一步探索。」</b></span><span class='k'><b>「幸运的是，GPI <b>不</b>要求把策略一路推到贪心策略，只要求把它<b>朝</b>贪心策略挪。」</b></span><b>⇒ 在策方法就只把它挪到 ε-贪心为止。</b>", "<b>这样挪仍然保证改进，而且是策略改进定理的直接后果。</b> <b>「对任何 ε-软策略 π，<b>任何</b>相对 q_π 的 ε-贪心策略都保证<b>不劣于</b> π。」</b><b>证明的关键在 (5.2) 那一步：把 q_π(s, π′(s)) 展开成 ε/|A(s)| · Σ_a q_π(s,a) + (1−ε) max_a q_π(s,a)，然后把 max 换成一个<b>加权平均</b>的下界。</b><span class='k'><b>书给的理由写在括号里：「这个和是一个权重非负、和为 1 的加权平均，因此它必然<b>小于等于</b>被平均的那些数里最大的那个」。</b></span><b>⇒ 用 max ≥ 加权平均这一步把不等号做出来，剩下的代数化简到 v_π(s)。</b>", "<b>算法本身就是 Monte Carlo ES 去掉试探性出发、加上 ε-贪心的更新。</b> <b>唯一的算法参数是一个小的 ε > 0；π 初始化为任意 ε-软策略。</b><span class='k'><b>每幕按 π 生成（<b>不再随机指定起点</b>），倒着走算 G，首次访问时更新 Q(S_t,A_t)，然后取 A* ← argmax_a Q(S_t,a)，再把 π(·|S_t) 按 ε-贪心重新分配概率。</b></span>", "<b>⚠ 接下来是这两页里最值得学的一手：怎么证明「等号只在 ε-软最优时成立」。</b> <b>书构造了一个<b>新环境</b>：和原环境一样，只是把「策略必须是 ε-软」这个要求<b>「挪进了环境里面」</b>。</b><span class='w'><b>新环境的行为是：在状态 s 采取动作 a 时，以概率 1 − ε 完全照旧环境走；以概率 ε <b>等概率地重新随机挑一个动作</b>，然后按新动作照旧环境走。</b></span>", "<b>这个构造的妙处在于它把一个受约束的优化变成了一个无约束的优化。</b> <span class='k'><b>「在这个新环境里用<b>一般</b>策略能做到的最好，与在原环境里用 <b>ε-软</b>策略能做到的最好，是<b>同一回事</b>。」</b></span><b>于是可以引入新环境的最优值函数 ṽ_*，并断言：一个策略 π 在 ε-软策略中最优，<b>当且仅当</b> v_π = ṽ_*。</b><b>而 ṽ_* 是带修改转移概率的 Bellman 最优方程 (3.19) 的<b>唯一</b>解。</b>", "<b>最后一步是比对两个方程，结论就出来了。</b> <b>当等号成立、ε-软策略 π 不再被改进时，由 (5.2) 可以写出 v_π 满足的方程；而它<b>与 ṽ_* 满足的那个方程完全相同，只是把 ṽ_* 换成了 v_π</b>。</b><span class='k'><b>「因为 ṽ_* 是<b>唯一</b>解，所以必然 v_π = ṽ_*。」</b></span><b>⇒ 书对这几页的总结是：「实质上，我们证明了<b>策略迭代对 ε-软策略也成立</b>。用 ε-软策略的自然贪心概念，每一步都保证改进，除非已经在 ε-软策略中找到了最好的那个。」</b><span class='w'><b>⚠ 但要记住代价：「现在我们只达到 <b>ε-软策略当中</b>的最优策略，不过另一方面，我们<b>消除了试探性出发的假设</b>。」</b></span><b>⚠ 还有一条前提：「这个分析与各阶段的动作值函数<b>如何</b>确定无关，但它确实假设了它们是<b>精确</b>算出来的。」</b>"], "eq": "为什么不能一路贪心：\n   没有试探性出发时，直接贪心会**阻止对非贪心动作的进一步探索**\n   ⇒ 但 GPI **不要求**推到贪心，**只要求朝贪心挪**\n   ⇒ 在策方法只挪到 **ε-贪心**\n\n改进的保证（(5.2) 那一步）：\n   q_π(s, π′(s)) = Σ_a π′(a|s) q_π(s,a)\n                 = ε/|A(s)| · Σ_a q_π(s,a) + (1−ε) · **max_a** q_π(s,a)\n                 ≥ ε/|A(s)| · Σ_a q_π(s,a)\n                   + (1−ε) · Σ_a [ (π(a|s) − ε/|A(s)|) / (1−ε) ] q_π(s,a)\n                     ↑ 把 max 换成一个**权重非负、和为 1 的加权平均**\n                       （max **必然 ≥** 任何这样的加权平均）\n                 = … 化简 … = v_π(s)\n   ⇒ 策略改进定理给出 π′ ≥ π\n\n⭐ 「把 ε 挪进环境里」（证明等号只在 ε-软最优时成立）：\n\n   造一个**新环境**：与原环境相同，但把「策略必须 ε-软」**挪进环境内部**\n      在 s 采取 a 时：\n         以概率 **1 − ε**  完全照旧环境走\n         以概率 **ε**      **等概率重新随机挑一个动作**，再照旧环境走\n\n   关键断言：\n      在**新**环境里用**一般**策略能做到的最好\n      = 在**原**环境里用 **ε-软**策略能做到的最好\n   ⇒ 受约束的优化 **变成** 无约束的优化\n\n   于是：π 在 ε-软中最优  ⟺  v_π = ṽ_*\n   而 ṽ_* 是带修改转移概率的 Bellman 最优方程 (3.19) 的**唯一**解\n   等号成立时 v_π 满足的方程与 ṽ_* 的**完全相同** ⇒ v_π = ṽ_*\n\n本节的结账：\n   ✓ 消除了**试探性出发**的假设\n   ✗ 只达到 **ε-软策略当中**的最优，不是全局最优\n   ⚠ 分析假设动作值函数是**精确**算出来的", "tbl": {"head": ["", "Monte Carlo ES（5.3 节）", "在策首次访问 MC 控制（本节）"], "rows": [["起点", "<b>随机指定</b>（试探性出发）", "<b>不指定</b>，按 π 自然生成"], ["策略改进到哪", "一路到<b>贪心</b>", "<b>只到 ε-贪心</b>"], ["覆盖靠什么", "起点", "<b>策略本身处处非零</b>"], ["达到的最优性", "全局最优", "<span class='w'>ε-软策略当中的最优</span>"], ["去掉的假设", "—", "<b>试探性出发</b>"], ["仍然假设", "—", "<b>动作值函数被精确算出</b>"]]}},
{"r": [13, 13], "t": "⭐ 覆盖假设：π(a|s) > 0 必须蕴含 b(a|s) > 0", "star": 3, "quote": "<em>All learning control methods face a dilemma: <b>They seek to learn action values conditional on subsequent optimal behavior, but they need to behave non-optimally in order to explore all actions.</b> … The on-policy approach in the preceding section is actually <b>a compromise</b>.</em><br><em>we require that <b>every action taken under π is also taken, at least occasionally, under b</b>. That is, we require that <b>π(a|s) > 0 implies b(a|s) > 0</b>. This is called the <b>assumption of coverage</b>. It follows from coverage that <b>b must be stochastic in states where it is not identical to π</b>. <b>The target policy π, on the other hand, may be deterministic</b> …</em>", "one": "<b>所有学习控制方法都面对同一个两难：要学的是「之后按最优行为走」的动作值，却必须非最优地行动才能探索。离策的办法是用两个策略。而它要求的那个条件有名字：覆盖。</b>", "pts": ["<b>先把两难说清楚，它比「探索与利用」的常见说法更精确。</b> <span class='k'><b>「它们想学的动作值，是以<b>之后按最优行为走</b>为条件的；但为了探索所有动作（以便找到最优动作），它们<b>必须非最优地行动</b>。」</b></span><b>「怎么能一边按一个探索性的策略行动，一边学到关于<b>最优</b>策略的事？」</b><span class='w'><b>而上一节那个在策办法「其实是一个<b>妥协</b>」——它学的不是最优策略的动作值，而是一个<b>仍在探索的、接近最优的</b>策略的动作值。</b></span>", "<b>离策的办法更直截了当：用<b>两个</b>策略。</b> <span class='k'><b>一个被学习、并将成为最优策略的，叫<b>目标策略</b>（target policy）；一个更具探索性、用来产生行为的，叫<b>行为策略</b>（behavior policy）。</b></span><b>「这时我们说学习是从<b>偏离</b>目标策略的数据中进行的，整个过程称为<b>离策学习</b>。」</b>", "<b>书对离策的代价与好处给了一个很平衡的交代，两边都要记。</b> <span class='w'><b>代价：「离策方法需要额外的概念与记号；而且<b>因为数据来自一个不同的策略</b>，离策方法往往<b>方差更大、收敛更慢</b>。」</b></span><span class='k'><b>好处：「另一方面，离策方法<b>更有力、更一般</b>。它们把在策方法包含为<b>目标策略与行为策略相同</b>的那个特例。」</b></span><b>书还列了几个额外用途，其中一个对你直接相关：<b>「它们常常可以用来从一个传统的、非学习的控制器产生的数据中学习，或者从人类专家那里学习。」</b></b>", "<b>⚠ 然后是本页的要害：使用行为策略的数据有一个<b>前提</b>，而这个前提有名字。</b> <span class='w'><b>「为了用来自 b 的幕去估计 π 的值，我们要求：<b>π 之下会采取的每一个动作，在 b 之下也至少偶尔会被采取</b>。也就是说，我们要求 <b>π(a|s) > 0 蕴含 b(a|s) > 0</b>。这叫做<b>覆盖假设</b>（the assumption of coverage）。」</b></span>", "<b>覆盖假设立刻推出一个对行为策略的硬要求。</b> <span class='k'><b>「由覆盖可以推出：在 b 与 π 不相同的那些状态上，<b>b 必须是随机的</b>。」</b></span><b>⚠ 注意这句话的精确范围：不是「b 处处必须随机」，而是「<b>在 b 与 π 不同的那些状态上</b>必须随机」。</b><b>在两者本来就一致的状态上，确定性是无害的。</b>", "<b>而目标策略那一边恰恰相反，书特别点出这一点。</b> <span class='k'><b>「目标策略 π 则<b>可以是确定性的</b>，而且事实上，这正是控制应用中<b>特别值得关注</b>的情形。」</b></span><b>在控制里，目标策略通常就是对当前动作值估计的确定性贪心策略；它会变成一个确定性的最优策略，而行为策略保持随机、更具探索性（例如 ε-贪心）。</b><b>⇒ 这正是你想要的形状：<b>最终上线的策略可以是确定性的，</b><b>需要随机的只有用来采数据的那个。</b>右边的科研格展开这一点。</b>"], "eq": "所有学习控制方法的两难：\n   想学的动作值以「**之后按最优行为走**」为条件\n   却**必须非最优地行动**才能探索所有动作\n   ⇒ 在策的办法是**妥协**：学的是一个仍在探索的、接近最优的策略的值\n\n离策：用**两个**策略\n   **目标策略** π   被学习、将成为最优策略\n   **行为策略** b   更具探索性、用来产生行为\n\n   代价：需要额外概念与记号；**方差更大、收敛更慢**\n   好处：**更有力、更一般**；在策是 π = b 的特例\n         可用于从**非学习的控制器**或**人类专家**的数据中学习\n\n⭐⭐ **覆盖假设**（the assumption of coverage）：\n\n   **π(a|s) > 0  ⟹  b(a|s) > 0**\n   白话：π 之下会采取的每个动作，b 之下也至少**偶尔**会被采取\n\n   直接推论：\n      **在 b 与 π 不相同的那些状态上，b 必须是随机的**\n      ⚠ 不是「b 处处必须随机」——两者本来一致的状态上确定性无害\n\n   而另一边：\n      **目标策略 π 可以是确定性的**\n      「事实上这正是控制应用中**特别值得关注**的情形」\n      控制里 π 通常就是对当前 Q 估计的**确定性贪心**策略，\n      而 b 保持随机、更具探索性（例如 ε-贪心）", "tbl": {"head": ["", "目标策略 π", "行为策略 b"], "rows": [["干什么用", "<b>被学习</b>，将成为最优策略", "<b>产生行为</b>，采数据"], ["可以确定吗", "<b>可以</b>——「控制应用中特别值得关注的情形」", "<span class='w'>在与 π 不同的状态上必须随机</span>"], ["典型形式", "对当前 Q 的<b>确定性贪心</b>", "<b>ε-贪心</b>等"], ["覆盖假设要求", "—", "<b>π(a|s) &gt; 0 ⟹ b(a|s) &gt; 0</b>"], ["在策是什么", "<b>π = b 的特例</b>", "—"], ["离策的代价", "<span class='w'>方差更大、收敛更慢</span>", "—"]]}, "res": {"tag": "推断", "ref": "原书 5.5 节（逐句核对）· 简报 §4a「deficient support」· 简报 §4c「只随机化 top k=3~4 个节点」· 简报 §9 动作 2", "v": "<b>覆盖假设的<b>精确范围</b>，恰好给了简报 §4c 那个「只随机化 top k 个节点」一个理论依据，而不只是一个 ESS 上的权宜。</b><br><span class='k'><b>书的原话：由覆盖推出「<b>在 b 与 π 不相同的那些状态上</b>，b 必须是随机的」。</b></span><b>⚠ 注意它<b>没有</b>说「b 处处必须随机」。</b><br>⇒ <b>映射到你的管道：</b><br><span class='w'><b>你要随机化的，只是「候选策略与已跑配置<b>可能不同</b>的那些节点」。</b></span><b>简报 §4c 的做法是按一步偏离敏感度排序，只保留 top k=3~4 作为随机化决策节点，其余按扫描结果<b>钉死</b>。</b><span class='k'><b>而钉死的那些节点，正是「目标策略与行为策略本来就一致」的那些——按本页，在那里确定性是<b>无害</b>的，不违反覆盖。</b></span><br><b>三条：</b><br>① ⭐ <b>这把「降有效时域」从一个方差上的妥协，改写成了一个<b>正确</b>的做法。</b><b>原来的说法是「ESS 从 n·2⁻¹⁰ 提到 n·2⁻⁴，64 倍」——听起来像是为了省样本而牺牲了覆盖。</b><b>按本页，只要你把候选策略类<b>限定</b>在「只在那 k 个节点上与基线不同」，覆盖假设就是<b>完全满足</b>的，没有任何牺牲。</b><b>⚠ 关键在于<b>先限定策略类，再谈覆盖</b>，而不是反过来。</b><br>② <b>目标策略可以确定，这解决了一个部署上的顾虑。</b><b>书明说目标策略「可以是确定性的，而且这正是控制应用中特别值得关注的情形」。</b><span class='k'><b>⇒ 你最终上线的路由器<b>不必</b>随机——需要随机的只有用来采数据的那个。</b></span><b>这对「随机化会不会让线上系统变差」这个质疑是一个干净的回答：不会，因为上线的不是它。</b><br>③ ⚠ <b>但要注意书给离策记的那笔账：「方差更大、收敛更慢」。</b><b>这不是可以靠设计绕开的，是方法固有的。</b><b>而简报 §4d 的穷举 oracle 恰恰<b>不是</b>离策方法——它直接跑目标配置，是<b>在策</b>的。</b><span class='w'><b>⇒ 这给了「为什么在付得起的规模上宁可穷举也不做 OPE」一个教科书依据：离策的代价是<b>方法本身</b>带来的，而不是你的实现不够好。</b></span>"}},
{"r": [14, 14], "t": "⭐ 重要性采样比：MDP 的转移概率在分子分母里抵消了", "star": 3, "quote": "<em><b>Although the trajectory probabilities depend on the MDP’s transition probabilities, which are generally unknown, they appear identically in both the numerator and denominator, and thus cancel.</b> The importance sampling ratio ends up depending <b>only on the two policies and the sequence, not on the MDP</b>.</em><br><em>These returns have <b>the wrong expectation</b> E[G_t|S_t=s] = v_b(s) and so <b>cannot be averaged</b> to obtain v_π. This is where importance sampling comes in. <b>The ratio ρ_{t:T−1} transforms the returns to have the right expected value.</b></em>", "one": "<b>重要性采样比是「这条轨迹在目标策略下的概率 ÷ 在行为策略下的概率」。关键在于：轨迹概率里那些 MDP 的转移概率在分子分母里一模一样，直接抵消——于是这个比值只依赖两个策略和实际走过的那串动作，完全不依赖 MDP。</b>", "pts": ["<b>先看为什么需要它。</b> <b>我们想估的是<b>目标</b>策略下的期望回报，但手上只有<b>行为</b>策略产生的回报 G_t。</b><span class='w'><b>「这些回报的期望是<b>错</b>的：E[G_t|S_t=s] = v_b(s)，因此<b>不能</b>拿来平均以得到 v_π。」</b></span><b>重要性采样就是来修这件事的：它是「给定来自一个分布的样本、估计<b>另一个</b>分布下的期望值」的一般技术。</b>", "<b>轨迹概率的形状很简单：策略项与转移项交替相乘。</b> <b>给定起始状态 S_t，后续轨迹 A_t, S_{t+1}, A_{t+1}, …, S_T 在任意策略 π 下出现的概率是π(A_t|S_t) p(S_{t+1}|S_t,A_t) π(A_{t+1}|S_{t+1}) ⋯ p(S_T|S_{T−1},A_{T−1})，即 ∏_{k=t}^{T−1} π(A_k|S_k) p(S_{k+1}|S_k,A_k)。</b><span class='k'><b>其中 p 是 (3.4) 定义的状态转移概率函数。</b></span>", "<b>⚠ 现在是这一页的要害，而它是整个离策方法能成立的根基。</b> <b>重要性采样比 ρ_{t:T−1} 就是这两个概率的比值。而分子分母里的 p 项<b>完全相同</b>。</b><span class='w'><b>「虽然轨迹概率依赖于 MDP 的转移概率——而它们<b>一般是未知的</b>——但它们在分子和分母里<b>以完全相同的形式出现，因此相互抵消</b>。」</b></span><span class='k'><b>「重要性采样比最终<b>只</b>依赖于那两个策略和那个序列，<b>不</b>依赖 MDP。」</b></span><b>⇒ 于是 (5.3)：ρ_{t:T−1} ≐ ∏_{k=t}^{T−1} π(A_k|S_k) / b(A_k|S_k)。</b>", "<b>把这件事的分量说透：它意味着你<b>不需要知道环境</b>就能做离策修正。</b> <b>你需要的只有三样：目标策略在实际走过的那些 (s,a) 上的概率、行为策略在同样那些 (s,a) 上的概率、以及实际走过的那串动作。</b><span class='w'><b>⚠ 但代价也在同一个式子里：它是一个<b>连乘</b>。每多一步就多乘一个比值，而比值可以大于 1 也可以小于 1。</b></span><b>这就是离策方法「方差更大」的来源，5.5 节后面那个无穷方差的例子会把它演到极端。</b>", "<b>有了比值，(5.4) 就说明它确实把期望修对了。</b> <span class='k'><b>E[ρ_{t:T−1} G_t | S_t = s] = v_π(s)。</b></span><b>「比值 ρ_{t:T−1} 把这些回报<b>变换成具有正确的期望值</b>。」</b><b>⇒ 注意这是一个关于<b>期望</b>的陈述，对方差什么都没说——下一页就会讨论方差。</b>", "<b>最后是记号约定，它看起来琐碎但后面几个式子全靠它。</b> <b>把时间步<b>跨幕连续编号</b>：若第一幕在时刻 100 终止，下一幕就从 t = 101 开始。</b><span class='k'><b>于是可以定义 <b>T(s)</b> = 所有访问过状态 s 的时间步的集合（这是<b>每次访问</b>版；首次访问版只含每幕中对 s 的首次访问）；<b>T(t)</b> = 时刻 t 之后<b>第一个</b>终止时刻；G_t = t 之后直到 T(t) 的回报。</b></span><b>⇒ 普通重要性采样 (5.5)：V(s) ≐ Σ_{t∈T(s)} ρ_{t:T(t)−1} G_t / |T(s)|，也就是「按比值缩放回报，然后<b>简单平均</b>」。</b>"], "eq": "为什么需要重要性采样：\n   手上只有行为策略产生的 G_t，而 E[G_t|S_t=s] = **v_b(s)**，期望是**错**的\n   ⇒ 不能直接平均\n\n轨迹概率（任意策略 π 下）：\n   Pr{ A_t, S_{t+1}, …, S_T | S_t, A_{t:T−1} ∼ π }\n     = π(A_t|S_t) p(S_{t+1}|S_t,A_t) π(A_{t+1}|S_{t+1}) ⋯ p(S_T|S_{T−1},A_{T−1})\n     = ∏_{k=t}^{T−1} π(A_k|S_k) p(S_{k+1}|S_k,A_k)\n\n⭐⭐ 重要性采样比（5.3）：\n\n                ∏_{k=t}^{T−1} π(A_k|S_k) **p(S_{k+1}|S_k,A_k)**\n   ρ_{t:T−1} ≐ ───────────────────────────────────────────────\n                ∏_{k=t}^{T−1} b(A_k|S_k) **p(S_{k+1}|S_k,A_k)**\n                                  ↑ 分子分母**完全相同，抵消**\n\n                           T−1  π(A_k|S_k)\n              =            ∏    ──────────\n                          k=t   b(A_k|S_k)\n\n   ⇒ 「只依赖那**两个策略**和那个**序列**，**不依赖 MDP**」\n   ⇒ 做离策修正**不需要知道环境**\n   ⚠ 但它是一个**连乘** —— 每多一步多乘一个比值\n      这就是离策「方差更大」的来源\n\n期望被修对了（5.4）：\n   E[ ρ_{t:T−1} G_t | S_t = s ] = v_π(s)\n   ⚠ 这只是关于**期望**的陈述，对**方差**什么都没说\n\n记号（后面几式全靠它）：时间步**跨幕连续编号**\n   T(s)  = 所有访问过 s 的时间步的集合（每次访问版；\n           首次访问版只含每幕中对 s 的首次访问）\n   T(t)  = 时刻 t 之后**第一个**终止时刻\n   G_t   = t 之后直到 T(t) 的回报\n\n**普通**重要性采样（5.5）：\n            Σ_{t∈T(s)} ρ_{t:T(t)−1} G_t\n   V(s) ≐  ─────────────────────────────    ← **简单平均**\n                      |T(s)|", "tbl": {"head": ["ρ 依赖什么", "需要知道吗", "为什么"], "rows": [["目标策略 π 在走过的 (s,a) 上的概率", "<b>需要</b>", "分子"], ["行为策略 b 在同样 (s,a) 上的概率", "<b>需要</b>", "分母"], ["实际走过的那串动作", "<b>需要</b>", "决定连乘哪些项"], ["MDP 的转移概率 p", "<span class='k'>不需要</span>", "<b>分子分母完全相同，抵消</b>"], ["奖励函数", "<span class='k'>不需要</span>", "ρ 里根本没有它"], ["⚠ 代价在哪", "—", "<b>ρ 是连乘，每多一步多乘一个比值</b>"]]}, "res": {"tag": "推断", "ref": "原书 5.5 节 (5.3)(5.4)(5.5)（逐式核对渲染图）· 简报 §4b「ESS = m，E[m] = n·2^(−k)」· 简报 §4e「per-decision IS 对准确率那一半买不到任何东西」· S&B 第 13 章精读 p5-6 科研格", "v": "<b>「MDP 的转移概率抵消了」这一条，和第 13 章那条「策略梯度定理不含状态分布的导数」是同一类好消息，而且它们的边界也同样要划清。</b><br><span class='k'><b>共同点：两者都说「你不必建模环境怎么被策略改变」。</b></span><b>第 13 章是求梯度时 ∇ 不落在转移核上；本页是算比值时 p 在分子分母里抵消。</b><br><b>⇒ 对你那条「节点 h 的决策改变 h+1 的输入分布」的担忧，这里给了第二个角度的回答：</b><span class='w'><b>上游决策确实改变了下游看到的输入分布，但那个改变在 ρ 的分子分母里<b>是同一个</b>，所以它不进入权重。</b></span><b>你需要记录的只有<b>各节点的动作概率</b>，不需要建模「这个中间结果有多好」。</b><br><span class='w'><b>⚠ 但代价就在同一个式子里，而且简报 §4b 已经算过：ρ 是<b>连乘</b>。</b></span><b>k 个决策节点均匀二选一、目标策略确定时，匹配的轨迹权重 w = 2^k、不匹配的 w = 0，于是 <b>ESS = m，E[m] = n·2^(−k)</b>。</b><span class='k'><b>本页给了这个坍塌的结构性原因：ρ 的方差来自连乘，而连乘的项数就是决策步数。⇒ 要治它只能<b>减少项数</b>（降有效时域），不能靠换估计量。</b></span><br><b>两条具体的：</b><br>① ⭐ <b>ρ 里没有奖励，这一点值得单独记。</b><b>比值只由两个策略的动作概率决定，与回报长什么样完全无关。</b><b>⇒ 这正是简报 §4e 那条判断的根据：<b>per-decision IS 对准确率那一半买不到任何东西</b>。</b><span class='k'><b>per-decision IS 的好处来自「t 时刻的奖励只需要被 t 之前的比值加权」；而你的准确率奖励全在 t = H，所以它需要<b>全部</b> H 个比值——算术上就退化成轨迹 IS。</b></span><b>⚠ 而成本那一半是<b>逐步</b>产生的，所以 per-decision 对它<b>确实有用</b>。这个区别的根源就在本页：ρ_{t:h} 只到 h，而奖励在哪一步决定了你需要乘到哪里。</b><br>② <b>「不依赖 MDP」也意味着「不能借 MDP 的力」。</b><span class='w'><b>ρ 完全不用环境知识，这是优点也是局限：它<b>没有</b>利用「你其实知道成本模型 R² > 0.95」这件事。</b></span><b>⇒ 这又一次支持了拆成两半：成本那一半<b>不该</b>走 IS（有分布模型，直接回归），只有准确率那一半才需要。<b>对有分布模型的那一半用 IS，是白白放弃已有的信息。</b></b>"}},
{"r": [15, 15], "t": "⭐ 普通 vs 加权重要性采样：无偏与有界方差，只能选一个", "star": 3, "quote": "<em><b>Ordinary importance sampling is unbiased whereas weighted importance sampling is biased</b> (though the bias converges asymptotically to zero). On the other hand, <b>the variance of ordinary importance sampling is in general unbounded</b> because the variance of the ratios can be unbounded, whereas <b>in the weighted estimator the largest weight on any single return is one</b>.</em><br><em>In fact, assuming bounded returns, <b>the variance of the weighted importance-sampling estimator converges to zero even if the variance of the ratios themselves is infinite</b> (Precup, Sutton, and Dasgupta 2001). <b>In practice, the weighted estimator usually has dramatically lower variance and is strongly preferred.</b></em>", "one": "<b>普通 IS 用简单平均，加权 IS 用加权平均。前者无偏但方差可以无界，后者有偏但任一单条回报的权重最大是 1。书的结论很明确：实践中加权版方差低得多，强烈推荐。</b>", "pts": ["<b>两个估计量的差别只在分母。</b> <b>普通 IS (5.5) 的分母是 |T(s)|，即访问次数；加权 IS (5.6) 的分母是 <b>Σ_{t∈T(s)} ρ_{t:T(t)−1}</b>，即那些比值之和（分母为零时取零）。</b><span class='k'><b>⇒ 一个是「缩放后简单平均」，一个是「按比值加权平均」。</b></span>", "<b>书用「只观察到一条回报」这个极端情形把两者的性格讲透了。</b> <span class='k'><b>加权版：那一条回报的 ρ 在分子分母里<b>约掉了</b>，于是估计<b>等于观察到的那条回报本身</b>，与比值无关（只要比值非零）。</b></span><b>「既然这是唯一观察到的回报，这是一个合理的估计——<b>但它的期望是 v_b(s) 而不是 v_π(s)，在统计意义上它是<b>有偏</b>的。</b>」</b>", "<b>普通版在同样情形下的表现则相反，而书举的数字很说明问题。</b> <span class='w'><b>「相比之下，普通重要性采样估计量的首次访问版期望<b>永远</b>是 v_π(s)（无偏），<b>但它可以很极端</b>。」</b></span><b>「假设比值是 10，意味着观察到的这条轨迹在目标策略下的可能性是行为策略下的 10 倍。这时普通重要性采样的估计就是观察到的回报的 <b>10 倍</b>。也就是说，<b>它会离观察到的回报相当远，哪怕这一幕的轨迹被认为非常能代表目标策略</b>。」</b><span class='k'><b>⚠ 这句话里的讽刺值得品：越能代表目标策略（比值越大），估计偏得越离谱。</b></span>", "<b>把差别形式化，就是偏差与方差的一组对换。</b> <span class='k'><b>普通 IS：<b>无偏</b>。</b></span><span class='w'><b>加权 IS：<b>有偏</b>（但偏差渐近收敛到零）。</b></span><span class='w'><b>普通 IS：方差<b>一般是无界的</b>，因为比值的方差可以无界。</b></span><span class='k'><b>加权 IS：<b>任一单条回报上的最大权重是 1</b>。</b></span><b>⇒ 最后这一条是加权版方差有界的全部原因：分母和分子用的是同一批 ρ，任何一条回报在加权平均里的份额都不超过 1。</b>", "<b>而书给了一个更强的结论，带出处。</b> <span class='w'><b>「事实上，<b>假设回报有界</b>，加权重要性采样估计量的方差收敛到零——<b>即使那些比值本身的方差是无穷的</b>」（Precup, Sutton, and Dasgupta 2001）。</b></span><b>「实践中，加权估计量通常方差<b>低得多</b>，而且是<b>强烈推荐</b>的。」</b><b>⚠ 但书没有把普通版完全丢掉，理由是前瞻性的：「它<b>更容易推广到本书第二部分探讨的、用函数逼近的近似方法</b>。」</b>", "<b>最后一段讲每次访问版，结论和首次访问版不一样，别记混。</b> <span class='w'><b>「普通与加权重要性采样的<b>每次访问</b>版<b>都是有偏的</b>，不过偏差同样随样本数增加而渐近落到零。」</b></span><span class='k'><b>「实践中每次访问版常被偏爱，因为它们<b>免去了跟踪哪些状态被访问过</b>的需要，而且<b>更容易推广到近似方法</b>。」</b></span><b>⇒ 于是实用组合往往是「每次访问 + 加权」：两处有偏，但都渐近消失，换来实现简单与方差低。</b>"], "eq": "两个估计量只差分母：\n\n   **普通** IS（5.5）        Σ_{t∈T(s)} ρ_{t:T(t)−1} G_t  /  **|T(s)|**\n   **加权** IS（5.6）        Σ_{t∈T(s)} ρ_{t:T(t)−1} G_t  /  **Σ_{t∈T(s)} ρ_{t:T(t)−1}**\n                            （分母为零时取零）\n\n只观察到**一条**回报时（书用来讲性格的极端情形）：\n   加权：ρ 在分子分母里**约掉** ⇒ 估计 = **观察到的那条回报本身**\n        合理，但期望是 **v_b(s)** 而非 v_π(s) ⇒ **有偏**\n   普通：期望**永远**是 v_π(s) ⇒ **无偏**，但**可以很极端**\n        比值 = 10 ⇒ 估计 = 观察回报的 **10 倍**\n        ⚠ 讽刺之处：**越能代表目标策略（比值越大），偏得越离谱**\n\n形式化的对换：\n                      偏差            方差\n   普通 IS            **无偏**         **一般无界**（比值方差可无界）\n   加权 IS            有偏（渐近→0）   **有界**\n                                      理由：**任一单条回报的最大权重是 1**\n\n   更强的结论（Precup, Sutton, and Dasgupta 2001）：\n      **假设回报有界**，加权版方差收敛到零 ——\n      **即使比值本身的方差是无穷的**\n\n   ⇒ 「实践中加权估计量通常方差**低得多**，**强烈推荐**」\n   ⚠ 但不丢掉普通版：它**更容易推广到函数逼近**（第二部分）\n\n每次访问版（结论**不同**，别记混）：\n   普通与加权的每次访问版**都是有偏的**（偏差渐近→0）\n   但实践中常被偏爱：**免去跟踪哪些状态被访问过**，且更易推广到近似方法\n   ⇒ 实用组合常是「**每次访问 + 加权**」", "tbl": {"head": ["", "普通 IS（5.5）", "加权 IS（5.6）"], "rows": [["分母", "<b>|T(s)|</b>（访问次数）", "<b>Σ ρ</b>（比值之和）"], ["首次访问版偏差", "<b>无偏</b>", "<span class='w'>有偏</span>（渐近→0）"], ["方差", "<span class='w'>一般无界</span>", "<b>有界</b>（单条最大权重 = 1）"], ["回报有界时", "—", "<b>方差→0，即使比值方差无穷</b>"], ["只看到一条回报", "<span class='w'>比值 10 ⇒ 估计是回报的 10 倍</span>", "<b>就等于那条回报本身</b>"], ["每次访问版", "<span class='w'>有偏</span>", "<span class='w'>有偏</span>"], ["书的推荐", "更易推广到函数逼近，<b>不丢</b>", "<b>强烈推荐</b>"]]}, "res": {"tag": "推断", "ref": "原书 5.5 节（逐
