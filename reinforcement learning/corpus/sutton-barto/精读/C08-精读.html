{"r": [24, 25], "t": "启发式搜索：深搜的好处不在「多步」，在「聚焦」", "star": 3, "quote": "<em>In heuristic search, for each state encountered, a <b>large tree of possible continuations</b> is considered. The approximate value function is applied to the <b>leaf nodes</b> and then backed up toward the current state at the root … then <b>all backed-up values are discarded</b>.</em><br><em>heuristic search can be viewed as an <b>extension of the idea of a greedy policy beyond a single step</b>.</em><br><em>if the search is all the way to the end of the episode, then the effect of the <b>imperfect value function is eliminated</b>.</em><br><em>the performance improvement observed with deeper searches is <b>not due to the use of multistep updates as such</b>. Instead, it is due to the <b>focus and concentration of updates</b> on states and actions immediately downstream from the current state.</em>", "one": "<b>启发式搜索就是把贪心策略往前延伸不止一步。而深搜之所以更好，不是因为「多步更新」这件事本身——是因为算力被压在了当前状态的下游。</b>", "pts": ["<b>先看机制：对遇到的每个状态，展开一棵很大的「可能的后续」树；把近似值函数用在<b>叶子</b>上，然后往根方向回收。</b> <span class='k'>回收用的就是全书反复出现的那种带 max 的期望更新</span>；<b>回收停在根节点的那些状态-动作节点上，选最好的那个动作，然后<b>把所有回收出来的值丢掉</b>。</b>", "<b>书里点出传统启发式搜索的一个特点，而它和 RL 的立场正相反</b>：<span class='w'>不仅不保存回收的值，连值函数本身「一般都是人设计的，而且绝不因搜索而改变」</span>。<b>而「让值函数随搜索改进」是很自然的下一步——书说「某种意义上我们一直在这么做」。</b>", "<b>接着是一个很好的重新定位：贪心、ε-贪心、UCB 这些动作选择方法，「其实和启发式搜索没什么不同，只是规模小得多」。</b> <span class='k'>要算贪心动作，你本来就要往前看一步：枚举每个动作、每个可能的下一状态，算上奖励和估值，再挑最好的</span>。<b>这也是在算「回收值」，只是不保存。</b><b>于是：<em>启发式搜索可以看成把贪心策略的想法延伸到一步以外</em>。</b>", "<b>深搜为什么有用，书给了一个干净的极限论证。</b> <span class='w'>有完美模型但值函数不完美时，搜得越深通常策略越好</span>；<b>而如果一路搜到幕末，<b>不完美值函数的影响就被完全消掉了</b>，这样定出的动作必然最优</b>。<span class='k'>搜到深度 k 使 γ^k 很小时，动作也相应地接近最优。</span>", "<b>代价当然是算力与响应时间，而 TD-Gammon 是书里给的实例。</b> <span class='w'>它用 TD 学习通过大量自我对弈学了一个后状态值函数，走子时用启发式搜索</span>；<b>Tesauro 发现搜得越深棋越好，但每步耗时越长</b>——<span class='k'>西洋双陆棋分支因子大，而走子必须在几秒内完成，所以只能有选择地往前看几步，但即便如此也显著改善了动作选择。</span>", "<b>然后是这一节最该记住的那一点，而它纠正了一个很常见的误解。</b> <span class='w'>书说：可以把启发式搜索实现成「<b>一串一步更新</b>」，从叶子往根按特定顺序做（图 8.9）</span>；<b>如果顺序这么排、而且用表格表示，那么<b>总的更新效果和深度优先的启发式搜索完全一样</b></b>。", "<b>于是结论就逼出来了</b>：<em>the performance improvement observed with deeper searches is <b>not due to the use of multistep updates as such</b>. Instead, it is due to the <b>focus and concentration of updates</b> on states and actions immediately downstream from the current state.</em> <span class='k'>好处不在「多步」这个性质，而在「算力被压在了要紧的地方」</span>。", "<b>书里把这个「聚焦」的直觉讲得很好，那个跳棋的比方值得记。</b> <em>You may spend more of your life playing chess than checkers, but when you play checkers, it pays to think about <b>checkers</b> and about <b>your particular checkers position</b>, your likely next moves, and successor positions.</em> <span class='w'>不管你怎么选动作，正是这些状态和动作最该被更新、最该让你的近似值函数在那里准。</span>", "<b>而「聚焦」不只省算力，也省内存——这一点容易被略过。</b> <span class='k'>国际象棋的局面多到不可能为每个存一个估值</span>；<b>但基于启发式搜索的程序「可以轻松地为它从<b>单个</b>局面往前看时遇到的那上百万个局面各存一个估值」</b>。<span class='w'>书认为这种把算力和内存都高度集中在当前决策上的做法，大概就是启发式搜索如此有效的原因。</span>"], "eq": "启发式搜索（决策时规划的经典形态）：\n   对当前状态展开一棵大的「可能后续」树\n   近似值函数用在**叶子**上 ──▶ 往根方向回收（带 max 的期望更新）\n   回收停在根的状态-动作节点 ⇒ 选最好的动作 ⇒ **所有回收值丢掉**\n\n   传统做法：不保存回收值，而且值函数**由人设计、绝不因搜索而改变**\n   （让值函数随搜索改进是很自然的下一步 —— 书说「某种意义上我们一直在这么做」）\n\n重新定位：贪心 / ε-贪心 / UCB「和启发式搜索没什么不同，只是规模小得多」\n   算贪心动作本来就要往前看一步、算回收值，只是不保存\n   ⇒ **启发式搜索 = 把贪心策略延伸到一步以外**\n\n深搜为什么有用（极限论证）：\n   完美模型 + 不完美值函数 ⇒ 搜得越深通常越好\n   一路搜到幕末 ⇒ **不完美值函数的影响被完全消掉**，动作必然最优\n   深度 k 使 γ^k 很小 ⇒ 动作接近最优\n   代价：算力与响应时间（TD-Gammon：越深越好，但每步越慢）\n\n⚠ **本节最该记住的一点**（图 8.9）：\n   启发式搜索可以实现成「一串**一步**更新」，从叶子按序往根做\n   表格表示下，总效果与深度优先启发式搜索**完全一样**\n   ⇒ 深搜的好处 **不是因为「多步更新」这件事本身**\n     而是因为更新被**聚焦**在当前状态**下游紧邻**的状态和动作上\n\n跳棋的比方：你这辈子下国际象棋也许比跳棋多，\n   但当你在下跳棋时，值得想的是**跳棋**、是**你眼前这个局面**\n\n聚焦省的不只是算力，还有内存：\n   象棋局面多到不可能每个存一个估值\n   但启发式搜索程序能轻松为「从**单个**局面前瞻时遇到的上百万个局面」各存一个", "tbl": {"head": ["常见误解", "书里的纠正"], "rows": [["深搜更好是因为用了<b>多步</b>更新", "<b>不是</b>。它可以拆成一串一步更新，效果完全一样"], ["那是因为什么", "<b>因为更新被聚焦在当前状态下游紧邻处</b>"], ["启发式搜索是另一类方法", "<b>它就是贪心策略延伸到一步以外</b>"], ["值函数不准就没救", "<b>搜到幕末可完全消掉它的影响</b>（代价是算力）"], ["聚焦省的是算力", "<b>也省内存</b>——只为当前决策附近的局面存估值"]]}, "res": {"tag": "推断", "v": "<b>「深搜的好处不在多步、在聚焦」这句话，对你有一个直接的、而且是<b>否定式</b>的用处：它劝你别去追更复杂的估计量。</b><br><span class='k'>书的论证很硬：同样的计算可以拆成一串一步更新，效果完全一样，所以收益不来自「方法更高级」，而来自「算力花在了对的地方」</span>。<b>翻译到你这里：与其去找一个更精巧的 G 估计量（更复杂的 OPE、更花哨的回归），不如把同样的预算更集中地花在难分的那几对配置上</b>。<span class='w'>前者是「多步」，后者是「聚焦」——而这一节说后者才是真正起作用的那个。</span><br><b>这条可以写成论文里一个很有说服力的消融</b>：<span class='k'>固定总预算，对照「均匀分配 + 复杂估计量」与「聚焦分配 + 最朴素的均值估计」</span>。<b>如果后者赢（按这一节的论证很可能赢），那你就证明了收益来自预算分配而不是估计量</b>——<b>而这是一个比「我们的估计量更好」更难被质疑的结论，因为它不依赖任何估计量的假设。</b><br><b>而「聚焦也省内存」那一条有一个很实际的对应。</b> <span class='w'>书说：象棋局面多到不可能每个存一个估值，但从单个局面前瞻时遇到的上百万个局面可以各存一个</span>。<b>你的对应：2^H 个配置不可能每个都在 oracle 表里有一行，但「从当前基线一步、两步可达」的那几百个完全可以</b>。<span class='k'>这正是你那张表实际的样子，而这一节解释了为什么这样是对的——不是将就，是正确的资源分配。</span><br><b>⚠ 一处要注意的不对称：书里深搜的极限论证（搜到幕末就消掉值函数误差）在你这里<b>不</b>成立。</b> <span class='w'>它成立的前提是「完美模型」</span>——<b>搜到底就等于真的算了一遍</b>。<b>而你的成本模型不完美，搜得再深也消不掉它的偏差</b>；<span class='k'>而唯一能「搜到底」的方式就是真跑一遍 workflow，那不叫规划，那叫测量</span>。<b>所以在你这里，「深搜」的收益是有天花板的，天花板就是成本模型的偏差。这一条该写进局限。</b>", "ref": "原书 8.9 节与图 8.9（逐句核对）· 简报 §4c §4e（已核）· CS234 L16 p47"}, "link": {"t": "你学过的对应：CS234 L16（p26「前向搜索」与 p30「expectimax 的 (|S||A|)^H」——那一讲从算力代价的角度讲同一件事，而这里补上了「好处来自聚焦而非多步」这个纠正）", "href": "../../cs234-2019/中文精读/L16-精读.html"}},
{"r": [26, 26], "t": "rollout 算法：目标是改进那个 rollout 策略，不是求最优", "star": 3, "quote": "<em>the goal of a rollout algorithm is <b>not</b> to estimate a complete optimal action-value function … Instead, they produce Monte Carlo estimates of action values <b>only for each current state</b> and for a given policy usually called the <b>rollout policy</b>.</em><br><em>In other words, <b>the aim of a rollout algorithm is to improve upon the rollout policy; not to find an optimal policy</b>.</em><br><em>In some applications, a rollout algorithm can produce good performance <b>even if the rollout policy is completely random</b>.</em><br><em>it is possible to <b>monitor</b> the Monte Carlo simulations and <b>prune away candidate actions that are unlikely to turn out to be the best</b>, or whose values are <b>close enough to that of the current best that choosing them instead would make no real difference</b>.</em>", "one": "<b>rollout 就是：对当前状态的每个动作各模拟一批轨迹、取平均、挑最大。它的目标被书说得很克制——不是求最优，而是把那个 rollout 策略改进一点。</b>", "pts": ["<b>机制和 CS234 L16 p29 讲的「简单蒙特卡洛搜索」是同一个东西，而这里把它的理论身份说得更准。</b> <span class='k'>依据是 4.2 节的策略改进定理：若 <code>q_π(s,a) ≥ v_π(s)</code>，则「在 s 改选 a、其后仍按 π」的策略不差于 π；严格不等则严格更好</span>。<b>而模拟轨迹的平均回报正好给出 <code>q_π(s,a′)</code> 的估计。</b>", "⚠️ <b>但书在这里加了一个比 CS234 更精确的限定，值得留意。</b> <em>The result is like one step of the policy-iteration algorithm … <b>though it is more like one step of asynchronous value iteration</b> … because <b>it changes the action for just the current state</b>.</em> <span class='w'>策略迭代的一步会在<b>所有</b>状态上改策略；而 rollout 只改当前这一个</span>——<b>所以它更像异步值迭代。</b>", "<b>于是那句定位就很自然了</b>：<em>the aim of a rollout algorithm is to <b>improve upon the rollout policy</b>; not to find an optimal policy</em>。<span class='k'>这和 CS234 L16 p29 得出的「上限由 π 决定」是同一个结论，只是书把它直接写成了目标</span>。", "<b>书里有一个很反直觉、但重要的经验观察</b>：<em>a rollout algorithm can produce good performance <b>even if the rollout policy is completely random</b></em>。<span class='w'>随机策略改进一步，居然就够用</span>——<b>Tesauro &amp; Galperin 当年对 rollout 给西洋双陆棋带来的提升「感到惊讶」。</b>", "<b>但书立刻把条件补全了，这一句不能漏</b>：<em>the performance of the improved policy depends on properties of the rollout policy <b>and the ranking of actions produced by the Monte Carlo value estimates</b></em>。<span class='k'>注意是<b>排序</b>，不是估值本身准不准</span>——<b>只要排对了序，估值偏多少都无所谓。</b>", "<b>而「更好的 rollout 策略是不是一定更好」，书留了一个带引用的保留</b>：<em>Intuition suggests that the better the rollout policy … the better the policy produced … <b>(but see Gelly and Silver, 2007)</b></em>。<span class='w'>直觉上成立，但有反例</span>——<b>这和 CS234 L16 p57 那条「rollout 策略越强，估的越接近 q^π 而不是 q*」是同一个张力。</b>", "<b>耗时由四件事决定，列出来有助于判断可行性</b>：<span class='k'>每个决策要评估多少动作 · 模拟轨迹要走多少步 · rollout 策略自己做一次决策要多久 · 要多少条轨迹才够</span>。<b>四项相乘，就是每做一个决策的代价。</b>", "⚠️ <b>而书给的三个缓解办法里，第三个几乎就是「逐次淘汰」的原型，值得逐字记。</b> ① <span class='w'>各次蒙特卡洛试验<b>相互独立</b>，可以在不同处理器上<b>并行</b>跑</span>；② <b>截断</b>轨迹、用一个存好的评估函数修正被截断的回报；③ <b>监控模拟过程、剪掉那些「不太可能成为最优」、或者「其值与当前最优足够接近、以致选它也没有实质差别」的候选动作</b>。", "<b>第 ③ 条里那个「足够接近以致选它也没差别」的判据，比「它更差」这个判据聪明。</b> <span class='k'>两个动作值几乎相同时，继续花算力区分它们是没有意义的——不管选哪个结果都一样</span>。<b>这是一个「何时可以停」的判据，而不只是「谁更好」的判据。</b>", "⚠️ <b>但书也点出 ① 和 ③ 是互相冲突的</b>：<em>though Tesauro and Galperin point out that this would <b>complicate a parallel implementation</b></em>。<span class='w'>剪枝要看已有结果才能决定剪谁，而并行的那些试验看到的是旧状态</span>——<b>并行与自适应剪枝天然打架。</b>", "<b>最后书给了 rollout 一个很准的定位：它不算学习算法，但它用了 RL 的几乎全部性格。</b> <span class='k'>不保存长期的值或策略记忆（所以不算学习）；但它靠轨迹采样避开 DP 的穷举扫描、靠样本更新避开对分布模型的需求、并靠策略改进性质贪心地行动</span>。"], "eq": "rollout 算法 = 对当前状态的每个动作各模拟一批轨迹，取平均，挑最大\n\n依据：策略改进定理（4.2 节）\n   若 q_π(s,a) ≥ v_π(s)，则「在 s 改选 a、其后仍按 π」不差于 π（严格则更好）\n   而模拟轨迹的平均回报正好估出 q_π(s,a′)\n\n⚠ 书的精确限定：这**更像异步值迭代的一步**，不是策略迭代的一步\n   —— 因为它**只改当前这一个状态**的动作\n\n⇒ 定位：**目标是改进那个 rollout 策略，不是找最优策略**\n\n经验观察：rollout 策略**完全随机**时也可能表现很好\n   ⚠ 但表现取决于 rollout 策略的性质 **和蒙特卡洛估值给出的动作排序**\n     —— 是**排序**，不是估值本身准不准\n   ⚠ 「更好的 rollout 策略一定更好」只是直觉，有反例（Gelly & Silver, 2007）\n\n耗时 = 每决策要评估多少动作 × 轨迹多少步 × rollout 策略每步多久 × 要多少条轨迹\n\n三个缓解办法（Tesauro & Galperin 1997）：\n   ① 各次试验**相互独立** ⇒ 可并行\n   ② **截断**轨迹，用存好的评估函数修正被截断的回报\n   ③ 监控模拟，**剪掉**：不太可能成为最优的候选\n                        **或其值与当前最优足够接近、选它也没实质差别**的候选\n      ⚠ ① 与 ③ 天然打架：剪枝要看已有结果，而并行试验看到的是旧状态\n\n⇒ ③ 里那个「足够接近就别再分了」是**何时可以停**的判据，\n   比「谁更差」这个判据更聪明", "tbl": {"head": ["", "rollout 算法", "完整的蒙特卡洛控制（第 5 章）"], "rows": [["估什么", "<b>只估当前状态的各动作值</b>", "完整的 q<sub>π</sub> 或 q*"], ["目标", "<b>改进 rollout 策略</b>", "找最优策略"], ["结果保留吗", "<span class='w'>用完就丢</span>", "保留"], ["要函数逼近吗", "<b>不要</b>（不必覆盖状态空间）", "大问题上要"], ["算几步改进", "<b>一步（而且只对当前状态）</b>", "反复到收敛"]]}, "res": {"tag": "已核", "v": "<b>书里那第三个缓解办法，几乎逐字写出了你该做的预算分配——而且它比我之前给你的判据更好。</b><br>原文：<em>prune away candidate actions that are unlikely to turn out to be the best, <b>or whose values are close enough to that of the current best that choosing them instead would make no real difference</b></em>。<br><span class='k'>前半句是普通的淘汰（「它大概率不是最优」）；<b>后半句是另一条、而且常被忘掉的判据</b>：<b>两个配置的 G 足够接近时，选哪个都没实质差别，于是不必再花钱区分它们</b></span>。<br><b>这条对你特别值钱，因为它给了一个<b>停止</b>判据而不只是淘汰判据。</b> <span class='w'>CS234 L16 p47 告诉你「把预算花在区间重叠的那些上」——但如果两个配置的区间重叠<b>而且它们的差距本来就小于你在乎的阈值</b>，那继续花钱是纯浪费</b>。<b>正确的规则是两条合起来</b>：<b>① 区间已完全低于领跑者 ⇒ 淘汰；② 区间虽重叠，但整个重叠区的宽度小于「你在乎的最小差距」δ<sub>实用</sub> ⇒ 也停，随便选一个</b>。<span class='k'>第二条你现在多半没有，而它能省下最后那一大段最贵的预算——因为把两个几乎一样好的配置分出胜负，恰恰是最费样本的。</span><br><b>第 ① 条（并行）也要接住，它坐实了我前面那处更正。</b> <span class='w'>书明说各次蒙特卡洛试验相互独立、可以并行；而紧接着指出<b>自适应剪枝会让并行实现复杂化</b></span>。<b>这正是我在 CSE 541 L07 里给出的那个说法：轮内全并行、轮间串行</b>——<b>现在它有书上的出处了。</b><br><b>而那句「rollout 的目标是改进 rollout 策略，不是找最优策略」，你应该直接借来写进论文。</b> <span class='k'>你的方法从 AFlow 基线出发做一步改进，天花板就是那个基线</span>——<b>与其让审稿人指出来，不如自己把它写成<b>设计目标</b></b>：<span class='w'>我们要的是「可证不劣于、且通常优于 AFlow 基线」，不是「在 2^H 上全局最优」</span>。<b>书把这个限定当成方法的定义来写，而不是当成缺陷来道歉，这个姿态值得学。</b><br>标【已核】：剪枝的两条判据、并行与剪枝的冲突、以及目标定位，均为 8.10 节原文逐句核对。", "ref": "原书 8.10 节（逐句核对）· CS234 L16 p29 · p47 科研格 · CSE 541 L07 主线卡 · 简报 §4c（已核）"}, "link": {"t": "你学过的对应：CS234 L16（p29「简单蒙特卡洛搜索 = 恰好一步策略改进」——同一个算法，而本书把「更像异步值迭代的一步」这个更精确的说法补上了）", "href": "../../cs234-2019/中文精读/L16-精读.html"}},
{"r": [27, 29], "t": "MCTS：四个步骤，和一条「什么不保存」", "star": 3, "quote": "<em>At its base, MCTS is a <b>rollout algorithm</b> as described above, but enhanced by the addition of a means for <b>accumulating value estimates</b> obtained from the Monte Carlo simulations in order to successively direct simulations toward more highly-rewarding trajectories.</em><br><em>MCTS is largely responsible for the improvement in computer Go <b>from a weak amateur level in 2005 to a grandmaster level (6 dan or more) in 2015</b>.</em><br><b>四步</b>：<em><b>1. Selection</b> … a tree policy … traverses the tree to select a leaf node. <b>2. Expansion</b> (on some iterations) … <b>3. Simulation</b> … with actions selected by the rollout policy. <b>4. Backup</b>. The return … is backed up to update, or to initialize, the action values attached to the edges of the tree traversed by the tree policy</em><br><em><b>No values are saved for the states and actions visited by the rollout policy beyond the tree.</b></em>", "one": "<b>MCTS 就是 rollout 加一样东西：把模拟出来的估值<b>累积</b>在一棵树上，于是后面的模拟会被导向更有希望的方向。</b>", "pts": ["<b>书给 MCTS 的定位非常干脆：它<b>就是</b> rollout 算法，只多了一件事。</b> <span class='k'>多的那件事是「把蒙特卡洛模拟得到的估值<b>累积</b>起来，用来逐步把后续模拟导向回报更高的轨迹」</span>。<b>没有这个累积，它就退回成上一节那个 rollout。</b>", "<b>成绩那句数字值得记</b>：<em>MCTS is largely responsible for the improvement in computer Go from a <b>weak amateur level in 2005</b> to a <b>grandmaster level (6 dan or more) in 2015</b></em>。<span class='w'>十年，从弱业余到六段以上</span>。<b>而书特意补了一句：它不限于博弈——「只要有一个简单到能快速多步模拟的环境模型，它对单智能体序贯决策问题也有效」。</b>", "<b>四个步骤要记牢，而且每一步的「谁在做决定」不同。</b> <span class='k'><b>1. 选择</b>：从根出发，用<b>树策略</b>（依据树边上的动作值）走到一个叶节点；<b>2. 扩展</b>：某些迭代上，从选中的叶节点加一个或多个子节点（经由未探索的动作）；<b>3. 模拟</b>：从该节点起，用 <b>rollout 策略</b>跑完一整幕；<b>4. 回传</b>：把这一幕的回报回传上去，更新（或初始化）树策略这次走过的那些边上的动作值。</b>", "⚠️ <b>第 4 步里有一句最容易被漏掉、而且最该记住的限定</b>：<em><b>No values are saved for the states and actions visited by the rollout policy beyond the tree.</b></em> <span class='w'>树<b>外</b>那一段走过的所有状态和动作，一个值都不存</span>。", "<b>为什么这样设计？因为树外那一段的动作是由一个<b>固定而且通常很笨</b>的策略选的。</b> <span class='k'>存下它们，等于在为一个你根本不打算采用的策略建表</span>；<b>而且那部分状态多半只会被访问一次，存了也没机会复用</b>。<span class='w'>所以这不是节省内存的权宜，而是「只为有用的东西分配记忆」。</span>", "<b>书把这件事上升成了一个很好的说法：MCTS 实际上在<b>增量地长出一张查找表</b>。</b> <em>by incrementally expanding the tree, MCTS effectively <b>grows a lookup table</b> to store a <b>partial</b> action-value function, with memory allocated to the estimated values of state–action pairs visited in the <b>initial segments of high-yielding sample trajectories</b></em>。<span class='k'>于是它「避开了全局逼近动作值函数这个难题，同时保留了用过去经验指导探索的好处」</span>。", "<b>树内与树外用不同策略的理由，书说得比 CS234 更直白</b>：<span class='w'>树内的那些状态「我们至少对一部分动作有值估计，所以可以用一个<b>有信息的</b>策略来挑」，而这个树策略要平衡探索与利用</span>——<b>书举的例子就是 ε-贪心或 UCB。</b>", "<b>最后选哪个动作，书给了两种机制，第二种值得注意。</b> <span class='k'>① 取根节点下动作值最大的；② <b>取访问次数最多的</b>——理由是 <em>to avoid selecting outliers</em></span>。<b>访问次数最多的那个，是树策略在整个搜索过程中最持续看好的；而动作值最大的那个，可能只是一次幸运的高回报。</b><span class='w'>这是一个很实际的稳健性考虑。</span>", "<b>树的去留也有讲究</b>：<span class='k'>环境转移到新状态后，MCTS 重新跑——有时从一棵只有根节点的树开始，但<b>常常</b>保留上一次搜索树里「新状态的那些后代」，其余节点连同它们的动作值一并丢弃</span>。<b>这正是 8.8 节说的「全扔与全留之间是连续的」那个折中的实例。</b>"], "eq": "MCTS = rollout 算法 + **把估值累积在一棵树上**\n       （没有这个累积，就退回成上一节的 rollout）\n\n成绩：计算机围棋 **2005 年弱业余 ──▶ 2015 年大师级（6 段以上）**\n      书补一句：不限于博弈 —— 只要有「简单到能快速多步模拟」的模型，\n                单智能体序贯决策问题也适用\n\n四步（每一步「谁在做决定」不同）：\n   1. **选择** Selection    从根出发，**树策略**依据树边上的动作值走到一个叶节点\n   2. **扩展** Expansion    某些迭代上，从该叶节点经未探索动作加一个或多个子节点\n   3. **模拟** Simulation   从该节点起，用 **rollout 策略** 跑完一整幕\n   4. **回传** Backup       把回报回传，更新/初始化**树策略这次走过的那些边**上的动作值\n\n⚠ 最易漏的一句：**树外由 rollout 策略走过的状态和动作，一个值都不存**\n   为什么：那一段的动作由一个固定而且通常很笨的策略选\n           存了等于为一个你不打算采用的策略建表；\n           而且那些状态多半只访问一次，存了也没机会复用\n   ⇒ 不是省内存的权宜，是「只为有用的东西分配记忆」\n\n书的提法：MCTS 在**增量地长出一张查找表**，存一个**部分**动作值函数，\n          内存只分给「高回报轨迹的**起始段**」上的 (s,a)\n   ⇒ 避开了全局逼近动作值函数这个难题，同时保留了用过去经验指导探索的好处\n\n最后选哪个动作（两种机制）：\n   ① 根节点下**动作值最大**的\n   ② **访问次数最多**的 —— 理由：**避免选到离群值**\n      （值最大的可能只是一次幸运高回报；访问最多的是全程最被看好的）\n\n树的去留：转移到新状态后常**保留新状态的那些后代**，其余连同动作值一并丢弃\n   （8.8 节说的「全扔与全留之间是连续的」的实例）", "tbl": {"head": ["步骤", "谁在选动作", "依据", "结果存吗"], "rows": [["1 选择", "<b>树策略</b>", "树边上已有的动作值（平衡探索与利用）", "—"], ["2 扩展", "—", "经由未探索的动作加子节点", "<b>新建节点</b>"], ["3 模拟", "<b>rollout 策略</b>", "固定、通常很笨（如随机）", "<span class='w'>不存</span>"], ["4 回传", "—", "整幕回报", "<b>只更新树策略走过的边</b>"], ["最后选动作", "—", "<b>值最大</b> 或 <b>访问最多</b>（避免离群值）", "—"]]}, "res": {"tag": "推断", "v": "<b>「只为有用的东西分配记忆」这条设计原则，正好描述了你那张 oracle 表应该长成什么样。</b><br><span class='k'>MCTS 不为树外走过的状态存值，因为那些是笨策略走出来的、而且只会访问一次</span>。<b>你的对应：不必为那些「随机撞到的、明显不合理的」配置在表里留行</b>——<span class='w'>比如在最简单的节点上用 72B 而在最难的节点上用 7B 这类被支配的组合</span>。<b>书的说法可以直接借用：内存（在你这里是评估预算）只分给「高回报轨迹的起始段」，也就是从基线出发可达的那一小片。</b><br><b>而那个「增量地长出一张部分动作值表」的提法，恰好是你那张表的准确描述。</b> <span class='k'>你不是在逼近一个定义在全部 2^H 上的函数，你是在<b>显式地</b>为其中一小部分存精确值</b>。<b>这个区别值得在论文里说清楚</b>：<span class='w'>「部分查找表 + 精确值」比「全局函数逼近 + 估计值」在统计上干净得多——没有逼近误差，置信界只需要处理采样误差</b>。<b>这又一次是穷举 oracle 的理由，而这次有一个现成的措辞。</b><br><b>⚠ 而「取访问次数最多的而不是值最大的」这条，你应该认真考虑照搬。</b> <span class='k'>书给的理由是 <em>避免选到离群值</em></span>——<b>而这正是 L04 p42 那个最大化偏差的一个廉价解药</b>。<b>你的对应做法</b>：<span class='w'>最终汇报的配置，不取「留出集上 G 的均值最大」的那个，而取「在自助重采样里当第一名次数最多」的那个</span>。<b>两者通常一致；不一致时，后者几乎总是更稳</b>。<span class='k'>而这个量你本来就要算（L13 p32 那个诊断），只是现在它从「诊断」升格成了「选择规则」。</span><br><b>⚠ 最后一条要注意的不对称：MCTS 的树外之所以能用「很笨的随机策略」，是因为模拟免费。</b> <span class='w'>你没有免费的模拟，所以你不能在树外随便乱走</span>。<b>你的「树外」只能是成本模型能覆盖的那部分（成本可以本地外推），而准确率那一半根本没有树外——每一步都得真跑</b>。<b>这意味着 MCTS 的四步里，你能完整做的只有「选择」和「回传」；「模拟」那一步在你这里是整个方法最贵的部分，而它在围棋里几乎免费。把这个不对称写进局限，比假装能照搬整套流程诚实得多。</b>", "ref": "原书 8.11 节（逐句核对）· L04 p42 · CS234 L13 p32 科研格 · CS234 L16.b p37 科研格 · 简报 §4d（已核）"}},
{"r": [30, 31], "t": "本章小结：三件事，和一句「唯一的区别」", "star": 2, "quote": "<em><b>Sample models are generally much easier to obtain than distribution models.</b></em><br><em>any of the learning methods can be converted into planning methods simply by applying them to <b>simulated</b> (model-generated) experience rather than to real experience. In this case learning and planning become even more similar; they are <b>possibly identical algorithms operating on two different sources of experience</b>.</em><br><em>Planning, acting, and model-learning interact in a <b>circular fashion</b> … each producing what the other needs to improve; <b>no other interaction among them is either required or prohibited</b>. The most natural approach is for all processes to proceed <b>asynchronously and in parallel</b>.</em>", "one": "<b>小结把全章收成三句：样本模型容易得多；学习算法喂上模拟经验就成了规划算法；而规划、行动、学模型三者是循环互喂的，怎么安排都行。</b>", "pts": ["<b>第一句是 8.1 的回收：DP 需要分布模型（因为它用期望更新，要对所有可能的下一状态和奖励求期望），而样本模型只够做样本更新。</b> <span class='k'>书在小结里再次强调「样本模型通常容易得多」</span>——<b>一章开头和结尾各说一遍的东西，通常就是作者最想让你记住的。</b>", "<b>第二句把全章的核心主张推到了最强的形式</b>：<em>they are <b>possibly identical algorithms</b> operating on two different sources of experience</em>。<span class='w'>不是「相似」，是「可能是同一个算法」</span>——<b>只是经验的来源不同。</b>", "<b>而这句话的实践含义是：整合学习与规划，只要让两者<b>更新同一个估计的值函数</b>就行。</b> <span class='k'>不需要设计什么接口，不需要协调两套表示</span>——<b>Dyna 就是这么做的，而它之所以看起来「几乎平凡」，正是因为这件事本来就不需要复杂的机制。</b>", "<b>第三句说的是三者的关系，而书的措辞相当自由。</b> <em>no other interaction among them is <b>either required or prohibited</b></em>。<span class='w'>规划、行动、学模型循环互喂，各自产出别人需要的东西</span>；<b>而「最自然的做法是三者异步并行」。</b>", "<b>书还补了一句很务实的话</b>：<em>If the processes must share computational resources, then the division can be handled <b>almost arbitrarily</b>—by whatever organization is most convenient and efficient for the task at hand.</em> <span class='k'>算力怎么分，书明说没有原则性的答案</span>——<b>这和 Dyna-Q 里那个 n（每步规划多少次）是一个自由参数，是同一件事。</b>", "<b>p31 开头那一段（8.12 的收尾）把本章的搜索控制策略又梳理了一遍，可以当作索引。</b> <span class='w'>更新越小，规划就越能增量化（最小的那一类是 Dyna 那样的一步样本更新）；而另一个重要维度是<b>更新的分布</b>，也就是搜索的焦点</span>。", "<b>两种聚焦方向在这里被对称地摆了出来，这是第 8 章最好的一张索引。</b> <span class='k'><b>向后</b>：优先遍历，聚焦在「值刚变过的那些状态」的前驱上；<b>向前</b>：同策略轨迹采样，聚焦在「智能体控制环境时可能遇到的」那些状态上</span>。<b>而后者「可以让计算跳过那些与预测或控制问题无关的状态空间部分」。</b>", "<b>而「向前聚焦」的最重要形式，书说就是<b>在决策时</b>做规划。</b> <span class='w'>经典的启发式搜索是一例；rollout 算法与 MCTS 是另外两例</span>——<b>后两者「受益于在线、增量、基于样本的值估计与策略改进」。</b><span class='k'>这三个名字一列出来，8.8–8.11 的位置就清楚了：它们都是「向前聚焦」这条线上的点。</span>"], "tbl": {"head": ["聚焦方向", "方法", "聚焦在哪", "在哪一节"], "rows": [["<b>向后</b>", "优先遍历", "值刚变过的状态的<b>前驱</b>", "8.4"], ["<b>向前</b>", "同策略轨迹采样 · RTDP", "<b>可能真的会遇到</b>的状态", "8.6 · 8.7"], ["<b>向前（极端）</b>", "启发式搜索 · rollout · MCTS", "<b>当前状态的紧邻下游</b>", "8.9 · 8.10 · 8.11"], ["⇒ 向前聚焦能做到", "<b>跳过与问题无关的那部分状态空间</b>", "—", "—"]]}},
{"r": [32, 33], "t": "第一篇总结：把方法摊成几个维度", "star": 3, "quote": "<em>All of the methods we have explored so far … have <b>three key ideas in common</b>: first, they all seek to <b>estimate value functions</b>; second, they all operate by <b>backing up values</b> along actual or possible state trajectories; and third, they all follow the general strategy of <b>generalized policy iteration (GPI)</b>.</em><br><em>The <b>horizontal</b> dimension is whether they are <b>sample updates</b> … or <b>expected updates</b> … The <b>vertical</b> dimension … corresponds to the <b>depth of updates</b>, that is, to the degree of <b>bootstrapping</b>.</em><br><em>The most important dimension <b>not</b> mentioned here … is that of <b>function approximation</b>.</em>", "one": "<b>不要把强化学习记成一堆方法，要记成几个维度。图 8.11 的两条轴是：更新有多宽（样本还是期望），更新有多深（自举多少）。</b>", "pts": ["<b>书在这里亮明了整本书的组织方式，这段话值得记</b>：<em>we have tried to present reinforcement learning <b>not as a collection of individual methods</b>, but as a <b>coherent set of ideas cutting across methods</b>. Each idea can be viewed as a <b>dimension</b> along which methods vary.</em> <span class='k'>方法是点，维度是坐标轴——而记坐标轴比记点省力得多，也更经得起新方法的冲击。</span>", "<b>三个共同点先摆出来，它们是这个空间的「地面」</b>：<span class='w'>① 都在<b>估值函数</b>；② 都靠沿着实际或可能的状态轨迹<b>回传</b>值；③ 都遵循<b>广义策略迭代</b>（维护一个近似值函数和一个近似策略，各自不断依据对方改进）</span>。<b>书说这三条「可能与任何智能模型都相关，无论人工还是自然」。</b>", "<b>然后是图 8.11 的两条轴，这是全书最有名的一张图之一。</b> <span class='k'><b>横轴 = 更新的<b>宽度</b></b>：样本更新（基于一条采样轨迹）↔ 期望更新（基于可能轨迹的分布）；<b>纵轴 = 更新的<b>深度</b></b>，也就是自举的程度：一步 ↔ 完整回报</span>。", "<b>四个角各坐一个方法，记住这四个角，整张图就活了。</b> <span class='w'><b>左上 = TD</b>（浅、样本）；<b>左下 = 蒙特卡洛</b>（深、样本）；<b>右上 = 动态规划</b>（浅、期望）；<b>右下 = 穷举搜索</b>（深、期望）</span>。<b>书特意说明右下角是「期望更新深到一路跑到终止状态」的极端情形。</b>", "<b>而两条轴之间全是连续的，这一点比四个角更重要。</b> <span class='k'>左边那条棱上是从一步 TD 到完整回报蒙特卡洛的整个谱（中间是 n 步更新，第 12 章还会扩展成资格迹的 λ-更新）</span>；<b>右边那条棱上，介于 DP 与穷举搜索之间的是启发式搜索一类「搜到有限深度、也许有选择地搜」的方法</b>。<span class='w'>横向也有中间地带：混合期望更新与样本更新，甚至在单次更新里混合样本与分布。</span>", "<b>横轴还有一个很实际的含义，书点了出来</b>：<em>Expected updates require a <b>distribution model</b>, whereas sample updates need only a <b>sample model</b>, <b>or can be done from actual experience with no model at all</b></em>。<span class='k'>所以横轴不只是「准不准」，还决定了「你需要什么」</span>——<b>而最右边那一侧要求最强的模型。</b>", "<b>第三条维度是同策略 vs 离策略，书说可以想象成<b>垂直于纸面</b>的那条轴。</b> <span class='w'>前者学的是当前正在执行的那个策略的值函数；后者学的是另一个策略（通常是当前认为最好的那个）的</span>。<b>而「产生行为的策略通常与当前认为最好的不同，因为需要探索」。</b>", "<b>p33 还一口气列了另外八个维度，当成一张检查表很好用。</b> <span class='k'><b>回报的定义</b>（分幕/持续，折扣/不折扣）· <b>估哪种值</b>（动作值/状态值/后状态值）· <b>动作选择与探索</b> · <b>同步 vs 异步</b> · <b>真实 vs 模拟</b> · <b>更新的位置</b> · <b>更新的时机</b> · <b>更新的记忆</b></span>。", "<b>其中「更新的位置」那一条说得特别准，值得单独记</b>：<em>Model-free methods can choose <b>only among the states and state–action pairs actually encountered</b>, but <b>model-based methods can choose arbitrarily</b>.</em> <span class='w'>有没有模型，决定的不是「准不准」，而是「你能不能挑在哪里更新」</span>——<b>这是模型最根本的那个自由度。</b>", "⚠️ <b>最后书自己点出了这张图缺的那一条</b>：<em>The most important dimension <b>not</b> mentioned here, and not covered in Part I, is that of <b>function approximation</b></em>。<span class='k'>从表格法到状态聚合、各种线性方法、再到各类非线性方法，是一条正交的谱</span>——<b>而第一篇的全部结论都建立在「表格」这个端点上。读第二篇之前，这一点要记牢。</b>"], "eq": "整本书的组织方式：**不是方法的集合，而是横切各方法的一组维度**\n   （记坐标轴比记点省力，也更经得起新方法的冲击）\n\n三个共同点（这个空间的地面）：\n   ① 都在**估值函数**\n   ② 都靠沿实际或可能的轨迹**回传**值\n   ③ 都遵循**广义策略迭代 GPI**（近似值函数与近似策略互相改进）\n\n图 8.11 的两条轴：\n                        更新的**宽度** (width) ───▶\n                   样本更新                      期望更新\n                   （一条采样轨迹）              （可能轨迹的分布）\n   更新的       ┌──────────────────┬──────────────────┐\n   **深度**     │   **TD**         │  **动态规划**     │  一步（自举多）\n   (depth)     │                  │                  │\n     │         │   ← n 步更新 / λ-更新 的整个谱 →      │\n     ▼         │                  │                  │\n               │ **蒙特卡洛**      │ **穷举搜索**      │  完整回报（不自举）\n               └──────────────────┴──────────────────┘\n   右棱中间：启发式搜索一类（搜到有限深度，也许有选择地搜）\n   横向中间：混合期望与样本更新，甚至单次更新里混合样本与分布\n\n⚠ 横轴不只是「准不准」，还决定**你需要什么**：\n   期望更新 ⇒ 要**分布模型**\n   样本更新 ⇒ **样本模型就够**，甚至可以完全无模型、直接用真实经验\n\n第三条维度：**同策略 vs 离策略**（想象成垂直于纸面的那条轴）\n\np33 另外八个维度（当检查表用）：\n   回报的定义 · 估哪种值 · 动作选择与探索 · 同步/异步\n   真实/模拟 · **更新的位置** · **更新的时机** · **更新的记忆（保留多久）**\n\n   ⚠ 「更新的位置」最该记：\n     无模型方法**只能**在实际遇到过的 (s,a) 里挑\n     有模型方法**可以任意挑**        ← 这是模型最根本的那个自由度\n\n⚠ 这张图缺的最重要的一条：**函数逼近**（第二篇的内容）\n   第一篇的全部结论都建立在「表格」这个端点上", "tbl": {"head": ["", "样本更新（窄）", "期望更新（宽）"], "rows": [["<b>一步（深度浅，自举多）</b>", "<b>TD</b>", "<b>动态规划</b>"], ["<b>完整回报（深度深，不自举）</b>", "<b>蒙特卡洛</b>", "<b>穷举搜索</b>"], ["中间地带", "n 步更新 · λ-更新（资格迹）", "启发式搜索（有限深度、可选择）"], ["<b>需要什么模型</b>", "<b>样本模型，或完全不要</b>", "<span class='w'>分布模型</span>"]]}, "res": {"tag": "推断", "v": "<b>图 8.11 给了你一张可以直接画进论文的图——因为你那个「G 拆成两半」的论证，在这张图上是<b>两个对角</b>。</b><br><span class='k'><b>成本那一半</b>：你有分布模型（成本近乎确定、可本地精确算），而且它是<b>逐节点可加</b>的——一步就能算完，不需要走到终局</span>。<b>⇒ 它坐在图 8.11 的<b>右上角（动态规划）</b>：期望更新 + 浅。</b><br><span class='w'><b>准确率那一半</b>：你只有样本模型（必须真跑），而且它是<b>终局</b>奖励——必须整条 workflow 跑完才知道</span>。<b>⇒ 它坐在<b>左下角（蒙特卡洛）</b>：样本更新 + 深。</b><br><b>两半位于这张图的<b>对角线两端</b>——这是全书最有名的一张图，而你的两半恰好落在它距离最远的两个角上。</b> <span class='k'>这比我之前给你的任何一条理由都更有说服力，因为它是<b>可视化</b>的、而且用的是读者早就熟悉的坐标</span>。<b>一张图加一句话：「我们的目标函数的两个分量在 Sutton &amp; Barto 图 8.11 上分处对角，因此不应共用同一个估计量」——这一拳很难接。</b><br><b>而那条「更新的位置」的维度给了你另一句精准的话。</b> <span class='w'>书说：无模型方法<b>只能</b>在实际遇到过的 (s,a) 里挑，有模型方法<b>可以任意挑</b></span>。<b>翻译：没有成本模型，你只能评估你真跑过的配置；有了它，你可以在 2^H 的任何地方「挑一个位置去更新」</b>。<span class='k'>这正是成本模型买到的那个自由度，而它和「预测得准不准」是两件事</b>——<b>这个区分值得写清楚，因为它解释了为什么一个 R²=0.9 的模型仍然很有价值：它买的是<b>选择权</b>，不是精度。</b><br><b>⚠ 而那条被书点名的缺失维度是你的硬约束：函数逼近。</b> <span class='w'>第一篇的全部漂亮结论（包括本章的 Dyna、优先遍历、RTDP 的收敛定理）都建立在<b>表格</b>这个端点上</span>。<b>你的格子数（H×k 几十个）确实在表格端，这是好消息</b>（CS234 L13 已经说过）；<b>但你的成本模型是函数逼近，所以凡是涉及它的推论都已经离开了第一篇的保护范围</b>。<span class='k'>⚠ 具体地说：C08.a p4 那条「模型从不被问到没见过的地方」的免费护栏，在函数逼近下自动失效——而这一节点明了那是第二篇才处理的问题。</span><b>把这条写进局限，比默默沿用表格的结论安全得多。</b>", "ref": "原书 8.13 节与图 8.11（逐条核对）· C08.a p4 科研格 · CS234 L13 · 简报 §4e §4f（已核）"}},
{"r": [34, 36], "t": "文献注记里值得挑出来的几条", "star": 2, "quote": "<b>8.3</b> — <em>The <b>E³</b> algorithm of <b>Kearns and Singh (2002)</b> and the <b>R-max</b> algorithm of <b>Brafman and Tennenholtz (2003)</b> are guaranteed to find a near-optimal solution in time <b>polynomial in the number of states and actions</b>. This is <b>usually too slow for practical algorithms</b> but is <b>probably the best that can be done in the worst case</b>.</em><br><b>8.11</b> — <em>The central ideas of MCTS were introduced by <b>Coulom (2006)</b> and by <b>Kocsis and Szepesvári (2006)</b> … <b>Browne et al. (2012)</b> is an excellent survey … <b>David Silver</b> contributed to the ideas and presentation in this section.</em>", "one": "<b>文献注记一般可以跳过，但这一章的有三条值得单独挑出来：PAC 那一对算法的定位、MCTS 的真正出处、以及 Dyna 的「间接/直接」这组词从哪来。</b>", "pts": ["<b>第一条：8.3 节注里对 E³ 与 R-max 的定位，是一句很克制也很诚实的评价。</b> <span class='k'>两者「保证在状态数与动作数的<b>多项式</b>时间内找到近最优解」</span>；<b>而书紧接着说：<em>This is <b>usually too slow for practical algorithms</b> but is <b>probably the best that can be done in the worst case</b>.</em></b>", "<b>这句话值得停一下，因为它说的是一整类理论结果的处境。</b> <span class='w'>「多项式时间」在理论上是胜利，在实践中可能毫无意义</span>——<b>而「在最坏情况下多半已是能做到的最好」这半句，解释了为什么这个差距无法靠更聪明的算法消掉</b>。<span class='k'>这和 CS234 L13 里那个「PAC 保证要求初始值设到 10¹⁰⁰」是同一种模式：定理成立，常数不可用。</span>", "<b>书还点明了这两个算法的思路：把探索加成与乐观初始化推到逻辑极端</b>——<span class='w'>「所有尚未充分探索的选择一律假定能拿到最大奖励，并算出通向它们的最优路径去测试」</span>。<b>Dyna-Q+ 的 κ√τ 是这个想法的温和版本，而 E³/R-max 是它的极端版本。</b>", "<b>第二条：MCTS 的中心思想出自 <b>Coulom (2006)</b> 与 <b>Kocsis &amp; Szepesvári (2006)</b>。</b> <span class='k'>后者正是 UCT 的出处</span>。<b>⚠ 这条值得记，因为 CS234 L16 与 CSE 541 的讲义都用了 UCT 却没给引文</b>——<span class='w'>要引用式子或常数时，查 Kocsis &amp; Szepesvári；要综述，查 Browne 等 (2012)</span>。", "<b>书还提了一句：这一节的想法与写法得到 <b>David Silver</b> 的贡献。</b> <span class='k'>而 CS234 L16 的课件署名也是「many slides from or derived from David Silver」</span>——<b>两边的叙述如此一致，根子在这里。</b>", "<b>第三条：8.2 节注说明「直接 / 间接」这组词<b>借自自适应控制文献</b>，在那边做的是同样的区分。</b> <span class='w'>而本书叫「模型学习」的那件事，在自适应控制里叫<b>系统辨识</b>（system identification）</span>。<b>知道这组对应，能让你读得懂控制那一侧的文献。</b>", "<b>Dyna 架构本身出自 Sutton (1990)，而本章与下一节的结果都基于那篇报告的结果。</b> <span class='k'>把 Dyna 扩展到线性函数逼近的早期工作是 Sutton, Szepesvári, Geramifard &amp; Bowling (2008) 与 Parr 等 (2008)</span>——<b>这正好接上上一页说的那条「第一篇只讲表格」的缺口。</b>", "<b>8.4 节注还澄清了一处很容易引错的地方：优先遍历是 <b>Moore &amp; Atkeson (1993)</b> 与 <b>Peng &amp; Williams (1993)</b> <b>同时且独立</b>提出的。</b> <span class='w'>而本章两个框里的结果分属两家：p170（迷宫上快 5–10 倍那组）是 Peng &amp; Williams 的，p171（杆件操纵）是 Moore &amp; Atkeson 的</span>。<b>引用时别张冠李戴。</b>", "<b>8.6–7 的注把 RTDP 的证明来源拆得很清楚，值得记一下结构。</b> <span class='k'>Barto, Bradtke &amp; Singh (1995) 把 Korf (1990) 对 LRTA* 的收敛证明，与 Bertsekas (1982) 关于「无折扣随机最短路径问题上异步 DP 收敛」的结果<b>合并</b>起来，才得到本章那个定理</span>。<b>他们还认识到 Korf 的 LRTA* 本身就是一个异步 DP 算法，而且适用于随机问题（Korf 只关注确定性问题）。</b>", "⚠️ <b>p36 在 PDF 上是空页——第一篇到此结束。</b> <span class='w'>下一页（原书 p217）就是第二篇「近似解法」的分隔页，不在本章的切片里。</span>"], "tbl": {"head": ["出处", "是什么", "为什么值得单独记"], "rows": [["Kearns &amp; Singh 2002（E³）<br>Brafman &amp; Tennenholtz 2003（R-max）", "状态/动作数的<b>多项式</b>时间内找到近最优", "<b>「实践中通常太慢，但最坏情况下多半已是最好」</b>"], ["<b>Coulom 2006</b><br><b>Kocsis &amp; Szepesvári 2006</b>", "<b>MCTS / UCT 的真正出处</b>", "<b>CS234 与 CSE 541 的讲义都用了却没给引文</b>"], ["Browne 等 2012", "MCTS 综述", "要全景时查它"], ["Sutton 1990", "Dyna 架构", "本章结果的来源"], ["Moore &amp; Atkeson 1993<br>Peng &amp; Williams 1993", "优先遍历（<b>同时独立</b>提出）", "<b>两个框里的结果分属两家，别引错</b>"], ["Barto, Bradtke &amp; Singh 1995", "RTDP 的收敛定理", "<b>合并了 Korf 1990 与 Bertsekas 1982</b>"]]}, "res": {"tag": "已核", "v": "<b>这一页有两条对你的写作直接有用。</b><br><b>第一条是 E³ / R-max 那句评价，它给了你一个现成的、而且是权威的措辞。</b> <span class='k'>原文：保证在状态数与动作数的多项式时间内找到近最优解，<b>而这对实用算法通常太慢，但在最坏情况下多半已是能做到的最好</b></span>。<b>当审稿人问「你的方法有没有样本复杂度保证」时，这句话给了你一个诚实而不示弱的答法的范本</b>：<span class='w'>承认最坏情况的界不实用，同时指出那不是你的方法的缺陷、而是问题本身的下界</span>。<b>⚠ 当然前提是你真的算过那个界——不能只借措辞不做功课。</b><br><b>第二条是引文本身：MCTS / UCT 出自 Coulom (2006) 与 Kocsis &amp; Szepesvári (2006)。</b> <span class='k'>我在 CSE 541 L07 的主线卡里标过「讲义未点名，标准出处应是 Kocsis &amp; Szepesvári 2006，引用前请自行核对」</span>——<b>现在核对到了，而且是 Sutton &amp; Barto 的文献注给的，可以当定论</b>。<b>那条标注的警告可以撤掉了。</b><br><b>而 E³ / R-max 那条思路本身也值得你记一下，因为它是你那个「悲观修正」的<b>反方向</b>。</b> <span class='w'>它们把「未充分探索的选择一律假定能拿最大奖励」推到极端，为的是<b>保证探索</b></span>；<b>而你要的是「未充分探索的配置一律按最差估」，为的是<b>保证上线安全</b></b>。<span class='k'>同一个「对未知处取极端值」的技巧，方向由目标决定：要探索就乐观，要交付就悲观</b>。<b>这个对照我在 CS234 L16.a p13 提过，这里有了两个具体的算法名字可以引。</b><br><b>最后一条是方法论上的：注意本章两处「同时独立提出」与「合并两个已有结果」的记载。</b> <span class='w'>优先遍历由两组人同时独立做出；RTDP 的定理是把 Korf 1990 与 Bertsekas 1982 拼起来的</span>。<b>这提醒你在写 related work 时，查清一个想法的<b>多个</b>来源——而你那个「节点级保真度指派」多半也不止一个源头。</b>", "ref": "原书 8.3 / 8.11 节文献注（逐条核对）· CSE 541 L07 主线卡（此处解除了一处待核）· CS234 L16.a p13 科研格"}}
];

var TH = {"title": "第 8 章接上课题的哪一段：一张能画进论文的图，和一个必须防的失败模式", "arc": "<b>这一章是 CS234 十五讲里唯一没有系统覆盖的那一块，而它给课题的东西分三类。</b><br><br><b>① 一张可以直接画进论文的图。</b> <span class='k'>图 8.11 的两条轴是：<b>更新的宽度</b>（样本 ↔ 期望）与<b>更新的深度</b>（一步 ↔ 完整回报）</span>。<b>而你那个 <code>G = Acc − λ·Cost</code> 的两半，恰好落在这张图<b>对角线的两端</b></b>：<span class='w'><b>成本</b>有分布模型、逐节点可加、一步算完 ⇒ 右上角（动态规划）；<b>准确率</b>只有样本模型、终局才知道 ⇒ 左下角（蒙特卡洛）</span>。<b>这是全书最有名的图之一，而你的两个分量分处它距离最远的两个角</b>——<b>「因此不应共用同一个估计量」这一拳，配一张读者早就熟悉的图，很难接。</b><br><br><b>② 一个必须防的失败模式，而且在 LLM 场景里比书里更容易发生。</b> <span class='k'>捷径迷宫（8.3 节）：环境<b>变好</b>了，而 Dyna-Q 从未切换、<b>也从未意识到捷径存在</b></span>。原因那句是全章最该记住的：<em>Its model said that there was no shortcut, so <b>the more it planned, the less likely it was to step to the right and discover it</b>.</em> <span class='w'>翻译：成本模型说某配置贵 → 筛选把它排除 → 再也不跑它 → 估计永远停在旧值</span>。<b>而「环境变好」在你这里是常态**不是例外**</b>：服务商降价、换推理后端、新版本模型同样质量下输出更短。<b>⚠ 比迷宫更糟的是：迷宫里变化是一次性的，而 API 定价与模型版本是<b>持续漂移</b>的——于是这不是「跑一次实验」的问题，是「结论会过期」的问题。</b>修法现成：Dyna-Q+ 的 <code>r + κ√τ</code>，按「多久没<b>真实</b>测过」给加成。<br><br><b>③ 一批可以直接借用的措辞与判据。</b><br>· <b>rollout 的目标定位</b>（8.10）：<em>aim is to <b>improve upon the rollout policy</b>; not to find an optimal policy</em>——<span class='k'>把「天花板是 AFlow 基线」从缺陷写成<b>设计目标</b>，书就是这么处理的</span>；<br>· <b>剪枝的第二条判据</b>（8.10，Tesauro &amp; Galperin）：剪掉那些「值与当前最优<b>足够接近、以致选它也没有实质差别</b>」的候选——<span class='w'>这是一个<b>停止</b>判据，不只是淘汰判据，而你多半还没有它</span>；<br>· <b>「更新的位置」这个维度</b>（8.13）：<em>Model-free methods can choose <b>only among the states actually encountered</b>, but model-based methods can choose <b>arbitrarily</b></em>——<b>成本模型买到的是<b>选择权</b>，不是精度，这个区分解释了为什么 R²=0.9 的模型仍然很有价值</b>；<br>· <b>E³ / R-max 的评价</b>（文献注 8.3）：多项式时间保证「对实用算法通常太慢，<b>但在最坏情况下多半已是能做到的最好</b>」——<span class='k'>这是回答「你有没有样本复杂度保证」的一个诚实而不示弱的范本</span>。<br><br><b>而贯穿全章的那个判据是「分支因子 b」</b>：<span class='w'>b=1 时期望更新与样本更新<b>完全相同</b></span>。<b>你的成本 b≈1（算一次就够，多采是浪费）；准确率 b=2 但你拿不到分布模型，只能样本更新</b>。<b>⇒ 「成本可期望更新、准确率只能样本更新」，这是两半必须分开处理的第九条理由，而且是唯一一条关于<b>算法形状</b>而非统计量的。</b>", "pitfalls": [{"v": "<b>用成本模型筛掉一批配置，然后再也不碰它们。</b> <span class='w'>这就是捷径迷宫：模型说没有捷径 ⇒ 规划把你推离那里 ⇒ 没有新数据 ⇒ 判断永不更新</span>。<b>⚠ 每一步都「正确」，错的是这个闭环没留缺口让反例进来。</b><b>修法</b>：<span class='k'>按 Dyna-Q+ 给每个 (节点,档位) 记 τ = 距上次<b>真实</b>测量多久，定期拿一小部分预算优先重测 τ 最大的</span>。<b>⚠ 而 τ 的时钟要按<b>日历时间</b>走而不是按实验进度——漂移由 API 定价与模型版本驱动，一个跑了三个月的实验，早期格子已经旧了，哪怕你一次都没动过它。</b>", "tag": "已核", "ref": "原书 8.3 节与例 8.3（逐句核对）· C08.a p8 · p10 科研格"}, {"v": "<b>把「成本模型 R² 高」当成「用它挑出来的配置好」。</b> <span class='k'>书里 rollout 那一节说得很准：表现取决于 rollout 策略的性质<b>和蒙特卡洛估值给出的动作<b>排序</b></b></span>——<b>是排序，不是估值准不准</b>。<span class='w'>一个处处偏高一个常数的模型，排序完全正确，决策完全正确</span>。<b>所以该报的是<b>成对排序准确率</b>，而且只在「真值差距小」的配置对上算</b>——差距大的对子谁都排得对。", "tag": "推断", "ref": "原书 8.10 节 · CS234 L16.b p23 科研格 · 简报 §4e（已核）"}, {"v": "<b>沿用第一篇那些漂亮结论，却忘了它们都站在「表格」这个端点上。</b> <span class='w'>⚠ 书自己点名：这张维度图缺的最重要一条是<b>函数逼近</b>，那是第二篇的内容</span>。<b>你的格子数（H×k 几十个）确实在表格端，这是好消息；<b>但你的成本模型是函数逼近</b></b>。<span class='k'>最具体的后果：Dyna-Q 那条「模型从不被问到它一无所知的地方」的<b>免费护栏</b>，在函数逼近下自动失效</span>——<b>表格模型白送的保护，函数逼近模型要自己花钱买（按训练密度做悲观修正）。</b>", "tag": "已核", "ref": "原书 8.13 节末段与 8.2 节（逐句核对）· C08.a p4 科研格 · CS234 L13"}, {"v": "<b>把一次真实观测只用一半。</b> <span class='k'>Dyna 的要点是真实经验<b>兵分两路</b>：直接更新值函数，<b>以及</b>更新模型</span>。<b>你每跑一次 (query, 配置)，多半只做了前者（写进 oracle 表）</b>；<span class='w'>而把同一条观测喂给成本模型，会让<b>所有</b>共享该节点的配置的估计一起变准</span>——<b>这就是书说的「间接方法更充分地利用有限的经验」，而你的经验是用美元买的，这条收益比在仿真里大得多。</b>", "tag": "推断", "ref": "原书 8.2 节 · C08.a p4 科研格 · 简报 §4e（已核）"}, {"v": "<b>把并行和自适应淘汰同时要。</b> <span class='w'>书明说各次蒙特卡洛试验相互独立、可以并行；<b>而紧接着指出自适应剪枝会让并行实现复杂化</b></span>（Tesauro &amp; Galperin）。<b>正确的说法是「轮内全并行、轮间串行」</b>——<span class='k'>⚠ 这更正了我在 CS234 L16.c p46 写的「并行会毁掉逐次淘汰的好处」，那条只对完全自适应的做法成立</span>。<b>而你的瓶颈是调用（钱）不是时间，所以该偏向串行。</b>", "tag": "已核", "ref": "原书 8.10 节（逐句核对）· 原书 8.6 节 · CS234 L16.c p46 科研格（此处作了更正）"}, {"v": "<b>只有淘汰判据，没有停止判据。</b> <span class='k'>书给的第二条剪枝判据是：值与当前最优<b>足够接近、以致选它也没有实质差别</b>就别再分了</span>。<b>⚠ 把两个几乎一样好的配置分出胜负，恰恰是最费样本的那一段</b>——<span class='w'>而那段花出去的钱不改变任何决策</span>。<b>规则应是两条：① 区间已完全低于领跑者 ⇒ 淘汰；② 重叠区宽度小于「你在乎的最小差距」⇒ 也停，随便选一个。</b>", "tag": "已核", "ref": "原书 8.10 节（逐句核对）· CS234 L16 p47 科研格"}, {"v": "<b>把「深搜 / 更复杂的估计量」当成收益的来源。</b> <span class='w'>书的论证很硬：同样的计算可以拆成一串一步更新、效果完全一样，<b>所以改进不是来自「多步」这件事本身，而是来自更新被<b>聚焦</b>在当前状态下游紧邻处</b></span>。<b>翻译：与其找更精巧的 G 估计量，不如把同样的预算更集中地花在难分的那几对上</b>。<span class='k'>这可以做成一个很有说服力的消融：固定预算，对照「均匀分配 + 复杂估计量」与「聚焦分配 + 最朴素的均值」。</span>", "tag": "已核", "ref": "原书 8.9 节与图 8.9（逐句核对）· 简报 §4c（已核）"}, {"v": "<b>照搬 MCTS 的四步流程，而不说清你只能完整做其中两步。</b> <span class='k'>MCTS 的「模拟」在围棋里几乎免费，在你这里是整个方法最贵的部分</span>。<b>你能完整做的是「选择」与「回传」；「模拟」那一步只能在成本那一半上做（本地模型），准确率那一半每一步都得真跑</b>。<span class='w'>⚠ 凡是引用 MCTS 类方法的复杂度分析时都要先问一句：它算的是「多少次模拟」，而你付的是「多少美元」。</span>", "tag": "推断", "ref": "原书 8.11 节 · CS234 L16.b p37 科研格 · C08.a p1 科研格"}], "ammo": [{"q": "为什么要把目标函数拆成准确率和成本两半分别估计？", "a": "<b>因为它们落在 Sutton &amp; Barto 图 8.11 对角线的两端。</b> <span class='k'>那张图的两条轴是「更新的宽度」（样本 ↔ 期望）与「更新的深度」（一步 ↔ 完整回报）</span>。<b>成本</b>：<span class='w'>我们有分布模型（成本近乎确定、可本地精确算），而且它逐节点可加、一步算完</span> ⇒ <b>右上角，动态规划那一角</b>。<b>准确率</b>：<span class='w'>只有样本模型（必须真跑一次才知道对错），而且是终局奖励、整条链共同决定</span> ⇒ <b>左下角，蒙特卡洛那一角</b>。<br><b>而分支因子给了同一结论的第二个说法</b>：<span class='k'>书说 b=1 时期望更新与样本更新<b>完全相同</b></span>——<b>成本的 b≈1（算一次就够，多采是浪费）；准确率的 b=2，但我们拿不到那张分布表，只能样本更新</b>。<b>⇒ 两半能用的<b>算法形状</b>不同，不只是统计量不同。这是一张图加一句话就能讲完的论证。</b>", "tag": "推断", "ref": "原书 8.13 节图 8.11 · 8.5 节（逐条核对）· 简报 §4f（已核）"}, {"q": "你的方法只做一步改进，天花板就是 AFlow 基线，这不是很弱吗？", "a": "<b>这是设计目标，不是缺陷——而 Sutton &amp; Barto 对 rollout 算法就是这么定位的。</b> <span class='k'>原文：<em>the aim of a rollout algorithm is to <b>improve upon the rollout policy</b>; not to find an optimal policy</em></span>。<b>我们要的是「可证不劣于、且通常优于 AFlow 基线」，不是「在 2^H 上全局最优」</b>——<span class='w'>前者有策略改进定理撑着（给定 G 估得准就不会变差），后者没有任何保证，还会被 argmax 放大模型误差</span>。<br><b>⚠ 而书还补了一个更精确的说法值得引</b>：这<em>更像异步值迭代的一步</em>而不是策略迭代的一步，<b>因为它只改当前这一个状态的动作</b>。<b>要突破天花板就做多轮（把这轮选出的当新基线再扫），但那时每轮必须换一批 query，否则最大化偏差会累积。</b>", "tag": "已核", "ref": "原书 8.10 节（逐句核对）· CS234 L16 p29 · L04 p42 · 简报 §4c（已核）"}, {"q": "你的成本模型 R² 只有 0.9 多，靠它挑配置可靠吗？", "a": "<b>两点。第一，决策只需要<b>排序</b>对，不需要估值准</b>：<span class='k'>书在 rollout 那一节明说表现取决于「蒙特卡洛估值给出的动作<b>排序</b>」</span>——<b>一个处处偏高一个常数的模型排序完全正确</b>。<span class='w'>所以我们报的是<b>成对排序准确率</b>，而且只在真值差距小的配置对上算（差距大的谁都排得对）。</span><br><b>第二，也是更根本的：模型买到的不是精度，是<b>选择权</b>。</b> <span class='k'>书在 8.13 的维度清单里说得很准：<em>无模型方法<b>只能</b>在实际遇到过的 (s,a) 里挑，有模型方法<b>可以任意挑</b></em></span>——<b>没有成本模型，我们只能评估真跑过的配置；有了它，我们可以在 2^H 的任何位置挑一个去评估</b>。<b>这个自由度与「预测得多准」是两件事。</b><br><b>⚠ 同时我们报告两条防护</b>：<b>按训练密度做<b>悲观</b>修正</b>（函数逼近没有表格模型那条「不问没见过的地方」的免费护栏），<b>以及最终入选的配置必须实际跑一遍验证</b>。", "tag": "已核", "ref": "原书 8.10 · 8.13 · 8.2 节（逐句核对）· 简报 §4e（已核）"}, {"q": "你怎么保证结论不会因为 API 降价或模型换版而失效？", "a": "<b>不能保证，但可以测量——而这个问题有一个书上的名字叫「模型变悲观了而你不会发现」。</b> <span class='k'>Sutton &amp; Barto 8.3 节的捷径迷宫：环境<b>变好</b>了而智能体从未发现，因为「它的模型说没有捷径，于是它规划得越多，去发现它的可能性就越小」</span>。<b>这正是基于成本模型做筛选的固有风险。</b><br><b>我们做三件事</b>：① <b>明确报告 oracle 表的采集时间窗与当时的 API 价目</b>，并声明结论绑定在那个窗口上；② <b>投稿前重测最早采集的那一小批格子</b>，报告成本与准确率各漂移了多少；③ <b>按 Dyna-Q+ 的思路</b>，给每个配置记「距上次真实测量多久」，定期拿一小部分预算优先重测最旧的。<span class='w'>⚠ 其中 ② 很便宜，而且两种结果都能写——漂移小则证明时效性，漂移大则本身就是一个值得报告的发现（「基于 LLM 成本的优化结论会随定价漂移失效」）。</span>", "tag": "已核", "ref": "原书 8.3 节与例 8.3 · Dyna-Q+（逐句核对）· C08.a p8 · p10 科研格"}, {"q": "你的方法有样本复杂度保证吗？", "a": "<b>先说清楚这类保证的处境，Sutton &amp; Barto 给了一个很好的措辞。</b> <span class='k'>8.3 节的文献注评价 E³（Kearns &amp; Singh 2002）与 R-max（Brafman &amp; Tennenholtz 2003）：它们保证在状态数与动作数的<b>多项式</b>时间内找到近最优解，而这<em>对实用算法通常太慢，<b>但在最坏情况下多半已是能做到的最好</b></em></span>。<b>也就是说：最坏情况的界不实用，不是方法的缺陷，是问题本身的下界。</b><br><b>我们的位置</b>：<span class='w'>离线一次性评估，没有探索-利用，所以没有遗憾界；而<b>有</b>的是一个可以<b>实测</b>而非靠定理的 PAC 式陈述</b>——<b>给定 ε 与 δ，数留出集上有多少条 query 的 G 比最优差超过 ε</b>。<span class='k'>这避开了 L13 p53 那种「常数不可实现」的毛病，因为它是数出来的而不是推出来的。</span><b>⚠ 当然前提是我们真的算过那个界，不能只借措辞不做功课。</b>", "tag": "已核", "ref": "原书 8.3 节文献注（逐句核对）· CS234 L13 p35 · p53 · 简报 §7 第 1 拳"}], "papers": [{"t": "Sutton — Dyna 架构", "id": "1990（本章 8.2 与 8.3 的结果都基于这篇）", "why": "<b>「真实经验兵分两路」这个想法的出处。</b> <span class='k'>本章那个漂亮的迷宫实验（n=0 要 25 幕、n=5 要 5 幕、n=50 只要 3 幕）就出自这里</span>。<b>要引用「用本地算力换真实交互」这个论证时引它。</b> ⚠ 把 Dyna 扩展到<b>线性函数逼近</b>的早期工作是 Sutton, Szepesvári, Geramifard &amp; Bowling (2008) 与 Parr 等 (2008)——<b>而那正好补上「第一篇只讲表格」这个缺口，对课题更相关</b>。"}, {"t": "Kearns &amp; Singh — E³ · Brafman &amp; Tennenholtz — R-max", "id": "2002 / 2003（本章 8.3 节文献注点名）", "why": "<b>把「乐观初始化」推到逻辑极端的两个算法</b>：<span class='w'>所有尚未充分探索的选择一律假定能拿最大奖励，并算出通向它们的最优路径去测试</span>。<b>⚠ 对课题的用处是<b>反方向</b>的</b>：<span class='k'>它们对未知处取<b>乐观</b>值以保证探索；而你对未知配置要取<b>悲观</b>值以保证上线安全</b>。<b>同一个技巧，方向由目标决定——要探索就乐观，要交付就悲观。</b>"}, {"t": "Moore &amp; Atkeson · Peng &amp; Williams — 优先遍历", "id": "均为 1993，<b>同时且独立</b>提出（8.4 节文献注）", "why": "<b>「从值变了的地方倒着扫」的出处。</b> ⚠ <b>引用时别张冠李戴</b>：<span class='w'>书里 p170 那组结果（迷宫上快 5–10 倍）是 <b>Peng &amp; Williams</b> 的；p171 的杆件操纵（14,400 个潜在状态）是 <b>Moore &amp; Atkeson</b> 的</span>。<b>对课题的用处是「成本模型一更新，哪些配置需要重算」——只重算含该节点的、且按该节点在总成本中的占比排序。</b>"}, {"t": "Barto, Bradtke &amp; Singh — RTDP", "id": "1995（8.6–8.7 节文献注；证明合并了 Korf 1990 的 LRTA* 与 Bertsekas 1982）", "why": "<b>「相关状态」这个概念的出处，也是本章最该借的一个量。</b> <span class='k'>赛道上 9,115 个可达状态里只有 <b>599</b> 个是相关的</span>——<b>而你可以从 oracle 表上直接数出「2^H 个配置里有多少个曾经对某条 query 最优」</b>。<b>⚠ 但要估一个<b>放宽</b>的版本</b>：<span class='w'>不是「当过 argmax 的」，而是「置信区间与最优者重叠过的」</span>——<b>因为书里那 599 个是在<b>已知</b>最优策略的前提下数出来的，而你不知道。</b>"}, {"t": "Tesauro &amp; Galperin — rollout 算法用于西洋双陆棋", "id": "1997（8.10 节）", "why": "<b>两条判据的出处，而第二条最该拿走。</b> ① 各次蒙特卡洛试验相互独立 ⇒ 可并行；② <b>剪掉「值与当前最优足够接近、以致选它也没有实质差别」的候选</b>——<span class='k'>这是<b>停止</b>判据而不只是淘汰判据</span>。<b>⚠ 他们同时指出 ① 与 ② 打架（剪枝要看已有结果，并行看到的是旧状态）</b>，<b>这坐实了「轮内并行、轮间串行」这个安排。</b>"}, {"t": "Coulom · Kocsis &amp; Szepesvári — MCTS / UCT", "id": "均为 2006（8.11 节文献注）；综述见 Browne 等 2012", "why": "<b>MCTS 与 UCT 的真正出处。</b> ⚠ <b>这条值得单独记，因为 CS234 L16 与 CSE 541 L07 的讲义都用了 UCT 却没给引文</b>——<span class='w'>我在 CSE 541 L07 的主线卡里曾标注「讲义未点名，引用前请自行核对」，现在由 Sutton &amp; Barto 的文献注核实，<b>那条待核可以撤掉</b></span>。<b>要引用式子与常数查 Kocsis &amp; Szepesvári，要全景查 Browne 等。</b>"}, {"t": "⚠ 本章<b>没有</b>覆盖的那一条维度", "id": "<b>函数逼近</b>（书自己点名，属第二篇）", "why": "<b>第一篇的全部结论都站在「表格」这个端点上，包括本章 Dyna、优先遍历、RTDP 的那些定理。</b> <span class='k'>你的决策格子（H×k 几十个）确实在表格端</span>，<b>但你的成本模型是函数逼近</b>——<span class='w'>所以凡是涉及它的推论都已经离开了第一篇的保护范围</b>。<b>最具体的后果：「模型从不被问到它一无所知的地方」那条免费护栏失效，要自己用悲观修正买回来。</b>"}]};

(function(){

  var PDF_REMOTE="https://web.archive.org/web/20240101id_/http://incompleteideas.net/book/RLbook2020.pdf", PAGEOFF=180;

    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("c08quiz");

        localStorage.setItem(KEY+"quiz", _old);

  function go(p){

    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49

      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
