<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB 第 8 章 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="suttonbarto-c08">

<div id="bar">
  <h1>SB 第 8 章 · <span>规划与学习：把有模型和无模型统一起来</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 36</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <a class="btn" id="openpdf" hidden target="_blank" rel="noopener"
     title="在新标签页打开原课件 —— 跨域 PDF 能不能内嵌取决于浏览器">原课件 ↗</a>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../chapters/ch08.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>sutton-barto</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/C08-精读.html</code>。</p>
    </div>

  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "分布模型与样本模型的区别是什么？书里为什么强调这个区别？", "o": ["前者用于规划后者用于学习；因为两者目标不同", "前者更准后者更快；因为要权衡精度", "前者给出所有可能及其概率，后者只按概率抽一个；分布模型更强（总能产生样本），但样本模型容易得多 —— 这个不对称决定了本章后面几乎所有取舍", "前者是表格后者是神经网络；因为表示方式不同"], "a": 2, "why": "十二颗骰子之和：写程序模拟掷一次很容易，把所有可能的和及其概率都算出来「更难、也更容易出错」。<span class='k'>「更强的工具往往拿不到」——所以 8.5 节要专门为「只有样本模型」辩护。</span>"}, {"q": "书里给「规划」下的定义是什么？", "o": ["在树上做前瞻搜索", "任何以模型为输入、产出或改进策略的计算过程 —— 不要求最优，也不要求穷举", "用模拟数据训练神经网络", "用动态规划求解 MDP"], "a": 1, "why": "<b>这个定义很宽，而宽是有用的</b>：按它，「用成本模型筛出预算内的候选配置」就是规划。<span class='w'>书里还划了状态空间规划 vs 计划空间规划的分界，后者（演化方法、偏序规划）因「难以高效用于随机序贯决策」而不再考虑。</span>"}],
3: [{"q": "规划与学习的区别，按本章的说法只有一处。是哪一处？它的推论是什么？", "o": ["规划更快；推论是优先用规划", "经验从模型来还是从环境来；推论是任何学习算法都能当规划算法用（字面替换，不是类比）", "规划用期望更新；推论是需要分布模型", "规划不需要值函数；推论是可以直接优化策略"], "a": 1, "why": "书里的措辞是 <em>differing only in the source of their experience</em>。<b>随机采样一步表格 Q-规划就是这个替换的实例，连收敛性都直接蹭 Q 学习的</b>——<span class='w'>⚠ 但它收敛到的是「模型的」最优策略，模型错了它会又快又稳地收敛到一个错答案。</span>"}, {"q": "按本章，所有状态空间规划方法的差别只在三件事上。是哪三件？", "o": ["状态数、动作数、时域长度", "做哪种更新、按什么顺序做、备份信息保留多久", "用什么模型、用什么表示、用什么损失", "学习率、折扣因子、探索率"], "a": 1, "why": "<b>这三条就是后面各节的纲</b>：<span class='k'>8.5 讲「哪种更新」（期望 vs 样本）；8.4 与 8.6 讲「什么顺序」（优先遍历 / 轨迹采样）；8.8 讲「保留多久」（背景规划 vs 决策时规划，后者算完就扔）。</span>"}],
4: [{"q": "一条真实经验在 Dyna 里有两个用处。分别是什么？两条路各自的强处是什么？", "o": ["训练与验证；分别保证拟合与泛化", "探索与利用；分别保证覆盖与收益", "改进模型（模型学习）与直接改进值函数/策略（直接 RL）；间接法更充分利用有限经验，直接法更简单且不受模型设计偏差影响", "更新 Q 与更新 π；分别对应评估与改进"], "a": 2, "why": "<b>「不受模型设计偏差影响」这半句最要紧</b>：直接法只看真实数据，模型建错了也伤不到它；<span class='w'>而间接法的全部好处都押在「模型大体是对的」这个前提上——这正是 8.3 节整节在处理的风险。</span>"}, {"q": "Dyna-Q 的规划步只从「经历过的」(s,a) 采样。这个设计起什么作用？它什么时候会失效？", "o": ["保证收敛；步长不衰减时失效", "模型从不被问到它一无所知的地方（模型最爱胡说的正是那里）；换成函数逼近的模型时自动失效", "避免重复；动作空间连续时失效", "节省内存；状态太多时失效"], "a": 1, "why": "<b>这是一个免费的、结构性的护栏</b>，代价是放弃泛化——<span class='k'>而表格模型本来就没有泛化，所以代价为零</span>。<span class='w'>⚠ 函数逼近的模型会对没见过的地方给出一个数，于是这条护栏默认是关的，要自己加回来。</span>"}],
6: [{"q": "Dyna-Q 相对一步表格 Q 学习的全部增量是什么？", "o": ["只有两行：(e) 把转移记进模型，(f) 从模型里多做 n 次同样的 Q 更新 —— 真实交互次数一点没变", "用了经验回放缓冲区", "换了更好的探索策略", "用了目标网络"], "a": 0, "why": "书里挑明了：<em>If (e) and (f) were omitted, the remaining algorithm would be one-step tabular Q-learning</em>。<b>所以 n 是一个纯粹的算力旋钮——拿本地计算换真实交互。</b>"}, {"q": "Dyna 迷宫实验里，n=0 / 5 / 50 分别要多少幕达到 ε-最优？这个对比公平吗？", "o": ["25 / 5 / 3 幕；公平，因为 n=0 的 α 与 ε 是专门为它优化过的", "50 / 10 / 5 幕；不公平，因为参数只为 n=50 调过", "25 / 15 / 10 幕；不公平，因为种子不同", "10 / 5 / 3 幕；公平，因为用了相同参数"], "a": 0, "why": "第一幕对所有 n 都约 1700 步（种子固定）。<b>图 8.3 解释了差距的来源</b>：<span class='w'>不规划时每一幕只给策略增加一步（信息每幕往回传一格）；规划时第二幕策略已几乎铺回起点——而那是在智能体还在起点附近晃悠时由后台建起来的。</span>"}],
8: [{"q": "模型往「乐观」方向错和往「悲观」方向错，后果为什么完全不同？", "o": ["乐观的错会被自我纠正（规划去利用它、发现它不存在）；悲观的错可能永远不会被发现，因为策略绕开了那里就再也不去看", "悲观的错更容易修，因为更保守", "两者一样，都靠探索解决", "乐观的错更严重，因为会高估收益"], "a": 0, "why": "阻塞迷宫（变坏）两个智能体都恢复了；<b>捷径迷宫（变好）普通 Dyna-Q 从未切换，而且从未意识到捷径存在</b>。<span class='k'>书里的原因那句是整章最该记住的一句。</span>"}, {"q": "捷径迷宫里那句解释原因的话是什么？它描述的机制是什么？", "o": ["探索率太低，所以碰不到", "学习率太小，所以更新太慢", "「它的模型说没有捷径，于是它规划得越多，往右走去发现它的可能性就越小」—— 一个反向的正反馈：模型说 X 不好 → 策略推离 X → 不再去 X → 没有新数据 → 判断永不更新", "折扣因子太大，所以看不到远处"], "a": 2, "why": "<b>注意这个闭环里每一步都是「正确」的</b>——模型按见过的数据推断没错，规划按模型优化也没错。<span class='w'>错的是这个闭环没留任何缺口让反例进来。</span>"}, {"q": "书里把这个问题归到「探索与利用」名下。但这里的「探索」和老虎机里的不是一回事，区别在哪？", "o": ["这里探索的目的是改进模型，不是拿奖励；老虎机里探索是试别的臂看奖励", "这里探索指增加模拟次数", "没有区别", "这里探索指增大 ε"], "a": 0, "why": "<span class='k'>目的从「拿奖励」变成了「修模型」。</span>而 ε-贪心在捷径迷宫里不够用——书里说要碰巧做出那么多探索动作才发现捷径，是极不可能的。"}],
10: [{"q": "Dyna-Q+ 的探索加成是什么形式？为什么用 √τ 而不是 τ？", "o": ["r + κ√τ，τ 是距上次真实试验的步数；线性增长会让巡检压倒一切，平方根让吸引力温和增长（同 UCB 的次线性直觉）", "r + κτ；因为线性最简单", "r + κ/τ；因为越久越不重要", "r × κτ；因为要按比例放大"], "a": 0, "why": "三个细节：<span class='w'>加的是模拟更新里的奖励；τ 只在真实交互时清零；加成进了规划所以会沿路径传播</span>——<b>于是它能规划出一整条「去巡检」的路线，而 ε-贪心只会随机走一步。</b>"}, {"q": "脚注里 Dyna-Q+ 还改了两处，容易被漏掉。是什么？代价是什么？", "o": ["改了采样分布和步长；代价是方差", "改了队列阈值和优先级；代价是内存", "规划步允许考虑从未试过的动作，且这类动作的初始模型设为「回到原状态、奖励 0」；代价是放弃了「模型从不被问到没见过的地方」那条护栏", "改了学习率和折扣因子；代价是要调参"], "a": 2, "why": "<b>注意它给没见过的地方编了一个<b>保守</b>的默认值，然后才允许规划去那里。</b><span class='k'>方向选对了——如果默认值是乐观的，就会退回到 8.3 节那个「模型利用」的毛病。</span>"}],
11: [{"q": "优先遍历的核心思路是什么？它比「从目标状态倒推」一般在哪？", "o": ["按动作价值大小排序", "从起点正着扫，按距离排序", "按状态访问频率排序", "从任何「值变了」的状态倒着往回扫，并按「若更新则值会变多少」排优先级；目标状态只是一个方便讲直觉的特例"], "a": 3, "why": "第二幕开始时只有通向目标的那一个 (s,a) 有正值，<span class='w'>于是绝大多数更新是「零值状态 → 零值状态」，毫无作用</span>。<b>效果：迷宫上常快 5 到 10 倍，而且对比公平（两边都至多 n=5 次更新/交互）。</b>"}, {"q": "书里自己对优先遍历泼了什么冷水？", "o": ["它需要知道前驱状态，实践中很难", "它只对确定性环境有效", "它「多半不是最好的那种」方式；局限是用期望更新，随机环境里会把大量算力浪费在低概率转移上", "它的队列会无限增长"], "a": 2, "why": "<b>下一节（8.5）就要论证样本更新在这种时候反而赢。</b><span class='k'>书里还提了对偶的「前向聚焦」——按「从当前策略常访问的状态有多容易到达」来聚焦，而 8.6/8.7/8.8 把它推到了极端形式。</span>"}],
14: [{"q": "期望更新与样本更新在什么情况下完全相同？这说明了什么？", "o": ["状态数很少时；说明规模才是关键", "下一状态只有一个可能时（取 α=1）；说明两者的全部差别只在环境有多随机", "折扣因子 γ=1 时；说明折扣无关紧要", "步长 α 趋于 0 时；说明两者渐近等价"], "a": 1, "why": "<b>于是一切归结到分支因子 b</b>（使 p̂(s′|s,a) > 0 的 s′ 个数）：<span class='k'>期望更新要把 b 个后继都看一遍，算力约是样本更新的 b 倍</span>。"}, {"q": "图 8.7 的关键观察是什么？为什么书说它还低估了样本更新的优势？", "o": ["期望更新总是更好；低估是因为忽略了偏差", "两者差别可以忽略；低估是因为样本量不足", "样本更新误差按 t/b 线性下降；低估是因为没考虑并行", "误差按 sqrt((b−1)/(bt)) 掉，即按 1/√t 而非线性 —— 所以 t 只要到 b 的一小部分误差就掉了一大截；低估是因为真实问题里后继的值本身也在学，早点变准会沿备份链复利"], "a": 3, "why": "<b>结论的两个条件要记全</b>：<span class='w'>样本更新占优，需要「随机分支因子大」<b>且</b>「状态太多以致无法精确求解」</span>。反之 b 小或问题算得完，期望更新才是对的选择。"}],
16: [{"q": "轨迹采样按「同策略分布」更新。书为什么说几乎只能这么做？", "o": ["因为只有它支持函数逼近", "因为显式写出该分布再加权扫描会回到穷举的全部开销；而且策略一变分布就变，算它的代价与做一次完整策略评估相当", "因为它方差最小", "因为其他方法不收敛"], "a": 1, "why": "那个下棋的类比把直觉说得很好：<em>你研究的是真实对局里会出现的局面，不是随机摆出来的棋子</em>——<span class='k'>随机局面也是合法状态，但准确评估它们是一项<b>不同的技能</b>。</span>"}, {"q": "实验结果是什么？两个调节因素的方向如何？", "o": ["同策略分布初期更快、长期更慢；分支因子越小效应越强、初期优势期越长，状态数越多效应也越强", "两者没有显著差别", "同策略分布全程更慢；状态越多差距越大", "同策略分布全程更快；b 越大优势越大"], "a": 0, "why": "<b>两端的解释都很直白</b>：<span class='w'>短期快是因为聚焦在起始状态的近邻后代；长期慢是因为常访问处的值早已正确，再采无用</span>。<b>提炼一句：聚焦的价值随「还剩多少没算准」而衰减。</b>"}],
19: [{"q": "RTDP 里「相关状态」的定义是什么？赛道例子里这个数是多少？", "o": ["被更新过的状态；9115 个中有 8825 个", "访问频率超过阈值的状态；9115 个中有 4000 个", "值函数非零的状态；9115 个中有 1000 个", "能从某起始状态、在某个最优策略下到达的状态；9,115 个可达状态中只有 599 个相关"], "a": 3, "why": "<b>十五分之一。</b>于是要的只是一个<b>最优部分策略</b>——在相关状态上最优，无关状态上可以任意、甚至无定义。<span class='k'>实测 RTDP 只用了 DP 约一半的更新（127,600 vs 252,784），而且约 290 个状态一次都没更新过。</span>"}, {"q": "RTDP 收敛定理里最严的那个条件是什么？它排除了什么？", "o": ["状态空间必须有限；排除了连续问题", "折扣因子必须小于 1；排除了持续性任务", "所有从非目标状态出发的转移奖励严格为负；排除了「中途有正奖励可拿」的任务", "所有初值必须为 0；排除了有先验知识的情形"], "a": 2, "why": "<span class='w'>「每一步都严格扣分」保证智能体不会在中途无限徘徊</span>——最短时间控制、高尔夫（最少杆数）这类<b>随机最优路径问题</b>天然满足。另三个条件：目标状态初值为 0、存在能以概率 1 到达目标的策略、所有初值 ≥ 最优值。"}, {"q": "RTDP 还有一个容易被略过的好处，与「何时该停」有关。是什么？", "o": ["它的行为策略始终对当前值函数贪心，所以值函数逼近 v* 时策略也在逼近最优；而传统 VI 收敛前你不知道策略已经够好了，查这件事要额外花算力", "它的内存占用更小", "它可以并行", "它不需要模型"], "a": 0, "why": "赛道上这个差别被量化了：<span class='k'>近最优策略在第 15 次扫描（136,725 次更新）就出现了，少于收敛所需的 252,784，但<b>仍然多于</b> RTDP 的 127,600</span>——<b>就算你能神奇地知道何时该停，DP 仍然比 RTDP 慢。</b>"}],
22: [{"q": "背景规划与决策时规划的分界线是什么？书给的判据是什么？", "o": ["结果保留多久（背景规划留下值函数，决策时规划用完就丢）；判据是「你有多少时间回答」—— 能等就决策时，要低延迟就背景", "用不用模型；判据是模型精度", "在线还是离线；判据是数据量", "用期望还是样本更新；判据是分支因子"], "a": 0, "why": "<b>这正好对上本章第三个维度「备份信息保留多久」。</b><span class='w'>交换的是两种成本：背景规划把算力花在所有状态上（含你永远不会遇到的）换查表速度；决策时规划全花在这一个状态上换更深的前瞻。</span>"}],
24: [{"q": "深搜带来的性能改进，按本节到底来自什么？", "o": ["不是来自「多步」—— 同样的计算可以拆成一串一步更新、效果完全一样；改进来自更新被聚焦在当前状态下游紧邻的状态和动作上", "来自更大的折扣因子", "来自多步更新本身，因为它减少了自举偏差", "来自更好的值函数初始化"], "a": 0, "why": "<b>这纠正了一个很常见的误解。</b>那个跳棋的比方：<span class='k'>你这辈子下国际象棋也许比跳棋多，但当你在下跳棋时，值得想的是跳棋、是你眼前这个局面</span>。而聚焦省的不只是算力，<b>还有内存</b>。"}, {"q": "启发式搜索与贪心动作选择是什么关系？", "o": ["启发式搜索是贪心的随机化版本", "启发式搜索就是把贪心策略的想法延伸到一步以外 —— 算贪心动作本来就要往前看一步、算回收值，只是不保存", "贪心是启发式搜索的近似", "两者毫无关系"], "a": 1, "why": "书里还点出传统启发式搜索与 RL 立场相反的一处：<span class='w'>它不仅不保存回收的值，连值函数本身「一般都是人设计的，而且绝不因搜索而改变」</span>——而让值函数随搜索改进是很自然的下一步。"}],
26: [{"q": "书怎么定位 rollout 算法的目标？它为什么说这「更像异步值迭代的一步」而不是策略迭代的一步？", "o": ["目标是降低方差；因为它平均了多条轨迹", "目标是找最优策略；因为它用了 max", "目标是估计 q*；因为它用蒙特卡洛", "目标是改进那个 rollout 策略、不是找最优策略；因为它只改当前这一个状态的动作，而策略迭代会在所有状态上改"], "a": 3, "why": "<b>这和 CS234 L16 p29 得出的「上限由 π 决定」是同一个结论，只是书把它直接写成了目标。</b><span class='k'>而经验上，rollout 策略完全随机时也可能表现很好——但表现取决于 rollout 策略的性质<b>和蒙特卡洛估值给出的动作排序</b>（是排序，不是估值准不准）。</span>"}, {"q": "Tesauro & Galperin 给的三个缓解办法里，第三个「剪枝」有两条判据。第二条是什么？为什么它特别有用？", "o": ["剪掉访问次数最少的；因为数据不足", "剪掉「其值与当前最优足够接近、以致选它也没有实质差别」的；因为这是一个「何时可以停」的判据，而不只是「谁更好」的判据", "剪掉方差最大的；因为它们最不可靠", "剪掉耗时最长的；因为性价比低"], "a": 1, "why": "<b>两个动作值几乎相同时，继续花算力区分它们没有意义——不管选哪个结果都一样。</b><span class='w'>⚠ 而书也点出 ① 并行与 ③ 剪枝天然打架：剪枝要看已有结果，而并行的试验看到的是旧状态。</span>"}],
27: [{"q": "MCTS 相对 rollout 算法只多了一件事。是什么？", "o": ["可以处理两人博弈", "把蒙特卡洛模拟得到的估值累积在一棵树上，用来逐步把后续模拟导向回报更高的轨迹 —— 没有这个累积它就退回成 rollout", "用了 UCB 代替随机", "用了神经网络估值"], "a": 1, "why": "成绩那句数字值得记：<b>MCTS 让计算机围棋从 2005 年的弱业余水平提升到 2015 年的大师级（6 段以上）</b>。<span class='k'>而书特意补了一句：它不限于博弈——只要有简单到能快速多步模拟的模型，单智能体序贯决策问题也适用。</span>"}, {"q": "MCTS 四步里的「回传」有一句最容易被漏掉的限定。是什么？为什么这样设计？", "o": ["只回传正回报；因为负回报没信息", "树外由 rollout 策略走过的状态和动作一个值都不存；因为那段是固定而且通常很笨的策略选的，存了等于为一个你不打算采用的策略建表，而且那些状态多半只访问一次", "只回传到根节点；因为中间节点不重要", "回传时要加折扣；因为路径长度不同"], "a": 1, "why": "<b>书把这件事上升成了一个很好的说法</b>：MCTS 在<b>增量地长出一张查找表</b>，存一个<b>部分</b>动作值函数，内存只分给「高回报轨迹的起始段」上的 (s,a)——<span class='w'>于是它避开了全局逼近动作值函数这个难题，同时保留了用过去经验指导探索的好处。</span>"}, {"q": "MCTS 最后选根节点动作有两种机制。第二种是什么？理由是什么？", "o": ["取访问次数最多的；为了避免选到离群值 —— 值最大的可能只是一次幸运高回报，访问最多的是全程最被看好的", "取最新更新的；为了用最近的信息", "取方差最小的；为了稳健", "随机选一个；为了保持探索"], "a": 0, "why": "<span class='k'>这是一个很实际的稳健性考虑，而且正是最大化偏差的一个廉价解药。</span>翻译到离线筛选上：最终汇报的配置，取「在自助重采样里当第一名次数最多」的，而不是「均值最大」的。"}],
30: [{"q": "本章小结把「学习」与「规划」的关系推到了最强的形式。那句话是什么？", "o": ["学习是规划的近似", "它们「可能是同一个算法，只是作用在两种不同来源的经验上」—— 所以整合两者只要让它们更新同一个估计的值函数就行", "规划是学习的特例", "它们是互补的两类方法"], "a": 1, "why": "<b>不是「相似」，是「可能是同一个算法」。</b><span class='w'>而三者（规划、行动、学模型）循环互喂，书说「除此之外的任何交互既不被要求也不被禁止」，最自然的做法是异步并行；算力怎么分「几乎可以任意处理」。</span>"}, {"q": "本章的搜索控制策略可以按「聚焦方向」分成两类。分别是什么？", "o": ["按值大小 / 按访问次数", "按深度 / 按宽度", "向后聚焦（优先遍历：聚焦在值刚变过的状态的前驱）与向前聚焦（同策略轨迹采样、RTDP、以及决策时规划：聚焦在可能真的会遇到的状态）", "按状态 / 按动作"], "a": 2, "why": "<b>而向前聚焦的最重要形式，书说就是在决策时做规划</b>——经典启发式搜索是一例，rollout 与 MCTS 是另外两例。<span class='k'>向前聚焦「可以让计算跳过那些与预测或控制问题无关的状态空间部分」。</span>"}],
32: [{"q": "图 8.11 的两条轴分别是什么？四个角各坐哪个方法？", "o": ["横轴是时间、纵轴是空间；四角是 DP/TD/MC/Sarsa", "横轴是模型/无模型、纵轴是在线/离线；四角是四类算法", "横轴是同策略/离策略、纵轴是表格/逼近；四角是四种控制方法", "横轴是更新的宽度（样本 ↔ 期望），纵轴是更新的深度/自举程度（一步 ↔ 完整回报）；四角是 TD（浅样本）、蒙特卡洛（深样本）、动态规划（浅期望）、穷举搜索（深期望）"], "a": 3, "why": "<b>横轴还决定了「你需要什么」</b>：<span class='w'>期望更新要分布模型，样本更新只要样本模型、甚至可以完全无模型</span>。两轴之间全是连续的——左棱是 n 步与 λ-更新的谱，右棱中间是启发式搜索。"}, {"q": "p33 列的八个维度里，「更新的位置」那一条说了什么？", "o": ["更新的位置应该随机选取", "无模型方法只能在实际遇到过的 (s,a) 里挑，而有模型方法可以任意挑 —— 这是模型最根本的那个自由度", "更新应该从值最大的状态开始", "更新的位置由折扣因子决定"], "a": 1, "why": "<span class='k'>有没有模型，决定的不是「准不准」，而是「你能不能挑在哪里更新」。</span>⚠ 而书自己点出这张图缺的最重要一条是<b>函数逼近</b>——第一篇的全部结论都建立在「表格」这个端点上。"}],
34: [{"q": "书怎么评价 E³ 与 R-max 这类有多项式时间保证的算法？", "o": ["它们是目前最实用的方法", "保证在状态数与动作数的多项式时间内找到近最优解，而这「对实用算法通常太慢，但在最坏情况下多半已是能做到的最好」", "它们只适用于确定性环境", "它们的保证已被后来的工作推翻"], "a": 1, "why": "<b>后半句是关键：差距无法靠更聪明的算法消掉，因为那是问题本身的下界。</b><span class='k'>这和 CS234 L13 那个「PAC 保证要求初始值设到 10¹⁰⁰」是同一种模式：定理成立，常数不可用。</span>它们的思路是把乐观初始化推到极端。"}, {"q": "MCTS 的中心思想出自谁？这条为什么值得单独记？", "o": ["Silver 等 2016；因为 AlphaGo", "Sutton & Barto 本人；因为是原创", "Coulom (2006) 与 Kocsis & Szepesvári (2006)；因为 CS234 与 CSE 541 的讲义都用了 UCT 却没给引文", "Tesauro 1997；因为 rollout"], "a": 2, "why": "综述见 Browne 等 (2012)。<span class='w'>书还提到这一节的想法与写法得到 David Silver 的贡献——而 CS234 L16 的课件署名也是「many slides from or derived from David Silver」，两边叙述如此一致，根子在这里。</span>"}]
};

var N = [
{"r": [1, 2], "t": "两种模型，和「规划」到底指什么", "star": 3, "quote": "<em>In this chapter we develop a <b>unified view</b> of reinforcement learning methods that <b>require a model</b> of the environment … and methods that can be used <b>without a model</b> …</em><br><em>Some models produce a description of all possibilities and their probabilities; these we call <b>distribution models</b>. Other models produce just one of the possibilities, sampled according to the probabilities; these we call <b>sample models</b>.</em><br><em><b>Distribution models are stronger</b> than sample models in that they can always be used to produce samples. However, in many applications it is <b>much easier to obtain sample models</b> than distribution models.</em><br><em>We use the term [planning] to refer to <b>any computational process that takes a model as input and produces or improves a policy</b>.</em>", "one": "<b>模型分两种：给出全部可能及其概率的「分布模型」，和只抽一个出来的「样本模型」。前者更强，后者容易得多——而这个不对称决定了这一章后面的几乎所有取舍。</b>", "pts": ["<b>先把这一章的目标摆清楚：它要把「要模型的方法」和「不要模型的方法」合成一个视角。</b> <span class='k'>前者是动态规划、启发式搜索；后者是蒙特卡洛、时序差分</span>。<b>书里说「两者确实有真实的差别，但也有极大的相似性」</b>——<span class='w'>而相似性在于：两边的核心都是<b>计算值函数</b>，而且都是靠「看未来、算一个备份值、拿它当更新目标」。</b>", "<b>分布模型与样本模型的区别，用十二颗骰子之和这个例子一下就清楚了。</b> <span class='k'><b>分布模型</b>：列出所有可能的和以及各自的概率；<b>样本模型</b>：按那个分布抽一个和出来</span>。<b>动态规划用的 <code>p(s′,r|s,a)</code> 是分布模型；第 5 章二十一点那个例子用的是样本模型。</b>", "<b>而那句不对称的话是这一章的地基，值得逐字记</b>：<em>distribution models are <b>stronger</b> … however, in many applications it is <b>much easier</b> to obtain sample models</em>。<span class='w'>骰子的例子把这件事说得很具体：写个程序模拟掷骰子求和很容易，而把所有可能的和及其概率都算出来「更难、也更容易出错」</span>。", "<b>把这个不对称的分量说透：它意味着「更强的工具往往拿不到」。</b> <span class='k'>你能写出模拟器的场合，远多于你能写出概率表的场合</span>。<b>所以后面 8.5 节要专门论证「样本更新在什么时候反而赢」——那一节其实是在为「只有样本模型」这个常态辩护</b>。", "<b>「规划」这个词书里给了一个很宽的定义</b>：<em>any computational process that takes a <b>model</b> as input and produces or improves a <b>policy</b></em>。<span class='w'>注意它不要求「算出最优策略」，也不要求「穷举」</span>——<b>只要输入是模型、输出是更好的策略，就算规划。</b>", "<b>书里顺带划了一条分界，知道一下就行：状态空间规划 vs 计划空间规划。</b> <span class='k'><b>状态空间规划</b>（本书走的这条）把规划看成在状态空间里搜一条最优路径；<b>计划空间规划</b>则在「计划」的空间里搜，算子把一个计划变成另一个计划</span>——<b>演化方法与「偏序规划」属于后者</b>。<span class='w'>书里明说后者「难以高效地用在随机序贯决策问题上」，于是不再考虑</span>。", "<b>然后给出了这一章的两条核心主张，整章剩下的部分都在支撑它们</b>：<span class='k'>① <b>所有状态空间规划方法都把「算值函数」当成改进策略的关键中间步骤</b>；② <b>它们都是通过对<b>模拟经验</b>做更新/备份来算值函数的</b></span>。", "<b>画成图就是：模型 → 模拟经验 → 备份 → 值 → 策略。</b> <span class='w'>而学习方法的图只差一处：它的经验来自环境而不是模型</span>。<b>这一处差别，就是这一章要反复揉开的那条缝。</b>", "<b>动态规划显然符合这个结构，书里点明了怎么对应</b>：<span class='k'>DP 扫过状态空间，对每个状态生成所有可能转移的<b>分布</b>，用它算一个备份值，再更新该状态的估值</span>。<b>换句话说 DP 就是「用分布模型 + 期望更新 + 穷举顺序」的那一个特例。</b>"], "eq": "两种模型（8.1）：\n   分布模型  给出**所有**可能的 (s′, r) 及其概率        例：DP 用的 p(s′,r|s,a)\n   样本模型  按那个分布**抽一个**出来                  例：第 5 章的二十一点\n\n   分布模型更**强**（总能拿来产生样本）\n   但样本模型**容易得多**（十二颗骰子：模拟容易，列全概率难且易错）\n   ⇒ 「更强的工具往往拿不到」 ⇒ 8.5 节要为「只有样本模型」辩护\n\n规划的定义（很宽）：\n   任何**以模型为输入、产出或改进策略**的计算过程\n   不要求最优，不要求穷举\n\n   状态空间规划（本书）：在状态空间里搜最优路径，值函数定义在状态上\n   计划空间规划：在「计划」的空间里搜，算子把一个计划变成另一个\n                （演化方法、偏序规划 —— 书里说难以高效用于随机序贯决策，不再考虑）\n\n本章的两条核心主张：\n   ① 所有状态空间规划都把**算值函数**当成改进策略的关键中间步骤\n   ② 它们都是靠对**模拟经验**做更新/备份来算值函数的\n\n   规划：  模型 ──▶ 模拟经验 ──▶ 备份 ──▶ 值 ──▶ 策略\n   学习：  环境 ──▶ 真实经验 ──▶ 备份 ──▶ 值 ──▶ 策略\n           └── 只差这一处：经验从哪来 ──┘", "tbl": {"head": ["", "分布模型", "样本模型"], "rows": [["给出什么", "<b>所有可能 + 概率</b>", "<b>按概率抽出的一个</b>"], ["谁在用", "动态规划（期望更新）", "蒙特卡洛 / TD（样本更新）"], ["强弱", "<b>更强</b>（总能产生样本）", "较弱"], ["好不好拿", "<span class='w'>难，而且容易出错</span>", "<b>容易得多</b>"], ["骰子的例子", "列全所有和及其概率", "写个程序掷一次"]]}, "res": {"tag": "推断", "v": "<b>这个「分布 / 样本」的二分，正好把你那个 G 的两半切开——而且切得比我之前给的任何理由都更基本。</b><br><span class='k'><b>成本那一半你有分布模型</b></span>：给定一个配置，各节点调用哪个档位、大致多少 token，成本几乎是确定的、可以直接算出来（简报 §4e 的成本模型 R² &gt; 0.95）。<b>这是最强的那种模型——你甚至不需要采样，可以直接做期望更新。</b><br><span class='w'><b>准确率那一半你只有样本模型</b></span>：唯一能知道「这个配置在这条 query 上答对没有」的办法，就是真跑一次，拿回一个 0 或 1。<b>你没有、也不可能有 <code>p(答对 | 配置, query)</code> 这张表</b>——<span class='k'>如果你有，你就不需要那个 LLM 了</span>。<br><b>所以「拆成两半」又多了一条理由，而且是第八条</b>：<b>两半能拿到的<b>模型种类不同</b></b>，于是能用的更新方式不同（一边可以期望更新，一边只能样本更新）。<b>这比「量纲不同」「方差结构不同」都更根本，因为它决定了算法的形状而不只是统计量的选择。</b><br><b>而那条「分布模型更强但更难拿」的不对称，解释了你为什么不该试图去建准确率的分布模型。</b> <span class='w'>一个「预测某配置在某 query 上答对概率」的模型，本质上是在预测 LLM 的行为</span>——<b>这比原问题还难</b>。<b>正确的做法是接受它只是样本模型，然后按 8.5 节的分析去算「样本更新够不够用」。</b><br><b>⚠ 还有一条该现在就记下的：书里对「规划」的定义很宽——<b>任何以模型为输入、产出更好策略的计算过程</b>。</b> <span class='k'>按这个定义，你「用成本模型筛出预算内的候选配置」就是规划，不是什么别的东西</span>。<b>这给了你一个准确的词，而准确的词在写作里很值钱。</b>", "ref": "原书 8.1 节（逐句核对）· 简报 §4e §4f（已核）· CS234 L16.a p6 科研格"}, "link": {"t": "你学过的对应：CS234 L16（「拟合一个模型就等于拥有一个模拟器」——那一讲的前半正是本节，而且补了一条本书没有的好处：奖励函数变了可以零样本重新规划）", "href": "../../cs234-2019/中文精读/L16-精读.html"}},
{"r": [3, 3], "t": "规划与学习共享同一个内核", "star": 3, "quote": "<em>The heart of both learning and planning methods is the <b>estimation of value functions by backing-up update operations</b>. The difference is that whereas planning uses <b>simulated experience</b> generated by a model, learning methods use <b>real experience</b> generated by the environment.</em><br><em>In many cases <b>a learning algorithm can be substituted for the key update step of a planning method</b>. Learning methods require only experience as input, and in many cases they can be applied to simulated experience just as well as to real experience.</em><br><b>Random-sample one-step tabular Q-planning</b>: <em>Loop forever: 1. Select a state S and action A <b>at random</b>; 2. Send S, A to a <b>sample model</b>, obtain R and S′; 3. Apply <b>one-step tabular Q-learning</b> to S, A, R, S′.</em>", "one": "<b>规划和学习的内核是同一个：靠备份操作去估值函数。唯一的区别是经验从模型来还是从环境来——于是任何学习算法都能当规划算法用。</b>", "pts": ["<b>这一页是全章最值钱的一个想法，而且它一句话就能说完</b>：<span class='k'>规划与学习用的是同一台机器，只是喂进去的经验来源不同</span>。<b>书里的措辞是「differing only in the source of their experience」。</b>", "<b>推论一：任何学习算法都能变成规划算法。</b> <span class='w'>学习算法只要求输入是经验，而模拟经验也是经验</span>——<b>把 Q 学习喂上模型采出来的 <code>(S,A,R,S′)</code>，它就成了一个规划算法</b>。<span class='k'>这不是类比，是字面上的替换。</span>", "<b>书里把这个替换做成了一个具体的算法，三行</b>：<b>随机采样一步表格 Q-规划</b>——① 随机选一个状态和动作；② 送进样本模型，拿回 <code>R</code> 和 <code>S′</code>；③ 对这组四元组做一步表格 Q 学习。<span class='w'>就这样循环下去</span>。", "<b>而它的收敛性是「蹭」来的，这一点很漂亮</b>：<em>converges to the optimal policy <b>for the model</b> under the <b>same conditions</b> that one-step tabular Q-learning converges to the optimal policy <b>for the real environment</b></em>。<span class='k'>条件也照搬：每个 (s,a) 要被选到无穷多次，步长 α 要适当衰减</span>。<b>你不需要为规划算法重新证一遍收敛——证明是现成的。</b>", "⚠️ <b>但要看清那句话里的「for the model」。</b> <span class='w'>它收敛到的是<b>模型</b>的最优策略，不是真实环境的最优策略</span>。<b>模型错了，它就精确地收敛到一个错的答案</b>——<span class='k'>而且收敛得又快又稳，一点也不会报警</span>。<b>这正是 8.3 节要处理的事。</b>", "<b>推论二：所有状态空间规划方法的差别，只在三件事上。</b> 书里列得很清楚：<span class='w'><b>做哪种更新</b>、<b>按什么顺序做</b>、<b>备份出来的信息保留多久</b></span>。<b>这三条就是后面各节的纲</b>：<span class='k'>8.5 讲「哪种更新」（期望 vs 样本），8.4 与 8.6 讲「什么顺序」（优先遍历 / 轨迹采样），8.8 讲「保留多久」（背景规划 vs 决策时规划，后者算完就扔）</b>。", "<b>这一页最后还抛出了本章的第二条主题，而它常被忽略：小步增量地规划。</b> <em>planning in <b>small, incremental steps</b> … enables planning to be <b>interrupted or redirected at any time</b> with little wasted computation</em>。<span class='w'>这是把规划和行动、模型学习混在一起的关键条件</span>——<b>大块的规划一旦被打断就全白费，小步的不会。</b>", "<b>而书里补了一句更强的话，值得留意</b>：<em>planning in very small steps may be the <b>most efficient</b> approach <b>even on pure planning problems</b> if the problem is too large to be solved exactly</em>。<span class='k'>就算根本没有「行动」要穿插，小步规划也可能是最高效的</span>——<b>因为大问题上你本来就解不精确，那不如把算力花在最需要的地方。</b>"], "eq": "同一台机器，两种经验：\n\n   学习：环境 ──▶ **真实**经验 ──┐\n                                 ├──▶ 备份更新 ──▶ 值函数 ──▶ 策略\n   规划：模型 ──▶ **模拟**经验 ──┘\n\n   ⇒ 任何学习算法都能当规划算法用（字面替换，不是类比）\n\n随机采样一步表格 Q-规划：\n   循环：① 随机选 S ∈ S, A ∈ A(S)\n         ② 送进**样本模型**，得 R, S′\n         ③ Q(S,A) ← Q(S,A) + α[ R + γ max_a Q(S′,a) − Q(S,A) ]\n\n   收敛性直接蹭 Q 学习的：条件相同（每个 (s,a) 无穷多次、α 适当衰减）\n   ⚠ 但它收敛到的是 **模型的** 最优策略，不是真实环境的\n      模型错了 ⇒ 精确收敛到一个错答案，又快又稳，不报警 ⇒ 8.3 节\n\n所有状态空间规划方法的差别只在三件事：\n   ① 做**哪种**更新        → 8.5 期望 vs 样本\n   ② 按**什么顺序**做      → 8.4 优先遍历 · 8.6 轨迹采样\n   ③ 备份信息**保留多久**  → 8.8 背景规划 vs 决策时规划（后者算完就扔）\n\n第二条主题：**小步增量**地规划\n   ⇒ 随时可被打断或改向，几乎不浪费算力（混合规划/行动/学模型的前提）\n   ⇒ 书里更强的一句：就算是**纯规划**问题，只要大到解不精确，小步也可能最高效", "tbl": {"head": ["差别在哪", "两端", "在哪一节讲"], "rows": [["做哪种更新", "期望更新 ↔ 样本更新", "<b>8.5</b>"], ["按什么顺序", "均匀撒点 ↔ <b>优先遍历 / 轨迹采样</b>", "<b>8.4 · 8.6</b>"], ["保留多久", "一直留着 ↔ <b>算完就扔</b>", "<b>8.8</b>"], ["经验从哪来", "真实环境（学习）↔ 模型（规划）", "<b>就这一处区别</b>"]]}},
{"r": [4, 5], "t": "Dyna：真实经验兵分两路", "star": 3, "quote": "<em>Within a planning agent, there are at least <b>two roles for real experience</b>: it can be used to <b>improve the model</b> … and it can be used to <b>directly improve the value function and policy</b> … The former we call <b>model-learning</b>, and the latter we call <b>direct reinforcement learning</b>.</em><br><em><b>Indirect methods often make fuller use of a limited amount of experience</b> and thus achieve a better policy with fewer environmental interactions. On the other hand, <b>direct methods are much simpler and are not affected by biases in the design of the model</b>.</em><br><em>We use the term <b>search control</b> to refer to the process that selects the starting states and actions for the simulated experiences.</em><br><em>The reinforcement learning method is thus the <b>“final common path”</b> for both learning and planning.</em>", "one": "<b>一条真实经验有两个用处：更新模型，和直接更新值函数。Dyna 两个都做——而这两条路的优劣，正好是一场老辩论的两边。</b>", "pts": ["<b>Dyna 的全部结构就在那张四方框图里：经验、模型、值/策略、环境，加上四个箭头。</b> <span class='k'><b>直接 RL</b>：经验 → 值/策略；<b>模型学习</b>：经验 → 模型；<b>规划</b>：模型 → 值/策略；<b>行动</b>：策略 → 环境 → 新经验</span>。<b>书里特意点出：经验可以<b>直接</b>改进值函数，也可以<b>绕道模型</b>间接改进——后者就是规划。</b>", "<b>而两条路各有各的强处，书里写得很平衡，值得逐条记。</b> <span class='w'><b>间接</b>：更充分地利用有限的经验，于是用更少的环境交互就能得到更好的策略</span>；<span class='w'><b>直接</b>：简单得多，而且<b>不受模型设计偏差的影响</b></span>。", "<b>第二条里「不受模型设计偏差影响」这半句最要紧。</b> <span class='k'>直接法只看真实数据，模型建错了也伤不到它</span>；<b>而间接法的全部好处都押在「模型大体是对的」这个前提上</b>。<span class='w'>这正是 8.3 节整节在处理的风险。</span>", "<b>书里接着说了一段很克制的话，而这个态度本身值得学。</b> <em>Some have argued that indirect methods are <b>always superior</b>… while others have argued that direct methods are responsible for most human and animal learning.</em> <b>而作者的立场是</b>：<em>the contrast between the alternatives in all these debates has been <b>exaggerated</b>, … more insight can be gained by recognizing the <b>similarities</b> between these two sides than by opposing them</em>。", "<b>Dyna-Q 的三个零件都挑了最简单的版本，这是有意的。</b> <span class='k'>规划 = 上一页那个随机采样一步 Q-规划；直接 RL = 一步表格 Q 学习；模型学习 = 表格式，而且<b>假设环境是确定的</b></span>——<b>模型只记「上次从 (S,A) 出发得到了什么 R 和 S′」，再问就原样返回。</b>", "⚠️ <b>而这里有一个极容易被漏掉、却很要紧的设计：规划时只从<b>经历过的</b> (s,a) 里采样。</b> <em>the Q-planning algorithm randomly samples only from state–action pairs that have <b>previously been experienced</b>, so <b>the model is never queried with a pair about which it has no information</b></em>。<span class='w'>模型从不被问到它一无所知的地方</span>。", "<b>把这条的分量说透：它是一个免费的、结构性的护栏。</b> <span class='k'>模型最容易胡说八道的地方，正是它没见过的地方</span>；<b>而这个设计从源头上不让规划走到那里去</b>。<span class='w'>代价是完全放弃了泛化</span>——<b>表格模型本来也没有泛化可言，所以这个代价是零。换成函数逼近的模型，这条护栏就自动失效了，那时「模型被问到没见过的地方」会变成真问题。</b>", "<b>书里给「选哪个 (s,a) 来模拟」这件事起了个名字：<b>搜索控制</b>（search control）。</b> <span class='k'>Dyna-Q 的搜索控制是最笨的——均匀随机</span>。<b>而 8.4 的优先遍历与 8.6 的轨迹采样，换的都只是搜索控制这一个零件</b>。", "<b>最后那句话是这一节的点睛</b>：<em>the reinforcement learning method is the <b>final common path</b> for both learning and planning</em>。<span class='w'>真实经验和模拟经验最后都汇进同一个 Q 学习更新里</span>——<b>所以 Dyna 不是「两个系统拼在一起」，而是<b>一个</b>系统接了两个进料口。</b>"], "eq": "Dyna 的四个箭头：\n                      ┌──▶ **模型学习** ──▶ 模型 ──▶ **规划** ──┐\n   经验 ──────────────┤                                          ├──▶ 值/策略 ──▶ 行动 ──▶ 环境 ──┐\n                      └──────────▶ **直接 RL** ──────────────────┘                                │\n        ▲                                                                                          │\n        └──────────────────────────────────────────────────────────────────────────────────────────┘\n\n两条路的优劣（书里写得很平衡）：\n   间接（绕道模型）：更充分利用有限经验 ⇒ 更少环境交互就得到更好策略\n   直接：           简单得多，而且 **不受模型设计偏差的影响**\n\nDyna-Q 的三个零件都挑最简单的：\n   规划     = 随机采样一步 Q-规划\n   直接 RL  = 一步表格 Q 学习\n   模型学习 = 表格式，**假设环境确定** —— 只记上次的 (R, S′)，再问原样返回\n\n⚠ 一个免费的护栏：规划**只从经历过的 (s,a) 采样**\n   ⇒ 模型从不被问到它一无所知的地方（模型最爱胡说的正是那里）\n   ⇒ 代价是放弃泛化，而表格模型本来就没有泛化 ⇒ 代价为零\n   ⚠ 换成函数逼近的模型，这条护栏自动失效\n\n搜索控制（search control）= 「选哪个 (s,a) 来模拟」\n   Dyna-Q：均匀随机（最笨）\n   8.4 优先遍历 / 8.6 轨迹采样：换的都只是这一个零件\n\n「最终共同通路」：真实经验与模拟经验最后汇进**同一个** Q 学习更新\n   ⇒ Dyna 不是两个系统拼起来，是一个系统接了两个进料口", "tbl": {"head": ["", "直接 RL", "间接（规划）"], "rows": [["经验怎么用", "直接改值函数/策略", "<b>先改模型，再由模型改策略</b>"], ["数据效率", "较低", "<b>更高</b>（更少交互就够）"], ["简单吗", "<b>简单得多</b>", "多一层"], ["受模型偏差影响吗", "<b>不受</b>", "<span class='w'>全部好处押在模型对不对上</span>"], ["Dyna 的选择", "<b>两个都做</b>", "<b>两个都做</b>"]]}, "res": {"tag": "推断", "v": "<b>「一条真实经验有两个用处」这句话，指出了你现在多半只用了一半。</b><br><span class='k'>你每跑一次 (query, 配置)，拿回的是一个 Acc 和一个 Cost</span>。<b>你现在用它做什么？大概率只做了<b>直接</b>那一路</b>——<span class='w'>把这个结果记进 oracle 表，用于估该配置的 G</span>。<b>而 Dyna 说还有第二路：用同一条经验去<b>改进成本模型</b></b>。<br><b>这两路的价值不同，值得分开算。</b> <span class='k'>直接那一路只对<b>这一个配置</b>有用</span>；<b>而改进成本模型那一路，对<b>所有</b>共享该节点的配置都有用</b>——<span class='w'>这正是书里说的「间接方法更充分地利用有限的经验」</span>。<b>你的经验贵（每条是美元），所以这条「一份经验两处用」的收益比在仿真环境里大得多。</b><br><b>具体该怎么做：每条真实观测都做两件事</b>——① 写进 oracle 表（直接）；② <b>把该配置各节点的实际 token 数与实际成本喂给成本模型做在线更新</b>（模型学习）。<span class='k'>第二件几乎不花钱（本地回归），却能让你对<b>没跑过</b>的配置的成本估计一起变准</b>。<br><b>⚠ 而那条「只从经历过的 (s,a) 采样」的护栏，你应该照抄，但要明确它在你这里的形状。</b> <span class='w'>Dyna 的表格模型没有泛化，所以这条护栏是免费的；而你的成本模型<b>是</b>函数逼近，它会对没见过的配置给出一个数</b>。<b>也就是说：这条护栏在你这里<b>默认是关的</b></b>。<span class='k'>要把它打开，就得自己加——比如「只在训练数据密度足够的区域里信任成本模型，密度不够就标为不可信或做悲观修正」</b>。<b>这和我在 CS234 L16.a p13 给的那条悲观修正是同一件事，而这一节解释了它为什么必要：表格模型白送的保护，函数逼近模型要自己花钱买。</b><br><b>最后，「不受模型设计偏差影响」这半句给了你一个该保留的对照组</b>：<span class='w'>报结果时，除了「用成本模型挑出来的配置」，也报一个「完全不用模型、只按实测 oracle 表挑」的版本</span>。<b>两者差多少，就是模型偏差的实测代价——而这个数审稿人一定想看。</b>", "ref": "原书 8.2 节（逐句核对）· 简报 §4d §4e（已核）· CS234 L16.a p13 科研格"}},
{"r": [6, 7], "t": "Dyna-Q 的六行伪代码，和那个迷宫", "star": 3, "quote": "<b>Tabular Dyna-Q</b> — <em>(a) S ← current (nonterminal) state; (b) A ← ε-greedy(S,Q); (c) Take action A; observe R, S′; (d) Q(S,A) ← Q(S,A) + α[R + γ max<sub>a</sub>Q(S′,a) − Q(S,A)]; (e) Model(S,A) ← R, S′ (assuming deterministic environment); (f) Loop repeat <b>n</b> times: S ← random previously observed state; A ← random action previously taken in S; R, S′ ← Model(S,A); Q(S,A) ← Q(S,A) + α[…]</em><br><em><b>If (e) and (f) were omitted, the remaining algorithm would be one-step tabular Q-learning.</b></em><br><em>[Dyna Maze] The nonplanning agent took about <b>25 episodes</b> to reach (ε-)optimal performance, whereas the <b>n = 5</b> agent took about <b>five episodes</b>, and the <b>n = 50</b> agent took only <b>three episodes</b>.</em>", "one": "<b>Dyna-Q 就是 Q 学习加两行：一行记模型，一行拿模型多算 n 次。而那两行把迷宫的学习从 25 幕压到 3 幕。</b>", "pts": ["<b>先看伪代码的结构，它比看起来还简单。</b> <span class='k'>(a)–(d) 完完全全就是一步表格 Q 学习</span>；<b>(e) 把刚发生的转移记进模型；(f) 从模型里随机挑 n 个经历过的 (s,a)，各做一次同样的 Q 更新</b>。<span class='w'>书里把这件事挑明了：去掉 (e)(f)，剩下的就是 Q 学习</span>。", "<b>所以 Dyna-Q 的全部增量只有「记下来」和「多算 n 次」。</b> <span class='k'>而 n 是一个纯粹的算力旋钮</span>——<b>每次真实交互之后，你愿意多花多少本地计算</b>。<span class='w'>真实交互的次数一点没变。</span>", "<b>迷宫实验的数字值得记死，因为它把「算力换数据」这件事量化了。</b> <span class='k'>47 个状态、4 个动作、γ=0.95、α=0.1、ε=0.1、30 次重复</span>。<b>第一幕对所有 n 都是约 1700 步</b>（<span class='w'>随机数种子固定，所以第一幕完全相同</span>）。<b>之后：n=0 要约 25 幕才到 ε-最优；n=5 约 5 幕；n=50 只要 3 幕。</b>", "<b>注意这组对比的公平性：书里特意说 n=0 那个智能体的参数（α 和 ε）是<b>为它优化过</b>的。</b> <span class='k'>也就是说这不是「拿一个没调好的基线凑数」</span>——<b>调到最好，纯直接 RL 仍然慢一个数量级。</b>", "<b>而图 8.3 解释了为什么差这么多，这个机制比数字更值得记。</b> <span class='w'>不规划时，<b>每一幕只给策略增加一步</b></span>——<b>因为只有紧挨着目标的那一步有非零值，信息每幕只能往回传一格</b>。<span class='k'>而规划时，第二幕里一张相当完整的策略已经铺开，几乎回到了起点</span>。<b>书里那句很形象：这张策略是在智能体还在起点附近晃悠的时候，由规划过程在后台建起来的。</b>", "<b>把这件事翻译成一句可迁移的话</b>：<span class='w'>模型让你把<b>一次</b>真实经验的信息，传播到<b>很多</b>状态上去</span>。<b>没有模型，信息只能顺着你实际走过的路、以每幕一格的速度往回爬。</b>", "⚠️ <b>但这个漂亮的结果有一个很强的前提，书里在后面才还账：模型是对的。</b> <span class='k'>这个迷宫里模型「从空白开始，填进去的全是完全正确的信息」</span>——<b>确定性环境、表格模型、没有泛化误差</b>。<span class='w'>现实中三条都不成立，而那正是下一节的题目。</span>", "<b>还有一处值得留意：(f) 里挑的是「<b>随机</b>的、<b>经历过的</b>」(s,a)。</b> <b>「经历过的」是上一节说的那条护栏；「随机」则是最笨的搜索控制</b>——<span class='k'>而 8.4 一开头就会说，均匀随机通常不是最好的</span>。<b>这两个词各自对应后面的一节。</b>", "<b>书里还留了一道值得想的练习（8.1）</b>：<span class='w'>不规划的方法在图 8.3 里显得特别差，是因为它是<b>一步</b>方法；第 7 章的多步自举方法会不会就能赶上 Dyna？</span><b>想一想这个问题，能帮你分清「多步」和「用模型重放」到底是不是一回事。</b>"], "eq": "Tabular Dyna-Q（去掉 (e)(f) 就是一步表格 Q 学习）：\n   (a) S ← 当前非终止状态\n   (b) A ← ε-greedy(S, Q)\n   (c) 执行 A，观察 R, S′\n   (d) Q(S,A) ← Q(S,A) + α[ R + γ max_a Q(S′,a) − Q(S,A) ]      ← 直接 RL\n   (e) Model(S,A) ← R, S′                （假设环境确定）          ← 模型学习\n   (f) 重复 n 次：                                                ← 规划\n          S ← 随机挑一个**经历过的**状态\n          A ← 随机挑一个在 S 下**试过的**动作\n          R, S′ ← Model(S,A)\n          Q(S,A) ← Q(S,A) + α[ R + γ max_a Q(S′,a) − Q(S,A) ]\n\n   ⇒ 全部增量只有「记下来」+「多算 n 次」；真实交互次数**一点没变**\n   ⇒ n 是一个纯粹的**算力旋钮**\n\nDyna 迷宫（47 状态 · 4 动作 · γ=0.95 · α=0.1 · ε=0.1 · 30 次重复）：\n   第一幕对所有 n 都约 1700 步（种子固定）\n   n = 0  （纯直接 RL）  约 **25 幕** 到 ε-最优    ← 而且 α、ε 是**为它优化过**的\n   n = 5                  约 **5 幕**\n   n = 50                 只要 **3 幕**\n\n为什么差这么多（图 8.3）：\n   不规划：每一幕只给策略**增加一步**（信息每幕往回传一格）\n   规划：  第二幕里策略已几乎铺回起点 —— 在智能体还在起点附近晃悠时由后台建起\n   ⇒ 模型让**一次**经验的信息传播到**很多**状态上\n\n⚠ 前提：这个迷宫里模型「从空白开始，填进去的全是完全正确的信息」\n   确定性 + 表格 + 无泛化误差。现实三条都不成立 ⇒ 8.3 节", "tbl": {"head": ["n（每次真实交互后的规划步数）", "到 ε-最优要几幕", "真实交互次数", "本地算力"], "rows": [["0（纯 Q 学习）", "<span class='w'>约 25 幕</span>", "基准", "最少"], ["5", "<b>约 5 幕</b>", "<b>不变</b>", "×5"], ["50", "<b>只要 3 幕</b>", "<b>不变</b>", "×50"], ["⇒ 这是什么交易", "<b>拿本地算力换真实交互</b>", "—", "—"]]}, "res": {"tag": "推断", "v": "<b>Dyna 这笔交易——拿本地算力换真实交互——正是你最需要的那笔，因为你的「真实交互」是用美元计价的。</b><br><span class='k'>迷宫实验里，n 从 0 加到 50，真实交互次数一点没变，而达到最优所需的幕数从 25 降到 3</span>。<b>翻译到你这里：每一次真实的 (query, 配置) 调用之后，你可以在本地用成本模型跑任意多次「模拟评估」，而这不花一分钱。</b><br><b>但要诚实地说清楚这笔交易在你这里只能做一半。</b> ⚠ <span class='w'>Dyna 的模拟能同时给出奖励和下一状态；而你的成本模型只能模拟<b>成本</b>那一半，准确率那一半模拟不了</span>。<b>所以你能免费重放的只有 G 的一个分量</b>。<span class='k'>这又回到 CS234 L16.a 那个「半个模拟器」的结论，而这一节让它变得可量化</span>：<b>你可以免费搜索「在成本约束下有哪些配置可行」，但「它们准确率如何」必须掏钱。</b><br><b>而图 8.3 那个机制对你有一个很具体的用法。</b> <span class='w'>不规划时信息每幕只往回传一格；规划让一次经验的信息传到很多状态</span>。<b>你的对应物是：跑一次「节点 3 用 7B」的配置，直接只告诉你那一个配置的 G</b>；<span class='k'>而如果你用它更新成本模型，那么<b>所有</b>含「节点 3 用 7B」的配置的成本估计都跟着变准</b>。<b>这就是「把一次经验传播出去」，而你现在多半没在做。</b><br><b>⚠ 最后一条警告，来自这个实验的前提。</b> <span class='w'>迷宫里模型填进去的「全是完全正确的信息」，所以 n 越大越好</span>。<b>而你的成本模型有误差，于是 n（本地模拟的强度）<b>不是</b>越大越好</b>——<span class='k'>模拟得越多，你就越被模型的错误牵着走</span>。<b>这不是我的猜测，正是下一节（8.3）整节的内容，而那一节里捷径迷宫那个例子会把这件事说到极致。</b>", "ref": "原书 8.2 节与例 8.1（数字逐条核对）· CS234 L16.a p6 科研格 · 简报 §4e（已核）"}},
{"r": [8, 9], "t": "模型错了：乐观的错会自己暴露，悲观的错不会", "star": 3, "quote": "<em>In some cases, the suboptimal policy computed by planning quickly leads to the discovery and correction of the modeling error. This tends to happen when the model is <b>optimistic</b> … The planned policy attempts to exploit these opportunities and in doing so <b>discovers that they do not exist</b>.</em><br><em><b>Greater difficulties arise when the environment changes to become better than it was before</b>, and yet the formerly correct policy does not reveal the improvement. In these cases <b>the modeling error may not be detected for a long time, if ever</b>.</em><br><em>[Shortcut Maze] The regular Dyna-Q agent <b>never switched to the shortcut. In fact, it never realized that it existed.</b> Its model said that there was no shortcut, so <b>the more it planned, the less likely it was to step to the right and discover it</b>.</em>", "one": "<b>模型往好里错，会被自己纠正；模型往坏里错，可能永远不会被发现——因为你照着它行动，就再也不会去那里看一眼。</b>", "pts": ["<b>先列清模型为什么会错，书里给了三条，而它们的性质很不一样。</b> <span class='k'>① 环境是随机的而你只看了有限样本；② 模型用了函数逼近，泛化得不好；③ <b>环境变了</b>，而新行为还没被观察到</span>。<b>前两条是估计问题，第三条是时间问题——而第三条最难办。</b>", "<b>然后是这一节的核心洞见，而它的结构是不对称的。</b> <span class='w'><b>模型过于乐观</b>（预测的奖励或转移比实际更好）时，规划出来的策略会去<b>利用</b>这些机会，然后<b>发现它们不存在</b></span>——<b>错误因此很快被发现并纠正</b>。<span class='k'>乐观的错是自我暴露的。</span>", "<b>阻塞迷宫（例 8.2）就是这一类，而且结果正如预期。</b> <span class='w'>前 1000 步右侧有一条短路；之后短路被堵、左侧开一条长路</span>。<b>两个智能体都在 1000 步内找到了短路；环境一变，曲线立刻变平（在障碍后面乱转、拿不到奖励），但过一阵子都找到了新开口。</b>", "⚠️ <b>而反过来那一边是真正的麻烦，书里的措辞很重</b>：<em>greater difficulties arise when the environment changes to become <b>better</b> … the modeling error may <b>not be detected for a long time, if ever</b></em>。<span class='k'>环境变好了，而你那个「原本正确」的策略不会揭示这个改进。</span>", "<b>捷径迷宫（例 8.3）把这件事演到了极致，这段话值得逐字记。</b> <span class='w'>前 3000 步最优路在左侧；之后右侧开了一条更短的路，<b>而原来那条路一点没动</b></span>。<b>结果：<em>The regular Dyna-Q agent <b>never switched to the shortcut. In fact, it never realized that it existed.</b></em></b>", "<b>而原因那一句，是整章最该记住的一句话</b>：<em>Its model said that there was no shortcut, so <b>the more it planned, the less likely it was to step to the right and discover it</b>.</em> <span class='k'>规划得越多，发现它的可能性越小</span>——<b>这是一个正反馈，而方向是反的。</b>", "<b>把这个正反馈的机制拆开看，它适用于任何「照着模型做决策」的系统。</b> <span class='k'>模型说 X 不好 → 规划据此把策略推离 X → 你再也不去 X → 没有新数据 → 模型关于 X 的判断永远不更新</span>。<b>注意每一步都是「正确」的：模型按它见过的数据推断没错，规划按模型优化也没错</b>——<span class='w'>错的是这个闭环没有留任何缺口让反例进来。</span>", "<b>书里把它归到了一个熟悉的名目下，而这个归类很有启发</b>：<em>another version of the conflict between <b>exploration and exploitation</b>. In a planning context, <b>exploration means trying actions that improve the model</b>, whereas <b>exploitation means behaving in the optimal way given the current model</b>.</em>", "<b>注意这组定义和老虎机那边不一样，别混。</b> <span class='k'>老虎机里探索是「试试别的臂看看奖励」；这里探索是「试试别的动作<b>来改进模型</b>」</span>——<b>目的从「拿奖励」变成了「修模型」</b>。<span class='w'>而 ε-贪心在捷径迷宫里不够用：书里说「即便用 ε-贪心策略，智能体要做出那么多探索动作才发现捷径，也是极不可能的」。</span>"], "eq": "模型为什么会错（三条，性质不同）：\n   ① 环境随机 + 样本有限        估计问题\n   ② 用了函数逼近，泛化不好      估计问题\n   ③ **环境变了**，新行为还没被观察到    时间问题 ← 最难办\n\n核心的不对称：\n\n   模型**过于乐观**（预测比实际好）\n      ⇒ 规划去**利用**这些机会 ⇒ **发现它们不存在** ⇒ 很快自我纠正\n      例 8.2 阻塞迷宫：短路被堵，两个智能体都重新找到了新开口\n\n   模型**过于悲观**（环境其实变好了）\n      ⇒ 原本正确的策略**不会揭示**这个改进\n      ⇒ 错误「可能很久、甚至永远不会被发现」\n      例 8.3 捷径迷宫：Dyna-Q **从未切换，也从未意识到捷径存在**\n\n⚠ 本章最该记住的一句：\n   「它的模型说没有捷径，于是**它规划得越多，往右走去发现它的可能性就越小**」\n\n   这个反向正反馈，适用于任何「照模型做决策」的系统：\n      模型说 X 不好 ──▶ 规划把策略推离 X ──▶ 不再去 X ──▶ 没有新数据\n            ▲                                                    │\n            └────────── 模型关于 X 的判断永远不更新 ◀────────────┘\n   ⚠ 每一步都「正确」—— 错的是这个闭环没留缺口让反例进来\n\n归类（注意与老虎机的定义不同）：\n   老虎机：探索 = 试别的臂**看奖励**\n   规划里：探索 = 试别的动作**来改进模型**；利用 = 按当前模型最优地行动\n   ⚠ ε-贪心在捷径迷宫里不够用（要碰巧做出那么多探索动作，极不可能）", "tbl": {"head": ["模型错的方向", "会发生什么", "能自我纠正吗", "例子"], "rows": [["<b>过于乐观</b>（以为更好）", "规划去利用 → <b>发现不存在</b>", "<b>能，而且快</b>", "阻塞迷宫（例 8.2）"], ["<b>过于悲观</b>（实际变好了）", "策略绕开 → <b>再也不去看</b>", "<span class='w'>不能，可能永远不会</span>", "捷径迷宫（例 8.3）"], ["⚠ 恶化机制", "<b>规划得越多，越发现不了</b>", "—", "<b>反向正反馈</b>"], ["归到哪个名目", "探索 vs 利用", "—", "<b>但「探索」在这里指「改进模型」</b>"]]}, "res": {"tag": "已核", "v": "<b>捷径迷宫那句话，是你那套「用成本模型挑配置」的做法最危险的失败模式，而且它在你的场景里比在迷宫里更容易发生。</b><br>原文：<em>Its model said that there was no shortcut, so <b>the more it planned, the less likely it was to step to the right and discover it</b>.</em><br><b>翻译到你这里</b>：<span class='k'>成本模型说「节点 3 用 72B 太贵」 → 你的筛选把含它的配置都排除 → 你再也不跑那些配置 → 成本模型关于它们的估计永远停在旧值</b>。<b>而「环境变好了」在 LLM 场景里不是罕见情形，是<b>常态</b></b>：<span class='w'>服务商降价、换了更快的推理后端、新版本模型同样质量下输出更短——每一样都会让某个配置悄悄变便宜，而你的模型不会知道。</span><br><b>⚠ 这比迷宫更糟的地方在于：迷宫里环境变化是一次性的，而 API 定价和模型版本是<b>持续</b>漂移的。</b> <span class='k'>所以这不是一个「跑一次实验」的问题，而是一个「结论会过期」的问题</span>——<b>而论文里的结论恰恰是写死的。</b><br><b>Dyna-Q+ 的修法可以直接照搬（下一页详述）</b>：<span class='w'>给每个 (节点, 档位) 记一个「上次<b>真实</b>测过是多久以前」的计数 τ，规划时给久未测过的加一个奖励加成</span>。<b>在你这里就是：定期重测那些长时间没碰过的配置，而且越久没测，越该优先重测。</b><br><b>而可以写进论文的是一条更保守、也更容易被接受的做法</b>：<span class='k'>明确报告 oracle 表的<b>采集时间窗</b>与当时的 API 价目，并声明结论绑定在那个窗口上</span>。<b>再加一个小实验：隔一段时间重测一个小子集，报告成本漂移了多少。</b><span class='w'>这个实验很便宜，却直接回应了「你的结论还成立吗」这个问题</span>——<b>而这正是本节说的那种「可能永远不会被发现」的错误唯一的解药：主动去看一眼。</b><br><b>⚠ 还有一条要分清：书里这里说的「探索」不是老虎机那个探索。</b> <span class='k'>这里探索的目的是<b>改进模型</b>，不是拿奖励</span>。<b>所以你那套「按信息价值分配预算」（CS234 L16 p47）管的是另一件事</b>：<span class='w'>那是「怎么在候选之间分配预算以尽快分出胜负」，而这里是「怎么分一点预算去验证那些你已经判了死刑的配置」</span>。<b>两者都要，而后者很容易被完全忘掉——因为按定义，它花在你认为不值得的地方。</b>", "ref": "原书 8.3 节与例 8.2 / 例 8.3（逐句核对）· CS234 L16 p47 · 简报 §4e（已核）"}},
{"r": [10, 10], "t": "Dyna-Q+：给「很久没试过」发奖金", "star": 2, "quote": "<em>This agent keeps track for each state–action pair of <b>how many time steps have elapsed since the pair was last tried in a real interaction</b> with the environment. The more time that has elapsed, the greater … the chance that the dynamics of this pair has changed and that the model of it is incorrect.</em><br><em>if the modeled reward for a transition is r, and the transition has not been tried in <b>τ</b> time steps, then planning updates are done as if that transition produced a reward of <b>r + κ√τ</b>, for some small κ.</em><br><em>Of course all this testing has its cost, but in many cases … this kind of <b>computational curiosity</b> is well worth the extra exploration.</em>", "one": "<b>修法很朴素：记住每个 (s,a) 多久没被真实试过，越久就在规划时给它加越多的虚拟奖励。</b>", "pts": ["<b>这个启发式的逻辑只有一句</b>：<span class='k'>距离上次真实试验的时间越长，这一对的动力学变过、而模型已经不对的可能性就越大</span>。<b>所以给它一点额外的吸引力，推着智能体回去看一眼。</b>", "<b>形式是在<b>规划更新</b>里把奖励换成 <code>r + κ√τ</code></b>，<span class='w'>其中 τ 是「多少步没真实试过」，κ 是一个小常数</span>。<b>注意三件事</b>：<span class='k'>① 加的是<b>模拟</b>更新里的奖励，不是真实奖励；② τ 只在<b>真实</b>交互时清零，模拟多少次都不算；③ 用的是 <code>√τ</code> 不是 <code>τ</code></b>。", "<b>第 ③ 点值得想一下：为什么是平方根？</b> <span class='w'>线性增长会让久未访问的地方很快压倒一切，智能体会疯狂地去巡检；而平方根让吸引力增长得温和</span>。<b>这和老虎机里 UCB 的 <code>√(ln n / n_a)</code> 是同一种「次线性增长」的直觉</b>——<span class='k'>不确定性要算进去，但不能让它主宰决策。</span>", "<b>书里说这会鼓励智能体「<b>甚至去找出一长串动作</b>来完成这类测试」。</b> <span class='k'>因为加成是进规划的，而规划会把它沿着路径传播回来</span>——<b>于是「去那个很久没去的地方」本身成了一个有价值的目标，哪怕路很远。</b><span class='w'>这比 ε-贪心强的地方正在这里：ε-贪心只会随机走一步，而这个能规划出一整条「去巡检」的路线。</span>", "⚠️ <b>脚注里还有两处改动，很容易漏，但它们对结果有实质影响。</b> <span class='k'>① 规划步 (f) 里<b>允许考虑从未试过的动作</b>（原版只从试过的里挑）；② 这类动作的初始模型设为「回到原状态、奖励 0」</b>。<b>也就是说 Dyna-Q+ 悄悄放弃了上一节那条「模型从不被问到没见过的地方」的护栏</b>——<span class='w'>它给没见过的地方编了一个保守的默认值，然后允许规划去那里。</span>", "<b>书里对代价的表述很克制</b>：<em>all this testing has its cost, but in many cases … this kind of <b>computational curiosity</b> is well worth the extra exploration</em>。<span class='k'>「计算上的好奇心」这个说法很准</span>——<b>这是花算力和一点点真实行动，去买「我的模型还对不对」这个信息。</b>", "<b>书里留的练习 8.2 值得想</b>：<span class='w'>为什么 Dyna-Q+ 在阻塞/捷径实验的<b>第一阶段</b>也更好？</span><b>（提示：第一阶段模型也是从空白开始的，而「久未试过」的加成会推着它更快地把地图填满。）</b> <b>练习 8.4 则问了一个更有意思的变体</b>：<span class='k'>把加成只用在<b>动作选择</b>里（选 <code>Q(S,a) + κ√τ(S,a)</code> 最大的），而不写进更新</span>——<b>那样加成就不会污染值估计，但也不会被规划传播。</b>"], "eq": "Dyna-Q+ 的探索加成：\n   对每个 (s,a) 记 τ = 距上次**真实**试验过了多少步\n   规划更新时，把模型给的奖励 r 换成       **r + κ·sqrt(τ)**        κ 是一个小常数\n\n   ① 加的是**模拟**更新里的奖励，不是真实奖励\n   ② τ 只在**真实**交互时清零 —— 模拟多少次都不算\n   ③ 用 sqrt(τ) 不用 τ：线性会让巡检压倒一切；平方根温和\n      （同 UCB 的 sqrt(ln n / n_a)：不确定性要算，但不能主宰）\n\n   加成进了规划 ⇒ 会沿路径**传播**回来\n   ⇒ 能规划出一整条「去巡检」的路线（ε-贪心只会随机走一步）\n\n⚠ 脚注里还有两处改动（容易漏）：\n   ① 规划步允许考虑**从未试过**的动作（原版只从试过的里挑）\n   ② 这类动作的初始模型 = 「回到原状态、奖励 0」\n   ⇒ Dyna-Q+ 悄悄放弃了「模型从不被问到没见过的地方」那条护栏，\n     改成给没见过的地方编一个保守默认值\n\n书里的说法：这是一种**计算上的好奇心**（computational curiosity）\n   —— 花算力和一点真实行动，买「我的模型还对不对」这个信息", "tbl": {"head": ["", "ε-贪心", "Dyna-Q+ 的 κ√τ 加成"], "rows": [["怎么促成探索", "随机走一步", "<b>把「久未试过」变成规划目标</b>"], ["能走远吗", "<span class='w'>不能（每步独立随机）</span>", "<b>能，规划出整条巡检路线</b>"], ["对准什么", "无差别", "<b>对准最可能过期的那些</b>"], ["增长速度", "—", "<b>√τ（次线性，不主宰决策）</b>"], ["⚠ 代价", "—", "<b>放弃了「不问没见过的」那条护栏</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页给了上一页那个问题一个可以直接实现的解，而且代价很容易算。</b><br><b>照搬的形式</b>：<span class='k'>给每个 (节点, 档位)——或者每个你关心的配置——记一个 τ = 距上次<b>真实</b>测量过了多久</span>（按天、或按已花的调用次数都行）。<b>定期拿出一小部分预算，优先重测 τ 最大的那些</b>。<span class='w'>这就是「计算上的好奇心」在你这里的形态，只不过你买的不是算力而是美元。</span><br><b>而 √τ 这个形状对你尤其合适，理由值得说。</b> <span class='k'>你真正担心的漂移（API 降价、模型换版）是<b>偶发</b>的，不是持续累积的</span>——<b>所以「越久没测越该测」是对的，但不该线性地越来越急迫</b>。<span class='w'>平方根正好给出这个温和的增长。</span><br><b>⚠ 但有一处必须改，否则会出错：τ 的时钟。</b> <span class='k'>书里 τ 按「时间步」计，而你的世界里「时间」有两个互不相同的尺度</span>——<b>① 你花掉的调用次数（实验进度）；② 真实的日历时间（API 定价与模型版本按它漂移）</b>。<span class='w'>这两个在迷宫里是同一个东西，在你这里不是</span>。<b>你的漂移主要由<b>日历时间</b>驱动，所以 τ 该按日历走</b>——<b>这意味着一个跑了三个月的实验，早期采的 oracle 表格子已经「旧」了，哪怕你中间一次都没动过它。</b><br><b>这给了论文一个很具体、也很容易做的实验</b>：<span class='k'>在投稿前，重测 oracle 表里最早采集的那一小批格子，报告成本与准确率各漂移了多少</span>。<b>漂移小，就证明了结论的时效性；漂移大，那本身就是一个值得报告的发现</b>——<span class='w'>「基于 LLM 成本的优化结论会随定价漂移而失效」是一个真实且有用的结论。</span><b>两种结果都能写，所以这个实验没有下行风险。</b><br><b>⚠ 最后那条脚注的教训也要接住：Dyna-Q+ 为了能去没见过的地方，放弃了「不问模型没见过的」那条护栏，改成给一个<b>保守</b>的默认值。</b> <span class='k'>你要做同样的事时，默认值的方向要选对</span>——<b>对「从没测过的配置」，成本应当按<b>上限</b>估（悲观），而不是按模型外推估。</b>", "ref": "原书 8.3 节的 Dyna-Q+ 与脚注（逐句核对）· 简报 §4d §4e（已核）· CS234 L16.a p13 科研格"}},
{"r": [11, 13], "t": "优先遍历：从变化处倒着扫", "star": 3, "quote": "<em>In the Dyna agents … simulated transitions are started in state–action pairs selected <b>uniformly at random</b> … But a uniform selection is usually <b>not the best</b>.</em><br><em>In general, we want to work back not just from goal states but <b>from any state whose value has changed</b> … This general idea might be termed <b>backward focusing</b> of planning computations.</em><br><em>A queue is maintained of every state–action pair whose estimated value would change nontrivially if updated, <b>prioritized by the size of the change</b>.</em><br><em>[Example 8.4] Prioritized sweeping has been found to dramatically increase the speed at which optimal solutions are found in maze tasks, <b>often by a factor of 5 to 10</b>.</em>", "one": "<b>均匀随机地选模拟起点是浪费的。该做的是从「值刚变过」的地方倒着往回扫，而且按「变化有多大」排优先级。</b>", "pts": ["<b>先看浪费有多严重，书里用第一个迷宫的第二幕说明。</b> <span class='k'>第二幕开始时，只有「直接通向目标」的那一个 (s,a) 有正值，其余全是零</span>。<b>于是绝大多数转移上的更新都是「从一个零值状态到另一个零值状态」——<b>毫无作用</b></b>。<span class='w'>均匀随机采样要瞎碰很多次才撞上一个有用的。</span>", "<b>而书里立刻把这个直觉从「目标状态」一般化了，这一步很关键。</b> <em>we do not really want to use any methods specific to the idea of “goal state” … we want to work back not just from goal states but <b>from any state whose value has changed</b></em>。<span class='k'>目标状态只是一个方便讲直觉的特例</span>——<b>真正的判据是「值变了」。</b>", "<b>倒着扫的逻辑链很直白</b>：<span class='w'>某个状态的值变了 ⇒ 唯一有用的一步更新，是那些<b>直接通向</b>它的动作 ⇒ 更新完这些，它们的前驱状态的值可能又变了 ⇒ 继续往前</span>。<b>书里给这个叫<b>后向聚焦</b>（backward focusing）。</b>", "<b>但「值变了的前驱」可能很多，所以还要排序——这就是「优先」二字。</b> <span class='k'>有些状态的值变了很多，有些只变了一点点；而变得多的那些，它们的前驱也更可能变得多</span>。<b>于是按「如果更新它，值会变多少」来排队</b>。", "<b>算法的形状因此是一个优先队列，三条规则</b>：<span class='w'>① 算 <code>P = |R + γ max_a Q(S′,a) − Q(S,A)|</code>，<code>P &gt; θ</code> 才入队；② 每次取队首更新；③ 更新完，对它的<b>每一个前驱</b>算同样的 P，超过阈值就入队</b>。<b>同一对若已在队中，只保留优先级高的那个。</b>", "<b>效果的数字值得记：迷宫上常快 5 到 10 倍</b>（例 8.4，Peng &amp; Williams 1993）。<span class='k'>而且对比是公平的——两边每次环境交互都至多做 n=5 次更新</span>。<b>图里还显示随着格子分辨率变大（状态数从 47 一路到 6016），优势一直保持。</b>", "<b>例 8.5 那个杆件操纵的数字也值得记，因为它说明了这类方法的适用规模</b>：<span class='w'>4 个动作、<b>14,400 个潜在状态</b></span>，<b>而书里的评价是「这个问题对无优先级的方法多半太大了」</b>。", "⚠️ <b>但书里紧接着给优先遍历泼了冷水，这段比方法本身更值得记。</b> <em>Prioritized sweeping is just one way of distributing computations … and <b>probably not the best way</b>.</em> <span class='k'>它的一个局限是<b>用期望更新</b>，而在随机环境里期望更新会把大量算力浪费在低概率转移上</b>。<b>下一节就要论证样本更新在这种时候反而赢。</b>", "<b>书里还提了一个对偶的策略，和后面几节直接相关</b>：<span class='w'><b>前向聚焦</b>（forward focusing）——按「从当前策略下常访问的状态有多容易到达」来聚焦</span>。<b>书里说「接下来几节的方法把它推到了极端形式」</b>——<span class='k'>那就是轨迹采样（8.6）、RTDP（8.7）与决策时规划（8.8 起）</span>。<b>后向聚焦与前向聚焦，是这一章安排搜索控制的两条主轴。</b>"], "eq": "为什么均匀随机是浪费的（第一个迷宫的第二幕）：\n   只有「直接通向目标」的那一个 (s,a) 有正值，其余全零\n   ⇒ 绝大多数更新是「零值状态 → 零值状态」，毫无作用\n\n后向聚焦（backward focusing）：\n   不是从「目标状态」倒推 —— 目标只是方便讲直觉的特例\n   真正的判据是「**值变了**」：\n      某状态值变了 ──▶ 只有**直接通向它**的动作值得更新\n                 ──▶ 更新完，它们的前驱可能又变了 ──▶ 继续往前\n\n优先遍历（确定性环境）：\n   P = | R + γ max_a Q(S′,a) − Q(S,A) |\n   P > θ 才入队，按 P 排优先级\n   取队首更新 ⇒ 对它的**每个前驱**算同样的 P ⇒ 超阈值就入队\n   （同一对已在队中则只保留优先级高的那个）\n\n效果：迷宫上常快 **5 到 10 倍**（两边都至多 n=5 次更新/交互，对比公平）\n       杆件操纵：4 动作 · **14,400 个潜在状态** —— 书说这对无优先级方法多半太大\n\n⚠ 书里自己泼的冷水：\n   「优先遍历只是分配算力的一种方式，而且**多半不是最好的那种**」\n   局限：它用**期望更新**，随机环境里会把大量算力浪费在低概率转移上 ⇒ 8.5 节\n\n两条主轴（这一章安排搜索控制的方式）：\n   **后向聚焦**：从值变了的地方倒推            ← 8.4\n   **前向聚焦**：从当前策略常访问的地方往前    ← 8.6 轨迹采样 / 8.7 RTDP / 8.8 决策时规划\n                （书说后面几节把它推到了极端形式）", "tbl": {"head": ["搜索控制（选哪个 (s,a) 来模拟）", "做法", "问题 / 效果"], "rows": [["Dyna-Q", "<b>均匀随机</b>（经历过的里）", "<span class='w'>大量无效更新</span>"], ["<b>优先遍历</b>", "<b>从值变了的地方倒推，按变化大小排队</b>", "<b>迷宫上快 5–10 倍</b>"], ["⚠ 它的局限", "用期望更新", "<span class='w'>随机环境里浪费在低概率转移上</span>"], ["前向聚焦", "从当前策略常去的地方往前", "<b>8.6 / 8.7 / 8.8 的方向</b>"]]}, "res": {"tag": "推断", "v": "<b>后向聚焦在你这里有一个非常具体的用法：成本模型一更新，哪些配置的估计需要重算？</b><br><span class='k'>书里的判据是「从<b>值变了</b>的地方倒推」</span>。<b>你的对应物很干净</b>：<span class='w'>当你用新观测更新了「节点 i 用档位 f」的成本估计，需要重算的不是全部 2^H 个配置，而只是<b>含这个 (i,f) 的那些</b></b>——<b>而且该按「这个节点在该配置总成本里占多大比重」排序</b>。<span class='k'>占比大的配置，估计变动大，最该重算；占比小的，变动可以忽略。</span><br><b>这就是优先队列里那个 P，只是换了一个量</b>：<span class='w'>P = |新估计 − 旧估计| × 该节点在该配置中的权重</span>。<b>超过阈值 θ 才重算。</b> <b>在 2^H 个配置上这能把重算量砍掉几个数量级，而且逻辑是有出处的、不是随手的工程优化。</b><br><b>而那条「前向聚焦」对你可能更重要，因为它才是你真正的处境。</b> <span class='k'>后向聚焦问的是「什么变了」，前向聚焦问的是「我实际会用到哪些」</span>。<b>你的留出集 query 分布决定了哪些配置会被真正考虑</b>——<span class='w'>而在 2^H 里，绝大多数配置是任何合理策略都不会选的（比如「全用 7B 但在最简单的那个节点上用 72B」）</span>。<b>把算力和调用预算集中在「从当前最优附近可达」的那一小片，就是前向聚焦</b>，<b>而这正是你那个一步偏离扫描在做的事。</b><span class='k'>换句话说：你的扫描已经是前向聚焦了，只是没有这个名字。</span><br><b>⚠ 而书里那句自我批评你也该接住：优先遍历用期望更新，所以在随机性强的地方浪费算力。</b> <span class='w'>你的准确率那一半随机性很强（同一配置同一 query 可能这次对、下次错）</span>——<b>所以对准确率做「期望更新」式的精细重算是不划算的</b>，<span class='k'>那一半该用样本、该靠多跑几条 query 来压方差</span>。<b>而成本那一半近乎确定，期望更新完全合适。两半又一次需要不同的处理方式。</b>", "ref": "原书 8.4 节与例 8.4 / 例 8.5（逐句核对）· 简报 §4c §4e（已核）· CS234 L16.b p29 科研格"}},
{"r": [14, 15], "t": "期望更新 vs 样本更新：分支因子说了算", "star": 3, "quote": "<em>Expected updates certainly yield a better estimate because they are <b>uncorrupted by sampling error</b>, but they also <b>require more computation</b>, and computation is often the limiting resource in planning.</em><br><em>For a particular starting pair, s, a, let <b>b</b> be the <b>branching factor</b> … Then an expected update of this pair requires roughly <b>b times as much computation</b> as a sample update.</em><br><em>If there is enough time to complete an expected update, then the resulting estimate is generally better … But <b>if there is insufficient time to complete an expected update, then sample updates are always preferable</b> because they at least make some improvement in the value estimate with fewer than b updates.</em>", "one": "<b>期望更新更准但贵 b 倍。而当 b 中等偏大时，只花一小部分算力做样本更新，误差就已经掉得差不多了——于是「把算力摊到很多对上」赢过「把一对算到底」。</b>", "pts": ["<b>先把这一章的更新家族理清楚：三个二元维度，八种情形。</b> <span class='k'>① 更新<b>状态值</b>还是<b>动作值</b>；② 估<b>最优策略</b>的还是<b>给定策略</b>的；③ <b>期望</b>更新还是<b>样本</b>更新</span>。<b>其中 7 种对应具体算法（策略评估、值迭代、q-策略评估、q-值迭代、TD(0)、Sarsa、Q 学习），第 8 种「看起来不对应任何有用的更新」。</b>", "<b>两种更新的式子摆在一起，差别一目了然。</b> <span class='w'>期望更新 (8.1) 对<b>所有</b>可能的 <code>(s′,r)</code> 按概率加权求和；样本更新 (8.2) 只用<b>一个</b>抽到的 <code>(S′,R)</code>，并用步长 α 往那个方向挪一点</span>。", "⚠️ <b>一个边界情形值得记住：下一状态只有一个可能时，两者<b>完全相同</b></b>（取 α=1）。<span class='k'>所以两者的全部差别，只在环境有多随机</span>——<b>更准确地说，只在给定 (s,a) 之后有多少个不同的下一状态会以不同概率出现。</b>", "<b>于是一切归结到<b>分支因子</b> b：使 <code>p̂(s′|s,a) &gt; 0</code> 的 s′ 个数。</b> <span class='w'>期望更新要把 b 个后继都看一遍，所以算力约是样本更新的 b 倍</span>。<b>书里点明算力通常由「Q 在多少个 (s,a) 上被求值」主导，所以这个 b 倍是实打实的。</b>", "<b>然后书里问了一个很好的问题：给定一份算力，是做<b>少数几次期望更新</b>，还是做 <b>b 倍多次的样本更新</b>？</b> <span class='k'>图 8.7 给的答案是后者</span>。", "<b>图 8.7 的设定要看清，不然容易误读。</b> <span class='w'>b 个后继<b>等概率</b>、初始估计的误差为 1、而且<b>后继状态的值假定是正确的</b></span>——<b>所以期望更新一完成就把误差降到 0</b>。<span class='k'>而样本更新把误差降为 <code>√((b−1)/(bt))</code></b>，t 是已做的样本更新次数（取 α=1/t 的样本平均）。", "<b>关键观察是这个式子的形状：误差按 <code>1/√t</code> 掉，而不是按 <code>t/b</code> 线性地掉。</b> <span class='w'>于是 <code>t</code> 只要到 b 的一小部分，误差就已经掉了一大截</span>。<b>书里的说法是：<em>for moderately large b the error falls dramatically with a tiny fraction of b updates</em></b>——<span class='k'>在「一个 (s,a) 做完一次期望更新」的同一时间里，<b>很多</b>个 (s,a) 都能把误差降到期望更新效果的百分之几以内。</b>", "<b>而书里说这个图还<b>低估</b>了样本更新的优势，理由值得记。</b> <em>In a real problem, the values of the successor states would be <b>estimates that are themselves updated</b>. By causing estimates to be more accurate sooner, sample updates will have a <b>second advantage</b> in that the values backed up from the successor states will be more accurate.</em> <span class='w'>图里假设后继的值已经正确，而现实中它们也在学——于是「早一点变准」会沿着备份链复利。</span>", "<b>结论因此是有条件的，条件要记全</b>：<span class='k'>样本更新在「<b>随机分支因子大</b>」<b>且</b>「<b>状态太多以致无法精确求解</b>」的问题上占优</span>。<b>反过来，b 小（接近确定）或者问题小到能算完，期望更新就是对的选择。</b>", "<b>书里留的练习 8.6 值得想一想</b>：<span class='w'>如果那 b 个后继<b>不是</b>等概率的，而是高度偏斜（少数几个概率大得多），这会加强还是削弱样本更新的理由？</span><b>（想一想：采样会自动集中在高概率的那几个上，而期望更新仍然要把低概率的那些也都算一遍。）</b>"], "eq": "一步更新的三个二元维度 ⇒ 8 种，7 种对应算法：\n   ① 状态值 v  /  动作值 q\n   ② 最优 *   /  给定策略 π\n   ③ **期望更新**（DP）/ **样本更新**（一步 TD）\n\n   期望更新 (8.1)：Q(s,a) ← Σ_{s′,r} p̂(s′,r|s,a)·[ r + γ max_{a′} Q(s′,a′) ]\n   样本更新 (8.2)：Q(s,a) ← Q(s,a) + α·[ R + γ max_{a′} Q(S′,a′) − Q(s,a) ]\n\n   ⚠ 下一状态只有一个可能时，两者**完全相同**（取 α=1）\n     ⇒ 全部差别只在环境有多随机\n\nb = 分支因子（使 p̂(s′|s,a) > 0 的 s′ 个数）\n   期望更新的算力 ≈ 样本更新的 **b 倍**\n\n图 8.7（b 个后继等概率、初始误差 1、**后继的值假定正确**）：\n   期望更新：一完成就把误差降到 0\n   样本更新：误差 = **sqrt( (b−1) / (b·t) )**        t = 已做的样本更新次数（α=1/t）\n\n   关键：误差按 1/sqrt(t) 掉，**不是**按 t/b 线性掉\n   ⇒ t 只要到 b 的一小部分，误差就掉了一大截\n   ⇒ 「一个 (s,a) 做完一次期望更新」的同一时间里，\n      **很多**个 (s,a) 都能降到期望更新效果的百分之几以内\n\n⚠ 书说这还**低估**了优势：现实中后继的值本身也在学，\n   「早一点变准」会沿备份链**复利**\n\n结论的两个条件（要记全）：\n   样本更新占优 ⟸ 随机分支因子**大** **且** 状态多到无法精确求解\n   反之（b 小、或问题算得完）⇒ 期望更新才是对的选择", "tbl": {"head": ["", "期望更新", "样本更新"], "rows": [["看几个后继", "<b>全部 b 个</b>", "<b>一个</b>"], ["有采样误差吗", "<b>没有</b>", "<span class='w'>有</span>"], ["算力", "<span class='w'>约 b 倍</span>", "1"], ["b = 1 时", "<b>两者完全相同</b>（α=1）", "<b>两者完全相同</b>"], ["b 大且状态多时", "<span class='w'>算不完</span>", "<b>占优</b>"], ["需要什么模型", "<b>分布模型</b>", "<b>样本模型就够</b>"]]}, "res": {"tag": "推断", "v": "<b>这一节给你一个可以直接套的判据，而套下去的结论对 G 的两半正好相反。</b><br><b>成本那一半：b ≈ 1。</b> <span class='k'>给定一个配置，它的成本近乎确定（token 数有波动，但不是「几个离散的可能结果」）</span>——<b>而 b=1 时期望更新与样本更新<b>完全相同</b></b>。<span class='w'>所以在成本上纠结「要不要多采几次」是没有意义的：算一次就够，多算是浪费。</span><br><b>准确率那一半：b = 2，但严重偏斜。</b> <span class='k'>结果只有对/错两种，所以分支因子是 2</span>；<b>而按这一节的分析，b=2 时期望更新只贵一倍，样本更新的优势很小</b>。<span class='w'>⚠ 但你拿不到期望更新——那需要 <code>p(答对 | 配置, query)</code> 这张分布表，而你只有样本模型</span>（C08.a p1 那条）。<b>所以你被迫用样本更新，不是因为它更划算，而是因为没有别的选择。</b><br><b>这个对照本身值得写一句</b>：<span class='k'>「成本可以期望更新，准确率只能样本更新」——而这又一次是两半必须分开处理的理由，第九条</b>。<br><b>而练习 8.6 那个「偏斜」的问题对你最有意思。</b> <span class='w'>你的准确率分布通常是高度偏斜的：绝大多数 query 上所有配置都对（或都错），只有中间那一层会分出胜负</span>。<b>采样会自动把样本花在实际发生的那一边，这是好事</b>；<b>但它也意味着<b>大部分样本是没有信息的</b></b>——<span class='k'>一条「所有配置都答对」的 query，不管采多少次，都不能帮你区分任何两个配置</span>。<br><b>这指向一个很实际的做法：按「这条 query 能不能区分配置」来筛 query，而不是均匀采样 query。</b> <b>做法很简单</b>：<span class='w'>先用少量配置粗筛，把「全对」和「全错」的 query 标出来，之后的预算只花在剩下那一层上</span>。<b>这和 CS234 L16 p47 那条「预算该花在能改变结论的地方」是同一条原则，只是这次作用在 query 维度而不是配置维度上</b>——<b>两个维度都该这么筛，而你现在可能一个都没筛。</b><br>标【推断】：b 的估算与 query 分层筛选是我推的；成本模型与两半拆分在简报里是【已核】。", "ref": "原书 8.5 节与图 8.7（逐条核对）· C08.a p1 科研格 · CS234 L16 p47 · 简报 §4e §4f（已核）"}},
{"r": [16, 18], "t": "轨迹采样：按「实际会走到哪」分配算力", "star": 3, "quote": "<em>In many tasks the <b>vast majority of the states are irrelevant</b> because they are visited only under very poor policies or with very low probability. Exhaustive sweeps implicitly devote <b>equal time to all parts of the state space</b> rather than focusing where it is needed.</em><br><em>one simulates explicit individual trajectories and performs updates at the state or state–action pairs encountered along the way. We call this … <b>trajectory sampling</b>.</em><br><em>if you are learning to play chess, you <b>study positions that might arise in real games</b>, not random positions of chess pieces.</em><br><em>In all cases, sampling according to the on-policy distribution resulted in <b>faster planning initially and retarded planning in the long run</b>.</em>", "one": "<b>与其均匀地扫遍状态空间，不如顺着当前策略模拟轨迹、就地更新。好处是初期快得多，代价是长期反而变慢。</b>", "pts": ["<b>先说清楚要替换掉的是什么：动态规划那种「扫遍全部状态、每个更新一次」的做法。</b> <span class='k'>在大任务上这有两个毛病——可能连一次扫描都跑不完；而且「绝大多数状态是无关的」（只在很差的策略下、或以极低概率才会被访问到）</span>。<b>穷举扫描对所有状态一视同仁，正是它的问题。</b>", "<b>替代方案是按某个分布采样，而书里认为最有吸引力的是<b>同策略分布</b>——当前策略下实际会遇到的那个分布。</b> <span class='w'>它的一个好处是<b>极容易生成</b>：你只要照着当前策略在模型里走就行</span>。<b>走出来的那条路上遇到什么就更新什么，这就是轨迹采样。</b>", "<b>书里论证了「几乎只能这么做」，这段推理值得看。</b> <span class='k'>你当然可以显式地写出同策略分布、再加权扫描——可那又回到了穷举扫描的全部开销</span>；<b>而且「显式知道同策略分布」本身就不现实</b>：<span class='w'>策略一变分布就变，而算这个分布的代价和做一次完整的策略评估相当</b>。<b>绕来绕去，轨迹采样「既高效又优雅」。</b>", "<b>那个下棋的类比把直觉说得很好</b>：<em>if you are learning to play chess, you <b>study positions that might arise in real games</b>, not random positions of chess pieces</em>。<span class='k'>随机摆出来的局面也是合法状态，但「准确评估它们」是一项<b>不同的技能</b></span>。", "<b>然后书里做了个实验，而实验设计本身值得学：它刻意隔离了「分布」这一个变量。</b> <span class='w'>两边都用一步<b>期望</b>表格更新，只在「按什么顺序/分布更新」上不同</span>——<b>均匀组循环遍历所有 (s,a) 就地更新；同策略组模拟幕、更新 ε-贪心策略下遇到的那些。</b>", "<b>任务是随机生成的，参数要记</b>：<span class='k'>每个状态 2 个动作，每个 (s,a) 通向 b 个等概率的下一状态（每对各自随机挑 b 个）；所有转移上另有 <b>0.1 的概率直接终止</b>；期望奖励取自标准正态；ε=0.1</span>。", "<b>结果是一条很干净的交叉曲线</b>：<span class='w'><b>同策略分布初期更快，长期反而更慢</b></span>。<b>而且两个调节因素的方向都要记</b>：<span class='k'><b>分支因子越小</b>，效应越强、初期优势期越长；<b>状态数越多</b>，效应也越强</b>。<b>1000 状态用 b=1,3,10；10,000 状态且 b=1 时，「优势又大又持久」。</b>", "<b>书里对两端的解释都很直白，而且各自成立。</b> <span class='w'><b>短期快</b>：聚焦在起始状态的近邻后代上，而那正是当前最需要算准的地方</span>；<span class='w'><b>长期慢</b>：常访问的那些状态的值<b>早已正确</b>，再采它们毫无用处，而采别的地方反而能干点实事</span>。", "<b>把这条结论提炼一下，它比实验本身更有用</b>：<span class='k'>聚焦的价值随「还剩多少没算准的东西」而衰减</span>。<b>一开始到处都不准，聚焦在要紧处就是净赚；到后期要紧处都准了，聚焦就变成了原地打转。</b>", "⚠️ <b>书自己给结论留了余地，这一点要照搬</b>：<em>These results are <b>not conclusive</b> because they are only for problems generated in a particular, random way</em>。<b>但它们确实提示：同策略聚焦对<b>大</b>问题、尤其是「同策略分布只覆盖状态-动作空间一小部分」的问题，可能是巨大的优势。</b>"], "eq": "要替换掉的：DP 式的穷举扫描（扫遍全部状态，每个更新一次）\n   毛病一：大任务上连一次扫描都跑不完\n   毛病二：绝大多数状态**无关**（只在很差的策略下、或极低概率才访问到）\n            而穷举扫描对所有状态**一视同仁**\n\n轨迹采样：照当前策略在模型里走，路上遇到什么就更新什么\n   为什么几乎只能这么做：\n      显式写出同策略分布再加权扫描 ⇒ 回到穷举的全部开销\n      而且显式知道它本就不现实：策略一变分布就变，\n      算它的代价与做一次完整策略评估相当\n\n实验（刻意隔离「分布」这一个变量：两边都用一步**期望**表格更新）\n   每状态 2 个动作；每个 (s,a) 通向 b 个等概率后继（各自随机挑）\n   所有转移另有 **0.1 概率直接终止**；期望奖励 ~ N(0,1)；ε = 0.1\n\n结果：同策略分布 **初期更快，长期更慢**\n   分支因子**越小** ⇒ 效应越强、初期优势期越长\n   状态数**越多**   ⇒ 效应也越强\n   （1000 状态 b=1,3,10；10,000 状态 b=1 时「优势又大又持久」）\n\n两端的解释：\n   短期快：聚焦在起始状态的近邻后代 —— 那正是最需要算准的地方\n   长期慢：常访问的状态的值**早已正确**，再采无用；采别处反而能干实事\n\n   ⇒ 提炼：**聚焦的价值，随「还剩多少没算准」而衰减**\n\n⚠ 书自己留的余地：结论**不是定论**（只针对一种特定随机生成的问题）", "tbl": {"head": ["", "穷举扫描（均匀）", "轨迹采样（同策略分布）"], "rows": [["算力怎么分", "<span class='w'>所有状态一视同仁</span>", "<b>按实际会走到哪</b>"], ["初期", "慢", "<b>快得多</b>"], ["长期", "<b>反而更好</b>", "<span class='w'>原地打转（常访问处早已算准）</span>"], ["b 越小", "—", "<b>优势越强、越持久</b>"], ["状态越多", "<span class='w'>越跑不完</span>", "<b>优势越强</b>"], ["怎么生成这个分布", "—", "<b>照策略走一遍就行</b>"]]}, "res": {"tag": "推断", "v": "<b>「绝大多数状态是无关的」这句话，在你的 2^H 配置空间里是字面成立的，而且比书里的例子更极端。</b><br><span class='k'>书里说无关状态是「只在很差的策略下才会被访问」的那些</span>。<b>你的对应物</b>：<span class='w'>2^H 个配置里，绝大多数是任何合理策略都不会选的</b>——<b>比如「在最简单的那个节点上用 72B，而在最难的节点上用 7B」</b>。<span class='k'>这类配置既不便宜也不准，被任何一个方向支配</span>。<b>给它们分配评估预算，就是书里说的「对所有状态一视同仁」。</b><br><b>而「同策略分布」在你这里有一个很自然的对应：从当前最优配置出发可达的那一小片。</b> <b>你的一步偏离扫描正是在采这个分布</b>——<span class='w'>从 AFlow 基线出发、只改一个节点</span>。<b>所以这一节等于给你的扫描提供了一个独立的辩护：它不只是「一步策略改进」（CSE541 L07 那条），还是「按同策略分布分配算力」。</b><span class='k'>两个出处，同一个做法。</span><br><b>⚠ 但这一节也给了你一条<b>反对</b>一直这么做的理由，而且要接住。</b> <span class='w'>同策略聚焦<b>长期会变慢</b>，因为常访问处早已算准，再采无用</span>。<b>翻译过来：如果你一轮又一轮地只在基线附近扫，到后期你会把预算花在一批<b>早已分出胜负</b>的配置上</b>。<span class='k'>这正好接上 CS234 L16 p47 那条——该把预算挪到还没分出胜负的地方去</span>。<b>所以正确的策略是分阶段的：早期在基线附近聚焦（收益大），后期把预算挪向难分的那些对。</b><br><b>而那两个调节因素对你都是<b>有利</b>的方向，这一点值得明说。</b> <span class='w'>书说「分支因子越小、状态越多，同策略聚焦的优势越强、越持久」</span>——<b>而你的分支因子极小（成本几乎确定、准确率只有两个结果），配置数却是指数的</b>。<span class='k'>所以你正落在同策略聚焦优势「又大又持久」的那个角落里</span>。<b>这是一个可以写进论文的、有实验支撑的论证：我们之所以在基线附近做局部搜索而不是全局采样，是因为我们的问题恰好具备让局部聚焦最有利的两个特征。</b><br>标【推断】：对应关系与分阶段建议是我推的；一步偏离扫描与配置空间规模在简报里是【已核】。", "ref": "原书 8.6 节与实验设定（逐条核对）· CSE 541 L07 p29 科研格 · CS234 L16 p47 · 简报 §4c（已核）"}},
{"r": [19, 21], "t": "RTDP：有些状态可以一次都不碰", "star": 3, "quote": "<em>RTDP is an example of an <b>asynchronous DP</b> algorithm … they update state values <b>in any order whatsoever</b>, using whatever values of other states happen to be available.</em><br><em>What is needed is an <b>optimal partial policy</b>, meaning a policy that is optimal for the <b>relevant</b> states but can specify arbitrary actions, or even be undefined, for the irrelevant states.</em><br><em>for certain types of problems … RTDP is guaranteed to find a policy that is optimal on the relevant states <b>without visiting every state infinitely often, or even without visiting some states at all</b>.</em><br><em>[Racetrack] <b>9,115</b> states reachable … only <b>599</b> of which are relevant … Both methods produced policies averaging between <b>14 and 15 steps</b> … but RTDP required only <b>roughly half of the updates</b> that DP did.</em>", "one": "<b>把轨迹采样推到极端：只更新实际走到的状态。于是在合适的问题上，有些状态可以永远不碰，而策略在「相关」的那些状态上仍然是最优的。</b>", "pts": ["<b>RTDP 的定义很简洁：它就是「同策略轨迹采样版的值迭代」。</b> <span class='k'>在真实或模拟轨迹上，对<b>当前状态</b>做一次期望值迭代更新</span>。<b>书里点明它「基本上就是产生图 8.8 里同策略结果的那个算法」。</b>", "<b>它属于<b>异步动态规划</b>这一类，而这类方法的定义本身很解放</b>：<em>not organized in terms of systematic sweeps … they update state values <b>in any order whatsoever</b>, using whatever values of other states happen to be available</em>。<span class='w'>没有「扫描」这个概念，也不要求用同一轮的值</span>——<b>而 RTDP 只是挑了一个特定的顺序：轨迹经过的顺序。</b>", "<b>接着是这一节最有价值的一组概念：相关状态与无关状态。</b> <span class='k'><b>相关</b>：能从某个起始状态、在<b>某个最优策略</b>下到达；<b>无关</b>：任何最优策略下都到不了</span>。<b>而对无关状态，你根本不需要指定最优动作——书里把这个叫<b>最优部分策略</b>。</b>", "<b>这个概念为什么重要？因为它把「要算多少东西」这个问题重新定义了。</b> <span class='w'>传统的说法是「要算遍所有状态」；而这里说「只要算遍<b>相关</b>的那些」</span>——<b>而两者的差距可能是一个数量级以上。</b>", "<b>赛道的数字把这个差距量化了，值得记死</b>：<span class='k'>从起始状态在<b>任何</b>策略下可达的状态有 <b>9,115</b> 个，而<b>相关</b>的只有 <b>599</b> 个</span>——<b>十五分之一</b>。<span class='w'>（相关状态数是靠「执行最优动作跑 10⁷ 幕、数访问过哪些」估出来的。）</b>", "<b>而实测的对比也很具体</b>：<span class='k'>DP 用 28 次扫描、252,784 次更新；RTDP 用 4000 幕、127,600 次更新、每幕平均 31.9 次</span>。<b>两者给出的策略都是平均 14–15 步过线，而 RTDP 只用了大约一半的更新。</b>", "<b>RTDP 的更新分布更能说明问题</b>：<span class='w'>98.45% 的状态被更新<b>不超过</b> 100 次、80.51% 不超过 10 次，而 <b>3.18%（约 290 个）一次都没更新过</b></span>。<b>算力自动地集中到了要紧的地方，而且这个集中还会随着学习继续收紧。</b>", "<b>收敛定理的四个条件要记全，因为它们限制得相当死。</b> <span class='k'>① 每个目标状态的初值为 0；② 存在至少一个策略能从任何起始状态以概率 1 到达目标；③ <b>所有从非目标状态出发的转移奖励严格为负</b>；④ 所有初值 ≥ 其最优值（全设成 0 即可）</span>。<b>满足这些的任务叫<b>随机最优路径问题</b>，通常写成最小化代价而不是最大化奖励。</b>", "⚠️ <b>第 ③ 条是最严的，它排除了很多问题。</b> <span class='w'>「每一步都严格扣分」保证了智能体不会在中途无限徘徊</span>——<b>最短时间控制、高尔夫（最少杆数）这类任务天然满足；而「中途有正奖励可拿」的任务不满足。</b>", "<b>书里还给了 RTDP 的另一个好处，很容易被略过但相当实际。</b> <span class='k'>RTDP 用来产生轨迹的策略<b>始终</b>对当前值函数贪心，所以值函数逼近 v* 时策略也在逼近最优</span>。<b>而传统值迭代在收敛前你并不知道策略已经够好了</b>——<span class='w'>书里说，「对许多不同的值函数贪心都可能得到最优策略」，而检查这件事不是 DP 算法的一部分，要额外花不少算力。</span>", "<b>这个差别在赛道上也被量化了</b>：<span class='k'>接近最优的策略在第 15 次扫描（136,725 次更新）就出现了，少于收敛所需的 252,784</span>，<b>但仍然多于 RTDP 的 127,600</b>。<b>也就是说：就算你能神奇地知道何时该停，DP 仍然比 RTDP 慢。</b>"], "eq": "RTDP = 同策略轨迹采样版的值迭代\n   在真实/模拟轨迹上，对**当前状态**做一次期望值迭代更新\n   属于**异步 DP**：不按扫描组织，**任意顺序**更新，用手头现成的别的状态的值\n\n相关 / 无关状态：\n   **相关**：能从某起始状态、在**某个最优策略**下到达\n   **无关**：任何最优策略下都到不了 ⇒ 根本不需要为它指定动作\n   ⇒ 要的是**最优部分策略**（在相关状态上最优，无关状态上可任意、甚至无定义）\n\n赛道（例 8.6）：\n   任何策略可达      9,115 个状态\n   **相关**的只有      **599** 个          ← 十五分之一\n\n   DP：    28 次扫描，**252,784** 次更新\n   RTDP：  4000 幕，  **127,600** 次更新，每幕 31.9 次\n   两者策略都平均 **14–15 步** 过线 ⇒ RTDP 只用了约**一半**的更新\n\n   RTDP 的更新分布：98.45% 的状态更新 ≤100 次\n                    80.51% ≤10 次\n                    **3.18%（约 290 个）一次都没更新过**\n\n收敛定理的四个条件（Barto, Bradtke & Singh 1995）：\n   ① 每个目标状态初值为 0\n   ② 存在至少一个策略能从任何起始状态以概率 1 到达目标\n   ③ **所有从非目标状态出发的转移奖励严格为负**     ← 最严的一条\n   ④ 所有初值 ≥ 其最优值（全设 0 即可）\n   ⇒ 这类任务叫**随机最优路径问题**（通常写成最小化代价）\n   ⚠ ③ 排除了「中途有正奖励可拿」的任务\n\n另一个好处：RTDP 的行为策略**始终**对当前值函数贪心\n   ⇒ 值函数逼近 v* 时策略也在逼近最优\n   而传统 VI 收敛前你不知道策略已经够好了（检查这件事要额外花算力）\n   赛道上：近最优策略在第 15 次扫描 = 136,725 次更新时就出现了\n           少于收敛所需的 252,784，但**仍多于** RTDP 的 127,600", "tbl": {"head": ["", "传统值迭代（DP）", "RTDP"], "rows": [["更新顺序", "系统性扫描", "<b>轨迹经过的顺序（任意）</b>"], ["要算遍什么", "<span class='w'>所有状态</span>", "<b>只要相关状态</b>"], ["赛道上的更新数", "252,784", "<b>127,600（约一半）</b>"], ["有状态一次都不碰吗", "<span class='w'>不可能</span>", "<b>有，约 290 个</b>"], ["何时策略已够好", "<span class='w'>不知道，要额外算力去查</span>", "<b>始终对当前值贪心，自动逼近</b>"], ["⚠ 代价", "—", "<b>收敛定理有四个相当严的条件</b>"]]}, "res": {"tag": "推断", "v": "<b>「相关状态」这个概念，给了你一个可以直接测、而且多半很惊人的数。</b><br><span class='k'>赛道上 9,115 个可达状态里只有 599 个是相关的</span>。<b>你的对应问题是</b>：<span class='w'>2^H 个配置里，有多少个是「对某条 query 而言最优」的？</b> <b>这个数你可以从 oracle 表上<b>直接数出来</b></b>——<b>对每条 query 取 argmax，收集所有出现过的配置，去重</b>。<br><b>而这个数几乎肯定远小于 2^H，它有两个用处。</b> ① <b>作为论证</b>：<span class='k'>「配置空间是 2^H，但实际相关的只有 k 个」是一句有力的话</span>，<b>而且它把「我们没有穷举全部」从一个弱点变成一个发现</b>。② <b>作为方法</b>：<span class='w'>如果相关集合很小且稳定，那么你的整个方法可以只在这个集合上工作</span>——<b>先用少量 query 找出相关集合，再把全部预算花在区分这几个上。</b><br><b>⚠ 但有一处必须当心，而且这是真正的风险：相关集合是<b>用数据估出来</b>的。</b> <span class='k'>书里那 599 个是靠「执行最优动作跑 10⁷ 幕」数出来的——它<b>已经知道</b>最优策略</span>。<b>而你不知道</b>。<span class='w'>用留出集估出来的「相关集合」，会漏掉那些「本该最优、但因为估计噪声而没当上 argmax」的配置</span>——<b>而这正是 CS234 L16 p47 要你把预算花在难分配置上的理由</b>。<b>所以正确的做法是估一个<b>放宽的</b>相关集合：不是「当过 argmax 的」，而是「置信区间与最优者重叠过的」。</b><br><b>另一条可以直接拿走的是 RTDP 那个「始终对当前值贪心」的好处。</b> <span class='w'>传统 VI 的麻烦是「不知道何时可以停」</span>；<b>而你的对应麻烦是「不知道还要再跑多少 query」</b>。<span class='k'>RTDP 的解法是让行为策略始终贪心，于是随时停下都有一个可用的答案</span>——<b>你的对应做法是：任何时候都维护一个「当前最优配置 + 它的置信下界」，随时可以停、随时可以交付</b>。<b>这就是 CS234 L16 p46 那个「随时可停」的性质，而这一节给了它一个在规划里的先例。</b><br><b>⚠ 最后，那四个收敛条件你<b>不</b>满足，这一点要诚实。</b> <span class='w'>尤其第 ③ 条「所有非目标转移的奖励严格为负」——你的 G 可正可负，而且没有「目标状态」这个结构</span>。<b>所以 RTDP 的定理借不过来，能借的只有它的两个想法：相关状态，和随时可用的贪心策略。</b>", "ref": "原书 8.7 节与例 8.6（数字逐条核对）· CS234 L16 p46 · p47 · 简报 §4d（已核）"}},
{"r": [22, 23], "t": "背景规划 vs 决策时规划", "star": 3, "quote": "<em>planning is not focused on the current state. We call planning used in this way <b>background planning</b>.</em><br><em>The other way … is to begin and complete it <b>after encountering each new state S<sub>t</sub></b>, as a computation whose output is the selection of <b>a single action A<sub>t</sub></b> … We call this <b>decision-time planning</b>.</em><br><em>the values and policy created by the planning process are <b>typically discarded</b> after being used to select the current action.</em><br><em><b>Decision-time planning is most useful in applications in which fast responses are not required.</b> … if <b>low latency</b> action selection is the priority, then one is generally better off doing planning in the background.</em>", "one": "<b>规划有两种用法：在后台慢慢改进整个值函数，或者在遇到每个新状态时现算一个动作、算完就扔。两者的分界线是「你有多少时间回答」。</b>", "pts": ["<b>这一节只做一件事：把前面所有方法归成两类，而这个归类之后一直管用。</b> <span class='k'><b>背景规划</b>：用模拟经验逐步改进策略或值函数，<b>不针对当前状态</b>——等你真要选动作时，查表就行</span>。<b>动态规划和 Dyna 都属于这一类。</b>", "<b><b>决策时规划</b>则相反：遇到状态 <code>S_t</code> 才开始算，算完输出<b>一个动作</b> <code>A_t</code>，然后下一步从 <code>S_{t+1}</code> 重新来过。</b> <span class='w'>最退化的例子是「只有状态值时，比较各动作下模型预测的下一状态的值」</span>；<b>而一般的形式可以往前看很深。</b>", "<b>关键的区别在于<b>结果被保留多久</b>——这正好对上 C08.a p3 列的第三个维度。</b> <span class='k'>决策时规划算出来的值和策略，「在用来选完当前动作之后<b>通常就被丢掉</b>」</span>。<b>书里说这「在很多应用里不是大损失」，理由是状态非常多、你不太可能很快又回到同一个状态。</b>", "<b>书里也提了折中：可以把结果存下来，万一真回到同一个状态就省事了。</b> <span class='w'>所以「全扔」和「全留」之间是连续的</span>——<b>MCTS 的常见实现就在这中间（下一片会讲到：它常保留上一次搜索树里当前节点的那些后代）。</b>", "<b>而决定该用哪一类的，是一个很实在的工程量：<b>你有多少时间回答</b>。</b> <em>Decision-time planning is <b>most useful in applications in which fast responses are not required</b>.</em> <span class='k'>书给的例子是下棋：每步允许算几秒到几分钟，强程序能往前看几十步</span>。", "<b>反过来那句同样要记</b>：<em>if <b>low latency</b> action selection is the priority, then one is generally <b>better off doing planning in the background</b> to compute a policy that can then be <b>rapidly applied</b> to each newly encountered state</em>。<span class='w'>要快，就提前算好；能等，就现场算。</span>", "<b>把这个取舍说透一点，它其实是在交换两种成本。</b> <span class='k'>背景规划把算力花在<b>所有</b>状态上（包括你永远不会遇到的），换来查表级的响应速度；决策时规划把算力全花在<b>这一个</b>状态上，换来更深的前瞻</span>。<b>而当状态空间巨大、每个状态只会遇到一次时，前者的绝大部分算力是白费的。</b>", "<b>书里特意说这两种用法「可以很自然地混在一起」，只是分开研究更好理解。</b> <span class='w'>混合的典型例子就是 AlphaGo</span>：<b>值网络和策略网络是背景规划（离线训练好、随时可查），而 MCTS 是决策时规划（每步现算、算完基本丢掉）</b>。<span class='k'>这个组合在下一片会正面讲到。</span>"], "eq": "两类规划：\n\n   **背景规划**（background planning）\n      用模拟经验逐步改进策略/值函数，**不针对当前状态**\n      要选动作时查表即可 ⇒ 响应极快\n      例：动态规划、Dyna\n\n   **决策时规划**（decision-time planning）\n      遇到 S_t 才开始算，输出**一个动作** A_t，然后从 S_{t+1} 重新来过\n      算出的值与策略**用完就丢**\n      （书：在很多应用里不是大损失 —— 状态太多，不太可能很快回到同一个）\n      例：启发式搜索、rollout、MCTS\n\n   ⇒ 正好对上 C08.a p3 列的第三个维度：**备份信息保留多久**\n\n分界线 = **你有多少时间回答**：\n   能等（下棋，每步几秒到几分钟）        ⇒ 决策时规划\n   要快（低延迟是优先项）                ⇒ 背景规划，提前算好随时查\n\n交换的是哪两种成本：\n   背景规划：算力花在**所有**状态上（含你永远不会遇到的）⇒ 换查表级速度\n   决策时：  算力全花在**这一个**状态上 ⇒ 换更深的前瞻\n   ⇒ 状态空间巨大、每个状态只遇到一次时，前者绝大部分算力白费\n\n两者可以混：AlphaGo = 值/策略网络（背景）+ MCTS（决策时）", "tbl": {"head": ["", "背景规划", "决策时规划"], "rows": [["什么时候算", "<b>平时，持续地</b>", "<b>遇到新状态才算</b>"], ["针对谁", "所有状态", "<b>当前这一个</b>"], ["结果保留吗", "<b>保留（就是值函数）</b>", "<span class='w'>通常用完就丢</span>"], ["响应速度", "<b>查表，极快</b>", "<span class='w'>要等算完</span>"], ["什么时候该用", "低延迟优先", "<b>能等（几秒到几分钟）</b>"], ["典型", "DP · Dyna", "启发式搜索 · rollout · MCTS"]]}, "res": {"tag": "推断", "v": "<b>这个二分正好是你那个「选一个全局配置 vs 对每条 query 现场决定」的选择，而书给出了判据：你有多少时间回答。</b><br><span class='k'><b>背景规划</b> = 离线选出一个（或少数几个）配置，线上直接用</span>：<b>零推理开销、容易给置信保证、容易复现</b>。<span class='w'><b>决策时规划</b> = 对每条进来的 query 现场搜一个配置</span>：<b>能利用这条 query 的具体信息，但每条都要付搜索成本。</b><br><b>而你的延迟预算是真实存在的约束，这一节让它变成一个可以明说的论证。</b> <span class='k'>LLM workflow 本身就要跑几秒到几十秒</span>——<b>所以在这个尺度上，花几十毫秒在本地成本模型上搜一下，几乎是免费的</b>。<span class='w'>按书的判据，你<b>落在「能等」那一侧</b></b>。<b>这意味着决策时规划对你是可行的，而这是一个比「我们选一个全局配置」更有意思的方法。</b><br><b>⚠ 但有一条硬限制必须说清楚：决策时规划要求模拟便宜。</b> <span class='k'>下棋能现场算几十步，是因为模拟一步棋不要钱</span>；<b>而你能现场搜的只有<b>成本</b>那一半（本地模型），准确率那一半现场搜就等于现场调 LLM——那立刻把延迟和费用都打爆</b>。<span class='w'>所以你的决策时规划只能是「在成本模型上搜一个预算内的配置」，不能是「试几个配置看哪个答得对」</span>。<b>这又一次是那个「半个模拟器」的结论，而这一节让它的后果具体了：你能做决策时规划，但只能在一个维度上做。</b><br><b>一个可行、而且很有卖相的组合（正是书里说的「两者混合」）</b>：<span class='k'>① <b>背景</b>：离线用 oracle 表选出若干个「档位画像」，比如「省钱型 / 均衡型 / 保准型」，各自带置信下界；② <b>决策时</b>：每条 query 进来，用一个便宜的难度预测器挑其中一个画像</span>。<b>这样决策时那一步只是一次分类，延迟可以忽略，而置信保证挂在离线那一步上</b>——<b>保证和自适应性都保住了。</b><span class='w'>⚠ 代价是那个难度预测器本身也会错，而它的错会被 argmax 放大（L04 p42 的老问题）。</span><br>标【推断】：延迟判断与混合方案是我推的；成本模型与 oracle 表在简报里是【已核】。", "ref": "原书 8.8 节（逐句核对）· C08.a p1 科研格 · CS234 L16.b p26 科研格 · 简报 §2 §4e（已核）"}},
