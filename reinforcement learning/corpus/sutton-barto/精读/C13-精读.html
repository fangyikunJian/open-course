意它用的是<b>同一个</b> δ</b></span>——δ 同时扮演三个角色：更新 R̄、更新 w、更新 θ。<b>还有一点形状上的改变：外层没有「每幕」循环了，只有「永远循环（每个时间步）」，状态也不再重置——Initialize S ∈ S 只做一次。</b>"], "eq": "持续情形的性能（13.15）：\n\n                              1   h\n   J(θ) ≐ r(π) ≐  lim        ─  Σ  E[ R_t | S₀, A_{0:t−1} ∼ π ]\n                  h→∞        h  t=1\n\n              =  lim  E[ R_t | S₀, A_{0:t−1} ∼ π ]\n                t→∞\n\n              =  Σ_s μ(s) Σ_a π(a|s) Σ_{s′,r} p(s′,r|s,a) r\n\n   μ = **稳态分布**：μ(s) ≐ lim_{t→∞} Pr{ S_t = s | A_{0:t} ∼ π }\n   假设：存在，且**与 S₀ 无关**（**遍历性假设**）\n\n稳态的意思（13.16）—— 下一页证明的关键：\n\n   Σ_s μ(s) Σ_a π(a|s,θ) p(s′|s,a) = μ(s′)，  对所有 s′ ∈ S\n   白话：按 π 选动作，**你就留在同一个分布里**（走一步，分布不变）\n\n持续版 actor–critic 伪代码（带资格迹，后向视角）：\n\n   参数：λ^w ∈ [0,1], λ^θ ∈ [0,1], α^w > 0, α^θ > 0, **α^R̄ > 0**\n   初始化 R̄ ∈ R（例如 0）；w ∈ R^d；θ ∈ R^d′；S ∈ S（例如 s₀）\n   z^w ← 0 （d 维）    z^θ ← 0 （d′ 维）\n   **永远循环（每个时间步）**：          ← 没有「每幕」外层循环\n       A ∼ π(·|S, θ)\n       执行 A，观察 S′, R\n       δ  ← R **− R̄** + v̂(S′,w) − v̂(S,w)       ← **没有 γ**\n       R̄  ← R̄ + α^R̄ δ                          ← 同一个 δ\n       z^w ← λ^w z^w + ∇v̂(S,w)                  ← **没有 γ**\n       z^θ ← λ^θ z^θ + ∇ln π(A|S,θ)             ← **没有 γ，也没有 I**\n       w  ← w + α^w δ z^w\n       θ  ← θ + α^θ δ z^θ\n       S  ← S′\n\n⚠ γ 与 I 的消失不是简化：平均奖励率本身就是对无穷长序列取平均，\n   发散问题已由「除以 h」解决，不需要再打折", "tbl": {"head": ["", "分幕（13.5 节）", "持续（本节）"], "rows": [["性能 J(θ)", "v_{π_θ}(s₀)，依赖<b>起始状态</b>", "<b>每步平均奖励率</b> r(π)"], ["μ 是什么", "η 归一化的同策分布", "<b>稳态分布</b>，需遍历性假设"], ["TD 误差", "R + <b>γ</b>v̂(S′) − v̂(S)", "R <b>− R̄</b> + v̂(S′) − v̂(S)"], ["迹的衰减", "<b>γ</b>λz + …", "λz + …（<b>无 γ</b>）"], ["那个 I（γᵗ）", "有", "<span class='k'>整个消失</span>"], ["步长个数", "2（α^θ, α^w）", "<b>3</b>（多一个 α^R̄）"], ["外层循环", "每幕 + 每步", "<b>只有每步</b>，状态不重置"]]}, "res": {"tag": "推断", "ref": "原书 13.6 节（逐句核对渲染图 p13）· 简报 §9 动作表 · S&B 第 8 章精读 p27–29 科研格（Dyna-Q+ 与「τ 的时钟按日历时间走」）", "v": "<b>你的问题在<b>评估</b>时是分幕的（一条 query 一幕），但在<b>部署</b>时是持续的——而这两件事该用哪套表述，本节给了判据。</b><br><span class='k'><b>判据是「有没有自然的幕边界」。</b></span><b>单条 query 当然有：进来、过完管道、给出答案。</b><span class='w'><b>但一个长期在线的路由器没有：它面对的是一条不断到来的 query 流，而且档位的成本与质量会随时间漂移</b></span>（第 8 章那条坑已经点明：降价、换推理后端、新版同质量下输出更短，<b>「环境变好」在 LLM 场景是常态不是例外，且是持续漂移</b>）。<br>⇒ <b>三条可用的：</b><br>① ⭐ <b>R̄ 就是你的部署期指标，而且它是被<b>在线</b>追踪的。</b><b>平均奖励表述里 R̄ 是一个被持续更新的量（R̄ ← R̄ + α^R̄ δ），不是事后在留出集上算一次的数。</b><b>这正好是你需要的那种指标：「我这个路由器眼下的平均 G 是多少」。</b><b>而且 α^R̄ 的大小直接就是「忘记多久以前的数据」，——这比第 8 章那个「τ 按日历时间走」的建议更可操作，因为它是算法自带的。</b><br>② <b>没有 γ 这件事，对你是好消息。</b><b>你的 G = Acc − λ·Cost 本来就没有自然的折扣</b>——一条 query 里第三个节点的成本不该比第一个节点的成本打折。<span class='k'><b>分幕打折版需要你凭空选一个 γ（而且上一片刚看到，那个 γᵗ 因子历史上被漏了二十年）；持续表述里这个选择根本不存在。</b></span><br>③ ⚠ <b>但遍历性假设要盯住。</b>本节假设稳态分布<b>存在</b>且<b>与 S₀ 无关</b>。<span class='w'><b>query 流有分布漂移时，这个假设就不成立</b></span>——而漂移恰恰是你预期会发生的（新模型、新定价、用户行为变化）。<b>⇒ 诚实的做法是把它写成一个<b>明示的假设</b>，并报告 R̄ 的时间序列而不只是终值；R̄ 的漂移本身就是「假设正在失效」的信号。</b>"}},
{"r": [14, 14], "t": "差分回报：换掉值的定义之后，定理一字不改地继续成立", "star": 3, "quote": "<em>Naturally, in the continuing case, we define values … with respect to the <b>differential return</b>: G_t ≐ R_{t+1} − r(π) + R_{t+2} − r(π) + R_{t+3} − r(π) + ⋯</em><br><em>With these alternate definitions, <b>the policy gradient theorem as given for the episodic case (13.5) remains true for the continuing case</b>. … <b>The forward and backward view equations also remain the same.</b></em>", "one": "<b>持续情形里回报改成「每一项都减去平均奖励率」的差分回报。换了这个定义之后，(13.5) 这条定理原样成立，前向后向的式子也原样成立——只换定义，不换公式。</b>", "pts": ["<b>差分回报的形状很直白：G_t ≐ (R_{t+1} − r(π)) + (R_{t+2} − r(π)) + (R_{t+3} − r(π)) + ⋯</b> <span class='k'><b>每一项都减去平均奖励率。</b></span><b>这样做的理由是收敛性：如果不减，持续问题的回报是一个发散的无穷和；减掉平均之后，剩下的是「比平均好多少」的累积，它可以收敛。</b><b>值的定义照常：v_π(s) ≐ E_π[G_t | S_t = s]，q_π(s,a) ≐ E_π[G_t | S_t = s, A_t = a]，只是 G_t 换成了差分版本。</b>", "<b>然后是本节最值得记的一句话。</b> <span class='w'><b>「有了这些替代定义，分幕情形下给出的策略梯度定理 (13.5) <b>在持续情形下仍然成立</b>。前向与后向视角的式子也保持不变。」</b></span><b>也就是说：换掉性能的定义、换掉 μ 的含义、换掉回报的定义之后，∇J(θ) ∝ Σ_s μ(s) Σ_a q_π(s,a) ∇π(a|s,θ) 这一行一个字都不用改。</b>", "<b>而且在持续情形下，那个「∝」还变成了「=」。</b> 回想 13.2 节的交代：<b>比例常数在分幕情形是一幕的平均长度，在持续情形是 1</b>。<span class='k'><b>⇒ 持续情形里这是一个<b>等式</b>，不是比例关系。</b></span><b>这一点在分幕那一节被一笔带过，到这里才真正用上。</b>", "<b>证明的开头和分幕版一模一样，但很快就分叉了。</b> 照旧从 ∇v_π(s) = ∇[Σ_a π(a|s) q_π(s,a)]（习题 3.18）出发，用乘积法则拆成两项。<span class='k'><b>分叉出现在展开 ∇q_π 的时候：持续情形下 q_π 的 Bellman 方程里，括号内是 <b>r − r(θ) + v_π(s′)</b>，比分幕版多了一个 −r(θ)。</b></span><b>于是求导之后多出一项 −∇r(θ)。</b>", "<b>接下来是一步很漂亮的重排，值得慢读。</b> 把多出来的 ∇r(θ) 移到等式左边，得到：<b>∇r(θ) = Σ_a [ ∇π(a|s) q_π(s,a) + π(a|s) Σ_{s′} p(s′|s,a) ∇v_π(s′) ] − ∇v_π(s)</b>。<span class='w'><b>关键观察：左边可以写成 ∇J(θ)，而<b>它不依赖 s</b>。</b></span><b>既然左边不依赖 s，右边也就不依赖 s；于是可以放心地对所有 s ∈ S 按 μ(s) 加权求和，而不改变它的值——因为 Σ_s μ(s) = 1。</b>", "<b>⚠ 这一步的逻辑方向容易读反，停一下。</b> <b>不是「我们想加权求和所以加权求和」，而是「左边与 s 无关 ⇒ 右边也与 s 无关 ⇒ 任何权重和为 1 的加权平均都等于它本身」。</b><span class='k'><b>选 μ 作权重不是因为它特殊，而是因为下一步需要它的稳态性质。</b></span><b>这是一个「为了后面能用某条性质，现在故意把它引进来」的典型步骤。</b>下一页就会看到它怎么兑现。"], "eq": "差分回报（13.17）：\n\n   G_t ≐ ( R_{t+1} − r(π) ) + ( R_{t+2} − r(π) ) + ( R_{t+3} − r(π) ) + ⋯\n         ↑ 每一项都减去平均奖励率\n   理由：不减的话，持续问题的回报是**发散**的无穷和；\n         减掉平均之后，剩下「比平均好多少」的累积，可以收敛\n\n   值的定义照旧，只是 G_t 换成差分版：\n      v_π(s)   ≐ E_π[ G_t | S_t = s ]\n      q_π(s,a) ≐ E_π[ G_t | S_t = s, A_t = a ]\n\n⭐ 换完之后：\n   **(13.5) 在持续情形下原样成立**，前向后向的式子也原样成立\n   而且比例常数 = **1** ⇒ 这里的 ∝ 其实是 **=**\n\n持续情形证明的分叉点：\n\n   ∇v_π(s) = Σ_a [ ∇π(a|s) q_π(s,a) + π(a|s) ∇q_π(s,a) ]      （乘积法则）\n\n   展开 ∇q_π 时，Bellman 方程括号内是  r **− r(θ)** + v_π(s′)\n   （比分幕版多一个 −r(θ)）⇒ 求导后多出一项 **−∇r(θ)**\n\n重排，把 ∇r(θ) 移到左边：\n\n   ∇r(θ) = Σ_a [ ∇π(a|s) q_π(s,a)\n                 + π(a|s) Σ_{s′} p(s′|s,a) ∇v_π(s′) ] − ∇v_π(s)\n\n   ⚠ 左边可写成 ∇J(θ)，而**它不依赖 s**\n      ⇒ 右边也不依赖 s\n      ⇒ 可以按 μ(s) 对所有 s 加权求和而**不改变其值**（因为 Σ_s μ(s) = 1）\n      ⚠ 选 μ 不是因为它特殊，是因为下一步要用它的**稳态性质**", "tbl": {"head": ["", "分幕", "持续"], "rows": [["回报 G_t", "Σ γ^k R", "<b>差分回报</b>：每项减 r(π)"], ["为什么这么定", "γ 保证收敛", "<b>减平均</b>保证收敛"], ["(13.5) 还成立吗", "—", "<b>一字不改地成立</b>"], ["∝ 的常数", "一幕的平均长度", "<b>1</b> ⇒ 其实是等式"], ["Bellman 括号内", "r + v_π(s′)", "r <b>− r(θ)</b> + v_π(s′)"], ["证明的关键动作", "展开 unrolling 后收集", "<b>重排 + 按 μ 加权求和</b>"]]}, "res": {"tag": "推断", "ref": "原书 13.6 节与 p334 证明方框前半（逐步核对）· 简报 §4e「估计量要拆成两半」· 简报 §7 第 5 拳「成本口径不可信」", "v": "<b>差分回报的那个「每一项都减去平均」，和你把 G 拆成两半的做法有一个共同的形状，但要小心别把它们当成同一件事。</b><br><span class='k'><b>共同点</b></span>：两者都是「减去一个参照值以后再看剩下什么」。差分回报减的是 r(π)（全局平均奖励率），你的基线减的是 b(s)（状态相关的参照）。<br><span class='w'><b>区别，而且很要紧</b></span>：<b>差分回报里减 r(π) 是<b>定义</b>的一部分——不减就发散，没得选；而基线减 b(s) 是<b>可选</b>的方差缩减——减不减都无偏。</b><br>⇒ <b>对你的直接用处在「成本口径」那一拳上。</b>简报 §7 第 5 拳说审稿人会质疑你的成本口径，因为自托管 vLLM 上 72B/7B 的成本比取决于 batch 占用、TP 度、量化，<b>不是 OpenAI 价目表</b>。<b>而本页提示了一个可以借的形式：报<b>相对于某个基准配置的差分</b>，而不只是绝对值。</b><br><b>具体地：与其报「配置 A 的成本是 X 美元」，不如报「配置 A 相对 all-7B 基线的成本增量是 Y 个 token / Z GPU-秒」。</b><span class='k'><b>差分量对「口径」的敏感度远低于绝对量</b></span>——batch 占用和量化方式会同时影响分子分母，很大一部分在作差时抵消。<br><b>⚠ 但别把这条当成逃避口径问题的借口：绝对值仍然要报（审稿人要知道量级），差分只是让结论对口径假设更稳健。简报原话要求的是「报 token 数 + GPU-秒 + 峰值显存归一吞吐，写明 TP 配置与量化；API 价格另列并<b>明确标注为假设值</b>」——这条一项都不能省。</b>"}},
{"r": [15, 15], "t": "稳态让两项精确抵消；然后换个思路处理连续动作：学分布的统计量", "star": 3, "quote": "<em>Policy-based methods offer practical ways of dealing with <b>large action spaces, even continuous spaces with an infinite number of actions</b>. <b>Instead of computing learned probabilities for each of the many actions, we instead learn statistics of the probability distribution.</b></em><br><em>The value p(x) is <b>the density</b> of the probability at x, <b>not the probability</b>. It can be <b>greater than 1</b>; it is the total area under p(x) that must sum to 1.</em>", "one": "<b>持续情形的证明靠稳态性质收尾：那一坨正好等于 μ(s′)，于是两个 ∇v_π 项变成同一个和、只是记号不同，直接抵消。然后 13.7 换了个思路——动作太多时不学每个动作的概率，改学分布的统计量。</b>", "pts": ["<b>先把证明收完，最后一步是本节最漂亮的地方。</b> 上一页重排之后，按 μ(s) 加权求和，得到三项：<b>Σ_s μ(s) Σ_a ∇π(a|s) q_π(s,a)</b>（要的那一项），加上 <b>Σ_{s′} [ Σ_s μ(s) Σ_a π(a|s) p(s′|s,a) ] ∇v_π(s′)</b>，减去 <b>Σ_s μ(s) ∇v_π(s)</b>。", "<b>中间那个方括号里的东西，正是 (13.16) 的左边。</b> <span class='k'><b>Σ_s μ(s) Σ_a π(a|s,θ) p(s′|s,a) = μ(s′)</b></span>——书在渲染页上用一个下花括号把它标了出来，注着「μ(s′) (13.16)」。<b>代进去，第二项就变成 Σ_{s′} μ(s′) ∇v_π(s′)。</b>", "<b>于是第二项和第三项是<b>同一个和</b>，只是求和指标一个叫 s′ 一个叫 s。</b> <span class='w'><b>它们精确抵消，一点余项都不剩。</b></span><b>剩下 ∇J(θ) = Σ_s μ(s) Σ_a ∇π(a|s) q_π(s,a)。Q.E.D.</b><b>⚠ 注意这里是<b>等号</b>不是正比——13.2 节说过持续情形的比例常数是 1，到这里兑现了。</b><b>回头看，上一页那句「选 μ 作权重不是因为它特殊，而是因为下一步要用它的稳态性质」在这里结清：整个证明的分量都压在 (13.16) 这一条上。</b>", "<b>13.7 节换了一个问题：动作空间很大，甚至是连续的、无穷多个动作，怎么办。</b> <span class='k'><b>书给的办法是一句话：不去为众多动作中的每一个计算一个学到的概率，<b>改为学这个概率分布的统计量</b>。</b></span><b>这是一次表示上的转换——参数的个数从「和动作数一样多」变成「和统计量一样多」，和动作有多少个脱钩了。</b>", "<b>正态分布是书给的例子，而它顺手澄清了两件事。</b> <b>① 记号冲突</b>：(13.18) 里的 π 「当然只是那个数 π ≈ 3.14159」，<span class='k'><b>和策略 π 没有关系</b></span>——书专门写了这一句，说明这个混淆确实常见。<b>② 密度不是概率</b>：p(x) 是概率在 x 处的<b>密度</b>，不是概率；<span class='w'><b>它可以大于 1</b></span>；必须等于 1 的是 p(x) 曲线下的<b>总面积</b>。", "<b>策略就定义成「在实值标量动作上的正态密度」，均值和标准差由依赖状态的函数逼近器给出。</b> 这就是 (13.19)：π(a|s,θ) ≐ 1/(σ(s,θ)√(2π)) · exp( −(a − μ(s,θ))² / (2σ(s,θ)²) )。<span class='k'><b>其中 μ : S×R^d′ → R，σ : S×R^d′ → R⁺ 是两个参数化的函数逼近器。</b></span><b>⚠ 注意 σ 的陪域写的是 R⁺ 而不是 R——标准差必须为正，这一条在下一页决定了它的参数化形式。</b>"], "eq": "持续情形证明的收尾（照 ch13.pdf p15 渲染图抄）：\n\n   ∇J(θ) = Σ_s μ(s) Σ_a ∇π(a|s) q_π(s,a)\n           + Σ_{s′} [ Σ_s μ(s) Σ_a π(a|s) p(s′|s,a) ] ∇v_π(s′)\n                      └──────── 这一坨 = μ(s′)，由 (13.16) ────────┘\n           − Σ_s μ(s) ∇v_π(s)\n\n         = Σ_s μ(s) Σ_a ∇π(a|s) q_π(s,a)\n           + Σ_{s′} μ(s′) ∇v_π(s′)  −  Σ_s μ(s) ∇v_π(s)\n             └──────── 同一个和，只是指标名不同 ⇒ 精确抵消 ────────┘\n\n         = Σ_s μ(s) Σ_a ∇π(a|s) q_π(s,a)            Q.E.D.\n\n   ⚠ 这里是**等号**，不是正比 —— 持续情形的比例常数 = 1\n   ⚠ 整个证明的分量都压在 (13.16) 这一条稳态性质上\n\n13.7 连续动作的思路转换：\n   不为每个动作学一个概率  →  **学概率分布的统计量**\n   ⇒ 参数个数与**动作数脱钩**\n\n正态密度（13.18）：\n                1          ⎛   (x − μ)²  ⎞\n   p(x) ≐ ──────────  exp ⎜ − ───────── ⎟\n            σ √(2π)        ⎝     2σ²     ⎠\n\n   ⚠ 这里的 π「当然只是那个数 π ≈ 3.14159」，和策略 π 无关\n   ⚠ p(x) 是**密度**不是概率，**可以大于 1**；\n      必须等于 1 的是曲线下的**总面积**\n\n高斯策略（13.19）：\n                      1              ⎛   (a − μ(s,θ))²  ⎞\n   π(a|s,θ) ≐ ───────────────  exp ⎜ − ─────────────── ⎟\n                σ(s,θ) √(2π)        ⎝    2 σ(s,θ)²      ⎠\n\n   μ : S×R^d′ → R      σ : S×R^d′ → **R⁺**  ← 标准差必须为正", "tbl": {"head": ["", "离散动作（13.1 节）", "连续动作（13.7 节）"], "rows": [["学什么", "每个动作一个偏好 h(s,a,θ)", "<b>分布的统计量</b>（均值、标准差）"], ["参数个数", "随动作数增长", "<b>与动作数脱钩</b>"], ["策略形式", "soft-max (13.2)", "正态密度 (13.19)"], ["随机性由谁定", "偏好之间的差距", "<b>σ(s,θ)，可学、依赖状态</b>"], ["⚠ 记号陷阱", "—", "(13.18) 里的 π 是圆周率，不是策略"], ["⚠ 概念陷阱", "—", "p(x) 是<b>密度</b>，可以大于 1"]]}, "res": {"tag": "推断", "ref": "原书 13.6 节证明方框收尾与 13.7 节开篇（逐步核对渲染图 p15）· 简报 §7 第 3 拳「两个模型就是两条臂，决策问题在哪」· 简报 §9 动作 2", "v": "<b>「不为每个动作学一个概率，改学分布的统计量」这个转换，正对着简报 §7 第 3 拳要你做的那件事。</b><br><span class='k'><b>那一拳是：|M|=2、H≤5 时构型空间 ≤32，可穷举，探索机制显得像表演。建议是<b>加宽保真度集合</b>——7B greedy / 7B self-consistency k=3 / 7B k=8 / 72B greedy / prune。</b></span><br><b>而一旦加宽，一个性质就出现了：这些档位是<b>有序</b>的</b>（按成本排，也大致按质量排）。<span class='w'><b>有序意味着它们不是五个无关的类别，而是一条轴上的五个点。</b></span><br>⇒ <b>于是本节的做法变得可用：与其给五个档位各学一个偏好，不如在那条轴上学一个<b>位置</b>和一个<b>展开度</b>。</b><br><b>三条具体的好处：</b><br>① <b>参数个数与档位数脱钩。</b>以后再加档位（新模型、新量化）不必重训——<b>这对一个会持续漂移的环境是实打实的好处</b>（第 8 章那条坑）。<br>② <b>σ 就是倾向性的展开度，而且它是<b>学出来</b>的、<b>依赖状态</b>的。</b><b>你需要随机化来做 OPE（简报 §4a），但「随机多少」一直是个手设的数。这里它变成策略参数的一部分：难的 query 上自动摊开，容易的 query 上自动收紧。</b><br>③ ⚠ <b>但有一个直接的张力，必须预先想清楚。</b><b>13.1 节的第一条好处是「策略可以逼近确定性」——在高斯参数化下，这意味着 σ → 0。</b><span class='w'><b>而 σ → 0 正是你最不想要的：它会把 OPE 的覆盖条件重新打破。</b></span><b>⇒ 若走这条路，必须给 σ 设一个下界（例如把 (13.20) 的指数形式改成 σ_min + exp(·)），并且把这个下界<b>写进方法而不是写进实现</b>——它是「我们要可评估性」这个需求的直接后果，不是一个调参技巧。</b>"}},
{"r": [16, 16], "t": "均值用线性、标准差用指数；资格向量分成两半，各管一件事", "star": 3, "quote": "<em>The mean can be approximated as a linear function. <b>The standard deviation must always be positive and is better approximated as the exponential of a linear function.</b></em><br><em>With these definitions, <b>all the algorithms described in the rest of this chapter can be applied</b> to learn to select real-valued actions.</em>", "one": "<b>把 θ 劈成两半：θ_μ 管均值、θ_σ 管标准差。均值线性就行，标准差必须恒正，所以写成「线性的指数」。于是资格向量也分成两半——一半推着均值动，一半推着展开度动。</b>", "pts": ["<b>参数向量分成两部分：θ = [θ_μ, θ_σ]ᵀ。</b> <b>均值可以用线性逼近</b>：μ(s,θ) ≐ θ_μᵀ x_μ(s)。<span class='w'><b>标准差不行——它必须永远为正，所以「更好的逼近是一个线性函数的指数」</b></span>：σ(s,θ) ≐ exp(θ_σᵀ x_σ(s))。<b>其中 x_μ(s) 与 x_σ(s) 是状态特征向量，可以用 9.5 节的任一方法构造——⚠ 注意它们是<b>两个</b>特征向量，不必相同。</b>", "<b>exp 这个选择不是随手挑的，它同时办成了两件事。</b> <span class='k'><b>① 恒正</b></span>：exp 的值域是 (0, ∞)，无论 θ_σ 取什么都不会让 σ 变成零或负数。<span class='k'><b>② 可微且无约束</b></span>：θ_σ 可以在整个 R^d 上自由移动，不需要投影或截断。<b>如果直接写 σ = θ_σᵀ x_σ(s)，你就得在每步更新后把它截回正数，而截断会破坏梯度——这正是 13.1 节「可微，且 ∇π 存在且有限」那条要求在这里的体现。</b>", "<b>书对这一节的收尾很轻，但那句话的分量不小。</b> <b>「有了这些定义，本章其余部分描述的<b>所有算法</b>都可以拿来学习选择实值动作。」</b><span class='k'><b>⇒ REINFORCE、带基线的 REINFORCE、一步 actor–critic、带资格迹的 actor–critic、分幕的与持续的——一个都不用改。</b></span><b>这正是 p8 那条「资格向量是整个算法里唯一出现策略参数化的地方」的兑现：换参数化只需要换这一个向量怎么算。</b>", "<b>习题 13.4 给出了那个向量的两半，值得抄下来读懂。</b> <b>对均值那一半：∇ln π(a|s,θ_μ) = (1/σ(s,θ)²) · (a − μ(s,θ)) · x_μ(s)。</b><span class='k'><b>读法：实际动作比均值大，就把均值往大推；小就往小推；推的力度被 1/σ² 调节——σ 越小，同样的偏差推得越狠。</b></span>", "<b>对标准差那一半：∇ln π(a|s,θ_σ) = ( (a − μ(s,θ))²/σ(s,θ)² − 1 ) · x_σ(s)。</b> <span class='w'><b>这一半的符号由括号里那一项决定，而它恰好以「一个标准差」为界。</b></span><b>实际动作离均值超过一个 σ ⇒ 括号为正 ⇒ 把 σ 推大（该多探索）；落在一个 σ 以内 ⇒ 括号为负 ⇒ 把 σ 推小（可以收紧）。</b><b>⇒ 「该随机多少」不再是一个手设的超参，它被回报自己推着走。</b>", "<b>习题 13.5 把这一套接回了离散的情形，顺带点明一个联系。</b> <b>Bernoulli-logistic 单元</b>：输入特征 x(S_t)，输出 A_t ∈ {0,1}，Pr{A_t = 1} = P_t。假设两个动作的偏好差是输入的加权和，h(s,1,θ) − h(s,0,θ) = θᵀx(s)。<span class='k'><b>(a) 要证的是：用指数 soft-max (13.2) 把偏好转成策略时，P_t = 1/(1 + exp(−θᵀx(S_t)))——也就是<b>逻辑斯谛函数</b>。</b></span><b>⇒ 两动作下的 soft-max 偏好参数化，就是逻辑回归。</b><b>(b) 问 REINFORCE 的更新长什么样，(c) 问资格向量的表达式（提示用 f′(x) = f(x)(1 − f(x))）。</b>"], "eq": "高斯策略的参数化（13.20）：\n\n   θ = [ θ_μ , θ_σ ]ᵀ\n\n   μ(s,θ) ≐ θ_μᵀ x_μ(s)                      ← 线性就行\n   σ(s,θ) ≐ exp( θ_σᵀ x_σ(s) )               ← **必须恒正** ⇒ 线性的**指数**\n\n   x_μ(s) 与 x_σ(s) 是**两个**状态特征向量，不必相同（9.5 节任一构造法）\n\n   exp 同时办成两件事：\n      ① 恒正   值域 (0, ∞)，θ_σ 取什么都不会让 σ ≤ 0\n      ② 无约束 θ_σ 可在整个 R^d 自由移动，不必投影或截断\n         （截断会破坏梯度，违反 13.1 节「∇π 存在且有限」那条）\n\n⭐ 书的收尾：有了这些定义，**本章其余所有算法都可直接用**\n   —— 这正是「资格向量是唯一出现策略参数化的地方」的兑现\n\n资格向量的两半（习题 13.4）：\n\n                           1\n   ∇ln π(a|s,θ_μ) = ───────── ( a − μ(s,θ) ) x_μ(s)\n                      σ(s,θ)²\n      读法：动作比均值大就把均值往大推；1/σ² 调节力度\n            σ 越小，同样的偏差推得越狠\n\n                      ⎛ ( a − μ(s,θ) )²     ⎞\n   ∇ln π(a|s,θ_σ) = ⎜ ───────────────  − 1 ⎟ x_σ(s)\n                      ⎝    σ(s,θ)²          ⎠\n      ⚠ 符号以**一个标准差**为界：\n         离均值超过 1σ → 括号为正 → 把 σ **推大**（该多探索）\n         落在 1σ 以内  → 括号为负 → 把 σ **推小**（可以收紧）\n      ⇒ 「该随机多少」不是手设的超参，是被回报推着走的\n\n习题 13.5（Bernoulli-logistic 单元）：\n   设 h(s,1,θ) − h(s,0,θ) = θᵀx(s)，用 (13.2) 转成策略，则\n   P_t = π(1|S_t,θ_t) = 1 / ( 1 + exp(−θ_tᵀ x(S_t)) )    ← **逻辑斯谛函数**\n   ⇒ **两动作下的 soft-max 偏好参数化，就是逻辑回归**\n   提示：logistic f(x)=1/(1+e^{−x}) 的导数是 f(x)(1 − f(x))", "tbl": {"head": ["", "θ_μ（均值那一半）", "θ_σ（标准差那一半）"], "rows": [["参数化形式", "<b>线性</b> θ_μᵀx_μ(s)", "<b>线性的指数</b> exp(θ_σᵀx_σ(s))"], ["为什么这么写", "没有约束", "<b>必须恒正</b>，且要保持无约束可微"], ["资格向量", "(1/σ²)(a − μ) x_μ(s)", "((a−μ)²/σ² − 1) x_σ(s)"], ["推动的方向", "动作大于均值 → 均值往大推", "<b>偏离超过 1σ → σ 推大；以内 → σ 推小</b>"], ["它在控制什么", "<b>选在哪</b>", "<b>随机多少</b>"], ["⚠ 对可评估性的影响", "无", "<span class='w'>σ → 0 会打破 OPE 的覆盖条件</span>"]]}, "res": {"tag": "推断", "ref": "原书 13.7 节与习题 13.4、13.5（逐式核对）· 简报 §4a deficient support · 简报 §4c「只保留 top k=3~4 作为随机化决策节点」· 简报 §9 动作 2", "v": "<b>习题 13.4 的第二半，给了你一个「自动调随机化强度」的现成机制——而这恰好是你一直只能手设的那个量。</b><br><span class='k'><b>机制：∇ln π(a|s,θ_σ) = ( (a−μ)²/σ² − 1 ) x_σ(s)，符号以「一个标准差」为界。</b></span><b>采到的动作偏离均值超过 1σ 且回报好 → 推大 σ（这片区域值得多看）；偏离在 1σ 以内就能拿到好回报 → 推小 σ（可以收紧）。</b><br><b>映射到你的问题（档位加宽成有序集合之后）：</b><br><b>μ(s,θ) = 「这个 (query, 节点) 上大致该用多强的档位」</b>；<b>σ(s,θ) = 「在这个档位附近该摊开多少」，也就是<b>倾向性的展开度</b>。</b><br>⇒ <b>三条：</b><br>① ⭐ <b>这把简报 §4c 的「只随机化 top k=3~4 个节点，其余钉死」从一个<b>离散的、人工的</b>决定，变成一个<b>连续的、学出来的</b>量。</b><b>钉死 = σ 很小；随机化 = σ 较大。而哪些节点该钉死，由数据决定而不是由敏感度表的截断点决定。</b><span class='w'><b>⚠ 但别急着替换掉敏感度扫描：扫描是第 2 周就能做完的、不需要训练任何策略的东西，而这套要先有一个能跑的策略梯度循环。顺序上扫描仍然在前。</b></span><br>② <b>σ 的下界必须写进方法。</b>上一页已经点出这个张力：13.1 节说策略可以逼近确定性（σ → 0），<b>而 σ → 0 正好打破 OPE 的覆盖条件。</b><b>⇒ 把 (13.20) 改成 σ(s,θ) ≐ σ_min + exp(θ_σᵀx_σ(s))，并在论文里说明 σ_min 是「可评估性的代价」，不是一个调参技巧。这样你就把一个实现细节升级成了一条可辩护的设计约束。</b><br>③ <b>习题 13.5 顺带给了一条可引用的等价性：两动作下的 soft-max 偏好参数化就是逻辑回归。</b><span class='k'><b>你现在的 |M|=2 设定正是这个情形——也就是说，你那个「每节点二选一」的策略，形式上就是一个逻辑回归，而它的 REINFORCE 更新有闭式。</b></span><b>这对审稿人是个好消息：方法不神秘，而且在最简设定下退化成大家都认识的东西。</b>"}},
{"r": [17, 17], "t": "小结：两句话把「基线无偏、critic 有偏」钉死", "star": 3, "quote": "<em>Adding a state-value function as a baseline <b>reduces REINFORCE’s variance without introducing bias</b>. If the state-value function is also used to assess—or criticize—the policy’s action selections, then the value function is called a <b>critic</b> … <b>The critic introduces bias into the actor’s gradient estimates</b>, but is often desirable for the same reason that bootstrapping TD methods are often superior to Monte Carlo methods (substantially reduced variance).</em><br><em>Today they are <b>less well understood in some respects</b>, but a subject of excitement and ongoing research.</em>", "one": "<b>整章的结论压成两句：加基线——降方差、不引入偏差；基线升级成 critic（去评判动作）——降更多方差、但引入偏差。全章的取舍就在这一对句子里。</b>", "pts": ["<b>小结先重申这一章与前十二章的分界。</b> 此前全书聚焦<b>动作值方法</b>——学动作值，再用它们决定动作选择；<span class='k'><b>本章考虑的是学一个参数化策略，使得<b>不查动作值估计</b>就能选动作。</b></span><b>而「策略梯度方法」的定义被再次收紧：每一步都朝着「性能对策略参数的梯度的一个估计」的方向更新策略参数。</b>", "<b>然后把四条好处列齐，而且顺序和 13.1 节不完全一样。</b> ① <b>能学出采取各动作的具体概率</b>；② <b>能学出合适的探索水平，并渐近逼近确定性策略</b>；③ <b>能自然处理连续动作空间</b>；④ <b>在有些问题上策略本身就比值函数更容易参数化表示</b>。<span class='k'><b>⚠ 第 ② 条的前半句「能学出合适的探索水平」直指 13.7 节那个 σ(s,θ)——它不是手设的，是学出来的。</b></span><b>书的评价是：这些事对基于策略的方法都很容易，而对 ε-贪心和一般的动作值方法「要么别扭、要么不可能」。</b>", "<b>理论上的那条好处被单独起了一段，分量最重。</b> <b>「参数化策略方法还有一个相对动作值方法的重要理论优势，形式是策略梯度定理——它给出性能如何受策略参数影响的<b>精确公式</b>，而这个公式<b>不含状态分布的导数</b>。这条定理为<b>所有</b>策略梯度方法提供了理论基础。」</b><span class='w'><b>注意是 exact formula，不是近似；是 all policy gradient methods，不是某一类。</b></span>", "<b>⚠ 接下来两句是整章最该背下来的，因为它们把一对容易混的东西钉死了。</b> <span class='k'><b>第一句：「把一个状态值函数<b>当基线</b>加进来，<b>降低 REINFORCE 的方差而不引入偏差</b>。」</b></span><span class='w'><b>第二句：「如果这个状态值函数<b>也被用来评判——或者说批评——策略的动作选择</b>，那它就叫 critic……<b>critic 会把偏差引入 actor 的梯度估计</b>。」</b></span><b>同一个 v̂，用法不同，偏差性质就不同。界线是「有没有拿它去评判动作」。</b>", "<b>而书为 critic 的偏差给了一个辩护，这个辩护的形式值得学。</b> <b>「但它往往是可取的，理由和<b>自举的 TD 方法常优于蒙特卡洛方法</b>的理由相同（方差大幅下降）。」</b><span class='k'><b>⇒ 这是一个「我知道我引入了偏差，我用一个读者早就接受的类比来说明这笔交易划算」的写法。</b></span><b>⚠ 注意它<b>没有</b>说偏差小或可忽略——它只说这笔交易通常划算。</b><b>（而 13.5 节已经补过一条更硬的：这个偏差<b>不是自举造成的</b>，换蒙特卡洛也去不掉。）</b>", "<b>最后一段的语气值得记一下，它交代了这一章在全书里的成色。</b> <b>「总体上，策略梯度方法提供了一组与动作值方法<b>相当不同</b>的长处与短处。<b>今天它们在某些方面还不够为人所理解</b>，但是一个令人兴奋、仍在推进的研究主题。」</b><span class='w'><b>⚠ 这是一本教科书对自己刚讲完的一章作出的<b>保留</b>，不是客套。</b></span><b>把它和 13.4 节那句「α^θ 怎么设就不清楚了」放在一起看，能听出作者在哪些地方是有把握的、在哪些地方不是。</b>"], "eq": "13.8 小结的四条好处（注意顺序与 13.1 节略有不同）：\n\n   ① 能学出采取各动作的**具体概率**\n   ② 能学出**合适的探索水平**，并渐近逼近确定性策略\n      ⚠ 前半句直指 13.7 的 σ(s,θ) —— 不是手设的，是**学出来**的\n   ③ 能自然处理**连续动作空间**\n   ④ 有些问题上策略本身就比值函数更容易参数化表示\n   ⇒ 这些对 ε-贪心与一般动作值方法「要么别扭、要么不可能」\n\n理论上的那条：\n   策略梯度定理给出**精确公式**（exact formula），**不含状态分布的导数**\n   它为**所有**（all）策略梯度方法提供理论基础\n\n⭐ 全章取舍压成的两句：\n\n   v̂ 当**基线**   →  降方差，**不引入偏差**\n   v̂ 当**critic** →  降更多方差，**引入偏差**\n                      （界线：有没有拿它去**评判动作**）\n\n   书给 critic 偏差的辩护：\n      「理由和**自举的 TD 常优于蒙特卡洛**的理由相同（方差大幅下降）」\n      ⚠ 它**没有**说偏差小或可忽略，只说这笔交易通常划算\n      ⚠ 13.5 节补过更硬的一条：这个偏差**不是自举造成的**，\n         换蒙特卡洛也去不掉\n\n书对本章的保留（原话）：\n   Today they are **less well understood in some respects**,\n   but a subject of excitement and ongoing research.", "tbl": {"head": ["同一个 v̂ 的两种用法", "用在哪", "偏差", "方差"], "rows": [["<b>基线</b>", "转移的第一个状态（动作<b>之前</b>）", "<b>不引入</b>", "降"], ["<b>critic</b>", "也用到第二个状态（动作<b>之后</b>）", "<span class='w'>引入</span>", "<b>降更多</b>"], ["界线是什么", "<b>有没有拿它去评判动作</b>", "—", "—"], ["书的辩护", "—", "<b>类比「TD 常优于蒙特卡洛」</b>", "<span class='k'>没说偏差小，只说交易划算</span>"], ["⚠ 13.5 节补的", "—", "<b>偏差不是自举造成的，换蒙特卡洛去不掉</b>", "—"]]}, "res": {"tag": "已核", "ref": "原书 13.8 小结（逐句核对）· 13.5 节「not due to bootstrapping as such」· 简报 §4e「估计量要拆成两半」", "v": "<b>小结那两句是你拆估计量那一段最省力的引文——它把你要说的话用教科书的措辞说完了。</b><br><span class='k'><b>你要说的是：成本那一半用回归（不引入偏差），准确率那一半用 FQE（引入偏差但降方差）。</b></span><b>而书的原话是：加基线「降低方差而不引入偏差」；用作 critic 则「把偏差引入 actor 的梯度估计，但往往可取，理由和自举的 TD 常优于蒙特卡洛相同」。</b><br>⇒ <b>两条用法：</b><br>① <b>直接把这个句式搬过来写你的方法节。</b><b>「我们的成本模型以基线的方式进入目标（只依赖状态、不参与动作选择），因而不引入偏差；我们的结果模型以 critic 的方式进入（参与配置选择），因而引入偏差，我们接受这笔交易，理由与 TD 优于蒙特卡洛的理由相同。」</b><span class='w'><b>这段话每一句都能指回 Sutton & Barto 13.8 节，审稿人不会要求你另行论证。</b></span><br>② ⚠ <b>但要把书<b>没</b>说的话也说出来，否则就是借势而不是引用。</b><b>书没说偏差小、没说可忽略、也没给量化。而 13.5 节明确补过：这个偏差不是自举造成的，换蒙特卡洛去不掉。</b><b>⇒ 你要补的是书没有的那一块：<b>用 §4d 的穷举 oracle 表去量这个偏差</b>。</b><span class='k'><b>oracle 给真值，FQE 给估计，两者之差就是这条偏差的实测值。</b></span><b>书只能定性地说「交易划算」，你能在自己的问题上报出这笔交易的实际价格——这是一个教科书给不了、而你付得起的结果。</b>"}, "link": {"t": "你学过的对应：CS234 L08 精读（策略梯度 I —— 那一讲的小结可以和这一节对读，两边对「偏差换方差」的措辞不同）", "href": "../../cs234-2019/中文精读/L08-精读.html"}},
{"r": [18, 18], "t": "文献注：一张通往你需要的那几篇的地图", "star": 3, "quote": "<em>The policy gradient theorem here and on page 334 was <b>first obtained by Marbach and Tsitsiklis (1998, 2001)</b> and then <b>independently</b> by Sutton et al. (2000).</em><br><em>Greensmith, Bartlett, and Baxter (2004) analyzed <b>an arguably better baseline</b> (see Dick, 2015). <b>Thomas and Brunskill (2017) argue that an action-dependent baseline can be used without incurring bias.</b></em><br><em>Thomas (2014) <b>first realized</b> that the factor of γ^t … <b>was needed</b> in the case of discounted episodic problems.</em>", "one": "<b>这一页不是凑数的参考文献表，它是一张地图。对你的课题，这里至少有四条线值得顺着走下去，而其中两条正好压在你最缺的地方：离策的策略梯度，和基线的方差分析。</b>", "pts": ["<b>先看历史的形状，它本身是一条可引用的叙事。</b> <b>今天被看作与策略梯度相关的方法，其实是强化学习里<b>最早</b>被研究的一批</b>（Witten 1977；Barto, Sutton & Anderson 1983；Sutton 1984；Williams 1987, 1992；前身领域见 Phansalkar & Thathachar 1995）。<span class='w'><b>「它们在 1990 年代很大程度上被动作值方法取代了」——而本书其余各章正是以后者为中心。</b></span><b>「近年来，注意力又回到了 actor–critic 方法和一般的策略梯度方法上。」</b><b>⇒ 这是一条「钟摆回摆」的叙事，写引言时很好用。</b>", "<b>定理的优先权有一个容易写错的地方，这里说清楚了。</b> <span class='k'><b>策略梯度定理<b>最早</b>由 Marbach & Tsitsiklis（1998, 2001）得到，然后由 Sutton 等（2000）<b>独立</b>得到。</b></span><b>⚠ 只引 Sutton 等 2000 在优先权上是不准确的。</b><b>相近的表达式还有 Cao & Chen（1997）；其他早期结果见 Konda & Tsitsiklis（2000, 2003）、Baxter & Bartlett（2001）、Baxter, Bartlett & Weaver（2001）；另有 Sutton, Singh & McAllester（2000）。</b><b>而「policy gradient methods」这个<b>术语</b>出自 Sutton, McAllester, Singh & Mansour（2000），本章的叙述也主要基于它。综述见 Bhatnagar 等（2009）。</b>", "<b>13.3 条目里有一个关于「all-actions 方法」的小历史，顺带给了它两个现代名字。</b> <b>REINFORCE 出自 Williams（1987, 1992）；Phansalkar & Thathachar（1995）为 REINFORCE 的改版证明了<b>局部与全局</b>收敛定理。</b><span class='k'><b>all-actions 算法最早出现在一篇「未发表但广为流传的未完成论文」（Sutton, Singh & McAllester, 2000）里</b></span>，后由 Ciosek & Whiteson（2017, 2018）发展，称作 <b>expected policy gradients</b>；以及 Asadi, Allen, Roderick, Mohamed, Konidaris & Littman（2017），称作 <b>mean actor critic</b>。<b>⇒ 同一个想法三个名字，检索时要都试。</b>", "<b>⭐ 13.4 条目对你最要紧，它给了基线这条线的三篇。</b> <b>基线出自 Williams（1987, 1992）的原始工作。</b><span class='k'><b>Greensmith, Bartlett & Baxter（2004）分析了一个「可以说更好的基线」（另见 Dick, 2015）。</b></span><span class='w'><b>Thomas & Brunskill（2017）论证：<b>依赖动作的基线也可以不引入偏差</b>。</b></span><b>⇒ 前者是方差分析（「怎样的基线更好」），后者是无偏性边界（「基线能依赖动作到什么程度」）。这两个问题正好是你拆估计量时要回答的两个。</b>", "<b>13.5–6 条目澄清了一个命名，省得你在文献里对不上号。</b> <b>actor–critic 方法同样是最早被研究的一批（Witten 1977；Barto, Sutton & Anderson 1983；Sutton 1984）；本章给出的算法基于 Degris, White & Sutton（2012）。</b><span class='k'><b>⚠ 「actor–critic 方法在文献里有时被称作 <b>advantage actor–critic（“A2C”）</b>。」</b></span><b>⇒ 你在 LLM 相关文献里看到的 A2C / PPO 这一系，根子就在本章这几页。</b>", "<b>最后把 further developments 那一串按「对你有没有用」分一下类，不要平均用力。</b> <span class='w'><b>⭐ 离策策略梯度（Degris, White & Sutton 2012；Maei 2018）——你只有旧日志，这是正面对口的一条。</b></span><b>⭐ 熵正则（Schulman, Chen & Abbeel 2017）——主动奖励随机性，和你需要维持覆盖的处境同向。</b> <b>○ 确定性策略梯度（Silver 等 2014）——方向相反，但审稿人可能拿它问你，要准备答案。</b> <b>○ 自然梯度一系（Amari 1998；Kakade 2002；Peters 等 2005, 2008；Bhatnagar 等 2009；综述见 Grondman 等 2012）——处理参数尺度不良，你的问题规模下多半用不上。</b> <b>⚠ 另外两条小注：最早的相关工作可追到 Aleksandrov, Sysoyev & Shemeneva（1968）；Example 13.1 与本章相关结果是与 Eric Graves 一同做出的；p335 那张图改编自维基百科。</b>"], "eq": "按「对你有没有用」分类的文献地图：\n\n⭐ **正面对口**\n   Degris, White & Sutton 2012 · Maei 2018   **离策策略梯度**\n      → 你只有旧日志；本章 13.5–6 的算法本身就基于前者\n      ⚠ 先确认它对行为策略的覆盖要求 —— 若仍需 π_b > 0，\n        你的确定性日志同样用不了\n   Thomas & Brunskill 2017                   **依赖动作的基线可无偏**\n      → 13.4 节那一行证明只覆盖「不依赖动作」的基线\n      → 作者是 HCOPE / MAGIC 那条线的人，与 bridge-thread 0 同源\n   Greensmith, Bartlett & Baxter 2004（另见 Dick 2015）\n                                             **基线的方差分析**\n      → 「怎样的基线更好」，正是你拆估计量要回答的\n\n⭐ **同向，值得一读**\n   Schulman, Chen & Abbeel 2017              熵正则（主动奖励随机性）\n\n○ **要准备答案，但不必深读**\n   Silver 等 2014                            确定性策略梯度（方向相反）\n\n○ **你的规模下多半用不上**\n   自然梯度一系：Amari 1998 · Kakade 2002 · Peters 等 2005, 2008\n                 Bhatnagar 等 2009（综述 Grondman 等 2012）\n\n优先权要点（容易写错）：\n   定理**最早** Marbach & Tsitsiklis 1998, 2001\n   然后**独立**地 Sutton 等 2000\n   「policy gradient methods」这个**术语** 出自 Sutton, McAllester,\n      Singh & Mansour 2000（本章叙述主要基于它）\n   ⚠ 只引 Sutton 等 2000 在优先权上不准确\n\n同一想法的三个名字（检索时都要试）：\n   all-actions = expected policy gradients（Ciosek & Whiteson 2017, 2018）\n               = mean actor critic（Asadi 等 2017）\n   actor–critic 有时被称作 **advantage actor–critic（A2C）**", "tbl": {"head": ["线索", "文献", "对你的用处"], "rows": [["<b>离策策略梯度</b>", "Degris, White & Sutton 2012 · Maei 2018", "<b>⭐ 你只有旧日志，正面对口</b>"], ["<b>依赖动作的基线</b>", "Thomas & Brunskill 2017", "<b>⭐ 13.4 那一行证明覆盖不到的情形；作者与 OPE 主线同源</b>"], ["<b>基线的方差分析</b>", "Greensmith, Bartlett & Baxter 2004（另见 Dick 2015）", "<b>⭐「怎样的基线更好」</b>"], ["熵正则", "Schulman, Chen & Abbeel 2017", "同向：主动奖励随机性"], ["确定性策略梯度", "Silver 等 2014", "<span class='w'>方向相反，审稿人可能拿它发问</span>"], ["自然梯度", "Amari 1998 · Kakade 2002 · Peters 等 · Bhatnagar 等 2009", "你的规模下多半用不上"], ["<b>那个 γᵗ</b>", "Thomas 2014", "<b>「公开算法藏着系统性错误」的现成例子</b>"]]}, "res": {"tag": "已核", "ref": "原书 p18 文献与历史注（逐条核对）· bridge-threads [0] OPE / batch RL · 简报 §4e · 简报 §6 抢占风险表", "v": "<b>这一页实际上给了你三篇「现在就该去读」的论文，而且它们补的是不同的洞。</b><br><span class='w'><b>① Degris, White & Sutton (2012) — Off-Policy Actor–Critic</b></span><b>：本章 13.5–6 的算法本身就基于它，而它处理的正是「行为策略 ≠ 目标策略」。</b><span class='k'><b>⚠ 读的时候带着一个具体问题：它对行为策略的覆盖要求是什么？如果仍然需要 π_b(a|h) > 0，那么你的确定性日志同样用不了，问题回到「必须先随机化」，而不是「换个估计量就行」。</b></span><b>这个问题的答案直接决定你第 1–2 周的优先级。</b><br><span class='w'><b>② Greensmith, Bartlett & Baxter (2004) — 基线的方差分析（另见 Dick 2015）</b></span><b>：这是本章唯一一条通往「怎样的基线更好」的线索。</b><b>13.4 节只证了「任何不依赖动作的基线都无偏」，<b>没有</b>说哪个更好；而你要选的恰恰是「哪个」——per-query 平均？拟合的 v̂？还是别的。</b><span class='k'><b>这篇是把那个选择从直觉变成分析的入口。</b></span><br><span class='w'><b>③ Thomas & Brunskill (2017) — 依赖动作的基线可无偏</b></span><b>：如果你想让基线看到「该节点选了哪个档位」，这是唯一能引的东西。</b><b>⚠ 而且这条还有一层战略意义：Philip Thomas 同时是 HCOPE / MAGIC 的作者，也就是 bridge-thread 0 的核心人物。</b><b>⇒ 在相关工作里点明「基线理论与高置信离策评估出自同一条线」，能让你的「拆成两半分别估计」看起来像是沿着一条已有的脉络往前走，而不是为了方便硬拆。</b><br><b>⚠ 最后一条提醒，关于<b>不</b>该花时间的地方：</b><b>自然梯度那一串（Amari / Kakade / Peters / Bhatnagar）在你的问题规模下多半用不上</b>——它治的是参数尺度不良导致的病态曲率，<b>而你的策略参数维度低、动作集小，瓶颈在数据不在优化。</b><b>简报 §6 的抢占风险表已经列了六篇必须读的，时间该花在那边。</b>"}}
];

var TH = {"title": "第 13 章接上课题的哪一段：一条消去定理、一个零偏差恒等式，和一个被写进前提的随机化", "arc": "<b>这一章给课题的东西有三件，而且三件都偏「论证」而非「算法」——因为你的问题很可能根本不是 MDP（简报 §5），本章的算法未必用得上，但它的论证全都用得上。</b><br><br><b>① 一条消去定理，正面回答你标成「开放问题」的那条结构性难题。</b> <span class='k'>简报 §8 最后一条写着：<i>节点 h 的决策改变 h+1 的输入分布，<b>后续节点不可交换</b></i>。</span>这正是本章 13.2 节开篇那个困境的你那个版本——性能同时取决于动作选择<b>和状态分布</b>，而「策略怎么改变状态分布」是环境的性质、通常未知。<span class='w'><b>策略梯度定理的回答不是「我们能估计那个未知量」，而是「你根本不需要它」</b></span>：∇J(θ) ∝ Σ_s μ(s) Σ_a q_π(s,a) ∇π(a|s,θ)，<b>式子里不含状态分布的导数</b>。原因在证明里看得一清二楚：<b>∇ 从头到尾只落在 π 上，从不落在转移核 p 上</b>（p 是环境的，不依赖 θ），<b>状态分布是被「收集」出来的，不是被「求导」出来的</b>。<b>⚠ 但这条好消息有一道很硬的边界，见下面第一条坑：它救的是「优化」，不是「评估」。</b><br><br><b>② 一个零偏差恒等式，是你把 G 拆成两半的形式许可证。</b> 13.4 节证明基线 b(s) 不改变梯度的期望，理由只有一行：<span class='k'><b>Σ_a b(s)∇π(a|s,θ) = b(s)∇Σ_a π(a|s,θ) = b(s)∇1 = 0</b></span>——只要 b 不随 a 变化，减掉它就是减掉零。<b>而简报 §4e 的做法正是「成本那一半直接回归、完全不用重要性权重」</b>。<b>这条恒等式告诉你：减掉一个学到的、只依赖状态的函数，是一次无偏的方差缩减，不是一个近似。</b><span class='w'><b>⚠ 而且 p18 文献注里藏着一条对你格外要紧的引文：Thomas and Brunskill (2017) 论证「依赖动作的基线也可以不引入偏差」</b></span>——Philip Thomas 正是高置信离策评估（HCOPE / MAGIC）那条线的作者，<b>也就是你 bridge-thread 0 的核心人物。基线这一节和你的 OPE 主线是同一批人的工作。</b><br><br><b>③ 「策略永远不许变成确定性的」被写成了方法的前提，而不是补丁。</b> 13.1 节把 π(a|s,θ) ∈ (0,1) 和「可微」并列，写成对策略参数化的第二条硬要求，理由只给了三个字：to ensure exploration。<span class='k'><b>对你而言这改变的是写法：随机化不再是「为了迁就 OPE 估计量而付的代价」，而是「策略梯度类方法对策略的标准要求」。</b></span><b>Example 13.1 还把这条推得更远：在函数逼近把状态混叠之后，最优策略<b>本来就是随机的</b>（最优向右概率 0.59，值 −11.6；而两个 ε-贪心策略只有 −44 与 −82）。随机性补偿的是<b>表示</b>的不足，不是环境的随机。</b><br><br><b>⚠ 最后是一条分叉路标，它决定你该怎么读这一章。</b> 第 1 页的脚注 1 说：<i>第 2.8 节的梯度老虎机，就是本章在<b>单状态</b>时的特例，步骤几乎逐条对应</i>。<span class='w'><b>如果简报 §5 的可加性检验通过（Σ_h Δ_h^down 与 Acc(全强) − Acc(全弱) 在置信区间内一致），你的问题在实质上就不是 MDP，而是一组每节点代价敏感选择——也就是脚注 1 说的那个单状态特例。</b></span><b>那时本章的价值变成「借它的论证，不借它的算法」：13.1 的四条好处、13.2 的定理精神、13.4 的基线恒等式，在单状态下全都成立，而且更干净。</b><b>反之，若可加性不成立，13.5 的在线增量形式与 13.6 的持续情形都直接可用。本章把两边的工具都备齐了，所以读它不会押错注。</b>", "pitfalls": [{"v": "<b>把策略梯度定理当成「离策评估的许可证」。</b> <span class='w'><b>定理救的是优化，不是评估。</b></span>它告诉你梯度长什么样，<b>没有</b>告诉你怎么在不重跑的情况下估一个新策略的值——简报 §4a 那个 deficient support 的死结<b>一个字都没松动</b>。<b>而且它是<b>在策</b>的结论：Σ_s μ(s) 里的 μ 必须是 π 下的同策分布，一旦 π_e ≠ π_b 就不是你能采到的那个。</b><span class='k'><b>要在旧日志上做，需要离策的策略梯度：Degris, White & Sutton (2012)、Maei (2018)（本章 p18 文献注点名）。这两篇正好在你「只有旧数据」的处境上，值得去查。</b></span>", "tag": "推断", "ref": "原书 13.2 节与 p325 证明方框（逐步核对渲染图）· p18 文献注（已核）· 简报 §4a"}, {"v": "<b>把 actor–critic 的偏差归咎于自举。</b> <span class='w'><b>书明确堵了这个说法：<i>the bias in the gradient estimate is <b>not due to bootstrapping as such</b>; the actor would be biased <b>even if the critic was learned by a Monte Carlo method</b></i>。</b></span><b>偏差的来源是「用一个<b>学到的</b>值函数去评判动作」这件事本身，而不是「用自举去学它」。</b><span class='k'><b>对你的直接后果：你的 Q̂ / FQE 即使改成纯蒙特卡洛拟合，拿它去挑配置仍然是有偏的——这个偏差不会因为换掉自举而消失。</b></span><b>写作时别把它说成「我们用蒙特卡洛所以无偏」，那会被懂行的审稿人当场抓住。</b>", "tag": "已核", "ref": "原书 13.5 节（逐句核对，原文见本条引述）"}, {"v": "<b>把「策略比值函数更简单」当成无条件的好处。</b> 书对这条是<b>明确加了条件</b>的：<i>For some, the action-value function is simpler and thus easier to approximate. <b>For others</b>, the policy is simpler.</i><span class='w'><b>⚠ 而你的情形很可能恰恰在「值函数那一边更简单」：简报 §4e 说成本回归预期 R² > 0.95。</b></span><b>所以不要写成「策略方法一律更好」——那条在本章里就不成立，而且会削弱你真正该用的那条（第四条好处：参数化是注入先验的入口，书说这「常常是用策略方法最重要的理由」）。</b>", "tag": "已核", "ref": "原书 13.1 节末（逐句核对）· 简报 §4e"}, {"v": "<b>拿基线恒等式去正当化一个<b>依赖动作</b>的基线。</b> <span class='k'><b>恒等式 Σ_a b(s)∇π = b(s)∇1 = 0 的成立前提是「b 不随 a 变化」</b></span>——书写得很清楚：<i>as long as it does not vary with a</i>。<b>一旦你的基线里混进了「这个节点选了哪个档位」，这条一行证明立刻失效。</b><span class='w'><b>⚠ 但也别反过来断言「依赖动作的基线一定有偏」：Thomas and Brunskill (2017) 恰恰论证了它可以无偏。</b></span><b>这是一条独立的、不平凡的结果，要用就引它，不能靠这一行恒等式推出来。</b>", "tag": "已核", "ref": "原书 13.4 节与 p18 文献注 13.4 条（逐句核对）"}, {"v": "<b>把 Example 13.1 那个四倍差距当成一般现象。</b> <span class='w'><b>那个走廊是被<b>刻意设计</b>成「中间状态的两个动作被调换」才造出这么大差距的。</b></span><b>节点保真度选择未必有这种对抗结构——你算出来的「最优随机策略 vs 最优确定性策略」差值很可能很小甚至为零。</b><span class='k'><b>而差值小本身也是结论</b></span>：它说明 P2 表示没有严重混叠、确定性策略够用，<b>顺带支持了可加性那一侧</b>。<b>⚠ 好在你能精确算出这个差值——§4d 的穷举 oracle 表直接支持它，而书只能在一个三状态玩具上展示这件事。</b>", "tag": "推断", "ref": "原书 Example 13.1（三个数逐字核对）· 简报 §4d 穷举 oracle · 简报 §5 P2/P3 消融"}, {"v": "<b>照搬 REINFORCE 却忘了它要等一整幕走完。</b> <b>REINFORCE 用的是<b>完整回报</b> G_t，所以它是蒙特卡洛方法，<i>well defined only for the episodic case with all updates made in retrospect after the episode is completed</i>。</b><span class='k'><b>你的管道恰好是终局奖励、天然分幕，这一点是对上的。</b></span><span class='w'><b>但书同时说它 may be of high variance and thus produce slow learning</b></span>——<b>而你每一「幕」是一次真实的多节点 LLM 调用，贵得多。在样本昂贵的场景里，高方差不是「慢一点」，是「做不起」。</b>", "tag": "推断", "ref": "原书 13.3 与 13.4 节（逐句核对）· 简报 §4b ESS 推导"}, {"v": "<b>以为伪代码里那个 γᵗ 是笔误。</b> 本章正文一律假设<b>不打折（γ = 1）</b>，只有方框里的伪代码给一般的打折版本，所以更新式里会多出一个 γᵗ。<span class='k'><b>⚠ 这个因子还有一段历史：p18 文献注说 <b>Thomas (2014) 才首次意识到</b>打折分幕问题下需要它。</b></span><b>也就是说这条教科书算法在被广泛使用多年之后才被补上这一项——这是「公开的、被反复复现的算法里仍可能藏着系统性错误」的一个现成例子，写到「为什么我们要自己重跑基线」那一段时可以引。</b>", "tag": "已核", "ref": "原书 13.3 节方框后注与 p18 文献注（逐句核对）"}], "ammo": [{"q": "你给节点选择加了随机化，这不是故意让系统变差吗？", "a": "<b>两条答案，第二条比第一条好用。</b><br><b>① 工具性的：</b>没有随机化，离策评估的估计量<b>不存在</b>（不是方差大，是无定义）——确定性日志下 π_b(a|h) ∈ {0,1}，凡候选策略与已跑配置不同的节点权重恒为 0，<span class='k'>这就是 deficient support，加再多数据也不会好转。</span><br><b>② 原理性的：</b><b>Sutton & Barto 13.1 节把「策略永远不许变成确定性的」写成了对策略参数化的<b>硬要求</b>，和「可微」并列</b>，理由是 to ensure exploration。<span class='w'><b>也就是说：一个处处确定的「策略」根本不在策略梯度方法考虑的策略类里。</b></span><b>随机化不是我们为了迁就估计量而付的代价，它本来就是这类方法的一部分。</b><br><b>③ 而且在我们的表示下，最优策略可能<b>本来就是随机的</b>。</b>Example 13.1 展示：当函数逼近把若干状态混叠成同一个输入时，最优随机策略的值是 −11.6，而任何确定性（ε-贪心）策略只有 −44 或 −82。<b>我们的 P2 表示（只看 query 与节点 id）正可能有同样的混叠，而这个差距我们能用穷举 oracle 表精确算出来。</b>"}, {"q": "你凭什么把准确率和成本拆成两半分别估计？这看起来像是为了好看硬拆的。", "a": "<b>因为减掉一个只依赖状态的函数是<b>零偏差</b>的，这有一行证明。</b> <span class='k'><b>Sutton & Barto 13.4 节：Σ_a b(s)∇π(a|s,θ) = b(s)∇Σ_a π(a|s,θ) = b(s)∇1 = 0</b></span>——只要基线 b 不随动作 a 变化，减掉它就是减掉零，<b>梯度的期望一个字不变，但方差可以大幅下降</b>。<br><b>我们的成本那一半正好满足这个条件</b>：给定保真度与输入长度，token 成本近乎确定，可以直接回归（R² > 0.95），<b>完全不用重要性权重</b>。<b>所以这不是「硬拆」，是教科书里那条标准的、无偏的方差缩减，只不过我们把它用在了一个它本来就该用的地方。</b><br><span class='w'><b>⚠ 我们也明确不主张什么：</b></span>如果基线里混进了「该节点选了哪个档位」，上面那一行证明就失效。<b>依赖动作的基线能否无偏是另一个问题，有 Thomas and Brunskill (2017) 的结果，我们没有依赖它。</b>"}, {"q": "上游节点的决策会改变下游节点看到的输入分布。你的梯度估计在这种情况下还成立吗？", "a": "<b>成立，而且这正是策略梯度定理要解决的问题。</b> 定理给出 ∇J(θ) ∝ Σ_s μ(s) Σ_a q_π(s,a) ∇π(a|s,θ)，<span class='k'><b>右边<b>不含状态分布的导数</b></b></span>——证明里 ∇ 只落在 π 上，从不落在转移核上（转移核不依赖策略参数），<b>状态分布是从展开项里收集出来的，不是求导出来的</b>。<b>所以「上游改变下游输入分布」只影响 μ 是什么，不影响公式的形式。</b><br><span class='w'><b>⚠ 但我们要把两件事分开说清楚，因为它们的难度不一样：</b></span><b>梯度那一侧</b>由定理解决；<b>分布无关风险控制那一侧没有</b>——Learn-then-Test / conformal risk control 要求校准点与测试点可交换，而节点 h 的决策改变 h+1 的输入分布，<b>后续节点确实不可交换</b>。<b>这一条我们列为公开的局限，不假装它被定理顺带解决了。</b>"}, {"q": "你用的是已有的日志，而策略梯度定理是在策的结论。这不是自相矛盾吗？", "a": "<b>不矛盾，但你指出的边界是对的，我们明确承认它。</b> <b>定理里的 μ 必须是目标策略 π 下的同策分布</b>，<span class='w'><b>一旦 π_e ≠ π_b，我们采不到那个 μ。</b></span><br><b>我们的做法分三段，而不是硬把在策结论套在离策数据上：</b><br><b>① 不需要随机化就能做的先做</b>：拟合成本模型与结果模型 Q̂、已跑配置的在策蒙特卡洛值（Pareto 前沿上白送的两个点）、节点级特征工程。<br><b>② 先降有效时域，再谈估计量</b>：一步偏离敏感度扫描选出 top k=3~4 个决策节点，其余按扫描结果钉死，ESS 从 n·2⁻¹⁰ 提到 n·2⁻⁴。<span class='k'><b>而「把节点敏感度先验钉进策略参数化」正是 13.1 节说的「用策略方法最重要的理由」。</b></span><br><b>③ 在我们付得起的规模上，直接用穷举 oracle 表当 ground truth</b>，而不是在一个估计量上堆假设。<b>若要真正做离策的策略梯度，现成的工作是 Degris, White & Sutton (2012) 与 Maei (2018)。</b>"}, {"q": "既然你说问题可能不是 MDP，那读策略梯度这一章有什么意义？", "a": "<b>因为这一章自己给了那条分叉路标。</b> <span class='k'><b>本章第 1 页的脚注 1：第 2.8 节的梯度老虎机，就是本章在<b>单状态</b>时的特例，<i>goes through many of the same steps</i>。</b></span><br><b>如果可加性检验通过</b>——Σ_h Δ_h^down 与 Acc(全强) − Acc(全弱) 在置信区间内一致——<b>那么诚实的形式化就是每节点代价敏感选择，而本章的论证在单状态下<b>全部成立且更干净</b>：四条好处、定理的精神、基线恒等式，一条都不用改。</b><br><b>如果不通过</b>，序贯结构是真的，本章的在线增量形式（13.5）与持续情形（13.6）直接可用。<br><span class='w'><b>关键是顺序：实验先行、形式化后定。</b></span><b>MDP 框架必须被实验挣得，不能预设——加了记号没加预测力，正是审稿人对「NLP 论文进口 RL 形式化」最常见的批评。</b>"}], "papers": [{"t": "Sutton, McAllester, Singh & Mansour — Policy Gradient Methods for RL with Function Approximation", "id": "2000（本章的叙述主要基于这篇；“policy gradient methods” 这个词就出自它）", "why": "<b>要引「策略梯度定理」时引它，这是本章自己给的出处。</b> <span class='k'>书原话：<i>Our presentation in this chapter is based primarily on that by Sutton, McAllester, Singh, and Mansour (2000), who introduced the term “policy gradient methods.”</i></span><b>⚠ 但定理本身更早：见下一条。</b>"}, {"t": "Marbach & Tsitsiklis", "id": "1998, 2001（本章 13.2 的文献注；Sutton 等 2000 是独立地得到同一结果）", "why": "<b>策略梯度定理<b>最早</b>的出处。</b> 书写得很明确：<i>The policy gradient theorem here and on page 334 was <b>first obtained by Marbach and Tsitsiklis (1998, 2001)</b> and then <b>independently</b> by Sutton et al. (2000).</i> <span class='w'><b>⚠ 只引 Sutton 等 2000 在优先权上是不准确的；两篇都引才稳妥。</b></span>类似的表达式还有 Cao & Chen (1997)，其他早期结果见 Konda & Tsitsiklis (2000, 2003)、Baxter & Bartlett (2001)。"}, {"t": "Thomas & Brunskill — 依赖动作的基线可以不引入偏差", "id": "2017（本章 p18 文献注 13.4 条点名）", "why": "⭐ <b>这一条对你格外要紧，理由有两层。</b><br><span class='k'><b>第一层（技术）：13.4 节那条一行证明要求基线「不随动作变化」；而这篇论证了依赖动作的基线<b>也能</b>无偏。</b></span><b>如果你想让基线看到「该节点选了哪个档位」，这是你唯一能引的东西，不能靠那一行恒等式推。</b><br><span class='w'><b>第二层（战略）：Philip Thomas 正是高置信离策评估（HCOPE）与 MAGIC 的作者，也就是你 bridge-thread 0 的核心人物。</b></span><b>基线这一节和你的 OPE 主线是同一批人的工作——这条交叉值得在相关工作里点明。</b>"}, {"t": "Degris, White & Sutton — Off-Policy Actor–Critic · Maei", "id": "2012 / 2018（本章 p18 文献注「off-policy policy-gradient methods」）", "why": "⭐ <b>你处境的正面对口：只有旧日志，而策略梯度定理是在策的。</b> <span class='k'><b>本章 13.5–13.6 节的算法本身就是基于 Degris, White & Sutton (2012) 的工作。</b></span><b>⚠ 但要先读清楚它们对行为策略的要求——若仍需 π_b(a|h) > 0 的覆盖条件，那么你的确定性日志同样用不了，问题回到「必须先随机化」，而不是「换个估计量就行」。</b>"}, {"t": "Williams — REINFORCE 与基线", "id": "1987, 1992（本章 13.3 与 13.4 的出处）", "why": "<b>REINFORCE 与基线两件事都出自这里。</b> 书在 13.4 文献注写：<i>The baseline was introduced in Williams’s (1987, 1992) original work.</i> <span class='k'><b>Williams (1987, 1992) 也是最早展示「如何这样处理连续动作」的（13.7 节文献注）。</b></span><b>要引「用一个与动作无关的基线做无偏方差缩减」这个做法本身时引它。</b> ⚠ Phansalkar & Thathachar (1995) 为 REINFORCE 的改版证明了局部与全局收敛定理。"}, {"t": "Thomas — 打折分幕问题里那个被漏了多年的 γᵗ", "id": "2014（本章 p18 文献注）", "why": "<b>一个现成的、可引用的「公开算法里藏着系统性错误」的例子。</b> <span class='k'>书原话：<i>Thomas (2014) <b>first realized</b> that the factor of γᵗ, as specified in the boxed algorithms of this chapter, was <b>needed</b> in the case of discounted episodic problems.</i></span><b>这条算法被广泛使用多年之后才被补上这一项。</b><b>写到「为什么我们坚持自己重跑基线而不照抄报告数字」那一段时，这是一个很有说服力的脚注。</b>"}, {"t": "Şimşek, Algórta & Kothiyal — 俄罗斯方块上策略方法胜出", "id": "2016（本章 13.1 节点名）", "why": "<b>「策略有时比值函数更简单」这条好处的<b>唯一</b>实证引文。</b> <span class='w'><b>⚠ 引用时务必带上书给的限定：<i>For some, the action-value function is simpler … For others, the policy is simpler.</i></b></span><b>你的成本那一半恰恰可能在「值函数更简单」那一侧（R² > 0.95），所以这条不能当成支持你全局选择的论据，只能当成「视问题而定」的例证。</b>"}, {"t": "Silver et al. — 确定性策略梯度 · Schulman, Chen & Abbeel — 熵正则", "id": "2014 / 2017（本章 p18 文献注「further developments」）", "why": "<b>两个方向都和你的随机化论证直接相关，而且方向相反，值得对读。</b> <span class='k'><b>确定性策略梯度</b>说明「策略必须随机」并非不可绕过的铁律，审稿人可能拿它来问你；</span><span class='w'><b>熵正则</b>则是反过来，<b>主动</b>给随机性加奖励。</span><b>你的处境更接近后者：随机化同时服务于探索与可评估性。但要准备好回答「为什么不用确定性策略梯度」——答案多半是「它仍然需要一个随机的行为策略来采数据」。</b>"}]};

(function(){
  var PDF="../chapters/ch13.pdf", MAX=20;
  var frame=document.getElementById("pdf"), card=document.getElementById("card"),
      pnum=document.getElementById("pnum"), strip=document.getElementById("strip"),
      right=document.getElementById("right");
  var cur=0, map={}, cells=[];
  /* 科研格出处档位 → 类名。三档与 research/00-BRIEFING 的原始标注一致。 */
  var RESC={"已核":"t1","推断":"t2","待核":"t3"};

  /* 存档键带课程前缀 —— file:// 下所有本地页面共用一个 origin，
     两门课都用 "l01quiz" 会互相覆盖。 */
  var KEY = document.body.dataset.key;
  try {                       // 一次性迁移：早期版本用的是不带课程前缀的键
    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("c13quiz");
      if(_old){
        localStorage.setItem(KEY+"quiz", _old);
        var _p = localStorage.getItem("c13p");
        if(_p) localStorage.setItem(KEY+"p", _p);
      }
      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，
         用户「清空全部记录」之后下次打开又被复活一遍。 */
      localStorage.removeItem("c13quiz");
      localStorage.removeItem("c13p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=PDF+"?p="+p+"#page="+p+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
