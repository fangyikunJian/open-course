<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB 第 13 章 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="suttonbarto-c13">

<div id="bar">
  <h1>SB 第 13 章 · <span>策略梯度方法</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 20</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../chapters/ch13.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>sutton-barto</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/C13-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "这一章和前十二章最根本的区别是什么？", "o": ["策略有自己的参数 θ，选动作时不必查任何值函数；前十二章的策略「离开动作值估计就根本不存在」", "用了神经网络而不是表格", "只处理连续动作空间", "不再需要马尔可夫假设"], "a": 0, "why": "原文：their policies would not even exist without the action-value estimates。<span class='k'>值函数在本章没有被废掉，而是被降级成「可选的配角」——可以用来帮着学 θ，但不参与选动作。</span>"}, {"q": "书把「策略梯度方法」和「actor–critic 方法」怎么区分？", "o": ["凡是照 (13.1) 走的都叫策略梯度方法，不论学不学值函数；同时学策略与值函数的叫 actor–critic", "策略梯度方法只能处理分幕任务", "策略梯度方法用蒙特卡洛，actor–critic 用时序差分", "两者是同义词"], "a": 0, "why": "原文：All methods that follow this general schema we call policy gradient methods, whether or not they also learn an approximate value function。<span class='w'>⚠ 但 13.5 节会把 actor–critic 的定义收紧：只拿值函数当基线不算，必须用它去评判动作（即自举）才算。</span>"}, {"q": "第 1 页脚注提到的「唯一的例外」是什么？它为什么重要？", "o": ["第 2.8 节的梯度老虎机——它就是本章在「只有一个状态」时的特例，步骤几乎逐条对应", "第 12 章的资格迹", "第 10.3 节的平均奖励", "第 16 章的 AlphaGo"], "a": 0, "why": "原文：that section goes through many of the same steps, in the single-state bandit case, as we go through here for full MDPs。<span class='k'>作者建议先复习 2.8 节再读本章。</span>"}],
2: [{"q": "13.1 节对策略参数化提了两条要求，第二条常被当成细节读过去。它是什么？", "o": ["动作空间必须有限", "参数必须初始化为零", "必须用 soft-max 而不是别的分布", "策略永远不许变成确定性的，即 π(a|s,θ) 必须严格落在 (0,1) 里"], "a": 3, "why": "原文：In practice, to ensure exploration we generally require that the policy never becomes deterministic。<span class='w'>注意措辞是 we generally require——这是对方法的要求，和「可微」并列，不是事后补的探索补丁。</span>"}, {"q": "书为什么说「对动作值做 soft-max」不能逼近确定性策略？", "o": ["因为 soft-max 在数值上不稳定", "因为那样会破坏马尔可夫性", "因为动作值方法不可微", "因为动作值会收敛到各自的真值、彼此相差有限，于是概率停在某组非 0/1 的定数"], "a": 3, "why": "偏好则不同：它不收敛到任何特定数值，而是被推着去产生最优的随机策略；<span class='k'>若最优策略恰好是确定性的，最优动作的偏好会被推到无穷高于其余动作。</span>"}, {"q": "书对「soft-max 加温度退火」这条路是什么态度？", "o": ["理论上可行，但实践中很难选下降日程甚至初始温度，除非先验知识比你愿意假设的还多", "推荐，这是标准做法", "书里没有提到这条路", "完全不可行，温度参数不可微"], "a": 0, "why": "这是一条很实在的工程判断：把「该多确定」交给参数自己学，比交给一个人工日程表要稳。"}],
3: [{"q": "Example 13.1 的短走廊里，真正让问题变难的是什么？", "o": ["第二个状态里两个动作被调换了", "三个状态在函数逼近下长得完全一样——特征里没有「我在第几个状态」的信息", "奖励是每步 −1 而不是终局奖励", "状态数太多，表格放不下"], "a": 1, "why": "原文：The problem is difficult because all the states appear identical under the function approximation。特征被定成 x(s,right)=[1,0]ᵀ、x(s,left)=[0,1]ᵀ，<span class='k'>对所有 s 都一样。动作调换只是制造差距的手段，混叠才是病根。</span>"}, {"q": "短走廊里那三个数分别是多少？", "o": ["三个策略的值分别是 −20、−40、−60", "两个 ε-贪心策略分别低于 −44 与 −82；最优随机策略的向右概率约 0.59、值约 −11.6", "两个 ε-贪心策略分别是 −11.6 与 −44；最优值是 −82", "书里只给了定性比较，没有给数"], "a": 1, "why": "ε = 0.1。<span class='w'>差距接近四倍，而且差距的来源是「表达不出来」而不是「探索不够」——动作值方法的策略类里压根没有「以 0.59 的概率向右」这个元素。</span>"}, {"q": "这个例子里，最优策略之所以是随机的，根本原因是什么？", "o": ["环境的转移是随机的", "表示不够——状态被混叠了，随机性在补偿表示的不足", "奖励里有噪声", "ε-贪心必须保留探索"], "a": 1, "why": "<span class='k'>这条因果方向很重要：走廊的转移是确定的。</span>它意味着——如果你的策略只能看到部分信息，那么「最优策略是随机的」就不是一个需要辩护的设计选择，而是一个数学事实。"}],
4: [{"q": "书把 13.1 节的四条好处里哪一条抬得最高？", "o": ["策略参数化是注入先验知识的入口——书说这「常常是用策略方法最重要的理由」", "策略可能比动作值函数更简单", "能逼近确定性策略", "能学出任意概率"], "a": 0, "why": "原文：This is often the most important reason for using a policy-based learning method。<span class='k'>它压在 13.1 节最后，是作者对四条好处的排序表态。</span>"}, {"q": "「策略可能比动作值函数更简单」这条好处，书是怎么限定的？", "o": ["有条件——书明说「对有些问题，动作值函数更简单」；策略更简单时才学得更快、渐近更好", "无条件成立，策略方法总是更简单", "只在表格情形下成立", "只在连续动作空间里成立"], "a": 0, "why": "书给的实证是俄罗斯方块（Şimşek, Algórta, and Kothiyal, 2016）。<span class='w'>⚠ 不要把这条读成「策略方法一律更好」，那在本章里就不成立。</span>"}, {"q": "13.2 节开篇抛出的难处是什么？", "o": ["值函数的逼近误差无法控制", "性能同时取决于动作选择和状态分布，而「策略怎么影响状态分布」是环境的函数、通常未知", "动作空间太大，无法枚举", "梯度可能发散"], "a": 1, "why": "给定状态，θ 怎么影响动作进而影响奖励，可以从参数化直接算；<span class='w'>但 θ 怎么影响「你会遇到哪些状态」，算不了。</span>下一页的定理就是对这句反问的回答。"}],
5: [{"q": "策略梯度定理最要紧的性质是什么？", "o": ["它保证收敛到全局最优", "它不需要知道动作值 q_π", "它给出的梯度表达式里不含状态分布的导数", "它只在表格情形下成立"], "a": 2, "why": "原文：… that does not involve the derivative of the state distribution。<span class='k'>定理的回答不是「我们有办法估计那个未知量」，而是「你根本不需要它」——这是一个消去，不是一个近似。</span>"}, {"q": "证明里为什么状态分布的导数始终不出现？", "o": ["因为先对状态分布做了一阶近似", "因为假设了状态分布与 θ 无关", "因为用了重要性采样把它消掉了", "因为 ∇ 在整个推导里只落在 π 上；转移核 p 不依赖 θ，∇ 直接穿过它"], "a": 3, "why": "状态分布是从展开项里「收集」出来的，不是从「求导」里长出来的。<span class='k'>Pr(s→x,k,π) 是数出来的概率，η(s) 是期望停留步数，μ 是 η 归一化的结果。</span>"}, {"q": "(13.5) 里的「∝」，比例常数是什么？", "o": ["总是 1", "状态空间的大小 |S|", "分幕情形是一幕的平均长度，持续情形是 1（于是关系是等式）", "折扣因子 γ"], "a": 2, "why": "这个常数就是证明最后提出来的那个公因子 Σ_{s′}η(s′)。<span class='k'>而且只需成正比就够了——任何比例常数都能被吸收进步长 α，而 α 本来就是任选的。</span>"}, {"q": "这条定理对「用旧日志评估新策略」有没有直接帮助？", "o": ["有，只要把 μ 换成行为策略的分布即可", "有，它正好给出了离策评估的无偏估计量", "没有，因为它只在持续情形下成立", "没有——它救的是「优化」不是「评估」，而且定理是在策的结论，μ 必须是 π 下的同策分布"], "a": 3, "why": "<span class='w'>一旦 π_e ≠ π_b，Σ_s μ(s) 里的 μ 就不是你能采到的那个。</span>需要离策的策略梯度——见本章 p18 文献注：Degris, White, and Sutton (2012)；Maei (2018)。"}],
7: [{"q": "REINFORCE 推导里「乘一个 π 再除一个 π」这一步是为了什么？", "o": ["为了让对动作的求和变成「在 π 下的期望」，这样才能用样本替掉它；等式本身一个字没变", "为了让梯度有界", "为了把折扣因子引进来", "为了降低方差"], "a": 0, "why": "(13.6) 已经把对状态的求和变成了期望，但对动作的求和还缺 π(a|S_t,θ) 这个权重。<span class='k'>补上之后再把 a 换成样本 A_t ∼ π，最后用 E_π[G_t|S_t,A_t] = q_π(S_t,A_t) 把 q_π 换成 G_t。</span>"}, {"q": "(13.8) 里除以 π(A_t|S_t,θ_t) 这个分母，书给的理由是什么？", "o": ["为了抵消折扣因子", "为了保证概率和为 1", "不除的话被选得频繁的动作就占便宜——更新更常朝它们的方向走，可能胜出哪怕回报不是最高", "为了数值稳定"], "a": 2, "why": "<span class='w'>这个因子本质上是一个重要性权重：把「被采到的频率」除掉，只留「它值多少」。</span>差别在于 REINFORCE 是在策的，分子分母同一个 π，所以比值不会爆炸。"}, {"q": "为什么说 REINFORCE 只对分幕情形有定义？", "o": ["因为策略必须是 soft-max", "因为折扣因子必须小于 1", "因为它用完整回报 G_t，必须等一幕走完才能算，所有更新都是回过头做的", "因为状态空间必须有限"], "a": 2, "why": "原文：well defined only for the episodic case with all updates made in retrospect after the episode is completed。<span class='k'>这不是实现上的不便，是定义上的限制。</span>"}],
8: [{"q": "资格向量 ∇ln π(A_t|S_t,θ_t) 有什么特别之处？", "o": ["它总是单位长度", "它只在线性参数化下存在", "它是整个算法里唯一出现策略参数化的地方——换参数化只改它，其余不动", "它不依赖于实际采取的动作"], "a": 2, "why": "和 (13.8) 里的 ∇π/π 等价，依据是 ∇ln x = ∇x/x。<span class='k'>13.7 节处理连续动作时正是只改这一个向量。</span>"}, {"q": "伪代码里那个 γᵗ 因子是怎么回事？", "o": ["是笔误，正确的算法里没有", "正文假设 γ=1 不打折，而方框给的是一般的打折版本，所以多这一项", "是为了数值稳定加的", "是资格迹的衰减率"], "a": 1, "why": "<span class='w'>p18 文献注：Thomas (2014) 才首次意识到打折分幕问题下这一项是必需的。</span>REINFORCE 本身出自 Williams 1987/1992——中间隔了二十多年。"}, {"q": "图 13.1 的说明里，书用了什么条件句？", "o": ["只要状态空间足够小", "只要幕数足够多，总能收敛", "「步长选得好时」每幕总奖励趋近起始状态的最优值", "只要折扣因子接近 1"], "a": 2, "why": "原文 With a good step size。<span class='k'>三个相差一倍的步长（2⁻¹²/2⁻¹³/2⁻¹⁴）给出明显不同的曲线，而这还是在一个三状态玩具上。</span>"}],
9: [{"q": "基线 b(s) 为什么不引入偏差？", "o": ["因为减掉的那一项恒等于零：Σ_a b(s)∇π = b(s)∇Σ_a π = b(s)∇1 = 0", "因为用了 cross-fitting", "因为做了一阶近似", "因为它很小，可以忽略"], "a": 0, "why": "<span class='k'>第一步是关键：b 与 a 无关所以能提到求和外面。</span>一旦 b 里混进了动作，这一步立刻失效，后面两步无从谈起。"}, {"q": "书对基线的唯一硬性要求是什么？", "o": ["必须可微", "必须是状态值的无偏估计", "不随动作 a 变化——除此之外可以是任意函数，甚至是随机变量", "必须非负"], "a": 2, "why": "原文：The baseline can be any function, even a random variable, as long as it does not vary with a。"}, {"q": "为什么说在 MDP 里基线必须随状态变，一个全局常数不够？", "o": ["因为状态数太多", "因为有些状态下所有动作的值都高、需要高基线才能把高的和较低的区分开；低值状态则需要低基线", "因为策略随状态变", "因为折扣因子随状态变"], "a": 1, "why": "<span class='k'>反过来读：基线不够细时，梯度携带的信息从「哪个动作更好」退化成「这个状态本身好不好」。</span>而后者对改进策略没用，因为状态不是你选的。"}, {"q": "REINFORCE 的收敛性质，书是怎么交代的？", "o": ["期望更新与性能梯度同向，α 足够小时期望性能必改善、α 按随机逼近条件递减时收敛到局部最优；但方差可能很大", "不保证收敛", "只在表格情形下收敛", "收敛到全局最优"], "a": 0, "why": "<span class='w'>原文：as a Monte Carlo method REINFORCE may be of high variance and thus produce slow learning。</span>13.4 节要治的就是这个「然而」。"}],
10: [{"q": "带基线的 REINFORCE 有两个步长，书说它们的难度如何？", "o": ["两个都容易", "α^w（值）相对容易，线性情形有经验法则；α^θ（策略）就不清楚该怎么设", "两个都没有法则", "α^θ 容易，α^w 困难"], "a": 1, "why": "α^w = 0.1/E[‖∇v̂(S_t,w)‖²_μ]（9.6 节），分母可从数据估。<span class='w'>而 α^θ 的最优值取决于奖励的变化幅度与策略参数化，两个都是问题相关的。</span>"}, {"q": "图 13.2 里，加基线之后策略步长从 2⁻¹³ 变成 2⁻⁹。这说明基线的加速机制是什么？", "o": ["方差降下来之后才敢迈大步——基线允许用大 16 倍的策略步长而不发散", "基线消除了偏差", "基线让算法变成在线增量的", "基线减少了每幕的计算量"], "a": 0, "why": "<span class='k'>基线不改变更新的期望值，但大幅影响方差；而方差正是步长的约束。</span>"}, {"q": "图 13.2 的图注里有一句做公平比较的范例，是什么？", "o": ["plain REINFORCE 用的是它表现最好的那个步长（取到最近的 2 的幂）", "两条曲线都平均了 1000 次运行", "所有方法都用同样的随机种子", "两者都用同样的初始化"], "a": 0, "why": "<span class='w'>也就是说对照组是调优过的，不是随手设一个让它难看。</span>「我方调优、对照组默认参数」的比较在统计上说明不了任何事。"}],
11: [{"q": "区分「基线」和「critic」的判据是什么？", "o": ["有没有用值函数", "是不是在线算法", "值函数用在转移的第一个状态（动作之前，没法评判那个动作）还是也用到第二个状态", "有没有用自举"], "a": 2, "why": "<span class='k'>书用斜体强调了对比：基线 cannot be used to assess that action；critic 构成的一步回报 is a way of assessing the action。</span>"}, {"q": "actor–critic 的梯度估计偏差从哪来？", "o": ["来自函数逼近的表示误差", "来自步长太大", "来自自举；改用蒙特卡洛学 critic 就无偏了", "来自「用一个学到的值函数去评判动作」这件事本身——即使 critic 用蒙特卡洛学，actor 仍然有偏"], "a": 3, "why": "<span class='w'>原文：the bias in the gradient estimate is not due to bootstrapping as such。</span>这句话堵死了一个很自然的误解：以为「我不用自举就无偏了」。"}, {"q": "一步 actor–critic 相对 REINFORCE 最实质的改变是什么？", "o": ["它不需要步长", "它不需要策略可微", "它收敛更快", "它是完全在线增量的——状态动作奖励来一个处理一个，处理完不回头，于是持续性问题不必切成幕"], "a": 3, "why": "<span class='k'>配套的值函数学法是半梯度 TD(0)。</span>和 REINFORCE 那个「必须先走完一幕」对照，这是适用范围上的改变，不只是效率。"}],
12: [{"q": "一步 actor–critic 伪代码里的变量 I 是什么？", "o": ["就是那个 γᵗ 的增量写法：从 1 开始每步乘 γ，第 t 步恰为 γᵗ", "幕的计数器", "学习率的衰减", "资格迹"], "a": 0, "why": "<span class='k'>这样写不必记录「现在是第几步」，也不必在线算幂。</span>"}, {"q": "在带资格迹的版本里，I 乘在哪一行？", "o": ["两处都乘", "乘在 z^θ 的累加项里（进迹之前），θ 的更新里没有 I", "两处都不乘", "乘在 θ 的更新里，z^θ 的累加项里没有"], "a": 1, "why": "<span class='w'>γᵗ 属于「这一步的贡献」，而迹是历次贡献的加权累加，所以必须在进迹之前乘好。</span>放错一行就等于把 γᵗ 重复作用在全部历史贡献上——这类错误不报错、不崩，只会让结果慢慢变得不对。"}, {"q": "带资格迹的 actor–critic 用几个迹衰减率？", "o": ["三个", "两个独立的：λ^θ 给 actor，λ^w 给 critic", "不需要衰减率", "一个，actor 和 critic 共用"], "a": 1, "why": "<span class='k'>两个迹向量 z^θ（d′ 维）与 z^w（d 维），各自照第 12 章的模式。</span>「actor 该看多远」和「critic 该看多远」本来就不必是同一个答案。"}],
13: [{"q": "持续情形为什么不能沿用分幕情形的性能定义？", "o": ["因为状态空间无限", "因为没有幕边界也就没有起始状态 s₀，而 J(θ) ≐ v_{π_θ}(s₀) 依赖它", "因为奖励可能为负", "因为折扣因子不存在"], "a": 1, "why": "替代品是每步平均奖励率 r(π)，见 (13.15)，与 10.3 节一致。"}, {"q": "持续情形里 μ 是什么？书对它提了什么假设？", "o": ["初始状态分布；无假设", "在 s 上花费的期望步数；假设有限", "行为策略的分布；假设已知", "稳态分布；假设它存在且与 S₀ 无关（遍历性假设）"], "a": 3, "why": "<span class='k'>「与 S₀ 无关」不是技术细节——它正是「持续问题没有起点」这件事在数学上的落实。</span>"}, {"q": "持续版的伪代码里，γ 和那个 I 到哪去了？", "o": ["被 R̄ 吸收了", "藏在资格迹里", "被 λ 吸收了", "整个消失了——平均奖励率本身就是对无穷长序列取平均，发散问题已由「除以 h」解决，不需要再打折"], "a": 3, "why": "<span class='w'>这不是简化版，是平均奖励表述的必然结果。</span>而 I 本来就是 γᵗ 的增量写法，自然也没有存在的理由。"}],
14: [{"q": "差分回报为什么每一项都要减去 r(π)？", "o": ["为了让奖励非负", "为了和折扣因子等价", "为了降低方差", "因为不减的话持续问题的回报是发散的无穷和；减掉平均之后剩下「比平均好多少」的累积，可以收敛"], "a": 3, "why": "值的定义照常，只是 G_t 换成差分版本。"}, {"q": "换成差分回报之后，策略梯度定理怎么样了？", "o": ["只在表格情形下成立", "不再成立，持续情形要另证", "需要改写成另一个形式", "一字不改地继续成立，前向后向的式子也不变；而且比例常数变成 1，所以 ∝ 其实是 ="], "a": 3, "why": "<span class='k'>只换定义，不换公式——这是本节最值得记的一句。</span>"}, {"q": "持续情形证明里「按 μ(s) 加权求和」这一步，逻辑依据是什么？", "o": ["因为要用重要性采样", "μ 是最自然的权重", "因为 μ 使方差最小", "因为左边 ∇J(θ) 不依赖 s，所以右边也不依赖 s，于是任何权重和为 1 的加权平均都等于它本身"], "a": 3, "why": "<span class='w'>方向容易读反：不是「我们想加权所以加权」。</span>选 μ 不是因为它特殊，而是因为下一步要用它的稳态性质。"}],
15: [{"q": "持续情形的证明最后靠什么收尾？", "o": ["稳态性质 (13.16) 让那一坨等于 μ(s′)，于是两个 ∇v_π 项成为同一个和、只是指标名不同，精确抵消", "用了 Cauchy–Schwarz 不等式", "对 ∇v_π 做了有界性假设", "取极限 h → ∞"], "a": 0, "why": "<span class='k'>整个证明的分量都压在 (13.16) 这一条上。</span>而且这里是等号不是正比——持续情形的比例常数是 1。"}, {"q": "13.7 节处理连续动作的基本思路是什么？", "o": ["用核方法逼近动作值", "把连续动作离散化成有限多个格子", "只学最优动作，不学分布", "不为众多动作中的每一个学一个概率，改学这个概率分布的统计量"], "a": 3, "why": "<span class='k'>这是一次表示上的转换——参数个数与动作数脱钩了。</span>"}, {"q": "关于 (13.18) 里的 p(x)，书特意澄清了什么？", "o": ["它一定小于 1", "它是累积分布函数", "它是概率在 x 处的密度，不是概率；可以大于 1，必须等于 1 的是曲线下的总面积", "它只在 μ 处取最大值"], "a": 2, "why": "书还顺带澄清了另一个记号冲突：(13.18) 里的 π「当然只是那个数 π ≈ 3.14159」。"}],
16: [{"q": "为什么标准差要写成「线性函数的指数」而不是直接线性？", "o": ["因为标准差必须恒正；exp 的值域是 (0,∞)，同时让 θ_σ 在整个 R^d 上无约束可微", "为了数值稳定", "为了和均值对称", "为了降低方差"], "a": 0, "why": "<span class='w'>直接线性的话每步更新后要把它截回正数，而截断会破坏梯度——违反 13.1 节「∇π 存在且有限」那条要求。</span>"}, {"q": "习题 13.4 里，标准差那一半的资格向量 ((a−μ)²/σ² − 1)x_σ(s) 有什么性质？", "o": ["它总是指向 μ 增大的方向", "符号以一个标准差为界：偏离超过 1σ 时为正（推大 σ），落在 1σ 以内时为负（推小 σ）", "它与 a 无关", "它恒为正"], "a": 1, "why": "<span class='k'>「该随机多少」不再是手设的超参，它被回报自己推着走。</span>"}, {"q": "习题 13.5 要证的那条等价性是什么？", "o": ["soft-max 等价于 ε-贪心", "REINFORCE 等价于 Q-learning", "两动作下用 soft-max 偏好参数化，得到的就是逻辑斯谛函数——也就是逻辑回归", "高斯策略等价于 soft-max"], "a": 2, "why": "设 h(s,1,θ) − h(s,0,θ) = θᵀx(s)，代入 (13.2) 即得 P_t = 1/(1+exp(−θᵀx(S_t)))。"}],
17: [{"q": "小结里关于基线和 critic 的那一对句子，差别在哪？", "o": ["基线是常数，critic 是函数", "基线用于分幕，critic 用于持续", "加基线降方差且不引入偏差；把它也用来评判动作就成了 critic，而 critic 会把偏差引入 actor 的梯度估计", "基线无偏，critic 也无偏，只是方差不同"], "a": 2, "why": "<span class='k'>同一个 v̂，用法不同，偏差性质就不同。界线是「有没有拿它去评判动作」。</span>"}, {"q": "书为 critic 带来的偏差给了什么辩护？", "o": ["偏差会随样本增加而消失", "理由和「自举的 TD 方法常优于蒙特卡洛方法」相同——方差大幅下降，这笔交易通常划算", "偏差可以忽略不计", "用 cross-fitting 可以消除"], "a": 1, "why": "<span class='w'>⚠ 注意它没有说偏差小或可忽略。</span>而 13.5 节已补过更硬的一条：这个偏差不是自举造成的，换蒙特卡洛也去不掉。"}, {"q": "小结里「能学出合适的探索水平」这条好处，指的是本章哪个机制？", "o": ["基线 b(s)", "ε-贪心里的 ε 退火", "13.7 节高斯策略里那个可学的、依赖状态的 σ(s,θ)", "资格迹的 λ"], "a": 2, "why": "习题 13.4 给出了它的资格向量：((a−μ)²/σ² − 1)x_σ(s)，符号以一个标准差为界。"}],
18: [{"q": "策略梯度定理的优先权，书是怎么交代的？", "o": ["由 Amari 1998 首次得到", "最早由 Marbach & Tsitsiklis（1998, 2001）得到，然后由 Sutton 等（2000）独立得到", "由 Sutton 等 2000 首次得到", "由 Williams 1992 首次得到"], "a": 1, "why": "<span class='w'>只引 Sutton 等 2000 在优先权上是不准确的。</span>不过「policy gradient methods」这个术语确实出自 Sutton, McAllester, Singh & Mansour (2000)。"}, {"q": "13.4 条目里，哪一篇论证了「依赖动作的基线也可以不引入偏差」？", "o": ["Greensmith, Bartlett & Baxter (2004)", "Williams (1987, 1992)", "Degris, White & Sutton (2012)", "Thomas & Brunskill (2017)"], "a": 3, "why": "<span class='k'>13.4 节那一行证明的前提是「基线不随动作变化」，覆盖不到这种情形。</span>另外 Greensmith, Bartlett & Baxter (2004) 分析的是「一个可以说更好的基线」（另见 Dick, 2015）。"}, {"q": "文献注提到 actor–critic 方法在文献里还有一个常见别名，是什么？", "o": ["mean actor critic", "expected policy gradients", "advantage actor–critic（A2C）", "natural policy gradient"], "a": 2, "why": "另外两个别名属于 all-actions 方法：expected policy gradients（Ciosek & Whiteson）与 mean actor critic（Asadi 等）。"}, {"q": "按这一页，哪条线对「只有旧日志、无法重跑」的处境最对口？", "o": ["离策策略梯度（Degris, White & Sutton 2012；Maei 2018）", "熵正则（Schulman, Chen & Abbeel 2017）", "自然梯度（Amari, Kakade, Peters 等）", "确定性策略梯度（Silver 等 2014）"], "a": 0, "why": "<span class='k'>本章 13.5–6 的算法本身就基于 Degris, White & Sutton (2012)。</span><span class='w'>⚠ 读时要带着一个问题：它对行为策略的覆盖要求是什么？若仍需 π_b > 0，确定性日志同样用不了。</span>"}]
};

var N = [
{"r": [1, 1], "t": "这一章换了一件事做：不再学动作值，直接学策略", "star": 3, "quote": "<em>In this chapter we consider something new. So far in this book almost all the methods have been <b>action-value methods</b>; they learned the values of actions and then selected actions based on their estimated action values; <b>their policies would not even exist without the action-value estimates.</b> In this chapter we consider methods that instead learn a <b>parameterized policy</b> that can select actions <b>without consulting a value function</b>.</em><br><em>All methods that follow this general schema we call <b>policy gradient methods</b>, whether or not they also learn an approximate value function. Methods that learn approximations to <b>both</b> policy and value functions are often called <b>actor–critic methods</b> …</em>", "one": "<b>前十二章都是「先学动作值、再由动作值派生策略」；这一章把策略本身参数化成 π(a|s,θ)，直接对性能 J(θ) 做梯度上升。值函数还可以用，但只是用来帮着学 θ，不再参与选动作。</b>", "pts": ["<b>先把这一章在全书里的位置摆清楚。</b> <span class='k'>书里说得很重：<b>那些方法的策略「离开动作值估计就根本不存在」</b>——ε-贪心、Sarsa、Q-learning 的「策略」都只是读表之后的一个 argmax 或 softmax，本身没有独立的参数。</span>这一章反过来：<b>策略有自己的参数向量 θ ∈ R^d′</b>，π(a|s,θ) = Pr{A_t = a | S_t = s, θ_t = θ}，选动作时不必查任何值函数。", "<b>值函数没有被废掉，而是被降级了。</b> 原文说得很克制：<i>A value function may still be used to learn the policy parameter, but is not required for action selection.</i> <span class='k'>值函数的权重仍记作 w ∈ R^d，写成 v̂(s,w)，和第 9–12 章一脉相承。</span><b>注意这里出现了两套参数、两个维度</b>：策略的 θ 是 d′ 维，值函数的 w 是 d 维，两者互不相干——后面 13.4 和 13.5 会给它们各配一个步长。", "<b>整章的骨架就是 (13.1) 这一行随机梯度上升。</b> θ_{t+1} = θ_t + α ∇̂J(θ_t)，其中 ∇̂J(θ_t) 是一个**随机估计**，它的期望近似等于性能对 θ_t 的真梯度。<span class='w'><b>请盯住这个「近似」</b>——这一章后面所有算法的差别，几乎都可以归结为「这个 ∇̂ 是怎么造出来的、它偏不偏、方差多大」。</span>REINFORCE 是无偏高方差，带基线的 REINFORCE 是无偏但方差小得多，actor–critic 则**有意引入偏差**换更低的方差。", "<b>命名在这一章是有约定的，别混。</b> <span class='k'>凡是照 (13.1) 这个模子走的，一律叫<b>策略梯度方法</b>，<b>不管它学不学值函数</b>；而<b>同时</b>学策略近似和值函数近似的，常叫 <b>actor–critic</b>（actor 指学到的策略，critic 指学到的值函数，通常是状态值函数）。</span>⚠ 但 13.5 会给一条更严的界线：<b>只拿值函数当基线的不算 actor–critic，必须用它去「评判动作」（即自举）才算。</b>", "<b>这一章的叙述顺序是：先分幕、后持续。</b> 分幕情形把性能定义为「起始状态在当前参数化策略下的值」（13.4 节会写成 J(θ) ≐ v_{π_θ}(s₀)）；持续情形则定义为**平均奖励率**，和 10.3 节一致。书里承诺：<i>In the end, we are able to express the algorithms for both cases in very similar terms.</i>——这个承诺在 13.6 节兑现，而且兑现得相当漂亮：<b>换掉值的定义（改用差分回报）之后，(13.5) 这条定理一字不改地继续成立。</b>", "<b>⚠ 这一页的脚注比正文还值钱，别跳过。</b> 书说：<i>The lone exception is the <b>gradient bandit algorithms of Section 2.8</b>. In fact, that section goes through <b>many of the same steps</b>, in the <b>single-state bandit case</b>, as we go through here for full MDPs.</i> <span class='w'><b>翻译：第 2.8 节的梯度老虎机，就是本章在「只有一个状态」时的特例</b>——偏好 H(a)、soft-max、基线、无偏梯度估计，那一节全都走过一遍。</span>作者建议先复习 2.8 再读这一章。对你而言这条脚注有额外的分量，见右边的科研格。"], "eq": "本章的通用骨架（13.1）：\n   θ_{t+1} = θ_t + α ∇̂J(θ_t)\n   其中 ∇̂J(θ_t) ∈ R^d′ 是一个**随机估计**，其期望**近似**性能对 θ_t 的梯度\n   —— 全章算法的差别，基本都在「∇̂ 怎么造、偏不偏、方差多大」上\n\n两套参数，互不相干：\n   策略   π(a|s,θ)，  θ ∈ R^d′     选动作只用它\n   值函数 v̂(s,w)，    w ∈ R^d      只用来帮着学 θ（可有可无）\n\n命名约定：\n   策略梯度方法   照 (13.1) 走的一切，**不论学不学值函数**\n   actor–critic   **同时**学策略与值函数者\n                  actor = 学到的策略，critic = 学到的值函数\n   ⚠ 13.5 节会收紧：只当基线不算 critic，必须拿去**评判动作**才算\n\n脚注 1（关键）：\n   §2.8 的梯度老虎机 = 本章在**单状态**下的特例，步骤几乎逐条对应", "tbl": {"head": ["", "动作值方法（前十二章）", "策略梯度方法（本章）"], "rows": [["学什么", "动作值 q(s,a) 或 q̂(s,a,w)", "<b>策略参数 θ</b>，直接给出 π(a|s,θ)"], ["怎么选动作", "读值表 → argmax / ε-贪心 / soft-max", "<b>直接从 π(·|s,θ) 采样</b>，不查值函数"], ["策略能独立存在吗", "<span class='w'>不能</span>——「离开动作值估计就根本不存在」", "<b>能</b>，策略自带参数"], ["值函数的角色", "唯一主角", "<b>可选的配角</b>，只帮着学 θ"], ["更新的目标", "让值估计逼近真值", "<b>让性能 J(θ) 上升</b>（梯度上升）"], ["单状态时退化为", "—", "<b>§2.8 的梯度老虎机</b>（脚注 1）"]]}, "res": {"tag": "推断", "ref": "原书 13.1 节开篇与脚注 1（逐句核对）· 简报 §5「Week 2 可加性检验」· bridge-threads [1] 多臂与上下文老虎机 · CSE 541 已建 6 讲", "v": "<b>脚注 1 对你这个课题不是花絮，是一条分叉路标。</b><br><span class='k'><b>简报 §5 那条「可加性检验」如果通过</b></span>——即 Σ_h Δ_h^down 与 Acc(全强) − Acc(全弱) 在置信区间内一致——<b>那么你的问题在实质上不是 MDP，而是一组「每节点代价敏感选择」</b>，也就是（上下文）老虎机。<b>这正是脚注 1 说的那个「单状态特例」。</b><br>⇒ <b>于是本章的读法要分两种情况：</b><br><span class='k'><b>可加性成立</b></span>：你该回到 §2.8 的梯度老虎机，而不是把本章的 MDP 机器整套搬过去。本章对你的价值变成「<b>借它的论证，不借它的算法</b>」——13.1 的四条好处、13.2 的定理精神、13.4 的基线恒等式，在单状态下全都成立且更干净。<br><span class='w'><b>可加性不成立</b></span>：序贯结构是真的，本章整套可用，而且 13.6 的持续情形与 13.5 的在线增量形式都用得上。<br><b>⚠ 注意这条推断的方向：不是「先选框架再找证据」，而是「实验先行、框架后定」</b>——这和简报 §5 那句「MDP 框架必须被实验挣得，不能预设」是同一条纪律。本章恰好把两边的工具都备齐了，所以<b>读它不会押错注</b>。"}, "link": {"t": "你学过的对应：CS234 L08 精读（策略梯度 I —— 那一讲从 CS234 的角度走了同一条推导，可以对照着看两种讲法）", "href": "../../cs234-2019/中文精读/L08-精读.html"}},
{"r": [2, 2], "t": "怎么参数化：soft-max 偏好，外加一条容易被当成细节的硬要求", "star": 3, "quote": "<em>In policy gradient methods, the policy can be parameterized in <b>any way</b>, as long as π(a|s, θ) is <b>differentiable</b> with respect to its parameters, that is, as long as ∇π(a|s, θ) … <b>exists and is finite</b> for all s ∈ S, a ∈ A(s), and θ ∈ R^d′. <b>In practice, to ensure exploration we generally require that the policy never becomes deterministic</b> (i.e., that π(a|s, θ) ∈ (0, 1), for all s, a, θ).</em>", "one": "<b>参数化可以随便选，只要可微。但书在同一段里加了第二条要求——策略「永远不许变成确定性的」，π(a|s,θ) 必须严格落在开区间 (0,1) 里。这一条是方法的前提，不是事后补的探索补丁。</b>", "pts": ["<b>第一条要求是可微，这条好理解。</b> ∇π(a|s,θ) 是 π 对 θ 各分量的偏导组成的列向量，要求它对<b>所有</b> s ∈ S、a ∈ A(s)、θ ∈ R^d′ 都<b>存在且有限</b>。<span class='k'>「有限」这两个字不是凑数：若某处导数发散，(13.1) 那一步就会把参数踢飞。</span>这也是为什么后面 13.7 节处理连续动作时，标准差要用 <b>exp(线性)</b> 而不是直接线性——既保证恒正，也让对数可微。", "<b>第二条要求才是这一页真正的重点：策略永远不许变成确定性的。</b> <span class='w'><b>注意书的措辞是 “we generally require”——这是对方法的要求，不是对实现的建议。</b></span>π(a|s,θ) ∈ (0,1) 对所有 s、a、θ 成立。理由书里只给了三个字：to ensure exploration。但后果很深远：<b>整章的梯度估计都建立在「每个动作都有正概率被采到」之上</b>，一旦某个动作概率归零，它的梯度分量就永远拿不到样本。", "<b>离散动作空间的标准做法：soft-max in action preferences。</b> 先给每个状态–动作对一个<b>参数化的数值偏好</b> h(s,a,θ) ∈ R，再按 (13.2) 做指数归一化。<span class='k'><b>关键在于偏好本身可以任意参数化</b></span>：可以是一个深度网络（θ 就是全部连接权重，AlphaGo 即如此，见 16.6 节），也可以简单地在特征上线性，即 (13.3) 的 h(s,a,θ) = θᵀx(s,a)。分母只是为了让每个状态下的动作概率和为 1，没有别的含义。", "<b>第一条好处：soft-max 偏好可以逼近确定性策略，而 ε-贪心不能。</b> ε-贪心永远留着 ε 的概率乱走。<span class='k'><b>但书紧接着堵了一个很容易想到的反驳</b></span>：「那我对动作值做 soft-max 不就行了？」——不行。原因是<b>动作值会收敛到各自的真值，彼此相差一个有限的量</b>，于是导出的概率是某组确定的、不等于 0 或 1 的数。<b>偏好不一样：偏好不收敛到任何特定数值，它被推着去产生最优的随机策略；若最优策略恰好是确定性的，最优动作的偏好会被推到无穷高于其余动作。</b>", "<b>温度参数这条路书也堵了。</b> 你当然可以在 soft-max 里加温度并随时间降温，<span class='w'><b>但书说：在实践中很难选这个下降日程，甚至连初始温度都难选——除非你对真实动作值的先验知识比你愿意假设的还多。</b></span>这是一条很实在的工程判断：<b>把「该多确定」交给参数自己学，比交给一个人工日程表要稳。</b>"], "eq": "两条硬要求（13.1 节）：\n   ① 可微：∇π(a|s,θ) 对所有 s∈S, a∈A(s), θ∈R^d′ **存在且有限**\n   ② 不确定：π(a|s,θ) ∈ (0,1) 对所有 s, a, θ —— to ensure exploration\n      ⚠ 这是方法的**前提**，不是事后加的探索补丁\n\nsoft-max in action preferences（13.2）：\n                    exp( h(s,a,θ) )\n   π(a|s,θ)  ≐  ─────────────────────\n                  Σ_b exp( h(s,b,θ) )\n\n   偏好 h 可任意参数化：\n      深度网络   θ = 全部连接权重（AlphaGo，16.6 节）\n      线性(13.3) h(s,a,θ) = θᵀ x(s,a)\n\n为什么不对**动作值**做 soft-max：\n   动作值 → 收敛到各自真值 → 相差**有限** → 概率停在某组非 0/1 的数\n   偏好   → 不收敛到任何特定值 → 被推着产生**最优随机策略**\n          → 最优策略若是确定性的，最优动作偏好被推到**无穷高**", "tbl": {"head": ["逼近确定性策略的办法", "行不行", "书给的理由"], "rows": [["ε-贪心", "<span class='w'>不行</span>", "永远留着 ε 概率选随机动作"], ["对<b>动作值</b>做 soft-max", "<span class='w'>不行</span>", "动作值收敛到真值、相差<b>有限</b>，概率停在某组非 0/1 的定数"], ["soft-max + 温度退火", "<span class='w'>理论上行，实践很难</span>", "下降日程甚至初始温度都难选，除非先验知识比你愿意假设的还多"], ["soft-max 在<b>动作偏好</b>上", "<b>行</b>", "偏好不收敛到特定值，被推着产生<b>最优随机策略</b>；最优若确定则偏好趋于无穷高"]]}, "res": {"tag": "推断", "ref": "原书 13.1 节（逐句核对）· 简报 §4a「现有日志做不了 IS —— 不是方差大，是估计量不存在」· 简报 §9 动作 2「节点执行器加 propensity 采样与记录」", "v": "<b>「策略永远不许变成确定性的」这一条，正好是简报 §4a 那个死结的另一面。</b><br><span class='w'><b>你现在的日志里 π_b(a|h) ∈ {0,1}</b></span>——每次运行固定模型配置，没有随机化、没有动作分布。简报的结论是：这不是「高方差的 IS」，是 <b>IS 无定义</b>（deficient support），<b>加再多数据也不会好转</b>。<br><span class='k'><b>本页给了这件事一个完全不同的理由</b></span>：书把 π ∈ (0,1) 写成<b>方法本身的前提</b>，摆在「可微」旁边作为第二条硬要求，而不是放在某个「探索技巧」小节里。<b>也就是说：在策略梯度的框架里，随机化不是为了做离线评估才加的，它本来就是策略类的一部分。</b><br>⇒ <b>这对你写作有直接用处。</b>审稿人问「为什么要给节点选择加随机化、这会不会伤害性能」时，你有两条答案而不是一条：<br>① 工具性的——没有它 OPE 的估计量不存在（简报 §4a）；<br>② <b>原理性的——策略梯度类方法对策略的标准要求就是处处非零，一个处处确定的「策略」根本不在这个类里。</b><br><b>第二条比第一条好用，因为它不把随机化说成「为了迁就估计量而付的代价」。</b>下一页的 Example 13.1 会把这条论证推得更远：有时候<b>最优策略本身就是随机的</b>。"}},
{"r": [3, 3], "t": "第二条好处：能学出任意概率——而有时候最优策略本来就是随机的", "star": 3, "quote": "<em>In problems with significant function approximation, <b>the best approximate policy may be stochastic</b>. For example, in card games with imperfect information the optimal play is often to do two different things with specific probabilities, such as when bluffing in Poker. <b>Action-value methods have no natural way of finding stochastic optimal policies</b>, whereas policy approximating methods can, as shown in Example 13.1.</em><br><em><b>Example 13.1 Short corridor with switched actions.</b> … The problem is difficult because <b>all the states appear identical under the function approximation.</b> … An action-value method with ε-greedy action selection is forced to choose between just two policies … <b>The best probability is about 0.59, which achieves a value of about −11.6.</b></em>", "one": "<b>短走廊这个例子的要害不是「动作被调换了」，而是三个状态在函数逼近下长得一模一样。一旦状态被混叠，最优策略就真的是随机的——而动作值方法连表达它的办法都没有。</b>", "pts": ["<b>先把这个例子的构造说清楚，它只有三个非终止状态，但设计得很刁。</b> 每步奖励 −1（照例），每个非终止状态只有两个动作：right 和 left。第一个和第三个状态里这两个动作是正常的（在第一个状态里 left 撞墙不动）；<span class='k'><b>但在第二个状态里两个动作被调换了：right 往左走，left 往右走。</b></span>", "<b>真正让这个问题变难的，是下一句。</b> 书写道：<i>The problem is difficult because <b>all the states appear identical under the function approximation</b>.</i> 具体地，特征被定成 x(s, right) = [1, 0]ᵀ 与 x(s, left) = [0, 1]ᵀ，<span class='w'><b>对所有 s 都一样——特征里根本没有「我在第几个状态」这个信息。</b></span>于是策略只能在「以多大概率向右」这一个数上做文章，无法因状态而异。", "<b>在这个限制下，ε-贪心被逼到只有两个选择。</b> 因为所有状态看起来相同，动作值方法学出来的只能是「处处以高概率 1 − ε/2 选 right」或者「处处以同样的高概率选 left」二者之一。ε = 0.1 时，这两个策略在起始状态的值<b>分别低于 −44 与 −82</b>。<span class='k'><b>而如果允许自由选择「向右的概率」，最好的那个概率约为 0.59，值约为 −11.6。</b></span><b>差了接近四倍。</b>", "<b>把这三个数并排放，这一页的论证就完整了。</b> −44 / −82 是动作值方法在该表示下<b>能达到的上限</b>，−11.6 是<b>同一个表示</b>下随机策略能达到的值。<span class='w'><b>注意：差距不是来自「探索不够」，而是来自「表达不出来」。</b></span>动作值方法不是没找到 0.59，是它的策略类里压根没有「以 0.59 的概率向右」这个元素——ε-贪心的概率被 ε 钉死了，soft-max 的概率被动作值的真值钉死了（上一页刚论证过）。", "<b>书把这条好处上升到了一般结论。</b> <i>In problems with <b>significant function approximation</b>, the best approximate policy <b>may be stochastic</b>.</i> 扑克里的诈唬被当成例子：不完全信息下，最优打法常常是「以特定概率做两件不同的事」。<span class='k'><b>而「动作值方法没有自然的办法去找随机的最优策略」是一句结论性的断言，不是这个例子的局部现象。</b></span>", "<b>⚠ 一个容易读漏的因果链，值得单独点出来。</b> 最优策略之所以随机，<b>不是因为环境随机</b>（这个走廊的转移是确定的），<b>而是因为「表示」不够——状态被混叠了</b>。<span class='w'><b>换句话说：随机性是在补偿表示的不足。</b></span>这个因果方向很重要，因为它意味着：<b>如果你的策略只能看到部分信息，那么「最优策略是随机的」就不是一个需要辩护的设计选择，而是一个数学事实。</b>右边的科研格把这条直接接到你的 P2 / P3 消融上。"], "eq": "Example 13.1 短走廊（switched actions）\n\n   三个非终止状态，每步奖励 −1，每状态两个动作 right / left\n   状态 1、3：动作正常（状态 1 里 left 撞墙不动）\n   状态 2  ：**两个动作调换** —— right 往左，left 往右\n\n   特征：x(s, right) = [1, 0]ᵀ ，x(s, left) = [0, 1]ᵀ ，**对所有 s 相同**\n        ⇒ 三个状态在函数逼近下**完全无法区分**\n\n   ε = 0.1 时三条线（照抄原文的数）：\n      ε-贪心 right        值 < −44\n      ε-贪心 left         值 < −82\n      最优随机策略        向右概率 ≈ **0.59**，值 ≈ **−11.6**\n\n   ⚠ 差距的来源是**表达不出来**，不是探索不够\n   ⚠ 随机性在这里**补偿的是表示的不足**，不是环境的随机", "tbl": {"head": ["策略", "在起始状态的值", "为什么只能这样"], "rows": [["ε-贪心，处处偏 right", "<span class='w'>低于 −44</span>", "状态被混叠，只能处处用同一个高概率 1 − ε/2"], ["ε-贪心，处处偏 left", "<span class='w'>低于 −82</span>", "同上"], ["最优<b>随机</b>策略", "<b>约 −11.6</b>", "向右概率自由可学，最优约 <b>0.59</b>"], ["差距的来源", "<b>表达不出来</b>", "不是探索不够——策略类里没有这个元素"], ["随机性在补偿什么", "<b>表示的不足</b>", "环境转移是确定的，混叠来自特征"]]}, "res": {"tag": "推断", "ref": "原书 Example 13.1 与 13.1 节末（三个数逐字核对）· 简报 §5「P2 vs P3 消融」· 简报 §8「难度是 query 的属性，还是 (query, 节点, 部分轨迹) 三元组的属性」", "v": "<b>这一页给你的 P2 / P3 消融补上了一条你现在还没有的论证。</b><br>简报 §5 的设计是：策略只看 (query, 节点 id) 叫 P2，也看部分轨迹叫 P3；若序贯信息带来的提升不到 2 个百分点，就不要用 MDP 框架。<span class='k'><b>这是一个「要不要加信息」的判据。</b></span><b>但本页提出的是另一个问题：在你决定不加的那个表示下，最优策略长什么样？</b><br><span class='w'><b>如果 P2 表示把若干个实际上不同的决策点混叠成同一个输入</b></span>（同一个 query、同一个节点 id，但上游产出的中间结果质量不同），<b>那么按本页的论证，P2 下的最优策略可能本来就是随机的</b>——和短走廊里那三个「长得一模一样」的状态是同一回事。<br>⇒ <b>这条推断有三个可用之处：</b><br>① <b>它把「要不要随机化」从工程选择变成了表示的函数。</b>P2 下随机化可能是最优的；P3 下若混叠被解除，确定性策略也许就够了。<b>于是「P2 的最优向右概率是多少」本身就是一个可测的量，而不只是「P3 比 P2 好多少」这一个数。</b><br>② <b>它给 §4d 的穷举 oracle 表加了一个新用法。</b>你那张精确表 R(x, a₁..a_k) 可以直接算出：在 P2 表示下，最优的**随机**节点级策略值是多少、它比最优**确定性**策略好多少。<span class='k'><b>这个差值就是短走廊里 −11.6 与 −44 的类比物，而你能精确算出它。</b></span><b>书只能在一个三状态玩具上展示这件事，你能在真实管道上量出来。</b><br>③ ⚠ <b>但要诚实地预判一个可能的结果：这个差值也许很小甚至为零。</b>短走廊是被刻意设计成「动作在中间状态被调换」才造出这么大的差距的；节点保真度选择未必有这种对抗结构。<b>差值小本身也是结论——它说明 P2 够用，而且顺带支持了可加性那一侧。</b>"}},
{"r": [4, 4], "t": "另外两条好处，和 13.2 开篇那个「看起来没法办」的难处", "star": 2, "quote": "<em>Perhaps the simplest advantage that policy parameterization may have over action-value parameterization is that <b>the policy may be a simpler function to approximate</b>. … In the latter case a policy-based method will typically <b>learn faster and yield a superior asymptotic policy</b> (as in Tetris; see Şimşek, Algórta, and Kothiyal, 2016).</em><br><em>Finally, we note that the choice of policy parameterization is sometimes a good way of <b>injecting prior knowledge</b> about the desired form of the policy into the reinforcement learning system. <b>This is often the most important reason for using a policy-based learning method.</b></em><br><em>The problem is that performance depends on both the action selections <b>and the distribution of states</b> in which those selections are made, and <b>both of these are affected by the policy parameter</b>.</em>", "one": "<b>第三条好处：策略可能比动作值函数更简单，于是更好逼近。第四条：参数化本身是注入先验的入口，而书说这「常常是用策略方法最重要的理由」。然后 13.2 开篇抛出难处：性能同时取决于动作选择和状态分布，而后者怎么被 θ 影响，是环境的性质、通常未知。</b>", "pts": ["<b>第三条好处说得很朴素：有时候策略就是比值函数简单。</b> 书的措辞是 “Perhaps the <b>simplest</b> advantage”——不同问题里策略和动作值函数的复杂度各有高低，<span class='k'><b>当策略那一边更简单时，基于策略的方法通常学得更快、渐近策略也更好。</b></span>书给的实证是俄罗斯方块（Şimşek, Algórta, and Kothiyal, 2016）。⚠ 这是一条<b>有条件</b>的好处，不是无条件的——书明说了「For some, the action-value function is simpler」。", "<b>第四条好处的分量被书自己抬得很高。</b> <i>the choice of policy parameterization is sometimes a good way of <b>injecting prior knowledge</b> about the desired form of the policy</i>，<span class='w'><b>紧接着一句：This is often the most important reason for using a policy-based learning method.</b></span><b>注意这句话的位置</b>——它压在 13.1 节的最后，是作者对整节四条好处的排序表态：前三条是技术性的，<b>第四条是实践中最常起决定作用的那条。</b>", "<b>「注入先验」具体注在哪？注在 h(s,a,θ) 的形式里。</b> 上一页说过偏好可以任意参数化，<span class='k'><b>而「任意」的另一面就是「你可以把你知道的结构写进去」</b></span>：哪些特征该进 x(s,a)、哪些动作该共享参数、哪些维度该被约束。动作值方法没有这个入口——它只能逼近 q，而 q 的形状是环境定的，不是你定的。", "<b>13.2 节一上来先补了一条理论好处，再抛出难处。</b> 理论好处是：<b>连续的策略参数化让动作概率随参数平滑变化</b>，<span class='w'><b>而 ε-贪心下，动作值的任意小扰动都可能让最大值换人、概率随之剧变。</b></span>正因为如此，<b>策略梯度方法能拿到比动作值方法更强的收敛保证</b>——书说得很明确：是「策略对参数依赖的连续性」使得 (13.1) 那种梯度上升成为可能。", "<b>然后是本节要解决的难处，这是全章最关键的一个转折。</b> 分幕情形把性能定义为起始状态的值，即 (13.4) 的 J(θ) ≐ v_{π_θ}(s₀)（并假设每幕都从同一个非随机的 s₀ 出发，这只是记号简化）。<span class='k'><b>⚠ 正文一律假设不打折（γ = 1）</b></span>，只有方框里的伪代码给一般的打折版本——这解释了为什么后面伪代码里会多出一个 γᵗ 因子。", "<b>难处本身：性能同时取决于两件事，而两件事都受 θ 影响。</b> ① <b>动作选择</b>——给定状态，θ 怎么影响动作、进而影响奖励，从参数化的知识里可以相对直接地算出来；<span class='w'><b>② 状态分布——θ 怎么影响「你会遇到哪些状态」，这是环境的函数，通常未知。</b></span><b>书把问题摆成一句反问：当梯度依赖于「策略改变对状态分布的未知影响」时，我们怎么可能估计这个梯度？</b>下一页的定理就是对这句反问的回答。"], "eq": "13.1 节四条好处（按书给的顺序）：\n   ① 能逼近确定性策略        ε-贪心永远留 ε 的随机\n   ② 能学出任意概率          最优策略可能本来就随机（Example 13.1）\n   ③ 策略可能更简单          有条件！俄罗斯方块（Şimşek 等, 2016）\n   ④ **注入先验的入口**      书：often the most important reason\n\n13.2 节补的理论好处：\n   连续参数化 ⇒ 动作概率随参数**平滑**变化\n   ε-贪心     ⇒ 动作值的任意小扰动可能让最大值换人、概率**剧变**\n   ⇒ 正是这个**连续性**使 (13.1) 的梯度上升成立，收敛保证也更强\n\n分幕情形的性能（13.4）：\n   J(θ) ≐ v_{π_θ}(s₀)        每幕从同一个非随机 s₀ 出发（记号简化）\n   ⚠ 正文假设 **γ = 1**（不打折）；方框伪代码给一般打折版 ⇒ 多一个 γᵗ\n\n难处（本节要解决的）：\n   性能 = f( 动作选择 , 状态分布 )，**两者都受 θ 影响**\n      动作选择 ← θ   可从参数化直接算\n      状态分布 ← θ   **是环境的函数，通常未知**  ← 卡在这里", "tbl": {"head": ["", "受 θ 影响吗", "能算吗", "书的说法"], "rows": [["动作选择 → 奖励", "<b>是</b>", "<b>能</b>", "can be computed in a relatively straightforward way from knowledge of the parameterization"], ["策略 → 状态分布", "<b>是</b>", "<span class='w'>不能</span>", "is a function of the environment and is <b>typically unknown</b>"], ["⇒ 困境", "—", "—", "梯度依赖一个未知量，怎么估？"], ["⇒ 出路", "—", "—", "<b>策略梯度定理：给出的表达式不含状态分布的导数</b>"]]}, "res": {"tag": "推断", "ref": "原书 13.1 节末与 13.2 节开篇（逐句核对）· 简报 §4c「先做敏感度扫描，再谈 OPE」· 简报 §9 动作 3「一步偏离敏感度扫描 → 节点敏感度表」", "v": "<b>第四条好处——「参数化是注入先验的入口」——正好是你第 2 周那张表的归宿。</b><br>简报 §4c 的做法是：对每个节点 j 跑「j 用 7B、其余 72B」对照「全 72B」，按准确率跌幅和 token 占比排序，<b>只保留 top k=3~4 作为随机化决策节点，其余按扫描结果钉死</b>。ESS 从 n·2⁻¹⁰ 提到 n·2⁻⁴，<b>64 倍</b>。<br><span class='k'><b>用本页的语言重述：那张敏感度表就是先验，而「钉死其余节点」就是把先验注入到策略参数化里。</b></span>你不是在策略类里加了一条约束然后道歉，<b>你是在做书说的「用策略方法最重要的那个理由」。</b><br>⇒ <b>这改变的是写法，不是做法。</b>原本「为了把 ESS 提上去，我们只随机化 4 个节点」听起来像一个被迫的妥协；<b>改成「我们把节点敏感度先验注入策略参数化，这既是 Sutton & Barto 13.1 节所说的策略方法的主要优势，也顺带把有效样本量提高了 64 倍」，</b>同一件事就从妥协变成了设计。<br><span class='w'><b>⚠ 但别把这条用过头。</b></span>书对第三条好处（策略更简单）是<b>明确加了条件</b>的——“For some, the action-value function is simpler”。<b>你的 Q̂ / 成本模型那一边恰恰可能更简单</b>（简报 §4e：成本回归预期 R² > 0.95）。所以<b>不要写成「策略方法一律更好」，那条在本章里就不成立。</b>"}},
{"r": [5, 6], "t": "策略梯度定理：梯度里不含状态分布的导数", "star": 3, "quote": "<em>Fortunately, there is an excellent theoretical answer to this challenge in the form of the <b>policy gradient theorem</b>, which provides an analytic expression for the gradient of performance with respect to the policy parameter … <b>that does not involve the derivative of the state distribution</b>.</em><br><em>In the episodic case, <b>the constant of proportionality is the average length of an episode</b>, and in the continuing case <b>it is 1</b>, so that the relationship is actually an equality. The distribution μ here … is the <b>on-policy distribution</b> under π.</em><br><em>With just elementary calculus and re-arranging of terms, we can prove the policy gradient theorem <b>from first principles</b>.</em>", "one": "<b>定理给出 ∇J(θ) ∝ Σ_s μ(s) Σ_a q_π(s,a) ∇π(a|s,θ)。右边只有三样东西：同策分布 μ、动作值 q_π、以及 π 对 θ 的梯度。上一页那个「状态分布怎么被 θ 影响」的未知量，一次都没出现。</b>", "pts": ["<b>先看定理本身，再看它为什么是个好消息。</b> (13.5) 说：∇J(θ) <b>∝</b> Σ_s μ(s) Σ_a q_π(s,a) ∇π(a|s,θ)。<span class='k'><b>右边三样东西：μ 是 π 下的同策分布（第 9、10 章那个），q_π 是动作值，∇π(a|s,θ) 是策略对参数的梯度。</b></span><b>前两样可以用采样拿到，第三样可以从你自己选的参数化里解析地算出来。而上一页那个「策略怎么改变状态分布」的未知量，一次都没出现。</b>", "<b>「∝」这个符号在这里是有确切含义的，别当成含糊其辞。</b> 书写得很具体：<b>分幕情形下比例常数是「一幕的平均长度」，持续情形下是 1</b>（于是在持续情形里 (13.5) 其实是等式，13.6 节会用到这一点）。<span class='k'><b>而 13.3 节会说明为什么「只需要成正比」就够了：</b></span>任何比例常数都能被吸收进步长 α，而 α 本来就是任选的。<b>所以这个 ∝ 不是定理的弱点，是它的便利。</b>", "<b>证明只用初等微积分，但有一个结构性的关键，值得慢读。</b> 起点是 ∇v_π(s) = ∇[Σ_a π(a|s)q_π(s,a)]（习题 3.18）。对乘积用链式法则，得到两项：<b>∇π(a|s)·q_π(s,a)</b> 和 <b>π(a|s)·∇q_π(s,a)</b>。<span class='k'><b>第一项已经是我们想要的形状，第二项需要继续展开。</b></span>", "<b>第二项展开时出现了整个证明的要害。</b> 把 q_π(s,a) 按 Bellman 方程写成 Σ_{s′,r} p(s′,r|s,a)(r + v_π(s′))，然后求 ∇。<span class='w'><b>注意：p(s′,r|s,a) 是环境的动力学，它不依赖 θ——所以 ∇ 直接穿过它，落在 v_π(s′) 上。</b></span><b>这就是为什么状态分布的导数永远不会出现：∇ 在整个推导里只落在 π 上，从不落在 p 上。</b>环境的动力学从头到尾都是常数，它只负责把递归往下传一层。", "<b>于是递归可以一直展开下去（unrolling），展开的结果被收成一个漂亮的形式。</b> ∇v_π(s) = Σ_{x∈S} Σ_{k=0}^∞ Pr(s→x, k, π) Σ_a ∇π(a|x) q_π(x,a)，其中 <b>Pr(s→x, k, π) 是在 π 下从 s 出发恰好 k 步后处于 x 的概率</b>。<span class='k'><b>关键观察：状态分布是从「把展开项收集起来」里长出来的，不是从「对什么东西求导」里长出来的。</b></span>", "<b>最后三步把它整理成定理的样子。</b> 令 η(s) ≐ Σ_{k=0}^∞ Pr(s₀→s, k, π)，即<b>在 s 上花费的期望时间步数</b>（第 199 页那个方框）；再把 η 归一化成 μ(s) = η(s)/Σ_{s′}η(s′)，这正是第 9 章 (9.3) 的同策分布。提出来的那个公因子 Σ_{s′}η(s′) <b>就是「一幕的平均长度」</b>——<b>比例常数的来历到这里一清二楚，它不是凭空冒出来的。</b>", "<b>⚠ 把这一页的意义说透：定理解决的不是「算得快」，是「算得了」。</b> 上一页的困境是：性能对 θ 的梯度看起来需要知道「θ 怎么改变状态分布」，而那是环境的性质、通常未知。<span class='w'><b>定理的回答不是「我们有办法估计那个未知量」，而是「你根本不需要它」。</b></span><b>这是一个消去，不是一个近似。</b>右边的科研格说明为什么这件事对你那个「后续节点不可交换」的难题有直接意义。"], "eq": "策略梯度定理 · 分幕情形（13.5）：\n\n   ∇J(θ)  ∝  Σ_s μ(s) Σ_a q_π(s,a) ∇π(a|s,θ)\n\n   μ      = π 下的**同策分布**（第 9、10 章；见书第 199 页）\n   ∝ 的常数 = 分幕：**一幕的平均长度**；持续：**1**（于是是等式）\n   ⚠ 只需成正比就够 —— 常数可吸收进步长 α（13.3 节）\n\n证明（分幕；照 ch13.pdf p5 的方框抄）：\n\n   ∇v_π(s) = ∇[ Σ_a π(a|s) q_π(s,a) ]                         (习题 3.18)\n           = Σ_a [ ∇π(a|s) q_π(s,a) + π(a|s) ∇q_π(s,a) ]      (乘积法则)\n           = Σ_a [ ∇π(a|s) q_π(s,a)\n                   + π(a|s) ∇ Σ_{s′,r} p(s′,r|s,a)( r + v_π(s′) ) ]\n                                                   (习题 3.19 与式 3.2)\n           = Σ_a [ ∇π(a|s) q_π(s,a)\n                   + π(a|s) Σ_{s′} p(s′|s,a) ∇v_π(s′) ]       (式 3.4)\n                     ↑ p 不依赖 θ ⇒ ∇ **穿过它**，落在 v_π(s′) 上\n           = …（继续展开 unrolling）…\n           = Σ_{x∈S} Σ_{k=0}^∞ Pr(s→x, k, π) Σ_a ∇π(a|x) q_π(x,a)\n\n   其中 Pr(s→x, k, π) = π 下从 s 出发 k 步后处于 x 的概率\n\n   ∇J(θ) = ∇v_π(s₀)\n         = Σ_s ( Σ_{k=0}^∞ Pr(s₀→s, k, π) ) Σ_a ∇π(a|s) q_π(s,a)\n         = Σ_s η(s) Σ_a ∇π(a|s) q_π(s,a)                 (第 199 页方框)\n         = Σ_{s′} η(s′) · Σ_s [ η(s) / Σ_{s′} η(s′) ] Σ_a ∇π(a|s) q_π(s,a)\n         = Σ_{s′} η(s′) · Σ_s μ(s) Σ_a ∇π(a|s) q_π(s,a)        (式 9.3)\n         ∝ Σ_s μ(s) Σ_a ∇π(a|s) q_π(s,a)                      (Q.E.D.)\n           ↑ 提出来的 Σ_{s′}η(s′) **就是一幕的平均长度**\n\n   η(s) = 在 s 上花费的**期望时间步数**\n   μ(s) = η(s) / Σ_{s′} η(s′)   ← 归一化\n\n**全证明里 ∇ 只落在 π 上，从不落在 p 上** —— 这就是「不含状态分布导数」的来源", "tbl": {"head": ["推导的每一步", "∇ 落在谁身上", "为什么不出事"], "rows": [["∇[Σ_a π q_π]", "π 和 q_π", "乘积法则，两项都要"], ["∇q_π 展开成 Bellman", "<b>穿过 p，落在 v_π(s′)</b>", "<b>p 是环境动力学，不依赖 θ</b>"], ["递归展开 unrolling", "始终只落在 π 上", "每层都重复上一行的结构"], ["收成 Σ_x Σ_k Pr(s→x,k,π)", "<span class='k'>不求导，只收集</span>", "<b>状态分布是被「数」出来的，不是被「求导」出来的</b>"], ["η 归一化成 μ", "—", "提出的公因子 = <b>一幕的平均长度</b>"]]}, "res": {"tag": "推断", "ref": "原书 13.2 节与 p325 证明方框（逐步核对渲染图）· 简报 §8「节点级分布无关风险控制：节点 h 的决策改变 h+1 的输入分布，后续节点不可交换」· 简报 §4a deficient support · bridge-threads [0] OPE / batch RL", "v": "<b>这条定理正面回答了你简报 §8 里那个被标成「开放问题」的结构性难题。</b><br>你记下的原话是：<i>Learn-then-Test / conformal risk control 要求校准点与测试点可交换，但<b>节点 h 的决策改变 h+1 的输入分布，后续节点不可交换</b></i>。<span class='k'><b>这正是本页开篇那个困境的你那个版本</b></span>——策略改变了「你会遇到哪些状态」，而那个改变你没法建模。<br><span class='w'><b>定理说：求梯度不需要它。</b></span>∇ 在整个推导里只落在 π 上，从不落在转移核 p 上；状态分布 μ 是从展开项里**收集**出来的，不是**求导**出来的。<b>于是「上游决策改变下游输入分布」这件事，对梯度估计是无害的——它只影响 μ 是什么，不影响公式的形式。</b><br>⇒ <b>但要非常小心地划清这条结论的边界，否则会变成一个假的好消息：</b><br>① <b>定理救的是「优化」，不是「评估」。</b>它告诉你怎么沿着梯度走，<b>没有</b>告诉你怎么在不重跑的情况下估一个新策略的值。简报 §4a 那个 deficient support 的死结<b>一个字都没松动</b>。<br>② <b>μ 必须是 π 下的同策分布。</b>定理是**在策**的结论。你手上是旧日志，<b>一旦 π_e ≠ π_b，Σ_s μ(s) 里的 μ 就不是你能采到的那个</b>，需要离策的策略梯度（见 p18 文献注：Degris, White, and Sutton, 2012；Maei, 2018）。<span class='k'><b>这两篇值得去查——它们正好在你「只有旧数据」的处境上。</b></span><br>③ <b>可交换性那条难题仍然成立，但它是风险控制那一侧的问题，不是梯度那一侧的。</b><b>把这两件事分开写，比笼统地说「序贯依赖让一切都变难」要准确得多</b>——后者会让审稿人以为你没分清楚哪些困难是真的。"}, "link": {"t": "你学过的对应：CS234 L09 精读（策略梯度 II —— 同一条定理在 CS234 里的讲法，那一讲更侧重方差与步长，可对照）", "href": "../../cs234-2019/中文精读/L09-精读.html"}},
{"r": [7, 7], "t": "REINFORCE 的推导：那个「除以概率」不是技巧，是必须", "star": 3, "quote": "<em>So we introduce such a weighting, <b>without changing the equality</b>, by <b>multiplying and then dividing</b> the summed terms by π(a|S_t, θ).</em><br><em>The update increases the parameter vector in this direction <b>proportional to the return</b>, and <b>inversely proportional to the action probability</b>. … The latter makes sense because otherwise <b>actions that are selected frequently are at an advantage</b> (the updates will be more often in their direction) <b>and might win out even if they do not yield the highest return</b>.</em>", "one": "<b>把对动作求和变成「在 π 下取期望再采样」，办法是乘一个 π 再除一个 π——等式不变，但右边变成了可以采样的形式。除以概率这一项不是为了好看：不除，被选得多的动作就白占便宜。</b>", "pts": ["<b>先看这一步在做什么。</b> (13.6) 已经把对<b>状态</b>的求和变成了在 π 下的期望，但对<b>动作</b>的求和还没有——每一项没有被 π(a|S_t,θ) 加权，<span class='k'><b>而「在 π 下取期望」要求的正是这个权重。</b></span><b>于是书做了一件初看像是凑数的事：把求和项乘以 π(a|S_t,θ) 再除以 π(a|S_t,θ)。</b>乘完再除，<b>等式一个字没变</b>，但现在每项带上了正确的权重，整个和就是一个期望。", "<b>有了期望，就能用样本替掉它。</b> 把 a 换成实际采到的 A_t ∼ π，得到 E_π[ q_π(S_t,A_t) · ∇π(A_t|S_t,θ)/π(A_t|S_t,θ) ]。<span class='k'><b>再用 E_π[G_t | S_t, A_t] = q_π(S_t, A_t) 把 q_π 换成回报 G_t</b></span>——这一步是定义，不是近似。<b>到这里，括号里的东西「正是我们需要的：一个每步都能采样、而期望与梯度成正比的量」。</b>", "<b>代进 (13.1) 就是 REINFORCE 的更新式 (13.8)。</b> θ_{t+1} ≐ θ_t + α G_t · ∇π(A_t|S_t,θ_t)/π(A_t|S_t,θ_t)。<b>每次增量正比于两样东西的乘积：回报 G_t，以及「实际采取那个动作的概率的梯度，除以那个概率」。</b><span class='k'><b>后面这个向量的方向，是参数空间里「最能提高将来在 S_t 再次选 A_t 的概率」的方向。</b></span>", "<b>书对这个更新式给了两条直觉，而第二条才是要害。</b> <b>① 正比于回报</b>——合理，因为它让参数朝着「favor 那些带来最高回报的动作」的方向走得最多。<span class='w'><b>② 反比于动作概率——这一条解释了为什么必须有那个分母。</b></span><b>不除的话，「被选得频繁的动作就占了便宜」</b>（更新会更经常地朝它们的方向走），<b>「于是它们可能胜出，哪怕它们并不带来最高的回报」。</b>", "<b>⚠ 请把第二条直觉和重要性采样并排放，它们是同一件事的两个说法。</b> 1/π(A_t|S_t,θ) 这个因子在算法上就是一个重要性权重：<span class='k'><b>它把「这个动作被采到的频率」从估计量里除掉，只留下「它值多少」。</b></span><b>差别在于 REINFORCE 是<b>在策</b>的——分母里的 π 和采样用的 π 是同一个，所以这个比值不会爆炸。</b><b>一旦分子分母是两个不同的策略，这就变成了标准的 IS，方差问题随之而来。</b>右边的科研格说明这对你的日志意味着什么。", "<b>REINFORCE 用的是完整回报，这决定了它的适用范围。</b> G_t 包含从 t 起直到幕结束的全部奖励，<span class='w'><b>所以 REINFORCE 是蒙特卡洛方法，「只对分幕情形有定义，而且所有更新都要等一幕走完之后回过头来做」</b></span>（和第 5 章那些蒙特卡洛算法一样）。<b>这不是实现上的不便，是定义上的限制。</b>", "<b>最后一段解释了伪代码为什么长得不一样。</b> 伪代码里写的是 ∇ln π(A_t|S_t,θ_t)，而 (13.8) 写的是 ∇π/π。<span class='k'><b>两者等价，依据是恒等式 ∇ln x = ∇x / x。</b></span><b>这个向量在文献里有好几个名字，书统一叫它<b>资格向量</b>（eligibility vector），并且特别指出：它是整个算法里<b>唯一</b>出现策略参数化的地方。</b>⚠ 顺带一个排印细节：本页正文把 Williams 误排成 “Willams, 1992”，p18 的文献表里是对的——逐字引用时别跟着错。"], "eq": "把对动作的求和变成期望（照 ch13.pdf p7 渲染图抄）：\n\n   ∇J(θ) ∝ E_π[ Σ_a π(a|S_t,θ) q_π(S_t,a) · ∇π(a|S_t,θ) / π(a|S_t,θ) ]\n                      ↑ 乘一个 π ↑              ↑ 除一个 π ↑\n                      等式不变，但右边成了「在 π 下的期望」\n\n         = E_π[ q_π(S_t,A_t) · ∇π(A_t|S_t,θ) / π(A_t|S_t,θ) ]\n                                      （把 a 换成样本 A_t ∼ π）\n         = E_π[ G_t · ∇π(A_t|S_t,θ) / π(A_t|S_t,θ) ]\n                                      （因为 E_π[G_t|S_t,A_t] = q_π(S_t,A_t)）\n\nREINFORCE 更新（13.8）：\n\n                              ∇π(A_t|S_t, θ_t)\n   θ_{t+1} ≐ θ_t + α G_t ────────────────────\n                               π(A_t|S_t, θ_t)\n\n   正比于 **回报**        → 朝带来最高回报的动作走得最多\n   反比于 **动作概率**    → 不除的话，选得频繁的动作白占便宜，\n                            「可能胜出，哪怕它们并不带来最高回报」\n\n资格向量（伪代码里的写法）：\n   ∇ln π(A_t|S_t,θ_t) = ∇π(A_t|S_t,θ_t) / π(A_t|S_t,θ_t)\n   依据：∇ln x = ∇x / x\n   ⚠ 这是整个算法里**唯一**出现策略参数化的地方\n\n⚠ G_t 是**完整回报** ⇒ 蒙特卡洛 ⇒ 只对分幕情形有定义，\n   且所有更新都要等一幕走完之后回过头来做", "tbl": {"head": ["更新式里的因子", "作用", "去掉会怎样"], "rows": [["G_t（回报）", "决定这次更新<b>往哪个方向、走多远</b>", "没有学习信号"], ["∇π(A_t|S_t,θ)", "参数空间里<b>最能提高「再次选 A_t」概率</b>的方向", "不知道该动哪个参数"], ["<b>÷ π(A_t|S_t,θ)</b>", "<b>把「被采到的频率」除掉，只留「它值多少」</b>", "<span class='w'>选得频繁的动作白占便宜，可能胜出哪怕回报不是最高</span>"], ["α（步长）", "吸收掉定理里那个比例常数", "—"], ["⚠ 这个分母本质上是", "<b>一个重要性权重</b>", "<b>在策时分子分母同一个 π，不会爆炸；离策时就是标准 IS</b>"]]}, "res": {"tag": "推断", "ref": "原书 13.3 节（逐句核对渲染图 p7）· 简报 §4a deficient support · 简报 §4b「ESS = m，E[m] = n·2^(−k)」· 简报 §9 动作 2", "v": "<b>那个分母 1/π(A_t|S_t,θ) 就是重要性权重，而书给它的理由值得你直接借用。</b><br><span class='k'><b>书的说法是「不除的话，被选得频繁的动作就占了便宜，可能胜出哪怕它们并不带来最高回报」。</b></span><b>翻译到你的日志上：如果你的节点执行器按某个非均匀的倾向性采样档位，而你在统计时不除以那个倾向性，你量到的就不是「哪个档位好」，而是「哪个档位被跑得多」。</b><br><span class='w'><b>⚠ 但这里有个关键区别，不说清楚会把这条用错：</b></span><b>REINFORCE 是<b>在策</b>的——分母里的 π 和采样用的 π 是同一个</b>，所以这个比值天然有界、不会爆炸。<b>你的处境是离策：分子是候选策略 π_e、分母是行为策略 π_b，于是它变成标准 IS，简报 §4b 那个 ESS = n·2^(−k) 的坍塌立刻回来。</b><br>⇒ <b>可用的三条：</b><br>① <b>记倾向性的理由比「为了做 OPE」更基本。</b>即使你完全不做离策评估、只想诚实地比较两个档位在日志里的表现，<b>不除以倾向性的统计就是有偏的</b>——这是 REINFORCE 分母的同一条理由。<br>② <b>倾向性要记成<b>分布</b>，不是记成「实际选了哪个」。</b>简报 §9 动作 2 写的是「加 propensity 采样与记录」，<span class='k'><b>这里补一条具体要求：要存下当时那个 π_b(·|h) 的完整向量，而不只是 argmax。</b></span><b>只记实际 model id 的日志，事后补不出分母。</b><br>③ <b>先降有效时域再谈这个分母</b>（简报 §4c）：k 从 10 降到 4，分母的乘积从 2¹⁰ 降到 2⁴，<b>这是让 IS 从「无意义」回到「有意义」的前提，不是锦上添花。</b>"}},
{"r": [8, 8], "t": "伪代码、资格向量，和那个迟到了十六年的 γᵗ", "star": 2, "quote": "<em>This vector has been given several names and notations in the literature; we will refer to it simply as the <b>eligibility vector</b>. Note that it is <b>the only place that the policy parameterization appears</b> in the algorithm.</em><br><em>The second difference between the pseudocode update and the REINFORCE update equation (13.8) is that the former includes <b>a factor of γ^t</b>. This is because … in the text we are treating the non-discounted case (γ = 1) while in the boxed algorithms we are giving the algorithms for <b>the general discounted case</b>.</em>", "one": "<b>伪代码只有四行实质内容：走一幕、逐步算 G、用资格向量更新 θ。多出来的 γᵗ 不是笔误——正文假设不打折，方框给的是一般的打折版本。而这个因子的历史比它看起来有意思。</b>", "pts": ["<b>先把伪代码读薄。</b> 输入是一个<b>可微</b>的策略参数化 π(a|s,θ)，唯一的算法参数是步长 α > 0，θ ∈ R^d′ 初始化（例如全零）。主循环永远跑：<b>按当前策略 π(·|·,θ) 生成一整幕</b> S₀,A₀,R₁,…,S_{T−1},A_{T−1},R_T，然后<b>对这一幕的每一步 t = 0,1,…,T−1</b>，算出 G ← Σ_{k=t+1}^{T} γ^{k−t−1} R_k（即 G_t），再做 θ ← θ + α γ^t G ∇ln π(A_t|S_t,θ)。", "<b>「生成一整幕」和「回过头逐步更新」这两件事的顺序，是蒙特卡洛的签名。</b> <span class='k'><b>必须先走完，才能算 G_t</b></span>——而这一点在 13.5 节会被 actor–critic 打破（那边是完全在线增量的，状态、动作、奖励来一个处理一个，处理完再也不回头）。<b>把这两个伪代码并排看，差别一目了然。</b>", "<b>资格向量 ∇ln π(A_t|S_t,θ_t) 值得单独记住，理由是书自己点出的那句。</b> <span class='w'><b>「注意：它是整个算法里唯一出现策略参数化的地方。」</b></span><b>也就是说，换一种策略参数化——线性偏好、深度网络、高斯分布——需要改的只有这一个向量怎么算，算法的其余部分一个字不动。</b>13.7 节处理连续动作时正是这么做的（习题 13.4 给了高斯参数化下的两部分资格向量）。", "<b>γᵗ 这个因子是本页第二个值得停一下的地方。</b> 它出现的原因很朴素：<b>正文一律假设 γ = 1（不打折），而方框里的伪代码给的是一般的打折版本</b>。<span class='k'><b>书的措辞是：打折情形下所有想法都走得通，只是要做相应调整（包括第 199 页那个方框），但会带来「分散主线的额外复杂度」。</b></span><b>习题 13.2 就是请读者自己把 (13.5)、它的证明和推出 (13.8) 的那几步都推广到带 γᵗ 的版本。</b>", "<b>⚠ 而这个因子的来历，是一个很好用的例子。</b> p18 的文献注写着：<b>Thomas (2014) 才<b>首次意识到</b>，本章方框算法里那个 γᵗ 因子在打折分幕问题下是<b>必需</b>的。</b><span class='w'><b>也就是说：这条被写进教科书、被无数人实现过的算法，在打折情形下少了一项，直到 2014 年才被指出。</b></span><b>（REINFORCE 本身出自 Williams 1987/1992。）</b><b>这是「公开的、被反复复现的算法里仍可能藏着系统性错误」的一个现成引文。</b>", "<b>图 13.1 给出了 REINFORCE 在短走廊上的表现，有一个细节别读漏。</b> 三条曲线对应 α = 2⁻¹²、2⁻¹³、2⁻¹⁴，纵轴是每幕总奖励（100 次运行的平均），横轴是幕数（到 1000）。<span class='k'><b>书的说法是「步长选得好时，每幕总奖励趋近起始状态的最优值」。</b></span><b>⚠ 注意这句话的条件句——「With a good step size」。三个相差一倍的步长给出明显不同的曲线，而这还是在一个三状态玩具上。</b>"], "eq": "REINFORCE 伪代码（蒙特卡洛策略梯度控制 · 分幕）：\n\n   输入：可微的策略参数化 π(a|s,θ)\n   参数：步长 α > 0\n   初始化 θ ∈ R^d′（例如全零）\n   永远循环（每幕）：\n       按 π(·|·,θ) 生成一整幕  S₀, A₀, R₁, …, S_{T−1}, A_{T−1}, R_T\n       对这一幕每一步 t = 0, 1, …, T−1：\n           G ← Σ_{k=t+1}^{T} γ^{k−t−1} R_k            （即 G_t）\n           θ ← θ + α γ^t G ∇ln π(A_t|S_t, θ)\n\n⚠ 必须**先走完一幕**才能算 G_t —— 这是蒙特卡洛的签名\n   （13.5 节的 actor–critic 打破这一点：完全在线增量，处理完不回头）\n\n资格向量：\n   ∇ln π(A_t|S_t, θ_t)\n   ⚠ **整个算法里唯一出现策略参数化的地方**\n   ⇒ 换参数化（线性 / 深网 / 高斯）只改它，其余一个字不动\n\n那个 γ^t：\n   正文假设 γ = 1（不打折）；方框给**一般的打折版本** ⇒ 多一个 γ^t\n   ⚠ **Thomas (2014) 才首次意识到**打折分幕下这一项是必需的\n      （REINFORCE 本身出自 Williams 1987/1992）\n\n图 13.1：α = 2⁻¹², 2⁻¹³, 2⁻¹⁴ 三条线，纵轴每幕总奖励（100 次运行平均）\n   ⚠ 书的原话带条件：**With a good step size**, … approaches the optimal value", "tbl": {"head": ["", "REINFORCE（本页）", "actor–critic（13.5 节）"], "rows": [["什么时候更新", "<span class='w'>一幕走完之后回过头逐步做</span>", "<b>每一步当场做</b>"], ["要不要存整幕", "<b>要</b>（算 G_t 需要后续全部奖励）", "<b>不要</b>，处理完不回头"], ["目标用什么", "完整回报 G_t", "一步回报 G_{t:t+1}"], ["偏差 / 方差", "<b>无偏 · 高方差</b>", "<b>有偏 · 低方差</b>"], ["适用范围", "<span class='w'>只对分幕情形有定义</span>", "分幕与持续都行"]]}, "res": {"tag": "已核", "ref": "原书 13.3 节方框与其后两段 · p18 文献注（「Thomas (2014) first realized …」逐字核对）", "v": "<b>γᵗ 那条历史是你写「为什么坚持自己重跑基线」时最省力的一个引文。</b><br><span class='k'><b>事实本身：REINFORCE 出自 1987/1992，而方框算法在打折分幕情形下缺了一个 γᵗ 因子，直到 <b>Thomas (2014)</b> 才被指出。</b></span><b>中间隔了二十多年，而这期间它被写进教科书、被无数实现复制。</b><br>⇒ <b>怎么用这条：</b>审稿人问「你为什么不直接引用 AFlow 论文里报告的基线数字，非要自己重跑一遍、还要报 GPU-秒和峰值显存」时，<b>这条给你一个不带攻击性的回答</b>：<i>连 Sutton & Barto 方框里的标准算法都曾在一个具体设定下缺项二十年；我们没有理由假设一个两年前的工作流搜索实现在我们的硬件与成本口径下是逐项可比的。</i><br><span class='w'><b>⚠ 注意分寸：这条是用来说明「重跑是尽职，不是不信任」，不是用来暗示别人的工作有错。</b></span><b>简报 §7 第 5 拳（「成本口径不可信」）正要求你报 token 数 + GPU-秒 + 峰值显存归一吞吐、写明 TP 配置与量化，这条引文给那一段提供了正当性。</b><br><b>另外本页还有一条可直接搬的：资格向量是「整个算法里唯一出现策略参数化的地方」。</b><span class='k'><b>如果你最后真要上策略梯度，这意味着「换一种档位集合的参数化」（例如简报 §7 第 3 拳建议的加宽到 7B greedy / SC k=3 / k=8 / 72B / prune）只需要改这一个向量，算法骨架不动。</b></span>"}},
{"r": [9, 9], "t": "基线：一行证明说它不引入偏差，而它该随状态变", "star": 3, "quote": "<em>The baseline can be <b>any function, even a random variable</b>, as long as it <b>does not vary with a</b>; the equation remains valid because the subtracted quantity is zero:</em><br><em>Σ_a b(s)∇π(a|s,θ) = b(s)∇Σ_a π(a|s,θ) = b(s)∇1 = 0.</em><br><em>In general, the baseline <b>leaves the expected value of the update unchanged</b>, but it can have <b>a large effect on its variance</b>. … In the bandit algorithms the baseline was just a number …, but <b>for MDPs the baseline should vary with state</b>.</em>", "one": "<b>减掉一个只依赖状态的基线，梯度的期望一个字不变——因为减掉的那一项恒等于零，证明只有一行。但方差可以差很多。而书特别强调：在 MDP 里基线必须随状态变，一个全局常数不够。</b>", "pts": ["<b>先把上一节的结论收尾：REINFORCE 的收敛性质是好的，问题在方差。</b> 作为随机梯度方法，<b>它「按构造」保证一幕上的期望更新方向与性能梯度同向</b>，<span class='k'><b>于是 α 足够小时期望性能必然改善，α 按标准随机逼近条件递减时收敛到局部最优。</b></span><span class='w'><b>「然而，作为一个蒙特卡洛方法，REINFORCE 可能方差很大，因而学得很慢。」</b></span><b>本节要治的就是这个「然而」。</b>", "<b>顺带记一下习题 13.3 的结论，它在 13.7 节还会用到。</b> 在 soft-max 偏好 (13.2) 配线性偏好 (13.3) 下，资格向量有闭式：∇ln π(a|s,θ) = x(s,a) − Σ_b π(b|s,θ) x(s,b)。<span class='k'><b>读法很直观：当前动作的特征，减去「按当前策略加权的平均特征」</b></span>——<b>这本身就已经是一个「减去基线」的形状了，只不过减的是特征不是回报。</b>", "<b>基线的引入方式很轻：把 (13.5) 里的 q_π(s,a) 换成 q_π(s,a) − b(s)，得到 (13.10)。</b> <b>b 可以是任意函数，甚至是一个随机变量</b>，<span class='w'><b>条件只有一个：它不随动作 a 变化。</b></span>", "<b>为什么能这么换？因为减掉的那一项恒等于零，而证明只有一行。</b> <span class='k'><b>Σ_a b(s)∇π(a|s,θ) = b(s)∇Σ_a π(a|s,θ) = b(s)∇1 = 0</b></span><b>——b 与 a 无关所以能提到求和外面；π 对所有动作求和恒等于 1；常数的梯度是零。</b><b>⚠ 请盯住第一步：「b 与 a 无关」正是它能提出去的理由。一旦 b 里混进了动作，这一步立刻失效，后面两步无从谈起。</b>", "<b>于是得到带一般基线的 REINFORCE 更新 (13.11)。</b> θ_{t+1} ≐ θ_t + α (G_t − b(S_t)) ∇π(A_t|S_t,θ_t)/π(A_t|S_t,θ_t)。<span class='k'><b>因为 b 可以恒等于零，这是 REINFORCE 的严格推广，不是另一个算法。</b></span><b>总体上：基线不改变更新的期望值，但能大幅影响它的方差。</b>", "<b>⚠ 本页最容易被读快的一段，恰恰是对你最有用的一段：基线该有多细。</b> 书先回顾 2.8 节——<b>在老虎机里基线就是一个数（迄今所见奖励的平均）</b>；<span class='w'><b>「但对 MDP，基线应当随状态变化。」</b></span>理由书说得很具体：<b>「在有些状态下所有动作的值都高，我们需要一个高的基线，才能把值更高的动作和值较低的动作区分开；在另一些状态下所有动作的值都低，这时合适的是一个低基线。」</b>", "<b>把这段话反过来读，就知道基线不够细会怎样。</b> <b>如果所有状态共用一个基线，那么在「普遍高值」的状态里，G_t − b 对每个动作都是大正数——更新会把这些动作<b>一起</b>推高，而它们之间的差别被淹没了。</b><span class='k'><b>换句话说：基线不够细时，梯度携带的信息从「哪个动作更好」退化成「这个状态本身好不好」。</b></span><b>而后者对改进策略毫无用处，因为状态不是你选的。</b><b>自然的选择是拿状态值的估计 v̂(S_t,w) 当基线，w 用前面几章任一方法学。</b>"], "eq": "带基线的策略梯度定理（13.10）：\n\n   ∇J(θ) ∝ Σ_s μ(s) Σ_a ( q_π(s,a) − b(s) ) ∇π(a|s,θ)\n\n   b 可以是**任意函数，甚至随机变量**，条件只有一个：**不随 a 变化**\n\n为什么无偏（整个证明就这一行）：\n\n   Σ_a b(s) ∇π(a|s,θ) = b(s) ∇ Σ_a π(a|s,θ) = b(s) ∇1 = 0\n        ↑ b 与 a 无关         ↑ 概率和恒为 1      ↑ 常数的梯度\n        **所以能提出求和**                        **是零**\n   ⚠ 第一步是关键：b 里一旦混进动作，整条就断了\n\n带一般基线的 REINFORCE（13.11）：\n\n                                       ∇π(A_t|S_t, θ_t)\n   θ_{t+1} ≐ θ_t + α ( G_t − b(S_t) ) ────────────────────\n                                        π(A_t|S_t, θ_t)\n\n   b ≡ 0 时退回 (13.8) ⇒ 这是**严格推广**，不是另一个算法\n   基线**不改变更新的期望**，但**大幅影响方差**\n\n资格向量的闭式（习题 13.3，soft-max + 线性偏好）：\n   ∇ln π(a|s,θ) = x(s,a) − Σ_b π(b|s,θ) x(s,b)\n   （当前动作的特征 − 按当前策略加权的平均特征）\n\n⚠ 基线该有多细：\n   老虎机（2.8 节）：基线就是**一个数**（迄今奖励的平均）\n   MDP            ：基线**必须随状态变**\n     所有动作都高值的状态 → 要高基线，才能把高的和较低的区分开\n     所有动作都低值的状态 → 要低基线\n   ⇒ 不够细时，梯度从「哪个动作更好」退化成「这个状态好不好」", "tbl": {"head": ["基线的粒度", "在哪里够用", "不够细会怎样"], "rows": [["一个全局常数", "<b>老虎机</b>（2.8 节：迄今奖励的平均）", "—"], ["随<b>状态</b>变 b(s)", "<b>MDP</b>（本节的要求）", "<span class='w'>高值状态里所有动作被一起推高，动作间的差别被淹没</span>"], ["随动作变 b(s,a)", "<span class='w'>那一行证明立刻失效</span>", "需要 Thomas & Brunskill (2017) 另行论证"], ["自然的选择", "<b>v̂(S_t, w)</b>，w 用前面几章任一方法学", "—"], ["⚠ 基线买到的是", "<b>方差</b>", "<b>期望一个字不变</b>（一行证明）"]]}, "res": {"tag": "推断", "ref": "原书 13.4 节（逐句核对渲染图 p9）· 简报 §4e「估计量要拆成两半」· 简报 §8 开放问题「难度是 query 的属性，还是 (query, 节点, 部分轨迹) 三元组的属性」", "v": "<b>「基线该有多细」这个问题，就是你那条开放问题的可操作版本。</b><br>简报 §8 问的是：<i>难度是 query 的属性，还是 (query, 节点, 部分轨迹) 三元组的属性？这是整个路由文献里 H=1 vs H>1 建模选择的底层经验问题，<b>从未被干净地隔离过</b>。</i><br><span class='k'><b>而本页说的是同一件事：基线要细到能把「这个状态本身好不好」和「在这个状态里哪个动作更好」分开。</b></span><br><b>映射到你的问题：</b><br><b>「状态值高」= 这条 query 容易</b>——几乎所有配置都做对，<span class='w'><b>于是 Acc 的差异里几乎没有「配置选得好不好」的信息。</b></span><br><b>「状态值低」= 这条 query 太难</b>——所有配置都做错，同样没有信息。<br><b>不减基线的话，你的梯度（或任何「哪个配置更好」的统计）会被 query 难度的方差主导，而难度不是你能选的。</b><br>⇒ <b>三条可直接做的：</b><br>① <b>基线至少要 per-query。</b>最省事的版本：用该 query 上所有已跑配置的平均准确率当 b(x)，再看 G − b。<b>这是教科书里那条「基线必须随状态变」的直接落地，而且按那一行证明它是无偏的。</b><br>② ⭐ <b>基线需要的粒度本身就是一个可测的量，而它恰好回答简报 §8 那个问题。</b><span class='k'><b>做法：分别用 per-query 基线和 per-(query, 节点) 基线，比较同样数据下估计量的方差。</b></span><b>若后者没有显著降低方差，说明难度基本是 query 的属性（支持 P2、支持可加性那一侧）；若显著降低，说明难度确实依赖节点与部分轨迹（支持 P3、支持序贯形式化）。</b><b>这比「P3 比 P2 准确率高多少」更灵敏——方差的差别通常比均值的差别先显出来。</b><br>③ ⚠ <b>注意边界：你的成本那一半用不上这条。</b>成本有分布模型、逐节点可加（简报 §4e），<b>它的「基线」就是回归本身，不存在「被 query 难度淹没」的问题。这条只对准确率那一半成立。</b>"}, "link": {"t": "你学过的对应：CS234 L09 精读（策略梯度 II —— 基线与方差缩减在那一讲里讲得更细，可以对照看两种讲法）", "href": "../../cs234-2019/中文精读/L09-精读.html"}},
{"r": [10, 10], "t": "两个步长：一个有经验法则，另一个没有", "star": 2, "quote": "<em>This algorithm has two step sizes, denoted α^θ and α^w … <b>Choosing the step size for values (here α^w) is relatively easy</b>; in the linear case we have rules of thumb for setting it, such as α^w = 0.1 / E[‖∇v̂(S_t,w)‖²_μ] (see Section 9.6). <b>It is much less clear how to set the step size for the policy parameters, α^θ</b>, whose best value depends on <b>the range of variation of the rewards</b> and on <b>the policy parameterization</b>.</em>", "one": "<b>加了基线就有两个步长。值那一边有现成的经验法则，策略那一边没有——而它的最优值同时取决于奖励的变化幅度和策略参数化，两个都是问题相关的。</b>", "pts": ["<b>伪代码只比上一个多了三行，但结构变了。</b> 多出来的输入是一个可微的状态值参数化 v̂(s,w)，多出来的参数是两个步长 α^θ、α^w。每一步先算 G（还是完整回报），再算 <b>δ ← G − v̂(S_t,w)</b>，然后<b>两条更新并行</b>：w ← w + α^w δ ∇v̂(S_t,w)，θ ← θ + α^θ γ^t δ ∇ln π(A_t|S_t,θ)。<span class='k'><b>注意 δ 被两条更新共用：对 w 它是预测误差，对 θ 它是「比基线好多少」。</b></span>", "<b>因为 w 也用蒙特卡洛学，这个算法仍然是「等一幕走完再回头」的。</b> 书说得很自然：<b>既然 REINFORCE 本来就是用蒙特卡洛学 θ，那么用蒙特卡洛来学状态值权重 w 也就顺理成章。</b><span class='w'><b>⚠ 这一点下一节会变：actor–critic 的 critic 是自举学的，整个算法也就变成完全在线增量的。</b></span>", "<b>两个步长的难度不对称，这是本页真正的信息。</b> <span class='k'><b>值那一边（α^w）相对容易</b></span>：线性情形有经验法则，书给的是 α^w = 0.1 / E[‖∇v̂(S_t,w)‖²_μ]（见 9.6 节）——<b>分母是梯度范数平方在同策分布下的期望，可以直接从数据估。</b>", "<span class='w'><b>而策略那一边（α^θ）「就不清楚该怎么设了」。</b></span>书给的理由有两条，<b>而且两条都是问题相关、没法先验给定的</b>：<b>① 它取决于奖励的变化幅度</b>——奖励尺度一变，最优步长就跟着变；<b>② 它取决于策略参数化</b>——换一种偏好函数的形式，合适的步长也不同。<b>这是一条很诚实的交代：教科书在这里没有给法则，因为确实没有。</b>", "<b>图 13.2 把基线的效果量化了，而其中一个细节比曲线本身更说明问题。</b> 两条线：plain REINFORCE 用 α = 2⁻¹³，带基线的用 α^θ = 2⁻⁹、α^w = 2⁻⁶。<span class='k'><b>⚠ 注意 2⁻⁹ 与 2⁻¹³ 差了 16 倍。</b></span><b>也就是说：基线带来的加速，机制上是「允许你用大得多的策略步长而不发散」。</b><b>方差降下来之后，你才敢迈大步。</b>", "<b>⚠ 图注里还有一句话，是做公平比较的范例。</b> <b>「这里 plain REINFORCE 用的步长，是它表现最好的那个（取到最近的 2 的幂）。」</b><span class='w'><b>也就是说：对照组是调优过的，不是随手设一个让它难看。</b></span><b>这正是简报 §7 第 6 拳要防的那类问题的反面教材——一个「我方调优、对照组默认参数」的比较，在统计上说明不了任何事。</b><b>另外 13.5 节开头补了一句实现细节：图 13.2 里基线用的 v̂(s,w) = w，也就是 w 只有一个分量——在那个三状态玩具上，基线就是一个标量。</b>"], "eq": "带基线的 REINFORCE 伪代码（分幕）：\n\n   输入：可微的策略参数化 π(a|s,θ)\n   输入：可微的状态值参数化 v̂(s,w)\n   参数：步长 α^θ > 0, α^w > 0\n   初始化 θ ∈ R^d′, w ∈ R^d（例如全零）\n   永远循环（每幕）：\n       按 π(·|·,θ) 生成一整幕 S₀, A₀, R₁, …, S_{T−1}, A_{T−1}, R_T\n       对每一步 t = 0, 1, …, T−1：\n           G ← Σ_{k=t+1}^{T} γ^{k−t−1} R_k          （即 G_t）\n           δ ← G − v̂(S_t, w)\n           w ← w + α^w δ ∇v̂(S_t, w)\n           θ ← θ + α^θ γ^t δ ∇ln π(A_t|S_t, θ)\n\n   ⚠ δ 被两条更新共用：\n        对 w 它是**预测误差**\n        对 θ 它是**「比基线好多少」**\n\n两个步长的难度不对称：\n   α^w  **相对容易**  线性情形有经验法则（9.6 节）：\n                      α^w = 0.1 / E[ ‖∇v̂(S_t,w)‖²_μ ]\n   α^θ  **就不清楚了**  最优值取决于\n                      ① 奖励的变化幅度\n                      ② 策略参数化\n                      —— 两个都是问题相关、无法先验给定\n\n图 13.2：\n   plain REINFORCE   α   = 2⁻¹³\n   带基线            α^θ = 2⁻⁹ ，α^w = 2⁻⁶\n   ⚠ 2⁻⁹ 与 2⁻¹³ 差 **16 倍** ⇒ 基线的加速机制是\n      「方差降下来之后，你才敢迈大步」\n   ⚠ 图注：plain REINFORCE 用的是**它表现最好的那个步长**\n      （取到最近的 2 的幂）—— 对照组是**调优过**的\n   ⚠ 13.5 节开头补：图里基线用 v̂(s,w) = w，w 只有**一个分量**", "tbl": {"head": ["", "α^w（值）", "α^θ（策略）"], "rows": [["书的评价", "<b>relatively easy</b>", "<span class='w'>much less clear</span>"], ["有没有法则", "<b>线性情形有</b>：0.1 / E[‖∇v̂‖²_μ]（9.6 节）", "<span class='w'>没有</span>"], ["取决于什么", "梯度范数平方的期望，<b>可从数据估</b>", "<b>奖励的变化幅度</b> + <b>策略参数化</b>，都是问题相关"], ["图 13.2 里取值", "2⁻⁶", "2⁻⁹（而 plain REINFORCE 是 2⁻¹³）"], ["⇒ 基线的加速机制", "—", "<b>允许大 16 倍的策略步长而不发散</b>"]]}, "res": {"tag": "推断", "ref": "原书 13.4 节方框后两段与图 13.2 图注（逐句核对）· 13.5 节首段（v̂(s,w)=w）· 简报 §7 第 6 拳「提升在统计上是真的吗」", "v": "<b>图 13.2 的图注是一个现成的、可以照抄的公平比较范例，值得单独记。</b><br><span class='k'><b>原话：The step size used here for plain REINFORCE is <b>that at which it performs best</b> (to the nearest power of two; see Figure 13.1).</b></span><br><b>也就是说：在展示「加基线更快」之前，作者先把对照组的步长扫了一遍，取它表现最好的那个。</b><span class='w'><b>这是在主动消除一个最廉价的质疑——「你是不是给对照组设了个烂参数」。</b></span><br>⇒ <b>对你的直接要求：</b>简报 §7 第 6 拳说「提升落在种子方差内」是最致命且<b>完全可预防</b>的评语。<b>而「对照组没调优」是同一类问题里更便宜的一种——它甚至不需要统计量就能被质疑。</b><br><b>具体到你的实验：</b>要展示「节点级保真度分配」胜过 all-strong / all-weak 基线时，<b>基线那一侧凡是有可调的东西（温度、self-consistency 的 k、提示版本）都要扫一遍取最好的那个，并且在图注里写明「基线用的是它表现最好的设置」。</b><br><b>另一条可用的：α^θ 没有经验法则。</b><span class='k'><b>书说它取决于「奖励的变化幅度」与「策略参数化」。</b></span><b>你的「奖励」是 G = Acc − λ·Cost，而 λ 本身就是你在扫的超参——这意味着换一个 λ，奖励的尺度就变了，最优策略步长也跟着变。</b><b>⚠ 如果你最后真上策略梯度，别在扫 λ 的同时固定步长：那会把「λ 的影响」和「步长不合适的影响」搅在一起，而后者看起来会很像前者。</b>"}},
{"r": [11, 11], "t": "基线与 critic 的界线：看值函数用在转移的第一个状态还是第二个", "star": 3, "quote": "<em>In REINFORCE with baseline, the learned state-value function estimates the value of the <b>first</b> state of each state transition. This estimate sets a baseline for the subsequent return, but is <b>made prior to the transition’s action and thus cannot be used to assess that action</b>. In actor–critic methods, on the other hand, the state-value function is applied also to the <b>second</b> state of the transition.</em><br><em>Note that <b>the bias in the gradient estimate is not due to bootstrapping as such</b>; the actor would be biased <b>even if the critic was learned by a Monte Carlo method</b>.</em>", "one": "<b>判据不是「有没有用值函数」，也不是「有没有自举」，而是「值函数有没有用到转移之后的那个状态」。用在前一个状态只是基线；用到后一个状态，它才开始评判动作，才叫 critic。</b>", "pts": ["<b>先把这条界线划清楚，因为它很容易被说成「用了值函数就是 actor–critic」。</b> <b>带基线的 REINFORCE 里，v̂ 估的是每次转移的<b>第一个</b>状态的值。</b><span class='k'><b>书给的理由很精确：这个估计是在「该转移的动作发生之前」做出的，因此<b>没法用来评判那个动作</b>。</b></span><b>它只是给随后的回报设了一个参照，仅此而已。</b>", "<b>actor–critic 改的只有一件事：把 v̂ 也用到转移的<b>第二个</b>状态上。</b> 第二个状态的估值，打折之后加上奖励，构成<b>一步回报</b> G_{t:t+1}。<span class='w'><b>而这个量「<b>确实</b>是一种评判该动作的办法」——因为它用上了动作发生之后才知道的信息。</b></span><b>书用斜体强调了那个 <i>is</i>，对比的正是上一段的 cannot。</b>", "<b>为什么值得这么做？因为一步回报通常更好用，尽管它有偏。</b> <b>书的说法是：正如全书的 TD 学习所见，一步回报在<b>方差</b>与<b>计算上的便利</b>两方面常常优于实际回报，<b>即使它引入了偏差</b>。</b><span class='k'><b>而偏差的程度是可以调的：用 n 步回报或资格迹（第 7、12 章）就能灵活地调节它。</b></span><b>于是 REINFORCE 与一步 actor–critic 是同一条谱的两端，中间是连续的。</b>", "<b>⚠ 本页最容易被漏掉、而又最该记住的一句，是关于偏差从哪来的。</b> <span class='w'><b>「注意：梯度估计里的偏差<b>并不是自举本身</b>造成的；即使 critic 是用蒙特卡洛方法学的，actor 仍然是有偏的。」</b></span><b>这句话堵死了一个很自然、也很常见的误解：以为「我不用自举就无偏了」。</b><b>偏差的来源是「拿一个<b>学到的</b>值函数去评判动作」这件事本身——学得准不准、用什么方法学，都不改变它是一个估计这个事实。</b>", "<b>一步 actor–critic 的形式很干净，是第 6 章 TD(0) / Sarsa(0) / Q-learning 的类比物。</b> <span class='k'><b>它的主要吸引力是：完全在线、增量，同时又避开了资格迹的复杂度。</b></span><b>做法就是把 (13.11) 里的完整回报换成一步回报，并用学到的状态值函数当基线。</b>(13.12) → (13.13) → (13.14) 是同一个式子的三种写法，最后收成 θ_{t+1} ≐ θ_t + α δ_t ∇π(A_t|S_t,θ_t)/π(A_t|S_t,θ_t)，其中 δ_t 就是那个熟悉的 TD 误差。", "<b>配套的值函数学法是半梯度 TD(0)，而整个算法的性质随之改变。</b> <span class='w'><b>书特别点出：它现在是一个<b>完全在线、增量</b>的算法，状态、动作、奖励来一个处理一个，<b>处理完再也不回头</b>。</b></span><b>和上一页那个「必须先走完一幕」的 REINFORCE 对照，这是一个实质的改变——不是效率上的，是适用范围上的：持续性问题不再需要被切成幕。</b>"], "eq": "判据（本节的要害）：\n\n   带基线的 REINFORCE    v̂ 用在转移的**第一个**状态\n                         在动作**之前**做出 ⇒ **没法评判那个动作**\n                         ⇒ 只是**基线**\n   actor–critic          v̂ **也**用到转移的**第二个**状态\n                         构成一步回报 G_{t:t+1} ⇒ **确实**是评判动作的办法\n                         ⇒ 才叫 **critic**\n\n一步 actor–critic（照 ch13.pdf p11 渲染图抄）：\n\n                                        ∇π(A_t|S_t, θ_t)\n   θ_{t+1} ≐ θ_t + α( G_{t:t+1} − v̂(S_t,w) ) ───────────────   (13.12)\n                                         π(A_t|S_t, θ_t)\n\n           = θ_t + α( R_{t+1} + γ v̂(S_{t+1},w) − v̂(S_t,w) ) ·\n                                 ∇π(A_t|S_t,θ_t) / π(A_t|S_t,θ_t)   (13.13)\n\n                      ∇π(A_t|S_t, θ_t)\n           = θ_t + α δ_t ─────────────────                        (13.14)\n                       π(A_t|S_t, θ_t)\n\n   配套的值函数学法：**半梯度 TD(0)**\n   ⇒ 完全**在线、增量**；状态/动作/奖励来一个处理一个，**处理完不回头**\n\n⚠ 偏差从哪来（本节最易漏的一句）：\n   「梯度估计里的偏差**并不是自举本身**造成的；\n     即使 critic 是用**蒙特卡洛**方法学的，actor **仍然是有偏的**。」\n   ⇒ 来源是「拿一个**学到的**值函数去评判动作」这件事本身\n\n偏差程度可调：一步回报 ↔ n 步回报 ↔ 资格迹 ↔ 完整回报（第 7、12 章）", "tbl": {"head": ["", "带基线的 REINFORCE", "actor–critic"], "rows": [["v̂ 用在哪个状态", "转移的<b>第一个</b>", "<b>也用到第二个</b>"], ["相对动作的时序", "<span class='w'>在动作之前</span>", "<b>在动作之后</b>"], ["能不能评判那个动作", "<span class='w'>不能</span>（cannot）", "<b>能</b>（<i>is</i> a way of assessing）"], ["目标", "完整回报 G_t", "一步回报 G_{t:t+1}"], ["偏差", "<b>无偏</b>", "<b>有偏</b>（但方差与计算上更好）"], ["在线增量吗", "<span class='w'>否</span>，要等一幕走完", "<b>是</b>，处理完不回头"], ["⚠ 偏差的来源", "—", "<b>不是自举，是「用了一个学到的值函数去评判」</b>"]]}, "res": {"tag": "推断", "ref": "原书 13.5 节（逐句核对渲染图 p11）· 简报 §4e「准确率用 FQE + 5 折 cross-fitting」· 简报 §4d 穷举 oracle · 简报 §7 第 6 拳", "v": "<b>按本页的判据，你的 Q̂ / FQE 是 critic，不是基线——所以它<b>引入偏差</b>，而且这个偏差换成蒙特卡洛也去不掉。</b><br><span class='k'><b>判据：值函数有没有被用来<b>评判动作</b>（即影响「选哪个配置」）。</b></span><b>简报 §4e 写的是「准确率用 FQE + 5 折 cross-fitting」，而 FQE 的产物是要拿去比较候选策略的——这就是评判动作。</b><b>于是它在本章的分类里是 critic，不是 b(s)。</b><br><span class='w'><b>⚠ 关键的一句在这里：书明说偏差<b>不是自举造成的</b>，「即使 critic 是用蒙特卡洛方法学的，actor 仍然是有偏的」。</b></span><b>所以「我们不用自举、改成纯蒙特卡洛拟合」并不能让你回到无偏——这条退路是堵死的。</b><br>⇒ <b>三条可用的：</b><br>① <b>写作上要分清两种用法，别混为一谈。</b><b>成本模型当基线（只依赖状态、不参与选动作）是无偏的</b>，有 13.4 节那一行证明；<b>Q̂ 参与选配置就是 critic，是有偏的</b>。<b>把两者都说成「我们学了一个辅助模型」会让审稿人以为你没分清。</b><br>② <b>cross-fitting 治的是「在自己那折上拟合」的过拟合偏差，不是这一条。</b><b>本页说的偏差，在 critic 完美无过拟合时依然存在</b>——它来自「用估计值代替真值」这个结构，而不是来自样本复用。<b>⚠ 别把 5 折 cross-fitting 当成这条偏差的解药。</b><br>③ ⭐ <b>而这正好说明简报 §4d 那张穷举 oracle 表为什么是正确的主攻方向。</b><span class='k'><b>oracle 表给出的是真值 R(x, a₁..a_k)，不是估计——拿它选配置，本页这条偏差根本不存在。</b></span><b>简报原话是「在你付得起的规模上，它碾压任何估计量」，本页给了这句话一个教科书依据：任何学到的 critic 都带着一个不可通过换算法消除的偏差。</b>"}},
{"r": [12, 12], "t": "两个伪代码框：I ← γI 把那个 γᵗ 背了起来", "star": 2, "quote": "<em>The generalizations to the forward view of n-step methods and then to a λ-return algorithm are <b>straightforward</b>. The one-step return in (13.12) is <b>merely replaced</b> by G_{t:t+n} or G^λ_t respectively. The backward view of the λ-return algorithm is also straightforward, using <b>separate eligibility traces for the actor and critic</b>, each after the patterns in Chapter 12.</em>", "one": "<b>一步 actor–critic 的伪代码里多了一个变量 I，每步乘一个 γ——它就是前面那个 γᵗ 的增量写法。推广到资格迹也只是把一个迹换成两个：actor 一个，critic 一个。</b>", "pts": ["<b>先读一步 actor–critic 这个框，它比上一页的式子多了两样东西。</b> <b>① 终止处理</b>：δ ← R + γ v̂(S′,w) − v̂(S,w)，<span class='k'><b>而「若 S′ 是终止状态，则 v̂(S′,w) ≐ 0」</b></span>——这一行不是实现细节，它是让分幕任务在同一个式子下成立的关键。<b>② 变量 I</b>：初始化为 1，每步结尾 I ← γI，而 θ 的更新里带着它：θ ← θ + α^θ I δ ∇ln π(A|S,θ)。", "<b>I 是什么？它就是前面那个 γᵗ，只是改成了增量写法。</b> 第 t 步时 I 恰好等于 γ^t——<b>每步乘一次 γ，从 1 开始，走到第 t 步自然是 γ^t</b>。<span class='k'><b>这样写的好处是不必记录「现在是第几步」，也不必在线算幂。</b></span><b>⚠ 而它的必要性来自 p8 讲过的那条历史：Thomas (2014) 才指出打折分幕情形下这一项是必需的。I 就是那一项在在线算法里的化身。</b>", "<b>整个循环的形状值得和 REINFORCE 并排看一次。</b> <b>「当 S 不是终止状态时，对每个时间步：按 π(·|S,θ) 采一个 A；执行 A，观察 S′ 与 R；算 δ；更新 w；更新 θ；I ← γI；S ← S′。」</b><span class='w'><b>没有「生成一整幕」，没有回过头的第二重循环，没有存储轨迹。</b></span><b>这就是「完全在线增量」的全部含义。</b>", "<b>往 n 步和 λ-回报的推广，书说得很轻松，而且是真的轻松。</b> <b>前向视角下：把 (13.12) 里的一步回报「仅仅换成」G_{t:t+n} 或 G^λ_t 即可。</b><span class='k'><b>后向视角也直接：给 actor 和 critic <b>各配一个</b>资格迹，各自照第 12 章的模式来。</b></span>", "<b>带资格迹的那个框，变化集中在三处。</b> <b>① 多了两个迹向量</b>：z^w（d 维，给 critic）与 z^θ（d′ 维，给 actor），每幕开头清零。<b>② 多了两个迹衰减率</b>：λ^w ∈ [0,1] 与 λ^θ ∈ [0,1]，<span class='k'><b>注意是两个独立的参数——actor 和 critic 可以用不同的迹长度。</b></span><b>③ 更新改成走迹</b>：z^w ← γλ^w z^w + ∇v̂(S,w)，z^θ ← γλ^θ z^θ + I ∇ln π(A|S,θ)，然后 w ← w + α^w δ z^w，θ ← θ + α^θ δ z^θ。", "<b>⚠ 注意 I 在带迹的版本里跑到哪去了：它进了 z^θ 的累加项，而不是留在 θ 的更新里。</b> <b>z^θ ← γλ^θ z^θ + <b>I</b> ∇ln π(A|S,θ)</b>。<span class='w'><b>这是对的——γ^t 该乘在「这一步的贡献」上，而迹是历次贡献的加权累加，所以 I 必须在进迹之前乘好。</b></span><b>若错写成 θ ← θ + α^θ I δ z^θ，就等于把 γ^t 重复作用在了全部历史贡献上。</b><b>这类「因子放在循环里哪一行」的错误，正是 p8 那条历史里被漏了二十年的那种。</b>"], "eq": "一步 actor–critic 伪代码（分幕）：\n\n   输入：可微的 π(a|s,θ) 与 v̂(s,w)；参数：α^θ > 0, α^w > 0\n   初始化 θ ∈ R^d′, w ∈ R^d\n   永远循环（每幕）：\n       初始化 S（本幕第一个状态）\n       I ← 1\n       当 S 不是终止状态时（每个时间步）：\n           A ∼ π(·|S, θ)\n           执行 A，观察 S′, R\n           δ ← R + γ v̂(S′,w) − v̂(S,w)   （若 S′ 终止，则 v̂(S′,w) ≐ 0）\n           w ← w + α^w δ ∇v̂(S,w)\n           θ ← θ + α^θ **I** δ ∇ln π(A|S,θ)\n           I ← γ I\n           S ← S′\n\n   ⚠ I 就是前面那个 γ^t 的**增量写法**：从 1 开始每步乘 γ，第 t 步恰为 γ^t\n      不必记步数，也不必在线算幂\n\n带资格迹的 actor–critic（分幕）—— 变化集中在三处：\n\n   ① 两个迹向量   z^w（d 维，critic）  z^θ（d′ 维，actor）  每幕开头清零\n   ② 两个衰减率   λ^w ∈ [0,1]   λ^θ ∈ [0,1]   **互相独立**\n   ③ 更新改成走迹：\n         z^w ← γ λ^w z^w + ∇v̂(S,w)\n         z^θ ← γ λ^θ z^θ + **I** ∇ln π(A|S,θ)      ← I 在**进迹之前**乘好\n         w   ← w + α^w δ z^w\n         θ   ← θ + α^θ δ z^θ                        ← 这里**没有** I\n\n   ⚠ 若错写成 θ ← θ + α^θ I δ z^θ，就等于把 γ^t\n      **重复作用在全部历史贡献上**\n\n前向视角的推广：把 (13.12) 的一步回报「仅仅换成」G_{t:t+n} 或 G^λ_t", "tbl": {"head": ["", "一步 actor–critic", "带资格迹的 actor–critic"], "rows": [["额外状态变量", "<b>I</b>（标量）", "<b>I + z^w + z^θ</b>"], ["迹衰减率", "—", "<b>λ^w 与 λ^θ 两个，互相独立</b>"], ["I 乘在哪", "θ 的更新里", "<b>z^θ 的累加项里</b>（进迹之前）"], ["θ 的更新", "θ + α^θ I δ ∇ln π", "θ + α^θ δ z^θ（<b>没有 I</b>）"], ["⚠ 放错位置的后果", "—", "<span class='w'>γ^t 被重复作用在全部历史贡献上</span>"]]}, "res": {"tag": "推断", "ref": "原书 13.5 节两个方框（逐行核对）· p18 文献注（Thomas 2014 的 γ^t）· 简报 §5「P2 vs P3 消融」", "v": "<b>这一页给你的不是算法，是一条关于「因子放在哪一行」的警示，而你有一个同构的风险点。</b><br><span class='k'><b>书里 I（即 γ^t）在带迹版本中必须乘在<b>进迹之前</b>，因为 γ^t 属于「这一步的贡献」，而迹是历次贡献的累加。</b></span><b>放错一行，γ^t 就被重复作用在全部历史上——而这类错误不会报错、不会崩，只会让结果慢慢变得不对。p8 那条历史（同一个因子被漏了二十年）说明它多难被发现。</b><br>⇒ <b>你的同构风险点在成本的折算上。</b><b>你的 G = Acc − λ·Cost 里，Cost 是逐节点累加的。</b><span class='w'><b>如果你给不同节点的成本加了任何形式的权重（例如按位置折算、或按「这个节点影响多少下游」加权），那么「权重乘在累加之前还是之后」就是同一类错误的入口。</b></span><br><b>具体建议：把成本的累加写成一个单独的、可单元测试的函数，并用一个手算的小例子（两节点、已知档位、已知 token 数）钉住它。</b><b>⚠ 这比看起来重要：成本那一半是你唯一有分布模型、本该精确的部分（R² > 0.95），如果它悄悄错了，你会把一个实现 bug 当成「λ 的影响」来解释。</b><br><b>另外一条可直接借的：actor 和 critic 用<b>两个独立的</b>迹衰减率 λ^θ、λ^w。</b><span class='k'><b>对应到你那里：「准确率那一半该看多远」和「成本那一半该看多远」本来就不必是同一个答案</b></span>——成本一步可算（λ 可以取 0），准确率只有终局才知道（必须看到底）。<b>书在这里已经把「两半用不同的时域处理」做成了算法的标准形状，你拆开估计这件事因此更不像是特设。</b>"}},
{"r": [13, 13], "t": "持续情形：性能改成平均奖励率，于是所有的 γ 都消失了", "star": 3, "quote": "<em>As discussed in Section 10.3, for continuing problems <b>without episode boundaries</b> we need to define performance in terms of <b>the average rate of reward per time step</b>.</em><br><em>where μ is the <b>steady-state distribution</b> under π … which is assumed to exist and to be <b>independent of S₀</b> (<b>an ergodicity assumption</b>). Remember that this is the special distribution under which, <b>if you select actions according to π, you remain in the same distribution</b>.</em>", "one": "<b>没有幕边界，就没法拿「起始状态的值」当性能，于是改用每步平均奖励率 r(π)。换了这个定义之后，伪代码里所有的 γ 和那个 I 都不见了——不是简化，是因为平均奖励表述里本来就没有折扣。</b>", "pts": ["<b>先说为什么要换定义。</b> 分幕情形把性能定成 J(θ) ≐ v_{π_θ}(s₀)，<b>这个定义依赖「有一个起始状态」</b>。<span class='k'><b>持续问题没有幕边界，也就没有 s₀，这个定义直接失效。</b></span><b>替代品是每步的平均奖励率</b>：J(θ) ≐ r(π) ≐ lim_{h→∞} (1/h) Σ_{t=1}^{h} E[R_t | S₀, A_{0:t−1} ∼ π]。<b>书同时给了它的两个等价写法</b>：极限可以换成 lim_{t→∞} E[R_t | …]，也可以写成对稳态分布的求和 Σ_s μ(s) Σ_a π(a|s) Σ_{s′,r} p(s′,r|s,a) r。", "<b>μ 在这里的含义变了，这一点要分清。</b> 分幕情形里 μ 是「在 s 上花费的期望步数」归一化之后的同策分布；<span class='k'><b>持续情形里 μ 是<b>稳态分布</b>：μ(s) ≐ lim_{t→∞} Pr{S_t = s | A_{0:t} ∼ π}。</b></span><b>书对它提了两个假设：存在，而且<b>与 S₀ 无关</b>——这就是遍历性假设。</b>⚠ <b>「与 S₀ 无关」不是技术细节，它正是「持续问题没有起点」这件事在数学上的落实。</b>", "<b>(13.16) 把稳态的意思写明白了，而它在下一页的证明里是关键一步。</b> Σ_s μ(s) Σ_a π(a|s,θ) p(s′|s,a) = μ(s′)，对所有 s′ ∈ S 成立。<span class='k'><b>书的白话版：「这是那个特殊的分布——如果你按 π 选动作，你就<b>留在同一个分布里</b>。」</b></span><b>⇒ 走一步，分布不变。下一页的证明就是靠这一条让两个 ∇v_π 项精确抵消的。</b>", "<b>⚠ 现在看持续版的伪代码，和分幕版并排，差别一目了然：γ 全没了。</b> <b>TD 误差变成 δ ← R − R̄ + v̂(S′,w) − v̂(S,w)</b>——<span class='w'><b>折扣因子 γ 不见了，取而代之的是减去一个 R̄。</b></span><b>两个迹也不带 γ 了</b>：z^w ← λ^w z^w + ∇v̂(S,w)，z^θ ← λ^θ z^θ + ∇ln π(A|S,θ)。<b>而上一片那个 I（即 γᵗ）整个消失。</b>", "<b>这不是「简化版」，是平均奖励表述的必然结果。</b> <span class='k'><b>γ 的作用是让无穷远的奖励不发散；而平均奖励率本身就是对无穷长序列取平均，发散问题已经由「除以 h」解决了，不需要再打折。</b></span><b>⇒ 于是 I 也没有存在的理由——它本来就是 γᵗ 的增量写法。</b>", "<b>多出来的是第三个步长 α^R̄，以及一个新的被学量 R̄。</b> R̄ ∈ R 初始化（例如 0），每步 R̄ ← R̄ + α^R̄ δ。<span class='k'><b>注
