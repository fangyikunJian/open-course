<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第十讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs234-2019-l10">

<div id="bar">
  <h1>CS234 第十讲 · <span>保守策略改进与 TRPO：把「不变差」变成一条可优化的下界</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 36</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture10_1.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L10-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "老师对 TRPO 的定位是？", "o": ["期中重点", "作业和期中都不考，但它极其流行，做项目可能会用到", "只是历史背景", "已经过时"], "a": 1, "why": "这一讲后半是期中复习，对应另一份课件 lecture10_2.pdf。"}, {"q": "老师对 TRPO 的定位是什么？", "o": ["作业和期中都不考，但它是极其流行的策略梯度算法，做项目可能会用到", "只在期中考概念", "作业和期中都考，必须会推导", "属于选读内容，可以跳过"], "a": 0, "why": "这句话划定了该花多少力气：推导的思路要懂，具体公式不必背（p35 也这么写）。"}, {"q": "L08、L09、L10 三讲的分工是什么？", "o": ["分别讲 REINFORCE、actor-critic、TRPO", "三讲内容基本重复", "L08 梯度是什么怎么算；L09 梯度估得准不准并提出「该走多远」；L10 把「该走多远」走完", "分别讲理论、算法、实验"], "a": 2, "why": "L09 后半和 L10 前半是同一套东西，但 L10 是按节奏讲完的，所以课堂实录信息量明显更大。"}],
4: [{"q": "「参数差多远」和「策略差多远」是一回事吗？", "o": ["不是——参数挪一点点策略可能变化剧烈，挪很多也可能几乎不变", "是，一一对应所以等价", "是，只要参数化是线性的", "不是，但差别可以忽略"], "a": 0, "why": "这一讲全程用的是第二种（KL 散度），这正是 TRPO 和普通梯度下降最根本的区别。"}, {"q": "整条推导（p9 到 p18）依赖具体的参数化吗？", "o": ["不依赖——参数化只在 p27 之后才进来（要算 KL 对参数的二阶导）", "依赖，必须是深度网络", "依赖，必须是 softmax", "依赖，必须可微"], "a": 0, "why": "所以前半是关于「策略」的理论，后半才是关于「参数」的算法。"}],
5: [{"q": "香草策略梯度里要做的三处选择是？", "o": ["目标怎么估、基线取什么、沿梯度走多远", "学习率、批量、网络深度", "策略类、特征、折扣", "探索、利用、泛化"], "a": 0, "why": "前两处是第八、九讲的内容；第三处是这一讲的正题。"}, {"q": "课件连放两张几乎一样的 vanilla PG 伪代码，差别在哪？", "o": ["第二张加了 KL 约束", "第二张多了基线", "第二张去掉了折扣因子", "第二张把 <code>Return G_t</code> 换成了 <code>Target R̂_t</code>"], "a": 3, "why": "换掉这个词，就把「一个算法」变成了「一族算法」——这就是第①处选择。"}, {"q": "三处选择里，哪一处是这一讲的正题？", "o": ["沿梯度走多远", "基线取什么", "三处都是", "目标怎么估"], "a": 0, "why": "前两处是统计选择（改变估计质量），第三处是优化选择（改变怎么用这个估计）。即使梯度估得完美，第三处仍是真问题。"}],
8: [{"q": "为什么「走多远」在 RL 里比在监督学习里要紧得多？", "o": ["参数更多", "目标非凸", "你迈出的这一步决定了下一批数据长什么样，走出坏策略可能再也拿不到有用数据", "梯度噪声大"], "a": 2, "why": "所以目标是在部署之前就能确信 V^{π_{i+1}} ≥ V^{π_i}。DQN 之类没有这个保证。"}, {"q": "老师说在哪些领域你会很想「部署前就确信新策略不更差」？", "o": ["游戏、仿真、推荐", "搜索、广告", "机器人、自动驾驶", "金融、客户、病人"], "a": 3, "why": "关键是「部署前」这个时间点——回滚是有代价的：已发出的交易、已给出的建议、已用过的药，收不回来。"}, {"q": "「部署前就知道」这个要求为什么导致了整套推导？", "o": ["因为采样太慢", "要在部署前判断就不能跑它；不跑就拿不到它的状态分布；拿不到分布那个精确恒等式就算不出来", "因为要满足监管", "因为要省钱"], "a": 1, "why": "于是只能退而求其次：用旧分布算一个代理，再证明真实值不会比代理低太多。"}],
9: [{"q": "<code>V(θ̃) = V(θ) + Σ_s μ^{π̃}(s) Σ_a π̃(a|s)A^π(s,a)</code> 里，我们<b>拿不到</b>的是哪一项？", "o": ["π̃(a|s)", "μ^{π̃}(s)——新策略下的状态分布，要真去跑才知道", "V(θ)", "A^π(s,a)"], "a": 1, "why": "新策略的显式形式（网络参数）和优势函数都有办法，卡住的就是这个分布。这正是 off-policy 的困难。"}, {"q": "这一页列的「有什么、缺什么」里，缺的是哪一个？", "o": ["旧策略的值 <code>V(θ)</code>", "新策略的显式形式 <code>π̃(a|s)</code>", "优势函数 <code>A^π</code>", "新策略下的状态分布 <code>μ^{π̃}</code>"], "a": 3, "why": "注意这个缺口的性质：它不是「估不准」，是「根本没有」——要真去跑才知道。"}, {"q": "第九讲的 <code>ρ^{π̃}</code> 和这一讲的 <code>μ^{π̃}</code> 是什么关系？", "o": ["前者对状态，后者对状态动作对", "同一个量的两种写法：折扣加权访问频率，和是 <code>1/(1−γ)</code> 不是 1", "前者是平稳分布，后者是折扣访问频率", "两者定义不同，不能混用"], "a": 1, "why": "而这个 1/(1−γ) 正是下界里那个平方项的来源，也是 p22 第一次替换要提出来的常数。"}],
12: [{"q": "局部近似 <code>L_π(π̃)</code> 做的手脚是？", "o": ["把新策略的状态分布 μ^{π̃} 直接换成旧策略的 μ^π", "去掉优势函数", "去掉折扣", "把 A 换成 Q"], "a": 0, "why": "两个策略的状态分布一般不相等，但我们有旧策略的样本，所以这个期望估得出来。"}, {"q": "课上问「这和重要性采样是什么关系」，老师的回答是？", "o": ["是它的特例", "是它的推广", "就是重要性采样", "不一样：重要性采样按比值重加权，这里是直接假装两个分布相同、把差别忽略掉"], "a": 3, "why": "真正的重要性采样要到 p23 的第二次替换才出现。别把这两处混了。"}, {"q": "<code>L_{π_i}(π_i)</code> 等于什么？", "o": ["1", "0", "无法确定", "V^{π_i}——因为第二项里自己对自己的优势是 0"], "a": 3, "why": "这条性质在 p17 的论证里是决定性的：下界在当前策略处恰好贴住真值。"}, {"q": "老师怎么区分「这一页的做法」和「重要性采样」？", "o": ["两者本质相同", "重要性采样只对动作做，这里只对状态做，但原理一样", "重要性采样按比值重加权（无偏）；这里是直接假装两个状态分布相同（有偏）", "重要性采样有偏，这里无偏"], "a": 2, "why": "而 p22 的第二次替换里才真的出现重要性采样，那是对动作做的。「状态靠假装、动作靠重加权」是核心细节。"}, {"q": "为什么状态那一层不能也用重要性采样？", "o": ["因为状态不是独立的", "权重是 <code>μ^{π̃}/μ^π</code>，而分子正是你不知道的那个东西", "因为会引入偏差", "因为状态空间太大"], "a": 1, "why": "动作那一层就不同：<code>π̃/π_old</code> 两边都是你手上的策略，直接算。能不能重加权取决于你有没有那个分布的显式形式。"}, {"q": "代理目标 <code>L</code> 本身有什么保证？", "o": ["都不是——它唯一的资格是在当前点上值和一阶导都对", "它是 <code>V(θ̃)</code> 的无偏估计", "它是 <code>V(θ̃)</code> 的上界", "它是 <code>V(θ̃)</code> 的下界"], "a": 0, "why": "换句话说，L 在当前点附近是对的，走远了就什么都不是。「走多远还算近」要等 p13–p15 的下界才有答案。"}],
13: [{"q": "保守策略迭代的下界，只对哪一类策略成立？", "o": ["softmax 策略", "确定性策略", "新旧策略按比例混合得到的策略", "所有随机策略"], "a": 2, "why": "所以下一页要推广。α=0 时罚项为 0，界是紧的。"}, {"q": "混合策略里的 α 是什么含义？", "o": ["折扣因子的补", "学习率", "每一步以概率 α 改用另一个策略，其余照旧", "参数走了 α 这么远"], "a": 2, "why": "这正是「保守策略迭代」里「保守」二字的来源：一次只换一小部分。"}, {"q": "p13 和 p14 的 ε 定义一样吗？", "o": ["不一样：p13 是 <code>max_s |E_{a∼π′}[A]|</code>（先对动作取期望），p14 是 <code>max_{s,a} |A|</code>", "p13 没有定义 ε", "一样", "不一样：p13 更大"], "a": 0, "why": "后者显然更大。这是推广到一般策略要付的代价之一——常数从 2 变成 4，而 ε 本身也变大了。"}],
14: [{"q": "<code>D_TV^max(π₁,π₂)</code> 度量的是？", "o": ["在所有状态上，两个策略对某个动作给出的概率差最大是多少", "轨迹分布之差", "参数的欧氏距离", "值函数之差"], "a": 0, "why": "也就是「它们在哪里分歧最大」。"}, {"q": "为什么要把 <code>D_TV</code> 换成 KL 散度？", "o": ["KL 无偏", "全变差距离用起来不方便，而 D_TV² ≤ D_KL 让我们能换一个好处理的量", "KL 可微而 D_TV 不可微", "KL 更小"], "a": 1, "why": "换完之后 TRPO 的约束就直接写成 KL 了。"}, {"q": "板上把 <code>D_TV</code> 写成了 <code>max_a |π₁(a|s) − π₂(a|s)|</code>，这是什么？", "o": ["L∞ 距离——全变差是 <code>½ Σ_a |p−q|</code>，两者只在两动作时相等", "KL 散度", "Wasserstein 距离", "全变差距离的正确定义"], "a": 0, "why": "四动作的例子：p=(0.4,0.4,0.1,0.1)、q=(0.1,0.1,0.4,0.4) ⇒ D_TV=0.6 而 L∞=0.3，差一倍。"}, {"q": "把 <code>D_TV</code> 写成 L∞，错的方向是什么？", "o": ["两者相等，没有影响", "L∞ ≤ D_TV，所以惩罚被低估、「下界」被抬高——按那个写法得到的不等式不成立", "L∞ ≥ D_TV，所以界更保守，仍然安全", "影响无法判断"], "a": 1, "why": "好在接下来换成 KL 之后就不要紧了，因为 KL 那一步是从真正的 D_TV 出发的。"}, {"q": "课件写的 <code>D_TV(p,q)² ≤ D_KL(p,q)</code> 有什么问题？", "o": ["应该是等号", "KL 应该换成 D_TV", "漏了一个 ½（Pinsker 是 <code>D_TV² ≤ ½ D_KL</code>）；但方向安全，界仍成立，只是松了一倍", "完全错误，不等号方向反了"], "a": 2, "why": "用正确的 Pinsker，惩罚系数可以减半：2εγ/(1−γ)² 而不是 4εγ/(1−γ)²。"}, {"q": "为什么要把 <code>D_TV</code> 换成 KL？", "o": ["KL 是对称的", "KL 更直观", "KL 更小", "KL 对常见参数化策略有闭式表达且对参数可微，而全变差带绝对值不光滑"], "a": 3, "why": "这一步把「理论上的界」变成了「能塞进优化器的约束」——p20 的信赖域约束用的就是它。"}, {"q": "<code>ε = max_{s,a} |A^π(s,a)|</code> 这一项的实际困难是什么？", "o": ["它要对所有状态动作取最大值且依赖策略，实践中基本算不出来", "它和 γ 有关", "它随时间变化", "它可能为负"], "a": 0, "why": "老师在 p16 当堂承认：「这部分是形式上的保证。」定理告诉你存在这样一个界，但不给你能代进去的数。"}],
16: [{"q": "「优化下界就够了」这个论证的决定性一步是？", "o": ["把 π_i 代进 M_i 自己时 KL=0，于是 M_i(π_i) 恰好等于 V^{π_i}", "用了大数定律", "用了压缩映射", "下界总是小于真值"], "a": 0, "why": "这是一根「贴着真值」的下界，所以下界涨了真值一定也涨。这类做法叫 MM（minorize-maximize）。"}, {"q": "有人问「会不会下界变好、真实值反而变差」。答案是？", "o": ["不会——旧策略的下界就等于旧策略的真值", "只在 γ<1 时不会", "会，所以要小心", "取决于 ε"], "a": 0, "why": "「我手上有个东西，它的下界比我现在的值还高，那它本身一定更好。」"}, {"q": "式子里的 <code>ε = max_{s,a}|A^π(s,a)|</code> 在实践中怎么办？", "o": ["取 0", "基本算不出来，而且它还依赖于策略——这部分是形式上的保证", "用样本均值代替", "精确算出来"], "a": 1, "why": "老师承认了这一点，接下来的 TRPO 正是要把它做成能跑的算法。"}, {"q": "关于 <code>V^{π_{i+1}}</code> 和 <code>M_i(π_{i+1})</code> 的关系，正确的是？", "o": ["两者无关", "应该是 <code>≥</code>（实录里先说成了 equal to，随后在真正推导时说对了）", "应该是 <code>≤</code>", "应该是 <code>=</code>"], "a": 1, "why": "只有第②式 <code>V^{π_i} = M_i(π_i)</code> 才是等号。两式一等一不等，相减才得到有用的结论。"}, {"q": "如果两式都是等号会怎样？", "o": ["推导仍然成立", "结论更强", "会得到相反的结论", "M 就不是「下界」而是「值本身」，整件事变得平凡，也就不需要这一讲了"], "a": 3, "why": "这个「一等一不等」的结构，正是 MM 算法的签名。"}, {"q": "<code>M_i(π_i) = V^{π_i}</code> 靠哪两件事？", "o": ["L 是凸的且 KL 非负", "ε=0 且 γ=1", "优势函数期望为零", "<code>D_KL(π_i,π_i)=0</code> 让惩罚归零，且 <code>L_{π_i}(π_i)=V^{π_i}</code>"], "a": 3, "why": "两件事缺一不可。惩罚项必须在 π_i 处归零，而这正是选 KL 的另一个理由（它对自己是 0）。"}, {"q": "学生问「会不会出现下界变好、真实值反而变差」，老师怎么答？", "o": ["会，所以需要线搜索", "要看 ε 的大小", "不会——旧策略的下界就等于旧策略的真值，所以「下界比我现在的真值还高，那它本身一定更好」", "会，但概率很小"], "a": 2, "why": "这正是第②式取等号的意义所在。"}],
20: [{"q": "为什么不直接用理论给的惩罚系数 <code>C = 4εγ/(1−γ)²</code>？", "o": ["它不收敛", "算不出 γ", "它是负的", "它太保守，步长会小到没法用——但我们还想快点到一个好策略"], "a": 3, "why": "直觉：策略只改一点点，值也变不了多少。所以保守的界就意味着极小的步长。"}, {"q": "TRPO 把 <code>max_s D_KL</code> 放松成了什么？", "o": ["常数", "对状态分布取期望——更好估", "min_s", "平均动作"], "a": 1, "why": "信赖域的含义：在一阶近似还靠谱的范围内走，范围用 KL 界定。"}, {"q": "γ = 0.99 时理论常数 <code>C = 4εγ/(1−γ)²</code> 是多少？", "o": ["1520ε", "39600ε", "360ε", "一百万 ε"], "a": 1, "why": "4×0.99/0.0001 = 39600。要让惩罚项不压倒目标提升，KL 得小到 10⁻⁴ 量级——基本等于不动。"}, {"q": "γ 从 0.99 升到 0.999，步长大致要缩小多少？", "o": ["不变", "一百倍", "十倍", "两倍"], "a": 1, "why": "C 从 39600ε 变成约 4×10⁶ε。γ 不只影响「看多远」，还影响「每步能走多远」的理论上界。"}, {"q": "把惩罚改成硬约束，改变了什么？", "o": ["让目标变成凸的", "把控制权从「一个算不出的理论常数」交回到「一个你能调的数 δ」手上", "消除了偏差", "减少了计算量"], "a": 1, "why": "而 δ 的含义不依赖 ε 和 γ，跨任务也大致可比。"}, {"q": "把 <code>max_s</code> 换成对状态分布取期望，课件给的理由是什么？", "o": ["max 要求 KL 在所有状态上有界，约束数等于状态数，连续状态下是无穷多条", "max 会让界太松", "期望更容易求导", "期望形式更对称"], "a": 0, "why": "代价是：平均 KL 小，不排除个别状态上 KL 很大——那些状态上策略可能变化剧烈而你不会察觉。"}, {"q": "经过两处放松，TRPO 的保证还剩什么？", "o": ["严格的概率保证", "逐状态的改进保证", "完整的单调改进定理", "都不剩——它成了一个受理论启发的启发式"], "a": 3, "why": "课件 p31 的措辞是 empirically consistently does well——注意是经验上。这是这一讲最容易被夸大的地方。"}],
22: [{"q": "三次替换里，第①次为什么要做？", "o": ["为了去掉 γ", "为了降方差", "为了无偏", "状态空间可能连续无穷，只能用旧策略实际走到的那些状态来估"], "a": 3, "why": "课件强调：这三次替换不改变最优解。"}, {"q": "第③次把 <code>A</code> 换成 <code>Q</code>，为什么不影响结果？", "o": ["因为取了期望", "它们相等", "做了近似", "两者只差一个与动作无关的 V，不影响 arg max"], "a": 3, "why": "A(s,a) = Q(s,a) − V(s)，而 V(s) 对所有动作是同一个常数。"}, {"q": "三次替换各自对付什么困难？", "o": ["① 状态空间连续无穷；② 动作连续且每状态只采一个；③ A 要先有 V 才能算", "都是为了加速计算", "都是为了消除偏差", "都是为了降方差"], "a": 0, "why": "三个不同的困难，三种不同的办法。"}, {"q": "<code>1/(1−γ)</code> 在第①次替换里为什么出现？", "o": ["<code>μ_old</code> 的总质量是 <code>1/(1−γ)</code>，当成概率分布求期望得先除再乘回来", "因为优势函数有界", "因为要做折扣", "因为重要性权重需要归一化"], "a": 0, "why": "它是个常数不影响 arg max，所以实现代码里常看不到它——但推导里必须出现。"}, {"q": "课件强调「三次替换不改变最优解」，这句话的前提是什么？", "o": ["策略可微", "状态空间有限", "γ 小于 1", "期望能被精确计算——②用有限样本去估时会有误差（那就是方差）"], "a": 3, "why": "而信赖域约束顺带在压这个方差：两个策略越接近，重要性权重越接近 1。"}],
25: [{"q": "取 <code>q = π_old</code> 之后，比值在起点处等于多少？", "o": ["δ", "0", "1", "γ"], "a": 2, "why": "于是目标在起点处等于 <code>E[Q_old]</code>，梯度恰好是策略梯度——和 p12 那两条性质一致。PPO 后来直接对这个比值动手：截断它。"}, {"q": "vine 采样法的前提是什么？", "o": ["策略必须是确定性的", "环境能重置到任意状态——机器人做不到，所以在物理系统上基本不可用", "动作空间必须离散", "必须知道转移模型"], "a": 1, "why": "它在每个状态上分叉出多条轨迹各试一个动作，于是优势估计的方差小得多。"}],
27: [{"q": "目标用线性近似、约束用二次近似，这个搭配得到的是？", "o": ["拟牛顿", "最速下降", "自然梯度的形式", "牛顿法"], "a": 2, "why": "所以 TRPO 里要算 F⁻¹g，F 是 Fisher 信息矩阵。"}, {"q": "为什么约束必须用二次近似而不是一次？", "o": ["KL 在当前点取最小值 0 且一阶导也是 0，用一阶近似约束会退化成「0 ≤ δ」等于没有约束", "为了配合共轭梯度", "二次更精确", "因为 KL 不可微"], "a": 0, "why": "而目标用一阶就够，因为代理目标在当前点的梯度就是真梯度（p12 第二条性质）。"}, {"q": "「一阶目标 + 二次约束」解出来是什么？", "o": ["自然梯度 <code>F⁻¹g</code>——它不是被选中的，是从这个约束优化问题里自己长出来的", "随机梯度", "共轭梯度方向", "普通梯度 <code>g</code>"], "a": 0, "why": "这是一个「在椭球内最大化线性函数」的问题，解正是 Δθ ∝ F⁻¹g。"}],
28: [{"q": "TRPO 最后那一步「在代理损失和 KL 约束上做线搜索」起什么作用？", "o": ["降低方差", "加速收敛", "兜底：二次近似不准时，保证约束真的被满足", "估计优势函数"], "a": 2, "why": "前面用共轭梯度算出的方向只是近似解，线搜索确认它确实落在信赖域内且真的改进了。"}, {"q": "TRPO 六行里真正新的是哪两行？", "o": ["第 5 行（自然梯度）和第 6 行（线搜索）", "第 1、7 行", "第 3、4 行", "第 2、3 行"], "a": 0, "why": "前四行和 vanilla PG 一模一样。TRPO = vanilla PG + 沿自然梯度走 + 不许走出 KL 球。"}, {"q": "线搜索失败时标准做法是什么？", "o": ["增大 δ", "改用普通梯度", "重新采样", "按比例反复缩小步长；试完仍不满足就这一轮不更新"], "a": 3, "why": "「宁可不动也不乱动」正是信赖域思想的落地形态。频繁出现说明 δ 太大或优势估计噪声太大。"}, {"q": "实现时把一批优势「减均值除以标准差」，哪一半是严格合法的？", "o": ["两半都严格合法", "除以标准差合法，减均值不合法", "两半都不合法", "减均值合法（等于加常数基线）；除以标准差会改变梯度量级，相当于自适应学习率"], "a": 3, "why": "除标准差不改变方向，所以在有信赖域约束时几乎没副作用；但在 vanilla PG 里会让步长隐式随批次波动。"}],
31: [{"q": "TRPO 没有解决的是哪一项？", "o": ["KL 无法计算", "步长要手调", "更新会突然把策略推到烂区域", "样本效率——它仍是 on-policy，采一批用一次"], "a": 3, "why": "梯度本身的方差也没解决，那是第 3 行的事（基线、GAE、批量）。"}, {"q": "判断「该不该上信赖域」的实用判据是什么？", "o": ["曲线涨得慢就上信赖域", "曲线突然崩塌是步长问题，信赖域有帮助；曲线只是噪声大涨得慢是方差问题，该动第 3 行", "任何情况都该上", "方差大就上信赖域"], "a": 1, "why": "两种病的表现不同，药也不同，别搞混。"}, {"q": "今天实践中 TRPO 被什么取代了，为什么？", "o": ["没有被取代", "DQN，因为样本效率高", "PPO——截断比值替代 KL 约束，不用 Fisher 矩阵、共轭梯度、线搜索，几十行写完", "A3C，因为并行"], "a": 2, "why": "但 PPO 的全部合理性都来自这一讲的推导：它是在用更粗暴的办法达到同一个目的。"}],
34: [{"q": "策略梯度通用模板里，TRPO 换的是哪一个槽位？", "o": ["策略参数化", "目标 Q 的估计方式", "基线的选择", "拿到梯度之后怎么更新（第 5 行）"], "a": 3, "why": "第 3 行换零件得到 REINFORCE / actor-critic / n 步；第 5 行换零件得到朴素 SGD / 线搜索 / TRPO。"}, {"q": "这张通用模板最值钱的地方是什么？", "o": ["它适用于所有 RL 方法", "它把「算法」降级成了「配置」——记住五行，再知道每行有哪些可选项", "它保证收敛", "它比伪代码短"], "a": 1, "why": "读新论文时第一个问题就变成了：它动了哪一行。"}, {"q": "今天最常见的槽位组合是什么？", "o": ["n 步 + TRPO", "critic + 线搜索", "蒙特卡洛 + SGD", "GAE + PPO"], "a": 3, "why": "第 3 行用 GAE（几何加权混合所有 n 步），第 5 行用 PPO（截断比值）。"}],
35: [{"q": "课件明说<b>不要求</b>掌握的是？", "o": ["通用模板", "REINFORCE", "偏差方差的取舍", "TRPO 里近似目标和约束的具体公式"], "a": 3, "why": "要熟悉的是 REINFORCE、模板，以及不同估计量插在哪个槽位、各自的偏差/方差含义。"}, {"q": "课件说<b>不必</b>掌握的是什么？", "o": ["TRPO 里近似目标和约束的具体公式——不必会推导或背出", "REINFORCE 的推导", "偏差/方差的权衡", "那张通用模板"], "a": 0, "why": "要非常熟悉的只有两样：REINFORCE，和那张模板。"}, {"q": "「通过指定策略参数化来注入先验知识」最漂亮的实例是哪个？", "o": ["高斯策略", "softmax 策略", "DQN 的卷积网络", "L08 p25 的 AIBO——12 个手工步态参数把高维控制问题压成 12 维连续优化"], "a": 3, "why": "这对应 L07 p18 四种「额外知识」形态里的第二种。选什么策略类常常是样本效率的主要来源。"}]

{"r": [1, 3], "t": "这一讲要干什么", "star": 2, "one": "把第九讲的尾巴补完：<b>从局部近似推到 TRPO</b>；后半是期中复习。", "pts": ["第一页是期中考场安排（按 SUNet ID 首字母分两个教室，可带一页笔记）。", "<span class='k'>期中复习那半节对应另一份课件</span>——总入口上的「课件·下半」（lecture10_2.pdf）。", "<b>这一讲和第九讲后半讲的是同一套推导，但它是完整的那一遍，所以读法应该不一样。</b><span class='k'>第九讲给的是形状（这条链子长什么样），这一讲给的是细节（每一环为什么成立）</span>。<b>如果你第九讲读过了，这一讲最该盯的是三处</b>：<span class='w'>① 老师把「为什么要单调改进」说得最具体的那一段（p8）；② 几处板书与讲义上的笔误（p14–p18，这一片会逐条更正）；③ 那个理论常数 C 到底有多大（p20）</span>。", "<b>老师对 TRPO 的定位值得当真：「作业和期中都不考，但它是极其流行的策略梯度算法，你们做项目可能会用到，所以值得知道。」</b><span class='k'>这句话划定了该花多少力气</span>——<b>推导的思路要懂，具体公式不必背。</b><span class='w'>而她说的「极其流行」在今天更准确的说法是：它的后继 PPO 极其流行</span>，<b>而 PPO 的全部合理性都来自这一讲的推导。</b>", "<b>这一讲的后半是期中复习，对应另一份课件（lecture10_2.pdf），这一片不涉及。</b><span class='k'>所以这份精读覆盖的是 p1–p36 的策略梯度部分</span>，<b>而它正好是整个策略搜索这条线的收尾</b>——<span class='w'>p34–p36 那张通用模板和小结，是第八、九、十三讲合起来的总结账。</span>", "<b>顺带说清这三讲的分工，免得你觉得内容在重复。</b><span class='k'>L08 回答「梯度是什么、怎么算」（似然比、score function、动态项消失）</span>；<span class='k'>L09 回答「梯度估得准不准」，并把「该走多远」的问题提出来</span>；<span class='k'>L10 把「该走多远」这条推导走完</span>。<span class='w'>L09 后半和 L10 前半确实是同一套东西，但 L09 那份是 2018 年的完整讲义被压缩讲的，L10 这份才是按节奏讲完的</span>——<b>所以同样的页，L10 的课堂实录信息量明显更大。</b>", "<b>最后给一条读这一片的建议：如果你第九讲已经读过这套推导，那就带着「挑错」的心态读这一遍。</b><span class='k'>这一讲的板书和讲义上有几处写法不严谨（p14 和 p16 会逐条标出）</span>，<b>而能看出它们，正好说明你真的跟上了推导，而不是在认符号。</b><span class='w'>它们都不影响结论，但会让你自己复算时对不上。</span>"], "tip": {"t": "老师对 TRPO 的定位", "v": "「<b>作业和期中都不考</b>，但它是极其流行的策略梯度算法，你们做项目可能会用到，所以值得知道。」"}, "quote": "Lecture 10: Policy Gradient III &amp; Midterm Review &nbsp;·&nbsp; Additional reading: Sutton and Barto 2018 Chp. 13 &nbsp;|&nbsp; Last time: Policy Search &nbsp;·&nbsp; This time: <b>Policy Search &amp; Midterm Review</b> &nbsp;·&nbsp; Next time: Midterm"},
{"r": [4, 4], "t": "复习：基于策略的 RL", "one": "参数化策略 <code>π_θ(s,a) = P[a|s;θ]</code>，找值最高的那个。", "pts": ["参数化可以是 softmax，也可以是深度网络。", "<span class='k'>策略和参数是一一对应的</span>——说「策略」和说「θ」指的是同一件事。", "<b>「策略和参数一一对应」这件事在这一讲后面会被反复用到，值得先说透它的后果。</b><span class='k'>因为 <code>θ</code> 定了 <code>π</code> 就定了，所以「两个策略差多远」可以用两种方式衡量</span>：<b>① 参数差多远（<code>‖θ̃ − θ‖</code>）；② 策略本身差多远（比如 KL 散度）。</b><span class='w'>这两件事<b>不是</b>一回事</span>——<b>参数挪一点点，策略可能变化剧烈；参数挪很多，策略可能几乎不变。</b><span class='k'>而这一讲全程用的是第二种，这正是 TRPO 和普通梯度下降最根本的区别。</span>", "<b>再提一句「参数化可以是 softmax 也可以是深度网络」背后的那个自由度，它在这一讲是个前提。</b><span class='k'>整条推导（p9 到 p18）<b>完全不依赖</b>你用什么参数化</span>——<b>老师在第九讲也特意强调过：那个恒等式对任意两个策略都成立。</b><span class='w'>参数化只在 p27 之后才进来，那时要算 KL 对参数的二阶导</span>。<b>所以前半是关于「策略」的理论，后半才是关于「参数」的算法。</b>", "<b>「找值最高的那个策略」这句话里，「值」指的是哪个值，这一讲要说准，因为后面全靠它。</b><span class='k'>是 <code>V(θ) = E[Σ_t γᵗ R(s_t,a_t); π_θ]</code>——从初始状态分布出发的、折扣的期望回报</span>。<b>它是一个标量，而且只依赖 θ。</b><span class='w'>所以「策略搜索」在形式上就是一个标准的最大化问题：<code>max_θ V(θ)</code></span>——<b>只不过这个目标函数你没法直接写出来，只能采样估计，而且采样本身依赖 θ。</b>", "<b>最后提一句这一讲全程的一个默认：<span class='k'>折扣值函数</span>。</b><span class='w'>课件在 p9 的脚注里写了 <em>For today we will primarily consider discounted value functions</em></span>。<b>这个选择贯穿全讲，而且是那个 <code>1/(1−γ)²</code> 系数的来源</b>——<span class='k'>有限 horizon 的情形课件不讨论，但那正是很多实际问题的形状</span>。<b>读到那个系数时记得回来看一眼这个脚注。</b>"], "quote": "Policy search: directly parametrize the policy <b>π_θ(s,a) = P[a|s;θ]</b> &nbsp;·&nbsp; Goal is to find a policy π with the highest value function V^π &nbsp;·&nbsp; Focus on <b>policy gradient methods</b>"},
{"r": [5, 7], "t": "复习：香草策略梯度与三个选择", "star": 3, "one": "跑策略 → 算回报与优势 → 拟合基线 → 更新策略。<b>几乎所有策略梯度算法都是这个形状。</b>", "eq": "三处要做选择：\n  ① 目标（回报）怎么估 —— 蒙特卡洛？bootstrap？n 步？\n  ② 基线取什么\n  ③ 拿到梯度之后，沿它走多远", "pts": ["<b>① 就是第三讲那笔老交易</b>：单次 rollout 无偏但高方差；bootstrap + 函数逼近引入偏差、压下方差。", "<b>③ 是这一讲的正题。</b>", "<b>课件连着放了两张几乎一样的 vanilla PG 伪代码，差别只有一个字，而那个字正是这一讲的分工。</b><span class='k'>第一张写的是 <code>Return G_t^i</code>（蒙特卡洛回报）；第二张写的是 <code>Target R̂_t^i</code>（一个可以换零件的「目标」）</span>。<b>换掉这个词，就把「一个算法」变成了「一族算法」。</b><span class='w'>这就是第 ① 处选择。</span>", "<b>三处选择里，前两处第八、九讲已经处理完了，这一讲只管第三处，值得把分工记清楚。</b><b>① 目标怎么估</b>：<span class='k'>蒙特卡洛 / bootstrap / n 步——第三讲那笔老交易</span>；<b>② 基线取什么</b>：<span class='k'>常数 / <code>V(s)</code>——不引入偏差，但要正相关才降方差</span>；<b>③ 沿梯度走多远</b>：<span class='w'>这一讲的正题</span>。<span class='k'>注意前两处管的是「梯度准不准」，第三处管的是「梯度在多远之外还成立」</span>——<b>两件事互相独立。</b>", "<b>把这张模板和 L02 的策略迭代对照一次，你会看到一个很整齐的对应，而这个对应在期中很可能有用。</b><span class='k'>L02 的策略迭代：评估（算 <code>V^π</code>）↔ 改进（取 arg max）</span>；<span class='k'>vanilla PG：评估（拟合基线、估优势）↔ 改进（沿梯度更新）</span>。<b>两者是同一个循环，区别只在「有没有模型」。</b><span class='w'>有模型时改进是精确的（严格单调，L02 p39）；没有模型时改进只是一个带噪声的一阶近似</span>——<b>而这一讲全部的工作，就是在后一种情况下把那个单调保证找回来。</b>", "<b>「三处选择」这个说法比「三个超参数」准确，差别在于：它们不是同一类东西。</b><span class='k'>① 和 ② 是<b>统计</b>选择——它们改变的是你对梯度的估计质量</span>；<span class='w'>③ 是<b>优化</b>选择——它改变的是你怎么用这个估计</span>。<b>所以即使①②做得完美（梯度估得毫无误差），③仍然是个真问题</b>——<span class='k'>因为真梯度本身也只是一阶信息，它不告诉你该走多远。</span>", "<b>把这三处选择和前两讲对上，整条策略搜索这条线的内容就全在这里了。</b><b>① 目标怎么估</b>：<span class='k'>L08 p59、L09 p24–p25（critic、n 步、GAE）</span>；<br><b>② 基线取什么</b>：<span class='k'>L08 p53–p55、L09 p14–p19（不引入偏差，但要正相关才降方差）</span>；<br><b>③ 走多远</b>：<span class='k'>L09 p29 起、以及这一讲全部</span>。<span class='w'>三讲加起来就是这张表</span>——<b>而 p34 的通用模板会把它再收一次。</b>", "<b>还有一件这一页没写但值得先知道的事：这三处选择并不独立，它们会互相影响。</b><span class='k'>①选得越偏向 bootstrap，梯度方差越小，于是你<b>可以</b>走得更大步</span>；<span class='w'>反过来，用纯蒙特卡洛时梯度噪声大，大步走很可能是在跟着噪声跑</span>。<b>所以「该走多远」这个问题的答案，部分取决于你的梯度有多准。</b><span class='k'>这一讲的理论只处理「一阶近似的有效范围」，没有处理「估计噪声」那一半</span>——<b>实践中两者都要管，而后者通常靠增大批量来解决。</b>"], "quote": "<b>\"Vanilla\" Policy Gradient Algorithm</b> &nbsp;·&nbsp; Collect a set of trajectories &nbsp;·&nbsp; Return G_t^i = Σ_{t′≥t} r_{t′}^i, Advantage estimate <b>Â_t^i = G_t^i − b(s_t)</b> &nbsp;·&nbsp; Re-fit the baseline by minimizing Σ_i Σ_t ||b(s_t) − G_t^i||² &nbsp;·&nbsp; Update the policy using ĝ &nbsp;|&nbsp; G_t^i is an estimation of the value function <b>from a single roll out</b>: Unbiased but high variance", "tbl": {"head": ["选择", "属于哪类问题", "在哪几讲", "这一讲管吗"], "rows": [["<b>① 目标怎么估</b>", "<span class='k'>统计（估计质量）</span>", "L08 p59 · L09 p22–p25", "<span class='w'>不管</span>"], ["<b>② 基线取什么</b>", "<span class='k'>统计（估计质量）</span>", "L08 p53 · L09 p14–p19", "<span class='w'>不管</span>"], ["<b>③ 沿梯度走多远</b>", "<span class='w'>优化（怎么用这个估计）</span>", "L09 p29 起 · <b>本讲全部</b>", "<b>正题</b>"]]}},
{"r": [8, 8], "t": "为什么「走多远」在 RL 里是个大问题", "star": 3, "one": "<b>你迈出的这一步，决定了下一批数据长什么样。</b>", "pts": ["监督学习里走过头，下一步能纠；RL 里走出坏策略，<span class='w'>可能再也拿不到有用数据</span>。", "所以目标是：<span class='k'>V^{π_{i+1}} ≥ V^{π_i}</span>，而且是在<b>部署之前</b>就能知道。", "DQN 之类没有这个保证。金融、客户、病人这类场合，<b>你会很想在上线前就确信新策略至少不更差</b>。", "<b>这一讲把「为什么要单调改进」说得比第九讲更具体，而关键在「部署」这个词。</b><span class='k'>老师的原话大意是：在金融、客户、病人这类高风险领域，你会很想在<b>部署之前</b>就确信新策略至少不更差</span>。<b>注意这个要求的时间点——不是「跑一阵发现不行再回滚」，而是「上线前就知道」。</b><span class='w'>回滚是有代价的：已经发出去的交易、已经给出去的建议、已经用过的药，收不回来。</span>", "<b>而「部署前就知道」这个要求，恰好就是整套推导存在的理由，值得把逻辑串一遍。</b><span class='k'>要在部署前判断新策略好不好，你就不能跑它</span>；<span class='k'>不跑它，就拿不到它的状态分布</span>；<span class='w'>拿不到状态分布，那个精确的恒等式（p9）就算不出来</span>。<b>于是只能退而求其次：用旧分布算一个代理，再证明真实值不会比代理低太多。</b><span class='k'>这就是 p12 到 p18 的全部内容。</span>", "<b>课件那个词 <em>automatically</em> 也值得咬一下，它排除了一种常见做法。</b><span class='w'>「自动」意味着不靠在线试、不靠人盯着曲线调学习率</span>；<span class='k'>而是由算法本身给出一个「这一步安全」的证书</span>。<b>对比 L06 p12 那条「跑两个种子、耐心等 10–40M 帧」的建议</b>——<span class='w'>那是在承认没有证书，只能靠重复实验去发现问题</span>。<b>这一讲想要的是另一种东西。</b>", "<b>最后指出一个这一页没说、但你应该知道的边界：这个保证是关于<span class='k'>期望值</span>的。</b><span class='w'><code>V^{π′} ≥ V^π</code> 说的是期望回报不更差</span>，<b>它不保证每一个病人、每一笔交易都不更差</b>（<span class='k'>第九讲老师当堂澄清过这一点</span>）。<b>所以「部署前就知道」这个承诺，兑现的也只是期望层面的那一半。</b><span class='w'>而高风险领域真正关心的往往是尾部，不是均值</span>——<b>这个缺口这门课不处理，但你该知道它在那里。</b>", "<b>把这一页和 L02 p39 的策略改进定理并排放一次，你就能准确说出这一讲在补什么。</b><span class='k'>L02 有模型时：取 arg max 就<b>严格</b>单调改进，而且是定理，不要任何条件</span>；<span class='w'>这里没模型、只有采样和一阶近似，于是同样的保证要费十几页才能拿到一个弱化版</span>。<b>弱化在两处：① 它是个下界而不是等式；② 那个下界里的常数算不出来。</b><span class='k'>知道「有模型时这件事是免费的」，你才会明白这一讲在付什么代价。</span>"], "quote": "Can we <b>automatically</b> ensure the updated policy π′ has value greater than or equal to the prior policy π: <b>V^{π′} ≥ V^π</b>? &nbsp;·&nbsp; Consider this for the policy gradient setting, and hope to address this by modifying step size"},
{"r": [9, 10], "t": "关键改写：用旧策略的优势表达新策略的值", "star": 3, "one": "<b>整条推导的起点。</b>", "eq": "V(θ̃) = V(θ) + Σ_s μ^{π̃}(s) Σ_a π̃(a|s)·A^π(s,a)\n\n读法：新策略的值 = 旧策略的值\n      + 「按新策略走时，每一步相对旧策略赚了多少」", "pts": ["<b>我们手上有什么</b>：新策略 <code>π̃</code> 的显式形式（就是网络的新参数）、以及能估的优势函数 <code>A^π</code>。", "<span class='w'>我们没有什么</span>：<code>μ^{π̃}</code>——新策略下的状态分布，<b>要真去跑才知道</b>。", "<span class='k'>这就是 off-policy 的困难所在。</span>", "<b>这一页把「有什么、缺什么」列得很清楚，值得照着核对一遍，因为后面每一步都是在补那个缺口。</b><span class='k'>有：新策略 <code>π̃</code> 的显式形式（就是网络的新参数，你随时能查它在任何状态给任何动作多大概率）；以及优势函数 <code>A^π</code>（能从旧数据估）</span>。<span class='w'>缺：<code>μ^{π̃}</code>——新策略下的状态分布，要真去跑才知道</span>。<b>注意这个缺口的性质：它不是「估不准」，是「根本没有」。</b>", "<b>老师把目标说得很干脆：<span class='k'>我们想在不真跑新策略的前提下，判断它是不是更好</span>。</b><b>这句话值得当成整段推导的题注。</b><span class='w'>而它的困难是结构性的——你要知道一个东西在某个分布下的表现，而那个分布只有执行它才能产生</span>。<span class='k'>课件自己在这一页标了 <em>off policy learning!</em></span>，<b>于是问题又回到了这门课的老主题：只能从一个分布采样，却想知道另一个分布下的期望。</b>", "<b>把这个恒等式的两项分开理解，它的结构其实很友好。</b><b>第一项 <code>V(θ)</code> 你完全知道</b>（<span class='k'>那是旧策略的值，能估</span>）；<b>第二项是「按新策略走时，每一步相对旧策略赚了多少」的折扣和</b>。<span class='w'>所以全部的未知都集中在第二项的「按新策略走」这几个字上</span>——<b>权重 <code>A^π</code> 是已知的，只有「在哪些状态上加权」不知道。</b><span class='k'>这个定位很重要：它告诉你该去近似什么，而不是整体瞎猜。</span>", "<b>最后提一个符号上的小差异，免得你在两讲之间对照时犯迷糊。</b><span class='k'>第九讲用 <code>ρ^{π̃}(s)</code>，这一讲用 <code>μ^{π̃}(s)</code></span>——<b>同一个量，两种写法。</b><span class='w'>它都是「折扣加权访问频率」，在所有状态上的和是 <code>1/(1−γ)</code> 而不是 1</span>，<b>所以它不是概率分布。</b><span class='k'>而这个 <code>1/(1−γ)</code> 正是下界里那个平方项的来源</span>，<b>也是 p22 第一次替换要提出来的那个常数。</b>"], "say": "老师把目标说得很干脆：<b>我们想在不真跑新策略的前提下，判断它是不是更好。</b>", "quote": "Have access to samples from the current policy π_old &nbsp;·&nbsp; <b>Want to predict the value of a different policy (off policy learning!)</b> &nbsp;|&nbsp; <b>V(θ̃) = V(θ) + E_{π̃}[Σ_t γ^t A^π(s_t,a_t)] = V(θ) + Σ_s μ^{π̃}(s) Σ_a π̃(a|s) A^π(s,a)</b> &nbsp;·&nbsp; <b>But we can't compute the above because we don't know μ^{π̃}</b>, the state distribution under the new proposed policy", "tbl": {"head": ["恒等式里的量", "属于谁", "有吗", "为什么"], "rows": [["<code>V(θ)</code>", "旧策略", "<span class='k'>有</span>", "能从旧数据估"], ["<code>A^π(s,a)</code>", "旧策略", "<span class='k'>有</span>", "同上（这是 vanilla PG 本来就在算的）"], ["<code>π̃(a|s)</code>", "新策略", "<span class='k'>有</span>", "<b>就是网络的新参数，随时能查</b>"], ["<code>μ^{π̃}(s)</code>", "新策略", "<span class='w'>没有</span>", "<b>要真跑才知道——而我们恰恰不想跑</b>"]]}},
{"r": [11, 11], "t": "目录：局部近似", "quote": "Table of Contents &nbsp;·&nbsp; <b>1 Updating the Parameters Given the Gradient: Local Approximation</b> &nbsp;·&nbsp; 2 ... Trust Regions &nbsp;·&nbsp; 3 ... TRPO Algorithm", "one": "第一节：<b>硬换掉那个算不出的分布，然后量化错多少</b>。", "pts": ["<b>这一节（p12–p18）只有七页，但它是整条推导的全部理论内容，而且结构非常规整。</b><span class='k'>p12 硬换 → p13 先证一个窄的下界 → p14 推广到一般情形 → p16 说明优化下界就够</span>。<b>四步，每一步补上一步留下的缺口。</b><span class='w'>而这一片会在这四步里逐条标出课件和板书上的几处笔误</span>——<b>它们不影响结论，但会让你在自己复算时对不上。</b>"]},
{"r": [12, 12], "t": "局部近似：硬换掉那个分布", "star": 3, "one": "把 <code>μ^{π̃}</code> 换成 <code>μ^π</code>，得到一个<b>能用旧样本算</b>的目标。", "eq": "L_π(π̃) = V(θ) + Σ_s μ^π(s) Σ_a π̃(a|s)·A^π(s,a)\n                    ↑ 换成了旧策略的状态分布\n\n两条性质：\n  L_{π_i}(π_i) = V(π_i)                    ← 自己代自己，第二项的优势为 0\n  ∇_θ L|_{θ=θ₀} = ∇_θ V(θ)|_{θ=θ₀}         ← 在 θ₀ 处梯度也相同", "pts": ["<b>两个策略的状态分布一般不相等</b>——除非它们本来就一样。", "<span class='k'>但我们有旧策略的样本</span>，所以这个期望估得出来。", "先别问它对不对：<b>它只是一个能优化的量</b>，下面几页会证明它是个有用的下界。", "<b>老师回答「这和重要性采样是什么关系」时给的区分非常重要，而且很容易混，值得记死。</b><span class='k'>重要性采样：承认两个分布不同，按比值<b>重加权</b>把它纠过来——纠完是无偏的</span>；<span class='w'>这一页：直接<b>假装</b>两个状态分布相同，把差别忽略掉——这是有偏的</span>。<b>两者完全不是一回事。</b><span class='k'>而 p22 的第二次替换里才真的出现重要性采样，那是对<b>动作</b>做的，不是对状态</span>——<b>这个「状态靠假装、动作靠重加权」的分工，是整套做法的一个核心细节。</b>", "<b>为什么状态那一层不能也用重要性采样？因为你算不出那个比值。</b><span class='k'>重要性权重是 <code>μ^{π̃}(s)/μ^π(s)</code>，而分子正是你不知道的那个东西</span>。<b>动作那一层就不同了：<code>π̃(a|s)/π_old(a|s)</code> 两边都是你手上的策略，直接算。</b><span class='w'>所以「哪一层能重加权」取决于你有没有那个分布的显式形式</span>——<b>策略有，状态分布没有。</b>", "<b>老师顺带提到的那条线索值得记一下，因为它正是在补这个缺口。</b><span class='k'>NeurIPS 2018 有一批工作（Lihong Li 等）去重加权<b>平稳分布本身</b></span>，<b>也就是直接估 <code>μ^{π̃}/μ^π</code> 这个比值，而不是绕开它。</b><span class='w'>这对长 horizon 问题降方差很有帮助</span>——<b>因为传统的逐步重要性采样在长轨迹上方差会指数爆炸，而「分布层面的比值」不会。</b><span class='k'>这条线今天叫 marginalized importance sampling，是 off-policy 评估的主流方向之一。</span>", "<b>最后把「它只是一个能优化的量」这句话的分寸说准：<span class='w'>L 本身没有任何保证</span>。</b><b>它既不是 <code>V(θ̃)</code> 的无偏估计，也不是它的上界或下界。</b><span class='k'>它唯一的资格是那两条性质：在当前点上值和一阶导都对</span>。<b>换句话说，<code>L</code> 在当前点附近是对的，走远了就什么都不是。</b><span class='w'>而「走多远还算近」这件事，要等 p13–p15 的下界才有答案。</span>"], "say": "有同学问「这和重要性采样是什么关系」。老师答得很清楚：<b>不一样</b>。重要性采样是<span class='k'>按比值重加权</span>，而且通常是逐状态做；这里是直接<span class='w'>假装两个状态分布相同</span>，把差别忽略掉。<br>她提到 NeurIPS 2018 有篇工作（Lihong Li 等）正是去重加权<b>平稳分布</b>本身，对长 horizon 问题降方差很有帮助。", "quote": "<b>Can we remove the dependency on the discounted visitation frequencies under the new policy?</b> &nbsp;·&nbsp; Substitute in the discounted visitation frequencies under the current policy &nbsp;·&nbsp; <b>L_π(π̃) = V(θ) + Σ_s μ^π(s) Σ_a π̃(a|s) A^π(s,a)</b> &nbsp;·&nbsp; Note that <b>L_{π_{θ_0}}(π_{θ_0}) = V(θ_0)</b> &nbsp;·&nbsp; <b>∇_θ L|_{θ=θ_0} = ∇_θ V(θ)|_{θ=θ_0}</b>", "tbl": {"head": ["", "重要性采样（p22 第②步）", "这一页的做法"], "rows": [["对什么做", "<b>动作</b>", "<b>状态分布</b>"], ["怎么做", "<span class='k'>按比值重加权</span>", "<span class='w'>直接假装相同，忽略差别</span>"], ["有偏吗", "<span class='k'>无偏</span>", "<span class='w'>有偏</span>"], ["为什么能/不能", "<code>π̃/π_old</code> 两边都知道", "<b><code>μ^{π̃}/μ^π</code> 的分子正是未知的那个</b>"], ["补救", "—", "<span class='k'>p13–p15 的下界量化这一换错了多少</span>"]]}},
{"r": [13, 13], "t": "第一个下界：保守策略迭代", "star": 3, "one": "先只看「新旧策略按比例混合」这种特殊情形。", "eq": "π_new(a|s) = (1−α)·π_old(a|s) + α·π′(a|s)\n  —— 以概率 1−α 照旧走，以概率 α 换新动作\n\nV^{π_new} ≥ L_{π_old}(π_new) − [ 2εγ/(1−γ)² ]·α²\n\n其中 ε = max_s | E_{a~π′}[ A^π(s,a) ] |", "pts": ["<b>这已经说明用那个「错」的目标 L 去优化是有保证的。</b>", "<span class='w'>但只对混合策略成立</span>，太窄。下一页推广。", "α = 0 时罚项为 0，界是紧的。", "<b>混合策略这个形式要理解对，否则 α 的含义会想偏。</b><span class='k'>它不是「参数走了 α 这么远」，而是「每一步以概率 α 改用另一个策略」</span>——<b>一个真正的随机混合。</b><span class='w'>所以 α = 0.1 意味着十步里大约有一步用新动作，其余照旧</span>。<b>这正是「保守策略迭代」里「保守」二字的来源：一次只换一小部分。</b>", "<b>注意这一页的 ε 和下一页的 ε 定义<span class='w'>不一样</span>，这是个容易看漏的细节。</b><span class='k'>这一页：<code>ε = max_s |E_{a∼π′}[A^π(s,a)]|</code>——先对动作取期望，再对状态取 max</span>；<span class='k'>下一页：<code>ε = max_{s,a} |A^π(s,a)|</code>——直接对状态和动作一起取 max</span>。<b>后者显然更大（甚至可以大很多）。</b><span class='w'>这正是推广到一般策略要付的代价之一</span>——<b>常数从 2 变成 4，而 ε 本身也变大了。</b>", "<b>把这个界读成一句话：<span class='k'>用那个「错」的目标 L 去优化，是有保证的，只要你别改太多</span>。</b><b>而「改太多」的代价按 <code>α²</code> 增长。</b><span class='w'>这是全部结论里最该带走的那条</span>——<b>它把一个看起来很可疑的操作（硬换分布）变成了一个可控的操作。</b>"], "quote": "Consider <b>mixture policies</b>: π_new(a|s) = (1−α) π_old(a|s) + α π′(a|s) &nbsp;·&nbsp; <b>V^{π_new} ≥ L_{π_old}(π_new) − [2εγ/(1−γ)²] α²</b> &nbsp;·&nbsp; where <b>ε = max_s |E_{a∼π′}[A^π(s,a)]|</b>"},
{"r": [14, 15], "t": "推广到一般随机策略", "star": 3, "one": "把「混合比例」换成<b>两个策略之间的距离</b>。", "eq": "先定义距离：\n  D_TV(π₁(·|s), π₂(·|s)) = max_a | π₁(a|s) − π₂(a|s) |\n  D_TV^max(π₁,π₂) = max_s D_TV( π₁(·|s), π₂(·|s) )\n  —— 在所有状态上，两个策略对某个动作给出的概率差最大是多少\n\n定理：V^{π_new} ≥ L_{π_old}(π_new) − [ 4εγ/(1−γ)² ]·( D_TV^max )²\n      其中 ε = max_{s,a} | A^π(s,a) |\n\n又因为 D_TV(p,q)² ≤ D_KL(p,q)，立刻有：\n      V^{π_new} ≥ L_{π_old}(π_new) − [ 4εγ/(1−γ)² ]·D_KL^max(π_old, π_new)", "pts": ["<span class='k'>换成 KL 是为了好处理</span>——全变差距离用起来不方便。", "<code>1/(1−γ)²</code> 又出现：<b>有效 horizon 越长，走偏的代价越大。</b>", "<b>这一页有两处写法需要更正，它们不改变结论，但会让你自己复算时对不上，所以逐条说清楚。</b>", "<b>更正一：<span class='w'>板上把 <code>D_TV</code> 写成了 <code>max_a |π₁(a|s) − π₂(a|s)|</code></span>，那是 <code>L∞</code> 距离，不是全变差距离。</b><span class='k'>全变差的定义是 <code>D_TV(p,q) = ½ Σ_a |p(a) − q(a)|</code></span>——<b>是绝对差之<b>和</b>的一半，不是绝对差的<b>最大值</b>。</b><span class='w'>两者在动作只有两个时恰好相等</span>（<b>因为 <code>|p₁−q₁| = |p₂−q₂|</code>，于是 <code>½·2·|p₁−q₁| = max</code></b>），<b>但一般情况下 <code>D_TV ≥ L∞</code>，而且可以差很多。</b><span class='k'>四个动作的例子：<code>p = (0.4, 0.4, 0.1, 0.1)</code>，<code>q = (0.1, 0.1, 0.4, 0.4)</code> ⇒ <code>D_TV = 0.6</code>，而 <code>L∞ = 0.3</code>，差了一倍。</span>", "<b>而这一处写错的方向是<span class='w'>不利的</span>，所以值得较真。</b><span class='k'>因为 <code>L∞ ≤ D_TV</code>，用 <code>L∞</code> 算出来的惩罚项更<b>小</b>，于是「下界」被抬高了</span>——<b>也就是说，按板上那个写法得到的不等式<b>不成立</b>（它声称了一个比真实下界更强的结论）。</b><span class='w'>按定理原本的 <code>D_TV</code> 来记就没问题。</span><b>好在接下来换成 KL 之后这件事就不要紧了，因为 KL 那一步是从真正的 <code>D_TV</code> 出发的。</b>", "<b>更正二：<span class='w'>课件写的 <code>D_TV(p,q)² ≤ D_KL(p,q)</code> 漏了一个 ½</span>。</b><span class='k'>Pinsker 不等式的标准形式是 <code>D_TV(p,q)² ≤ ½ D_KL(p,q)</code></span>。<b>不过这一处的方向是<span class='k'>安全</span>的</b>——<span class='w'>因为 <code>½D_KL ≤ D_KL</code>，所以课件那个更弱的不等式仍然成立</span>，<b>推出来的界也仍然成立，只是比能做到的松了一倍。</b><span class='k'>用正确的 Pinsker，惩罚系数可以减半：<code>2εγ/(1−γ)²</code> 而不是 <code>4εγ/(1−γ)²</code>。</span>", "<b>为什么要把 <code>D_TV</code> 换成 KL，理由在后面才兑现，但现在就可以说。</b><span class='k'>KL 对常见的参数化策略有闭式表达，而且对参数可微</span>——<b>两个高斯之间的 KL、两个 softmax 之间的 KL，都能直接写出来并求导。</b><span class='w'>全变差距离做不到（它带绝对值，不光滑）</span>。<b>于是这一步把「理论上的界」变成了「能塞进优化器的约束」</b>——<span class='k'>p20 的信赖域约束用的就是它。</span>", "<b>最后看那个 <code>ε = max_{s,a} |A^π(s,a)|</code>，它是这个定理里最难对付的一项。</b><span class='w'>它是优势函数在<b>所有</b>状态动作上的最大绝对值，而且依赖于策略</span>——<b>实践中基本算不出来。</b><span class='k'>老师在下一页会当堂承认这一点：「这部分是<b>形式上的</b>保证」</span>。<b>认清这件事很重要：这个定理告诉你「存在这样一个界」，但它不给你一个能代进去的数。</b>"], "quote": "<b>Theorem</b>: Let D_TV^max(π_1,π_2) = max_s D_TV(π_1(·|s), π_2(·|s)). Then <b>V^{π_new} ≥ L_{π_old}(π_new) − [4εγ/(1−γ)²] (D_TV^max(π_old,π_new))²</b> &nbsp;·&nbsp; where <b>ε = max_{s,a} |A^π(s,a)|</b> &nbsp;|&nbsp; Note that <b>D_TV(p,q)² ≤ D_KL(p,q)</b> &nbsp;·&nbsp; Then <b>V^{π_new} ≥ L_{π_old}(π_new) − [4εγ/(1−γ)²] D_KL^max(π_old, π_new)</b>", "tbl": {"head": ["写法", "板上/课件", "正确的", "影响"], "rows": [["<code>D_TV</code>", "<span class='w'><code>max_a |p−q|</code>（即 L∞）</span>", "<code>½ Σ_a |p−q|</code>", "<b>惩罚被低估 ⇒ 不等式不成立</b>（两动作时才相等）"], ["Pinsker", "<span class='w'><code>D_TV² ≤ D_KL</code></span>", "<code>D_TV² ≤ ½ D_KL</code>", "<span class='k'>界仍成立，但松了一倍</span>"], ["<code>ε</code>（p13）", "<code>max_s |E_{a∼π′}[A]|</code>", "—", "先对动作取期望"], ["<code>ε</code>（p14）", "<code>max_{s,a} |A|</code>", "—", "<span class='w'>更大，而且实践中算不出来</span>"]]}},
{"r": [16, 18], "t": "为什么「优化下界」就够了", "star": 3, "one": "<b>只要下界比旧值高，真实值就一定更好。</b>", "eq": "记 M_i(π) = L_{π_i}(π) − [ 4εγ/(1−γ)² ]·D_KL^max(π_i, π)\n\n① 由上一页的定理：      V^{π_{i+1}} ≥ M_i(π_{i+1})\n② 把 π_i 代进 M_i 自己：\n     KL(π_i, π_i) = 0  ⇒  M_i(π_i) = L_{π_i}(π_i) = V^{π_i}\n\n两式相减：  V^{π_{i+1}} − V^{π_i} ≥ M_i(π_{i+1}) − M_i(π_i)\n\n⇒ 只要右边 > 0，就有单调改进", "pts": ["<span class='k'>第②步是全部关键</span>：下界在当前策略处<b>恰好等于</b>真实值，所以这是一根「贴着真值」的下界。", "这类做法叫 <b>MM（minorize-maximize）</b>：反复优化一个贴住目标的下界。", "<b>更正三：这一页口头上有一处说反了，而且随后就被说对了，值得对着原话看一次。</b><span class='w'>实录里先出现的是：「So we're gonna say V_i+1 is gonna be <b>equal to</b> Mi of pi i+1」</span>——<b>这里应该是 <code>≥</code> 而不是 <code>=</code>。</b><span class='k'>随后在真正走推导时，她说的是对的：「we know that's <b>greater than or equal to</b> Mi of pi_i+1 ... the new value of the policy is greater than or equal to this lower bound we computed」</span>。<b>按后一句记。</b>", "<b>为什么这个区别要紧：<span class='k'>只有第②式 <code>V^{π_i} = M_i(π_i)</code> 才是等号，第①式必须是不等号</span>。</b><b>两式一个等号一个不等号，相减才得到有用的结论。</b><span class='w'>如果两式都是等号，那 <code>M</code> 就不是「下界」而是「值本身」了</span>——<b>那样的话整件事是平凡的，也就不需要这一讲。</b><span class='k'>这个「一等一不等」的结构，正是 MM 算法的签名。</span>", "<b>而第②式为什么能取等号，要自己确认一遍，因为它是全部的支点。</b><span class='k'>把 <code>π = π_i</code> 代进 <code>M_i</code>：<code>D_KL(π_i, π_i) = 0</code>，惩罚项整个归零</span>；<span class='k'>而 <code>L_{π_i}(π_i) = V^{π_i}</code>（p12 的第一条性质）</span>。<b>于是 <code>M_i(π_i) = V^{π_i}</code>，严格相等。</b><span class='w'>注意这两件事缺一不可</span>——<b>惩罚项必须在 <code>π_i</code> 处归零，而这正是 KL 散度这个选择的另一个理由（它对自己是 0）。</b>", "<b>学生那两个追问，恰好把这个论证最容易被怀疑的地方问掉了，值得记住答案。</b><span class='k'>问一：「会不会出现下界变好、真实值反而变差？」答：不会</span>——<b>因为旧策略的下界<b>就等于</b>旧策略的真值，所以「我手上有个东西，它的下界比我现在的真值还高，那它本身一定更好」。</b><span class='w'>问二：关于 ε</span>——<span class='k'>它是对所有状态动作取的优势最大值，而且依赖于策略，实践中基本算不出来</span>。<b>老师直接承认了：「这部分是形式上的保证；接下来要谈的是怎么把它做成能跑的算法。」</b>", "<b>这句「形式上的保证」要当真，它决定了你该怎么看待接下来的 TRPO。</b><span class='w'>定理告诉你「存在一个 C，使得这个界成立」</span>；<span class='w'>但它不给你一个能代进去的 C</span>（<b>因为 ε 算不出来</b>）。<b>于是实践中只能把 C 当成一个要调的超参，或者干脆改成硬约束（p20）。</b><span class='k'>这是从「定理」到「算法」之间那道缝</span>——<b>而 TRPO 的全部工程内容，就是在这道缝上搭桥。</b>"], "say": "有同学追问：「会不会出现下界变好、真实值反而变差的情况？」老师答：<b>不会</b>——因为旧策略的下界就等于旧策略的真值，「我手上有个东西，它的下界比我现在的值还高，那它本身一定更好」。<br>另一位同学问到 <b>ε</b>：它是<span class='w'>对所有状态动作取的优势最大值，而且依赖于策略</span>，实践中基本算不出来。老师承认这一点：「这部分是<b>形式上的</b>保证；接下来要谈的是怎么把它做成能跑的算法。」", "quote": "M_i(π) = L_i(π) − [4εγ/(1−γ)²] D_KL^max(π_i, π) &nbsp;·&nbsp; <b>V^{π_{i+1}} ≥ L_i(π) − [4εγ/(1−γ)²] D_KL^max(π_i,π) = M_i(π_{i+1})</b> &nbsp;·&nbsp; <b>V^{π_i} = M_i(π_i)</b> &nbsp;·&nbsp; <b>V^{π_{i+1}} − V^{π_i} ≥ M_i(π_{i+1}) − M_i(π_i)</b> &nbsp;·&nbsp; So as long as the new policy is equal or an improvement compared to the old policy <b>with respect to the lower bound</b>, we are guaranteed to monotonically improve! &nbsp;·&nbsp; The above is a type of <b>Minorization-Maximization (MM) algorithm</b>", "res": {"tag": "推断", "v": "<b>老师那句「这部分是形式上的保证」，对你的课题是一条很实际的提醒，而且它适用的范围比 TRPO 宽得多。</b><br><br><span class='k'>这个下界的结构是：真实值 ≥ 能算的量 − 一个含未知常数的惩罚</span>。<b>而那个常数 <code>ε = max_{s,a}|A^π(s,a)|</code> 要对所有状态动作取最大值，实践中算不出来。</b><span class='w'>于是这个「保证」在落地时退化成了「一个要调的超参」</span>。<br><br><b>这个模式你会在自己的工作里反复碰到，而且它正好描述了你在 §8 的处境。</b><span class='k'>conformal risk control 给你的也是「真实风险 ≤ 经验风险 + 一个项」</span>，<b>而那个项同样依赖一些难以估准的量（可交换性、校准集大小、分数函数的尾部）。</b><span class='w'>区别在于：conformal 的那些量通常<b>能</b>算，而这里的 ε 不能</span>——<b>所以 conformal 那条线比这一讲的下界务实。</b><span class='k'>这是一个支持你当前技术选择的理由，值得在 related work 里点一句。</span><br><br><b>而这一讲真正可以搬走的，是那个「一等一不等」的结构，它在你那里有一个现成的对应。</b><span class='k'>你要比较一套新配置和日志里的旧配置</span>——<b>而「旧配置的估值等于它的真值」这件事对你是成立的（它跑过，你有真实的 Acc 和 Cost）。</b><span class='w'>所以你天然有那个「等号」的一端</span>。<b>缺的只是另一端：新配置的估值要是一个<b>下界</b>而不是一个点估计。</b><span class='k'>把 FQE 的点估计换成一个带置信下界的区间，你就得到了和这一页同样结构的「部署前的证书」</b>——<b>而这正是 §4d 那张 oracle 表该承担的角色。</b>", "ref": "课件 p16–p18 · 老师当堂承认 ε 算不出来 · 本讲 p14 · 简报 §4d §8"}},
{"r": [19, 19], "t": "目录：信赖域", "quote": "Table of Contents &nbsp;·&nbsp; 1 ... Local Approximation &nbsp;·&nbsp; <b>2 Updating the Parameters Given the Gradient: Trust Regions</b> &nbsp;·&nbsp; <b>3 ... TRPO Algorithm</b>", "one": "后两节：<b>把那个没法用的常数换成一个能调的约束，然后变成算法</b>。", "pts": ["<b>前一节结束时，你手上有一个漂亮但不能用的东西，这一节要把它变得能用。</b><span class='k'>漂亮在：它给出了「优化下界就保证单调改进」这个定理</span>；<span class='w'>不能用在：下界里那个常数 <code>C = 4εγ/(1−γ)²</code> 既算不出来（ε 未知），就算算出来也大到让步长趋近于零</span>。<b>p20 会把这个数真的算一遍。</b>", "<b>接下来四步，每一步都是一次「向实践让步」，而让步的内容值得先记下来。</b><b>① p20</b>：<span class='k'>惩罚改成硬约束</span>，<span class='w'>代价是失去定理，δ 变成要调的超参</span>。<br><b>② p20</b>：<span class='k'>最大 KL 改成平均 KL</span>，<span class='w'>代价是不再保证每个状态都受控</span>。<br><b>③ p22</b>：<span class='k'>三次替换，把每样东西换成能从样本算的</span>，<span class='k'>这一步课件强调不改变最优解</span>。<br><b>④ p27</b>：<span class='k'>目标线性近似、约束二次近似</span>，<span class='w'>代价是又一层近似误差，靠线搜索兜底</span>。", "<b>读这一节时有个省力的办法：把每一步问成「这次让步换来了什么」。</b><span class='k'>p20 第一次让步换来「步长能调」；第二次换来「约束数从无穷变成一条」；p22 的三次替换换来「每样东西都能从样本算」；p27 的两次近似换来「有闭式解」</span>。<b>四次让步，换来一个能跑的算法。</b><span class='w'>而代价累加起来，就是「定理」变成了「启发式」。</span>"]},
{"r": [20, 21], "t": "把惩罚项改成硬约束", "star": 3, "one": "按理论取惩罚系数，<b>步子会小到没法用</b>。", "eq": "理论形式：max_θ  L_{θ_old}(θ) − C·D_KL^max(θ_old, θ)，  C = 4εγ/(1−γ)²\n\nTRPO 的形式：\n  max_θ  L_{θ_old}(θ)\n  s.t.   E_{s~μ_{θ_old}}[ D_KL( π_{θ_old}(·|s), π_θ(·|s) ) ] ≤ δ", "pts": ["<b>直觉</b>：策略只改一点点，值也变不了多少——<span class='k'>所以保守的界就意味着极小的步长</span>。但我们还想快点到一个好策略。", "<b>信赖域</b>的含义：在一阶近似还靠谱的那个范围内走，范围用 KL 界定。", "顺带把 <code>max_s</code> 放松成<b>对状态分布取期望</b>——更好估。", "<b>把 <code>C = 4εγ/(1−γ)²</code> 这个数真的算一遍，你就明白课件为什么说「步子会小到没法用」。</b><span class='k'>取 γ = 0.99：<code>C = 4 × 0.99 / (0.01)² = 3.96 / 0.0001 = 39600</code>，再乘上 ε</span>——<b>也就是 <code>C = 39600ε</code>。</b><span class='w'>而 ε 是优势函数的最大绝对值，在奖励归一化到 [0,1] 的问题里量级通常在 1 附近</span>。<b>于是惩罚项是 <code>39600 × D_KL</code>。</b><span class='k'>要让这一项不压倒目标的提升，KL 必须小到 <code>10⁻⁴</code> 量级</span>——<b>那基本等于不动。</b>", "<b>再换几个 γ 对比一下，你会看到这个系数对 γ 有多敏感。</b><span class='k'>γ = 0.9：<code>C = 4×0.9/0.01 = 360ε</code></span>；<span class='k'>γ = 0.95：<code>C = 4×0.95/0.0025 = 1520ε</code></span>；<span class='w'>γ = 0.99：<code>39600ε</code>；γ = 0.999：<code>≈ 4×10⁶ε</code></span>。<b>γ 从 0.99 升到 0.999，步长要缩小一百倍。</b><span class='k'>而 γ 这个参数在实践中经常是随手设的</span>——<b>这一页提醒你它不只影响「看多远」，还影响「每步能走多远」的理论上界。</b>", "<b>对策是把惩罚换成约束，而这两者的区别值得说清楚，因为它改变了谁来定步长。</b><span class='k'>惩罚形式 <code>max L − C·D_KL</code>：C 定了，优化器自己权衡，步子多大是算出来的</span>；<span class='k'>约束形式 <code>max L</code> s.t. <code>D_KL ≤ δ</code>：你直接规定步子上限，然后在这个范围内尽量优化</span>。<b>后者把控制权从「一个算不出的理论常数」交回到「一个你能调的数」手上。</b><span class='w'>而 δ 还有一个好处：它的含义不依赖 ε 和 γ，跨任务也大致可比。</span>", "<b>第二处放松是把 <code>max_s</code> 换成对状态分布取期望，课件给的理由非常实际。</b><b>原文：<em>the max requires the KL is bounded at all states and yields an impractical number of constraints</em>。</b><span class='k'>要求「每一个状态上 KL 都小」，就是状态有多少个就有多少条约束</span>——<span class='w'>连续状态空间下那是无穷多条</span>。<b>换成期望之后只剩一条，而且能用采到的那批状态直接估。</b><span class='w'>代价：平均 KL 小，不排除个别状态上 KL 很大</span>——<b>也就是说，个别状态上的策略可能变化剧烈，而你不会察觉。</b>", "<b>把这两处放松的后果合起来说一次，这决定了你该怎么看待 TRPO 的「保证」。</b><span class='w'>① 用你调的 δ 代替理论的 C ⇒ 单调改进的定理不再适用</span>；<span class='w'>② 用平均 KL 代替最大 KL ⇒ 定理的前提（逐状态有界）也不满足了</span>。<b>所以 TRPO 是一个<span class='k'>受理论启发的启发式</span>，不是一个带证明的算法。</b><span class='w'>课件 p31 的措辞是 <em>empirically consistently does well</em>——注意是经验上。</span><b>这个定位要说准，它是这一讲最容易被夸大的地方。</b>"], "quote": "max L_old(π_new) − [4εγ/(1−γ)²] D_KL^max(π_old, π_new) = L_old(π_new) − C D_KL^max &nbsp;·&nbsp; where <b>C is the penalty coefficient</b> &nbsp;·&nbsp; <b>In practice, if we used the penalty coefficient recommended by the theory above C = 4εγ/(1−γ)², the step sizes would be very small</b> &nbsp;|&nbsp; New idea: <b>Use a trust region constraint on step sizes</b> (Schulman, Levine, Abbeel, Jordan, &amp; Moritz ICML 2015) &nbsp;·&nbsp; max_θ L_{θ_old}(θ) subject to <b>D_KL^{s∼μ_old}(θ_old, θ) ≤ δ</b> &nbsp;·&nbsp; This uses the <b>average KL instead of the max</b>", "tbl": {"head": ["γ", "<code>1/(1−γ)²</code>", "<code>C = 4εγ/(1−γ)²</code>", "KL 得小到什么量级"], "rows": [["0.9", "100", "<code>360ε</code>", "<code>~10⁻²</code>"], ["0.95", "400", "<code>1520ε</code>", "<code>~10⁻³</code>"], ["<b>0.99</b>", "<b>10000</b>", "<b><code>39600ε</code></b>", "<span class='w'><code>~10⁻⁴</code>（基本等于不动）</span>"], ["0.999", "一百万", "<code>≈4×10⁶ε</code>", "<span class='w'><code>~10⁻⁶</code></span>"]]}},
{"r": [22, 24], "t": "从理论到实践：三次替换", "star": 3, "one": "访问频率、动作求和、优势函数——<b>三样都换成能从样本算的东西</b>。", "eq": "① Σ_s μ^π(s)[…]    →   (1/(1−γ))·E_{s~μ_{θ_old}}[…]\n   —— 状态空间可能连续无穷，只能用旧策略实际走到的那些状态\n\n② Σ_a π_θ(a|s_n)·A_{θ_old}(s_n,a)\n                   →   E_{a~q}[ (π_θ(a|s_n)/q(a|s_n))·A_{θ_old}(s_n,a) ]\n   —— 动作也可能连续；用重要性采样，q 是采样分布\n\n③ A_{θ_old}        →   Q_{θ_old}\n   —— 两者只差一个与动作无关的 V，不影响 arg max\n\n课件强调：这三次替换<b>不改变最优解</b>", "pts": ["<span class='k'>②这里才真的出现了重要性采样</span>——和 p12 的「直接忽略分布差异」不是一回事，别混。", "<b>三次替换各自对付一个「写得出但算不了」的地方，而且它们对付的是不同的困难，值得分清。</b><b>① 状态求和</b>：<span class='w'>状态空间可能连续无穷，<code>Σ_s</code> 写不出来</span>⇒ <span class='k'>换成对实际走到的那些状态求平均</span>。<br><b>② 动作求和</b>：<span class='w'>动作也可能连续，而且你只在每个状态上采了一个动作</span>⇒ <span class='k'>用重要性采样，把「新策略会怎么选」折算到「旧策略实际选了什么」上</span>。<br><b>③ 优势函数</b>：<span class='w'><code>A</code> 要先有 <code>V</code> 才能算</span>⇒ <span class='k'>换成 <code>Q</code>，少学一个东西</span>。", "<b>第①次替换里那个 <code>1/(1−γ)</code> 就是 p9 说的那个「和不为 1」的后果，现在它兑现了。</b><span class='k'><code>μ_old</code> 的总质量是 <code>1/(1−γ)</code>，所以把它当成概率分布来求期望，得先除掉这个数、再乘回来</span>。<b>而它是个常数，不影响 arg max。</b><span class='w'>所以你在实现代码里常常看不到它</span>——<b>但它在推导里必须出现，否则等式不成立。</b>", "<b>第②次替换是三次里唯一有实质统计代价的一次，值得把它和 p12 那次「硬换」对照清楚。</b><span class='k'>p12 对<b>状态分布</b>做的是「直接假装相同」——有偏，靠下界定理兜底</span>；<span class='k'>这里对<b>动作分布</b>做的是「按比值重加权」——无偏，但有方差</span>。<b>两层各用一种办法，而选择的依据是「你有没有那个分布的显式形式」</b>（<span class='w'>p12 已经说过</span>）。<b>所以同一个 off-policy 问题，在两个层面上被用了两种完全不同的技术。</b>", "<b>课件强调的 <em>do not change the solution</em> 要理解准：它说的是「优化问题的解不变」，不是「每一步都是精确的」。</b><span class='k'>①和③确实是恒等变形</span>；<span class='w'>②虽然在期望意义上无偏，但你用有限样本去估它时会有误差</span>。<b>所以「不改变最优解」成立的前提是期望能被精确计算。</b><span class='k'>实践中那个误差正是方差，而信赖域约束顺带在压它</span>——<b>因为两个策略越接近，重要性权重越接近 1，方差越小。</b>"], "quote": "Don't know the discounted visitation weights nor true advantage function. Instead do the following substitutions: &nbsp;·&nbsp; <b>① Σ_s μ_old(s)[...] → (1/(1−γ)) E_{s∼μ_old}[...]</b> &nbsp;·&nbsp; <b>② Σ_a π(a|s_n,θ) A_old(s_n,a) → E_{a∼q}[ (π(a|s_n)/q(a|s_n)) A_old(s_n,a) ]</b> &nbsp;·&nbsp; <b>③ A_old → Q_old</b> &nbsp;·&nbsp; <b>Note that these 3 substitutions do not change the solution to the above optimization problem</b>", "tbl": {"head": ["替换", "对付什么困难", "办法", "有偏吗"], "rows": [["① 状态求和", "<span class='w'>状态空间连续无穷，Σ_s 写不出</span>", "<span class='k'>对实际走到的状态求平均</span>", "<b>（分布已在 p12 被换过，这里只是写法）</b>"], ["② 动作求和", "<span class='w'>动作可能连续；每状态只采了一个动作</span>", "<span class='k'>重要性采样</span>", "<span class='k'>无偏，但有方差</span>"], ["③ <code>A → Q</code>", "<span class='w'>A 要先有 V</span>", "<span class='k'>只差与动作无关的常数</span>", "<span class='k'>不影响 arg max</span>"]]}, "res": {"tag": "推断", "v": "<b>第①次替换那句话，是这一讲对你最直白的一条提醒：<span class='k'>你只能在旧策略实际走到过的状态上做这个期望</span>。</b><br><br><b>翻译成你的语言：这个代理目标只在<b>日志覆盖到的那些中间状态</b>上有意义。</b><span class='w'>如果一套新配置会把流水线带到某类日志里从没出现过的中间产物（比如某个节点第一次用极低保真度，产出的东西和历史上任何一次都不像），那么在那些状态上你的估计没有任何依据</span>——<b>不是「估得不准」，是「压根没有数据」。</b><br><br><b>这件事和 p12 的「假装分布相同」叠在一起会更糟，值得分开看。</b><br><b>① 分布权重错了</b>（p12 硬换）：<span class='k'>这个有下界定理兜底，错多少由新旧策略的 KL 距离控制</span>。<br><b>② 支撑集没覆盖</b>（本页第①次替换）：<span class='w'>这个<b>没有</b>任何定理兜底</span>——<b>下界定理假设你能在 <code>μ_old</code> 上精确求期望，而它没说「<code>μ_old</code> 的支撑集之外会怎样」。</b><span class='k'>严格说，如果 <code>μ^{π̃}</code> 在 <code>μ_old</code> 支撑集之外有质量，整个推导的前提就不完整了。</span><br><br><b>所以你该报告的不是一个指标而是两个：</b><br><b>① KL 距离</b>（或 ESS）——<span class='k'>衡量「权重偏得多厉害」</span>；<br><b>② 覆盖率</b>——<span class='k'>这个候选配置会经过的中间状态，有多大比例落在日志覆盖的区域里</span>。<b>第②个更重要，因为它是「有没有依据」而不是「依据有多强」。</b><span class='w'>覆盖率低的候选，无论 FQE 给出多好的数字，都必须实跑验证</span>——<b>这正是 L07 p33 那个定向补采循环该优先处理的对象。</b>", "ref": "课件 p22 第①次替换 · 本讲 p12 · L07 p33 科研格 · L09 p43 科研格 · 简报 §4c §4d"}},
{"r": [25, 26], "t": "采样分布取什么", "star": 2, "one": "标准做法：<code>q = π_old</code>。", "eq": "max_θ  E_{s~μ_{θ_old}, a~q}[ (π_θ(a|s)/q(a|s))·Q_{θ_old}(s,a) ]\ns.t.   E_{s~μ_{θ_old}}[ D_KL( π_{θ_old}(·|s), π_θ(·|s) ) ] ≤ δ", "pts": ["<b>读法：你在旧策略下实际做过哪些动作，按新策略会给它们多大概率，就按这个比值重加权。</b>", "另一种叫 <b>vine</b> 的采样法见原论文。", "<b>取 <code>q = π_old</code> 之后，那个比值就变成了 <code>π_θ(a|s)/π_old(a|s)</code>，而它有一个很好的性质值得记住。</b><span class='k'>在起点处（<code>θ = θ_old</code>）这个比值恒等于 1</span>——<b>于是目标函数在起点处就等于 <code>E[Q_old]</code>，而梯度恰好是策略梯度。</b><span class='w'>这和 p12 那两条性质（取值相同、一阶导相同）是一致的</span>，<b>只是换了个写法。</b><span class='k'>PPO 后来做的事，就是直接对这个比值动手——截断它，不让它离 1 太远。</span>", "<b>课件给的读法很朴素，值得照着记一遍：<span class='k'>你在旧策略下实际做过哪些动作，按新策略会给它们多大概率，就按这个比值重加权</span>。</b><b>新策略更喜欢的动作被加权放大，不喜欢的被压小。</b><span class='w'>于是「新策略会拿到多少」就被折算成了「旧策略的样本，按新策略的偏好重新称重」</span>。<b>这是重要性采样最朴素的直觉，而它的危险也在这里</b>——<span class='k'>如果新策略极度偏爱某个旧策略几乎不选的动作，那个比值会非常大，整个估计被一两条样本主导。</span>", "<b>vine 采样法课件只给了指路，但它的思想值得知道，因为它的前提很特别。</b><span class='k'>vine 的做法是：先采一批状态，然后在每个状态上<b>分叉</b>出多条轨迹，每条试一个不同的动作</span>。<b>这样你在同一个状态上就有多个动作的真实回报，优势估计的方差小得多。</b><span class='w'>代价是它要求环境能<b>重置到任意状态</b></span>——<b>机器人做不到（不能把机器人瞬移回某个姿态），所以这条路在物理系统上基本不可用。</b>", "<b>顺带把「重要性权重会爆炸」这件事量化一下，你就知道信赖域在防什么。</b><span class='k'>假设某个动作旧策略给 0.01 的概率，新策略给 0.5</span>——<b>比值是 50。</b><span class='w'>于是这一条样本在平均里的权重是别人的 50 倍，整个估计几乎由它决定</span>。<b>而 KL 约束恰好在限制这种情形</b>：<span class='k'>要让某个动作的概率涨 50 倍，KL 必然很大，于是被约束挡住。</span>"], "quote": "max_θ E_{s∼μ_old, a∼q}[ <b>(π_θ(a|s)/q(a|s)) Q_old(s,a)</b> ] &nbsp;·&nbsp; subject to E_{s∼μ_old}[ D_KL(π_old(·|s), π_θ(·|s)) ] ≤ δ &nbsp;|&nbsp; <b>Standard approach: sampling distribution q(a|s) is simply π_old(a|s)</b> &nbsp;·&nbsp; For the vine procedure see the paper"},
{"r": [27, 27], "t": "怎么解这个带约束的问题", "star": 2, "one": "目标用<b>线性</b>近似，约束用<b>二次</b>近似，再用共轭梯度解。", "pts": ["为什么这样配：一阶目标 + 二阶约束正好得到<span class='k'>自然梯度</span>的形式。", "<b>「一阶目标 + 二阶约束」这个配法不是随便选的，两边各有各的理由。</b><span class='k'>目标用一阶：因为代理目标在当前点的梯度<b>就是</b>真梯度（p12 的第二条性质），一阶信息已经足够准</span>。<span class='k'>约束用二阶：因为 KL 在当前点取最小值 0，<b>一阶导也是 0</b></span>——<b>用一阶近似的话约束会退化成「0 ≤ δ」，等于没有约束。</b><span class='w'>所以必须展开到二阶才有内容。</span>", "<b>这个配法有一个很漂亮的结果：解出来正好是自然梯度的形式。</b><span class='k'>目标线性化成 <code>gᵀΔθ</code>，约束二次化成 <code>½ΔθᵀFΔθ ≤ δ</code>，其中 <code>F</code> 是 Fisher 信息矩阵</span>。<b>这是一个「在椭球内最大化线性函数」的问题，解是 <code>Δθ ∝ F⁻¹g</code>。</b><span class='w'>而 <code>F⁻¹g</code> 正是自然梯度</span>——<b>于是自然梯度不是被「选中」的，它是从这个约束优化问题里自己长出来的。</b>", "<b>为什么用共轭梯度而不是直接求 <code>F⁻¹</code>，理由是规模。</b><span class='k'><code>F</code> 是 <code>n×n</code>，n 是参数个数</span>——<b>百万参数的网络，<code>F</code> 有一万亿个元素，既存不下也求不了逆。</b><span class='w'>而共轭梯度只需要能算「<code>F</code> 乘一个向量」</span>，<b>而 <code>Fv</code> 可以用两次反向传播得到（Hessian-向量积），不必构造 <code>F</code>。</b><span class='k'>这是把一个理论上优雅但计算上不可行的方法变得可行的关键技巧。</span>"], "quote": "Use a <b>linear approximation to the objective function</b> and a <b>quadratic approximation to the constraint</b> &nbsp;·&nbsp; Constrained optimization problem &nbsp;·&nbsp; Use <b>conjugate gradient</b> descent"},
{"r": [28, 30], "t": "TRPO 算法", "star": 3, "one": "六行。", "eq": "每轮：\n  跑策略 T 步 / N 条轨迹\n  估出所有时间步的优势函数\n  算策略梯度 g\n  用共轭梯度（配 Hessian-向量积）算 F⁻¹g，F 是 Fisher 信息矩阵\n  在代理损失和 KL 约束上做线搜索\n\n应用：2D 运动控制器、以像素为输入的 Atari", "pts": ["<b><code>F⁻¹g</code> 就是自然梯度</b>：按参数空间自身的几何校正方向，而不是按欧氏距离。", "<span class='k'>最后那步线搜索是兜底</span>——二次近似不准时，它保证约束真的被满足。", "<b>六行里前四行和 vanilla PG 一模一样，真正新的只有第 5、6 行，所以 TRPO 可以一句话概括：</b><span class='k'>vanilla PG，但把「沿梯度走」换成「沿自然梯度走，且不许走出 KL 球」。</span><b>第 5 行给方向，第 6 行给距离。</b>", "<b>自然梯度那一步的直觉值得单独说，因为它在别处也用得上。</b><span class='w'>普通梯度下降默认「参数空间里距离相同 = 改动相同」，而这显然不对</span>——<span class='k'>softmax 的 logits 从 0 改到 1，和从 10 改到 11，对实际策略的影响完全不同（后者几乎没变，因为已经饱和了）</span>。<b>自然梯度按「策略改变了多少」来度量距离，而 Fisher 矩阵正是这个度量的局部形式。</b><span class='w'>这也是 L10.a p4 说「参数差多远 ≠ 策略差多远」的技术兑现。</span>", "<b>第 6 行那个线搜索是兜底的，而它存在的理由很诚实，值得说清楚。</b><span class='k'>第 5 行用的是二次近似，而二次近似走得稍远就不准了</span>——<b>按它算出来的步子，实际的 KL 可能超过 δ，实际的代理损失也可能没涨。</b><span class='w'>所以还要真的算一下这两个量，不满足就把步长缩小再试</span>。<b>这一步让算法从「理论上满足约束」变成「实际上满足约束」。</b><span class='k'>注意它和 L09 p31 那个被嫌弃的朴素线搜索不同</span>——<b>那里是盲目地在梯度方向上试，这里只是在一个已经算好的方向上缩放，而且有明确的验收标准。</b>", "<b>第 3 行「估出所有时间步的优势函数」看起来平淡，但它决定了这个算法的样本效率，值得展开。</b><span class='k'>实践中这一步通常用 GAE：把所有 n 步估计按几何权重 λ 混起来</span>，<b>于是你有两个旋钮——γ 管「看多远」，λ 管「偏差换方差换多少」。</b><span class='w'>而课件这里只写了一句，因为 GAE 是这一讲之后才成为标配的</span>。<b>真要实现 TRPO 或 PPO，这一步的代码量往往比第 5 行还多。</b>", "<b>还有一个这一页没写、但实现时必然碰到的细节：<span class='k'>优势要不要标准化</span>。</b><b>几乎所有实现都会把一批优势减去均值再除以标准差。</b><span class='w'>减均值是合法的——那就是在加一个常数基线（L09 p15 证过无偏）</span>；<span class='w'>而除以标准差<b>严格说会改变梯度的量级</b>，相当于一个自适应的学习率</span>。<span class='k'>它不改变梯度的方向，所以在有信赖域约束的情况下几乎没有副作用</span>——<b>但在没有约束的 vanilla PG 里，它会让步长隐式地随批次波动。</b>", "<b>最后把六行和前两讲的对应标一次，这样你能看出每一行的出处。</b><span class='k'>第 2 行采样 → L08 p42 的 on-policy 要求</span>；<span class='k'>第 3 行估优势 → L08 p53 的基线 + L09 p25 的 n 步</span>；<span class='k'>第 4 行算梯度 → L08 p44 的策略梯度定理</span>；<span class='k'>第 5 行自然梯度 → 本讲 p27 的约束优化</span>；<span class='k'>第 6 行线搜索 → 本讲 p20 的 δ 约束</span>。<b>六行里有四行是前两讲的内容，这个算法的「新东西」确实只有两行。</b>", "<b>还有一条实现上的提醒，和第 6 行直接相关：线搜索失败时该怎么办。</b><span class='k'>标准做法是按固定比例（比如 0.5）反复缩小步长，试若干次</span>；<span class='w'>若试完仍然不满足约束或代理损失没涨，就<b>这一轮不更新</b></span>。<b>「宁可不动也不乱动」正是信赖域这整套思想的落地形态。</b><span class='k'>而「这一轮不更新」在日志里是个重要信号</span>——<b>频繁出现说明 δ 设得太大，或者优势估计噪声太大。</b>"], "quote": "<b>TRPO</b>: 1: for iteration=1,2,... do &nbsp;·&nbsp; 2: Run policy for T timesteps or N trajectories &nbsp;·&nbsp; 3: Estimate advantage function at all timesteps &nbsp;·&nbsp; 4: Compute policy gradient g &nbsp;·&nbsp; 5: <b>Use CG (with Hessian-vector products) to compute F⁻¹g</b> &nbsp;·&nbsp; 6: <b>Do line search on surrogate loss and KL constraint</b> &nbsp;·&nbsp; 7: end for"},
{"r": [31, 33], "t": "结果与小结", "star": 2, "one": "<b>自动把权重更新限制在一阶近似还成立的范围内。</b>", "pts": ["属于策略梯度方法；用一个代理优化目标。", "<span class='k'>实测一贯表现不错</span>，影响很大。", "出处：Schulman et al., 2015。", "<b>小结里那个词 <em>approximate</em> 把 TRPO 的定位说得很准，值得咬一下。</b><span class='k'>它是在<b>估计</b>「一阶近似还成立的范围」，不是在精确地划定它</span>。<b>估计的依据是那个下界定理，而估计用的是被放松过两次的版本（p20）。</b><span class='w'>所以它是「有理论来源的启发式」</span>——<b>这个说法既不贬低它，也不夸大它。</b>", "<b><em>Empirically consistently does well</em> 的关键词是 <span class='k'>consistently</span>，不是「最好」。</b><b>TRPO 在很多任务上不是最强的，但它很少崩。</b><span class='w'>而在深度 RL 里「很少崩」是个被严重低估的优点</span>——<b>L06 p12 要你「至少跑两个种子」，正是因为很多方法的种子间方差大到可以反转结论。</b><span class='k'>一个稳定的方法，能让你花在调参和重跑上的时间大幅减少。</span>", "<b>最后补一句今天的位置：实践中你几乎只会碰到 PPO，而不是 TRPO。</b><span class='k'>PPO 用一个截断的概率比值替代 KL 约束</span>——<b>不用算 Fisher 矩阵、不用共轭梯度、不用线搜索，几十行就能写完，效果相当甚至更好。</b><span class='w'>但 PPO 的全部合理性都来自这一讲的推导</span>：<b>它是在用一个更粗暴的办法达到同一个目的——不让新旧策略差太远。</b><span class='k'>所以这一讲不白读：它解释了 PPO 里那个看起来很随意的截断参数在管什么。</span>", "<b>把 TRPO 实际解决了什么、没解决什么，列一次，这对你判断「要不要用它」比记住算法有用。</b><br><b>解决了</b>：<span class='k'>步长不用手调了——δ 比学习率稳定得多，换个任务常常还能用</span>；<span class='k'>更新不会突然把策略推到一个烂区域（因为 KL 被钉住了）</span>。<br><b>没解决</b>：<span class='w'>样本效率——它仍然是 on-policy，采一批用一次</span>；<span class='w'>梯度本身的方差——那是第 3 行的事，和这里无关</span>；<span class='w'>局部最优——它保证的是「不变差」，不是「能爬到最高的山」</span>。", "<b>工程上它的代价也该说清楚，因为这是它最终被 PPO 取代的直接原因。</b><span class='k'>每一步都要跑一次共轭梯度（若干次 Hessian-向量积，每次两轮反向传播），再做一次线搜索（每次要重算代理损失和 KL）</span>。<b>于是单步的计算量是普通 SGD 的十倍量级。</b><span class='w'>而且实现复杂：共轭梯度、Fisher 向量积、线搜索的回退逻辑，每一处都容易写错</span>。<b>PPO 把这三样全删了，只留一个截断，于是几十行就能写完。</b>", "<b>最后给一条判断「该不该上信赖域」的实用判据，它比记住算法更有用。</b><span class='k'>如果你的训练曲线会<b>突然崩塌</b>（不是慢慢变差，是断崖），那通常是步长问题，信赖域类方法会有帮助</span>；<span class='w'>如果曲线只是噪声大、涨得慢，那是方差问题，该去动第 3 行（加基线、用 GAE、增大批量），信赖域帮不上忙</span>。<b>这两种病的表现不同，药也不同，别搞混。</b>"], "quote": "<b>Automatically constrains the weight update to a trusted region, to approximate where the first order approximation is valid</b> &nbsp;·&nbsp; Policy gradient approach &nbsp;·&nbsp; Uses surrogate optimization function &nbsp;·&nbsp; <b>Empirically consistently does well</b> &nbsp;·&nbsp; (Schulman et al., 2015)", "tbl": {"head": ["TRPO", "解决了吗", "说明"], "rows": [["步长不用手调", "<span class='k'>解决</span>", "<b>δ 比学习率稳定得多，换任务常还能用</b>"], ["更新不会突然推到烂区域", "<span class='k'>解决</span>", "KL 被钉住了"], ["样本效率", "<span class='w'>没解决</span>", "<b>仍是 on-policy，采一批用一次</b>"], ["梯度本身的方差", "<span class='w'>没解决</span>", "那是第 3 行的事（基线、GAE、批量）"], ["局部最优", "<span class='w'>没解决</span>", "保证的是「不变差」，不是「爬到最高的山」"], ["<b>计算与实现代价</b>", "<span class='w'>反而更重</span>", "<b>CG + Fisher 向量积 + 线搜索；PPO 把这三样全删了</b>"]]}},
{"r": [34, 34], "t": "策略梯度算法的通用模板", "star": 3, "one": "<b>所有这些算法都是同一个模板换零件。</b>", "eq": "每轮：\n  跑策略 T 步 / N 条轨迹\n  每个时间步算出目标 Q^π(s_t,a_t) 和基线 b(s_t)\n  算出策略梯度估计 ĝ\n  用 ĝ 更新策略，必要时约束在一个局部区域内", "pts": ["<span class='k'>第 3 行换零件</span>：REINFORCE / actor-critic / n 步估计…", "<span class='k'>第 5 行换零件</span>：朴素 SGD / 线搜索 / <b>TRPO</b>…", "<b>记住这张模板，比记住任何一个具体算法都值。</b>", "<b>这张模板是第八、九、十三讲的总收，而它最值钱的地方在于：它把「算法」降级成了「配置」。</b><span class='k'>你不需要记住十几个算法的名字和伪代码，只需要记住五行，再知道每行有哪些可选项</span>。<b>读新论文时第一个问题就变成了：它动了哪一行。</b>", "<b>把两处槽位的选项列全，前三讲的内容就全在这张表里了。</b><b>第 3 行（目标与基线）</b>：<span class='k'>蒙特卡洛回报 <code>G_t</code> → REINFORCE；critic 的 <code>Q</code> → actor-critic；n 步混合 → A2C/A3C；几何加权混合 → GAE；基线取 <code>V</code> → 优势函数</span>。<br><b>第 5 行（怎么更新）</b>：<span class='k'>朴素 SGD/ADAM → vanilla；线搜索 → 朴素自动步长；KL 信赖域 + 自然梯度 → TRPO；截断比值 → PPO</span>。<br><span class='w'>两个槽位相对独立，可以任意组合</span>——<b>今天常见的组合是「GAE + PPO」。</b>", "<b>「记住这张模板比记住任何一个具体算法都值」这句话的理由可以说清楚。</b><span class='k'>具体算法会过时——TRPO 两年就被 PPO 取代了</span>；<span class='w'>而模板不会，因为它反映的是问题本身的结构</span>：<b>你必须采数据、必须估优势、必须算梯度、必须决定走多远。</b><span class='k'>这四件事任何策略梯度方法都躲不开，变的只是每件事怎么做。</span>"], "quote": "<b>Common Template of Policy Gradient Algorithms</b> &nbsp;·&nbsp; 1: for iteration=1,2,... do &nbsp;·&nbsp; 2: Run policy for T timesteps or N trajectories &nbsp;·&nbsp; 3: At each timestep compute the target Q^π(s_t,a_t) and baseline b(s_t) &nbsp;·&nbsp; 4: Compute the policy gradient estimate ĝ &nbsp;·&nbsp; 5: Update the policy using ĝ, <b>possibly constrained to a local region</b> &nbsp;·&nbsp; 6: end for", "tbl": {"head": ["模板的行", "可选项", "得到的算法", "在哪一讲"], "rows": [["<b>第 2 行</b> 采数据", "串行 / 并行多 worker", "<span class='k'>A3C</span>", "L09 p22"], ["<b>第 3 行</b> 目标", "<code>G_t</code> / critic 的 Q / n 步 / GAE", "<span class='k'>REINFORCE / actor-critic / A2C</span>", "L08 p59 · L09 p25"], ["<b>第 3 行</b> 基线", "常数 / <code>V(s)</code>", "<span class='k'>带基线的 PG（括号里成为优势）</span>", "L08 p53 · L09 p14"], ["<b>第 5 行</b> 更新", "SGD / 线搜索 / KL 信赖域 / 截断比值", "<b>vanilla / TRPO / PPO</b>", "<b>本讲</b>"]]}},
{"r": [35, 36], "t": "策略梯度小结", "one": "课件自己给的清单。", "pts": ["<b>极其常用</b>的一类方法；可以通过指定策略参数化来注入先验知识。", "要<b>非常熟悉 REINFORCE</b> 和上一页那张模板。", "要知道不同估计量能插进哪个槽位，以及各自的<span class='k'>偏差/方差</span>含义。", "<span class='w'>不必</span>会推导或背 TRPO 里近似目标和约束的具体公式。", "<b>课件这张清单划定了掌握程度，而它比你以为的宽松，值得照着自查。</b><span class='k'>要非常熟悉的只有两样：REINFORCE，和那张模板</span>；<span class='w'>TRPO 的具体公式<b>不必</b>会推导或背出</span>。<b>所以这一讲的十几页推导，读懂思路就够了，不必能复现。</b>", "<b>但「理解不同估计量的偏差/方差含义」这一条要求不低，用四个问题自查一遍。</b><span class='k'>① <code>G_t</code> 和 critic 的 <code>Q</code>，哪个有偏？为什么？</span><span class='k'>② 加基线会不会引入偏差？什么条件下才真的降方差？</span><span class='k'>③ n 步的 n 变大，偏差和方差各往哪边走？</span><span class='k'>④ 什么时候该往蒙特卡洛那一端靠？</span><b>四个都答得出，这条线就过关了。</b><span class='w'>（第④问的答案在 L09 p25：环境越不像 MDP 越该往 MC 靠。）</span>", "<b>「可以通过指定策略参数化来注入先验知识」这一条，是整条策略搜索线和 L07 的接口，值得收个尾。</b><span class='k'>L07 p18 把「额外知识」分成四种形态，而策略类是第二种</span>——<b>原话是 <em>can encode domain knowledge in the form of the policy class used</em>。</b><span class='w'>L08 p25 的 AIBO 是这件事最漂亮的实例：12 个手工步态参数，把一个高维控制问题压成了 12 维连续优化</span>。<b>所以「选什么策略类」不是一个实现细节，它常常是样本效率的主要来源。</b>", "<b>最后把这三讲的主线收一句，作为整条线的结尾。</b><span class='k'>L08 说清了梯度是什么（似然比技巧，以及那句 <em>no dynamics model required</em>）</span>；<span class='k'>L09 说清了梯度估得准不准（降方差三招），并提出「该走多远」</span>；<span class='k'>L10 把「该走多远」这条推导走完（代理目标 → 下界 → 信赖域 → TRPO）</span>。<b>三讲合起来回答的是同一个问题：<span class='w'>我只能从当前策略采样，却想知道另一个策略有多好</span>。</b><span class='k'>而这个问题，正是这门课后半程几乎所有困难的共同形状。</span>", "<b>再补一句这一讲在整门课里的位置，因为它是一个分水岭。</b><span class='k'>到这里为止，这门课处理的都是「怎么学一个好策略」</span>；<span class='w'>期中之后转向的是「要多少数据才能学到」——探索、老虎机、样本复杂度</span>。<b>而那条线的问题意识，L07 p18 早就埋下了：硬度结论说一般 MDP 需要大量样本。</b><span class='k'>所以后半门课要回答的是「怎么让那个量变小」。</span>"], "quote": "Policy gradient methods are <b>extremely popular</b> &nbsp;·&nbsp; Can encode prior knowledge by specifying the policy parameterization &nbsp;·&nbsp; <b>Be very familiar with REINFORCE</b> and the template &nbsp;·&nbsp; Understand the different ways of estimating the target and the <b>bias / variance implications</b> &nbsp;·&nbsp; <b>Do not need to be able to derive or remember the specific formulas for the approximate objective and constraint in TRPO</b>"}
];

var TH = {"title": "L10 接上课题的哪一段：一张「部署前的证书」该长什么样，以及它为什么常常开不出来", "arc": "<b>这一讲把「在不真跑新策略的前提下判断它是不是更好」这件事走完了一遍，而最有价值的不是结论，是它<span class='k'>诚实地暴露了这条路在哪里断掉</span>。</b><br><br><b>推导本身很漂亮：硬换分布 → 下界 → 优化下界就保证单调改进。</b><span class='w'>但那个下界里的常数 <code>C = 4εγ/(1−γ)²</code> 有两个毛病</span>：<span class='k'>① ε 要对所有状态动作取优势的最大值，实践中算不出来（老师当堂承认「这部分是形式上的保证」）；② 就算能算，γ=0.99 时 <code>C = 39600ε</code>，按它选步长基本等于不动</span>。<b>于是落地时它退化成了「一个要调的超参 δ」。</b><br><br><b>这个模式你会在自己的工作里反复碰到，而且它正好描述了 §8 的处境。</b><span class='k'>conformal risk control 给你的也是「真实风险 ≤ 经验风险 + 一个项」</span>——<b>区别在于：conformal 的那个项通常<b>能</b>算，而这里的 ε 不能。</b><span class='w'>所以你现在这条技术路线比这一讲的下界务实</span>，<b>这是一个支持你当前选择的理由，值得在 related work 里点一句。</b><br><br><b>而这一讲真正能搬走的是两样东西。</b><br><b>① 那个「一等一不等」的结构（p16）。</b><span class='k'>旧策略的下界<b>等于</b>它的真值，新策略的只是一个<b>下界</b>——两者相减才有「保证不变差」</span>。<b>而你天然有那个等号的一端：日志里的配置跑过，你有它真实的 Acc 和 Cost。</b><span class='w'>缺的只是另一端——把 FQE 的点估计换成一个带置信下界的区间，你就得到了同样结构的「部署前的证书」</span>。<br><b>② 第①次替换暴露的那个更硬的问题（p22）。</b><span class='k'>代理目标只在<b>日志覆盖到的状态</b>上有意义</span>——<b>而这一条<span class='w'>没有</span>任何下界定理兜底</b>，和「分布权重偏了」不是一个量级的问题。<span class='w'>详见 p22 的科研格。</span>", "pitfalls": [{"v": "<b>把「分布权重偏了」和「支撑集没覆盖」当成同一件事。</b> 它们的严重程度差一个量级：<span class='k'>前者有下界定理兜底，错多少由新旧策略的 KL 控制</span>；<span class='w'>后者<b>没有</b>任何定理兜底——下界定理假设你能在 <code>μ_old</code> 上精确求期望，它没说支撑集之外会怎样</span>。<b>所以你该报告两个量：KL 距离（权重偏得多厉害）和覆盖率（有没有依据）。</b><span class='k'>第二个更重要。</span>", "tag": "推断", "ref": "课件 p22 第①次替换 · p12 · 本讲 p22 科研格"}, {"v": "<b>把 TRPO 的「单调改进」当成真的保证。</b> 课件做了两处放松：<span class='w'>用你调的 δ 代替理论的 C；用平均 KL 代替最大 KL</span>。<span class='k'>两处之后，定理的前提都不满足了</span>——<b>它的实际地位是「受理论启发的启发式」。</b><span class='w'>课件 p31 用的词是 <em>empirically consistently does well</em>。</span>", "tag": "已核", "ref": "课件 p20 两处放松 · p31 小结"}, {"v": "<b>照抄板上那个 <code>D_TV</code> 的写法。</b> <span class='w'>板上写的是 <code>max_a |p−q|</code>，那是 L∞，不是全变差（全变差是 <code>½ Σ_a |p−q|</code>）</span>。<span class='k'>两者只在动作恰好两个时相等</span>；<b>而且 <code>L∞ ≤ D_TV</code>，所以用它算惩罚会<b>低估</b>，按那个写法得到的不等式不成立。</b><span class='w'>四动作反例：(0.4,0.4,0.1,0.1) vs (0.1,0.1,0.4,0.4) ⇒ 0.6 vs 0.3。</span>", "tag": "已核", "ref": "课件 p14 · 全变差与 L∞ 的定义"}, {"v": "<b>以为 Pinsker 那一步也写错了所以界不成立。</b> <span class='k'>课件写的 <code>D_TV² ≤ D_KL</code> 确实漏了 ½（标准形式是 <code>≤ ½ D_KL</code>），但方向是安全的</span>——<b>因为 <code>½D_KL ≤ D_KL</code>，所以课件那个更弱的不等式仍然成立，界也仍然成立。</b><span class='w'>代价只是松了一倍：用正确的 Pinsker，惩罚系数可以减半。</span><b>这一处和上一处性质不同，别混为一谈。</b>", "tag": "已核", "ref": "课件 p14 · Pinsker 不等式"}, {"v": "<b>把 <code>V^{π_{i+1}} = M_i(π_{i+1})</code> 记成等号。</b> <span class='k'>应该是 <code>≥</code></span>——<span class='w'>实录里先说成了 <em>equal to</em>，随后在真正推导时说的是 <em>greater than or equal to</em></span>。<b>只有 <code>V^{π_i} = M_i(π_i)</code> 才是等号。</b><span class='k'>两式一等一不等，相减才得到有用的结论；都是等号的话整件事就平凡了。</span>", "tag": "已核", "ref": "课件 p16–p18 · L10 实录"}, {"v": "<b>把「步长问题」和「方差问题」的药搞混。</b> <span class='k'>曲线<b>突然崩塌</b>（断崖而非缓降）⇒ 步长问题，信赖域类方法有帮助</span>；<span class='w'>曲线只是噪声大、涨得慢 ⇒ 方差问题，该去动模板第 3 行（加基线、用 GAE、增大批量），信赖域帮不上忙</span>。<b>两种病的表现不同，先分清再下手。</b>", "tag": "推断", "ref": "课件 p31 · 模板 p34 · L09 p15"}], "ammo": [{"q": "你们凭什么说新配置部署前就是安全的？", "a": "<b>我们不说「安全」，我们给的是一个下界。</b><span class='k'>结构和 CS234 L10 那套一样：旧配置的估值<b>等于</b>它的真值（它跑过，我们有真实的 Acc 和 Cost），新配置给的是一个<b>置信下界</b></span>——<b>两者相减才构成「至少不更差」的证据。</b><span class='w'>而这个下界只在日志覆盖到的状态上有依据</span>，<b>所以我们同时报告覆盖率，覆盖率低的候选一律标为需要实跑验证。</b>", "tag": "推断", "ref": "课件 p16 p22 · 本讲 p22 科研格 · 简报 §4d"}, {"q": "为什么不直接用 TRPO 那套理论给的保证？", "a": "<b>因为那个保证在落地时会退化。</b><span class='k'>下界里的常数要对所有状态动作取优势的最大值，实践中算不出来——课件作者自己在课上承认「这部分是形式上的保证」</span>；<span class='w'>而且即使能算，γ=0.99 时那个系数是 39600ε，按它选步长等于不动</span>。<b>相比之下，conformal 那条线给出的项是能算的，所以我们走那条。</b><span class='k'>我们在 related work 里明确做了这个对比。</span>", "tag": "已核", "ref": "课件 p16 老师当堂承认 · p20 原文 · 简报 §8"}, {"q": "你们报的那个「候选和日志的距离」到底在衡量什么？", "a": "<b>两件事，而它们的严重程度不同。</b><span class='k'>① KL 距离 / ESS——衡量重要性权重偏得多厉害，这个有理论兜底，偏差随距离可控</span>；<span class='w'>② 覆盖率——这个候选会经过的中间状态有多大比例落在日志覆盖区内，这一条<b>没有</b>理论兜底</span>。<b>支撑集之外不是「估得不准」，是「压根没有数据」。</b><span class='k'>所以我们把覆盖率作为是否实跑的硬判据，KL 只作为可信度的软指标。</span>", "tag": "推断", "ref": "课件 p22 · 本讲 p22 科研格 · L09 p43 科研格"}, {"q": "为什么你们要在每个节点上做随机化？这不是和「保守」矛盾吗？", "a": "<b>不矛盾，它们管的是不同的事。</b><span class='k'>随机化管的是「日志覆盖得够不够宽」——覆盖不够，任何估计都没有依据</span>；<span class='w'>保守（信赖域式的限制）管的是「在覆盖到的范围内，我敢走多远」</span>。<b>前者决定你有没有牌，后者决定你怎么出牌。</b><span class='k'>而且混叠时随机策略本身可能就是更优的（CS234 L08 p10–p12），所以这个随机化有两个独立的理由。</span>", "tag": "推断", "ref": "课件 p22 · L08 p10–p12 · 简报 §4c"}], "papers": [{"t": "Kakade &amp; Langford — Approximately Optimal Approximate Reinforcement Learning (Conservative Policy Iteration)", "id": "ICML 2002", "why": "p13 那个混合策略下界的原始出处。<b>你要引它来确认两件事</b>：<span class='k'>① 有限 horizon 下常数的确切形式（课件全程用折扣形式）；② ε 的两种定义（p13 和 p14 不一样）各自对应什么条件</span>。"}, {"t": "Schulman, Levine, Abbeel, Jordan &amp; Moritz — Trust Region Policy Optimization", "id": "ICML 2015", "why": "p14–p30 的全部内容，课件在 p20 直接标了这篇。<b>对你最有用的是它处理「从理论到实践」那几步时的措辞</b>——<span class='k'>它对每一处放松都明确说明了代价</span>，<span class='w'>这正是你写 limitation 一节时可以借鉴的写法。</span>"}, {"t": "Pinsker / Csiszár — (总变差与 KL 的标准不等式)", "id": "信息论教材的标准结果", "why": "p14 那一步 <code>D_TV² ≤ ½ D_KL</code> 的出处。<b>课件漏了 ½</b>（<span class='k'>方向安全，界仍成立，只是松一倍</span>）。<span class='w'>任何信息论教材（如 Cover &amp; Thomas）都有标准表述</span>——<b>你若要在论文里用这类不等式，务必用标准形式，别抄讲义。</b>"}, {"t": "Liu, Li, Tang &amp; Zhou — Breaking the Curse of Horizon: Infinite-Horizon Off-Policy Estimation", "id": "NeurIPS 2018", "why": "老师在 p12 口头提到的那条线（Lihong Li 等）。<b>它直接估 <code>μ^{π̃}/μ^π</code> 这个<b>分布层面</b>的比值，而不是绕开它</b>——<span class='k'>这正好补上了 p12「硬换分布」留下的那个缺口</span>，<span class='w'>对长 horizon 的 off-policy 评估降方差很有帮助。</span>"}, {"t": "Schulman, Wolski, Dhariwal, Radford &amp; Klimov — Proximal Policy Optimization", "id": "arXiv 2017", "why": "今天你实际会碰到的那个。<b>它把 p25 那个比值直接截断，于是不用 Fisher 矩阵、共轭梯度和线搜索</b>。<span class='k'>还允许把同一批数据复用几轮</span>——<span class='w'>这缓解了策略梯度 on-policy 的代价，而那正是 TRPO 没解决的那一项。</span>"}]};

(function(){

    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
