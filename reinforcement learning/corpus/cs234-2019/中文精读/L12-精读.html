{"r": [55, 56], "t": "MBIE-EB：计数建模 + β/√N 加成", "star": 3, "quote": "<b>Model-Based Interval Estimation with Exploration Bonus (MBIE-EB)</b> (Strehl and Littman, 2008)<br><em>β = (1/(1−γ))·√(0.5 ln(2|S||A|m/δ))</em> · 初始化 <em>Q̃(s,a) = 1/(1−γ)</em><br>计数：<em>n<sub>sa</sub>(s,a) += 1 · n<sub>sas</sub>(s,a,s′) += 1</em> · 估模型：<em>R̂(s,a) = r<sub>c</sub>/n · T̂(s′|s,a) = n<sub>sas</sub>/n<sub>sa</sub></em><br><b><em>Q̃(s,a) = R̂(s,a) + γ Σ<sub>s′</sub> T̂(s′|s,a) max<sub>a′</sub> Q̃(s′,a′) + β/√(n<sub>sa</sub>(s,a))</em></b>", "one": "<b>一边用计数估模型，一边在 Bellman 更新里给访问次数少的 (s,a) 加一个 β/√N 的奖励。就这两件事。</b>", "pts": ["<b>把那个长式子拆成三块看，它其实很简单</b>：<br><code>R̂(s,a)</code>——<b>估出来的即时奖励</b>（计数平均）；<br><code>γ Σ T̂ max Q̃</code>——<b>标准的 Bellman 回溯</b>，只是用估出来的 T̂；<br><code>+ β/√n<sub>sa</sub></code>——<b>探索加成</b>，这是唯一新增的东西。<span class='k'>前两块就是 L03 的确定性等价</span>，第三块才是本讲的贡献。", "<b>加成的形状 <code>β/√N</code> 不是随便选的。</b> 它和 UCB 的 <code>√(2 log t / N)</code> 是同一个来源：<b>均值估计的误差按 1/√N 收缩</b>（Hoeffding）。<span class='k'>所以「访问次数的平方根倒数」是不确定性的自然尺度</span>，在老虎机和 MDP 里都一样。", "<b>β 里装的是「要多保险」。</b> <code>β = (1/(1−γ))·√(0.5 ln(2|S||A|m/δ))</code>：<br><code>1/(1−γ)</code> 是<b>有效时域</b>（误差会沿时间累积，所以时域越长越要保守）；<br><code>ln(|S||A|m/δ)</code> 是<b>联合界</b>（要对所有 (s,a) 同时成立，状态动作越多越要保守）；<br><span class='w'>δ 越小 β 越大</span>——要求越高概率成立，就得越乐观。", "<b>初始化 <code>Q̃ = 1/(1−γ)</code> 对应奖励被归一化到 [0,1]</b>，所以这就是 p52 的 <code>r<sub>max</sub>/(1−γ)</code>（取 r<sub>max</sub>=1）。<b>它仍然用了乐观初始化，只是额外加了会随数据衰减的加成项。</b>", "<b>注意第 12–14 行：每收到一个样本就把整个 Q̃ 重算到收敛。</b> <span class='w'>这是整个算法最贵的部分</span>——它是一次完整的值迭代。<b>所以 MBIE-EB 的样本复杂度是多项式的，计算复杂度却很高</b>。这正是 L03 p47 说的「数据效率与计算效率要分开看」。", "⚠️ <b>算法开头的 <code>m</code> 是给定的参数</b>（第 1 行 <em>Given ε, δ, m</em>），它进了 β 的公式。<b>m 通常是「每个 (s,a) 要访问多少次才算学会」的上限</b>，由 ε、δ 和问题规模决定。"], "eq": "MBIE-EB 的 Bellman 更新：\n\n  Q̃(s,a) = R̂(s,a) + γ Σ_{s'} T̂(s'|s,a) max_{a'} Q̃(s',a')  +  β / sqrt(n_sa(s,a))\n           └──────── 确定性等价（L03 p48）────────┘     └─ 探索加成 ─┘\n\n  β = (1/(1−γ)) · sqrt( 0.5 · ln( 2|S||A|m / δ ) )\n       └ 有效时域 ┘        └── 联合界：对所有 (s,a) 同时成立 ──┘\n\n  加成的 1/sqrt(N) 形状 = Hoeffding 的误差尺度，与 UCB 同源", "tbl": {"head": ["成分", "来自哪里", "作用"], "rows": [["R̂, T̂（计数估计）", "<b>L03 的确定性等价</b>", "用数据建模型"], ["γ Σ T̂ max Q̃", "标准 Bellman 回溯", "规划"], ["<b>β/√n<sub>sa</sub></b>", "<b>本讲新增</b>", "给访问少的 (s,a) 加分"], ["β 里的 1/(1−γ)", "有效时域", "误差沿时间累积"], ["β 里的 ln(2\\|S\\|\\|A\\|m/δ)", "联合界", "要对所有 (s,a) 同时成立"]]}, "res": {"tag": "推断", "v": "<b>β/√N 这个形状你可以直接搬，而且比 MBIE-EB 本身更容易用——因为你不需要那一整套 MDP 机器。</b><br>你已经有每个「节点 × 保真度档位」的访问计数（跑过多少条 query）。<span class='k'>加成项 β/√N 给的正是「这一格我了解得够不够」的定量表达</span>，而它和 L12.b 的 Beta 后验是同一件事的两种写法——<b>Beta 的宽度也按 1/√(α+β) 收缩</b>。两者选一个即可，不必都用。<br><b>β 的两个成分在你这里怎么对应</b>：<br><code>1/(1−γ)</code> ⇒ 有效时域。<b>你的 γ 该是 1、H ≤ 10</b>（L02 的科研格），所以这一项换成 <code>H</code>，是个小数（10 而不是 100），<span class='k'>比标准折扣设定友好得多</span>。<br><code>ln(2|S||A|m/δ)</code> ⇒ 联合界。你要对多少个「格子」同时成立？<b>若按 (节点, 档位) 计是 H×k 个（几十个）；若按 (query, 节点, 档位) 计就爆炸了</b>。<span class='w'>这个选择直接决定 β 的大小</span>，而它等价于「策略按什么键控」——又回到 P2/P3 消融。<br>⚠️ <b>但别把 MBIE-EB 整个搬过来</b>：它每收到一个样本就重跑一次完整值迭代（第 12–14 行），<b>而你根本不需要规划</b>——你的「转移」是确定的（节点顺序固定），没有 <code>max<sub>a′</sub> Q̃(s′,a′)</code> 这一项要算。<span class='k'>你需要的只是那个加成项的形状，不是它的算法骨架</span>。<br>标【推断】：对应关系与两处简化是我推的；γ=1、H≤10 与 P2/P3 在对应讲里是已有结论。", "ref": "课件 p56 原文 · L02 p13 科研格（γ 该是 1）· L12.b p24 科研格（Beta 宽度）· 简报 §5（P2/P3）"}},
{"r": [57, 59], "t": "MDP 上的 PAC：定义、结论、充分条件", "star": 3, "quote": "<b>Framework: PAC for MDPs</b> — <em>For a given ε and δ, a RL algorithm A is PAC if on all but <b>N</b> steps, the action selected at time t is <b>ε-close to the optimal action</b>, where N is a <b>polynomial function of (|S|, |A|, γ, ε, δ)</b></em><br><em><b>Is this true for all algorithms?</b></em><br>p58: <b>MBIE-EB is a PAC RL algorithm</b><br>p59: <em>A Sufficient Set of Conditions to Make a RL Algorithm PAC</em> (Strehl, Li, Littman, UAI 2006)", "one": "<b>把老虎机的 PAC 定义原样搬到 MDP：N 步之外每一步都 ε-最优，而 N 是问题规模的多项式。MBIE-EB 做到了。</b>", "pts": ["<b>和 p46 的老虎机版本对照，只多了一样东西：多项式里多了 |S| 和 γ。</b> <span class='k'>状态数进来了，有效时域也进来了</span>——这两项正是 MDP 比老虎机难的地方的量化体现。", "<b>p57 最后那句反问 <em>Is this true for all algorithms?</em> 的答案是「不是」。</b> <b>ε-贪心就不是 PAC 的</b>——它每步都有固定概率随机选，<span class='w'>于是「大错」的次数随步数线性增长，不可能被多项式 N 封住</span>。<b>纯贪心也不是</b>（可能永远锁死）。", "<b>所以 PAC 是一个有区分力的标准，不是所有算法都能拿到。</b> 这一点和遗憾不同：<b>任何算法都有一个遗憾值</b>（可能很大），但<span class='k'>不是任何算法都是 PAC 的</span>。PAC 是一个二元的资格，遗憾是一个连续的分数。", "<b>p58 把结论摆出来：MBIE-EB 是 PAC 的。</b> 这就把 p54 那两条路线里的第二条落到了实处——<b>「按数据量连续调节的乐观」能拿到可证的保证，而「一次性的大常数乐观」拿不到</b>（p53）。", "<b>p59 给的是「充分条件」而不是又一个算法，这个选择很有意思。</b> Strehl、Li、Littman 2006 列出了一组条件：<span class='k'>任何满足它们的算法都是 PAC 的</span>。<b>这把「证明某个算法 PAC」从一次性的工作变成了可复用的模板</b>——后来的很多算法就是照着这组条件设计的。", "⚠️ <b>多项式里的指数和常数本讲没给。</b> 「多项式」只保证不是指数，<span class='w'>但 |S|³|A|/(ε³(1−γ)⁶) 也是多项式</span>。<b>实用性要看具体的幂次</b>，而这正是 L13 要处理的事。", "<b>把「PAC 是二元资格、遗憾是连续分数」这个区别再推一步，会得到一个实用建议。</b> <span class='k'>汇报结果时两者该用不同的句式</span>：遗憾适合写成「我们的遗憾比基线低 x%」；<b>PAC 适合写成「在 ε=…、δ=… 下，超出容忍的情形不超过 N 次」</b>。<b>后者是一句承诺，前者是一个比较。</b>", "<b>p57 那个反问还有一层没说破的意思</b>：既然不是所有算法都 PAC，<b>那「这个算法不是 PAC 的」就不等于「它不好用」</b>。ε-贪心不是 PAC 的，但它在无数实际系统里跑得好好的。<span class='w'>PAC 是一个关于最坏情况的资格</span>，而大多数实际问题不在最坏情况上。", "⚠️ <b>p58 只有一句结论「MBIE-EB is a PAC RL algorithm」，证明在引用的论文里。</b> 课件没展开，而本精读也不补——<b>要点是知道「这类算法能拿到保证」，而不是复现证明</b>。"], "tbl": {"head": ["算法", "是 PAC 吗", "为什么"], "rows": [["纯贪心", "<span class='w'>否</span>", "可能永远锁死（L12.a p16）"], ["固定 ε-贪心", "<span class='w'>否</span>", "大错次数随步数<b>线性</b>增长"], ["朴素乐观初始化", "<span class='w'>否</span>", "乐观用完就没了（p53）"], ["乐观初始化到 10^T 量级", "是", "<b>但初始值不可实现</b>"], ["<b>MBIE-EB</b>", "<b>是</b>", "<b>加成随数据衰减，不会用完</b>（p58）"]]}, "res": {"tag": "推断", "v": "<b>「不是所有算法都 PAC」这件事，给了你一个很干净的论文句式。</b><br>你不需要宣称自己的方法是 PAC 的（那要一整套证明），<span class='k'>但你可以用 PAC 的<b>陈述形式</b>来报告实证结果</span>——这在离线设定下是<b>可以直接从 oracle 表上数出来的</b>，不需要任何定理：<br><b>「在 200–300 条留出 query 上，取 ε = …，我们选出的配置有 N 条 query 的 G 比该 query 的最优配置差超过 ε；N/总数 = …」</b><br><span class='w'>这是一个可验证的事实陈述，不是一个需要假设的定理</span>。而且它恰好避开了 p53 揭示的那个陷阱——<b>「能证明是 PAC 的」常常伴随着不可实现的常数</b>，而你报的是实测的 N，没有常数问题。<br><b>两条配套的做法</b>：<br>① <b>ε 必须先定后测</b>，不能看了结果再调。p47–48 演示过 ε 从 0.05 调到 0.04 结论就翻——<span class='w'>事后调 ε 等于选择性报告</span>。建议在预注册式的说明里把 ε 的来源写清楚（比如「成本降低 x% 时可接受的准确率损失」）。<br>② <b>N 要分层报</b>：按 query 难度分桶，看大错是否集中在某一类。<span class='k'>若集中，那不是随机失误而是系统性盲区</span>，比一个总数有信息得多。<br>标【推断】：这套报告形式是我按 PAC 的定义改写的；oracle 表能精确求值在简报里是【已核】。", "ref": "课件 p46 · p57 · 简报 §4d（oracle 表，已核）· L04 p43（留出集拆两半）"}},
{"r": [60, 61], "t": "实证：六臂模拟", "star": 1, "quote": "<b>MBIE-EB Empirically: 6 Arms Simulation</b> · <b>MBIE-EB Empirically: 6 Arms Results</b>", "one": "<b>两页图，在一个六臂的模拟问题上跑 MBIE-EB。</b>", "pts": ["<b>这两页只有图，没有正文。</b> 抽不出文字是正常的，不是漏页。", "<b>把它放在最后是有用意的：理论讲完了，看一眼它在实际上长什么样。</b> <span class='k'>本讲全程在理论与实证之间来回</span>——p8 的 Kaelbling 故事（实证先于理论）、p42 的「界更紧但 TS 实证更好」、p53 的「没有保证但常常够用」，<b>这一页是第四次。</b>", "⚠️ <b>六臂是个很小的问题。</b> 在这个规模上「MBIE-EB 表现好」说明不了它在大规模问题上也好——<b>而 L13 要讲的正是「这套方法在深度网络上还不成立」。</b>", "<b>不过「只有图」这件事本身值得停一下：课件把实证结果放在最后两页，而且没有配任何文字结论。</b> <span class='k'>这和前面每一页都带一句定性的风格不同</span>。<b>一个合理的读法是：这里展示的是「它能跑」，而不是「它更好」</b>——真正的比较性结论课件全程都给得很克制（p42 的三句话就是典型）。", "<b>六臂这个规模还暴露了 PAC 界在实践中的处境。</b> p57 说 N 是 (|S|,|A|,γ,ε,δ) 的多项式，而<span class='w'>多项式里的幂次本讲一个都没给</span>。<b>六臂问题上跑得通，不说明 |S| 上万时还跑得通</b>——因为 N 可能随 |S| 的某个幂次增长。", "<b>把本讲的「理论与实证来回」数一遍，一共四次</b>：p8 的 Kaelbling（实证先于理论十几年）、p42 的「乐观界更紧但 TS 实证更好」、p53 的「没有保证但常常够用」、以及这两页。<span class='k'>这个节奏是有意的</span>——<b>它在反复提醒：证明和管用是两件要分别确认的事。</b>", "⚠️ <b>L13 接着要讲的正是这条缝</b>：把探索证成定理之后，再承认它在深度网络上还不成立。<b>所以这两页的「小规模上能跑」是一个过渡，不是结论。</b>"], "tip": {"t": "读法", "v": "本讲到这里结束，但它留了一个明确的缺口给 L13：<b>这套 PAC 机器是在表格型、小规模 MDP 上建起来的</b>。<span class='w'>六臂模拟跑得好，不说明 |S| 上万时还好</span>——N 的多项式里幂次本讲一个都没给。<b>L13 的任务正是把这条缝摊开</b>：先把探索证成定理，再承认它在深度网络上还不成立。"}}
];

var TH = {"title": "L12 接上课题的哪一段：你的问题是上下文老虎机，这一讲给了框与算法", "arc": "<b>这一讲对你最要紧的一页是 p43</b>：上下文老虎机的定义——<em>input context which impacts reward of each arm, context sampled <b>iid</b> each step</em>。逐项对过去：<b>上下文 = query</b>、<b>臂 = 保真度配置</b>、<b>奖励 = 这条 query 的 Acc 与 Cost</b>，而最关键的那条也成立：<span class='k'>你对这条 query 用什么配置，不影响下一条 query 是什么</span>。<br><br>所以「这是不是 MDP」那个争论，在这里有了第三个答案：<b>它既不是无上下文的老虎机</b>（query 特征显然影响哪个配置最好），<b>也不必是 MDP</b>（配置不改变 query 分布）。<span class='w'>但这个框能不能用，取决于可加性检验</span>——上下文老虎机要求单步决策，而你的 workflow 有 H 个节点；只有节点效应可加，H 个节点才能拆成 H 个独立的单步问题。<b>这和 L11 p16 指向的是同一个实验。</b><br><br><b>这一讲还给了你两样可以直接用的东西。</b><br><b>一、Beta 伪计数</b>（p24–25）：每个「节点 × 档位」挂一个 Beta(α,β)，更新只是加法。它一次解决三件事——「数据够不够」有了可数的判据（α+β 就是有效样本量）、小样本虚高被自动收缩（跑 3 条全对给 0.8 而不是 1.0）、先验强度可审计（Beta(1,1) = 注入 2 个假样本）。<b>这正好对冲 L04 p42 的最大化偏差</b>：在 2187 个候选里取最大时，虚高的多半是样本少的那些，而收缩按样本量自动调节力度。<br><b>二、按「是最优的概率」排序</b>（p28–30）：与其报 <code>argmax Ĝ</code>，不如报每个配置「是最优」的后验概率。<span class='k'>后者把样本少的不确定性算了进去</span>，不会因为跑了三条 query 全对就排第一。而如果你要迭代地花预算，这就是 Thompson 采样在你这里的直接形态——<b>它没有任何需要调的旋钮</b>（没有 ε、没有置信水平，后验宽度本身就是探索力度）。<br><br><b>最后一条实证线索值得单记</b>：讲稿里她补充说 TS 在<b>结果延迟</b>时比 UCB 更稳健。你的奖励正是整条 workflow 跑完才出现。机制是 UCB 确定性、结果没回来前上界不变会反复选同一条臂，而 TS 每轮重新抽样，自动把等待期分散开。", "pitfalls": [{"v": "<b>把上下文老虎机当成「简化的 MDP」套上去。</b> 它是另一类问题，不是 MDP 的特例简化版——<span class='k'>有状态但无状态转移</span>。既不能直接用无上下文老虎机的分析（有上下文），也不需要 MDP 的全套机器（没有延迟后果）。它有自己的一套界。<b>但前提是单步</b>：H 个节点要能拆开，而那取决于可加性检验。", "tag": "推断", "ref": "课件 p43 · L11 p16 科研格"}, {"v": "<b>直接把伯努利–Beta 套到 G = Acc − λ·Cost 上。</b> <span class='w'>Acc 那一半是二值的，Cost 那一半是连续的</span>。按 L03/L05 一路下来的结论两半本就该分开建模：Acc 用 Beta–伯努利，Cost 用回归（近乎确定，预期 R² &gt; 0.95）。<b>合成 G 时要把两边的不确定性分别传播</b>，不能挂一个 Beta 了事。", "tag": "推断", "ref": "简报 §4e（两半拆分，已核）· 课件 p24–p25"}, {"v": "<b>把同一条 query 上的重复评估当独立样本。</b> Beta–伯努利要求各次独立，而同一条 query 重复跑用的是同一个 LLM、同一个提示，<span class='w'>相关性很强</span>。<b>要按 query 聚合，跨 query 才接近独立。</b>这和 UCB 的 Hoeffding 推导依赖 i.i.d. 是同一件事（L12.a p8）。", "tag": "推断", "ref": "课件 p24 · L12.a p7–9 科研格"}, {"v": "<b>报「遗憾更低」却不说参数是怎么来的。</b> 模拟实验里参数从某个分布随机生成时，量的其实是<b>贝叶斯遗憾</b>；在固定 benchmark 上比，量的更接近<b>频率派遗憾</b>。<span class='k'>两者给出的排名可以不同</span>，而贝叶斯遗憾的值还依赖所用先验。<b>报告时必须把先验与参数来源一起说清楚。</b>", "tag": "推断", "ref": "课件 p26 · p44"}, {"v": "<b>把「界更紧」读成「表现更好」。</b> 本讲给了一个干净的反例：乐观的<b>频率派</b>界比 TS 紧（p42），但换到<b>贝叶斯遗憾</b>两者齐平（p44），而实证上 TS 常常更好（p42，原文用词是 <em>extremely effective</em>）。<b>三句话都对，因为量的不是同一个东西。</b>读文献时要连问三句：哪把尺子、渐近还是有限步、常数差多少。", "tag": "已核", "ref": "课件 p42 · p44（原文逐句核对）"}, {"v": "<b>用单次运行的结果比较 TS 与 UCB。</b> <span class='w'>TS 是随机算法</span>，同一组真参数、同一段历史跑两次可能给出完全不同的序列。p40–41 那张五步对比表只能用来看<b>错误的形态</b>（乐观是多次小错，TS 是一次大错后再不犯），不能用来排名。<b>TS 必须报多个种子。</b>", "tag": "已核", "ref": "课件 p29（算法第 3 行采样）· p40–p41"}], "ammo": [{"q": "你为什么不用 UCB / Thompson 采样？", "a": "<b>先区分两种工作模式。</b> 若是<b>一次性全评估</b>（现在的做法），本讲的探索算法一个都不需要——没有「选择决定下次看到什么」的回路，不存在探索–利用权衡，只有「覆盖够不够」这一个问题。<b>若改成迭代地决定下一批跑哪些配置</b>，它们立刻全部相关，而 Thompson 采样是首选，因为<span class='k'>它没有需要调的旋钮</span>。<b>这个分界要在论文里写明</b>，否则必被追问。", "tag": "推断", "ref": "课件 p3–p4（设定/框架/做法三维表）· L04 p23 科研格"}, {"q": "AFlow 用的是 MCTS，你为什么说它不是？", "a": "指着 UCB 的定义说它缺了什么。UCB 的构成是 <code>点估计 + 随 N 下降的不确定项</code>；AFlow 的选择规则是 top-k(k=3) + 混合分布 <code>P(i) = λ·(1/n) + (1−λ)·softmax(α(s_i − s_max))</code>，λ=0.2、α=0.4——<span class='w'>没有访问计数，没有置信上界，没有 expectimax/minimax 回传</span>，它的 Backpropagation 只是把 (parent, modification, avgScore) 追加进父节点的经验日志。<b>正确叫法是 Boltzmann-greedy selection 或 LLM-guided evolutionary search。</b>带上 Algorithm 1 / Appendix A.6 行号精确指出来，本身就是加分项。", "tag": "已核", "ref": "简报 §2（AFlow Algorithm 1，Appendix A.6 行 28–42）· 课件 p8–p9"}, {"q": "你怎么保证挑出来的那个配置的分数不是虚高？", "a": "两条并用。<b>一、留出集拆两半</b>（L04 p43 的 split samples）：在 split A 上挑，在 split B 上报告，B 的估计无偏因为没参与挑选。<b>二、报「是最优的后验概率」而不是点估计最大值</b>：Beta 后验自动按样本量收缩，<span class='k'>跑三条 query 全对给 0.8 不给 1.0</span>。两条都几乎不花钱，而且解决的是同一个病根——<b>比较时丢掉了不确定性</b>。", "tag": "推断", "ref": "L04 p42–p43 科研格 · 课件 p24–p25"}, {"q": "你报的是哪一种保证？", "a": "要先说清用的是哪把尺子。本讲给了三把：<b>频率派遗憾</b>（对所有参数成立，更强更悲观）、<b>贝叶斯遗憾</b>（对先验平均，值依赖先验）、<b>PAC</b>（不加总，只数犯大错的次数）。<span class='k'>而你真正要的陈述是「上线后不更差」</span>——在形状上更接近 PAC 而不是遗憾，因为遗憾会把「一次大错」和「多次小错」算成同一个数。<b>这个选择要在形式化那一节明确。</b>", "tag": "推断", "ref": "课件 p6 · p26 · p46（PAC 框架在 L12.c）"}], "papers": [{"t": "Chapelle &amp; Li — An Empirical Evaluation of Thompson Sampling", "id": "NIPS 2010", "why": "<b>课件 p43 点名的那篇。</b> 上下文老虎机做新闻推荐，臂 = 文章、奖励 = 点击。她的说法是它<em>改变了很多人对贝叶斯老虎机与 Thompson 采样的看法</em>——在真实数据上 TS 打败了 UCB 与其它一批算法。<b>「TS 在真实系统上更好」这个论断引它比自己论证有力。</b>讲稿还补了一条课件没有的：它在<b>结果延迟</b>时也更稳健，而你的奖励正是终局才出现。"}, {"t": "Lai &amp; Robbins — 渐近最优的自适应分配规则", "id": "1985（课件 p42 点名「Lai and Robbins lower bound」）", "why": "老虎机遗憾<b>下界</b>的出处。p42 说 Thompson 采样达到了这个下界——「达到下界」意味着渐近意义上无法再改进，是算法能拿到的最高评价。<b>你若要论证某个选择规则「已经够好」，这是标准的引用方式。</b>"}, {"t": "Auer, Cesa-Bianchi &amp; Fischer — UCB1", "id": "2002（课件 p10 起反复点名）", "why": "UCB1 与那条 <code>8 log t · Σ 1/Δ<sub>a</sub></code> 的遗憾界的出处。<b>你要论证「AFlow 的选择规则不是 UCB」时，对照的就是这篇里的算法形式。</b>"}, {"t": "Thompson — 1933 / 1929", "id": "课件 p42 写作「Thompson sampling(1929)」", "why": "算法本身的出处，比 UCB 早七十多年，被冷落到 2010 年前后才因实证表现重新成为主流。<span class='w'>⚠ 年份要核</span>：课件写 1929，而文献里常引的那篇是 1933（Biometrika）。<b>引用前查原文，别照抄课件的年份。</b>"}, {"t": "Sachdeva, Su &amp; Joachims — Off-policy Bandits with Deficient Support", "id": "KDD 2020", "why": "虽然不是本讲内容，但它是你当前处境的正式名字，而且<b>它正是在老虎机框架下写的</b>——与 p43 的上下文老虎机形式化直接衔接。确定性日志导致支撑集不足时该怎么办：限制目标策略类，或接受有偏但可控的估计。"}]};

    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      // ⚠ 不能换掉 iframe 元素：error/load 两个监听器是初始化时挂上去的，
      //   换元素会把它们孤儿化，「打不开？」面板就再也不会弹，
      //   读者只剩一个空白框、毫无线索（2026-10-23 我就是这么写错的）。
      //   先 about:blank、下一个 tick 再设真地址 —— 同样是新导航，元素不动。
      frame.src="about:blank";
      setTimeout(function(){ frame.src=SRC+HASH; }, 0);
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
