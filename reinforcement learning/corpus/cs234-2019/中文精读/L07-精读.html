var N = [
{"r": [1, 2], "t": "这一讲要干什么", "star": 2, "one": "奖励太稀疏、试错太贵的时候，<b>让 agent 看专家怎么做</b>。", "pts": ["四节：行为克隆 → 逆强化学习 → 学徒学习 → 最大熵逆 RL。", "<span class='w'>前 16 页是第六讲的复习</span>，新内容从 p17 开始。", "<b>标题里的 <em>in Large State Spaces</em> 不是凑字数，它是这一讲的前提。</b>模仿学习本身在小状态空间里几乎不需要——状态能查表的时候，你直接把专家的表抄下来就完了。<span class='k'>真正的问题是状态空间大到必须用函数逼近，于是「抄」变成了「拟合」</span>，<b>而一旦是拟合，就会有误差；一旦有误差，误差就会把你带到专家没去过的地方。</b>这一讲后面一半的篇幅都在处理这件事。", "<b>把目录那四节的关系先摆清楚，后面三十页会好读很多。</b>它们不是四个并列的方法，<span class='k'>而是一条「前一个不行，所以有了后一个」的链子</span>：<br><b>① 行为克隆</b>——直接拟合专家的动作。简单，<span class='w'>但会在第一次犯错时崩掉</span>（p30）。<br><b>② 逆强化学习</b>——不学动作，反推奖励。奖励比策略稳得多，<span class='w'>但奖励函数不唯一</span>（p43）。<br><b>③ 学徒学习</b>——干脆绕开「奖励到底是哪个」，只要求特征频率对上（p40）。<br><b>④ 最大熵逆 RL</b>——回头去解决②的不唯一：在所有能解释演示的奖励里，挑最不自作主张的那个。", "<b>读这一讲有一条贯穿始终的暗线，值得现在就记下来：这一讲出现了两次「不可辨识」。</b><span class='k'>第一次在 p9–p10</span>——给定 Q，拆成 V 和 A 的方式有无穷多种；<span class='k'>第二次在 p43</span>——给定专家行为，能解释它的奖励函数有无穷多个。<b>两次的病因完全一样：你要解的东西比你的约束多了一个自由度。</b><b>两次的药方也一样：自己定一个规范把那个自由度钉死。</b><span class='w'>而定规范的方式会影响结果</span>——p10 明说均值版比最大值版更稳。<b>所以前 16 页的复习不是白给的，它先给你看了这个病的一个简单版本。</b>", "<span class='w'>前 16 页确实是第六讲的原文复述</span>，课件自己也在那几页写「细节见第六讲」。<b>但这一片不会把它们当目录念过去</b>——我们换一个这一讲才需要的角度去看：<span class='k'>这三个改进各自修了一种病，而没有一个在修「要多少数据」</span>。<b>把这件事看清楚，p17 那句「我们还缺一样：效率」才不是突然冒出来的。</b>"], "tip": {"t": "课件自己标的来源", "v": "幻灯片来自 Katerina Fragkiadaki 与 Pieter Abbeel。"}, "quote": "Lecture 7: Imitation Learning in Large State Spaces &nbsp;·&nbsp; Table of Contents: 1 Behavioral Cloning &nbsp; 2 Inverse Reinforcement Learning &nbsp; 3 Apprenticeship Learning &nbsp; 4 Max Entropy Inverse RL", "tbl": {"head": ["第几节", "学什么", "输入 → 输出", "卡在哪"], "rows": [["① 行为克隆", "<b>策略 π</b>", "演示 → 一个分类/回归器", "<span class='w'>误差累积 εT²</span>（p30）"], ["② 逆强化学习", "<b>奖励 R</b>", "演示 → 权重 w", "<span class='w'>R 不唯一</span>（p35、p43）"], ["③ 学徒学习", "<b>策略（经由 R）</b>", "演示 → w → 再求最优策略", "<span class='k'>绕开②的不唯一</span>，但专家次优时结果是混合策略"], ["④ 最大熵逆 RL", "<b>奖励的分布</b>", "演示 → 一个熵最大的解", "正面处理②，<b>本讲只给指针不展开</b>（p44）"]]}},
{"r": [3, 6], "t": "复习：DQN 与两个改进", "one": "经验回放 + 固定 Q 目标；Double DQN；优先经验回放。", "pts": ["和第六讲 p38–p56 完全相同，<b>要细看请翻第六讲</b>。", "Double DQN：<code>目标 = r + γ·Q̂( arg max_{a′} Q̂(s′,a′; w), w⁻ )</code>——用 w 选、用 w⁻ 评。", "优先回放：<code>p_i ∝ DQN 误差</code>，<code>P(i) = p_i^α / Σ p_k^α</code>。", "<b>先把 DQN 那两件法宝各自在治什么病分开记，因为它们治的根本不是同一种病。</b><br><b>经验回放</b>治的是<span class='k'>样本不独立</span>：一条轨迹里相邻的状态几乎一样，连着拿它们做梯度下降，等于把同一个方向推了很多次。<b>把转移存进池子里随机抽，就把时间上的相关性打散了。</b><span class='w'>这正是第五讲 p21 提过的那件事</span>——函数逼近下同一片段里的更新会互相拉扯，回放是对它的直接补救。<br><b>固定 Q 目标</b>治的是<span class='k'>目标在动</span>：自举的目标值里含着你正在改的那组权重，于是你一边追一边把靶子往前推。<b>把评估用的权重冻住一段时间，靶子就暂时不动了。</b>", "<b>Double DQN 修的是第三种病：最大化偏差。</b>它的来源一句话就能说清——<span class='k'>最大值的期望不小于期望的最大值</span>。你的 <code>Q̂</code> 每个条目都带噪声，<b>取 max 这个动作天然会挑中那些「因为噪声而偏高」的条目</b>，于是即使噪声均值为零，<code>max_a Q̂</code> 的期望也会系统性地高于真值。<span class='w'>而 Q-learning 的目标里恰好有一个 max</span>，这个偏差就一轮一轮地被自举放大。", "<b>而「用不同的权重去选、去评」为什么能缓解它，关键在于噪声是否独立。</b><code>w</code> 挑出来的那个动作 <code>a* = arg max_{a′} Q̂(s′,a′; w)</code>，是对 <code>w</code> 这组噪声而言偏高的；<span class='k'>但拿 <code>w⁻</code> 去给它打分时，<code>w⁻</code> 的噪声和 <code>w</code> 的噪声不是同一份</span>，<b>于是「被选中」和「被高估」就脱钩了</b>。<span class='w'>注意这只是缓解不是消除</span>——两组权重来自同一批数据，噪声并不真正独立。", "<b>老师补的那个「两组权重来回换角色」的版本，值得多看一眼，因为它点破了一件事</b>：<span class='k'>Double DQN 真正需要的是「两份独立的噪声」，不是「一新一旧」</span>。标准做法用陈旧权重当第二份，<b>那是拿「时间上的距离」去换「统计上的独立」</b>——顺便还白赚了一个固定目标。<span class='w'>代价是那组权重真的旧，它携带的信息可能落后几万步。</span><b>对称换角色的版本两组都在更新，信息不陈旧，但也就失去了固定靶子的好处。</b><span class='k'>这是个取舍，不是谁更先进。</span>", "<b>优先经验回放值得单独拿出来说，因为它第一次干了这一讲的主题事：它故意让训练分布不等于数据分布。</b>按 <code>p_i ∝ |TD 误差|</code> 抽样，意思是<span class='k'>「错得越离谱的样本被看得越多」</span>。<b>直觉上很合理——那是你学得最差的地方。</b><span class='w'>但它同时意味着你不再是在原始的数据分布上做期望</span>，<b>于是梯度是有偏的，论文里要再乘一个重要性权重把它纠回去。</b>", "<b>把上一条和这一讲的主题接上：优先回放是「我们主动改了分布，所以要纠偏」。</b><span class='k'>而 p30 的行为克隆是「分布被我们自己的错误改了，而我们没察觉，也没纠」。</span><b>同一件事的两个方向：一个是知情地改分布并付出纠偏的代价，一个是不知情地被改分布并付出 εT² 的代价。</b><span class='w'>第五讲 p44 的 Baird 发散也是这家族的成员。</span><b>这一讲之后你会发现，「谁的分布」几乎是这门课后半程所有麻烦的共同根。</b>", "<b>还有一件容易忽略的事：这四个改进彼此是正交的，可以任意组合，而这正是下一页 Rainbow 存在的理由。</b><span class='k'>经验回放改的是「数据怎么来」，固定目标改的是「目标怎么算」，Double 改的是「目标里的 max 怎么算」，dueling 改的是「网络长什么样」。</span><b>四处互不干涉，所以可以全上。</b><span class='w'>但「可以全上」不等于「全上才好」</span>——p15 的消融会告诉你，有几个组件是互相覆盖的。", "<b>把这四条合起来，得到一句这一讲需要的结论</b>：<span class='k'>它们全都在改善「同一批数据能学出多好」，没有一个在改善「最坏情况下需要多少数据」。</span><b>前者是工程问题，可以靠巧劲一点点推进；后者是信息论问题，有硬下界挡着。</b><span class='w'>p17–p18 要讲的就是这堵墙</span>，<b>而这一讲给的出路不是绕过墙，是换一种监督信号，于是根本不走那条路。</b>"], "say": "课上有人追问 <code>w</code> 和 <code>w⁻</code> 的切换。老师补了一种第六讲没讲的做法：<b>不分「新旧」，而是维持两组权重来回换角色</b>——这一步用 A 选、B 评，下一步反过来。这样<span class='k'>两组权重都在频繁更新</span>，信息不会被一组陈旧权重卡住 50 个片段。", "quote": "DQN uses experience replay and fixed Q-targets &nbsp;·&nbsp; To help avoid maximization bias, use different weights to select and evaluate actions &nbsp;·&nbsp; Priority of a tuple i is proportional to DQN error", "tbl": {"head": ["改进", "修的是哪种病", "代价", "修了「要多少数据」吗"], "rows": [["经验回放", "样本在时间上相关", "内存；样本陈旧", "<span class='k'>部分——样本可复用</span>"], ["固定 Q 目标", "自举时靶子在动", "<span class='w'>目标信息滞后</span>", "否"], ["Double DQN", "<b>最大化偏差</b>", "几乎为零（小改动）", "否"], ["优先回放", "重要样本被平均掉了", "<b>引入采样偏差，要重要性权重纠回</b>", "<span class='k'>部分——同样的数据学得更快</span>"], ["<b>合计</b>", "—", "—", "<span class='w'>没有一个在动「最坏情况要多少样本」这一条</span> → p17"]]}},
{"r": [7, 11], "t": "复习：优势函数与 Dueling DQN", "one": "<code>A^π(s,a) = Q^π(s,a) − V^π(s)</code>；<code>Q = V + A</code> 不可辨识，要加约束。", "pts": ["两种约束：减 <code>max_{a′} Â</code>，或<b>减所有动作 Â 的均值</b>（更稳）。", "细节见第六讲 p59–p63。", "<b>先说为什么要把 Q 拆开，课件 p7 给的理由是一句很具体的话</b>：<em>Features need to pay attention to determine value may be different than those need to determine action benefit</em>——<span class='k'>判断「这个局面好不好」和判断「这一步该怎么走」需要看的东西不一样</span>。<b>课件举的例子是游戏分数：它跟 V(s) 高度相关，但对「现在该往左还是往右」几乎没有信息。</b>硬要用一个网络同时拟合这两件事，等于逼它用同一组特征回答两个不同的问题。", "<b>但分解真正买到的好处是样本效率，这一点课件没明说，值得补上。</b>不分解时，一次 <code>(s,a)</code> 的更新<span class='w'>只改 <code>Q(s,a)</code> 这一个输出头</span>；<span class='k'>分解后，这次更新会流进 <code>V(s)</code> 那一支，而 <code>V(s)</code> 是所有动作共用的</span>。<b>于是「试了一个动作」这件事，顺带改善了对其余所有动作的估计。</b><span class='w'>动作数越多，这个好处越大</span>——这正是 dueling 在 Atari 上有效的主要来源。", "<b>现在说那个麻烦：<code>Q = V + A</code> 不可辨识。</b>反例三秒钟就能构造——<span class='k'>把 V 整体加上常数 c，把每个 A 整体减去 c，Q 一点没变</span>。<b>所以给定 Q，V 和 A 有无穷多组。</b><span class='w'>这不是理论上的洁癖</span>：网络在训练中会沿着这个自由度随意漂移，<b>两支的输出可以一起涨到很大而 Q 不变</b>，数值上非常危险。<span class='k'>必须钉死它。</span>", "<b>课件给的两种钉法，差别比看上去大。</b><br><b>① 最大值版</b>：<code>Q̂ = V̂ + Â − max_{a′} Â(s,a′)</code>。好处是<span class='k'>语义干净</span>——此时 <code>V̂</code> 恰好等于 <code>max_a Q̂</code>，也就是真的是「最优动作的值」，<code>Â</code> 真的是「相对最优动作差多少」。<span class='w'>坏处是 max 只由一个动作决定，那个动作一换，整条基线就跳一下。</span><br><b>② 均值版</b>：<code>Q̂ = V̂ + Â − (1/|A|)·Σ_{a′} Â(s,a′)</code>。<span class='w'>语义变脏了</span>——<code>V̂</code> 不再等于 <code>max Q̂</code>，它只是「差一个未知常数」的那个值。<span class='k'>但基线由所有动作平均决定，换一个动作只动 1/|A|，稳得多。</span><b>课件括号里那句 <em>more stable</em> 说的就是这个。</b>", "<b>这里有一个很值得带走的方法论：用「语义正确」换「数值稳定」，而且这笔交易是划算的。</b><span class='k'>因为你真正要的是 <code>arg max_a Q̂</code>，而不是 <code>V̂</code> 本身</span>——<b><code>V̂</code> 差一个常数完全不影响你挑哪个动作。</b><span class='w'>于是那个「变脏」的语义其实不要紧，而稳定性是实打实的。</span><b>同样的交易在 p43 之后还会再做一次</b>：最大熵逆 RL 也是放弃「找到真正的 R」，换一个有良好性质的解。", "<b>把这一页的结构抽象出来，就是本讲的暗线：</b><span class='k'>当你要解的量比约束多一个自由度时，解不唯一；此时你必须自己补一条约束，而补法会影响结果。</span><b>这一页补的是「基线怎么取」，p41 补的是 <code>‖w‖₂ ≤ 1</code>，p44 的最大熵补的是「熵最大」。</b><span class='w'>三处的共同点是：那条补上去的约束不来自数据，是你自己选的。</span><b>所以它是你的建模假设，必须写在论文里，不能藏在代码里。</b>", "<b>把 dueling 的网络结构说具体一点，因为「两支」这个词容易让人想错。</b><span class='k'>卷积层是共享的，只有最后几层全连接分叉</span>——一支输出一个标量 <code>V̂(s)</code>，另一支输出 <code>|A|</code> 个数 <code>Â(s,·)</code>，<b>然后按 p10 的式子合成 <code>Q̂</code>，再照常做 DQN 的更新。</b><span class='w'>注意训练信号完全没变</span>：你还是只拿到 <code>Q</code> 的目标，<b>从来没有人告诉网络「真正的 V 是多少」</b>——<span class='k'>这正是不可辨识的来源：监督信号只约束了两支的和。</span>", "<b>这就把「不可辨识」的本质讲清楚了：它是监督信号的维度不够。</b>你要定 <code>|A| + 1</code> 个数（一个 V 加 <code>|A|</code> 个 A），<span class='w'>而目标只给了你 <code>|A|</code> 个约束（每个动作的 Q）</span>。<b>少一条约束，就多一个自由度，解就是一条直线而不是一个点。</b><span class='k'>记住这个数数的方式——p39 把逆 RL 写成一组线性约束时，你要做的是同一件事：数一数约束够不够。</span><b>答案是不够，而且差得远。</b>", "<b>最后提醒一件实践上的事：定了规范之后，<code>V̂</code> 那一支的输出就有了确切含义，而这个含义是可以拿来调试的。</b><span class='k'>用最大值版时 <code>V̂</code> 应该约等于你观察到的最佳回报</span>；<span class='w'>如果它系统性地高出一大截，那就是最大化偏差还在</span>，<b>说明 Double DQN 那一层没起作用。</b><span class='k'>用均值版时这个检查做不了</span>——这是为稳定性付的一点代价，<b>但你可以改看「<code>Â</code> 的跨动作极差」：它应该随训练收窄，因为好策略下大部分动作的优势会趋同。</b>"], "quote": "Advantage function (Baird 1993): A(s, a) = Q(s, a) - V(s) &nbsp;·&nbsp; <b>Unidentifiable: given Q not a unique A and V</b> &nbsp;·&nbsp; Option 1: Force A(s,a) = 0 if a is action taken &nbsp;·&nbsp; Option 2: Use mean as baseline (more stable)", "tbl": {"head": ["定规范的方式", "式子", "V̂ 的语义", "稳定性", "课件态度"], "rows": [["最大值版", "<code>V̂ + Â − max_{a′} Â</code>", "<span class='k'>V̂ = max_a Q̂，干净</span>", "<span class='w'>基线由单个动作决定，会跳</span>", "Option 1"], ["均值版", "<code>V̂ + Â − mean_{a′} Â</code>", "<span class='w'>V̂ 差一个未知常数</span>", "<span class='k'>基线由全体平均，平滑</span>", "<b>Option 2，括号注 more stable</b>"], ["<b>不定规范</b>", "<code>V̂ + Â</code>", "—", "<span class='w'>两支可同时漂移，数值危险</span>", "<b>不可行</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页是本讲第一次出现「不可辨识」，而你的项目里有一个一模一样的量：<code>G = Acc − λ·Cost</code> 里的那个 λ。</b><br><span class='k'>Q = V + A 的自由度是「基线加多少」，你的自由度是「准确率和成本怎么换算」。</span><b>两者的共同点是：数据本身定不出来，必须你自己钉。</b><br><br><b>这一页顺便告诉你钉法会影响结论，而且影响方式是可以分析的。</b>p10 的两个选项里，均值版之所以更稳，是因为<span class='k'>基线由全体动作平均决定，单个动作的抖动只贡献 1/|A|</span>。<b>把同样的推理搬到 λ 上：如果你用「单条最贵的轨迹」去定标度，λ 就会跟着那一条抖；用全体轨迹的成本中位数去定，就稳得多。</b><br><br><b>可直接照搬的一条做法</b>：把 Cost 先按<span class='k'>留出集上的成本中位数</span>归一化，再谈 λ。这样 λ 的数值有了跨数据集可比的含义，<span class='w'>而不是一个随 token 价格浮动的魔数</span>。<b>p43 之后你还会看到第三种选择：不手定 λ，而是从示范里把它辨识出来。</b>", "ref": "课件 p9–p10（Unidentifiable；Option 2 more stable）· 本讲 p43 · 简报 §4e"}},
{"r": [12, 14], "t": "复习：DQN 实操建议", "one": "Pong 当体检 · 回放池越大越稳 · Huber 损失 · 至少两个种子 · 要有耐心。", "pts": ["细节见第六讲 p64–p66。", "<b>这三页看着像杂项清单，其实每一条都在防一种具体的事故，值得逐条还原。</b><span class='k'>而且它们合起来正好是 p17「我们还缺效率」那句话的实证版本</span>——<b>一份需要你等 10–40M 帧、跑两个种子、还要先在 Pong 上体检的清单，本身就是「这玩意儿太费数据」的证词。</b>", "<b>「拿 Pong 当体检」是一条关于「可证伪」的建议。</b>深度 RL 最难受的地方是<span class='w'>失败没有信号</span>——曲线不涨，你分不清是实现有 bug、超参不对、还是这个任务本来就难。<span class='k'>Pong 的作用是提供一个「已知应该成功」的基准</span>：<b>它跑不出分，就一定是你的代码有问题，不必再怀疑别的。</b><span class='w'>先建立一个能证伪的测试，再去碰难任务</span>——这条习惯比任何超参都值钱。", "<b>Huber 损失那条值得把式子摊开看，因为它和自举直接相关。</b><code>L(x) = x²/2</code>（当 <code>|x| ≤ δ</code>），<code>L(x) = δ|x| − δ²/2</code>（否则）。<span class='k'>关键在导数：平方段的导数是 x，线性段的导数被钉死在 ±δ。</span><b>也就是说，无论贝尔曼误差多大，单个样本能推动权重的力气有上限。</b>", "<b>为什么偏偏是贝尔曼误差需要这个保护？因为它的离群值不是噪声，是结构性的。</b><span class='w'>自举的目标值本身就是个估计</span>，训练早期它可以离谱到任意程度。<b>用平方损失的话，一个离谱目标会产生一个巨大的梯度，一步就能把网络推坏。</b><span class='k'>Huber 的意思是：我承认这个样本误差很大，但我不承认它很重要。</span><b>这和「优先回放要多看大误差样本」正好构成一对张力</b>——<span class='w'>抽样上更看重它，更新上更不信它</span>，两者并不矛盾：前者说「这里要多学」，后者说「别被一次离谱目标带沟里」。", "<b>「至少跑两个种子」是这一页最被低估的一条。</b>深度 RL 的<span class='w'>种子间方差大到可以反转结论</span>——同一份代码、同一组超参，换个随机种子可能一个成功一个完全不动。<span class='k'>单种子的曲线不构成证据</span>。<b>老师说「至少两个」是课堂上的底线，不是推荐值</b>；<span class='w'>发表用的实验通常要更多，并且报告的是分布而不是最好的那条。</span>", "<b>剩下几条快速过一遍，但注意它们共同指向同一件事：数据便宜但不是免费。</b><b>回放池要大</b>——所以用 <code>uint8</code> 存图、不要重复存帧，<span class='k'>内存效率直接决定你能存多少经验，而经验量决定样本相关性被打散的程度</span>。<b>学习率要有调度</b>——早期探索阶段用大学习率，因为那时的目标本来就不准，精细拟合毫无意义。<b>探索调度可以非标准</b>——ε 的衰减曲线是个该调的超参，不是个常数。", "<b>这几条建议还共享一个更深的立场，值得单独说破：它们都在假设「你会失败很多次」。</b><span class='k'>先在 Pong 上体检、跑两个种子、用 Huber 兜住离谱梯度</span>——<b>这些不是提高上限的手段，是降低单次失败代价的手段。</b><span class='w'>而「允许失败很多次」本身就是个前提</span>，<b>仿真里成立，现实里往往不成立</b>——<span class='k'>p21 马上就要用这一点来说明无模型 RL 的适用边界</span>。"], "quote": "Pong is a reliable task: if it does not achieve good scores, something is wrong &nbsp;·&nbsp; Be patient. DQN converges slowly--for ATARI it is often necessary to wait for 10-40M frames &nbsp;·&nbsp; Try Huber loss on Bellman error &nbsp;·&nbsp; Always run at least two different seeds when experimenting", "tbl": {"head": ["建议", "在防什么", "背后的原理"], "rows": [["先跑 Pong", "<b>分不清是 bug 还是任务难</b>", "<span class='k'>先要一个能证伪的基准</span>"], ["Huber 损失", "一个离谱的自举目标把网络推坏", "<b>梯度有上界 ±δ</b>"], ["回放池尽量大 · uint8", "样本相关性没被打散", "内存效率 → 经验量 → 独立性"], ["至少两个种子", "<span class='w'>把运气当成结论</span>", "深度 RL 的种子间方差极大"], ["耐心等 10–40M 帧", "过早判死刑", "<b>这条本身就是 p17 要讲的「效率」问题的证词</b>"]]}},
{"r": [15, 16], "t": "Rainbow 与无模型 VFA 小结", "star": 2, "one": "Rainbow 把这一堆改进<b>合在一起</b>（Hessel et al.）。", "pts": ["深度网络是极富表达力的逼近器，可以拿来表示 Q，做 MC 或 TD 式的方法。", "你应当能实现 DQN（作业二），并<b>说得出几个超出 DQN 的扩展</b>。", "<b>Rainbow 的实验设计比它的结果更值得学：它不是「把六个技巧堆起来涨点」，而是一次大规模消融。</b>六个组件分别是——<span class='k'>Double DQN、优先回放、dueling 结构、多步回报、分布式值函数、噪声网络探索</span>。<b>论文的做法是：先全上，然后一次去掉一个，看掉多少分。</b><span class='w'>这比「一次加一个」诚实得多</span>，因为后者会被加入顺序影响。", "<b>消融的结论里有两条对你有用。</b><span class='k'>第一，优先回放和多步回报是去掉之后掉得最狠的两个</span>——<b>而这两个恰好都在动「同一批数据能榨出多少」，不是在动网络结构。</b><span class='k'>第二，Double DQN 单独去掉几乎不掉分</span>，<span class='w'>因为分布式值函数已经顺带缓解了最大化偏差</span>。<b>这提醒你：技巧之间会互相覆盖，「每个都有用」不等于「每个都该加」。</b>", "<b>但这一页真正要你带走的是下面这句，它是 p17 的引信。</b><span class='w'>Rainbow 是当时最强的无模型方法，它在 Atari 上仍然需要两亿帧。</span><b>换算一下：按每秒 60 帧算，那是大约三十八天的连续游戏时间，而人类玩家通常在十几分钟内就能摸清同一个游戏。</b><span class='k'>六个改进叠在一起，把曲线抬高了，却没有把「要多少数据」这件事改变一个数量级。</span>", "<b>第六讲到这里的小结，课件给的是两句话：</b>深度网络是极富表达力的函数逼近器，可以拿来表示 Q，做 MC 或 TD 式的方法；你应当能自己实现 DQN，并说得出几个超出 DQN 的扩展。<span class='k'>把这两句话和上面那个「两亿帧」放在一起，就得到这一讲的出发点</span>：<b>表达力的问题我们解决得不错，效率的问题我们还没碰。</b>", "<b>多步回报值得单独提一句，因为它是这六个组件里唯一直接动了「自举多深」的。</b><span class='k'>把一步目标 <code>r + γ max Q̂</code> 换成 n 步目标</span>，<b>等于在 TD 和 MC 之间挑了个中间点</b>——<span class='w'>自举的成分少了，偏差小了，方差大了</span>。<b>它在消融里掉分很狠，说明第五讲那条 MC–TD 的权衡在深度设定下依然是主要矛盾，而不是被神经网络的表达力盖过去了。</b>", "<b>作业二要你实现 DQN，而课件要求你「说得出几个超出 DQN 的扩展」——这一页就是那份清单。</b><span class='k'>面试和口试里这题几乎必问，而值钱的答法不是背出六个名字，是说得出每个改的是哪一环</span>：<b>数据来源（回放）、目标稳定性（固定目标）、目标里的偏差（Double）、网络结构（dueling）、自举深度（多步）、以及值的表示形式（分布式）。</b><span class='w'>能按这个轴把它们摆开，就说明你理解的是问题而不是方法名。</span>"], "quote": "Hessel, Matteo, et al. Rainbow: Combining Improvements in Deep Reinforcement Learning"},
{"r": [17, 18], "t": "还缺一样：效率", "star": 3, "one": "前六讲谈了优化、延迟后果、泛化，<b>但没谈过「要多少数据」</b>。", "pts": ["有<span class='w'>硬度结论</span>：在一般的 MDP 上学到好策略，可能需要多到不现实的样本量。", "<b>别的出路</b>：用结构和额外知识去约束、去加速。", "今天：<span class='k'>模仿学习</span>。后面还有：策略搜索（策略类本身就编码了领域知识）、有章法的探索、引入人的帮助。", "<b>这一页是整门课的一次结账。</b>第一讲列了四样要求——优化、延迟后果、探索、泛化，<span class='k'>外加一句「而且要在统计上和计算上都高效」</span>。<b>前六讲把前四样都碰过了，而那句挂在最后的「高效」一直没人管。</b><span class='w'>这一页就是来收这笔账的，而收账的结果是个坏消息。</span>", "<b>坏消息的准确形式必须咬字读：<em>if learning in a generic MDP</em>。</b><span class='k'>generic 这个词是全部的重量所在</span>——<b>硬度结论说的是「存在一些 MDP，使得任何算法都需要大量样本」，它是对最坏情况说的，不是对你手上那个问题说的。</b><span class='w'>这个区别决定了出路长什么样</span>：<b>既然坏消息来自「对所有 MDP 都要管用」这个要求，那出路自然是——别要求对所有 MDP 都管用。</b>", "<b>于是就有了课件下一句：<em>use structure and additional knowledge to help constrain and speed reinforcement learning</em>。</b><span class='k'>注意它用的两个动词是 constrain（约束）和 speed（加速），而且 constrain 在前。</span><b>这个顺序不是随便写的：你是先把搜索空间缩小，然后才快起来的。</b><span class='w'>天下没有白来的加速——你用「我愿意放弃一部分 MDP」换了它。</span>", "<b>课件接着列了四条出路，它们是「额外知识」的四种不同形态，值得分清楚。</b><br><b>① 模仿学习</b>（今天）：额外知识 = <span class='k'>专家的演示</span>。<br><b>② 策略搜索</b>（下一讲）：额外知识 = <span class='k'>你选的策略类本身</span>——课件的原话是 <em>can encode domain knowledge in the form of the policy class used</em>。<br><b>③ 有章法的探索</b>：不是加知识，而是<span class='k'>把已有信息用得更狠</span>。<br><b>④ 引入人的帮助</b>：教学、奖励设定、动作设定……<b>模仿学习是这一类里最成熟的一支。</b>", "<b>把模仿学习的本质用一句话说死，后面三十页都好读：它换了一种监督信号。</b><span class='w'>标准 RL 的监督信号是奖励——便宜（赢没赢而已）、但稀疏，所以你得试很多次才攒够信息。</span><span class='k'>模仿学习的监督信号是「专家在这个状态下干了什么」——贵（要人来做），但每一步都有，而且直接指向答案。</span><b>它不是一个更聪明的 RL 算法，它是换了一门生意。</b><span class='w'>这也解释了它的全部毛病都和「这门生意的货源」有关</span>：货取样于专家走过的地方（p30），货的质量未知（p42），货能不能推出奖励也不唯一（p43）。", "<b>老师补的那句「tabular MDP 情形现在基本上下界都紧了」，是在说这件事已经没有侥幸空间。</b><span class='k'>「上下界都紧」意味着：不是我们还没找到好算法，而是已经证明了好算法不存在。</span><b>比 ε-贪婪聪明得多的探索也救不了那些病态 MDP。</b><span class='w'>所以这一页不是在卖模仿学习的好，而是在说明「为什么必须换路」。</span>"], "say": "老师说她的实验室做过这类下界，「<b>tabular MDP 情形现在基本上下界都紧了</b>」——结论是确实存在一些病态 MDP，你就是需要极多数据。比 ε-贪婪聪明得多的探索也救不了它们。", "quote": "We want RL Algorithms that Perform: Optimization &nbsp;·&nbsp; Delayed consequences &nbsp;·&nbsp; Exploration &nbsp;·&nbsp; Generalization &nbsp;·&nbsp; <b>And do it all statistically and computationally efficiently</b> &nbsp;|&nbsp; But exist hardness results that if learning in a generic MDP, can require large number of samples to learn a good policy &nbsp;·&nbsp; <b>Alternate idea: use structure and additional knowledge to help constrain and speed reinforcement learning</b>", "res": {"tag": "推断", "v": "<b>这一页的那句 <em>use structure and additional knowledge to help constrain and speed</em>，正是你整个课题的一句话辩护词。</b><br><span class='k'>你没有在一般 MDP 上做 RL，你在一个结构极强的问题上做</span>：<b>H 只有 5–10 个节点、每个节点的动作只是几档保真度、转移几乎是确定的（给定配置，流水线怎么走基本定死）。</b><span class='w'>硬度结论的那个 generic 把你排除在外了</span>，<b>这不是运气，是你该主动写进 paper 的一条理由</b>——审稿人问「为什么你敢用这么少的日志就做策略选择」时，这就是答案的骨架。<br><br><b>更具体一点，把你问题的结构逐条对上「额外知识」的四种形态：</b><br><b>① 演示</b>：AFlow 跑出来的那批配置<span class='k'>就是演示</span>——它们不是随机配置，是某个搜索过程认为好的配置。<b>这一点 p26 会变成一个具体的选择。</b><br><b>② 策略类</b>：你把策略限制成「逐节点选保真度」，<span class='k'>而不是「任意映射到任意工作流」</span>——这本身就是一次巨大的约束。<br><b>③ 探索</b>：§4c 的随机化决策节点就是这条。<br><b>④ 人的帮助</b>：λ 是你手定的，<span class='w'>这也是一次「额外知识」的注入，而且是最该被审视的那一次</span>（见 p9 的科研格）。", "ref": "课件 p18 原文 · 简报 §4c §4e · 本讲 p26"}},
{"r": [19, 20], "t": "蒙特祖玛的复仇", "star": 3, "one": "一个把 DQN 卡死的例子。", "pts": ["训练了 <b>5000 万帧</b>的 DQN，<span class='w'>只走通了头两个房间</span>。", "换成专门做探索的方法能走远不少，<b>但仍然通不了关</b>。", "早期真正在这个游戏上取得进展的路子，<span class='k'>多半是从模仿学习和演示数据开始的</span>。", "<b>先说清楚这个游戏为什么偏偏能把 DQN 卡死，因为它卡死的方式很有代表性。</b><span class='k'>蒙特祖玛的第一个房间要求：下梯子 → 跳过骷髅 → 拿钥匙 → 回头开门。这一串大约一百多个动作，中间一分奖励都没有，只有最后开门那一下才给分。</span><b>而 ε-贪婪探索的本质是「每一步以小概率随机」</b>——<span class='w'>要靠随机游走凑出一百多步的正确序列，概率是天文数字的倒数。</span><b>于是奖励信号从来没有出现过，没有信号就没有梯度，没有梯度就什么都学不到。</b>", "<b>这就把「稀疏奖励」这个词的真实含义摊开了：它不是「奖励比较少」，是「奖励在你的探索分布下概率为零」。</b><span class='k'>区别很重要</span>——<b>前者意味着你多跑一阵就行，后者意味着你跑到宇宙热寂也不行。</b><span class='w'>Atari 里大多数游戏属于前者（乱动就能吃到分），蒙特祖玛属于后者。</span><b>所以它成了衡量探索方法的标尺，而不是衡量网络表达力的标尺。</b>", "<b>课件引的 Bellemare 那篇是往「内在动机」方向走的：给没见过的状态发一笔「好奇心奖金」，把稀疏奖励人为地变稠密。</b><span class='k'>注意这和这一讲的思路是两条不同的路</span>：<b>内在动机是「自己造监督信号」，模仿学习是「从外面借一个监督信号」。</b><span class='w'>前者不用请人，但造出来的信号未必指向你真正想要的目标；后者指向明确，但要有人来演示。</span><b>这个取舍在你以后碰到任何「奖励不够用」的问题时都会重现。</b>", "<b>老师补的那句「后来被解决了」有个细节值得注意：解决它的几条路线里，有相当一部分就是从演示数据起步的。</b><span class='k'>因为只要给一条人类通关录像，那一百多步的正确序列就不再需要靠随机凑了</span>——<b>它从「探索问题」被降级成了「模仿问题」，而后者是监督学习。</b><span class='w'>这正是这一讲要卖的东西，也是 p19 被放在这里的理由。</span>", "<b>还有一个数字值得记住，它说明问题有多硬：课件说训练了 5000 万帧的 DQN 只走通了头两个房间。</b><span class='k'>而整个游戏有二十多个房间。</span><b>也就是说，花掉 Rainbow 四分之一的预算，拿到的是百分之十的进度。</b><span class='w'>这不是「再多跑一会儿就好了」的差距，是曲线根本不往上走。</span>"], "say": "老师补了后续：她自己和 Percy Liang 的实验室、以及 Uber AI 后来都把蒙特祖玛解决了。", "quote": "Consider Montezuma s revenge &nbsp;·&nbsp; Bellemare et al. \"Unifying Count-Based Exploration and Intrinsic Motivation\""},
{"r": [21, 21], "t": "RL 到目前为止的处境", "star": 3, "one": "靠稀疏奖励学习——<b>监督便宜，但样本复杂度高</b>。", "pts": ["<span class='k'>好在哪</span>：奖励信号简单、便宜（赢了还是输了）。", "<span class='w'>坏在哪</span>：需要的样本量极大。", "<b>什么时候管用</b>：仿真里数据便宜、容易并行。", "<b>什么时候不管用</b>：动作执行慢、失败代价高或不可接受、要求安全。", "<b>这一页的结构非常值得学：它把一个方法的适用边界写成了「什么时候不要用」，而不是「什么时候可以用」。</b><span class='k'>课件给的三条排除条件是：动作执行慢、失败代价高或不可接受、要求安全。</span><b>三条合起来其实是同一条：无模型 RL 要靠大量试错，所以凡是「试错很贵」的地方它都不合适。</b><span class='w'>而现实世界的大部分问题，试错恰好都很贵。</span>", "<b>「监督便宜但样本复杂度高」这句话里，两个词是在说同一枚硬币的两面，值得掰开。</b><span class='k'>奖励之所以便宜，正是因为它携带的信息少</span>——「赢了还是输了」是一个比特，<b>它不告诉你是哪一步走对了</b>。<span class='w'>信息少，你就得靠重复去积累；重复多，样本复杂度就高。</span><b>所以这不是「RL 还不够聪明」，这是监督信号本身的信息量决定的下限。</b><span class='k'>要突破它，只能换一个信息量更大的信号——这就是下一页要做的事。</span>"], "say": "老师的例子：用前面那些方法去学开遥控直升机，<b>你得准备很多架直升机</b>。", "quote": "Reinforcement Learning: Learning policies guided by (often sparse) rewards &nbsp;·&nbsp; <b>Good: simple, cheap form of supervision</b> &nbsp;·&nbsp; <b>Bad: High sample complexity</b> &nbsp;·&nbsp; Not when: Execution of actions is slow / Very expensive or not tolerable to fail / Want to be safe"},
{"r": [22, 22], "t": "奖励塑形：奖励从哪来", "star": 3, "one": "密集的奖励能很快塑造行为，<b>但这些奖励谁来写</b>？", "pts": ["<b>手工设计</b>：常常很脆——agent 会照着你写的优化，而那未必是你想要的。", "<b>隐式指定</b>：<span class='k'>用演示</span>。", "<b>「手工设计的奖励常常很脆」这句话，课件只给了结论，但它的机制值得说透，因为你一定会踩。</b><span class='k'>agent 会严格地优化你写下来的那个东西，而不是你心里想的那个东西。</span><b>这两者之间的任何缝隙，它都会找到并钻进去。</b><span class='w'>经典的失败形态是「拿分但不干活」</span>——你为了鼓励前进给了「距离终点更近就加分」，<b>它就学会在终点前来回蹭，因为来回蹭的加分总和比一次到达更多。</b><span class='k'>你写的每一条塑形项都是一个潜在的漏洞。</span>", "<b>老师那个开车的例子精确地指出了问题的不对称性：写规则难，演示容易。</b><span class='w'>「别撞人、别撞栏杆、别开出路面、要准时到」——你永远列不完，而且各条之间的权重还得你来定</span>（<b>这就是 p9 科研格说的那个 λ 问题</b>）。<span class='k'>可是「我开一趟给你看」这件事，任何一个会开车的人都做得到，而且一次就能传达全部这些约束。</span><b>演示的信息密度远高于规则，而生产成本远低于规则。</b><span class='w'>这个不对称就是整个模仿学习领域存在的理由。</span>", "<b>但要立刻补一句，否则后面会误读：「用演示隐式指定奖励」并不等于「不需要奖励函数」。</b><span class='k'>它等于「奖励函数变成了一个待估的量」</span>——<b>第二节的逆强化学习就是在估它。</b><span class='w'>你没有逃掉这个问题，你只是把它从「设计」变成了「推断」。</span><b>而推断有推断的麻烦，p43 会告诉你那个麻烦叫不可辨识。</b>"], "say": "老师的例子：<b>给开车写奖励函数</b>——别撞人、别撞栏杆、别开出路面、要到目的地——写全很难；可是「开一趟给你看」几乎人人都会。", "quote": "Rewards that are dense in time closely guide the agent. How can we supply these rewards? &nbsp;·&nbsp; <b>Manually design them: often brittle</b> &nbsp;·&nbsp; <b>Implicitly specify them through demonstrations</b>"},
{"r": [23, 24], "t": "应用举例", "one": "高速公路驾驶、航拍图导航、停车场导航、人类路径规划、目标推断、四足行走。", "pts": ["Abbeel &amp; Ng 2004；Ratliff, Bagnell &amp; Zinkevich 2006；Abbeel, Dolgov, Ng &amp; Thrun 2008；Baker, Saxe &amp; Tenenbaum 2009 等。", "<b>这两页别当参考文献列表翻过去——把它们按「演示的是什么」分一下组，你会看到一条很清楚的边界。</b><span class='k'>六个例子里有五个是物理控制：高速驾驶、航拍导航、停车、四足行走、人类走路。</span><b>只有一个不是——Baker、Saxe &amp; Tenenbaum 的「人类目标推断」。</b><span class='w'>这个分布不是巧合，它精确地标出了模仿学习最舒服的地盘。</span>", "<b>为什么扎堆在物理控制？三个条件同时成立，而且很难在别处同时成立。</b><br><b>① 奖励极难写</b>：「开得好」是一堆说不完的软约束（上一页）。<br><b>② 演示极易做</b>：<span class='k'>人类本来就天天在干这件事</span>，采集成本约等于「录下来」。<br><b>③ 试错极贵</b>：<span class='w'>撞一次车的代价远高于一次仿真失败</span>，正好落在 p21 那三条排除条件里。<br><b>三条合起来：RL 不能用，而演示唾手可得——这就是模仿学习的生态位。</b>", "<b>那个例外值得单独说，因为它代表了另一种完全不同的用法。</b><span class='k'>「人类目标推断」要的根本不是策略，而是奖励函数本身</span>——<b>研究者想知道的是「这个人在追求什么」，不是「怎么模仿他」。</b><span class='w'>这正是 p26 课堂上有人答出「研究生物行为」时老师叫好的原因。</span><b>认知科学拿逆 RL 当一种测量工具用：把行为当数据，把偏好当待估参数。</b><span class='k'>这条线一直活到今天——从演示里反推人的偏好，正是偏好对齐那一整套做法的祖宗。</span>", "<b>再提醒一件和你直接相关的事：这张清单上没有任何一个是「软件流水线」类的问题。</b><span class='w'>经典模仿学习假设有一个「会做这件事的人」</span>，而物理控制恰好满足这个假设。<b>但在 p46 老师会亲口说出困难所在：医疗、教育、推荐这些领域根本没人知道最优策略。</b><span class='k'>读这一讲时要一直带着这个问题：当「专家」不是人而是一个搜索过程时，这些结论还剩几条成立。</span>"], "quote": "Simulated highway driving (Abbeel and Ng, ICML 2004) &nbsp;·&nbsp; Aerial imagery-based navigation (Ratliff, Bagnell, and Zinkevich, ICML 2006) &nbsp;·&nbsp; Parking lot navigation (Abbeel, Dolgov, Ng, and Thrun, IROS 2008) &nbsp;·&nbsp; Human path planning &nbsp;·&nbsp; Human goal inference (Baker, Saxe, and Tenenbaum, Cognition 2009) &nbsp;·&nbsp; Quadruped locomotion", "tbl": {"head": ["例子", "演示的是什么", "奖励为什么难写", "要的是策略还是奖励"], "rows": [["高速公路驾驶", "人开车的轨迹", "安全、舒适、效率的权衡写不完", "<b>策略</b>"], ["航拍图导航 · 停车场", "人规划的路线", "地形代价是主观的", "<b>策略</b>"], ["四足行走", "人示范的步态", "「走得好」没有闭式定义", "<b>策略</b>"], ["人类路径规划", "人走路的轨迹", "—", "<b>策略</b>"], ["<b>人类目标推断</b>", "人的行为", "—", "<span class='k'>奖励（这才是研究对象）</span>"]]}},
{"r": [25, 25], "t": "从演示中学习", "star": 2, "one": "专家给一批轨迹（状态–动作序列），<b>比写奖励或直接编策略都容易</b>。", "pts": ["适用条件就是这句话：<span class='k'>演示比另外两件事更容易做到</span>。", "<b>这一页其实是一条适用性判据，而且它的形式很特别：它是相对的，不是绝对的。</b><span class='k'>课件没有说「模仿学习很好」，它说的是「当演示比另外两件事更容易时，模仿学习有用」。</span><b>所以用不用它，取决于你那三件事的相对成本，而不是它本身的优劣。</b><span class='w'>这是一条可以逐项核对的判据，不是一句口号。</span>", "<b>把那三条路各自的成本摊开，判据就能真用起来。</b><br><b>直接写策略</b>：要你<span class='k'>说得出每个状态下该干什么</span>。开车时你说不出，但「红灯停」这种你说得出——<span class='w'>所以规则系统在简单场景能用，复杂场景崩</span>。<br><b>写奖励</b>：要你<span class='k'>说得出各种结果的好坏排序和权重</span>。比写策略轻，但还是要穷举 + 定权重。<br><b>演示</b>：只要你<span class='k'>能做这件事，不需要能说清楚</span>。<b>这是关键——它把「会做」和「说得清」解耦了。</b>", "<b>「会做但说不清」这个状态有个现成的名字，叫缄默知识。</b><span class='k'>人类绝大部分技能都是这个状态</span>——<b>你会骑车，但写不出骑车的奖励函数；你会写代码，但说不清为什么这样命名更好。</b><span class='w'>模仿学习的全部价值，就是提供了一条「不经过语言」的知识传输通道。</span><b>而它的全部风险，也正来自这里：没经过语言，就没经过审查。</b><span class='k'>专家的偏见、习惯、甚至错误，会原样地被抄进去，而且你看不见。</span>"], "quote": "Expert provides a set of demonstration trajectories: sequences of states and actions &nbsp;·&nbsp; Imitation learning is useful when is easier for the expert to demonstrate the desired behavior rather than: come up with a reward that would generate such behavior, coding up the desired policy directly"},
{"r": [26, 26], "t": "问题设定：三条路", "star": 3, "one": "<b>给什么</b>：状态空间、动作空间、转移模型、一批专家演示。<span class='w'>不给奖励函数。</span>", "eq": "行为克隆     ：直接用监督学习学出老师的策略\n逆强化学习   ：把奖励函数 R 反推出来\n学徒学习     ：拿反推出的 R 生成一个好策略", "pts": ["三条路对应这一讲的三节，<b>难度和野心依次递增</b>。", "<b>输入清单里有一条很容易滑过去，但它决定了这一讲所有算法的形状：转移模型 <code>P(s′|s,a)</code> 是给定的。</b><span class='w'>这是个相当强的假设</span>——<b>第二节要算 <code>μ(π)</code>（某个策略下的特征访问频率），第三节要「对当前 w 求最优策略」，两件事都需要能在环境里规划或至少能反复模拟。</b><span class='k'>所以逆 RL 那条路默认你有模型；只有行为克隆那条路真的只要数据。</span><b>这是两条路在工程上最实际的一条分界，比它们的理论差异更常决定你能用哪个。</b>", "<b>三条路的递进关系，用一句话说清：它们在「信多少」上依次减少，在「要多少」上依次增加。</b><br><b>行为克隆</b>信专家的<span class='k'>每一个动作</span>，只要数据，最省事。<br><b>逆 RL</b> 只信专家<span class='k'>整体上是最优的</span>，不信某一步；换来的是一个可迁移的奖励函数，<span class='w'>代价是要模型、要优化</span>。<br><b>学徒学习</b>在逆 RL 之上再走一步，<span class='k'>把反推出的 R 拿去重新求最优策略</span>——<b>于是它有机会超过专家</b>（课堂上正好有人问这个，老师答「可以」）。", "<b>为什么「学奖励」比「学策略」更值钱，值得单独记一条：因为奖励比策略更不容易过时。</b><span class='k'>策略绑死在当下的动力学上——环境一变，抄来的动作就全错</span>；<b>而奖励函数描述的是「想要什么」，通常跨环境成立。</b><span class='w'>老师的说法是「奖励是任务最简洁、最可迁移的描述」。</span><b>换个路况、换辆车，你对「开得好」的定义不变，但具体怎么打方向盘全变了。</b>", "<b>老师在这里接的两个问答都值得记牢。</b><span class='k'>「什么时候只要奖励不要策略」——研究生物与人的偏好</span>，此时奖励函数就是研究结论本身（接 p24 那个例外）。<span class='k'>「能不能超过专家」——能</span>，<b>而且这正是第三条路存在的意义：反推出 R 之后你是在重新求最优，不是在抄</b>。<span class='w'>Abbeel 组还专门处理过「演示带噪声、要学的是那条最优路」的情形</span>——<b>也就是说，专家次优不但不是绝症，还可以是建模对象。</b>"], "say": "老师问「什么时候只想要奖励函数、不要策略」，有同学答得很好：<b>研究生物行为</b>。追踪猴子的行动，反推它的奖励函数，就是在问它的目标和偏好是什么。人也一样——通勤选择、购买偏好，背后是什么偏好结构。<br>还有人问「能不能超过专家」。老师答：<b>可以</b>，现在很多工作把模仿学习当引子，之后继续用 RL 往上走；Pieter Abbeel 组还专门处理过「专家演示带噪声，要学的是那条最优路」。", "quote": "Input: State space, action space &nbsp;·&nbsp; Transition model P(s | s, a) &nbsp;·&nbsp; <b>No reward function R</b> &nbsp;·&nbsp; Set of one or more teacher demonstrations &nbsp;|&nbsp; <b>Behavioral Cloning</b>: Can we directly learn the teacher policy using supervised learning? &nbsp;·&nbsp; <b>Inverse RL</b>: Can we recover R? &nbsp;·&nbsp; <b>Apprenticeship learning via Inverse RL</b>: Can we use R to generate a good policy?", "tbl": {"head": ["路线", "学什么", "对专家的假设", "需要转移模型吗", "能超过专家吗"], "rows": [["行为克隆", "<b>π</b>", "<span class='w'>每一步都对</span>", "<span class='k'>不需要</span>", "<span class='w'>不能，上限是专家</span>"], ["逆强化学习", "<b>R</b>", "整体最优即可", "<span class='w'>需要</span>", "—（它不输出策略）"], ["学徒学习", "<b>π（经由 R）</b>", "整体最优即可", "<span class='w'>需要</span>", "<span class='k'>能——重新求最优</span>"]]}, "res": {"tag": "推断", "v": "<b>这一页请你先回答一个问题：在你的课题里，谁是专家？</b><br><span class='k'>答案是 AFlow（或任何搜出那批配置的搜索过程），不是人。</span><b>这一条替换会同时带来一个好消息和一个坏消息，而且两个都很重要。</b><br><br><b>好消息：你的「演示」是自动产生的，可以无限量重采。</b><span class='w'>经典模仿学习的瓶颈是「人很贵」</span>——p33 老师说 DAGGER 不现实，理由就是专家要一直坐在回路里。<span class='k'>而你要再跑一个配置，只是一次 API 调用。</span><b>这意味着 p33 那条被工程现实判死刑的路线，在你这里反而是可行的。</b>（<b>详见 p33 的科研格——这是本讲给你的最大一条可操作线索。</b>）<br><br><b>坏消息：你的专家不满足「最优」假设。</b><span class='w'>AFlow 的搜索是在它自己的目标下做的，未必是你的 <code>G = Acc − λ·Cost</code></span>，而且它搜的是<span class='k'>工作流结构</span>，不是<span class='k'>逐节点保真度</span>。<b>于是 p39 那条「专家打赢所有其他策略」的约束，对你是存疑的。</b><br><br><b>所以三条路对你的可用性是分开的</b>：<b>行为克隆</b>可以当基线，但它只会复刻 AFlow 的偏好；<b>逆 RL</b> 是一条真正的新选择——<span class='k'>从 AFlow 的选择里反推它隐含的 λ</span>，拿来和你手定的 λ 对照（<b>这正是 p9 科研格许诺的那个「第三种选择」</b>）；<b>学徒学习</b>需要转移模型，而你恰好近似有一个（给定配置，流水线怎么走基本确定）。", "ref": "课件 p26 输入清单（P 给定）· 本讲 p33 p39 p43 · 简报 §4c §4e"}},
{"r": [27, 27], "t": "目录：行为克隆", "quote": "Table of Contents: <b>1 Behavioral Cloning</b> &nbsp; 2 Inverse Reinforcement Learning &nbsp; 3 Apprenticeship Learning &nbsp; 4 Max Entropy Inverse RL", "one": "第一条路：<b>把模仿当成纯粹的监督学习</b>。", "pts": ["<b>这一节只有三页（p28–p30 的正文加一页 ALVINN 的图），但它是全讲最重要的三页。</b><span class='k'>原因是：它先给你一个看起来完全合理的方案，然后在两页之内把它拆掉</span>，<b>而拆掉它的那个理由——「你的动作决定了你会看到什么」——是整门课后半程的共同主题。</b>", "<b>读这一节时请带着一个具体的问题：行为克隆到底哪一步错了？</b><span class='w'>提前说答案：它没有哪一步错，它的每一步都是标准监督学习的标准做法。</span><span class='k'>错的是它借用监督学习时，连带借走了一条在这里不成立的假设——训练分布等于测试分布。</span><b>这类错误最危险，因为代码里找不到 bug，论文里也挑不出逻辑漏洞。</b>", "<b>还有一个理由让这三页值得慢读：行为克隆是你最可能真的用上的方法。</b><span class='k'>它不需要转移模型、不需要奖励、不需要优化，只要一个监督学习库。</span><b>正因为它这么容易用，它的失效模式才尤其值得你认得出来。</b><span class='w'>p30 会告诉你那个失效模式长什么样，而且它的代价是平方级的。</span>"]},
{"r": [28, 29], "t": "行为克隆", "star": 3, "one": "把它当成<b>普通的监督学习</b>：输入状态，输出动作。", "pts": ["选一个策略类（神经网络、决策树……），拿 <code>(s₀,a₀), (s₁,a₁), …</code> 去拟合。", "两个早期成功：<b>ALVINN</b>（Pomerleau, NIPS 1989，神经网络开车）；Summut et al., ICML 1992（飞行模拟器）。", "<b>把这个方案的全部内容说完只要一句话：把状态当输入、把专家动作当标签，训一个分类器或回归器。</b><span class='k'>注意它丢掉了什么——轨迹的顺序。</span><b>一旦把 <code>(s₀,a₀), (s₁,a₁), …</code> 倒进训练集，「<code>a₀</code> 发生在 <code>s₁</code> 之前」这个信息就没了。</b><span class='w'>p30 的标题 <em>ignores temporal structure</em> 说的正是这一步。</span><b>这不是实现上的疏忽，是「转成监督学习」这个动作本身必然付出的代价。</b>", "<b>ALVINN 值得多说两句，因为它是 1989 年的东西，而它已经把这一套跑通了。</b><span class='k'>一个很小的神经网络，输入是前视摄像头的低分辨率图像，输出是方向盘转角，训练数据是人开车时同步录下的「画面 + 转角」。</span><b>它真的在公路上自主开了起来。</b><span class='w'>三十多年后的端到端自动驾驶，骨架和它是一样的</span>——<b>变的是网络规模和数据量，没变的是「把驾驶当成监督学习」这个框架，以及它会在哪里出问题。</b>", "<b>顺便把这两个成功案例的共同点挑出来，它解释了行为克隆什么时候真的管用。</b><span class='k'>开车和飞模拟器都有一个性质：专家的轨迹本身是「自稳」的</span>——<b>车道有中心线，飞机有配平姿态，小的偏差会被后续动作自然拉回来。</b><span class='w'>在自稳的系统里，一次小错误不会把你带离训练分布，于是 p30 的灾难不会发生。</span><b>反过来，在「一步走错就再也回不来」的系统里，行为克隆基本没法用。</b><span class='k'>判断你的问题属于哪一类，比调模型重要得多。</span>", "<b>有一个很实际的问题这一页没提，但你一动手就会撞上：动作是连续的还是离散的，决定了你训的是回归还是分类。</b><span class='k'>ALVINN 的方向盘转角是连续量，所以是回归</span>；<b>Atari 那种按键是离散的，所以是分类。</b><span class='w'>这个区别不只是损失函数换一下</span>——<b>回归会把「要么左打死要么右打死」的双峰分布平均成「直行」，而那往往是最差的动作。</b><span class='k'>专家的动作分布一旦是多峰的，单点回归就必然输出一个两头不靠的值。</span><b>这是行为克隆在实践中最常见的失效之一，和 p30 那个分布问题无关，却同样致命。</b>", "<b>多峰这件事还解释了一个常见现象：数据越多，行为克隆反而可能越差。</b><span class='w'>多收集几个专家，他们在同一个路口的选择未必一致</span>——<b>甲总是左转，乙总是右转，平均下来你的模型学会了直直撞上隔离带。</b><span class='k'>所以行为克隆对「专家之间是否一致」相当敏感，而这一条在课件的问题设定里被悄悄假设掉了</span>（p26 写的是 <em>teacher s policy π*</em>，单数、确定）。<b>真要处理多峰，就得让模型输出一个分布而不是一个点——这条线一路通向 p44 的 GAIL 和今天的扩散策略。</b>"], "quote": "Formulate problem as a standard machine learning problem: Fix a policy class (e.g. neural network, decision tree, etc.) &nbsp;·&nbsp; Estimate a policy from training examples (s0, a0), (s1, a1), (s2, a2), ... &nbsp;|&nbsp; Two notable success stories: Pomerleau, NIPS 1989: ALVINN &nbsp;·&nbsp; Summut et al., ICML 1992: Learning to fly in flight simulator"},
{"r": [30, 32], "t": "致命缺陷：误差会累积", "star": 3, "one": "监督学习是 <code>εT</code>，<b>放到 MDP 里变成 <code>εT²</code></b>。", "eq": "监督学习（假设 (s,a) 独立同分布）：\n  每步以概率 ε 出错  ⇒  E[总错误] ≤ ε·T\n\nMDP 里（动作决定了你下一步看到什么）：\n  E[总错误] ≤ ε·( T + (T−1) + … + 1 )  ∝  ε·T²", "pts": ["<span class='k'>根子是数据分布不匹配</span>：训练时状态来自 <code>π*</code>，测试时来自你自己的 <code>π_θ</code>。", "<b>一旦走错一步，你就进入了训练数据里根本没有的区域</b>，之后整条轨迹可能全是错的。", "出处：Ross et al. 2011。", "<b>先把那个平方是怎么来的算清楚，因为它的推导只有一行，而这一行解释了一切。</b><br><span class='k'>假设你在每个状态上以概率 ε 选错动作。</span><b>如果错误之间互不影响（这就是「时间上独立」），T 步里期望错 <code>εT</code> 次，</b>每次错误只毁掉那一步。<br><b>但在 MDP 里，第 t 步走错会把你带到一个专家从没到过的状态。</b><span class='w'>在那个状态上，你的策略没有任何训练数据，表现可以任意差——最坏情况下，剩下的 <code>T − t</code> 步全废。</span><br><b>于是把每一步出错的代价加起来：<code>ε·T + ε·(T−1) + … + ε·1 = ε·T(T+1)/2 ∝ εT²</code>。</b>", "<b>这一行里最该记住的不是 <code>T²</code> 这个形式，而是求和的每一项代表什么。</b><span class='k'>第 t 项 <code>ε·(T−t)</code> 的意思是：在第 t 步犯错，要赔上剩余的整条轨迹。</span><b>所以越早犯错越贵</b>——<span class='w'>第一步错的代价是 T，最后一步错的代价是 1</span>。<b>这条结论对实践的指导很直接：如果你的流水线有先后顺序，那么前面的环节值得花更多资源去保证正确。</b>", "<b>老师那个课堂例子是这一页最好的注解，值得把它的结构抽出来。</b><span class='k'>她看着某人从右门出去，学了个「走右门」的分类器；分类器出了点偏差，她往左走了；现在她站在那人从没去过的角落，完全不知道该干什么。</span><b>注意故事里的因果链：一次小偏差 → 进入无数据区 → 在无数据区表现任意差 → 更深地偏离。</b><span class='w'>这是一个正反馈：错误把你带去更没把握的地方，而更没把握会让你错得更多。</span><b><code>T²</code> 正是这个正反馈的账单。</b>", "<b>现在说那句被引用了无数次的话：<em>Supervised learning assumes iid (s,a) pairs</em>。</b><span class='k'>监督学习的泛化保证全都建立在「测试样本和训练样本同分布」上</span>——<b>没有这一条，经验风险最小化就不保证任何事。</b><span class='w'>而在 MDP 里，测试分布是你自己的策略生成的</span>：<b>你的策略一变，测试分布就跟着变。</b><span class='k'>于是这不是「假设偶尔不成立」，而是「假设在定义上就不可能成立」</span>——<b>除非你的策略恰好等于专家策略，而那正是你要学的东西。</b>", "<b>把这个循环写清楚，你就拿到了理解这一讲剩余部分的钥匙：</b><span class='k'>要让训练分布对，你得先有好策略；要有好策略，你得先在对的分布上训练。</span><b>这是个鸡生蛋的死结。</b><span class='w'>p33 的 DAGGER 是一种解法：迭代地打破它</span>——<b>用当前策略去产生分布，在那个分布上补标签，再训，再产生新分布。</b><span class='k'>第二节的逆 RL 是另一种解法：干脆不学策略，改学一个和分布无关的东西。</span>", "<b>最后给一条判据，因为 <code>εT²</code> 这个界本身是个最坏情况界，不是每次都兑现。</b><span class='k'>它假设「偏离训练分布后表现任意差」。</span><b>这一条在自稳系统里不成立（见 p28），在有「恢复演示」的数据集里也不成立</b>——<span class='w'>如果专家故意演示过「偏了之后怎么修回来」，那些状态就不是无数据区了。</span><b>这其实是业界最常用的廉价补救：不做 DAGGER，而是在采集时人为加扰动并录下修正过程。</b><span class='k'>它买到的是同一样东西——把你会走到的状态塞进训练集。</span>"], "say": "老师用课堂本身举例：她看着某人从右边的门出去，学了个分类器；但分类器出了点偏差，她往左走了——<b>现在她站在那人从没去过的角落，完全不知道该干什么</b>。监督学习的保证建立在「测试分布 = 训练分布」上，而在 MDP 里<span class='w'>是你的动作决定了测试分布</span>。", "tip": {"t": "这个坑后面还会反复出现", "v": "「我跟着的策略产生的状态分布」vs「我想评估的策略产生的状态分布」——第五讲 Baird 的 off-policy 发散是它，这里的误差累积也是它。"}, "quote": "<b>Supervised learning assumes iid. (s, a) pairs and ignores temporal structure</b> &nbsp;|&nbsp; Independent in time errors: Error at time t with probability ε, E[Total errors] ≤ εT &nbsp;|&nbsp; <b>E[Total errors] ≤ ε(T + (T-1) + (T-2) ... + 1) ∝ εT²</b>", "tbl": {"head": ["", "监督学习", "MDP 里的行为克隆"], "rows": [["样本假设", "<code>(s,a)</code> 独立同分布", "<span class='w'>同一条轨迹，前后强相关</span>"], ["测试分布由谁决定", "<span class='k'>给定，和你无关</span>", "<b>你自己的策略</b>"], ["一次错误的代价", "那一个样本", "<span class='w'>剩下的整条轨迹（T − t 步）</span>"], ["T 步的期望错误", "<code>εT</code>", "<b><code>εT²</code></b>"], ["什么时候不兑现", "—", "<span class='k'>自稳系统；训练集含「犯错后如何修正」的演示</span>"]]}, "res": {"tag": "推断", "v": "<b>任务清单把这一页标成 L07 对你最关键的一条，理由在这里：<code>εT²</code> 的那个机制，字面上就是「节点 h 的决策改变了 h+1 的输入分布」。</b><br><br><b>先把对应关系钉死。</b><span class='k'>课件的 t 是时间步，你的 t 是节点编号 h；课件的「走错一步」是选错动作，你的是在节点 h 选了一档不同的保真度。</span><b>后果完全同构：节点 h 换成低保真度，它交给 h+1 的中间产物就变了（更短、更糙、格式可能也不同），于是 h+1 面对的输入分布不再是日志里那个。</b><span class='w'>你在高保真日志上拟合的一切——成本模型、准确率模型、FQE 的 <code>Q̂</code>——在那一刻全部离开了各自的训练分布。</span><br><br><b>这一页顺带给了简报 §8 那个开放问题一个干净的说法。</b><span class='k'>§8 说的是：Learn-then-Test / conformal risk control 要求校准点与测试点可交换，而节点 h 的决策破坏了后续节点的可交换性。</span><b>p30 的原话 <em>Supervised learning assumes iid (s, a) pairs and ignores temporal structure</em> 正是同一句话的课堂版本</b>——<span class='w'>iid 之于监督学习，等于可交换性之于 conformal</span>。<b>两者都是「样本之间没有结构」的假设，而两者都被「决策会改变后续分布」打破。</b><span class='k'>这给了你一句可以直接写进 related work 的话：这个困难不是 conformal 方法特有的，它是把序贯决策问题交给监督学习式保证时的通病，在模仿学习里的经典表现就是 <code>εT²</code>（Ross et al. 2011）。</span><br><br><b>然后是好消息，而且这条好消息值得写进 paper：你的 T 很小。</b><span class='k'>H ≈ 5–10，所以 <code>T²/T</code> 的放大倍数是 5 到 10 倍</span>，<b>而机器人那边动辄 <code>T</code> 上千，放大上千倍。</b><span class='w'>短流水线天然抗分布漂移</span>——<b>这是一个结构性优势，和 L05 科研格里「短 horizon 缓解偏差累积」是同一个来源，但要注意那里的提醒：短 horizon 不缓解分布不匹配本身，只缓解它的累积。</b>", "ref": "课件 p30–p32 原文 · Ross et al. 2011 · 简报 §8 · L05 p34 科研格"}},
{"r": [33, 33], "t": "DAGGER：把专家留在回路里", "star": 3, "one": "沿着<b>你自己走出来的</b>轨迹，回头去问专家「这里该怎么做」。", "pts": ["每轮：按当前策略走一遍 → 对走过的每个状态<span class='k'>向专家索要标签</span> → 把这些 <code>(s, a*)</code> 并进数据集 → 重新监督训练。", "数据集<b>只增不减</b>（dataset aggregation），覆盖的正是你实际会遇到的状态。", "有形式化保证：<span class='k'>在它自己诱导的状态分布下</span>收敛到一个好的确定性平稳策略。", "<b>这一页的全部洞见压在课件那句话的一个介词短语上：<em>along the path taken by the policy</em>。</b><span class='k'>不是「更多数据」，是「你自己走出来的那条路上的数据」。</span><b>这个区别是 DAGGER 的全部</b>——<span class='w'>给行为克隆再多专家轨迹也没用，因为它们全都采样自专家的分布，而你的问题恰恰出在专家没去过的地方。</span><b>数据量不是瓶颈，数据的来源分布才是。</b>", "<b>把这条教训提炼成一句可以到处用的话：当你的模型在部署时表现比测试时差，先问分布而不是先问容量。</b><span class='k'>加数据、加参数、调正则，针对的都是「拟合得不够好」</span>；<b>而分布不匹配是「拟合得很好，但拟合的是别的东西」。</b><span class='w'>两种病的曲线看起来可以一模一样，药完全不同。</span>", "<b>再看课件给的那个保证，它的措辞很克制，值得咬字：<em>good performance under its induced state distribution</em>。</b><span class='k'>注意 <em>its</em>——是它自己诱导的状态分布，不是专家的。</span><b>这恰恰是对的那个承诺</b>：<span class='w'>你部署时走的就是它自己诱导的那个分布</span>，<b>所以在那个分布上好，才是你真正需要的保证。</b><span class='k'>对比行为克隆：它的保证是在专家分布上好，而那个分布你永远不会走。</span><b>换了一个分布来做承诺，这就是 DAGGER 的全部技术内容。</b>", "<b>算法本身简单到可以背下来，但有两处细节容易做错。</b><br><b>① 数据只增不减</b>（这就是 aggregation 的意思）。<span class='w'>不要每轮只用新数据重训</span>——<span class='k'>那会让策略在新旧分布之间来回震荡，不收敛。</span><br><b>② 第一轮要混入专家策略</b>。原论文用 <code>π_i = β_i·π* + (1−β_i)·π̂_i</code>，<code>β</code> 逐轮衰减到 0。<span class='w'>因为第一轮的策略是随机初始化的，让它自己去走只会收集到一堆垃圾状态。</span><b>先扶着走，再慢慢放手。</b>", "<b>老师对工程可行性的那番话，是这一页真正的结论，而且相当悲观。</b><span class='k'>DAGGER 要求专家对你走过的每一个状态给出标签</span>——<b>「开车绕十圈然后你就可以走了」是可行的，「你得一直坐在副驾上给每一帧打标签」不可行。</b><span class='w'>上百万个时间步意味着上百万次人类标注。</span><b>这就是为什么 DAGGER 在论文里很漂亮，在产业里却远不如逆 RL 那条线有影响力。</b>", "<b>老师给的那个折中值得记下来，因为它在真实系统里确实是主流做法：让专家只在需要接管时介入。</b><span class='k'>不介入就等于默认同意，介入的那一下就是一个高价值标签。</span><b>它把标注成本从「每一步」降到了「每次出问题」。</b><span class='w'>但老师也点出了代价：人仍然要全程盯着，心智负担不小</span>——<b>而且「不介入 = 同意」这个默认值并不可靠，人会走神，会反应不及。</b><span class='k'>自动驾驶的影子模式本质上就是这套，它的争议也正在这里。</span>"], "say": "有同学问这在工程上现实吗。老师答得很坦率：<b>这要求专家一直在回路里</b>，上百万个时间步就完全不可行。「开车绕十圈然后你就可以走了」比「你得一直坐在车里给每一步打标签」现实得多。<span class='w'>这正是 DAGGER 这条线不如逆 RL 那条线有影响力的原因。</span><br>她也给了个折中：让专家<b>只在需要接管时介入</b>，不介入就等于默认同意——但仍然要求人一直盯着，心智负担不小。", "quote": "DAGGER: Dataset Aggregation &nbsp;|&nbsp; <b>Idea: Get more labels of the expert action along the path taken by the policy computed by behavior cloning</b> &nbsp;·&nbsp; Obtains a stationary deterministic policy with good performance under its induced state distribution", "tbl": {"head": ["", "行为克隆", "DAGGER"], "rows": [["训练数据来自谁的分布", "<span class='w'>专家的</span>", "<span class='k'>自己当前策略的</span>"], ["保证说的是哪个分布", "<span class='w'>专家分布上好（你不会走那里）</span>", "<b>它自己诱导的分布上好（你正好走那里）</b>"], ["误差随 T 的增长", "<b><code>εT²</code></b>", "<span class='k'>线性（有形式化保证）</span>"], ["要专家在线吗", "<span class='k'>不要，录完就行</span>", "<span class='w'>要，每一步都要</span>"], ["瓶颈", "分布不匹配", "<b>专家的标注成本</b>"]]}, "res": {"tag": "推断", "v": "<b>这是本讲对你最有用的一页，而且是正面的：杀死 DAGGER 的那个理由，在你的课题里不成立。</b><br><br><span class='k'>老师判它工程上不现实，理由只有一条——专家必须一直在回路里，上百万步意味着上百万次人类标注。</span><b>而你的「专家标签」是什么？是把某个配置真的跑一遍，拿到 Acc 和 Cost。</b><span class='w'>那是一次 API 调用，不是一次人类标注。</span><b>可批量、可并行、成本是钱而不是人力和时间。</b><span class='k'>于是这条在机器人领域被现实判死刑的路线，在你这里是可行的——这正是「换了一个领域，约束条件变了，于是旧结论失效」的典型例子，值得在 paper 里点明。</b><br><br><b>具体怎么落：把 DAGGER 的循环翻译成你的流程。</b><br><b>① </b>用现有日志（AFlow 跑过的配置）拟合一个策略或 <code>Q̂</code>；<br><b>② </b><span class='k'>按这个策略挑出一批它会选、而日志里没有的配置</span>；<br><b>③ </b>把这批配置<span class='k'>真的跑一遍</span>，拿到真实的 Acc / Cost；<br><b>④ </b>并进数据集（只增不减），重新拟合；<br><b>⑤ </b>重复，直到新挑出的配置大部分已经在集合里。<br><span class='w'>这一步恰好同时治了 L05 的病</span>——<b>它让行为分布向目标分布靠拢，而 p44 那张 Baird 发散图的根因就是两个分布差太远。</b><span class='k'>也就是说，补一轮 on-policy 数据既降低分布漂移，又降低 FQE 发散的风险，是一笔花一份钱办两件事的买卖。</span><br><br><b>注意一个前提差异，别照搬：DAGGER 的专家给的是「该选哪个动作」，而你的重跑只给「这个配置的结果如何」。</b><span class='w'>前者是动作标签，后者是回报</span>——<b>所以严格说你做的不是 DAGGER，是「按当前策略做定向的 on-policy 采样」。</b><span class='k'>该引的是 DAGGER 的诊断（训练分布必须覆盖你将要走的分布），不是它的算法。</span><b>这个区分在写作时必须说清楚，否则会被审稿人抓住。</b>", "ref": "课件 p33 原文（along the path taken by the policy；its induced state distribution）· Ross et al. 2011 · L05 p44 · 简报 §4c"}},
{"r": [34, 34], "t": "目录：逆强化学习", "quote": "Table of Contents: 1 Behavioral Cloning &nbsp; <b>2 Inverse Reinforcement Learning</b> &nbsp; 3 Apprenticeship Learning &nbsp; 4 Max Entropy Inverse RL", "one": "第二条路：<b>不学动作，反推奖励</b>。", "pts": ["<b>换节了，而且换的是问题本身，不只是方法。</b><span class='k'>第一节问「专家在这个状态下会怎么做」，这一节问「专家到底想要什么」。</span><b>前者的答案是一个函数 <code>S → A</code>，后者的答案是一个函数 <code>S → ℝ</code>。</b><span class='w'>后者的输出维度小得多，这既是它的优势也是它的难处</span>——<b>信息压缩得更狠，所以更可迁移；也正因为压得狠，很多不同的奖励会压成同样的行为。</b>", "<b>为什么绕这一圈是值得的，上一节已经给了答案：行为克隆的 <code>εT²</code> 是分布问题，而奖励函数和分布无关。</b><span class='k'>你在专家轨迹上估出来的 w，拿到任何别的状态上都还是那个 w</span>——<b>它不像策略那样「出了训练区就失效」。</b><span class='w'>代价是你得再做一次规划才能拿到策略</span>（这就是第三节），<b>而规划需要转移模型（p26 的输入清单里确实给了）。</b>", "<b>读这一节要盯住一个词：不可辨识。</b><span class='k'>它会以三种形式出现——p35（不假设最优时什么都推不出）、p43（假设最优后仍有无穷多解）、以及 p43 的第二句（匹配特征的随机策略也有无穷多个）。</span><b>而这正是 p9 那个 <code>Q = V + A</code> 问题的大号版本。</b><span class='w'>解法也还是那一味药：加一条你自己选的约束。</span>", "<b>顺便留意课件接下来几页的一个小瑕疵：p37 把 <code>μ(π)</code> 说成 state features 的频率，p39 却写成 state 的频率。</b><span class='k'>以 features 为准</span>——<span class='w'>按 state 理解的话维度就是 <code>|S|</code>，整套做法在大状态空间下立刻失效</span>，<b>而这一讲的标题恰恰是 in Large State Spaces。</b>"]},
{"r": [35, 35], "t": "逆 RL 的起点：两个问题", "star": 3, "one": "给一批演示，<b>能反推出奖励函数吗</b>？", "pts": ["<b>问题一</b>：不对老师的最优性作任何假设，能推出什么？<span class='w'>什么都推不出来。</span>看一个瞎折腾的 agent，它的行为不含任何奖励信息。", "<b>问题二</b>：假设老师是最优的，能推出什么？——能推出不少，<span class='w'>但仍然不唯一</span>。", "<b>课件把这一页写成两个问句而不是两条结论，这个写法本身是教学设计，值得照着想一遍再往下看。</b><span class='k'>第一问的答案是「什么都推不出来」，而理由很硬</span>：<b>如果你不假设老师在追求什么，那么老师的任何行为都和任何奖励函数相容。</b><span class='w'>看一个随机乱动的 agent，你无法从中读出它的偏好，因为它压根没有偏好。</span><b>所以「老师是最优的」不是一个方便的简化，它是这整件事能成立的唯一支点。</b>", "<b>第二问的答案是「能推出不少，但仍然不唯一」，而那个经典反例三个字就能说完：R ≡ 0。</b><span class='k'>奖励处处为零时，所有策略的值都是零，于是所有策略都是最优的</span>——<b>包括专家那个。</b><span class='w'>它完美地解释了你看到的一切，而且不含任何信息。</span><b>老师在课上管这叫「一种可悲的人生」，这个说法很准：无所谓的人做什么都不违背他的偏好。</b>", "<b>第二个反例更温和但同样致命：给奖励整体加一个常数。</b><span class='k'>每个状态都多拿 c，所有策略的值都平移同样的量，排序一点没变。</span><b>所以 R 和 R + c 从行为上完全不可区分。</b><span class='w'>这和 p9 的 <code>V + c</code> / <code>A − c</code> 是同一个毛病，而且连形式都一样。</span><b>更一般地，任何保序变换都会留下同一个最优策略</b>——<span class='k'>也就是说，行为只能定出奖励的序，定不出它的尺度。</span>", "<b>这件事最早由 Ng &amp; Russell 在 2000 年指出，而他们那篇论文的处理方式值得记一下，因为它预告了后面几页的全部套路。</b><span class='k'>既然解有无穷多个，那就从中挑一个「最好的」</span>——<b>他们挑的是让专家的优势尽可能大的那个（max-margin），这正是 p41 算法里那个 γ 的来源。</b><span class='w'>而 p44 的最大熵换了一个挑法。</span><b>两次都是在同一个解集里挑，区别只在挑的标准。</b>"], "say": "老师现场投票：即使给你<b>十万亿条</b>最优策略的演示，奖励函数唯一吗？答案是不唯一。有同学给出了那个最经典的反例：<b>奖励处处为 0</b>——那时所有策略都是最优的（「<span class='k'>一种可悲的人生</span>」）。给奖励整体加一个常数同样不改变最优策略。这一点最早由 Ng &amp; Russell 2000 指出。", "quote": "Goal: infer the reward function R &nbsp;|&nbsp; <b>With no assumptions on the optimality of the teacher policy, what can be inferred about R?</b> &nbsp;·&nbsp; <b>Now assume that the teacher policy is optimal. What can be inferred about R?</b>"},
{"r": [36, 37], "t": "线性特征下的逆 RL", "star": 3, "one": "假设奖励在特征上是线性的，于是<b>值函数可以写成「权重 · 特征访问频率」</b>。", "eq": "R(s) = wᵀx(s)，  w ∈ ℝⁿ，x: S → ℝⁿ\n\nV^π = E[ Σ_t γᵗ R(s_t) | π ]\n    = E[ Σ_t γᵗ wᵀx(s_t) | π ]\n    = wᵀ · E[ Σ_t γᵗ x(s_t) | π ]\n    = wᵀ μ(π)", "pts": ["<span class='k'>w 是常数，可以整个提到期望外面</span>——这一步是全部关键。", "<code>μ(π)</code>：<b>该策略下状态特征的折扣加权访问频率</b>。", "可以把它想成第五讲那个平稳分布，<b>再乘上折扣</b>。", "<b>这一页的推导只有三行，但第二行到第三行那一步是全讲的技术支点，务必看清楚它凭什么成立。</b><span class='k'><code>w</code> 是一个常数向量，不随状态变、不随时间变，所以它能整个提到期望外面。</span><b>如果奖励不是线性的，比如 <code>R(s) = f(x(s))</code> 其中 f 是神经网络，这一步就做不了</b>——<span class='w'>期望进不去 f 里面</span>。<b>于是整个「值 = 权重 · 特征频率」的漂亮结构就没了。</b><span class='k'>线性假设买到的就是这一步，而这一步买到的是后面所有页。</span>", "<b>把 <code>μ(π)</code> 的含义说准，因为它的名字很容易让人想成状态分布。</b><span class='w'>它是「特征」的折扣加权频率，不是「状态」的</span>——<b>它的维度是 n（特征数），不是 <code>|S|</code>（状态数）。</b><span class='k'>这个区别是全部实用性的来源</span>：<b>状态可以有一亿个，但特征可能只有十个，于是 <code>μ</code> 是个十维向量，可以从演示里直接估。</b><span class='w'>（注意课件 p37 和 p39 的文字在这里有点不一致，一处写 state features，一处写 state——以 p37 的 features 为准，否则整套做法失去意义。）</span>", "<b>怎么从演示里估 <code>μ</code>，课件没写，但它简单到可以一句话说完：沿着每条演示轨迹把特征按 <code>γᵗ</code> 加权累加，再对所有轨迹求平均。</b><span class='k'>这是一个纯粹的蒙特卡洛估计，无偏，不需要模型，也不需要知道 R。</span><b>这是整条路线上唯一真正「从数据里来」的量。</b><span class='w'>剩下的 w、π、γ 全是算出来的。</span>", "<b>把这一页和第五讲接上，你会发现是同一个结构在复用。</b><span class='k'>第五讲的 <code>V̂(s;w) = wᵀx(s)</code> 是「值在特征上线性」，这一页是「奖励在特征上线性」。</span><b>而且后者蕴含前者：R 线性 ⇒ V 线性（就是这一页的推导）。</b><span class='w'>所以这一页不是新假设，是把第五讲那个假设往上游挪了一格。</span><b>挪上去的好处是：奖励比值更基本、更可迁移，而且 <code>μ</code> 可以直接估。</b>", "<b>还有一个实践上的坑：<code>γ</code> 必须和你估 <code>μ</code> 时用的那个一致。</b><span class='w'>演示轨迹长度有限，而 <code>μ</code> 的定义是无穷和</span>——<span class='k'>截断误差是 <code>γ^T/(1−γ)</code> 量级</span>，<b>γ 接近 1 而演示又短时，这个误差会悄悄吃掉 p40 那个 ε。</b>"], "quote": "Similarly, here consider when reward is linear over features: <b>R(s) = w^T x(s) where w in R^n, x : S -> R^n</b> &nbsp;|&nbsp; V^pi = E[sum gamma^t R(s_t) | pi] = <b>w^T E[sum gamma^t x(s_t) | pi] = w^T mu(pi)</b> &nbsp;·&nbsp; where mu(pi) is the discounted weighted frequency of state features under policy pi", "tbl": {"head": ["符号", "是什么", "维度", "从哪来"], "rows": [["<code>x(s)</code>", "状态的特征向量", "<code>n</code>", "<b>你设计的</b>"], ["<code>w</code>", "奖励权重", "<code>n</code>", "<span class='k'>待求——这就是逆 RL 的目标</span>"], ["<code>μ(π)</code>", "<b>特征</b>的折扣访问频率", "<code>n</code>", "<span class='k'>从演示里蒙特卡洛估</span>"], ["<code>V^π</code>", "<code>wᵀμ(π)</code>", "标量", "两者相乘"]]}},
{"r": [38, 38], "t": "目录：学徒学习", "quote": "Table of Contents: 1 Behavioral Cloning &nbsp; 2 Inverse Reinforcement Learning &nbsp; <b>3 Apprenticeship Learning</b> &nbsp; 4 Max Entropy Inverse RL", "one": "第三条路：<b>把反推出的奖励拿去重新求最优策略</b>。", "pts": ["<b>这一节的名字值得解释一下：学徒（apprentice）不是复印机。</b><span class='k'>学徒看师傅干活，学的是师傅在追求什么，然后自己去干</span>——<b>他可能干得比师傅好，因为他可能有更好的手。</b><span class='w'>这正是第三条路和第一条路的根本区别</span>：<b>行为克隆的上限是专家，学徒学习没有这个上限</b>（p26 课堂问答里老师明确说可以超过专家）。", "<b>但要先提醒一件事，不然你会对接下来两页的期望过高：这一节并不解决 p35 的不可辨识。</b><span class='k'>它绕过去</span>——<b>p40 会给出一条「不需要知道真 w 也能保证不输」的论证</b>，<span class='w'>而 p43 会回过头来提醒你，被绕过去的那个坑还在那儿。</span>", "<b>这一节只有三页（p39 写约束、p40 给保证、p41 给算法），但三页的分工极其清楚，可以当模板记。</b><span class='k'>p39 把「专家最优」翻译成可计算的不等式；p40 证明「不需要知道真 w 也能不输」；p41 把前两页拼成一个可执行的循环。</span><b>先提出约束、再证一个不依赖未知量的界、最后给算法——这是理论工作的标准三段式。</b><span class='w'>读任何一篇带保证的方法论文，都可以按这三段去拆它。</span>"]},
{"r": [39, 39], "t": "把「最优」写成对 w 的约束", "star": 3, "one": "专家最优 ⇒ <b>同一个 w 下，专家的特征频率必须打赢所有别的策略</b>。", "eq": "V* = E[ Σ γᵗ R*(s_t) | π* ] ≥ V^π = E[ Σ γᵗ R*(s_t) | π ]，∀π\n\n代入 V = wᵀμ：\n\n找 w* 使得   w*ᵀ μ(π*)  ≥  w*ᵀ μ(π)，   ∀π ≠ π*", "pts": ["<span class='k'>左边那个 μ(π*) 是你从演示里能直接估出来的</span>。", "于是「推奖励函数」变成了<b>一组线性约束</b>。", "<b>这一页把一个哲学问题变成了一个计算问题，而转换只用了一步代入，值得停下来欣赏。</b><span class='k'>「专家是最优的」本来是句没法算的话</span>；<b>代入 <code>V^π = wᵀμ(π)</code> 之后，它变成了一组对 w 的线性不等式。</b><span class='w'>线性不等式组是线性规划能处理的东西</span>——<b>于是「反推奖励」从一个模糊的推断问题，变成了一个标准的优化问题。</b>", "<b>但这组约束有个麻烦，课件没点破，你必须自己看出来：<code>∀π</code> 意味着约束有无穷多条。</b><span class='k'>策略的数量是指数级甚至连续的，你不可能把所有 π 都列出来。</span><b>p41 的算法正是为了对付这一点</b>——<span class='w'>它不一次性列完，而是一轮找一个「当前最难对付的 π」加进来</span>。<b>这个套路叫约束生成（constraint generation），在支持向量机、博弈论求解里到处都是：先解一个松弛问题，再找最违反约束的那个，加进去，重解。</b>", "<b>还有一个更根本的麻烦，它直接通向 p43：这组不等式永远有平凡解。</b><span class='k'>取 <code>w = 0</code>，所有不等式都变成 0 ≥ 0，成立。</span><b>这就是 R ≡ 0 在这个框架里的样子。</b><span class='w'>所以光有这组约束不够，必须再加两样</span>：<b>① 一个尺度约束（p41 的 <code>‖w‖₂ ≤ 1</code>），② 一个「让不等式尽量严格」的目标（p41 的 max γ）。</b><span class='k'>这两样都不是从数据来的，都是你自己定的规范——又一次。</span>", "<b>把这一页和 p9 并排看，本讲的暗线就完整了。</b><span class='w'>p9：<code>|A|</code> 个约束要定 <code>|A|+1</code> 个数，差一条。</span><span class='w'>p39：一堆不等式要定 n 个数，而不等式是齐次的，所以整条射线都是解。</span><b>两次都是「约束不够，解是一个集合而不是一个点」。</b><span class='k'>两次的补救都是人为钉死尺度：p10 钉基线，p41 钉范数。</span>"], "quote": "Therefore if the expert demonstrations are from the optimal policy, to identify w it is sufficient to find w* such that <b>w*^T mu(pi*) >= w*^T mu(pi), for all pi</b>", "res": {"tag": "推断", "v": "<b>这一页对你不是类比，是字面吻合，而且能算出一个具体的数。</b><br><br><b>把 <code>G = Acc − λ·Cost</code> 和 <code>R(s) = wᵀx(s)</code> 对一下</b>：<span class='k'>特征 <code>x = (Acc 的贡献, Cost 的贡献)</code>，权重 <code>w = (1, −λ)</code>，<code>n = 2</code>。</span><b>你的目标函数本来就是一个线性特征奖励函数，只是特征只有两维。</b><span class='w'>而 <code>μ(π)</code> 就是 (这个策略的期望准确率, 这个策略的期望成本)——两个你本来就在算的数。</span><br><br><b>于是 p39 那组约束在你这里可以逐条写出来。</b>设专家（AFlow 选中的那个配置）的指标是 <code>(A*, C*)</code>，日志里任一别的配置是 <code>(A, C)</code>。p39 要求：<code>A* − λC* ≥ A − λC</code>，即 <code>A* − A ≥ λ(C* − C)</code>。<b>按 <code>C</code> 和 <code>C*</code> 的大小分两种情形：</b><br><b>① 这个配置比专家贵</b>（<code>C &gt; C*</code>）：<span class='k'>得到 λ 的一个<b>下界</b> <code>λ ≥ (A − A*)/(C − C*)</code></span>。直觉：<b>专家放弃了一个更准但更贵的选项，说明它对成本的厌恶至少有这么强。</b><br><b>② 这个配置比专家便宜</b>（<code>C &lt; C*</code>）：<span class='k'>得到 λ 的一个<b>上界</b> <code>λ ≤ (A* − A)/(C* − C)</code></span>。直觉：<b>专家放弃了一个更省但更差的选项，说明它对成本的厌恶至多这么强。</b><br><br><b>把日志里所有配置的上下界取交，就得到一个区间 <code>[λ_lo, λ_hi]</code>——这就是「与你的专家行为相容的全部 λ」。</b><span class='k'>这正是 p43 说的那个「无穷多个奖励函数」，只不过在 n = 2 且尺度被 Acc 的系数钉成 1 之后，它从一个无穷维的集合塌缩成了一条线段。</span><b>一条线段是可以画出来、可以写进表格、可以当作结论报告的。</b><br><br><b>这条做法有三种用法，按价值排序：</b><br><b>① 当核对</b>：你手定的 λ 落在区间里吗？<span class='w'>落在外面说明你和 AFlow 想要的根本不是一回事，这件事必须先弄清楚。</span><br><b>② 当敏感度扫描的边界</b>：<span class='k'>不要在 [0, ∞) 上扫，在 <code>[λ_lo, λ_hi]</code> 上扫</span>——有数据依据，审稿人也更买账。<br><b>③ 当一条独立的贡献</b>：<b>报告「与示范相容的 λ 区间」本身就是一个结果</b>，<span class='w'>而且它诚实地呈现了不可辨识性，而不是假装 λ 有唯一真值。</span><br><br><span class='k'>退化情形也有意义：如果日志里所有配置都比专家便宜，你只能拿到上界，区间是 <code>(0, λ_hi]</code>。</span><b>这就是不可辨识性在你数据上的具体样子，而且它直接告诉你该补采什么——补几个比专家更贵的配置，下界就出来了。</b><span class='w'>这又回到了 p33：缺的不是数据量，是特定分布上的数据。</span>", "ref": "课件 p39 约束 · p41（‖w‖₂ ≤ 1 定尺度）· p43（歧义）· 本讲 p9 科研格 · 简报 §4e"}},
{"r": [40, 40], "t": "特征匹配", "star": 3, "one": "<b>只要特征频率对上了，值就对上了——不管真实奖励是什么。</b>", "eq": "若  ‖ μ(π) − μ(π*) ‖₁  ≤  ε\n\n则对所有 ‖w‖_∞ ≤ 1：   | wᵀμ(π) − wᵀμ(π*) |  ≤  ε", "pts": ["<span class='k'>这是这一讲最漂亮的一步</span>：它<b>绕开了「奖励函数不唯一」这个坑</b>。", "你仍然不知道真实的 <code>w</code>，<b>但你不需要知道</b>——只要访问状态的频率和专家一样，你的策略就和专家一样好。", "用 1-范数是有讲究的：<span class='k'>它要求在所有状态上都匹配</span>。", "出处：Abbeel &amp; Ng, 2004。", "<b>这一步的逻辑结构值得单独拆一遍，因为它是「绕开未知量」的一个范本。</b><span class='k'>你不知道真实的 w，这是个事实，改变不了。</span><b>但那个不等式对<span class='w'>所有</span>满足 <code>‖w‖_∞ ≤ 1</code> 的 w 都成立。</b><span class='k'>既然对所有 w 都成立，那它对那个你不知道的真 w 也成立。</span><b>于是「不知道 w」这件事就不再构成障碍了——这就是全部的技巧。</b>", "<b>用一句更一般的话概括：把对未知量的依赖，换成对未知量取值范围的一致界。</b><span class='w'>这个套路在统计和优化里到处都是</span>，<b>它的代价永远是保守性</b>——<span class='k'>你拿到的界对最坏的那个 w 成立，所以对实际那个 w 通常是松的</span>。<b>但松的界也是界，而不知道 w 时你什么都没有。</b>", "<b>两个范数不是随便配的，它们是一对，必须一起看。</b><span class='k'>特征差用 1-范数（各分量绝对值之和），权重用 ∞-范数（最大分量的绝对值）。</span><b>这是 Hölder 不等式的标准配对：<code>|wᵀv| ≤ ‖w‖_∞ · ‖v‖₁</code>。</b><span class='w'>换别的配对也能成立（比如 2-范数配 2-范数），但这一对最紧</span>——<b>而且 1-范数要求「在每一个特征上都匹配」，不允许用一个特征上的超额去补另一个特征上的亏空。</b><span class='k'>这正是你想要的语义。</span>", "<b>老师回答「这是不是解决了不可辨识」时说得非常准：没有解决，是绕过去了。</b><span class='w'>解集还是那个解集，w 还是不唯一。</span><b>但她接着补的那句才是重点：「如果你访问每个状态的频率和专家完全一样，你们的策略就是同一个。」</b><span class='k'>也就是说，特征频率这个量比奖励函数更接近「行为」本身</span>——<b>奖励是行为的一个过度参数化的描述，而特征频率不是。</b><span class='w'>绕开过度参数化的部分，直接在行为层面比对，问题就消失了。</span>", "<b>但要警惕一个很常见的误读：这个保证是关于「值」的，不是关于「策略相同」的。</b><span class='k'>特征频率匹配 ⇒ 任何线性奖励下的值都接近 ⇒ 你不比专家差</span>。<b>它<span class='w'>不</span>保证你的策略和专家的策略是同一个</b>——<span class='w'>p43 会明说：能匹配特征频率的随机策略有无穷多个。</span><b>这个区别在安全攸关的场合很要紧：值一样不等于行为一样，两个值相同的策略可以在个别状态上做出完全不同的事。</b>"], "say": "有同学问这是不是解决了不可辨识问题。老师答得很清楚：<b>没有解决，是绕过去了</b>。「你仍然不知道那个 w 准不准，但也许你根本不需要它——<span class='k'>如果你访问每个状态的频率和专家完全一样，你们的策略就是同一个</span>。」", "quote": "For a policy pi to be guaranteed to perform as well as the expert policy, it suffices that we have a policy such that its discounted summed feature expectations match the expert policy &nbsp;|&nbsp; <b>if ||mu(pi) - mu(pi*)||_1 <= epsilon then for all w with ||w||_inf <= 1: |w^T mu(pi) - w^T mu(pi*)| <= epsilon</b> &nbsp;·&nbsp; (Abbeel and Ng, 2004)"},
{"r": [41, 41], "t": "学徒学习算法", "star": 2, "one": "反复：<b>找一个最能凸显专家优势的 w，再对这个 w 求最优策略</b>。", "eq": "假设 R(s) = wᵀx(s)，初始化 π₀\n对 i = 1, 2, …\n  ① 找一个奖励函数，让老师最大幅度地压过此前所有策略：\n       max_w  max γ\n       s.t.  wᵀμ(π*) ≥ wᵀμ(π) + γ,  ∀π ∈ {π₀,…,π_{i-1}}\n             ‖w‖₂ ≤ 1\n  ② 对当前 w 求最优控制策略 π_i\n  ③ 若 γ ≤ ε/2 则退出", "pts": ["<code>‖w‖₂ ≤ 1</code> 是为了<b>把奖励函数约束成有界的</b>，否则误差会爆。", "<b>这个算法是一场两人博弈，看成博弈就全通了。</b><span class='k'>你扮演「挑刺的人」：找一个奖励函数 w，使专家赢得尽可能明显（max γ）。</span><b>然后对手（规划器）扮演「钻空子的人」：对这个 w 求最优策略，试图找出一个在这个 w 下也能打平专家的策略。</b><span class='w'>找得到，就说明这个 w 区分不了，你得换一个更刁钻的 w；找不到，就说明你已经逼近了。</span><b>退出条件 <code>γ ≤ ε/2</code> 的意思正是「我再也找不出能明显区分专家的奖励了」。</b>", "<b>每一轮都在做两件代价完全不同的事，这一点决定了它的实用性。</b><span class='k'>① 解一个二次约束的线性规划求 w——便宜，而且约束数量等于已有策略数。</span><span class='w'>② 对当前 w 求最优控制策略——这是一次完整的 RL/规划，很贵。</span><b>所以这个算法的瓶颈在第②步，而且每一轮都要做一次。</b><span class='k'>这也解释了为什么它只在小问题上跑得动，以及为什么 p26 的输入清单里必须给转移模型。</span>", "<b><code>‖w‖₂ ≤ 1</code> 这条约束不是技术细节，它是在堵 p39 的那个平凡解。</b><span class='w'>没有它，你总可以把 w 整体放大十倍，γ 也跟着放大十倍，目标函数无界。</span><b>钉死尺度之后，γ 才有意义——它变成了「在单位长度的奖励向量下，专家能领先多少」。</b><span class='k'>注意这里用的是 2-范数，而 p40 用的是 ∞-范数</span>——<b>两处的角色不同：p41 是为了让优化问题有界，p40 是为了配 1-范数拿到紧的界。</b>", "<b>老师那句「这个具体算法现在基本没人用了」请当真，但也请注意她紧接着说的话。</b><span class='k'>要带走的是「特征频率匹配上了就等于策略一样好」这个洞见，不是这个算法。</span><b>它被淘汰的原因很具体</b>：<span class='w'>每轮要完整求解一次 MDP，对大问题不可行；而且它要求你手工设计特征，而深度学习时代大家宁愿让网络自己学特征。</span><b>但那个洞见活了下来，GAIL 本质上就是它的深度版本</b>——<span class='k'>判别器干的事，正是「检查两个分布的特征对上了没有」。</span>"], "say": "老师直说：<b>这个具体算法现在基本没人用了</b>，大家改用深度学习的做法。「要从这里带走的，是<span class='k'>特征频率匹配上了就等于策略一样</span>这个洞见。」", "quote": "Initialize policy pi_0. For i = 1, 2 ... Find a reward function such that the teacher maximally outperforms all previous controllers: <b>arg max_w max gamma s.t. w^T mu(pi*) >= w^T mu(pi) + gamma</b>, for all pi in {pi_0, ..., pi_{i-1}}, <b>s.t. ||w||_2 <= 1</b> &nbsp;·&nbsp; Find optimal control policy pi_i for the current w &nbsp;·&nbsp; Exit if gamma <= epsilon/2", "tbl": {"head": ["这一轮干什么", "代价", "在防什么"], "rows": [["<b>① 求 w</b>：让专家最大幅度压过已有策略", "<span class='k'>一个带二次约束的 LP，便宜</span>", "找出当前最能区分专家的那个奖励"], ["<b>② 求 π_i</b>：对这个 w 求最优策略", "<span class='w'>一次完整的规划，很贵</span>", "生成一个新的「对手」，即一条新约束"], ["<b>③ 判退出</b>：<code>γ ≤ ε/2</code>", "几乎为零", "<b>再也找不出能明显区分专家的奖励了</b>"], ["<code>‖w‖₂ ≤ 1</code>", "—", "<span class='w'>堵住 w 任意放大导致目标无界</span>"]]}},
{"r": [42, 43], "t": "两个仍然没解决的麻烦", "star": 3, "one": "专家不最优时会出怪事；而且<b>歧义性依然在</b>。", "pts": ["<b>专家次优时</b>：算出来的是一堆策略的混合，专家落在它们的凸包里。实践中就<span class='w'>挑其中最好的一个</span>，用对应的奖励函数。", "<b>歧义性</b>：能解释同一个最优策略的奖励函数<span class='k'>有无穷多个</span>；能匹配特征频率的随机策略<span class='k'>也有无穷多个</span>。<b>该挑哪个？</b>", "<b>先说专家次优那条，因为课件那句话里的「凸包」是理解它的关键。</b><span class='k'>算法的每一轮都生成一个策略 <code>π_i</code>，最后交出来的是这些策略的一个混合。</span><b>如果专家真的最优，这个混合会收敛到专家附近；如果专家次优，专家落在这些策略张成的凸包<span class='w'>内部</span>——也就是说，它被一堆「有的比它好、有的比它差」的策略夹在中间。</b><span class='k'>此时混合策略的期望特征频率等于专家，但它本身可能是一堆互不相干的行为的随机切换。</span>", "<b>为什么「混合」在实践中往往不可接受，值得说清楚：混合策略不是「折中的行为」，是「随机挑一种行为」。</b><span class='w'>开车的例子最直观——50% 概率走左边那条路、50% 概率走右边那条路，期望指标可能很漂亮，但每一次实际驾驶都是两个极端之一。</span><b>更糟的是，如果混合发生在每一步而不是每一回合，你会得到一个左右横跳的策略。</b><span class='k'>所以课件给的补救很务实：挑其中最好的那一个，用它对应的奖励函数</span>——<b>放弃理论上的保证，换一个能用的确定性策略。</b>", "<b>现在是本讲的第二次不可辨识，而且课件一口气给了两种。</b><br><b>① 奖励不唯一</b>：<span class='k'>能解释同一个最优策略的奖励函数有无穷多个</span>（p35 已经说过，这里是正式记账）。<br><b>② 策略不唯一</b>：<span class='k'>能匹配同一组特征频率的随机策略有无穷多个</span>。<br><span class='w'>注意第②条是对 p40 那个漂亮绕法的直接回敬</span>——<b>p40 说「匹配特征就够了」，p43 说「匹配特征的东西也不唯一」。</b><span class='k'>你绕开了奖励的不唯一，代价是继承了策略的不唯一。</span>", "<b>但这两种不唯一的严重程度不一样，这一点课件没分，你得自己分。</b><span class='k'>奖励不唯一是<b>致命的</b>，如果你的目标是「搞清楚专家想要什么」</span>——因为那时奖励函数就是你的研究结论（接 p24 的人类目标推断）。<span class='w'>策略不唯一是<b>可以忍的</b>，如果你的目标只是「表现不比专家差」</span>——因为 p40 的界对所有这些策略一视同仁地成立。<b>所以「这个歧义要不要紧」取决于你要的是 R 还是 π，而这正是 p26 分出三条路的理由。</b>", "<b>课件用一个问句结束这一页：<em>Which one should be chosen?</em>——这是在交棒给下一页。</b><span class='k'>注意这个问句的形式已经承认了一件事：解集不会变小，你只能在里面挑。</span><b>而挑法必须来自你自己的额外原则，不可能来自数据</b>——<span class='w'>数据已经被用尽了，它只能把解集缩到这么小。</span><b>这是本讲第三次出现同一个结构（p10 挑基线、p41 挑尺度、这里挑解）。</b>"], "quote": "If expert policy is suboptimal then the resulting policy is a mixture of somewhat arbitrary policies which have expert in the convex hull &nbsp;|&nbsp; <b>There is an infinite number of reward functions with the same optimal policy</b> &nbsp;·&nbsp; <b>There are infinitely many stochastic policies that can match feature counts</b> &nbsp;·&nbsp; Which one should be chosen?", "res": {"tag": "推断", "v": "<b>这一页是 p9 那条科研格欠你的那个答案：λ 的不可辨识，到底是个多大的麻烦。</b><br><br><b>按上面刚分出来的两档判一下</b>：<span class='k'>你要的是策略（选哪套配置），不是奖励本身</span>——<b>所以严格说你落在「可以忍」那一档。</b><span class='w'>但有个前提：p40 的保证是「不比专家差」，而你的专家是 AFlow，不是最优。</span><b>「不比 AFlow 差」是个比你想要的弱得多的结论。</b><span class='k'>所以你不能只靠特征匹配交差，仍然需要 §4d 那张穷举 oracle 表当基准。</span><br><br><b>而「专家次优 ⇒ 结果是混合策略」这条，对你有一个很具体的提醒。</b><span class='w'>如果你真去做 p41 那套，拿到的可能是「60% 用配置 A、40% 用配置 B」。</span><b>在工作流选择这个场景里，随机混合通常不可接受</b>——<span class='k'>用户要的是一个确定的流水线配置，不是每次调用随机换一套</span>。<b>课件给的补救正好可用：挑混合里最好的那一个确定性策略，并报告这是一次有意的退让。</b><br><br><b>最后一条，是这一页最该写进 limitation 的：你的 λ 区间（见 p39 科研格）之所以是区间而不是点，原因就在这一页，而不是因为你数据不够。</b><span class='k'>再多日志也不会把区间缩成一个点</span>，<span class='w'>因为行为只能定出奖励的序，定不出尺度（p35）。</span><b>这件事必须主动说，否则读者会以为是你采样不足。</b>", "ref": "课件 p42–p43 原文 · 本讲 p9 p35 p39 p40 科研格 · 简报 §4d"}},
{"r": [44, 45], "t": "两条主流出路", "star": 3, "one": "最大熵逆 RL；生成对抗模仿学习（GAIL）。", "pts": ["<b>最大熵逆 RL</b>（Ziebart et al., AAAI 2008）：在「匹配特征频率」这个约束下，<span class='k'>挑熵最大的那个分布</span>——也就是做出最少的额外承诺。<b>可以理解成「尽量欠拟合」。</b>", "<b>GAIL</b>（Ho &amp; Ermon, NeurIPS 2016）：用一个<span class='k'>判别器</span>去分辨「专家轨迹」和「agent 轨迹」；<b>分辨得出来，就说明还没匹配上</b>。", "GAIL 的动机很实际：状态维度极高时（比如图像），<code>μ</code> 这个分布<span class='w'>根本写不下来</span>，判别器绕开了这个问题。", "<b>最大熵那条线的逻辑，接着 p43 的问句往下读就很顺：既然要在解集里挑一个，那就挑「承诺最少」的那个。</b><span class='k'>熵最大 = 在满足约束的前提下尽可能不确定 = 不对数据没说的事做任何额外假设。</span><b>这是统计里一条老原则（最大熵原理），不是为逆 RL 发明的。</b><span class='w'>它的吸引力在于：这个挑法有唯一解，而且这个解可以写成闭式</span>——<b>轨迹的概率正比于 <code>exp(回报)</code>。</b><span class='k'>于是「哪个解」这个问题被一劳永逸地回答了。</span>", "<b>「尽量欠拟合」这个说法值得保留，但要说准它欠拟合的是什么。</b><span class='w'>它不是在欠拟合数据——特征频率的约束是硬的，必须精确匹配。</span><span class='k'>它欠拟合的是「数据没约束到的那些自由度」</span>——<b>在那些方向上，它拒绝做出任何倾向。</b><span class='w'>这恰恰是 p43 那个问句最有原则的答案</span>：<b>既然数据说不出，那就别替数据说。</b>", "<b>最大熵还顺带解决了一件 p42 的麻烦，这一点值得单独指出来。</b><span class='k'>它天然给出的是一个随机策略，而且是一个「软」的随机策略</span>——<b>次优动作的概率不是零，只是指数地小。</b><span class='w'>这对次优专家反而更合适</span>：<b>专家偶尔的失误不再需要被解释成「这个动作其实最优」，而可以被解释成「专家以小概率选了次优动作」。</b><span class='k'>这比 p39 那个硬不等式宽容得多，也现实得多。</span>", "<b>GAIL 换了一条完全不同的路，而它的动机是纯工程的：<code>μ</code> 写不下来。</b><span class='w'>当状态是图像时，「特征的折扣访问频率」是一个高维连续分布</span>——<b>你既估不准它，也没法把「两个分布的 1-范数距离」写成一个能优化的目标。</b><span class='k'>GAIL 的办法是：不显式地写出分布，而是训一个判别器去区分「这条轨迹是专家的还是 agent 的」。</span><b>判别器分不出来，就说明两个分布对上了。</b>", "<b>这个替换的意义比它看起来大：它把「分布匹配」从一个估计问题变成了一个分类问题。</b><span class='k'>估计高维分布很难，训一个二分类器很容易</span>——<b>而分类器的损失恰好可以当成分布距离的一个代理。</b><span class='w'>这正是 GAN 的思想，GAIL 的名字里那个 adversarial 就是这么来的。</span><b>代价也和 GAN 一样：训练不稳定，而且「判别器分不出来」只是分布接近的必要条件之一。</b>", "<b>老师回答「我就是想知道奖励函数怎么办」时给的那条贝叶斯出路，值得记下来，因为它和前面所有做法都不同。</b><span class='k'>频率派的框架里，R ≡ 0 是个合法解，你没有任何理由排除它。</span><b>但如果你给奖励函数一个先验——比如「奖励应该是稀疏的」或者「奖励应该和某些语义特征相关」——再用数据做后验更新，R ≡ 0 就会因为先验概率低而被压下去。</b><span class='w'>这不是在「解决」不可辨识，是在用先验把它变得可以忍受</span>——<b>而且它诚实地把那个额外假设摆在明处，这正是 p10、p41、p44 一路下来的同一个做法。</b>"], "say": "有同学追问：那「我就是想知道奖励函数」这件事到底还能不能做？老师答：频率派的路子确实很难；<b>换贝叶斯</b>——给奖励函数一个先验、拿数据做后验更新——就能把「奖励处处为 0」这种解排除掉。研究动物或人的偏好时常这么做。", "quote": "Many different approaches. Two of the key papers are: <b>Maximum Entropy Inverse Reinforcement Learning (Ziebart et al. AAAI 2008)</b> &nbsp;·&nbsp; <b>Generative adversarial imitation learning (Ho and Ermon, NeurIPS 2016)</b>", "tbl": {"head": ["", "最大熵逆 RL", "GAIL"], "rows": [["出处", "Ziebart et al., AAAI 2008", "Ho &amp; Ermon, NeurIPS 2016"], ["解决的问题", "<b>p43 的「该挑哪个」</b>", "<b><code>μ</code> 在高维下写不下来</b>"], ["怎么做", "<span class='k'>在匹配特征频率的解里挑熵最大的</span>", "<span class='k'>用判别器代替显式的分布距离</span>"], ["输出", "随机策略；轨迹概率 ∝ <code>exp(回报)</code>", "一个策略（不显式给 R）"], ["弱点", "仍然依赖特征设计", "<span class='w'>对抗训练不稳定</span>"]]}},
{"r": [46, 47], "t": "小结与下一讲", "star": 2, "one": "模仿学习能大幅减少数据需求，<b>但剩下的难题都在真实场景里</b>。", "pts": ["<b>最大的现实困难</b>：医疗、教育、推荐这些领域<span class='w'>根本没人知道最优策略是什么</span>——你做这件事本来就是因为觉得能比现有数据做得更好。", "还有一层拧巴：<b>用模仿学习是为了安全</b>，但如果现有的安全做法都不够好，你终究还是要面对「怎么安全地探索」。", "一个活跃方向：把逆 RL / 从演示学习 <span class='k'>和在线 RL 结合起来</span>。", "下一讲：策略搜索。", "<b>把这一讲的四节重新串一遍，它是一条「每一步都在为上一步的毛病打补丁」的链子。</b><br><b>行为克隆</b>最简单，<span class='w'>但 <code>εT²</code></span>；<br><b>DAGGER</b> 修了分布问题，<span class='w'>但要专家一直在线</span>；<br><b>逆 RL</b> 不学策略改学奖励，绕开了分布问题，<span class='w'>但奖励不唯一</span>；<br><b>特征匹配</b>绕开了奖励不唯一，<span class='w'>但继承了策略不唯一，而且要转移模型</span>；<br><b>最大熵</b>正面处理了「该挑哪个」。<br><span class='k'>没有一个方法是干净的，每一个都是在某处让步换来别处的好。</span>", "<b>老师那条「毕业去工业界，模仿学习往往非常好用」的建议，背后的理由就是 p25 那条判据。</b><span class='k'>工业场景里几乎总有历史操作日志，而几乎总没有人能写出奖励函数。</span><b>这恰好是模仿学习的生态位。</b><span class='w'>而她提到的「YouTube 上的演示」则点出了另一件事</span>：<b>演示数据的边际成本正在趋近于零，但质量完全不可控</b>——<span class='k'>所以它适合当引子（把学习引上路），不适合当上限（最终目标）</span>。", "<b>那条「最大的现实困难」值得反复读，因为它推翻了这一讲的核心前提。</b><span class='w'>医疗、教育、推荐这些领域根本没人知道最优策略是什么</span>——<b>而「专家是最优的」正是 p35 之后所有推导的支点。</b><span class='k'>支点没了，p39 那组约束就不成立，p40 那个「不比专家差」的保证也变得没有意义</span>（<b>不比一个平庸的专家差，不是你想要的</b>）。<b>更尖锐的是老师的第二句：你做这件事，本来就是因为你觉得能比现有数据做得更好。</b><span class='w'>也就是说，你的动机和你的假设是直接冲突的。</span>", "<b>那层「拧巴」也值得记：用模仿学习是为了安全，但如果现有的安全做法都不够好，你终究还是要面对怎么安全地探索。</b><span class='k'>模仿学习买到的是「起点不烂」，它买不到「能走到多好」。</span><b>要超过演示，就必须在演示没覆盖的地方试</b>——<span class='w'>而那正是你当初选模仿学习想避开的事</span>。<b>这就是为什么课件把「逆 RL / 从演示学习 + 在线 RL 的结合」列为活跃方向：它是这个死结唯一的出口。</b>", "<b>最后留一句话给下一讲：策略搜索走的是 p18 四条出路里的第二条。</b><span class='k'>模仿学习的额外知识来自「专家演示」，策略搜索的额外知识来自「你选的策略类」。</span><b>后者不需要任何人来演示，但需要你对问题结构有判断</b>——<span class='w'>你得知道「好策略大概长什么样」，才能选对策略类。</span><b>两条路可以叠加，而且在实践里经常叠加：用演示初始化一个策略类里的参数，再用策略梯度往上推。</b>"], "say": "老师给了条很实际的建议：<b>如果你毕业去工业界，模仿学习往往非常好用</b>——拿到演示通常比设计奖励容易，而且能把学习「引上路」。她还提到一个有意思的来源：<b>YouTube 上的演示</b>——免费，但质量未知，所以适合当引子、不适合当上限。", "quote": "<b>Imitation learning can greatly reduce the amount of data need to learn a good policy</b> &nbsp;·&nbsp; <b>Challenges remain and one exciting area is combining inverse RL / learning from demonstration and online reinforcement learning</b> &nbsp;|&nbsp; Last time: Deep reinforcement learning &nbsp;·&nbsp; This time: Imitation Learning &nbsp;·&nbsp; Next time: Policy Search", "res": {"tag": "推断", "v": "<b>老师这一页亲口说出的那条困难，就是你课题的处境，必须正面写进 limitation。</b><br><br><span class='k'>「医疗、教育、推荐这些领域根本没人知道最优策略」——把工作流配置加进这个名单，它完全符合。</span><b>AFlow 搜出来的配置不是最优的，它只是某个搜索过程在某个预算下的产物；而且它优化的目标未必是你的 <code>G = Acc − λ·Cost</code>。</b><span class='w'>所以你不能说「我们模仿专家」，只能说「我们以现有搜索结果为参照」</span>——<b>这两句话的强度差很远，而审稿人会注意到差别。</b><br><br><b>这给你的三条具体动作：</b><br><b>① </b><span class='k'>不要把 p40 那种「不比专家差」当成卖点</span>，因为你的专家不是最优的。<b>该当基准的是 §4d 的穷举 oracle 表</b>，那是真上界。<br><b>② </b><b>把 p39 科研格那个 λ 区间当成「AFlow 隐含偏好的测量」，而不是「真实 λ 的估计」</b>——<span class='w'>措辞上这一步必须小心</span>。<br><b>③ </b><span class='k'>课件说的那个活跃方向「从演示学习 + 在线 RL 结合」，正是你 §4c 随机化决策节点那条路</span>——<b>用日志起步，再主动补采一部分数据。</b><span class='w'>这和 p33 科研格给的循环是同一件事，这里是它的文献定位。</span><br><br><b>最后，老师那层「拧巴」在你这里反而轻得多，这是值得说的好消息。</b><span class='k'>她担心的是「为了安全才模仿，可要变好就必须冒险探索」；而你的探索代价是 API 调用费，不是人命或事故。</span><b>于是对你来说，「安全地探索」基本退化成「预算地探索」</b>——<span class='w'>这是一个你该主动指出来的领域差异，它让一批在机器人领域很重的顾虑在你这里变轻。</span>", "ref": "课件 p46 原文 · 本讲 p33 p39 p40 科研格 · 简报 §4c §4d"}}

var TH = {"title": "L07 接上课题的哪一段：你的节点 h 就是课件里的时间步 t", "arc": "<b>这一讲只有一句原文是你必须背下来的</b>，在 p30：<em>Supervised learning assumes iid. (s, a) pairs and <b>ignores temporal structure</b></em>。<span class='k'>它解释了为什么监督学习式的保证一搬到序贯决策上就失效</span>，而它的后果被课件量化成了一个非常具体的形状：<b><code>εT</code> 变成 <code>εT²</code></b>。<br><br><b>这个机制在你的问题里是字面成立的，不是类比。</b>课件的 t 是时间步，<span class='k'>你的 t 是节点编号 h</span>；课件的「走错一步」是选错动作，<span class='k'>你的是在节点 h 换了一档保真度</span>。<b>后果完全同构：节点 h 一换档，它交给 h+1 的中间产物就变了（更短、更糙、格式也可能变），于是 h+1 面对的输入分布不再是日志里那个。</b><span class='w'>你在原日志上拟合的一切——成本模型、准确率模型、FQE 的 Q̂——在那一刻同时离开了各自的训练分布。</span><br><br><b>这给简报 §8 那个开放问题一个干净的表述。</b>§8 说的是：conformal risk control 要求校准点与测试点可交换，而节点 h 的决策破坏了后续节点的可交换性。<span class='k'>p30 那句原文正是同一件事的课堂版本——iid 之于监督学习，等于可交换性之于 conformal</span>。<b>两者都是「样本之间没有结构」的假设，都被「决策改变后续分布」打破。</b><span class='w'>所以这不是 conformal 方法特有的毛病，而是把序贯决策交给监督学习式保证时的通病，在模仿学习里的经典表现就是 <code>εT²</code>（Ross et al. 2011）。这句话可以原样进 related work。</span><br><br><b>然后是这一讲给你的两条好消息，两条都值得主动写出来。</b><br><b>① 你的 T 很小。</b><span class='k'>H ≈ 5–10，放大倍数是 5 到 10 倍</span>，而机器人那边 T 上千、放大上千倍。<b>短流水线天然抗分布漂移，这是结构性优势。</b><br><b>② 杀死 DAGGER 的那条理由，在你这里不成立。</b><span class='w'>老师判它工程上不现实，唯一理由是专家必须一直在回路里</span>；<b>而你的「专家标签」是把配置真跑一遍，那是 API 调用，不是人类标注——可批量、可并行、花的是钱不是人力。</b><span class='k'>于是这条在机器人领域被现实判死刑的路线，在你这里是可行的。</span><br><br><b>最后，这一讲还顺手给了 λ 一个能算出来的东西。</b><code>G = Acc − λ·Cost</code> 字面上就是 p36 的 <code>R(s) = wᵀx(s)</code>，<span class='k'>特征两维、<code>w = (1, −λ)</code></span>。<b>把 p39 的约束逐条写出来，就能从日志里夹出一个 λ 的可辨识区间</b>（<b>比专家贵的配置给下界，比专家便宜的给上界</b>）。<span class='w'>p43 的「无穷多个奖励函数」在 n=2 且尺度钉死之后，塌缩成一条线段</span>——<b>而线段是可以画出来、可以当结论报告的。</b>", "pitfalls": [{"v": "<b>以为「多收集一些日志」能治分布漂移。</b> p33 整页都在说这件事：要的不是更多数据，是<span class='k'>你自己策略走出来的那条路上的</span>数据。<span class='w'>再多原日志也采样自原配置的分布</span>，<b>而你的问题恰恰出在原配置没覆盖的地方。</b><span class='k'>加数据、加参数、调正则针对的都是「拟合得不够好」；分布不匹配是「拟合得很好，但拟合的是别的东西」。两种病的曲线能长得一模一样。</span>", "tag": "已核", "ref": "课件 p33 原文 along the path taken by the policy"}, {"v": "<b>把 DAGGER 原样写进方法节。</b> 你做的不是 DAGGER。<span class='k'>DAGGER 的专家给的是「该选哪个动作」，而你重跑一个配置只拿到「结果如何」</span>——<b>前者是动作标签，后者是回报。</b><span class='w'>该引的是它的诊断（训练分布必须覆盖你将要走的分布），不是它的算法。</span><b>严格说你做的是「按当前策略做定向的 on-policy 采样」，这个区分不说清会被审稿人抓住。</b>", "tag": "推断", "ref": "课件 p33 · 本讲 p33 科研格"}, {"v": "<b>拿「不比专家差」当卖点。</b> p40 的保证是相对专家的，<span class='w'>而你的专家是 AFlow，不是最优策略</span>。<b>「不比 AFlow 差」比你想要的结论弱得多。</b><span class='k'>p46 老师亲口说的那条困难——医疗、教育、推荐根本没人知道最优策略——把工作流配置加进这个名单，完全符合。</span><b>真正该当基准的是 §4d 的穷举 oracle 表。</b>", "tag": "已核", "ref": "课件 p40 p46 原文 · 简报 §4d"}, {"v": "<b>把 λ 区间的宽度解释成「数据不够」。</b> 区间之所以是区间而不是点，原因在 p35：<span class='k'>行为只能定出奖励的序，定不出尺度</span>。<span class='w'>再多日志也不会把它缩成一个点。</span><b>这件事必须主动说在 limitation 里，否则读者会以为是你采样不足。</b>", "tag": "推断", "ref": "课件 p35 p43 · 本讲 p39 p43 科研格"}, {"v": "<b>直接采纳 p41 算出来的混合策略。</b> 专家次优时，结果是一堆策略的混合（p42）。<span class='w'>而混合策略不是「折中的行为」，是「随机挑一种行为」</span>——<b>在工作流选择里，用户要的是一个确定的配置，不是每次调用随机换一套。</b><span class='k'>课件给的补救正好可用：挑混合里最好的那一个确定性策略，并说明这是一次有意的退让。</span>", "tag": "已核", "ref": "课件 p42 原文（convex hull；pick the best one of this set）"}, {"v": "<b>把成本那一半也套进这一讲的框架。</b> 逆 RL 处理的是「偏好未知」，<span class='k'>而你的成本给定保真度与输入长度近乎确定，偏好问题只出在 λ 上</span>。<b>需要辨识的只有一个标量，不是一个函数。</b><span class='w'>这正是 n=2 让整件事可解的原因，别把它复杂化回去。</span>", "tag": "推断", "ref": "本讲 p36 p39 科研格 · L05 p27 · 简报 §4e"}], "ammo": [{"q": "你们的日志来自固定配置，换了策略之后那些模型还准吗？", "a": "<b>不准，而且我们知道它为什么不准。</b>节点 h 的决策会改变 h+1 的输入分布，这正是模仿学习里 <code>εT²</code> 的那个机制（CS234 L07 p30：<em>supervised learning assumes iid (s,a) pairs and ignores temporal structure</em>）。<span class='k'>我们的应对是按当前策略做定向补采，而不是堆更多原分布的日志</span>——这是 DAGGER 给出的诊断。<b>而我们的流水线只有 5–10 个节点，所以放大倍数是个位数，不是机器人那种上千倍。</b>", "tag": "推断", "ref": "课件 p30 p33 · Ross et al. 2011 · 简报 §4c"}, {"q": "DAGGER 那套不是因为要人标注才没人用吗，你们凭什么能用？", "a": "<b>因为我们的专家不是人。</b>在机器人里专家标签要人逐帧给，所以不可行；<span class='k'>我们要的「标签」是把一个配置真跑一遍拿到 Acc 和 Cost，那是一次 API 调用，可批量可并行</span>。<b>成本是钱和时间，不是人力。</b><span class='w'>我们借的是 DAGGER 的诊断而不是它的算法</span>——严格说这是按当前策略做的定向 on-policy 采样，论文里我们这样写。", "tag": "推断", "ref": "课件 p33 老师问答 · 本讲 p33 科研格"}, {"q": "λ 是怎么定的？不就是拍脑袋吗？", "a": "<b>我们报告的是一个区间，不是一个拍出来的数。</b><code>G = Acc − λ·Cost</code> 本身就是线性特征奖励 <code>R = wᵀx</code> 的 <code>n = 2</code> 情形，<code>w = (1, −λ)</code>。<span class='k'>把逆 RL 的最优性约束 <code>wᵀμ(π*) ≥ wᵀμ(π)</code> 逐条写出来，比参照配置贵的给 λ 下界、便宜的给上界，交起来就是与示范相容的 λ 区间</span>。<b>我们的敏感度扫描就在这个区间上做，而不是在 [0, ∞) 上做。</b><span class='w'>区间不会随数据增多收缩成点——行为只能定序不能定尺度，这一条我们写在 limitation 里。</span>", "tag": "推断", "ref": "课件 p36 p39 p35 · 本讲 p39 科研格"}, {"q": "既然有专家演示，为什么不直接做行为克隆当基线？", "a": "<b>可以做，而且我们做了，但它只能当基线不能当方法。</b><span class='k'>行为克隆的上限是专家，而我们的专家是一个搜索过程的产物，不是最优策略</span>。<b>复刻它等于把它的偏好固化下来。</b><span class='w'>我们要的是能超过它，而这需要先把它隐含的目标反推出来，再重新求最优</span>——也就是课件 p26 的第三条路，老师在课上明确说过这条路可以超过专家。", "tag": "已核", "ref": "课件 p26 问答 · p28 · 简报 §4d"}], "papers": [{"t": "Ross, Gordon &amp; Bagnell — A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning (DAGGER)", "id": "AISTATS 2011", "why": "p30 的 <code>εT²</code> 和 p33 的 DAGGER 都出自这里。<b>你需要它的是那个「训练分布必须覆盖你将要走的分布」的论证</b>，<span class='k'>而不是它的算法</span>——你的标签形态和它不同（回报 vs 动作标签）。引它来给「节点 h 改变 h+1 输入分布」一个有名字的先例。"}, {"t": "Abbeel &amp; Ng — Apprenticeship Learning via Inverse Reinforcement Learning", "id": "ICML 2004", "why": "p36–p41 整节的出处：<code>V^π = wᵀμ(π)</code> 的推导、特征匹配的界、以及 p41 那个算法。<b>你真正要用的是 p39 那组线性约束</b>——<span class='k'>它在 n=2 时就是你那个 λ 区间的推导依据</span>。"}, {"t": "Ng &amp; Russell — Algorithms for Inverse Reinforcement Learning", "id": "ICML 2000", "why": "奖励不可辨识（R ≡ 0、加常数）的原始出处，也是 max-margin 这个补救的出处。<b>你写 limitation 解释「为什么 λ 只能是区间」时，该引的是这一篇</b>，<span class='w'>而不是只引课件</span>。"}, {"t": "Ziebart et al. — Maximum Entropy Inverse Reinforcement Learning", "id": "AAAI 2008", "why": "p44 点名的那条线，正面处理 p43 的「该挑哪个」。<b>对你特别相关的是它对次优专家的宽容</b>——<span class='k'>专家偶尔的失误可以被解释成「以小概率选了次优动作」，而不必被解释成「这个动作其实最优」</span>。AFlow 的配置正是这种「大体上合理、个别地方随意」的专家。"}, {"t": "Ho &amp; Ermon — Generative Adversarial Imitation Learning", "id": "NeurIPS 2016", "why": "p44 的另一篇。它的动机对你不成立（你的特征只有两维，<code>μ</code> 写得下来），<b>但它确立的那个视角有用：模仿 = 两个分布对齐</b>。<span class='k'>若你以后要把特征从 (Acc, Cost) 扩到更高维，这是该读的起点。</span>"}]};

(function(){
  var PDF="../slides/lecture7.pdf", MAX=47;

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';

        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。

    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
