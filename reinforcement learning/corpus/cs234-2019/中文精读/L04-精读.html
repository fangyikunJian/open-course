{"r": [39, 39], "t": "检验题：Q-learning 走一步", "star": 2, "one": "同一条轨迹，Q-learning 只动一格。", "eq": "ε = 1/k，k=1，α = 0.5\n第一个 tuple：(s3, a1, 0, s2)\n\nQ(s3,a1) ← 0 + 0.5·( 0 + γ·max_a Q(s2,a) − 0 ) = 0\n\nk=2；新策略在 s3 上是 a1 与 a2 平局", "pts": ["奖励是 0，<code>Q(s2,·)</code> 也还是 0，所以这一步<b>什么都没学到</b>。", "<span class='k'>这正是 TD 类方法的老毛病</span>：信息得一格一格往回传，不像 MC 一次把整条路都更新掉。", "<b>这类题的做法有一个固定套路，记住它就不会算错。</b><span class='k'>① 先把四元组列出来：<code>(s, a, r, s′)</code>；② 算出 TD 目标；③ 代进更新式</span>。<b>而 SARSA 和 Q-learning 的差别只在第②步</b>：<span class='w'>SARSA 的目标是 <code>r + γQ(s′, a′)</code>，要用到<b>实际采出的</b> <code>a′</code></span>；<span class='w'>Q-learning 的目标是 <code>r + γ max_{a′} Q(s′, a′)</code>，要把 <code>s′</code> 那一行<b>扫一遍取最大</b></span>。", "<b>做这类题时最常见的两个错误，提前堵掉。</b><span class='w'>错误一：把 <code>max</code> 取在 <code>s</code> 那一行而不是 <code>s′</code> 那一行</span>——<b>目标里的 <code>max</code> 永远是对<b>下一个</b>状态取的。</b><span class='w'>错误二：忘了那是个增量更新，直接把目标当成新的 Q</span>——<b>新的 Q 是「旧值 + α × (目标 − 旧值)」，α 不等于 1 时两者差很多。</b><span class='k'>只有 α = 1 时，新 Q 才等于目标。</span>"], "quote": "Check Your Understanding: Q-learning 走一步 &nbsp;·&nbsp; （用同一条转移，对比 SARSA 与 Q-learning 的更新目标）"},
{"r": [40, 40], "t": "两种收敛，条件不一样", "star": 3, "one": "「Q 收敛到 <code>Q*</code>」和「策略收敛到 <code>π*</code>」要的东西不同。", "pts": ["<b>要 Q → Q*</b>：所有 <code>(s,a)</code> 访问无穷多次 + Robbins–Munro 步长。<span class='k'>不需要 GLIE</span>——ε 一直很大也行。", "<b>要 π → π*</b>：在上面之外<b>还得 GLIE</b>。", "<b>两种收敛的条件差一条，而这一条差别正好反映了 on-policy 和 off-policy 的本质区别。</b><span class='k'>SARSA 要 GLIE 的<b>两条</b>（无限探索 + 渐近贪婪）加步长条件</span>；<span class='k'>Q-learning 只要<b>无限探索</b>加步长条件</span>。<b>少掉的正是「渐近贪婪」那一条。</b>", "<b>为什么 Q-learning 不需要它，理由很干净：<span class='w'>它的更新目标里根本没有行为策略</span>。</b><b>目标是 <code>r + γ max_{a′} Q(s′,a′)</code>——这个式子里只有 Q，没有 π。</b><span class='k'>所以无论你用什么策略去采数据，只要每个 <code>(s,a)</code> 都被采够，Q 就会收敛到 <code>Q*</code></span>。<span class='w'>而 SARSA 的目标里有 <code>Q(s′, a′)</code>，<code>a′</code> 来自行为策略</span>——<b>于是它学到的东西跟着行为策略走，要让它学到最优的，行为策略就必须趋于最优。</b>", "<b>这个区别要配上那条最容易被误读的结论一起记：<span class='k'>Q 收敛到 <code>Q*</code>，不等于你跟随的策略是最优的</span>。</b><b>Q-learning 收敛时，你的行为策略仍然是 ε-贪婪的，仍然以 ε 的概率乱走。</b><span class='w'>要得到最优<b>策略</b>，你得在学完之后把 ε 设成 0，用纯贪心去执行</span>。<b>学习阶段和部署阶段是分开的。</b><span class='k'>这正是「离线学习 + 在线部署」这个模式的理论依据。</span>", "<b>最后把这一讲的收敛结论和 L05 p38 接上，这是整条线最重要的一个衔接。</b><span class='k'>这一讲证明了：<b>表格</b>下，off-policy 的 Q-learning 收敛到 <code>Q*</code></span>。<span class='w'>L05 p38 会说：off-policy + 自举 + <b>函数逼近</b>，三样齐了可能发散</span>。<b>而这一讲占了前两样，缺的正是第三样。</b><span class='k'>所以这一讲是「三件套只凑齐两件，所以安全」的那个参照点</span>——<b>L05 的那张表里，「② + ③（表格）」那一行指的就是这里。</b>"], "tip": {"t": "为什么会分家", "v": "Q-learning 是 off-policy 的：你可以一直乱走（ε 很大），照样把最优 Q 学对——<b>但你自己并没有在照最优策略行动</b>。想让行为本身也变最优，就得让 ε 降下去。"}, "quote": "Q-learning converges to the optimal Q* if: <b>all (s,a) pairs are visited infinitely often</b>, and the step-sizes satisfy the Robbins-Munro conditions &nbsp;·&nbsp; (SARSA additionally requires <b>GLIE</b>)"},
{"r": [41, 41], "t": "目录：最大化偏差", "quote": "Table of Contents &nbsp;·&nbsp; <b>5 Maximization Bias</b>", "one": "最后一节：<b>对前面所有算法的一次体检</b>。", "pts": ["<b>这一节处理的问题，用一句话就能说清，而且它远超 RL 的范围：</b><span class='k'>当你从一堆带噪声的估计里挑最大的那个时，你挑出来的那个估计值会系统性地偏高</span>。<b>哪怕每一个估计本身都是无偏的。</b><span class='w'>这不是某个算法的 bug，是「取 max」这个动作本身的统计性质。</span>", "<b>而前面所有算法都在做这件事，所以它们都中招。</b><span class='k'>MC 控制的 <code>arg max_a Q</code>、SARSA 的策略改进、Q-learning 目标里那个 <code>max_{a′}</code></span>——<b>每一处都是在对估计出来的 Q 取最大。</b><span class='w'>Q-learning 尤其严重，因为那个 max 在<b>每一步的更新目标</b>里，于是偏差会被自举一轮一轮地传播放大</span>。"]},
{"r": [42, 42], "t": "最大化偏差", "star": 3, "one": "每个 Q 的估计都无偏，<b>但取了 max 之后就有偏了</b>。", "eq": "单状态 MDP，两个动作，奖励都是 0 均值随机：\nQ(s,a1) = Q(s,a2) = 0 = V(s)\n\nV̂^π̂(s) = E[ max( Q̂(s,a1), Q̂(s,a2) ) ]\n        ≥ max( E[Q̂(s,a1)], E[Q̂(s,a2)] )     ← 詹森不等式\n        = max(0, 0) = V^π", "pts": ["直觉：样本有限时，<b>总有一个动作碰巧看起来好一点</b>（比如 +0.1）。", "你一取 max 就<span class='w'>立刻去利用这个运气</span>，于是系统性地高估。", "出处：Mannor, Simester, Sun &amp; Tsitsiklis, Management Science 2007。", "<b>这个反例设计得极其干净，值得一步步跟一遍，因为它把问题剥到了最裸露的形态。</b><span class='k'>一个状态、两个动作、两个动作的真实期望奖励<b>都是 0</b></span>——<b>于是真值 <code>Q(s,a1) = Q(s,a2) = V*(s) = 0</code>。</b><span class='w'>你用样本均值去估 Q，这是<b>无偏</b>估计量</span>：<b><code>E[Q̂(s,a1)] = E[Q̂(s,a2)] = 0</code>。</b><span class='k'>一切看起来都完美。</span>", "<b>然后那一步出事了：<code>E[max(Q̂₁, Q̂₂)] ≥ max(E[Q̂₁], E[Q̂₂]) = 0</code>。</b><span class='w'>左边是「两个带噪声的估计取最大，再求期望」；右边是「各自求期望，再取最大」</span>。<b>不等号来自 Jensen 不等式——<code>max</code> 是一个凸函数。</b><span class='k'>而且这个不等号通常是<b>严格</b>的：只要两个估计有噪声且不完全相关，左边就严格大于 0</span>。<b>于是你对「最好那个动作的值」的估计，期望上是正的，而真值是 0。</b>", "<b>用更直白的话说这件事：<span class='k'>你挑的是「这次运气最好的那个」，而不是「真的最好的那个」</span>。</b><b>两个动作真实水平一样，但这一轮总有一个的样本均值碰巧高一点，</b><span class='w'>你挑了它，然后拿它那个「碰巧高一点」的数字当作「最好动作的值」</span>。<b>运气被当成了实力。</b><span class='k'>这在统计里有个现成的名字：胜者的诅咒（winner's curse）</span>——<b>赢家的出价总是高估了标的的真实价值。</b>", "<b>偏差的大小取决于两件事，知道这一点你就能判断它在你的问题里严不严重。</b><span class='k'>① 估计的噪声有多大</span>——<b>样本越少，噪声越大，偏差越大；样本趋于无穷时偏差消失。</b><span class='k'>② 候选有多少个</span>——<b>候选越多，「总有一个碰巧很高」的概率越大，偏差越大。</b><span class='w'>两个候选时偏差温和，几百个候选时会相当可观</span>。<b>而课件在脚注里给了出处：Mannor, Simester, Sun &amp; Tsitsiklis, <em>Bias and Variance Approximation in Value Function Estimates</em>, Management Science 2007。</b><span class='k'>注意那是一篇<b>管理科学</b>的论文——这说明这个问题远不止 RL 才有。</span>"], "quote": "Consider single-state MDP (|S|=1) with 2 actions, and both actions have <b>0-mean random rewards</b>: E(r|a=a1) = E(r|a=a2) = 0 &nbsp;·&nbsp; Then Q(s,a1) = Q(s,a2) = 0 = V*(s) &nbsp;·&nbsp; Use an <b>unbiased estimator</b> for Q &nbsp;·&nbsp; Let π̂ = arg max_a Q̂(s,a) &nbsp;|&nbsp; <b>Even though each estimate of the state-action values is unbiased, the estimate of π̂'s value V̂^{π̂} can be biased</b> &nbsp;·&nbsp; E[V̂^{π̂}(s)] = E[max(Q̂(s,a1), Q̂(s,a2))] <b>≥</b> max(E[Q̂(s,a1)], E[Q̂(s,a2)]) = max(0,0) = V* &nbsp;·&nbsp; <b>where the inequality comes from Jensen's inequality</b>", "tbl": {"head": ["", "每个 Q̂ 单独看", "取 max 之后"], "rows": [["有偏吗", "<span class='k'>无偏</span>", "<span class='w'>系统性偏高</span>"], ["为什么", "样本均值是无偏估计", "<b>Jensen：<code>E[max] ≥ max E</code></b>"], ["直觉", "—", "<span class='w'>你挑的是「这次运气最好的」，不是「真的最好的」</span>"], ["什么时候更严重", "—", "<b>样本越少、候选越多，偏得越狠</b>"], ["什么时候消失", "—", "<span class='k'>样本趋于无穷</span>"]]}},
{"r": [43, 43], "t": "双学习：把「选」和「估」拆开", "star": 3, "one": "<b>别拿「估计的 max」当「真值的 max」。</b>", "eq": "把样本劈成两半，独立估出 Q₁ 和 Q₂\n\n用 Q₁ 选动作： a* = arg max_a Q₁(s,a)\n用 Q₂ 估它的值：Q₂(s, a*)\n\n于是 E[Q₂(s,a*)] = Q(s,a*)   ← 无偏", "pts": ["<span class='k'>无偏的来源是「选」和「估」用的是互相独立的样本</span>。", "在线时可以交替更新 Q₁、Q₂，each 用另一个去选动作。", "<b>课件那句 <em>Avoid using max of estimates as estimate of max of true values</em> 是整节的核心，值得当成一条通用戒律记住。</b><span class='k'>「一堆估计的最大值」不是「真值的最大值」的好估计</span>——<b>前者系统性偏高。</b><span class='w'>这条戒律在任何「选最优」的场合都适用</span>：挑模型、挑超参、挑配置、挑投资标的。", "<b>而解药的形状极其朴素：<span class='k'>把数据拆成两半，一半用来<b>挑</b>，另一半用来<b>评</b></span>。</b><b>① 用 <code>Q1</code> 挑出最好的动作 <code>a* = arg max_a Q1(s,a)</code>；② 用 <code>Q2</code> 去估那个动作的值 <code>Q2(s,a*)</code>。</b><span class='w'>于是「挑」的噪声和「评」的噪声是<b>独立</b>的</span>——<b><code>a*</code> 可能是因为 <code>Q1</code> 的噪声而被选中的，但 <code>Q2</code> 对它的评估不受那份噪声影响。</b><span class='k'>运气和实力被拆开了。</span>", "<b>为什么这就无偏了，课件给的理由只有一句：<em>Using independent samples to estimate the value</em>，值得把它展开。</b><span class='k'>给定 <code>a*</code>（不管它是怎么选出来的），<code>Q2(s,a*)</code> 都是 <code>Q(s,a*)</code> 的无偏估计</span>——<b>因为 <code>Q2</code> 用的样本和选 <code>a*</code> 用的样本不相干。</b><span class='w'>而上一页的问题恰恰是：那里「选」和「评」用的是<b>同一份</b>样本</span>，<b>于是「被选中」和「被高估」是同一件事的两面。</b>", "<b>但要诚实地说清楚这个解药换来了什么、付出了什么。</b><span class='k'>换来：对「被选中那个动作的值」的无偏估计</span>。<span class='w'>付出：每一半的样本量减半，于是每个估计的方差变大</span>；<b>而且选出来的 <code>a*</code> 质量会下降（因为你只用一半数据来挑）。</b><span class='k'>所以它是「用方差换偏差」——和这门课到处都是的那笔交易方向相反</span>。<b>在样本很少时，这笔交易未必划算。</b>"], "quote": "The greedy policy w.r.t. estimated Q values can yield a maximization bias during finite-sample learning &nbsp;·&nbsp; <b>Avoid using max of estimates as estimate of max of true values</b> &nbsp;·&nbsp; Instead <b>split samples</b> and use to create two independent unbiased estimates Q1 and Q2 &nbsp;·&nbsp; <b>Use one estimate to select max action: a* = arg max_a Q1(s,a)</b> &nbsp;·&nbsp; <b>Use other estimate to estimate value of a*: Q2(s,a*)</b> &nbsp;·&nbsp; Yields unbiased estimate: E[Q2(s,a*)] = Q(s,a*) &nbsp;·&nbsp; <b>Why? Using independent samples to estimate the value</b>", "res": {"tag": "推断", "v": "<b>这一节是这一讲对你最直接、最可操作的一条——而且它推翻了「L04 科研连接弱」这个预期。</b><br><br><b>你的核心动作是什么？<span class='k'>从一堆候选配置里，按估计的 <code>G = Acc − λ·Cost</code> 挑最好的那个</span>。</b><span class='w'>也就是 <code>max_config Ĝ(config)</code></span>——<b>这正是 p42 那个式子，一字不差。</b><br><br><b>于是结论直接适用：<span class='k'>你报告的那个「最优配置的 G」，系统性地高于它的真实值</span>。</b><span class='w'>哪怕你的 FQE 完全无偏、哪怕你的留出集评估完全无偏</span>——<b>只要你是在一堆带噪声的估计里取最大，偏差就存在。</b><span class='k'>这是胜者的诅咒，和你的算法好不好无关。</span><br><br><b>而偏差的大小由两件事决定，两件在你这里都不乐观：</b><br><b>① 候选数量</b>：<span class='w'>L02 p30 算过，<code>k^H</code> 在 k=3/H=7 时是 2187</span>——<b>两千多个候选，比课件那个「两个动作」的例子严重得多。</b><br><b>② 每个估计的噪声</b>：<span class='w'>留出集上每个配置能跑的 query 数有限，而 Acc 本身是个比例，方差不小</span>。<br><span class='k'>两条叠加，这个偏差很可能不是小数点后几位的事。</span><br><br><b>解药可以原样搬，而且几乎不花钱：<span class='k'>把留出集拆成两半，一半用来挑配置，另一半用来报告它的 G</span>。</b><br><b>① 在 split A 上算每个候选的 <code>Ĝ</code>，挑出 <code>config*</code>；</b><br><b>② 在 split B 上<b>只</b>评估 <code>config*</code>，报告那个数。</b><br><span class='w'>② 里的估计是无偏的，因为 B 的样本没参与挑选</span>。<b>这正是 Double Learning 的做法，而且在统计里有个更常见的名字：样本拆分 / 交叉拟合。</b><br><br><b>代价要一并说清</b>：<span class='w'>每一半样本减半，所以挑出来的配置可能不是最好的那个，而报告的那个数方差也更大</span>。<b>改进做法是<span class='k'>交换两半再做一次取平均</span>（Double Q 的在线版本正是交替更新），或者做 K 折。</b><span class='k'>但无论哪种，关键都是那一句：<b>别用挑它的那份数据去评它</b>。</b>", "ref": "课件 p42–p43（Avoid using max of estimates as estimate of max of true values；split samples）· Mannor et al. Management Science 2007 · L02 p30 科研格 · 简报 §4d"}},
{"r": [44, 44], "t": "Double Q-learning", "star": 3, "one": "维护两张 Q 表，每步抛硬币决定更新哪一张。", "eq": "用 ε-贪婪选 a_t，依据 Q₁(s_t,a) + Q₂(s_t,a)\n观察 (r_t, s_{t+1})\n以 0.5 概率：Q₁(s_t,a_t) ← Q₁ + α( r_t + γ·max_a Q₂(s_{t+1},a) − Q₁ )\n否则：      Q₂(s_t,a_t) ← Q₂ + α( r_t + γ·max_a Q₁(s_{t+1},a) − Q₂ )", "pts": ["<b>内存翻倍</b>；<b>每步计算量不变</b>；数据需求「微妙」——偏差小了，<span class='k'>需要的探索可能反而更少</span>。", "<b>在线版本要解决一个新问题：你没法事先把数据分成两堆，因为数据是一边跑一边来的。</b><span class='k'>解法是：每来一条转移，抛个硬币决定更新 <code>Q1</code> 还是 <code>Q2</code></span>。<b>于是两张表用的是互不重叠的样本，独立性就有了。</b><span class='w'>这是「样本拆分」在流式数据上的实现方式</span>——<b>思路完全一样，只是分法从「事先切」变成了「随机分流」。</b>", "<b>第 6 行那个更新式值得盯一眼，因为「选」和「评」在里面写得很清楚。</b><code>Q2(s_{t+1}, arg max_a Q1(s_{t+1}, a))</code>——<span class='k'><b>用 Q1 选</b>（里面那个 arg max），<b>用 Q2 评</b>（外面那个 Q2 取值）</span>。<b>对比普通 Q-learning 的 <code>max_a Q(s_{t+1},a)</code>：那里选和评用的是同一张表。</b><span class='w'>一个式子写出了全部区别。</span>", "<b><code>kp</code> 专门标了一句，值得强调：<span class='k'>关键不是「平均」，是把「选」与「评」解耦</span>。</b><span class='w'>很多人以为 Double Q 是「两个估计取平均来降噪」——不是</span>。<b>如果只是平均，偏差照样存在（两个有偏估计的平均还是有偏）。</b><span class='k'>真正起作用的是「用 A 挑、用 B 评」这个结构</span>。<b>第 3 行那个 <code>Q1 + Q2</code> 确实是在平均，但那只用于<b>行为策略</b>（选动作去探索），和消除偏差无关。</b>", "<b>课件自己问的那三个代价，答案值得记一下，因为它们比想象的便宜。</b><span class='k'>内存：翻倍</span>（<b>两张 Q 表</b>）；<span class='k'>每步计算：不变</span>（<b>每次只更新一张表</b>）；<span class='w'>数据需求：微妙</span>——<b>每张表只拿到一半的样本，看起来要更多数据；但偏差变小之后，策略更早地走对方向，<b>可能反而减少了所需的探索量</b>。</b><span class='k'>课件的措辞是 <em>might reduce amount of exploration needed due to lower bias</em>——用的是 might，很克制。</span>"], "quote": "<b>Double Q-Learning</b> &nbsp;·&nbsp; 3: Select a_t using ε-greedy π(s) = <b>arg max_a [Q1(s_t,a) + Q2(s_t,a)]</b> &nbsp;·&nbsp; 5: if (with 0.5 probability) then &nbsp;·&nbsp; 6: <b>Q1(s_t,a_t) ← Q1(s_t,a_t) + α(r_t + γ Q2(s_{t+1}, arg max_a Q1(s_{t+1},a)) − Q1(s_t,a_t))</b> &nbsp;·&nbsp; 7: else &nbsp;·&nbsp; 8: (symmetric, swap Q1 and Q2) &nbsp;|&nbsp; <b>Doubles the memory, same computation requirements, data requirements are subtle — might reduce amount of exploration needed due to lower bias</b>", "tbl": {"head": ["", "Q-learning", "Double Q-learning"], "rows": [["目标里的那一项", "<code>max_a Q(s′,a)</code>", "<code>Q2(s′, arg max_a Q1(s′,a))</code>"], ["选和评用同一份数据吗", "<span class='w'>是 ⇒ 系统性偏高</span>", "<span class='k'>否 ⇒ 无偏</span>"], ["内存", "1 张表", "<span class='w'>2 张表</span>"], ["每步计算", "—", "<span class='k'>不变（每次只更新一张）</span>"], ["数据需求", "—", "<b>微妙——每张表样本减半，但偏差小可能减少所需探索</b>"], ["<b>起作用的是什么</b>", "—", "<span class='k'>解耦「选」与「评」，<b>不是</b>两个估计取平均</span>"]]}},
{"r": [45, 45], "t": "实验：差距有多大", "star": 2, "one": "Sutton &amp; Barto 2018 图 6.7。", "pts": ["因为最大化偏差，<b>Q-learning 花在次优动作上的时间比 Double Q-learning 多得多</b>。", "<b>这个实验图要看的不是「谁最终更好」，而是「早期差多少」。</b><span class='k'>两者最终都会收敛（偏差随样本增加而消失）</span>；<span class='w'>但在学习的早期，普通 Q-learning 会花大量时间去选那些<b>被高估的次优动作</b></span>。<b>因为它们的 Q 被噪声抬高了，于是贪心策略一直去试它们。</b><span class='k'>这是一个「偏差直接变成了行为上的浪费」的例子。</span>", "<b>把这件事和探索联系起来，你会看到一个有点反直觉的结论。</b><span class='w'>最大化偏差其实制造了一种「假的探索」</span>——<b>被高估的动作看起来很好，于是你去试它；试过之后估计下降，你换下一个被高估的。</b><span class='k'>所以 Q-learning 的乐观偏差在某种意义上起到了探索的作用</span>。<b>但这是一种<b>低效</b>的探索</b>：<span class='w'>它的方向由噪声决定，而不是由「哪里不确定」决定</span>。<b>而第十一讲会告诉你怎么做有章法的乐观探索（UCB）——那里的乐观是有依据的。</b>", "<b>最后提一句这条线在深度 RL 里的延续，它正是 L06/L07 复习过的那个 Double DQN。</b><span class='k'>Double DQN 用「当前网络选、目标网络评」来近似这个解耦</span>（<b>L07 p3–p6</b>）。<span class='w'>注意它是<b>近似</b>的：两组权重来自同一批数据，噪声并不真正独立</span>——<b>所以它只是缓解，不是消除。</b><span class='k'>而 Rainbow 的消融显示 Double DQN 单独去掉几乎不掉分</span>（<b>L07 p15</b>），<b>因为分布式值函数已经顺带缓解了同一个偏差。</b>"], "say": "老师描述了那个域：一个选项<b>随机但其实更差</b>，另一个<b>确定但更好</b>。数据少时随机那个容易碰巧显得好，Q-learning 就一头扎进去。", "quote": "Due to the maximization bias, <b>Q-learning spends much more time selecting suboptimal actions than double Q-learning</b> &nbsp;·&nbsp; (Figure 6.7 in Sutton and Barto 2018)"},
{"r": [46, 46], "t": "目录：讲完了", "quote": "Table of Contents &nbsp;·&nbsp; 1 Generalized Policy Iteration &nbsp;·&nbsp; 2 Importance of Exploration &nbsp;·&nbsp; 3 Monte Carlo Control &nbsp;·&nbsp; 4 Temporal Difference Methods for Control &nbsp;·&nbsp; 5 Maximization Bias", "one": "五节讲完了，<b>回头看一次这条链子</b>。", "pts": ["<b>把这五节连成一句话，这一讲的结构就清楚了：</b><span class='k'>要无模型做控制 ⇒ 必须估 Q（第 1 节）⇒ 但贪心策略试不到所有动作，所以要 ε-贪婪和 GLIE（第 2 节）⇒ 评估那一步用 MC（第 3 节）或 TD（第 4 节）⇒ 而所有这些算法都有同一个系统性偏差，要靠拆分数据来治（第 5 节）</span>。<b>每一节都在补上一节留下的缺口。</b>", "<b>而这一讲在整门课里的位置也值得收一句：<span class='k'>它是最后一片干净的地面</span>。</b><span class='w'>这里所有的收敛结论都成立，条件都是「温和」的，证明都有</span>。<b>下一讲引入函数逼近之后，这些结论会一条条失效</b>——<span class='k'>MC 还收敛到最优逼近，TD 只收敛到它的常数倍之内，而 off-policy 的 Q-learning 可能直接发散</span>（<b>L05 p38 p45</b>）。<b>所以把这一讲的条件记牢，后面才知道是哪一条被破坏了。</b>"]},
{"r": [47, 48], "t": "这一讲你该掌握什么", "one": "课件自己给的清单。", "pts": ["能<b>实现</b> MC on-policy 控制、SARSA、Q-learning。", "能按「更新有多快、偏差方差、计算代价」把它们放在一起比。", "能说出这些算法收敛到 <code>Q*</code> 和 <code>π*</code> 各需要什么条件，并给出<b>至少一种</b>保证条件成立的做法。", "下一讲：值函数逼近。", "<b>课件这张清单里，第三条要求最高，值得逐字看：不只要会说条件，还要能给出<b>至少一种</b>保证条件被满足的办法。</b><span class='k'>条件：GLIE（SARSA 要两条，Q-learning 只要无限探索那条）+ Robbins-Munro 步长条件</span>。<span class='k'>保证办法：<code>ε_i = 1/i</code> 保证 GLIE；<code>α_t = 1/t</code> 保证步长条件</span>。<b>两个都靠同一个数学事实：调和级数发散而平方和收敛。</b>", "<b>第二条要求的那三个比较维度，自查一遍。</b><b>更新快慢</b>：<span class='k'>MC 要等片段结束；SARSA 和 Q-learning 每步都能更新</span>。<br><b>偏差与方差</b>：<span class='k'>MC 无偏、方差大；TD 类有偏、方差小</span>（<b>L03 那笔老交易</b>）。<br><b>计算代价</b>：<span class='k'>三者每次更新都是 <code>O(1)</code> 到 <code>O(|A|)</code>，差别不大</span>；<span class='w'>真正的代价差异在<b>数据</b>上，不在计算上</span>。", "<b>最后补一条课件没列、但你应该能回答的：SARSA 和 Q-learning 该选哪个。</b><span class='k'>如果学习期间的表现也要紧（在线、有代价），偏 SARSA</span>——<b>它会把探索的风险算进去，主动避开「失手代价高」的路线。</b><span class='k'>如果你只关心最终学到的策略（离线学、学完再部署），偏 Q-learning</span>——<b>它直接学最优策略的值，而且能用任何来源的数据。</b><span class='w'>这个区分比记住两个更新式有用得多。</span>"], "quote": "<b>Be able to implement MC on policy control and SARSA and Q-learning</b> &nbsp;·&nbsp; Compare them according to properties of how quickly they update, (informally) bias and variance, computational cost &nbsp;·&nbsp; <b>Define conditions for these algorithms to converge to the optimal Q and optimal π and give at least one way to guarantee such conditions are met</b>"}
];

var TH = {"title": "L04 接上课题的哪一段：你挑出来的那个「最优配置」，它的分数系统性地虚高", "arc": "<b>任务清单原本把 L04 标成「科研连接弱」，这一讲推翻了那个预期——它的第 5 节是整门课对你最直接可用的一段。</b><br><br><b>你的核心动作是 <code>max_config Ĝ(config)</code>：从一堆候选配置里，按估出来的 <code>G = Acc − λ·Cost</code> 挑最好的那个。</b><span class='k'>而 p42 证明了：这样挑出来的那个估计值，<b>系统性地高于真值</b></span>——<b>哪怕每一个估计本身都完全无偏。</b><span class='w'>不等号来自 Jensen：<code>E[max] ≥ max E</code>，而 max 是凸函数</span>。<b>说白了：你挑的是「这次运气最好的那个」，不是「真的最好的那个」。</b><span class='k'>统计里管这叫胜者的诅咒。</span><br><br><b>而偏差的大小由两件事决定，两件在你这里都不乐观。</b><span class='w'>① 候选数量——L02 p30 算过 <code>k^H</code> 在 k=3/H=7 时是 2187，比课件那个「两个动作」的例子严重得多；</span><span class='w'>② 每个估计的噪声——留出集上每个配置能跑的 query 数有限，而 Acc 是个比例，方差不小。</span><b>两条叠加，这很可能不是小数点后几位的事。</b><br><br><b>解药在 p43，而且几乎不花钱：<span class='k'>把留出集拆成两半，一半用来<b>挑</b>，另一半用来<b>报告</b></span>。</b><span class='w'>在 split A 上挑出 <code>config*</code>，在 split B 上只评估它</span>——<b>B 的样本没参与挑选，所以那个数是无偏的。</b><span class='k'>课件的原话是 <em>Avoid using max of estimates as estimate of max of true values</em>，而做法是 <em>split samples</em>。</span><br><br><b>这一讲还给了你一个干净的参照点：<span class='k'>表格下 off-policy 是完全安全的</span>。</b><b>Q-learning 收敛到 <code>Q*</code>，条件只有「每个 <code>(s,a)</code> 访问无穷多次」加步长条件（p40）。</b><span class='w'>所以「off-policy 很危险」不准确——危险的是它<b>加上</b>函数逼近<b>加上</b>自举</span>（<b>L05 p38 的 intersection</b>）。<b>这意味着你有一条可以主动选择的退路：把状态粗粒度化到能查表。</b>", "pitfalls": [{"v": "<b>用挑出配置的那份数据去报告它的分数。</b> <span class='k'>这正是 p42 的最大化偏差</span>——<span class='w'>「被选中」和「被高估」变成了同一件事的两面</span>。<b>后果是你论文里那个最好的数字虚高，而且上线后会回落。</b><span class='k'>解药：split A 挑、split B 报，B 不参与挑选。</span>", "tag": "已核", "ref": "课件 p42–p43（Jensen；split samples）"}, {"v": "<b>以为估计量无偏就没问题了。</b> <span class='w'>反例里每个 <code>Q̂</code> 都完全无偏，取 max 之后照样偏高</span>。<b>偏差不是来自估计量，是来自「选最大」这个动作。</b><span class='k'>所以改进 FQE 的无偏性解决不了这个问题，必须改<b>流程</b>。</span>", "tag": "已核", "ref": "课件 p42 原文"}, {"v": "<b>把 Double Q 理解成「两个估计取平均」。</b> <span class='k'>kp 专门标了这一条：关键不是平均，是把「选」与「评」解耦</span>。<span class='w'>两个有偏估计的平均还是有偏</span>。<b>算法里那个 <code>Q1 + Q2</code> 只用于行为策略（选动作去探索），和消除偏差无关。</b>", "tag": "已核", "ref": "课件 p43–p44 · 任务清单 kp"}, {"v": "<b>忽略拆分数据的代价。</b> <span class='w'>每一半样本减半 ⇒ 估计方差变大，而且选出来的配置可能不是最好的那个</span>。<b>这是「用方差换偏差」，和这门课到处都是的那笔交易方向相反。</b><span class='k'>样本很少时未必划算；改进做法是交换两半再做一次取平均，或者 K 折。</span>", "tag": "推断", "ref": "课件 p43 p44 · 简报 §4d"}, {"v": "<b>笼统地说「off-policy 不安全」。</b> <span class='k'>表格下它完全安全（p40）</span>；<span class='w'>不安全的是 off-policy + 函数逼近 + 自举三样<b>同时</b>具备</span>（<b>L05 p38 用的词是 intersection</b>）。<b>这个区分给了你一条退路：把状态粗粒度化到能查表，off-policy 的风险就消失了</b>——<span class='w'>代价是可能产生混叠（L08 p10）。</span>", "tag": "已核", "ref": "课件 p9 p40 · L05 p38 · L02 p20 科研格"}, {"v": "<b>把在线学习的 ε 衰减策略照搬到离线设定。</b> <span class='k'>GLIE 的第二条（渐近贪婪）是为「最终要部署这个行为策略」准备的</span>；<span class='w'>而你的行为策略只是采数据的工具，不是最终产品</span>。<b>离线设定下没有探索–利用权衡，只有「覆盖够不够」这一个问题。</b><span class='k'>所以固定的随机化强度对你更好——它让覆盖更均匀。</span>", "tag": "推断", "ref": "课件 p23 两条件 · 本讲 p23 科研格 · 简报 §4c"}], "ammo": [{"q": "你们报的那个最优配置的分数，可信吗？", "a": "<b>我们对它做了去偏处理，因为「从一堆带噪声的估计里挑最大」本身就会高估。</b><span class='k'>这是最大化偏差（CS234 L04 p42）：哪怕每个估计无偏，<code>E[max] ≥ max E</code> 仍然成立，不等号来自 Jensen</span>。<b>所以我们把留出集拆成两半：一半用于挑选，另一半<b>只</b>用于报告被选中那个配置的分数。</b><span class='w'>后者的样本没参与挑选，因此是无偏的</span>——<b>这正是 Double Learning 的做法，在统计里叫样本拆分。</b>", "tag": "已核", "ref": "课件 p42–p43 · 简报 §4d"}, {"q": "候选只有两千多个，这个偏差能有多大？", "a": "<b>恰恰是候选多才严重。</b><span class='k'>偏差的大小随「候选数量」和「单个估计的噪声」一起增长</span>——<b>课件那个反例只有两个候选就已经严格偏高了，两千多个会明显得多。</b><span class='w'>而我们留出集上每个配置能跑的 query 数有限，Acc 作为比例的方差不小</span>。<b>所以我们没有去估这个偏差的大小，而是直接用拆分把它消掉。</b>", "tag": "推断", "ref": "课件 p42 · L02 p30 科研格"}, {"q": "你们是 off-policy 的，这不是很危险吗？", "a": "<b>要看和什么一起用。</b><span class='k'>表格表示下，off-policy 的 Q-learning 收敛到 <code>Q*</code>，条件只有「每个状态动作对访问无穷多次」加标准步长条件（CS234 L04 p40）</span>。<span class='w'>真正危险的是 off-policy <b>加上</b>函数逼近 <b>加上</b>自举——课件用的词是 intersection，三样必须同时具备</span>。<b>我们因此把「粗粒度状态 + 查表」作为对照组：它牺牲了分辨率，但换回了确切的保证。</b>", "tag": "已核", "ref": "课件 p9 p40 · L05 p38"}, {"q": "你们的随机化为什么不随时间衰减？", "a": "<b>因为我们是离线设定，不是在线学习。</b><span class='k'>GLIE 的「渐近贪婪」条件是为「最终要部署这个行为策略」准备的</span>；<span class='w'>而我们的行为策略只是采数据的工具，采完就不用了</span>。<b>离线设定下没有探索–利用权衡，只有覆盖够不够这一个问题。</b><span class='k'>固定的随机化强度让覆盖更均匀，而覆盖正是后续一切估计的前提。</span>", "tag": "推断", "ref": "课件 p23 · 简报 §4c §4d"}], "papers": [{"t": "Mannor, Simester, Sun &amp; Tsitsiklis — Bias and Variance Approximation in Value Function Estimates", "id": "Management Science 2007", "why": "p42 那个最大化偏差反例的出处。<b>注意它发表在<b>管理科学</b>上，不是 RL 会议</b>——<span class='k'>这说明「从噪声估计里挑最大会高估」是个远超 RL 的普遍问题</span>，<span class='w'>你在写 related work 时可以用它来说明这不是一个 RL 特有的技术细节。</span>"}, {"t": "van Hasselt — Double Q-learning", "id": "NIPS 2010", "why": "p43–p44 的出处。<b>它给出了「拆分样本去解耦选与评」的完整分析</b>，<span class='k'>包括为什么这样做会<b>低估</b>（而不是不偏不倚）</span>——<span class='w'>这一点课件没说，但你报告区间时需要知道偏的方向。</span>"}, {"t": "Watkins &amp; Dayan — Q-Learning", "id": "Machine Learning 1992", "why": "p22 和 p40 那条收敛结论的原始出处。<b>你需要它来精确引用「表格下 off-policy 安全」这一条</b>——<span class='k'>而这正是你论证「粗粒度查表是一条有保证的退路」时的依据。</span>"}, {"t": "Tsitsiklis — Asynchronous Stochastic Approximation and Q-Learning", "id": "Machine Learning 1994", "why": "课件在 p22 一并给出的那篇。<b>它把 Q-learning 放进随机逼近的一般框架</b>——<span class='k'>于是 p33 那个 Robbins-Munro 步长条件不再是个孤立的技术要求，而是那套理论的标准条件</span>。"}, {"t": "Sutton &amp; Barto — Reinforcement Learning: An Introduction, 5.2–5.4, 6.4, 6.5, 6.7", "id": "2018, 2nd ed.", "why": "课件自己在 p1 指定的章节，正好对应这一讲的后四节。<b>课件跳过的 6.6（期望 SARSA）值得补</b>——<span class='k'>它用期望代替采样的那个动作，方差比 SARSA 小，而且是 SARSA 和 Q-learning 之间的一个连续谱</span>。"}]};

  function quizHtml(start){

      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
