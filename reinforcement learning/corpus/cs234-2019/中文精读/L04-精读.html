<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第四讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs234-2019-l04">

<div id="bar">
  <h1>CS234 第四讲 · <span>无模型控制：ε-贪婪、SARSA、Q-learning 与最大化偏差</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 48</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture4_postclass.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L04-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "这一讲和上一讲的分界线是？", "o": ["做评估还是做控制", "用 MC 还是 TD", "有没有模型", "有没有折扣"], "a": 0, "why": "两讲都没有模型。上一讲问「这个策略多好」，这一讲问「怎么学到一个好的」。"}],
3: [{"q": "从「评估」到「控制」，多出来的核心困难是什么？", "o": ["状态空间变大了", "需要知道转移模型", "折扣因子不能取 1", "你现在要自己决定做什么，于是同时决定了会看到什么数据"], "a": 3, "why": "评估时策略是给定的，数据怎么来不由你定。控制时「学什么」和「采什么」纠缠在一起——这就是探索问题的来源。"}, {"q": "评估问题和控制问题，估的东西有什么不同？", "o": ["评估需要模型，控制不需要", "评估估 Q，控制估 V", "没有本质区别", "评估估的是固定的量；控制里要估的东西一直在动，而且是你自己把它推动的"], "a": 3, "why": "策略改了 Q^π 就变了，而你的数据还是旧策略采的。这正是 p22 要正面承认的麻烦。"}],
5: [{"q": "这一讲<b>不</b>碰四要素里的哪一个？", "o": ["延迟后果", "泛化", "探索", "优化"], "a": 1, "why": "泛化要到下一讲（值函数逼近）。而探索从这一讲起成了算法里必须处理的东西。"}],
8: [{"q": "「无模型」其实包含两种情况，除了「不知道模型」，另一种是？", "o": ["模型是随机的", "模型太简单", "模型会变", "知道模型，但直接用它算不动，只能当采样器"], "a": 3, "why": "老师举的是气候模拟：模型写得出来，但跑一次贵到只能采样。"}, {"q": "课件列的两种「用得上无模型方法」的处境，第二种是什么？", "o": ["模型已知，但直接用它计算不可行，只能通过采样", "奖励函数未知", "状态空间连续", "模型未知但能采样"], "a": 0, "why": "围棋就是例子：规则完全已知，但状态数是天文数字。所以「无模型方法」真正的意思是「只通过采样来使用模型」。"}],
9: [{"q": "off-policy 学习指的是？", "o": ["不用模型", "不用策略", "离线训练", "按一个策略行动，却在评估/改进另一个策略"], "a": 3, "why": "老师的直觉：你试过「一直 a1」也试过「一直 a2」，但从没试过「先 a1 再 a2」——off-policy 要把这些片段拼起来。"}, {"q": "off-policy 能买到哪三样 on-policy 买不到的东西？", "o": ["复用旧数据、从别人的数据里学、一边探索一边学最优", "更少的超参、更简单的实现、更好的泛化", "更快的收敛、更小的方差、更强的保证", "无偏估计、低方差、单调改进"], "a": 0, "why": "DQN 的回放池靠第一条；从人类演示学靠第二条；Q-learning 靠第三条。"}, {"q": "「off-policy 很危险」这句话准确吗？", "o": ["准确，它总是可能发散", "准确，除非用重要性采样", "不准确，它从来不会发散", "不准确——表格下它完全安全；危险的是 off-policy + 函数逼近 + 自举三样同时具备"], "a": 3, "why": "L05 p38 用的词是 intersection（交集）。这一讲正是「三件套只凑齐两件所以安全」的那个参照点。"}],
11: [{"q": "策略迭代的改进式子 <code>arg max_a [R + γΣPV]</code>，为什么这一讲不能直接用？", "o": ["arg max 可能有并列", "计算太慢", "V 不唯一", "里面的 R 和 P 都得知道，而这一讲没有模型"], "a": 3, "why": "这正是下一页要换成 Q 的理由。"}],
12: [{"q": "为什么改成直接估 <code>Q</code> 就绕开了模型？", "o": ["因为 Q 是无偏的", "因为 Q 收敛更快", "因为 arg max_a Q(s,a) 不需要 R 和 P，Q 自己就够挑动作", "Q 比 V 小"], "a": 2, "why": "V 必须配上模型才能挑动作。这是整讲的第一步棋。"}, {"q": "为什么无模型控制必须估 Q 而不是 V？", "o": ["Q 收敛更快", "从 V 推出动作必须算 <code>R + γΣP·V</code>，那需要模型；而 <code>arg max_a Q</code> 不用", "V 在大状态空间下存不下", "Q 的方差更小"], "a": 1, "why": "这件事的影响远超这一讲：DQN 学 Q 不学 V，第八讲说「为什么是 Q-learning 不是 V-learning」也是同一个理由。"}, {"q": "改估 Q 的代价是什么？", "o": ["Q 表比 V 表大 |A| 倍，存储和所需数据量都乘了 |A|", "Q 不可微", "Q 需要知道奖励函数", "没有代价"], "a": 0, "why": "因为你现在要把每个动作都试够次数，而不只是走到每个状态。动作多的问题上这个代价很实在。"}],
15: [{"q": "确定性策略 + 直接估 Q，最致命的问题是？", "o": ["需要马尔可夫假设", "对 <code>a ≠ π(s)</code> 永远拿不到数据，策略改进无从谈起", "收敛太慢", "Q 表太大"], "a": 1, "why": "不是采不到不同轨迹，而是同一个状态你永远只试那一个动作。"}, {"q": "第二个坑是？", "o": ["γ 不好选", "动作空间未知", "改进用的 Q 只是估计值，不是精确值——单调改进的保证要重新讨论", "α 不好选"], "a": 2, "why": "p22 会专门说：第二讲的单调改进依赖「评估是精确的」，这一讲往往做不到。"}, {"q": "p15 的两个坑分别是什么性质的问题？", "o": ["都是统计问题", "坑一是数据问题（那些格子没样本），坑二是统计问题（样本有限所以估计有噪声）", "都是数据问题", "坑一是计算问题，坑二是存储问题"], "a": 1, "why": "两件事都源自这一页，但药完全不同：前者靠随机化采到数据（第 2 节），后者靠拆分数据消除偏差（第 5 节）。"}, {"q": "确定性贪心策略为什么会「自我锁死」？", "o": ["因为折扣因子太大", "没试过的动作估计停在初始值 ⇒ 看起来差 ⇒ 贪心不去试 ⇒ 永远没数据", "因为 Q 表存不下", "因为学习率太小"], "a": 1, "why": "反过来，把 Q 初始化得很高（乐观初始化），没试过的动作看起来最好，贪心本身就会去探索。"}],
18: [{"q": "ε-贪婪策略下，当前最优动作被选中的<b>总</b>概率是？", "o": ["1 − ε", "ε/|A|", "1/|A|", "1 − ε + ε/|A|"], "a": 3, "why": "随机那一份里也可能抽到它——课上老师专门澄清过这一点。"}, {"q": "「随机探索时要不要排除掉贪婪动作」，老师的回答是？", "o": ["看 ε 大小", "看 |A| 大小", "必须排除", "不排除；真要排除，不过相当于换了个 ε"], "a": 3, "why": "而且不排除实现起来更简单。"}, {"q": "ε-贪婪里，贪心动作被选中的概率是多少？", "o": ["<code>1 − ε·(|A|−1)/|A|</code>", "<code>ε/|A|</code>", "<code>1 − ε</code>", "<code>1 − ε + ε/|A|</code>"], "a": 3, "why": "因为那 ε 的随机分支里也有 1/|A| 的概率抽中它。按「贪心 1−ε、其余各 ε/|A|」算的话总和是 1 − ε/|A|，少了一块。"}, {"q": "真正做出「非贪心动作」的概率是多少？", "o": ["<code>ε/|A|</code>", "<code>1 − ε</code>", "<code>ε·(|A|−1)/|A|</code>", "<code>ε</code>"], "a": 2, "why": "ε 是「不走贪心分支」的概率，不是「做出非贪心动作」的概率。只有两个动作时两者差得最远。"}, {"q": "ε-贪婪在「探索方法」这个谱里属于哪一类？", "o": ["贝叶斯探索", "无差别探索——对所有非贪心动作一视同仁，不管你对它们了解多少", "基于模型的探索", "按不确定性分配探索"], "a": 1, "why": "一个已经试过一千次确定很差的动作，和一个从没试过的动作，被选中概率一样。更聪明的办法（UCB、后验采样）是第十一、十二讲的内容。"}],
19: [{"q": "轨迹 (s3,a1,0, s2,a2,0, s3,a1,0, s2,a2,0, s1,a1,1)，首次访问 MC 估出的 <code>Q(s3,a2)</code> 是？", "o": ["无法确定", "1", "0.5", "0，因为在 s3 从来没做过 a2"], "a": 3, "why": "现在有两张表。在某个状态做了哪个动作，就只能更新哪张表。"}, {"q": "两张 Q 表逐位取 max，得到 <code>[1 1 1 0 0 0 0]</code>——这个结果眼熟吗？", "o": ["是 TD 的答案", "不眼熟", "正是上一讲 V 的首次访问 MC 答案，只是经验被分摊到了两张表上", "是巧合"], "a": 2, "why": "课上两位同学答错，错处都一样：没分清「哪张表」和「MC 还是 TD」。"}],
20: [{"q": "证明 ε-贪婪保单调改进，用的核心放缩是？", "o": ["把 max 推进求和里——max 至少不比其中任何一项差", "三角不等式", "柯西不等式", "詹森不等式"], "a": 0, "why": "和第二讲那个策略改进证明同源。中间还把 1 写成 Σ_a π(a|s)。"}, {"q": "老师给的直觉是？", "o": ["max 总是对的", "随机化降低方差", "不探索，Q 就不变，策略也不变；一探索才可能发现更好的动作", "ε 越大越好"], "a": 2, "why": "探索带来别的 (s,a) 的证据，若真有更好的，Q 会告诉你。"}, {"q": "ε-贪婪单调改进定理里，新策略是和谁比？", "o": ["和随机策略比", "和最优策略比", "和同样带 ε 的旧 ε-贪婪策略比", "和纯贪心策略比"], "a": 2, "why": "关键在「和谁比」。随机动作当然比贪心动作差，但定理说的是新旧两个 ε-贪婪策略之间的比较。"}, {"q": "证明用的核心技巧是什么？", "o": ["把 <code>max_a Q</code> 放缩成一个精心挑选的加权平均（权重是 <code>(π_i(a|s) − ε/|A|)/(1−ε)</code>）", "数学归纳法", "反证法", "用压缩映射定理"], "a": 0, "why": "验证那组权重合法：每项非负（ε-贪婪给每个动作至少 ε/|A|），且和为 (1−ε)/(1−ε) = 1。"}],
22: [{"q": "第二讲的单调改进能原样搬过来吗？", "o": ["能，只要 γ<1", "能，完全一样", "不能，因为没有模型", "不能：那里评估是精确的，这一讲的 Q 是采样估出来的"], "a": 3, "why": "好消息是温和条件下广义策略迭代仍收敛（Watkins &amp; Dayan 1992；Tsitsiklis 1994）。"}, {"q": "课件在这一页自陈了什么？", "o": ["ε-贪婪不保证改进", "Q-learning 不收敛", "L02 的单调改进成立是因为策略评估是精确的；而这一讲的 Q 来自许多个策略的样本", "MC 比 TD 更好"], "a": 2, "why": "所以严格说那个定理的前提并不成立。但课件接着说：beautifully，这些方法在温和条件下仍然收敛——说的是终点，不是路径。"}, {"q": "「样本来自许多个策略」为什么比「估计有误差」更麻烦？", "o": ["因为计算更慢", "<code>Q^π</code> 是针对某一个 π 定义的；混着多个策略的样本估出来的不是任何一个策略的 Q", "因为样本量更少", "因为会引入方差"], "a": 1, "why": "L09 p17 讨论基线该用哪批数据拟合时，碰到的是同一个问题。"}],
23: [{"q": "GLIE 的两条要求是？", "o": ["ε 单调递减 + α 单调递减", "无偏 + 一致", "Q 收敛 + π 收敛", "所有 (s,a) 访问无穷多次 + 行为策略最终收敛到贪婪"], "a": 3, "why": "两条缺一不可。一个简单取法是 ε_i = 1/i。"}, {"q": "老师举的「GLIE 做不到」的例子是？", "o": ["动作空间连续", "状态太多", "奖励是随机的", "直升机摔了就飞不回去——有些状态一旦离开再也回不去"], "a": 3, "why": "工程上的对策：把它当 episodic，摔一架算一次终止。"}, {"q": "GLIE 的两个条件各自防什么？", "o": ["两条防的是同一件事", "条件一防发散；条件二防过拟合", "条件一防方差；条件二防偏差", "条件一防「某些格子永远没数据」；条件二防「永远以 ε 的概率做蠢事」"], "a": 3, "why": "ε 固定不变的话，算法收敛到的是「ε-贪婪策略的最优值」而不是「最优策略的值」。"}, {"q": "<code>ε_i = 1/i</code> 为什么同时满足两个条件？", "o": ["因为它单调递减", "因为它有界", "因为它是凸的", "<code>Σ 1/i</code> 发散（所以访问次数无穷），而 <code>1/i → 0</code>（所以最终贪婪）"], "a": 3, "why": "调和级数的发散性在这里被用上了，这不是巧合，是设计。p33 的步长条件用的是同一个数学事实。"}],
25: [{"q": "MC 在线控制里 <code>ε = 1/k</code> 是在兑现什么？", "o": ["马尔可夫假设", "GLIE", "Robbins–Munro 条件", "无偏性"], "a": 1, "why": "ε 趋于 0 保证最终变贪婪，而每一轮仍有随机保证访问遍所有 (s,a)。"}],
26: [{"q": "由 <code>Q(·,a1)=[1 0 1 0 0 0 0]</code>、<code>Q(·,a2)=[0 1 0 0 0 0 0]</code> 得到的贪婪策略是？", "o": ["[1 2 1 平 平 平 平]", "[2 1 2 平 平 平 平]", "全部 a2", "全部 a1"], "a": 0, "why": "s4–s7 两个动作都是 0，平局。"}, {"q": "老师关于「平局」给的实践建议是？", "o": ["固定选 a1", "把 ε 调大", "每次查 arg max 时随机打破平局——等于白赚一点探索", "跳过这些状态"], "a": 2, "why": "别把平局的解法预先固定下来。"}],
27: [{"q": "MC 控制的收敛条件为什么比 SARSA 宽松（不需要步长条件）？", "o": ["因为它用样本平均（G/N），而平均本身就是一个自动衰减的步长（第 n 次权重是 1/n）", "因为它不自举", "因为它只用 first visit", "因为 MC 无偏"], "a": 0, "why": "也就是说：样本平均已经悄悄满足了那个步长条件。"}],
28: [{"q": "把评估换成 TD 之后，会冒出一个 MC 那里没有的新选择，是什么？", "o": ["用 first visit 还是 every visit", "更新一次还是多次", "「下一步用哪个动作的 Q」来自举：实际做的那个（SARSA）还是最好的那个（Q-learning）", "用折扣还是不折扣"], "a": 2, "why": "MC 里没有这个选择，因为它根本不用「下一步的估计」。同一笔数据，两个目标——这是这一讲最该记住的一句话。"}],
31: [{"q": "SARSA 这个名字来自？", "o": ["随机近似", "作者姓氏", "更新用到的五个量：s, a, r, s′, a′", "采样-平均"], "a": 2, "why": "关键是那最后一个 a′：必须等到下一个动作定下来才能更新。"}, {"q": "SARSA 相对 MC 控制的好处是？", "o": ["不需要 α", "不用等片段结束，同一个片段里就能改策略", "不需要探索", "无偏"], "a": 1, "why": "片段很长时这一点很值钱。"}, {"q": "SARSA 这个名字是什么的缩写？", "o": ["State-Action-Reward-State-Action——它需要的五个量", "没有特别含义", "Sequential-Approximate-RL-Sampling-Algorithm", "Sample-Average-Reward-Simple-Algorithm"], "a": 0, "why": "最后那个 A' 是它和 Q-learning 唯一的区别，也是整个 on-policy 性质的来源。"}, {"q": "SARSA 为什么会主动避开「旁边有悬崖」的路线？", "o": ["因为它用了折扣", "因为它方差小", "因为它收敛更快", "它用来自举的 <code>a'</code> 是从 ε-贪婪采的，所以学到的 Q 包含了「有 ε 概率失手」的代价"], "a": 3, "why": "Sutton & Barto 的 cliff walking 例子就是演示这一点的。Q-learning 会走最优路线，哪怕旁边是悬崖。"}],
33: [{"q": "Robbins–Munro 条件的两半分别在要求什么？", "o": ["都在要求 α 变小", "都在要求 α 变大", "Σα=∞ 要求步子加起来够大；Σα²<∞ 要求步子最终够小", "一个管 α 一个管 ε"], "a": 2, "why": "α=1 完全不记过去，α=0 完全不更新，两端都不行。"}, {"q": "课件自己对这个步长条件的评价是？", "o": ["只对 SARSA 有效", "只对 MC 有效", "实践中应当严格遵守", "实践中多半不会用它——这是理论上的充分条件，不是工程建议"], "a": 3, "why": "真跑的时候常用小常数或缓慢衰减，具体看领域。"}, {"q": "Robbins-Munro 的两个条件各自防什么？", "o": ["都是为了保证无偏", "和发散防过拟合；平方和收敛防欠拟合", "都是为了加速收敛", "和发散防「走不到真值那里」；平方和收敛防「噪声压不下去」"], "a": 3, "why": "典型取法 α_t = 1/t：Σ1/t 发散，Σ1/t² 收敛，刚好卡在中间。"}, {"q": "课件反问「实践中会用满足这些条件的步长吗」，答案是什么？", "o": ["取决于状态空间大小", "会，但要加动量", "Likely not——<code>1/t</code> 衰减太快，而且真实环境非平稳，需要不衰减到零的步长", "会，这是标准做法"], "a": 2, "why": "实践中普遍用固定的小 α。代价是严格说失去收敛保证——Q 会在真值附近持续抖动。"}],
35: [{"q": "Q-learning 和 SARSA 的更新只差一处，是哪里？", "o": ["γ 的位置", "α 的位置", "奖励的定义", "SARSA 用实际要做的 <code>Q(s′,a′)</code>，Q-learning 用 <code>max_{a′} Q(s′,a′)</code>"], "a": 3, "why": "一个 max 就把它从 on-policy 变成了 off-policy。"}, {"q": "老师说 SARSA 在哪种情形下早期反而更好？", "o": ["γ 很大时", "奖励稀疏时", "状态很多时", "有大量很负的后果时（如悬崖漫步）——它对随机动作是「现实」的，不像 Q-learning 那么乐观"], "a": 3, "why": "但总体上「一般你想用 Q-learning」，两者最终收敛到同一处。"}, {"q": "Q-learning 相对 SARSA 还有一个实现上的小好处：", "o": ["不需要 α", "不用等下一个动作，拿到 (s,a,r,s′) 就能更新", "不需要 ε", "不需要 Q 表"], "a": 1, "why": "因为更新里用的是 max，不依赖实际选了哪个 a′。"}, {"q": "SARSA 和 Q-learning 的更新式差别在哪？", "o": ["一个用 first visit 一个用 every visit", "<code>Q(s′,a′)</code> 对 <code>max_{a′} Q(s′,a′)</code>——用实际会做的动作，还是用最好的动作", "折扣因子不同", "学习率不同"], "a": 1, "why": "而「实际会做的」是从 ε-贪婪采的，有 ε 概率是随机动作。所以 SARSA 的目标里含探索代价，Q-learning 的不含。"}, {"q": "「Q 收敛到 <code>Q*</code>」等于「你跟随的策略是最优的」吗？", "o": ["等于", "不等于——你执行的仍是 ε-贪婪策略，以 ε 概率乱走；学的是一个策略，做的是另一个", "等于，只要 ε 足够小", "不等于，但差别可以忽略"], "a": 1, "why": "这正是 off-policy 这个词的字面意思。要得到最优策略，得在学完之后把 ε 设成 0 再执行。"}, {"q": "off-policy 的分离带来什么好处？", "o": ["可以不用折扣", "可以保证单调改进", "可以减少内存", "可以用一个很爱探索的行为策略采数据，同时学到最优策略的值，两件事互不干扰"], "a": 3, "why": "而 SARSA 做不到：它学的就是它在执行的那个策略，想让它学最优的就得让 ε 趋于 0，于是探索也没了。"}],
37: [{"q": "为什么 Q-learning 能用经验回放池，而 SARSA 不行？", "o": ["因为 Q-learning 收敛更快", "Q-learning 只需要 (s,a,r,s′) 四元组，那个 max 不需要采样；SARSA 还要知道实际采出的 a′", "因为 Q-learning 方差小", "因为 Q 表更小"], "a": 1, "why": "于是 Q-learning 能用任何来源的四元组——包括别人采的、很久以前采的。DQN 的回放池靠的正是这一条。"}, {"q": "Q-learning 和 L02 值迭代是什么关系？", "o": ["两者收敛到不同的解", "无关", "Q-learning 是值迭代的「无模型 + 采样 + 增量」版本", "值迭代是 Q-learning 的特例"], "a": 2, "why": "用采样的 (r,s′) 代替对 s′ 的求和，用增量更新代替整表替换。L03 对 L02 做的事，Q-learning 对值迭代又做了一遍。"}],
39: [{"q": "第一个 tuple <code>(s3,a1,0,s2)</code> 之后，<code>Q(s3,a1)</code> 是多少？", "o": ["0——奖励是 0，Q(s2,·) 也还是 0，这一步什么都没学到", "1", "10", "0.5"], "a": 0, "why": "这正是 TD 类方法的老毛病：信息要一格一格往回传。"}],
40: [{"q": "只要「Q 收敛到 <code>Q*</code>」，需要 GLIE 吗？", "o": ["需要，且 ε 必须趋于 0", "需要", "看 α 怎么取", "不需要——访问遍所有 (s,a) 加上 Robbins–Munro 步长就够，ε 一直很大也行"], "a": 3, "why": "Q-learning 是 off-policy 的：你可以一直乱走，照样把最优 Q 学对。"}, {"q": "那要「策略收敛到 <code>π*</code>」呢？", "o": ["条件相同", "只要状态有限", "在上面之外还得 GLIE", "只要 γ<1"], "a": 2, "why": "学对了最优 Q，不等于你在照它行动。想让行为也最优，ε 就得降下去。"}, {"q": "Q-learning 的收敛条件比 SARSA 少了哪一条？", "o": ["步长条件", "无限探索", "渐近贪婪（GLIE 的第二条）", "有限状态动作空间"], "a": 2, "why": "因为 Q-learning 的更新目标 <code>r + γ max_{a′}Q(s′,a′)</code> 里根本没有行为策略，只有 Q。"}, {"q": "这一讲和 L05 p38 是什么衔接关系？", "o": ["两讲结论矛盾", "L05 推翻了这一讲", "这一讲证明了表格下 off-policy 安全，而 L05 说三件套齐了会发散——这一讲占了前两样，缺第三样", "两讲讨论的是不同的算法"], "a": 2, "why": "L05 那张表里「② + ③（表格）」那一行指的就是这里。"}],
42: [{"q": "最大化偏差是怎么产生的？", "o": ["Q 的估计本身有偏", "样本不独立", "α 太大", "每个 Q 的估计都无偏，但取 max 之后（詹森不等式）整体被高估"], "a": 3, "why": "样本有限时总有一个动作碰巧看起来好一点，你一取 max 就立刻去利用这份运气。"}, {"q": "最大化偏差那个反例里，两个动作的真实期望奖励是多少？", "o": ["都是 0", "都是 1", "随机的", "一个 0 一个 1"], "a": 0, "why": "所以真值 Q(s,a1) = Q(s,a2) = V*(s) = 0。而每个 Q̂ 都是无偏估计——一切看起来都完美。"}, {"q": "<code>E[max(Q̂₁,Q̂₂)] ≥ max(E[Q̂₁],E[Q̂₂])</code> 这个不等号来自什么？", "o": ["大数定律", "Cauchy-Schwarz", "Jensen 不等式（max 是凸函数）", "Pinsker 不等式"], "a": 2, "why": "而且这个不等号通常是严格的：只要两个估计有噪声且不完全相关，左边就严格大于 0。"}, {"q": "用更直白的话说，最大化偏差是怎么回事？", "o": ["折扣因子取得不对", "样本太少", "估计量本身有偏", "你挑的是「这次运气最好的那个」，而不是「真的最好的那个」——运气被当成了实力"], "a": 3, "why": "在统计里这有个现成的名字：胜者的诅咒。赢家的出价总是高估了标的的真实价值。"}, {"q": "这个偏差什么时候更严重？", "o": ["折扣因子越大", "样本越多、候选越少", "样本越少、候选越多", "动作空间越小"], "a": 2, "why": "候选越多，「总有一个碰巧很高」的概率越大。课件给的出处是一篇管理科学的论文——说明这问题远不止 RL 才有。"}],
43: [{"q": "双学习为什么能得到无偏估计？", "o": ["降低了 α", "用了两倍数据", "「选动作」和「估它的值」用的是互相独立的两批样本", "取了平均"], "a": 2, "why": "用 Q₁ 选 a*，用 Q₂ 估 Q₂(s,a*)——于是 E[Q₂(s,a*)] = Q(s,a*)。"}, {"q": "课件给的那条通用戒律是什么？", "o": ["Always split your data", "Never bootstrap", "Avoid using max of estimates as estimate of max of true values", "Always use unbiased estimators"], "a": 2, "why": "「一堆估计的最大值」不是「真值的最大值」的好估计。这条戒律在挑模型、挑超参、挑配置时都适用。"}, {"q": "Double Learning 的做法是什么？", "o": ["两个估计取平均", "拆数据：用 Q1 挑出 a*，用 Q2 评估 a* 的值", "加正则项", "用更大的样本量"], "a": 1, "why": "于是「挑」的噪声和「评」的噪声是独立的。运气和实力被拆开了。"}, {"q": "这个解药的代价是什么？", "o": ["引入偏差", "没有代价", "计算量翻倍", "每一半样本量减半，估计方差变大，而且选出来的 a* 质量会下降"], "a": 3, "why": "它是「用方差换偏差」——和这门课到处都是的那笔交易方向相反。样本很少时未必划算。"}],
44: [{"q": "Double Q-learning 相对 Q-learning 的开销变化是？", "o": ["两者都不变", "两者都翻倍", "内存翻倍、每步计算量不变", "内存不变、计算翻倍"], "a": 2, "why": "数据需求则「微妙」：偏差小了，需要的探索可能反而更少。"}, {"q": "Double Q-learning 在线版本怎么实现「样本拆分」？", "o": ["按状态分区", "用奇偶步数交替", "每来一条转移抛个硬币，决定更新 Q1 还是 Q2", "事先把数据分成两堆"], "a": 2, "why": "于是两张表用的是互不重叠的样本，独立性就有了。思路和事先切一样，只是分法变成了随机分流。"}, {"q": "Double Q 真正起作用的是什么？", "o": ["两个估计取平均来降噪", "用了更大的学习率", "用了更多数据", "把「选」与「评」解耦——如果只是平均，两个有偏估计的平均还是有偏"], "a": 3, "why": "第 3 行那个 Q1+Q2 确实在平均，但那只用于行为策略（选动作去探索），和消除偏差无关。"}, {"q": "Double Q 的三个代价，课件给的答案是？", "o": ["内存翻倍、计算不变、数据需求微妙（偏差小可能反而减少所需探索）", "内存翻倍、计算翻倍、数据翻倍", "三样都不变", "内存不变、计算翻倍、数据翻倍"], "a": 0, "why": "课件用的是 might reduce amount of exploration needed due to lower bias——很克制。"}],
45: [{"q": "实验图要看的是什么？", "o": ["谁最终更好", "谁的内存占用更少", "谁的方差更小", "早期差多少——普通 Q-learning 会花大量时间去选那些被高估的次优动作"], "a": 3, "why": "两者最终都会收敛（偏差随样本增加而消失）。这是一个「偏差直接变成行为上的浪费」的例子。"}, {"q": "Double DQN 和这一节是什么关系？", "o": ["它用「当前网络选、目标网络评」来近似这个解耦；但两组权重来自同一批数据，只是缓解不是消除", "它完全消除了偏差", "它用的是完全不同的原理", "无关"], "a": 0, "why": "而 Rainbow 的消融显示 Double DQN 单独去掉几乎不掉分，因为分布式值函数已经顺带缓解了同一个偏差。"}],
47: [{"q": "课件要求你能对这三个算法做什么比较？", "o": ["更新有多快、（非正式的）偏差方差、计算代价", "只比代码行数", "只比内存", "只比收敛速度"], "a": 0, "why": "外加：说出收敛到 Q* 和 π* 各需要什么条件，并给出至少一种保证做法。"}, {"q": "SARSA 和 Q-learning 该选哪个？", "o": ["永远选 SARSA", "永远选 Q-learning", "看状态空间大小", "学习期间的表现也要紧（在线、有代价）⇒ SARSA；只关心最终策略（离线学完再部署）⇒ Q-learning"], "a": 3, "why": "SARSA 会把探索的风险算进去，主动避开「失手代价高」的路线。这个区分比记住两个更新式有用得多。"}]
};

var N = [
{"r": [1, 2], "t": "这一讲要干什么", "star": 2, "one": "不知道世界怎么运作时，<b>怎么学出一个好策略</b>。", "pts": ["五节：广义策略迭代 → 探索的必要性 → 蒙特卡洛控制 → TD 控制（SARSA / Q-learning） → 最大化偏差。", "<b>这一讲在课程结构里的位置可以用一句话说清：<span class='k'>L02 有模型做控制，L03 无模型做评估，这一讲是无模型做<b>控制</b></span>。</b><span class='w'>把这个 2×2 的格子填满，前四讲就齐了</span>——<b>而剩下的那一格（无模型 + 控制）正是真实问题的形状。</b><span class='k'>所以这一讲是整门课第一次给出「能在真实问题上跑」的算法。</span>", "<b>目录那五节里，第 5 节「最大化偏差」是最容易被当成边角料的，但它其实是整讲最有用的一节。</b><span class='k'>它处理的问题是：当你要从一堆带噪声的估计里挑最好的那个时，会发生什么</span>。<b>答案是：你挑出来的那个，它的估计值系统性地偏高——哪怕每一个估计本身都是无偏的。</b><span class='w'>这件事在任何「选最优」的场合都成立，远不止 RL</span>。<b>而它的解药（把「选」和「评」拆开用不同的数据）同样是通用的。</b>", "<b>这一讲还会第一次把两个词说清楚，而它们是这门课后半程的基本词汇：<span class='k'>on-policy 和 off-policy</span>。</b><span class='w'>p9 给定义，p35 给第一个真正的 off-policy 算法（Q-learning）</span>，<b>而 L05 p38 会告诉你 off-policy 加上函数逼近会出什么事。</b><span class='k'>所以这一讲是「off-policy 在表格下是安全的」这个结论的出处</span>——<b>认清它安全的条件，才知道它后来为什么不安全。</b>", "<b>再提一句课件给的补充阅读，它标得很精确：<em>SB Sections 5.2-5.4, 6.4, 6.5, 6.7</em>。</b><span class='k'>5.2–5.4 是蒙特卡洛控制，6.4 是 SARSA，6.5 是 Q-learning，6.7 是 Double Q-learning</span>——<b>正好对应这一讲的后四节。</b><span class='w'>而 6.6（期望 SARSA）课件跳过了</span>，<b>那是一个介于 SARSA 和 Q-learning 之间的算法：用期望代替采样的那个动作，方差更小。</b>"], "tip": {"t": "课件自己标的来源", "v": "结构紧跟 David Silver 的 Lecture 5；对应 Sutton &amp; Barto 的 5.2–5.4、6.4、6.5、6.7。"}, "quote": "Lecture 4: <b>Model Free Control</b> &nbsp;·&nbsp; Structure closely follows much of David Silver's Lecture 5. For additional reading please see <b>SB Sections 5.2-5.4, 6.4, 6.5, 6.7</b> &nbsp;|&nbsp; 1 Generalized Policy Iteration &nbsp;·&nbsp; 2 Importance of Exploration &nbsp;·&nbsp; 3 Monte Carlo Control &nbsp;·&nbsp; 4 Temporal Difference Methods for Control &nbsp;·&nbsp; 5 Maximization Bias"},
{"r": [3, 4], "t": "从评估到控制", "star": 2, "one": "上一讲问「这个策略有多好」，这一讲问「<b>怎么学到一个好的</b>」。", "pts": ["上一讲：模型未知下的<b>评估</b>。", "这一讲：模型未知下的<b>控制</b>。", "下一讲：值函数逼近。", "<b>「评估」到「控制」这一步，多出来的东西只有一样，但它改变了问题的性质：<span class='k'>你现在要自己决定做什么</span>。</b><span class='w'>而一旦你能决定，你就同时决定了会看到什么数据</span>——<b>于是「学什么」和「采什么」纠缠在了一起。</b><span class='k'>这就是探索问题的来源，也是第 2 节要专门讲它的理由。</span><b>评估时没有这个麻烦：策略是给定的，数据怎么来不由你定。</b>", "<b>把前三讲和这一讲排成一张 2×2 的表，整个上半门课的结构就一目了然了。</b><span class='k'>有模型 + 评估：L02 的 MRP 三条路</span>；<span class='k'>有模型 + 控制：L02 的策略迭代与值迭代</span>；<span class='k'>无模型 + 评估：L03 的 MC 与 TD</span>；<span class='k'>无模型 + 控制：<b>这一讲</b></span>。<span class='w'>而这一讲的算法，几乎每一个都是把前两格的东西拼起来</span>——<b>L02 的广义策略迭代做骨架，L03 的 MC/TD 填进「评估」那一步。</b>", "<b>还有一层区别值得点出来，它解释了为什么控制比评估难得多。</b><span class='k'>评估问题的答案是一个<b>固定</b>的量：给定 π，<code>V^π</code> 就定了，你只是在估一个常数</span>；<span class='w'>控制问题里你要估的那个东西<b>一直在动</b></span>——<b>策略改了，<code>Q^π</code> 就变了，而你的数据还是旧策略采的。</b><span class='k'>于是你在追一个移动的目标，而且是你自己把它推动的。</span><b>这正是 p22 要正面承认的那个麻烦。</b>"], "quote": "Last time: Policy evaluation with no knowledge of how the world works (MDP model not given) &nbsp;·&nbsp; <b>This time: Control (making decisions) without a model of how the world works</b> &nbsp;·&nbsp; Next time: Value function approximation &nbsp;|&nbsp; Last time: how good is a specific policy? &nbsp;·&nbsp; <b>Today: how can we learn a good policy?</b>", "tbl": {"head": ["", "评估（这个策略值多少）", "控制（哪个策略最好）"], "rows": [["<b>有模型</b>", "<span class='k'>L02：模拟 / 解析解 / 动态规划</span>", "<span class='k'>L02：策略迭代、值迭代</span>"], ["<b>无模型</b>", "<span class='k'>L03：蒙特卡洛、时序差分</span>", "<b>本讲：MC 控制、SARSA、Q-learning</b>"], ["多出来的麻烦", "—", "<span class='w'>你的决定改变了你会看到的数据 ⇒ 探索问题</span>"]]}},
{"r": [5, 6], "t": "四要素里今天碰哪几个", "one": "优化 · 延迟后果 · 探索。<span class='w'>泛化还不碰。</span>", "pts": ["<b>探索</b>第一次成为算法里必须处理的东西——前三讲它一直只是个说法。", "<b>四要素里这一讲碰了三个，没碰的那个是「泛化」，而这个缺席是有意的。</b><span class='k'>这一讲全程假设表格表示——每个 <code>(s,a)</code> 对各有一个独立的格子</span>。<b>于是所有收敛性结论都干净利落。</b><span class='w'>而下一讲（L05）一引入函数逼近，这些结论就开始一条条失效</span>——<b>Q-learning + 函数逼近可能直接发散。</b><span class='k'>所以这一讲是「最后一片干净的地面」，值得先把它踩实。</span>", "<b>「探索」第一次在这门课里成为必需品，而它成为必需品的理由可以说得很精确。</b><span class='k'>你要估 <code>Q(s,a)</code>，就必须真的在 <code>s</code> 做过 <code>a</code></span>——<b>没试过的动作，你对它的估计没有任何数据支撑。</b><span class='w'>而一个确定性的贪心策略永远只做它当前认为最好的那个动作</span>，<b>于是其余动作的估计永远停在初始值上。</b><span class='k'>这就是 p15 那两个坑里的第一个，也是 ε-贪婪存在的全部理由。</span>", "<b>把「四要素」这个清单当成一张进度表看，到这一讲为止的进度是这样的。</b><span class='k'>优化：L02 有模型时解决了，这一讲给无模型版本</span>；<span class='k'>延迟后果：L02 的贝尔曼方程、L03 的 TD 都在处理它</span>；<span class='k'>探索：<b>这一讲第一次正面碰它</b>（第 2 节）</span>；<span class='w'>泛化：还没碰，要到 L05 的函数逼近</span>。<b>而第一讲还提过第五样——统计与计算上的高效——那一样要到 L07 p17 才被正式提出。</b>"], "quote": "Today: Learning to Control Involves &nbsp;·&nbsp; <b>Optimization</b>: Goal is to identify a policy with high expected rewards &nbsp;·&nbsp; <b>Delayed consequences</b>: May take many time steps to evaluate whether an earlier decision was good or not &nbsp;·&nbsp; <b>Exploration</b>: Necessary to try different actions to learn what actions can lead to high rewards"},
{"r": [7, 7], "t": "今天的清单", "one": "广义策略改进 → 探索 → MC 控制 → SARSA / Q-learning → 最大化偏差。", "quote": "Today: Model-free Control &nbsp;·&nbsp; <b>Generalized policy improvement</b> &nbsp;·&nbsp; <b>Importance of exploration</b> &nbsp;·&nbsp; <b>Monte Carlo control</b> &nbsp;·&nbsp; <b>Model-free control with temporal difference (SARSA, Q-learning)</b> &nbsp;·&nbsp; <b>Maximization bias</b>", "pts": ["<b>这五节是一条很清楚的递进，而且每一节都在补上一节留下的缺口。</b><br><b>① 广义策略迭代</b>：<span class='k'>把 L02 的框架搬到无模型情形，发现必须改估 Q</span>。<br><b>② 探索</b>：<span class='w'>发现贪心策略学不到没试过的动作</span>，引入 ε-贪婪。<br><b>③ MC 控制</b>：<span class='k'>把 L03 的蒙特卡洛填进「评估」那一步</span>。<br><b>④ TD 控制</b>：<span class='k'>换成 TD，得到 SARSA 和 Q-learning</span>。<br><b>⑤ 最大化偏差</b>：<span class='w'>发现前面所有算法都有一个共同的系统性毛病</span>，并给出解药。", "<b>第 ⑤ 节值得单独说一句，因为它的位置很特别：它不是「又一个算法」，是对前面全部算法的一次体检。</b><span class='k'>MC 控制、SARSA、Q-learning 都要对估计出来的 Q 取 <code>arg max</code> 或 <code>max</code></span>——<b>而那一步会系统性地高估。</b><span class='w'>所以它不是某个算法的 bug，是「从噪声估计里挑最好的」这个动作本身的性质</span>。<b>这也是为什么它值得被单列成一节。</b>"]},
{"r": [8, 8], "t": "什么场合用得上", "star": 2, "one": "两种情况都归到「无模型」：<b>不知道模型</b>，或<b>知道但算不动</b>。", "pts": ["双陆棋、围棋、机器人行走、直升机、Robocup、自动驾驶、广告投放、入侵物种治理、病人治疗。", "<b>这一页列的两种处境，第二种最容易被忽略，但它其实更常见，值得单独说。</b><span class='k'>第一种：模型未知，但能采样</span>——<b>比如客户点不点广告，你不知道他的决策模型，但你可以投出去看看。</b><span class='k'>第二种：模型<b>已知</b>，但直接用它算不动，只能采样</span>——<b>围棋就是最好的例子：规则完全已知，但状态数是天文数字，没法做 L02 那套动态规划。</b><span class='w'>于是你只能「模拟着走几步看看」，也就是采样。</span>", "<b>第二种处境说明了一件事：<span class='k'>「无模型方法」这个名字有点误导</span>。</b><b>它真正的意思是「只通过采样来使用模型」，而不是「没有模型」。</b><span class='w'>AlphaGo 用的蒙特卡洛树搜索就是典型——它完全知道围棋规则，但它用的是「模拟很多局」而不是「枚举所有局面」</span>。<span class='k'>所以这一讲的方法，在你明明有模型的时候同样适用</span>——<b>只要那个模型大到你算不动。</b>", "<b>这个清单还透露了一个共同点，值得注意：<span class='w'>列出的应用里，大部分都是「试错很贵」的</span>。</b><b>自动驾驶、直升机、病人治疗、入侵物种管理</b>——<span class='k'>每一个都不是能随便试的场合</span>。<b>而这一讲的算法恰恰要靠大量试错。</b><span class='w'>这个张力这一讲不解决，它要到第七讲（模仿学习）和第十一讲（探索）才被正面处理</span>——<b>但现在就该意识到它在那里。</b>"], "say": "老师点名了 <b>1994 年的双陆棋</b>（Tesauro，用神经网络）——这是 RL 第一次在像样规模的问题上成功。她补了一句：神经网络之后沉寂了十来年才回来。<br>第二种情况她举的是<b>气候模拟</b>：模型写得出来，但跑一次贵到只能当采样器用。", "quote": "Many applications can be modeled as a MDP: Backgammon, Go, Robot locomotion, Helicopter flight, Robocup soccer, Autonomous driving, Customer ad selection, Invasive species management, Patient treatment &nbsp;|&nbsp; For many of these: <b>MDP model is unknown but can be sampled</b> &nbsp;·&nbsp; <b>MDP model is known but it is computationally infeasible to use directly, except through sampling</b>"},
{"r": [9, 9], "t": "on-policy 与 off-policy", "star": 3, "one": "数据是<b>你正在跑的那个策略</b>采的，还是<b>别的策略</b>采的。", "pts": ["<b>on-policy</b>：按 π 行动，学 π。", "<b>off-policy</b>：按 π_b 行动，却在学另一个策略。", "<b>这两个词是这门课后半程的基本词汇，而它们的区别只有一句话：<span class='k'>你要评估的那个策略，和产生数据的那个策略，是不是同一个</span>。</b><b>是同一个 ⇒ on-policy；不是 ⇒ off-policy。</b><span class='w'>就这么简单，但后果极其深远。</span>", "<b>off-policy 为什么值得单独有个名字？因为它能买到三样 on-policy 买不到的东西。</b><b>① 复用旧数据</b>：<span class='k'>策略更新之后，之前采的数据仍然能用</span>（<b>DQN 的回放池靠的就是这一条</b>）。<br><b>② 从别人的数据里学</b>：<span class='k'>人类演示、历史日志、别的 agent 跑出来的轨迹</span>。<br><b>③ 一边探索一边学最优</b>：<span class='k'>行为上随机地试，学的却是贪心策略的值</span>（<b>这正是 Q-learning 干的事，p35 会讲</b>）。", "<b>而代价同样是三条，而且它们在后面几讲会反复出现。</b><span class='w'>① 数据分布不对</b>：你估的是「在别人走过的地方」，而你关心的是「你自己会走到的地方」</span>（<b>L07 p30 的 <code>εT²</code>、L09 p33 的那个算不出的 <code>ρ^{π̃}</code>，根子都在这里</b>）。<br><span class='w'>② 要重要性修正</b>：而修正会带来方差</span>（<b>L03 讲过</b>）。<br><span class='w'>③ 收敛保证变弱</b>：表格下还好，一加函数逼近就可能发散</span>（<b>L05 p38 的致命三件套</b>）。", "<b>这一讲会给出一个很干净的参照点，值得先记住：<span class='k'>在表格表示下，off-policy 是安全的</span>。</b><b>Q-learning 在表格下收敛到 <code>Q*</code>（p40），条件只是「每个 <code>(s,a)</code> 被访问无穷多次」加上步长条件。</b><span class='w'>所以 off-policy 本身不是问题，问题是它和函数逼近、自举凑在一起</span>——<b>而那正是 L05 p38 要讲的三件套。</b><span class='k'>认清这一讲里它有多安全，才能理解那里为什么致命。</span>"], "say": "老师现场画了个直觉：你试过「一直做 a1」，也试过「一直做 a2」，<b>但从没试过「先 a1 再 a2」</b>。off-policy 学习就是要把这些片段拼起来，去推断一条你从未真正走过的路。Q-learning 就干这个。", "quote": "<b>On-policy learning</b>: Direct experience &nbsp;·&nbsp; Learn to estimate and evaluate a policy <b>from experience obtained from following that policy</b> &nbsp;|&nbsp; <b>Off-policy learning</b>: Learn to estimate and evaluate a policy <b>using experience gathered from following a different policy</b>", "tbl": {"head": ["", "on-policy", "off-policy"], "rows": [["数据来自谁", "<span class='k'>就是要评估的那个策略</span>", "<span class='w'>另一个策略</span>"], ["能复用旧数据吗", "<span class='w'>不能</span>", "<span class='k'>能（回放池）</span>"], ["能从别人的日志学吗", "<span class='w'>不能</span>", "<span class='k'>能</span>"], ["本讲的代表", "<b>SARSA</b>（p31）", "<b>Q-learning</b>（p35）"], ["表格下安全吗", "<span class='k'>安全</span>", "<span class='k'>安全（p40）</span>"], ["加函数逼近呢", "<span class='k'>收敛（会抖）</span>", "<span class='w'>可能发散（L05 p38）</span>"]]}, "res": {"tag": "已核", "v": "<b>这一页是你整个课题所处的那一格的正式命名：<span class='k'>你做的是 off-policy 学习</span>。</b><br><br><span class='w'>你手上的日志来自 AFlow 跑过的那些配置，而你想评估的是没跑过的配置</span>——<b>按课件的定义，这就是 <em>using experience gathered from following a different policy</em>，一字不差。</b><br><br><b>而这一页真正的价值，是它给了你一个<span class='k'>干净的参照点</span>：</b><span class='w'>在表格表示下，off-policy 是完全安全的</span>。<b>Q-learning 在表格下收敛到 <code>Q*</code>，条件只有两条：每个 <code>(s,a)</code> 被访问无穷多次，加上标准的步长条件（p40）。</b><span class='k'>所以「off-policy 很危险」这句话是不准确的</span>——<b>危险的是 off-policy <b>加上</b>函数逼近<b>加上</b>自举（L05 p38 的三件套，课件用的词是 intersection）。</b><br><br><b>这给你一个很实际的诊断思路：<span class='k'>如果你把状态粗粒度化到可以查表，你的 off-policy 问题就消失了</span>。</b><span class='w'>代价是状态表示变粗，可能丢掉区分不同 query 的信息</span>（<b>也就是混叠，L08 p10</b>）。<b>于是你面对的是一个可以主动选择的取舍，而不是一个必须接受的困境</b>：<span class='k'>细状态 + 函数逼近 + 可能发散，还是粗状态 + 查表 + 有保证</span>。<b>L02 p20 的科研格算过：你的状态数可能只有几百到几千，粗粒度查表是真的可行的。</b><span class='w'>这条路值得作为 FQE 的对照组认真试一次。</span>", "ref": "课件 p9 定义 · p40 收敛条件 · L05 p38 · L02 p20 科研格 · L08 p10 科研格"}},
{"r": [10, 10], "t": "目录：广义策略迭代", "quote": "Table of Contents &nbsp;·&nbsp; <b>1 Generalized Policy Iteration</b> &nbsp;·&nbsp; 2 Importance of Exploration &nbsp;·&nbsp; 3 Monte Carlo Control &nbsp;·&nbsp; 4 Temporal Difference Methods for Control &nbsp;·&nbsp; 5 Maximization Bias", "one": "第一节：<b>把 L02 的策略迭代搬到无模型情形</b>。", "pts": ["<b>「广义策略迭代」这个名字里的「广义」，指的是放宽了 L02 那个严格的循环。</b><span class='k'>L02 的策略迭代要求「评估到收敛，再改进一次」</span>；<span class='w'>广义版本只要求「评估和改进交替进行」，不规定各做多久</span>。<b>于是值迭代（评估一轮就改进）、MC 控制（跑完一个片段就改进）、SARSA（每走一步就改进）全都是它的特例。</b><span class='k'>这个框架能装下这一讲的所有算法。</span>", "<b>这一节（p11–p15）只有五页，但它完成了一次关键的转换，值得先把结论记住。</b><span class='k'>转换是：从估 <code>V</code> 改成估 <code>Q</code></span>——<b>因为无模型情形下，从 <code>V</code> 推不出动作。</b><span class='w'>而这一转换会立刻带出两个新麻烦（p15）</span>：<b>确定性策略试不到所有动作，以及改进用的是估计而非精确的 Q。</b><span class='k'>这两个麻烦分别由第 2 节和第 5 节来处理。</span>"]},
{"r": [11, 11], "t": "复习：策略迭代", "star": 2, "one": "评估 → 改进 → 再评估，直到策略不变。", "eq": "π′(s) = arg max_a [ R(s,a) + γ Σ_{s′} P(s′|s,a) V^π(s′) ]\n     = arg max_a  Q^π(s,a)", "pts": ["<span class='w'>问题</span>：这个式子里 <code>R</code> 和 <code>P</code> 都得知道。", "<b>这一页把 L02 的策略迭代原样抬了出来，而要看的是那个等号右边：<code>arg max_a Q^π(s,a)</code>。</b><span class='k'>左边那个长式子要用 <code>R</code> 和 <code>P</code>，右边只要 <code>Q</code></span>。<b>两者在有模型时完全等价，而在无模型时天差地别。</b><span class='w'>这个观察就是下一页的全部内容。</span>", "<b>把「无模型」这个限制具体化：它卡住的是哪一步？</b><span class='k'>评估那一步 L03 已经解决了——蒙特卡洛和 TD 都不需要模型</span>。<span class='w'>卡住的是<b>改进</b>那一步</span>：<b>要从 <code>V</code> 推出动作，你必须算 <code>R(s,a) + γΣP(s′|s,a)V(s′)</code>，而这里有 <code>P</code> 和 <code>R</code>。</b><span class='k'>于是「无模型做控制」这个问题，困难点不在评估，在改进。</span>", "<b>顺带确认一下这个等式本身为什么成立，它其实就是 Q 的定义。</b><span class='k'><code>Q^π(s,a) = R(s,a) + γΣ_{s′}P(s′|s,a)V^π(s′)</code></span>（<b>L02 p34</b>）——<b>「做了 a，然后照 π 走到底」。</b><span class='w'>所以 <code>arg max_a</code> 作用在等号两边是同一件事</span>。<b>区别只在于：左边那个写法要你自己去算 <code>R</code> 和 <code>P</code>，右边那个假设你手上已经有一张 Q 表。</b>"], "quote": "Recall Policy Iteration &nbsp;·&nbsp; Policy evaluation: compute V^π &nbsp;·&nbsp; Policy improvement: <b>π′(s) = arg max_a [R(s,a) + γ Σ_{s′} P(s′|s,a) V^π(s′)] = arg max_a Q^π(s,a)</b> &nbsp;·&nbsp; <b>Now want to do the above two steps without access to the true dynamics and reward models</b>"},
{"r": [12, 12], "t": "把 V 换成 Q", "star": 3, "one": "既然 <code>arg max_a Q</code> 不需要模型，那就<b>直接估 Q</b>。", "pts": ["<code>V</code> 要配上模型才能挑动作；<code>Q</code> 自己就够。", "<span class='k'>这是整讲的第一步棋，后面全部从这里长出来。</span>", "<b>这一页的改动只有一个字母——把 <code>V</code> 换成 <code>Q</code>——但它解决了上一页那个卡点。</b><span class='k'>因为 <code>Q(s,a)</code> 已经把「做了 a 之后会怎样」预先算进去了</span>，<b>于是选动作只要 <code>arg max_a Q(s,a)</code>，一个模型都不用。</b><span class='w'>而 <code>V(s)</code> 只告诉你「这个状态值多少」，不告诉你「该做什么」</span>——<b>要从它推出动作，必须穿过模型。</b>", "<b>这就是 <code>kp</code> 第一条那句话的意思：<span class='k'>控制必须估 Q，不是 V——因为从 V 贪心要穿过模型</span>。</b><b>而这件事的影响远超这一讲</b>：<span class='w'>第六讲的 DQN 学的是 Q 不是 V；第八讲说「为什么是 Q-learning 不是 V-learning」也是同一个理由</span>。<span class='k'>只要你没有模型，又想直接选动作，你就必须有 Q。</span>", "<b>代价也该一并记下：<span class='w'>Q 表比 V 表大 <code>|A|</code> 倍</span>。</b><b>V 是每个状态一个数，Q 是每个状态–动作对一个数。</b><span class='k'>于是存储和所需的数据量都乘了 <code>|A|</code></span>——<b>因为你现在要把每个动作都试够次数，而不只是走到每个状态。</b><span class='w'>动作多的问题上，这个代价很实在</span>，<b>也是为什么连续动作空间下大家宁愿用策略梯度（第八讲 p8）。</b>"], "say": "这个主意是课堂上学生提的。另一位同学先提了「那就把模型估出来」——老师说那也完全合理（她本人「对模型很偏心」），但今天走的是无模型这条路。", "quote": "Model Free Policy Iteration &nbsp;·&nbsp; Initialize policy π &nbsp;·&nbsp; Repeat: &nbsp;·&nbsp; <b>Policy evaluation: compute Q^π</b> &nbsp;·&nbsp; Policy improvement: update π"},
{"r": [13, 13], "t": "用 MC 估 Q", "one": "把上一讲的 MC 评估里所有 <code>s</code> 换成 <code>(s,a)</code>。", "eq": "N(s,a)=0, G(s,a)=0, Q(s,a)=0\n每个片段：对访问到的 (s,a)（首次 或 每次）\n  N(s,a) += 1;  G(s,a) += G_{i,t}\n  Q^π(s,a) = G(s,a) / N(s,a)", "pts": ["首次访问 / 每次访问的取舍和上一讲一样。", "<b>这个算法和 L03 的蒙特卡洛策略评估一模一样，只有一处不同，而那一处正是这一讲的主题。</b><span class='k'>L03 统计的是 <code>N(s)</code> 和 <code>G(s)</code>，这里统计的是 <code>N(s,a)</code> 和 <code>G(s,a)</code></span>——<b>多了一个下标。</b><span class='w'>而这一个下标带来的后果是：你必须在每个状态上把每个动作都试过足够多次</span>，<b>否则某些格子的计数永远是 0，那里的 Q 永远停在初始值。</b><span class='k'>p15 的第一个坑说的就是这件事。</span>", "<b>「first visit」和「every visit」这两种变体在这里仍然适用，而选哪种影响不大，但原因值得知道。</b><span class='k'>first visit：一个片段里同一个 <code>(s,a)</code> 只计第一次，估计无偏</span>；<span class='w'>every visit：每次都计，有偏但渐近一致，而且数据利用率更高</span>。<b>实践中 every visit 更常用，因为片段里重复访问很常见。</b><span class='k'>这个取舍 L03 讲过，这里只是把它搬到了 <code>(s,a)</code> 这一层。</span>"], "quote": "MC for On Policy Q Evaluation &nbsp;·&nbsp; Initialize N(s,a) = 0, G(s,a) = 0, Q(s,a) = 0 &nbsp;·&nbsp; Using policy π sample episode &nbsp;·&nbsp; G_{i,t} = r_{i,t} + γr_{i,t+1} + γ²r_{i,t+2} + ... &nbsp;·&nbsp; For each (s,a) visited: <b>N(s,a) += 1, G(s,a) += G_{i,t}, Q(s,a) = G(s,a)/N(s,a)</b>"},
{"r": [14, 14], "t": "有了 Q，改进变得极简单", "one": "直接取 arg max。", "eq": "π_{i+1}(s) = arg max_a  Q^{π_i}(s,a)", "quote": "<b>π(s) = arg max_a Q(s,a)</b>", "pts": ["<b>有了 Q 之后，改进这一步简单到一行就能写完，而且完全不需要模型。</b><span class='k'>对每个状态，把所有动作的 <code>Q(s,a)</code> 比一遍，挑最大的那个</span>。<b>代价是 <code>O(|A|)</code>，而且只用到你手上的那张表。</b><span class='w'>对比 L02 p35 的改进步骤——那里每个 <code>(s,a)</code> 对都要做一次对 <code>s′</code> 的求和，代价是 <code>O(|S||A|)</code>，而且要有 <code>P</code></span>。<b>换成 Q 之后，这一步从「要模型、要计算」变成了「查表、比大小」。</b>", "<b>但这一行里藏着这一讲后面两个大麻烦的种子，值得先点出来。</b><span class='w'>麻烦一：<code>arg max</code> 产生的是<b>确定性</b>策略</span>——<b>而确定性策略学不到它没试过的动作（p15 第一个坑）。</b><span class='w'>麻烦二：这个 <code>Q</code> 是<b>估计</b>出来的，带噪声</span>——<b>而对带噪声的估计取 max，会系统性地偏高（p42 的最大化偏差）。</b><span class='k'>这一讲剩下的内容，基本就是在处理这两个麻烦。</span>", "<b>还有一个实现上的细节值得先说：<code>arg max</code> 打平时怎么办。</b><span class='k'>学习早期大量格子还是初始值，打平会非常频繁</span>（<b>p26 的检验题会让你看到</b>）。<span class='w'>而大多数库的 <code>argmax</code> 返回第一个最大值，于是你的「贪心策略」会系统性地偏向动作编号小的那个</span>。<b>这不是 bug，但它会让你误以为算法学到了什么。</b><span class='k'>讲究的实现会在打平时随机挑一个。</span>"]},
{"r": [15, 15], "t": "但这条路上有两个坑", "star": 3, "one": "算法写出来了，可它<b>跑不动</b>。", "pts": ["<span class='w'>坑一</span>：π 若是确定性的，那 <code>a ≠ π(s)</code> 的 Q 你<b>永远没有数据</b>。", "<span class='w'>坑二</span>：改进用的 Q 只是<b>估出来的</b>，不是精确值——单调改进的保证还在吗？", "还有一个实践问题：评估和改进该怎么交错？", "<b>课件这一页把两个坑并排摆了出来，而它们的性质完全不同，值得分开记。</b><br><b>坑一（探索）</b>：<span class='k'>确定性策略只会做一个动作，所以其余动作的 <code>Q</code> 永远估不出来</span>——<b>这是个<span class='w'>数据</span>问题：你根本没有那些格子的样本。</b><br><b>坑二（估计误差）</b>：<span class='k'>改进这一步现在用的是<b>估计</b>的 <code>Q</code>，不是真的 <code>Q</code></span>——<b>这是个<span class='w'>统计</span>问题：样本有限，估计有噪声。</b>", "<b>坑一的严重程度值得想清楚，它比听起来糟。</b><span class='w'>不只是「那些动作估不准」，而是「它们的估计完全来自初始值」</span>。<b>如果你把 Q 初始化为 0，而真实的 Q 全是正的，那么没试过的动作看起来都很差</b>——<span class='k'>于是贪心策略永远不会去试它们，于是它们永远没有数据</span>。<b>这是一个自我锁死的循环。</b><span class='w'>（反过来，如果你把 Q 初始化得很高——「乐观初始化」——没试过的动作看起来很好，贪心策略会主动去试。这是一种不用 ε 的探索办法。）</span>", "<b>坑二的后果要到 p42 才完整展开，但现在可以先给一个直觉。</b><span class='k'>L02 的策略改进定理（p39）保证严格单调改进，前提是 <code>Q</code> 算得<b>精确</b></span>；<span class='w'>而这里 <code>Q</code> 是估的，于是那个定理的前提不成立</span>。<b>更糟的是：误差不是随机地上下浮动，<code>arg max</code> 会<b>系统性地</b>挑中那些因为噪声而偏高的动作。</b><span class='k'>p22 会正式把这件事说破，p42 会量化它。</span>", "<b>课件最后那个问句 <em>How to interleave policy evaluation and improvement?</em> 也值得注意，它预告了一个设计自由度。</b><span class='k'>L02 的策略迭代是「评估到收敛，再改进一次」；值迭代是「评估一轮就改进」</span>。<b>无模型情形下这个谱更宽</b>——<span class='w'>你可以跑完一个片段再改进（MC 控制，p25），也可以每走一步就改进（SARSA，p31）</span>。<b>而这个选择会直接影响算法的收敛速度和稳定性。</b>"], "say": "课堂上有同学一句话点破坑一：「我们从来不探索」。老师把它说得更准：不是采不到不同轨迹，而是<b>同一个状态你永远只会试那一个动作</b>，于是策略改进拿不到任何新信息，只能原地踏步。", "quote": "May need to modify policy evaluation: <b>If π is deterministic, can't compute Q(s,a) for any a ≠ π(s)</b> &nbsp;·&nbsp; How to interleave policy evaluation and improvement? &nbsp;·&nbsp; <b>Policy improvement is now using an estimated Q</b>", "tbl": {"head": ["", "坑一：探索", "坑二：估计误差"], "rows": [["性质", "<span class='w'>数据问题——那些格子没样本</span>", "<span class='w'>统计问题——样本有限，估计有噪声</span>"], ["来源", "<code>arg max</code> 产生确定性策略", "<code>Q</code> 是估出来的，不是精确的"], ["后果", "<b>自我锁死：不试 ⇒ 没数据 ⇒ 看起来差 ⇒ 更不试</b>", "<b>取 max 会系统性偏高</b>"], ["解药", "<span class='k'>ε-贪婪（p18）/ 乐观初始化</span>", "<span class='k'>双学习（p43）</span>"], ["在哪一节处理", "第 2 节（p16 起）", "第 5 节（p41 起）"]]}},
{"r": [16, 16], "t": "目录：探索的重要性", "quote": "Table of Contents &nbsp;·&nbsp; 1 Generalized Policy Iteration &nbsp;·&nbsp; <b>2 Importance of Exploration</b> &nbsp;·&nbsp; 3 Monte Carlo Control &nbsp;·&nbsp; ...", "one": "第二节：<b>贪心策略学不到它没试过的动作，怎么办</b>。", "pts": ["<b>这一节只处理上一节的第一个坑（探索），第二个坑（估计误差）要留到第 5 节。</b><span class='k'>而解法出奇地简单：别总是贪心，偶尔随机试一下</span>。<b>简单到让人怀疑它对不对——所以 p20 会专门证明：加了随机性之后，单调改进<b>仍然</b>成立。</b><span class='w'>那个证明是这一讲最该自己推一遍的东西。</span>", "<b>这一节还会给出一个更深的结论：<span class='k'>光「偶尔随机」不够，随机的程度还得随时间衰减</span>。</b><b>否则你永远在以 ε 的概率做蠢事，最终策略不是最优的。</b><span class='w'>而「衰减到多快」不能随便定</span>——<b>太快则探索不够，太慢则永远不收敛。</b><span class='k'>p23 的 GLIE 用两个条件把这件事说死了。</span>", "<b>顺带说清这一节和第 5 节的分工，免得读到 p42 时觉得突然。</b><span class='k'>这一节处理的是「没有数据」——某些 <code>(s,a)</code> 从没被试过</span>；<span class='w'>第 5 节处理的是「数据有限」——试过了，但样本少所以估计有噪声</span>。<b>两件事都源自 p15 那一页，但药完全不同</b>：<b>前者靠随机化去采到数据，后者靠拆分数据去消除偏差。</b>"]},
{"r": [17, 17], "t": "带探索的策略评估", "star": 2, "one": "既要试遍所有 <code>(s,a)</code>，又要保证之后照 π 走。", "pts": ["要求：估出来的 <code>Q^π</code> 要好到<b>足以让策略改进仍然是单调的</b>。", "好消息：<span class='k'>对某一类策略，可以保证所有 (s,a) 都被试到，且 Q 渐近收敛到真值。</span>", "<b>课件那句 <em>Need to try all (s,a) pairs but then follow π</em> 把困难说得很精确，值得拆开。</b><span class='k'>「试所有 <code>(s,a)</code>」是为了有数据</span>；<span class='k'>「然后照 π 走」是因为 <code>Q^π</code> 的定义就是「做了 a 之后<b>照 π</b> 走到底」</span>（<b>L02 p34 的定义</b>）。<b>两个要求有张力：前者要你偏离 π，后者要你跟着 π。</b><span class='w'>于是「在第一步偏离、之后跟随」成了一个很自然的折中</span>——<b>那正是「探索性起始」（exploring starts）这个经典办法。</b>", "<b>但探索性起始有一个很强的前提，实践中常常不成立，值得知道为什么课件没走这条路。</b><span class='k'>它要求你能把系统<b>重置到任意 <code>(s,a)</code></b> 作为起点</span>。<span class='w'>仿真里做得到，真实系统里基本做不到</span>——<b>你没法把机器人瞬移到某个姿态，也没法让病人回到某个病程阶段。</b><span class='k'>（L09 p25 的 vine 采样法也卡在同一个前提上。）</span><b>所以课件转向了另一条路：不改起点，改策略本身——让它自己带一点随机性。</b>", "<b>最后那句 <em>For certain classes of policies</em> 是一个很重要的限定，它说明解法的形状。</b><span class='k'>不是「任何策略都行」，而是「存在某一类策略，它能保证所有 <code>(s,a)</code> 都被试到」</span>。<b>而这一类策略的最简单代表就是下一页的 ε-贪婪。</b><span class='w'>它的关键性质是：<b>每个动作的概率都严格大于 0</b></span>——<b>于是只要跑得够久，每个 <code>(s,a)</code> 都会被访问无穷多次。</b>"], "quote": "Want to compute a model-free estimate of Q^π &nbsp;·&nbsp; In general seems subtle &nbsp;·&nbsp; <b>Need to try all (s,a) pairs but then follow π</b> &nbsp;·&nbsp; Want to ensure resulting estimate Q is good enough so that policy improvement is a monotonic operator &nbsp;·&nbsp; <b>For certain classes of policies can ensure all (s,a) pairs are tried such that asymptotically Q converges to the true value</b>"},
{"r": [18, 18], "t": "ε-贪婪策略", "star": 3, "one": "<b>大部分时候选最好的，偶尔随便试一个。</b>", "eq": "π(a|s) =\n   arg max_a Q(s,a)     以概率 1 − ε\n   任意动作 a           各以概率 ε/|A|", "pts": ["简单到近乎粗暴，但<span class='k'>足够</span>——后面两页会证明它仍然保单调改进。", "注意随机那一份<b>也包含当前最优动作</b>，所以最优动作的总概率是 <code>1−ε+ε/|A|</code>。", "<b>这个定义里有一个几乎人人都会算错的地方，而 <code>kp</code> 专门标了它：<span class='w'>贪心动作的总概率是 <code>1 − ε + ε/|A|</code>，不是 <code>1 − ε</code></span>。</b><b>因为那 ε 的随机选择里，也有 <code>1/|A|</code> 的概率恰好选中贪心动作。</b><span class='k'>所以贪心动作被选中有两条路：以 <code>1−ε</code> 直接选，或者以 <code>ε</code> 进入随机分支后再以 <code>1/|A|</code> 抽中它</span>。<b>两条加起来才是它的真实概率。</b>", "<b>验算一下总概率确实是 1，这个检查能帮你确认理解对了。</b><span class='k'>贪心动作：<code>1 − ε + ε/|A|</code>；其余 <code>|A| − 1</code> 个动作各 <code>ε/|A|</code></span>。<b>加起来：<code>1 − ε + ε/|A| + (|A|−1)·ε/|A| = 1 − ε + ε = 1</code>。</b><span class='w'>如果你按「贪心 <code>1−ε</code>、其余各 <code>ε/|A|</code>」算，总和是 <code>1 − ε/|A|</code>，少了一块</span>——<b>这就是为什么那个写法是错的。</b>", "<b>ε 的含义也值得说准：<span class='k'>它是「不走贪心分支」的概率，不是「做出非贪心动作」的概率</span>。</b><b>真正做出非贪心动作的概率是 <code>ε·(|A|−1)/|A|</code>。</b><span class='w'>动作越多，这两个数越接近；只有两个动作时差得最远（<code>ε/2</code> vs <code>ε</code>）</span>。<span class='k'>实现时这个区别无所谓（你照着定义写就对），但算概率时会出错。</span>", "<b>最后把 ε-贪婪放进「探索方法」这个更大的谱里，你会知道它有多朴素。</b><span class='w'>它是<b>无差别</b>的探索：对所有非贪心动作一视同仁，不管你对它们的了解有多少</span>。<b>一个已经试过一千次、确定很差的动作，和一个从没试过的动作，被选中的概率一样。</b><span class='k'>更聪明的办法会按「不确定性」来分配探索</span>（<b>比如 UCB、乐观初始化、后验采样</b>），<b>而那是第十一、十二讲的内容。</b><span class='w'>L07 p19 的蒙特祖玛就是 ε-贪婪彻底失效的例子。</span>"], "say": "有人问「随机时要不要把贪婪动作排除掉」。老师答：<b>不排除</b>；真想排除，那不过相当于换了个 ε，而且实现起来更麻烦。", "quote": "Simple idea to balance exploration and exploitation &nbsp;·&nbsp; Let |A| be the number of actions &nbsp;·&nbsp; Then an ε-greedy policy w.r.t. a state-action value Q(s,a) is &nbsp;·&nbsp; <b>π(a|s) = arg max_a Q(s,a) with prob 1−ε; a with prob ε/|A|</b>", "tbl": {"head": ["", "概率", "注意"], "rows": [["选中贪心动作", "<b><code>1 − ε + ε/|A|</code></b>", "<span class='w'>不是 <code>1 − ε</code>——随机分支里也可能抽中它</span>"], ["选中某个特定的非贪心动作", "<code>ε/|A|</code>", "—"], ["做出<b>任一</b>非贪心动作", "<code>ε·(|A|−1)/|A|</code>", "<span class='k'>这才是「真的在探索」的概率</span>"], ["总和", "<code>1</code>", "可以用来验算"]]}},
{"r": [19, 19], "t": "检验题：用 MC 估 Q", "star": 3, "one": "火星车加了第二个动作，奖励也跟着动作变了。", "eq": "r(·,a1) = [1 0 0 0 0 0 10]\nr(·,a2) = [0 0 0 0 0 0  5]，γ=1，当前贪婪 π=a1，ε=0.5\n\n轨迹 = (s3,a1,0, s2,a2,0, s3,a1,0, s2,a2,0, s1,a1,1, 终止)\n\n首次访问 MC：\n  Q(·,a1) = [1  0  1  0 0 0 0]\n  Q(·,a2) = [0  1  0  0 0 0 0]", "pts": ["<span class='w'>关键差别</span>：现在有<b>两张表</b>。在某个状态做了哪个动作，就只能更新哪张表。", "s3 只做过 a1 ⇒ <code>Q(s3,a2)</code> 仍是 0；s2 只做过 a2 ⇒ <code>Q(s2,a1)</code> 仍是 0。", "取 max 之后是 <code>[1 1 1 0 0 0 0]</code>，正是上一讲的答案——<span class='k'>只是现在同样的经验被分摊到了两张表上。</span>", "<b>这道检验题值得自己算一遍，因为它把「first visit」和「γ=1」两件事同时考了。</b><span class='k'>轨迹是 <code>(s3,a1,0) → (s2,a2,0) → (s3,a1,0) → (s2,a2,0) → (s1,a1,1) → 终止</code></span>，<b>而 γ=1 意味着回报就是「从这一步往后的奖励之和」，不打折扣。</b><span class='w'>整条轨迹只在最后一步拿到 +1，所以<b>每一步</b>的回报都是 1。</span>", "<b>于是答案就很好验证了：<span class='k'>所有被访问过的 <code>(s,a)</code> 对，它们的回报都是 1</span>。</b><b>被访问的是 <code>(s3,a1)</code>、<code>(s2,a2)</code>、<code>(s1,a1)</code>。</b><span class='w'>所以 <code>Q(s3,a1) = Q(s2,a2) = Q(s1,a1) = 1</code>，其余全是 0</span>——<b>正好对上课件给的 <code>Q(·,a1) = [1 0 1 0 0 0 0]</code>、<code>Q(·,a2) = [0 1 0 0 0 0 0]</code>。</b><span class='k'>（第 1、3 位对应 <code>s1</code>、<code>s3</code>；第 2 位对应 <code>s2</code>。）</span>", "<b>「first visit」在这里起作用了：<code>(s3,a1)</code> 和 <code>(s2,a2)</code> 各被访问了两次。</b><span class='k'>first visit 只计第一次，所以 <code>N = 1</code>，<code>Q = 1/1 = 1</code></span>。<span class='w'>如果用 every visit，<code>N = 2</code>，而两次的回报都是 1，所以 <code>Q = 2/2 = 1</code>——这道题里结果恰好一样</span>。<b>但那是因为 γ=1 且只有一个终局奖励；γ&lt;1 的话两者会不同。</b>", "<b>这道题最该带走的不是数字，是它暴露的那个问题：<span class='w'>七个状态两个动作，十四个格子，这一轮只填上了三个</span>。</b><b>其余十一个格子仍然是初始值 0。</b><span class='k'>而下一轮如果还按贪心走，很可能又只填那几个</span>。<b>这就是为什么 ε 必须足够大、而且必须跑足够多轮——它是在逼你去填那些空格子。</b><span class='w'>这也解释了为什么这一讲的算法在状态动作多的时候数据需求会爆炸。</span>"], "say": "课上有人答「见过的都是 1」——老师说<b>那是上一讲 V 的答案</b>；也有人答「只有 Q(s1,a1) 非零」——老师说<b>那是 TD 的答案</b>。两个都答错在同一个地方：没分清「哪张表」和「MC 还是 TD」。", "quote": "Mars rover with new actions: <b>r(·, a1) = [1 0 0 0 0 0 +10], r(·, a2) = [0 0 0 0 0 0 +5], γ = 1</b> &nbsp;·&nbsp; Assume current greedy π(s) = a1 ∀s, ε = .5 &nbsp;·&nbsp; <b>Trajectory = (s3,a1,0, s2,a2,0, s3,a1,0, s2,a2,0, s1,a1,1, terminal)</b> &nbsp;·&nbsp; First visit MC estimate: <b>Q(·,a1) = [1 0 1 0 0 0 0], Q(·,a2) = [0 1 0 0 0 0 0]</b>"},
{"r": [20, 21], "t": "ε-贪婪也保单调改进", "star": 3, "one": "定理：对任何 ε-贪婪的 <code>π_i</code>，关于 <code>Q^{π_i}</code> 的 ε-贪婪策略 <code>π_{i+1}</code> 满足 <code>V^{π_{i+1}} ≥ V^{π_i}</code>。", "eq": "Q^{π_i}(s, π_{i+1}(s))\n  = Σ_a π_{i+1}(a|s)·Q^{π_i}(s,a)\n  = (ε/|A|)·Σ_a Q^{π_i}(s,a) + (1−ε)·max_a Q^{π_i}(s,a)\n  ≥ … （把 max 推进求和里，只会变小）\n  = V^{π_i}(s)", "pts": ["技巧和第二讲那个证明同源：<b>max 至少不比任何一项差</b>，把它推进求和里放缩。", "中间那步把 <code>1</code> 写成 <code>Σ_a π_i(a|s)</code>——因为概率必须和为 1。", "<b>这个定理要解决的疑虑很具体：<span class='k'>加了随机性，改进还成立吗</span>？</b><b>直觉上会担心——随机动作显然比贪心动作差，那么掺进随机性不是把策略弄坏了吗？</b><span class='w'>定理说不会</span>：<b>只要你拿新的 ε-贪婪策略和<b>旧的 ε-贪婪策略</b>比，改进仍然成立。</b><span class='k'>关键在「和谁比」——不是和纯贪心比，是和同样带 ε 的旧策略比。</span>", "<b>证明的技巧只有一处，但它很巧妙，值得看明白。</b><span class='k'>要证的是 <code>Q^{π_i}(s, π_{i+1}(s)) ≥ V^{π_i}(s)</code>，而右边 <code>V^{π_i}(s) = Σ_a π_i(a|s) Q^{π_i}(s,a)</code></span>。<b>难点在于左边有个 <code>max</code>，右边是个按 <code>π_i</code> 的加权平均，两者不好直接比。</b><span class='w'>技巧是：把 <code>max_a Q</code> 改写成「某种加权平均」的形式</span>——<b>因为 max 不小于任何加权平均，所以可以往下放缩，直到凑出右边那个式子。</b>", "<b>那个凑的过程，关键一步是把权重写成 <code>(π_i(a|s) − ε/|A|) / (1−ε)</code>。</b><span class='k'>验证一下它确实是一组合法的权重</span>：<b>每一项非负（因为 ε-贪婪给每个动作至少 <code>ε/|A|</code>），而且加起来等于 <code>(1 − ε)/(1−ε) = 1</code>。</b><span class='w'>于是 <code>max_a Q ≥ Σ_a [那组权重]·Q</code> 成立</span>，<b>代进去一化简，右边正好变成 <code>V^{π_i}(s)</code>。</b><span class='k'>这是「把 max 放缩成一个精心挑选的加权平均」的标准手法，值得记住。</span>", "<b>定理成立之后，L02 p39 的策略改进定理就能原样套用了，这是最后一步。</b><span class='k'>那里的条件是「<code>Q^π(s, π′(s)) ≥ V^π(s)</code> 对所有 s 成立」⇒ <code>V^{π′} ≥ V^π</code></span>。<b>而这一页刚好证明了那个前提。</b><span class='w'>所以这个证明的结构是：把一个新情形归约到一个已证的定理上</span>——<b>而不是从头再证一遍单调改进。</b>", "<b>最后提醒这个定理的适用边界，它和 p22 是配套的。</b><span class='w'>定理假设 <code>Q^{π_i}</code> 是<b>精确</b>的那个值函数</span>，<span class='k'>而实践中你手上只有一个估计</span>。<b>所以这个定理保证的是「如果你能精确评估，那么 ε-贪婪改进不会变差」</b>——<span class='w'>它没有保证「用估计的 Q 做 ε-贪婪改进不会变差」</span>。<b>后者需要更强的工具，而课件在 p22 给的答案是：整体仍然收敛，只是逐步单调性没了。</b>"], "say": "有人要直觉。老师给的是：<b>不探索，Q 就不会变，策略也就不会变</b>；一探索就会拿到别的 (s,a) 的证据，若真有更好的，Q 会告诉你，策略就往那边挪。", "quote": "<b>Theorem</b>: For any ε-greedy policy π_i, the ε-greedy policy w.r.t. Q^{π_i}, π_{i+1} is a monotonic improvement <b>V^{π_{i+1}} ≥ V^{π_i}</b> &nbsp;|&nbsp; Q^{π_i}(s, π_{i+1}(s)) = Σ_a π_{i+1}(a|s) Q^{π_i}(s,a) &nbsp;·&nbsp; <b>= (ε/|A|) Σ_a Q^{π_i}(s,a) + (1−ε) max_a Q^{π_i}(s,a)</b> &nbsp;·&nbsp; ... <b>= Σ_a π_i(a|s) Q^{π_i}(s,a) = V^{π_i}(s)</b>"},
{"r": [22, 22], "t": "一个必须说清的前提", "star": 3, "one": "单调改进的前提是 <b><code>Q^{π_i}</code> 算得精确</b>。这一讲往往做不到。", "pts": ["第二讲有模型，评估是精确的，所以每一步改进都真的单调。", "这一讲的 Q 是<span class='w'>许多个策略采来的样本</span>估出来的，可能有偏。", "<span class='k'>漂亮的是：温和条件下，用 MC 和 TD 的广义策略迭代仍然收敛。</span>", "证明见 Watkins &amp; Dayan 1992、Tsitsiklis 1994。", "<b>这一页是全讲最诚实的一页，它把前面所有结论的前提亮了出来。</b><span class='k'>L02 的单调改进定理成立，是因为那里的策略评估是<b>精确</b>计算的</span>；<span class='w'>而这一讲的 <code>Q</code> 是<b>从样本估出来</b>的，而且样本来自<b>许多个</b>不同的策略</span>。<b>于是那个定理的前提严格说并不成立。</b><span class='k'>上一页证的「ε-贪婪也保单调改进」，前提同样是 <code>Q^{π_i}</code> 精确。</span>", "<b>「样本来自许多个不同的策略」这句话要特别留意，它比「估计有误差」更麻烦。</b><span class='w'>你一边学一边改策略，所以数据池里混着早期策略、中期策略、当前策略产生的样本</span>。<b>而 <code>Q^π</code> 的定义是针对<b>某一个</b> π 的。</b><span class='k'>于是你估出来的那个东西，严格说不是任何一个策略的 Q</span>——<b>它是一个混合物。</b><span class='w'>（L09 p17 讨论基线该用哪批数据拟合时，碰到的是同一个问题。）</span>", "<b>而课件接下来那句话才是这一页真正的结论：<span class='k'>beautifully, 这些方法在一些温和的条件下<b>仍然</b>收敛</span>。</b><b>也就是说：虽然每一步的改进保证不成立，整体仍然会收敛到对的地方。</b><span class='w'>这是一个比「逐步单调改进」弱得多、但实用得多的保证</span>——<b>它说的是终点，不是路径。</b><span class='k'>p23 的 GLIE 和 p33 的步长条件，就是那些「温和的条件」的具体形式。</span>", "<b>课件给的那两篇参考值得记一下，因为它们正是这类结论的来源。</b><span class='k'>Watkins &amp; Dayan 1992 证明了 Q-learning 的收敛；Tsitsiklis 1994 把它放进了异步随机逼近的一般框架里</span>。<b>后者的视角更有用：它说明 Q-learning 其实是随机逼近理论的一个特例</b>——<span class='w'>而那套理论的标准条件（步长平方可和但不可和）正是 p33 要给的</span>。<b>认出这个归属，你就知道该去哪里找更一般的结论。</b>"], "say": "老师特别提醒：<b>到了函数逼近那几讲，「Q 算得精确」几乎永远不成立</b>，这条前提会变得非常要紧。", "quote": "Note that when we first introduced policy improvement with a given MDP dynamics and reward model, <b>policy evaluation was computed exactly</b> &nbsp;·&nbsp; In this case monotonic improvement was guaranteed &nbsp;·&nbsp; <b>In this lecture we will often be considering computing a Q using samples gathered from many policies</b> &nbsp;·&nbsp; Beautifully, generalized policy iteration using MC and TD methods <b>still converge under some mild conditions</b> &nbsp;·&nbsp; (Watkins &amp; Dayan 1992; Tsitsiklis 1994)"},
{"r": [23, 23], "t": "GLIE：无限探索下最终变贪婪", "star": 3, "one": "两条：每个 <code>(s,a)</code> 被访问无穷多次，且行为策略最终收敛到贪婪。", "eq": "① lim_{i→∞} N_i(s,a) → ∞\n② lim_{i→∞} π(a|s) → arg max_a Q(s,a)  （概率 1）\n\n一个简单取法：ε_i = 1/i", "pts": ["<b>两条缺一不可</b>：只满足①，你会学到正确的 Q 却不照着做；只满足②，你可能学错。", "<b>GLIE 这个名字本身就是两个条件的缩写，而它们各自防的是一种失败，值得分开理解。</b><br><b>条件一：无限探索</b>（<em>Infinite Exploration</em>）——<span class='k'>每个 <code>(s,a)</code> 被访问无穷多次</span>。<b>它防的是「某些格子永远没数据」，也就是 p15 的第一个坑。</b><br><b>条件二：渐近贪婪</b>（<em>Greedy in the Limit</em>）——<span class='k'>行为策略最终收敛到贪心策略</span>。<b>它防的是「你永远在以 ε 的概率做蠢事」。</b>", "<b>第二个条件为什么必需，想清楚这一点你就懂了 GLIE 的全部。</b><span class='w'>如果 ε 固定不变，那么算法最终收敛到的是「ε-贪婪策略的最优值」，而不是「最优策略的值」</span>——<b>因为你永远有 ε 的概率乱走。</b><span class='k'>这两者差多少，取决于 ε 有多大和乱走的代价有多高</span>。<b>所以要得到真正的最优，ε 必须趋于 0。</b>", "<b>但两个条件是有张力的，而这个张力正是 GLIE 的全部难点。</b><span class='k'>条件一要求「一直探索」，条件二要求「最终不探索」</span>——<b>看起来矛盾。</b><span class='w'>解法是让 ε 衰减，但衰减得<b>足够慢</b></span>：<b>慢到总访问次数仍然发散（条件一），快到最终趋于 0（条件二）。</b><span class='k'>最经典的取法是 <code>ε_i = 1/i</code></span>——<b>因为 <code>Σ 1/i</code> 发散（所以访问次数无穷），而 <code>1/i → 0</code>。</b><span class='w'>调和级数的发散性在这里被用上了，这不是巧合，是设计。</span>", "<b>把 GLIE 和「探索–利用权衡」这个老话题对上，它其实给了一个很干净的答案。</b><span class='k'>早期多探索（ε 大），因为你什么都不知道；晚期多利用（ε 小），因为你已经知道得差不多了</span>。<b>而「多快从前者过渡到后者」由衰减率决定。</b><span class='w'>GLIE 没有给出「最优的」衰减率，它只给出了「可行的」范围</span>——<b>在这个范围内怎么选，是实践问题。</b><span class='k'>而第十一讲会告诉你，在老虎机那种干净的设定里，这个问题是有最优解的。</span>"], "say": "老师举了个 GLIE 做不到的例子：<b>直升机摔了就飞不回去</b>——有些状态一旦离开就再也回不去，这类环境满足不了 GLIE。工程上常见的对策是把它当成 episodic：摔一架算一次终止，再换一架。", "quote": "<b>Definition of GLIE</b> (Greedy in the Limit of Infinite Exploration) &nbsp;·&nbsp; <b>All state-action pairs are visited an infinite number of times: lim_{i→∞} N_i(s,a) → ∞</b> &nbsp;·&nbsp; <b>Behavior policy converges to greedy policy: lim_{i→∞} π(a|s) → arg max_a Q(s,a) with probability 1</b>", "tbl": {"head": ["GLIE 的条件", "正式表述", "防的是什么", "怎么满足"], "rows": [["① 无限探索", "<code>lim N_i(s,a) → ∞</code>", "<span class='w'>某些格子永远没数据</span>", "<span class='k'>ε 衰减得够慢（<code>Σ ε_i</code> 发散）</span>"], ["② 渐近贪婪", "<code>lim π(a|s) → arg max_a Q</code>", "<span class='w'>永远以 ε 的概率做蠢事</span>", "<span class='k'>ε → 0</span>"], ["<b>经典取法</b>", "<code>ε_i = 1/i</code>", "<b>两条同时满足</b>", "<span class='k'>调和级数发散，但通项趋于 0</span>"]]}, "res": {"tag": "推断", "v": "<b>GLIE 的两个条件，给你的 §4c「随机化决策节点」提供了一个可以照着核对的规格说明。</b><br><br><span class='k'>条件一（无限探索）对应：每个「节点 × 保真度档位」的组合都要在日志里出现足够多次</span>——<b>这是你那张 oracle 表和 FQE 都依赖的前提。</b><span class='w'>而「足够多次」是可以检查的：直接数每个组合在日志里的计数，最小的那个决定了你最弱的那一格</span>。<b>这个检查比任何算法调优都该先做。</b><br><br><span class='k'>条件二（渐近贪婪）对应：随机化的强度应该随着你对配置了解的增加而降低</span>——<b>而这一条你可能<b>不</b>需要。</b><span class='w'>因为你不是在线学习：你是先采一批日志，再离线做选择</span>。<b>条件二是为「最终要部署这个行为策略」准备的，而你的行为策略只是采数据的工具，不是最终产品。</b><span class='k'>所以对你来说，固定的随机化强度是合理的，甚至更好</span>——<b>它让覆盖更均匀，而覆盖正是条件一要的。</b><br><br><b>这个区分值得写清楚，因为它澄清了一个常见的混淆：</b><span class='w'>「探索–利用权衡」是<b>在线</b>学习的问题——你要一边学一边承担代价</span>；<span class='k'>而你的设定是<b>离线</b>的：采数据和用数据是两个阶段</span>。<b>离线设定下没有权衡，只有「覆盖够不够」这一个问题。</b><span class='w'>所以别把在线方法的 ε 衰减策略照搬过来——那会让你的覆盖变差而换不到任何好处。</span>", "ref": "课件 p23 两个条件 · p17 · 简报 §4c §4d"}},
{"r": [24, 24], "t": "目录：蒙特卡洛控制", "quote": "Table of Contents &nbsp;·&nbsp; 1 Generalized Policy Iteration &nbsp;·&nbsp; 2 Importance of Exploration &nbsp;·&nbsp; <b>3 Monte Carlo Control</b> &nbsp;·&nbsp; 4 Temporal Difference Methods for Control &nbsp;·&nbsp; 5 Maximization Bias", "one": "第三节：<b>把 L03 的蒙特卡洛填进「评估」那一步</b>。", "pts": ["<b>到这里为止，零件都齐了，这一节只是把它们装起来。</b><span class='k'>骨架是第 1 节的广义策略迭代；评估那一步用 L03 的蒙特卡洛；策略用第 2 节的 ε-贪婪；ε 的衰减照 GLIE</span>。<b>四样一拼，就是 p25 那个算法。</b><span class='w'>所以这一节没有新概念，它的价值在于让你看到前面的东西怎么合在一起用。</span>", "<b>但有一个设计选择在这里第一次出现，而且它会贯穿后面：<span class='k'>多久改进一次</span>。</b><b>MC 控制选的是「跑完一个片段改进一次」。</b><span class='w'>为什么不是「跑完很多片段把 Q 估准了再改进」？因为那期间你一直在用旧策略采数据</span>——<b>数据质量差，而且浪费。</b><span class='k'>而 p31 的 SARSA 会把这个频率推到极致：每走一步就改进。</span>"]},
{"r": [25, 25], "t": "MC 在线控制", "star": 3, "one": "把「估 Q」和「改进策略」合到同一个循环里。", "eq": "Q(s,a)=0, N(s,a)=0, ε=1, k=1\nπ_k = ε-greedy(Q)\n循环：\n  按 π_k 采第 k 个片段，算出各 G_{k,t}\n  对片段中首次访问到的 (s,a)：\n    N(s,a) += 1\n    Q(s,a) += (1/N(s,a))·( G_{k,t} − Q(s,a) )\n  k += 1;  ε = 1/k\n  π_k = ε-greedy(Q)      ← 策略改进", "pts": ["<code>ε = 1/k</code> 就是在兑现 GLIE。", "首次访问 / 每次访问都行，取舍和上一讲同。", "<b>这个算法把前面几页的零件装到了一起，而装配方式里有一个值得注意的选择。</b><span class='k'>它是「跑完一个片段，再改进一次」</span>——<b>而不是「跑完很多片段把 Q 估准了再改进」。</b><span class='w'>后者是 L02 式的策略迭代（评估到收敛再改进），前者更像值迭代</span>。<b>选前者的理由很实际：等 Q 估准要跑很多片段，而那期间你一直在用一个旧策略。</b><span class='k'>早点改进，后面采的数据质量就更高。</span>", "<b><code>ε = 1/k</code> 这一行就是 GLIE 的具体兑现，而 k 的含义要看准。</b><span class='k'>k 是<b>片段数</b>，不是时间步数</span>。<b>所以跑了 100 个片段之后 ε = 0.01。</b><span class='w'>这个衰减相当快</span>——<b>实践中常常改成 <code>ε = 1/k^c</code>（<code>c &lt; 1</code>）或者设一个下界 <code>ε_min</code>，让探索不至于太早消失。</b><span class='k'>但那样严格说就不满足 GLIE 的条件二了，是一个有意的取舍。</span>", "<b>还有一个实现细节值得提：这个算法里 <code>Q</code> 是用「历来所有数据」的平均算的。</b><span class='k'><code>Q(s,a) = G(s,a)/N(s,a)</code>，而 <code>G</code> 和 <code>N</code> 是累加的</span>。<span class='w'>于是早期用很烂的策略采到的回报，和最近用好策略采到的回报，权重是一样的</span>。<b>这正是 p22 说的「样本来自许多个策略」那个问题。</b><span class='k'>常见的改法是用增量更新加一个固定步长 α，让新数据权重更大</span>——<b>那就从「平均」变成了「指数加权平均」，也更接近 TD 的形式。</b>"], "quote": "Monte Carlo Online Control &nbsp;·&nbsp; 用 ε-贪婪策略采一个片段 &nbsp;·&nbsp; 对片段里每个 (s,a) 更新 N(s,a) 与 Q(s,a) &nbsp;·&nbsp; <b>k = k+1, ε = 1/k</b>, π = ε-greedy(Q)"},
{"r": [26, 26], "t": "检验题：MC 控制走一轮", "star": 3, "one": "拿 p19 那两张 Q 表，往下推出新策略。", "eq": "Q(·,a1) = [1 0 1 0 0 0 0]\nQ(·,a2) = [0 1 0 0 0 0 0]\n\nπ(s) = arg max_a Q(s,a) = [1  2  1  平  平  平  平]\n\nk=3 ⇒ ε = 1/3：\n  以 2/3 的概率照 π 走，以 1/3 的概率随机", "pts": ["s4–s7 两个动作都是 0，<b>平局</b>。", "<b>这道题的要点是把「改进」这一步真的做一遍，而做完之后你会发现一件有点不舒服的事。</b><span class='k'>第一轮只填上了三个格子，其余十一个还是 0</span>。<b>于是对大多数状态来说，<code>arg max_a Q(s,a)</code> 是在两个 0 之间挑</b>——<span class='w'>也就是说，新策略在那些状态上的「贪心动作」完全由打平时的 <code>arg max</code> 实现细节决定</span>。<b>这不是学出来的，是实现决定的。</b>", "<b>这件事在实践中的后果值得记住：<span class='k'>早期的「贪心」几乎没有信息量</span>。</b><b>它只是在把初始值和零星几个样本当真。</b><span class='w'>所以早期 ε 必须大，否则你会被这些毫无根据的「贪心选择」锁死</span>——<b>而 <code>ε = 1/k</code> 在 k=1 时正好是 1（完全随机），这个设计是对的。</b><span class='k'>这也解释了为什么乐观初始化有用：把 Q 初始化得很高，没试过的动作天然看起来最好，贪心本身就会去探索。</span>"], "say": "老师给了条实践建议：<b>别把平局的解法固定下来</b>，每次查 arg max 时<span class='k'>随机打破平局</span>，实测更好——等于白赚一点探索。", "quote": "Check Your Understanding: MC 控制走一轮 &nbsp;·&nbsp; （接 p19 的火星车例子，用第一轮估出的 Q 做一次 ε-贪婪改进）"},
{"r": [27, 27], "t": "GLIE MC 控制收敛", "star": 2, "one": "定理：GLIE 的蒙特卡洛控制收敛到最优状态–动作值 <code>Q*</code>。", "say": "有人问 MC 这边有没有类似 SARSA 那样的条件。老师答：<b>纯首次访问 MC，GLIE 本身就够</b>——它是无偏估计；但若你用增量形式、自己调 α，那就同样需要对 α 的条件。", "quote": "<b>GLIE Monte-Carlo control converges to the optimal state-action value function Q(s,a) → Q*(s,a)</b>", "pts": ["<b>这个收敛结论的条件只有一个词：GLIE。</b><span class='k'>满足那两个条件（无限探索 + 渐近贪婪），MC 控制就收敛到 <code>Q*</code></span>。<b>注意它收敛到的是<b>最优</b>的 Q，不是「某个 ε-贪婪策略的 Q」</b>——<span class='w'>这正是条件二（ε → 0）买来的</span>。<span class='k'>如果 ε 固定，你只能收敛到「最优的 ε-贪婪策略」，那是个更弱的结论。</span>", "<b>和这一讲后面几个收敛结论对比一下，MC 控制的条件其实是最宽松的，原因值得想。</b><span class='k'>它不需要步长条件</span>——<b>因为它用的是样本平均（<code>G/N</code>），而平均本身就是一个自动衰减的步长 （第 n 次更新的权重是 <code>1/n</code>）。</b><span class='w'>而 SARSA 和 Q-learning 用的是固定或自定的步长 α，所以要额外加条件（p33）</span>。<span class='k'>也就是说：样本平均已经悄悄满足了那个步长条件。</span>", "<b>MC 控制的代价也该记一下，它解释了为什么实践中更常用 TD 版本。</b><span class='w'>它必须等片段结束才能更新</span>——<b>片段长的问题里，你要等很久才能学到一点东西；而片段不会结束的问题里（持续任务），它根本不能用。</b><span class='k'>加上 L03 讲过的高方差问题</span>，<b>于是 p28 那句「那 TD 呢」就是很自然的下一步。</b>"]},
{"r": [28, 28], "t": "那 TD 呢", "one": "同一个框架，把评估那一步换成 TD。", "quote": "What about TD methods for control?", "pts": ["<b>这一页只有一个问句，但它要换掉的东西很明确：把评估那一步的蒙特卡洛换成 TD。</b><span class='k'>换了之后能买到 L03 讲过的那三样好处</span>：<b>① 不用等片段结束，每走一步就能学；② 方差小得多；③ 持续任务也能用。</b><span class='w'>代价同样是 L03 讲过的那一样：引入偏差，而且吃马尔可夫假设</span>。", "<b>但换成 TD 之后会冒出一个 MC 那里没有的新问题，而这个问题正是下一节的主题。</b><span class='k'>TD 的目标里有「下一步的 Q」——而「下一步用哪个动作的 Q」有两种选法</span>：<b>用你<b>实际</b>做的那个动作（SARSA），还是用<b>最好</b>的那个动作（Q-learning）。</b><span class='w'>MC 里没有这个选择，因为它根本不用「下一步的估计」</span>。<b>而这两种选法的差别，正好就是 on-policy 和 off-policy 的差别。</b><span class='k'>同一笔数据，两个目标——这是这一讲最该记住的一句话。</span>"]},
{"r": [29, 29], "t": "目录：TD 控制", "quote": "Table of Contents &nbsp;·&nbsp; <b>4 Temporal Difference Methods for Control</b> &nbsp;·&nbsp; <b>5 Maximization Bias</b>", "one": "后两节：<b>把评估换成 TD，然后体检一次</b>。", "pts": ["<b>这两节的分量不一样，而且第 5 节常被当成边角料，值得先纠正这个印象。</b><span class='k'>第 4 节给的是两个算法（SARSA 和 Q-learning），它们是这门课后半程的基石</span>；<span class='w'>第 5 节不给新算法，它是对前面<b>所有</b>算法的一次体检</span>——<b>发现它们共享一个系统性的毛病，然后给出解药。</b><span class='k'>而那个毛病和解药，在 RL 之外同样成立。</span>", "<b>第 4 节最该带走的一句话，可以先摆在这里：<span class='k'>同一笔数据，两个目标</span>。</b><b>拿到一条转移 <code>(s,a,r,s′)</code>，你可以用「你实际会做的下一个动作」来自举，也可以用「最好的那个动作」来自举。</b><span class='w'>前者是 SARSA（on-policy），后者是 Q-learning（off-policy）</span>。<b>一个 max 的有无，分出了这门课后面所有 off-policy 的麻烦。</b>"]},
{"r": [30, 30], "t": "TD 版的策略迭代", "one": "评估用 TD + ε-贪婪；改进和 MC 那边一样。", "quote": "Model-free Policy Iteration with TD Methods &nbsp;·&nbsp; <b>Policy evaluation: compute Q using temporal difference updating with ε-greedy policy</b> &nbsp;·&nbsp; Policy improvement: Same as Monte Carlo policy improvement, set π to ε-greedy(Q)", "pts": ["<b>这一页的改动只有一处：把评估那一步的蒙特卡洛换成 TD，其余原封不动。</b><span class='k'>骨架还是广义策略迭代，改进还是 ε-贪婪，ε 还是按 GLIE 衰减</span>。<b>所以前面三节的东西全部复用。</b><span class='w'>而换成 TD 买到的三样好处，L03 已经讲过</span>：<b>不用等片段结束、方差小、持续任务也能用。</b>", "<b>但有一处细微但重要的变化：更新的频率可以提高到「每走一步」。</b><span class='w'>MC 控制必须等片段结束（因为要算回报），所以一个片段只能改进一次</span>；<span class='k'>TD 每走一步就有一个更新目标，于是可以每一步都改进策略</span>。<b>p31 的 SARSA 正是这么做的——它的第 8 行就在循环体里。</b><span class='w'>而课件在 p31 结尾专门问了一句：更新得这么频繁有什么好处、不那么频繁又有什么好处。</span>"]},
{"r": [31, 32], "t": "SARSA", "star": 3, "one": "名字就是更新用到的五个量：<b>s, a, r, s′, a′</b>。", "eq": "取 a_t ~ π(s_t)，观察 (r_t, s_{t+1})\n循环：\n  取 a_{t+1} ~ π(s_{t+1})\n  Q(s_t,a_t) ← Q(s_t,a_t) + α·( r_t + γ·Q(s_{t+1}, a_{t+1}) − Q(s_t,a_t) )\n  π(s_t) = arg max_a Q(s_t,a)  以概率 1−ε，否则随机", "pts": ["<span class='k'>代进去的是「实际要做的那个动作」</span>——所以必须<b>多等一步</b>，等到 a′ 定下来才能更新。", "好处：不用等片段结束，<b>同一个片段里就能改策略</b>。片段很长时这一点很值钱。", "<b>SARSA 这个名字就是它需要的那五个量：<code>S, A, R, S′, A′</code>。</b><span class='k'>状态、动作、奖励、下一状态、<b>下一动作</b></span>——<b>最后那个 <code>A′</code> 是它和 Q-learning 唯一的区别，也是整个 on-policy 性质的来源。</b><span class='w'>注意算法第 5 行：它必须<b>先把下一个动作采出来</b>，才能做第 7 行的更新</span>——<b>所以更新要滞后一步。</b>", "<b>「on-policy」在这里的体现非常具体：<span class='k'>用来自举的那个 <code>a_{t+1}</code>，正是你接下来真的要做的那个动作</span>。</b><b>它是从当前的 ε-贪婪策略里采出来的，所以有 ε 的概率是个随机动作。</b><span class='w'>于是 SARSA 学到的 Q，是「包含了那些随机失误在内」的值</span>——<b>它学的是你<b>实际</b>在执行的那个策略的值，不是最优策略的值。</b><span class='k'>这件事有一个很实际的后果：SARSA 会主动避开「旁边有悬崖」的路线</span>，<b>因为它知道自己有 ε 的概率失手掉下去。</b><span class='w'>（Sutton &amp; Barto 的 cliff walking 例子就是演示这一点的。）</span>", "<b>课件结尾那两个问句值得当场答一遍，因为它们是一个真实的取舍。</b><b>频繁改进的好处</b>：<span class='k'>你更快地用上新学到的信息，于是后面采的数据质量更高</span>。<b>不那么频繁的好处</b>：<span class='w'>策略稳定，数据分布变化慢，Q 的估计更容易跟上</span>；<b>而且策略老是变的话，你估的 <code>Q^π</code> 永远在追一个移动的目标</b>（<span class='k'>p22 说过这件事</span>）。<span class='w'>实践中的折中是：改进得频繁，但步长 α 小一点，让每一步的变化都不大。</span>", "<b>把 SARSA 的更新式和 L03 的 TD(0) 并排放，你会看到它们一模一样，只多了动作下标。</b><span class='k'>TD(0)：<code>V(s) ← V(s) + α(r + γV(s′) − V(s))</code></span>；<span class='k'>SARSA：<code>Q(s,a) ← Q(s,a) + α(r + γQ(s′,a′) − Q(s,a))</code></span>。<b>所以 SARSA 就是「作用在 Q 上的 TD(0)」。</b><span class='w'>这一讲的全部算法都可以这样理解：拿 L03 的评估方法，加一个动作下标，再套上广义策略迭代。</span>"], "say": "课件自己留了两问：「每步都改策略有什么好处？少改一点又有什么好处？」老师的态度很明确：<b>一般来说多改是好事。</b>", "quote": "<b>General Form of SARSA Algorithm</b> &nbsp;·&nbsp; 2: Take a_t ∼ π(s_t) &nbsp;·&nbsp; 3: Observe (r_t, s_{t+1}) &nbsp;·&nbsp; 5: Take action a_{t+1} ∼ π(s_{t+1}) &nbsp;·&nbsp; 7: <b>Q(s_t,a_t) ← Q(s_t,a_t) + α(r_t + γQ(s_{t+1},a_{t+1}) − Q(s_t,a_t))</b> &nbsp;·&nbsp; 8: π(s_t) = arg max_a Q(s_t,a) w.prob 1−ε, else random &nbsp;|&nbsp; <b>What are the benefits to improving the policy after each step? What are the benefits to updating the policy less frequently?</b>"},
{"r": [33, 34], "t": "SARSA 的收敛条件", "star": 3, "one": "两条：策略满足 GLIE；步长满足 Robbins–Munro。", "eq": "① π_t(a|s) 满足 GLIE\n② Σ_{t=1}^∞ α_t = ∞   且   Σ_{t=1}^∞ α_t² < ∞\n\n（例如 α_t = 1/t）", "pts": ["<b>Σα=∞</b>：步子加起来要够大，才走得到任何地方。", "<b>Σα²&lt;∞</b>：步子又得越来越小，噪声才压得下去。", "<code>α=1</code> 完全不记过去，<code>α=0</code> 完全不更新，两端都不行。", "<b>Robbins-Munro 那两个条件的含义值得分开说，它们各自防一种失败。</b><br><b><code>Σ α_t = ∞</code>（步长之和发散）</b>：<span class='k'>保证你能走到任何地方——哪怕初始值离真值很远，累计的步长也够把你挪过去</span>。<b>如果步长衰减太快（比如 <code>α_t = 1/t²</code>），总位移有限，你可能永远到不了。</b><br><b><code>Σ α_t² &lt; ∞</code>（平方和收敛）</b>：<span class='w'>保证噪声最终被压下去——步长要衰减得够快，否则你会一直被单个样本的噪声推来推去</span>。", "<b>这两个条件有张力，而满足它们的典型取法是 <code>α_t = 1/t</code>。</b><span class='k'><code>Σ 1/t</code> 发散（调和级数），<code>Σ 1/t²</code> 收敛（巴塞尔问题）</span>——<b>刚好卡在中间。</b><span class='w'>注意这和 p23 的 GLIE 用的是同一个数学事实</span>——<b>那里 <code>ε_i = 1/i</code> 也是靠调和级数发散。</b><span class='k'>这不是巧合：两处都在要求「衰减但不要衰减得太快」。</span>", "<b>课件那个反问值得认真对待：<em>Would one want to use a step size choice that satisfies the above in practice? Likely not.</em></b><span class='w'><code>α_t = 1/t</code> 衰减得太快了</span>——<b>跑到第一万步时步长只有 <code>10⁻⁴</code>，几乎学不动了。</b><span class='k'>而真实问题里环境常常在变（非平稳），你需要一个<b>不</b>衰减到零的步长，好让算法持续追踪变化</span>。<b>于是实践中普遍用固定的小 α（比如 0.1 或 0.01）。</b><span class='w'>代价是严格说你失去了收敛保证——Q 会在真值附近持续抖动而不是收敛到一点。</span>", "<b>这是这一讲第二次出现「理论条件在实践中不用」的情形，值得和第一次对照。</b><span class='k'>第一次是 p23 的 <code>ε = 1/i</code>——实践中常改成固定下界 <code>ε_min</code></span>；<span class='k'>第二次是这里的 <code>α_t = 1/t</code>——实践中常改成固定 α</span>。<b>两次的理由相同：理论条件是为了「渐近收敛到一点」而设的，而实践中你要的是「在有限时间内表现够好，且能跟上变化」。</b><span class='w'>这个目标差异会在这门课后面反复出现（L09 p41 的 TRPO 常数也是同一类问题）。</span>"], "tip": {"t": "课件自己拆自己的台", "v": "p34 末尾问：实践中会用满足这个条件的步长吗？<b>课件的回答是「多半不会」。</b>真跑的时候常用小常数或缓慢衰减——这条件是理论上的充分条件，不是工程建议。", "w": 1}, "quote": "<b>Theorem</b>: SARSA for finite-state and finite-action MDPs converges to the optimal action-value, <b>Q(s,a) → Q*(s,a)</b>, under the following conditions: &nbsp;·&nbsp; <b>1 The policy sequence π_t(a|s) satisfies the condition of GLIE</b> &nbsp;·&nbsp; <b>2 The step-sizes α_t satisfy the Robbins-Munro sequence: Σ_{t=1}^∞ α_t = ∞, Σ_{t=1}^∞ α_t² &lt; ∞</b> &nbsp;|&nbsp; <b>Would one want to use a step size choice that satisfies the above in practice? Likely not.</b>", "tbl": {"head": ["条件", "式子", "防的是什么", "典型取法", "实践中呢"], "rows": [["和发散", "<code>Σ α_t = ∞</code>", "<span class='w'>走不到真值那里</span>", "<code>α_t = 1/t</code>", "<span class='k'>改用固定小 α</span>"], ["平方和收敛", "<code>Σ α_t² &lt; ∞</code>", "<span class='w'>噪声压不下去</span>", "同上", "<span class='w'>于是严格说失去收敛保证，Q 会持续抖动</span>"], ["<b>GLIE</b>", "<code>ε_i = 1/i</code>", "探索不够 / 永远做蠢事", "—", "<span class='k'>常改成固定 ε_min</span>"]]}},
{"r": [35, 35], "t": "Q-learning", "star": 3, "one": "把 SARSA 里的「下一个实际动作」换成「<b>下一步最好的动作</b>」。", "eq": "SARSA：      Q(s_t,a_t) ← Q(s_t,a_t) + α( r_t + γ·Q(s_{t+1}, a_{t+1}) − Q(s_t,a_t) )\nQ-learning： Q(s_t,a_t) ← Q(s_t,a_t) + α( r_t + γ·max_{a′} Q(s_{t+1}, a′) − Q(s_t,a_t) )", "pts": ["<span class='k'>一个 max 就把它从 on-policy 变成了 off-policy</span>：你按 ε-贪婪行动，学到的却是<b>最优</b>策略的 Q。", "还有个附带好处：不用等 a′，<b>拿到 (s,a,r,s′) 就能更新</b>。", "<b>开头那个问句点出了 Q-learning 最惊人的地方：<span class='k'>在不知道最优策略是什么的情况下，估出它的值</span>。</b><b>这听起来像是作弊——你连它是什么都不知道，怎么估它的值？</b><span class='w'>答案在那个 <code>max</code> 里</span>：<b>你不需要知道最优策略长什么样，只需要在每一步「假装接下来会选最好的那个动作」。</b><span class='k'>而「最好」是相对当前的 Q 估计说的，于是这是一个自举的自举。</span>", "<b>两个更新式的差别只有一处，把它圈出来：<code>Q(s′, a′)</code> 对 <code>max_{a′} Q(s′, a′)</code>。</b><span class='k'>SARSA 用的是「你实际会做的那个动作」，Q-learning 用的是「最好的那个动作」</span>。<b>而「你实际会做的」是从 ε-贪婪里采的，有 ε 的概率是随机动作。</b><span class='w'>所以 SARSA 的目标里含着探索的代价，Q-learning 的不含</span>——<b>这就是 on-policy 和 off-policy 在这里的全部技术内容。</b>", "<b>这个区别带来一个非常重要、也最容易被误解的结论：<span class='w'>Q 收敛到 <code>Q*</code>，不等于你跟随的策略是最优的</span>。</b><b>Q-learning 学到的是最优策略的值，但你<b>执行</b>的仍然是 ε-贪婪策略</b>——<span class='k'>它以 ε 的概率乱走，所以它的实际表现不是最优的</span>。<b>两者是分离的：学的是一个策略，做的是另一个。</b><span class='w'>这正是 off-policy 这个词的字面意思</span>，<b>而 <code>kp</code> 专门把这一条标了出来。</b>", "<b>把这个分离的好处说清楚，你就知道 off-policy 为什么值钱。</b><span class='k'>你可以用一个<b>很爱探索</b>的行为策略去采数据（大 ε、甚至完全随机），同时学到<b>最优</b>策略的值</span>——<b>两件事互不干扰。</b><span class='w'>而 SARSA 做不到：它学的就是它在执行的那个策略，你想让它学最优的，就得让 ε 趋于 0，于是探索也没了</span>。<b>这就是为什么 GLIE 对 SARSA 是必需的，而 Q-learning 的收敛条件里不需要「渐近贪婪」那一条。</b>"], "say": "被问「SARSA 和 Q-learning 该选谁」时老师给了个具体判据：<b>悬崖漫步</b>（Sutton &amp; Barto）里有些动作会掉下悬崖，Q-learning 的乐观让它早期踩坑很多，<span class='k'>SARSA 因为「现实」反而早期更好</span>。但总体上「一般你想用 Q-learning」，两者最终收敛到同一处。", "quote": "<b>Can we estimate the value of the optimal policy π* without knowledge of what π* is? Yes! Q-learning</b> &nbsp;·&nbsp; Key idea: Maintain state-action Q estimates and use to bootstrap — <b>use the value of the best future action</b> &nbsp;|&nbsp; SARSA: Q(s_t,a_t) ← Q(s_t,a_t) + α((r_t + γQ(s_{t+1},a_{t+1})) − Q(s_t,a_t)) &nbsp;·&nbsp; <b>Q-learning: Q(s_t,a_t) ← Q(s_t,a_t) + α((r_t + γ max_{a′} Q(s_{t+1},a′)) − Q(s_t,a_t))</b>", "tbl": {"head": ["", "SARSA", "Q-learning"], "rows": [["自举用哪个动作", "<code>a′ ∼ π(s′)</code>（实际会做的）", "<code>max_{a′}</code>（最好的）"], ["属于", "<span class='k'>on-policy</span>", "<span class='k'>off-policy</span>"], ["学到的是谁的值", "<b>你实际在执行的那个 ε-贪婪策略</b>", "<b>最优策略 <code>Q*</code></b>"], ["目标里含探索代价吗", "<span class='k'>含</span>", "<span class='w'>不含</span>"], ["收敛要「渐近贪婪」吗", "<span class='w'>要（GLIE 两条都要）</span>", "<span class='k'>不要，只要无限探索 + 步长条件</span>"], ["行为上的后果", "<span class='k'>会避开「失手代价高」的路线</span>", "<span class='w'>会走最优路线，哪怕旁边是悬崖</span>"]]}},
{"r": [36, 36], "t": "行为策略与目标策略", "one": "行为策略 <code>π_b</code> 决定你<b>实际</b>拿到什么奖励；它取成对当前 Q 的 ε-贪婪。", "quote": "In the prior slide assumed there was some <b>b</b> used to act &nbsp;·&nbsp; <b>b determines the actual rewards received</b> &nbsp;·&nbsp; Now consider how to improve the behavior policy &nbsp;·&nbsp; Let behavior policy b be ε-greedy w.r.t. current estimate of the optimal Q(s,a)", "pts": ["<b>这一页把两个策略的分工正式命名，而这两个名字你以后会一直用。</b><span class='k'><b>行为策略</b>（behavior policy, <code>b</code>）：真正去和环境交互的那个，它决定你实际拿到什么奖励、看到什么状态</span>；<span class='k'><b>目标策略</b>（target policy）：你想学的那个，这里是最优策略</span>。<b>on-policy 就是两者相同，off-policy 就是不同。</b>", "<b>课件那句 <em>b determines the actual rewards received</em> 要当真，它提醒了一件容易忽略的事。</b><span class='w'>你学到的是最优策略的值，但你<b>实际得到</b>的回报是行为策略带来的</span>。<b>于是「学得好」和「表现好」是两件事。</b><span class='k'>在线学习的场合你同时关心两者（学习期间的损失叫 regret，第十一讲的主题）</span>；<span class='w'>而离线学习的场合你只关心前者——数据已经采完了，行为策略好不好已成定局</span>。", "<b>最后一行给出的是一个很自然但不唯一的选择：<span class='k'>让行为策略是「对当前 Q 的 ε-贪婪」</span>。</b><b>这样它既在探索（ε 那部分），又在利用已学到的东西（贪心那部分）。</b><span class='w'>但 Q-learning 的收敛<b>不要求</b>行为策略是 ε-贪婪的</span>——<b>它只要求每个 <code>(s,a)</code> 被访问无穷多次。</b><span class='k'>完全随机的行为策略同样能让 Q-learning 收敛到 <code>Q*</code></span>，<b>只是收敛会慢（因为你把时间浪费在明显很差的动作上）。</b>"]},
{"r": [37, 38], "t": "ε-贪婪的 Q-learning", "star": 2, "one": "五行。", "eq": "初始化 Q(s,a)，π_b = ε-greedy(Q)\n循环：\n  取 a_t ~ π_b(s_t)，观察 (r_t, s_{t+1})\n  Q(s_t,a_t) ← Q(s_t,a_t) + α( r_t + γ·max_a Q(s_{t+1},a) − Q(s_t,a_t) )\n  π_b ← ε-greedy(Q)", "pts": ["<b>Q 怎么初始化要紧吗？</b> 渐近上不要紧；<span class='w'>但一开始很要紧</span>。", "<b>把这个算法和 p31 的 SARSA 并排放，你会看到一个很整齐的差别：<span class='k'>它少了一行</span>。</b><span class='w'>SARSA 需要先采出 <code>a_{t+1}</code> 才能更新（第 5 行），所以更新滞后一步</span>；<span class='k'>Q-learning 只需要 <code>(s,a,r,s′)</code> 四元组，拿到就能更新</span>。<b>因为那个 <code>max</code> 不需要采样，直接查表取最大就行。</b><span class='w'>这个差别看着小，但它意味着 Q-learning 能用<b>任何来源</b>的四元组</span>——<b>包括别人采的、很久以前采的。</b><span class='k'>DQN 的经验回放池能成立，靠的正是这一条。</span>", "<b>第 7 行那个「策略改进」在 Q-learning 里其实是免费的，值得点明。</b><span class='k'>因为行为策略被定义成「对当前 Q 的 ε-贪婪」，所以 Q 一更新，策略自动就更新了</span>——<b>不需要额外做什么。</b><span class='w'>这和 L02 的策略迭代形成对比：那里「改进」是一个真的要算的步骤</span>。<b>于是 Q-learning 里「评估」和「改进」彻底融合成了一步</b>——<span class='k'>它更像值迭代而不是策略迭代</span>。", "<b>这也解释了 Q-learning 和 L02 值迭代的关系，这个对应值得记住。</b><span class='k'>L02 的值迭代：<code>V(s) ← max_a [R(s,a) + γΣP(s′|s,a)V(s′)]</code></span>；<span class='k'>Q-learning：<code>Q(s,a) ← Q(s,a) + α(r + γ max_{a′}Q(s′,a′) − Q(s,a))</code></span>。<b>后者就是前者的「无模型 + 采样 + 增量」版本</b>：<span class='w'>用一个采样的 <code>(r, s′)</code> 代替对 <code>s′</code> 的求和，用增量更新代替整表替换</span>。<b>所以 L03 对 L02 做的事（把 DP 变成采样），Q-learning 对值迭代又做了一遍。</b>"], "say": "课上有同学提议<b>乐观初始化</b>（把 Q 初始化得很高）。老师说这招很好用：初值挑得对的话，还能给出「要多少数据才收敛到最优」的可证明保证。探索那几讲会细讲。", "quote": "<b>Q-Learning with ε-greedy Exploration</b> &nbsp;·&nbsp; 2: Set b to be ε-greedy w.r.t. Q &nbsp;·&nbsp; 4: Take a_t ∼ b(s_t) &nbsp;·&nbsp; 5: Observe (r_t, s_{t+1}) &nbsp;·&nbsp; 6: Update Q given (s_t, a_t, r_t, s_{t+1}) &nbsp;·&nbsp; 7: Perform policy improvement: set b to be ε-greedy w.r.t. Q"},
