{"r": [37, 40], "t": "围棋：规则是已知的，难在搜索空间", "star": 2, "quote": "<b>Case Study: the Game of Go</b> — <em>Go is <b>2500 years old</b> · Hardest classic board game · Grand challenge task (<b>John McCarthy</b>) · <b>Traditional game-tree search has failed in Go</b></em><br><em><b>Check your understanding</b>: does playing Go involve learning to make decisions in a world where <b>dynamics and reward model are unknown</b>?</em><br><b>Position Evaluation in Go</b> — <em>R<sub>t</sub> = 0 for all non-terminal steps t &lt; T · R<sub>T</sub> = 1 if Black wins, 0 if White wins</em> · <em>v<sub>π</sub>(s) = P[Black wins | S=s]</em> · <em>v*(s) = max<sub>π<sub>B</sub></sub> min<sub>π<sub>W</sub></sub> v<sub>π</sub>(s)</em>", "one": "<b>p37 那个问题的答案是「否」——围棋的规则和奖励结构都是已知的。它难在搜索空间极大，不在动力学未知。</b>", "pts": ["⚠️ <b>p37 的 check your understanding 很容易答错，而答错会误解整个 AlphaGo 故事。</b> <span class='w'>实录的答案是否</span>：<em>this does <b>not</b> involve decision-making in the case where the dynamics and reward model are unknown, <b>but the rules of Go are known. The reward structure is known</b>, but it's an <b>incredibly large search space</b></em>。", "<b>把这件事说清楚：围棋是一个<b>规划</b>问题，不是一个<b>学习</b>问题。</b> <span class='k'>你完全知道落子之后棋盘会变成什么样（转移是确定的、已知的），也完全知道终局怎么判（奖励已知）</span>。<b>所以这里一个「模型」都不用学</b>——<span class='w'>而本讲前半讲的全是怎么学模型</span>。<b>围棋用到的是本讲的后半：有了（给定的）模型之后怎么规划。</b>", "<b>这个区分值得记牢，因为它影响你怎么读整个深度 RL 的成绩单。</b> <span class='k'>围棋的成功是「规划 + 搜索 + 函数近似」的成功，不是「从未知动力学中学习」的成功</span>。<b>而机器人、医疗、教育这些场景的难点恰恰在后者</b>——<span class='w'>所以「AlphaGo 都解决了，这个应该也行」这种推理是不成立的</span>。<b>两者难的地方不是同一个地方。</b>", "<b>p37 还有一行值得注意</b>：<em><b>traditional game-tree search has failed in Go</b></em>。<span class='k'>而国际象棋恰恰是被传统树搜索（加剪枝、加人工评估函数）攻克的</span>。<b>区别在分支因子和「局面好坏难不难评」</b>：<span class='w'>围棋分支因子大一个量级，而且没人写得出好的手工评估函数</span>。<b>MCTS 正好绕开了第二个困难——它不需要评估函数，它用 rollout 的结果代替评估。</b>", "<b>p39 的奖励设计是极端稀疏的，而这一点对理解自我对弈很关键。</b> <code>R_t = 0</code> 对所有非终止步；<code>R_T = 1</code> 黑胜、<code>0</code> 白胜。<span class='k'>于是整局棋只有最后一个数，中间几百步没有任何信号</span>。<b>实录强调这是「极其稀疏」的</b>：<b>你必须一路下完才知道谁赢了。</b>", "<b>而值函数在这个设计下有一个特别漂亮的解释。</b> <code>v_π(s) = E[R_T|s] = P[黑胜|s]</code>——<span class='w'>因为奖励是 0/1，期望就等于概率</span>。<b>所以「这个局面值多少」字面上就是「黑方在这个局面下的胜率」</b>。<span class='k'>这个解释让值函数变得极其直观，也是围棋适合做这类研究的一个原因。</span>", "<b>p39 最后一行把两人博弈的结构摆了出来</b>：<code>v*(s) = max<sub>π_B</sub> min<sub>π_W</sub> v_π(s)</code>。<span class='k'>黑方最大化、白方最小化</span>——<b>于是树从 expectimax 变成 <b>minimax</b></b>，<span class='w'>状态节点上取的不再是期望，而是对手的最小化</span>。<b>除此之外整套机制一个字不改。</b>", "<b>还有一条实录提到的性质，解释了为什么围棋是有限时域</b>：<em>it's a finite game because there's a <b>finite number of places to put stones</b> on the board. So it's a <b>finite horizon</b></em>。<span class='k'>于是不需要折扣因子，H 是有界的（虽然 50–200 已经足够大了）</span>。", "⚠️ <b>p40 在 PDF 上只有标题，内容是图。</b> 实录把它口述了，这里按口述还原【<b>补课</b>】：<span class='w'>从当前局面出发，对一个<b>固定</b>对手把棋打完若干局；假设赢了两局输了两局，那么当前局面的值就是 <code>1/2</code></span>。<b>就这么简单——蒙特卡洛评估在围棋里就是「多下几局数一数」。</b>", "<b>注意「固定对手」这个前提，它是下一节自我对弈要打破的东西。</b> <span class='k'>对固定对手的胜率，只说明你相对那个对手有多好</span>——<b>而 <code>v*</code> 的定义里白方是要<b>最小化</b>你的值的</b>。<span class='w'>打固定的弱对手，估出来的值会系统性偏高</span>。<b>这个缺口怎么补，是 p41 之后的事。</b>"], "eq": "⚠ p37 的答案是**否**：围棋的动力学与奖励模型都**已知**\n   落子之后棋盘变成什么样 —— 确定且已知\n   终局怎么判         —— 已知\n   ⇒ 围棋是**规划**问题，不是**学习**问题\n   ⇒ 本讲前半（学模型）在围棋上用不上；用上的是后半（有模型后怎么规划）\n\n   推论：「AlphaGo 都解决了，机器人/医疗应该也行」—— 不成立\n        那些场景难的是动力学未知，不是搜索空间大\n\np37：传统博弈树搜索在围棋上**失败**了（而国际象棋正是被它攻克的）\n     区别：分支因子大一个量级 + 没人写得出好的手工评估函数\n     ⇒ MCTS 绕开第二个困难 —— 它用 rollout 的结果代替评估函数\n\np39 奖励（极端稀疏）：R_t = 0 对所有 t < T；R_T = 1 黑胜 / 0 白胜\n     ⇒ v_π(s) = E[R_T | s] = **P[黑胜 | s]**     0/1 奖励下期望 = 概率\n        「局面值多少」字面上就是「黑方胜率」\n     ⇒ v*(s) = max_{π_B} min_{π_W} v_π(s)\n        两人零和 ⇒ 树从 expectimax 变 **minimax**（状态节点取 min 而非期望）\n        除此之外整套机制一个字不改\n\n有限时域：棋盘上落子的位置有限 ⇒ 游戏必然终止，不需要折扣因子\n\np40（图，按实录还原）：对**固定**对手打若干局，胜 2 负 2 ⇒ 当前局面值 = 1/2\n   ⚠ 「固定对手」是个缺口：v* 里白方要**最小化**你的值\n      打固定的弱对手，估出来的值会系统性偏高 ⇐ 自我对弈要补的正是这个", "tbl": {"head": ["", "围棋", "机器人 / 医疗 / 教育"], "rows": [["动力学已知吗", "<b>已知</b>（规则）", "<span class='w'>未知</span>"], ["奖励已知吗", "<b>已知</b>（谁占地多）", "<span class='w'>常常也未知</span>"], ["难在哪", "<b>搜索空间极大</b>", "<b>动力学未知 + 数据贵</b>"], ["用本讲的哪一半", "<b>后半（规划）</b>", "<b>前半（学模型）</b>"], ["能无限次模拟吗", "<b>能（免费）</b>", "<span class='w'>不能</span>"], ["⇒ 结论", "—", "<b>「围棋都行了」推不出这些也行</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页那个「规划 vs 学习」的区分，正好把你的问题切成两半，而且切在一个很有用的地方。</b><br><span class='k'><b>像围棋的那一半（已知、可免费模拟）</b>：workflow 的结构是已知的（AFlow 搜出来的 DAG）、各档位的单价是已知的、token 数与成本的关系是近乎确定的</span>。<b>所以「这个配置要花多少钱」这件事你可以在本地精确算，一次 API 调用都不用</b>——<span class='w'>这一半是纯规划问题</span>。<br><span class='w'><b>像医疗的那一半（未知、模拟要花钱）</b>：「这个配置在这条 query 上答对吗」，这个只能真跑</span>。<b>没有任何本地模型能可靠地替代它</b>（否则你就不需要那个 LLM 了）。<br><b>而这个切分给了你一个很具体的算法形状。</b> <span class='k'>先在成本那一半做纯规划</span>：<b>在给定预算下枚举所有可行的档位组合——这一步免费，可以穷举到底</b>；<span class='w'>然后只对筛出来的那一小批候选花真实调用去测准确率</span>。<b>这比「在 2^H 上均匀撒点」高效得多，而且理由是结构性的：一半的问题你有免费的模拟器，另一半没有。</b><br><b>再提一条这一页给的警告，它对你的实验设计直接有用：固定对手会让估值偏高。</b> <span class='k'>你的「对手」是 query 分布</span>——<b>如果你一直在同一批 query 上调方法，估出来的 G 会系统性偏高，就像一直打同一个弱对手</b>。<span class='w'>而围棋的解法（自我对弈）在你这里没有直接对应物</span>，<b>最接近的做法是<b>把 query 分难度分层，并在最难的那一层上也报结果</b></b>——<span class='k'>平均 G 好看而难题全错，是这个指标最容易藏住的失败</span>。<br><b>⚠ 最后，那条「AlphaGo 都行了，这个应该也行」的推理不成立，对你是一条提醒而不只是常识。</b> <span class='w'>任何从 AlphaGo/MCTS 借来的做法，都隐含假设「模拟免费」</span>。<b>你每次引用这类方法时，都该先问一句：我这里的模拟要不要花 LLM 调用？</b><span class='k'>要花，那条方法的复杂度分析就全部失效</span>——<b>它算的是「多少次模拟」，而你付的是「多少美元」。</b>", "ref": "课件 p37 · p39 · 实录 p37 · p40（逐句核对）· 简报 §2 §4e（已核）· L16.b p26 科研格"}},
{"r": [41, 45], "t": "在围棋上跑一遍，和自我对弈这个真正的关键", "star": 3, "quote": "<b>Applying Monte-Carlo Tree Search (1)</b> — <em>Go is a 2 player game so tree is a <b>minimax</b> tree instead of expectimax</em> · <em>White <b>minimizes</b> future reward and Black <b>maximizes</b> future reward when computing action to simulate</em><br>〔p42–p45 是那张著名的五格图，PDF 上只有标题，本精读按实录口述还原〕", "one": "<b>五格图一步步给出树怎么长出来。而实录补了一件课件上完全没有、却是围棋真正被攻克的关键：自我对弈。</b>", "pts": ["<b>先把两人博弈那一处改动记住：状态节点上取的不是期望，而是对手的最小化。</b> <span class='k'>白方要最小化黑方的回报</span>，<b>于是 expectimax 变成 minimax</b>。<span class='w'>除此之外 MCTS 的全部机制一个字不改</span>——<b>树策略、rollout、计数、UCT 全都照用。</b>", "⚠️ <b>p42–p45 是那张五格图，PDF 上无正文。按实录口述还原【<b>补课</b>】，一步一格：</b>", "<b>第一格（第一次 rollout）：树还什么都没有。</b> <span class='k'>根节点上没有任何统计，所以随机挑一个动作</span>，<b>之后一律按默认策略（通常就是随机）走到底，看是赢还是输</b>。<span class='w'>于是你得到了一个数，挂在那一条路径上</span>。", "<b>第二格（第二次 rollout）：这次换另一个动作。</b> <span class='k'>实录给了一条通用规则</span>：<em>generally, you want to <b>try all the actions at least once</b> from a current node</em>。<b>所以在把一个节点的所有动作各试一遍之前，不会去深挖任何一条。</b>", "⚠️ <b>而她在这里插了一条实践上极重要的话</b>：<em>the particular <b>order</b> in which you try actions can make a <b>big difference</b>, and early on there were significant savings by putting in <b>action heuristics</b> of what order to try actions in</em>。<span class='w'>先试哪个动作会显著影响效率</span>——<b>这是 AlphaGo 后来用策略网络做的事（给动作排序）在 2019 之前的土办法。</b>", "<b>第三格之后：到了已经访问过的节点，就该用 UCT 了。</b> <span class='k'>看每个动作已有的平均回报，加上计数的加成，取最大</span>，<b>然后把算力集中到那条分支上继续挖</b>。<span class='w'>于是树开始变得<b>偏</b>——一侧深，一侧浅</span>。<b>这就是「故意长成偏的一棵树」的字面意思。</b>", "<b>最后一格：直到算力预算用完。</b> <em>you do this until your <b>computational budget expires</b></em>。<span class='k'>然后从叶子往回收：动作节点取 max，状态节点取 minimax</span>，<b>根节点上那个最大值对应的动作，就是真实世界里要下的那一手。</b>", "<b>接下来是实录独有、而且她自己说这是关键的一条：自我对弈。</b> <span class='w'>学生问「对手是谁」，她的回答是</span>：<em>I think one of the other <b>really big insights</b> to why people got Go to work is <b>self play</b></em>——<b>用当前这个智能体自己当对手。</b>", "<b>她给的理由完全是关于信号的，而这个理由很漂亮。</b> <em>if I play against a <b>grand-master</b> in Go, I get <b>no reward for a really long period of time</b>... there's just <b>no signal</b> for a really, really long time. If I play against <b>me like five minutes ago</b>, I'm probably gonna beat them, or at least half the time maybe I'll beat them</em>。<span class='k'>两个都很弱的棋手对下，总有一个赢一个输——于是立刻就有信号</span>。", "<b>她把这件事的两重作用点明了，值得分开记。</b> ① <b>缓解稀疏奖励</b>（总能拿到胜负这个信号）；② <b>提供课程</b>（<em>it gives you a <b>curriculum</b>, because you're always only playing in an environment that's <b>a little bit more difficult</b> than what you can manage</em>）。<span class='w'>难度自动跟着能力走，不需要人去设计难度曲线</span>。", "<b>学生问了会不会卡在局部最优，答案很实在。</b> <em>Absolutely can happen</em>——<span class='k'>但「你总是在取 max，所以这有点像策略改进，你总在试着做得好一点」</span>；<b>而如果两边都只是各赢一半，那就说明「应该存在可以利用的弱点，而只要规划做得够多，你应该能找出来」</b>。<span class='w'>这个回答没有保证，只有一个机制上的理由。</b>", "<b>另一个学生问得更妙：是不是该在某个时候换成更强的对手。</b> <span class='k'>她认为很可能是的，更大的课程跳跃可能加速学习</span>，<b>但「那个甜蜜点不好找，因为你仍然需要足够的奖励信号来自举」</b>。<b>太弱学不到，太强没信号——这是所有课程学习的共同难题。</b>", "<b>最后她留了一个公开的愿望，而这句话指向一个真正的研究缺口</b>：<em>it would be really, really cool if we could figure out how to take the same ideas to a lot of other domains. Like if there are other ways to essentially <b>make self play for things like medicine or customer relations</b></em>。<span class='w'>自我对弈需要「两个版本的自己可以互相对抗并产生胜负」，而大多数现实任务没有这个结构。</span>"], "eq": "两人博弈的唯一改动：状态节点取 **minimax** 而不是期望\n   白方最小化、黑方最大化。其余机制（树策略 / rollout / 计数 / UCT）一字不改\n\n五格图（按实录还原）：\n  ① 树是空的 ⇒ 随机挑一个动作，默认策略走到底，看赢输\n  ② 换另一个动作 ⇒ 规则：**一个节点的所有动作先各试一次**，再去深挖\n     ⚠ 先试哪个动作会显著影响效率 ⇒ 早期靠**动作启发式**排序\n       （AlphaGo 后来用策略网络做的就是这件事）\n  ③ 到访问过的节点 ⇒ 用 UCT 取最大，把算力集中到那条分支\n     ⇒ 树开始变**偏**：一侧深，一侧浅\n  ④ 直到**算力预算用完**\n  ⑤ 从叶子回收：动作节点 max，状态节点 minimax ⇒ 根上的 argmax 就是真实要下的那手\n\n自我对弈（实录独有，她说这是围棋被攻克的关键之一）：\n   打大师    ⇒ 极长时间**没有任何信号**\n   打五分钟前的自己 ⇒ 两个都弱，总有一个赢 ⇒ **立刻有信号**\n\n   两重作用：① 缓解稀疏奖励   ② 提供**课程**（难度自动跟着能力走）\n\n   ⚠ 局部最优会发生；机制上的理由是「总在取 max，像策略改进」\n     若两边都只赢一半 ⇒ 应存在可利用的弱点，规划够多就能找出来（无保证）\n   ⚠ 换更强对手可能加速，但「甜蜜点不好找 —— 仍需足够信号来自举」\n\n   她的公开愿望：能不能为**医疗、客户关系**造出自我对弈？\n   （前提是「两个版本的自己能互相对抗并产生胜负」—— 多数现实任务没有这个结构）", "tbl": {"head": ["对手选谁", "信号", "课程", "问题"], "rows": [["大师", "<span class='w'>极长时间没有</span>", "<span class='w'>太陡</span>", "学不动"], ["<b>五分钟前的自己</b>", "<b>立刻有（总有一方赢）</b>", "<b>自动跟着能力走</b>", "可能卡在局部最优"], ["固定的弱对手", "有", "<span class='w'>不增长</span>", "<b>估值系统性偏高</b>（p40）"], ["⚠ 适用前提", "—", "—", "<b>要能「两个自己对抗并产生胜负」</b>"]]}, "res": {"tag": "推断", "v": "<b>自我对弈在你这里没有直接对应物，而说清为什么没有，比硬套一个要有价值。</b><br><span class='k'>自我对弈需要一个<b>对抗</b>结构：两个版本的自己互相博弈，胜负自然产生</span>。<b>而你的问题是单边优化</b>——<span class='w'>没有对手，query 不会因为你变强而变难</span>。<b>所以这条路线借不过来，这是实话，不必勉强。</b><br><b>但它的第二重作用——课程——是可以借的，而且该借。</b> <span class='k'>她说课程的好处是「总在略微超出当前能力的环境里训练」</span>。<b>翻译到你这里：按难度给 query 分层，而不是把它们混成一池</b>。<span class='w'>而你有一个现成的难度定义：在 oracle 表里，「全用 72B 也答错」的 query 是最难的，「全用 7B 也答对」的是最简单的</span>。<b>这个分层是免费的副产品，而它会立刻暴露一件事</b>：<b>节点级指派的收益很可能几乎全部来自中间那一层</b>——<span class='k'>最简单的 query 任何配置都对（省钱即赚），最难的任何配置都错（省钱也是赚，但那是另一回事）</span>。<b>如果你的平均 G 提升主要来自「在简单题上省钱」，那结论的分量就小得多，而审稿人会问。先自己算出来。</b><br><b>而 p40 那个「固定对手让估值偏高」的警告在这里要升级成一条硬规矩。</b> ⚠ <span class='w'>你一直在同一批 query 上调方法，这正是「打固定的弱对手」</span>——<b>报出来的 G 会系统性偏高，而且偏多少你不知道</b>。<b>唯一的解药是留一批从头到尾没被看过的 query，只在最后跑一次</b>。<span class='k'>这和 L15 p55 的 20%/80% 是同一条规矩，而这一页给了它一个很好记的说法</span>。<br><b>最后一条可以直接用上的：动作顺序的启发式。</b> <span class='w'>实录说「早期靠给动作排序省下了大量算力」，而 AlphaGo 的策略网络做的就是这件事</span>。<b>你的对应物是：先扫哪些节点</b>。<span class='k'>如果你的一步偏离扫描要在 H 个节点里挑 k 个，那么<b>按「这个节点的 token 占比」排序</b>几乎肯定比随机顺序好</b>——<b>成本集中在输出长的节点上，那里的档位切换收益最大</b>。<b>这是一个零成本的先验，而且它能把扫描的预算省下一大截。</b><br>标【推断】：难度分层、排序启发式与那条「收益可能全在中间层」的预测都是我推的；oracle 表与一步偏离扫描在简报里是【已核】。", "ref": "课件 p41 · 实录 p42–p45（五格图与自我对弈，逐句核对）· p40 · L15 p55 · 简报 §4c §4d（已核）"}},
{"r": [46, 46], "t": "MCTS 的好处：五条，而「随时可停」最被低估", "star": 2, "quote": "<b>Advantages of MC Tree Search</b> — <em>Highly <b>selective</b> best-first search</em> · <em>Evaluates states <b>dynamically</b> (unlike e.g. DP)</em> · <em>Uses <b>sampling</b> to break curse of dimensionality</em> · <em>Works for <b>“black-box”</b> models (only requires samples)</em> · <em>Computationally efficient, <b>anytime</b>, parallelisable</em>", "one": "<b>五条好处，每一条都对应前面某一处代价的解除。而最实用的是「随时可停」。</b>", "pts": ["<b>第一条「高度选择性的最佳优先搜索」是对 expectimax 那个指数的回答。</b> <span class='k'>不是所有分支一视同仁，而是只深挖看起来好的那些</span>。<b>所以它不是「更快的 expectimax」，而是「只算一部分的 expectimax」</b>——<span class='w'>换来的是不保证最优（除了在极限下）</span>。", "<b>第二条「动态地评估状态」要和动态规划对照才看得出分量。</b> <span class='w'>DP 要给<b>所有</b>状态都算一个值，不管你去不去得了</span>；<b>MCTS 只评估从当前状态出发实际触碰到的那些</b>。<span class='k'>于是计算量和状态空间的大小脱钩，只和「你愿意采多少条轨迹」挂钩</span>。", "<b>第三条「用采样打破维数灾难」说的是同一件事的另一面。</b> <b>期望不必枚举所有下一状态来算，采样就够</b>——<span class='w'>于是 <code>(|S||A|)^H</code> 里那个 <code>|S|</code> 不再直接进来</span>。<b>代价是方差。</b>", "<b>第四条最容易被低估：它只要一个「黑箱」模型。</b> <span class='k'>MCTS 对模型的全部要求是「给我一个 (s,a)，还我一个 (r,s′) 的样本」</span>——<b>不需要显式的转移概率表，不需要可微，不需要任何解析形式</b>。<span class='w'>于是任何能跑的模拟器都能接上</span>：<b>物理引擎、游戏规则、一段遗留代码。</b>", "<b>把这条的意义说透：它解释了为什么 MCTS 在工业界用得比许多「更先进」的方法多。</b> <span class='k'>绝大多数真实系统都有某种模拟器，而很少有系统能给出可微的、解析的动力学</span>。<b>「只要能采样」这个门槛低得几乎人人满足。</b>", "<b>第五条里「随时可停」（anytime）是最实用的一条，而实录给的例子很接地气。</b> <em>whether you have <b>one minute</b> or you have <b>three hours</b> to compute the next action... maybe you're gonna make <b>one decision per day</b> and so you can run it <b>overnight for eight hours</b> and then compute that one decision</em>。<span class='w'>给多少算力就用多少，随时打断都能给出一个答案</span>。", "<b>「随时可停」为什么是一个结构性的好处，而不只是方便？</b> <span class='k'>因为它把「算多久」从算法的设计参数变成了<b>部署时</b>的旋钮</span>。<b>同一套代码，在手机上跑 50 毫秒、在服务器上跑八小时，都是有效的</b>——<span class='w'>而值迭代一类的方法必须跑到收敛才给出可用的策略</span>。<b>这是一个很少被强调、但在工程上极其值钱的性质。</b>", "<b>最后「可并行」也值得一句：K 条轨迹本来就是独立采的。</b> <span class='k'>于是可以同时跑很多条，只在更新统计时同步</span>。<b>⚠ 但要注意这不是完全无损的并行</b>：<span class='w'>并行的那些轨迹看到的是<b>旧的</b>统计，所以它们的选择不如串行时那么有针对性</span>。<b>并行度越高，越接近「均匀撒点」而不是「最佳优先」。</b>"], "tbl": {"head": ["好处", "解除了哪处代价", "换来的代价"], "rows": [["高度选择性", "expectimax 的 (|S||A|)<sup>H</sup>", "<span class='w'>不保证最优（除极限）</span>"], ["动态评估状态", "DP 要算所有状态", "只对「从这里出发」有效"], ["用采样算期望", "枚举所有下一状态", "<span class='w'>方差</span>"], ["<b>只要黑箱模型</b>", "需要显式概率 / 可微", "<b>几乎没有代价 —— 门槛极低</b>"], ["<b>随时可停</b>", "必须跑到收敛才可用", "<b>把算力变成部署时的旋钮</b>"], ["可并行", "串行太慢", "<span class='w'>并行度高则退化为均匀撒点</span>"]]}, "res": {"tag": "推断", "v": "<b>这五条里有三条你已经满足、一条你满足不了，而那一条决定了你能把 MCTS 借过来多少。</b><br><b>满足的</b>：<span class='k'>① <b>黑箱模型</b>——你的「模拟器」就是跑一遍 workflow，完全是黑箱，这正是 MCTS 最不挑的地方；② <b>动态评估</b>——你只关心当前这条 query 该怎么配置，不关心整个 query 空间；③ <b>随时可停</b>——这一条对你特别值钱，下面细说</b>。<br><b>满足不了的是「用采样打破维数灾难」背后那个隐含前提：采样便宜。</b> ⚠ <span class='w'>MCTS 的每一次「采样」是模型里的一步，几乎免费；你的每一次采样是一次真实的 LLM 调用</span>。<b>所以凡是「多采几千条就行」的论证，在你这里都要换成美元重算一遍</b>——<span class='k'>这是 L16.b p37 那条提醒的具体化</span>。<br><b>而「随时可停」这条是你应该主动拿来用的，因为它正好匹配一个真实的部署需求。</b> <span class='w'>如果你的方法要在线上对每条 query 做决策，那么「给我 20 毫秒我给一个配置、给我 200 毫秒我给一个更好的」是一个非常有说服力的性质</span>。<b>而你的成本模型可以支撑这件事</b>：<span class='k'>它是本地的、便宜的，所以在成本那一半上你确实可以做「随时可停」的搜索</span>。<b>具体形状</b>：<b>先给一个默认配置（零搜索），有时间就在成本模型上多搜几步、在预算内换更便宜的组合</b>。<b>这是一条论文里很容易被认可的工程贡献，而且它只用到你已经有的东西。</b><br><b>⚠ 但那条并行的警告要接住，因为它对应一个你很可能会犯的错。</b> <span class='k'>如果你为了省时间，把一步偏离扫描的所有候选<b>并行</b>跑完再比较，那你就失去了「逐次淘汰」的全部好处</span>——<b>并行看到的是旧统计，等于均匀撒点</b>。<span class='w'>而逐次淘汰之所以省钱，正是因为它串行地利用了前面的结果</span>。<b>所以这里有一个真实的取舍：并行省时间，串行省调用。而你的瓶颈是调用（钱），不是时间。</b><br>标【推断】：三条匹配、一条不匹配的判断与随时可停的方案是我推的；成本模型与逐次淘汰在简报／L12 里是【已核】。", "ref": "课件 p46 · 实录 p46（随时可停的例子，逐句核对）· L16.b p37 科研格 · 简报 §4e（已核）· L12（逐次淘汰）"}},
{"r": [47, 47], "t": "★ 乐观在规划里是错的 —— 在脑子里做坏决策不疼", "star": 3, "quote": "<b>In more depth: Upper Confidence Tree (UCT) Search</b> — <em>UCT: treat each tree node as a multi-armed bandit problem · Maintain an upper confidence bound over reward of each arm and select the best arm</em><br><em><b>Check your understanding: Why is this slightly strange?</b> Hint: why were upper confidence bounds a good idea for exploration/exploitation? <b>Is there an exploration/exploitation problem during simulated episodes?</b></em><br><em>Relates to <b>metalevel reasoning</b> (see “Selecting Computations: Theory and Applications”, <b>Hay, Russell, Tolpin and Shimony 2012</b>)</em>", "one": "<b>老虎机里用乐观，是因为你真的要承受坏决策的代价。而在模拟里做坏决策不疼——所以这里该要的不是乐观，是信息价值。</b>", "pts": ["<b>这一页是全讲最值得停的一页，而它的形式是一个问题而不是一个答案。</b> <span class='k'>课件只问「为什么这有点奇怪」，并给了提示：当初乐观为什么是个好主意？模拟过程中真的存在探索-利用问题吗？</span>", "<b>先回忆乐观为什么在老虎机里是对的，这是整个论证的支点。</b> <em>in bandits, why do we do optimism under uncertainty? We do it because <b>we're actually incurring the pain of making bad decisions</b></em>。<span class='w'>乐观的逻辑是「要么你真的拿到高奖励，要么你学到东西」——两种结果都不亏</span>。<b>而这个逻辑成立的前提是：你拉的每一下都真的计入你的总收益。</b>", "⚠️ <b>而在规划里这个前提不成立，这就是全部的答案。</b> <em>The weird thing about doing that for planning is that <b>we're not suffering if we make bad decisions in our head</b></em>。<span class='k'>模拟出来的坏动作不花你任何真实代价</span>——<b>它只花算力</b>。<span class='w'>于是「要么得高奖励，要么学到东西」这个权衡失去了一半：你根本不需要「得高奖励」，你只需要「学到东西」。</b>", "<b>所以真正该优化的目标是什么？她给了名字：信息价值。</b> <em>we're just trying to figure out what actions can I take <b>as quickly as possible</b> in terms of <b>value of information</b>, so that I know what the right action is at the root. And so <b>it doesn't actually matter if I simulate out bad actions</b> if it allows me to get a better decision at the root</em>。<span class='k'>唯一的目标是「尽快确定根节点该走哪一步」</span>——<b>模拟过程中的回报本身毫无价值。</b>", "<b>她给的反例把这个区别变得非常具体，而且是可以照着做的（课件上只有图，这里按实录还原【<b>补课</b>】）。</b> <span class='w'>设在某个节点上有两个动作：<b>A1 的估值高、区间窄</b>（你对它已经很了解）；<b>A2 的估值低、区间宽</b>（你对它所知很少）</span>。", "<b>乐观会怎么选？永远选 A1。</b> <span class='k'>因为 A1 的上置信界更高</span>——<b>UCT 的式子就是取上界最大的那个</b>。<span class='w'>于是你会一遍遍地采 A1，而你对 A1 本来就已经很有把握了</span>。", "<b>而如果你的目标是「<b>确信</b> A1 比 A2 好」，正确的选择是采 A2。</b> <em>if you wanna be really confident that A1 is better, <b>you should select A2</b>, because likely when you do that, you're gonna update your confidence intervals and now you're gonna be <b>totally sure</b> that A1 is best. <b>But this approach won't do that.</b></em> <span class='k'>采 A2 会收窄 A2 的区间，而一旦两个区间分开，结论就定了，一次计算都不用再花</span>。", "<b>把这个道理提炼成一句话，它适用的范围远超 MCTS</b>：<span class='w'><b>要赢，就下注在最好的那个；要<b>知道</b>谁最好，就去测最不确定的那个。</b></span><b>这两件事的最优做法不同，而乐观只对第一件事是对的。</b>", "<b>所以 UCT 其实是用错了目标函数，而实录的最终评价很诚实。</b> <em>it's <b>not clear</b> that the bandits at each node is the optimal thing to do, <b>but it's pretty efficient</b></em>。<span class='k'>它不是对的，但它便宜、好实现、而且够用</span>——<b>这又是本课反复出现的那个模式：简单做法赢。</b>", "<b>课件给了这条正确路线的名字和一篇出处，值得记下来。</b> <b>元层推理</b>（metalevel reasoning）——<span class='w'>把「我接下来该做哪一次计算」本身当成一个决策问题来优化</span>。<b>出处是 Hay, Russell, Tolpin &amp; Shimony 2012,「Selecting Computations: Theory and Applications」</b>。<span class='k'>注意 Stuart Russell 这个名字：这是 AI 教科书那位，而元层推理是他长期的研究主题。</span>", "<b>最后一点值得想：为什么大家还是用 UCT 而不是元层推理？</b> <span class='w'>因为算信息价值本身要花算力</span>——<b>而你花在「想清楚该算什么」上的算力，是从「实际去算」里扣出来的</b>。<span class='k'>这是一个递归的问题，而 UCT 是一个不递归的近似</span>。<b>「用一个次优但便宜的准则，而不是一个最优但要算的准则」，这个取舍本身就是元层推理的结论之一。</b>"], "eq": "老虎机里乐观为什么对：\n   你**真的要承受**坏决策的代价\n   ⇒ 「要么真拿到高奖励，要么学到东西」—— 两种结果都不亏\n   前提：你拉的每一下都计入总收益\n\n⚠ 规划里这个前提**不成立**：\n   「在脑子里做坏决策不疼」—— 模拟的坏动作只花算力，不花真实代价\n   ⇒ 权衡失去一半：你不需要「得高奖励」，你只需要「学到东西」\n   ⇒ 该优化的是 **信息价值（value of information）**\n      唯一目标：尽快确定**根节点**该走哪一步\n      模拟过程中的回报本身毫无价值\n\n反例（实录口述，课件只有图）：\n   A1：估值**高**、区间**窄**（已经很了解）\n   A2：估值**低**、区间**宽**（所知很少）\n\n   乐观（UCT）⇒ 永远选 A1（上界最高）\n                ⇒ 一遍遍采你本来就有把握的那个\n   要**确信** A1 更好 ⇒ 应该选 **A2**\n                ⇒ 采它会收窄它的区间，两个区间一分开，结论就定了\n\n  ⇒ **要赢，下注在最好的那个；要知道谁最好，去测最不确定的那个。**\n     两件事的最优做法不同，而乐观只对第一件是对的\n\n实录的最终评价：UCT **不清楚是最优的，但它相当高效**（又一次「简单做法赢」）\n\n正确的路线有名字：**元层推理**（metalevel reasoning）\n   —— 把「我接下来该做哪一次计算」本身当成决策问题\n   出处：Hay, Russell, Tolpin & Shimony 2012,「Selecting Computations」\n   ⚠ 为什么大家还用 UCT：算信息价值本身要花算力，而那是从「实际去算」里扣的\n      这是个递归问题，UCT 是不递归的近似", "tbl": {"head": ["", "老虎机（真实探索）", "规划（模拟中）"], "rows": [["坏决策要付代价吗", "<b>要</b>（真实遗憾）", "<span class='k'>不要 —— 只花算力</span>"], ["目标", "最大化累积奖励", "<b>尽快确定根节点该走哪步</b>"], ["该优化什么", "<b>乐观 / 上置信界</b>", "<b>信息价值</b>"], ["A1 高窄 / A2 低宽，选谁", "<b>A1</b>", "<b>A2</b>（采它能把区间分开）"], ["UCT 用的是", "<b>乐观</b>", "<span class='w'>乐观 —— 所以目标函数是错的</span>"], ["为什么还用它", "—", "<b>不对，但便宜且够用</b>"]]}, "res": {"tag": "已核", "v": "<b>这一页直接改掉你分配 oracle 预算的方式，而且改法很具体、现在就能做。</b><br><span class='k'>你的处境和这一页完全同形</span>：<b>你要从一堆候选配置里确定哪个最好，而每一次「模拟」是一次真实的 LLM 调用——所以预算有限，必须想清楚花在哪</b>。<span class='w'>而你现在（以及一般的做法）是把 query 预算平均分给候选，或者按「目前看起来最好」的顺序多跑</span>。<b>这一页说那是错的目标函数。</b><br><b>正确的判据：把下一笔预算花在「最可能改变结论」的那一对上。</b> <span class='k'>具体做法</span>：<b>算出每个候选配置的 G 的置信区间，找出所有与当前领跑者<b>区间重叠</b>的候选，把预算花在它们身上</b>——<span class='w'>而区间已经完全低于领跑者的候选，一条 query 都不要再跑</span>。<b>反过来，领跑者本身也不需要再多跑</b>：<span class='k'>多跑它只是把一个已经很窄的区间再收窄一点，不改变任何结论</span>。<b>这正是「A1 高窄 / A2 低宽时该采 A2」在你这里的字面翻译。</b><br><b>这件事的收益是可以估出来的，所以值得写成一节。</b> <span class='w'>一步偏离扫描有 H×k 个候选，而其中绝大多数在几十条 query 之后区间就已经明显低于领跑者</span>——<b>继续跑它们是纯浪费</b>。<b>把预算重新分配到难分的那几对上，等价于在同样的美元数下把有效样本量放大若干倍</b>。<span class='k'>而这个做法和 L12 的「逐次淘汰」是同一件事，只是这一页给了它一个更准确的目标函数</span>：<b>淘汰的判据不该是「平均值低」，而该是「区间已经分开」。</b><br><b>而它和 L15 那一讲接得很紧，值得在论文里并排写。</b> <span class='w'>L15 给的是「怎么算一个可靠的置信下界」；这一页给的是「有了区间之后，下一笔预算该花在哪」</span>。<b>前者是统计，后者是实验设计，而两者用的是同一个区间</b>——<b>所以你算置信区间不只是为了最后报结果，它还是预算分配的输入。这是一个很干净的论证闭环。</b><br><b>⚠ 一处必须警惕：按结果决定接下来跑什么，是一种「看着数据做选择」。</b> <span class='k'>所以最终的置信界必须用没参与过淘汰决策的数据来算，否则又是 L15 p55 那条</span>。<b>最省事的安排：淘汰阶段用一批 query，最终比较用另一批。</b><br><b>最后，那篇出处值得去读：Hay, Russell, Tolpin &amp; Shimony 2012。</b> <span class='w'>它要回答的正是「有限算力下该做哪一次计算」，而你的问题是「有限美元下该做哪一次调用」——结构一样，只是单位不同</span>。<b>如果你要给预算分配一个有理论依据的准则，这是入口。</b><br>标【已核】：乐观的前提、「在脑子里做坏决策不疼」、A1/A2 反例与那句最终评价，均为实录原话逐句核对；预算分配方案是我据此设计的做法。", "ref": "课件 p47 原文与脚注 · 实录 p47（逐句核对）· L12（逐次淘汰）· L15 p55 · p60 科研格 · 简报 §4c（已核）"}},
{"r": [48, 51], "t": "全课五条目标：她自己认为哪一条最有用", "star": 3, "quote": "<b>End of Class Goals</b> — <em>① Define the key features of RL that <b>distinguish it from AI and non-interactive machine learning</b></em> · <em>② Given an application problem, <b>decide if it should be formulated as a RL problem</b>, if yes define it formally (state space, action space, dynamics, reward model), <b>state what algorithm is best suited, and justify your answer</b></em> · <em>③ Implement common RL algorithms including a deep RL algorithm</em> · <em>④ Describe multiple <b>criteria for analyzing</b> RL algorithms: regret, sample complexity, computational complexity, empirical performance, convergence</em> · <em>⑤ Describe the <b>exploration vs exploitation</b> challenge and compare at least two approaches (performance, scalability, complexity of implementation, theoretical guarantees)</em>", "one": "<b>五条目标。而她明说第二条「对很多人来说可能是最有用的那一条」——也就是「这个问题该不该写成 RL，以及怎么写」。</b>", "pts": ["<b>第一条问的是 RL 和别的东西的分界，而实录给的答案只有一个词：数据是自己采的。</b> <em>it's this key issue of the agents being able to <b>gather their own data</b> and make decisions in the world. And so it's the <b>censored data</b> that's very different than the IID assumption for supervised learning</em>。<span class='k'>「删截数据」这个词很准：你只看得到你选过的那些动作的结果，没选的那些永远看不到</span>。", "<b>她还补了和<b>规划</b>的分界，这一半常被忘记。</b> <em>it's also very different from <b>planning</b> because you are <b>reliant on the data you get</b> about the world</em>。<span class='w'>规划有模型、不需要采数据；监督学习有数据、但数据不是自己选的</span>。<b>RL 两样都要面对——这就是它独有的难处。</b>", "<b>第二条是她自己点出的重点，而这句话值得完整记下</b>：<em>this is probably the thing that for many of you might end up being <b>the most useful</b>... I think this is often <b>one of the really hard parts</b>. It has <b>huge implications</b> for how easy or hard it is to solve the problem. And <b>it's often unclear</b></em>。<span class='k'>注意她没说「学会算法最有用」——她说的是「学会判断该不该用、以及怎么形式化」。</span>", "<b>而这一条里最难的是状态空间怎么定，她给了一个很好的例子。</b> <em>there's lots of ways to write down the state space of describing a <b>patient</b> or a <b>student</b> or a <b>customer</b>... <b>If I treat all customers as the same, I have a lot of data. That's probably a pretty bad model.</b></em> <span class='w'>状态定得粗：数据多，但模型差；状态定得细：模型好，但数据少</span>。", "<b>这又回到了<b>函数近似误差 vs 样本效率</b>这个取舍——而它在本讲已经第三次出现了。</b> <span class='k'>第一次：要不要条件在整个历史上（L16.b p23）；第二次：泡茶例子里表达力花在哪（同页）；第三次就是这里</span>。<b>一门课在最后一页又提它一遍，说明这是她认为最该带走的东西之一。</b>", "<b>第三条是实现，不多说。第四条是那五个分析标准，而这一条的价值在于「知道该用哪个」。</b> <span class='w'>遗憾、样本复杂度、计算复杂度、实证表现、收敛性</span>——<b>五个标准不是都适用于每个算法</b>，<span class='k'>而「说清哪个适用、哪个不适用、为什么」正是 L13 p35 那张表要做的事</span>。", "<b>第五条单独把探索-利用拎出来，理由她说得很清楚</b>：<em>it really is <b>quite unique to RL</b>. It <b>doesn't come up in planning, doesn't come up in ML</b></em>。<span class='w'>规划里你有模型，不需要探索；监督学习里数据给定，也不需要</span>。<b>只有「数据由你的决策决定」时，这个问题才出现。</b>", "<b>而第五条要求的比较维度值得照抄下来，它是一张很好用的表头</b>：<b>表现、可扩展性、实现复杂度、理论保证</b>。<span class='k'>注意「实现复杂度」被明确列进去了</span>——<b>这门课反复出现的「简单做法赢」在这里被写成了一条正式的评价维度。</b>", "<b>把五条目标连起来看，它们其实是一条流水线。</b> <span class='w'>①认出这是 RL 问题 → ②形式化并选算法 → ③实现它 → ④评价它 → ⑤处理它独有的那个难点</span>。<b>而她认为最难、最有用的是第二步——也就是动手之前那一步。</b>"], "tbl": {"head": ["目标", "内容", "她的评价 / 要点"], "rows": [["①", "RL 与 AI、非交互式 ML 的分界", "<b>数据是自己采的 ⇒ 删截数据</b>；与规划的分界是「依赖采到的数据」"], ["<b>②</b>", "<b>该不该写成 RL，怎么形式化，选哪个算法</b>", "<b>「对很多人可能是最有用的那一条」· 很难 · 影响极大 · 常常不清楚</b>"], ["③", "实现常见算法，含一个深度 RL 算法", "—"], ["④", "五个分析标准", "<span class='k'>重点是知道哪个<b>不</b>适用（L13 p35）</span>"], ["⑤", "探索-利用，并比较至少两种做法", "<b>RL 独有</b>：规划没有，ML 也没有"], ["⑤的比较维度", "表现 · 可扩展性 · <b>实现复杂度</b> · 理论保证", "<b>「简单做法赢」被写成了正式维度</b>"]]}, "res": {"tag": "已核", "v": "<b>第二条就是简报 §7 第一拳，而 Brunskill 认为它是这门课最有用的一条——这件事本身就是对那一拳分量的确认。</b><br><span class='w'>那一拳是：「为什么这是一个序贯决策问题，而不是 H 个独立选择？」</span><b>而这一页说的正是「判断该不该写成 RL、以及怎么形式化」是最难也最有用的能力</b>。<span class='k'>所以这不是审稿人在挑刺，这是这个领域认为最核心的那个判断</span>。<b>你的回答要配得上它的分量，而你现在有三层材料可以用</b>：<br>· <b>L16.b p23 的可加性实验</b>——实测该不该把别处的证据借到这里；<br>· <b>L15 p42 的课件原话</b>——<em>part of the world is non-Markovian … other parts are Markov</em>，系统的不同部分可以有不同的马尔可夫性；<br>· <b>L13 p35 那五个标准</b>——明确说出哪些适用、哪些不适用。<br><b>三层叠起来，这一拳就从「我们假设它是 MDP」变成「我们测过、而且课件自己给了理由」。</b><br><b>而那个「状态定粗还是定细」的例子直指你的 P2/P3 消融。</b> <span class='k'>她说「把所有客户当成同一个，数据很多，但模型很差」</span>——<b>翻译过来：把所有 query 当成同一个（指派策略只按节点键控），每个格子样本很多，但忽略了 query 之间的差异</b>；<span class='w'>而按 query 特征键控，格子数爆炸、计数退化</span>。<b>这正是 P2/P3 在测的那条曲线，而这一页告诉你该怎么<b>叙述</b>它</b>：<b>不是「我们试了两种键控方式」，而是「我们在函数近似误差与样本效率之间定位了那个取舍点」</b>。<span class='k'>后一种说法把一个工程选择变成了一个有名字的科学问题。</span><br><b>⚠ 还有一条该主动承认的：第五条说探索-利用是 RL 独有的，而你的设定里它基本<b>不</b>存在。</b> <span class='w'>你的评估是离线一次性的，oracle 表跑完就不再采新数据</span>——<b>所以你没有真正的探索-利用问题</b>。<b>主动说这一句有两个好处</b>：<span class='k'>它表明你清楚自己在用什么、不在用什么；而且它解释了为什么你借的是 L15（离线评估）和本讲（规划）而不是 L11–L13（探索）</b>。<b>⚠ 但要注意 p47 那一页是例外</b>：<span class='w'>预算分配确实是一个「该采哪个」的问题，只是它的正确目标是信息价值而不是乐观</span>——<b>所以准确的说法是：我们没有探索-利用问题，但我们有一个元层的计算分配问题。</b><br>标【已核】：五条目标、她对第二条的评价、客户状态空间的例子、第五条的四个比较维度，均为课件与实录原话逐句核对。", "ref": "课件 p49–p51 原文 · 实录 p49–p51（逐句核对）· 简报 §7 第 1 拳 · §5（已核）· L13 p35 · L15 p42 · L16.b p23 科研格"}},
{"r": [52, 53], "t": "她对这个领域的判断：手机上还没有 RL", "star": 2, "quote": "<b>Learning more about RL</b> — <em>CS238: Decision Making under Uncertainty · CS239 · MSE351 Dynamic Programming and Stochastic Control · MSE338 Reinforcement Learning (advanced) · CS332: Advanced Survey of RL</em><br><b>Reinforcement learning</b> — <em>Already seeing incredible results in <b>games</b> and some terrific successes in <b>robotics</b></em> · <em><b>Healthcare, education, consumer marketing...</b></em> · <em>Machines learning to help us, in <b>safe, fair and accountable</b> ways</em>", "one": "<b>她对现状的判断很节制：游戏和机器人有成绩，而真正广阔的那些应用还没落地——「我们手机上还没有 RL」。</b>", "pts": ["<b>p53 那三行的顺序本身就是一个判断：游戏（已成）、机器人（有成绩）、医疗/教育/营销（还没有）。</b> <span class='k'>而最后一行是方法论要求而不是应用</span>：<em>machines learning to help us, in <b>safe, fair and accountable</b> ways</em>。", "<b>实录里那句比较最能说明她的判断</b>：<em><b>most of us do not have RL on our phone yet in the way that we have face recognition on our phone</b>. And so the potential of using these types of ideas for a lot of other types of applications is <b>still enormous</b></em>。<span class='w'>人脸识别已经是基础设施，而 RL 还不是</span>——<b>2019 年她这么说，而这个判断在相当程度上至今仍然成立。</b>", "<b>为什么差距这么大？本讲其实已经给了答案，值得把它们收拢起来。</b> <span class='k'>人脸识别是监督学习：数据可以事先收集、独立同分布、标注可以外包；RL 要自己采数据，而采错数据有真实代价</span>（L15 整讲在处理这件事）。<b>游戏之所以先成，是因为那里采数据免费（模拟器）、而且规则已知（L16.b p37）</b>——<span class='w'>这两个条件现实应用一个都不满足。</b>", "<b>「安全、公平、可问责」这三个词不是客套，实录给了具体含义。</b> <em>typically these systems are going to be part of a <b>human in the loop</b> system. And so allowing the agents to <b>expose their reasoning</b> and <b>expose their limitations</b> will be critical</em>。<span class='k'>注意第二条：不只要说出理由，还要说出<b>自己的局限</b></span>。", "<b>而「暴露局限」和 L15 p69 那条要求是同一件事。</b> <span class='w'>L15 要你「能说清这个保证不保证什么」；这里要系统本身能说出来</span>。<b>一个是对研究者的要求，一个是对系统的要求，而它们是同一种诚实。</b>", "<b>p52 那五门课可以按用途分一下，不必全记。</b> <span class='k'>CS238 / MSE351 偏规划与动态规划（有模型）；MSE338 偏理论（Ben Van Roy 的方向）；CS332 是她自己的前沿课题课</span>。<b>实录点名的两位是 Mykel Kochenderfer 与 Ben Van Roy。</b>", "<b>最后值得留意的是她给出的应用清单：医疗、教育、消费者营销。</b> <span class='w'>这三个正是她实验室的方向，也正是 L15 那一讲用来举例的那些</span>——<b>而它们的共同点是「数据贵、犯错有真实代价、不能随便做 A/B」</b>。<span class='k'>所以 L15（离线评估与安全改进）不是一个附带的话题，它是这些应用能不能落地的前提。</b>"], "tbl": {"head": ["领域", "状态（2019）", "为什么", "本课哪一讲对应"], "rows": [["游戏", "<b>已成</b>", "<b>采数据免费 + 规则已知</b>", "本讲（规划 / MCTS）"], ["机器人", "有成绩", "模拟器可用，但有现实差距", "L11 等"], ["医疗 / 教育 / 营销", "<span class='w'>还没有</span>", "<b>数据贵 · 犯错有代价 · 不能 A/B</b>", "<b>L15（离线评估与安全改进）</b>"], ["对比：人脸识别", "<b>已是基础设施</b>", "监督学习：数据可事先收集、IID", "—"], ["她的要求", "安全 · 公平 · 可问责", "<b>系统要能说出自己的理由和局限</b>", "L15 p69"]]}},
{"r": [54, 55], "t": "两页图：课程评估与早期围棋结果", "star": 1, "quote": "<b>Getting Your Feedback</b>〔p54〕 · <b>MCTS and Early Go Results</b>〔p55〕〔两页在 PDF 上只有标题，正文是图〕", "one": "<b>这两页一页是课程评估、一页是早期围棋程度的实力曲线图。本精读不还原图里的数字。</b>", "pts": ["⚠️ <b>p54 是课程评估环节</b>（实录里她请大家用十分钟填课程评价），<span class='k'>没有知识点，本精读不写内容</span>。", "⚠️ <b>p55 是「MCTS 与早期围棋结果」，PDF 上只有标题，正文是图</b>（按常例是各程序的棋力曲线）。<span class='w'>实录在这里说的是 <em>I'm gonna skip this for now</em>——她当堂跳过了这一页，直接去讲 p47 那个「有点奇怪」的问题</span>。<b>所以这一页既没有课件正文，也没有口头讲解，本精读不补。</b>", "<b>不过有一件事可以从这里说清楚，而且是读任何「早期结果」图时都该注意的。</b> <span class='k'>MCTS 之前的围棋程序大约在业余中低段徘徊，而 MCTS 把它推到了业余高段/低职业段；再往上到战胜顶尖职业棋手，靠的是 AlphaGo 加上的那些东西</span>（<b>策略网络、值网络、自我对弈</b>）。<span class='w'>⚠ 这段进程的具体段位与年份本精读不给数字</span>——<b>要引用请查 p58 提到的那几篇原文。</b>", "<b>把这个分工记住，对读 p56–p58 有帮助</b>：<span class='k'>MCTS 提供的是「怎么把算力花在对的分支上」这个骨架；而 AlphaGo 提供的是「rollout 和叶子评估该有多聪明」这个填充</span>。<b>骨架和填充是两件事，下一页就在讲填充。</b>"], "tbl": {"head": ["页", "内容", "本精读怎么处理"], "rows": [["p54", "课程评估环节", "<span class='k'>无知识点，不写</span>"], ["p55", "早期围棋结果（图）", "<span class='w'>她当堂跳过（<em>I'm gonna skip this</em>）；无正文、无讲解，不补</span>"], ["可以记住的", "MCTS 提供<b>骨架</b>（算力花在哪）", "AlphaGo 提供<b>填充</b>（rollout 与叶子评估多聪明）"]]}},
{"r": [56, 58], "t": "变体与 AlphaGo：学一个值函数，就不必 rollout 到底", "star": 3, "quote": "<b>MCTS Variants</b> — <em>UCT and vanilla MCTS are <b>just the beginning</b></em> · <em>Use a <b>better rollout policy</b> (have a policy network? Learned from expert data or from data gathered in the real world)</em> · <em><b>Learn a value function</b> (can be used in combination with simulated trajectories to get a state-action estimate, can be used to <b>bias initial actions considered</b>, can be used to <b>avoid having to rollout to the full episode length</b>, ...)</em><br><b>MCTS and AlphaGo / AlphaZero</b> — <em>MCTS was a critical advance for defeating Go</em> · <em>AlphaGo Zero and AlphaZero have even more impressive performance</em> · <em>AlphaZero has also been applied to <b>Chess</b></em>", "one": "<b>两条变体，正好对应 MCTS 的两个薄弱处：rollout 太傻，以及必须走到终局才拿得到一个数。</b>", "pts": ["<b>先回忆朴素 MCTS 的两个薄弱处，变体就是冲着它们来的。</b> <span class='w'>① <b>rollout 是随机的</b>——所以叶子的估值噪声极大；② <b>必须走到终止</b>才能拿到一个回报——所以每条轨迹都很贵，而且长时域下几乎没信息</span>。", "<b>第一条变体治第一个病：换一个更好的 rollout 策略。</b> <span class='k'>课件提到可以用一个策略网络，而它可以从专家数据学，也可以从真实世界采的数据学</span>。<b>效果是叶子的估值从「随机乱下的结果」变成「还算像样的棋手下出来的结果」</b>——<span class='w'>方差小得多，而且更接近真实的值</span>。", "⚠️ <b>但这里有一个取舍要注意，课件没写。</b> <span class='k'>rollout 策略越强，估出来的值越接近 <code>q^{该策略}</code> 而不是 <code>q*</code></span>——<b>而 MCTS 要的是 <code>q*</code></b>。<span class='w'>随机 rollout 虽然噪声大，但它不系统性地偏向任何一种下法</span>（这正是 L16.b p32 说的「粗糙但不偏向谁」）；<b>强 rollout 策略噪声小，但会把它自己的偏好带进估值里</b>。<b>这是一个真实的偏差-方差取舍，不是单纯的改进。</b>", "<b>第二条变体治第二个病，而它的三个用途课件列得很完整，值得逐条看。</b> ① <b>和模拟轨迹结合，给出状态-动作的估值</b>；② <b>给初始考虑的动作排序</b>（就是 p42–45 那个「动作顺序很要紧」的正式解法）；③ <b>避免必须 rollout 到整幕结束</b>。", "<b>第三个用途是最关键的，把它说透。</b> <span class='k'>有了值函数，你可以走 d 步就停下，用值函数估计剩下的部分</span>——<b><code>G ≈ r₁+…+r_d + V(s_d)</code></b>。<span class='w'>于是每条轨迹的代价从 H 步降到 d 步</span>。<b>在 H 是 50–200 的围棋里，这是一个数量级的节省。</b>", "<b>而这正是自举重新出现的地方，值得点明。</b> <span class='w'>L16.b 说过 UCT 是蒙特卡洛式的、没有自举，代价是方差大</span>；<b>而「走 d 步然后用 V 估剩下的」就是自举——它就是 n 步回报</b>。<span class='k'>于是 MCTS 从纯 MC 滑向了 TD 那一侧，拿方差换偏差</span>。<b>这门课从 L03 开始反复出现的那个旋钮，在最后一页又出现了一次。</b>", "<b>把两条变体和 AlphaGo 对上，整个故事就完整了。</b> <span class='k'>策略网络 = 更好的 rollout 与动作排序；值网络 = 避免 rollout 到底</span>；<b>而自我对弈（实录那条）= 这两个网络的训练数据从哪来</b>。<span class='w'>三样东西填在 MCTS 这个骨架上</span>——<b>p58 说得很准：<em>MCTS was a <b>critical advance</b> for defeating Go</em>，是「关键的一步」而不是「全部」。</b>", "<b>p58 最后一句值得留意：AlphaZero 也用在了国际象棋上。</b> <span class='k'>而国际象棋本来是被传统树搜索加手工评估函数攻克的（L16.b p37）</span>——<b>所以这件事说明的不是「终于下得了象棋」，而是「同一套不含领域知识的方法，在两个此前需要完全不同技术的游戏上都做到了最好」</b>。<span class='w'>「Zero」这个名字说的就是这件事：不用人类棋谱，只用规则加自我对弈。</b>", "<b>最后收一句本讲的落点。</b> <span class='k'>本讲从「学一个模型」出发，走到「模型就是模拟器」、「模拟器可以拿来想事情」，最后落在「想事情的时候该把算力花在哪」</span>。<b>而最后那个问题（p47）的正确答案本讲并没有给出——它只给了名字（元层推理）和一篇出处</b>。<span class='w'>一门课以一个未解决的问题收尾，而不是以一个结论收尾</span>——<b>这和 L15 p67 把「行为策略确定性怎么办」列为开放问题是同一种姿态。</b>"], "eq": "朴素 MCTS 的两个薄弱处，与对应的两条变体：\n\n  ① rollout 是随机的 ⇒ 叶子估值噪声极大\n     变体：**更好的 rollout 策略**（策略网络，从专家数据或真实数据学）\n     ⚠ 取舍（课件未写）：rollout 越强，估的越接近 q^{该策略} 而不是 q*\n        随机 rollout 噪声大，但**不偏向任何下法**\n        强 rollout 噪声小，但把自己的偏好带进估值\n        ⇒ 真实的偏差-方差取舍，不是单纯改进\n\n  ② 必须走到终止才拿到回报 ⇒ 每条轨迹都贵，长时域几乎没信息\n     变体：**学一个值函数**，三个用途 ——\n        · 与模拟轨迹结合给出状态-动作估值\n        · 给初始考虑的动作**排序**（p42–45 那个「顺序很要紧」的正式解法）\n        · **避免 rollout 到整幕结束**：\n              G ≈ r_1 + … + r_d + V(s_d)        走 d 步就停\n              ⇒ 每条轨迹从 H 步降到 d 步（围棋 H=50~200 ⇒ 省一个数量级）\n        ⚠ 而这就是**自举**重新出现 —— 它就是 n 步回报\n          ⇒ MCTS 从纯 MC 滑向 TD 一侧：拿方差换偏差\n\nAlphaGo = MCTS（骨架）+ 策略网络（rollout 与排序）+ 值网络（不必走到底）\n          + 自我对弈（这两个网络的训练数据从哪来）\n  ⇒ p58 的说法很准：MCTS 是 **critical advance**，不是全部\n\np58 末句：AlphaZero 也用在国际象棋上\n  ⚠ 意义不是「终于下得了象棋」（象棋本来就被传统树搜索攻克了），\n    而是**同一套不含领域知识的方法，在两个此前需要完全不同技术的游戏上都最好**\n    「Zero」= 不用人类棋谱，只用规则 + 自我对弈", "tbl": {"head": ["变体", "治哪个病", "代价"], "rows": [["更好的 rollout 策略", "<b>叶子估值噪声大</b>", "<span class='w'>把策略自己的偏好带进估值（估 q<sup>π</sup> 而非 q*）</span>"], ["学值函数：给动作排序", "动作顺序很要紧", "值函数本身要训练"], ["<b>学值函数：走 d 步就停</b>", "<b>必须 rollout 到终局</b>", "<b>引入自举偏差（= n 步回报）</b>"], ["AlphaGo 的构成", "MCTS 骨架 + 策略网络 + 值网络 + 自我对弈", "<b>MCTS 是关键一步，不是全部</b>"]]}, "res": {"tag": "推断", "v": "<b>「学一个值函数来避免 rollout 到底」这条变体，就是你的成本模型在这个框架里的确切位置——而说清这一点，等于给你的做法找到了一个有文献的身份。</b><br><span class='k'>MCTS 的问题是「每条 rollout 都要走到终局才拿到一个数」，太贵；解法是训一个值函数，走几步就用它估剩下的</span>。<b>你的问题是「每个配置都要真跑一遍才知道 G」，太贵；而你的成本模型做的正是同一件事</b>——<span class='w'>用一个学出来的函数替代昂贵的实际展开</span>。<b>把它这样写出来，比说「我们训了一个回归器」准确得多，而且把你的工作接进了一条成熟的线。</b><br><b>而那三个用途你可以逐条对照，会发现第二个你还没用上。</b> ① <b>与实际结果结合给出估值</b>——你在做（表内用真值、表外用模型）；② <b>给要考虑的动作排序</b>——<span class='k'>你还没用</span>，<b>而这正好是 L16.c p41 那条「先扫哪些节点」的建议</b>：<span class='w'>用成本模型预测各节点切换档位的成本变化，按幅度排序，先扫幅度大的</span>；③ <b>避免走到底</b>——<b>你的对应是「不必把整条 workflow 跑完就能估出成本」</b>，<span class='k'>这个你已经有了，而且这就是成本那一半能纯本地规划的原因</span>。<br><b>⚠ 但那条课件没写的取舍你必须接住，因为它在你这里有一个更尖锐的版本。</b> <span class='w'>rollout 策略越强，估出来的越是「那个策略的值」而不是「最优值」</span>。<b>你的版本是：成本模型是在<b>某个分布</b>的配置上训的</b>——<span class='k'>如果训练数据主要来自接近 AFlow 基线的配置（因为一步偏离扫描就是在基线附近采的），那么模型在远离基线的配置上会系统性地不准</span>。<b>而你恰恰要用它去搜远处</b>。<b>这是「用近处的数据去外推远处」，而它和 L16.a p13 那个「模型利用」正反馈叠在一起会很危险</b>：<span class='w'>模型在远处不准 + argmax 专门去找预测偏低的格子 = 系统性地选到远处那些模型瞎猜的配置</span>。<b>两条防护仍然是那两条</b>：<b>按训练密度做悲观修正，以及最终入选的配置必须实际跑一遍。</b><br><b>最后一条是姿态上的，但值得记。</b> <span class='k'>本讲以一个未解决的问题（p47 的元层推理）收尾，而不是以结论收尾；L15 也以 p67 那个开放问题收尾</span>。<b>两讲都把自己方法的边界明确地摊了出来</b>——<span class='w'>而这正是 L15 p69 要求你会做的那件事</span>。<b>你的论文最后一节照这个姿态写，是最省力也最可信的做法。</b><br>标【推断】：身份对应、排序建议与外推风险是我推的；成本模型与一步偏离扫描在简报里是【已核】。", "ref": "课件 p56–p58 · L16.a p13 科研格 · L16.c p41 科研格 · L15 p67 · p69 · 简报 §4c §4e（已核）"}}
];

var TH = {"title": "L16 接上课题的哪一段：给你现有做法一个名字，和一处该立刻改的实验设计", "arc": "<b>这一讲的用处和 L15 很不一样。</b> L15 是课题所在的那片地；<b>而这一讲是给你<b>已经在做的事</b>找到名字、找到文献、找到它们已知的性质</b>——然后在一个地方让你立刻改做法。<br><br><b>四件对上号的事。</b><br><b>① 你的成本模型是模型基 RL 里的那个「模型」</b>（p6–p13），<span class='k'>而更准确地说，它是 p57 那条变体：<b>学一个值函数，用来避免 rollout 到整幕结束</b></span>——用一个便宜的学出来的函数替代昂贵的实际展开，这正是它在做的事。<b>而这个身份顺带送了你一个免费的东西</b>：<span class='w'>零样本迁移（p13，实录独有）——λ 只出现在奖励函数里，动力学与它无关，<b>所以整条 λ 曲线是零成本的</b></span>，换一个 λ 在 oracle 表上重取 argmax 即可，一次调用都不加。<b>这把「λ 的敏感性分析」从做不起变成顺手就有。</b><br><b>② 你的一步偏离扫描<b>恰好</b>是一步策略改进</b>（p29）。<span class='k'>把 π 取成 AFlow 基线，课件那个算法逐字变成你的扫描</span>。<b>于是你拿到一条保证（策略改进定理：不会变差）和一个天花板（上限由基线决定）</b>——<b>这正面回答了「为什么不直接搜整个空间」：因为我们做的是有保证的一步改进，而不是无保证的全局搜索。</b><br><b>③ 一个该立刻改的实验设计</b>（p47，本讲最值钱的一页）。<span class='w'>老虎机用乐观，是因为你真的要承受坏决策的代价；而在规划里「在脑子里做坏决策不疼」，所以该优化的是<b>信息价值</b>而不是乐观</span>。<b>翻译到你这里：下一笔 query 预算该花在<b>与领跑者区间重叠</b>的候选上，而不是花在领跑者身上</b>——<span class='k'>多跑领跑者只是把一个已经很窄的区间再收窄，不改变任何结论</span>。<b>这把「逐次淘汰」的判据从「平均值低」纠正成「区间已经分开」，而它等价于在同样的美元数下把有效样本量放大若干倍。</b><br><b>④ 一个决定你该用表还是用树的实验</b>（p18 + p36）。<span class='w'>MCTS 不合并相同状态的计数，而实录说理由<b>不是</b>统计上不对、而是实现麻烦</span>；<b>你的格子只有 H×k 几十个、每条 query 都会经过，所以合并几乎没有代价、却能把样本量乘上 query 数</b>。<span class='k'>但合并等于断言「节点档位的效果与路径无关」</span>——<b>而 p18 那个 AB 例子给了检验它的办法</b>：<b>用 k=1 的数据预测 k=2 的 G，和真值比</b>。<b>误差小 ⇒ 可加 ⇒ 可以外推整个配置空间（成本降一个数量级）；误差大 ⇒ 节点间有交互 ⇒ 「序贯决策」这个框架才真正必要。</b><span class='w'>无论哪一边都是一个能写的结论，而现在这个问题是悬着的。</span><br><br><b>而一条贯穿全讲的硬约束必须记死：MCTS 的全部便宜建立在「模拟免费」上。</b> <span class='k'>它算的是「多少次模拟」，而你付的是「多少美元」</span>。<b>你只有半个模拟器</b>：<span class='w'>成本那一半可以纯本地算（所以「在预算内枚举所有档位组合」是免费的、可以穷举到底）；准确率那一半只能真跑</span>。<b>这条界线把你的算法切成两段——先在免费的那一半上穷举筛选，再只对筛出来的少数候选花真实调用</b>，<b>而这个两段式的理由是结构性的，不是工程偷懒。</b>", "pitfalls": [{"v": "<b>把 MCTS 一类的方法照搬过来，而不先问「我这里的模拟要不要花钱」。</b> <span class='w'>围棋的动力学与奖励都是已知的（p37 的答案是「否」——它不是动力学未知那类问题），而且模拟免费</span>。<b>这两个条件你一个半都不满足</b>。<span class='k'>所以任何「多采几千条就行」的论证都要换成美元重算一遍</span>，<b>而那些方法的复杂度分析会直接失效</b>。", "tag": "已核", "ref": "课件 p37 · 实录 p37（逐句核对）· L16.b p37 科研格"}, {"v": "<b>把「成本模型 R² 高」当成「决策好」—— 但也别把这条警告用过头。</b> <span class='k'>⚠ 实录给了前提：<b>完美</b>模型 + <b>完美</b>参数估计<b>是</b>足够做好决策的</span>；<b>失败需要数据受限或表达力受限</b>（泡茶例子：容量花在日落和蒸汽上，而决策只需要水温 &gt; 100）。<b>所以该做的不是恐慌，是换指标</b>：<span class='w'>决策只需判断 <code>V(s,a₁) &gt; V(s,a₂)</code>，所以报<b>成对排序准确率</b>，而且只在「真值差距小」的配置对上算——差距大的谁都排得对</span>。", "tag": "已核", "ref": "实录 p23–p24（逐句核对）· L13 p26 · L16.b p23 科研格"}, {"v": "<b>按「目前看起来最好」来分配 query 预算。</b> <span class='w'>这是乐观，而乐观的前提是你真的要承受坏决策的代价——在离线筛选里你不承受</span>。<b>正确的判据是信息价值：花在<b>区间与领跑者重叠</b>的候选上；区间已完全低于领跑者的，一条都不要再跑；领跑者本身也不必再跑。</b> ⚠ <b>而按结果决定接下来跑什么是一种「看着数据做选择」</b>，<span class='k'>所以最终置信界必须用没参与过淘汰决策的那批 query 来算</span>。", "tag": "已核", "ref": "课件 p47 与脚注 · 实录 p47（逐句核对）· L15 p55 · L12（逐次淘汰）"}, {"v": "<b>合并了相同 (节点, 档位) 的统计，却没检验可加性。</b> <span class='k'>合并是对的做法（MCTS 放弃它只因实现麻烦，而你的格子少、重复率高）</span>，<b>但它等于断言「节点档位的效果与路径无关」</b>。<span class='w'>如果前面节点用 7B 导致输入质量下降，后面节点用 72B 的边际收益会完全不同——那就是交互，合并会把它抹平</b>。<b>必须跑 p18 那个可加性检验，而且要看误差的<b>分布</b>而不是均值</b>：<b>「平均误差小、少数 query 上误差极大」是最麻烦的情形。</b>", "tag": "推断", "ref": "实录 p36（不合并的理由，已核）· 课件 p18 · L16.a p18 科研格 · L13 p26"}, {"v": "<b>用成本模型预测去填 oracle 表的空格，再拿这张「补全的表」去训练或校准成本模型。</b> <span class='w'>这正是 p22 那条确认偏误：补进去的格子不含新信息，但会让表看起来更满、让任何基于计数的置信度虚高</span>。<b>规矩：模型预测的格子与实际跑的格子必须始终可区分，算置信界时只数实际跑的那些。</b>", "tag": "推断", "ref": "实录 p22（确认偏误，已核）· L12 p16 · L16.a p19 科研格"}, {"v": "<b>做多轮扫描（把这一轮挑出的配置当新基线再扫）而不换数据。</b> <span class='k'>一步改进的上限由基线决定，所以想突破就得做多轮——这是对的方向</span>；<b>但每一轮都在同一批 query 上取 argmax，L04 p42 的最大化偏差会累积</b>。<span class='w'>多轮扫描必须每轮换一批 query，这是能不能做多轮的决定性条件。</span>", "tag": "推断", "ref": "课件 p29 · L04 p42 · 简报 §4c（已核）"}, {"v": "<b>把成本模型用在远离训练分布的配置上，还对它取 argmax。</b> <span class='w'>一步偏离扫描采的是基线附近的数据，所以模型在远处系统性不准；而 argmax 专门去找预测偏低的格子——那往往就是训练数据稀少的格子</span>。<b>这是 p13 那个「模型利用」正反馈的具体形态</b>。<b>两条防护</b>：<span class='k'>① 按训练密度做<b>悲观</b>修正（⚠ 注意符号：探索时乐观是对的，而选上线配置时要悲观）；② 最终入选的配置必须实际跑一遍</b>——<b>这一条你付得起，医疗场景付不起。</b>", "tag": "推断", "ref": "课件 p13 · 实录 p13 · L13 p13（β/√N）· L16.c p56 科研格"}, {"v": "<b>把 AlphaGo 当成「RL 能解决这类问题」的论据。</b> <span class='w'>围棋的规则与奖励结构都是已知的，难在搜索空间；而医疗、机器人、你的问题难在动力学未知、数据贵</span>。<b>两者难的不是同一个地方，所以「围棋都行了」推不出别的也行。</b> <span class='k'>她自己的说法更克制：我们手机上还没有 RL，不像人脸识别那样已经是基础设施。</span>", "tag": "已核", "ref": "课件 p37 · p53 · 实录 p37 · p53（逐句核对）"}, {"v": "<b>为了省时间把一步偏离扫描的候选全部并行跑完再比较。</b> <span class='w'>并行的候选看到的是旧统计，等于均匀撒点——于是逐次淘汰的全部好处都失去了</span>（p46 那条并行警告的同一个机制）。<b>这里有个真实的取舍：并行省时间，串行省调用。而你的瓶颈是调用，不是时间。</b>", "tag": "推断", "ref": "课件 p46 · L12（逐次淘汰）· L16.c p46 科研格"}], "ammo": [{"q": "你为什么不直接搜整个配置空间？只扫一步偏离，是不是太弱了？", "a": "<b>因为我们做的是<b>有保证</b>的一步策略改进，而全局搜索没有保证。</b> <span class='k'>把 π 取成 AFlow 基线，CS234 L16 p29 那个算法逐字就是我们的扫描</span>：先在一个节点上偏离（= 先做动作 a），其余节点一律按基线（= 之后按 π），测 G（= 估 q_π），挑最好的（= argmax）。<b>课件的原话是 <em>this is essentially doing 1 step of policy improvement</em></b>。<span class='w'>于是我们继承两样东西：策略改进定理说它<b>不会变差</b>（给定 G 估得准）；而上限由基线决定</span>。<b>要突破这个上限就做多轮——但那时每轮必须换一批 query，否则最大化偏差会累积。</b> <b>相比之下，在 2^H 上做全局搜索既没有不变差的保证，又会把模型误差通过 argmax 放大。</b>", "tag": "推断", "ref": "课件 p29 原文（已核）· L04 p42 · 简报 §4c（已核）"}, {"q": "你的成本模型就是个回归器，这有什么新意？", "a": "<b>它在模型基 RL 的框架里有一个确切的位置：它是 CS234 L16 p57 那条变体——<b>学一个值函数，用来避免 rollout 到整幕结束</b>。</b> <span class='k'>MCTS 的问题是每条 rollout 都要走到终局才拿到一个数，太贵；解法是训个值函数，走几步就估剩下的</span>。<b>我们的问题同形：每个配置都要真跑才知道成本，而模型让这件事变成本地计算</b>。<b>而这个身份带来一个具体的收益</b>：<span class='w'>λ 只出现在奖励函数里、与动力学无关，所以整条 λ 曲线是<b>零成本</b>的</span>（p13 的零样本迁移）——<b>换一个 λ 在 oracle 表上重取 argmax 即可，一次调用都不加</b>。<b>所以 λ 的敏感性分析不是额外工作，是免费的副产品。</b> ⚠ <b>而我们也报了它的局限</b>：<b>成对排序准确率</b>（而不是只报 R²），以及<b>远离训练分布时的悲观修正</b>。", "tag": "推断", "ref": "课件 p57 · p13 · 实录 p13（零样本迁移，已核）· 简报 §2 §4e（已核）"}, {"q": "你怎么决定在哪些配置上花评估预算？", "a": "<b>按信息价值，不按「目前看起来最好」。</b> <span class='k'>CS234 L16 p47 问了一个很好的问题：把每个节点当老虎机为什么「有点奇怪」</span>。<b>答案是：老虎机用乐观，是因为你真的要承受坏决策的代价；而在离线筛选里「做坏决策不疼」，只花算力</b>。<span class='w'>于是该优化的是「尽快确定该选哪个」，而不是「现在就选最好的」</span>。<b>具体做法</b>：<b>算出每个候选 G 的置信区间，预算只花在<b>与领跑者区间重叠</b>的候选上</b>；<span class='k'>区间已完全低于领跑者的，一条 query 都不再跑；领跑者本身也不必再跑——多跑它只是把一个已经很窄的区间再收窄</span>。<b>这把置信区间从「最后用来报结果的东西」变成「预算分配的输入」，是一个很干净的闭环。</b> ⚠ <b>而最终的界用的是没参与过淘汰决策的那批 query。</b> <b>想要有理论依据的准则，入口是 Hay, Russell, Tolpin &amp; Shimony 2012（元层推理）。</b>", "tag": "已核", "ref": "课件 p47 与脚注 · 实录 p47（逐句核对）· L15 p55 · L12"}, {"q": "AlphaGo / MCTS 不是已经解决了这类搜索问题吗？", "a": "<b>没有，而且理由很具体：围棋满足两个我们不满足的条件。</b> ① <span class='k'>CS234 L16 p37 的 check-your-understanding 答案是「否」——围棋的<b>规则与奖励结构都是已知的</b>，它难在搜索空间极大，不在动力学未知</span>；② <b>围棋的模拟<b>免费</b></b>——<span class='w'>而我们的每一次「模拟」是一次真实的 LLM 调用</span>。<b>MCTS 算的是「多少次模拟」，我们付的是「多少美元」，所以它的复杂度分析在我们这里失效。</b><br><b>我们能借的是它的骨架，不是它的预算假设。</b> <span class='k'>我们只有<b>半个</b>模拟器：成本那一半可以纯本地算，准确率那一半只能真跑</span>——<b>所以我们的算法是两段式的：先在免费的那一半上穷举筛选（给定预算下枚举所有档位组合），再只对筛出来的少数候选花真实调用</b>。<b>这个两段式的理由是结构性的。</b>", "tag": "已核", "ref": "课件 p37 · p46 · 实录 p37（逐句核对）· L16.b p37 · L16.c p46 科研格"}, {"q": "为什么用表格式的指派策略，而不是一个神经网络？", "a": "<b>因为我们的决策空间小到可以查表，而这是刻意的设计。</b> <span class='k'>格子是 (节点, 保真度档位)，H×k 约几十个</span>。<b>而 CS234 L16 p36 给了一个很好的对照</b>：<span class='w'>MCTS <b>放弃</b>合并相同状态的计数，而实录说理由不是统计上不对、而是「当成图比当成树实现起来麻烦得多」</span>——<b>模型是马尔可夫的，所以合并本来是合法的、而且会让样本量变大</b>。<b>我们把 MCTS 为工程便利而放弃的那份统计强度拿了回来</b>：<span class='k'>合并之后每个格子的样本量乘以 query 数，而我们的「树」只有 H 层、每层 k 个选择，实现代价接近零</span>。<b>⚠ 代价是合并断言了「档位效果与路径无关」，所以我们跑了可加性检验（用 k=1 的数据预测 k=2 的 G，与真值比）并报告误差分布</b>——<b>而那个检验的结论本身就是一个结果：可加则可以外推整个配置空间，不可加则序贯决策的框架才真正必要。</b>", "tag": "推断", "ref": "实录 p36（已核）· 课件 p18 · L13 科研格 · 简报 §5（已核）"}, {"q": "你的方法里探索与利用是怎么处理的？", "a": "<b>坦白说：我们基本没有探索-利用问题，而说清这一点比硬套一个更可信。</b> <span class='k'>CS234 L16 p51 说探索-利用是 RL 独有的，因为「数据由你的决策决定」</span>；<b>而我们的评估是离线一次性的——oracle 表跑完就不再采新数据</b>。<span class='w'>所以我们借的是 L15（离线评估与安全改进）和 L16（规划），而不是 L11–L13（探索）</span>。<b>⚠ 但有一个例外，而它恰好是我们的贡献之一</b>：<b>预算分配确实是一个「该采哪个」的问题</b>，<span class='k'>只是按 p47 的论证，它的正确目标是<b>信息价值</b>而不是乐观</span>。<b>所以准确的说法是：我们没有探索-利用问题，但我们有一个元层的计算（预算）分配问题，而我们按信息价值而不是按乐观来解它。</b>", "tag": "已核", "ref": "课件 p51 · p47 · 实录 p51（逐句核对）· 简报 §5（已核）"}], "papers": [{"t": "Hay, Russell, Tolpin &amp; Shimony — Selecting Computations: Theory and Applications", "id": "2012（课件 p47 脚注点名，归在 <b>metalevel reasoning</b> 这条线下）", "why": "<b>本讲对这个课题最该去读的一篇。</b> 它要回答的是「有限算力下该做哪一次计算」，<span class='k'>而你的问题是「有限美元下该做哪一次调用」——结构一样，只是单位不同</span>。<b>如果你要给预算分配一个有理论依据的准则（而不是一个启发式），这是入口</b>。⚠ 注意 Stuart Russell 这个名字：元层推理是他长期的研究主题。"}, {"t": "Kocsis &amp; Szepesvári — UCT（Bandit based Monte-Carlo Planning）", "id": "2006 — ⚠ <b>课件没有点名这篇</b>，p36 只说「借用老虎机文献的想法」", "why": "UCT 的标准出处，要引用式子与常数时查它。<b>⚠ 而本精读要提醒的是课件自己留的那个缝</b>：<span class='w'>p36 说「为简单起见可以把每个状态节点当成一个<b>独立</b>的老虎机」，而「独立」明显不成立（同一棵树上的节点共享下游结构）</span>——<b>所以 UCB 的遗憾界在 MCTS 里并不严格适用</b>。<span class='k'>这是又一处「定理的前提没人遵守」，和 L13 p13 那个「只用前 m 个样本」是同一个模式。</span>"}, {"t": "AlphaGo Zero / AlphaZero", "id": "课件 p58 点名（只给了名字，未给完整引文）", "why": "<b>读它们的时候带着这一讲给的分工去读</b>：<span class='k'>MCTS 提供<b>骨架</b>（算力该花在哪条分支），而这些工作提供<b>填充</b>——策略网络（rollout 与动作排序）、值网络（不必走到终局）、自我对弈（这两个网络的训练数据从哪来）</span>。<b>p58 的措辞很准：MCTS 是 <em>critical advance</em>，不是全部。</b> ⚠ <b>AlphaZero 也用在国际象棋上，而象棋本来是被传统树搜索加手工评估函数攻克的</b>——<span class='w'>所以那件事的意义是「同一套不含领域知识的方法在两种此前需要完全不同技术的游戏上都最好」</span>，不是「终于下得了象棋」。"}, {"t": "Sutton &amp; Barto — 讲 TD 的那一章（批更新下的 AB 例子）", "id": "课件 p18 用的就是这个例子", "why": "<b>两边讲法互补，值得对着读。</b> <span class='k'>S&amp;B 强调「批更新下批 TD 与批 MC 的不动点不同」；本讲强调「批 TD <b>等价于</b>先建最大似然模型再规划」</span>——<b>后一种说法更直接地解释了为什么本讲要讲它：它把值函数方法和模型基方法接上了</b>。⚠ <b>而最该记住的是实录那句否定</b>：这个差别<b>不是</b>数据有限或回放不够造成的，两者都用尽全部数据仍然不同——<b>差别来自马尔可夫假设。</b>"}, {"t": "Sutton &amp; Barto — 讲规划与 Dyna 的那一章", "id": "本讲 p19–p22 的「采样式规划」就是 Dyna 的核心想法", "why": "<b>任务清单里把这一章列为「真正的增量」，而这一讲正好是它的入口。</b> <span class='w'>⚠ 一处容易混的地方：Dyna 用模型采的数据去更新<b>值函数</b>，而不是去更新<b>模型</b></span>——<b>后者就是 p22 那条确认偏误</b>。<span class='k'>读 Dyna 时把这条界线划清楚，能省掉一次误解。</span>"}, {"t": "David Silver 的 RL 课程讲义", "id": "课件 p1 署名：<em>with many slides from or derived from David Silver</em>", "why": "<b>本讲是全课唯一一讲大量沿用他人课件，所以叙述风格更接近教科书、少了 Brunskill 平时那种「这里有个坑」的提醒</b>。<span class='k'>于是<b>实录在本讲的价值比往常都高</b></span>：<b>本讲最要紧的几处转折——为什么乐观在规划里是错的（p47）、为什么树故意不合并相同状态（p36）、零样本迁移（p13）、泡茶例子（p23）、自我对弈（p41–45）——几乎全在她的口头补充里，课件上一个字都没有。</b>"}]};

    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      var nf=frame.cloneNode(false); nf.removeAttribute("src");
      frame.parentNode.replaceChild(nf,frame); frame=nf;
      frame.src=SRC+HASH;
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
