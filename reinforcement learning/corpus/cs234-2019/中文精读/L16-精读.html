<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第十六讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs234-2019-l16">

<div id="bar">
  <h1>CS234 第十六讲 · <span>拟合一个模型就等于拥有一个模拟器，而模拟器可以拿来想事情</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 58</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture16_postclass.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L16-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "她给出的「最后一讲讲 MCTS」的两条理由里，哪一条才是教学上的理由？", "o": ["因为期末要考", "因为 AlphaGo 很有名", "因为它把全课讲得最少的那条线 —— 模型基 RL 与规划 —— 带了回来", "因为它比深度 RL 简单"], "a": 2, "why": "她还坦白了为什么模型基讲得少：<em>haven't seen as much success in the deep learning case with models</em>——<span class='k'>不是不重要，是当时还没做出来</span>。紧接着她押了一注：这「很可能是一条富有成果的研究方向」，而后来的世界模型一类工作证明她说对了。"}],
6: [{"q": "实录里埋了一个伏笔：规划不必算出整个值函数，只要算出什么？", "o": ["此刻该做什么动作 —— 而这正是 MCTS 可行的根本原因", "最优策略", "状态的访问次数", "奖励函数"], "a": 0, "why": "<b>这个限制把问题的规模从「整个状态空间」缩到了「当前这一个状态」。</b><span class='w'>值迭代要对所有状态求解；只问当下，就只需要看从这里能到的地方</span>——一个指数大的问题被削成可做的。"}],
11: [{"q": "模型基 RL 有一个课件没写、而实录给出的重要好处。是什么？它的边界在哪？", "o": ["能处理连续动作；边界是动作要有界", "收敛更快；边界是要调学习率", "零样本迁移 —— 奖励函数变了，用旧动力学重新规划即可，不需要任何新经验；边界是只对「奖励变了」成立，动力学变了模型就过时", "能并行计算；边界是需要 GPU"], "a": 2, "why": "她的机器人例子：学会了在这间屋里转向和前进（动力学），原来去那个出口，现在改去另一个并告知新奖励——<b>重新规划即可</b>。<span class='k'>这是模型基方法最硬的一条优势，而它恰恰不在课件上。</span>"}, {"q": "「两处近似误差会复合」的机制是什么？", "o": ["两个误差直接相加", "规划主动去找「模型里看起来最好的地方」，而那与「数据少、模型瞎猜的地方」高度相关 —— 于是优化器专门利用模型的错误，走到更没数据的地方，形成正反馈", "只有在连续空间才会复合", "模型误差会随时间衰减"], "a": 1, "why": "她把这个类比到<b>模仿学习的误差累积</b>：决策把你推向自己最不了解的地方。<span class='w'>在离线 RL 里这叫 model exploitation，是 CQL / MOPO 要解决的核心问题</span>。"}],
14: [{"q": "p14 有一个假设把最难的一半放进了前提里。是哪一个？", "o": ["假设状态空间 S 与动作空间 A 已知 —— 所以「学模型」只指学 P 和 R，不学「世界由什么状态构成」", "假设奖励有界", "假设折扣因子为 1", "假设策略是确定性的"], "a": 0, "why": "<b>表示学习、状态抽象、该用哪些特征，全在这个假设之外</b>——而那才是真正难的部分。<span class='k'>读任何模型基方法时，这是该先确认的一件事。</span>"}, {"q": "表查模型有两种等价实现：显式计数，或者把元组存起来按需随机抽。第二种有什么额外的好处？", "o": ["它只会采出真实发生过的转移，所以优化器没法利用模型在没数据处的瞎猜 —— 代价是完全没有泛化", "计算更快", "它支持连续状态", "它不需要马尔可夫假设"], "a": 0, "why": "这正好对冲了上一页那个「模型利用」风险。<span class='w'>而代价也很实在：没有泛化，没见过的 (s,a) 一条样本都采不出来</span>。两种实现给出同一个分布，但在健壮性与泛化之间的位置不同。"}],
18: [{"q": "同一批八幕数据，批 TD 给 V(A)=0.75，批 MC 给 V(A)=0。差别的来源是什么？", "o": ["马尔可夫假设 —— TD 相信「A 之后会到 B，所以可以借用 B 的证据」，MC 不相信", "TD 的学习率没调好", "数据量不够，回放次数有限", "折扣因子不同"], "a": 0, "why": "⚠ <b>实录明确否掉了「数据有限」这个解释</b>：两者都把八幕用到极限，结论仍然不同。<span class='k'>这不是收敛速度问题，是收敛目标不同</span>——批 MC 收敛到最小均方误差，批 TD 收敛到「最大似然模型 + 规划」。"}, {"q": "那么哪个答案更好？", "o": ["TD 总是更好", "两个都错，真值是 0.5", "取决于世界是否真的马尔可夫：真马尔可夫则 MC 的 0 浪费了那六个 B,1 的证据；非马尔可夫则 TD 的 0.75 借用了一个不成立的假设", "MC 总是更好，因为假设更少"], "a": 2, "why": "真值是 0.75（A 必然到 B，B 以 75% 得 1）。<b>但「真值」这个说法本身就预设了马尔可夫</b>——<span class='w'>如果系统不是马尔可夫，从 A 出发的分布可能确实与从 B 出发不同，那时 MC 的 0 才是对的</span>。"}],
19: [{"q": "既然真实数据就在手上，为什么要先建模型、再从模型里采假数据、再学？", "o": ["因为真实数据不能重复使用", "因为假数据的噪声更小", "因为模型能把片段接起来 —— 合成出真实数据里从未同时出现过的组合（如「A 之后 B 得 1」），而这建立在马尔可夫假设上", "为了节省内存"], "a": 2, "why": "实录原话：<em>we're leveraging the fact here that it's Markov</em>。<span class='k'>最该记住的一句是：假设可以通过「造数据」注入，而不必写进算法里</span>——在合成数据上跑 MC，答案会靠向「在原始数据上跑 TD」。"}, {"q": "p22 上那个 V(A) = 1 是什么？", "o": ["精确的模型基答案", "真值", "批 MC 在原始数据上的答案", "在幻灯片列出的那十来条采样数据上算出来的 —— 精确的模型基答案是 0.75，1 与 0.75 的差就是采样噪声"], "a": 3, "why": "<b>所以这一页同时展示了采样式规划的好处（接得起来）和代价（采样误差）。</b>三个数字放在一起看，前半讲的张力就清楚了：<span class='k'>批 MC 给 0（不借证据）· 精确模型基给 0.75（借且精确）· 采样式规划给 1（借但有噪声）</span>。"}, {"q": "拿模型自己采出来的数据去更新模型，会出什么问题？", "o": ["没有问题，这就是 Dyna", "模型会发散", "计算量太大", "确认偏误 —— 假数据不带新信息，但会让计数变大、置信区间变窄，于是过度自信"], "a": 3, "why": "这是学生问出来的，而她答得很明确：<em>it's not from the real world, so you could end up being overly confident</em>。<span class='k'>这和 L12 p16 那条确认偏误是同一个病</span>——注意 Dyna 用模型采的数据更新<b>值函数</b>，不是更新<b>模型</b>，两者不同。"}],
23: [{"q": "p23 问「模型错了就改用模型自由 RL，这能解决问题吗」。答案是什么？", "o": ["不一定 —— 取决于模型为什么错。如果是参数类选错或系统非马尔可夫，Q 学习同样假设马尔可夫，治不了", "能，只要数据足够", "能，模型自由不需要模型", "不能，模型自由永远更差"], "a": 0, "why": "<span class='k'>模型自由方法并不是「没有假设」，它只是把假设藏起来了。</span>而解法 2（算模型不确定性）也只治<b>样本估计误差</b>，仍然假设模型类是对的——世界根本不是那个分布族，<em>all bets are off</em>。"}, {"q": "泡茶的例子说明了什么？它的前提是什么？", "o": ["马尔可夫假设总是错的", "模型越准决策越好", "数据或表达力受限时，预测精度更高的模型可能决策更差（容量花在日落和蒸汽上，而决策只需要水温>100）；前提是完美模型加完美参数估计本身是足够的", "决策不需要模型"], "a": 2, "why": "<b>这个前提很重要，不能漏掉</b>：她明说完美模型 + 完美参数估计<b>是</b>足够做好决策的。<span class='w'>所以「R² 高不等于决策好」不是一个总成立的命题，它需要数据受限或表达力受限。</span>"}, {"q": "实录里有一条关于决策的观察，它意味着该用什么指标代替预测精度？", "o": ["用 AUC", "决策只需要判断 V(s,a1) > V(s,a2)，所以该报成对排序准确率而不是 R²", "用最大似然", "用交叉熵"], "a": 1, "why": "<em>you might have a really bad model and still end up with a good policy</em>——<b>一个处处偏高 0.3 的模型排序完全正确</b>。<span class='k'>更好的一步：只在「真值差距小」的配置对上算这个数，因为差距大的对子谁都能排对。</span>"}],
25: [{"q": "为什么说前向搜索是一种「低效的动态规划」？", "o": ["因为它只展开一层", "因为树里会出现大量相同的状态，而树不合并它们 —— 动态规划在状态上算（图），前向搜索在路径上算（树）", "因为它需要马尔可夫假设", "因为它要采样"], "a": 1, "why": "<b>这正是下一页 (|S||A|)^H 的来源</b>：树的规模随 H 指数增长，而状态数不增长。<span class='w'>那为什么还用树？因为它只要「从这里出发」的局部信息，而且只要能采样的模型、不必能枚举状态。</span>"}, {"q": "p28 说「蒙特卡洛控制 → 蒙特卡洛搜索、Sarsa → TD 搜索」。这个命名法里的规律是什么？", "o": ["搜索只用于博弈", "搜索算法不需要值函数", "把一个学习算法搬到「模型采的、从当下出发的」数据上，就得到一个搜索算法 —— 区别不在算法，在数据从哪来", "搜索算法都更快"], "a": 2, "why": "⚠ 但要分清两个「采样」：<span class='k'>p20 的采样式规划是从模型采数据去学一个<b>全局</b>的值函数；p27 的模拟式搜索只为了定<b>当下这一个</b>动作，算完就扔。</span>"}],
29: [{"q": "为什么说简单蒙特卡洛搜索「恰好」是一步策略改进？", "o": ["因为它估的 Q 就是 q_π（先做 a、之后一直按 π），而在 q_π 上取 argmax 正是策略改进定理的那一步", "因为它只看一步奖励", "因为它只采一条轨迹", "因为它用了折扣因子"], "a": 0, "why": "<b>于是它的上限立刻就定了：完全由模拟策略 π 决定。</b><span class='w'>π 随机就只比随机好一点，π 是高手就只比高手好一点——它不会自己变强，因为 π 全程没变。</span>这就逼出了下一页那个「怎么突破一步」的问题。"}, {"q": "这个方法有两处浪费，MCTS 要修的第一处是哪个？", "o": ["轨迹太长", "没有用折扣", "预算平均分配 —— 某个动作第一条轨迹就显示它没救，仍然会拿到剩下的 K−1 条", "没有存储模型"], "a": 2, "why": "MCTS 的全部直觉就是把算力集中到看起来有希望的分支上。<span class='k'>第二处浪费是：它只产出一个动作而非一个策略，下一步从头再来，上一轮的计算基本全扔。</span>"}],
30: [{"q": "树的规模 (|S||A|)^H 里那个指数是怎么来的？而它说明了什么？", "o": ["来自状态空间大小；说明要压缩状态", "每层枚举所有动作（×|A|）再枚举所有下一状态（×|S|），H 层相乘；而这个指数来自两个「所有」—— 说明它是「无差别对待所有分支」的代价，不是问题本身的代价", "来自采样噪声；说明要多采样", "来自折扣因子；说明要调 γ"], "a": 1, "why": "<b>这个区分就是 MCTS 的机会所在。</b>实录：<em>有些走法一眼就输，再往下算多少步都不会改变结论</em>——<span class='w'>围棋的 H 在 50 到 200 之间，她说状态空间只要「比 1 大一点」就不可行</span>。"}],
32: [{"q": "MCTS 评估节点时「只做简单平均」，既不取 max 也不显式求期望。为什么这样也行？", "o": ["因为 max 被搬进了采样分布里 —— 树策略越来越偏向好动作，极限下几乎所有样本都来自最好的动作，于是平均自动趋于最大", "因为平均比 max 更稳健", "因为 rollout 是随机的", "因为模型是马尔可夫的"], "a": 0, "why": "<b>这是 MCTS 最优雅的一步。</b>实录说这个定义「应该让人觉得有点怪」，然后给出了理由。<span class='k'>采样过程替你做了 max，所以回收时不必显式取——这也是它敢说「温和条件下 Q → q*」的根据。</span>"}, {"q": "树内用树策略、树外用 rollout 策略。这两段各自要解决什么问题？", "o": ["树内要快，树外要准", "两段其实是同一件事", "树内要决定「算力该花在哪个分支」（需要已有统计）；树外要给出「这个新节点大概值多少」（只需粗糙但不偏向谁的估计）", "树内要探索，树外要利用"], "a": 2, "why": "<b>随机 rollout 正好满足第二个要求：很粗糙，但不系统性偏向谁。</b><span class='w'>而 k 条 rollout 用的策略各不相同，这是故意的——后者是它区别于简单蒙特卡洛搜索、能逐步变强的原因。</span>"}],
34: [{"q": "UCT 里那个「老虎机的奖励」是什么？", "o": ["下一状态的估值", "从该节点起算的整条 rollout 的回报 —— 所以它是蒙特卡洛式的，不像 TD 那样自举", "节点的访问次数", "单步转移的奖励"], "a": 1, "why": "实录明确：<em>It's not like TD in the sense that we're doing this per node</em>。<span class='k'>没有自举就没有自举偏差，代价是方差大、而且必须走到终止才拿得到一个数。</span>"}, {"q": "同一个 (s,a) 出现在树的不同位置，UCT 不合并它们的计数。实录给的理由是什么？", "o": ["因为马尔可夫假设不成立", "因为计数会溢出", "因为合并实现起来麻烦 —— 模型是马尔可夫的，所以合并其实是合法的、而且会让样本量变大", "因为合并在统计上不正确"], "a": 2, "why": "<b>这是一个纯工程权衡，而不是统计上的必然。</b><span class='w'>状态几乎不重复时（围棋局面）浪费接近零；状态高度重复时浪费巨大</span>——<b>而后者正是「该用图而不是树」的判据。</b>"}, {"q": "p36 说「为简单起见，可以把每个状态节点当成一个独立的老虎机」。这句话有什么问题？", "o": ["「独立」明显不成立（同一棵树上的节点共享下游结构），所以 UCB 的遗憾界在这里并不严格适用", "应该当成高斯过程", "应该用汤普森采样", "没有问题"], "a": 0, "why": "<span class='k'>这是又一处「定理的前提没人遵守」，和 L13 p13 那个「证明要求只用前 m 个样本、而实践中我们用全部数据」是同一个模式。</span>记住这类缝，比记住定理本身更有用。"}],
37: [{"q": "p37 问：下围棋属于「动力学与奖励模型未知」那类决策问题吗？", "o": ["否 —— 围棋的规则与奖励结构都是已知的，它难在搜索空间极大", "是，棋局变化无法预测", "是，因为对手的策略未知", "否，因为它是有限时域"], "a": 0, "why": "<b>所以围棋是规划问题，不是学习问题</b>：本讲前半（学模型）在围棋上用不上，用上的是后半（有模型后怎么规划）。<span class='w'>推论很重要：「AlphaGo 都解决了，机器人/医疗应该也行」不成立——两者难的不是同一个地方。</span>"}, {"q": "围棋的奖励是 R_T = 1 黑胜 / 0 白胜，中间全是 0。这个设计让值函数有什么漂亮的解释？", "o": ["值函数等于分支因子", "值函数等于剩余步数", "0/1 奖励下期望等于概率，所以「局面值多少」字面上就是「黑方在这个局面下的胜率」", "值函数等于占地面积"], "a": 2, "why": "<span class='k'>这个解释让值函数极其直观，也是围棋适合做这类研究的一个原因。</span>而两人零和使 v*(s) = max_{π_B} min_{π_W} v_π(s)——<b>树从 expectimax 变成 minimax，状态节点取 min 而非期望，除此之外整套机制一个字不改。</b>"}, {"q": "p40 的蒙特卡洛评估是对一个「固定对手」打若干局数胜率。这个前提有什么缺口？", "o": ["固定对手下棋太慢", "没有缺口", "v* 的定义里白方是要最小化你的值的；打固定的弱对手，估出来的值会系统性偏高", "固定对手会导致过拟合棋盘大小"], "a": 2, "why": "<b>这个缺口怎么补，是 p41 之后自我对弈要回答的。</b><span class='w'>而它对任何「在固定测试集上反复调方法」的做法都是同一条警告——估出来的表现会系统性偏高。</span>"}],
41: [{"q": "围棋是两人博弈，所以树从 expectimax 变成 minimax。除此之外 MCTS 要改什么？", "o": ["要改树策略和 rollout 策略", "要改成有折扣的回报", "要去掉 UCT", "什么都不用改 —— 树策略、rollout、计数、UCT 全都照用，只是状态节点上取对手的最小化而不是期望"], "a": 3, "why": "<span class='k'>这是 MCTS 很值钱的一个性质：博弈结构只影响回收时那一个运算。</span>五格图展示的长树过程（先把每个动作各试一次 → 之后用 UCT 深挖 → 预算用完就回收）在两人博弈里一字不改。"}, {"q": "实录说围棋被攻克还有一个课件上没有的关键。是什么？它解决了什么问题？", "o": ["更大的棋盘；解决了泛化", "蒙特卡洛评估；解决了方差", "更快的硬件；解决了算力不足", "自我对弈 —— 打大师极长时间没有任何信号，而打五分钟前的自己总有一方赢，于是立刻有信号；它同时缓解稀疏奖励并提供课程"], "a": 3, "why": "<b>「课程」的意思是难度自动跟着能力走，不需要人去设计难度曲线。</b><span class='w'>她也承认局部最优确实会发生，而机制上的理由只是「你总在取 max，有点像策略改进」——这不是保证。</span>"}, {"q": "五格图里有一条实践上很重要、容易被忽略的提醒。是什么？", "o": ["必须用折扣因子", "树必须深度优先展开", "rollout 必须足够长", "先试哪个动作的顺序会显著影响效率 —— 早期靠动作启发式排序省下了大量算力，而这正是 AlphaGo 后来用策略网络做的事"], "a": 3, "why": "<span class='k'>另一条规则是：一个节点的所有动作要先各试一次，再去深挖任何一条。</span>之后到了访问过的节点才用 UCT，于是树开始变偏——这就是「故意长成偏的一棵树」的字面意思。"}],
46: [{"q": "MCTS 的五条好处里，最容易被低估、但在工程上极值钱的是哪一条？为什么？", "o": ["可并行，因为能用多核", "高度选择性，因为省算力", "用采样打破维数灾难，因为避免了枚举", "随时可停 —— 它把「算多久」从算法的设计参数变成了部署时的旋钮，同一套代码在手机上跑 50 毫秒和在服务器上跑八小时都有效"], "a": 3, "why": "<span class='w'>值迭代一类方法必须跑到收敛才给出可用策略，而 MCTS 给多少算力就用多少。</span>实录的例子很接地气：如果一天只做一个决策，可以让它跑一整夜八小时。"}, {"q": "「只要黑箱模型」这条为什么门槛特别低？", "o": ["因为黑箱模型不需要训练", "因为它只用于博弈", "因为黑箱模型更准", "因为它对模型的全部要求只是「给我 (s,a)，还我一个 (r,s′) 样本」—— 不要显式概率表、不要可微、不要任何解析形式"], "a": 3, "why": "<b>这解释了为什么 MCTS 在工业界用得比很多「更先进」的方法多。</b><span class='k'>绝大多数真实系统都有某种模拟器，而很少有系统能给出可微的解析动力学。</span>⚠ 而并行有个代价：并行的轨迹看到旧统计，并行度越高越接近均匀撒点。"}],
47: [{"q": "p47 问「把每个节点当老虎机为什么有点奇怪」。答案是什么？", "o": ["因为 rollout 是随机的", "因为老虎机里用乐观是由于你真的要承受坏决策的代价，而在模拟里「在脑子里做坏决策不疼」—— 所以该优化的不是乐观，是信息价值", "因为树太深", "因为节点之间不独立"], "a": 1, "why": "<b>乐观的逻辑是「要么真拿到高奖励，要么学到东西」，而这需要每一下都计入总收益。</b><span class='w'>规划里这个前提不成立，于是权衡失去一半：你不需要「得高奖励」，你只需要「学到东西」。</span>唯一的目标是尽快确定根节点该走哪一步。"}, {"q": "某节点上 A1 的估值高、区间窄，A2 的估值低、区间宽。乐观会选谁？而若目标是「确信 A1 更好」，该选谁？", "o": ["都选 A1；都选 A1", "乐观选 A1（上界最高）；而要确信该选 A2 —— 采它会收窄它的区间，两个区间一分开结论就定了，一次计算都不用再花", "乐观选 A2；要确信选 A1", "都选 A2；都选 A2"], "a": 1, "why": "<b>提炼成一句话：要赢就下注在最好的那个，要知道谁最好就去测最不确定的那个。</b><span class='k'>两件事的最优做法不同，而乐观只对第一件是对的。</span>实录对 UCT 的最终评价很诚实：不清楚它是最优的，但它相当高效。"}, {"q": "课件给了这条「正确路线」一个名字和一篇出处。是什么？而为什么大家还是用 UCT？", "o": ["汤普森采样；因为它需要先验", "元层推理（metalevel reasoning），Hay, Russell, Tolpin & Shimony 2012；而算信息价值本身要花算力，那是从「实际去算」里扣的 —— 这是个递归问题，UCT 是不递归的近似", "蒙特卡洛积分；因为它需要梯度", "贝叶斯优化；因为它太慢"], "a": 1, "why": "<span class='w'>注意 Stuart Russell 这个名字——AI 教科书那位，元层推理是他长期的研究主题。</span><b>「用一个次优但便宜的准则，而不是一个最优但要算的准则」，这个取舍本身就是元层推理的结论之一。</b>"}],
48: [{"q": "五条全课目标里，她自己点明哪一条「对很多人来说可能是最有用的」？", "o": ["实现常见的深度 RL 算法", "列举五个分析标准", "描述探索与利用的挑战", "判断一个应用问题该不该写成 RL、怎么形式化、选哪个算法并说明理由 —— 她说这往往是真正难的部分，影响极大，而且常常不清楚"], "a": 3, "why": "<b>注意她没说「学会算法最有用」。</b><span class='k'>而这一条里最难的是状态空间怎么定</span>：「把所有客户当成同一个，数据很多，但模型很差」——<span class='w'>这又回到了函数近似误差与样本效率的取舍，而它在本讲已经第三次出现。</span>"}, {"q": "她说 RL 与监督学习、与规划的分界各是什么？", "o": ["与监督学习的分界是有标签，与规划的分界是有奖励", "都是因为有折扣因子", "都是因为状态空间大", "与监督学习：数据是自己采的、是删截数据，不是 IID；与规划：你依赖采到的数据，而不是有现成的模型"], "a": 3, "why": "<span class='k'>「删截数据」这个词很准：你只看得到自己选过的那些动作的结果，没选的永远看不到。</span>而第五条目标（探索-利用）之所以被单独拎出来，理由同源：<b>规划有模型不需要探索，监督学习数据给定也不需要——只有「数据由你的决策决定」时它才出现。</b>"}],
52: [{"q": "实录里她用什么比较来说明 RL 的落地程度？", "o": ["RL 已经解决了医疗问题", "RL 已经超过人类水平", "我们手机上还没有 RL，不像人脸识别那样已经是基础设施 —— 所以这些想法用在其他应用上的潜力「依然巨大」", "RL 比监督学习更省数据"], "a": 2, "why": "<b>差距的原因本讲已经给了</b>：<span class='w'>人脸识别是监督学习（数据可事先收集、IID、标注可外包）；游戏之所以先成，是因为采数据免费且规则已知</span>——<span class='k'>而这两个条件现实应用一个都不满足。</span>"}, {"q": "「安全、公平、可问责」这三个词，实录给的具体含义是什么？", "o": ["这些系统通常是人在回路中的一部分，所以让智能体能暴露自己的推理、以及暴露自己的局限，会是关键", "要通过监管审查", "要开源代码", "要有形式化验证"], "a": 0, "why": "<b>注意第二条：不只要说出理由，还要说出自己的局限。</b><span class='k'>这和 L15 p69 那条「能说清这个保证不保证什么」是同一件事</span>——一个是对研究者的要求，一个是对系统的要求，而它们是同一种诚实。"}],
56: [{"q": "「学一个值函数」这条变体治的是 MCTS 哪个薄弱处？代价是什么？", "o": ["治并行困难；代价是同步开销", "治树太深；代价是内存", "治「必须 rollout 到终局才拿到回报」—— 走 d 步就用 V(s_d) 估剩下的；代价是引入自举偏差，因为那就是 n 步回报", "治 rollout 太随机；代价是要更多数据"], "a": 2, "why": "<b>于是 MCTS 从纯蒙特卡洛滑向 TD 那一侧：拿方差换偏差。</b><span class='w'>在 H 是 50–200 的围棋里，不必走到底是一个数量级的节省。</span><span class='k'>这门课从 L03 开始反复出现的那个旋钮，在最后一页又出现了一次。</span>"}, {"q": "「换一个更强的 rollout 策略」有一个课件没写的取舍。是什么？", "o": ["更强的策略不能并行", "rollout 策略越强，估出来的越接近那个策略的 q^π 而不是 q* —— 随机 rollout 噪声大，但不偏向任何下法", "更强的策略需要更多内存", "更强的策略算得更慢"], "a": 1, "why": "<b>这是一个真实的偏差-方差取舍，不是单纯的改进。</b><span class='k'>随机 rollout「粗糙但不偏向谁」正是 L16.b p32 说它合适的理由</span>——而 MCTS 要的是 q*，不是某个策略的值。"}, {"q": "AlphaZero 也被用在国际象棋上。这件事的意义是什么？", "o": ["终于能下象棋了", "象棋本来就被传统树搜索加手工评估函数攻克了；意义在于同一套不含领域知识的方法，在两个此前需要完全不同技术的游戏上都做到了最好", "象棋比围棋更难", "说明 MCTS 只适合棋类"], "a": 1, "why": "<b>「Zero」这个名字说的就是这件事：不用人类棋谱，只用规则加自我对弈。</b><span class='w'>而 p58 的措辞很准——MCTS 是 critical advance（关键的一步），不是全部</span>：<span class='k'>AlphaGo = MCTS 骨架 + 策略网络 + 值网络 + 自我对弈。</span>"}]
};

{"r": [1, 5], "t": "为什么用 MCTS 收尾", "star": 2, "quote": "<b>Final Lecture: MCTS</b> — <em>With many slides from or derived from <b>David Silver</b></em><br><b>Monte Carlo Tree Search — Why choose to have this as well?</b><br><em>Responsible in part for one of the greatest achievements in AI in the last decade — becoming a better <b>Go</b> player than any human</em><br><em>Brings in ideas of <b>model-based RL</b> and the <b>benefits of planning</b></em>", "one": "<b>最后一讲讲 MCTS，理由有两条：它是 AlphaGo 的一块核心；而它把全课讲得最少的那条线——学一个模型然后用规划——带了回来。</b>", "pts": ["<b>先看她自己给的两条理由，第二条比第一条重要。</b> 第一条是 AlphaGo：<span class='k'>实录里她说这是「过去十到二十年最主要的 AI 成就之一」，而且「比预期快得多」就实现了</span>。<b>第二条才是教学上的理由</b>：<em>brings in ideas of <b>model-based RL</b> and the <b>benefits of planning</b></em>——<span class='w'>模型基 RL 是这门课全程讲得最少的一条线</span>。", "<b>而她坦白了为什么讲得少，这句话值得记</b>：<em>in part because we haven't seen as much success in the <b>deep learning</b> case with models</em>。<span class='k'>也就是说：不是这个方向不重要，是深度模型这条路当时还没做出来</span>。<b>紧接着她押了一注</b>：<em>going forward it's likely to be a really <b>productive avenue of research</b></em>。<b>2019 年的这句话后来被证明是对的</b>——<span class='w'>世界模型、Dreamer 一类的工作正是这个方向</span>。", "<b>注意本讲的署名：<em>with many slides from or derived from David Silver</em>。</b> <span class='k'>这是全课唯一一讲大量沿用他人课件</span>，<b>所以本讲的叙述风格和前十五讲不太一样</b>——<span class='w'>更接近教科书式的层层推进，少了她平时那种「这里有个坑」的口语化提醒</span>。<b>于是实录在本讲的价值比往常更高</b>：课件上那些最要紧的转折（为什么乐观在规划里是错的、为什么树故意不合并相同状态），<b>几乎全在她的口头补充里。</b>", "<b>p5 的目录只有三项，而它们的比例很能说明问题</b>：引言、<b>模型基强化学习</b>、<b>基于模拟的搜索</b>。<span class='k'>MCTS 被放在第三项里，而不是自己占一项</span>——<b>这是在说：MCTS 不是一个独立的技巧，它是「有了模型之后怎么用」这条线上的一个落点</b>。", "<b>整讲的逻辑链可以先摆出来，读的时候就不会迷路</b>：<span class='k'>学模型 → 模型就是模拟器 → 模拟器可以拿来规划 → 规划可以做穷举（太贵）→ 也可以只采样（太弱）→ MCTS 在两者之间</span>。<b>每一步都是上一步的代价逼出来的，没有一步是凭空来的。</b>", "⚠️ <b>p2 是纯课务（作业截止、海报安排），p3 是课程结构，本精读不写这两页的内容。</b> <span class='w'>它们在页条上仍然存在，只是没有知识点</span>。"], "tbl": {"head": ["本讲的两条理由", "内容", "分量"], "rows": [["① 应用上", "AlphaGo 的核心技术之一", "吸引注意力"], ["② 教学上", "<b>把模型基 RL 与规划带回来</b>", "<b>真正的理由</b>"], ["为什么模型基讲得少", "<em>haven't seen as much success in the <b>deep learning</b> case with models</em>", "<span class='k'>不是不重要，是当时还没做出来</span>"], ["她的判断", "<em>likely to be a really <b>productive avenue of research</b></em>", "<b>后来被证明是对的</b>"], ["⚠ 课件来源", "<em>many slides from David Silver</em>", "<span class='w'>全课唯一一讲大量沿用他人课件 ⇒ 实录更重要</span>"]]}},
{"r": [6, 10], "t": "学一个模型，就等于拥有一个模拟器", "star": 3, "quote": "<b>Model-Based Reinforcement Learning</b> — <em>Previous lectures: learn value function or policy or directly from experience</em> · <em>This lecture: <b>learn model</b> directly from experience <b>and use planning</b> to construct a value function or policy</em> · <em>Integrate learning and planning into a single architecture</em><br><b>Model-Free RL</b>: <em>No model · Learn value function (and/or policy) from experience</em><br><b>Model-Based RL</b>: <em>Learn a model from experience · Plan value function (and/or policy) from model</em>", "one": "<b>前十五讲都在从经验直接学值函数或策略。这一讲学的是模型本身——而一旦有了模型，它就是一个模拟器，模拟器什么都能干。</b>", "pts": ["<b>这一讲和前面十五讲的分界非常干脆：学的东西换了。</b> <span class='k'>前面学的是「该怎么做」（策略）或「有多好」（值函数）；这一讲学的是「世界怎么运转」（转移与奖励）</span>。<b>学完之后还要多一步：用规划把模型变成策略。</b>", "<b>而那一步多出来的代价与收益，是本讲前半的全部内容。</b> <span class='w'>收益：模型是一个模拟器，可以无限次使用</span>；<span class='w'>代价：多了一层近似，而且两层误差会叠加</span>。<b>先记住这个取舍的形状，后面每一页都在填它的细节。</b>", "<b>实录里她把「模型 = 模拟器」这句话说得非常直白，而且立刻列出了它的用法</b>：<em>this can act as a <b>simulator</b>. And once you have that, you can do <b>model-free RL</b> using that simulator, or you can do <b>policy search</b> or anything else you would like to do</em>。<span class='k'>也就是说：有了模拟器，前十五讲的全部算法都可以在它上面重跑一遍</span>。<b>模型不是一个新算法，它是一个新的数据来源。</b>", "<b>这里有一条很实用的区分：很多场合你知道奖励函数，但不知动力学。</b> <span class='k'>实录给的例子是客服系统</span>：<em>you probably have a reward function in mind, like <b>engagement or purchases</b>... but you may not have a very good model of <b>the customer</b></em>。<b>所以「学模型」在实践中往往只是指学转移，奖励是给定的</b>——<span class='w'>这会让问题简单不少，因为密度估计比回归难得多</span>。", "⚠️ <b>p9 / p10 / p12 在 PDF 上只有标题，正文是图。</b> 实录里她把回路口述了一遍，这里按口述还原【<b>补课</b>】：<br>· <b>模型自由</b>：经验 →（直接）→ 值函数/策略 → 动作；<br>· <b>模型基</b>：经验 → <b>模型</b> → <b>规划</b> → 值函数/策略 → 动作。<span class='k'>多出来的两个方框就是全部的区别</span>。", "<b>而她在描述模型基回路时夹了一句后面会兑现的伏笔，值得现在就标出来</b>：<em>we don't have to necessarily compute a full value function. All we need to know is <b>what is the next action to take</b>, and we're going to <b>exploit that</b> when we get to Monte Carlo tree search</em>。<span class='w'>规划不必算出整个值函数，只要算出「此刻该做什么」</span>。<b>这正是 MCTS 之所以可行的根本原因，而它在这里就已经埋下了。</b>", "<b>把这个伏笔的分量说清楚：它把问题的规模从「整个状态空间」缩到了「当前这一个状态」。</b> <span class='k'>值迭代要对所有状态求解；而如果只需要当前状态的最优动作，你可以只看从这里出发能到的地方</span>。<b>一个指数大的问题，被「只问当下」这一个限制削成了可做的。</b>", "<b>另一条实录独有、而且相当有意思的旁证：人玩 Atari 时似乎在建模型。</b> <em>there's some interesting evidence that when people play Atari games, they are probably <b>systematically building models</b>. What happens when I move the iceberg next to the polar bear?</em> <span class='k'>她的论点是：建了模型就能把它迁移到别的情形</span>——<b>而这正是下一页要讲的那个最大的好处。</b>"], "eq": "模型自由：   经验  ──────────────────────▶  值函数 / 策略  ──▶  动作\n\n模型基：     经验  ──▶  **模型**  ──▶  **规划**  ──▶  值函数 / 策略  ──▶  动作\n                          └ 多出来的两个方框，就是全部的区别 ┘\n\n收益：模型 = 模拟器，可无限次使用，前十五讲的算法都能在它上面重跑\n代价：多一层近似，两层误差会叠加（p13）\n\n伏笔（实录，p12）：规划不必算出整个值函数，\n                  只要算出「此刻该做什么」 ⇒ 这就是 MCTS 可行的根本原因", "tbl": {"head": ["", "模型自由 RL", "模型基 RL"], "rows": [["学什么", "值函数 / 策略", "<b>转移与奖励模型</b>"], ["怎么得到策略", "直接学出来", "<b>学模型 + 规划</b>"], ["近似误差有几层", "一层", "<span class='w'>两层，而且会复合</span>"], ["数据能用几次", "回放缓冲区的次数", "<b>无限次（模拟器）</b>"], ["实践中常见的简化", "—", "<b>只学转移，奖励给定</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页给你的是一个重新描述自己工作的框架，而这个重新描述可能比任何技术细节都有用。</b><br><span class='k'>你的成本模型（简报 §4e，R² &gt; 0.95）就是一个模型基 RL 里的「模型」</span>。<b>而你现在用它的方式，恰恰就是这一页说的「规划」</b>：用它预测各个配置的成本，再据此挑配置。<span class='w'>换句话说：你做的事在 RL 的分类里有一个名字，而且是一条有完整文献的线</span>。<b>把它这样写出来，比说「我们训了一个成本预测器」显得有根基得多。</b><br><b>而那个伏笔（只需要知道此刻该做什么，不必算出整个值函数）在你这里尤其适用。</b> <span class='k'>你不需要一个对所有 query 都最优的指派策略，你只需要对<b>当前这一条 query</b> 给出一组节点级档位</span>。<b>这就是 MCTS 的思路，而它把「2^H 的配置空间」变成「对这一条 query 做一次局部搜索」</b>——<span class='w'>搜索的代价由你愿意花多少推理时间决定，而不是由配置空间的大小决定</span>。<b>这是一个你现在可能还没用上的自由度。</b><br><b>⚠ 但要先确认一件事：你的「模型」够不够当模拟器用。</b> <span class='k'>成本模型能预测成本，但它<b>不能</b>预测准确率</span>——而 G 的两半都需要。<b>所以你手上的其实是「半个模型」</b>：<span class='w'>成本那一半可以模拟，准确率那一半只能靠实际跑</span>。<b>这是一个很具体的限制，而且它决定了哪些 MCTS 式的做法你用得上、哪些用不上</b>：<b>任何只需要成本的搜索（比如在成本预算内找最便宜的可行配置）可以纯在模型里做；任何需要准确率的比较都必须落到真实调用上。</b><b>把这条界线画清楚，是本讲对你最实际的一条收获。</b><br>标【推断】：映射与「半个模型」的说法是我推的；成本模型 R² 在简报里是【已核】。", "ref": "课件 p6–p12 · 实录 p12（逐句核对）· 简报 §4e（已核）· §2"}},
{"r": [11, 13], "t": "好处与坏处：能迁移，但误差会复合", "star": 3, "quote": "<b>Advantages of Model-Based RL</b> — <em>Can efficiently learn model by <b>supervised learning</b> methods</em> · <em>Can <b>reason about model uncertainty</b> (like in upper confidence bound methods for exploration/exploitation trade offs)</em><br><b>Disadvantages</b> — <em>First learn a model, then construct a value function ⇒ <b>two sources of approximation error</b></em>", "one": "<b>好处是能用监督学习，而且能对模型的不确定性做推理。坏处是两层近似误差叠在一起，而且会复合。</b>", "pts": ["<b>第一个好处是工程上的，但分量不小：学模型是一个监督学习问题。</b> <span class='k'>于是过去几十年监督学习的全部工具都能直接用</span>——<b>而学值函数不是监督学习</b>（目标值本身在动，这是整个深度 RL 不稳定的根源）。<b>模型学习没有这个毛病：输入是 (s,a)，标签是真实发生的 (r,s′)，标签不会变。</b>", "<b>实录补了一条该注意的区分</b>：<em>transition dynamics we're generally going to think of as stochastic. So we're going to need supervised learning methods that can predict <b>distributions</b>. For reward models we can often treat them as <b>scalars</b></em>。<span class='w'>所以两半的难度不一样</span>：<b>奖励是回归（容易），转移是密度估计（难得多）</b>。", "<b>第二个好处连回了 L12/L13：有了模型就能对不确定性做推理。</b> <span class='k'>实录把这条路径说得很完整</span>：<b>老虎机那里，奖励的不确定性直接就是值的不确定性</b>（只有一步）；<b>而 MDP 里，你对转移与奖励的不确定性要<b>在规划中传播</b></b>，<span class='w'>传播的形式就是 L13 那个 β/√N 奖励加成</span>。<b>「模型不确定性 → 决策不确定性」这条链，是模型基方法独有的。</b>", "<b>坏处只有一句，但要读进去：两处近似误差。</b> <span class='k'>① 模型是近似的；② 在大状态空间上，规划本身也是近似的</span>。<b>而实录强调的是它们会<b>复合</b></b>（compounding），不是简单相加。", "<b>她把复合的机制类比到模仿学习，这个类比非常准，值得完整记下。</b> <span class='w'>行为克隆：你学了一个策略，照它走，走到数据稀少的地方，误差放大，于是走得更偏，于是更没数据</span>。<b>模型基 RL 一模一样</b>：<em>if you build a model and you compute a policy that ends up getting you to parts of the world where you <b>don't have very much data</b> and where your model estimate is poor, then again your resulting value function and your policy might be bad</em>。<span class='k'>两处都是「决策把你推向自己最不了解的地方」</span>——<b>而这是一个正反馈。</b>", "<b>再说清楚为什么这个正反馈是模型基方法的特有风险。</b> <span class='k'>规划会主动去找模型里看起来最好的地方</span>，<b>而「模型里看起来特别好」和「这里数据少、模型瞎猜」是高度相关的</b>——<span class='w'>数据少的地方模型的预测没有约束，什么值都可能给出来，包括一个特别高的值</span>。<b>于是优化器会专门去利用模型的错误</b>。<b>这件事在离线 RL 里有个名字叫「模型利用」（model exploitation），而它是 CQL/MOPO 一类方法要解决的核心问题。</b>", "<b>而实录给了一个课件上完全没有的、份量最大的好处：零样本迁移。</b> <em>if you learn a dynamics model of the world, then if someone <b>changes the reward function</b>, implicitly you can just do <b>zero shot transfer</b>, because you can just take your learned model of the dynamics and then your reward function, you can just <b>compute a new plan</b>. So I don't need any more experience.</em>", "<b>她的机器人例子把这件事讲得很具体</b>：<span class='k'>学会了在这间屋里转向、前进意味着什么（动力学），原来一直往那个出口走；现在有人说那个出口关了、改去另一个，并告知新的奖励函数——重新规划即可，<b>不需要任何新经验</b></span>。<b>这是模型基方法最硬的一条优势，而它恰恰不在课件上。</b>", "<b>把这条优势的边界也说清楚：它只对「奖励变了」成立。</b> <span class='w'>如果动力学变了（屋子改了布局），模型本身就过时了，零样本迁移不成立</span>。<b>所以这条优势的准确说法是：动力学稳定、目标会变的场景，模型基方法可以一次学习、多次复用。</b>"], "eq": "好处：\n  ① 学模型是**监督学习** —— 标签 (r, s′) 是真实发生的，不像值函数的目标那样在动\n     ⚠ 但两半难度不同：奖励 = 回归（易） · 转移 = 密度估计（难）\n  ② 能对模型不确定性做推理，并在规划中**传播**（L13 的 β/√N）\n  ③ **零样本迁移**（实录独有）：奖励变了 ⇒ 用旧动力学重新规划，不需要任何新经验\n     ⚠ 边界：只对「奖励变了」成立。动力学变了，模型本身就过时\n\n坏处：两处近似误差，而且会**复合**\n  ① 模型是近似的      ② 大状态空间上规划也是近似的\n\n复合的机制（与模仿学习同形）：\n  规划主动去找「模型里看起来最好的地方」\n     ↕ 而这与「数据少、模型瞎猜的地方」高度相关\n  ⇒ 优化器专门利用模型的错误  ⇒ 走到更没数据的地方  ⇒ 正反馈\n  （离线 RL 里叫 model exploitation，是 CQL / MOPO 要解决的核心问题）", "tbl": {"head": ["", "内容", "出处"], "rows": [["好处 ①", "学模型是监督学习，标签不会动", "课件 p13"], ["好处 ②", "能对模型不确定性做推理并在规划中传播", "课件 p13 · L13"], ["<b>好处 ③</b>", "<b>零样本迁移：奖励变了就重新规划，不要新数据</b>", "<b>实录独有</b>"], ["坏处", "两层近似误差，<b>会复合</b>", "课件 p13 · 实录"], ["复合的机制", "规划专门去利用模型误差大的地方", "<span class='w'>与模仿学习的误差累积同形</span>"]]}, "res": {"tag": "推断", "v": "<b>那条「零样本迁移」直接解决你一个很具体的痛点：λ 扫描。</b><br><span class='k'>你的目标是 <code>G = Acc − λ·Cost</code>，而 λ 是一个要扫的超参数</span>——<b>不同的 λ 代表「你有多在意成本」，而审稿人一定会要一条 λ 的曲线</b>（否则「我们选了 λ=0.1」看起来像调出来的）。<span class='w'>如果每换一个 λ 就要重跑一遍 LLM 调用，这条曲线贵到做不出来</span>。<br><b>而这一页说的正是你不必那样做：λ 只出现在奖励函数里，动力学（哪个配置产生什么 Acc 和 Cost）与 λ 无关。</b> <span class='k'>所以你只要有了 oracle 表，整条 λ 曲线是<b>零成本</b>的——换一个 λ，重新在表上取 argmax 即可，一次 LLM 调用都不用加</span>。<b>这是「奖励变了就重新规划」的教科书式应用，而且是免费的。</b><br><b>把这件事明确写进论文有两个好处</b>：① <span class='w'>λ 的敏感性分析从「做不起」变成「顺手就有」，直接堵掉一个审稿意见</span>；② <b>它给穷举 oracle 又添了一个理由</b>——<span class='k'>oracle 表不只给基准、不只给校准，它还让整个 λ 维度免费</span>。<b>连上 L15 那两条，穷举的收益已经有四条，这笔成本越来越好辩护。</b><br><b>⚠ 而那条坏处你也要正面接住：模型利用。</b> <span class='w'>如果你用成本模型去搜 2^H 空间里成本最低的配置，优化器会专门找模型预测偏低的那些格子</span>——<b>而预测偏低往往就是训练数据稀少的格子</b>。<b>这正是「两层误差复合」在你这里的具体形态</b>：<span class='k'>模型误差 + 用 argmax 放大它</span>。<b>两条可做的防护</b>：① <b>搜到的配置必须实际跑一遍验证</b>（你有这个条件，医疗场景没有）；② <b>给成本预测加一个按训练密度的保守修正</b>——<span class='w'>数据少的格子，成本往上估</span>，这就是 L13 那个 β/√N 奖励加成反过来用。<b>⚠ 注意符号：探索时乐观（成本往低估）是对的，而这里要的是悲观——因为你不是在探索，你是在选一个要上线的配置。</b><br>标【推断】：λ 扫描免费与悲观修正是我推的；λ 与 oracle 表在简报里是【已核】。", "ref": "课件 p13 · 实录 p13（零样本迁移，逐句核对）· 简报 §2 §4d §4e（已核）· L13 p13"}},
{"r": [14, 17], "t": "模型长什么样，怎么学", "star": 2, "quote": "<b>MDP Model Refresher</b> — <em>A model M is a representation of an MDP &lt;S,A,P,R&gt;, parametrized by η</em> · <em>We will assume state space S and action space A are <b>known</b></em> · <em>Typically assume <b>conditional independence</b> between state transitions and rewards</em><br><b>Model Learning</b> — <em>This is a <b>supervised learning</b> problem</em> · <em>Learning s,a → r is a <b>regression</b> problem</em> · <em>Learning s,a → s′ is a <b>density estimation</b> problem</em><br><b>Table Lookup Model</b> — <em>Count visits N(s,a) to each state action pair</em>", "one": "<b>模型就是一个参数化的 MDP，而且假定状态空间和动作空间已知——只有转移和奖励要学。学法是监督学习，表格情形下就是数数。</b>", "pts": ["<b>p14 第二行那个假设要留意：状态空间与动作空间<b>已知</b>。</b> <span class='k'>所以「学模型」在本讲的意思很窄——只学 <code>P</code> 和 <code>R</code>，不学「世界由什么状态构成」</span>。<b>而后者是真正难的部分</b>：<span class='w'>表示学习、状态抽象、该用哪些特征，全在这个假设之外</span>。<b>本讲把最难的一半放进了前提里，这是读任何模型基方法时都该先确认的一件事。</b>", "<b>第二个假设是条件独立：<code>P[s′,r | s,a] = P[s′|s,a]·P[r|s,a]</code>。</b> <span class='k'>于是转移和奖励可以分头学，互不干扰</span>。<b>这在实践中几乎总是这么做的</b>，而它不成立的情形也不难想（奖励依赖于你落到了哪个下一状态），<span class='w'>那时把奖励写成 <code>R(s,a,s′)</code> 就行，不是大问题</span>。", "<b>p15 把监督学习的形式摆得很清楚</b>：数据是 <code>(S₁,A₁)→(R₂,S₂)</code>、<code>(S₂,A₂)→(R₃,S₃)</code>…… <span class='k'>一条轨迹拆成 T−1 个独立的监督样本</span>。<b>这是模型基方法在数据效率上的一个真实优势</b>：<span class='w'>同一条轨迹，对值函数只贡献一个回报，对模型贡献 T−1 个样本</span>。", "<b>把这条优势说得更准一点，因为它常被夸大。</b> <span class='k'>T−1 个样本不是独立的</span>（同一条轨迹里的状态高度相关），<b>但它们确实是 T−1 次「输入→标签」的监督约束</b>，<span class='w'>而回报只是一个数</span>。<b>所以优势是真的，只是不该按 T−1 倍去算。</b>", "<b>两半的学习问题性质不同，这一点上面提过，这里给出理由。</b> <code>s,a→r</code> 是<b>回归</b>（预测一个标量）；<code>s,a→s′</code> 是<b>密度估计</b>（预测一个分布）。<span class='k'>而密度估计难得多，因为你要的不是一个点，是整个分布的形状</span>——<b>这是深度模型基 RL 当年卡住的技术原因之一</b>。", "<b>p16 列了一串模型类，而实录对其中一个有具体评价。</b> 表查模型、线性期望模型、线性高斯、高斯过程、深度信念网络。<span class='w'>她说贝叶斯深度神经网络「可能很强大，因为能显式表示不确定性，但到目前为止很难训练」</span>（<em>pretty hard to tune so far</em>）。<b>这和 L13 p33 对贝叶斯 DQN 的评价是同一条线：想要不确定性，就得在「好训」和「好用」之间挑。</b>", "<b>p17 的表查模型就是数数，而它有两种等价的实现方式，值得分清。</b> ① <b>显式计数</b>：统计 <code>N(s,a)</code> 与 <code>N(s,a,s′)</code>，归一化得到 <code>P̂</code>；② <b>存样本</b>：<span class='k'>把每个 <code>(s,a,r,s′)</code> 元组记下来，要采样时就从匹配 <code>(s,a,·,·)</code> 的元组里随机抽一个</span>。<b>两者给出同一个分布</b>，<span class='w'>但第二种不需要显式写出 <code>P̂</code></span>——<b>对状态空间很大但数据稀疏的情形，第二种省得多。</b>", "<b>第二种实现方式还有一个隐含的好处：它天然就是一个「只在见过的地方取值」的模型。</b> <span class='k'>你永远只会采样出真实发生过的转移</span>，<b>于是上一页那个「模型利用」风险小得多</b>——<span class='w'>优化器没法利用模型在没数据处的瞎猜，因为那里根本采不出东西</span>。<b>代价是完全没有泛化。</b>"], "eq": "模型 M = <P_η, R_η>，参数 η。**S 和 A 假定已知** —— 只学 P 和 R\n条件独立：P[s′, r | s, a] = P[s′|s,a] · P[r|s,a]   ⇒ 两半可分头学\n\n学法 = 监督学习：  (S_1,A_1) -> (R_2,S_2)\n                  (S_2,A_2) -> (R_3,S_3)   ...   一条轨迹拆成 T−1 个样本\n   s,a -> r    回归（易）\n   s,a -> s′   **密度估计**（难得多 —— 要整个分布的形状，不是一个点）\n\n表查模型的两种等价实现：\n  ① 显式计数   P̂(s′|s,a) = N(s,a,s′) / N(s,a)        要写出整个 P̂\n  ② 存样本     记下每个 (s,a,r,s′)，采样时从匹配 (s,a,·,·) 的元组里随机抽\n               ⇒ 同一个分布，但不必显式写出 P̂；\n                 且只会采出真实发生过的转移 ⇒ 模型利用风险小，代价是毫无泛化", "tbl": {"head": ["", "s,a → r", "s,a → s′"], "rows": [["问题类型", "<b>回归</b>", "<b>密度估计</b>"], ["难度", "容易", "<span class='w'>难得多</span>"], ["输出", "一个标量", "<b>整个分布</b>"], ["实践中", "常常<b>已知</b>，不用学", "<b>几乎总要学</b>"], ["表格情形", "平均历史奖励", "计数后归一化"]]}},
{"r": [18, 18], "t": "AB 例子：批 TD 与批 MC 收敛到两个不同的东西", "star": 3, "quote": "<b>AB Example</b> — <em>Two states A,B; no discounting; <b>8 episodes</b> of experience</em> · <em>We have constructed a table lookup model from the experience</em><br><em>Recall: For a particular policy, <b>TD</b> with a tabular representation with <b>infinite experience replay</b> will converge to the <b>same value</b> as computed if construct a <b>MLE model</b> and do planning</em><br><em><b>Check Your Memory</b>: Will <b>MC</b> methods converge to the same solution?</em>", "one": "<b>同一批八幕数据，批 TD 给 V(A)=0.75，批 MC 给 V(A)=0。两个都对，差别在于 MC 不假设马尔可夫。</b>", "pts": ["<b>先把数据摆全，这一页的全部内容都在这八幕里。</b> ① <code>A,0 → B,0</code>；②~⑦ <code>B,1</code>（六次）；⑧ <code>B,0</code>。<span class='k'>于是 B 被访问 8 次，其中 6 次回报 1、2 次回报 0</span>。<b>两种方法都同意 <code>V(B) = 6/8 = 0.75</code>。</b>", "<b>分歧全在 <code>V(A)</code> 上，而两个答案的理由都站得住。</b> <span class='w'><b>批 MC</b>：只有一幕经过 A，那一幕的回报是 0 ⇒ <code>V(A) = 0</code></span>。<span class='w'><b>批 TD / 模型基</b>：A 必然到 B（见过一次，去了 B），而 <code>V(B)=0.75</code> ⇒ <code>V(A) = 0 + 0.75 = 0.75</code></span>。", "⚠️ <b>这一页最容易误读的地方，实录明确否掉了：这个差别<b>不是</b>因为数据有限或回放不够。</b> <em>this is <b>not</b> due to a finite amount of use of the data... if you sort of run this through TD many, many times, and the Monte Carlo estimate is also getting access to <b>all of the data</b></em>。<span class='k'>两者都把这八幕用到极限，结论仍然不同</span>。<b>所以这不是收敛速度问题，是<b>收敛目标</b>不同。</b>", "<b>两个目标各有名字，记住这组对应很有用。</b> <span class='k'><b>批 MC → 最小均方误差</b>（对观测到的回报而言）；<b>批 TD → 最大似然模型 + 规划</b>（也叫确定性等价估计）</span>。<b>而这个区别的唯一来源是：TD 假设马尔可夫，MC 不假设。</b>", "<b>把「不假设马尔可夫」的后果说具体一点。</b> <span class='w'>MC 只问「从 A 出发，实际拿到过什么回报」——它不相信「A 之后会到 B，所以可以借用 B 的证据」</span>。<b>而 TD 相信这一点，于是它能用上那六个 <code>B,1</code>，哪怕那些幕根本没经过 A。</b>", "<b>于是哪个更好，完全取决于世界是否真的马尔可夫——这正是实录的结论。</b> <em>if the system is really Markov, that's <b>not a very good solution</b> [MC 的 0] because we have all this other evidence that B normally has a higher value, and we're <b>not able to take advantage of that</b></em>。<span class='k'>反过来，如果系统不是马尔可夫，MC 的 0 才是对的</span>——<b>借用 B 的证据就是在借用一个不成立的假设。</b>", "<b>学生还问了一个好问题，答案值得记。</b> <span class='w'>「如果换一个损失函数或加正则，MC 会收敛到别的东西吗？」</span>——<b>会</b>，<em>it may converge to different solutions than the minimum MSE depending on how you regularize or the loss you use. <b>But in general, it will not converge to the same thing</b> as the MLE model + planning</em>。<b>关键的分界始终是马尔可夫假设，不是损失函数的选择。</b>", "<b>这个例子在 S&amp;B 讲 TD 的那一章里也有，而且是那一章的核心例子。</b> <span class='k'>两边的讲法互补</span>：<b>S&amp;B 强调「批更新下两者的不动点不同」，本讲强调「TD 等价于先建 MLE 模型再规划」</b>——<span class='w'>后一种说法更直接地解释了为什么本讲要讲它</span>：<b>它把「值函数方法」和「模型基方法」接上了。</b>"], "eq": "八幕数据：  ① A,0 -> B,0        ②~⑦ B,1（六次）        ⑧ B,0\n⇒ B 被访问 8 次：6 次回报 1、2 次回报 0\n\n  V(B) = 6/8 = 0.75                       ← 两种方法都同意\n\n  批 MC：   只有一幕经过 A，回报 0      ⇒  V(A) = 0\n  批 TD：   A 必然到 B，V(B)=0.75       ⇒  V(A) = 0 + 0.75 = 0.75\n\n⚠ 这**不是**收敛速度问题 —— 两者都把全部数据用到极限，目标就不同：\n\n   批 MC  ──▶  最小均方误差（对观测到的回报）        **不假设马尔可夫**\n   批 TD  ──▶  最大似然模型 + 规划（确定性等价）      **假设马尔可夫**\n\n哪个对？取决于世界是否真的马尔可夫：\n   真马尔可夫 ⇒ MC 的 0 浪费了那六个 B,1 的证据\n   非马尔可夫 ⇒ TD 的 0.75 借用了一个不成立的假设", "tbl": {"head": ["", "批 MC", "批 TD / 模型基"], "rows": [["V(B)", "0.75", "0.75"], ["<b>V(A)</b>", "<b>0</b>", "<b>0.75</b>"], ["收敛到什么", "<b>最小均方误差</b>", "<b>最大似然模型 + 规划</b>"], ["假设马尔可夫吗", "<span class='k'>不假设</span>", "<span class='w'>假设</span>"], ["能用上没经过 A 的那六幕吗", "<b>不能</b>", "<b>能</b>"], ["⚠ 差别来自", "—", "<b>不是数据量，是马尔可夫假设</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页是你那个「要不要当成序贯决策问题」的争论的最干净的试金石，而且它给的是一个可以<b>实测</b>的判据。</b><br><span class='k'>两种估计法的分歧只来自一件事：能不能把「别处的证据」借到「这里」来</span>。<b>翻译到你的设定</b>：<span class='w'>节点 3 用 7B 的那些 query 的结果，能不能用来推断「节点 1 用 72B、节点 3 用 7B」这个没跑过的组合？</span><b>能借 = 可加 / 马尔可夫；不能借 = 只能看实际跑过的组合。</b><br><b>而你有一个 CS234 的学生没有的条件：你可以直接验证该不该借。</b> <span class='k'>oracle 表里有真值</span>——<b>拿「按可加性外推」的预测和「实际跑出来」的真值一比，就知道借得对不对</b>。<span class='w'>这是 L15 那张「离线估计 vs 在线真值」散点图的另一个用法</span>，<b>而它回答的问题更基本：你的设定到底是不是可加的。</b><br><b>这给了 P2/P3 消融一个更锐利的形式。</b> 不要只报「按节点键控 vs 按 query 键控哪个好」，<span class='k'>而要报「可加外推的误差有多大」</span>：<b>用 k=1（单节点偏离）的数据预测 k=2 的 G，与 k=2 的真值比</b>。<b>误差小 ⇒ 可加性成立 ⇒ 你可以只跑一步偏离扫描，然后外推整个 2^H 空间（这会把成本降一个数量级）</b>；<span class='w'>误差大 ⇒ 节点之间有交互 ⇒ 必须实际跑组合，而「序贯决策」的框架才真正必要</span>。<br><b>注意这个实验的双赢结构：无论结果是哪一边，你都得到一个可以写的结论。</b> <span class='k'>可加 ⇒ 一个便宜得多的方法；不可加 ⇒ 一个非平凡的问题</span>。<b>而现在这个问题是悬着的，论文里只能靠假设带过。</b><br><b>⚠ 还有一条警告：如果可加性只在「大部分 query 上」成立，那会是最麻烦的情形</b>——<span class='w'>平均误差小，而少数 query 上误差极大</span>。<b>所以要看的是误差的分布，不是均值</b>；<b>这和 L13 p26 那条「按预测值分桶看残差」是同一个检查。</b><br>标【推断】：实验设计是我推的；P2/P3 与一步偏离扫描在简报里是【已核】。", "ref": "课件 p18 · 实录 p18（逐句核对）· 简报 §4c §5（已核）· L13 p26 · L15 p62 科研格"}},
{"r": [19, 22], "t": "采样式规划：为什么要从模型里采假数据", "star": 3, "quote": "<b>Planning with a Model</b> — <em>Solve the MDP &lt;S,A,P<sub>η</sub>,R<sub>η</sub>&gt; using favourite planning algorithm: Value iteration · Policy iteration · <b>Tree search</b></em><br><b>Sample-Based Planning</b> — <em>A simple but powerful approach</em> · <em><b>Use the model only to generate samples</b></em> · <em>Apply model-free RL to samples, e.g.: Monte-Carlo control · Sarsa · Q-learning</em> · <em>Sample-based planning methods are often <b>more data efficient</b></em><br><b>Back to the AB Example</b> — <em>e.g. Monte-Carlo learning: <b>V(A) = 1, V(B) = 0.75</b></em> · <em><b>Check Your Memory</b>: What would MC on the original experience have converged to?</em>", "one": "<b>有了模型可以精确求解，但也可以只拿它采假数据、再跑模型自由算法。后者听起来绕，可它能把真实数据里从未同时出现过的片段接起来。</b>", "pts": ["<b>p19 先给正统做法：把模型当成一个已知 MDP，用值迭代、策略迭代或树搜索精确求解。</b> <span class='k'>注意第三项「树搜索」已经出现了</span>——<b>本讲后半讲的就是它。</b>", "<b>p20 给的是另一条路，而它一上来是反直觉的：只用模型采样，然后在假数据上跑模型自由算法。</b> <span class='w'>绕一圈回到起点了吗？真实数据明明在手，为什么要先建模型、再采假数据、再学</span>——<b>实录直接把这个疑问摆了出来</b>：<em>initially that might sound like <b>why would you do that</b></em>。", "<b>答案在 p21–p22，而且非常具体：模型能把片段<b>接起来</b>。</b> <span class='k'>真实数据里从没出现过「A 之后 B 得 1」这一幕</span>（唯一经过 A 的那幕 B 得 0）。<b>但模型知道 A 必然到 B，也知道 B 有时得 1</b>——<span class='w'>于是采样可以合成出 <code>A,0 → B,1</code> 这一幕，而它在现实中从未被观测到</span>。", "<b>实录把这件事的依据点明了，而这句话是本页的关键</b>：<em>we're <b>leveraging the fact here that it's Markov</b>. So if the domain isn't really Markov, we could end up getting data that looks <b>very very different</b> than what you could ever get in the real world</em>。<span class='k'>合成的合法性完全建立在马尔可夫假设上</span>——<b>和上一页同一个假设，只是这里用来造数据而不是用来估值。</b>", "<b>于是采样式规划的效果就能预测了：它让 MC 的答案靠向 TD 的答案。</b> <span class='w'>在合成数据上跑 MC，得到的结果接近「在原始数据上跑 TD」</span>——<b>因为合成这一步已经把马尔可夫假设注入进去了</b>。<span class='k'>这是本页最该记住的一句：假设可以通过「造数据」注入，而不必写进算法里</span>。", "⚠️ <b>p22 那个 <code>V(A) = 1</code> 要看清楚，它不是「正确答案」。</b> <span class='w'>那是在幻灯片上列出的那十来条采样数据上算出来的</span>：两幕经过 A，都接上了 <code>B,1</code>，于是 <code>V(A)=1</code>。<b>而精确的模型基答案是 0.75</b>——<span class='k'>1 和 0.75 的差距是<b>采样噪声</b></span>。<b>所以这一页同时展示了采样式规划的好处（接得起来）和代价（采样误差）。</b>", "<b>三个数字放在一起看，这一讲前半的全部张力就清楚了</b>：<span class='k'><b>批 MC 给 0</b>（不借证据）· <b>精确模型基给 0.75</b>（借，且精确）· <b>采样式规划给 1</b>（借，但有采样噪声）</span>。<b>真值是 0.75。</b>", "<b>那么为什么还要采样、不直接精确求解？实录给了答案，而且是实践里真正的理由。</b> <em>when you start to think about doing like <b>Atari</b> or other really high-dimensional problems, <b>the planning problem alone is super expensive</b></em>。<span class='w'>精确规划在大状态空间上做不动</span>——<b>采样式规划是在「规划也算不起」时的退路。</b>", "<b>还有一条她提到的用法，很实际</b>：<em>you just generate a lot of data from your simulated model, and then you <b>replay over that a ton of times</b></em>。<span class='k'>模型是一个无限的数据源，于是回放缓冲区可以无限大</span>——<b>这是 p20 那句「often more data efficient」的真实含义</b>：<span class='w'>不是用更少的真实数据，而是把真实数据榨得更干</span>。", "⚠️ <b>最后是一条学生问出来的、必须记住的陷阱：拿模型自己采的数据去更新模型。</b> <em>that could lead to <b>confirmation bias</b>, because your model is giving you data, and if you treat that as real data and put that into your model... you could end up being <b>overly confident</b></em>。<span class='k'>这和 L12 p16 那条确认偏误是同一个病</span>：<b>假数据不带新信息，但会让计数变大、置信区间变窄。</b>"], "eq": "两条用模型的路：\n  ① 精确规划：把模型当已知 MDP，值迭代 / 策略迭代 / **树搜索**\n  ② 采样式规划：只拿模型采样，在假数据上跑模型自由算法\n\n② 为什么不是绕圈 —— 它能把片段**接起来**：\n   真实数据里从没有「A 之后 B 得 1」这一幕\n   但模型知道 A -> B，也知道 B 有时得 1  ⇒ 可以合成 A,0 -> B,1\n   ⚠ 合法性完全建立在**马尔可夫假设**上（实录原话）\n\n三个数字（真值 0.75）：\n   批 MC         0      不借证据\n   精确模型基     0.75   借，且精确          ← 真值\n   采样式规划     1      借，但有采样噪声    ← p22 的数字\n\n为什么还要采样：大状态空间上**精确规划本身就算不起**（Atari）\n「更省数据」的真实含义：不是用更少真实数据，而是把真实数据**榨得更干**\n\n⚠ 陷阱：拿模型自己采的数据去更新模型 ⇒ 确认偏误\n   假数据不带新信息，但会让计数变大、置信区间变窄（同 L12 p16）", "tbl": {"head": ["做法", "V(A)", "借 B 的证据吗", "有采样噪声吗"], "rows": [["批 MC（原始数据）", "<b>0</b>", "<span class='w'>不借</span>", "—"], ["精确模型基规划", "<b>0.75</b>（<span class='k'>真值</span>）", "<b>借，精确</b>", "无"], ["采样式规划（p22）", "<b>1</b>", "<b>借</b>", "<span class='w'>有 —— 这就是 1 与 0.75 的差</span>"], ["为什么还要采样", "—", "—", "<b>大空间上精确规划算不起</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页讲的「用模型把片段接起来」，正是你那个 2^H 配置空间的唯一出路，而它的前提这一页也说清了。</b><br><span class='k'>你的留出集上不可能跑遍 2^H 个配置</span>。<b>而这一页说的就是怎么办：从跑过的片段里学一个模型，用它合成没跑过的组合</b>——<span class='w'>而合法性建立在「可加 / 马尔可夫」上，正是上一页那个要实测的假设</span>。<b>两页连起来给了你一条完整的技术路线</b>：<b>先实测可加性，成立则用模型外推整个配置空间，不成立则只能在实际跑过的组合里选。</b><br><b>p22 那个 <code>V(A)=1</code> 是给你的警告，而且比它看起来重要。</b> <span class='k'>精确答案 0.75，采样给出 1 —— 偏高</span>。<b>而偏高的方向不是偶然</b>：<span class='w'>如果你用少量合成样本去估每个配置的 G，再取 argmax，采样噪声会被 argmax 系统性地选出来</span>——<b>这就是 L04 p42 的最大化偏差，在合成数据上重演一次</b>。<b>配置越多、每个配置的合成样本越少，这个偏差越大</b>。<b>两条防护</b>：① <b>合成样本数要够</b>，而不是每个配置采几条就排名；② <b>最终入选的配置必须实际跑一遍</b>——<span class='k'>你有这个条件，这是你比医疗场景强的地方</span>。<br><b>而那条「确认偏误」的陷阱在你这里有一个非常具体的形态，值得现在就记下。</b> ⚠ <span class='w'>如果你用成本模型的预测去填 oracle 表的空格，然后再用这张「补全的表」去训练或校准成本模型，就正是这个病</span>。<b>补进去的格子不含新信息，但会让表看起来更满、让任何基于计数的置信度虚高</b>。<b>规矩很简单：模型预测的格子和实际跑的格子必须始终可区分，而且算置信界时只能数实际跑的那些。</b><br>标【推断】：路线与三条警告是我推的；配置空间规模与 oracle 表在简报里是【已核】。", "ref": "课件 p20–p22 · 实录 p22（马尔可夫与确认偏误，逐句核对）· L04 p42 · L12 p16 · 简报 §4c §4d（已核）"}},
{"r": [23, 24], "t": "模型不准怎么办：两个解法各只治一种病", "star": 3, "quote": "<b>Planning with an Inaccurate Model</b> — <em>Performance of model-based RL is <b>limited to optimal policy for the approximate MDP</b></em> · <em>i.e. Model-based RL is <b>only as good as the estimated model</b></em> · <em>When the model is inaccurate, planning process will compute a <b>sub-optimal policy</b></em><br><em><b>Solution 1</b>: when model is wrong, use model-free RL (<b>Does this solve the issue?</b>)</em><br><em><b>Solution 2</b>: reason explicitly about <b>model uncertainty</b> (see Lectures on Exploration / Exploitation)</em>", "one": "<b>模型不准，规划出来的策略就只是「那个错模型里的最优策略」。两个解法都不是通解——它们各自只治一种「错」。</b>", "pts": ["<b>第一句话要读准：模型基 RL 的上限是「近似 MDP 的最优策略」。</b> <span class='k'>不是「真 MDP 的近似最优策略」</span>——<b>两者差得很远</b>。<span class='w'>你把近似 MDP 解到精确最优，得到的仍然可能是真世界里的糟策略</span>。<b>误差的来源在模型里，再多的规划算力也补不回来。</b>", "<b>p23 把解法 1 后面那个括号留成了问句，而这是本页的教学设计</b>：<em>when model is wrong, use model-free RL（<b>Does this solve the issue?</b>）</em>。<span class='k'>答案在实录里，而且是「不一定」</span>。", "<b>实录的答案值得逐字记，因为它把「错」分了类</b>：<em>it depends <b>why</b> your model is wrong. If your model is wrong because you've picked the <b>wrong parametric class</b> or because <b>the system is not Markov</b>, you're doing Q learning that's not gonna solve your problem <b>because Q learning also assumes the world is Markov</b></em>。<span class='w'>模型自由方法并不是「没有假设」——它只是把假设藏起来了</span>。<b>Q 学习同样假设马尔可夫，所以非马尔可夫这个病它也治不了。</b>", "<b>解法 2 也只治一种病，而这一点实录说得同样明确。</b> <em>it deals with the fact that you might have <b>sampling estimation error</b>. But it's still making the basic assumption that <b>your model class is correct</b></em>。<span class='k'>对不确定性做推理（L13 的 β/√N）治的是「数据不够」</span>，<b>治不了「模型类选错」</b>：<span class='w'>你把世界建模成多项分布，数据少时参数估计会偏，加置信区间能对冲；但如果世界根本不是多项分布，所有的赌注都没了</span>（<em>all bets are off</em>）。", "<b>所以这两页真正要教的是一个习惯</b>：<em>it's always good to know <b>what assumptions we're making</b> in our algorithms and then <b>what forms of uncertainty we're accounting for</b></em>。<span class='k'>这两个问题不是一个问题</span>——<b>「我考虑了不确定性」从不蕴含「我考虑了所有可能的错」。</b>", "<b>接下来是本页最有价值的一条，而它完全来自实录：决策只需要两两比较。</b> <em>ultimately for your decisions, we only need to decide whether <code>V(s,a₁) &gt; V(s,a₂)</code>... So you might have a <b>really bad model and still end up with a good policy</b></em>。<span class='w'>模型的值估得准不准，和它排出来的序对不对，是两件事</span>。<b>一个处处偏高 0.3 的模型，排序完全正确，决策完全正确。</b>", "<b>而她紧接着给了这件事的反面，也就是本页最精彩的那个例子——而它有一个很重要的前提。</b> <span class='k'>前提是：<b>完美</b>的模型加<b>完美</b>的参数估计，足以做出好决策</span>（<em>that is sufficient to make good decisions</em>）。<b>问题出在数据受限或表达能力受限的时候</b>：<em>a model that has <b>higher predictive accuracy</b> can in fact be <b>worse</b> when you use it to make decisions</em>。", "<b>泡茶的例子把机制讲透了。</b> <span class='w'>你要给厨房建模：有蒸汽、窗外是不是日落、水的温度……而要成功泡茶，你唯一需要关心的特征是「水温超过 100 度」</span>。<b>但如果你只是去拟合最大似然模型，你会花掉全部的表达能力去建模日落和蒸汽</b>——<span class='k'>于是预测精度更高的那个模型，反而没抓住做决策需要的那个特征</span>。<b>她说这是几年前做智能辅导系统时撞上的，别人也独立撞上过。</b>", "<b>把这个例子和「只需要两两比较」放在一起，结论就很清楚了</b>：<span class='k'>预测精度与决策质量之间没有单调关系，而且<b>两个方向都可能</b></span>——<b>很差的模型可能给出完美决策（只要序对）；很准的模型可能给出糟糕决策（如果精度花在了无关特征上）</b>。<b>所以唯一可信的检验是端到端的：看它挑出来的东西好不好。</b>", "<b>最后补一条实录里的相关取舍，它解释了「模型为什么会错」的另一半。</b> <span class='w'>如果不想要马尔可夫假设，可以把整个历史当状态——那样假设永远成立，但数据会少到估不出转移</span>。<b>这是<b>函数近似误差</b>与<b>样本估计误差</b>的取舍</b>：<span class='k'>模型表达力不够是一种错，数据不够是另一种错，而你总得在两者之间选</span>。<b>上面那两个解法各对应其中一种。</b>"], "eq": "模型基 RL 的上限 = **近似 MDP 的最优策略**\n            （不是「真 MDP 的近似最优策略」—— 两者差得很远）\n\n两个解法，各治一种病：\n  解法 1  模型错就改用模型自由 RL\n          ⚠ 治不了：参数类选错 / 系统非马尔可夫\n            （因为 Q 学习**同样**假设马尔可夫 —— 模型自由不是「无假设」）\n  解法 2  对模型不确定性做推理（L13 的 β/√N）\n          ⚠ 只治**样本估计误差**，仍然假设**模型类是对的**\n            世界根本不是那个分布族 ⇒ all bets are off\n\n两种「错」的取舍（实录）：\n   条件在整个历史上  ⇒ 马尔可夫永远成立，但数据少到估不出来\n   条件在压缩的状态上 ⇒ 数据够，但可能不是马尔可夫\n   = 函数近似误差  vs  样本估计误差\n\n预测精度 与 决策质量：**没有单调关系，两个方向都可能**\n   很差的模型 → 完美决策     只要 V(s,a1) > V(s,a2) 的序对了\n   很准的模型 → 糟糕决策     精度花在无关特征上（泡茶：日落、蒸汽 vs 水温>100）\n   ⚠ 前提：**完美**模型 + **完美**参数估计 **是**足够的；\n     问题只出在数据受限或表达力受限时\n  ⇒ 唯一可信的检验是端到端的：看它挑出来的东西好不好", "tbl": {"head": ["「模型错了」的种类", "解法 1（改用模型自由）", "解法 2（算不确定性）"], "rows": [["数据不够，参数估偏", "<span class='w'>不治</span>", "<b>治</b>"], ["参数类 / 分布族选错", "<span class='w'>不治</span>", "<span class='w'>不治</span>"], ["系统不是马尔可夫", "<span class='w'>不治</span>（Q 学习也假设马尔可夫）", "<span class='w'>不治</span>"], ["表达力花在无关特征上", "<span class='w'>不治</span>", "<span class='w'>不治</span>"], ["<b>该问的两个问题</b>", "<b>我做了什么假设</b>", "<b>我把哪种不确定性算进去了</b>"]]}, "res": {"tag": "已核", "v": "<b>这两页把 L13 p26 那条缝补完了，而且补的方式比我原来给的检查更锐利。</b><br>L13 p26 只说「按预测损失优化不一定最适合规划」；<span class='k'>这里给了<b>前提</b>、<b>机制</b>和<b>正确的检验</b></span>。<br><b>前提</b>：<span class='w'>完美模型 + 完美参数估计<b>是</b>足够的</span>。<b>所以「R² 高不等于决策好」不是一个总成立的命题</b>——<b>它需要数据受限或表达力受限</b>。你的成本模型 R² &gt; 0.95 且训练数据来自穷举表，<span class='k'>所以它离「完美」比大多数场景都近，这条风险对你是偏小的</span>。<b>先说这一句，是因为我在 L13 那里把它讲得过于危险了。</b><br><b>机制</b>：泡茶的例子说的是<b>表达力被无关特征吃掉</b>。<span class='w'>翻译到你这里：如果成本模型的输入里塞了很多与成本无关的 query 特征（主题、长度、领域），而成本其实主要由「调用了哪些档位、各输出多少 token」决定</span>，<b>那么模型会把容量花在拟合 query 特征上，而那部分恰好不影响配置之间的排序</b>。<b>可做的检查很直接：做一次特征消融——只用 (节点,档位) 和 token 数去预测成本，看 R² 掉多少、看挑出的配置变不变。</b><span class='k'>如果 R² 掉了但挑出的配置不变，那些 query 特征就是泡茶例子里的日落。</span><br><b>正确的检验</b>：<span class='w'>决策只需要两两比较 <code>V(s,a₁) &gt; V(s,a₂)</code></span>——<b>所以你该报的不是 R²，而是<b>成对排序准确率</b></b>：<span class='k'>随机取两个配置，模型说哪个成本低，真值同意的比例</span>。<b>这个数直接对应决策质量，而 R² 不对应</b>。更好的一步：<b>只在「真值差距小」的配置对上算这个数</b>——<span class='w'>差距大的对子谁都能排对，模型的价值全在难分的那些上</span>。<b>这是一个几行代码就能从现有 oracle 表上算出来的指标，而且它比 R² 有说服力得多。</b><br><b>⚠ 还有一条要接住：这两页说的「解法都不是通解」对你同样成立。</b> <span class='k'>你那条「数据少的格子把成本往高估」的保守修正（L16.a p13 科研格）属于解法 2，所以它只治样本估计误差</span>——<b>它治不了「成本模型的函数形式本来就不对」</b>。<b>后者只能靠实际跑一遍来发现，这又回到那张「预测 vs 真值」的散点图。</b><br>标【已核】：前提、机制、两两比较三条均为实录原话逐句核对；特征消融与成对排序指标是我据此设计的做法。", "ref": "课件 p23–p24 · 实录 p23–p24（逐句核对）· L13 p26 · L16.a p13 科研格 · 简报 §4e（已核）"}},
{"r": [25, 28], "t": "前向搜索：只解「从现在开始」的那个子问题", "star": 3, "quote": "<b>Forward Search</b> — <em>Forward search algorithms select the best action by <b>lookahead</b></em> · <em>They build a search tree with the <b>current state s<sub>t</sub> at the root</b></em> · <em><b>No need to solve whole MDP, just sub-MDP starting from now</b></em><br><b>Simulation-Based Search</b> — <em>Forward search paradigm using sample-based planning</em> · <em>Simulate episodes of experience <b>from now</b> with the model</em> · <em>Apply model-free RL to simulated episodes</em><br><em>Monte-Carlo control → <b>Monte-Carlo search</b></em> · <em>Sarsa → <b>TD search</b></em>", "one": "<b>不解整个 MDP，只解「从当前状态开始」的那个子 MDP。这一个限制，是后面所有做法的共同前提。</b>", "pts": ["<b>p26 第三行是整个后半讲的地基</b>：<em><b>No need to solve whole MDP, just sub-MDP starting from now</b></em>。<span class='k'>这正是 p12 那个伏笔的兑现</span>——<b>只要知道此刻该做什么，就不必算出整个值函数</b>。", "<b>把这个限制省下的东西算一下，就知道它为什么关键。</b> <span class='w'>值迭代要对 |S| 个状态反复扫；而前向搜索只看从当前状态出发、H 步之内能到的那些状态</span>。<b>如果 H 小、或者从这里能到的地方不多，后者可能小得多</b>——<span class='k'>而且它完全不关心状态空间里那些你去不了的角落</span>。", "<b>前向搜索怎么算，实录讲得很完整，这里按它还原【<b>补课</b>】（p26 在 PDF 上只有四行要点）。</b> <span class='k'>从当前状态出发，枚举所有动作；每个动作下枚举所有可能的下一状态；在每个下一状态上再枚举动作……展开 H 层后停</span>。<b>然后从叶子往回收</b>：<span class='w'>遇到动作节点取 <b>max</b>（选最好的动作），遇到状态节点取 <b>期望</b>（按模型给的转移概率加权）</span>。<b>这就是 expectimax。</b>", "<b>回收的公式和贝尔曼备份是同一个东西，这一点她明确说了。</b> <code>V(a) = Σ<sub>s′</sub> P(s′|s,a)·V(s′)</code>，而 <code>V(s) = max<sub>a</sub> [ r(s,a) + V(a) ]</code>。<span class='k'>所以前向搜索不是一个新算法，它是贝尔曼备份在一棵展开的树上做一遍</span>。", "⚠️ <b>而她立刻指出这是一种<b>低效</b>的动态规划，理由是本讲最该记住的一条结构性事实。</b> <em>why is it not so efficient? Because <b>there might be many states in here which are identical. And I'm not aliasing those</b>, I'm not treating them as identical</em>。<span class='w'>树里会出现大量相同的状态，而树不把它们合并</span>。", "<b>把这件事说清楚：树和图的区别就在这里。</b> <span class='k'>动态规划在<b>状态</b>上做计算，同一个状态只算一次（它处理的是图）；前向搜索在<b>路径</b>上做计算，同一个状态经由不同路径到达就算多次（它处理的是树）</span>。<b>于是树的规模随 H 指数增长，而状态数不增长</b>——<b>这正是下一页那个 <code>(|S||A|)^H</code> 的来源。</b>", "<b>那为什么还要用树？因为它换来了两样东西。</b> ① <span class='k'>只需要「从这里出发」的局部信息，不必覆盖整个状态空间</span>；② <b>只需要能采样的模型，不必能枚举状态</b>——<span class='w'>这对大状态空间是决定性的</span>。<b>用指数的深度换掉了对状态空间规模的依赖，这笔交易在 H 小而 |S| 巨大时非常值。</b>", "<b>p27–p28 把这个框架再放松一步：别展开所有分支，只采一条轨迹。</b> <span class='k'>从当前状态出发，按某个模拟策略 π 选动作，从模型里采一个下一状态，继续，直到终止</span>。<b>这就得到一条完整的模拟轨迹和一个回报</b>。", "<b>而一旦有了模拟轨迹，前十五讲的算法就全都能用上——p28 把对应关系列了出来。</b> <span class='w'>蒙特卡洛控制 → 蒙特卡洛搜索；Sarsa → TD 搜索</span>。<b>注意这个命名法里的规律</b>：<span class='k'>把一个学习算法搬到「模型采的、从当前状态出发的」数据上，就得到一个<b>搜索</b>算法</span>。<b>「学习」和「搜索」的区别不在算法，在数据从哪来。</b>", "<b>这里要区分两个「采样」，否则后面会乱。</b> <span class='w'>p20 的采样式规划：从模型采数据，用来学一个<b>全局</b>的值函数或策略；p27 的基于模拟的搜索：从模型采数据，只为了决定<b>当下这一个</b>动作</span>。<b>同样的采样动作，目标不同</b>——<span class='k'>而后者算完就扔，下一步重新来</span>。"], "eq": "前向搜索：以**当前状态**为根建树，只解「从现在开始」的子 MDP\n\n  回收的两种运算（= 贝尔曼备份在展开的树上做一遍）：\n     动作节点  ──▶  取 max        选最好的动作\n     状态节点  ──▶  取**期望**     按模型的转移概率加权\n  ⇒ 这叫 expectimax 树（两人零和博弈里换成 minimax）\n\n⚠ 为什么说它是「低效的动态规划」（实录）：\n     动态规划在**状态**上算 —— 同一状态只算一次（处理的是**图**）\n     前向搜索在**路径**上算 —— 同一状态经不同路径到达就算多次（处理的是**树**）\n  ⇒ 树的规模随 H 指数增长，而状态数不增长\n\n那为什么还用树？换来两样东西：\n  ① 只要「从这里出发」的局部信息，不必覆盖整个状态空间\n  ② 只要**能采样**的模型，不必能枚举状态\n  ⇒ 用指数的深度，换掉了对状态空间规模的依赖（H 小而 |S| 巨大时非常值）\n\n命名法：把学习算法搬到「模型采的、从当下出发的」数据上，就叫**搜索**\n   蒙特卡洛控制 -> 蒙特卡洛搜索      Sarsa -> TD 搜索\n   ⇒ 「学习」与「搜索」的区别不在算法，在数据从哪来\n\n⚠ 两个「采样」别混：\n   p20 采样式规划  从模型采数据 -> 学一个**全局**的值函数/策略\n   p27 模拟式搜索  从模型采数据 -> 只定**当下这一个**动作，算完就扔", "tbl": {"head": ["", "动态规划", "前向搜索（树）"], "rows": [["在什么上做计算", "<b>状态</b>", "<b>路径</b>"], ["相同状态", "<b>合并，只算一次</b>", "<span class='w'>不合并，算多次</span>"], ["处理的是", "图", "<b>树</b>"], ["规模", "随 |S| 增长", "<span class='w'>随 H 指数增长</span>"], ["需要什么样的模型", "能枚举状态与概率", "<b>只要能采样</b>"], ["什么时候划算", "|S| 小", "<b>H 小而 |S| 巨大</b>"]]}, "res": {"tag": "推断", "v": "<b>「树不合并相同状态」这个选择，在你这里应该反过来——而知道课件为什么那样选，才能确信自己该这样选。</b><br><span class='k'>MCTS 不合并，理由是实现复杂度</span>（实录：<em>it becomes a lot more complicated for implementation if you wanted to treat it as a graph instead of a tree</em>），<b>而它付得起这个代价，因为围棋的状态几乎不重复</b>。<b>你的情形完全相反</b>：<span class='w'>决策点是 (节点编号, 保真度档位)，H×k 大约几十个，而且<b>高度重复</b></span>——<b>「节点 3 用 7B」在成千上万条 query 的轨迹里反复出现</b>。<b>合并它们，每个格子的样本量就乘上了 query 数；不合并，你就是在用几十个样本估一个本可以用几千个样本估的量。</b><span class='k'>所以你该当成图（表格）而不是树，而这和 L13 那条「你的格子数只有几十个，是真正的表格设定」是同一个结论，从另一个方向推出来的。</span><br><b>而「只解从现在开始的子问题」这个思路给了你一条还没用上的路。</b> <span class='w'>你现在的做法是选一个<b>全局</b>配置（或一个全局的指派策略），对所有 query 一视同仁</span>。<b>而这一页说的是另一种可能：对<b>每一条进来的 query</b>，当场做一次小搜索</b>——<span class='k'>在它自己的上下文里决定各节点的档位，算完就扔</span>。<b>两者的区别很实际</b>：<b>全局配置的优点是零推理开销、容易给保证；逐 query 搜索的优点是能利用这条 query 的具体信息</b>，<span class='w'>代价是每条 query 都要付搜索的成本，而「搜索」本身就要调 LLM——这比围棋里「在脑子里想」贵得多</span>。<br><b>⚠ 这条代价差异是本讲对你最重要的一处不对称，值得现在就记死。</b> <span class='k'>MCTS 的全部便宜建立在「模拟是免费的」上</span>：模型在本地跑，想多少次都行。<b>而你的「模拟」如果要真实调用 LLM，那就一次也不便宜</b>。<b>所以要把 MCTS 式的做法搬过来，前提是你有一个<b>不花 LLM 调用</b>的模拟器</b>——<span class='w'>成本那一半你有（成本模型），准确率那一半你没有</span>。<b>这又回到 L16.a 那个「半个模型」的结论，而它在这里变成了一个硬约束。</b><br>标【推断】：合并的论证与逐 query 搜索的取舍是我推的；格子规模与 oracle 表在简报里是【已核】。", "ref": "课件 p26–p28 · 实录 p26（不合并相同状态，逐句核对）· L13 科研格 · L16.a p6 科研格 · 简报 §5（已核）"}},
{"r": [29, 29], "t": "简单蒙特卡洛搜索：恰好一步策略改进", "star": 3, "quote": "<b>Simple Monte-Carlo Search</b> — <em>Given a model M<sub>v</sub> and a <b>simulation policy π</b></em> · <em>For each action a ∈ A: simulate K episodes from current (real) state s<sub>t</sub></em> · <em>Evaluate actions by mean return: Q(s<sub>t</sub>,a) = (1/K)Σ G<sub>t</sub> → q<sub>π</sub>(s<sub>t</sub>,a)</em> · <em>Select current (real) action with maximum value: a<sub>t</sub> = argmax<sub>a</sub> Q(s<sub>t</sub>,a)</em><br><em><b>This is essentially doing 1 step of policy improvement</b></em>", "one": "<b>对每个动作各采 K 条轨迹、取平均、挑最大。最后那行说得很准：这<b>恰好</b>是一步策略改进。</b>", "pts": ["<b>算法本身三行就讲完，但最后那行注释才是重点。</b> <span class='k'>对每个动作 a，从真实状态 <code>s_t</code> 出发、先走 a、之后一律按模拟策略 π 走到底，采 K 条，平均回报就是 <code>Q(s_t,a)</code></span>。<b>实录把这件事的画面说得很好</b>：<em>I'm really in state s_t, and then <b>in my brain</b>, I think about doing a₁, and then I do lots of roll outs from that under my policy π</em>。", "<b>为什么「恰好一步策略改进」？因为这个 Q 的定义就是一步策略改进的定义。</b> <span class='w'><code>Q(s_t,a)</code> 估的是 <code>q_π(s_t,a)</code>——「先做 a，然后<b>一直按 π</b>」的值</span>；<b>而在它上面取 argmax，正是策略改进定理里那一步</b>。<span class='k'>多一步也没有，少一步也不行。</span>", "<b>于是这个方法的上限立刻就定了，而这是本页最该记住的推论。</b> <span class='w'>它的好坏完全由模拟策略 π 决定</span>——<b>π 是随机策略，你就只比随机策略好一点点</b>；<b>π 是个高手，你就比高手好一点点</b>。<span class='k'>它不会自己变强，因为 π 在整个过程中一个字都没变。</span>", "<b>这就直接提出了下一页那个问题</b>：<em>whether or not we can actually do better than one step of policy improvement, because <b>how do we get these simulation policies?</b></em> <span class='w'>一步改进听起来便宜，可它预设了你已经有一个不错的 π——而那正是你本来要解决的问题</span>。<b>循环就在这里：要一个好策略，先得有一个好策略。</b>", "<b>把它和策略迭代对一下，关系就清楚了。</b> <span class='k'>策略迭代是「评估 → 改进 → 评估 → 改进」反复到收敛；这里只做了一轮，而且评估是靠采样做的</span>。<b>所以简单蒙特卡洛搜索 = 策略迭代的一轮，用模拟器代替解析求解</b>。<b>MCTS 要做的，就是在同一个计算预算内把这一轮变成多轮。</b>", "<b>还有一个实现上的细节值得注意：K 条轨迹是<b>每个动作</b> K 条，总共 <code>|A|·K</code> 条。</b> <span class='w'>而这些预算是平均分配的——哪怕某个动作第一条轨迹就显示它糟得没救，它仍然会拿到剩下的 K−1 条</span>。<b>这个浪费正是 MCTS 要修的第一件事</b>：<span class='k'>把算力集中到看起来有希望的那些分支上</span>。", "<b>最后一点容易忽略：这个方法只改进<b>当前这一个状态</b>的动作。</b> <span class='k'>它不产出策略，只产出一个动作</span>。<b>下一步到了新状态，整个过程从头再来</b>——<span class='w'>而且上一轮算出来的东西基本都扔掉了</span>。<b>这是「只解从现在开始的子问题」的代价，也是它能便宜的原因。</b>"], "eq": "简单蒙特卡洛搜索：\n   for 每个动作 a:\n       从真实状态 s_t 出发，先走 a，之后一律按模拟策略 π 走到底，采 K 条\n       Q(s_t, a) = (1/K) Σ G_t   ──▶  q_π(s_t, a)\n   a_t = argmax_a Q(s_t, a)\n\n为什么「**恰好**一步策略改进」：\n   Q 估的是 q_π(s_t,a) = 「先做 a，然后**一直按 π**」\n   在它上面取 argmax = 策略改进定理里那一步。多一步没有，少一步不行。\n\n⇒ 上限由 π 决定：π 随机 ⇒ 只比随机好一点；π 是高手 ⇒ 只比高手好一点\n   它**不会自己变强**，因为 π 全程没变\n\n⇒ 循环：要一个好策略，先得有一个好策略  ← 下一页要破的就是这个\n\n两处浪费（MCTS 要修的）：\n  ① 预算平均分配：某动作第一条就显示没救，仍然拿到剩下的 K−1 条\n  ② 只产出**一个动作**，不产出策略；下一步从头再来，上一轮基本全扔", "tbl": {"head": ["", "简单蒙特卡洛搜索", "策略迭代"], "rows": [["做几轮改进", "<b>恰好一轮</b>", "反复到收敛"], ["评估怎么做", "<b>采样（模拟器）</b>", "解析求解 / 迭代"], ["上限", "<span class='w'>由模拟策略 π 定</span>", "最优策略"], ["产出", "<b>一个动作</b>", "一个策略"], ["预算怎么分", "<span class='w'>各动作平均分</span>", "—"]]}, "res": {"tag": "推断", "v": "<b>这一页就是你那个「一步偏离扫描」的理论身份，而知道它叫什么，能让你准确说出它能做到什么、做不到什么。</b><br><span class='k'>你的扫描是：从 AFlow 搜出来的基线配置出发，每次只改<b>一个</b>节点的档位，看 G 怎么变</span>。<b>把 π 取成「基线配置」，这一页的算法就逐字变成你的扫描</b>：<span class='w'>先在一个节点上偏离（= 先做动作 a），其余节点一律按基线（= 之后按 π），测 G（= 采样估 q_π），挑最好的（= argmax）</span>。<b>所以你做的是<b>恰好一步策略改进</b>，而这个说法有出处、有定理、有已知的性质。</b><br><b>立刻得到两条可以写进论文的结论。</b> ① <b>保证</b>：<span class='k'>策略改进定理说，一步改进<b>不会变差</b></span>——<b>所以「扫描挑出来的配置不劣于 AFlow 基线」是有依据的，不是经验观察</b>（⚠ 前提是 G 估得准，而这就是置信下界那一节的事）。② <b>上限</b>：<span class='w'>一步改进的上限由基线决定</span>——<b>AFlow 基线差，扫描的结果也只能比它好一点</b>。<b>这正面回答了「为什么不直接搜整个 2^H 空间」：因为我们做的是有保证的一步改进，而不是无保证的全局搜索。</b><br><b>而这一页的「循环」也正是你的处境，说出来反而显得清醒</b>：<span class='k'>要一个好的指派策略，先得有一个好的基线</span>。<b>你的基线是 AFlow 给的，所以你站在它的肩膀上——这是优点，也是天花板。</b><br><b>⚠ 那两处浪费你都有，而第一处有现成的解法。</b> <span class='w'>预算平均分配：你给每个「一步偏离」的候选都跑同样多的 query</span>。<b>而按 L12 的做法，应该<b>逐步淘汰</b></b>——<span class='k'>某个偏离在前若干条 query 上已经明显更差，就不必跑完</span>。<b>这能把扫描的 LLM 调用省掉一大截，而且省下来的预算可以用在难分的那几对上</b>（接 p47 那条「该花算力在哪」）。<br><b>最后一条：要突破一步改进的上限，就得像 MCTS 那样做多轮——把这一轮挑出来的配置当新基线，再扫一遍。</b> <span class='w'>⚠ 但那时 L04 p42 的最大化偏差会累积</span>：<b>每一轮都在同一批数据上取 argmax，几轮之后虚高会很严重</b>。<b>多轮扫描必须每轮换一批 query，这是能不能做多轮的决定性条件。</b><br>标【推断】：身份对应与多轮的警告是我推的；一步偏离扫描与逐步淘汰在简报／L12 里是【已核】。", "ref": "课件 p29 · 实录 p29 · 简报 §4c（已核）· L12（逐次淘汰）· L04 p42"}},
{"r": [30, 31], "t": "Expectimax 树：正确，但叶子数是 (|S||A|)^H", "star": 2, "quote": "<b>Expectimax Tree</b> — <em><b>Can we do better than 1 step of policy improvement?</b></em> · <em>If have a MDP model M<sub>v</sub>, can compute <b>optimal</b> q(s,a) values for current state by constructing an expectimax tree</em> · <em>Limitations: Size of tree scales as <b>(|S||A|)<sup>H</sup></b></em>", "one": "<b>想突破一步改进，就把整棵树展开——这样算出来的是真正的最优值。代价是树的规模按 (|S||A|)^H 走。</b>", "pts": ["<b>这两页是同一帧的两次覆盖，而被盖住的恰好是答案：那个 <code>?</code> 揭晓成 <code>(|S||A|)^H</code>。</b> <span class='k'>先想清楚为什么是这个式子</span>：<b>每一层你要枚举所有动作（乘 |A|），对每个动作要枚举所有可能的下一状态（乘 |S|）</b>，<span class='w'>H 层下来就是 <code>(|S||A|)^H</code></span>。", "<b>注意它和一步改进的关系：这是同一条路走到底。</b> <span class='k'>一步改进只展开一层（而且下一层用 π 代替枚举）；expectimax 展开全部 H 层、每层都取 max</span>。<b>于是它给出的是<b>近似模型下的真正最优</b> <code>q*</code>，不再依赖任何模拟策略</b>——<span class='w'>那个「循环」被破掉了</span>。<b>代价就是这个指数。</b>", "<b>实录给了围棋的数字，把「不可行」变成具体的。</b> <em>if you think of something like AlphaGo, that are playing for a number of time steps before someone wins or loses, this <b>H might be somewhere between 50 to 200</b></em>。<span class='k'>H=50 时，哪怕 |S||A| 只有 2，叶子数也是 2^50</span>——<b>而围棋的 |S||A| 是天文数字。</b>", "<b>她的结论下得很干脆</b>：<em>if you have anything larger than an extremely small state space like one, then this is <b>not gonna be feasible</b></em>。<span class='w'>「比 1 大一点」都不行</span>——<b>这不是「慢」，是根本做不动。</b>", "<b>于是这两页其实是在把问题框死，而框死之后出路只有一条。</b> <span class='k'>一步改进：便宜，但上限由 π 定；全展开：最优，但指数不可行</span>。<b>两端都不可用，所以必须有中间地带</b>——<span class='w'>而「中间地带」的具体形状，就是下一页的 MCTS</span>。", "<b>再补一句对这个指数的理解，它解释了 MCTS 为什么有机会。</b> <span class='k'>这个指数来自「<b>所有</b>动作 × <b>所有</b>下一状态」这两个「所有」</span>。<b>而其中大部分分支是没必要展开的</b>：<span class='w'>有些走法一眼就输，再往下算多少步都不会改变结论</span>。<b>指数增长是「无差别对待所有分支」的代价，不是问题本身的代价。</b>", "<b>实录把这个判断说得很具体，而它就是 MCTS 的全部直觉</b>：<em>some of these might be clear <b>very early, with very little amounts of rollouts</b>, that these are ways you would <b>never</b> want to play Go, because you're going to immediately lose. And so then you don't need to bother continuing to spend a lot of computational effort fleshing out that tree</em>。"], "eq": "Expectimax 树：展开全部 H 层，每层动作节点取 max、状态节点取期望\n   ⇒ 给出**近似模型下的真正最优** q*，不依赖任何模拟策略（「循环」被破掉）\n   ⇒ 代价：叶子数 **(|S||A|)^H**\n       每层：枚举所有动作（×|A|）× 枚举所有下一状态（×|S|）\n\n围棋的 H（实录）：**50 到 200**     而 |S||A| 是天文数字\n   ⇒ 她的结论：状态空间只要「比 1 大一点」就不可行\n\n两端都不可用：\n   一步改进      便宜，但上限由 π 定\n   全展开        最优，但指数不可行\n   ⇒ 必须有中间地带 = MCTS\n\n而指数来自两个「**所有**」：所有动作 × 所有下一状态\n   大部分分支没必要展开 —— 有些走法一眼就输，再算多少步也不改结论\n   ⇒ 指数增长是「无差别对待所有分支」的代价，不是问题本身的代价", "tbl": {"head": ["", "一步策略改进", "Expectimax 全展开"], "rows": [["展开几层", "<b>一层</b>", "<b>全部 H 层</b>"], ["下面怎么估", "按模拟策略 π 走到底", "<b>继续枚举并取 max</b>"], ["算出来的是", "q<sub>π</sub>", "<b>q*（近似模型下）</b>"], ["依赖 π 吗", "<span class='w'>完全依赖</span>", "<b>不依赖</b>"], ["规模", "|A|·K 条轨迹", "<span class='w'>(|S||A|)<sup>H</sup></span>"]]}},
{"r": [32, 33], "t": "MCTS：故意长成偏的一棵树", "star": 3, "quote": "<b>Monte-Carlo Tree Search (MCTS)</b> — <em>Build a search tree rooted at the current state s<sub>t</sub></em> · <em><b>Iteratively</b> construct and update tree by performing K simulation episodes starting from the root state</em><br><em>Simulating an episode involves <b>two phases (in-tree, out-of-tree)</b></em> · <em><b>Tree policy</b>: pick actions for tree nodes to maximize Q(S,A)</em> · <em><b>Roll out policy</b>: e.g. pick actions <b>randomly</b>, or another policy</em><br><em>To evaluate node i at (s,a), <b>average over all rewards received from that node onwards</b> across simulated episodes in which this tree node was reached</em> · <em>Under mild conditions, converges to the optimal search tree, Q → q*</em>", "one": "<b>不展开整棵树，而是反复从根出发采轨迹，让树在「看起来有希望」的方向上长得更深。树因此是偏的——而这正是设计目的。</b>", "pts": ["<b>核心机制一句话：反复从根出发采完整轨迹，每采一条就把树长出一点。</b> <span class='k'>第一条轨迹和基于模拟的搜索一模一样（只采一条路）；但第二条、第三条会落到不同的分支上，于是树慢慢被填出来</span>。<b>实录说了极限情形</b>：<em>in the limit, you will fill in the entire expectimax tree. It's just that <b>in practice you almost never will</b></em>。", "<b>两个阶段的分工是本页最要紧的结构，要分清。</b> <span class='w'><b>树内</b>（in-tree）：已经有统计数据的节点，用<b>树策略</b>选动作——目标是最大化 Q，也就是往有希望的方向走</span>；<span class='w'><b>树外</b>（out-of-tree）：走到了一个没见过的节点，往下就没有统计可用了，改用<b>rollout 策略</b>——最朴素的版本就是<b>随机</b>走到底</span>。", "<b>为什么要分成两段？因为两段解决的是两个不同的问题。</b> <span class='k'>树内的问题是「该把算力花在哪个分支」——这需要已有的统计；树外的问题是「这个新节点大概值多少」——这只需要一个粗糙但无偏的估计</span>。<b>随机 rollout 正好满足第二个要求：它很粗糙，但它不系统性地偏向谁。</b>", "<b>p33 那个 Q 的定义要读仔细，它比看起来简单。</b> <span class='w'>节点 i 的值 = 所有经过 i 的模拟轨迹中，<b>从 i 往后</b>拿到的回报的平均</span>。<b>注意三件事</b>：<span class='k'>① 是「往后」，不含到达 i 之前的奖励；② 是简单平均，不是加权；③ 分母是 <code>N(i)</code>，这个节点被访问过的次数</b>。", "⚠️ <b>而实录指出这个定义「应该让人觉得有点怪」，这句话值得停一下。</b> <em>This should seem a little bit weird, because <b>we're not talking about maxes anymore</b>, and we're not considering explicitly the expectation over states in a formal way, <b>we're just gonna average</b></em>。<span class='w'>expectimax 里明明是动作取 max、状态取期望，怎么这里全变成平均了？</span>", "<b>她给的理由很精巧，是本讲最值得理解的一步。</b> <em>the reason why this is okay is because we're gonna <b>sample actions in a way such that over time, we're gonna sample actions that look better much more</b>, and so we expect that eventually the distribution of data is gonna converge to the true Q</em>。<span class='k'>max 没有消失，它被搬进了<b>采样分布</b>里</span>——<b>因为树策略越来越倾向于选最好的动作，所以「平均」自动逼近「最大」。</b>", "<b>把这件事说得更清楚一点，因为它是 MCTS 全部优雅之处。</b> <span class='w'>如果采样是均匀的，平均就是期望，和 max 差很远</span>；<b>但如果采样概率随着「这个动作看起来多好」而集中，那么在极限下几乎所有样本都来自最好的那个动作，平均值就趋于最大值</b>。<span class='k'>于是你不需要在回收时显式取 max，采样过程已经替你做了</span>——<b>这也解释了为什么 p33 敢说「在温和条件下收敛到最优搜索树」。</b>", "<b>另一个该记的点来自实录：k 条 rollout 用的策略是<b>各不相同</b>的，而且是故意的。</b> <em>generally, the policy will be <b>different for each of the k roll outs</b>, and that's <b>on purpose</b> so that you can hopefully get to a better policy</em>。<span class='w'>这是它和简单蒙特卡洛搜索的根本区别</span>：<b>后者固定 π、只做一步改进；前者每条轨迹都在用更新过的统计，所以能逐步变强。</b>", "<b>最后两条实操细节，实录里顺带提到，但都挺重要。</b> ① <span class='k'>算完一步之后，<b>整棵树通常就扔掉</b></span>（<em>it may then throw that whole tree away</em>）——<b>下一个真实状态来了，从头建</b>；② <span class='w'>在线设定下还可以在每步之间<b>重新训练模型</b></span>，<b>然后用新模型重跑 MCTS</b>。<b>「学模型 → 规划 → 行动 → 收数据 → 再学模型」这个大回路，到这里才真正闭合。</b>"], "eq": "MCTS：反复从根采完整轨迹，每条轨迹让树长出一点\n\n  两个阶段：\n    树内 in-tree    有统计数据 ──▶ **树策略**：最大化 Q，往有希望的方向走\n    树外 out-of-tree 没见过的节点 ──▶ **rollout 策略**：最朴素就是**随机**走到底\n    （两段解决两个问题：该把算力花在哪  vs  这个新节点大概值多少）\n\n  节点 i 的值 = 所有经过 i 的轨迹中，**从 i 往后**拿到的回报的**简单平均**\n       ① 往后，不含到达 i 之前的奖励   ② 简单平均   ③ 分母是 N(i)\n\n⚠ 「全是平均，max 哪去了？」——**max 被搬进了采样分布里**：\n     均匀采样      ⇒ 平均 = 期望，离 max 很远\n     集中采样      ⇒ 树策略越来越偏向最好的动作\n                    ⇒ 极限下几乎所有样本都来自最好的动作\n                    ⇒ 平均  自动趋于  最大\n   所以回收时不必显式取 max —— 采样过程已经替你做了\n   这也是 p33 敢说「温和条件下 Q -> q*」的根据\n\n与简单蒙特卡洛搜索的根本区别：\n   后者固定 π，只做一步改进\n   前者 k 条 rollout 各用**不同**的策略（故意的）⇒ 能逐步变强\n\n两条实操细节（实录）：\n   ① 算完一步，**整棵树通常扔掉**，下一个真实状态来了从头建\n   ② 在线设定下可在每步之间**重新训练模型**，再重跑 MCTS\n      ⇒ 「学模型 -> 规划 -> 行动 -> 收数据 -> 再学模型」到这里闭合", "tbl": {"head": ["", "树内（tree policy）", "树外（rollout policy）"], "rows": [["什么时候用", "节点已有统计数据", "<b>走到没见过的节点之后</b>"], ["目标", "<b>最大化 Q</b>（往有希望处走）", "给出一个粗糙的值估计"], ["典型做法", "<b>UCT</b>（下一页）", "<b>随机</b>，或一个学好的策略"], ["要解决的问题", "算力该花在哪个分支", "这个新节点大概值多少"], ["对偏差的要求", "刻意偏向好动作", "<b>不系统性偏向谁</b>"]]}},
{"r": [34, 36], "t": "UCT：把每个节点当成一个独立的老虎机", "star": 3, "quote": "<b>Upper Confidence Tree (UCT) Search</b> — <em>How to select what action to take during a simulated episode?</em><br><em>UCT: borrow idea from <b>bandit literature</b> and treat <b>each node</b> where can select actions as a <b>multi-armed bandit</b> problem</em><br><em>Q(s,a,i) = (1/N(s,a,i))·Σ<sub>k</sub>Σ<sub>u</sub> 1(i∈epi.k)·G<sub>k</sub>(s,a,i) + c·√( ln n(s) / n(s,a) )</em><br><em>For simplicity can treat <b>each state node as a separate MAB</b></em> · <em>This implies that the policy used to simulate episodes <b>can change across each episode</b></em>", "one": "<b>树策略就用 L12 那个 UCB：每个节点当成一个独立的老虎机，摇臂的回报是从这个节点起算的整条 rollout。</b>", "pts": ["<b>式子和 L12 的 UCB 一模一样，换的只是「臂」和「回报」的定义。</b> <span class='k'>臂 = 在这个节点可选的动作；回报 = <b>从这个节点起算的整条 rollout 的回报</b></span>。<b>实录把第二点点得很明确</b>：<em>what is the reward for this bandit? We are gonna treat it as essentially the <b>full roll out from that node</b></em>。", "<b>这一点必须和 TD 区分开，否则会误解整个机制。</b> <em>It's <b>not like TD</b> in the sense that we're doing this <b>per node</b></em>。<span class='w'>TD 用的是「单步奖励 + 下一状态的估值」；UCT 用的是「这条路一直走到底拿到的回报」</span>。<b>所以 UCT 是蒙特卡洛式的——没有自举，也就没有自举带来的偏差</b>，<span class='k'>代价是方差大、而且必须走到终止才拿得到一个数</span>。", "<b>那个 <code>c·√(ln n(s)/n(s,a))</code> 的作用和 L12 完全相同：没怎么试过的动作，加成大。</b> <span class='k'>于是树策略会在「现在看起来好」和「还不太了解」之间权衡</span>。<b>实录给的直觉是</b>：<em>if you had an <b>oracle</b> that could tell you what the optimal policy was, then you would <b>only need to fill in that part of the tree</b></em>——<span class='w'>没有先知，就用「目前看起来好」当代用品</span>。", "<b>最后一行那句话的分量很容易被漏掉</b>：<em>the policy used to simulate episodes <b>can change across each episode</b></em>。<span class='k'>每采一条轨迹，计数就变了，于是下一条轨迹在同一个节点上可能选不同的动作</span>。<b>这正是上一页说的「k 条 rollout 的策略各不相同」的来源</b>——<b>策略不是被显式更新的，它是被<b>计数</b>隐式推着变的。</b>", "⚠️ <b>而这里有一条实录才讲、而且是本讲最该记住的结构性事实：同一个 (s,a) 出现在树的不同位置，计数<b>不合并</b>。</b> <em>you might have s₁,a₁ appear in this part of the graph and s₁,a₁ appear over here, and <b>we're not combining their counts. We're treating every node as if it's totally distinct</b></em>。", "<b>而她给的理由很诚实，也很重要：这不是因为合并不对，是因为合并麻烦。</b> <em>Even though often the model we'll be using to simulate <b>will be Markov</b>... it's mostly that <b>it becomes a lot more complicated for implementation</b> if you wanted to treat it as a graph instead of a tree</em>。<span class='w'>模型是马尔可夫的，所以合并在统计上是<b>合法</b>的、而且会让每个格子的样本量变大</span>——<b>放弃它纯粹是工程上的权衡。</b>", "<b>把这个权衡的代价算清楚：不合并意味着你在浪费样本。</b> <span class='k'>同一个 <code>(s,a)</code> 在树里出现 m 次，每次各自从零开始积累统计，而本可以共享</span>。<b>在状态几乎不重复的问题上（围棋的局面），这个浪费接近于零；在状态高度重复的问题上，这个浪费是巨大的</b>——<span class='w'>而后者正是「该用图而不是树」的判据</span>。", "<b>还有一条简化要注意：p36 说「为简单起见，可以把每个状态节点当成一个独立的老虎机」。</b> <span class='k'>「独立」在这里是一个明显不成立的假设</span>——<b>不同节点的值当然相关（它们在同一棵树上，共享下游结构）</b>。<span class='w'>而把它们当独立，就意味着 UCB 的那套遗憾界在这里并不严格适用</span>。<b>这是又一处「定理的前提没人遵守」，和 L13 p13 那个「只用前 m 个样本」是同一个模式。</b>", "<b>最后，p34–p36 是同一帧的三次覆盖，这个顺序本身是教学设计</b>：<span class='k'>先只问「怎么选动作」，再说「借老虎机的想法」，最后才给式子</span>。<b>问题先于答案——而这个问题（在模拟里该怎么选动作）在 p47 会被重新拷问一遍，答案还会反转。</b>"], "eq": "UCT = L12 的 UCB，换掉「臂」和「回报」的定义：\n\n   臂    = 在这个节点可选的动作\n   回报  = **从这个节点起算的整条 rollout 的回报**（不是单步奖励！）\n\n   Q(s,a,i) = (从 i 起算的 rollout 回报的平均)  +  c·sqrt( ln n(s) / n(s,a) )\n                                                 └ 没怎么试过的，加成大 ┘\n\n⚠ 与 TD 的区别：TD = 单步奖励 + 下一状态估值（有自举）\n                UCT = 走到底的整条回报（蒙特卡洛式，无自举）\n                ⇒ 无自举偏差，代价是方差大、必须走到终止\n\n⚠ 同一个 (s,a) 出现在树的不同位置，计数**不合并**（实录）\n   理由不是「合并不对」，而是「合并麻烦」：\n     模型是马尔可夫的 ⇒ 合并在统计上**合法**，而且会让样本量变大\n     放弃它纯粹是工程权衡\n   代价：同一 (s,a) 出现 m 次就各自从零积累统计\n     状态几乎不重复（围棋局面）⇒ 浪费 ≈ 0\n     状态高度重复            ⇒ 浪费巨大 ⇐ **该用图而不是树的判据**\n\n⚠ p36 那句「为简单起见，每个状态节点当成独立老虎机」：\n   「独立」明显不成立（同一棵树，共享下游结构）\n   ⇒ UCB 的遗憾界在这里并不严格适用（同 L13 p13「定理前提没人遵守」）", "tbl": {"head": ["", "L12 的 UCB（老虎机）", "UCT（树）"], "rows": [["臂是什么", "一个动作", "<b>某节点上的一个动作</b>"], ["回报是什么", "单次奖励", "<b>从该节点起算的整条 rollout</b>"], ["加成项", "c·√(ln n / n<sub>a</sub>)", "<b>同一个式子</b>"], ["臂之间独立吗", "是（假设）", "<span class='w'>不是，但当成是</span>"], ["相同 (s,a) 合并计数吗", "—", "<span class='w'>不合并（工程权衡）</span>"], ["有遗憾界吗", "<b>有</b>", "<span class='w'>前提不成立，不严格适用</span>"]]}, "res": {"tag": "推断", "v": "<b>UCT 里「臂是节点上的动作、而回报是整条 rollout」这个设定，和你的问题是逐项对应的——包括它最难的那一处。</b><br><span class='k'>你的臂 = (节点 i, 档位 f)；你的回报 = 整条 workflow 跑完的 <code>G</code></span>。<b>于是你面对的正是 UCT 面对的那个信用分配问题</b>：<span class='w'>一条 rollout 只给出一个数，而这个数是沿途<b>所有</b>节点的档位共同造成的</span>。<b>UCT 的解法是「不分配」——把整条回报同时记到路径上每个节点的账上，靠大量 rollout 让噪声平均掉。</b><br><b>这个解法对你成立吗？要分两半看，而答案不一样。</b> <span class='k'><b>成本那一半可以精确分配</b>：每个节点的调用成本是单独可测的，不需要靠平均去猜</span>。<span class='w'><b>准确率那一半不能</b>：它是终局的、整条链共同决定的，只能用 UCT 这种「整条回报记到每个节点」的办法</span>。<b>这是「拆成两半」的第七个理由，而且它第一次给出了<b>算法上</b>的差别而不只是统计上的</b>：<b>成本那一半用精确分摊，准确率那一半用 UCT 式的平均。</b><br><b>而「同一个 (s,a) 不合并计数」这条，你应该明确地反着做，理由这一页也给了。</b> <span class='k'>实录说得很清楚：模型是马尔可夫的，所以合并是<b>合法</b>的，放弃它只是因为实现麻烦</span>。<b>你的格子只有 H×k 几十个、而且每条 query 都会经过它们</b>——<span class='w'>合并之后每个格子的样本量乘以 query 数</span>。<b>所以你拿到的是 UCT 放弃掉的那份统计强度，而且几乎没有实现代价</b>（你的「树」只有 H 层、每层 k 个选择）。<b>写论文时这一句值得明说：我们把 MCTS 为工程便利而放弃的状态合并拿回来了，因为我们的决策空间小到可以查表。</b><br><b>⚠ 但要接住它的代价：合并等于断言「节点 i 的档位效果与路径无关」。</b> <span class='w'>如果前面节点用了 7B 导致输入质量下降，节点 i 用 72B 的边际收益可能完全不同</span>——<b>那就是节点间交互，合并会把它抹平</b>。<b>而这正好是 L16.a p18 那个可加性实验要测的东西</b>：<span class='k'>可加性成立 ⇒ 合并是对的；不成立 ⇒ 合并会系统性地偏，那时就该像 UCT 一样按路径分开记</span>。<b>两页指向同一个实验，而这个实验的结论决定了你该用表还是用树。</b><br>标【推断】：对应关系与合并的论证是我推的；节点级指派与格子规模在简报里是【已核】。", "ref": "课件 p34–p36 · 实录 p36（回报是整条 rollout、不合并计数，逐句核对）· L16.a p18 科研格 · 简报 §4f §5（已核）"}},
