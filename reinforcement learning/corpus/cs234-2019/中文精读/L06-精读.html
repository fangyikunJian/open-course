{"r": [4, 4], "t": "为什么要泛化", "one": "自动驾驶、Atari、营销、医疗、教育——状态/动作空间都大到写不下表。", "pts": ["把 <code>V</code> 或 <code>Q</code> 换成带参数的函数，这一点和上一讲完全一样。", "<b>「为什么要泛化」这个问题，到这一讲已经问过三次了，而每次的答案都更具体一层。</b><span class='k'>L02 p5：MDP 的局限不在表达力，在计算——状态空间可能大到算不动</span>；<span class='k'>L05 p10：表格表示的致命处不是存不下，是状态之间<b>不共享信息</b>，所需样本量至少和状态数同阶</span>；<span class='k'>这一讲：既然必须共享信息，那么「用什么函数类来共享」就成了核心问题</span>。<b>而答案从「手工设计的线性特征」变成了「深度网络」。</b>", "<b>把「泛化」这个词的实际含义说准，它比「不用存那么多数」深得多。</b><span class='w'>泛化的意思是：你在状态 A 上学到的东西，能自动改善你对状态 B 的估计</span>。<b>而「自动」的依据是「A 和 B 在你的表示下看起来像」。</b><span class='k'>所以表示决定了「哪些状态被认为相像」——这是你注入先验知识的地方，也是你犯错的地方</span>。<b>L08 p10 的状态混叠就是这件事出错时的样子：两个该区分的状态被当成了同一个。</b>", "<b>顺带把「泛化」和「探索」这两个词的关系理一下，它们在这一讲里会同时出现。</b><span class='k'>泛化是「我没去过那里，但我能猜出那里大概什么样」</span>；<span class='k'>探索是「我得真的去那里看看」</span>。<b>两者是互补的：泛化越好，需要的探索越少。</b><span class='w'>而 DQN 在 Atari 上的成功主要来自泛化（卷积网络认出了画面的结构），它的失败（蒙特祖玛）主要来自探索不足</span>。"], "quote": "Why do we need generalization? &nbsp;·&nbsp; Want to scale up to large state and action spaces where <b>tabular representations are infeasible</b>"},
{"r": [5, 7], "t": "复习：SGD 与线性 VFA", "one": "上一讲的式子原样搬过来，下面要把 <code>V̂</code> 换成深度网络。", "eq": "J(w) = E_π[ ( V^π(s) − V̂^π(s; w) )² ]\nΔw = α·( V^π(s) − V̂(s; w) )·∇_w V̂(s; w)\n\nMC： Δw = α·( G_t − x(s_t)ᵀw )·x(s_t)\nTD： Δw = α·( r_t + γ·x(s_{t+1})ᵀw − x(s_t)ᵀw )·x(s_t)", "quote": "Recall: Stochastic Gradient Descent and Linear Value Function Approximation &nbsp;·&nbsp; <b>V̂(s;w) = w^T x(s)</b> &nbsp;·&nbsp; Δw = α(target − V̂(s;w)) ∇_w V̂(s;w)", "pts": ["<b>线性 VFA 的全部好处都来自一个事实：<span class='k'>它的梯度就是特征本身</span>。</b><b><code>∇_w (wᵀx(s)) = x(s)</code>——不依赖 <code>w</code>。</b><span class='w'>于是更新式变成 <code>w ← w + α·(目标 − 预测)·x(s)</code>，极其简单</span>，<b>而且目标函数关于 <code>w</code> 是凸的（平方损失 + 线性预测）。</b><span class='k'>所有 L05 那些漂亮的收敛结论，根子都在这个凸性上。</span>", "<b>而非线性逼近（比如神经网络）一上来，这两条好处同时消失。</b><span class='w'>梯度变成 <code>∇_w Q̂(s,a;w)</code>，依赖 <code>w</code> 本身</span>；<span class='w'>目标函数非凸，有大量局部最优和鞍点</span>。<b>于是 L05 那套「收敛到最优线性逼近」的结论全部作废。</b><span class='k'>这一讲接下来做的事，本质上是：放弃理论保证，换表达力，然后用工程手段把稳定性补回来。</span>", "<b>把这个更新式和 L03 的表格更新并排写，你会看到函数逼近到底改了什么。</b><span class='k'>表格：<code>V(s) ← V(s) + α(目标 − V(s))</code>——只改 <code>s</code> 这一格</span>；<span class='k'>线性 VFA：<code>w ← w + α(目标 − wᵀx(s))·x(s)</code>——改的是<b>整个权重向量</b></span>。<b>于是这一次更新会同时改变<b>所有</b>状态的估值。</b><span class='w'>这既是泛化（好处），也是干扰（坏处）</span>——<b>在一个状态上学到的东西，会不可避免地影响你对其他状态的估计，哪怕那些状态其实不相关。</b>", "<b>这个「一次更新改变所有估值」的性质，是 L05 所有麻烦的技术根源，值得再强调一次。</b><span class='k'>表格情形下，各个状态的更新互不干扰，所以收敛分析很简单</span>；<span class='w'>函数逼近下，你更新 <code>s</code> 可能把 <code>s′</code> 的估值推歪，而 <code>s′</code> 又是 <code>s</code> 的自举目标</span>——<b>于是形成了一个可能失控的反馈回路。</b><span class='k'>L05 p44 的 Baird 反例就是这个回路发散的样子。</span>", "<b>最后澄清一个符号上的事，免得你在这一讲和 L05 之间对照时犯迷糊。</b><span class='k'>L05 大量用 <code>V̂(s;w)</code>，这一讲几乎全用 <code>Q̂(s,a;w)</code></span>。<b>原因在 L04 p12 已经说过：控制必须估 Q，因为从 V 贪心要穿过模型。</b><span class='w'>所以这一讲的一切都是作用在 Q 上的</span>，<b>而 L05 的那些结论（关于 V 的）需要你自己搬过来——结论形式一样，只是多了个动作下标。</b>", "<b>还有一件 L05 讲过、但在这里需要重新审视的事：<span class='k'>SGD 在 RL 里不是「随机梯度下降」</span>。</b><span class='w'>标准 SGD 的「随机」指的是「从固定数据分布里随机抽一个样本」，于是梯度是真梯度的无偏估计</span>；<b>而 RL 里数据来自你自己的策略，分布会变，而且样本之间相关。</b><span class='k'>更要命的是：目标里含着你正在优化的参数，所以这连「梯度」都算不上（L05 p29 的半梯度）</span>。<b>于是「用 SGD 优化 MSE」这句话里，三个词各自都打了折扣。</b><span class='w'>这一讲的两个补丁，正是在把这三个折扣尽量补回来。</span>", "<b>把这件事列成一张对照，你就知道 DQN 的两个补丁为什么是这两个而不是别的。</b><span class='k'>标准 SGD 需要三条：① 样本独立；② 目标固定；③ 梯度是真梯度</span>。<span class='w'>RL 里三条全破</span>。<b>而经验回放修①，固定目标修②</b>——<span class='w'>③（半梯度）没修，而且<b>没法</b>修</span>，<b>因为修它（改用残差梯度）会需要双采样，而且实践中效果更差（L05 p44 的 Baird 论文讨论过）。</b><span class='k'>所以 DQN 修了能修的两条，第三条留在那里。</span>"], "tbl": {"head": ["标准 SGD 需要", "RL 里成立吗", "DQN 怎么办"], "rows": [["① 样本独立同分布", "<span class='w'>不成立（轨迹相关）</span>", "<span class='k'>经验回放（p38）</span>"], ["② 目标（标签）固定", "<span class='w'>不成立（目标含 w）</span>", "<span class='k'>固定 Q 目标（p40）</span>"], ["③ 用的是真梯度", "<span class='w'>不成立（半梯度，L05 p29）</span>", "<span class='w'>没修，也没法修——残差梯度要双采样且实测更差</span>"]]}},
{"r": [8, 8], "t": "线性 VFA 的天花板", "star": 3, "one": "特征给对了它很好用，<b>但特征得你自己想出来</b>。", "pts": ["核方法这类局部表示有好性质（某些情形能证收敛），<span class='w'>但扩不到巨大的状态空间和数据量</span>。", "出路：换一个<b>直接从状态出发、不用显式指定特征</b>的更丰富的函数类。", "<b>这一页是整讲的问题陈述，而它的要害在那个条件句：<em>given the right set of features</em>。</b><span class='k'>线性 VFA 效果可以很好——<b>前提是你猜对了那组基</b></span>。<b>而「猜对」这件事没有任何算法帮你，它完全靠你对问题的理解。</b><span class='w'>L05 p26 那条结论（MC 收敛到最优线性逼近）现在读起来就有了新含义</span>：<b>它保证你能达到「这组特征的上限」，而那个上限是你自己定的。</b><span class='k'>特征选差了，算法再好也没用。</span>", "<b>那句关于核方法的话值得单独读，因为它给出了一条被放弃的路，以及放弃的理由。</b><span class='k'>核方法有「诱人的性质，包括某些情形下的收敛结果」</span>——<b>这指的正是 L05 p43 提到的 averager 那一类：它们的投影是非扩张的，所以安全。</b><span class='w'>但它们 <em>can't typically scale well to enormous spaces and datasets</em></span>。<b>原因很具体：核方法的代价随样本数增长（典型是 <code>O(n²)</code> 到 <code>O(n³)</code>），而深度 RL 动辄几千万个样本。</b><span class='k'>于是这是一笔明确的交易：用「有保证但不可扩展」换「可扩展但没保证」。</span>", "<b>深度网络的卖点用一句话概括：<span class='k'>直接从状态出发，不需要你显式地指定特征</span>。</b><b>它自己学表示。</b><span class='w'>但这句话要加一个很重要的限定：它不是「不需要设计」，而是「设计的层次变了」</span>——<b>你不再设计特征，但你要设计<b>网络结构</b>（几层、什么层、怎么连）。</b><span class='k'>而 p17 的 CNN 四个想法，正是一次针对图像的结构设计</span>。<b>所以「自动学特征」这件事，是把人的先验从特征层面挪到了结构层面，不是消除了它。</b>"], "quote": "Linear VFA often work well <b>given the right set of features</b> &nbsp;·&nbsp; But <b>can require carefully hand designing that feature set</b> &nbsp;·&nbsp; An alternative is to use a much richer function approximation class that is able to <b>directly go from states without requiring an explicit specification of features</b> &nbsp;·&nbsp; <b>Local representations including Kernel based approaches have some appealing properties (including convergence results under certain cases) but can't typically scale well to enormous spaces and datasets</b>", "tbl": {"head": ["", "线性 VFA（L05）", "核方法", "深度网络（本讲）"], "rows": [["特征谁定", "<span class='w'>你手工设计</span>", "<span class='k'>由核隐式给出</span>", "<span class='k'>网络自己学</span>"], ["收敛保证", "<span class='k'>有（L05 p26 p34）</span>", "<span class='k'>某些情形下有</span>", "<span class='w'>基本没有</span>"], ["可扩展性", "好", "<span class='w'>随样本数增长，撑不住</span>", "<span class='k'>好</span>"], ["人的先验在哪", "特征设计", "核的选择", "<b>网络结构设计</b>"], ["上限由谁决定", "<b>你选的那组基</b>", "核函数", "结构 + 数据量"]]}, "res": {"tag": "推断", "v": "<b>这一页那句 <em>given the right set of features</em>，正好描述了你在成本/准确率模型上的处境。</b><br><br><span class='k'>你的成本模型大致是「输入长度、保真度档位 → token 数」的回归；准确率模型是「query 特征、配置 → 正确率」</span>。<b>两者的特征都是你手工挑的——于是你就在这一页说的那个「线性 VFA」的处境里。</b><span class='w'>好消息是 L05 p26 保证你能达到这组特征的上限；坏消息是那个上限由你决定，而且你不知道它在哪</span>。<br><br><b>而这一页给的替代方案（让网络自己学表示）对你<b>不一定划算</b>，理由值得说清楚：</b><br><b>① 你的数据量不在那个量级。</b><span class='k'>深度表示学习要几百万到几千万样本才显出优势</span>，<span class='w'>而你的留出集是几千条 query 乘上有限的配置数</span>。<b>小数据上，手工特征通常赢过学出来的表示。</b><br><b>② 你会失去 L05 那些收敛保证</b>，<span class='w'>而你的 FQE 已经踩在致命三件套上了（L05 p38）</span>——<b>再换成非线性只会让情况更糟。</b><br><br><b>所以这一页对你的实际建议不是「换深度模型」，而是<span class='k'>认真对待特征设计，并把它当成一个可报告的消融维度</span>。</b><span class='w'>具体做法：列出你用的特征，逐个去掉看指标掉多少</span>——<b>这既告诉你哪些特征真的有用，也把「上限由特征决定」这件事变成了可见的证据。</b><span class='k'>p45 的消融表正是这种做法的范本。</span>", "ref": "课件 p8 原文 · L05 p26 p38 p43 · 本讲 p45 · 简报 §4e"}},
{"r": [9, 10], "t": "深度网络：函数的复合", "star": 3, "one": "一层套一层，再用<b>链式法则</b>把梯度传回去。", "eq": "h_n = f_n( h_{n-1} )，一层套一层\n\n∂J/∂w_n = (∂J/∂h_n)·(∂h_n/∂w_n)\n再往下一层继续套 —— 这就是反向传播", "pts": ["<b>线性层</b> <code>h_n = W·h_{n-1}</code> 与<b>非线性激活</b>交替；只要可微就行。", "常见激活：sigmoid、ReLU。", "损失函数：均方误差、对数似然等。", "<b>「函数的复合」是深度网络最本质的描述，而「深」的好处可以用一句话说清：<span class='k'>复合能用更少的参数表达更复杂的函数</span>。</b><b>课件的说法是：相比浅层网络，可能需要<b>指数级更少</b>的节点/参数来表示同一个函数。</b><span class='w'>直觉上：每一层都在前一层的基础上做组合，于是表达能力是乘性增长的，而参数量是加性的</span>。<span class='k'>这就是为什么「深」比「宽」划算。</span>", "<b>「分布式表示」对「局部表示」这一对概念，是理解泛化的关键，值得花点时间。</b><span class='w'>局部表示：每个概念占一个单元（表格就是极端情形——每个状态一个格子）</span>；<span class='k'>分布式表示：一个概念由多个单元的<b>组合</b>表示，而每个单元参与多个概念</span>。<b>后者的好处正是泛化：改一个单元会同时影响很多个概念。</b><span class='w'>而坏处也在这里——改一个单元会同时影响很多个概念</span>，<b>于是学新东西会干扰旧东西（灾难性遗忘）。</b>", "<b>「万能逼近器」这个说法要当心，它比听起来弱，这是一个很常见的误解。</b><span class='k'>万能逼近定理说的是：存在一组权重，使网络能任意好地逼近目标函数</span>。<span class='w'>它<b>没说</b>你能<b>找到</b>那组权重</span>——<b>优化是另一回事，而且目标函数非凸。</b><span class='w'>它也没说需要多少数据</span>。<b>所以「万能逼近」只保证表达力，不保证可学性。</b><span class='k'>这个区分在 L05 p46 那句话里已经出现过：<em>not just whether the algorithm converges, but what solution it converges to</em>。</span>", "<b>再补一个关于「深 vs 宽」的直觉，它能让「指数级更少参数」这句话落地。</b><span class='k'>想象你要表达「这 n 个输入里有奇数个 1」这个函数</span>。<b>用两层网络，需要指数级多的隐藏单元；用 <code>log n</code> 层的树形结构，每层只要线性多个单元。</b><span class='w'>差别来自「能不能复用中间结果」</span>——<b>深层网络的每一层都在复用前一层算出来的东西，而浅层网络必须把一切从头组合。</b><span class='k'>这个「复用中间结果」正是「复合」这个词的实质。</span>", "<b>最后补一条关于「深度网络在 RL 里为什么格外难训」的具体原因，它是三条叠加的。</b><span class='k'>① 监督信号弱：只有一个标量奖励，而且常常稀疏</span>；<span class='k'>② 标签是自己算的：目标来自网络自己的输出，错了会自我强化</span>；<span class='k'>③ 数据分布随策略变：训着训着输入分布就漂了</span>。<b>而图像分类三条一条都没有——标签是人给的、固定的，数据分布也固定。</b><span class='w'>所以「同样大小的网络，RL 要多几十倍的数据」不是实现问题，是问题本身的难度差异。</span>"], "say": "老师说<b>真正的变革是自动微分</b>：她当年学的时候要手推每一层的梯度，「<span class='k'>所以那是一份不太受欢迎的作业</span>」。现在写下网络结构，TensorFlow 替你求导——这才让复杂网络变得人人可用。<br>有人问 ReLU 在 0 处不可微、平的那半边梯度为 0 怎么办。老师答：<b>平的地方梯度就是 0，没问题</b>；但很深的网络确实会有梯度消失，这门课不展开。", "quote": "Deep neural networks: <b>composition of functions</b> &nbsp;·&nbsp; Use distributed representations instead of local representations &nbsp;·&nbsp; Universal function approximator &nbsp;·&nbsp; Can potentially need exponentially less nodes / parameters (compared to a shallow net) to represent the same function"},
{"r": [11, 11], "t": "深度网络换来了什么", "star": 3, "one": "分布式表示 · <b>万能逼近</b> · 参数可能指数级更少 · 能用 SGD 训。", "pts": ["<span class='k'>万能逼近</span>：只要足够多的节点，任何函数都表示得了——<b>上一讲那种「线性类装不下真值」的问题从原理上消失了</b>。", "相比浅网络，表示同一个函数可能只需<b>指数级更少</b>的节点/参数。", "<b>「自动学特征」这件事值得用一个具体的对比来体会它买到了什么。</b><span class='w'>在深度学习之前，计算机视觉的做法是：人手工设计特征（SIFT、HOG 之类），再在上面训一个分类器</span>。<span class='k'>设计那些特征花了整个领域十几年</span>。<b>而卷积网络把特征和分类器一起训，端到端。</b><span class='w'>结果是人手工设计的那些特征被全面超越</span>——<b>但代价是你再也说不清网络学到了什么。</b>", "<b>「层次表示」这一条在 RL 里的含义，比在视觉里更微妙，值得单独说。</b><span class='k'>视觉里的层次很直观：边缘 → 纹理 → 部件 → 物体</span>。<span class='w'>而 RL 里网络要学的是「这个局面值多少」，这个量没有天然的层次结构</span>。<b>所以深度 RL 里那些层主要在做两件事：① 从像素里提取出「游戏里发生了什么」；② 把那个理解映射到价值。</b><span class='k'>第一件事是视觉问题，第二件才是 RL 问题</span>——<b>而 DQN 的成功很大程度上是第一件事被卷积网络解决了。</b>", "<b>端到端训练的代价也该一并记下，它在 RL 里尤其重。</b><span class='w'>端到端意味着你只给一个最终的监督信号（这里是 TD 误差），让它自己反传到所有层</span>。<span class='k'>而 RL 的监督信号本来就稀疏、带噪声、还是自举出来的</span>——<b>用这么弱的信号去训一个深层网络，难度远超监督学习。</b><span class='w'>这正是为什么 DQN 需要几千万帧，而同样规模的图像分类网络几十万张图就够</span>。"], "tip": {"t": "但代价立刻就来", "v": "上一讲的收敛保证全部建立在<b>线性</b>之上。表达力换来了这些保证的消失——p37 起整讲都在对付这件事。"}, "quote": "What do deep neural networks buy us? &nbsp;·&nbsp; <b>Automatically learn features</b> &nbsp;·&nbsp; Hierarchical representations &nbsp;·&nbsp; End-to-end training"},
{"r": [12, 13], "t": "为什么要讲 CNN", "one": "想从像素直接做决策，就该借视觉那边的经验。", "quote": "Why do we care about CNNs? &nbsp;·&nbsp; CNNs are widely used in computer vision &nbsp;·&nbsp; If we want to go from pixels to decisions, likely useful to leverage insights for visual input", "pts": ["<b>这一页给的理由很朴素：既然要从像素做决策，那就该借用视觉领域的经验。</b><span class='k'>而卷积网络是那个领域最成功的结构</span>。<span class='w'>但要注意这个借用有一个前提：你的输入<b>确实</b>有图像那样的结构</span>——<b>局部相关、平移不变。</b><span class='k'>如果你的状态是一堆互不相干的标量特征，卷积完全不适用</span>，<b>那时普通的全连接网络才是对的选择。</b>", "<b><code>kp</code> 把 CNN 的作用概括得很准，值得直接引用：<span class='k'>CNN 不是「更聪明」，它是<b>参数削减</b>装置</span>。</b><b>它没有发明新的表达能力——全连接网络能表达的它都能，反过来不成立（卷积是全连接的特例）。</b><span class='w'>它做的是：利用图像的结构，把参数量砍掉几个数量级</span>，<b>于是同样的数据量能训出更好的模型。</b><span class='k'>这是一次把先验知识编进结构里的典型操作（接 L07 p18 的「额外知识」那条线）。</span>", "<b>还有一个这一页没说、但对你判断「该不该用 CNN」很有用的标准。</b><span class='k'>问三个问题：① 输入的相邻位置相关吗？② 同一个模式出现在不同位置时，意义一样吗？③ 输入的维度是不是大到全连接撑不住？</span><b>三个都是「是」，卷积就合适。</b><span class='w'>图像三条全中；一段时间序列前两条中（所以有一维卷积）；而一张表格的各列既不相邻也不可互换，三条全不中</span>——<b>那时普通的全连接网络（或者干脆是树模型）才是对的。</b>", "<b>这个判断标准值得当成一条通用习惯：<span class='k'>选网络结构，就是在选你愿意假设什么</span>。</b><b>卷积假设局部性和平移不变；循环网络假设时间上的平移不变；图网络假设关系结构已知；而全连接什么都不假设。</b><span class='w'>什么都不假设听起来最安全，但它需要最多的数据</span>——<b>因为所有结构都得从数据里学出来。</b><span class='k'>这又回到了 L07 p18 那条线：用结构和额外知识去换样本效率。</span>", "<b>顺带澄清一个常见的误解：<span class='w'>DQN 的成功不等于「卷积网络会玩游戏」</span>。</b><span class='k'>卷积网络只负责把像素变成一个有用的表示，决策是 Q-learning 做的</span>。<b>两者的分工很清楚：视觉部分解决「画面上发生了什么」，RL 部分解决「所以该按哪个键」。</b><span class='w'>而 p45 的消融会显示：光有好的视觉表示（深度网络那一列）反而不如线性</span>——<b>因为 RL 那一半不稳。</b>"]},
{"r": [14, 16], "t": "全连接网络：参数爆炸", "star": 2, "one": "1000×1000 的图就是 <code>10⁶</code> 个像素，<b>每个隐藏单元就要 10⁶ 个权重</b>。", "pts": ["再并联几百个这样的单元，参数量大到不现实。", "更要命的是：<span class='w'>这么做完全没用上图像本身的结构</span>。", "<b>这个数字值得自己算一遍，因为它让「参数爆炸」从一个形容词变成了一个事实。</b><span class='k'>200 × 200 × 3 = 120000</span>——<b>这是<b>一个</b>神经元连到输入层所需的权重数。</b><span class='w'>一层有一千个这样的神经元，就是一亿两千万个参数，而这还只是第一层</span>。<b>再叠几层，参数量会大到既存不下也训不动。</b>", "<b>但参数多的真正问题不是存储，而是<span class='k'>数据需求</span>——这一点和 L05 p10 完全一致。</b><span class='w'>参数越多，需要的样本越多，否则就过拟合</span>。<b>而深度 RL 的数据本来就贵（每个样本都要真的和环境交互）。</b><span class='k'>所以「削减参数」在 RL 里的价值比在监督学习里更高</span>——<b>省下来的不是显存，是交互次数。</b>", "<b>而全连接网络在这件事上浪费得很明显：<span class='w'>它完全不利用图像的结构</span>。</b><b>它把 120000 个像素当成 120000 个互不相干的数，彼此之间没有任何关系。</b><span class='k'>可图像显然不是这样——相邻的像素高度相关，而且一个物体出现在左上角还是右下角，它还是同一个物体</span>。<b>这两条性质被白白浪费了。</b><span class='w'>下一页的四个想法，正是把这两条性质用起来。</span>", "<b>把这个参数量和 RL 的数据预算放在一起算一次，你会更有体感。</b><span class='k'>一亿两千万个参数，粗略地说你至少需要同一量级的有效样本才不至于严重过拟合</span>。<span class='w'>而 DQN 在 Atari 上用的是几千万帧，远远不够</span>。<b>所以如果真用全连接网络吃原始像素，根本训不出来。</b><span class='k'>CNN 把参数量压到几百万（其中大部分还在最后的全连接层），这才让几千万帧变得够用。</b>", "<b>还有一点值得补：全连接网络不只是参数多，它还<b>学不到</b>该学的东西。</b><span class='w'>因为它把像素当成无序的一堆数，所以「图像平移了几个像素」在它眼里是一个完全不同的输入</span>。<span class='k'>于是它必须为每个可能的位置分别学一遍同一个模式</span>——<b>这不只是浪费参数，是浪费数据。</b><span class='w'>卷积的权重共享正好消除了这一项浪费。</span>", "<b>最后提一句历史，它说明这件事当年有多不显然。</b><span class='k'>卷积网络 1989 年就有了（LeCun 的手写数字识别），但直到 2012 年才大规模成功</span>。<b>缺的不是想法，是数据量和算力。</b><span class='w'>这个时间差提醒你：一个方法「行不行」常常不取决于它本身，而取决于配套条件是否就位</span>——<b>而 RL 领域很多被判过死刑的想法（比如这一讲后面的 vine 采样、L10 的 TRPO）也值得用这个眼光重看。</b>", "<b>还有一个数字对比值得记：<span class='k'>原始 DQN 整个网络约 170 万参数</span>。</b><b>而一个全连接层从 84×84×4 连到 512 个神经元，就是 <code>28224 × 512 ≈ 1445 万</code>——光这一层就是整个 DQN 的八倍多。</b><span class='w'>所以卷积省下来的不是边角料，是数量级</span>。"], "quote": "Fully connected networks: for a 200×200 image with 3 color channels, a single fully connected neuron would have <b>120,000 weights</b> &nbsp;·&nbsp; With many such neurons, parameters blow up"},
{"r": [17, 18], "t": "卷积网络的四个想法", "star": 3, "one": "局部处理 · 权重共享 · 多组滤波器 · 压缩出显著特征。", "pts": ["图像有<b>局部结构和相关性</b>，在空间和频率上都有特征。", "所以<span class='k'>不要全连接</span>：每个单元只看一小块。", "而且<span class='k'>同一组权重在整张图上重复用</span>——参数量骤降。", "<b>这四个想法里，前两个是削减参数的主力，后两个是辅助，值得分清主次。</b><br><b>① 局部连接</b>：<span class='k'>每个神经元只看输入的一小块（比如 5×5），不是全图</span>——<b>参数从 120000 降到 75（5×5×3）。</b><br><b>② 权重共享</b>：<span class='k'>同一个滤波器在整张图上滑动，用同一组权重</span>——<b>于是不管图多大，参数量都是 75。</b><br><span class='w'>两条合起来，参数量从「随图像大小增长」变成了「常数」</span>。", "<b>而这两条各自编进去的先验知识，要能说出来。</b><span class='k'>局部连接编的是「<b>局部相关</b>」——相关的像素挨在一起，远处的像素关系不大</span>；<span class='k'>权重共享编的是「<b>平移不变</b>」——一个边缘出现在哪里，它都是边缘</span>。<b>两条都是关于<b>图像</b>的假设。</b><span class='w'>换个输入类型（比如一行表格数据），这两条都不成立，卷积就不该用</span>。<b>认清这一点，你就不会把 CNN 当成万能的。</b>", "<b>后两个想法的作用不同，各自解决一个具体问题。</b><span class='k'>③ 池化：缩小空间尺寸，于是后面的层参数更少；顺带带来一点平移容忍</span>（<b>目标挪一两个像素，池化之后的输出不变</b>）；<span class='k'>④ 多层：让感受野逐层扩大，于是深层的神经元能「看到」整张图，尽管每一层都只是局部连接</span>。<span class='w'>第 ④ 条解释了为什么局部连接不会限制表达力</span>——<b>堆够了层，全局信息仍然能被整合起来。</b>", "<b>再给这四个想法排一下「如果只能留一个」的优先级，这能帮你理解它们的分量。</b><span class='k'>权重共享最重要——它让参数量与图像大小彻底脱钩，而且自带数据增强效果</span>；<span class='k'>局部连接次之——它是权重共享能成立的前提（全局滤波器没法共享）</span>；<span class='w'>多层是必需的但不是 CNN 特有的（任何深度网络都要）</span>；<span class='w'>池化最可有可无——今天很多网络用「步长大于 1 的卷积」代替它</span>。<b>所以 CNN 的核心其实只有前两条。</b>", "<b>再把这四个想法和「归纳偏置」这个词对上，它是今天更常用的说法。</b><span class='k'>归纳偏置 = 你在数据之外强加给模型的假设</span>。<b>卷积的归纳偏置是「局部性 + 平移不变」，循环网络是「时间上的平移不变」，而 Transformer 几乎没有归纳偏置（所以它需要极大的数据量）。</b><span class='w'>偏置越强，需要的数据越少，但错了代价也越大</span>——<b>这正是 L07 p18 那条「用结构换样本效率」在网络结构上的体现。</b>"], "quote": "Four key ideas behind CNNs: <b>Local connectivity</b> &nbsp;·&nbsp; <b>Parameter sharing</b> &nbsp;·&nbsp; <b>Pooling / subsampling hidden units</b> &nbsp;·&nbsp; <b>Use many layers</b>", "tbl": {"head": ["想法", "做什么", "编进去的先验", "买到什么"], "rows": [["① 局部连接", "每个神经元只看一小块", "<span class='k'>局部相关</span>", "<b>参数从 120000 降到几十</b>"], ["② 权重共享", "同一组权重滑遍全图", "<span class='k'>平移不变</span>", "<b>参数量与图像大小无关</b>"], ["③ 池化", "缩小空间尺寸", "小位移不改变语义", "后续层更省；一点平移容忍"], ["④ 多层", "堆叠", "特征是分层组合的", "<span class='k'>感受野逐层扩大，仍能整合全局</span>"]]}},
{"r": [19, 22], "t": "感受野、步长、权重共享", "star": 3, "one": "5×5 的窗口在 28×28 的图上滑，得到 24×24 的隐藏层，<b>只用 25 个权重</b>。", "eq": "输入 28×28，感受野 5×5，步长 1\n  ⇒ 隐藏层 24×24 = 576 个单元\n  ⇒ 但所有单元共用同一组 25 个权重 + 1 个偏置\n\n单元的激活值：g( b + Σ_i w_i·x_i )，i 只跑遍感受野内的像素", "pts": ["<b>零填充</b>决定在边缘补几个 0，从而决定输出尺寸。", "对比一下：全连接要 <code>10⁶</code> 个权重，<span class='k'>这里 25 个</span>。", "<b>这三个概念合起来描述了「一个滤波器怎么扫过一张图」，而它们各自控制一个维度。</b><span class='k'>感受野（滤波器大小）控制「一次看多宽」；步长控制「每次挪多远」；权重共享保证「挪到哪里用的都是同一组参数」</span>。<b>输出的大小由前两个决定：大致是 <code>(输入 − 感受野)/步长 + 1</code>。</b><span class='w'>步长大于 1 会让输出变小，这是除池化之外另一种降采样方式</span>。", "<b>「感受野」这个词有两个层次的含义，混了会很困惑，值得分开。</b><span class='k'>① 单层感受野：这一层的神经元直接连到的那一小块（就是滤波器大小）</span>；<span class='k'>② <b>有效</b>感受野：这个神经元最终受输入图上多大一块影响</span>——<b>它随层数累积增长。</b><span class='w'>比如两层 3×3 的卷积叠起来，第二层的一个神经元的有效感受野是 5×5</span>。<b>深度网络靠的正是这个累积，用很小的滤波器达到很大的视野。</b>", "<b>权重共享还有一个常被忽略的好处，而它在数据少时尤其重要。</b><span class='w'>同一组权重在图上每个位置都被用到，于是它收到的梯度是所有位置的梯度之和</span>——<b>相当于一张图提供了几百上千个训练样本给同一组参数。</b><span class='k'>这是「数据增强」的一种内生形式</span>，<b>而它正是卷积网络在小数据上也能训得动的主要原因。</b>", "<b>把输出尺寸的公式写全，实现时会反复用到，而且它解释了几个常见的超参。</b><span class='k'>输出边长 = <code>(输入 − 感受野 + 2×填充)/步长 + 1</code></span>。<b>那个「填充」（padding）是在图像边缘补零，作用有两个</b>：<span class='w'>① 让输出尺寸不至于每层都缩小；② 让边缘的像素也能被滤波器中心扫到（否则边缘信息会被系统性地低估）</span>。<span class='k'>常见的取法是 <code>padding = (感受野−1)/2</code>，配步长 1，这样输出和输入一样大。</span>", "<b>步长这个参数在 DQN 里被用得很重，值得单独说它的取舍。</b><span class='k'>步长大，输出小，计算省，但空间分辨率损失快</span>；<span class='w'>步长 1 保留全部分辨率，但计算量大</span>。<b>原始 DQN 的三层卷积用的步长是 4、2、1</b>——<span class='k'>第一层步长 4 把 84×84 迅速压到 20×20，后面逐步放慢</span>。<b>这个「先快后慢」的模式是 CNN 的常见设计：早期层用大步长快速降维，深层保留细节。</b>", "<b>最后回到权重共享，补一个它的局限，免得你把它当成无条件正确。</b><span class='w'>权重共享假设「同一个模式在哪里都一样」</span>，<span class='k'>但有些任务里位置本身有意义</span>——<b>比如围棋的角和边性质完全不同，而 Atari 里的分数栏永远在屏幕顶部。</b><span class='w'>这时严格的平移不变反而是个错误的假设</span>。<b>常见的补救是额外输入一个「坐标通道」，把位置信息显式地喂进去。</b>", "<b>把这三个概念和「有效感受野」连起来，就能回答一个实际问题：该堆多少层。</b><span class='k'>要让最后一层的神经元能「看到」整张 84×84 的图，有效感受野就得接近 84</span>。<b>而步长会让感受野以乘性增长——步长 4 之后，每一层的感受野在原图上的跨度就放大了 4 倍。</b><span class='w'>所以 DQN 只用三层卷积就覆盖了整张图</span>，<b>而如果全用步长 1，要堆几十层才行。</b><span class='k'>步长的第二个作用在这里：它不只是省计算，它是在快速扩大视野。</span>"], "quote": "<b>Receptive field</b>: the region of input that a neuron looks at &nbsp;·&nbsp; <b>Stride</b>: how far the filter moves each step &nbsp;·&nbsp; <b>Weight sharing</b>: the same filter weights are used at every position", "tbl": {"head": ["参数", "控制什么", "调大的后果", "DQN 里取什么"], "rows": [["感受野（滤波器大小）", "一次看多宽", "<span class='w'>参数变多，但视野扩得快</span>", "8 → 4 → 3"], ["步长", "每次挪多远", "<span class='k'>输出小、算得快、视野扩得快</span>；<span class='w'>分辨率损失快</span>", "4 → 2 → 1"], ["填充", "边缘补零", "输出不缩小；边缘像素也被扫到", "—"], ["层数", "有效感受野累积", "<span class='k'>视野更大、表达更强</span>；<span class='w'>更难训</span>", "<b>3 层卷积 + 2 层全连接</b>"]]}},
{"r": [23, 25], "t": "特征图与多组滤波器", "star": 3, "one": "一组共享权重 = <b>一个特征检测器</b>，在整张图上到处找同一种模式。", "pts": ["<b>为什么合理</b>：如果这组权重学会了在某个小块里认出「竖直边缘」，那这个本事在图像别处<span class='k'>同样有用</span>。", "由此得到<b>平移不变性</b>——灵感来自视觉系统。", "用多组滤波器，就能同时找横边、竖边、各种别的模式。", "<b>「一个滤波器产出一张特征图」这个对应关系要牢牢记住，它决定了张量的形状。</b><span class='k'>一个滤波器扫过全图，每个位置输出一个数，拼起来就是一张二维的特征图</span>；<b>用 <code>k</code> 个滤波器，就得到 <code>k</code> 张特征图，堆起来就是深度为 <code>k</code> 的三维张量。</b><span class='w'>而下一层的滤波器要同时看这 <code>k</code> 张图</span>——<b>所以它的形状是 <code>5×5×k</code> 而不是 <code>5×5</code>。</b><span class='k'>这是实现时最容易搞错的地方。</span>", "<b>为什么要用「很多个」滤波器，理由很直接：<span class='k'>一个滤波器只能检测一种模式</span>。</b><b>一个只认竖边，另一个只认横边，再一个认某种颜色过渡。</b><span class='w'>要认出复杂的东西，你需要先把各种基本模式都检测出来，再在后面的层里组合</span>。<b>所以滤波器的数量，大致对应「这一层能识别多少种基本模式」。</b><span class='k'>而深度（层数）对应「组合几次」。</span>", "<b>把参数量重新算一遍，你会看到卷积到底省了多少。</b><span class='k'>一个 <code>5×5×3</code> 的滤波器有 75 个权重（加 1 个偏置）；32 个这样的滤波器是 2432 个参数</span>。<b>而一个全连接层从 200×200×3 连到 32 个神经元，是 <code>120000 × 32 ≈ 384 万</code>。</b><span class='w'>差了一千五百倍</span>，<b>而输出的信息量（32 张特征图 vs 32 个数）卷积那边还多得多。</b>", "<b>把一个典型的 CNN 里张量形状的变化走一遍，这比记概念有用得多。</b><span class='k'>输入 <code>84×84×4</code>（四帧灰度）→ 第一层 32 个 <code>8×8</code> 滤波器、步长 4 → <code>20×20×32</code></span><span class='k'>→ 第二层 64 个 <code>4×4</code>、步长 2 → <code>9×9×64</code></span><span class='k'>→ 第三层 64 个 <code>3×3</code>、步长 1 → <code>7×7×64</code></span><span class='k'>→ 展平成 3136 维 → 全连接 512 → 全连接 18（动作数）</span>。<b>这就是原始 DQN 的完整结构。</b>", "<b>从这个形状序列里能读出两件事，而它们是 CNN 设计的通用模式。</b><span class='w'>① <b>空间尺寸递减，深度递增</b>——84→20→9→7，而通道 4→32→64→64</span>。<b>直觉是：越往深，「在哪里」越不重要，「是什么」越重要。</b><span class='w'>② <b>参数集中在最后的全连接层</b>——<code>3136 × 512 ≈ 160 万</code>，而三层卷积加起来才几万</span>。<span class='k'>所以「卷积省参数」省的是前面那几层，而瓶颈往往在后面的全连接。</span>", "<b>最后提一个实现上容易出错的细节，和特征图的语义有关。</b><span class='w'>特征图的每个位置对应原图的一个区域，但由于步长和填充，这个对应关系不是简单的缩放</span>。<span class='k'>如果你想做可视化（看网络在关注哪里），必须把感受野精确地反推回去</span>，<b>而不能按比例缩放。</b><span class='w'>这在调试「网络到底学到了什么」时很要紧。</span>", "<b>最后提一个这一页之外、但紧接着就有用的概念：<span class='k'>这些特征图就是 L05 说的那个 <code>x(s)</code></span>。</b><b>只不过它不是你手工设计的，是网络学出来的。</b><span class='w'>最后一层全连接之前的那 512 维向量，就是「这个状态的特征表示」</span>，<b>而最后那一层在它上面做的正是线性组合——也就是 L05 的线性 VFA。</b><span class='k'>所以深度网络可以被理解成「学特征的那部分 + 线性 VFA」两段</span>，<b>而 L05 全部的理论都只作用在后一段上。</b>"], "say": "老师提到：深度学习之前，计算机视觉花了大量力气<b>手工设计</b>这类特征（如 SIFT），目标正是这种平移不变性。CNN 把它变成了学出来的。", "quote": "Each filter produces a <b>feature map</b> &nbsp;·&nbsp; Use <b>many filters</b> in each layer to detect different patterns &nbsp;·&nbsp; The output has depth = number of filters"},
{"r": [26, 27], "t": "池化层与最后的全连接层", "star": 2, "one": "池化压缩信息；最后一层通常全连接，把特征变成标量输出。", "pts": ["池化常紧跟在卷积层之后，做下采样（如 max pooling）。", "<span class='k'>整个前半部分可以看成「在算一套新的特征表示」</span>，最后那层全连接就是在这套特征上做线性回归——<b>正好接回上一讲</b>。", "在 RL 里：输入是一张图，输出要是一个标量 Q 值，中间必须一路降维。", "<b>池化的作用可以分成两半，而第二半常被夸大，值得说准。</b><span class='k'>第一半（实在的）：缩小空间尺寸，于是后面的层参数更少、计算更快</span>。<span class='w'>第二半（有限的）：带来一点平移容忍——目标挪一两个像素，max pooling 的输出可能不变</span>。<b>但这个容忍度很小，只有一两个像素级别。</b><span class='k'>真正的平移不变主要来自权重共享，不是池化。</span>", "<b>最后那几层全连接的作用，和前面的卷积层完全不同，这个分工要看清。</b><span class='k'>卷积层在做「这张图里有什么」——它输出的是一堆局部特征的空间分布</span>；<span class='k'>全连接层在做「所以答案是什么」——它把那些特征整合成最终的输出</span>。<b>在 DQN 里，最终输出是每个动作的 Q 值。</b><span class='w'>而全连接层的参数量往往占整个网络的大头</span>——<b>因为它要连到所有特征图的所有位置。</b>", "<b>这一节到此为止，值得用一句话收尾：<span class='k'>CNN 的全部内容是「用结构上的假设换参数量」</span>。</b><b>假设是局部相关 + 平移不变，换来的是参数量与图像大小脱钩。</b><span class='w'>而这正是 L07 p18 那条「用结构和额外知识去约束」的一个实例</span>——<b>只不过这里约束的是函数类，而不是策略类。</b><span class='k'>接下来的 p28 开始，就要把这个函数类塞进 Q-learning 里了。</span>", "<b>max pooling 和 average pooling 的差别，在 RL 里比在分类里更要紧，值得说一句。</b><span class='k'>max pooling 保留「这一块里最强的响应」，average 保留「平均响应」</span>。<b>前者更适合「检测某个东西在不在」，后者更适合「估计总量」。</b><span class='w'>而 Atari 里你通常关心「球在哪」「敌人在不在」这类存在性问题</span>，<b>所以 max 更合适。</b><span class='k'>不过原始 DQN 其实<b>没有</b>用池化层——它靠步长大于 1 的卷积来降维</span>。<b>原因可能正是池化的平移容忍在这里是有害的：球的精确位置很重要。</b>", "<b>这一节收尾时，值得把 CNN 和这门课的主线接一次。</b><span class='k'>L05 问「值函数怎么表示」，答案是「在特征上做线性组合」，但把「特征从哪来」留空了</span>；<span class='w'>这一节填上了那个空：用卷积网络从像素里自动学</span>。<b>而代价是 L05 那些收敛结论全部作废。</b><span class='k'>所以接下来两节要做的，就是用工程手段把稳定性补回来</span>——<b>这是一次典型的「先失去保证，再想办法」。</b>", "<b>再补一条实践上的观察，它解释了为什么这一段的细节值得记。</b><span class='w'>深度 RL 的论文里，网络结构常常被一笔带过（「我们用了标准的 DQN 结构」）</span>，<span class='k'>但复现失败的原因里，结构细节（步长、填充、激活函数的位置）占了相当一部分</span>。<b>而这些细节在原论文里往往只写在附录甚至代码里。</b><span class='w'>所以读这类论文时，结构图要和代码对着看。</span>"], "quote": "<b>Pooling layers</b> reduce spatial size &nbsp;·&nbsp; Max pooling is common &nbsp;·&nbsp; <b>Final fully connected layers</b> map the learned features to outputs", "tbl": {"head": ["层", "作用", "参数量", "DQN 里用了吗"], "rows": [["卷积层", "<span class='k'>提取局部模式</span>", "<b>少（权重共享）</b>", "<span class='k'>3 层</span>"], ["池化层", "缩小尺寸 + 一点平移容忍", "0", "<span class='w'>没用——靠步长>1 的卷积降维</span>"], ["全连接层", "<span class='k'>把特征整合成输出</span>", "<span class='w'>多（占全网大头）</span>", "<span class='k'>2 层</span>"], ["<b>输出</b>", "每个动作一个 Q 值", "—", "<b>18 维（Atari 手柄位置数）</b>"]]}},
{"r": [28, 30], "t": "深度强化学习", "one": "用深度网络去表示值函数 / 策略 / 模型，再用 SGD 优化损失。", "pts": ["这一讲只做<b>值函数</b>；策略那条线下周讲。", "<b>到这里铺垫结束，正主登场，而登场的方式值得注意：<span class='k'>它只是把 L05 的 <code>Q̂(s,a;w)</code> 里那个 <code>w</code> 换成了一个神经网络</span>。</b><b>算法框架一点没变——还是 Q-learning，还是 TD 目标，还是梯度下降。</b><span class='w'>变的只有函数类</span>。<b>而这一换会引爆两个在线性情形下不存在（或不严重）的问题，那就是 p37 的内容。</b>", "<b>「Atari 上的成功引发了巨大兴奋」这句话背后有一个具体的里程碑，值得记住它为什么重要。</b><span class='k'>Mnih et al. 2015 用<b>同一套</b>网络结构和<b>同一组</b>超参数，在几十个 Atari 游戏上达到或超过人类水平</span>——<b>输入全是原始像素，没有任何针对单个游戏的手工特征。</b><span class='w'>此前的做法是每个游戏单独设计特征</span>。<b>所以它证明的不是「RL 能玩游戏」，而是「同一个算法能在很多任务上从像素学起」。</b>", "<b>「深度强化学习」这个词在这里第一次正式出现，而它的定义比听起来窄，值得说准。</b><span class='k'>它指的是「用深度网络做函数逼近的 RL」</span>——<b>逼近的对象可以是值函数（这一讲）、策略（第八讲）、或者模型。</b><span class='w'>它<b>不是</b>一类新算法，而是「把前面学过的算法里那个函数换成网络」</span>。<b>所以你前五讲学的每一个算法，都有一个「深度版本」。</b>", "<b>而「深度版本」共享同一组困难，这组困难正是这一讲剩下部分的全部内容。</b><span class='k'>① 非凸优化，没有收敛保证；② 数据需求大，而 RL 的数据贵；③ L05 的三件套风险（函数逼近 + 自举 + off-policy）</span>。<b>而 DQN 给出的答案是：用两个工程补丁把实践中的稳定性补回来。</b><span class='w'>这套路子后来被反复复用——第八讲的策略梯度配上 TRPO/PPO 的信赖域，是同一个思路的另一个版本。</span>", "<b>最后提一句这个词的流行程度和它的代价。</b><span class='w'>Atari 的成功让「深度 RL」成了一个极热的方向，但也带来了一个方法论问题</span>——<span class='k'>这个领域的结果极难复现，因为种子间方差大、超参敏感、而且很多论文没有报告足够的细节</span>。<b>p64 那几条实操建议（跑两个种子、先在 Pong 上体检）正是对这件事的回应。</b>"], "quote": "<b>Deep RL</b> &nbsp;·&nbsp; Success in Atari has led to huge excitement in using deep neural networks to do value function approximation in RL"},
{"r": [31, 33], "t": "DQN：用网络表示 Q", "star": 3, "one": "<code>Q̂(s,a; w) ≈ Q(s,a)</code>，更新式和第五讲的 Q-learning 一模一样。", "eq": "Δw = α·( r + γ·max_a Q̂(s_{t+1}, a; w) − Q̂(s_t, a_t; w) )·∇_w Q̂(s_t, a_t; w)", "pts": ["<span class='w'>注意右边所有的 w 都是同一组</span>——当前值、未来值的估计、梯度，全用它。", "p40 要动的就是这一点。", "<b>这一页把问题和风险并排摆了出来，而那句 <em>But Q-learning with VFA can diverge</em> 正是 L05 p38 的结论。</b><span class='k'>所以课件自己知道这是个危险的组合</span>——<b>它不是在无知地往前冲，而是在明知有风险的情况下用工程手段去压住它。</b><span class='w'>这个态度值得学：知道理论说什么，然后在明确的代价下偏离它</span>。", "<b>网络的输出形状有一个很实用的设计选择，值得单独说。</b><span class='k'>DQN 的网络是「输入状态，输出 <code>|A|</code> 个 Q 值」，而不是「输入 (状态, 动作)，输出一个 Q 值」</span>。<b>好处是：一次前向传播就拿到所有动作的 Q，于是 <code>max_a</code> 和 <code>arg max_a</code> 都是免费的。</b><span class='w'>如果用后一种设计，每次取 max 都要做 <code>|A|</code> 次前向传播</span>——<b>而 Q-learning 的每次更新都要取一次 max，代价会翻 <code>|A|</code> 倍。</b><span class='k'>这个小设计对训练速度影响很大。</span>", "<b>损失函数这里也有一处要小心，它是实现 DQN 最经典的坑。</b><span class='w'>损失是 <code>(目标 − Q̂(s,a;w))²</code>，而目标里也含 <code>Q̂(s′,a′;w)</code></span>——<span class='k'>求梯度时<b>不能</b>让梯度流过目标那一项</span>。<b>必须把目标当成常数（detach）。</b><span class='w'>这就是 L05 p29 说的「半梯度」：你只对预测那一半求导，不对目标那一半求导</span>。<b>忘了 detach 的话，你算的是另一个目标函数（残差梯度），行为完全不同。</b>", "<b>把 DQN 的损失写全，便于对照实现：</b><code>L(w) = E_{(s,a,r,s′)∼D}[ (r + γ max_{a′} Q̂(s′,a′;w⁻) − Q̂(s,a;w))² ]</code>。<span class='k'>四个要素：期望对回放池取、目标用冻结的 <code>w⁻</code>、预测用当前的 <code>w</code>、平方误差</span>。<b>这一页还没引入 <code>w⁻</code>，所以目标里写的是 <code>w</code>——两个补丁要到 p38 和 p40 才加上。</b>", "<b>还有一个常被忽略的细节：损失只对<b>实际执行过的那个动作</b> <code>a</code> 计算。</b><span class='k'>网络输出 18 个 Q 值，但这一条样本只告诉你其中一个动作的信息</span>——<b>所以反向传播时，另外 17 个输出的梯度是 0。</b><span class='w'>实现上通常用一个 one-hot 掩码把它们屏蔽掉</span>。<b>忘了屏蔽的话，网络会被推着把所有动作的 Q 都拉向同一个目标，完全学错。</b>", "<b>最后把这一页和 L05 的结论对一次，确认风险在哪。</b><span class='k'>L05 p45 的那张收敛表说：线性 VFA 下 Q-learning <b>可能发散</b>，非线性下基本没有保证</span>。<b>而 DQN 用的是非线性（深度网络）。</b><span class='w'>所以从理论上讲，这一页的算法连「可能收敛」都谈不上</span>——<b>它能跑起来完全是靠接下来两个补丁。</b><span class='k'>这个处境值得记牢：它是「实践跑在理论前面」的一个标准案例。</span>"], "say": "老师提醒：Atari 的<b>动作空间其实很小</b>，离散、大约 4 到 18 个；大的是状态空间（像素）。", "quote": "<b>DQN: use a deep neural network to represent Q</b> &nbsp;·&nbsp; Q̂(s,a;w) ≈ Q(s,a) &nbsp;·&nbsp; <b>Minimize MSE loss by stochastic gradient descent</b> &nbsp;·&nbsp; Converges to the optimal Q*(s,a) using table lookup representation &nbsp;·&nbsp; <b>But Q-learning with VFA can diverge</b>"},
{"r": [34, 36], "t": "Atari 上的 DQN", "star": 3, "one": "端到端：<b>从像素直接学出 Q(s,a)</b>。", "eq": "状态 s：最近 4 帧原始像素堆叠\n输出：18 个摇杆/按键位各自的 Q(s,a)\n奖励：该步的得分变化\n网络结构与超参数：50 个游戏全部相同", "pts": ["<b>为什么要 4 帧</b>：单帧看不出速度，而很多游戏必须知道球往哪飞。", "<span class='w'>4 帧也未必够</span>——蒙特祖玛的复仇那类要记住「钥匙已经拿到」的游戏就不行。", "论文的真正卖点：<span class='k'>同一套结构和超参数跑通 50 个游戏</span>，而不是每个游戏各调一套。", "<b>「最近四帧叠起来」这个设计是为了恢复马尔可夫性，而 <code>kp</code> 提醒了它的局限，值得展开。</b><span class='k'>单帧看不出速度和方向——球在往上飞还是往下掉，一张静止的图分不出来</span>。<b>叠四帧就能看出位移，于是速度信息有了。</b><span class='w'>这正是 L02 p6 说的「问题看起来不马尔可夫时，先改状态而不是换算法」</span>。", "<b>但 <code>kp</code> 说得很准：<span class='w'>「最近四帧」是一个<b>会失效</b>的充分统计量</span>。</b><b>它对「速度」够用，对「更长的历史」不够。</b><span class='k'>比如蒙特祖玛的复仇：你有没有拿到钥匙，决定了门能不能开，而那件事可能发生在几百帧之前</span>——<b>四帧窗口里根本看不到。</b><span class='w'>于是那类游戏的状态在 DQN 的表示下不马尔可夫</span>，<b>而这正是 L07 p19 说 DQN 在蒙特祖玛上只走通两个房间的原因之一。</b>", "<b>奖励定义成「这一步分数的变化」，这个选择也值得注意，它带来一个常见的后处理。</b><span class='k'>不同游戏的分数尺度差几个数量级（有的几十分，有的几万分）</span>，<b>而超参数要在所有游戏上通用。</b><span class='w'>于是原论文把奖励<b>裁剪</b>到 <code>{−1, 0, +1}</code></span>——<b>只保留符号，丢掉幅度。</b><span class='k'>这让学习稳定了，但也丢掉了「这一步得了多少分」的信息</span>，<b>于是算法分不清「小胜」和「大胜」。</b><span class='w'>这是一个为了通用性而牺牲最优性的典型取舍。</span>", "<b>「所有游戏用同一套结构和超参」这一条，是这项工作最重要的方法论贡献，值得单独强调。</b><span class='w'>如果允许每个游戏单独调参，结果就没有说服力</span>——<b>你不知道是算法好还是调参好。</b><span class='k'>固定超参之后，剩下的差异才真的来自算法</span>。<b>这个标准今天仍然是深度 RL 实验的基本要求</b>，<span class='w'>而违反它（在每个任务上单独调）是这个领域最常见的方法论问题。</span>", "<b>再补一个这一页没写、但对理解 DQN 规模很有用的数字。</b><span class='k'>原论文的回放池容量是一百万条转移，训练总帧数约五千万</span>——<b>也就是说池子里装的是「最近百分之二」的经验。</b><span class='w'>池子太小会退化回在线学习（相关性回来了）；太大则装着很多早期烂策略的数据</span>。<b>而「一百万」这个数在后来的工作里被反复调整，说明它并不是一个有理论依据的值。</b>", "<b>预处理那一步也值得提，因为它丢掉的东西比你以为的多。</b><span class='k'>原始画面是 210×160 的彩色，被转成 84×84 灰度</span>——<b>分辨率降了约六倍，颜色信息全丢。</b><span class='w'>而有些 Atari 游戏里颜色是关键信息（比如区分敌我）</span>，<b>于是那些游戏的表现天然受限。</b><span class='k'>这是「为了通用性牺牲单个任务表现」的又一例</span>——<b>和奖励裁剪是同一类取舍。</b>"], "say": "老师强调：每个游戏仍然<b>各自从零学一份 Q 和策略</b>，共用的是结构和超参数，不是学到的权重。", "quote": "DQN on Atari &nbsp;·&nbsp; Input: <b>stack of 4 most recent frames</b>, preprocessed to 84×84 grayscale &nbsp;·&nbsp; Output: Q value for each of the <b>18 joystick/button positions</b> &nbsp;·&nbsp; Reward is <b>change in score</b> for that step &nbsp;·&nbsp; Network architecture and hyperparameters <b>fixed across all games</b>"},
{"r": [37, 37], "t": "两个会把它搞崩的问题", "star": 3, "one": "<b>样本之间高度相关</b>；<b>目标一直在动</b>。", "pts": ["<b>相关性</b>：<code>(s,a,r,s′)</code> 和紧接着的那条几乎不独立——确定性系统里只差一个 r。<span class='w'>这不是 i.i.d. 数据</span>。", "<b>非平稳目标</b>：监督学习里 y 是固定的；这里 y 由你自己当前的 Q 算出来，你一改权重它就变。", "DQN 的两招正是各治一个：<span class='k'>经验回放</span>治相关性，<span class='k'>固定 Q 目标</span>治非平稳。", "<b>这两个病理要分开理解，因为它们破坏的是监督学习的两个<b>不同</b>前提。</b><br><b>病理一：样本相关</b>——<span class='k'>破坏的是「样本独立同分布」</span>。<b>连着的几步状态几乎一样，于是梯度方向高度重复，相当于用同一个样本更新了很多次。</b><br><b>病理二：目标在动</b>——<span class='w'>破坏的是「标签固定」</span>。<b>目标 <code>r + γ max_a Q̂(s′,a;w)</code> 里含着你正在改的 <code>w</code>，你一更新，目标就跟着变。</b>", "<b>把这两条放进「监督学习的两个前提」这个框架里，整件事就清楚了。</b><span class='k'>监督学习要求：① 样本 i.i.d.；② 标签固定</span>。<b>而在线 RL 两条都不满足。</b><span class='w'>于是 DQN 的两个补丁，恰好各修一条</span>：<b>经验回放修①（随机抽样打散相关性），固定目标修②（把标签冻住一段时间）。</b><span class='k'>这个一一对应非常整齐，记住它就记住了 DQN 的全部设计思想。</span>", "<b>但要注意这两个补丁<span class='w'>都没有</span>修 L05 三件套里的第三条——off-policy。</b><span class='k'>DQN 仍然是 off-policy 的（它用 <code>max</code> 自举，行为策略是 ε-贪婪）</span>。<b>所以按 L05 p38 的说法，三件套仍然齐全，发散的风险原则上还在。</b><span class='w'>两个补丁做的是「让它实践上不发散」，不是「让它理论上安全」</span>。<b>这就是 <code>kp</code> 那句「两个补丁各治三要素的哪一条——以及哪一条没治」的意思。</b><span class='k'>认清这一点，你就知道 DQN 的稳定性是工程成果而不是理论成果。</span>"], "quote": "<b>Two of the issues causing problems</b>: &nbsp;·&nbsp; <b>Correlations between samples</b> &nbsp;·&nbsp; <b>Non-stationary targets</b> &nbsp;|&nbsp; Deep Q-learning (DQN) addresses both of these challenges by: <b>Experience replay</b> &nbsp;·&nbsp; <b>Fixed Q-targets</b>", "tbl": {"head": ["病理", "破坏了什么前提", "补丁", "三件套里修了哪条"], "rows": [["样本相关", "<span class='w'>样本 i.i.d.</span>", "<b>经验回放</b>", "<span class='k'>间接缓解（不直接对应）</span>"], ["目标在动", "<span class='w'>标签固定</span>", "<b>固定 Q 目标</b>", "<span class='k'>缓解「自举」那一条的危害</span>"], ["<b>off-policy</b>", "—", "<span class='w'>没有补丁</span>", "<span class='w'>没修——三件套仍然齐全</span>"]]}},
{"r": [38, 39], "t": "经验回放", "star": 3, "one": "把走过的 tuple 存进一个<b>回放缓冲区</b>，以后反复抽出来重训。", "eq": "缓冲区 D 里存着 (s₁,a₁,r₁,s₂), (s₂,a₂,r₂,s₃), …\n\n重复：\n  (s,a,r,s′) ~ D            从缓冲区随机抽一条\n  目标 = r + γ·max_{a′} Q̂(s′,a′; w)\n  Δw = α·( 目标 − Q̂(s,a; w) )·∇_w Q̂(s,a; w)", "pts": ["朴素 TD/Q-learning <b>一条数据用一次就扔</b>——省内存，但极浪费。", "<span class='k'>同一条 tuple 每次被重放，目标值都不一样</span>，因为 Q 已经变了。", "<b>经验回放做的事，用一句话概括最准：<span class='k'>把在线数据变回一个数据集</span>。</b><b>在线 RL 的数据是一条流——来了就用，用完就扔，而且前后高度相关。</b><span class='w'>回放池把它变成了一个池子：你从里面随机抽样，就像在做普通的监督学习</span>。<b>于是「监督学习那一整套」又能用了。</b><span class='k'>这是一个把陌生问题归约到熟悉问题的典型操作。</span>", "<b>而它买到的好处其实有两样，而课件标题只说了第一样，第二样要到 p45 才被问出来。</b><b>① 打散相关性</b>（<span class='k'>标题说的</span>）：随机抽样让一个批次里的样本来自不同时间段。<br><b>② 数据复用</b>（<span class='w'>更重要</span>）：<span class='k'>同一条转移可以被抽中很多次，于是每个样本被反复利用</span>。<b>在线学习里一条数据用一次就扔了，而回放池里它可能被用上几十次。</b><span class='w'>p45 的消融结果会显示：回放的作用大得多，而第②条正是主要原因。</span>", "<b>回放池之所以能成立，有一个前提，而这个前提回到了 L04 的一个结论。</b><span class='k'>Q-learning 的更新只需要 <code>(s,a,r,s′)</code> 四元组，那个 <code>max</code> 不需要采样</span>（<b>L04 p37</b>）。<b>所以池子里的数据无论是什么时候、用什么策略采的，都能用。</b><span class='w'>而 SARSA 做不到——它需要「实际采出的 <code>a′</code>」，而那个动作是由当时的策略决定的</span>。<b>于是「off-policy」这个性质，在这里第一次变成了一个实实在在的工程优势。</b>", "<b>课件最后那句提醒，正是下一页的引子，值得读准。</b><span class='k'>你可以把目标当成一个标量（detach 掉）</span>，<span class='w'>但下一轮权重更新之后，这个目标值就变了</span>。<b>也就是说：回放解决了「样本相关」，但没解决「目标在动」。</b><span class='k'>两个病理需要两个补丁，这一页只解决了一个。</span>"], "say": "有人问缓冲区满了怎么换。老师答：<b>常见做法是留最近的，比如最近一百万条</b>，但换谁出去是个有意思的开放问题，还取决于环境有多非平稳。<br>还有人问「回放和多存几帧是不是一回事」——<b>不是</b>：多存帧是改状态表示，回放是把旧数据再用一遍。", "quote": "To help remove correlations, <b>store dataset (called a replay buffer) D from prior experience</b> &nbsp;·&nbsp; To perform experience replay, repeat: &nbsp;·&nbsp; <b>(s,a,r,s′) ∼ D</b>: sample an experience tuple from the dataset &nbsp;·&nbsp; Compute the target: r + γ max_{a′} Q̂(s′,a′;w) &nbsp;·&nbsp; Use SGD to update the network weights &nbsp;|&nbsp; <b>Can treat the target as a scalar, but the weights will get updated on the next round, changing the target value</b>"},
{"r": [40, 40], "t": "固定 Q 目标", "star": 3, "one": "算目标时用<b>另一组、较旧的权重</b> <code>w⁻</code>，隔一阵才同步一次。", "eq": "目标 = r + γ·max_{a′} Q̂(s′, a′; w⁻)     ← 用旧权重\nΔw  = α·( 目标 − Q̂(s,a; w) )·∇_w Q̂(s,a; w)   ← 更新新权重", "pts": ["<b>为什么有用</b>：监督学习里 y 不动才好拟合。固定 <code>w⁻</code> 就是把 y 暂时钉住。", "<span class='w'>代价</span>：信息往回传得更慢——你在用一组过时的权重评估未来。", "<code>w⁻</code> 每隔 n 步同步成 <code>w</code>。<b>n=1 就退回普通 TD，n=∞ 就永不更新</b>，中间是一条连续的取舍。", "<b>固定 Q 目标做的事同样可以用一句话概括：<span class='k'>把非平稳回归变回平稳回归</span>。</b><b>原来你在追一个会动的靶子——每次更新 <code>w</code>，目标也跟着变。</b><span class='w'>把目标用的权重冻成 <code>w⁻</code>，在接下来的几千步里目标就是固定的</span>，<b>于是这段时间内它就是一个标准的监督回归问题：输入 <code>(s,a)</code>，标签 <code>r + γ max Q̂(s′,·;w⁻)</code>，固定不变。</b><span class='k'>隔一段时间再把 <code>w⁻ ← w</code> 同步一次。</span>", "<b>同步周期是一个真正的取舍，两端都不好，值得知道它在平衡什么。</b><span class='w'>周期太短：目标还是在动，等于没冻</span>；<span class='w'>周期太长：目标严重过时，你在拟合一个早就该更新的标签，学习变慢</span>。<span class='k'>原论文用的是每一万步同步一次</span>。<b>另一种常见做法是「软更新」：每步都让 <code>w⁻ ← τw + (1−τ)w⁻</code>，<code>τ</code> 很小（比如 0.005）</b>——<span class='w'>于是目标缓慢地跟随，没有突变。</span>", "<b>把这个补丁和 L05 的理论接起来，你会看到它在缓解什么。</b><span class='k'>L05 p29 说 TD 是「半梯度」——它对目标那一项不求导，所以它不是在最小化任何一个目标函数</span>。<b>而冻住目标之后，在一个同步周期内，它<b>真的</b>是在最小化一个确定的平方损失。</b><span class='w'>于是「没有目标函数」这个问题在局部被消除了</span>——<b>每个周期内都有一个明确的目标函数，只是周期之间会跳变。</b><span class='k'>这正是它能稳住训练的理论直觉。</span>", "<b>最后提一个它顺带带来的副作用，而这个副作用在 L04 讲过。</b><span class='k'>目标里的 <code>max_{a′} Q̂(s′,a′;w⁻)</code> 仍然是在对估计取最大</span>——<b>所以最大化偏差还在（L04 p42）。</b><span class='w'>而且因为选和评用的是<b>同一组</b>权重 <code>w⁻</code>，偏差没有被解耦</span>。<b>这正是 p47 的 Double DQN 要修的东西</b>——<span class='k'>它把选用 <code>w</code>、评用 <code>w⁻</code> 拆开。</span>"], "say": "有人问这招是不是深度网络专属。老师答：<b>不是</b>，线性逼近器一样能用；只是复杂逼近器下大家更担心稳定性。<br>还有人追问「这还算梯度下降吗」。老师承认：<b>Q-learning 这类本来就不是真正的梯度下降</b>，只是近似，而且<span class='w'>这些招数并不带来收敛保证</span>——只是经验上管用。", "quote": "To help improve stability, <b>fix the target weights used in the target calculation for multiple updates</b> &nbsp;·&nbsp; Use a different set of weights to compute target than is being updated &nbsp;·&nbsp; Let <b>w⁻</b> be the set of weights used in the target, and <b>w</b> be the weights being updated &nbsp;·&nbsp; Target: <b>r + γ max_{a′} Q̂(s′,a′;w⁻)</b>"},
{"r": [41, 42], "t": "DQN 小结", "one": "经验回放 + 固定 Q 目标 + 小批量 SGD + ε-贪婪。", "eq": "存 (s_t, a_t, r_{t+1}, s_{t+1}) 进回放池 D\n从 D 抽一个随机小批量\n用旧参数 w⁻ 算 Q-learning 目标\n最小化 Q 网络与目标之间的均方误差，SGD 更新 w", "pts": ["<b>课件没写但很重要的一条</b>：探索仍然是朴素的 ε-贪婪，<span class='k'>原始论文并没有用什么高级探索</span>。", "<b>这份小结只有六行，而它完整描述了 DQN。值得注意的是它有多普通。</b><span class='k'>存数据、随机抽批、算标签、最小化平方误差、SGD</span>——<b>除了「标签是自己算出来的」这一点，其余和普通的监督学习一模一样。</b><span class='w'>这正是两个补丁的全部成就：把一个在线的、非平稳的、相关的学习问题，改造成了一个尽可能接近标准监督学习的问题</span>。", "<b>把 DQN 和 L04 的表格 Q-learning 并排写，差别也只有三处，值得列清楚。</b><span class='k'>① <code>Q</code> 从一张表变成了一个网络</span>；<span class='k'>② 数据从「当前这条」变成了「从池子里随机抽的一批」</span>；<span class='k'>③ 目标用的是冻住的旧权重</span>。<b>算法的骨架（TD 目标、取 max、梯度下降）完全没动。</b><span class='w'>所以 DQN 不是一个新算法，它是 Q-learning 加两个工程补丁。</span>", "<b>把这六行按「它们各自解决什么」再标一次，这张对应关系值得背下来。</b><span class='k'>存转移 + 随机抽批 ⇒ 解决样本相关（病理一）</span>；<span class='k'>用冻结的 <code>w⁻</code> 算目标 ⇒ 解决目标在动（病理二）</span>；<span class='k'>最小化 MSE + SGD ⇒ 这是普通监督学习，没有 RL 特有的东西</span>。<b>换句话说：前两条把问题改造成第三条能处理的形状。</b>", "<b>这个小结还隐含了一个值得注意的事实：<span class='w'>DQN 没有任何新的理论</span>。</b><b>它用的 Q-learning 是 1989 年的，卷积网络是 1989 年的，经验回放是 1992 年的（Lin 的工作），固定目标是一个工程技巧。</b><span class='k'>它的贡献是把这些东西组合起来，并证明这个组合在一个有说服力的基准上真的管用</span>。<span class='w'>这提醒你：有影响力的工作不一定要有新定理</span>——<b>「把已知的东西组合对、并严格地验证」本身就是贡献。</b>"], "quote": "<b>DQN uses experience replay and fixed Q-targets</b> &nbsp;·&nbsp; Store transition (s_t, a_t, r_{t+1}, s_{t+1}) in replay memory D &nbsp;·&nbsp; Sample random mini-batch of transitions from D &nbsp;·&nbsp; Compute Q-learning targets w.r.t. <b>old, fixed parameters w⁻</b> &nbsp;·&nbsp; Optimizes MSE between Q-network and Q-learning targets &nbsp;·&nbsp; Uses stochastic gradient descent"},
{"r": [43, 44], "t": "Demo 与 Atari 结果", "star": 2, "one": "50 个游戏里很多达到人类水平；也有一批做得很差。", "pts": ["<b>「人类水平」指的是渐近性能</b>，不包括学会它花了多少经验——那往往极多。", "垫底的那批多是<span class='w'>难探索的游戏</span>，后面讲探索时会回来。", "<b>看这张结果图时，该盯的不是「超过人类的那些游戏」，而是<span class='w'>底下那一长串没超过的</span>。</b><span class='k'>DQN 在大部分反应型游戏上远超人类（Breakout、Pinball 这类）</span>，<span class='w'>但在需要长期规划和探索的游戏上远低于人类</span>——<b>蒙特祖玛的复仇得分接近 0。</b><span class='k'>这个分化不是偶然的，它精确地反映了 DQN 的能力边界</span>：<b>它擅长「看到什么就反应什么」，不擅长「现在做这件事是为了几百步之后」。</b>", "<b>而那个边界的两个成因，前面都已经铺垫过了。</b><span class='k'>① 状态表示：四帧窗口装不下长期信息（p34）</span>；<span class='k'>② 探索：ε-贪婪在稀疏奖励下凑不出正确的长序列（L07 p19）</span>。<b>两条合起来，就解释了那一长串低分。</b><span class='w'>而这两条正是后续研究的两个主攻方向</span>——<b>前者通向循环网络和记忆，后者通向内在动机和模仿学习。</b>", "<b>看这类结果图时还有一个该养成的习惯：<span class='k'>注意纵轴是怎么归一化的</span>。</b><span class='w'>原论文用的是「相对人类水平的百分比」，其中 0% 是随机策略，100% 是人类专家</span>。<b>这种归一化让不同量纲的游戏能画在一张图上，但它也会放大某些效果</b>——<span class='k'>如果某个游戏人类得分很低（比如本来就难），那么超过人类并不说明算法很强</span>。<b>所以「超过人类的游戏数」这个指标要配上分布一起看。</b>", "<b>最后给一个读这类「大规模基准结果」的通用提醒。</b><span class='w'>一个在几十个任务上的平均提升，可能完全来自其中几个任务的巨大提升，而在其余任务上毫无改进甚至更差</span>。<span class='k'>这和 L09 p9 那条「单调改进是期望意义上的，不保证对某一个病人更好」是同一个问题</span>——<b>平均值会掩盖分布。</b><span class='w'>所以这类图该看的是整条曲线，不是那个平均数。</span>"], "say": "打砖块的 demo 里，agent 自己发现了<b>先在边上打通一个洞、让球跑到顶上来回弹</b>的打法。老师的评语：你让它最大化奖励，数据够多它就真会找到最好的办法。<br>有同学问为什么球拍一直乱抖。老师答：<b>移动没有代价，所以抖不抖对它没区别</b>，那只是探索时的「牙牙学语」；想让它别抖，就给移动加个代价。", "quote": "Demo &nbsp;·&nbsp; <b>DQN Results in Atari</b> &nbsp;·&nbsp; (Human-level control through deep reinforcement learning, Mnih et al, 2015)", "tbl": {"head": ["DQN 擅长的游戏", "不擅长的游戏", "原因"], "rows": [["反应型（Breakout、Pinball）", "需要长期规划（蒙特祖玛）", "<span class='w'>四帧窗口装不下长期信息（p34）</span>"], ["奖励稠密", "<span class='w'>奖励极稀疏</span>", "<span class='w'>ε-贪婪凑不出长序列（L07 p19）</span>"], ["颜色不关键", "<span class='w'>颜色是关键信息</span>", "预处理转成了灰度"], ["分数尺度适中", "<span class='w'>需要区分小胜大胜</span>", "奖励被裁剪到 {−1,0,+1}"]]}},
{"r": [45, 45], "t": "消融实验：哪一样最重要", "star": 3, "one": "<b>回放。而且不是小胜，是碾压。</b>", "eq": "游戏            线性   深度网络  +固定Q  +回放   +回放且固定Q\nBreakout          3       3       10     241      317\nEnduro           62      29      141     831     1006\nRiver Raid     2345    1453     2868    4102     7447\nSeaquest        656     275     1003     823     2894\nSpace Invaders  301     302      373     826     1089", "pts": ["Breakout：固定 Q 只把 3 抬到 10，<span class='k'>加上回放直接到 241</span>。", "<b>用完就扔数据是个很糟的做法。</b>", "有几个游戏里换成深度网络本身就带来明显提升（River Raid、Seaquest）。", "<b>这张消融表是整讲最该细读的一页，因为它用数字回答了「哪个补丁更重要」。</b><span class='k'>以 Breakout 为例：线性 3 分，深度网络 3 分，只加固定目标 10 分，只加回放 <b>241</b> 分，两个都加 317 分</span>。<b>只加固定目标：3 → 10；只加回放：3 → 241。</b><span class='w'>差了二十多倍</span>。<b>课件自己的结论是三个字：<em>Replay is hugely important</em>。</b>", "<b>另外几行也值得看，它们说明这个结论不是单个游戏的偶然。</b><span class='k'>Enduro：29（纯网络）→ 141（固定目标）→ 831（回放）</span>；<span class='k'>River Raid：1453 → 2868 → 4102</span>；<span class='k'>Space Invaders：302 → 373 → 826</span>。<b>五个游戏里有四个，回放单独的贡献都明显大于固定目标单独的贡献。</b><span class='w'>唯一的例外是 Seaquest（275 → 1003 vs 823），而那里两者接近</span>。", "<b>还有一个容易被忽略的对比：<span class='w'>「深度网络」那一列常常还不如「线性」</span>。</b><b>Breakout 3 对 3，Enduro 62 对 29，River Raid 2345 对 1453，Seaquest 656 对 275。</b><span class='k'>也就是说：光把线性换成深度网络，不加任何补丁，效果反而更差</span>。<b>这是 L05 p38 那个警告的实证版本——函数逼近 + 自举 + off-policy 凑齐之后，训练确实不稳。</b><span class='w'>深度网络的表达力只有在稳定性被补上之后才兑现得出来。</span>", "<b>课件最后那个问句是留给你的：<em>Beyond helping with correlation between samples, what does replaying do?</em></b><span class='k'>答案是<b>数据复用</b></span>——<b>同一条转移可以被抽中几十次，于是同样的交互次数能产生几十倍的梯度更新。</b><span class='w'>而深度网络恰恰极度缺数据</span>。<b>所以回放真正在解决的，是「深度网络需要很多样本，而和环境交互很贵」这个矛盾</b>——<span class='k'>打散相关性只是它顺带做的事。</span>"], "say": "有同学指出：那按这张表，「线性 + 回放 + 固定 Q」说不定也不错？老师承认<b>表里没有这一栏</b>，而且这确实值得试；她提到有人把深度网络前半段当特征提取器、最后一层直接做线性回归（甚至贝叶斯线性回归），两头的好处都要。", "quote": "<b>Which Aspects of DQN were Important for Success?</b> &nbsp;|&nbsp; Game / Linear / Deep Network / DQN w/ fixed Q / DQN w/ replay / DQN w/ replay and fixed Q &nbsp;·&nbsp; <b>Breakout 3 / 3 / 10 / 241 / 317</b> &nbsp;·&nbsp; Enduro 62 / 29 / 141 / 831 / 1006 &nbsp;·&nbsp; River Raid 2345 / 1453 / 2868 / 4102 / 7447 &nbsp;·&nbsp; Seaquest 656 / 275 / 1003 / 823 / 2894 &nbsp;·&nbsp; Space Invaders 301 / 302 / 373 / 826 / 1089 &nbsp;|&nbsp; <b>Replay is hugely important</b> &nbsp;·&nbsp; <b>Why? Beyond helping with correlation between samples, what does replaying do?</b>", "tbl": {"head": ["游戏", "线性", "深度网络", "+ 固定目标", "+ 回放", "两个都加"], "rows": [["Breakout", "3", "3", "10", "<b>241</b>", "<b>317</b>"], ["Enduro", "62", "29", "141", "<b>831</b>", "<b>1006</b>"], ["River Raid", "2345", "1453", "2868", "<b>4102</b>", "<b>7447</b>"], ["Seaquest", "656", "275", "1003", "823", "<b>2894</b>"], ["Space Invaders", "301", "302", "373", "<b>826</b>", "<b>1089</b>"], ["<b>读法</b>", "—", "<span class='w'>常不如线性</span>", "<span class='w'>提升有限</span>", "<span class='k'>提升巨大</span>", "<b>最好</b>"]]}, "res": {"tag": "推断", "v": "<b>这张表对你的用处不在它的结论，在它的<b>做法</b>——它是一张可以照着抄的诚实消融表。</b><br><br><b>看它的结构：<span class='k'>五个游戏 × 五种配置（基线、只换表示、只加补丁A、只加补丁B、全加）</span>。</b><b>每个补丁都有<b>单独</b>的一列，而不是只报「全加 vs 不加」。</b><span class='w'>正因为有单独那两列，才看得出「回放的贡献远大于固定目标」</span>——<b>如果只报全加和不加，这个结论就被埋掉了。</b><br><br><b>照搬到你的工作上，意味着你的消融该包含这几列：</b><span class='k'>① 什么都不做的基线（比如 AFlow 原配置）；② 只换估计器（FQE vs 纯 MC）；③ 只加某一个设计（比如只做难度分层基线，不做样本拆分）；④ 只加另一个（只做样本拆分）；⑤ 全加</span>。<b>而不是只报「我们的方法 vs 基线」。</b><br><br><b>这张表还教了一件更值钱的事：<span class='w'>它敢报告「深度网络那一列常常还不如线性」</span>。</b><span class='k'>一个让自己的主要卖点（深度网络）单独看起来很差的数据，被原样放进了论文</span>——<b>而正是这个「难看」的数字，让「补丁才是关键」这个结论有了说服力。</b><span class='w'>你的消融也该允许出现这种格子</span>：<b>如果某个设计单独用反而更差，照实报，并解释它为什么只在组合里起作用。</b><span class='k'>这比一张全是绿色的表可信得多。</span><br><br><b>最后那个课件留的问句（回放除了打散相关性还做了什么）也有一条直接对应：<span class='k'>数据复用</span>。</b><span class='w'>而你的日志天然就是一个「回放池」——每条记录可以被反复用于评估不同的候选配置</span>。<b>所以 DQN 当年要发明回放才能回到的那个位置，你一开始就在。</b><span class='k'>这是一个值得在 paper 里点明的处境差异：离线设定省掉了在线 RL 的一大半工程麻烦。</span>", "ref": "课件 p45 消融表与原问句 · p38 · L05 p38 · 简报 §4d"}},
{"r": [46, 46], "t": "三个立竿见影的改进", "one": "Double DQN · 优先经验回放 · Dueling DQN。", "pts": ["Van Hasselt et al., AAAI 2016；Schaul et al., ICLR 2016；Wang et al., ICML 2016（最佳论文）。", "<span class='k'>这三样是层层叠上去的</span>，后面的图会一路对比。", "<b>这三个改进有一个很整齐的共同点，而 <code>kp</code> 把它点出来了：<span class='k'>它们各自回头修前面某一讲的病</span>。</b><br><b>① Double DQN</b> 修的是 <span class='k'>L04 p42 的最大化偏差</span>；<br><b>② 优先回放</b> 修的是 <span class='k'>这一讲 p38 回放池「所有样本一视同仁」的浪费</span>；<br><b>③ Dueling DQN</b> 修的是 <span class='k'>L05 的样本效率问题——一次更新只改一个动作的估值</span>。<br><span class='w'>三个改动都很小（几行代码），而效果都很明显</span>——<b>这说明 DQN 原版留下了不少容易摘的果子。</b>", "<b>它们也共享另一个性质：<span class='w'>都不改变算法的框架</span>。</b><b>还是 Q-learning、还是回放池、还是固定目标。</b><span class='k'>改的分别是：目标怎么算（①）、样本怎么抽（②）、网络怎么搭（③）</span>。<b>于是三者互相正交，可以任意组合</b>——<span class='w'>而 Rainbow（L07 p15）正是把它们连同另外三个一起上的结果。</span>", "<b>还有一点值得先交代：这三个改进都是 2015–2016 年的工作，而它们至今仍在被用。</b><span class='k'>今天任何一个像样的 DQN 实现，默认都会带上 Double 和优先回放</span>。<span class='w'>这和这个领域大部分方法的寿命形成对比（TRPO 两年就被 PPO 取代）</span>——<b>原因可能是：它们修的是问题本身的性质（最大化偏差、数据利用率），而不是某个算法的实现细节。</b>", "<b>读这三个改进时有一个省力的问法：<span class='k'>它动的是「数据」「目标」还是「模型」</span>。</b><b>优先回放动数据（怎么抽），Double DQN 动目标（怎么算），dueling 动模型（怎么搭）。</b><span class='w'>三个位置互不重叠，所以能叠加</span>——<b>而任何新的 DQN 变体，你都可以先按这三格去归类。</b>", "<b>读这三个改进时有一个省力的问法：<span class='k'>它动的是「数据」「目标」还是「模型」</span>。</b><b>优先回放动数据（怎么抽），Double DQN 动目标（怎么算），dueling 动模型（怎么搭）。</b><span class='w'>三个位置互不重叠，所以能叠加</span>——<b>而任何新的 DQN 变体，你都可以先按这三格去归类。</b>"], "quote": "Three immediate improvements to DQN: <b>Double DQN</b> &nbsp;·&nbsp; <b>Prioritized Experience Replay</b> &nbsp;·&nbsp; <b>Dueling DQN</b>"},
{"r": [47, 49], "t": "Double DQN", "star": 3, "one": "<b>用当前网络挑动作，用旧网络评估它。</b>", "eq": "普通 DQN：  目标 = r + γ·max_{a′} Q̂(s′, a′; w⁻)\n\nDouble DQN：目标 = r + γ· Q̂( arg max_{a′} Q̂(s′,a′; w) , w⁻ )\n                            └─ 用 w 选 ─┘      └ 用 w⁻ 评 ┘", "pts": ["治的是第四讲那个<b>最大化偏差</b>：估计值的 max 会系统性高估真值的 max。", "<span class='k'>改动极小</span>——目标网络本来就有，只是把「选」和「评」分给两组权重。", "「一点点代码换来立竿见影的提升」。", "<b>把这个目标和原版 DQN 的目标并排写，差别一眼可见。</b><span class='w'>原版：<code>r + γ max_{a′} Q̂(s′,a′; w⁻)</code>——选和评都用 <code>w⁻</code></span>；<span class='k'>Double：<code>r + γ Q̂(s′, arg max_{a′} Q̂(s′,a′; w); w⁻)</code>——用 <code>w</code> 选、用 <code>w⁻</code> 评</span>。<b>这正是 L04 p43 那个「用一份数据挑、用另一份数据评」的结构。</b>", "<b>但这里有一处必须说清的妥协，它决定了这个改进有多大用。</b><span class='k'>L04 的 Double Q-learning 用的是两张<b>完全独立</b>的表，由不同的样本更新</span>；<span class='w'>而 Double DQN 用的是 <code>w</code> 和 <code>w⁻</code>——后者只是前者在几千步前的一个快照</span>。<b>它们来自<b>同一批</b>数据，噪声并不真正独立。</b><span class='k'>所以 Double DQN 只是<b>缓解</b>最大化偏差，不是消除</span>。<b>它用「时间上的距离」近似「统计上的独立」，而这个近似的质量取决于同步周期有多长。</b>", "<b>而它之所以这么受欢迎，理由很实际：<span class='k'>它是免费的</span>。</b><b>不需要额外的网络、额外的内存、额外的计算——<code>w⁻</code> 本来就有（固定目标那个补丁带来的）。</b><span class='w'>改动只有一行代码：把 <code>max_{a′} Q̂(s′,a′;w⁻)</code> 换成 <code>Q̂(s′, arg max_{a′} Q̂(s′,a′;w); w⁻)</code></span>。<b>课件在 L07 p14 的说法是 <em>significant improvement from small code change</em>。</b><span class='k'>这是一个「几乎没有代价的改进」，所以没有理由不用。</span>", "<b>把 Double DQN 的偏差来源再拆细一点，你会明白为什么「同一批数据」是个实质性的限制。</b><span class='k'>最大化偏差的根子是「被选中」和「被高估」相关</span>——<b>某个动作因为噪声而估高了，于是被 <code>arg max</code> 挑中，于是那个虚高的数被用作目标。</b><span class='w'>要打断这个相关，选和评用的噪声必须独立</span>。<b>而 <code>w</code> 和 <code>w⁻</code> 是同一条训练轨迹上的两个时刻，它们的噪声高度相关</b>——<span class='k'>同步周期越短，相关性越强，去偏效果越差。</span>", "<b>于是这里有一个有意思的张力，值得单独指出来，因为它说明超参不是孤立的。</b><span class='w'>固定目标那个补丁希望同步周期<b>长</b>（目标才稳）</span>；<span class='w'>Double DQN 希望周期<b>长</b>（噪声才独立）</span>；<span class='k'>而「目标不要太过时」希望周期<b>短</b></span>。<b>三个要求里两个指向长、一个指向短——所以实践中周期会设得偏长（一万步）。</b><span class='k'>认出这种「同一个超参服务于多个目的」的情形，调参时就不会顾此失彼。</span>", "<b>最后提一句 L07 p15 给的那个冷静结论，免得你高估这个改进。</b><span class='w'>Rainbow 的消融显示：Double DQN 单独去掉几乎不掉分</span>——<span class='k'>因为分布式值函数（C51）已经顺带缓解了同一个偏差</span>。<b>这是一个「技巧之间互相覆盖」的例子：每个单独看都有用，但组合起来有冗余。</b>"], "quote": "<b>Double DQN</b>: use the current network w to <b>select</b> the action, and the older network w⁻ to <b>evaluate</b> it &nbsp;·&nbsp; <b>Δw = α(r + γ Q̂(s′, arg max_{a′} Q̂(s′,a′;w); w⁻) − Q̂(s,a;w)) ∇_w Q̂(s,a;w)</b>", "tbl": {"head": ["", "原版 DQN", "Double DQN", "L04 的 Double Q-learning"], "rows": [["选动作用", "<code>w⁻</code>", "<span class='k'><code>w</code></span>", "<code>Q1</code>"], ["评估用", "<code>w⁻</code>", "<code>w⁻</code>", "<code>Q2</code>"], ["两者独立吗", "<span class='w'>同一组权重</span>", "<span class='w'>同一批数据的新旧快照——不真独立</span>", "<span class='k'>真独立（不同样本更新）</span>"], ["效果", "<span class='w'>系统性高估</span>", "<span class='k'>缓解</span>", "<span class='k'>消除</span>"], ["代价", "—", "<b>零（<code>w⁻</code> 本来就有）</b>", "内存翻倍"]]}},
{"r": [50, 51], "t": "Double DQN 的效果", "one": "在很多 Atari 游戏上收益很大。", "pts": ["图出自 van Hasselt, Guez, Silver, 2015。", "<b>这个结果值得注意的不是分数提升，而是<span class='k'>它同时降低了 Q 值的估计</span>。</b><b>原论文画了两条曲线：原版 DQN 估出的 Q 值一路攀升到远高于实际能达到的回报；Double DQN 的估计贴着实际值。</b><span class='w'>也就是说：它不只是「表现更好」，而是「估得更准」</span>——<b>而这正是最大化偏差被缓解的直接证据。</b><span class='k'>这是一个很好的实验设计示范：不只报最终指标，还报中间量是否符合理论预期。</span>", "<b>这个「监控中间量」的做法值得单独记，它在调试任何 RL 算法时都有用。</b><span class='w'>L05 p43 说过：TD with VFA 不在最小化任何目标函数，所以损失下降不是收敛的证据</span>。<span class='k'>该监控的是<b>权重范数</b>和<b>预测值的量级</b></span>——<b>发散的征兆是量级单调爆炸，高估的征兆是 Q 值远超实际回报。</b><span class='w'>两者都是损失曲线上看不出来的。</span>", "<b>这个「估计值曲线」的实验设计值得单独学，因为它回答了一个比「分数高不高」更深的问题。</b><span class='k'>它问的是：算法失败时，失败的机制是不是我们以为的那个</span>。<b>原版 DQN 的 Q 估值一路攀升到远超实际回报——这正是最大化偏差的预测。</b><span class='w'>如果 Double DQN 提升了分数但 Q 估值曲线没变，那说明提升来自别的原因</span>，<b>而那个解释就站不住了。</b><span class='k'>所以这张图不是锦上添花，它是「机制验证」。</span>", "<b>把这个做法总结成一条可照搬的习惯：<span class='k'>报告指标之外，还要报告「你的理论预测的那个中间量」</span>。</b><b>你声称改进来自降低偏差，就该展示偏差真的降了；声称来自降低方差，就该展示方差真的降了。</b><span class='w'>只报最终指标的话，任何改进都可以被归因到任何原因</span>——<b>而那样的论文经不起复现。</b>", "<b>这一条和 L06 p64「至少跑两个种子」是配套的，合起来是一套最低限度的实验纪律。</b><span class='k'>多个种子保证「结果不是运气」，中间量保证「解释不是编的」</span>。<span class='w'>两者缺一，结论都站不住</span>。", "<b>还有一个关于「高估」的细节值得知道，它解释了为什么高估比低估更危险。</b><span class='k'>Q-learning 的目标里有 <code>max</code>，所以高估会被<b>自举</b>一轮一轮地往回传</span>——<b>某个状态的 Q 被估高了，它的前一个状态也会跟着高，再前一个也是。</b><span class='w'>于是高估会沿着状态链累积放大</span>。<b>而低估不会有同样的放大效果（<code>max</code> 会绕开被低估的那个动作）。</b><span class='k'>这个不对称正是为什么最大化偏差在 Q-learning 里比在别处更要命。</span>"], "quote": "Double DQN substantially reduces overestimation and improves performance on many Atari games"},
{"r": [52, 52], "t": "回到火星车", "star": 2, "one": "为了讲清「回放顺序有多要紧」，先把第三讲那条轨迹搬回来。", "eq": "R = [1 0 0 0 0 0 10]，π=a1，γ=1，到 s1/s7 下一步终止\n轨迹 = (s3,a1,0, s2,a1,0, s2,a1,0, s1,a1,1, 终止)\n\n首次访问 MC： [1 1 1 0 0 0 0]\nTD（α=1）：   [1 0 0 0 0 0 0]", "quote": "Back to the Mars rover example &nbsp;·&nbsp; (用火星车演示回放顺序的影响)", "pts": ["<b>课件在这里把火星车搬回来，是为了演示一件在 Atari 上看不清的事：<span class='k'>同样一批数据，按不同顺序回放，学习速度可以差很远</span>。</b><b>小例子才能把这件事看明白，因为你能手算每一步。</b><span class='w'>而在 Atari 上这个效应被淹没在噪声里</span>。<span class='k'>这是一个很好的「用玩具例子隔离单个因素」的示范。</span>", "<b>这一页搬回火星车，还隐含了一个方法论上的提醒，值得说一句。</b><span class='k'>当你想隔离出某一个因素的影响时，小例子比大基准有用得多</span>——<b>因为大基准上所有因素同时在变，噪声也大，你分不清是谁起的作用。</b><span class='w'>而在七个状态的火星车上，你可以手算每一步，把「顺序」这一个变量单独拎出来看</span>。<b>这是一个在自己做实验时该养成的习惯：先在能手算的例子上确认机制，再去大基准上验证规模。</b>", "<b>这也解释了为什么这门课从头到尾都在用火星车这个例子。</b><span class='k'>L02 用它演示值函数和策略迭代，L03 用它演示 MC 与 TD，L04 用它演示 ε-贪婪和 Q 的更新，这里用它演示回放顺序</span>。<b>同一个例子贯穿全程的好处是：你对它已经足够熟悉，于是能把注意力完全放在新引入的那一个变量上。</b>"]},
{"r": [53, 54], "t": "回放的顺序会带来指数级差别", "star": 3, "one": "<b>同样两次回放，顺序不同，结果完全不同。</b>", "eq": "可回放的四条 tuple：\n  ① (s3,a1,0,s2)   ② (s2,a1,0,s2)\n  ③ (s2,a1,0,s1)   ④ (s1,a1,1,终止)\n\n只许做两次，正确顺序是 ③ 然后 ①：\n  做 ③：V(s2) ← 0 + γ·V(s1) = 1\n  做 ①：V(s3) ← 0 + γ·V(s2) = 1\n  ⇒ 得到 [1 1 1 0 0 0 0]，和蒙特卡洛一模一样\n\n若先做 ①：那时 V(s2) 还是 0，这一步白做。", "pts": ["<b>必须从靠近奖励的那一端往回做。</b>", "Schaul et al. ICLR 2016 用一个能挑最优顺序的「神谕」做实验：<span class='k'>收敛所需更新次数呈指数级下降</span>。", "神谕当然算不出来，但它说明了顺序值多少钱。", "<b>「指数级改进」这个说法要当真，它不是夸张的修辞。</b><span class='k'>同一批数据，一个理想的 oracle 按最优顺序回放，收敛所需的更新次数比随机顺序少<b>指数级</b></span>。<b>这意味着「顺序」不是一个边际的优化项，它和算法本身一样重要。</b><span class='w'>而这件事在随机抽样的回放池里是被完全浪费掉的</span>——<b>原版 DQN 对所有样本一视同仁。</b>", "<b>为什么顺序能差这么多，用一个简单的链式例子就能看明白。</b><span class='k'>假设奖励只在终点，而状态排成一条链。信息要从终点一格一格往回传</span>。<b>如果你按「从终点往回」的顺序回放，一遍扫完信息就传到起点了；如果按「从起点往前」的顺序，每扫一遍信息只往回传一格——需要扫 n 遍。</b><span class='w'>而随机顺序介于两者之间</span>。<b>链越长，差距越大，这就是「指数级」的来源。</b>", "<b>课件自己强调 <em>Oracle is not a practical method</em>，这个限定要记住。</b><span class='w'>那个 oracle 需要知道「哪条样本回放之后全局损失下降最多」——而要知道这个，你得先把所有候选都试一遍</span>。<span class='k'>所以它是一条<b>上界</b>，用来说明「顺序值多少钱」，不是一个能用的方法</span>。<b>而 p55 的优先回放是对它的一个<b>可计算的近似</b>：用 TD 误差当代理。</b><span class='w'>这是一个很常见的研究范式——先用 oracle 证明「这件事值得做」，再找一个能算的近似。</span>"], "say": "老师现场举手表决，课堂选对了 ③ 再 ①。她借此点出：<b>不只要想「往回放池里放什么」，还要想「按什么顺序抽」。</b>", "quote": "<b>In tabular TD-learning, order of replaying updates could help speed learning</b> &nbsp;·&nbsp; Repeating some updates seem to better propagate info than others &nbsp;·&nbsp; Systematic ways to prioritize updates? &nbsp;|&nbsp; <b>Oracle: picks (s,a,r,s′) tuple to replay that will minimize global loss</b> &nbsp;·&nbsp; <b>Exponential improvement in convergence</b> (number of updates needed to converge) &nbsp;·&nbsp; <b>Oracle is not a practical method but illustrates impact of ordering</b> &nbsp;·&nbsp; (Schaul, Quan, Antonoglou, Silver ICLR 2016)", "res": {"tag": "推断", "v": "<b>这一页是 L06 对你最有用的一条，而且它的用法和 DQN 完全不同。</b><br><br><span class='k'>结论是：同样一批数据，<b>处理的顺序</b>可以带来指数级的差别</span>。<b>而 oracle 实验的意义是——它给出了「如果你能聪明地选，最多能省多少」这个上界。</b><br><br><b>翻译到你的场景，对应的不是「回放顺序」，而是<span class='k'>「下一个该实跑哪个配置」</span>。</b><span class='w'>你的预算有限：留出集上能真跑的配置数远少于 <code>k^H</code></span>。<b>于是「挑哪些配置去实跑」本身就是一个决策问题。</b><span class='k'>而这一页说：随机挑和聪明挑之间的差距可能是指数级的，值得认真对待</span>。<br><br><b>可以照搬的两条思路：</b><br><b>① 用「代理误差」排序，正如优先回放用 TD 误差。</b><span class='k'>你的代理可以是：FQE 估值与覆盖率的组合——估值高<b>且</b>覆盖率低的配置，信息量最大</span>（<b>估值高说明它可能是赢家，覆盖率低说明你最不确定</b>）。<span class='w'>这正好对应 L10 p22 科研格说的那两个量。</span><br><b>② 先做一次 oracle 实验来确认「值不值得」。</b><span class='k'>在一个小规模设定（比如 H=4、k=3，81 个配置）上全部跑完，然后回放式地比较「随机挑 20 个」和「按某个准则挑 20 个」各自能多准地找到最优</span>。<b>这个实验花费很小，但能直接告诉你主动选择值多少。</b><span class='w'>而课件这一页正是这种实验的范本——先用 oracle 定上界，再找可算的近似。</span><br><br><b>最后标清边界</b>：<span class='w'>这是类比，不是定理</span>。<b>课件的指数级结论是关于「表格 TD 的信息传播」的，而你的问题是「从候选集里挑样本去评估」，结构不同。</b><span class='k'>所以该做的是上面第②条那个小实验，而不是直接引用这个结论。</span>", "ref": "课件 p53–p54（Schaul et al. ICLR 2016 的 oracle 实验）· p55 · L10 p22 科研格 · L07 p33 科研格 · 简报 §4c §4d"}},
{"r": [55, 56], "t": "优先经验回放", "star": 3, "one": "按 <b>DQN 误差</b>给每条 tuple 定优先级，误差大的多抽。", "eq": "p_i = | r + γ·max_{a′} Q(s_{i+1},a′; w⁻) − Q(s_i,a_i; w) |\n\nP(i) = p_i^α / Σ_k p_k^α\n\n每次更新后重算 p_i；新 tuple 的 p 设为 0", "pts": ["<code>α = 0</code> ⇒ <span class='k'>所有 tuple 概率相等，退回均匀采样</span>。", "<code>α → ∞</code> ⇒ 只抽误差最大的那一条。", "<b>α 就是一根从「完全不排序」到「只看最大误差」的旋钮。</b>", "<b>用 TD 误差当优先级，背后的直觉是：<span class='k'>误差大的地方，说明你学得最差，所以最该多看几眼</span>。</b><b>它是 p53 那个 oracle 的一个可计算的近似——oracle 要的是「全局损失下降最多」，TD 误差是「这一条自己的误差」。</b><span class='w'>两者不一样：一条样本自己误差大，不代表修正它对全局帮助最大</span>。<b>但它便宜（算目标时顺手就得到了），而且经验上管用。</b>", "<b>那个指数 α 是一个重要的旋钮，而课件留了一道检验题问它，值得当场答。</b><span class='k'><code>P(i) = p_i^α / Σ_k p_k^α</code></span>。<b><code>α = 0</code> 时，<code>p_i^0 = 1</code> 对所有 i 成立，于是 <code>P(i) = 1/N</code>——<span class='w'>退化成均匀随机抽样，也就是原版回放</span>。</b><span class='k'><code>α = 1</code> 时完全按误差成比例；<code>α</code> 越大越贪心</span>。<b>所以 α 是一个在「均匀」和「纯按误差」之间连续滑动的参数。</b>", "<b>「新样本的优先级设为 0」这一条看起来反直觉，值得说清楚它的实际含义。</b><span class='w'>字面上这意味着新样本永远不会被抽中（概率为 0）</span>——<b>那显然不对。</b><span class='k'>实践中的做法是把新样本的优先级设成<b>当前的最大值</b>，保证它至少被抽中一次</span>，<b>抽中之后再用它真实的 TD 误差更新优先级。</b><span class='w'>课件这里写 0 可能是指「误差还没算，先占位」</span>——<b>按实际做法（设为最大）记。</b>", "<b>优先回放有一个必须配套的修正，课件没展开但很重要，否则估计就有偏了。</b><span class='k'>按优先级抽样意味着你不再是在原始的数据分布上求期望，于是梯度是有偏的</span>（<b>L07 p3 的科研格讨论过这件事</b>）。<b>原论文的修正是乘一个重要性权重 <code>(1/N · 1/P(i))^β</code>，并让 <code>β</code> 从一个小值逐渐升到 1。</b><span class='w'>早期 β 小（容忍偏差，换快速学习），后期 β 趋于 1（消除偏差）</span>。<b>这是又一处「先要速度、后要正确」的退火设计，和 GLIE 的 ε 衰减是同一个思路。</b>"], "say": "有同学发现一处张力：<b>固定 Q 目标会把信息往回传这件事拖慢，那还讲什么顺序？</b> 老师承认这确实是个取舍——但回放池可能有一百万条，而权重每几十步就更新一次，<span class='k'>在两次同步之间，顺序照样很重要</span>。", "quote": "<b>Prioritized Experience Replay</b> &nbsp;·&nbsp; Sample tuples for update using priority function &nbsp;·&nbsp; <b>Priority of a tuple i is proportional to DQN error: p_i = |r + γ max_{a′} Q(s_{i+1},a′;w⁻) − Q(s_i,a_i;w)|</b> &nbsp;·&nbsp; Update p_i every update &nbsp;·&nbsp; <b>p_i for new tuples is set to 0</b> &nbsp;·&nbsp; One method: proportional (stochastic prioritization) <b>P(i) = p_i^α / Σ_k p_k^α</b>", "tbl": {"head": ["α", "<code>P(i) ∝ p_i^α</code>", "行为", "对应"], "rows": [["0", "<code>P(i) = 1/N</code>", "<span class='k'>均匀随机</span>", "<b>原版经验回放</b>"], ["中间值（如 0.6）", "部分按误差加权", "<span class='k'>实践中的常用取值</span>", "优先回放"], ["1", "完全按误差成比例", "最贪心", "—"], ["<b>配套修正</b>", "<code>(1/N · 1/P(i))^β</code>", "<span class='w'>消除抽样引入的偏差</span>", "<b>β 从小值退火到 1</b>"]]}},
{"r": [57, 58], "t": "优先回放的效果", "one": "大多数游戏上优于 Double DQN。", "pts": ["图出自 Schaul et al. ICLR 2016：零线以上表示优先回放更好。", "<b>优先回放的效果在 L07 p15 的 Rainbow 消融里得到了交叉验证，值得一并记住。</b><span class='k'>那里的结论是：优先回放和多步回报是去掉之后掉分最狠的两个组件</span>。<b>而这两个恰好都在动「同一批数据能榨出多少」，不是在动网络结构。</b><span class='w'>这和 p45 的消融（回放远比固定目标重要）指向同一件事</span>——<b>深度 RL 的瓶颈主要在数据利用效率上。</b>", "<b>但要注意一个它带来的副作用，和 L05 的理论直接相关。</b><span class='w'>优先回放让训练分布偏向「误差大的样本」，而那些样本往往是罕见的、极端的</span>。<span class='k'>于是你的函数逼近器会把容量分配给那些罕见情形，而常见情形的拟合可能变差</span>。<b>这在大部分 Atari 游戏上是划算的，但不是无条件的</b>——<span class='w'>如果你的「大误差样本」主要来自噪声而不是真的学得差，优先回放就是在追噪声。</span>", "<b>优先回放在实现上有一个不小的工程代价，课件没提但你一动手就会碰到。</b><span class='k'>按优先级抽样需要一个能高效支持「按权重抽样」和「更新单个权重」的数据结构</span>——<b>原论文用的是线段树（sum tree），抽样和更新都是 <code>O(log N)</code>。</b><span class='w'>如果用朴素的做法（每次重新归一化整个数组），百万条的池子会慢到不可接受</span>。<b>这是一个「算法改进带来实现复杂度」的典型例子。</b>", "<b>还有一个更根本的问题值得想：<span class='w'>TD 误差大，真的说明「这里该多学」吗</span>？</b><span class='k'>不一定。TD 误差大也可能是因为那个转移本身随机性大（奖励噪声、转移噪声）</span>——<b>那种情况下你再怎么学，误差也降不下去，但优先回放会一直盯着它。</b><span class='w'>于是算法会把大量更新浪费在「本质上不可预测」的样本上</span>。<b>这是优先回放在高噪声环境里的一个已知弱点</b>，<span class='k'>也是为什么 α 通常不取 1（保留一部分均匀抽样作为对冲）。</span>", "<b>把这一条和 p53 的 oracle 接起来，差距就清楚了。</b><span class='k'>oracle 要的是「回放它之后全局损失下降最多」，那个量把「可不可学」考虑进去了</span>；<span class='w'>TD 误差只是「这一条自己错得多」，没有区分「错是因为没学会」还是「错是因为本来就随机」</span>。<b>所以优先回放只是 oracle 的一个粗糙近似——而那个指数级的差距，大部分还留在桌上。</b>", "<b>最后给一条判断「该不该上优先回放」的实用判据。</b><span class='k'>如果你的奖励稀疏——大部分转移的 TD 误差接近 0，少数关键转移误差很大——那它帮助很大</span>，<b>因为均匀抽样会让那少数关键样本被淹没。</b><span class='w'>如果你的奖励稠密、噪声大，那它可能在追噪声</span>，<b>收益有限甚至为负。</b><span class='k'>这个判据和 p55 说的那个弱点是同一回事的两面。</span>"], "quote": "Prioritized replay improves learning speed on most Atari games"},
{"r": [59, 60], "t": "优势函数与 Dueling DQN", "star": 3, "one": "<b>「这个状态好不好」和「这个动作比别的好多少」，该看的特征不一样。</b>", "eq": "优势函数（Baird 1993）：A^π(s,a) = Q^π(s,a) − V^π(s)\n\nDueling 网络：一条支路估 V̂(s)，另一条估 Â(s,a)，最后再合成 Q̂", "pts": ["例子：<b>游戏分数</b>对预测 <code>V(s)</code> 很有用，但<span class='w'>对判断此刻哪个动作更好几乎没用</span>。", "<span class='k'>我们真正要的是后者。</span>所以把两件事拆成两条支路分别学。", "这是<b>纯粹的结构选择</b>，训练方式没变。", "<b>Dueling 的动机，课件给的是一句很具体的话：<span class='k'>判断「这个局面好不好」和判断「这一步该怎么走」需要看的东西不一样</span>。</b><b>游戏分数跟 <code>V(s)</code> 高度相关，但对「现在该往左还是往右」几乎没有信息。</b><span class='w'>硬要用一个网络同时拟合这两件事，等于逼它用同一组特征回答两个不同的问题</span>。", "<b>但分解真正买到的好处是<span class='k'>样本效率</span>，而这一点课件没明说，值得补上。</b><span class='w'>不分解时，一次 <code>(s,a)</code> 的更新只改 <code>Q(s,a)</code> 这一个输出头</span>；<span class='k'>分解后，这次更新会流进 <code>V(s)</code> 那一支，而 <code>V(s)</code> 是所有动作共用的</span>。<b>于是「试了一个动作」顺带改善了对其余所有动作的估计。</b><span class='w'>动作数越多，这个好处越大</span>——<b>Atari 有 18 个动作，所以效果明显。</b>", "<b>这一页还解释了 Dueling 在什么游戏上帮助最大，这个判据值得记。</b><span class='k'>在「大部分时候做什么都差不多，只在关键时刻重要」的游戏里帮助最大</span>——<b>比如开车类游戏：路上没车时往哪打方向都行，有车时才要紧。</b><span class='w'>这类状态下各个动作的 Q 值几乎相同，于是「学 <code>V</code>」比「分别学每个 <code>Q</code>」高效得多</span>。<b>反过来，如果每个状态下各动作差别都很大，分解的好处就小。</b>", "<b>再把 dueling 的网络结构说具体一点，因为「两支」这个词容易让人想错。</b><span class='k'>卷积层是<b>共享</b>的，只有最后几层全连接分叉</span>——<b>一支输出一个标量 <code>V̂(s)</code>，另一支输出 <code>|A|</code> 个数 <code>Â(s,·)</code>，然后按 p61 的式子合成 <code>Q̂</code>，再照常做 DQN 的更新。</b><span class='w'>训练信号完全没变：你还是只拿到 <code>Q</code> 的目标，从来没有人告诉网络「真正的 <code>V</code> 是多少」</span>——<b>这正是 p61 不可辨识的来源：监督信号只约束了两支的和。</b>"], "quote": "Advantage function: <b>A^π(s,a) = Q^π(s,a) − V^π(s)</b> &nbsp;·&nbsp; <b>Dueling DQN</b>: use two separate heads to estimate V(s;w) and A(s,a;w), then combine &nbsp;·&nbsp; Intuition: <b>features needed to determine value may be different from those needed to determine action benefit</b>"},
{"r": [61, 62], "t": "可辨识性问题", "star": 3, "one": "<code>Q = V + A</code> 是<b>不可辨识</b>的：V 加一个常数、A 减同一个常数，Q 不变。", "eq": "做法一（强制被选动作的 A 为 0）：\n  Q̂(s,a;w) = V̂(s;w) + [ Â(s,a;w) − max_{a′} Â(s,a′;w) ]\n\n做法二（用均值当基线，更稳）：\n  Q̂(s,a;w) = V̂(s;w) + [ Â(s,a;w) − (1/|A|)·Σ_{a′} Â(s,a′;w) ]", "pts": ["所以必须<b>额外钉一个约束</b>，否则两条支路各自的值毫无意义。", "<span class='k'>课件说做法二更稳</span>，这也是实践中常用的那个。", "<b>不可辨识的反例三秒钟就能构造：<span class='k'>把 <code>V</code> 整体加上常数 <code>c</code>，把每个 <code>A</code> 整体减去 <code>c</code>，<code>Q</code> 一点没变</span>。</b><b>所以给定 Q，V 和 A 有无穷多组。</b><span class='w'>根子在于监督信号的维度不够</span>——<b>你要定 <code>|A|+1</code> 个数，而目标只给了 <code>|A|</code> 个约束（每个动作的 Q）。</b><span class='k'>少一条约束就多一个自由度。</span>", "<b>这件事不是理论洁癖，它在数值上真的危险。</b><span class='w'>网络会沿着这个自由度随意漂移——两支的输出可以一起涨到很大而 Q 不变</span>。<b>而极大的中间量会带来数值不稳定和梯度问题。</b><span class='k'>所以必须钉死它。</span>", "<b>两种钉法的差别比看上去大，而课件括号里那句 <em>more stable</em> 值得解释。</b><span class='k'>最大值版：<code>V̂</code> 恰好等于 <code>max_a Q̂</code>，语义干净</span>；<span class='w'>但 max 只由一个动作决定，那个动作一换，整条基线就跳一下</span>。<span class='k'>均值版：基线由所有动作平均决定，换一个动作只动 <code>1/|A|</code>，稳得多</span>；<span class='w'>代价是 <code>V̂</code> 不再等于 <code>max Q̂</code>，只是「差一个未知常数」</span>。<b>而你真正要的是 <code>arg max_a Q̂</code>，差一个常数不影响选哪个动作</b>——<span class='k'>所以这笔「用语义正确换数值稳定」的交易是划算的。</span>", "<b>这一页和 L07 p43 之间有一条值得记住的呼应。</b><span class='k'>「不可辨识」这个词在 L07 里会再出现一次——那里是「能解释同一个最优策略的奖励函数有无穷多个」</span>。<b>两次的病因完全一样：你要解的东西比约束多了一个自由度。</b><span class='w'>两次的药方也一样：自己定一条规范把那个自由度钉死</span>，<b>而且定法会影响结果。</b><span class='k'>认出这个结构，你以后碰到任何「解不唯一」的情形都知道该干什么。</span>"], "quote": "<b>Identifiability</b>: Given Q, is there a unique A and V? &nbsp;·&nbsp; <b>Unidentifiable: given Q not a unique A and V</b> &nbsp;·&nbsp; Option 1: Force A(s,a) = 0 if a is action taken: <b>Q̂ = V̂ + Â − max_{a′} Â</b> &nbsp;·&nbsp; Option 2: Use mean as baseline (<b>more stable</b>): <b>Q̂ = V̂ + Â − (1/|A|) Σ_{a′} Â</b>", "tbl": {"head": ["定规范的方式", "式子", "<code>V̂</code> 的语义", "稳定性"], "rows": [["最大值版", "<code>V̂ + Â − max_{a′} Â</code>", "<span class='k'>= <code>max_a Q̂</code>，干净</span>", "<span class='w'>基线由单个动作决定，会跳</span>"], ["均值版", "<code>V̂ + Â − mean_{a′} Â</code>", "<span class='w'>差一个未知常数</span>", "<span class='k'>基线由全体平均，平滑（课件注 more stable）</span>"], ["<b>不定规范</b>", "<code>V̂ + Â</code>", "—", "<span class='w'>两支可同时漂移，数值危险</span>"]]}},
{"r": [63, 63], "t": "Dueling 的效果", "one": "在「Double DQN + 优先回放」之上再涨一截。", "pts": ["图出自 Wang et al., ICML 2016。<b>三个改进是叠加的</b>：DQN &lt; Double DQN &lt; +优先回放 &lt; +Dueling。", "<b>「动作越多提升越明显」这个规律，正好印证了前面说的样本效率解释。</b><span class='k'>因为分解的好处是「一次更新同时改善所有动作的估计」，而动作越多，被顺带改善的就越多</span>。<b>如果提升的来源是「两组特征分工」，那就不该和动作数这么相关。</b><span class='w'>所以实验结果在这里支持了样本效率那个解释</span>——<b>这是一个用「效果随什么变化」来区分竞争性解释的好例子。</b>", "<b>不过 Rainbow 的消融给了一个更冷静的结论，值得一并记住。</b><span class='w'>在六个组件一起用的情况下，dueling 单独去掉掉分不多</span>（<b>L07 p15</b>）。<span class='k'>原因可能是：它买到的样本效率，被优先回放和多步回报买到的那部分盖过去了</span>。<b>这提醒你：单独测试时很有用的改进，在组合里可能是冗余的。</b><span class='w'>这也是为什么消融要在「全上然后去掉一个」的设定下做，而不是「一次加一个」。</span>", "<b>顺带提一句这个结论在你自己做实验时的用法。</b><span class='k'>「效果随某个因素（这里是动作数）单调变化」是支持某个机制解释的有力证据</span>——<b>比「平均提升了 X%」有说服力得多。</b><span class='w'>所以当你提出一个改进时，不妨问：如果我的解释是对的，那么效果应该随什么变化？然后去验证它。</span>"], "quote": "Dueling DQN improves over Double DQN on most Atari games, especially those with many actions"},
{"r": [64, 66], "t": "实操建议（来自 John Schulman）", "star": 3, "one": "课件最后三页全是踩坑经验。", "pts": ["<b>拿 Pong 当体检</b>：DQN 在它上面很可靠，跑不出好成绩就是哪里错了。", "<b>回放池越大越稳</b>，所以内存效率是关键：用 uint8 存图，别重复存数据。", "<b>要有耐心</b>：Atari 常要 1000–4000 万帧（GPU 上几小时到一天）才明显好过随机策略。", "对贝尔曼误差试 <b>Huber 损失</b>：<code>|x| ≤ δ</code> 时用 <code>x²/2</code>，否则用 <code>δ|x| − δ²/2</code>。", "<b>至少跑两个随机种子</b>；学习率做调度，早期探索阶段可以调高。", "想检验你的预处理，就<b>自己照着处理后的画面玩一局</b>。", "<b>这几条建议的共同立场值得先说破：<span class='k'>它们都在假设「你会失败很多次」</span>。</b><b>先在 Pong 上体检、跑两个种子、用 Huber 兜住离谱梯度</b>——<span class='w'>这些不是提高上限的手段，是降低单次失败代价的手段</span>。<span class='k'>而「允许失败很多次」本身就是一个前提</span>，<b>仿真里成立，现实里往往不成立。</b>", "<b>「拿 Pong 当体检」是一条关于「可证伪」的建议，而它是这几条里最该照做的。</b><span class='w'>深度 RL 最难受的地方是失败没有信号</span>——<b>曲线不涨，你分不清是实现有 bug、超参不对、还是任务本来就难。</b><span class='k'>Pong 提供一个「已知应该成功」的基准：它跑不出分，就一定是代码有问题</span>。<b>先建立一个能证伪的测试，再去碰难任务——这条习惯比任何超参都值钱。</b>", "<b>Huber 损失那条和自举直接相关，值得把式子摊开。</b><code>L(x) = x²/2</code>（<code>|x| ≤ δ</code>），<code>L(x) = δ|x| − δ²/2</code>（否则）。<span class='k'>关键在导数：平方段的导数是 x，线性段被钉死在 ±δ</span>。<b>于是无论贝尔曼误差多大，单个样本能推动权重的力气有上限。</b><span class='w'>而贝尔曼误差的离群值不是噪声、是结构性的</span>——<b>自举目标本身是估计，训练早期可以离谱到任意程度。</b>", "<b>「至少两个种子」是这几条里最被低估的，而它的理由在深度 RL 里格外硬。</b><span class='w'>同一份代码、同一组超参，换个随机种子可能一个成功一个完全不动</span>。<span class='k'>单种子的曲线不构成证据</span>。<b>老师说「至少两个」是课堂上的底线，不是推荐值</b>——<span class='w'>发表用的实验通常要更多，而且报告的是分布而不是最好的那条。</span><b>这一条和 p45 那张消融表是配套的：那张表之所以可信，正是因为它在多个游戏上都成立。</b>", "<b>剩下几条快速过一遍，但注意它们共同指向同一件事：数据便宜但不是免费。</b><span class='k'>回放池要大 ⇒ 用 <code>uint8</code> 存图、不要重复存帧</span>——<b>内存效率直接决定你能存多少经验，而经验量决定相关性被打散的程度。</b><span class='k'>学习率要有调度 ⇒ 早期探索阶段用大学习率</span>，<b>因为那时目标本来就不准，精细拟合毫无意义。</b><span class='w'>而「等 10–40M 帧」这一条本身就是「这玩意儿太费数据」的证词</span>——<b>它正是 L07 p17 那句「我们还缺效率」的实证来源。</b>"], "say": "老师特别强调作业的顺序：<b>先把线性情形的 Q-learning 跑通</b>，再上 Atari。「不然你要等十二个小时才发现 Pong 什么都没学到。」", "quote": "Practical Tips for DQN on Atari (from J. Schulman) &nbsp;·&nbsp; <b>Pong is a reliable task</b>: if it doesn't achieve good scores, something is wrong &nbsp;·&nbsp; <b>Large replay buffers improve robustness</b>; use uint8 images, don't duplicate data &nbsp;·&nbsp; <b>Be patient</b>: for ATARI often necessary to wait for 10-40M frames &nbsp;·&nbsp; Try <b>Huber loss</b> on Bellman error &nbsp;·&nbsp; <b>Always run at least two different seeds</b> &nbsp;·&nbsp; Learning rate scheduling is beneficial", "tbl": {"head": ["建议", "在防什么", "背后的原理"], "rows": [["先跑 Pong", "<b>分不清是 bug 还是任务难</b>", "<span class='k'>先要一个能证伪的基准</span>"], ["Huber 损失", "一个离谱的自举目标把网络推坏", "<b>梯度有上界 ±δ</b>"], ["回放池尽量大 · uint8", "相关性没被打散", "内存效率 → 经验量 → 独立性"], ["至少两个种子", "<span class='w'>把运气当成结论</span>", "深度 RL 的种子间方差极大"], ["耐心等 10–40M 帧", "过早判死刑", "<b>这条本身就是「缺效率」的证词（L07 p17）</b>"]]}},
{"r": [67, 68], "t": "这一讲讲完了", "one": "上一讲：值函数逼近；这一讲：带函数逼近的 RL、深度 RL。", "pts": ["作业二要实现的是 <b>DQN</b>，不是那三个改进；但知道它们存在很有必要。", "<b>把这一讲的脉络收一次，它是一条「失去保证、再把稳定性补回来」的路。</b><span class='k'>① 线性 VFA 有保证，但特征得手工设计（p8）；② 换成深度网络，特征自动学了，但保证没了（p31）；③ 两个工程补丁把实践中的稳定性补回来（p38、p40）；④ 三个小改进再榨一点性能（p46 起）</span>。<b>全程没有一条新定理。</b>", "<b>而课件要求的那两条，自查一遍就知道这一讲学到没有。</b><span class='k'>① 能实现 DQN</span>——<b>那意味着你知道：目标要 detach、损失只对实际执行的动作算、<code>w⁻</code> 要定期同步、回放池要存 <code>uint8</code>。</b><span class='k'>② 说得出几个超出 DQN 的扩展</span>——<b>而值钱的答法不是背出名字，是说得出每个改的是哪一环：目标里的偏差（Double）、样本怎么抽（优先回放）、网络怎么搭（dueling）。</b>", "<b>最后把这一讲放回整门课，它的位置其实有点特别。</b><span class='w'>前五讲都在建立理论，这一讲几乎全是工程</span>；<span class='k'>而下一讲（模仿学习）会从另一个角度回来——既然样本效率是瓶颈，那就换一种监督信号</span>。<b>所以这一讲的结论（Rainbow 仍然要两亿帧）正是下一讲的出发点。</b><span class='w'>读完这一讲之后再去看 L07 p17 那句「我们还缺一样：效率」，你会觉得它来得非常自然。</span>", "<b>最后把这一讲和 L05 的关系说清楚，因为两讲常被混在一起记。</b><span class='k'>L05 回答「函数逼近下会出什么问题」——给出的是理论（致命三件套、收敛表）</span>；<span class='k'>L06 回答「那怎么还是把它跑起来了」——给出的是工程（两个补丁加三个改进）</span>。<b>两讲合起来才完整：知道风险在哪，也知道实践中怎么绕。</b><span class='w'>只读 L05 会觉得深度 RL 不可能成功，只读 L06 会以为那些理论顾虑无关紧要</span>——<b>两种印象都不对。</b>", "<b>再给一条这一讲最该带走的方法论，它超出 RL：<span class='k'>当理论说「这个组合危险」而你仍然要用它时，该做的是找出危险的具体机制，然后逐条堵住</span>。</b><b>DQN 做的正是这件事：三件套里的「自举」带来「目标在动」，就冻住目标；在线数据带来「样本相关」，就建回放池。</b><span class='w'>它没有推翻理论，它是在理论指出的每一个具体危险上打补丁</span>。<b>而没堵住的那一条（off-policy）它也没假装堵住了。</b>", "<b>收尾再提一句这一讲在整门课里承上启下的位置。</b><span class='k'>承上：它是 L05「函数逼近会出什么事」的实践回应</span>；<span class='k'>启下：它的结论（即使 Rainbow 也要两亿帧）正是 L07 开场那句「我们还缺一样：效率」的来源</span>。<b>而 L07 给的答案是换一种监督信号（模仿学习），L08 给的是换一条路线（直接优化策略）。</b><span class='w'>三讲连起来读，你会看到同一个瓶颈被从三个方向反复进攻。</span>"], "quote": "Summary &nbsp;·&nbsp; Deep networks are highly expressive function approximators &nbsp;·&nbsp; You should be able to implement DQN and describe several extensions beyond it"}
];

var TH = {"title": "L06 接上课题的哪一段：它主要教的是「怎么做一张诚实的消融表」", "arc": "<b>先把话说在前面：这一讲和你的课题的直接联系，比 L04、L07、L09 都要弱，任务清单那条「科研连接弱」的预期对 L06 基本成立。</b><span class='w'>它讲的是怎么把深度网络塞进 Q-learning 并让它别崩——而你既不训网络，也不做在线学习</span>。<b>所以这一讲只放了两条科研格，而不是硬凑五条。</b><br><br><b>但它有两样东西是真的能拿走的。</b><br><br><b>第一样在 p45：<span class='k'>那张消融表是一张可以照着抄的模板</span>。</b><span class='w'>五个游戏 × 五种配置（基线、只换表示、只加补丁 A、只加补丁 B、全加）</span>——<b>每个补丁都有<b>单独</b>的一列。</b><span class='k'>正因为有那两列，才看得出「回放的贡献远大于固定目标」（Breakout：10 vs 241）</span>；<b>只报「全加 vs 不加」的话，这个结论就被埋掉了。</b><span class='w'>更值得学的是：它敢报告「深度网络那一列常常还不如线性」</span>——<b>一个让自己主要卖点难看的数字被原样放进论文，而正是它让结论有了说服力。</b><br><br><b>第二样在 p53：<span class='k'>同样一批数据，处理顺序可以带来指数级差别</span>。</b><b>而那个 oracle 实验的意义是给出「如果你能聪明地选，最多能省多少」的上界。</b><span class='w'>翻译到你这里，对应的不是「回放顺序」，而是「下一个该实跑哪个配置」</span>——<b>你的预算有限，而挑哪些去实跑本身就是一个决策问题。</b><span class='k'>详见 p53 的科研格，那里给了两条可以照搬的思路。</span><br><br><b>另外，这一讲的 p61（<code>Q = V + A</code> 不可辨识）和 p64（实操建议）在 L07.a 已经作为复习讲过</b>——<span class='w'>这里是原始出处，内容更细，但结论相同，不重复列科研格。</span>", "pitfalls": [{"v": "<b>只报「我们的方法 vs 基线」。</b> <span class='k'>p45 的表之所以有说服力，是因为每个组件都有单独的一列</span>。<span class='w'>只报全加和不加，你就证明不了「是哪个组件起的作用」</span>——<b>而审稿人恰恰会问这个。</b><span class='k'>照搬到你的工作：基线、只换估计器、只加难度分层、只加样本拆分、全加。</span>", "tag": "推断", "ref": "课件 p45 消融表 · 本讲 p45 科研格"}, {"v": "<b>把难看的格子藏起来。</b> <span class='w'>p45 老老实实报告了「深度网络单独用反而不如线性」</span>——<b>而正是这个数字让「补丁才是关键」这个结论站得住。</b><span class='k'>如果某个设计单独用反而更差，照实报，并解释它为什么只在组合里起作用</span>；<b>一张全是绿色的表反而可疑。</b>", "tag": "推断", "ref": "课件 p45（Linear 列常高于 Deep Network 列）"}, {"v": "<b>只报最终指标，不报「你的解释所预测的中间量」。</b> <span class='k'>Double DQN 论文除了分数，还画了 Q 估值曲线——证明高估真的降了</span>。<span class='w'>如果只报分数，任何改进都可以被归因到任何原因</span>。<b>你声称改进来自降偏差，就该展示偏差真的降了。</b>", "tag": "推断", "ref": "课件 p50 · L05 p43（该监控权重范数与预测量级）"}, {"v": "<b>把「TD 误差大」当成「这里该多学」。</b> <span class='w'>误差大也可能是那个样本本身随机性大，再怎么学也降不下去</span>。<span class='k'>优先回放会把更新浪费在「本质上不可预测」的样本上</span>——<b>这也是为什么 α 通常不取 1。</b><span class='w'>同理：你按「FQE 估值高」去挑配置实跑时，也要分清「它真的好」和「它的估计碰巧偏高」</span>（<b>接 L04 p42 的最大化偏差</b>）。", "tag": "推断", "ref": "课件 p55 · L04 p42"}, {"v": "<b>以为 DQN 的两个补丁解决了 L05 的三件套。</b> <span class='k'>它们没修 off-policy 那一条——三件套仍然齐全</span>。<b>DQN 的稳定性是工程成果而不是理论成果。</b><span class='w'>所以「DQN 能跑起来」不能当作「三件套不要紧」的证据</span>，<b>你的 FQE 该有的顾虑一条都不能少。</b>", "tag": "已核", "ref": "课件 p37 · L05 p38 · 任务清单 kp"}], "ammo": [{"q": "你们的消融做得够不够？", "a": "<b>我们按 DQN 原论文那张消融表的结构做的。</b><span class='k'>每个设计都有单独的一列，而不是只报「全加 vs 不加」</span>——<b>因为只有单独那几列才能回答「是哪个组件起的作用」。</b><span class='w'>而且我们如实报告了单独用时反而更差的那些格子</span>，<b>并解释了它们为什么只在组合里起作用。</b>", "tag": "推断", "ref": "课件 p45 · 本讲 p45 科研格"}, {"q": "你们怎么决定下一批实跑哪些配置？", "a": "<b>这是一个值得专门设计的决策，而不是随机挑。</b><span class='k'>CS234 L06 p53 的 oracle 实验显示：同样一批数据，按最优顺序处理与随机顺序之间，收敛所需的更新次数可以差指数级</span>。<b>我们因此按「估值高 × 覆盖率低」排序——估值高说明它可能是赢家，覆盖率低说明我们对它最不确定。</b><span class='w'>而且我们先在一个小规模设定上做了 oracle 对照，确认主动选择相对随机选择确实有增益。</span>", "tag": "推断", "ref": "课件 p53（Schaul et al. ICLR 2016）· 本讲 p53 科研格"}, {"q": "DQN 不是证明了三件套的顾虑可以忽略吗？", "a": "<b>没有。</b><span class='k'>DQN 的两个补丁修的是「样本相关」和「目标在动」，<b>没有</b>修 off-policy 那一条——三件套仍然齐全</span>。<span class='w'>它的稳定性是工程成果而不是理论成果</span>，<b>而且它用了几千万帧的数据来换这个稳定性。</b><span class='k'>我们的数据量小几个数量级，所以不能指望同样的工程手段起同样的作用。</span>", "tag": "已核", "ref": "课件 p37 p45 · L05 p38"}], "papers": [{"t": "Mnih et al. — Human-level control through deep reinforcement learning", "id": "Nature 2015", "why": "这一讲的主要出处，p45 那张消融表就在它的 Extended Data 里。<b>对你最有用的不是算法，是它的<b>实验设计</b></b>——<span class='k'>固定超参跑几十个任务、每个组件单列一列、如实报告难看的格子</span>。"}, {"t": "Schaul, Quan, Antonoglou &amp; Silver — Prioritized Experience Replay", "id": "ICLR 2016", "why": "p53–p55 的出处。<b>那个 oracle 实验（按最优顺序回放有指数级改进）值得细读</b>——<span class='k'>它是「先用 oracle 证明这件事值得做，再找可算的近似」这个研究范式的范本</span>，<span class='w'>而这个范式你可以直接搬到「该实跑哪些配置」上。</span>"}, {"t": "van Hasselt, Guez &amp; Silver — Deep Reinforcement Learning with Double Q-learning", "id": "AAAI 2016", "why": "p47–p51 的出处。<b>除了算法，它那张「Q 估值曲线」值得学</b>——<span class='k'>它不只报分数，还报告了「理论所预测的中间量」是否真的变了</span>，<b>这是机制验证的标准做法。</b>"}, {"t": "Wang et al. — Dueling Network Architectures for Deep Reinforcement Learning", "id": "ICML 2016（best paper）", "why": "p59–p63 的出处。<b>它的实验显示提升随动作数增长</b>——<span class='k'>而这正好支持「好处来自样本效率」这个解释，排除了「两组特征分工」那个竞争性解释</span>。<span class='w'>用「效果随什么变化」来区分解释，是一个值得学的实验手法。</span>"}, {"t": "Hessel et al. — Rainbow: Combining Improvements in Deep Reinforcement Learning", "id": "AAAI 2018", "why": "把这一讲的三个改进连同另外三个一起上，并做了完整消融。<b>它的结论对你有用：优先回放和多步回报掉分最狠，而 Double DQN 单独去掉几乎不掉分</b>——<span class='k'>说明技巧之间会互相覆盖，「每个都有用」不等于「每个都该加」</span>。<span class='w'>而且它用的是「全上再去掉一个」的消融方式，比「一次加一个」更可靠。</span>"}]};
