<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第六讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs234-2019-l06">

<div id="bar">
  <h1>CS234 第六讲 · <span>卷积网络与深度 Q 学习：DQN 及其三个改进</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 68</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture6.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L06-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "这一讲和上一讲的关系是？", "o": ["推翻上一讲", "把上一讲的函数逼近器从线性换成深度网络", "改讲策略梯度", "回到表格表示"], "a": 1, "why": "CNN 那一节只是交代背景，重点全在深度 Q 学习。"}],
4: [{"q": "「泛化」在 RL 里的实际含义是什么？", "o": ["能处理连续动作", "不用存那么多数", "在状态 A 上学到的东西能自动改善你对状态 B 的估计，而依据是「A 和 B 在你的表示下像」", "算法收敛更快"], "a": 2, "why": "所以表示决定了「哪些状态被认为相像」——这是你注入先验知识的地方，也是你犯错的地方（L08 p10 的混叠）。"}],
8: [{"q": "线性 VFA 的天花板在哪？", "o": ["特征要你自己手工设计出来", "计算太慢", "只能用于小状态空间", "不能做控制"], "a": 0, "why": "出路是换一个「直接从状态出发、不用显式指定特征」的更丰富的函数类。"}, {"q": "课件说线性 VFA 效果可以很好，但加了什么前提？", "o": ["given enough data", "given the right set of features——而猜对那组基完全靠你对问题的理解", "given a convex reward", "given a small state space"], "a": 1, "why": "L05 p26 保证你能达到「这组特征的上限」，而那个上限是你自己定的。特征选差了，算法再好也没用。"}, {"q": "课件为什么放弃核方法这条路？", "o": ["核方法没有收敛保证", "核方法需要知道转移模型", "核方法不能处理连续状态", "核方法有收敛结果，但代价随样本数增长，撑不住大规模数据"], "a": 3, "why": "这是一笔明确的交易：用「有保证但不可扩展」换「可扩展但没保证」。"}, {"q": "「深度网络自动学特征」是不是意味着不需要人的设计了？", "o": ["是，只要数据够多", "是，完全自动", "不是——设计的层次变了：你不再设计特征，但要设计网络结构", "不是，仍然要手工特征"], "a": 2, "why": "CNN 的四个想法正是一次针对图像的结构设计。人的先验被从特征层面挪到了结构层面，不是消除了。"}],
9: [{"q": "老师说过去几年真正的变革是什么？", "o": ["自动微分——不用再手推每一层的梯度", "ReLU", "更多数据", "更快的 GPU"], "a": 0, "why": "她说当年要手推反向传播，「所以那是一份不太受欢迎的作业」。"}, {"q": "ReLU 有一半区域是平的，梯度为 0，这算问题吗？", "o": ["算，所以要配 sigmoid", "不算，因为它处处可微", "算，所以不能用", "梯度就是 0，没问题；但很深的网络确实会有梯度消失"], "a": 3, "why": "梯度消失这门课不展开，但值得知道。"}, {"q": "「万能逼近器」这个说法保证了什么、没保证什么？", "o": ["保证能找到最优解", "保证收敛速度", "保证泛化", "保证表达力（存在一组权重能逼近），不保证你能找到它，也不保证需要多少数据"], "a": 3, "why": "优化是另一回事，而且目标函数非凸。这个区分在 L05 p46 那句话里出现过。"}, {"q": "分布式表示相对局部表示，好处和坏处分别是什么？", "o": ["好处是泛化（改一个单元影响很多概念），坏处也是它（学新东西会干扰旧东西）", "好处是无偏，坏处是高方差", "好处是可解释，坏处是参数多", "好处是省内存，坏处是慢"], "a": 0, "why": "后者就是灾难性遗忘。表格是局部表示的极端情形——每个状态一个格子，互不干扰。"}],
11: [{"q": "深度网络的「万能逼近」性质，对上一讲的哪个问题是个正面回答？", "o": ["「线性类可能装不下真值」——节点够多时这个限制原理上消失", "探索", "收敛性", "计算效率"], "a": 0, "why": "但代价是：上一讲的收敛保证全建立在线性之上，这里全没了。"}],
14: [{"q": "1000×1000 的图接全连接层，一个隐藏单元要多少权重？", "o": ["10⁶", "25", "1000", "10³"], "a": 0, "why": "再并联几百个就不现实了。更要命的是这完全没用上图像结构。"}, {"q": "200×200×3 的图像，一个全连接神经元有多少权重？", "o": ["40000", "600", "120000", "一百万"], "a": 2, "why": "一层一千个这样的神经元就是一亿两千万参数，而这还只是第一层。"}, {"q": "参数多的真正问题是什么？", "o": ["存储放不下", "数据需求——参数越多需要的样本越多，而 RL 的数据要靠和环境交互换", "计算太慢", "梯度会爆炸"], "a": 1, "why": "所以「削减参数」在 RL 里省下来的不是显存，是交互次数。"}, {"q": "全连接网络除了参数多，还浪费了什么？", "o": ["它把像素当成互不相干的数，于是同一个模式在不同位置必须分别学一遍", "它需要更多的层", "它无法处理彩色图像", "它不能并行"], "a": 0, "why": "这不只是浪费参数，是浪费数据。卷积的权重共享正好消除这一项。"}],
17: [{"q": "CNN 四个想法里，削减参数的主力是哪两个？", "o": ["权重共享和池化", "多层和局部连接", "池化和多层", "局部连接和权重共享"], "a": 3, "why": "两条合起来，参数量从「随图像大小增长」变成了常数。后两个是辅助。"}, {"q": "局部连接和权重共享各自编进去了什么先验？", "o": ["两者都不编先验", "两者编的是同一个先验", "局部连接编「局部相关」，权重共享编「平移不变」", "局部连接编「平移不变」，权重共享编「局部相关」"], "a": 2, "why": "两条都是关于图像的假设。换个输入类型（比如一行表格数据），两条都不成立，卷积就不该用。"}, {"q": "如果四个想法只能留一个，该留哪个？", "o": ["多层", "局部连接", "权重共享——它让参数量与图像大小彻底脱钩，而且自带数据增强效果", "池化"], "a": 2, "why": "局部连接次之（它是权重共享的前提）；池化最可有可无，今天很多网络用步长>1 的卷积代替它。"}],
19: [{"q": "28×28 输入、5×5 感受野、步长 1，隐藏层是多大？需要多少权重？", "o": ["24×24，24×24 个权重", "28×28，784 个权重", "5×5，25 个权重", "24×24，但只要 25 个共享权重"], "a": 3, "why": "对比全连接的 10⁶ 个权重——这就是权重共享省下的量。"}, {"q": "「单层感受野」和「有效感受野」的区别是什么？", "o": ["单层针对卷积，有效针对池化", "单层是输入侧，有效是输出侧", "单层是滤波器大小；有效是这个神经元最终受输入图多大一块影响，随层数累积", "没有区别"], "a": 2, "why": "两层 3×3 叠起来，有效感受野是 5×5。深度网络靠这个累积，用很小的滤波器达到很大的视野。"}, {"q": "权重共享还有一个常被忽略的好处，是什么？", "o": ["同一组权重在每个位置都被用到，梯度是所有位置之和——相当于一张图提供了上千个样本", "计算更快", "梯度更稳定", "更容易并行"], "a": 0, "why": "这是「数据增强」的一种内生形式，也是卷积网络在小数据上也能训得动的主要原因。"}, {"q": "DQN 第一层卷积用步长 4，除了省计算还为了什么？", "o": ["快速扩大感受野——步长会让视野以乘性增长", "增加参数", "提高分辨率", "减少通道数"], "a": 0, "why": "所以 DQN 只用三层卷积就覆盖了整张 84×84 的图；全用步长 1 的话要堆几十层。"}],
23: [{"q": "整张图共用同一组权重，为什么合理？", "o": ["梯度更稳", "图像是方的", "在某处能认出竖直边缘的本事，在图像别处同样有用——由此得到平移不变性", "省内存"], "a": 2, "why": "灵感来自视觉系统。深度学习之前，CV 花了大力气手工设计这类不变特征（如 SIFT）。"}, {"q": "第二层卷积的滤波器形状是什么？", "o": ["<code>k×k</code>", "<code>5×5</code>", "<code>5×5×k</code>（k 是上一层的滤波器数）", "<code>5×5×1</code>"], "a": 2, "why": "因为它要同时看上一层产出的 k 张特征图。这是实现时最容易搞错的地方。"}, {"q": "典型 CNN 里，张量形状变化的规律是什么？", "o": ["空间尺寸递减，深度递增——越往深「在哪里」越不重要，「是什么」越重要", "空间尺寸和深度都递增", "空间尺寸和深度都递减", "空间尺寸递增，深度递减"], "a": 0, "why": "DQN：84×84×4 → 20×20×32 → 9×9×64 → 7×7×64 → 展平 3136 → 512 → 18。"}],
26: [{"q": "CNN 最后一层通常全连接，这一步在做什么？", "o": ["把前面算出的新特征表示拿来做线性回归，输出标量", "归一化", "卷积", "池化"], "a": 0, "why": "前半部分可看成「在算一套特征」，最后一层正好接回上一讲的线性 VFA。"}, {"q": "原始 DQN 用了池化层吗？", "o": ["每层都用", "用了 average pooling", "用了 max pooling", "没用——靠步长大于 1 的卷积降维"], "a": 3, "why": "原因可能是池化的平移容忍在这里有害：球的精确位置很重要。"}, {"q": "CNN 的全部内容可以概括成什么？", "o": ["用池化换平移不变", "用更多的层换表达力", "用结构上的假设换参数量", "用非线性换表达力"], "a": 2, "why": "假设是局部相关 + 平移不变，换来参数量与图像大小脱钩。这是 L07 p18「用结构约束」的一个实例。"}],
31: [{"q": "普通 DQN 的更新式里，右边出现的 <code>w</code> 有几组？", "o": ["只有一组——当前值、未来值估计、梯度全用它", "两组", "三组", "取决于实现"], "a": 0, "why": "p40 的固定 Q 目标要动的正是这一点。"}, {"q": "DQN 的网络为什么设计成「输入状态，输出 |A| 个 Q 值」？", "o": ["这样参数更少", "这是唯一可行的设计", "一次前向传播就拿到所有动作的 Q，于是 max 和 arg max 都是免费的", "这样更容易并行"], "a": 2, "why": "用「输入 (s,a) 输出一个 Q」的话，每次取 max 都要做 |A| 次前向传播，而每次更新都要取一次 max。"}, {"q": "实现 DQN 时最经典的坑是什么？", "o": ["忘了归一化输入", "学习率设得太大", "池子容量设得太小", "忘了把目标 detach——目标里也含 Q̂(s′,a′;w)，不能让梯度流过去"], "a": 3, "why": "这就是 L05 p29 说的「半梯度」。忘了 detach 的话你算的是另一个目标函数（残差梯度），行为完全不同。"}, {"q": "损失只对哪个动作计算？", "o": ["对最优动作和执行动作两个", "只对实际执行过的那个动作 a，其余输出的梯度是 0（用 one-hot 掩码屏蔽）", "所有 18 个动作", "只对 Q 最大的那个动作"], "a": 1, "why": "忘了屏蔽的话，网络会被推着把所有动作的 Q 都拉向同一个目标，完全学错。"}],
34: [{"q": "Atari 上 DQN 的状态为什么是<b>四帧</b>而不是一帧？", "o": ["为了对齐动作", "为了省内存", "单帧看不出速度，而很多游戏必须知道球往哪飞", "为了降噪"], "a": 2, "why": "四帧也未必够——蒙特祖玛的复仇那类要记住「钥匙已拿到」的游戏就不行。"}, {"q": "「同一套结构和超参数跑通 50 个游戏」，共享的是什么？", "o": ["学到的权重", "奖励函数", "回放池", "网络结构和超参数；每个游戏仍各自从零学一份 Q 和策略"], "a": 3, "why": "这是这篇论文真正的卖点：不必为每个游戏各调一套。"}, {"q": "「最近四帧叠起来」这个设计解决什么、又解决不了什么？", "o": ["解决了速度信息（单帧看不出球往哪飞），但装不下更长的历史", "什么都解决了", "解决了奖励稀疏，但探索不够", "解决了颜色信息，但分辨率不够"], "a": 0, "why": "蒙特祖玛里「有没有拿到钥匙」可能发生在几百帧之前，四帧窗口看不到——那类游戏在 DQN 的表示下不马尔可夫。"}, {"q": "原论文把奖励裁剪到 {−1,0,+1}，代价是什么？", "o": ["丢掉了幅度信息，算法分不清「小胜」和「大胜」", "没有代价", "丢掉了负奖励", "丢掉了折扣"], "a": 0, "why": "这是为了让超参在所有游戏上通用而做的取舍——典型的「为通用性牺牲最优性」。"}, {"q": "「所有游戏用同一套结构和超参」为什么是重要的方法论贡献？", "o": ["这样代码更简单", "这是论文格式的要求", "这样训练更快", "允许每个游戏单独调参的话，你不知道是算法好还是调参好"], "a": 3, "why": "固定超参之后剩下的差异才真的来自算法。违反它（在每个任务上单独调）是这个领域最常见的方法论问题。"}],
37: [{"q": "让 Q-learning + 深度网络容易崩的两个问题是？", "o": ["学习率、批量大小", "样本之间高度相关、目标一直在动", "探索不足、奖励稀疏", "方差大、偏差大"], "a": 1, "why": "DQN 的两招正是各治一个：经验回放治相关性，固定 Q 目标治非平稳。"}, {"q": "「目标非平稳」具体指什么？", "o": ["奖励在变", "目标 y 是你自己当前的 Q 算出来的，你一改权重它就变", "环境在变", "状态分布在变"], "a": 1, "why": "监督学习里 y 是固定的，这里不是——所以拟合起来格外难。"}, {"q": "两个病理分别破坏了监督学习的哪个前提？", "o": ["样本相关破坏「样本 i.i.d.」；目标在动破坏「标签固定」", "样本相关破坏「标签固定」；目标在动破坏「样本 i.i.d.」", "两者都破坏「样本 i.i.d.」", "两者都破坏「标签固定」"], "a": 0, "why": "而经验回放修前者、固定目标修后者——这个一一对应就是 DQN 的全部设计思想。"}, {"q": "两个补丁修了 L05 三件套里的哪几条？", "o": ["三条全修了", "只修了函数逼近那一条", "都没修——只是让实践中不发散", "只修了自举那一条的危害；off-policy 那一条没修，三件套仍然齐全"], "a": 3, "why": "所以 DQN 的稳定性是工程成果而不是理论成果。kp 那句「哪一条没治」说的就是这个。"}],
38: [{"q": "同一条 tuple 被反复重放，每次的更新为什么不一样？", "o": ["因为随机性", "因为 α 在变", "因为 γ 在变", "因为 Q 已经变了，算出来的目标值也就不同"], "a": 3, "why": "朴素 TD/Q-learning 一条数据用一次就扔，省内存但极浪费。"}, {"q": "经验回放和「状态里多存几帧」是一回事吗？", "o": ["只在 tabular 下是", "不是：多存帧是改状态表示，回放是把旧数据再用一遍", "只在 Atari 上是", "是"], "a": 1, "why": "课上专门有人问到这一点。"}, {"q": "经验回放除了打散相关性，更重要的作用是什么？", "o": ["降低计算量", "消除偏差", "减少内存占用", "数据复用——同一条转移可以被抽中几十次，于是同样的交互次数产生几十倍的梯度更新"], "a": 3, "why": "p45 的消融会显示回放的作用大得多，而这正是主要原因。它真正解决的是「深度网络缺数据而交互很贵」。"}, {"q": "回放池为什么对 Q-learning 可行、对 SARSA 不可行？", "o": ["SARSA 收敛更慢", "Q-learning 只要 (s,a,r,s′) 四元组，max 不需要采样；SARSA 还要当时策略采出的 a′", "SARSA 不能用神经网络", "Q-learning 方差更小"], "a": 1, "why": "于是「off-policy」这个性质在这里第一次变成了实实在在的工程优势。"}],
40: [{"q": "固定 Q 目标为什么能提高稳定性？", "o": ["把目标 y 暂时钉住——监督学习里 y 不动才好拟合", "降低了学习率", "减小了方差", "避免了最大化偏差"], "a": 0, "why": "代价是信息往回传更慢：你在用一组过时的权重评估未来。"}, {"q": "<code>w⁻</code> 的同步周期 n 取极端值会怎样？", "o": ["n 不影响结果", "n 越大越好", "n=1 退回普通 TD，n=∞ 永不更新；中间是一条连续的取舍", "n=1 最稳"], "a": 2, "why": "这是个超参数，在「传得快」和「更稳」之间权衡。"}, {"q": "这两招带来收敛保证了吗？", "o": ["没有——只是经验上管用；Q-learning 这类本来就不是真正的梯度下降", "带来了", "线性时带来了", "配合 Double DQN 就有了"], "a": 0, "why": "更接近真梯度的算法（如 GTD）在 Sutton & Barto 第 11 章。"}, {"q": "固定 Q 目标做的事可以概括成什么？", "o": ["把 off-policy 变回 on-policy", "把非凸优化变回凸优化", "把有偏估计变回无偏", "把非平稳回归变回平稳回归"], "a": 3, "why": "冻住目标之后，在一个同步周期内它就是标准的监督回归：输入固定、标签固定。"}, {"q": "同步周期的取舍是什么？", "o": ["太短则目标还在动等于没冻；太长则目标严重过时、学习变慢", "越长越好", "越短越好", "和学习率无关"], "a": 0, "why": "原论文每一万步同步一次。另一种做法是软更新 w⁻ ← τw + (1−τ)w⁻，τ 很小。"}, {"q": "固定目标有没有解决最大化偏差？", "o": ["解决了", "它让偏差更严重", "部分解决", "没有——目标里仍有 max，而且选和评用的是同一组 w⁻，偏差没被解耦"], "a": 3, "why": "这正是 p47 的 Double DQN 要修的东西——把选用 w、评用 w⁻ 拆开。"}],
45: [{"q": "消融实验里，对 Breakout 提升最大的是哪一项？", "o": ["经验回放（10→241）", "换成深度网络（3→3）", "固定 Q 目标（3→10）", "三者相当"], "a": 0, "why": "回放是碾压性的。用完就扔数据是个很糟的做法。"}, {"q": "这张表里<b>没有</b>的一栏是？", "o": ["线性", "线性 + 回放 + 固定 Q", "深度网络", "回放且固定 Q"], "a": 1, "why": "课上有同学指出了这一点。老师承认这确实值得试——后面四栏全是深度网络。"}, {"q": "Breakout 上，只加固定目标和只加回放，分数分别从 3 变成多少？", "o": ["10 和 317", "10 和 241", "241 和 10", "317 和 10"], "a": 1, "why": "差了二十多倍。课件自己的结论是三个字：Replay is hugely important。"}, {"q": "消融表里「深度网络」那一列有什么值得注意的地方？", "o": ["它和线性持平", "它常常还不如「线性」那一列——光换成深度网络不加补丁，效果反而更差", "它总是最好的", "它只在两个游戏上有数据"], "a": 1, "why": "这是 L05 p38 那个警告的实证版本。深度网络的表达力只有在稳定性被补上之后才兑现得出来。"}, {"q": "课件留的那个问句（回放除了打散相关性还做了什么）答案是什么？", "o": ["降低方差", "加速收敛", "数据复用", "消除偏差"], "a": 2, "why": "同一条转移被抽中几十次，于是同样的交互次数产生几十倍的梯度更新。"}],
47: [{"q": "Double DQN 把哪两件事分给了不同的权重？", "o": ["选动作（用 w）和评估这个动作（用 w⁻）", "更新和采样", "探索和利用", "前向和反向"], "a": 0, "why": "治的是第四讲那个最大化偏差：估计值的 max 会系统性高估真值的 max。"}, {"q": "Double DQN 和 L04 的 Double Q-learning 有什么关键差别？", "o": ["前者的 w 和 w⁻ 来自同一批数据，噪声不真正独立——只是缓解不是消除", "前者用两张完全独立的表", "后者不需要两组权重", "两者完全等价"], "a": 0, "why": "它用「时间上的距离」近似「统计上的独立」，而近似的质量取决于同步周期有多长。"}, {"q": "Double DQN 的代价是多少？", "o": ["内存翻倍", "计算翻倍", "零——<code>w⁻</code> 本来就有（固定目标那个补丁带来的），改动只有一行", "需要额外的数据"], "a": 2, "why": "课件在 L07 p14 的说法是 significant improvement from small code change。"}, {"q": "同步周期上存在什么张力？", "o": ["周期长短与这些无关", "固定目标和 Double DQN 都希望周期长，而「目标不要太过时」希望周期短", "三个要求都希望周期短", "三个要求都希望周期长"], "a": 1, "why": "两个指向长、一个指向短——所以实践中周期会设得偏长（一万步）。"}],
50: [{"q": "Double DQN 论文里那条「Q 估值曲线」说明了什么？", "o": ["方差更小", "它不只是表现更好，而是估得更准——这是最大化偏差被缓解的直接证据", "内存占用更少", "算法收敛更快"], "a": 1, "why": "这是「机制验证」：如果提升了分数但 Q 估值曲线没变，那说明提升来自别的原因。"}, {"q": "为什么高估比低估更危险？", "o": ["高估的数值更大", "低估不影响策略", "目标里有 max，高估会被自举沿着状态链累积放大；而 max 会绕开被低估的动作", "两者同样危险"], "a": 2, "why": "这个不对称正是为什么最大化偏差在 Q-learning 里比在别处更要命。"}],

55: [{"q": "优先经验回放里，<code>α = 0</code> 会得到什么规则？", "o": ["按时间倒序抽", "只抽误差最大的", "不抽任何 tuple", "所有 tuple 概率相等，退回均匀采样"], "a": 3, "why": "α → ∞ 则只抽误差最大的那条。α 就是从「完全不排序」到「只看最大误差」的旋钮。"}, {"q": "优先级 <code>p_i</code> 是按什么定的？", "o": ["DQN 误差（即那条 tuple 的 TD 误差绝对值）", "时间先后", "访问次数", "奖励大小"], "a": 0, "why": "每次更新后重算；新 tuple 的 p 设为 0。"}, {"q": "<code>P(i) = p_i^α / Σ_k p_k^α</code> 中，α = 0 对应什么？", "o": ["不抽样", "均匀随机抽样——也就是原版经验回放", "完全按误差抽样", "只抽最新的样本"], "a": 1, "why": "因为 p_i^0 = 1 对所有 i 成立，于是 P(i) = 1/N。α 是在「均匀」和「纯按误差」之间滑动的参数。"}, {"q": "优先回放必须配套什么修正？", "o": ["批归一化", "梯度裁剪", "学习率衰减", "重要性权重 <code>(1/N · 1/P(i))^β</code>，β 从小值退火到 1"], "a": 3, "why": "因为按优先级抽样后不再是在原始分布上求期望，梯度有偏。这和 GLIE 的 ε 衰减是同一个退火思路。"}, {"q": "「TD 误差大」一定说明「这里该多学」吗？", "o": ["只在表格情形下成立", "一定", "不一定——也可能是那个转移本身随机性大，再怎么学误差也降不下去", "一定，这是定义"], "a": 2, "why": "于是算法会把更新浪费在「本质上不可预测」的样本上。这也是为什么 α 通常不取 1。"}],
59: [{"q": "Dueling DQN 的出发点是？", "o": ["减少参数", "加快收敛", "降低方差", "判断「状态好不好」和「哪个动作更好」该看的特征不一样，所以拆成两条支路"], "a": 3, "why": "例子：游戏分数对预测 V(s) 有用，对判断此刻哪个动作更好几乎没用。"}, {"q": "优势函数的定义是？", "o": ["A = r + γV − V", "A = Q − max Q", "A = Q − V", "A = V − Q"], "a": 2, "why": "Baird 1993。它度量的是「这个动作比按当前策略走好多少」。"}, {"q": "Dueling 分解真正买到的好处是什么？", "o": ["收敛保证更强", "参数更少", "样本效率——一次更新会流进所有动作共用的 V 支，于是试一个动作顺带改善其余动作", "计算更快"], "a": 2, "why": "动作数越多这个好处越大，这正是 dueling 在 Atari（18 个动作）上有效的主要来源。"}, {"q": "Dueling 在什么游戏上帮助最大？", "o": ["画面简单的游戏", "动作少的游戏", "「大部分时候做什么都差不多，只在关键时刻重要」的游戏", "奖励稠密的游戏"], "a": 2, "why": "这类状态下各动作的 Q 值几乎相同，于是「学 V」比「分别学每个 Q」高效得多。"}],
61: [{"q": "<code>Q = V + A</code> 为什么不可辨识？", "o": ["V 加一个常数、A 减同一个常数，Q 完全不变", "因为 Q 有偏", "因为 V 不唯一", "因为 A 可能为负"], "a": 0, "why": "所以必须额外钉一个约束，否则两条支路各自的值毫无意义。"}, {"q": "课件说哪种约束更稳？", "o": ["用均值当基线（减所有动作 A 的平均）", "强制 A 之和为 0", "强制被选动作的 A 为 0（减 max）", "不加约束"], "a": 0, "why": "这也是实践中常用的那个。"}, {"q": "<code>Q = V + A</code> 不可辨识的根源是什么？", "o": ["网络层数不够", "要定 |A|+1 个数，而目标只给了 |A| 个约束——少一条约束就多一个自由度", "折扣因子取得不对", "目标值带噪声"], "a": 1, "why": "监督信号只约束了两支的和——从来没有人告诉网络「真正的 V 是多少」。"}, {"q": "课件为什么说均值版 more stable？", "o": ["均值计算更快", "基线由所有动作平均决定，换一个动作只动 1/|A|；而 max 由单个动作决定，会跳", "均值版不需要遍历动作", "均值版语义更清楚"], "a": 1, "why": "代价是 V̂ 不再等于 max Q̂。但你真正要的是 arg max，差一个常数不影响选哪个动作——这笔交易划算。"}],
64: [{"q": "Schulman 建议拿哪个游戏当「体检」？", "o": ["Pong——DQN 在它上面很可靠，跑不出好成绩就是哪里错了", "Montezuma's Revenge", "Breakout", "Seaquest"], "a": 0, "why": "老师还强调：先把线性情形的 Q-learning 跑通再上 Atari，不然要等十二小时才发现什么都没学到。"}, {"q": "DQN 在 Atari 上通常要跑多久才明显好过随机策略？", "o": ["上亿帧", "几十万帧", "几千帧", "1000–4000 万帧（GPU 上几小时到一天）"], "a": 3, "why": "「要有耐心」是课件原话。另外：回放池越大越稳，所以用 uint8 存图、别重复存数据。"}, {"q": "「先在 Pong 上体检」这条建议的逻辑是什么？", "o": ["先要一个「已知应该成功」的基准：它跑不出分就一定是代码有问题", "Pong 的状态空间最小", "Pong 的奖励最稠密", "Pong 训练最快"], "a": 0, "why": "深度 RL 最难受的是失败没有信号。先建立一个能证伪的测试，这条习惯比任何超参都值钱。"}, {"q": "Huber 损失为什么特别适合贝尔曼误差？", "o": ["它让损失可微", "贝尔曼误差总是正的", "自举目标本身是估计，早期可以离谱到任意程度；Huber 把单个样本的梯度钉在 ±δ 以内", "它能加快收敛"], "a": 2, "why": "这里的离群值不是噪声而是结构性的：平方损失下一个离谱目标就能一步把网络推坏。"}, {"q": "这几条建议共享的立场是什么？", "o": ["它们只适用于 Atari", "它们都在提高最终性能", "它们都在减少计算量", "它们都在假设「你会失败很多次」——降低单次失败代价，而不是提高上限"], "a": 3, "why": "而「允许失败很多次」本身就是一个前提：仿真里成立，现实里往往不成立。"}],

{"r": [1, 3], "t": "这一讲要干什么", "star": 2, "one": "把上一讲的函数逼近器换成<b>深度网络</b>，做出能玩 Atari 的 DQN。", "pts": ["两节：卷积网络（CNN）→ 深度 Q 学习。", "CNN 那一节只是个交代，<span class='k'>重点全在第二节</span>。", "<b>这一讲的结构是「铺垫很长、正主很短」，先知道这件事能帮你分配注意力。</b><span class='k'>p1–p27 都在讲表示（从线性特征到卷积网络），真正的 DQN 从 p31 才开始</span>。<b>而 DQN 本身的技术内容只有两页：经验回放（p38）和固定 Q 目标（p40）。</b><span class='w'>剩下的二十几页是三个后续改进和实操建议。</span>", "<b>但那段长铺垫不是可以跳过的，因为它回答了一个这门课到此为止一直回避的问题：<span class='k'>特征从哪来</span>。</b><span class='w'>L05 全程假设「给定一组特征 <code>x(s)</code>」，然后在那上面做线性逼近</span>——<b>可那组特征是谁定的？</b><span class='k'>p8 会正面回答：得你自己手工设计，而且设计得好不好决定了一切上限</span>。<b>而深度网络的卖点就是把这件事自动化。</b>", "<b>读这一讲还有一条值得带着的线索：<span class='k'>DQN 的两个补丁，各自在修 L05 那三件套的哪一条</span>。</b><span class='w'>L05 p38 说致命三件套是「函数逼近 + 自举 + off-policy」</span>。<b>而 DQN 三样全占——用神经网络（函数逼近）、用 Q-learning 的目标（自举 + off-policy）。</b><span class='k'>所以按 L05 的说法它应该会发散，而它没有</span>。<b>两个补丁做了什么，让一个理论上危险的组合变得能跑？这是这一讲最值得想的问题。</b>", "<b>这一讲的来源也值得知道：它的内容横跨两个领域，而两边的读者关心的东西不一样。</b><span class='k'>如果你学过深度学习，p12–p27 那一段卷积网络的内容可以快过</span>——<b>它是标准的 CNN 入门，没有 RL 特有的东西。</b><span class='w'>如果你没学过，那一段值得慢读，因为后面的 DQN 完全建立在它上面</span>。<b>而无论哪一类读者，p37–p45 那五页都是这一讲的核心，必须细读。</b>", "<b>再给一条读 DQN 时该一直带着的问题，它能帮你把这一讲和前五讲串起来。</b><span class='k'>DQN 的每一个设计，都在修前面某一讲指出的某个毛病</span>：<b>卷积网络修「特征得手工设计」（L05）；经验回放修「样本不独立」（L05 p21）；固定目标修「目标在动」（L05 p28）；而后面的 Double DQN 修「最大化偏差」（L04 p42）。</b><span class='w'>这一讲几乎没有原创的理论，它是一次系统的「工程修补」</span>——<b>而这恰恰是它值得学的地方。</b>", "<b>最后提醒这一讲的一个阅读陷阱：它的成功容易让人高估这套方法的通用性。</b><span class='w'>Atari 是一个非常特殊的测试床——状态完全可观测（几乎）、动作离散且少、奖励稠密（大部分游戏）、可以无限次重来、没有安全约束</span>。<span class='k'>换掉其中任何一条，DQN 的表现都会大幅下降</span>。<b>p43 那张结果图里的长尾（蒙特祖玛接近 0 分）就是最好的提醒。</b>", "<b>还有一个读这一讲的次序建议：<span class='k'>如果时间紧，可以先读 p37 和 p45</span>。</b><b>p37 给出问题（两个病理）和答案（两个补丁），p45 用数字告诉你哪个补丁更重要。</b><span class='w'>两页加起来就是这一讲的骨架</span>，<b>其余的内容都是在填这个骨架的细节。</b>"], "tip": {"t": "课件自己标的来源", "v": "DQN 部分的幻灯片来自 David Silver 和 Ruslan Salakhutdinov，视觉部分来自 Gianni Di Caro 与斯坦福 CS231n。"}, "quote": "Lecture 6: <b>CNNs and Deep Q Learning</b>"}
