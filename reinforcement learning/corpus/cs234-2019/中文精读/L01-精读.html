<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第一讲 · 中文精读</title>
<style>
/* 浅色纸感为默认，暗色一键切换。色值沿用 ML 版 精读/theme.py（用户调过的）。
   放映厅的片子不用这套（它们保持暗场）—— 只有阅读页要。
   另补三个 ML 那边漏定义的变量：--warnline（.tip.w2 边框，ML 映射了却没
   定义，浅色下警示边框会失效）、--violetline（科研格边框）、--tintamber。 */
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0; --warnline:#D9B4B4;
  --dot:#DDD8CE; --dot2:#B9B1A2;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33;
  --violet:#6A4BA3; --violetline:#C9BCE0; --tintviolet:rgba(106,75,163,.07);
  --tintamber:rgba(132,88,8,.07);
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);
  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f; --warnline:#4a2b2e;
  --dot:#18212e; --dot2:#2c3c52;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede;
  --violet:#B48BF5; --violetline:#3b2f4f; --tintviolet:rgba(180,139,245,.08);
  --tintamber:rgba(242,189,99,.07);
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,var(--tintamber),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 浅色下的可读性与质感 ══════════════════════════════════════════
   必须放在 <style> 末尾：同级选择器写在前面会被后面的原规则盖掉。
   暗色靠「提亮」分层（rgba(255,255,255,.02) 那类），浅色下提亮是反的，
   要靠**投影**分层 —— 所以这几条只在非暗色时生效。 */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .qq,
:root:not([data-theme="dark"]) .tip,
:root:not([data-theme="dark"]) .say,
:root:not([data-theme="dark"]) .res,
:root:not([data-theme="dark"]) .tbl,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
/* .pg 是彩底上的字，浅色下底仍是 --acc2，所以字要白而不是跟 --bg 走 */
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}
</style>
<script>
/* 主题必须在**页面绘制之前**定下来，否则存了暗色的人每次打开都会先闪一下浅色。
   所以这一段放在 <head> 里、只碰 documentElement，不碰任何 DOM 节点
   （此刻 body 还不存在）。按钮的接线在下面的主脚本里。

   存档键**故意不带课程前缀**：file:// 下所有本地页面共用一个 origin，
   而主题是一个跨课程的阅读偏好 —— 设一次，所有课都跟着。
   这和自测记录的规矩正好相反（那个必须带前缀，否则两门课互相覆盖）。 */
(function(){
  try{
    var t = localStorage.getItem("reader-theme");
    if(t === "dark") document.documentElement.setAttribute("data-theme","dark");
  }catch(e){}
})();
</script>
</head>
<body data-key="cs234-2019-l01">

<div id="bar">
  <h1>CS234 第一讲 · <span>强化学习导论</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 78</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture01.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L01-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>
/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
3: [{"q": "RL 和「已知模型的规划」最本质的差别是什么？", "o": ["规划没有延迟后果", "RL 不需要泛化", "规划不需要优化", "RL 事先不知道世界怎么运作"], "a": 3, "why": "p6 的标题就是 <em>Don't Know in Advance How World Works</em>。规划是「会算但可能算不快」，RL 是「连规则都还不知道」。已知模型的那一半在 L02，那里叫规划不叫学习。"}, {"q": "把你的节点级保真度分配对着这三个承重词检查，<b>目前哪一个还没有被实验支持</b>？", "o": ["「学」——节点效应其实事先已知", "三个都已被支持", "「好」——没有标量目标", "「序贯」——节点效应可能是可加的"], "a": 3, "why": "「好」成立（G = Acc − λ·Cost）；「学」成立（节点效应必须从运行里拿）。<b>只有「序贯」是待证的</b>：简报 §5 的可加性检验若显示 Σ_h Δ_h^down 与 Acc(全强) − Acc(全弱) 在置信区间内一致，节点效应近似可加，那么这个问题在实质上不是 MDP，诚实的形式化是「每节点代价敏感选择」。<b>MDP 框架必须被实验挣得，不能预设。</b>"}],
8: [{"q": "海鞘那个例子想说明什么？", "o": ["进化过程很奇妙", "脑的用处和「要做决策」绑在一起", "生物不需要学习", "神经科学可以解释 RL"], "a": 1, "why": "幼体有脑会游动，附着后把脑消化掉 → 不再需要决策就不再需要脑。注意她自己说过这只是 <em>one example</em>、作用是提醒而非证据——这是动机页，不是论证页。"}],
9: [{"q": "课件的 Atari 例子（p9）强调的技术点是？", "o": ["用模型做了前向搜索", "多个 agent 协作", "直接从屏幕像素学", "用了大量人工设计的特征"], "a": 2, "why": "关键不是分数高，是<b>没有人工特征</b>——agent 看到的就是彩色像素。这一条在 L06（CNN 与深度 Q 学习）整讲展开。五个应用里只有它有「范式转变」意义，其余四个证明的是适用面。"}],
14: [{"q": "下面哪一项<b>不是</b>课件列的 RL 四要素？", "o": ["延迟后果", "优化", "探索", "收敛性"], "a": 3, "why": "四要素是 优化 · 延迟后果 · 探索 · 泛化（p14 原文顺序）。收敛性是分析算法时的性质，不是划分问题类别的坐标轴。"}, {"q": "四要素里，<b>哪一个是 RL 与其它 ML 共享、因此不能用来判断「这是不是 RL 问题」的</b>？", "o": ["优化", "探索", "延迟后果", "泛化"], "a": 0, "why": "优化是几乎所有 ML 都有的。<b>后三格才是 RL 独有的困难</b>：延迟后果（功劳分配）、探索（反事实不可观测）、泛化（状态不可枚举）。判断一个问题是不是 RL 问题要看后三格。"}],
15: [{"q": "课件把目标写成「最优，<i>or at least a very good strategy</i>」，这个措辞是在提示什么？", "o": ["必须用近似值函数", "优化不是重点", "后面很多算法只保证接近最优", "最优策略往往不存在"], "a": 2, "why": "这是提前打招呼：值迭代按 γ 的幂次收敛、函数逼近有消不掉的逼近误差、老虎机保证的是 regret 速率而不是找到最优臂。但要注意——<b>「近最优」必须带定量界</b>（差多少、多大概率、什么假设），不给这三样就是空话。"}],
16: [{"q": "延迟后果在「学习时」带来的那个难题，标准叫法是？", "o": ["分布漂移", "维数灾难", "时间上的功劳分配", "过拟合"], "a": 2, "why": "课件 p16 明确分成两条：规划时要推演长期后果（<b>计算问题</b>），学习时是 <em>temporal credit assignment</em>（<b>统计问题</b>）。区别在于：给你无限算力，前者能解，后者仍不能解。"}, {"q": "你的奖励只在终局（端到端准确率）。<b>这对 per-decision IS 意味着什么</b>？", "o": ["需要改成 minimax 回传", "使 IS 完全不可用", "对准确率那一半买不到任何东西，只对成本那一半有用", "能大幅降低方差，应优先使用"], "a": 2, "why": "奖励在 t=H 时，PDIS 在算术上就等同于轨迹 IS——<b>对准确率那一半没有任何增益</b>。它只对成本有用，因为成本是逐节点累积的。所以估计量要拆两半：成本用回归（不用重要性权重，预期 R² &gt; 0.95），准确率用 FQE + 5 折 cross-fitting。"}],
17: [{"q": "这里说的「删失数据」指的是？", "o": ["数据被人为裁剪过", "只观察得到你所选动作的结果", "奖励被截断到某个范围", "状态信息不完整"], "a": 1, "why": "<em>Only get a reward (label) for decision made</em>。没选的动作的结果永远看不到，而且这补不上——不是数据少，是反事实不可观测。第三项说的是奖励裁剪，第四项说的是部分可观测，都是别的问题。"}, {"q": "为什么说探索的困难<b>不只是</b>「试错代价高」？", "o": ["因为试错很慢", "因为奖励有噪声", "因为状态空间太大", "因为反事实结果根本不可观测"], "a": 3, "why": "代价高只让你少试几次；真正的困难是<b>即使试得起，反事实也仍然不可见</b>。ε-贪婪、UCB、Thompson 采样、乐观初始化全都在绕这个坑，不是在省钱。"}, {"q": "你的 AFlow 日志每次固定模型配置。<b>用它做重要性采样会怎样</b>？", "o": ["需要改用 per-decision IS", "方差很大，但多收集数据会好转", "偏差很大但方差很小", "估计量无定义——凡候选策略与已跑配置不同的节点，权重恒为 0"], "a": 3, "why": "确定性日志下 π_b(a|h) ∈ {0,1}，违反 coverage（π_e &gt; 0 处必须 π_b &gt; 0）。<span class='w'>这不是高方差的 IS，是 IS 无定义——加再多数据也不会好转</span>，即 deficient support。正确顺序是先做一步偏离扫描，把随机化节点收到 k=3~4，ESS 从 n·2^−10 提到 n·2^−4（64 倍），再谈估计量。"}],
18: [{"q": "课件用 Atari 论证「不能把策略写死」，依据是？", "o": ["可能的画面数量大到写不完", "玩家水平参差", "游戏规则会变", "像素有噪声"], "a": 0, "why": "<code>256^(100×200×3)</code>。注意这是<b>存在性论证不是精确计数</b>——它远大于 Atari 实际可达的画面数，但论证只需要「大到写不完」。别把它当状态空间大小引用。"}, {"q": "课件说策略是「从<b>过去的经验</b>到动作」的映射。这一句对应你课题里的哪个决定？", "o": ["用哪个模型当 7B", "用不用 vLLM", "λ 取多大", "策略只看 (query, 节点 id) 还是也看部分轨迹"], "a": 3, "why": "这正是 P2 vs P3 消融。P2 把当前观测当充分统计量，P3 用完整历史——课件这一句说的是后者才是默认形式。<b>判据已定量</b>：若序贯信息带来的提升不到 2 个百分点，就不要用 MDP 框架。它与 p3 的可加性检验是同一个决定的两半。"}],
20: [{"q": "AI 规划缺的是四要素里的哪一格，为什么？", "o": ["探索——因为模型已给，不必通过试错认识世界", "优化——因为不追求最优", "延迟后果——因为只看一步", "泛化——因为状态空间小"], "a": 0, "why": "课件原句：<em>but given model of how decisions impact world</em>。规划仍然有优化、泛化、延迟后果三格，唯独不需要探索。反过来说，<b>拿掉模型，规划就变成 RL</b>。"}, {"q": "这张四范式对照表最实用的用法是？", "o": ["证明 RL 比其它方法高级", "决定用哪个深度网络", "拿自己的问题逐格问，看能不能退化成更简单的范式", "记住四个范式的名字"], "a": 2, "why": "四格全要意味着四种困难全要扛。<b>能退化成前面任何一种的问题，都应该退化</b>——模型给了吗？标签给了吗？有好策略的示范吗？动作影响后续数据吗？用监督学习能解的问题不要用 RL。"}],
25: [{"q": "模仿学习「避开了探索问题」，这个好处同时带来的隐患是？", "o": ["只见过示范覆盖的状态，一旦偏离就在外推，且错误让你偏得更远", "无法使用神经网络", "需要更多标签", "训练速度变慢"], "a": 0, "why": "这就是分布漂移（covariate shift），L07 的 DAGGER 整个是为它设计的。课件还列了另一条限制 <em>limited by data collected</em>——你的上限被示范数据锁死，而且连「示范者有多好」都无从知道。"}],
27: [{"q": "课件问「奖励从哪来？搞错了会怎样？」，但没有回答。搞错了最典型的后果是？", "o": ["算法不收敛", "算法忠实地朝错误方向优化，而且优化得越好偏离越远", "需要更多数据", "奖励变成负数"], "a": 1, "why": "agent 没有作弊，是尺子量错了东西。p41–42 的人工家教题就是这件事的演示：答对 +1，于是它学会只出加法题。这一页同时划出了本课结论的适用边界——本课假设奖励正确、只关心期望、环境里只有你一个。"}, {"q": "你的 <code>G = Acc − λ·Cost</code> 里，λ 应该怎么交代？", "o": ["由 AFlow 自动搜索", "固定为 1", "当超参数，调到效果最好即可", "当建模决定：扫一遍 λ 报整条 Pareto 前沿，因为 λ 会改变最优策略本身"], "a": 3, "why": "λ→0 得到全 72B，λ→∞ 得到全 7B，<b>中间才有真正的分配问题</b>。挑一个好看的值报，等于隐藏了这个结构。顺带：把成本写进搜索目标本身就是一条真贡献——AFlow 的 Executor 同时返回 score 和 cost，但 cost 从不进入 score。"}],
37: [{"q": "目标句「maximize total <b>expected</b> future reward」里的 expected 悄悄做了什么决定？", "o": ["假设奖励是正的", "假设折扣因子为 1", "只关心均值，不关心方差与尾部", "假设环境是确定性的"], "a": 2, "why": "取期望就把分布压成了一个数。这正是 p28 说的「稳健性 / 风险敏感」被搁置的地方——一个期望很高但偶尔灾难性失败的策略，在医疗与金融里不可接受。"}],
41: [{"q": "家教 agent 答对 +1、答错 −1，它会学会出什么题？为什么这不是你想要的？", "o": ["减法题；因为更难更能提分", "不出题；因为不出就不会错", "随机出题；因为期望一样", "加法题；因为它最大化的是「当下答对」而不是「学会」"], "a": 3, "why": "加法较易 → 更可能答对 → 期望回报更高。代理指标（当下正确率）与真实目标（长期掌握）不一致，而<b>优化能力越强，偏离越明显</b>。真正促进学习的题往往是那些会做错的题。"}, {"q": "把这道题换成你的设定：只奖励准确率会得到全 72B，只惩罚成本会得到全 7B。<b>开工前必须先验证什么</b>？", "o": ["AFlow 能否重搜拓扑", "估计量的方差", "中间段存在——即 Acc(全强) − Acc(全弱) 有足够 headroom", "λ 的最优值"], "a": 2, "why": "这是简报的<b>止损闸</b>：若某 benchmark 上 Acc(全强) − Acc(全弱) &lt; 约 4 个百分点，两个退化解差不多好，你在上面建的 router 打不过噪声。<span class='w'>应当放弃这个 benchmark，而不是调参数</span>。这条闸要在第 1 周就过。"}],
43: [{"q": "课件把一轮交互写成「agent 动 → 世界更新并吐出 o<sub>t</sub>、r<sub>t</sub> → agent 收到」。这个顺序意味着什么？", "o": ["o<sub>t</sub> 可以用来决定 a<sub>t</sub>", "o<sub>t</sub> 是 a<sub>t</sub> 之后才拿到的，用它决定 a<sub>t</sub> 是错的时序", "o<sub>t</sub> 与 a<sub>t</sub> 同时发生", "顺序不影响算法"], "a": 1, "why": "课件把动作列在最前：<em>Agent takes an action a<sub>t</sub></em>，然后世界才 emit o<sub>t</sub> 和 r<sub>t</sub>。所以一轮是「先动后看」。写算法时下标错位，多半源于把这个顺序记反了。"}],
47: [{"q": "「这个系统是不是 Markov 的」为什么是个问错的问题？", "o": ["因为所有系统都是 Markov 的", "因为 Markov 性是你所选状态表示的属性，不是世界的属性", "因为 Markov 性无法验证", "因为只有连续系统才谈 Markov"], "a": 1, "why": "p47 的式子是关于 <b>s<sub>t</sub></b> 的断言。同一个世界换一种状态表示，Markov 性就变了——p48 两道题正是这样：加回用药史或浏览路径之后它们就 Markov 了。正确问法是「我选的表示充分吗」。"}, {"q": "把 p47 的式子换成你的符号：令 s = (query, 节点 id)、h = 已执行的部分轨迹。这时 Markov 条件对应你的哪个实验？", "o": ["P2 vs P3 消融", "穷举 oracle 表", "一步偏离敏感度扫描", "止损闸"], "a": 0, "why": "P2 假设 (query, 节点 id) 是部分轨迹的<b>充分统计量</b>，P3 不做此假设。所以这个消融不是在比两个特征集，是在<b>检验一个可写成等式的 Markov 断言</b>——对审稿人这个说法有力得多。判据：序贯信息提升不到 2 个百分点就别用 MDP 框架。"}],
49: [{"q": "课件说 Markov 假设「can always be satisfied」。这句话的真正含义是？", "o": ["任何状态定义都是 Markov 的", "只在完全可观测时成立", "取 s<sub>t</sub> = h<sub>t</sub> 总能满足，所以问题从「成不成立」变成「代价多大」", "只要数据足够多就能满足"], "a": 2, "why": "全历史永远是充分统计量。所以 Markov 性不是待验证的经验事实，是<b>你总能靠扩大状态买到的性质</b>。课件紧接着列了三项代价：计算复杂度、所需数据量、最终性能。"}, {"q": "「更丰富的状态表示」在你的问题里，代价精确地表现为什么？", "o": ["成本模型 R² 下降", "推理延迟上升", "有效样本量 ESS 指数下降，E[m] = n·2<sup>−k</sup>", "模型参数变多"], "a": 2, "why": "随机化节点数 k 每加 1，ESS 减半；k=10 时 ESS = n/1024。这正是课件列的第二项代价（data required）在你这里的精确形式。所以要先做一步偏离扫描把 k 压到 3~4，换 64 倍 ESS——<b>先定状态表示，再挑估计量</b>。"}],
53: [{"q": "判断一个问题是赌博机还是 MDP，唯一的判据是？", "o": ["动作改不改变下一个观测的分布", "状态空间有多大", "奖励是不是随机的", "有没有折扣因子"], "a": 0, "why": "课件原文：<em>actions have no influence on next observations</em>。别看问题「感觉起来有多序贯」。上下文赌博机是中间态——上下文是外生的，你的动作不影响下一个上下文。"}, {"q": "若可加性检验显示节点效应近似可加，你的问题落进赌博机那一格。<b>这时最该防的审稿人质疑是</b>？", "o": ["「两个模型就是两条臂，决策问题在哪」", "「γ 怎么选的」", "「为什么不用深度网络」", "「为什么不做多智能体」"], "a": 0, "why": "|M|=2、H≤5 时构型空间 ≤32，可穷举，探索机制会显得像表演。解法是<b>加宽保真度集合</b>：7B greedy / 7B self-consistency k=3 / 7B k=8 / 72B greedy / prune。这既是防守也是更好的科学。"}],
58: [{"q": "课件在火星车模型那页写了一句 <em>Model may be wrong</em>。它指向的主要风险是？", "o": ["奖励模型无法学习", "模型训练会过拟合", "模型太大算不动", "用错的模型规划，误差会随规划步数复合放大"], "a": 3, "why": "这是 model-based RL 全部麻烦的源头：你会自信地得出错的策略，而且错误随步数复合。L16 讲模型误差复合时会正式展开。"}, {"q": "你的成本模型与准确率模型，可学性差得极远。<b>正确的做法是</b>？", "o": ["拆成两半：成本用回归（不用重要性权重），准确率用 FQE + 5 折 cross-fitting", "统一用一个估计量，简洁", "两半都用 WIS", "两半都用穷举 oracle"], "a": 0, "why": "成本给定保真度与输入长度近乎确定（预期 R² &gt; 0.95），<b>完全不用重要性权重</b>；准确率是终局奖励，要 FQE + cross-fitting（nuisance 不能在自己那折上拟合）。混在一个估计量里，等于让确定的那一半去承担随机那一半的方差。"}],
62: [{"q": "CS234 与 Sutton &amp; Barto 在回报下标上的差别是？", "o": ["CS234 不用折扣", "没有差别", "S&amp;B 不写期望", "CS234 从 r<sub>t</sub> 起，S&amp;B 从 R<sub>t+1</sub> 起，差一位"], "a": 3, "why": "CS234 写 r<sub>t</sub> + γr<sub>t+1</sub> + …，S&amp;B 写 R<sub>t+1</sub> + γR<sub>t+2</sub> + …。跨教材看推导时必须先对齐，否则每一步都差一位。本课共统计出 165 条记号陷阱，其中 18 条与 S&amp;B 冲突。"}],
63: [{"q": "γ=0 时火星车的 V<sup>π</sup>(s<sub>4</sub>) 是多少，为什么？", "o": ["+1，因为可以走回 s<sub>1</sub>", "0，因为 γ=0 时值只剩即时奖励，而 s<sub>4</sub> 的奖励是 0", "取决于策略", "+10，因为最终会走到 s<sub>7</sub>"], "a": 1, "why": "代进 p62 的式子：γ=0 把 r<sub>t</sub> 之后所有项乘成 0，于是 V<sup>π</sup>(s) = E[r<sub>t</sub>]。s<sub>4</sub> 的即时奖励是 0，所以值是 0，<b>与策略无关</b>。选「+10」就是偷偷把 γ 当成了 1。"}],
70: [{"q": "课件对「agent 只经历它试过的动作的后果」打了个感叹号说 <em>Obvious!</em>。为什么还要专门讲？", "o": ["因为它与 Markov 假设矛盾", "因为它简单到会被滑过去，而后面十几讲的困难全从它来", "为了凑页数", "因为它只在火星车里成立"], "a": 1, "why": "这句话与 p17 的「删失数据」是同一件事，隔 53 页又说一遍：p17 用它讲 RL 的特征，p70 用它推出探索-利用困境。同一个事实，两个用途。"}, {"q": "你的 AFlow 日志每个节点只跑过一个固定配置。<b>现有日志还能挖出什么</b>（不需要随机化）？", "o": ["任意候选策略的 IS 估计", "所有节点的反事实结果", "成本模型与 Q̂ 的拟合、已跑配置的 on-policy 蒙特卡洛值、节点级特征与难度打分", "完整的 Pareto 前沿"], "a": 2, "why": "IS 无定义（支撑集缺失），但这三样不需要随机化：①拟合 Q̂ 与成本模型（DR 的 nuisance / FQE 的回归目标）；②all-72B 与 all-7B 两个配置的 on-policy 值——<b>Pareto 前沿上白送的两个点</b>；③特征工程与难度打分。第一件事是审计日志，确认记的是动作分布还是只有 model id。"}],
73: [{"q": "为什么本课几乎每一讲都先讲评估再讲控制？", "o": ["因为评估不需要数据", "评估比较简单", "历史原因", "因为控制方法的内核是「评估 → 改进 → 再评估」，不能比较好坏就无法改进"], "a": 3, "why": "L03 评估 → L04 控制，L02 里策略评估先于策略迭代，顺序从不颠倒。而且评估误差会被优化过程<b>放大</b>：朝一个估错的方向优化，会自信地走向错误策略。"}, {"q": "你的课题主要坐在哪一格？", "o": ["控制——找出最优的节点级分配", "评估——在上线前估出新分配策略的 Acc 与 Cost", "都不是", "两者各半"], "a": 1, "why": "课件对评估的定义是「估计遵循<b>给定</b>策略的期望回报」，这正是你的问题。控制反而次要——构型空间小到可穷举（|M|=2、H≤5 时 ≤32 种）。三个后果：①<b>L15 是这门课对你最重要的一讲</b>；②评估误差会被放大，这是「安全策略改进」存在的理由；③你现在的评估做不了（支撑集缺失），所以顺序是<b>审计日志 → 一步偏离扫描 → 穷举 oracle → 才轮到估计量</b>。别先挑估计量。"}],
78: [{"q": "policy-based 那一行写着 <em>No value function</em>，而且没写 Implicit。这带来的后果是？", "o": ["它只能用于离散动作", "它不需要探索", "它比其它方法更快", "它无法比较状态的好坏，只能比较整条轨迹的回报，这是方差大的根源"], "a": 3, "why": "value-based 没有显式策略但能贪婪导出，model-based 能靠规划导出——<b>只有 policy-based 那一行是真的没有</b>。L08 讲的基线与 actor-critic 就是在补这一半。"}]
};

{"r": [1, 2], "t": "这一讲要干什么", "star": 1, "quote": "<b>Today's Plan</b> — Overview of reinforcement learning · Course logistics · <em>Introduction to sequential decision making under uncertainty</em>", "one": "<b>三段：RL 是什么 → 课程行政 → 不确定下的序贯决策。第三段才是技术正文，而它到 p37 才开始。</b>", "pts": ["<b>前两段不是可以跳过的铺垫。</b> 第一段里的<span class='k'>四要素（p14–p19）</span>是整门课的坐标系——后面十五讲每一讲都在补其中一格。真正能跳的只有课程行政那一段（p21–p36）。", "<b>第三段的标题里已经埋了本课的三个限定词</b>：<em>sequential</em>（序贯）、<em>decision making</em>（决策，不是预测）、<em>under uncertainty</em>（不确定）。这三个词与 p3 那句一句话定义是同一件事的两种说法。", "老师开场做了先修调查——上过 ML 的举手（几乎全举），上过 AI 的少一些。然后交代了一句要紧的话：<b>从零讲起，但会很快推进到斯坦福其它课都不覆盖的内容</b>。这解释了本课后半程（L11–L16）为什么明显变陡。", "⚠️ <b>课件标题栏的页码是「N / 78」</b>，和本精读的页码完全一致，不需要做偏移换算。"], "tbl": {"head": ["段", "页", "占比", "该不该细读"], "rows": [["① RL 是什么", "p1–p20", "26%", "<b>要</b>。四要素在这里"], ["② 课程行政", "p21–p36", "21%", "可跳。作业/评分/Piazza"], ["③ 序贯决策（技术正文）", "p37–p78", "54%", "<b>要</b>。交互回路、Markov、MDP/POMDP/赌博机"]]}, "say": "讲稿里她对这门课的定位说得比课件直白：<b>设计给「入门级硕士或博士生」</b>，所以前面铺得很平；但她紧接着说会 <em>rapidly be getting to other content beyond anything covered in at least other Stanford related classes</em>。换句话说，<b>平缓只是开头</b>。", "tip": {"t": "读法", "v": "如果你只想拿走这一讲最值钱的东西：<b>p3（一句话定义）+ p14–p19（四要素）+ p37 起的交互回路与 Markov 条件</b>。中间那 16 页行政内容与理解知识点无关。"}},
{"r": [3, 7], "t": "一句话定义：三个词各自承重", "star": 3, "quote": "<b>Learn to make good sequences of decisions</b><br>p4 <em>Repeated Interactions with World</em> · p5 <em>Reward for Sequence of Decisions</em> · p6 <em>Don't Know in Advance How World Works</em><br>p7 <em>Fundamental challenge in artificial intelligence and machine learning is learning to make good decisions under uncertainty</em>", "one": "<b>这一句里有三个词各自承重，去掉任何一个，剩下的就是另一门课。</b>", "pts": ["<b>sequences（序贯）—— p4 的标题在解释它。</b> 你这一步的动作会<b>改变下一步能看到什么</b>。监督学习没有这一项：样本独立同分布，你预测错了不会改变下一个样本长什么样。<span class='k'>「决策改变后续数据分布」是整门课全部困难的来源</span>，而不只是「要做很多次决策」。", "<b>good（好）—— p5 的标题在解释它。</b> 必须存在一个<b>可比较的标量</b>效用度量，否则「最优」这个词没有定义。注意这不是废话：一旦目标是多维的（比如同时要准确又要便宜），你得先把它压成一个标量，而<b>怎么压是建模决定，不是技术细节</b>。", "<b>learn（学）—— p6 的标题在解释它。</b> 事先<span class='w'>不知道</span>决策会如何影响世界。这一条把 RL 和规划分开：<b>规划是「会算但要算很久」，RL 是「连规则都还不知道」</b>。已知模型的那一半在 L02，那里叫规划。", "<b>p4 的标题值得单独看一眼：<em>Repeated Interactions with World</em>。</b> 「反复交互」和「一串决策」<span class='k'>不是同一件事</span>——反复交互说的是有一个<b>回路</b>（你动，世界回应，你再动），一串决策说的是这些决策<b>互相依赖</b>。前者是机制，后者是困难。有回路但每步独立的问题（比如上下文老虎机）有反复交互却没有真正的序贯性，<b>这正是 L11 单独拿出老虎机来讲的原因</b>。", "<b>p7 是一次升格</b>：从「RL 是什么」升到「<em>不确定下做好决策</em>是 AI 与 ML 的根本挑战」。这一页没有新信息，它的作用是把这门课接到更大的语境上——后面她讲探索时会回到这一句。注意她把 <em>uncertainty</em>（不确定）而不是 <em>sequence</em>（序贯）放在这句升格里：<b>不确定是更根本的那一半</b>，序贯只是让不确定复合起来。", "⚠️ <b>p3–p6 是同一句话配四个标题</b>，不是四个不同的定义。本精读把它们合成一条，因为分开读会误以为有四件事要记。四个标题的分工是：p3 给整句，p4 点「反复交互」，p5 点「奖励针对整个序列」，p6 点「事先不知道」。", "⚠️ <b>p5 的标题是 <em>Reward for Sequence of Decisions</em>，不是 for each decision。</b> 奖励是<b>针对整个序列</b>的——这一句就是后面功劳分配问题的源头（p16）。如果每个决策都有自己的即时奖励，功劳分配根本不存在。"], "tbl": {"head": ["少了哪个词", "剩下的是什么", "关键差别", "本课哪一讲"], "rows": [["<b>序贯</b>", "监督学习 / 单步预测", "数据分布不受你影响", "不在本课（对照见 p22）"], ["<b>好</b>", "纯控制 / 系统辨识", "没有可优化的标量目标", "不在本课"], ["<b>学</b>", "规划（AI planning）", "模型已知，只是算不快", "L02（值迭代 / 策略迭代）"], ["一个都不少", "<b>强化学习</b>", "三者同时成立", "L03 起全部"]]}, "say": "她说这句话 <em>encodes a lot of really important ideas</em>，然后逐个词拆开讲。拆「学」的时候她补了一句课件上没有的：agent <em>has to acquire that information through experience</em>——<b>不是不会算，是连规则都还不知道</b>。她还顺带把这件事接到神经科学与心理学上：人从婴儿起就在做同一件事，所以「要解决 AI，就得在 RL 上取得进展」。", "tip": {"t": "记号", "v": "这四页不是并列定义，是<b>四个约束条件</b>。后面所有算法的复杂度都来自要<b>同时</b>满足它们——每当你觉得某个算法绕得没必要，先回来看看它在同时扛哪两条。"}, "res": {"tag": "已核", "v": "你的节点级保真度分配，这三个词里<b>只有前两个是稳的</b>。<br>「好」是稳的：你有 <code>G = Acc − λ·Cost</code>，一个标量。而且这正是一条真贡献——<b>AFlow 的 Executor 同时返回 score 和 cost，但 cost 从不进入 score</b>，G(W,T) 是纯任务准确率，成本只出现在事后的 Pareto 图里。<br>「学」是稳的：节点级效应事先不知道，必须从运行里拿。<br><b>「序贯」本身是待证的</b>，而这恰好是你最该先做的实验：对每个 query、每个节点 h，跑（全强，h 降级）与（全弱，h 升级）得到 <code>Δ_h^down</code> 与 <code>Δ_h^up</code>，再比较 <code>Σ_h Δ_h^down</code> 与 <code>Acc(全强) − Acc(全弱)</code>。<span class='w'>若在置信区间内一致，节点效应近似可加，这个问题在实质上就不是 MDP</span>，诚实的形式化是「每节点代价敏感选择」。<br><b>MDP 框架必须被实验挣得，不能预设。</b>审稿人对 NLP 论文里进口 RL 形式化本来就警惕，理由正是「加了记号没加预测力」。", "ref": "简报 §5（已核，agent 给了完整推导）· §3（已核，AFlow §4 + Fig.4 + Appendix D）"}},
{"r": [8, 8], "t": "海鞘：脑是干什么用的", "star": 1, "quote": "<b>RL, Behavior &amp; Intelligence</b> — <em>Childhood: primitive brain &amp; eye, swims around, attaches to a rock. Adulthood: digests brain, sits.</em> Suggests brain is helping guide decisions (<em>no more decisions, no need for brain?</em>)", "one": "<b>幼体有脑、会游动；找到岩石附着后，把自己的脑消化掉。</b>", "pts": ["推论：<span class='k'>脑是用来引导决策的</span>。不再需要决策，就不再需要脑。", "<b>这一页是动机页，不是论证页。</b> 它不能证明智能等于决策——一个生物学例子做不到这件事。它的作用是给整门课立一个问题：<b>智能是不是本质上就跟「要做决策」绑在一起</b>。", "放在这个位置有结构上的用意：紧接着的 p9–p13 是五个工程应用。<b>一边是生物，一边是工程，中间那句共同的话是「都要做一连串决策」。</b>", "出处：<b>Yael Niv</b>（普林斯顿的心理学与神经科学研究者）。课件上只写了 <em>Example from Yael Niv</em>。"], "say": "她讲完这个例子后自己先泼了一次冷水：<em>this is one example of a biological creature</em>——<b>她明说这只是一个例子</b>，作用是「a useful reminder」，不是证据。这种「讲完自己拆一下台」的地方在这门课里出现过几次，是判断哪些话能引用的好信号。", "tip": {"t": "这一页证明了什么", "v": "严格说：<b>什么都没证明。</b> 它给的是一个<b>相关</b>——决策结束与脑退化同时发生。从相关到「脑的功能是引导决策」中间缺了至少两步（能量代价的替代解释、以及反向的因果方向）。<br>那为什么还留着它？因为<b>动机页的作用不是证明，是给一个值得问的问题</b>。把它当证据引用会被打，当问题引用没问题。<span class='k'>读这门课时区分「动机页」和「论证页」，比记住每个例子都有用</span>——L01 里 p8–p13 全是动机页，p37 之后才开始出现论证。"}},
{"r": [9, 13], "t": "五个应用：从玩具问题到真问题", "star": 1, "quote": "p9 <b>Atari</b> <em>(DeepMind Nature, 2015)</em> · p10 <b>Robotics</b> · p11 <b>Educational Games</b> · p12 <b>Healthcare</b> · p13 <b>NLP, Vision, ...</b>", "one": "<b>五页五个领域，共同点是：任务复杂到人也得学一会儿，而且没人能事先写出规则。</b>", "pts": ["<b>Atari（p9）是这五个里唯一有「范式转变」意义的。</b> 关键不是分数高，是<span class='k'>直接从屏幕像素学</span>——agent 看到的就是一堆彩色像素，没有人工设计的特征。这一条后面在 L06（CNN 与深度 Q 学习）整讲展开。", "<b>另外四个是「适用面」而不是「新方法」。</b> 机器人（抓取、叠衣服）、教育游戏（教分数）、医疗（癫痫控制）、NLP 与视觉。它们证明的是同一套形式化能套到很不一样的领域上。", "<b>这五个的「难在哪」各不相同，混着看会以为 RL 是一把万能钥匙。</b> Atari 难在<b>状态空间</b>（像素）；机器人难在<b>连续动作与真实物理</b>（试错会摔坏东西）；教育游戏难在<b>环境是人</b>（不可复位、不可重复、伦理约束）；医疗难在<b>完全不能在线试错</b>；NLP/视觉那一类难在<b>奖励本身要靠设计</b>（没有天然的分数）。<span class='k'>同一套形式化，四种完全不同的工程困难。</span>", "<b>p13 那一类是把 RL 当优化手段用，不是当决策模型用。</b> 讲稿里她说的是：当优化问题很难解时，可以用 RL 作为一种优化技术。这是一个<b>方法论上的转向</b>——此时「agent」「环境」都是人为构造的，序贯性是你自己引入的，不是问题本来就有的。看论文时遇到这一类，要先问「序贯结构是发现的还是安上的」。", "⚠️ <b>不要把「应用广」读成「方法成熟」。</b> 这五页里只有 Atari 是端到端跑通的公开结果；医疗那类是<b>离线数据上的可行性研究</b>，而「不能上线试错」正是 L15（批量离线 RL）存在的理由。教育游戏与医疗这两页，实际上就是整门课后半程<b>为什么要花两讲讲离线与安全</b>的动机。", "⚠️ <b>p10 与 p13 的课件页上只有图，没有正文。</b> 抽不出文字是正常的，不是漏页。p11 与 p12 的正文只有图注（出处），所以这两页的内容全在讲稿里。"], "tbl": {"head": ["页", "领域", "出处", "为什么选它"], "rows": [["p9", "Atari Breakout", "DeepMind, Nature 2015", "<b>直接从像素学</b>，且强过人类"], ["p10", "机器人抓取 / 叠衣服", "Berkeley 同行", "连续动作、真实物理"], ["p11", "教育游戏（分数教学）", "Mandel, Liu, Brunskill, Popović, AAMAS 2014", "老师自己的工作；<b>人是环境</b>"], ["p12", "癫痫控制（体外模型）", "Panuccio, Guez, Vincent, Avoli, Pineau", "<b>不能在线试错</b>→ 指向 L15"], ["p13", "NLP / 视觉", "Yeung, Russakovsky, Mori, Li 2016", "把 RL 当优化手段用"]]}, "say": "两句课件上没有的话值钱。<b>一</b>：她说自己刚入行时 RL 大多是 <em>very artificial toy problems</em>，基础都在但缺大规模应用；近五年变化最大的是<b>能处理的问题规模</b>。<b>二</b>：讲到适用面广时她说这 <em>is both an opportunity and a responsibility</em>——她主持斯坦福的 AI for Human Impact Lab，教育游戏和医疗那两页是这个立场的直接产物，不是随手举的例子。"},
{"r": [14, 14], "t": "四个要素：本课的坐标系", "star": 3, "quote": "<b>Reinforcement Learning Involves</b> — <em>Optimization · Delayed consequences · Exploration · Generalization</em>", "one": "<b>这四个不是「RL 的优点」，是把 RL 和其它 AI / ML 分开的那四条线。接下来 p15–p19 各讲一个。</b>", "pts": ["<b>这一页是整门课的目录。</b> 后面十五讲每一讲都在补其中一格或两格。读不下去的时候回到这一页，问「现在讲的是哪一格」，通常就接上了。", "<b>四要素里只有「优化」是 RL 与别人共享的</b>；剩下三个都是 RL 独有的困难。所以判断一个问题是不是 RL 问题，<b>看后三格，不看第一格</b>。", "<b>注意它们不是互相独立的。</b> 延迟后果让探索变难（功劳分配不清，你不知道该多试哪一步）；泛化让探索变难（状态太多，不可能逐个访问）。<span class='k'>本课后半程的算法几乎都在同时处理两格以上</span>。", "⚠️ <b>p20 是这同一张表换了顺序</b>，不是第五个要素。课件在四要素讲完后重排了一次，用来引出后面的对照页（p21–p24 与 AI 规划、监督、无监督、模仿学习逐个对照）。"], "tbl": {"head": ["要素", "缺了它，问题退化成", "难在哪", "本课哪几讲"], "rows": [["① 优化", "描述性建模，无目标", "算不算得出来", "L02 L05"], ["② 延迟后果", "单步预测 / 老虎机", "<b>功劳分配</b>", "L03 L08–L10"], ["③ 探索", "监督学习（标签全给）", "<b>反事实不可观测</b>", "L11–L13"], ["④ 泛化", "表格法（状态可枚举）", "见到没见过的状态", "L05 L06"]]}, "say": "她讲这一页时用的词是这四个要素「<b>把 RL 和其它 AI 与 ML 分开</b>」。这比课件的 <em>involves</em> 强——<em>involves</em> 听起来像「包含」，她的意思是<b>定义性特征</b>。", "res": {"tag": "推断", "v": "把你的问题逐格对一遍，结论是<b>四格里两格成立、一格待证、一格成立但方向不同</b>：<br><b>① 优化</b>——成立，<code>G = Acc − λ·Cost</code>。<br><b>② 延迟后果</b>——<span class='w'>待证</span>，就是 §5 的可加性检验。若可加，你的问题掉到「老虎机 / 单步」那一行，形式化要改。<br><b>③ 探索</b>——成立，但你的障碍不是「试错代价高」，而是<b>现有日志根本没有随机化</b>，π_b(a|h) ∈ {0,1}。详见 p17 那一格。<br><b>④ 泛化</b>——成立，但方向是<b>跨 workflow 迁移</b>而不是跨状态：在 W 上学到的保真度策略，AFlow 搜出 W' 后还管用吗？若按<b>算子类型 + 轨迹特征</b>而非节点下标来键控，理应可迁移——<b>这件事没人做过</b>。<br>标【推断】是因为：逐格对照这个动作是我做的，不是简报里现成的结论；四格各自的依据都【已核】，但「两格成立一格待证」这个总判断是推理。", "ref": "简报 §5（可加性检验，已核）· §4a（deficient support，推断）· §8 开放问题第 2 条（迁移，已核为「没人做过」）"}},
{"r": [15, 15], "t": "① 优化：注意「or at least」", "star": 2, "quote": "<b>Optimization</b> — Goal is to find an <em>optimal</em> way to make decisions · Yielding best outcomes · <em>Or at least a very good strategy</em>", "one": "<b>目标是最优，「或者至少一个很好的策略」——第二句是提前打的招呼。</b>", "pts": ["<b>「or at least a very good strategy」不是谦辞，是路线图。</b> 本课后面大量算法<span class='k'>只保证接近最优</span>，而且各自接近的方式不一样：值迭代按 γ 的幂次收敛（L02）、函数逼近有不可消除的逼近误差（L05）、老虎机保证的是 regret 的增长速率而不是「找到最优臂」（L11）。", "<b>「最优」这个词只有在目标是标量时才有定义</b>，这一点回指 p5 的「good」。多目标问题里没有唯一最优，只有 Pareto 前沿——<b>你一旦看到 Pareto 图，就说明那个问题没有被压成标量</b>。", "<b>放弃最优换来的通常是三样东西之一</b>：算得更快、样本用得更少、或者<b>能给出保证</b>。第三样最容易被忽略，但它是 L13（PAC-MDP）和 L15（安全策略改进）的全部意义。", "⚠️ 别把「近最优」读成「差不多就行」。<b>近最优是带定量界的陈述</b>：差多少、以多大概率、在什么假设下。不给这三样的「近最优」就是没有内容的话。"], "tbl": {"head": ["妥协", "换来什么", "代价", "本课哪一讲"], "rows": [["近最优（ε-最优）", "有限步内可停", "差 ε", "L02 值迭代收敛速率"], ["带函数逼近", "状态空间可以很大", "<b>逼近误差消不掉</b>", "L05 致命三件套"], ["只保证 regret 速率", "不必找到最优臂", "有限步内可能仍在试错", "L11 L12"], ["只保证「不更差」", "<b>可以上线</b>", "放弃追求更好", "L10 TRPO · L15 安全改进"]]}, "res": {"tag": "推断", "v": "你要的东西正是上表最后一行，<b>不是第一行</b>。你不需要证明分配策略最优；你需要的是「<b>在给定预算下不更差，且这句话带分布无关的保证</b>」。这决定了两件事：<br><b>一、目标怎么写。</b> 「至少一个很好的策略」对应的是风险控制而不是最优化，所以 Learn-then-Test / conformal risk control 是对的工具族。<br><b>二、一个坑要先知道</b>：这类方法要求校准点与测试点<b>可交换</b>，而节点 h 的决策会改变 h+1 的输入分布——<span class='w'>后续节点不可交换</span>。这不是小技术问题，它是这条路线上第一个要解决的东西。<br>标【推断】：工具族的选择是我基于你的目标推的；「后续节点不可交换」这一条本身在简报里是【已核】的开放问题。", "ref": "简报 §8 开放问题第 5 条（节点级分布无关风险控制，已核）"}},
{"r": [16, 16], "t": "② 延迟后果：两个不同的难题", "star": 3, "quote": "<b>Delayed Consequences</b> — Decisions now can impact things much later... <em>Saving for retirement</em> · <em>Finding a key in Montezuma's revenge</em><br>Introduces <b>two</b> challenges: (1) <em>When planning</em>: reasoning about not just immediate benefit but also longer term ramifications · (2) <em>When learning</em>: <em>temporal credit assignment is hard</em> (what caused later high or low rewards?)", "one": "<b>现在的决定很久以后才知道好坏——而这在「规划」和「学习」里是两个不同的难题，课件明确分了两条。</b>", "pts": ["<b>规划时的难题：算得远。</b> 不能只看眼前收益，要推演长期后果。这一条是<span class='k'>计算问题</span>——即使你完全知道世界怎么运作，往前推 H 步的代价也可能爆炸。L02 的值迭代、L16 的 MCTS 都在对付它。", "<b>学习时的难题：功劳分配（temporal credit assignment）。</b> 后来的好坏，到底是<b>哪一步</b>造成的？这一条是<span class='k'>统计问题</span>，不是算力问题——再多算力也不能从一个终局分数里反推出中间每步的贡献，除非你有别的信息。", "<b>把这两条混在一起是这一页最常见的误读。</b> 一个是「知道规则但算不动」，一个是「连每步的功劳都不知道」。<b>它们各自对应完全不同的解法</b>：前者用搜索与动态规划，后者用基线、优势函数、资格迹。", "⚠️ <b>Montezuma's Revenge 在 p16 和 p17 各出现一次，但指的是两件事。</b> p16 说的是「拿到钥匙很久以后才用上」（延迟后果），p17 说的是「你不试就不知道钥匙在哪」（探索）。<b>同一个游戏能同时当两格的例子，正说明这两格常常一起来。</b>"], "tbl": {"head": ["", "规划时", "学习时"], "rows": [["难题", "推演长期后果", "<b>功劳分配</b>"], ["性质", "计算问题", "<b>统计问题</b>"], ["就算给你无限算力", "能解", "<b>仍不能解</b>"], ["需要的额外东西", "更聪明的搜索", "更多/更好的数据，或结构假设"], ["本课哪一讲", "L02 值迭代 · L16 MCTS", "L03 TD · L08–L09 基线与 actor-critic"]]}, "say": "课件上写的是存退休金和找钥匙，她口头举的是两个更贴身的：<b>现在吃掉一大桶冰淇淋，一小时后才知道是坏主意</b>；<b>周五晚上用功，三周后期中才见效</b>。后一个例子里她顺带点出了功劳分配的本质：<b>你拿到好成绩，是哪一个周五晚上换来的？</b>", "tip": {"t": "为什么难", "v": "因为<b>拿不到即时反馈</b>，没法把「后来的结果」和「当初哪个决定」对应起来。这和监督学习完全不同——监督学习里每个输入都配一个标签，功劳分配这个问题根本不存在。"}, "res": {"tag": "已核", "v": "<b>这一格是你课题的正中心。</b> 你的奖励在 t=H（终局准确率），中间每个节点的保真度选择都没有自己的标签——<b>这就是 temporal credit assignment，一字不差</b>。<br>两个直接后果：<br><b>一、per-decision IS 对准确率那一半买不到任何东西。</b> 奖励只在 t=H，算术上 PDIS 就等同于轨迹 IS。它只对<b>成本</b>那一半有用（成本是逐节点累积的）。所以估计量必须拆成两半：成本用回归（给定保真度与输入长度，token 成本近乎确定，预期 R² &gt; 0.95，<b>完全不用重要性权重</b>），准确率用 FQE + 5 折 cross-fitting。<br><b>二、最强的一招不是 OPE，是穷举 oracle。</b> 取 200–300 条留出 query，枚举 k 个决策节点的全部 2^k 种分配，<b>跨分支共享前缀</b>（拓扑前缀一致的分支，节点输出可逐字复用）。k=4 时每 query ≤16 个叶子、约 30 次节点调用，300 条 ≈ 9000 次调用且多数是 7B。得到精确表 <code>R(x, a_1..a_k)</code>，<b>任何确定性节点级策略都能查表精确求值，方差为零</b>。<br>这不是 OPE，是全因子实验。<b>在你付得起的规模上，它碾压任何估计量</b>——而且它正好是检验「O(H) 次 rollout 能否估出节点边际贡献（Shapley 式）」那个开放问题的 ground truth。", "ref": "简报 §4d（穷举 oracle，已核，含成本估算）· §4e（估计量拆两半，已核）· §8 开放问题第 1 条"}},
{"r": [17, 17], "t": "③ 探索：删失数据，不是试错代价", "star": 3, "quote": "<b>Exploration</b> — Learning about the world by making decisions · <em>Agent as scientist</em><br><b>Censored data</b>: <em>Only get a reward (label) for decision made</em> · <em>Don't know what would have happened if we had taken red pill instead of blue pill</em><br><em>Decisions impact what we learn about</em>: if we choose to go to Stanford instead of MIT, we will have different later experiences...", "one": "<b>只能通过做决策来认识世界——而你只看得到你选的那个动作的结果。课件把这叫「删失数据」。</b>", "pts": ["<b>核心词是 censored data（删失数据）。</b> 你只拿到<b>你选的那个动作</b>的奖励，没选的那些永远看不到。这不是「数据少」，是<span class='w'>反事实根本不可观测</span>——再多跑几次也补不上「如果当初选了另一个会怎样」。", "<b>第二层困难比第一层更狠</b>：<em>Decisions impact what we learn about</em>。你的选择<b>还决定了你将来能学到什么</b>。所以坏决策的代价是双重的：这一次的回报差，以及<b>接下来你能看到的数据也变差了</b>。", "<b>「Agent as scientist」这个比喻是准确的，值得记住。</b> 科学家不能观察所有可能世界，只能设计实验；实验设计得不好，收集到的数据就回答不了想问的问题。<b>探索算法本质上是在线实验设计。</b>", "⚠️ <b>探索的困难不是「试错代价高」。</b> 这是最常见的误读。代价高只是让你少试几次；真正的困难是<b>即使试得起，反事实也仍然不可见</b>。后面十几讲的探索算法（ε-贪婪、UCB、Thompson 采样、乐观初始化）全都在绕这个坑，而不是在省钱。"], "tbl": {"head": ["「看不见」的三种", "具体是什么", "能不能靠多跑几次补上"], "rows": [["删失（censoring）", "没选的动作的奖励", "<b>不能</b>。反事实不可观测"], ["随机性", "同一动作每次奖励不同", "能。多跑取平均"], ["部分可观测", "状态本身看不全", "部分能。靠历史推断（L01 后半 POMDP）"]]}, "say": "她讲删失时用的是课件上没有的一个例子，而且相当尖锐：<b>你们都在斯坦福，显然这是最优选择——但你没法知道去了 MIT 会怎样，因为你只能活一次。</b> 课件上只写了红药丸蓝药丸和 Stanford/MIT 两个短语，她把它们连成了一句关于不可重复实验的话。", "tip": {"t": "记这一条", "v": "把「探索难」记成<b>「反事实不可观测」</b>而不是「试错贵」。这一句会在 L11–L13 反复用到：UCB 的置信上界、Thompson 采样的后验、PAC 的样本复杂度，都是在给<b>不可观测的那部分</b>记账。"}, "res": {"tag": "已核", "v": "<b>这一页解释了你现有日志为什么做不了 OPE——而且结论比「方差大」严重得多。</b><br>AFlow 每次运行<b>固定</b>模型配置。你的 fork 记录了哪个模型执行了哪个节点，但<b>没有随机化、没有动作分布</b>，于是 π_b(a|h) ∈ {0,1}。重要性采样要求 <b>coverage</b>：π_e(a|h) &gt; 0 处必须 π_b(a|h) &gt; 0。确定性日志下，凡是候选策略与已跑配置不同的节点，权重<b>恒为 0</b>。<br><span class='w'>这不是「高方差的 IS」，是 IS 无定义。加再多数据也不会好转。</span>这正是 Sachdeva / Su / Joachims 说的 <em>deficient support</em>——也就是这一页的 censored data，只是换了个术语。<br><b>就算随机化了，还有第二道坎。</b> 设你在 k 个决策节点上均匀随机化 2 个选项，评估一个确定性目标策略：匹配轨迹权重 w = 2^k，不匹配的 w = 0，<b>ESS = m</b>（匹配轨迹数），<code>E[m] = n·2^(−k)</code>。推论：<b>均匀日志 + 确定性目标下，WIS 精确退化为拒绝采样</b>——字面上就是「碰巧和你的策略一致的那些轨迹的平均回报」。k=10 时 ESS = n/1024。<br><b>所以顺序是：先做一步偏离敏感度扫描，按准确率跌幅与 token 占比排序，只保留 top k=3~4 作为随机化节点，其余钉死。</b> ESS 从 n·2^−10 提到 n·2^−4，<b>64 倍</b>——而且那张敏感度表本身就是论文插图。<br>现有日志仍然值钱的地方（不需要随机化）：拟合结果模型 Q̂ 与成本模型、已跑配置的 on-policy 蒙特卡洛值（Pareto 前沿上白送的两个点）、节点级特征工程与难度打分。", "ref": "简报 §4a（deficient support，推断，基于 agent 对执行器的分析 + OPE 标准理论）· §4b（ESS 推导，已核）· §4c（扫描优先，已核）"}},
{"r": [18, 19], "t": "④ 泛化：为什么不能把策略写死", "star": 3, "quote": "<b>Generalization</b> — <em>Policy is mapping from past experience to action</em><br><em>Why not just pre-program a policy?</em><br>How many possible images are there? <b>256<sup>100×200×3</sup></b> <em>(DeepMind Nature, 2015)</em>", "one": "<b>策略是「从过去的经验到动作」的映射。为什么不直接写死？——因为写不完。</b>", "pts": ["<b>先看清定义：策略的输入是「过去的经验」，不是「当前画面」。</b> 课件原文是 <em>mapping from past experience to action</em>。这个措辞很要紧——它为本讲后半的 <b>agent state</b> 与 Markov 条件埋了伏笔：什么时候可以只用当前观测代替整段历史？答案是<b>当它是充分统计量的时候</b>。", "<b>p19 给的数是一个存在性论证，不是精确计数。</b> <code>256^(100×200×3)</code> 是「100×200 像素、3 通道、每通道 256 级」的全部组合数。它当然远大于 Atari 实际可达的画面数——<b>但论证只需要「大到写不完」，不需要精确</b>。别把它当成状态空间大小引用。", "<b>写死策略的失败方式有两种，课件只点了一种。</b> 点了的是<b>规模</b>：if-then 列表大到不可行。没点但同样致命的是<b>覆盖</b>：你写不出没见过的情况该怎么办。所以泛化要的不只是「压缩」，是<span class='k'>见到没见过的组合也能给出合理动作</span>。", "⚠️ <b>p18 和 p19 是同一页的两个阶段</b>（p18 只有问句，p19 补上图和数字），本精读合成一条。"], "tbl": {"head": ["写死策略", "为什么不行", "课件点了吗"], "rows": [["列举所有情况", "<code>256^(100×200×3)</code>，大到不可行", "<b>点了</b>（p19）"], ["覆盖没见过的情况", "列表里查不到就没有动作", "没点，但同样致命"], ["规则随任务改", "每换一个游戏要重写一遍", "没点"]]}, "say": "她说要把它写成一串 if-then，<em>那个程序会大到不可行</em>。然后补了课件上没有的一句：所以必须从数据里学，<b>还要有高层表示</b>——见到没见过的像素组合也能知道该怎么办。<b>「高层表示」这个词是 L05 与 L06 的入口</b>：线性值函数逼近与 CNN 都是在做这件事。", "res": {"tag": "推断", "v": "<b>「策略的输入是过去的经验」这一句，直接对应你的 P2 vs P3 消融。</b><br>你的保真度策略可以只看 <code>(query, 节点 id)</code>（P2，相当于把当前观测当充分统计量），也可以同时看<b>部分轨迹</b>（P3，用完整历史）。课件这一句说的正是后者是默认形式，而前者需要额外条件才成立。<br><b>判据是定量的，而且已经定好了</b>：若序贯信息带来的提升<b>不到 2 个百分点</b>，就不要用 MDP 框架。这条消融与 p3 那格的可加性检验是同一个决定的两半——<b>两者都通不过，形式化就该写成「每节点代价敏感选择」。</b><br>另一件事这一页也提示了：<b>泛化的方向</b>。若策略按<b>节点下标</b>键控，AFlow 重搜出 W' 之后它就失效；若按<b>算子类型 + 轨迹特征</b>键控，理应可迁移。后者才是「泛化」在你这个问题里的真实含义，而且<b>没人做过</b>——做出来整条线的实用价值翻倍。<br>还有一个底层经验问题，你的 P2/P3 消融正好能回答它：<b>难度是 query 的属性，还是 (query, 节点, 部分轨迹) 三元组的属性？</b>这是整个路由文献里 H=1 vs H&gt;1 建模选择的根，<b>从未被干净地隔离过</b>。", "ref": "简报 §5（P2/P3 消融与 2 个百分点判据，已核）· §8 开放问题第 2、3 条（迁移与难度归属，已核为「没人做过 / 从未被隔离」）"}},
{"r": [20, 24], "t": "四要素重排与四个对照：各缺哪一格", "star": 3, "quote": "<b>p20 Reinforcement Learning Involves</b> — <em>Optimization · Exploration · Generalization · Delayed consequences</em>（与 p14 同表，换序）<br><b>AI Planning (vs RL)</b> — computes good sequence of decisions, <em>but given model of how decisions impact world</em><br><b>Supervised ML (vs RL)</b> — learns from experience, <em>but provided correct labels</em><br><b>Unsupervised ML (vs RL)</b> — learns from experience, <em>but no labels from world</em><br><b>Imitation Learning (vs RL)</b> — learns from experience <em>...of others</em>, <em>assumes input demos of good policies</em>", "one": "<b>四页同一张四要素表，各自划掉缺的那几格。课件用这种方式说明：RL 不是「更强的 ML」，是四格全都要的那一类问题。</b>", "pts": ["<b>p14 的顺序是</b> 优化 · 延迟后果 · 探索 · 泛化；<b>这一页是</b> 优化 · 探索 · 泛化 · 延迟后果。<span class='k'>内容一字未变</span>。", "<b>为什么要换？</b> 因为 p21–p24 每一页都是这张表，用划掉某几项的方式表示「这个范式缺哪一格」。把最常被划掉的「延迟后果」放到末尾，四页的视觉才整齐。<b>这是排版决定，不是概念决定。</b>", "<b>AI 规划缺「探索」。</b> 它有优化、有泛化、有延迟后果，唯独不需要探索——<span class='k'>因为模型已经给了</span>，不必通过试错认识世界。课件的原句是 <em>but given model of how decisions impact world</em>。", "<b>监督学习缺「探索」和「延迟后果」。</b> 标签是直接给的（<em>provided correct labels</em>），所以不用试；样本独立同分布，所以这一次预测不影响下一个样本。<b>它只剩优化和泛化</b>——而这两格恰好是整个深度学习的主场。", "<b>无监督学习连标签都没有</b>（<em>no labels from world</em>），但它同样不涉及探索与延迟后果。<b>和监督学习缺的是同两格，只是可用信息更少。</b>", "<b>模仿学习最微妙：它「从别人的经验里学」。</b> 课件写的是 <em>learns from experience...of others</em>，那个省略号是课件自己打的，在强调转折。它假设有一批好策略的示范（<em>input demos of good policies</em>），于是<span class='k'>把探索这一格外包给了示范者</span>。", "<b>把四页读成一句话</b>：拿掉模型 → 规划变 RL；拿掉标签 → 监督变无监督；拿掉「自己去试」→ RL 变模仿。<b>RL 是唯一四格都在的那一类。</b>", "<b>每个范式各自有一套成熟工具，而它们成熟正是因为困难更少。</b> 监督学习有几十年的损失函数、正则化、泛化理论；规划有动态规划与各种搜索；模仿学习直接复用监督学习的全部工具。<span class='k'>RL 之所以工具少、结论弱，不是因为研究得少，是因为它同时扛四格</span>。这个认识能省掉很多「为什么 RL 这么难调」的困惑。", "<b>四个对照还隐含了四条「归约路线」，每条都是一种真实的做法。</b><br>① <b>学个模型 → 变成规划</b>：model-based RL（L16 的 certainty-equivalence）。<br>② <b>拿到标签 → 变成监督</b>：如果有人告诉你每个状态的最优动作，问题就没了。<br>③ <b>拿到示范 → 变成模仿</b>：这就是 L07。<br>④ <b>假装没有延迟后果 → 变成赌博机</b>：如果动作确实不影响后续数据分布，这是<b>正确的简化而不是偷懒</b>（L11）。<br><span class='w'>四条路线都在「用假设换可解性」</span>，而假设成不成立要靠实验回答，不能预设。", "⚠️ <b>别把这四个对照读成「RL 更高级」。</b> 四格全要意味着四种困难全要扛，所以<b>能退化成前面任何一种的问题，都应该退化</b>——用监督学习能解的问题不要用 RL。这一条在 L07（模仿学习）会再强调一次。"], "tbl": {"head": ["范式", "优化", "探索", "泛化", "延迟后果", "靠什么免掉"], "rows": [["AI 规划", "✓", "<b>✗</b>", "✓", "✓", "<b>模型已给</b>"], ["监督学习", "✓", "<b>✗</b>", "✓", "<b>✗</b>", "标签已给、样本 i.i.d."], ["无监督学习", "✓", "<b>✗</b>", "✓", "<b>✗</b>", "不做决策"], ["模仿学习", "✓", "<b>✗</b>", "✓", "✓", "<b>示范者替你探索过了</b>"], ["<b>强化学习</b>", "✓", "<b>✓</b>", "✓", "<b>✓</b>", "什么都免不掉"]]}, "say": "她讲这四页时反复用的句式是「<b>它也从经验里学，但是……</b>」。这个「但是」后面跟的就是那个被免掉的困难。<b>听清每一个「但是」，四个对照就记住了。</b>", "tip": {"t": "读法", "v": "这张对照表是判断「我这个问题该用什么方法」的实用工具。拿你手上的问题逐格问：<b>模型给了吗？标签给了吗？有好策略的示范吗？动作影响后续数据吗？</b>四问之后，多半会发现它不是完整 RL 问题——那就用更简单的方法。"}},
{"r": [25, 26], "t": "模仿学习：账要算全", "star": 3, "quote": "<b>Imitation Learning</b> — <em>Reduces RL to supervised learning</em><br><b>Benefits</b>: great tools for supervised learning · <em>avoids exploration problem</em> · with big data lots of data about outcomes of decisions<br><b>Limitations</b>: <em>can be expensive to capture</em> · <em>limited by data collected</em><br><em>Imitation learning + RL promising!</em><br>p25 图：Abbeel, Coates and Ng helicopter team, Stanford", "one": "<b>模仿学习把 RL 归约成监督学习。好处是绕开探索、能用成熟工具；代价是示范贵，而且你的上限被示范数据锁死。</b>", "pts": ["<b>「Reduces RL to supervised learning」这句话要按字面读。</b> 它是一次真正的<span class='k'>归约</span>：把 (状态, 示范者的动作) 当成 (输入, 标签)，直接训一个分类器。所以监督学习的全套工具立刻可用。", "<b>「Avoids exploration problem」是最大的好处，但也是最大的隐患。</b> 你没有探索，意味着<span class='w'>你只见过示范者去过的地方</span>。一旦策略稍有偏差、走到示范没覆盖的状态，分类器就在外推——而且错误会让你偏得更远。<b>这就是分布漂移（covariate shift），L07 的 DAGGER 整个是为它设计的。</b>", "<b>「Limited by data collected」这条限制比听起来严重。</b> 它不只是「学不到更好的」，是<b>连「示范者有多好」都无从知道</b>——你没有独立的评价信号，只有模仿的准确率。<span class='w'>模仿得越像，你越不知道自己离真正的好有多远</span>。", "<b>「Can be expensive to capture」在不同领域差别极大。</b> 直升机特技要请专业飞手飞一遍；自动驾驶的示范几乎是免费的（人本来就在开车）；而医疗里「示范」就是医生的历史处置记录——<span class='k'>免费，但充满了你无法控制的混杂因素</span>。<b>示范便宜不等于示范干净</b>，这是把历史数据当示范时最容易忽略的一条。", "<b>「Imitation learning + RL promising!」是课件自己打的感叹号</b>，指向的是一类实际做法：<b>用模仿学习做初始化，再用 RL 微调</b>。前者给你一个不太差的起点（省掉最危险的早期探索），后者让你突破示范者的水平。", "<b>p25 的直升机例子来自 Abbeel、Coates 与 Ng 的团队。</b> 选它是因为特技飞行<b>不可能靠试错学</b>——摔一次就没了。这正是模仿学习存在的理由：<span class='k'>有些领域的探索代价高到根本不能探索</span>。"], "tbl": {"head": ["", "模仿学习", "强化学习", "两者结合"], "rows": [["需要探索吗", "<b>不需要</b>", "需要", "初期不用，后期用"], ["需要什么数据", "<b>好策略的示范</b>", "自己试出来的经验", "两样都要"], ["能超过示范者吗", "<b>不能</b>", "能", "<b>能</b>"], ["主要风险", "<b>分布漂移</b>（走出示范覆盖）", "早期探索代价高", "—"], ["本课", "L07", "L03–L15", "L07 末"]]}, "say": "她在这里把账算得很明白：<b>模仿学习不是「更省事的 RL」，是拿一部分能力换一部分代价</b>。省掉的是探索，付出的是上限和数据采集成本。", "res": {"tag": "推断", "v": "<b>你已经有一份「示范」了，只是没把它当示范用：all-72B 的运行日志。</b><br>它是一个<b>确定性的好策略</b>的完整轨迹集合——正好符合课件说的 <em>input demos of good policies</em>。于是这一页的账也照搬过来：<br><b>好处</b>：从它做行为克隆不需要随机化、不需要 coverage，<span class='k'>而 IS 需要</span>（见 L01.c p70 那格）。你现在做不了 OPE，但做得了这个。<br><b>限制一（课件的 limited by data collected）</b>：克隆出来的东西<b>上限就是 all-72B</b>，而 all-72B 恰恰是成本最高的那个配置。所以它不能直接当你的方法，只能当<b>参照点</b>——它是 Pareto 前沿上白送的一个端点。<br><b>限制二（分布漂移）在你这里有精确对应</b>：节点 h 换成 7B 之后，h+1 收到的输入分布就变了，而你的日志里 h+1 只见过「上游全是 72B」时的输入。<span class='w'>这与 DAGGER 要解决的 covariate shift 是同一件事</span>，而且它也是为什么 conformal / Learn-then-Test 在这里不能直接用——那类方法要求校准点与测试点可交换，<b>而后续节点不可交换</b>。<br><b>可以拿走的一条具体做法</b>：课件那句 <em>Imitation learning + RL promising!</em> 在你这里读作——<b>用 all-72B 与 all-7B 两条已有轨迹做起点与下界，把搜索限制在它们之间</b>，而不是从零开始探索整个 2^k 空间。<br>标【推断】：这整段类比是我做的；「两个端点是白送的 Pareto 点」与「后续节点不可交换」在简报里是【已核】。", "ref": "简报 §4a（现有日志仍值钱的三样，推断）· §8 开放问题第 5 条（不可交换，已核）· L07 DAGGER（原课）"}},
{"r": [27, 28], "t": "怎么推进，以及本课基本不讲的三件事", "star": 3, "quote": "<b>p27 How Do We Proceed?</b> — <em>Explore the world</em> · <em>Use experience to guide future decisions</em><br><b>Other Issues</b> — <em>Where do rewards come from? And what happens if we get it wrong?</em> · <em>Robustness / Risk sensitivity</em> · <em>We are not alone... Multi-agent RL</em>", "one": "<b>两句话概括全课：去探索世界，用经验指导未来决策。然后课件列了三件它基本不讲、但真实问题里几乎必然遇到的事。</b>", "pts": ["<b>第一句对应探索（L11–L13），第二句对应评估与控制（L03–L10）。</b> 课件用最朴素的话把全课的两半说完了。", "<b>注意这两句有先后，而且是循环的</b>：探索产生经验 → 经验改进决策 → 新决策又决定你接下来能探索到什么（p17 的第二层困难）。<span class='k'>这个循环不会终止，这就是为什么探索与利用是个持续的权衡而不是一次性选择</span>。", "<b>「Use experience」这个词很克制——它没说怎么用。</b> 用法有三种，正好对应 p57 的三个部件：拿经验估<b>模型</b>、估<b>值函数</b>、或直接调<b>策略</b>。本课后面十几讲就是这三条路各走一遍。", "<b>把这两句话和四要素对上，就能看出全课的结构</b>：「explore the world」是第③格（探索），「use experience to guide future decisions」把剩下三格全包了——用经验做优化（①）、跨状态泛化（④）、并处理后果要过很久才显现这件事（②）。<span class='k'>所以这两句不是流程，是四要素的另一种说法</span>。", "<b>「奖励从哪来」是三件里最要紧的。</b> 整个 MDP 形式化都假设有一个给定的奖励函数，<span class='w'>但它是人写的</span>。写错了，后面所有算法都会忠实地朝错误方向优化——而且优化得越好，错得越远。<b>p41–p42 那道人工家教题就是这件事的演示。</b>", "<b>「And what happens if we get it wrong?」这半句课件只问不答。</b> 答案在近十年的文献里叫 reward hacking / 代理目标失配：agent 找到一条既能拿高奖励、又不做你真正想要的事的路。", "<b>「稳健性 / 风险敏感」指的是：期望回报最大不等于你想要的。</b> 一个策略期望很高但偶尔灾难性失败，在医疗、金融里是不可接受的。<span class='k'>标准 RL 优化的是期望，对分布的尾部不作要求</span>。L15 的安全策略改进算是沾了这个边。<b>注意「稳健」在这里有两个意思</b>，课件用一个词带过了：一是<b>对环境变化稳健</b>（训练和部署的分布不同），二是<b>对坏结果敏感</b>（不接受小概率的灾难）。两者的处理办法完全不同，前者是分布鲁棒优化，后者是风险度量（CVaR 之类）。", "<b>「多智能体」被一句 <em>We are not alone...</em> 带过。</b> 一旦环境里有别的学习者，环境就不再平稳——你的最优策略随对方变化而变化，单智能体的收敛保证全部失效。", "⚠️ <b>这一页值得记住，因为它划出了本课结论的适用边界。</b> 本课教的方法都假设：奖励正确、只关心期望、环境里只有你一个。<b>三条假设在真实问题里经常不成立。</b>"], "tbl": {"head": ["被搁置的问题", "本课的默认假设", "假设不成立时会怎样"], "rows": [["奖励从哪来", "<b>奖励函数已给且正确</b>", "忠实地优化一个错目标，越优化越错"], ["稳健性 / 风险", "<b>只关心期望回报</b>", "期望高但尾部灾难，医疗金融不可接受"], ["多智能体", "<b>环境是平稳的</b>", "对方在学 → 环境非平稳 → 收敛保证失效"]]}, "res": {"tag": "推断", "v": "<b>第一条直接打在你的目标函数上。</b><br>你的 <code>G = Acc − λ·Cost</code> 不是世界给的，是<b>你写的</b>——它正是这一页说的「rewards come from」人。而 λ 是一个自由参数，<span class='w'>它的取值会改变最优策略本身，不只是缩放</span>：λ→0 得到全 72B，λ→∞ 得到全 7B，中间才有真正的分配问题。<br><b>所以 λ 必须被当成建模决定来交代，不能当成超参数一笔带过。</b> 可辩护的做法是扫一遍 λ 报整条 Pareto 前沿，而不是挑一个好看的值。<br>顺带说明为什么这仍是一条真贡献：<b>AFlow 的 Executor 同时返回 score 和 cost，但 cost 从不进入 score</b>，G(W,T) 是纯任务准确率，成本只出现在事后的 Pareto 图里。<span class='k'>把成本写进搜索目标是对搜索目标的真实改动，不是换个说法</span>。<br>第二条（风险敏感）也接得上：你要的保证是「不更差」，而不是「期望更好」——这是分布层面的要求，standard RL 不提供。第三条（多智能体）与你无关。<br>标【推断】：「λ 要当建模决定交代、报整条前沿」是我的建议；「cost 从不进入 score」在简报里是【已核】。", "ref": "简报 §3（已核，AFlow §4 + Fig.4 + Appendix D）· §8 开放问题第 5 条（风险控制，已核）"}},
{"r": [31, 31], "t": "先修要求：这门课假设你会什么", "star": 2, "quote": "<b>Prerequisites</b> — <em>Python proficiency</em> · <em>Basic probability and statistics</em> · <em>Multivariate calculus and linear algebra</em> · <em>Machine learning or AI (e.g. CS229, CS221)</em> · Loss functions, derivatives, gradient descent should be familiar · <em>Have heard of Markov decision processes and RL before</em>", "one": "<b>课务那几页里只有这一页对自学的人有用：它告诉你缺哪块要先补。</b>", "pts": ["<b>「听说过 MDP」是最低要求，不是「学过」。</b> 课件写的是 <em>have heard of</em>——L01 后半与 L02 会把 MDP 从头建一遍，所以这一条几乎不设门槛。", "<b>真正会卡人的是概率与线性代数那两条。</b> 条件独立、期望的线性性、全期望公式，在 L02–L03 每一页都在用；特征值与矩阵求逆在 L02 的 <code>(I−γP)⁻¹</code> 那里直接出现。<span class='k'>这两块薄了，后面不是「读得慢」而是「读不懂」</span>。", "<b>「损失函数、导数、梯度下降要熟」这一条到 L05 才真正用上</b>（值函数逼近），L08 起的策略梯度更是全靠它。前四讲用不到，可以边走边补。", "<b>Python 那条对只读不做的人可以放宽</b>，但本课的作业与 L06 的 DQN 都要写代码。", "<b>课件没列但实际同样重要的一条：读得懂「带下标的期望」。</b> 本课几乎每个核心式子都形如 <code>E_π[·]</code> 或 <code>E_{s'∼P(·|s,a)}[·]</code>——<span class='k'>下标说的是「按哪个分布取期望」</span>，而 RL 里最常见的错误就是对错了分布（比如该按行为策略取却按目标策略取）。L15 的离策略评估整讲都在处理这一件事。<b>如果看到下标会下意识跳过，先补这一块，比补任何别的都划算。</b>", "⚠️ <b>本精读把 p29–30、p32–36 整段删掉了</b>：那是 2019 年的授课时间、教室、助教名单、评分百分比、Piazza 与迟交政策。对为理解和科研读这门课的人是纯噪声，而且恰好是整份课件里最「考试相关」的部分。翻到那几页会显示「这一页没有单独的讲解」，这是有意的，不是漏写。"], "tbl": {"head": ["先修", "什么时候真正用上", "薄了会怎样"], "rows": [["概率与统计", "<b>L02 起，每一页</b>", "条件独立、全期望公式跟不上 → 读不懂推导"], ["线性代数", "<b>L02</b>（(I−γP)⁻¹）· L05", "矩阵求逆、特征值不熟 → 收敛性那段过不去"], ["多元微积分", "L05 起", "梯度推不动"], ["损失 / 梯度下降", "L05 · L08–L10", "策略梯度整段悬空"], ["听说过 MDP", "L01 后半会重建", "<b>基本不设门槛</b>"], ["Python", "作业 · L06 DQN", "只读不做可放宽"]]}, "say": "她在这一页停下来问了一轮：上过 ML 的举手（几乎全举），上过 AI 的少一些。然后说<b>会从零讲起，但很快推进到斯坦福其它课都不覆盖的内容</b>。这句话解释了本课后半程（L11–L16）为什么明显变陡。"},
{"r": [37, 40], "t": "序贯决策：目标，以及三个例子", "star": 3, "quote": "<b>Sequential Decision Making</b> — <em>Goal: Select actions to maximize total expected future reward</em> · <em>May require balancing immediate &amp; long term rewards</em> · <em>May require strategic behavior to achieve high rewards</em><br>三个例子：<em>Web Advertising</em>（p38）· <em>Robot Unloading Dishwasher</em>（p39）· <em>Blood Pressure Control</em>（p40）", "one": "<b>目标一句话：选动作，最大化未来总期望回报。后面三页是同一句话配三个例子。</b>", "pts": ["<b>把目标句拆成四个词各看一遍</b>：<code>total</code>（整条序列，不是某一步）、<code>expected</code>（期望，所以随机性被平均掉了）、<code>future</code>（从现在往后，沉没的不算）、<code>reward</code>（标量）。<span class='k'>四个词各自排除了一类错误做法</span>。", "<b>「expected」这个词悄悄做了一个决定</b>：我们只关心均值，不关心方差或尾部。这正是 p28 说的「稳健性 / 风险敏感」被搁置的地方。", "<b>「May require strategic behavior」再次点了战略性动作</b>：为了以后好，现在可以故意拿低回报。没有延迟后果就不存在这种动作。", "<b>三个例子的共同点是都有「立刻 vs 长远」的张力</b>，但张力的形态不同：网页广告是<b>推荐当下点击率最高的 vs 培养长期兴趣</b>；洗碗机器人是<b>快点搬完 vs 别摔碎盘子</b>；血压控制是<b>立刻降下来 vs 长期副作用与耐药</b>。", "<b>三个例子还各自暴露了一个不同的建模难点，值得分开想。</b><br><b>网页广告</b>：动作空间巨大（有多少广告就有多少动作），而且<span class='k'>反馈极稀疏</span>——绝大多数曝光没有点击。它天然接近上下文赌博机，因为下一个用户是谁跟你投了什么广告基本无关。<br><b>洗碗机器人</b>：动作是连续的（关节角度），状态是高维的（视觉），而且<span class='w'>有些错误不可逆</span>——盘子摔了就没了。不可逆性让「试错」这件事本身变得危险。<br><b>血压控制</b>：<b>部分可观测</b>（你测的是血压，真正的生理状态看不见）、<b>延迟极长</b>（副作用几个月后才显现），而且<b>不能在线试错</b>——这三条叠在一起，正是 L15 批量离线 RL 存在的全部理由。", "<b>把三个例子按「探索代价」排一下，就能看出本课后半程的结构</b>：广告的探索几乎免费（投错一条损失可忽略）→ 标准探索算法够用（L11）；机器人探索有代价但可恢复 → 要小心但可以试；医疗探索不可接受 → 只能从历史数据里学（L15）。<span class='k'>探索代价决定了你能用哪一类方法</span>，这条线索比「问题属于哪个领域」有用得多。", "⚠️ <b>p38–p40 三页正文与 p37 完全相同</b>，只换了图和标题。课件用同一句话配三张图，是在说「这三件事是同一个问题」。<b>不是三页新内容。</b>"], "tbl": {"head": ["例子", "立刻的诱惑", "长远的代价", "对应四要素里的"], "rows": [["网页广告", "投当前点击率最高的", "用户疲劳、兴趣未被发掘", "延迟后果 + 探索"], ["洗碗机器人", "快速搬运", "<b>摔碎盘子不可逆</b>", "延迟后果 + 风险"], ["血压控制", "立刻把血压降下来", "副作用、耐药、依从性下降", "延迟后果 + 部分可观测"]]}, "tip": {"t": "记号", "v": "「total expected future reward」这个短语在本课后面会被形式化成 <b>V<sup>π</sup></b>（p62）。<b>看到值函数时，回想这一页的四个词</b>，公式里每一部分都能对上号。"}},
{"r": [41, 42], "t": "检验题：人工家教，以及奖励写错会怎样", "star": 3, "quote": "<b>Check Your Understanding: Artificial Tutor</b> — Student initially does not know addition (<em>easier</em>) nor subtraction (<em>harder</em>) · Teaching agent can provide activities about addition or subtraction · Agent gets rewarded for student performance: <b>+1 if student gets problem right, −1 if get problem wrong</b><br><em>Which items will agent learn to give to max expected reward?</em> · <em>Is this the best way to optimize for learning? If not, what other reward?</em>", "one": "<b>答对 +1、答错 −1 的家教 agent 会学会什么？——只出加法题。而这显然不是你想要的教学。</b>", "pts": ["<b>第一问的答案：加法。</b> 加法较易 → 学生更可能答对 → 期望回报更高。<span class='k'>agent 会忠实地最大化你写下的那个奖励，而不是你心里想的那个目标</span>。", "<b>第二问的答案：不是。</b> 你想要的是学生<b>学会</b>，而你写下的是学生<b>当下答对</b>。这两者在短期内甚至是冲突的——真正促进学习的题往往是那些有点难、会做错的题。", "<b>这就是奖励设计失当的标准形态</b>：代理指标（当下正确率）与真实目标（长期掌握）不一致，而优化能力越强，偏离越明显。<b>agent 没有作弊，是你给的尺子量错了东西。</b>", "<b>第三问「那该用什么奖励」有几种答法，各有代价</b>：奖励<b>学习增量</b>（后测减前测）——但要能测；奖励<b>长期表现</b>（一段时间后的保持率）——但反馈极慢，功劳分配更难；奖励<b>掌握的知识点数</b>——但需要知识追踪模型，又引入一层模型误差。<span class='w'>没有免费的修法</span>。", "<b>这道题出现在这个位置不是偶然</b>：它在 p28「奖励从哪来、写错了会怎样」之后不远，是那一页的具体演示。<b>课件问了三个问题，一个答案都没给</b>——它要的是你自己撞一次这堵墙。", "<b>这个现象有一个更一般的名字：当一个度量变成目标，它就不再是好度量。</b> 在 RL 里它有一个特殊的恶化机制——<span class='k'>优化能力本身就是放大器</span>。一个弱的优化器找不到代理指标的漏洞，所以代理看起来挺好用；换一个强优化器，它会精确地找到那条「高奖励但不做正事」的路。<b>所以「以前这个指标用得好好的」不是它安全的证据。</b>", "<b>怎么判断你手上的奖励是不是代理？问一句：如果 agent 把这个数刷到满分，你会满意吗？</b> 家教题里答案是「不会」——学生每题都答对，可能只是因为题太简单。这一问比任何形式化检查都管用，而且花不了三十秒。", "<b>这一段与 L07（模仿学习）和 L15（离线 RL）都接得上。</b> 模仿学习绕开奖励设计（直接学示范者的动作，不问为什么好），代价是上限被锁死；离线 RL 则要在不能试错的前提下评估——<span class='w'>而奖励写错时，离线评估会自信地告诉你新策略更好</span>。<b>奖励设计的错误，是唯一一类靠更多数据和更好算法都修不掉的错误。</b>"], "tbl": {"head": ["奖励怎么写", "agent 会学会", "问题在哪"], "rows": [["答对 +1 / 答错 −1", "<b>只出加法</b>", "代理指标 ≠ 真实目标"], ["奖励学习增量（后测−前测）", "出恰好有挑战的题", "<b>要能测量增量</b>"], ["奖励长期保持率", "接近真实目标", "<b>反馈极慢，功劳分配更难</b>"], ["奖励掌握的知识点数", "覆盖更多知识点", "需要知识追踪模型 → 多一层模型误差"]]}, "say": "她把这三问抛给学生当场讨论，<b>特别是第三问没有给标准答案</b>。这是本讲少数几个「老师明说自己也没有干净答案」的地方——奖励设计在 2019 年是开放问题，现在仍然是。", "res": {"tag": "推断", "v": "<b>把这道题换成你的设定，答案是一样的形状。</b><br>只奖励准确率（λ=0）→ agent 学会<b>全用 72B</b>，就像家教只出加法题：它忠实地最大化了你写的东西。只惩罚成本（λ→∞）→ 全用 7B。<span class='k'>两端都是退化解，而且都不是 bug，是你给的尺子的直接后果</span>。<br><b>三条由此而来的实践结论</b>：<br>① <b>λ 不能挑一个好看的值报</b>。扫一遍 λ、报整条 Pareto 前沿，才看得出中间那段有没有真正的分配问题。<br>② <b>必须先验证「中间段存在」</b>——这就是简报的止损闸：若某 benchmark 上 <code>Acc(全强) − Acc(全弱) &lt; 约 4 个百分点</code>，<span class='w'>该 benchmark 没有 headroom</span>，两个退化解差不多好，你在上面建的 router 打不过噪声。<b>应当放弃这个 benchmark，而不是调参数。</b>这条闸要在第 1 周就过。<br>③ <b>报提升时要把噪声分开</b>。审稿人第 6 拳是「提升在统计上是真的吗」，而「提升落在种子方差内」是最致命且完全可预防的评语。要给 n、种子数、对准确率差的 <b>paired bootstrap CI</b>，以及把 LLM 采样噪声与路由决策分开的方差分解。<br>标【推断】：家教题与你的 λ 的类比是我做的；止损闸与第 6 拳的内容在简报里是【已核】。", "ref": "简报 §5（止损闸，已核）· §7 第 6 拳（统计显著性，已核）"}},
{"r": [43, 43], "t": "交互回路：离散时间，三件事一轮", "star": 2, "quote": "<b>Sequential Decision Process: Agent &amp; the World (Discrete Time)</b><br>Each time step <em>t</em>: Agent takes an action <em>a<sub>t</sub></em> · World updates given action <em>a<sub>t</sub></em>, emits observation <em>o<sub>t</sub></em> and reward <em>r<sub>t</sub></em> · Agent receives observation <em>o<sub>t</sub></em> and reward <em>r<sub>t</sub></em>", "one": "<b>技术正文从这里开始。一轮三件事：你动 → 世界更新并吐出观测和奖励 → 你收到它们。</b>", "pts": ["<b>「离散时间」是一个建模假设，不是事实。</b> 真实世界是连续的；把它切成 t=1,2,3… 是我们选的。切得粗一点每步信息多、序列短；切得细一点相反。<span class='k'>这个选择直接决定了后面「有效时域 H」有多长</span>，而 H 是几乎所有样本复杂度结论里的指数项。", "<b>注意课件把 agent 的动作放在最前面。</b> 一轮是「先动，后看」，不是「先看，后动」。这个顺序要紧：<b>t 时刻的观测 oₜ 是你在 t 时刻动作之后才拿到的</b>，所以用 oₜ 去决定 aₜ 是错的时序。后面写算法时下标搞错，多半源于这里。", "<b>observation 和 state 是两个词，这一页只出现了 observation。</b> 课件到 p45 才引入 state，而且立刻分成「世界状态」与「agent 状态」两种。<span class='w'>这三个词在本课里从不混用</span>，混了后面 POMDP 那一段就读不懂。", "⚠️ 奖励 rₜ 是<b>世界给的</b>，不是 agent 算的。这一点在 p28「奖励从哪来」那页被质疑过——奖励函数是人写的，写错了整个问题就错了。"], "tbl": {"head": ["一轮里的三步", "谁做的", "产出"], "rows": [["① 采取动作 a<sub>t</sub>", "agent", "动作"], ["② 按 a<sub>t</sub> 更新，吐出 o<sub>t</sub> 与 r<sub>t</sub>", "<b>世界</b>", "观测 + 奖励"], ["③ 收到 o<sub>t</sub> 与 r<sub>t</sub>", "agent", "更新内部状态"]]}, "tip": {"t": "记号", "v": "本课全程用 <code>a</code> 动作 · <code>o</code> 观测 · <code>r</code> 奖励 · <code>s</code> 状态 · <code>h</code> 历史。<b>观测 o 与状态 s 是两件事</b>，只有在完全可观测（p50）时才相等。"}},
{"r": [44, 44], "t": "历史：到目前为止的全部记录", "star": 2, "quote": "<b>History: Sequence of Past Observations, Actions &amp; Rewards</b><br><em>h<sub>t</sub> = (a<sub>1</sub>, o<sub>1</sub>, r<sub>1</sub>, ..., a<sub>t</sub>, o<sub>t</sub>, r<sub>t</sub>)</em><br>Agent chooses action based on history · <em>State is information assumed to determine what happens next</em> · Function of history: <em>s<sub>t</sub> = f(h<sub>t</sub>)</em>", "one": "<b>历史 hₜ 是到 t 为止的全部动作、观测、奖励。状态是「假定足以决定接下来会发生什么」的那部分信息，而它是历史的一个函数。</b>", "pts": ["<b>课件对 state 的定义里有一个词要重读：<em>assumed</em>（假定）。</b> 状态不是客观存在的东西，是<span class='k'>你假定它足够</span>。这一个词把后面整段（p45–p49）都串起来了——Markov 性不是世界的属性，是你对所选表示的一个断言。", "<b>hₜ 会无限增长。</b> 这是为什么必须有 sₜ = f(hₜ) 这个压缩：直接拿历史当状态在数学上永远成立（p49 会明说），但在计算上不可行。<b>整个状态表示的学问就是在找一个「压得够狠又没丢关键信息」的 f</b>。", "<b>「agent 基于历史选动作」这句话是默认设定，不是最终设定。</b> 后面所有算法都会把它替换成「基于状态选动作」，而这个替换只有在状态是充分统计量时才无损。", "⚠️ 注意 hₜ 里<b>包含动作</b>。有些教材的历史只记观测，本课不是。写下标时要小心。"], "say": "她讲这一页时强调的是「<b>state is a function of history</b>」这个结构，而不是某个具体的状态定义。这门课后面讲的每一种表示——表格状态、线性特征、CNN 特征、RNN 隐状态——<b>全都是在填这个 f</b>。"},
{"r": [45, 45], "t": "世界状态：真的那个，通常你看不见", "star": 2, "quote": "<b>World State</b> — This is <em>true state of the world</em> used to determine how world generates next observation and reward · <em>Often hidden or unknown to agent</em> · <em>Even if known may contain information not needed by agent</em>", "one": "<b>世界状态是真正决定下一个观测和奖励的那个东西——而它通常对 agent 隐藏，且就算给你也多半含有你不需要的信息。</b>", "pts": ["<b>两句限定各自指向一类问题。</b> 「通常隐藏」→ 部分可观测（p51–p52）；「就算知道也含有不需要的信息」→ <span class='k'>状态抽象与表示学习</span>。后者常被忽略，但它才是实际工程里更常见的那个问题。", "<b>第二句值得多想一层。</b> 一个完全正确但过于精细的状态（比如把每个原子的位置都算上）在数学上是 Markov 的，在统计上却是灾难——<b>状态越细，每个状态被访问到的次数越少，你需要的数据越多</b>。这条线索在 p49 会被明确写成「state representation has big implications for data required」。", "<b>所以「更精确的状态」不等于「更好的状态」。</b> 这与监督学习里「特征越多越好（有正则化就行）」的直觉相反，是本课第一个明显的直觉反转。"], "tbl": {"head": ["情形", "世界状态", "对 agent 的后果"], "rows": [["完全可观测", "= 观测", "MDP（p50）"], ["隐藏", "看不到", "POMDP，要自己构造状态（p51）"], ["可见但过细", "看得到但太大", "<b>数据不够</b>，需要抽象"]]}},
{"r": [46, 46], "t": "agent 状态：你实际拿来做决策的那个", "star": 3, "quote": "<b>Agent State: Agent's Internal Representation</b> — What the agent / algorithm <em>uses to make decisions about how to act</em> · Generally a function of the history: <em>s<sub>t</sub> = f(h<sub>t</sub>)</em> · Could include <em>meta information</em> like state of algorithm (how many computations executed) or decision process (how many decisions left until an episode ends)", "one": "<b>agent 状态不是「世界是什么样」，是「我拿什么来做决策」。它可以包含元信息——算了多少步、还剩几次决策。</b>", "pts": ["<b>世界状态与 agent 状态的分开，是本讲最重要的一次切分。</b> 前者是本体论问题（世界是什么），后者是<span class='k'>工程决定</span>（我用什么）。本课后面所有的 sₜ 指的都是<b>后者</b>。", "<b>「元信息」那一条不是补充说明，是一个出口。</b> 课件明说 agent 状态可以包含「算了多少次计算」「还剩几次决策」。这打开了一整类做法：<b>把资源预算写进状态</b>。有限时域问题里「还剩几步」必须进状态，否则最优策略会变成非平稳的（这一点 L02 会正式讲）。", "<b>把 f 选成什么，本课给了一条明确的谱</b>：sₜ = oₜ（只用最近观测，最省）→ sₜ = 最近 k 个观测 → sₜ = 信念状态 → sₜ = RNN 隐状态 → sₜ = hₜ（全历史，最贵但永远 Markov）。<b>越往右越安全，越往左越可算</b>。", "⚠️ 别把 agent 状态理解成「对世界状态的估计」。它可以是，但不必是——它只需要<b>足够支撑决策</b>，不需要还原世界。"], "tbl": {"head": ["f 的选法", "s<sub>t</sub> =", "Markov?", "代价"], "rows": [["最近观测", "o<sub>t</sub>", "<b>不一定</b>", "最便宜"], ["最近 k 个", "(o<sub>t−k+1</sub>…o<sub>t</sub>)", "不一定", "便宜（DQN 用 k=4）"], ["信念状态", "P(世界状态 | h<sub>t</sub>)", "是", "要模型，贵"], ["RNN 隐状态", "学出来的压缩", "近似", "要训练"], ["全历史", "h<sub>t</sub>", "<b>永远是</b>", "不可行（p49）"]]}, "say": "她把这一页讲成「<b>算法能拿到什么</b>」而不是「世界是什么」。这个措辞值得记——它把状态从哲学问题变回工程问题。"},
{"r": [47, 47], "t": "Markov 条件：充分统计量", "star": 3, "quote": "<b>Markov Assumption</b> — <em>Information state: sufficient statistic of history</em><br>State s<sub>t</sub> is Markov <em>if and only if</em>: <b>p(s<sub>t+1</sub>|s<sub>t</sub>, a<sub>t</sub>) = p(s<sub>t+1</sub>|h<sub>t</sub>, a<sub>t</sub>)</b><br><em>Future is independent of past given present</em>", "one": "<b>状态是 Markov 的，当且仅当「知道 sₜ 和 aₜ」与「知道整段历史 hₜ 和 aₜ」对预测 sₜ₊₁ 一样好。</b>", "pts": ["<b>把这个式子读成一句话：历史里除了 sₜ 之外的部分，对预测未来没有增量信息。</b> 这就是「充分统计量」的意思——<span class='k'>不是「历史不重要」，是「历史的信息已经全在 sₜ 里了」</span>。", "<b>「未来与过去在给定现在下独立」是同一件事的概率语言版。</b> 两种说法要都能认出来：式子形式出现在算法推导里，独立性形式出现在证明里。", "<b>这是一个关于「你选的那个 sₜ」的断言，不是关于世界的断言。</b> 同一个世界，换一种状态表示，Markov 性就变了。<b>所以「这个系统是不是 Markov 的」是个问错的问题</b>，正确的问法是「<b>我选的这个表示是不是充分的</b>」。下一页两道自查题就在练这件事。", "⚠️ <b>Markov 不要求「无记忆」。</b> 一个把过去十步都打包进去的状态照样可以是 Markov 的——只要它足够。混淆「Markov」与「只看当前观测」是最常见的错。"], "eq": "p(s_{t+1} | s_t, a_t) = p(s_{t+1} | h_t, a_t)\n\n「给定 s_t 与 a_t，h_t 的其余部分不提供额外信息」", "tip": {"t": "记号陷阱", "v": "课件写的是 <b>if and only if</b>（当且仅当），所以这是 Markov 性的<b>定义</b>，不是一个充分条件。判断时两边都要想：满足式子 ⇒ Markov；Markov ⇒ 满足式子。"}, "res": {"tag": "推断", "v": "<b>这个式子就是你 P2 vs P3 消融要检验的那个等式，只要把符号换掉。</b><br>令 h 为「已执行的部分轨迹」，s 为「(query, 节点 id)」。P2 假设的正是<br><code>p(结果 | query, 节点id, 动作) = p(结果 | 部分轨迹, 动作)</code><br>——即<b>节点下标 + query 是部分轨迹的充分统计量</b>。P3 不做这个假设。<br>所以你的消融<span class='k'>不是在比两个特征集，是在检验一个 Markov 断言</span>。这个说法对审稿人更有力：你不是「试了两种输入发现差不多」，你是<b>检验了一个可写成等式的条件并报告了它成立到什么程度</b>。<br>配套的量化判据已经定了：<b>序贯信息带来的提升不到 2 个百分点就别用 MDP 框架</b>。<br>标【推断】：符号对应是我做的；「2 个百分点」这条判据本身在简报里是【已核】。", "ref": "简报 §5（P2/P3 消融与 2 个百分点判据，已核）"}},
{"r": [48, 48], "t": "两道自查题：同一个系统，换表示就换答案", "star": 3, "quote": "<b>Markov Assumption for Prior Examples</b><br><em>Hypertension control</em>: let state be current blood pressure, and action be whether to take medication or not. <em>Is this system Markov?</em><br><em>Website shopping</em>: state is current product viewed by customer, and action is what other product to recommend.", "one": "<b>两道题的答案都是「不是」——而关键在于，不是世界不 Markov，是这两个状态选得不够。</b>", "pts": ["<b>高血压那题。</b> 状态＝当前血压，动作＝吃不吃药。不 Markov，因为<span class='w'>同样的血压值，来自不同的病史，对药的反应不同</span>：是否已经在服药、服了多久、有没有耐药、有无并发症——这些都影响下一步血压，而当前血压值一个数装不下它们。", "<b>购物那题。</b> 状态＝当前浏览的商品，动作＝推荐什么。不 Markov，因为<b>同一个商品页，来自不同的浏览路径，意味着完全不同的意图</b>：刚从搜索进来 vs 已经比价了半小时 vs 刚退过货。下一步点什么明显依赖这些。", "<b>两题的病因是同一个：状态把「路径」丢了，而路径携带信息。</b> 这正是 p47 那个式子失败的样子——`p(s'|s,a) ≠ p(s'|h,a)`，因为 h 里有 s 装不下的东西。", "<b>修法也是同一个：把丢掉的那部分加回状态。</b> 高血压加「用药史 + 时长」，购物加「最近 k 次点击」。<span class='k'>加进去之后它就 Markov 了</span>——这再一次说明 Markov 性是表示的属性。", "⚠️ 但加回去有代价：状态变大 → 每个状态的数据变少 → 估计变差。<b>这就是下一页要讲的权衡。</b>"], "tbl": {"head": ["例子", "给的状态", "历史里被丢掉的", "为什么破坏 Markov"], "rows": [["高血压控制", "当前血压", "用药史、服药时长、耐药、并发症", "同一血压对药的反应不同"], ["网站购物", "当前浏览商品", "浏览路径、停留时长、比价行为", "同一页面背后意图不同"]]}, "say": "她把这两题当堂抛给学生，<b>要的不是「是/否」而是「缺了什么」</b>。这个提问方式本身是这一段的教学重点：遇到 Markov 性问题，先问「历史里还有什么没装进状态」。"},
{"r": [49, 49], "t": "为什么这个假设这么流行——以及它真正的代价", "star": 3, "quote": "<b>Why is Markov Assumption Popular?</b><br><em>Can always be satisfied</em> · Setting state as history always Markov: <b>s<sub>t</sub> = h<sub>t</sub></b><br>In practice often assume most recent observation is sufficient statistic of history: <b>s<sub>t</sub> = o<sub>t</sub></b><br><em>State representation has big implications for</em>: <b>Computational complexity · Data required · Resulting performance</b>", "one": "<b>Markov 假设总能被满足——取 sₜ = hₜ 就行。所以它从来不是「成不成立」的问题，而是「你愿意为它付多少」的问题。</b>", "pts": ["<b>「Can always be satisfied」这一句，是整讲最容易被读漏、也最重要的一句。</b> 它说明 Markov 性<span class='w'>不是一个需要验证的经验事实</span>，而是一个<b>你总能通过扩大状态来买到的性质</b>。于是真正的问题从「它成立吗」变成「<b>为了让它成立，我把状态撑到了多大</b>」。", "<b>实践中的另一端是 sₜ = oₜ</b>——只用最近的观测。这最便宜，但几乎一定不充分（p48 两题就是例子）。<b>所有实际工作都在这两端之间选点。</b>", "<b>课件给出的代价有三项，而且它们不是并列的。</b> 计算复杂度与所需数据量是你<b>付出</b>的，最终性能是你<b>得到</b>的。往右走（状态更丰富）前两项涨，第三项<span class='k'>先涨后跌</span>——因为数据被摊薄。<b>存在一个最优点，而它取决于你有多少数据。</b>", "<b>这一页因此是整门课的隐藏主线。</b> L05 的函数逼近、L06 的 CNN、L11–L13 的样本复杂度界，全都在同一条权衡曲线上的不同位置。"], "tbl": {"head": ["状态表示", "Markov?", "计算复杂度", "所需数据", "什么时候用"], "rows": [["s<sub>t</sub> = o<sub>t</sub>", "多半不是", "最低", "最少", "观测确实充分时"], ["s<sub>t</sub> = 最近 k 个", "近似", "低", "少", "DQN 用 k=4 帧"], ["学出来的特征", "近似", "中", "中（要训练）", "状态大但有结构"], ["s<sub>t</sub> = h<sub>t</sub>", "<b>永远是</b>", "<b>不可行</b>", "<b>爆炸</b>", "只在理论分析里"]]}, "tip": {"t": "记这一条", "v": "把「这个问题是不是 MDP」这个问法<b>整个丢掉</b>。换成两问：<b>①我选的表示充分吗？②为了让它充分，我付了多少数据？</b>这两问在本课后面每一讲都还用得上。"}, "res": {"tag": "已核", "v": "<b>这一页把你的形式化选择变成了一个可量化的权衡，而不是一个流派之争。</b><br>「Markov 总能满足」意味着：把部分轨迹全塞进状态（P3），你的问题<b>一定</b>是 MDP。所以「它是不是 MDP」这个争论没有内容——<span class='k'>有内容的是「为了让它是，你付了多少数据」</span>。<br>而你付的正是课件列的第二项（data required），在你这里有精确形式：<b>随机化节点数 k 每加 1，ESS 减半</b>（<code>E[m] = n·2^(−k)</code>）。k=10 时 ESS = n/1024。<br>于是整件事变成一句可写进论文的话：<b>更丰富的状态表示买来 Markov 性，代价是有效样本量指数下降；我们用一步偏离扫描把 k 压到 3~4，换取 64 倍 ESS。</b><br>这也解释了为什么<b>顺序必须是「先扫描，后估计」</b>：扫描是在决定状态表示，而状态表示决定了你后面还有多少数据可用。先挑估计量再补扫描，是在对一个还没定下来的分母做优化。<br>那张敏感度表本身就是论文插图。", "ref": "简报 §4b（ESS 推导，已核）· §4c（先扫描后 OPE，已核）· 本页课件原文三项代价"}},
{"r": [50, 50], "t": "完全可观测：MDP", "star": 2, "quote": "<b>Full Observability / Markov Decision Process (MDP)</b> — Environment and world state <b>s<sub>t</sub> = o<sub>t</sub></b>", "one": "<b>观测就是世界状态时，问题叫 MDP。</b>", "pts": ["<b>MDP 是一个「运气好」的特例，不是默认情形。</b> 本课绝大部分内容在 MDP 上展开，是因为它可解，不是因为它常见。", "<b>注意这一页只有一个式子。</b> 课件在这里极简，因为真正的内容在前两页——MDP 只是「表示充分」这件事的一个名字。", "⚠️ <b>「完全可观测」不等于「模型已知」。</b> MDP 里你可能看得见状态但不知道转移概率——那仍然是 RL 问题（L03 起）。模型已知的那一半叫规划（L02）。这两件事经常被并在一起读错。"], "tbl": {"head": ["", "状态可见?", "模型已知?", "叫什么", "本课"], "rows": [["①", "是", "是", "规划 / 动态规划", "L02"], ["②", "是", "<b>否</b>", "<b>MDP 上的 RL</b>", "L03–L10"], ["③", "否", "是/否", "POMDP", "本课基本不展开"]]}},
{"r": [51, 52], "t": "部分可观测：POMDP，自己造状态", "star": 2, "quote": "<b>Partial Observability / POMDP</b> — <em>Agent state is not the same as the world state</em> · Agent constructs its own state, e.g. use history <em>s<sub>t</sub> = h<sub>t</sub></em>, or <em>beliefs</em> of world state, or <em>RNN</em>, ...<br><b>Examples</b>: <em>Poker player (only sees own cards)</em> · <em>Healthcare (don't see all physiological processes)</em>", "one": "<b>agent 状态 ≠ 世界状态时，agent 必须自己造一个状态出来——用历史、用信念、或者用 RNN。</b>", "pts": ["<b>三条造法正好对应三种代价。</b> 用历史：永远正确但不可行。用信念（对世界状态的后验分布）：正确且紧凑，但<span class='w'>要有模型才能算后验</span>。用 RNN：不要模型，但只是近似，且要训练数据。", "<b>两个例子选得很好，因为它们的「看不见」不同。</b> 扑克是<b>对抗性的不可见</b>（别人故意不让你看见），医疗是<b>测不到的不可见</b>（生理过程没有传感器）。前者要考虑对手会利用你的无知，后者不用。", "<b>POMDP 在本课基本不展开</b>（p28「本课基本不讲的」里有交代）。但它的思路渗透在别处：DQN 把最近 4 帧堆起来当状态，就是在用「最近 k 个观测」近似解决部分可观测。", "⚠️ <b>别把 POMDP 读成「MDP 加噪声」。</b> 加噪声的 MDP 仍是 MDP（转移是随机的而已）。POMDP 的困难是<b>你不知道自己在哪个状态</b>，这会让最优策略依赖整个历史，计算复杂度是另一个量级。"], "tbl": {"head": ["造状态的办法", "要不要模型", "精确?", "代价"], "rows": [["s<sub>t</sub> = h<sub>t</sub>（全历史）", "不要", "<b>精确</b>", "不可行"], ["信念状态 P(世界状态\\|h<sub>t</sub>)", "<b>要</b>", "精确", "算后验很贵"], ["RNN 隐状态", "不要", "近似", "要训练"], ["最近 k 个观测", "不要", "近似", "最便宜（DQN k=4）"]]}},
{"r": [53, 53], "t": "赌博机：动作不影响下一个观测", "star": 3, "quote": "<b>Types of Sequential Decision Processes: Bandits</b> — <em>Bandits: actions have no influence on next observations</em> · <em>No delayed rewards</em>", "one": "<b>赌博机 = 你的动作不改变接下来看到什么，也没有延迟奖励。序贯性被抽掉了，只剩探索。</b>", "pts": ["<b>赌博机不是「简单的 RL」，是「抽掉了一个要素的 RL」。</b> 回到 p14 四要素：赌博机保留了优化、探索、泛化，<span class='k'>只去掉延迟后果</span>。所以它仍然很难——难的部分全在探索上。", "<b>去掉延迟后果换来了什么？</b> 换来了<b>功劳分配问题消失</b>：每个动作的奖励当场可见，不需要往回推。这让理论分析变得可做，于是赌博机有非常紧的 regret 界，而完整 MDP 没有。", "<b>上下文赌博机（contextual bandit）是中间态</b>：每轮先看到一个上下文 x，再选动作，奖励依赖 (x, a)，但你的动作不影响下一个 x。<b>大量真实问题其实是这一类</b>——推荐、广告、路由——而它们常被误当成完整 RL 来做。", "⚠️ <b>判断标准只有一条：你的动作改不改变下一个观测的分布。</b> 不改变 → 赌博机。改变 → MDP/POMDP。别看问题「感觉起来有多序贯」。"], "tbl": {"head": ["", "动作影响下一个观测?", "延迟奖励?", "核心困难", "本课"], "rows": [["赌博机", "否", "否", "纯探索", "L11 L12"], ["上下文赌博机", "否（上下文外生）", "否", "探索 + 泛化", "L11 L12"], ["MDP", "<b>是</b>", "<b>是</b>", "探索 + <b>功劳分配</b>", "L02–L10"]]}, "res": {"tag": "已核", "v": "<b>如果可加性检验通过，你的问题落在这一页而不是下一页——而这不是降级，是更诚实的形式化。</b><br>判据就是课件这一句：<b>节点 h 的选择改不改变 h+1 看到的输入分布</b>？改变，是 MDP；不改变（或改变到可忽略），就是<b>上下文赌博机</b>：上下文 = (query, 节点 id)，动作 = 保真度档位。<br>两个直接好处：<b>一</b>、赌博机有紧的 regret 界而完整 MDP 没有，你能证的东西更多。<b>二</b>、审稿人第 1 拳（「为什么是 MDP 而不是 H 个独立决策」）不攻自破——你已经正面回答了。<br><span class='w'>但要防住第 3 拳</span>：|M|=2、H≤5 时构型空间 ≤32，可穷举，探索机制会显得像表演。解法是<b>加宽保真度集合</b>——7B greedy / 7B self-consistency k=3 / 7B k=8 / 72B greedy / prune。这既是防守也是更好的科学。<br><b>顺带一条 framing</b>：AFlow 自己的选择规则是 top-k + Boltzmann + uniform 混合（λ=0.2, α=0.4），<b>没有访问计数、没有置信上界</b>——它本身就不是 UCT，而更接近一个赌博机式的爬山搜索。你在赌博机框架里做，和它的实际机制反而更一致。", "ref": "简报 §7 第 1、3 拳（已核）· §2（AFlow 选择规则，已核，Algorithm 1 / Appendix A.6 行 28–42）"}},
{"r": [54, 54], "t": "MDP / POMDP：动作影响未来", "star": 2, "quote": "<b>Types of Sequential Decision Processes: MDPs and POMDPs</b> — <em>Actions influence future observations</em> · <em>Credit assignment and strategic actions may be needed</em>", "one": "<b>动作影响未来观测时，你就需要功劳分配，也可能需要「战略性动作」——为了以后好而现在故意吃亏。</b>", "pts": ["<b>「strategic actions」这个词课件只提了一次，但它指的是一类很具体的行为</b>：当前奖励不好、但把你带到一个更好的位置的动作。没有延迟后果就不存在这种动作——<span class='k'>赌博机里「最优动作」永远等于「当前期望奖励最高的动作」</span>。", "<b>功劳分配与战略性动作是同一枚硬币的两面。</b> 正着看：这一步为以后铺路（战略）。反着看：以后的好是哪一步铺的（功劳分配）。", "⚠️ 这一页与 p53 合起来是一张分类表，<b>分类依据只有一条</b>：动作影不影响未来观测。记住这一条就够了。"]},
{"r": [55, 55], "t": "世界怎么变：确定性 vs 随机", "star": 1, "quote": "<b>How the World Changes</b> — <em>Deterministic</em>: given history &amp; action, <b>single</b> observation &amp; reward · common in robotics and controls<br><em>Stochastic</em>: given history &amp; action, <b>many potential</b> observations &amp; rewards · common for customers, patients, hard to model domains", "one": "<b>确定性：一个动作一个结果。随机：一个动作一堆可能结果。课件还顺带点了各自的典型领域。</b>", "pts": ["<b>领域的对应不是巧合。</b> 机器人与控制里物理规律稳定，把它当确定性代价不大；顾客与病人则是<span class='w'>本质上不可完全建模</span>的，随机性里装的是「我们没测到的那些变量」。", "<b>确定性假设买来的是什么？</b> 是规划变简单——不用对结果取期望，搜索树不分叉。这就是为什么控制领域能用很深的前向推演。", "⚠️ <b>「随机」在这里既指真随机，也指「我们建模能力之外」。</b> 后者更常见。这一区分在 L02 讲模型误差、L16 讲 certainty-equivalence 时会再出现。"]},
{"r": [56, 56], "t": "火星车：贯穿全课的例子", "star": 3, "quote": "<b>Example: Mars Rover as a Particular MDP</b> — <em>States</em>: location of rover (s<sub>1</sub>, ..., s<sub>7</sub>) · <em>Actions</em>: Left or Right · <em>Rewards</em>: <b>+1 in state s<sub>1</sub>, +10 in state s<sub>7</sub>, 0 in all other states</b>", "one": "<b>七个格子排成一条线，两个动作，两端有奖励：左端 +1，右端 +10，中间全 0。</b>", "pts": ["<b>这个例子会一直用到本讲结束，而且 L02 还会继续用。</b> 值得把三个数字记住：<span class='k'>s₁ 给 +1，s₇ 给 +10，其余 0</span>。后面每次出现值函数、策略、γ 的讨论，都是在这张图上做的。", "<b>例子的设计很讲究：两个奖励一大一小，且在两端。</b> 这样才能造出一个真正的权衡——近的小奖励 vs 远的大奖励，而 <b>γ 决定你选哪个</b>。γ 小就近视，去抓 +1；γ 大就远视，去追 +10。", "<b>这就是 γ 不是超参数的第一个证据。</b> 改 γ 会改变<span class='w'>最优策略本身</span>，不只是缩放值的大小。L02 会算出那个临界 γ。", "⚠️ <b>火星车的动力学是明确写死的教学设定</b>（p59 会给），不是真实探测器。数值别往外引用。"], "tbl": {"head": ["要素", "这个例子里是什么"], "rows": [["状态 S", "s<sub>1</sub> … s<sub>7</sub>（位置），共 7 个"], ["动作 A", "Left / Right，共 2 个"], ["奖励 R", "<b>s<sub>1</sub>: +1 · s<sub>7</sub>: +10 · 其余: 0</b>"], ["策略空间大小", "\\|A\\|<sup>\\|S\\|</sup> = 2<sup>7</sup> = 128"]]}},
{"r": [57, 57], "t": "三个部件：模型、策略、值函数", "star": 3, "quote": "<b>RL Algorithm Components</b> — <em>often include one or more of</em>:<br><b>Model</b>: representation of how the world changes in response to agent's action<br><b>Policy</b>: function mapping agent's states to action<br><b>Value function</b>: future rewards from being in a state and/or action when following a particular policy", "one": "<b>三个部件。注意课件的措辞是「often include one or more of」——一个算法不必三个都有。</b>", "pts": ["<b>「one or more」这四个词就是 p64 与 p78 那两张分类表的来源。</b> 有模型的叫 model-based，只有值函数的叫 value-based，只有策略的叫 policy-based，两个都有的叫 actor-critic。<span class='k'>整门课的算法地图就是这三个部件的组合</span>。", "<b>三者不是平行的，有依赖关系</b>：有了模型可以算出值函数与策略（规划）；有了值函数可以导出策略（贪婪）；只有策略则什么都导不出，得直接优化它。<b>所以「拥有哪个部件」决定了你能做什么</b>。", "<b>值函数的定义里有一个限定词不能丢：<em>when following a particular policy</em>。</b> 值函数永远是<b>相对于某个策略</b>的——写作 V^π 而不是 V。脱离策略谈值是没有定义的（除非特指最优值 V*）。"], "tbl": {"head": ["部件", "回答什么问题", "没有它会怎样"], "rows": [["模型", "我做了 a，世界会变成什么样？", "不能想象，只能试"], ["策略", "在 s 我该做什么？", "不能行动"], ["值函数", "从 s 出发，按 π 走能拿多少？", "不能比较好坏"]]}},
{"r": [58, 59], "t": "模型：转移 + 奖励，而且可能是错的", "star": 3, "quote": "<b>Model</b> — Transition / dynamics model predicts next agent state: <em>p(s<sub>t+1</sub>=s'|s<sub>t</sub>=s, a<sub>t</sub>=a)</em> · Reward model predicts immediate reward: <em>r(s<sub>t</sub>=s, a<sub>t</sub>=a) = E[r<sub>t</sub>|s<sub>t</sub>=s, a<sub>t</sub>=a]</em><br>p59: 0.5 = P(s<sub>1</sub>|s<sub>1</sub>, right) = P(s<sub>2</sub>|s<sub>1</sub>, right) · <b><em>Model may be wrong</em></b>", "one": "<b>模型是两件东西：转移模型（下一步去哪）和奖励模型（这一步拿多少）。课件最后一句是「模型可能是错的」。</b>", "pts": ["<b>两个模型可以分开学、分开错。</b> 你可能转移模型很准但奖励模型很差，反过来也行。<span class='k'>它们的误差对最终策略的影响也不一样</span>——这一点在 L16 讲模型误差复合时会正式展开。", "<b>奖励模型的定义里是期望：<code>r(s,a) = E[rₜ|sₜ=s, aₜ=a]</code>。</b> 也就是说奖励本身可以是随机的，模型记的是它的均值。", "<b>火星车的转移是教学设定</b>：向右以 0.5 成功、否则原地（<code>0.5 = P(s₁|s₁,right) = P(s₂|s₁,right)</code>）。<b>这个设定让「向右走」变成一件需要时间的事</b>，于是 γ 的影响被放大——这正是它被设计成这样的原因。", "<b>「Model may be wrong」是课件自己加的警告，不是我的补充。</b> 这一句是 model-based RL 全部麻烦的源头：用错的模型规划，会自信地得出错的策略，而且<span class='w'>错误会随着规划步数复合放大</span>。"], "tbl": {"head": ["模型的两半", "预测什么", "形式", "错了会怎样"], "rows": [["转移 / 动力学", "下一个状态", "p(s'\\|s,a)", "规划走向错误的未来，<b>误差随步数复合</b>"], ["奖励", "即时奖励的期望", "r(s,a) = E[r<sub>t</sub>\\|s,a]", "目标本身错了，策略朝错方向优化"]]}, "res": {"tag": "已核", "v": "<b>你的问题里这两个模型的可学性差得极远，而这个不对称本身就是一个建模贡献。</b><br><b>成本模型 ≈ 转移模型的角色，但它几乎是确定的</b>：给定保真度与输入长度，token 成本近乎确定 → 直接回归，<b>预期 R² &gt; 0.95，完全不用重要性权重</b>。这是真实且可辩护的方差缩减，值得单独写出来。<br><b>准确率模型才是「may be wrong」的那个</b>：终局奖励，要用 FQE + <b>5 折 cross-fitting</b>（nuisance 不能在自己那折上拟合）。<br>所以<span class='k'>估计量必须拆成两半，两半用不同方法</span>——把它们混在一个估计量里，等于让确定的那一半去承担随机那一半的方差。<br>另外注意：<b>成本报法也要小心。</b> 自托管 vLLM 上 72B/7B 的成本比取决于 batch 占用、TP 度、量化，<span class='w'>不是 OpenAI 价目表</span>。报 token 数 + GPU-秒 + 峰值显存归一吞吐，写明 TP 配置与量化；API 价格另列并明确标注为假设值。这是审稿人第 5 拳。", "ref": "简报 §4e（估计量拆两半，已核）· §7 第 5 拳（成本口径，已核）"}},
{"r": [60, 61], "t": "策略：确定性与随机性", "star": 2, "quote": "<b>Policy</b> — π determines how the agent chooses actions · <em>π : S → A</em>, mapping from states to actions<br>Deterministic: <em>π(s) = a</em> · Stochastic: <em>π(a|s) = Pr(a<sub>t</sub>=a|s<sub>t</sub>=s)</em><br>p61: π(s<sub>1</sub>) = ... = π(s<sub>7</sub>) = right · <em>Quick check: is this a deterministic policy or a stochastic policy?</em>", "one": "<b>策略把状态映到动作。确定性策略给一个动作，随机性策略给一个动作上的分布。</b>", "pts": ["<b>p61 那道 quick check 的答案是「确定性」。</b> 每个状态都固定输出 right，没有分布。<span class='k'>别被「箭头图看起来很简单」误导</span>——确定性与随机的区别在于输出的类型，不在于策略复不复杂。", "<b>为什么需要随机策略？</b> 三个理由，本课后面各占一段：①<b>探索</b>（ε-贪婪，L04）；②<b>部分可观测下随机策略可能严格更优</b>（POMDP）；③<b>策略梯度需要可微的策略</b>，而确定性策略对参数不可微（L08）。", "<b>注意 π 的定义域是 S 不是 H。</b> 这是在用 p47 的 Markov 假设——如果状态不充分，把策略限制在 S 上就是在放弃信息。", "<b>还有第四个理由，课件这里没提但后面会大量用到：随机策略让「这个动作被选中的概率」成为一个可记录的数。</b> 确定性策略下这个概率恒为 1 或 0；随机策略下它是 (0,1) 里的值，<span class='k'>而离策略评估的全部数学都建立在这个数身上</span>。L15 会正式讲。", "⚠️ 记号：确定性写 <code>π(s) = a</code>（输出动作），随机写 <code>π(a|s)</code>（输出概率）。<b>两者括号里的东西不一样</b>，读公式时靠这个区分。"], "tbl": {"head": ["", "形式", "输出", "什么时候必须用"], "rows": [["确定性", "π(s) = a", "一个动作", "已知模型、完全可观测的规划"], ["随机性", "π(a\\|s) = Pr(a<sub>t</sub>=a\\|s<sub>t</sub>=s)", "动作上的分布", "<b>探索</b> · <b>部分可观测</b> · <b>策略梯度</b> · <b>离策略评估</b>"]]}, "res": {"tag": "已核", "v": "<b>随机策略在你这里不是为了探索，是为了让日志可评估——而这是你 Week 1 的动作项。</b><br>你现在的节点执行器跑的是<b>确定性策略</b>：每个节点固定一个模型。于是 π_b(a|h) ∈ {0,1}，支撑集缺失，IS 无定义（见 p70 那格）。<br>修法就是这一页的右半栏：<b>把节点执行器改成随机策略，并把 propensity（该动作被选中的概率）记进日志</b>。简报把它列为第 1 周的动作。<br><span class='w'>但不要直接对所有节点均匀随机化</span>——那会让 ESS 掉到 n·2^(−k)。正确顺序是：<b>先跑一步偏离敏感度扫描</b>（对每个节点 j，跑「节点 j 用 7B、其余 72B」vs「全 72B」，约 100 条 query），按准确率跌幅与 token 占比排序，<b>只对 top k=3~4 的节点随机化，其余按扫描结果钉死</b>。<br>ESS 从 n·2^−10 提到 n·2^−4，<b>64 倍</b>。而且那张敏感度表本身就是论文插图。<br><b>记 propensity 的成本几乎为零，但不记就永远补不回来</b>——这是那种「现在不做，三个月后重跑全部实验」的决定。", "ref": "简报 §9 动作表第 2 条（已核）· §4b §4c（ESS 与扫描优先，已核）"}},
{"r": [62, 62], "t": "值函数：折扣回报的期望", "star": 3, "quote": "<b>Value</b> — Value function V<sup>π</sup>: <em>expected discounted sum of future rewards under a particular policy π</em><br><b>V<sup>π</sup>(s<sub>t</sub>=s) = E<sub>π</sub>[r<sub>t</sub> + γr<sub>t+1</sub> + γ²r<sub>t+2</sub> + γ³r<sub>t+3</sub> + ··· | s<sub>t</sub>=s]</b><br>Discount factor γ weighs immediate vs future rewards", "one": "<b>从状态 s 出发、按策略 π 走下去，未来奖励的折扣和的期望。</b>", "pts": ["<b>拆开看四个部分</b>：<code>E</code>（期望，因为转移和策略都可能随机）、<code>下标 π</code>（按哪个策略走）、<code>γ 的幂次</code>（越远权重越小）、<code>条件在 sₜ=s</code>（从哪出发）。<span class='k'>四个部分缺一个这个式子就不成立</span>。", "<b>γ 的作用课件写得很克制：「weighs immediate vs future rewards」。</b> 但它做的事不止权衡——γ&lt;1 还<b>保证了这个无穷和收敛</b>（奖励有界时）。这是数学上必须有它的理由，L02 会正式证。", "<b>值函数的两个用途课件都列了</b>：量化状态/动作的好坏，以及<b>通过比较来决定怎么行动</b>。第二个才是它存在的理由——值函数不是为了报数，是为了导出策略。", "⚠️ <b>记号陷阱（与 Sutton &amp; Barto 不一致）</b>：CS234 写 <code>rₜ + γr_{t+1} + …</code>，S&amp;B 写 <code>R_{t+1} + γR_{t+2} + …</code>，<span class='w'>差一位下标</span>。跨教材看公式时必须先对齐这一条，否则每个推导都会差一步。"], "eq": "V^π(s_t = s) = E_π[ r_t + γ r_{t+1} + γ² r_{t+2} + γ³ r_{t+3} + ⋯ | s_t = s ]", "tip": {"t": "记号陷阱", "v": "本课 13 讲共统计出 <b>165 条记号陷阱</b>，其中 18 条是与 Sutton &amp; Barto 的约定冲突。<b>回报下标差一位是最典型的那条</b>，从这一页开始贯穿全课。"}},
{"r": [63, 63], "t": "γ=0 是什么意思", "star": 3, "quote": "<b>Example: Mars Rover Value Function</b> — <em>Discount factor, γ = 0</em> · π(s<sub>1</sub>) = ... = π(s<sub>7</sub>) = right<br>V<sup>π</sup>(s<sub>1</sub>) = <b>+1</b> · V<sup>π</sup>(s<sub>2</sub>) = ... = V<sup>π</sup>(s<sub>6</sub>) = <b>0</b> · V<sup>π</sup>(s<sub>7</sub>) = <b>+10</b>", "one": "<b>γ=0 时值函数塌成即时奖励——每个状态的值就是它自己给的那个数，和策略完全无关。</b>", "pts": ["<b>把 γ=0 代进 p62 的式子看一眼</b>：<code>V^π(s) = E[rₜ + 0·r_{t+1} + 0·r_{t+2} + …] = E[rₜ]</code>。除了第一项，全被乘成 0。<span class='k'>所以 γ=0 的 agent 是完全近视的</span>——它对「以后」没有任何概念。", "<b>这就是为什么这一页的值等于奖励本身</b>：s₁ 的值是 +1、s₇ 的值是 +10、中间全 0，和「策略是 right」这件事<b>毫无关系</b>。换成全 left 也是这组数。", "<b>这一页的教学用意是给 γ 的一端立个桩。</b> 另一端（γ→1）在 L02 讲，那时值函数会变成「一路走到底能拿多少」，策略就开始要紧了。<b>γ 从 0 走到 1 的过程，就是 agent 从近视走到远视的过程。</b>", "⚠️ <b>别把「γ=0 时值等于奖励」记成一般规律。</b> 它只在 γ=0 时成立。γ 稍微大一点，中间状态就立刻有非零的值了。"], "tbl": {"head": ["γ", "agent 看多远", "火星车里 V<sup>π</sup>(s<sub>4</sub>)", "策略要紧吗"], "rows": [["0", "只看这一步", "<b>0</b>", "<b>不要紧</b>"], ["接近 0", "看几步", "很小的正数", "开始要紧"], ["接近 1", "看到底", "取决于走向哪端", "<b>非常要紧</b>"]]}, "say": "这一页她是让学生当场算的。<b>值得自己动手代一次</b>——γ=0 代进去、看着后面所有项被乘没，比读十遍定义有用。"},
