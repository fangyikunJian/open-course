{"r": [64, 65], "t": "agent 分类（粗分）：有没有模型", "star": 2, "quote": "<b>Types of RL Agents</b><br><em>Model-based</em>: Explicit: Model · May or may not have policy and/or value function<br><em>Model-free</em>: Explicit: Value function and/or policy function · <b>No model</b><br>p65 <em>Figure from David Silver's RL course</em>（三个圈的交叠图）", "one": "<b>粗分只看一件事：显式地维护世界模型吗？p65 是这张分类的配图，不是新内容。</b>", "pts": ["<b>model-based 的优势是样本效率</b>：学到模型后可以「在脑子里」反复规划，不用再去真实世界试。<span class='k'>一份数据可以用很多次</span>。代价是模型可能是错的（p59 那句警告），而且错误会随规划步数复合。", "<b>model-free 的优势是没有模型误差</b>：直接从经验估值函数或策略，跳过「世界长什么样」这个中间问题。代价是每一点进步都要<b>真实数据</b>换——样本效率低，但你估的东西正是你要用的东西。", "<b>这个权衡的本质是「要不要经过一个中间量」。</b> model-based 走 数据 → 模型 → 策略，model-free 走 数据 → 策略。<b>中间量让你能复用数据，也让你多了一处可能出错的地方。</b> 这是统计里的老问题，不是 RL 特有的。", "<b>什么时候该选 model-based？</b> 真实数据很贵（机器人、医疗、你的 LLM 调用）、或者模型结构已知得比较好时。<span class='k'>数据越贵，经过中间量越划算</span>。", "<b>p65 那张图是 p57「one or more of」的可视化</b>：模型、策略、值函数三个圈两两相交，每块区域对应一类算法。课件开头交代过，这一讲第三部分基于 David Silver 的 RL 入门 slides。", "⚠️ <b>这是「粗分」，p78 有细分。</b> 细分把 model-free 再拆成 value-based / policy-based / actor-critic，并引入「显式 / 隐式」这一层。两张表要一起看。"], "tbl": {"head": ["", "Model-based", "Model-free"], "rows": [["显式维护", "模型", "值函数和/或策略"], ["数据 → 策略的路径", "数据 → <b>模型</b> → 策略", "数据 → 策略"], ["样本效率", "<b>高</b>（数据可复用）", "低"], ["风险", "<b>模型错了，误差随步数复合</b>", "没有模型误差"], ["什么时候划算", "<b>真实数据很贵</b>", "数据便宜、模型难建"]]}},
{"r": [66, 67], "t": "规划 vs 强化学习：差别只在一句话", "star": 3, "quote": "<b>Planning</b> (agent's internal computation) — <em>Given model of how the world works</em> (dynamics and reward model) · algorithm computes how to act to maximize expected reward · <b><em>With no interaction with real environment</em></b><br><b>Reinforcement learning</b> — <em>Agent doesn't know how world works</em> · interacts with world to implicitly/explicitly learn how world works", "one": "<b>规划：模型已给，纯内部计算，不与真实环境交互。强化学习：不知道世界怎么运作，必须交互着学。</b>", "pts": ["<b>分界线只有一条：模型给没给。</b> 不是「难不难」，不是「用不用神经网络」。<span class='k'>给了模型就是规划，没给就是 RL</span>。", "<b>「with no interaction with real environment」这一句是规划的定义性特征。</b> 它意味着规划<b>不消耗真实样本</b>，只消耗算力。这是 model-based 方法的全部吸引力所在：先用少量真实数据学模型，然后在模型里免费规划。", "<b>RL 那半句里的「implicitly/explicitly」也要注意。</b> 显式地学模型 = model-based；隐式地学 = model-free（值函数里其实也编码了世界的信息，只是没写成 p(s'|s,a)）。", "<b>「规划 / RL」与 p64 的「model-based / model-free」是两个不同的切分，别混。</b> 前者问<span class='k'>模型是不是别人给你的</span>，后者问<span class='k'>你自己建不建模型</span>。所以 model-based RL 同时属于 RL（模型没给）和规划（自己估出模型后在里面规划）——<b>它是把 RL 转化成规划的一种做法</b>，而不是第三类东西。", "⚠️ <b>规划不等于简单。</b> 围棋的规则完全已知，规划仍然极难——难在状态空间，不在未知。L16 的 MCTS 就是在对付这种「已知但算不动」的情形。"], "say": "她讲这一对时强调的是 <em>with no interaction with real environment</em> 这一句，说这是规划「最值钱的性质」：<b>算错了不用付代价，可以反复试</b>。RL 里每一次尝试都是真实发生的，错了就真的损失了——而且按 p70 的说法，<b>你还只学到了你试的那一条</b>。这一对照后面一直在起作用：model-based 方法的全部动机，就是尽量把「真实尝试」换成「脑子里的尝试」。", "tbl": {"head": ["", "规划", "强化学习"], "rows": [["模型", "<b>已给</b>", "未知"], ["与真实环境交互", "<b>不需要</b>", "必须"], ["消耗什么", "算力", "<b>真实样本</b> + 算力"], ["主要困难", "状态空间太大", "探索 + 功劳分配 + 状态表示"], ["本课", "L02 · L16", "L03–L15"]]}},
{"r": [68, 69], "t": "接龙：有规则书和没规则书", "star": 2, "quote": "<b>Planning Example</b> — <em>Solitaire</em>: know all rules of game / perfect model · if take action a from state s, can compute probability distribution over next state · can compute potential score · <em>can plan ahead</em> (dynamic programming, tree search)<br><b>RL Example</b> — <em>Solitaire with no rule book</em>: learn directly by taking actions and seeing what happens", "one": "<b>同一个游戏，有规则书是规划，没规则书是强化学习。</b>", "pts": ["<b>这组例子的好处是把变量控制住了</b>：游戏一样、状态空间一样、目标一样，<span class='k'>唯一变的是你知不知道规则</span>。所以两者的差别确实只来自「模型给没给」。", "<b>有规则书时你能做三件事</b>（课件逐条列了）：算出下一状态的分布、算出可能得分、往前推演。这三件事全都<b>不需要真的去玩</b>。", "<b>没规则书时这三件事都做不了，只能「做了看看」。</b> 而「做了看看」立刻带来 p70 的问题：你只看得到你试过的那些。", "<b>中间还有一档课件没列，但实际最常见：规则书是自己写的，而且可能写错。</b> 这就是 model-based RL——先从数据估出一本「规则书」，再拿它规划。<span class='k'>它享受规划的样本效率，同时承担 p59 那句「model may be wrong」的风险</span>。L16 的 certainty-equivalence 讲的就是这一档。", "⚠️ 接龙是单人游戏，所以没有对手建模的问题。<b>换成双人游戏，「知道规则」也不够</b>——你还得知道对手怎么想。这是本课不覆盖的多智能体部分（p28 有交代）。"], "tbl": {"head": ["有没有规则书", "能做什么", "对应", "风险"], "rows": [["有，且正确", "算下一状态分布、算得分、前向推演", "规划（L02 L16）", "只有算力"], ["<b>自己估的</b>", "同上，但基于估出来的规则", "model-based RL", "<b>模型错了会复合放大</b>"], ["没有", "只能做了看看", "model-free RL（L03–L10）", "样本贵、探索难"]]}, "res": {"tag": "推断", "v": "<b>你的穷举 oracle 表，本质上就是「给 300 条 query 写一本规则书」。</b><br>取 200–300 条<b>留出</b> query，枚举 k 个决策节点的全部 2^k 种分配，<b>跨分支共享前缀</b>（拓扑前缀完全一致的分支，节点输出可逐字复用）。k=4 时每 query ≤16 个叶子、约 30 次节点调用，300 条 ≈ <b>9000 次节点调用，且多数是 7B</b>。<br>得到的精确表 <code>R(x, a₁..a_k)</code> 让你在这个子集上<b>从「没有规则书」跳到「有规则书」</b>——任何确定性节点级策略都能查表精确求值，<span class='k'>估计量方差为零</span>。<br><b>这不是 OPE，是全因子实验。</b> 在你付得起的规模上，它碾压任何估计量。用它当 ground truth，去校准你在完整数据集上的估计量。<br>而且它正好是检验那个开放问题的 ground truth：<b>能否用 O(H) 或 O(H log H) 次 rollout（而非 O(2^H)）估出节点对端到端准确率的边际贡献（Shapley 式），并带有限样本集中不等式？</b><br>标【推断】：「oracle 表 = 局部规则书」这个类比是我的；表本身的设计与成本估算在简报里是【已核】。", "ref": "简报 §4d（穷举 oracle，已核，含成本估算）· §8 开放问题第 1 条（已核）"}},
{"r": [70, 70], "t": "一句显而易见的话，和它带出的困境", "star": 3, "quote": "<b>Exploration and Exploitation</b> — <em>Agent only experiences what happens for the actions it tries</em> · Mars rover trying to drive left learns the reward and next state for trying to drive left, <em>but not for trying to drive right</em> · <b><em>Obvious! But leads to a dilemma</em></b>", "one": "<b>agent 只经历它试过的那些动作的后果。课件自己加了一句：显而易见！但由此产生一个困境。</b>", "pts": ["<b>「Obvious!」这个感叹号是课件自己打的，值得重视。</b> 它在提示：<span class='k'>这句话简单到你会直接滑过去，而后面十几讲的困难全都从它来</span>。", "<b>火星车的例子把它具体化了</b>：试了向左，你就知道向左的奖励和下一个状态；<b>向右的你一无所知</b>。不是知道得少，是<b>一点都不知道</b>。", "<b>这与 p17 的「删失数据」是同一件事，隔了 53 页又说了一遍。</b> 课件重复它不是冗余——p17 是在讲 RL 的特征，这里是在推出探索-利用困境。<b>同一个事实，两个用途。</b>", "<b>困境是怎么来的</b>：因为只知道试过的，所以「用已知的最好选项」（利用）与「试点新的好知道更多」（探索）会互相竞争同一批机会。<b>机会是有限的，这才成为困境。</b>"], "res": {"tag": "已核", "v": "<b>课件这一句就是你日志问题的教科书表述，只是它没给术语。</b><br>「agent 只经历它试过的那些动作的后果」——你的 AFlow 日志里，<b>每个节点只「试过」一个配置</b>（固定模型），所以 π_b(a|h) ∈ {0,1}。于是对任何与已跑配置不同的候选策略，重要性权重<b>恒为 0</b>。<br><span class='w'>这不是「高方差的 IS」，是 IS 无定义</span>——即 deficient support（Sachdeva / Su / Joachims）。课件说的「but not for trying to drive right」，在你这里就是「but not for running this node with 7B」。<br><b>诚实的结论</b>：就现有日志而言，「不重跑就评估新策略」做不到。加再多数据也不会好转，因为缺的不是数据量是<b>支撑集</b>。<br><b>但现有日志仍有三样不需要随机化就能挖的东西</b>：①拟合结果模型 Q̂ 与成本模型（DR 的 nuisance 分量 / FQE 的回归目标）；②已跑配置（all-72B、all-7B）的 on-policy 蒙特卡洛值——<b>Pareto 前沿上白送的两个点</b>；③节点级特征工程与难度打分。<br>第一件该做的事也很清楚：<b>审计现有日志，确认记的是动作分布还是只有实际 model id</b>（简报把它列为「立刻，1 天」）。", "ref": "简报 §4a（已核/推断）· §9 动作表第 1、2 条（已核）"}},
{"r": [71, 72], "t": "探索与利用：必须牺牲一点当下", "star": 3, "quote": "<b>Exploration</b>: trying new things that might enable the agent to make better decisions in the future<br><b>Exploitation</b>: choosing actions that are <em>expected to yield good reward given past experience</em><br><em>Often there may be an exploration-exploitation tradeoff · may have to sacrifice reward in order to explore</em><br>p72: Movies · Advertising · Driving", "one": "<b>探索是为了以后更好而试新的，利用是拿现在已知最好的。权衡在于：探索往往要牺牲当下的奖励。</b>", "pts": ["<b>课件对利用的定义里有一个限定：<em>given past experience</em>。</b> 「已知最好」是<span class='k'>相对于你现有经验</span>的最好，不是真正的最好。这正是困境成立的原因——如果你已知真正的最好，就不需要探索了。", "<b>「may have to sacrifice reward」是这一页的核心。</b> 探索不是免费的：你把一次机会花在一个期望更低的动作上。<b>没有这个牺牲就没有困境</b>，只有「多做点事」。", "<b>p72 的三个例子分别对应三种不同的成本结构。</b> 电影：探索成本 = 一次可能糟糕的观影体验，可恢复。广告：探索成本 = 一次转化率损失，可量化、可承受。开车：探索成本 = 可能迟到，<b>但也可能发现更快的路，且信息可复用</b>。", "⚠️ <b>本课后面所有探索算法都不是在「决定要不要探索」，而是在「以多大力度、朝哪个方向探索」。</b> ε-贪婪按固定概率、UCB 朝不确定性大的方向、Thompson 按后验采样——三种不同的分配方式。"], "tbl": {"head": ["例子", "利用", "探索", "探索的成本"], "rows": [["电影", "重看喜欢的", "看新片", "一次可能糟糕的体验"], ["广告", "投目前最有效的", "投不同的", "一次转化率损失"], ["开车", "走经验里最快的路", "试别的路", "可能迟到（但信息可复用）"]]}},
{"r": [73, 73], "t": "评估与控制：两件事，先后有序", "star": 3, "quote": "<b>Evaluation and Control</b><br><em>Evaluation</em>: <b>estimate/predict the expected rewards from following a given policy</b><br><em>Control</em>: <b>optimization: find the best policy</b>", "one": "<b>评估是「给定一个策略，它能拿多少」；控制是「找出最好的策略」。本课几乎每一讲都按这个顺序讲两遍。</b>", "pts": ["<b>这一对区分是本课的结构骨架。</b> L03 是无模型<b>评估</b>，L04 是无模型<b>控制</b>；L02 里策略评估先于策略迭代。<span class='k'>顺序从不颠倒：先会评估，才能控制</span>。", "<b>为什么评估必须在前？</b> 因为绝大多数控制方法的内核是「评估 → 改进 → 再评估」。<b>不能比较两个策略的好坏，就无法改进</b>。", "<b>评估比控制更基础，也更容易被低估。</b> 控制问题里评估的误差会被优化过程放大——你朝着一个估错的方向优化，会自信地走向错误策略。这是 L15 反复强调的事。", "⚠️ 注意评估的定义里是「<em>a given policy</em>」——<b>给定的那个策略不必是你正在执行的那个</b>。当它不是时，这件事就叫<b>离策略评估（off-policy evaluation）</b>，是 L15 整讲的内容。"], "tbl": {"head": ["", "评估", "控制"], "rows": [["问题", "给定 π，V<sup>π</sup> 是多少？", "哪个 π 最好？"], ["输出", "一个数（或一张值表）", "一个策略"], ["谁依赖谁", "—", "<b>依赖评估</b>"], ["本课", "L03（无模型评估）· <b>L15（离策略评估）</b>", "L04（无模型控制）· L08–L10"]]}, "res": {"tag": "已核", "v": "<b>你的整个课题坐在「评估」这一格里，不在「控制」里——想清楚这件事会改变论文的写法。</b><br>课件对评估的定义是「估计遵循<b>给定</b>策略的期望回报」，而你要回答的正是：<span class='k'>在把新的保真度分配策略上线之前，它的 Acc 和 Cost 是多少？</span>这就是离策略评估，一字不差。控制（找最优分配）反而是次要的——因为构型空间小到可穷举（|M|=2、H≤5 时 ≤32 种）。<br><b>三个后果</b>：<br>① <b>L15 是这门课对你最重要的一讲</b>，不是 L11–L13。它是 Brunskill 自己的研究讲座，几乎全建在 Philip Thomas 的工作上，覆盖 IS / PDIS / WIS / DR / 高置信离策略评估。<br>② 评估做不好会<b>被优化放大</b>：你朝一个估错的方向挑配置，会自信地选出一个更差的。这正是「安全策略改进」存在的理由。<br>③ 而你的评估目前<b>做不了</b>（支撑集缺失，见 p70 那格）。所以真实的工作顺序是：<b>审计日志 → 一步偏离扫描（带止损闸与可加性检验）→ 穷举 oracle 表 → 才轮到估计量</b>。<br><b>别先挑估计量。</b> 估计量是最后一步，不是第一步。", "ref": "thread0（cs234_anchor：L15 是 Brunskill 自己的研究讲座，已核）· 简报 §4c §4d · §9 动作表"}},
{"r": [74, 75], "t": "两道练习：评估与控制各一", "star": 2, "quote": "p74 <b>Policy Evaluation</b> — π(s<sub>1</sub>) = ... = π(s<sub>7</sub>) = right, <em>γ = 0</em> · <em>What is the value of this policy?</em><br>p75 <b>Policy Control</b> — <em>γ = 0</em> · <em>What is the policy that optimizes the expected discounted sum of rewards?</em>", "one": "<b>同一张火星车图，同一个 γ=0，一道问值、一道问最优策略——正好演示评估与控制的分工。</b>", "pts": ["<b>p74（评估）的答案</b>：γ=0 所以值就是即时奖励，<code>V(s₁)=+1, V(s₂)…V(s₆)=0, V(s₇)=+10</code>，<span class='k'>与策略是 right 无关</span>。", "<b>p75（控制）的答案需要小心。</b> γ=0 时 agent 完全近视，只看这一步的奖励。而<b>在这个设定下动作本身不产生奖励</b>——奖励由你<b>所处的状态</b>给。所以 γ=0 时任何策略的值都一样，<span class='w'>「最优策略」不唯一</span>。", "<b>这两道题合起来是在演示一件事：γ=0 让控制问题退化。</b> 只有 γ&gt;0 时「走向 s₇」才有意义，最优策略才变得唯一且有趣。<b>这是 γ 不是超参数的第二个证据。</b>", "⚠️ 做这两题时<b>不要偷偷把 γ 想成 1</b>。这是最常见的错——看到火星车就条件反射地算「走到 s₇ 拿 +10」，但题目写的是 γ=0。"], "tbl": {"head": ["", "p74 评估", "p75 控制"], "rows": [["给了什么", "策略（全 right）+ γ=0", "只有 γ=0"], ["问什么", "这个策略值多少", "哪个策略最好"], ["答案", "V = (+1,0,0,0,0,0,+10)", "<b>γ=0 时不唯一</b>——任何策略都一样"], ["说明了什么", "评估不需要比较", "<b>γ=0 让控制退化</b>"]]}, "say": "这两页她是留给学生当场做的，而且<b>故意用了 γ=0</b>。用意是让人先在最简单的设定下把「评估」和「控制」这两个词的区别弄清楚，再去面对 γ&gt;0 时两者都变难的情形。<span class='k'>先把一个变量钉死，是这门课反复用的教学手法</span>——后面 L02 讲值迭代收敛时还会这么干。"},
{"r": [76, 76], "t": "课程大纲：这门课的地图", "star": 2, "quote": "<b>Course Outline</b> — Markov decision processes &amp; planning · Model-free policy evaluation · Model-free control · RL with function approximation &amp; Deep RL · Policy Search · Exploration · Advanced Topics", "one": "<b>七段。它们正好是 p14 四要素与 p73「评估/控制」两条线交织出来的顺序。</b>", "pts": ["<b>读法：前三段在把「模型已知」一步步拿掉</b>——① MDP 与规划（模型全给）→ ② 无模型评估（模型没了，先学会评估）→ ③ 无模型控制（再学会改进）。<span class='k'>这三段是同一条线上的三步，不是三个话题</span>。", "<b>第四段（函数逼近与深度 RL）换的是另一根轴</b>：状态从「可枚举」变成「不可枚举」。它与前三段正交——可以在任意一段上叠加函数逼近。", "<b>第五段策略搜索（Policy Search）是第三条路</b>：不绕值函数，直接对策略求导。对应 L08–L10。", "<b>第六段探索单列，对应 L11–L13。</b> 到这里才正式处理 p17 与 p70 反复铺垫的那个困难。", "⚠️ <b>本精读对应的讲次</b>：① L02 · ② L03 · ③ L04 · ④ L05 L06 · ⑤ L08 L09 L10（L07 模仿学习插在中间）· ⑥ L11 L12 L13 · ⑦ L15 L16。<b>官方没有 lecture 14</b>——那一格是客座讲座（Meta-Learning），视频和 slides 都没发布。"], "tbl": {"head": ["大纲段", "拿掉/加上了什么", "对应讲次"], "rows": [["① MDP 与规划", "模型全给", "L02"], ["② 无模型策略评估", "<b>拿掉模型</b>，先学评估", "L03"], ["③ 无模型控制", "再学改进", "L04"], ["④ 函数逼近与深度 RL", "<b>加上</b>不可枚举的状态", "L05 L06"], ["⑤ 策略搜索", "绕开值函数", "L08 L09 L10"], ["⑥ 探索", "正式处理探索-利用", "L11 L12 L13"], ["⑦ 进阶", "离线 RL、MCTS", "L15 L16"]]}},
{"r": [78, 78], "t": "agent 分类（细分）：显式与隐式", "star": 3, "quote": "<b>Types of RL Agents: What the Agent (Algorithm) Learns</b><br><em>Model-based</em>: Explicit: Model · Implicit: policy and/or value function (can use model to plan)<br><em>Value-based</em>: Explicit: Value function · Implicit: policy (can derive a policy from value function)<br><em>Policy-based</em>: Explicit: Policy · No value function<br><em>Actor-Critic</em>: Explicit: Policy · Explicit: Value function", "one": "<b>四类。关键是课件引入了「显式 / 隐式」这一层：你没有显式维护的东西，常常仍然可以导出来。</b>", "pts": ["<b>「隐式」这个词是这张表的全部价值。</b> value-based 方法没有显式策略，但<span class='k'>可以从值函数贪婪地导出一个</span>；model-based 没有显式策略，但可以用模型规划出一个。<b>所以「没有」不等于「不能有」。</b>", "<b>policy-based 那一行的「No value function」是真的没有</b>，不是隐式——课件在这一行没写 Implicit。这意味着纯策略梯度方法<b>无法比较状态的好坏</b>，只能比较整条轨迹的回报，这正是它方差大的根源（L08 会讲基线怎么补救）。", "<b>actor-critic 是唯一两者都显式的。</b> 它的动机就是补上 policy-based 缺的那一半：用值函数（critic）给策略（actor）提供低方差的信号。", "⚠️ <b>课件最后一句是 <em>Algorithms can ...</em>（被截断）</b>，完整意思是这些类别可以组合——现实中的算法常常横跨两类。<b>别把这张表当成互斥分区。</b>"], "tbl": {"head": ["类别", "显式维护", "隐式可导出", "缺什么"], "rows": [["Model-based", "模型", "策略、值函数（靠规划）", "—"], ["Value-based", "值函数", "策略（贪婪导出）", "模型"], ["Policy-based", "策略", "<b>无</b>", "<b>值函数</b>（方差大的根源）"], ["Actor-Critic", "策略 + 值函数", "—", "模型"]]}, "res": {"tag": "推断", "v": "<b>你的方法在这张表上是个混合体，而这个混合本身值得写出来。</b><br>对<b>成本</b>那一半你是 <span class='k'>model-based</span>：你显式拟合一个成本模型（给定保真度与输入长度，token 成本近乎确定，R² &gt; 0.95），然后用它<b>规划</b>——不需要重要性权重，也不需要真跑。<br>对<b>准确率</b>那一半你是 <span class='k'>value-based</span>：FQE 拟合的就是一个 Q̂，策略从它导出。<br>所以一句可以写进论文的话：<b>我们对目标的两个分量采用不同的估计范式——确定性分量走 model-based 回归，随机分量走 fitted-Q 评估——因为它们的可学性相差一个数量级。</b>这不是工程细节，是 §4e 说的「真实且可辩护的方差缩减」。<br><b>另外注意 FQE 踩在哪条线上</b>：它是<b>自举 + 函数逼近 + 离策略</b>三者同时出现，正好是 L05 讲的「致命三件套」。<span class='w'>FQE 可能不收敛，这不是实现 bug 而是已知的结构性风险</span>——L05 精读那一讲会展开，届时要回来把这条接上。<br>标【推断】：两半各自的方法在简报里是【已核】；「把它当成分类表上的混合体来 framing」是我的建议。", "ref": "简报 §4e（已核）· L05 致命三件套（原课，待该讲精读时接回）"}}
];

var TH = {"title": "L01 接上课题的哪一段：形式化是待检验的假设，不是起点", "arc": "这一讲给出的东西看着像你课题的起点，其实是<b>一个待检验的假设</b>。<br><br>L01 的四要素（p14）恰好是你问题的一张检查表：<b>优化</b>成立（<code>G = Acc − λ·Cost</code>，而这正是真贡献——AFlow 的 Executor 同时返回 score 与 cost，但 cost 从不进入 score）；<b>探索</b>成立，但障碍不是试错贵而是日志没有随机化（p17 那格）；<b>泛化</b>成立，但方向是跨 workflow 迁移而非跨状态；<b>延迟后果</b>——<span class='w'>这一格是待证的</span>。<br><br>而「延迟后果」是否成立，决定了整篇论文的形式化：若节点效应近似可加，诚实的写法是「每节点代价敏感选择」，不是序贯决策。所以 L01 在你的阅读顺序里<b>不是第一讲，而是第二个决定</b>——第一个决定是跑可加性检验，拿到数据再回来选形式化。<b>两种结论都各写一份形式化，用数据选。</b><br><br>与本课其余部分的接法：p16 的功劳分配 → L03 / L08–L09 与你的 oracle 表；p17 的删失数据 → L15 的 OPE 与 deficient support；p18–p19 的「策略输入是过去的经验」→ 你的 P2/P3 消融。", "pitfalls": [{"v": "<b>先设 MDP 再找证据。</b> 把「node-level fidelity assignment 形式化为 CMDP」当交付物是错的顺序。审稿人对 NLP 论文里进口 RL 形式化本来就警惕，理由正是「加了记号没加预测力」。<b>MDP 框架必须被实验挣得。</b>", "tag": "已核", "ref": "简报 §5"}, {"v": "<b>在没有 headroom 的 benchmark 上建 router。</b> 止损闸：若某 benchmark 上 <code>Acc(全强) − Acc(全弱) &lt; 约 4 个百分点</code>，该 benchmark 没有 headroom，应当<b>放弃</b>，而不是在上面建一个打不过噪声的 router。这条闸要在第 1 周就过。", "tag": "已核", "ref": "简报 §5"}, {"v": "<b>以为现有日志能做 OPE。</b> 日志是确定性的，π_b(a|h) ∈ {0,1}，违反 coverage。<span class='w'>这不是高方差的 IS，是 IS 无定义</span>（deficient support）——加再多数据也不会好转。诚实的答案是：就现有日志而言「不重跑就评估新策略」做不到。", "tag": "推断", "ref": "thread0 · 简报 §4a（基于 agent 对执行器的分析 + OPE 标准理论）"}, {"v": "<b>随机化了就以为万事大吉。</b> 均匀日志 + 确定性目标下，WIS <b>精确退化为拒绝采样</b>，<code>ESS = m</code>，<code>E[m] = n·2^(−k)</code>。k=10 时 ESS = n/1024。<b>必须先降有效时域再谈估计量</b>：一步偏离扫描 → 只留 top k=3~4 个随机化节点 → ESS 提升 64 倍。", "tag": "已核", "ref": "简报 §4b §4c"}, {"v": "<b>跟着 AFlow 叫它 MCTS。</b> AFlow 的选择规则是 top-k(k=3) + 混合分布 <code>P(i) = λ·(1/n) + (1−λ)·softmax(α(s_i − s_max))</code>，λ=0.2、α=0.4。<b>没有访问计数，没有置信上界，没有 expectimax/minimax 回传</b>；Backpropagation 只是把 (parent, modification, avgScore) 追加进父节点的经验日志。实为 Boltzmann + uniform 的爬山搜索。懂 RL 的审稿人会记账。正确叫法是 Boltzmann-greedy selection 或 LLM-guided evolutionary search。", "tag": "已核", "ref": "thread2 · 简报 §2（AFlow Algorithm 1，Appendix A.6，行 28–42）"}, {"v": "<b>用 OpenAI 价目表报成本。</b> 自托管 vLLM 上 72B/7B 的成本比取决于 batch 占用、TP 度、量化。要报 <b>token 数 + GPU-秒 + 峰值显存归一吞吐</b>，写明 TP 配置与量化；API 价格另列并<b>明确标注为假设值</b>。", "tag": "已核", "ref": "简报 §7 第 5 拳"}, {"v": "<b>提升落在种子方差内。</b> 这是最致命且<b>完全可预防</b>的评语。要给 n、种子数、对准确率差的 <b>paired bootstrap CI</b>，以及把 LLM 采样噪声与路由决策分开的方差分解。", "tag": "已核", "ref": "简报 §7 第 6 拳"}], "ammo": [{"q": "为什么是 MDP 而不是 H 个独立决策？", "a": "用<b>可加性检验</b>正面回答：比较 <code>Σ_h Δ_h^down</code> 与 <code>Acc(全强) − Acc(全弱)</code>；再配 <b>P2 vs P3 消融</b>（策略只看 (query, 节点 id) 还是也看部分轨迹）。<b>序贯信息带来的提升不到 2 个百分点就别用 MDP 框架。</b>两种结论各写一份形式化，用数据选。", "tag": "已核", "ref": "简报 §7 第 1 拳 · §5"}, {"q": "你的 bound 假设线性可实现性，请论证。", "a": "<b>论证不了，也别试。</b> 写一小节「我们不主张什么」，明说现成 regret 界需要线性可实现或线性转移核，<b>二者在文本上都不可验证</b>。主动划出边界比被问住好。", "tag": "已核", "ref": "简报 §7 第 2 拳"}, {"q": "两个模型就是两条臂，决策问题在哪？", "a": "这一拳打得对——|M|=2、H≤5 时构型空间 ≤32，可穷举，探索机制显得像表演。解法是<b>加宽保真度集合</b>：7B greedy / 7B self-consistency k=3 / 7B k=8 / 72B greedy / prune。<b>这也是更好的科学</b>，不只是防守。", "tag": "已核", "ref": "简报 §7 第 3 拳"}, {"q": "相对 LLMSelector / SCOPE / DAAO / MaAS 的新意在哪？", "a": "可辩护的立足点是这几条的<b>交集</b>：<b>per-query 自适应 × 节点级 × 在自动搜索（非手工设计）的 workflow 内 × 带分布无关保证</b>。这个交集没人占。另一条 framing：把升级机制描述成「<b>FrugalGPT 在 workflow 内部的节点粒度版本</b>」，对 ACL 审稿人比 MCTS 叙事更易读。", "tag": "已核", "ref": "简报 §6 §7 第 4 拳"}, {"q": "开篇怎么把贡献从「主张」变成「引用」？", "a": "AFlow §3.1 把节点定义为 <b>N(M, τ, P, F)</b>，搜索空间中 <b>M 是可变的</b>；§3.2 随即写道为了搜索效率<b>固定 M、τ、F</b>，空间塌缩为 {提示, 边, 算子}。<b>所以 node-level fidelity assignment 是 AFlow 形式化里本来就有、然后为了可解性被砍掉的那一维。</b>审稿人无法要求你证明这个 gap 存在——原作者自己写下了它。（README 还显示 Node 接口已暴露 LLM / temperature / format / prompt，代码里已经存在。）", "tag": "已核", "ref": "简报 §1（arXiv:2410.10762v4 / ICLR 2025 camera-ready，§3.1 与 §3.2）"}], "papers": [{"t": "ExTS — Exploit More, Explore Smarter for Budget-Constrained Agentic Search", "id": "arXiv 2608.23848", "why": "<b>最危险的一篇。</b> 论点与你的操作性主张几乎同构：评估昂贵时标准 MCTS 预算分配很差，且做了 workflow optimization。<b>既佐证你的批评，也部分占了你的地</b>——必须引用并明确定位差异。"}, {"t": "EvoFlow — Evolving Diverse Agentic Workflows On The Fly", "id": "arXiv 2502.07373", "why": "<b>范围风险，且是【待核】。</b> 声称用弱开源模型以 o1-preview 的 12.4% 成本超过它。需确认它的 \"heterogeneous\" 是指<b>每算子不同 LLM 骨干</b>还是仅指种群结构多样性。<span class='w'>写 novelty 之前务必读方法节</span>——简报把这条列为立刻要做的动作。"}, {"t": "ScoreFlow — 用 Score-DPO 梯度优化替代离散搜索", "id": "arXiv 2502.04306", "why": "说明这个领域<b>正在离开 MCTS 式搜索</b>。影响你的 framing 决策：若跟着讲 MCTS 叙事，可能在讲一个正在退场的故事。"}, {"t": "AFlow — Automating Agentic Workflow Generation", "id": "arXiv 2410.10762v4", "why": "你的基座。§3.1/§3.2 那处「定义了 M 可变、随即固定 M」是你开篇那句引用的出处；Algorithm 1 + Appendix A.6 行 28–42 是「它不是 UCT」的证据。"}, {"t": "FrugalGPT", "id": "arXiv 2305.05176", "why": "framing 用。把你的升级机制说成「FrugalGPT 的节点粒度版本」，对 ACL 审稿人比 RL 叙事易读得多。"}, {"t": "LLMSelector / SCOPE / DAAO / MaAS / neural-bandit pipeline", "id": "2502.14815 · 2606.00774 · 2509.11079 · 2502.04180 · 2508.09958", "why": "审稿人会拿这一串问 novelty。用四条交集定位（per-query × 节点级 × 自动搜索的 workflow 内 × 分布无关保证）逐个划清。"}, {"t": "ADAS / Meta Agent Search", "id": "arXiv 2408.08435", "why": "AFlow 对标的前身。你继承这个比较，不必重做。"}]};

(function(){
  var PDF="../slides/lecture01.pdf", MAX=78;
  var frame=document.getElementById("pdf"), card=document.getElementById("card"),
      pnum=document.getElementById("pnum"), strip=document.getElementById("strip"),
      right=document.getElementById("right");
  var cur=0, map={}, cells=[];
  /* 科研格出处档位 → 类名。三档与 research/00-BRIEFING 的原始标注一致。 */
  var RESC={"已核":"t1","推断":"t2","待核":"t3"};

  /* 存档键带课程前缀 —— file:// 下所有本地页面共用一个 origin，
     两门课都用 "l01quiz" 会互相覆盖。 */
  var KEY = document.body.dataset.key;
  try {                       // 一次性迁移：早期版本用的是不带课程前缀的键
    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("l01quiz");
      if(_old){
        localStorage.setItem(KEY+"quiz", _old);
        var _p = localStorage.getItem("l01p");
        if(_p) localStorage.setItem(KEY+"p", _p);
      }
      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，
         用户「清空全部记录」之后下次打开又被复活一遍。 */
      localStorage.removeItem("l01quiz");
      localStorage.removeItem("l01p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=PDF+"?p="+p+"#page="+p+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  /* ── 主题切换按钮。属性已由 <head> 里那段先设好，这里只负责接线与图标 ── */
  (function(){
    var root = document.documentElement, btn = document.getElementById("themeBtn");
    function paint(){
      var dark = root.getAttribute("data-theme") === "dark";
      btn.textContent = dark ? "☀" : "☾";
      btn.title = dark ? "切到浅色" : "切到暗色";
    }
    paint();
    btn.onclick = function(){
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try{ localStorage.setItem("reader-theme", next); }catch(e){}
      paint();
    };
  })();

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
