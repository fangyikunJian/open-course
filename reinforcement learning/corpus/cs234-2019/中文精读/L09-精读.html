本本来就是它产生的，比值 <code>π_θ/π_old</code> 在起点处等于 1</span>。<span class='k'>课件提到的 vine 采样法是另一种做法</span>——<b>从若干状态出发各自分叉采多条，能降方差但要求环境可以重置到任意状态</b>，<span class='w'>这个要求在真实系统里往往不成立。</span>"], "quote": "Don't know the visitation weights nor true advantage function. Instead do the following substitutions: &nbsp;·&nbsp; <b>① Σ_s ρ^π(s)[...] → (1/(1−γ)) E_{s∼ρ_{θ_old}}[...]</b> &nbsp;·&nbsp; <b>② Σ_a π_θ(a|s_n) A_{θ_old}(s_n,a) → E_{a∼q}[ (π_θ(a|s_n)/q(a|s_n)) A_{θ_old}(s_n,a) ]</b> &nbsp;·&nbsp; <b>③ A_{θ_old} → Q_{θ_old}</b> &nbsp;·&nbsp; <b>Note that the above substitutions do not change solution to the optimization problem</b> &nbsp;·&nbsp; Standard approach: sampling distribution q(a|s) is simply π_old(a|s)", "tbl": {"head": ["替换", "换掉什么", "换成什么", "为什么能换"], "rows": [["①", "<code>Σ_s ρ^π(s)[…]</code>", "<code>(1/(1−γ))·E_{s∼ρ_old}[…]</code>", "<span class='k'>归一化，常数提到外面</span>"], ["②", "<code>Σ_a π_θ(a|s)A(s,a)</code>", "<code>E_{a∼q}[(π_θ/q)·A]</code>", "<b>重要性采样（L03 那一套）</b>"], ["③", "<code>A_{θ_old}</code>", "<code>Q_{θ_old}</code>", "<span class='k'>只差一个与动作无关的 V，不影响 arg max</span>"], ["<b>q 取什么</b>", "—", "<code>π_old</code>", "<span class='w'>样本本来就是它产生的；vine 法见原论文</span>"]]}, "res": {"tag": "推断", "v": "<b>第二次替换那一步，就是你每天在做的事：<span class='k'>拿旧配置采的日志，去估一套新配置下的期望</span>。</b><br><br><b>而这一页顺带给了一个你可能没意识到的好消息：<span class='k'>信赖域约束同时在管两件事</span>。</b><br><b>① 它保证代理目标还是个好近似</b>（p36–p38 的那条线）；<br><b>② 它顺带把重要性权重 <code>π_new/π_old</code> 的方差压住了</b>——<span class='w'>两个策略差得远时比值会爆炸，这是 L03 就讲过的老毛病</span>。<br><span class='k'>一个约束，两个收益。</span><b>这个「一石二鸟」在你的设定里尤其值钱，因为你的日志量有限，方差是真正的敌人。</b><br><br><b>翻译成你的操作：给每个候选配置算一个「和日志配置的 KL 距离」，并用它来决定你有多信任对它的估计。</b><span class='w'>这和 p33 科研格给的建议是同一条，但这里有了更具体的理由</span>——<b>距离远不只意味着「代理目标不准」，还意味着「重要性权重方差大」，两个毛病叠加。</b><br><br><b>还有一条直接可用的诊断，花费几乎为零：<span class='k'>算有效样本量 <code>ESS = (Σw)² / Σw²</code></span></b>，其中 <code>w</code> 是重要性权重。<b>ESS 远小于实际样本数，说明权重被少数几条样本主导，这个估计不可信。</b><span class='w'>简报 §4c 里你已经在用 ESS 了</span>——<b>这一页告诉你它和「该走多远」是同一个量的两种用法：ESS 低 ⇔ 两个分布差太远 ⇔ 你走出了信赖域。</b><br><br><b>最后提一句 vine 采样：它要求环境能重置到任意状态。</b><span class='k'>而你的环境<b>恰好可以</b></span>——<b>你完全可以从同一个中间产物出发，让后续节点用不同的保真度各跑一遍。</b><span class='w'>这在机器人领域做不到（不能把机器人瞬移回某个姿态），在你这里只是重放一次上下文</span>。<b>这是又一个「别人的约束对你不成立」的例子，值得评估一下能不能用上。</b>", "ref": "课件 p43–p45（三次替换；q = π_old；vine）· L03 重要性采样 · 本讲 p33 科研格 · 简报 §4c"}},
{"r": [46, 46], "t": "怎么求下一个参数", "one": "目标用<b>线性</b>近似，约束用<b>二次</b>近似，再解这个带约束的问题。", "pts": ["解法：<span class='k'>共轭梯度</span>。", "<b>这一页的两个近似是有讲究的，而且「哪个用线性、哪个用二次」不能反过来。</b><span class='k'>目标 <code>L</code> 用一阶近似：因为它在当前点的梯度就是真梯度（p36），一阶信息已经足够准</span>。<span class='k'>约束 <code>D_KL</code> 用二阶近似：因为 KL 在当前点处取最小值 0，一阶导也是 0</span>——<b>用一阶近似的话，约束就变成了「0 ≤ δ」，等于没有约束。</b><span class='w'>所以必须展开到二阶才有内容。</span>", "<b>KL 的二阶展开有一个非常漂亮的结论，而它正是 p47 里 Fisher 矩阵的来源。</b><span class='k'><code>D_KL(π_θ_old, π_θ) ≈ ½ (θ − θ_old)ᵀ F (θ − θ_old)</code>，其中 <code>F</code> 是 Fisher 信息矩阵</span>。<b>于是「KL 小于 δ」这个约束，变成了一个椭球：<code>½ Δθᵀ F Δθ ≤ δ</code>。</b><span class='w'>注意这个椭球不是球</span>——<b>它在不同方向上的半径不同，由 <code>F</code> 决定。</b><span class='k'>这正是「参数空间的欧氏距离不等于策略空间的距离」这件事的数学形式。</span>", "<b>「用共轭梯度」这个选择的理由很实际：<span class='w'><code>F</code> 太大，存不下也求不了逆</span>。</b><span class='k'>参数有 n 个，<code>F</code> 就是 <code>n×n</code></span>——<b>百万参数的网络，<code>F</code> 有一万亿个元素。</b><span class='w'>而共轭梯度法只需要能算「<code>F</code> 乘一个向量」，不需要显式地构造 <code>F</code></span>。<b>而 <code>Fv</code> 可以通过两次反向传播算出来（Hessian-向量积）。</b><span class='k'>这是把一个理论上优雅但计算上不可行的方法变得可行的关键工程技巧。</span>"], "quote": "Use a <b>linear approximation to the objective function</b> and a <b>quadratic approximation to the constraint</b> &nbsp;·&nbsp; Constrained optimization problem &nbsp;·&nbsp; <b>Use conjugate gradient descent</b>"},
{"r": [47, 49], "t": "TRPO 算法", "star": 3, "one": "六行。", "eq": "每轮：\n  跑策略 T 步 / N 条轨迹\n  估出所有时间步的优势函数\n  算策略梯度 g\n  用共轭梯度（配 Hessian-向量积）算 F⁻¹g，F 是 Fisher 信息矩阵\n  在代理损失和 KL 约束上做线搜索\n\n应用：2D 运动控制器、以像素为输入的 Atari", "pts": ["<b><code>F⁻¹g</code> 是自然梯度</b>：按参数空间的几何去校正方向，而不是按欧氏距离。", "<span class='k'>最后那步线搜索是兜底的</span>——二次近似不准时它保证约束真的满足。", "<b>六行里，前四行和 vanilla PG 完全一样，真正新的只有第 5、6 行。</b><span class='k'>第 5 行把梯度 <code>g</code> 换成了 <code>F⁻¹g</code>——这叫<b>自然梯度</b></span>；<span class='k'>第 6 行做线搜索，确保约束真的满足</span>。<b>所以 TRPO 可以一句话概括：vanilla PG，但把「沿梯度走」换成「沿自然梯度走，且不许走出 KL 球」。</b>", "<b>自然梯度这个概念值得花点时间，因为它背后的直觉很有价值。</b><span class='w'>普通梯度下降默认「参数空间里距离相同 = 改动相同」</span>——<b>但这显然不对。</b><span class='k'>softmax 的 logits 从 0 改到 1，和从 10 改到 11，对实际策略的影响完全不同</span>（<b>后者几乎没变，因为已经饱和了</b>）。<b>自然梯度按「策略改变了多少」而不是「参数改变了多少」来度量距离</b>——<span class='w'>而 Fisher 矩阵正是这个度量的局部形式。</span>", "<b>第 6 行那个线搜索是兜底的，而它存在的理由很诚实。</b><span class='k'>第 5 行用的是二次近似，而二次近似在走得稍远时就不准了</span>——<b>于是按它算出来的步子，实际的 KL 可能超过 δ。</b><span class='w'>所以还要真的算一下实际的 KL 和实际的代理损失，不满足就缩小步长再试</span>。<b>这一步让算法从「理论上满足约束」变成「实际上满足约束」。</b><span class='k'>注意这和 p31 被嫌弃的那个线搜索不一样</span>——<b>那里是盲目地在梯度方向上试，这里只是在一个已经算好的方向上缩放，而且有明确的验收标准。</b>", "<b>把 TRPO 和 p31 那个「朴素线搜索」对照一次，你就能看出这一整讲的进展在哪里。</b><span class='w'>朴素线搜索：方向是普通梯度，距离靠盲试，没有任何「近似在哪还成立」的信息</span>；<span class='k'>TRPO：方向是自然梯度（考虑了策略空间的几何），距离由 KL 约束界定（来自下界定理），线搜索只做最后的验收</span>。<b>三处都用上了前面十几页推导出来的东西。</b>"], "quote": "<b>Practical Algorithm: TRPO</b> &nbsp;·&nbsp; 1: for iteration=1,2,... do &nbsp;·&nbsp; 2: <b>Run policy for T timesteps or N trajectories</b> &nbsp;·&nbsp; 3: <b>Estimate advantage function at all timesteps</b> &nbsp;·&nbsp; 4: Compute policy gradient g &nbsp;·&nbsp; 5: <b>Use CG (with Hessian-vector products) to compute F⁻¹g where F is the Fisher information matrix</b> &nbsp;·&nbsp; 6: <b>Do line search on surrogate loss and KL constraint</b> &nbsp;·&nbsp; 7: end for &nbsp;|&nbsp; Applied to: Locomotion controllers in 2D · Atari games with pixel input"},
{"r": [50, 52], "t": "结果与小结", "star": 2, "one": "<b>自动把权重更新限制在一阶近似还成立的范围内。</b>", "pts": ["属于策略梯度方法；用一个代理优化目标。", "<span class='k'>实测一贯表现不错</span>。", "影响很大：课件写的时候已被引 <b>350+ 次</b>（问世才几年）。", "<b>小结里那句 <em>to approximate where the first order approximation is valid</em> 把 TRPO 的定位说得很准，值得逐字读。</b><span class='k'>注意是 <em>approximate</em>——它是在<b>估计</b>「一阶近似还成立的范围」，不是在精确地划定它</span>。<b>而估计的依据就是那个下界定理，加上两处被承认的放松（p41）。</b><span class='w'>所以它是一个有理论来源的启发式，而不是一个带证明的算法</span>——<b>这个定位要说准，否则会高估它的保证。</b>", "<b><em>Empirically consistently does well</em> 这句话的关键词是 <span class='k'>consistently</span>（一贯地），而不是「最好」。</b><b>TRPO 在很多任务上不是最强的，但它很少崩。</b><span class='w'>而在深度 RL 里「很少崩」是一个被严重低估的优点</span>——<b>L06 p12 要你「至少跑两个种子」，正是因为很多方法的种子间方差大到可以反转结论。</b><span class='k'>一个表现稳定的方法，让你花在调参和重跑上的时间大幅减少。</span>", "<b>「被引 350+ 次」这个数字现在看已经过时得很厉害，而这件事本身值得一提。</b><span class='w'>这份讲义是 2018 年的，而 TRPO 2015 年问世</span>；<span class='k'>今天它的引用数早已是数万量级</span>。<b>更重要的是它的直接后继 PPO——用一个截断的比值替代 KL 约束，实现简单得多，效果相当甚至更好。</b><span class='w'>今天你在实践中几乎只会碰到 PPO，而不是 TRPO</span>。<b>但 PPO 的全部合理性都来自这一讲的推导：它是在用一个更粗暴的办法达到同一个目的。</b>"], "quote": "Policy gradient approach &nbsp;·&nbsp; Uses surrogate optimization function &nbsp;·&nbsp; <b>Automatically constrains the weight update to a trusted region, to approximate where the first order approximation is valid</b> &nbsp;·&nbsp; <b>Empirically consistently does well</b> &nbsp;·&nbsp; Very influential: +350 citations since introduced a few years ago"},
{"r": [53, 53], "t": "策略梯度算法的通用模板", "star": 3, "one": "所有这些算法都是<b>同一个模板换零件</b>。", "eq": "每轮：\n  跑策略 T 步 / N 条轨迹\n  每个时间步算出目标 Q^π(s_t,a_t) 和基线 b(s_t)\n  算出策略梯度估计 ĝ\n  用 ĝ 更新策略，必要时约束在一个局部区域内", "pts": ["<span class='k'>第 3 行换零件</span> ⇒ REINFORCE / actor-critic / n 步…", "<span class='k'>第 5 行换零件</span> ⇒ 朴素 SGD / 线搜索 / TRPO…", "<b>把这张模板记住，比记住任何一个具体算法都值。</b>", "<b>这张模板是整个第八、九两讲的总收，而它值钱的地方在于：它把「算法」降级成了「配置」。</b><span class='k'>你不再需要记住十几个算法的名字和伪代码，只需要记住五行，然后知道每一行有哪些可选项</span>。<b>读新论文时的第一个问题就变成了：它动了哪一行。</b>", "<b>把第 3 行的选项列全，你会发现它们正好是第八讲降方差那一节的全部内容。</b><span class='k'>蒙特卡洛回报 <code>G_t</code>（无偏、方差大）→ REINFORCE</span>；<span class='k'>critic 估的 <code>Q</code>（有偏、方差小）→ actor-critic</span>；<span class='k'>n 步混合 → 介于两者之间</span>；<span class='k'>基线取 <code>V</code> → 括号里变成优势函数</span>。<b>四个选项，对应四种偏差–方差的配比。</b>", "<b>第 5 行的选项则是这一讲后半的全部内容，而它们是按「用了多少结构信息」排的。</b><span class='w'>朴素 SGD / ADAM：完全不管近似在哪还成立</span>；<span class='w'>线搜索：盲试，贵且不用结构信息</span>；<span class='k'>TRPO：自然梯度 + KL 信赖域，用上了下界定理</span>；<span class='k'>PPO：截断比值，用一个更简单的办法达到同样的目的</span>。<b>从上到下，用上的信息越来越多，而实现复杂度先升后降。</b>", "<b>老师说「把这张模板记住，比记住任何一个具体算法都值」，这话值得当真，而且理由可以说清楚。</b><span class='k'>具体算法会过时——TRPO 三年就被 PPO 取代了</span>；<span class='w'>而模板不会，因为它反映的是问题本身的结构</span>：<b>你必须采数据、必须估优势、必须算梯度、必须决定走多远。</b><span class='k'>这四件事任何策略梯度方法都躲不开，变的只是每件事怎么做。</span>"], "quote": "<b>Common Template of Policy Gradient Algorithms</b> &nbsp;·&nbsp; 1: for iteration=1,2,... do &nbsp;·&nbsp; 2: Run policy for T timesteps or N trajectories &nbsp;·&nbsp; 3: At each timestep compute the target Q^π(s_t,a_t) and baseline b(s_t) &nbsp;·&nbsp; 4: Compute the policy gradient estimate ĝ &nbsp;·&nbsp; 5: Update the policy using ĝ, <b>possibly constrained to a local region</b> &nbsp;·&nbsp; 6: end for", "tbl": {"head": ["模板的行", "可选项", "换了之后得到"], "rows": [["<b>第 2 行</b> 采数据", "串行 / 并行多 worker", "<span class='k'>A3C</span>"], ["<b>第 3 行</b> 估目标和基线", "<code>G_t</code> / critic 的 Q / n 步 / GAE", "<span class='k'>REINFORCE / actor-critic / A2C</span>"], ["<b>第 5 行</b> 怎么更新", "SGD·ADAM / 线搜索 / KL 信赖域 / 截断比值", "<b>vanilla / TRPO / PPO</b>"], ["<b>不变的四件事</b>", "—", "<span class='w'>采数据、估优势、算梯度、决定走多远</span>"]]}},
{"r": [54, 54], "t": "这一讲你该掌握什么", "one": "课件自己给的清单。", "pts": ["要<b>非常熟悉 REINFORCE</b> 和上一页那张模板。", "要知道<span class='k'>不同的估计量能插进哪个槽位</span>，以及各自的偏差/方差含义。", "<span class='w'>不必</span>会推导或背出 TRPO 里近似目标和约束的具体公式。", "作业三会动手做这些。", "<b>课件自己给的这张清单，划定了「该掌握到什么程度」，而且它划得比你以为的宽松。</b><span class='k'>要非常熟悉的只有两样：REINFORCE，和那张模板</span>。<span class='w'>TRPO 的具体公式<b>不必</b>会推导或背出</span>——<b>课件原话就是 <em>do not need to be able to derive or remember</em>。</b><span class='k'>所以 p37–p46 那十页，读懂思路就够了，不必能复现。</span>", "<b>但「理解不同估计量能插进哪个槽位，以及各自的偏差/方差含义」这一条要求不低，值得自查一遍。</b><b>问自己四个问题</b>：<span class='k'>① <code>G_t</code> 和 critic 的 <code>Q</code>，哪个有偏？为什么？</span><span class='k'>② 加基线会不会引入偏差？什么条件下才降方差？</span><span class='k'>③ n 步的 n 变大，偏差和方差各往哪边走？</span><span class='k'>④ 什么情况下该往 MC 那端靠？</span><b>四个都答得出，这一讲的前半就过关了。</b>", "<b>最后给一条把这两讲串起来的总结，它也是这一片的收尾。</b><span class='k'>第八讲回答「梯度是什么、怎么算」，第九讲回答「拿到梯度之后怎么用」</span>。<b>前者的核心是似然比技巧和那句 <em>no dynamics model required</em>；后者的核心是「策略决定数据分布，所以不能乱走」。</b><span class='w'>而这两件事合起来，正好解释了为什么策略梯度既有吸引力又难调</span>——<b>它的假设少得惊人，代价是你必须自己管住每一步走多远。</b>"], "quote": "<b>Be very familiar with REINFORCE</b> and the template of policy gradient algorithms &nbsp;·&nbsp; <b>Understand the different ways of estimating the target</b> and the bias / variance implications &nbsp;·&nbsp; <b>Do not need to be able to derive or remember the specific formulas for the approximate objective and constraint in TRPO</b> &nbsp;·&nbsp; Will do these in homework 3"}
];

var TH = {"title": "L09 接上课题的哪一段：「我只有旧配置的日志」这件事，终于有了一个可优化的形式", "arc": "<b>这一讲的 p33 把你的问题一字不差地写成了一个式子，而且课件自己在旁边标了 <em>off policy learning!</em></b><br><br><span class='k'>相对性能恒等式：<code>V(新) = V(旧) + E_{新}[ Σ γ^t A^旧(s,a) ]</code></span>——<b>「新配置比旧配置好多少」= 在新配置会走到的地方，按旧配置的优势加权求和。</b><span class='w'>而卡住的恰恰是「新配置会走到的地方」</span>：<b>换一档保真度，中间产物就变了，后续节点面对的输入分布也就变了。</b><span class='k'>这是 L07 p30「节点 h 改变 h+1 输入分布」的第三次出现</span>——<b>L07 从误差累积说它，L05 从 off-policy 发散说它，这一讲从「我算不出这个期望」说它。</b><br><br><b>而这一讲给的答案是整条线里最务实的一个：硬换，然后量化错多少。</b><span class='k'>把新策略的访问频率换成旧的，得到一个能算的代理目标（p36）；再证明真实值不会比它低太多，低多少由「新旧策略差多远」决定（p37–p38）</span>。<b>于是你得到一条可操作的结论：<span class='w'>新配置和日志里的配置越接近，你对它的估计越可信</b></span>——<b>而「接近」是可以用 KL 量出来的，不是感觉。</b><br><br><b>这条结论还有一个一石二鸟的好处（p43 科研格）：</b><span class='k'>信赖域约束同时在管两件事——代理目标还是不是好近似，以及重要性权重会不会爆炸</span>。<b>而后者正是你已经在用 ESS 监控的那件事。</b><span class='w'>ESS 低 ⇔ 两个分布差太远 ⇔ 你走出了信赖域，三句话说的是同一件事。</span><br><br><b>最后，那个 <code>1/(1−γ)²</code> 的惩罚系数是你短流水线优势最鲜明的一次体现。</b><span class='w'>γ=0.99 时它是 10000</span>；<span class='k'>而有限 horizon 下它该换成 <code>H²</code>，H=5–10 时只有 25–100</span>——<b>相差一百到四百倍。</b><span class='w'>这和 L02 的 γ=1、L05 的 1/(1−γ) 放大、L07 的 εT² 是同一个来源</span>，<b>四处合起来值得在 paper 里写成一段独立的结构性论证，而不是散落各处的四个巧合。</b>", "pitfalls": [{"v": "<b>把相对性能恒等式的下标记反。</b> <span class='k'>期望的下标是<b>新</b>策略，优势是<b>旧</b>策略的 <code>A^π</code></span>。<span class='w'>写成 <code>E_π[Σ γ^t A^{π̃}]</code> 不只是错，而且那个式子恒等于零</span>（因为 <code>E_π[A^π] = 0</code>）。<b>记法：优势跟着「我已知的那个」，分布跟着「我想评估的那个」。</b>", "tag": "已核", "ref": "课件 p33–p34 · kp 点名的那个下标"}, {"v": "<b>把 <code>ρ^π(s)</code> 当成平稳分布或概率分布。</b> <span class='k'>它是折扣加权访问频率，在所有状态上的和是 <code>1/(1−γ)</code>，不是 1</span>。<b>它既不是概率分布，也不是 L05 那个平稳分布。</b><span class='w'>而那个 <code>1/(1−γ)</code> 正是 p37–p38 下界里平方项的来源</span>——搞错了这一点，那个系数就显得莫名其妙。", "tag": "已核", "ref": "课件 p33 定义 · p37 p38 下界"}, {"v": "<b>以为「基线不引入偏差」就等于「加基线总是好的」。</b> <span class='k'>无偏是无条件的，降方差不是</span>。<span class='w'>一个和被减量无关（甚至负相关）的基线会让方差<b>更大</b>，而它仍然是无偏的——所以你不会从均值上察觉</span>。<b>判据：基线要是 <code>G_t</code> 在给定状态下的好预测。</b><b>检验手段：拿一批已有结果，比较减基线前后那个量的方差，几行代码就能跑。</b>", "tag": "已核", "ref": "课件 p15–p16 老师两次小测 · L08 p55 科研格"}, {"v": "<b>把 TRPO 的「保证」当成真的保证。</b> 课件做了两处放松：<span class='w'>① 用你自己调的 δ 代替理论的惩罚系数 C；② 用平均 KL 代替最大 KL</span>。<span class='k'>两处放松之后，单调改进的定理已经不适用了</span>——<b>它的实际地位是「受理论启发的启发式」。</b><span class='w'>课件 p50 的措辞是 <em>empirically consistently does well</em>，注意是「经验上」。</span>", "tag": "已核", "ref": "课件 p41–p42 两处放松 · p50 小结"}, {"v": "<b>把 <code>H²</code> 这个替换当成课件给的结论。</b> <span class='w'>课件全程用折扣形式，没给有限 horizon 的版本</span>——<b>「把 <code>1/(1−γ)²</code> 换成 <code>H²</code>」是推断。</b><span class='k'>要写进 paper，该引 Kakade &amp; Langford 2002 或 Schulman 2015 原文，确认有限 horizon 下的确切常数</span>。<b>另外 <code>ε = max|A|</code> 那一项不会因为 H 小而变小，别指望界变紧。</b>", "tag": "推断", "ref": "课件 p37–p38 · 本讲 p38 科研格"}, {"v": "<b>只报平均指标。</b> 老师明说单调改进是期望意义上的，<span class='k'>不保证对某一个病人更好</span>。<b>降成本的配置天然在难题上损失更大</b>——<span class='w'>「平均 Acc 只掉 1%」背后可能是「简单题掉 0%、难题掉 8%」</span>。<b>按难度分层报告几乎不花额外预算（同一批结果重新切一刀），却能把被平均掉的东西露出来。</b>", "tag": "推断", "ref": "课件 p9–p11 老师澄清 · 本讲 p9 科研格 · 简报 §8"}], "ammo": [{"q": "你们怎么知道一套没跑过的配置好不好？", "a": "<b>这件事有一个精确的形式，而且它的困难点是已知的。</b><span class='k'>新旧配置的值差 = 在新配置会走到的地方、按旧配置的优势加权求和（CS234 L09 p33 的相对性能恒等式）</span>。<b>卡住的是「新配置会走到的地方」——那需要真跑才知道。</b><span class='w'>我们采用标准做法：把它换成日志里的分布，得到一个代理估计，并同时报告「这个候选和日志分布差多远」</span>。<b>距离远的候选，其估值被标注为需要实跑验证。</b>", "tag": "推断", "ref": "课件 p33–p36 · 本讲 p33 科研格"}, {"q": "你们用 ESS 做什么？不就是个经验指标吗？", "a": "<b>它不只是经验指标，它和「代理估计还可不可信」是同一个量。</b><span class='k'>信赖域理论说：新旧策略差得越远，代理目标的误差界越松，而重要性权重的方差也越大</span>。<b>ESS 低正是后者的直接表现。</b><span class='w'>所以 ESS 低 ⇔ 两个分布差太远 ⇔ 代理估计不可信，三句话是同一件事</span>——<b>我们用它作为「这个候选需不需要实跑验证」的判据。</b>", "tag": "推断", "ref": "课件 p38 p43 · 本讲 p43 科研格 · 简报 §4c"}, {"q": "你们的 horizon 这么短，有什么实质影响吗？", "a": "<b>有，而且是结构性的，体现在四处。</b><span class='k'>① γ 可以取 1（L02 p13，片段必然结束）；② L05 那个 <code>1/(1−γ)</code> 的误差放大换成 H；③ L07 的 <code>εT²</code> 放大倍数只有 5–10 倍而不是上千倍；④ 信赖域下界里的 <code>1/(1−γ)²</code> 换成 <code>H²</code>，即 25–100 而不是 10000</span>。<b>四处都在说同一件事：短流水线让一批在长 horizon 下很重的顾虑变轻。</b><span class='w'>我们把它作为一条独立的结构性论证来写，而不是四个孤立的观察。</span>", "tag": "推断", "ref": "课件 p37–p38 · L02 p13 · L05 p34 · L07 p30"}, {"q": "你们报告的改进是真的改进吗，会不会只是平均值的把戏？", "a": "<b>这个担心是对的，而且教科书上明确提醒过：</b><span class='k'>单调改进的保证是期望意义上的，不保证对某个具体样本更好</span>（CS234 L09 老师当堂澄清）。<b>降成本的配置天然在难题上损失更大，所以平均值会掩盖分布上的损失。</b><span class='w'>我们因此按难度分层报告 Acc 和 Cost，并把「最差那一档的损失」作为一个单独的指标</span>——<b>这是在拿不到严格 per-query 保证时的务实替代。</b>", "tag": "推断", "ref": "课件 p9–p11 · 本讲 p9 科研格 · 简报 §8"}], "papers": [{"t": "Kakade &amp; Langford — Approximately Optimal Approximate Reinforcement Learning (Conservative Policy Iteration)", "id": "ICML 2002", "why": "p37 那个 CPI 下界的原始出处。<b>你需要它来确认有限 horizon 下那个常数的确切形式</b>——<span class='k'>课件全程用折扣形式，而把 <code>1/(1−γ)²</code> 换成 <code>H²</code> 是推断，不能只引课件</span>。"}, {"t": "Schulman, Levine, Moritz, Jordan &amp; Abbeel — Trust Region Policy Optimization", "id": "ICML 2015", "why": "p38–p49 的全部内容。<b>对你最有用的是它的第 3–5 节</b>：<span class='k'>一般随机策略的下界、三次替换、以及 vine 采样</span>。<span class='w'>vine 要求环境能重置到任意状态——机器人做不到，而你恰好可以（重放一次上下文）</span>，值得评估。"}, {"t": "Schulman, Wolski, Dhariwal, Radford &amp; Klimov — Proximal Policy Optimization Algorithms (PPO)", "id": "arXiv 2017", "why": "TRPO 的直接后继，也是今天你实际会碰到的那个。<b>它用一个截断的概率比值替代 KL 约束</b>，<span class='k'>实现简单得多，而且允许把同一批数据复用几轮</span>——<span class='w'>后者正好缓解了策略梯度 on-policy 的代价</span>。"}, {"t": "Kakade — A Natural Policy Gradient", "id": "NIPS 2001", "why": "p47 第 5 行那个 <code>F⁻¹g</code> 的出处。<b>它论证了为什么该按「策略改变了多少」而不是「参数改变了多少」来度量距离</b>——<span class='k'>这个视角在任何「参数化不唯一」的场合都适用</span>，包括你那个 λ 的标度问题（L07 p9 科研格）。"}, {"t": "Sutton &amp; Barto — Reinforcement Learning: An Introduction, 第 13 章", "id": "2018, 2nd ed.", "why": "课件在 p1 指定的补充阅读。<b>它对基线的「最优选择」给了比课件更完整的讨论</b>——<span class='k'>严格最优的基线是按 <code>‖∇log π‖²</code> 加权的期望回报，而不是纯期望回报</span>，而课件 p14 只说了「近似是期望回报」。"}]};

(function(){
  var PDF="../slides/lecture9.pdf", MAX=54;
  /* 线上（GitHub Pages）库里没有讲义 PDF（被 .gitignore 挡着），左栏会 404。
     声明了 canonical 源就改指它；本地 file:// 与 localhost 仍走相对路径，
     这样离线可用、也不依赖 archive.org。
     PAGEOFF：切章 PDF 的第 1 页在整本里是第 1+PAGEOFF 页（S&B 用）。 */
  var PDF_REMOTE="", PAGEOFF=0;
  var USE_REMOTE = !!PDF_REMOTE && /(^|\.)github\.io$/i.test(location.hostname);
  var SRC = USE_REMOTE ? PDF_REMOTE : PDF, POFF = USE_REMOTE ? PAGEOFF : 0;
  var frame=document.getElementById("pdf"), card=document.getElementById("card"),
      pnum=document.getElementById("pnum"), strip=document.getElementById("strip"),
      right=document.getElementById("right");
  var cur=0, map={}, cells=[];
  /* 科研格出处档位 → 类名。三档与 research/00-BRIEFING 的原始标注一致。 */
  var RESC={"已核":"t1","推断":"t2","待核":"t3"};

  /* 存档键带课程前缀 —— file:// 下所有本地页面共用一个 origin，
     两门课都用 "l01quiz" 会互相覆盖。 */
  var KEY = document.body.dataset.key;
  try {                       // 一次性迁移：早期版本用的是不带课程前缀的键
    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("l09quiz");
      if(_old){
        localStorage.setItem(KEY+"quiz", _old);
        var _p = localStorage.getItem("l09p");
        if(_p) localStorage.setItem(KEY+"p", _p);
      }
      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，
         用户「清空全部记录」之后下次打开又被复活一遍。 */
      localStorage.removeItem("l09quiz");
      localStorage.removeItem("l09p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      var nf=frame.cloneNode(false); nf.removeAttribute("src");
      frame.parentNode.replaceChild(nf,frame); frame=nf;
      frame.src=SRC+HASH;
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
