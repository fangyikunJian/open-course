<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第九讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs234-2019-l09">

<div id="bar">
  <h1>CS234 第九讲 · <span>策略梯度 II：基线、actor-critic，以及「该走多远」</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 54</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture9.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L09-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
2: [{"q": "课堂反馈里，觉得节奏「太快」的比例是？", "o": ["54%", "43%", "30%", "70%"], "a": 0, "why": "70 份回复，54% 太快、43% 正好。老师说有意思的是有人给出完全相反的意见，而且常常紧挨着。"}],

33: [{"q": "<code>V(θ̃) = V(θ) + E_{π_θ̃}[Σγᵗ A^π]</code> 这个改写，麻烦出在哪？", "o": ["γ 不收敛", "需要模型", "期望要在新策略的访问分布下取，而我们只有旧策略采的数据", "优势函数算不出来"], "a": 2, "why": "所以这本质上是个 off-policy 问题。下一页的「局部近似」就是在硬扛这一点。"}, {"q": "相对性能恒等式里，期望的下标和优势分别属于哪个策略？", "o": ["期望下标是新策略 π̃，优势是旧策略的 A^π", "两者都是旧策略", "期望下标是旧策略，优势是新策略的", "两者都是新策略"], "a": 0, "why": "优势跟着「我已知的那个」，分布跟着「我想评估的那个」。搞反了整条推导就垮——而且反过来的式子恒等于零。"}, {"q": "为什么必须是这个交叉组合？", "o": ["为了保证无偏", "这是习惯写法", "优势衡量的是「相对旧策略基准赚多少」所以基准必须旧；而你要算新策略实际拿到多少，所以轨迹必须按新策略走", "为了让推导更简洁"], "a": 2, "why": "两个要求各管一边，所以必然是这个交叉组合。"}, {"q": "<code>ρ^{π̃}(s)</code> 这个量有什么容易出错的性质？", "o": ["它在所有状态上的和是 <code>1/(1−γ)</code> 而不是 1——它不是概率分布，也不是 L05 的平稳分布", "它恒为正", "它是平稳分布", "它和是 1"], "a": 0, "why": "这个 1/(1−γ) 会在 p37 的下界里以平方的形式出现。"}, {"q": "这个恒等式卡在哪里？", "o": ["不知道 <code>ρ^{π̃}</code>——要跑新策略才知道，而你只有旧策略采的数据", "不知道 <code>V(θ)</code>", "不知道 <code>π̃</code>", "不知道 <code>A^π</code>"], "a": 0, "why": "课件自己在 p33 就标了：off policy learning! 这不是估计精度问题，是信息根本不在日志里。"}],

37: [{"q": "保守策略迭代的下界里，罚项随「改动幅度 α」怎么变？", "o": ["线性", "不变", "按 √α", "按 α² 增长——走得越远，保证越弱"], "a": 3, "why": "π_new = π_old 时 α=0，罚项为 0，界是紧的。局限是它只对「混合策略」成立。"}, {"q": "CPI 下界里惩罚项按 <code>α²</code> 增长，而收益大致按 α 增长，这说明什么？", "o": ["小 α 时收益占优、大 α 时罚款占优，所以存在一个可以算出来的最优步长", "两者无法比较", "α 越大越好", "α 越小越好"], "a": 0, "why": "这就是「自动选步长」这件事的数学根据。"}, {"q": "课件自带一问：<code>π_new = π_old</code> 时这个界紧吗？", "o": ["不紧，总是松的", "紧——α=0 罚项为零，而 <code>L(π_old)=V^{π_old}</code>，两边取等号", "取决于 γ", "取决于 ε"], "a": 1, "why": "一个在「不动」这个点上紧的界，说明它至少没有白白浪费精度。离开这点之后它按 α² 变松。"}, {"q": "CPI 这个下界的局限是什么？", "o": ["只对表格情形成立", "只对确定性策略成立", "只对混合策略成立，而实践中你做的是「把参数挪一点」", "只对 γ=1 成立"], "a": 2, "why": "p38 会把它推广到一般随机策略，代价是常数从 2 变成 4。"}],
38: [{"q": "从混合策略推广到一般随机策略，「改了多少」被度量成了什么？", "o": ["动作数之差", "值函数之差", "参数的欧氏距离", "两个策略之间的 KL 散度（经由 D_TV² ≤ D_KL）"], "a": 3, "why": "这一步把「改了多少」正式化了，后面 TRPO 的约束就是它。"}, {"q": "<code>D_TV(p,q)² ≤ D_KL(p,q)</code> 这一步为什么重要？", "o": ["它消去了 γ", "它让界更紧", "它让 ε 变小", "KL 对常见参数化策略有闭式表达且可对参数求导，而总变差距离做不到"], "a": 3, "why": "这一步把一个「理论上的界」变成了一个「可以塞进优化器的约束」。"}, {"q": "这个定理的结构性含义是什么？", "o": ["保证的强度由样本量决定", "保证的强度由 γ 单独决定", "保证的强度由「你改了多少」单独决定，不管方向", "保证的强度由「你改得对不对」决定"], "a": 2, "why": "一个改得很小但方向完全错误的更新仍有很强的保证。这正是信赖域思想的全部内容。"}, {"q": "<code>1/(1−γ)²</code> 在 γ=0.99 时是多少？", "o": ["10000", "100", "400", "一百万"], "a": 0, "why": "γ=0.999 时是一百万。按它选步长你几乎动不了——p41 会正面承认这件事。"}],
39: [{"q": "「优化下界就够了」的论证是怎么走的？", "o": ["用了大数定律", "下界等于真值", "V^{π_{i+1}} ≥ M_i(π_{i+1}) 且 V^{π_i} = M_i(π_i)，两式相减", "用了压缩映射"], "a": 2, "why": "只要新策略让 M 变大，真实值的改进就至少有那么多。这是「单调改进」从愿望变成定理的一步。"}, {"q": "<code>V^{π_i} = M_i(π_i)</code> 为什么取等号？", "o": ["KL(π_i,π_i)=0 所以惩罚消失，而 <code>L_{π_i}(π_i)=V^{π_i}</code>", "因为 M 的定义里减去了 V", "因为 γ=1", "因为 ε=0"], "a": 0, "why": "正是这个「在当前点上紧」的性质，让相减那一步有意义。"}, {"q": "这个论证的一般骨架叫什么？", "o": ["共轭梯度法", "信赖域法", "MM 算法（minorize-maximize）：构造一个处处不超过目标、且在当前点相等的下界，然后最大化它", "EM 算法"], "a": 2, "why": "EM 算法、变分推断都是同一个骨架，区别只在怎么构造那个下界。"}, {"q": "这个单调改进保证为什么是「无条件」的？", "o": ["因为 KL 非负", "最差也可以取 <code>π_{i+1}=π_i</code>，那时 M 不变，于是至少不会变差", "因为下界永远成立", "因为 ε 有界"], "a": 1, "why": "但要注意它保证的是「不变差」，不是「变好很多」——而「保证不变差」和「一步都走不动」是同一件事的两面。"}],
41: [{"q": "为什么 TRPO 把理论上的惩罚项改成了硬约束？", "o": ["惩罚项算不出来", "约束更容易求导", "为了无偏", "按理论取的惩罚系数太保守，步长会小到没法用"], "a": 3, "why": "信赖域的含义就是：在一阶近似还靠谱的那个范围内走，范围用 KL 界定。"}, {"q": "课件在这一页坦率承认了什么？", "o": ["TRPO 不收敛", "下界的证明有漏洞", "按理论推荐的惩罚系数，步长会非常小", "KL 散度不可微"], "a": 2, "why": "界本身是对的，但它为了「对所有情况都成立」而取了最坏情况，于是在典型情况下过于保守。"}, {"q": "把 <code>max_s</code> 换成对状态分布取期望，理由是什么？", "o": ["max 需要 KL 在所有状态上都有界，约束数等于状态数，根本写不下", "max 会让界更松", "期望形式更对称", "期望更容易估计"], "a": 0, "why": "代价是保证变弱了：平均 KL 小，不排除个别状态上 KL 很大。"}, {"q": "经过两处放松之后，TRPO 的实际地位是什么？", "o": ["一个和理论完全无关的工程技巧", "一个受理论启发的启发式方法", "一个带完整证明的算法", "一个精确求解单调改进的算法"], "a": 1, "why": "课件 p50 说它 empirically consistently does well——注意是「经验上」。"}],
43: [{"q": "从理论到实践的三次替换里，第二次用的是哪个工具？", "o": ["bootstrap", "重要性采样——拿旧策略的样本去估新策略下的量", "压缩映射", "自然梯度"], "a": 1, "why": "课件专门强调：这三次替换不改变最优解。第三次把 A 换成 Q，只差一个与动作无关的 V。"}, {"q": "第二次替换（重要性采样）在做什么？", "o": ["把 ρ 归一化", "把 A 换成 Q", "把 max 换成期望", "你要算的是「按新策略选动作时的平均优势」，但样本是旧策略采的，乘一个比值把权重纠过来"], "a": 3, "why": "这正是第三讲的重要性采样，老毛病也一并继承：两个分布差得远时比值爆炸、方差失控。"}, {"q": "为什么把 <code>A</code> 换成 <code>Q</code> 不影响结果？", "o": ["因为 V 恒为零", "因为两者数值相等", "两者只差一个与动作无关的 <code>V(s)</code>，它贡献的项不依赖 θ，不影响 arg max", "因为 Q 的方差更小"], "a": 2, "why": "实践上这么换的理由是 Q 更容易直接估，你不必单独再学一个 V。"}, {"q": "信赖域约束同时在管哪两件事？", "o": ["偏差和方差", "代理目标还是个好近似，以及重要性权重的方差不爆炸", "采样效率和计算效率", "探索和利用"], "a": 1, "why": "一个约束，两个收益。在日志量有限、方差是真正敌人的设定里尤其值钱。"}],
46: [{"q": "为什么目标用线性近似、约束用二次近似，不能反过来？", "o": ["KL 在当前点取最小值 0 且一阶导也是 0，用一阶近似约束就变成「0 ≤ δ」等于没有约束", "因为目标比约束重要", "因为 KL 是凸的", "为了计算方便"], "a": 0, "why": "而目标 L 在当前点的梯度就是真梯度（p36），一阶信息已经足够准。"}, {"q": "为什么用共轭梯度而不是直接求 <code>F⁻¹</code>？", "o": ["共轭梯度能避免局部最优", "F 不可逆", "共轭梯度更精确", "F 是 n×n，百万参数就有一万亿个元素；而共轭梯度只需要能算 Fv，可用两次反向传播得到"], "a": 3, "why": "这是把一个理论上优雅但计算上不可行的方法变得可行的关键工程技巧。"}],
47: [{"q": "TRPO 里用共轭梯度算的 <code>F⁻¹g</code> 是什么？", "o": ["二阶导", "自然梯度——按参数空间的几何校正方向，而不是按欧氏距离", "优势函数", "普通梯度"], "a": 1, "why": "F 是 Fisher 信息矩阵。最后那步线搜索是兜底的：二次近似不准时它保证约束真的满足。"}, {"q": "TRPO 六行里，真正新的是哪两行？", "o": ["第 5 行（用 <code>F⁻¹g</code> 即自然梯度）和第 6 行（线搜索验收）", "第 2、3 行（采样和估优势）", "第 1、7 行", "第 3、4 行"], "a": 0, "why": "前四行和 vanilla PG 完全一样。TRPO = vanilla PG + 沿自然梯度走 + 不许走出 KL 球。"}, {"q": "自然梯度背后的直觉是什么？", "o": ["对梯度做归一化", "用二阶导加速收敛", "按「策略改变了多少」而不是「参数改变了多少」来度量距离", "避免梯度消失"], "a": 2, "why": "softmax 的 logits 从 0 改到 1，和从 10 改到 11，对实际策略的影响完全不同。Fisher 矩阵正是这个度量的局部形式。"}, {"q": "第 6 行的线搜索和 p31 被嫌弃的那个线搜索有什么不同？", "o": ["没有不同", "这里不需要评估策略", "这里用的是二阶信息", "这里只是在一个已经算好的方向上缩放，而且有明确的验收标准（实际 KL 和实际代理损失）"], "a": 3, "why": "它存在的理由是：第 5 行用的二次近似在走得稍远时不准，实际 KL 可能超过 δ。"}],
50: [{"q": "<em>Empirically consistently does well</em> 的关键词是什么？", "o": ["well——说明效果最好", "empirically——说明没有理论保证", "consistently（一贯地）——它不是最强的，但很少崩", "does——说明是实验结论"], "a": 2, "why": "在深度 RL 里「很少崩」是被严重低估的优点，因为很多方法的种子间方差大到可以反转结论。"}, {"q": "今天实践中你更可能碰到哪个方法？", "o": ["PPO——用截断比值替代 KL 约束，实现简单得多，效果相当甚至更好", "CPI", "TRPO", "REINFORCE"], "a": 0, "why": "但 PPO 的全部合理性都来自这一讲的推导：它是在用一个更粗暴的办法达到同一个目的。"}],

{"r": [1, 1], "t": "这一讲要干什么", "star": 2, "one": "策略梯度续：<b>把估计做得更准</b>，再<b>把步子迈得更稳</b>。", "pts": ["前半是降方差（基线、critic、n 步）；后半是「<span class='k'>该走多远</span>」。", "<b>这一讲的结构可以用一句话概括，而且这句话正好对应 p11 那两条「技术路线」：<span class='k'>前半把梯度估得更准，后半改变拿到梯度之后怎么更新参数</span>。</b><span class='w'>前半是上一讲的延续（基线、critic、n 步），后半是全新的问题</span>——<b>「该走多远」。</b><span class='k'>而后半这个问题在监督学习里几乎不存在，它是 RL 特有的。</span>", "<b>页脚那个 <em>Winter 2018</em> 值得留意，它解释了这份讲义为什么比课堂讲的多。</b><span class='k'>这是上一年的完整版，把 TRPO 的推导整条收了进来</span>；<b>而这堂课实际只讲到 p36 左右，下界和 TRPO 的完整推导留到了第十讲。</b><span class='w'>所以这一片之后的内容，你会在第十讲再见一次</span>——<b>不是重复，是第一次给形状、第二次给细节。</b>", "<b>读这一讲有一条贯穿的线索：它一直在回答同一个问题的两个方面——<span class='k'>「我对新策略的好坏知道多少」</span>。</b><span class='w'>前半问的是「我的估计有多准」（方差）</span>；<span class='w'>后半问的是「我的估计在多远之外还成立」（近似的有效范围）</span>。<b>两者都是同一件事的后果：你只能从当前策略采样，却想知道另一个策略有多好。</b><span class='k'>p33–p34 会把这件事挑明——它本质上是个 off-policy 问题。</span>"], "tip": {"t": "这份幻灯片的来历", "v": "页脚印着 <b>Winter 2018</b>——是上一年的完整版，把 TRPO 也收进来了。但这堂课实际<span class='w'>只讲到 p36</span>，下界和 TRPO 的完整推导在第十讲。"}, "quote": "Lecture 9: Policy Gradient II (Post lecture) &nbsp;·&nbsp; Additional reading: Sutton and Barto 2018 Chp. 13 &nbsp;|&nbsp; Last time: Policy Search &nbsp;·&nbsp; <b>This time: Policy Search</b> &nbsp;·&nbsp; Next time: Midterm review"},
{"r": [2, 4], "t": "课堂反馈", "star": 2, "one": "70 份回复：<b>54% 觉得太快，43% 觉得正好</b>。", "pts": ["反复提到的诉求：把问题重复一遍（方便看回放的人）、<b>多讲例题</b>、多讲概念、少写错符号。", "大家觉得最有帮助的：作业、<span class='k'>课堂上的数学推导</span>、「检验一下你的理解 / 和邻座讨论」。", "<b>这几页看起来是教学行政，但它透露了一件对你有用的事：绝大多数人在这个阶段都觉得太快。</b><span class='k'>54% 对 43%，而这是斯坦福的学生在期中前后的反馈</span>。<b>如果你读到这里觉得吃力，那不是你的问题，是这门课在这个位置确实陡。</b><span class='w'>第八、九、十讲是整门课推导密度最高的一段</span>——<b>前面七讲建立概念，这三讲集中还债。</b>", "<b>那三条反复出现的诉求，正好描述了这份精读在做什么。</b><span class='k'>「多讲例题」「多讲概念」「少写错符号」</span>——<b>于是这一片会在每个公式旁边补上「这一项是什么、为什么出现在这里」，并且在课件符号不一致的地方标出来</b>（<span class='w'>这一讲确实有几处，比如 p24 的 <code>beta=n0</code> 明显是排版错</span>）。<span class='k'>读公式时如果觉得某个符号对不上，先怀疑是笔误，再怀疑自己。</span>", "<b>「大家觉得最有帮助的」那一条更值得当真：作业、课堂推导、检验理解 / 和邻座讨论。</b><span class='k'>三件事的共同点是<b>都要你自己产出</b></span>——<b>而不是看懂。</b><span class='w'>这正是这份精读每一页都配自测题的理由</span>：<b>「看懂了」和「说得出来」之间差着一道关，而只有后者能撑住你去用它。</b>", "<b>老师那句观察也值得记一下，因为它在任何「收集反馈」的场合都适用：<span class='k'>有人恰好说了完全相反的话，而且常常紧挨着</span>。</b><b>有人讨厌幻灯片留白、喜欢黑板推导，另一些人正好相反；有人嫌慢，有人嫌快。</b><span class='w'>于是「照反馈改」这件事本身就是不可能的</span>——<b>反馈的价值在于告诉你分布，不在于告诉你答案。</b>", "<b>最后，这几页其实给了你一个关于「怎么读这门课」的提示，值得采纳。</b><span class='k'>最有帮助的三件事里有两件是「自己产出」——做作业、跟着推一遍</span>，<b>第三件是「和别人说一遍」。</b><span class='w'>这三件的共同点是都会暴露你以为自己懂了但其实没懂的地方</span>。<b>而「看讲义、看回放」不会</b>——<span class='k'>它们只会让你越来越熟悉，而熟悉很容易被误认成理解。</span>"], "say": "老师说收集起来很有意思：<b>有人恰好说了完全相反的话</b>，而且常常紧挨着——有人讨厌幻灯片留白、在黑板上推导，另一些人正是喜欢这一点；有人嫌太慢，有人嫌太快。她的结论是「只能尽量兼顾」。", "quote": "Of 70 responses, <b>54% thought too fast, 43% just right</b> &nbsp;·&nbsp; Multiple request to: repeat questions for those watching later on; <b>have more worked examples</b>; <b>have more conceptual emphasis</b>; minimize notation errors &nbsp;·&nbsp; Common things people find are helping them learn: <b>assignments, mathematical derivations, checking your understanding / talking to a neighbor</b>"},
{"r": [5, 8], "t": "复习：策略梯度", "one": "直接参数化策略，沿 <code>∇_θ V(θ)</code> 爬坡。", "eq": "π_θ(s,a) = P[a | s, θ]\nΔθ = α·∇_θ V(θ)", "pts": ["好处：收敛性质好、适合高维/连续动作、<b>能学随机策略</b>。", "代价：<span class='w'>通常只到局部最优</span>；评估策略低效且方差大。", "<b>复习页里真正该盯住的是缺点那两条，因为这一讲的全部内容都是在还这两笔债。</b><span class='k'>「评估策略低效且方差大」⇒ 前半讲（基线、critic、n 步）</span>；<span class='k'>「只到局部最优」⇒ 后半讲（单调改进、信赖域）</span>。<b>上一讲列出了这两个毛病，这一讲逐个处理。</b><span class='w'>认出这个对应，整讲的结构就清楚了。</span>", "<b>另外注意这一页把 Actor-Critic 单独列成了一格，而上一讲它只是一个预告。</b><span class='k'>到 p22 它会变成这一讲前半的主角</span>——<b>因为「用 critic 估的值替代蒙特卡洛回报」正是降方差的第三招</b>（<span class='w'>前两招是上一讲的时间结构和基线</span>）。<b>而它和前两招有一个本质区别：它<span class='w'>引入偏差</span>。</b><span class='k'>前两招是免费的，这一招是一笔真正的交易。</span>", "<b>「收敛性质更好」这一条其实是有争议的，值得把争议说清楚，否则你会在读论文时被绕进去。</b><span class='k'>它成立的那个意义是：策略梯度在函数逼近下仍然收敛到局部最优，而 Q-learning + 函数逼近可能直接发散</span>（<b>L05 p38 的致命三件套</b>）。<span class='w'>它不成立的那个意义是：收敛速度未必更快，而且「局部最优」这个保证本身很弱</span>。<b>所以准确的说法是「它有保证，而对手没有」，不是「它收敛得更好」。</b>", "<b>把三类方法什么时候该用，按「你的瓶颈是什么」排一次，比记优缺点有用得多。</b><span class='k'>数据贵、动作离散、能反复复用经验 ⇒ 基于值</span>（回放池是它独有的优势）；<span class='k'>动作连续、或者策略必须随机、或者策略本身比值函数简单 ⇒ 基于策略</span>；<span class='k'>两者的毛病都想治一点 ⇒ actor-critic</span>。<b>而 actor-critic 的代价是你现在有两个东西要调，而且它们会互相影响</b>——<span class='w'>critic 不准会把 actor 带偏，actor 变了 critic 又得重学。</span>", "<b>最后把「评估策略低效」这条缺点说得更具体一点，因为它直接决定了这一讲后半为什么重要。</b><span class='w'>「低效」的准确含义是：参数一更新，之前采的数据就不再来自当前策略，于是作废</span>。<span class='k'>所以每一轮你都要重新采一批数据，而采数据是要真跑的</span>。<b>于是「每一轮能前进多少」就变得格外值钱</b>——<b>走得太小浪费数据，走得太大可能崩掉。</b><span class='w'>这正是 p29 之后要处理的问题，而它在能复用数据的方法里远没有这么尖锐。</span>"], "quote": "Policy search: directly parametrize the policy <b>π_θ(s,a) = P[a|s,θ]</b> &nbsp;·&nbsp; (Pure) Policy based methods: <b>No Value Function</b>, Learned Policy &nbsp;·&nbsp; Actor-Critic methods: <b>Learned Value Function, Learned Policy</b> &nbsp;|&nbsp; Advantages: Better convergence properties · Effective in high-dimensional or continuous action spaces · Can learn stochastic policies &nbsp;·&nbsp; Disadvantages: Typically converge to a local rather than global optimum · <b>Evaluating a policy is typically inefficient and high variance</b>", "tbl": {"head": ["你的瓶颈", "该偏向", "理由", "代价"], "rows": [["数据贵、动作离散", "<b>基于值</b>", "<span class='k'>经验可复用（回放池）</span>", "<span class='w'>函数逼近下可能发散（L05 p38）</span>"], ["动作连续", "<b>基于策略</b>", "<span class='k'>不需要解 arg max</span>", "<span class='w'>样本用一次就扔</span>"], ["策略必须随机", "<b>基于策略</b>", "<span class='k'>策略本身就是分布</span>", "同上"], ["两边毛病都想治", "<b>actor-critic</b>", "用 critic 降方差", "<span class='w'>两个东西要调，还会互相带偏</span>"]]}},
{"r": [9, 11], "t": "我们到底想要什么样的算法", "star": 3, "one": "<b>每一次更新都单调变好</b>，而且幅度要大。", "pts": ["跑策略的时候是在真实承担代价，所以希望<span class='k'>尽快</span>到达一个好策略。", "策略搜索和策略迭代一样，是「评估 ↔ 改进」交替。<b>若每一步都不变差，局部最优就有保证。</b>", "两条路：<b>① 把梯度估得更准</b>（上一讲和今天前半）；<b>② 改变拿到梯度之后怎么更新参数</b>（今天后半）。", "<b>第一行那句 <em>Incurring reward / cost as execute policy</em> 点明了 RL 和普通优化最大的区别，值得单独想一下。</b><span class='k'>在普通优化里，你在参数空间里乱走不花钱——评估一次函数值而已</span>；<span class='w'>在 RL 里，「评估一个策略」意味着真的把它跑起来，而跑的过程中你在真实地承担后果</span>。<b>于是「中间过程有多差」本身就是代价，不只是「最后收敛到哪」。</b><span class='k'>这是单调改进之所以值钱的全部理由。</span>", "<b>老师现场问「为什么想要单调改进」，而她不满足于「帮助保证收敛」这个答案，这一点很关键。</b><span class='w'>理论上的理由确实有：梯度法只保证到局部最优，而单调改进能保证你一直在往上走</span>。<span class='k'>但她要的是经验上的理由，而学生给出的那个答案是：高风险场合</span>。<b>她画的那条 DQN 剧烈抖动的曲线最有说服力</b>——<b>「这一季做得好、下一季做得差、以后总会好起来」，<span class='w'>这话在公司里说不通，因为人是厌恶损失的</span>。</b><span class='k'>医疗、飞机这类场合更不能接受。</span>", "<b>她澄清的第一处边界要记牢：这一切假设环境是<span class='k'>平稳</span>的。</b><span class='w'>转移和奖励不随时间变</span>。<b>如果环境本身在漂移，那么「这次比上次好」这个比较就失去了意义</b>——<span class='k'>你不知道变化是来自你的策略还是来自环境</span>。<span class='w'>而真实系统里环境漂移极其常见</span>（<b>用户行为变了、上游服务升级了、模型版本换了</b>）。<b>所以「单调改进」这个承诺的前提，比它听起来强。</b>", "<b>她澄清的第二处边界更要紧，而且这一条在后面所有保证上都成立：<span class='k'>单调改进是<b>期望意义上的</b></span>。</b><b><code>V^{π₁} ≤ V^{π₂} ≤ …</code> 成立，</b><span class='w'>但这<b>不保证对某一个病人更好</b></span>。<b>新策略可能在总体上更优，同时在某个具体个体上更差。</b><span class='k'>这是「期望」这个词的全部含义，也是它最容易被忽略的后果</span>——<b>一个在平均上无可指摘的改进，完全可以伤害到特定的一群人。</b>", "<b>最后那两条技术路线，是这一讲后面全部内容的分类标签，值得贴好。</b><b>① 把梯度估得更准</b>（<span class='k'>p13–p25：基线、critic、n 步</span>）——直觉是：梯度更准，更新自然更好。<br><b>② 改变拿到梯度之后怎么更新</b>（<span class='k'>p29 起：线搜索、下界、信赖域</span>）——<b>这一条承认「梯度就那么准了」，转而问「既然只是局部近似，我该在它还成立的范围内走」。</b><span class='w'>第二条路是这一讲真正的新东西。</span>"], "say": "老师现场问为什么想要单调改进。有人答「帮助保证收敛」——对，但她想要的是<b>经验上的理由</b>。另一位同学给了：<span class='k'>高风险场合</span>。<br>她画了 DQN 那条上下剧烈抖动的曲线，然后说：这一季做得好、下一季做得差、以后总会好起来——<b>在公司里这话说不通，人是厌恶损失的</b>。医疗、飞机这类场合更不能接受。<br>她还澄清了两处边界：一是假设环境<b>平稳</b>（转移和奖励不随时间变）；二是单调改进是<span class='w'>期望意义上的</span>——V^{π1} ≤ V^{π2} ≤ … 成立，但<b>不保证对某一个病人更好</b>。", "quote": "Goal: Converge as quickly as possible to a local optima &nbsp;·&nbsp; <b>Incurring reward / cost as execute policy</b>, so want to minimize number of iterations until reach a good policy &nbsp;|&nbsp; <b>Would like each policy update to be a monotonic improvement</b> &nbsp;·&nbsp; Only guaranteed to reach a local optima with gradient descent · Monotonic improvement will achieve this · <b>And in the real world, monotonic improvement is often beneficial</b> &nbsp;|&nbsp; Techniques: <b>Get a better estimate of the gradient</b> · <b>Change how to update the policy parameters given the gradient</b>", "tbl": {"head": ["两条技术路线", "承认什么", "怎么做", "在哪几页"], "rows": [["<b>① 更好的梯度估计</b>", "梯度估得不准", "<span class='k'>降方差：基线、critic、n 步</span>", "p13–p25"], ["<b>② 改变更新方式</b>", "<span class='w'>梯度只是局部近似，远处不成立</span>", "<span class='k'>限制每步走多远（信赖域）</span>", "p29–p52"], ["<b>单调改进的前提</b>", "—", "<span class='w'>① 环境平稳；② 只在期望意义上成立</span>", "<b>老师当堂澄清</b>"]]}, "res": {"tag": "推断", "v": "<b>老师澄清的第二处边界，是你简报 §8 那个开放问题的另一种说法，而且它说得比你原来的表述更一般。</b><br><br><span class='k'>「单调改进是期望意义上的，不保证对某一个病人更好」</span>——<b>把「病人」换成「query」，这句话就是你的问题。</b><span class='w'>一套新配置在留出集上的平均 Acc 更高，完全可能在某一类 query 上更差</span>。<b>而如果那一类 query 恰好是你的用户最常问的，平均值的改进就是假的。</b><br><br><b>这件事在你的设定里比在医疗里更隐蔽，原因有两个。</b><br><b>① 你的 query 分布是异质的。</b><span class='k'>简单题谁跑都对，难题谁跑都错，中间那一段才是配置真正起作用的地方</span>——<b>于是平均 Acc 的变化可能完全由「中间那一段的占比」决定，而不是由配置质量决定。</b><span class='w'>换一批测试集，结论可能就反了。</span><br><b>② 降成本的配置天然在「难题」上损失更大。</b><span class='k'>低保真度对简单题几乎没影响，对难题影响显著</span>——<b>所以「平均 Acc 只掉 1%」背后，可能是「简单题掉 0%、难题掉 8%」。</b><span class='w'>这两种情况对用户的意义完全不同，而平均值把它们抹平了。</span><br><br><b>两条可以立刻做的事：</b><br><b>① 按难度分层报告。</b><span class='k'>把留出集按某个难度代理（基线模型的正确率、输入长度、人工标注）分 3–5 档，每档单独报 Acc 和 Cost</span>。<b>这几乎不花额外预算（同一批结果重新切一刀），但能把被平均掉的东西露出来。</b><br><b>② 把「最差那一档的损失」当成一个要报告的指标</b>，<span class='w'>而不是只报平均</span>。<b>这正是 §8 想要的那种逐点保证的一个务实替代——拿不到严格的 per-query 保证，至少给出分层的证据。</b>", "ref": "课件 p9–p11 老师当堂澄清 · 简报 §8 · L07 p30 科研格"}},
{"r": [12, 12], "t": "目录", "quote": "Table of Contents &nbsp;·&nbsp; 1 Better Gradient Estimates &nbsp;·&nbsp; 2 Policy Gradient Algorithms and Reducing Variance &nbsp;·&nbsp; 3 Updating the Parameters Given the Gradient: Motivation &nbsp;·&nbsp; 4 Need for Automatic Step Size Tuning &nbsp;·&nbsp; 5 ... Local Approximation &nbsp;·&nbsp; 6 ... Trust Regions &nbsp;·&nbsp; 7 ... TRPO Algorithm", "one": "七节，但其实是<b>两段</b>：1–2 节讲估计，3–7 节讲步长。", "pts": ["<b>这个目录有七节，但它们的分量完全不对等，看出这一点能帮你分配注意力。</b><span class='k'>第 1–2 节（p13–p25）讲估计，内容和上一讲后半高度重叠</span>——<b>如果你上一讲读扎实了，这一段可以快过，只盯两处新东西：坏基线会加方差（p15），以及 n 步那条「环境越不像 MDP 越该往 MC 靠」的判据（p25）。</b><span class='w'>第 3–7 节（p29 起）才是这一讲真正的新内容</span>，<b>而且它们是一条连贯的推导链，中间断了就接不上。</b>", "<b>把第 3–7 节的链条先摆出来，读的时候就不会迷路。</b><br><b>③ 动机</b>：<span class='k'>为什么步长在 RL 里格外要紧</span>（p29）。<br><b>④ 需要自动调步长</b>：<span class='k'>线搜索太贵，而且没用上「近似在哪还成立」的信息</span>（p31）。<br><b>⑤ 局部近似</b>：<span class='k'>把「新策略的值」写成「旧策略的优势」，但卡在新策略的访问频率上</span>（p33–p36）。<br><b>⑥ 信赖域</b>：<span class='k'>既然近似只在附近成立，那就强制不许走远</span>（p37–p42）。<br><b>⑦ TRPO</b>：<span class='k'>把上面这套变成能跑的算法</span>（p43–p52）。<br><span class='w'>每一节都在解决上一节留下的那个具体障碍。</span>", "<b>还有一件读这类长目录时的实用习惯：先数一数每一节占几页。</b><span class='k'>第 1–2 节占 13 页，第 3–7 节占 26 页</span>——<b>页数本身就是作者对重要性的投票。</b><span class='w'>而这一讲前半之所以还占了 13 页，是因为它要把上一讲的内容再过一遍，好让后半的推导有个干净的起点。</span>"]},
{"r": [13, 13], "t": "复习：无偏但噪声大", "one": "三个修法：时间结构（上一讲）、<b>基线</b>、<b>换掉蒙特卡洛目标</b>。", "eq": "∇_θV(θ) ≈ (1/m) Σ_i R(τ⁽ⁱ⁾) Σ_t ∇_θ log π_θ(a_t⁽ⁱ⁾|s_t⁽ⁱ⁾)", "quote": "Unbiased estimate of gradient but <b>very noisy</b> &nbsp;·&nbsp; Fixes that can make it practical: <b>Temporal structure</b> (discussed last time) &nbsp;·&nbsp; <b>Baseline</b> &nbsp;·&nbsp; <b>Alternatives to using Monte Carlo returns R(τ) as targets</b>", "pts": ["<b>三个修法里，前两个上一讲讲过，第三个是这一讲的新东西，而它的性质和前两个不同。</b><span class='k'>时间结构和基线都<b>不引入偏差</b>——纯粹的方差削减，没有代价</span>；<span class='w'>而「换掉蒙特卡洛目标」要用 bootstrap 和函数逼近，<b>一定引入偏差</b></span>。<b>所以第三招是一笔真正的交易，前两招不是。</b><span class='k'>用不用前两招没什么好想的；用不用第三招、用多少，才是需要判断的。</span>", "<b>把这三招和它们攻击的对象对上，你就知道该先用哪一招。</b><b>方差有三个来源</b>：<span class='k'>① 功劳分配太粗（score 被无关的奖励加权）→ 时间结构</span>；<span class='k'>② 权重绝对值太大（信号藏在差异里）→ 基线</span>；<span class='k'>③ 回报本身是单次 rollout，随机性大 → critic</span>。<b>前两个是「用错了信息」，第三个是「信息本身就不够」。</b><span class='w'>所以前两招应该无条件先用，第三招留到还不够时再上。</span>", "<b>再补一个这三招的使用顺序建议，它来自一条很简单的原则：先用免费的。</b><span class='k'>时间结构和基线不引入偏差，所以无条件先上</span>；<b>上完之后再看方差够不够小。</b><span class='w'>还不够，才考虑第三招，而那时你要准备好调一个新的超参（n 步的 n）</span>，<b>并且接受估计变成有偏的。</b><span class='k'>反过来的顺序——先上 critic 再想起来加基线——在实践中很常见，而且很浪费。</span>"]},
{"r": [14, 14], "t": "基线", "star": 3, "one": "从回报里减去一个只依赖状态的 <code>b(s)</code>。", "eq": "∇_θE_τ[R] = E_τ[ Σ_t ∇_θ log π(a_t|s_t,θ) · ( Σ_{t′≥t} r_{t′} − b(s_t) ) ]\n\n接近最优的取法：b(s_t) ≈ E[ r_t + r_{t+1} + … + r_{T-1} ]", "pts": ["<b>读法：把动作的对数概率推高多少，取决于回报比「预期」好多少。</b>", "<span class='k'>这实际上就是个优势函数</span>。", "<b>这一页的式子和上一讲完全一样，但有一句话值得在这里就说破：<span class='k'>减去基线之后，括号里那个东西实际上就是一个优势函数的估计</span>。</b><b><code>Σ_{t′≥t} r_{t′}</code> 是 <code>Q(s_t,a_t)</code> 的一个单次采样估计，<code>b(s_t)</code> 近似 <code>V(s_t)</code>，两者相减正是 <code>A(s_t,a_t)</code>。</b><span class='w'>所以「基线」和「优势函数」不是两个东西，是同一件事的两种说法</span>——<b>p19–p20 会把这层关系写成式子。</b>", "<b>课件那句 <em>for any choice of b</em> 里的 <em>any</em> 要当真，但也要看清它承诺的是什么。</b><span class='k'>它承诺的是<b>无偏</b>，不是<b>降方差</b></span>。<b>这两件事在这一讲里被仔细区分开了，而 L08 只讲了前一半。</b><span class='w'>下一页老师当堂做的两次小测，问的正是这个区别</span>——<b>而第二次小测的答案会让你意识到：基线选错了不是「没用」，是「有害」。</b>", "<b>还可以从「为什么是减法而不是除法」这个角度确认一下基线的合理性。</b><span class='k'>你想要的是「比预期好多少」，那是一个差</span>；<span class='w'>如果用比值（回报除以预期），当预期接近 0 时会爆炸，而且无偏性也不再成立</span>。<b>减法既保住了无偏，又在量纲上和回报一致。</b>"], "quote": "reduce variance by introducing a baseline b(s) &nbsp;·&nbsp; <b>∇_θ E[R] = E[ Σ_t ∇_θ log π(a_t|s_t,θ) ( Σ_{t′≥t} r_{t′} − b(s_t) ) ]</b> &nbsp;·&nbsp; <b>For any choice of b, gradient estimator is unbiased</b> &nbsp;·&nbsp; Near optimal choice is expected return &nbsp;·&nbsp; Interpretation: increase logprob of action a_t proportionally to <b>how much returns are better than expected</b>"},
{"r": [15, 16], "t": "为什么基线不引入偏差", "star": 3, "one": "五步，最后落在「<b>概率之和是 1，它的导数是 0</b>」。", "eq": "E_τ[ ∇_θ log π(a_t|s_t,θ)·b(s_t) ]\n  ① 把轨迹拆成 0..t 和 t..T 两段\n  ② b(s_t) 与未来无关，提到内层期望外面\n  ③ 内层只剩 s_t, a_t，丢掉无关变量\n  ④ 写开对 a_t 的期望，用似然比约掉分母\n  ⑤ 得到 b(s_t)·∇_θ Σ_a π(a|s_t,θ) = b(s_t)·∇_θ 1 = 0", "pts": ["<span class='w'>关键在第②步</span>：<b>b 只能依赖状态</b>。若它也依赖动作，就提不出来，整个证明作废。", "<b>老师当堂做的那两次小测，是这一讲前半最该带走的东西，值得把答案想透。</b><br><b>第一问：<code>b(s)</code> 取成一个常数，还无偏吗？</b><span class='k'>无偏——常数是「状态的函数」的平凡情形，证明一步不差地走完</span>。<span class='w'>但它可能一点方差都降不了。</span><br><b>第二问：有没有哪个 <code>b</code> 会破坏无偏性？</b><span class='k'>没有——只要它只是状态的函数，全都无偏</span>。<b>坏的基线只会让估计更差，不会让它有偏。</b>", "<b>「只会让估计更差」这六个字是这一页的核心，而它在 L08 里没被说出来，值得补完整。</b><span class='w'>无偏是<b>无条件</b>的，降方差<b>不是</b></span>。<span class='k'>一个基线能不能降方差，取决于它和被减的那个量有多相关</span>——<b>减去一个和 <code>G_t</code> 毫无关系的数，等于往估计量里又注入了一份独立的噪声，方差反而更大。</b><span class='w'>极端例子：拿一个随机数当基线。无偏，但方差翻倍。</span>", "<b>把这条判据写成可操作的形式，你在实现时就能自己检查。</b><span class='k'>一个基线 <code>b(s)</code> 能降方差，大致要求它是 <code>G_t</code> 在给定 <code>s</code> 下的一个好的预测</span>——<b>也就是和 <code>V(s)</code> 接近。</b><span class='w'>所以「用 <code>V</code> 当基线」不只是一个方便的选择，它是这条判据的直接答案</span>（<b>p19–p20</b>）。<b>而「用这批轨迹回报的均值」是一个退化但仍然有效的版本</b>——<span class='k'>它至少把整体的量级拉到 0 附近。</span>", "<b>证明本身的要害还是那一步：<span class='w'><code>b</code> 只能依赖状态</span>。</b><span class='k'>第②步要把 <code>b(s_t)</code> 提到对动作的期望外面</span>——<b>如果它也依赖动作，这一步做不了，整个证明作废。</b><span class='w'>而且后果不是「少降一点方差」，是「估计量变成有偏的」</span>。<b>这是实现时最危险的一个错误，因为它不报错，只会让结论悄悄偏掉。</b>", "<b>最后把「无偏」和「降方差」这两件事的不对称性记成一句话，它在别处也用得上：</b><span class='k'>控制变量法里，减掉任何一个期望为零的量都不改变均值；但只有和被估量<b>正相关</b>的那些才真的降方差</span>。<b>减一个负相关的量会让方差更大。</b><span class='w'>所以「加一个控制变量」从来不是无脑的改进，它需要你论证相关性。</span>"], "say": "老师当堂做了两次小测。<br><b>① b(s) 取成一个常数，还无偏吗？</b> 无偏——常数是「状态的函数」的平凡情形。<span class='w'>但它可能一点方差都降不了。</span><br><b>② 有没有哪个 b 会破坏无偏性？</b> 没有——<span class='k'>只要它只是状态的函数，全都无偏</span>。坏的基线只会让估计更差，不会让它有偏。", "quote": "E[∇_θ log π(a_t|s_t,θ) b(s_t)] &nbsp;·&nbsp; = E_{s_{0:t},a_{0:(t−1)}}[ b(s_t) E_{a_t}[∇_θ log π(a_t|s_t,θ)] ] &nbsp;·&nbsp; = E[ b(s_t) Σ_a π(a|s_t) ∇π(a|s_t,θ)/π(a|s_t) ] &nbsp;·&nbsp; = E[ b(s_t) ∇_θ Σ_a π(a|s_t,θ) ] &nbsp;·&nbsp; = E[ b(s_t) ∇_θ 1 ] &nbsp;·&nbsp; <b>= 0</b>", "tbl": {"head": ["基线的选法", "无偏吗", "降方差吗", "为什么"], "rows": [["<code>b(s) = V(s)</code>", "<span class='k'>是</span>", "<span class='k'>降得最多</span>", "<b>它是 <code>G_t</code> 的条件期望，相关性最高</b>"], ["<code>b</code> = 这批回报的均值", "<span class='k'>是</span>", "<span class='k'>降一些</span>", "把整体量级拉到 0 附近"], ["<code>b</code> = 任意常数", "<span class='k'>是</span>", "<span class='w'>可能一点都不降</span>", "常数是「状态的函数」的平凡情形"], ["<code>b</code> = 一个随机数", "<span class='k'>是</span>", "<span class='w'>反而加方差</span>", "<b>注入了一份独立的噪声</b>"], ["<code>b(s,a)</code> 依赖动作", "<span class='w'>否，有偏</span>", "—", "<b>证明第②步提不出来，整个论证作废</b>"]]}, "res": {"tag": "已核", "v": "<b>这一页把 L08 p55 那条科研格补完整了：我当时说「基线不依赖决策就不引入偏差」，那是对的，但不够——<span class='k'>不引入偏差不等于有用</span>。</b><br><br><b>完整的判据是两条，缺一不可：</b><br><b>① 不依赖决策</b> ⇒ <span class='k'>保证无偏</span>（证明第②步要用）。<br><b>② 和被减量正相关</b> ⇒ <span class='k'>才真的降方差</span>。<span class='w'>负相关的基线会让方差更大，而它仍然是无偏的——所以你不会从均值上察觉。</span><br><br><b>把第②条用到你之前那两个基线候选上，结论是它们都通过，但理由要说清楚：</b><br><b>「query 自身的难度基线」</b>：<span class='k'>和实际 Acc 高度正相关</span>（难题就是更容易错），<b>所以降方差效果应该很好</b>。<span class='w'>但要用「所有配置上的平均正确率」，不能用某个配置上的</span>——否则它就依赖决策了。<br><b>「成本的预测值」</b>：<span class='k'>和实际成本高度正相关</span>（输入长度基本决定了它），<b>同样有效</b>。<span class='w'>但必须用决策前就知道的量（输入长度、query 类型），不能用实际跑出来的 token 数。</span><br><br><b>而这条判据还给了你一个<span class='k'>检验手段</span>，几行代码就能跑：</b><b>拿一批已有结果，分别算「减基线前」和「减基线后」那个量的方差。</b><span class='w'>如果没降，说明这个基线和被减量不够相关，换一个</span>；<b>如果变大了，说明选反了方向。</b><span class='k'>这个检查比任何理论论证都直接，而且做一次就够。</span>", "ref": "课件 p15–p16 老师两次小测 · L08 p55 科研格 · 简报 §4e"}},
{"r": [17, 18], "t": "「香草」策略梯度算法", "star": 3, "one": "采轨迹 → 算回报和优势 → <b>重新拟合基线</b> → 更新策略。", "eq": "初始化 θ 和基线 b\n每轮：\n  用当前策略采一批轨迹\n  每个时间步：回报 R_t = Σ_{t′≥t} r_{t′}，优势 Â_t = R_t − b(s_t)\n  重新拟合基线：最小化 Σ‖b(s_t) − R_t‖²        ← 就是监督学习\n  ĝ = Σ_t ∇_θ log π(a_t|s_t,θ)·Â_t，喂给 SGD / ADAM\n\n自动微分写法：L(θ) = Σ_t [ log π(a_t|s_t;θ)·Â_t − ‖V(s_t) − R̂_t‖² ]", "pts": ["<b>拟合基线这一步和第三讲的蒙特卡洛策略评估几乎一模一样</b>：固定策略、参数化函数、最小二乘。", "<b>老师说「如果今天只带走一样东西，就带走这个模板」，这句话该当真，因为它确实是个模板。</b><span class='k'>四个槽位：① 怎么采数据；② 怎么估优势；③ 用不用基线、用什么；④ 怎么选步长</span>。<b>几乎所有策略梯度算法都是在这四个槽位里换零件。</b><span class='w'>A3C 换的是①（并行采样）和②（n 步）；TRPO 换的是④；PPO 换的是④并顺带改了目标函数的形式。</span><b>认出这一点，读新论文时你只需要问「它动了哪个槽位」。</b>", "<b>「重新拟合基线」这一步和第三讲的蒙特卡洛策略评估几乎一模一样，值得对照着看一次。</b><span class='k'>固定策略、参数化一个函数、最小二乘去拟合观察到的回报</span>——<b>这就是 L03 的蒙特卡洛策略评估，换了个名字出现在这里。</b><span class='w'>所以这一步没有任何新东西，它是一个纯粹的监督学习问题</span>。<b>而它的难度也就是监督学习的难度：数据够不够、函数类合不合适、会不会过拟合。</b>", "<b>老师讲的那个细节——基线该用哪些数据拟合——比它看起来重要得多。</b><span class='w'>用历来所有数据：那是在平均许多个不同策略的值，拟出来的不是 <code>V^{π_i}</code>，而是某种混合物</span>；<span class='k'>只用本轮的那批轨迹：拟出来的才真是当前策略的值函数</span>。<b>而基线要降方差，靠的正是它准确预测<b>当前</b>策略下的回报。</b><span class='w'>用混合物当基线，相关性下降，降方差的效果就打折。</span>", "<b>被问到「混用旧数据行不行」时老师的回答，正好预告了这一讲后半的主题。</b><span class='k'>「那就变成 off-policy 了，可以重加权，但会引入方差」</span>——<b>重加权就是重要性采样，而它的方差问题你在 L03 已经见过。</b><span class='w'>她还补了一句很诚实的话：「实测下来多数时候还是 on-policy 更好，不过这件事还没有定论」</span>。<b>注意这是 2018 年的说法；此后 PPO 那条线正是在「怎么安全地复用几轮旧数据」上做文章。</b>", "<b>最后指出这个算法里一个容易忽略的顺序问题：<span class='k'>先用旧基线算优势，再更新基线</span>。</b><b>伪代码里「算 <code>Â_t = R_t − b(s_t)</code>」在「重新拟合 b」之前。</b><span class='w'>如果顺序反了（先拟合再算优势），基线就是从同一批数据里学出来的，它会部分地「记住」这些回报</span>——<span class='k'>于是 <code>Â_t</code> 被系统性地压小，而且不同样本被压的程度不同</span>。<b>这会引入一点偏差，而且方向不好分析。</b><span class='w'>讲究的实现会用上一轮的数据拟合基线，彻底避开这个问题。</span>"], "say": "有个细节老师讲得很清楚：<b>基线该用哪些数据拟合？</b><br>用<span class='w'>历来所有数据</span>，那是在平均许多个不同策略；只用<span class='k'>本轮的那批轨迹</span>，拟出来的才真是 <code>V^{π_i}</code>。<br>被问到「混用旧数据行不行」时她答：那就变成 off-policy 了，<b>可以重加权，但会引入方差</b>；「实测下来多数时候还是 on-policy 更好，不过这件事还没有定论」。", "tip": {"t": "这一页是整讲的骨架", "v": "老师原话大意：<b>如果今天只带走一样东西，就带走这个模板。</b>跑策略拿数据 → 拟合出某种优势（可以 bootstrap，也可以直接用回报）→ 常常配一个基线 → 选一个步长更新策略。<span class='k'>几乎所有策略梯度算法都是在这个模板的各个槽位里换零件。</span>"}, "quote": "<b>\"Vanilla\" Policy Gradient Algorithm</b> &nbsp;·&nbsp; Initialize policy parameter θ, baseline b &nbsp;·&nbsp; Collect a set of trajectories by executing the current policy &nbsp;·&nbsp; compute the return R_t and the advantage estimate <b>Â_t = R_t − b(s_t)</b> &nbsp;·&nbsp; <b>Re-fit the baseline, by minimizing ||b(s_t) − R_t||²</b> &nbsp;·&nbsp; Update the policy using ĝ &nbsp;|&nbsp; L(θ) = Σ_t [ log π(a_t|s_t;θ) Â_t − ||V(s_t) − R̂_t||² ]", "tbl": {"head": ["模板的槽位", "vanilla 里放的是", "别的算法换成什么"], "rows": [["① 怎么采数据", "按当前策略串行采一批", "<span class='k'>A3C：多个 worker 并行采</span>"], ["② 怎么估优势", "<code>R_t − b(s_t)</code>（蒙特卡洛回报）", "<span class='k'>n 步估计、GAE</span>"], ["③ 基线用什么", "<code>V(s)</code>，最小二乘拟合", "这批回报的均值（退化版）"], ["④ 怎么选步长", "<span class='w'>SGD / ADAM，固定学习率</span>", "<b>TRPO：KL 信赖域；PPO：截断比值</b>"], ["<b>拟合基线用哪批数据</b>", "<span class='k'>只用本轮的</span>", "<span class='w'>混旧数据就成 off-policy，可重加权但引方差</span>"]]}},
{"r": [19, 20], "t": "基线选什么：值函数", "star": 3, "one": "<code>V</code> 是天然的基线，<code>Q − V</code> 就是优势函数。", "eq": "Q^{π,γ}(s,a) = E_π[ r₀ + γr₁ + γ²r₂ + … | s₀=s, a₀=a ]\nV^{π,γ}(s)   = E_{a~π}[ Q^{π,γ}(s,a) ]\nA^{π,γ}(s,a) = Q^{π,γ}(s,a) − V^{π,γ}(s)", "pts": ["<span class='k'>注意有两个地方都能在 MC 和 TD 之间选</span>：一个是目标（换掉 R(τ)），一个是基线本身。", "<b>这一页把前面散落的几个概念收成了一个闭环，值得停下来把关系理清。</b><span class='k'><code>V</code> 是 <code>Q</code> 对动作取期望；<code>A = Q − V</code> 是「这个动作比平均好多少」</span>。<b>于是优势函数有一个必然的性质：<code>E_{a∼π}[A^π(s,a)] = 0</code>。</b><span class='w'>按当前策略平均，优势一定是零</span>——<b>因为 <code>V</code> 就是按它定义的。</b><span class='k'>这个性质在第十讲推导下界时会被反复用到，现在先记住。</span>", "<b><code>V</code> 之所以是「天然的基线」，可以从两个角度同时看到，而两个角度给的是同一个答案。</b><span class='k'>方差角度：它是 <code>G_t</code> 的条件期望，所以相关性最高，降方差最多</span>（<b>p15 那条判据</b>）。<span class='k'>语义角度：减掉它之后括号里恰好是优势函数，而优势正是「这个动作值不值得推高」</span>。<b>一个纯技术的选择和一个纯语义的选择指向同一个量，这通常说明你找对了东西。</b>", "<b>课件这一页还埋了一个容易被略过的提醒：<span class='w'>有两个地方都能在 MC 和 TD 之间选</span>。</b><b>① 目标</b>：<span class='k'>用 <code>R_t</code>（MC）还是用 critic 估的 <code>Q</code>（TD）</span>；<b>② 基线本身</b>：<span class='k'>基线 <code>b(s)</code> 也是拟合出来的，而拟合它的目标同样可以是 MC 回报或 TD 目标</span>。<b>两个选择是独立的，可以任意组合。</b><span class='w'>实践中最常见的组合是：基线用 MC 回报拟合（稳），优势用 n 步估计（降方差）。</span>", "<b>最后提一句符号上的事，因为这一讲和上一讲在这里有细微差别，不说清容易混。</b><span class='k'>这一页的 <code>Q^{π,γ}</code>、<code>V^{π,γ}</code> 带了 γ 的上标</span>，<b>强调它们是<b>折扣</b>版本的。</b><span class='w'>而 p33 之后的推导全程用折扣形式，并且会引入一个「折扣访问频率」<code>ρ^π(s)</code></span>——<b>那个量的和不是 1，是 <code>1/(1−γ)</code>，所以它<span class='w'>不是</span>概率分布。</b><span class='k'>这是这一讲最容易出错的一处，p33 会专门说。</span>", "<b>顺带把「优势」这个词在本课程里出现的三处串一次，它们是同一个量的三种用法。</b><span class='k'>L06/L07 p7 的 dueling DQN：用 <code>A = Q − V</code> 拆网络结构，买的是样本效率</span>；<span class='k'>L08 p59 和本页：用它当策略梯度的权重，买的是方差</span>；<span class='k'>L09 p33 之后：用它表达「新策略比旧策略好多少」，买的是一个可优化的目标</span>。<b>三处的定义完全一样，用途完全不同。</b>"], "quote": "Recall Q-function: <b>Q^{π,γ}(s,a) = E_π[r_0 + γr_1 + γ²r_2 + ... | s_0=s, a_0=a]</b> &nbsp;·&nbsp; <b>State-value function can serve as a great baseline</b>: V^{π,γ}(s) = E_a[Q^{π,γ}(s,a)] &nbsp;·&nbsp; Advantage function: <b>A^{π,γ}(s,a) = Q^{π,γ}(s,a) − V^{π,γ}(s)</b>"},
{"r": [21, 21], "t": "目录", "quote": "Table of Contents &nbsp;·&nbsp; 1 Better Gradient Estimates &nbsp;·&nbsp; <b>2 Policy Gradient Algorithms and Reducing Variance</b> &nbsp;·&nbsp; 3 Updating the Parameters Given the Gradient: Motivation &nbsp;·&nbsp; ...", "one": "第二节：<b>降方差的第三招——换掉蒙特卡洛目标</b>。", "pts": ["<b>这一节只有四页（p22–p25），但它引入的那一招和前两招性质完全不同，值得先把差别钉死。</b><span class='k'>时间结构和基线都不引入偏差，是纯粹的方差削减</span>；<span class='w'>而「用 critic 估的值替代蒙特卡洛回报」一定引入偏差</span>。<b>所以这一招不是「又一个免费改进」，它是一笔要你权衡的交易。</b><span class='k'>p25 会给出决定这笔交易划不划算的判据，而那条判据和「环境像不像 MDP」直接相关。</span>"]},
{"r": [22, 23], "t": "换掉目标：critic 与 actor-critic", "star": 3, "one": "<b>用一个 critic 去估 V 或 Q，替代那条噪声极大的蒙特卡洛回报。</b>", "pts": ["<code>R(τ)</code> 是<b>单次 rollout</b> 给出的值估计：无偏、高方差。", "用 bootstrap + 函数逼近换来偏差、压下方差——<span class='k'>和第三讲 TD vs MC、第五讲值函数逼近是同一笔交易</span>。", "<b>actor-critic</b>：策略和值函数<span class='k'>都显式地参数化、都更新</span>。", "<b>A3C</b>（Mnih et al., ICML 2016）是最流行的 actor-critic 方法之一。", "<b>课件那句 <em>from a single roll out</em> 点出了问题的根子，值得停一下。</b><span class='k'><code>R(τ)</code> 是对「这个状态值多少」的一次采样估计——只跑了一趟</span>。<b>而 L02 p14 早就演示过：同一起点的三条轨迹，回报可以是 1.25 / 0 / 0.125。</b><span class='w'>用单次采样当作值的估计，无偏，但噪声大到可以淹没信号</span>。<b>critic 的作用就是把「很多次采样的信息」压缩进一个函数里，让你每次都能读到一个平滑过的估计。</b>", "<b>这笔交易的名字和形状你已经见过三次了，这里是第四次，值得并排看一遍。</b><span class='k'>L03：MC 无偏高方差，TD 有偏低方差</span>；<span class='k'>L05：函数逼近带来结构性误差，换来泛化</span>；<span class='k'>L08 p60：n 步估计在两端之间滑</span>；<span class='k'>这里：用 critic 换掉单次回报</span>。<b>四处都是同一笔交易——拿偏差换方差——只是出现在不同的位置上。</b><span class='w'>认出这一点之后，你碰到任何新算法都可以先问：它在这条轴上站在哪里。</span>", "<b>actor-critic 这个名字本身就说明了结构：两个东西，各管一摊，都在学。</b><span class='k'>actor 是策略 <code>π_θ</code>，它负责「做什么」；critic 是值函数 <code>V_w</code> 或 <code>Q_w</code>，它负责「刚才做得怎么样」</span>。<b>critic 不直接决定动作，它只给 actor 打分。</b><span class='w'>这个分工的代价是你现在有两个东西要调，而且它们互相影响</span>——<b>critic 不准会把 actor 带偏，actor 一变 critic 又得重学。</b><span class='k'>这是 actor-critic 在实践中难调的根本原因。</span>", "<b>老师补的那句历史值得记：<span class='k'>actor-critic 这个想法比 A3C 老得多</span>。</b><b>它可以追到 1980 年代（Barto、Sutton、Anderson 那条线），而 A3C 只是它在深度网络上最流行的一个版本。</b><span class='w'>A3C 真正的创新不在 actor-critic 本身，而在「异步并行采样」</span>——<b>多个 worker 各自和环境交互、各自算梯度、异步更新共享参数。</b><span class='k'>那解决的是上一讲 p8 说的「采样慢」，顺带还因为多个 worker 的数据不相关而降了方差，于是连回放池都不需要了。</span>"], "say": "老师补了一句历史：<b>actor-critic 这个想法比 A3C 老得多</b>，A3C 只是它在深度网络上最流行的一个版本。", "quote": "R(τ^{(i)}) is an estimation of the value function <b>from a single roll out</b> &nbsp;·&nbsp; <b>Unbiased but high variance</b> &nbsp;·&nbsp; reduce variance by introducing bias using <b>bootstrapping and function approximation</b> (just like we saw for TD vs MC, and in the value function approximation lectures) &nbsp;·&nbsp; <b>Estimate of V/Q is done by a critic</b> &nbsp;·&nbsp; Actor-critic methods maintain an explicit representation of both the policy and the value function, and update both &nbsp;·&nbsp; A3C is very popular", "tbl": {"head": ["", "actor", "critic"], "rows": [["是什么", "<b>策略 <code>π_θ</code></b>", "<b>值函数 <code>V_w</code> / <code>Q_w</code></b>"], ["负责", "<span class='k'>做什么</span>", "<span class='k'>刚才做得怎么样</span>"], ["怎么更新", "策略梯度", "<span class='w'>回归（监督学习）</span>"], ["不准的后果", "表现差", "<span class='w'>把 actor 带偏</span>"], ["对应本讲的哪一招", "—", "<b>降方差第三招（引入偏差）</b>"]]}},
{"r": [24, 24], "t": "带值函数的策略梯度公式", "star": 3, "one": "把蒙特卡洛回报换成 <code>Q(s,a;w)</code>，减去基线就得到优势。", "eq": "∇_θE_τ[R] = E_τ[ Σ_t ∇_θ log π(a_t|s_t,θ) · ( Σ_{t′≥t} r_{t′} − b(s_t) ) ]\n          ≈ E_τ[ Σ_t ∇_θ log π(a_t|s_t,θ) · ( Q(s_t, w) − b(s_t) ) ]\n          = E_τ[ Σ_t ∇_θ log π(a_t|s_t,θ) · A^π(s_t, a_t) ]", "pts": ["<span class='k'>形状完全一样，只是槽位里换了零件</span>：", "用蒙特卡洛回报 ⇒ 对当前策略的值<b>无偏</b>；", "用 critic 的 Q ⇒ <b>一般有偏，但方差低得多</b>。", "<b>这一页只换了一个零件，但那个「约等号」值得专门指出来——它是这一讲第一次出现不等式。</b><span class='k'>前面所有推导都是等号：似然比是恒等式，基线不改变期望，因果性删掉的项期望为零</span>。<span class='w'>而这里 <code>Σ_{t′≥t} r_{t′} ≈ Q(s_t, w)</code> 是一个真正的近似</span>——<b><code>Q(s_t,w)</code> 是拟合出来的，它和真实的 <code>Q</code> 之间有误差，而这个误差会原样传进梯度里。</b><span class='k'>从这一页开始，你的梯度估计不再无偏。</span>", "<b>把三种槽位里的零件和它们的性质列一次，选哪个就有依据了。</b><span class='k'>用蒙特卡洛回报 <code>R_t</code>：对当前策略的值<b>无偏</b>，方差大</span>；<span class='k'>用 critic 的 <code>Q(s,w)</code>：<b>一般有偏</b>，方差低得多</span>；<span class='k'>用 n 步混合：介于两者之间，而且可以连续调</span>。<b>注意「有偏」这件事的严重程度取决于 critic 有多准</b>——<span class='w'>训练早期 critic 很差，此时它引入的偏差可能大到让梯度指错方向。</span><b>这就是为什么很多实现在早期更依赖蒙特卡洛，后期才逐渐增加自举。</b>", "<b>顺带提一句这一页课件上的排版错：原文里出现了 <code>beta=n0</code> 这样的片段。</b><span class='w'>那显然是 <em>Letting the baseline be an estimate of the value V</em> 在转 PDF 时被压坏了</span>。<span class='k'>意思很清楚：把基线取成 <code>V</code> 的估计，于是 <code>Q − b</code> 就成了优势 <code>Â</code></span>。<b>课堂反馈里「少写错符号」那一条，说的就是这类地方</b>——<span class='w'>碰到对不上的符号，先怀疑是笔误再怀疑自己。</span>"], "quote": "E[R] = E[ Σ_t ∇_θ log π(a_t|s_t,θ) ( Σ_{t′≥t} r_{t′} − b(s_t) ) ] &nbsp;·&nbsp; <b>≈ E[ Σ_t ∇_θ log π(a_t|s_t,θ) ( Q(s_t, w) − b(s_t) ) ]</b> &nbsp;·&nbsp; Letting the baseline be an estimate of the value V, we can represent the gradient in terms of the state-action advantage function &nbsp;·&nbsp; <b>= E[ Σ_t ∇_θ log π(a_t|s_t,θ) Â(s_t, a_t) ]</b>"},
{"r": [25, 25], "t": "n 步估计：在 TD 和 MC 之间调", "star": 3, "one": "critic 的目标可以在「只走一步就 bootstrap」和「一路加到底」之间任取。", "eq": "R̂⁽¹⁾_t = r_t + γ·V(s_{t+1})                         ← TD(0) 味\nR̂⁽²⁾_t = r_t + γr_{t+1} + γ²·V(s_{t+2})\n…\nR̂⁽∞⁾_t = Σ_{t′≥t} γ^{t′-t}·r_{t′}                   ← 蒙特卡洛\n\n各自减去基线就是对应的优势估计", "pts": ["<span class='k'>一端偏差高方差低，另一端偏差低方差高</span>，<b>没有理由认为最好的解一定在两个端点上</b>。", "<b>老师特意点出的那条判据，是这一页最值得带走的东西，而且它在课件上没写：<span class='k'>蒙特卡洛那一端即使环境不是马尔可夫的，也仍然给出真实的回报估计；bootstrap 那一端做了强得多的马尔可夫假设</span>。</b><b>于是：<span class='w'>环境越不像 MDP，越该往 MC 那边靠</span>。</b><span class='k'>这和 L02 p17 那行 <em>Requires no assumption of Markov structure</em> 是同一条线</span>——<b>第三次出现了，而每次它都在替你做同一个决定。</b>", "<b>为什么自举需要马尔可夫假设，理由一句话就能说清，值得自己确认一遍。</b><span class='k'><code>V(s_{t+1})</code> 这个写法默认了「从 <code>s_{t+1}</code> 出发的未来，只取决于 <code>s_{t+1}</code>」</span>。<b>如果状态不马尔可夫——比如你漏掉了某个影响未来的信息——那么同一个 <code>s_{t+1}</code> 在不同历史下的真实未来回报是不同的，而 <code>V</code> 只能存一个数。</b><span class='w'>于是自举在那里就是错的，而且错得系统</span>。<b>蒙特卡洛不用 <code>V</code>，它直接把真实发生的奖励加起来，所以躲开了这个问题。</b>", "<b>学生问「n 不就是个超参数吗，为什么不交叉验证」，老师的回答也值得记：<span class='k'>可以，只是通常不这么做</span>。</b><b>她观察到大家更常直接用 TD(0) 大量 bootstrap，但这要看领域。</b><span class='w'>不交叉验证的现实原因是：每试一个 n 都要重跑一遍训练，而那很贵</span>。<span class='k'>所以 n 通常是凭对问题的判断定的，而上面那条「像不像 MDP」就是最有用的判断依据</span>。", "<b>最后那句「没有理由认为最好的解一定在两个端点上」是一条很一般的方法论提醒。</b><span class='k'>偏差–方差是一条连续谱，而端点只是特例</span>。<b>实践中既不用纯 TD 也不用纯 MC，而是取一个中间的 n（课件在 L08 建议过 20 左右）</b>，<span class='w'>更讲究的做法是把所有 n 按几何权重混起来</span>——<b>那就是 GAE，今天几乎所有策略梯度实现的默认组件。</b>"], "say": "有同学问：n 不就是个超参数吗，为什么不交叉验证？老师答：<b>可以，只是通常不这么做</b>。她观察到大家更常直接用 TD(0) 大量 bootstrap，但这要看领域。<br><span class='w'>还有一条判据她特意点出来</span>：蒙特卡洛那一端<b>即使环境不是马尔可夫的也仍然给出真实的回报估计</b>；bootstrap 那一端做了强得多的马尔可夫假设。<b>环境越不像 MDP，越该往 MC 那边靠。</b>", "quote": "critic can select any blend between TD and MC estimators for the target &nbsp;·&nbsp; <b>R̂_t^{(1)} = r_t + γV(s_{t+1})</b> &nbsp;·&nbsp; R̂_t^{(2)} = r_t + γr_{t+1} + γ²V(s_{t+2}) &nbsp;·&nbsp; <b>R̂_t^{(inf)} = r_t + γr_{t+1} + γ²r_{t+2} + ...</b> &nbsp;·&nbsp; If subtract baselines from the above, get advantage estimators &nbsp;·&nbsp; <b>Â_t^{(1)} has low variance &amp; high bias. Â_t^{(inf)} high variance but low bias.</b>", "res": {"tag": "推断", "v": "<b>老师那条判据对你的课题是一条可以直接执行的结论，而且方向和你当前的技术选择相反，值得认真看。</b><br><br><span class='k'>判据是：环境越不像 MDP，越该往蒙特卡洛那边靠，因为自举吃马尔可夫假设。</span><br><br><b>那么你的状态马尔可夫吗？——很可疑。</b><span class='w'>你的状态大致是 (query 特征, 节点 id, 部分轨迹)，而「从这个节点出发的未来」显然还依赖一些你没装进状态的东西</span>：<b>上游产物的具体内容（不只是它的统计量）、这道题的真实难度（你只有代理）、甚至 LLM 这一次的随机状态。</b><span class='k'>这些都会影响后续节点的表现，而它们不在状态里。</span><b>也就是说，你的设定存在<span class='w'>状态混叠</span>（L08 p10 的那个词），而混叠的直接后果就是不马尔可夫。</b><br><br><b>于是这条判据给出一个明确的建议：<span class='k'>少自举，多用实际发生的回报</span>。</b><span class='w'>而 FQE 恰恰是自举到底的那一端</span>——<b>它用 <code>Q̂(s′,·)</code> 顶替全部未来，是马尔可夫假设用得最狠的做法。</b><span class='k'>L05 的科研格已经从「致命三件套」的角度警告过它；这一页从「马尔可夫假设」的角度给出了同一个警告的另一半。</span><br><br><b>两条可以落地的做法：</b><br><b>① 在你的流水线上，n 步估计的「n」上限就是 H（5–10）</b>——<span class='k'>也就是说「一路算到底」（纯 MC）在你这里根本不贵</span>，<b>不像机器人那样要等上千步。</b><span class='w'>既然纯 MC 的代价对你很低，而自举的假设对你很可疑，那就该优先用 MC。</span><br><b>② 如果仍要用 FQE，就把它和一个纯 MC 的估计并排报告。</b><span class='k'>两者差得远，说明马尔可夫假设在你的状态表示下不成立</span>——<b>而这本身是一个值得报告的诊断结果，也是「该往状态里加什么特征」的直接线索。</b>", "ref": "课件 p25 老师当堂判据 · L02 p17 · L05 p38 · L08 p10 科研格 · 简报 §4e"}},
{"r": [26, 28], "t": "目录：转向「该走多远」", "quote": "Table of Contents &nbsp;·&nbsp; <b>3 Updating the Parameters Given the Gradient: Motivation</b> &nbsp;·&nbsp; <b>4 Need for Automatic Step Size Tuning</b> &nbsp;·&nbsp; 5 ... Local Approximation &nbsp;·&nbsp; 6 ... Trust Regions &nbsp;·&nbsp; 7 ... TRPO Algorithm", "one": "换题了：<b>梯度已经拿到了，现在问「该沿着它走多远」</b>。", "pts": ["<b>这是这一讲的分水岭，而且前后两半问的是性质完全不同的问题。</b><span class='k'>前半（p13–p25）：梯度估得准不准</span>——<b>这是个统计问题，答案是降方差。</b><span class='w'>后半（p29 起）：梯度只是一阶近似，它在多远之外还成立</span>——<b>这是个优化问题，答案是限制步长。</b><span class='k'>两者互相独立：梯度估得再准，走太远一样会崩。</span>", "<b>后半这个问题之所以在 RL 里才尖锐，而在监督学习里几乎不存在，原因只有一条，但这一条很硬：<span class='k'>策略决定了你接下来采到什么数据</span>。</b><b>监督学习里数据是外生的，你走错一步，下一批数据照旧，梯度会把你拉回来。</b><span class='w'>RL 里数据是你自己造的，走出一个坏策略，下一批数据就是坏策略采的</span>——<b>于是你连「往哪走」都估不准了。</b><span class='k'>p29 会把这件事说得更具体。</span>", "<b>接下来五节是一条连贯的推导链，中间断了就接不上，所以先把它的逻辑骨架记住。</b><b>① 想要的是什么</b>：<span class='k'>自动选步长，保证 <code>V^{π′} ≥ V^π</code></span>（p32）。<br><b>② 怎么表达「新策略好多少」</b>：<span class='k'>相对性能恒等式</span>（p33）。<br><b>③ 卡在哪</b>：<span class='w'>式子里要新策略的访问频率，而你只有旧策略的数据</span>（p34）。<br><b>④ 怎么绕</b>：<span class='k'>硬换成旧策略的，得到一个代理目标</span>（p36）。<br><b>⑤ 换了之后错多少</b>：<span class='k'>下界定理</span>（p37–p38）。<br><b>⑥ 怎么用这个下界</b>：<span class='k'>信赖域</span>（p41 起）。"]},
{"r": [29, 30], "t": "为什么步长在 RL 里格外要紧", "star": 3, "one": "<b>监督学习里走过头，下一步能纠回来；RL 里走过头，你连数据都拿不到了。</b>", "pts": ["梯度只是<b>一阶（线性）近似</b>：<span class='k'>近处准，远处不准</span>。", "<b>监督学习</b>：数据是 i.i.d. 生成的，你这一步的选择不影响下一批数据。", "<b>强化学习</b>：<span class='w'>策略决定了你接下来采到什么数据</span>。走出一个坏策略 → 下一批数据是坏策略采的 → 可能再也爬不回来，性能直接崩。", "<b>课件把两种情形并排写，差别一目了然，而要害在最后那个感叹号：<span class='k'><em>Policy is determining data collect!</em></span>。</b><b>监督学习里你走过头，下一步能纠回来——因为数据还在那里，梯度还是对的。</b><span class='w'>RL 里你走过头，下一批数据就是这个坏策略采的</span>——<b>于是梯度本身也不可信了，你失去了纠错的依据。</b><span class='k'>这不是「收敛慢一点」，这是「可能再也回不来」。</span>", "<b>老师转述的那个比喻很准：<span class='k'>像动画片里冲出悬崖的走鹃</span>。</b><b>它在半空中还在跑，但脚下已经没有地了。</b><span class='w'>策略一旦坏到某个程度，你拿不到任何有用的数据</span>——<b>比如一个机器人策略让它一开始就摔倒，那么所有轨迹都是「摔倒」，没有任何信息能告诉你怎么不摔。</b><span class='k'>梯度估不准 ⇒ 更新没方向 ⇒ 卡死在一个很糟的地方。</span>", "<b>她点破的第二层更深：这和「探索–利用」其实是同一件事。</b><span class='k'>策略参数和策略的随机性<b>实际上在控制你的探索</b></span>。<b>一个过于确定的策略探索不足，看不到更好的选择；一个过于随机的策略什么都学不到。</b><span class='w'>而步长直接改变策略的确定程度</span>——<b>走一大步可能让 softmax 的 logits 变得极端，策略一下子变得几乎确定，探索就没了。</b><span class='k'>所以「步长」这个看似纯优化的参数，实际上在管探索。</span>", "<b>「梯度只是一阶近似」这一条要具体理解，否则你会觉得限制步长是在浪费。</b><span class='k'>梯度告诉你的是「在当前点附近，值函数随参数怎么变」</span>——<b>它是一条切线，而真实的 <code>V(θ)</code> 是一条曲线。</b><span class='w'>离当前点越远，切线和曲线差得越多</span>。<b>于是「沿梯度走很远」这件事本身就没有依据——你是在一个已经失效的近似上做决定。</b><span class='k'>信赖域的全部思想就是：只在近似还成立的范围内走。</span>", "<b>把这一页和 L02 的策略迭代对照一次，你会发现一个有意思的反差。</b><span class='k'>L02 的策略改进是「精确」的：有模型，能算出真实的 <code>Q</code>，取 arg max 保证严格变好（p39 的单调改进定理）</span>。<span class='w'>而这里只有一个带噪声的一阶近似，所以「保证变好」变成了一件要费大力气争取的事</span>。<b>这一讲后半全部的推导，本质上是在没有模型、只有采样的情况下，重新造出 L02 那个单调改进的保证。</b><span class='k'>造出来的东西叫 TRPO，而它比 L02 那个版本弱得多（只是个下界）。</span>"], "say": "老师转述同事的比喻：<b>像动画片里冲出悬崖的走鹃</b>——策略一旦坏到某个程度，你拿不到任何有用的数据，梯度也就估不准，<span class='k'>于是卡死在一个很糟的地方</span>。<br>她还点破了这和「探索–利用」是同一件事：策略参数和策略的随机性<b>实际上在控制你的探索</b>。", "quote": "Goal: Each step of policy gradient yields an updated policy π′ whose value is greater than or equal to the prior policy π &nbsp;·&nbsp; <b>First order / linear approximation of the value function's dependence on the policy parameterization</b> &nbsp;·&nbsp; Locally a good approximation, further away less good &nbsp;|&nbsp; <b>Supervised learning: Step too far → next updates will fix it</b> &nbsp;·&nbsp; <b>Reinforcement learning: Step too far → bad policy; Next batch: collected under bad policy; Policy is determining data collect!</b> &nbsp;·&nbsp; May not be able to recover from a bad choice, collapse in performance!", "tbl": {"head": ["", "监督学习", "强化学习"], "rows": [["数据从哪来", "<span class='k'>外生的，和你的参数无关</span>", "<b>你自己的策略采的</b>"], ["走过头的后果", "<span class='k'>下一步纠回来</span>", "<span class='w'>下一批数据来自坏策略，梯度也不可信了</span>"], ["能恢复吗", "<span class='k'>能</span>", "<span class='w'>可能再也回不来，性能直接崩</span>"], ["步长还管什么", "只管收敛速度", "<b>还在管探索（策略的确定程度）</b>"]]}},
{"r": [31, 32], "t": "最直接的办法：沿梯度做线搜索", "star": 2, "one": "简单，<b>但贵，而且没用上「近似在哪里还成立」这个信息</b>。", "pts": ["要沿着这条线反复评估策略——每次评估都是真跑数据。", "下面几页的目标：<span class='k'>能不能自动选步长，保证 <code>V^{π′} ≥ V^π</code>？</span>", "<b>线搜索是最直接的想法：既然不知道该走多远，那就沿着梯度方向试几个距离，挑最好的那个。</b><span class='k'>在普通优化里这是标准做法，而且很有效</span>。<span class='w'>但在 RL 里它有两个毛病，课件都点到了。</span>", "<b>第一个毛病是贵，而且贵得具体：<span class='w'>每一次「评估」都是真跑一批数据</span>。</b><b>线搜索要试 5 个距离，就得采 5 批轨迹。</b><span class='k'>而在普通优化里，评估一次函数值只是代入算一下</span>。<b>于是同一个算法在两个场合的代价差了好几个数量级。</b><span class='w'>更糟的是：你试的那些坏点也是真跑出来的，那些代价你真实地承担了</span>（<b>回到 p9 那句 <em>incurring reward / cost as execute policy</em></b>）。", "<b>第二个毛病更本质，而且是接下来整套理论的出发点：<span class='k'>它没用上「一阶近似在哪里还成立」这个信息</span>。</b><b>线搜索是盲目地试，它不知道「走到 0.1 的地方近似还好，走到 1.0 就完全不准了」。</b><span class='w'>而这个信息其实是可以估计的</span>——<b>新旧策略差多远，可以用它们的分布之间的距离来衡量。</b><span class='k'>这就是信赖域的思路：不去试，而是算出一个「近似还可信」的范围，在里面走。</span>", "<b>p32 把目标正式提出来了，而这个目标的措辞值得注意：<span class='k'>能不能<b>自动</b>保证 <code>V^{π′} ≥ V^π</code></span>。</b><b>「自动」的意思是不靠试、不靠调超参，而是由算法本身保证。</b><span class='w'>这是一个相当高的要求</span>——<b>它等于要求每一步更新都带一个「不会变差」的证书。</b><span class='k'>接下来几页会告诉你这个证书确实能拿到，但它是一个<b>下界</b>形式的证书，而且那个下界常常松到没法直接用（p42 会说）。</span>"], "quote": "Simple step-sizing: <b>Line search in direction of gradient</b> &nbsp;·&nbsp; Simple but expensive (perform evaluations along the line) &nbsp;·&nbsp; <b>Naive: ignores where the first order approximation is good or bad</b> &nbsp;|&nbsp; Can we automatically ensure the updated policy π′ has value greater than or equal to the prior policy π: <b>V^{π′} ≥ V^π</b>?"},
{"r": [33, 34], "t": "关键改写：用旧策略的优势表达新策略的值", "star": 3, "one": "<b>这一页是后面所有推导的起点。</b>", "eq": "V(θ) = E_{π_θ}[ Σ_t γᵗ R(s_t,a_t) ]\n\nV(θ̃) = V(θ) + E_{π_θ̃}[ Σ_t γᵗ A^π(s_t,a_t) ]\n      = V(θ) + Σ_s ρ^{π̃}(s) Σ_a π̃(a|s)·A^π(s,a)", "pts": ["<b>读法：新策略的值 = 旧策略的值 + 「按新策略走时，每一步相对旧策略赚了多少」。</b>", "第二行把「对时间求和」改写成「<span class='k'>对状态求和</span>」，<code>ρ^{π̃}</code> 是<b>新</b>策略下的折扣访问频率。", "<span class='w'>麻烦正在这里</span>：<code>ρ^{π̃}</code> 要新策略才能算，而我们手上只有旧策略采的数据——<b>这本质上是个 off-policy 问题</b>。", "<b>这个恒等式是后面所有推导的起点，而它的读法非常直观：<span class='k'>新策略的值 = 旧策略的值 + 「按新策略走时，每一步相对旧策略赚了多少」</span>。</b><b>第二项里的 <code>A^π</code> 衡量的正是「这个动作比旧策略的平均水平好多少」。</b><span class='w'>如果新策略在它会去的每个地方都选了旧策略眼中的好动作，那它就更好</span>——<b>这句话听起来是废话，而恒等式把它变成了一个精确的等式。</b>", "<b>现在说 <code>kp</code> 点名的那个坑，它是这一页最容易出错的地方：<span class='w'>期望的下标是<b>新</b>策略 <code>π̃</code>，而优势是<b>旧</b>策略的 <code>A^π</code></span>。</b><b>两者不是同一个策略。</b><span class='k'>搞反了——比如写成 <code>E_π[Σ γ^t A^{π̃}]</code>——整条推导就垮了</span>，<b>因为那个式子不成立，而且它甚至不需要任何近似就能算（<code>E_π[A^π] = 0</code>）。</b><span class='w'>记法：<b>优势跟着「我已知的那个」，分布跟着「我想评估的那个」</b></span>——<b>这正好是最别扭的组合，所以才麻烦。</b>", "<b>为什么必须是这个组合，值得用一句话解释，这样你就不会记错。</b><span class='k'>因为 <code>A^π</code> 衡量的是「相对旧策略的基准赚了多少」</span>——<b>基准必须是旧的，否则「赚了多少」就没有参照。</b><span class='k'>而你要算的是「新策略实际会拿到多少」，所以轨迹必须按新策略走</span>——<b>分布必须是新的，否则你算的是旧策略的表现。</b><span class='w'>两个要求各管一边，所以必然是这个交叉组合。</span>", "<b>第二行把「对时间求和」改写成「对状态求和」，这一步引入了一个要特别小心的量。</b><code>ρ^{π̃}(s) = Σ_t γ^t P(s_t = s | π̃)</code>——<span class='k'>课件管它叫「折扣加权访问频率」</span>。<b>它<span class='w'>不是</span>一个概率分布</b>：<span class='w'>它在所有状态上的和是 <code>Σ_t γ^t = 1/(1−γ)</code>，不是 1</span>。<b>所以它也<span class='w'>不是</span> L05 那个平稳分布。</b><span class='k'>这个 <code>1/(1−γ)</code> 会在 p37 的下界里以平方的形式出现，现在知道它从哪来，到那时就不会突兀。</span>", "<b>最后那句话是整页的落点，而它把问题的性质说死了：<span class='w'>我们算不了这个式子，因为不知道 <code>ρ^{π̃}</code></span>。</b><span class='k'>它要新策略的状态访问频率，而你只有旧策略采的数据</span>。<b>课件自己在 p33 就标了：<em>off policy learning!</em></b><span class='w'>于是绕了一大圈，问题回到了这门课的老主题上</span>——<b>「我只能从一个分布采样，却想知道另一个分布下的期望」。</b><span class='k'>L03 用重要性采样答它，L05 说那样可能发散，L07 说那正是 <code>εT²</code> 的根子；这一讲给的答案是：硬换过来，然后量化错多少。</span>"], "say": "老师特意强调这个式子<b>不依赖任何参数化</b>，对任意两个策略都成立。记号上 <code>π̃</code> 就是由 <code>θ̃</code> 参数化的新策略。", "quote": "V(θ) = E_π[ Σ_t γ^t R(s_t,a_t) ] &nbsp;·&nbsp; Have access to samples from the current policy π &nbsp;·&nbsp; <b>Want to predict the value of a different policy (off policy learning!)</b> &nbsp;|&nbsp; <b>V(θ̃) = V(θ) + E_{π̃}[ Σ_t γ^t A^π(s_t,a_t) ] = V(θ) + Σ_s ρ^{π̃}(s) Σ_a π̃(a|s) A^π(s,a)</b> &nbsp;·&nbsp; where ρ^{π̃}(s) is the discounted weighted frequency of state s under policy π̃ &nbsp;·&nbsp; <b>But we can't compute the above because we don't know ρ^{π̃}, the state distribution under the new proposed policy</b>", "tbl": {"head": ["式子里的量", "属于哪个策略", "你有吗", "怎么办"], "rows": [["<code>V(θ)</code>", "<b>旧</b>", "<span class='k'>有</span>", "—"], ["<code>A^π(s,a)</code>", "<b>旧</b>", "<span class='k'>有（能从旧数据估）</span>", "—"], ["<code>π̃(a|s)</code>", "<b>新</b>", "<span class='k'>有（是你自己要定的参数）</span>", "—"], ["<code>ρ^{π̃}(s)</code>", "<b>新</b>", "<span class='w'>没有——要跑新策略才知道</span>", "<b>p36：硬换成 <code>ρ^π</code>，然后量化误差</b>"], ["<b>注意</b>", "—", "—", "<span class='w'><code>ρ</code> 的和是 <code>1/(1−γ)</code>，不是 1，它不是概率分布</span>"]]}, "res": {"tag": "推断", "v": "<b>这一页就是你的课题，一字不差：「我手上只有旧配置跑出来的日志，想知道一套没跑过的新配置好多少」。</b><br><br><span class='k'>恒等式告诉你答案的精确形式：差值 = 在<b>新</b>配置会走到的地方，按<b>旧</b>配置的优势加权求和</span>。<b>而卡住的恰恰是那个「新配置会走到的地方」——<code>ρ^{π̃}</code>。</b><span class='w'>这不是估计精度的问题，是信息根本不在你的日志里。</span><br><br><b>把它翻译成你的语言：换一档保真度之后，中间产物变了，于是后续节点面对的输入分布变了</b>——<span class='k'>这正是 L07 p30 那个「节点 h 改变 h+1 输入分布」的机制，第三次出现</span>。<b>L07 从「误差累积」的角度说它，L05 从「off-policy 发散」的角度说它，这一页从「我算不出这个期望」的角度说它。</b><span class='w'>三个角度，同一个障碍。</span><br><br><b>而这一讲给的答案，对你是最务实的一个：<span class='k'>硬把 <code>ρ^{π̃}</code> 换成 <code>ρ^π</code>，然后量化这一换错了多少</span></b>（p36–p38）。<b>量化的结果是一个下界，而下界里的惩罚项正比于「新旧策略差多远」。</b><span class='w'>于是你得到一条非常可操作的结论：<b>新配置和日志里的配置越接近，你对它的估计越可信</b></span>——<b>而且「越接近」是可以用 KL 或者总变差距离量出来的，不是感觉。</b><br><br><b>这给你一条现在就能做的事：给每个候选配置算一个「和日志分布的距离」，并把它和 FQE 的估计一起报告。</b><span class='k'>距离远的候选，它的估值应该被打折扣，或者干脆标为「需要实跑验证」</span>。<b>这比单独报一个 FQE 数值诚实得多，而且几乎不花额外预算。</b><span class='w'>（第十讲会给出这个距离的具体形式和那个下界的系数。）</span>", "ref": "课件 p33–p34 原文（off policy learning!；we don't know ρ^{π̃}）· L05 p38 · L07 p30 科研格 · 简报 §4c §4d"}},
{"r": [35, 35], "t": "目录：局部近似", "quote": "Table of Contents &nbsp;·&nbsp; <b>5 Updating the Parameters Given the Gradient: Local Approximation</b> &nbsp;·&nbsp; 6 ... Trust Regions &nbsp;·&nbsp; 7 ... TRPO Algorithm", "one": "第五节：<b>上一页算不了，那就硬换一个能算的</b>。", "pts": ["<b>接下来这一段（p36–p42）是整门课推导最密的一处，但它的逻辑其实只有四步，先把这四步记住，读的时候就不会迷路。</b><br><b>① 硬换</b>：<span class='k'>把算不出的 <code>ρ^{π̃}</code> 换成能算的 <code>ρ^π</code>，得到一个代理目标 <code>L</code></span>（p36）。<br><b>② 问错多少</b>：<span class='k'>证明真实值不会比代理目标低太多——这就是下界</span>（p37–p38）。<br><b>③ 说明够用</b>：<span class='k'>只要下界在涨，真实值就在涨</span>（p39–p40）。<br><b>④ 变得能用</b>：<span class='w'>理论给的惩罚太保守，改成硬约束</span>（p41–p42）。", "<b>这四步有一个共同的形状，认出它会让你在别处也省力：<span class='k'>目标算不出来 → 换一个算得出的代理 → 量化代理和真实的差距 → 证明优化代理就够</span>。</b><b>这叫 MM 算法（minorize-maximize）：不断优化一个贴着目标的下界。</b><span class='w'>EM 算法、变分推断、很多凸优化的方法都是这个骨架</span>——<b>区别只在「怎么构造那个下界」。</b>", "<b>还要先说清一件事，免得你对这一段期望过高：<span class='w'>这一讲只讲到 p36</span>。</b><span class='k'>p37 起的下界、信赖域和 TRPO，在第十讲有逐页的展开</span>。<b>所以这一片之后的内容是「先给形状，细节在下一讲」。</b><span class='w'>而 p54 课件自己也说了：不必会推导或背出 TRPO 里近似目标和约束的具体公式</span>——<b>要掌握的是模板和各个槽位的性质。</b>"]},
{"r": [36, 36], "t": "局部近似：把 ρ 换成旧策略的", "star": 3, "one": "<b>硬把新策略的访问频率换成旧策略的</b>，得到一个能算的代理目标。", "eq": "L_π(π̃) = V(θ) + Σ_s ρ^{π}(s) Σ_a π̃(a|s)·A^π(s,a)\n                    ↑ 换成了旧策略的 ρ\n\n两条性质：\n  L_{π_{θ₀}}(π_{θ₀}) = V(θ₀)                      ← 在 θ₀ 处取值相同\n  ∇_θ L_{π_{θ₀}}(π_θ)|_{θ=θ₀} = ∇_θ V(θ)|_{θ=θ₀}  ← 在 θ₀ 处梯度也相同", "pts": ["<span class='k'>值和一阶导都对得上</span>，所以在 θ₀ 附近它是个好代理。", "<span class='w'>但只在附近</span>——走远了 ρ 就不对了。<b>这正是「该走多远」这个问题的数学形态。</b>", "<b>这一步的动作粗暴到可以用一个字形容：换。</b><span class='k'>上一页算不出 <code>ρ^{π̃}</code>，这一页就直接把它写成 <code>ρ^π</code></span>——<b>反正旧策略的访问频率你是有的。</b><span class='w'>这显然不等于原式</span>，<b>所以得到的 <code>L</code> 只是一个<span class='k'>代理目标</span>，不是真实的值。</b><span class='w'>接下来两页的全部工作，就是证明这个代理没有偏得太离谱。</span>", "<b>但这个换法不是乱换，课件给了两条性质作为它的资格证明，而这两条性质的分量不一样。</b><span class='k'>① <code>L_{π_{θ₀}}(π_{θ₀}) = V(θ₀)</code>：在当前点上，代理和真实<b>取值相同</b></span>。<b>这很容易看出来——此时 <code>π̃ = π</code>，而 <code>E_{a∼π}[A^π(s,a)] = 0</code>，第二项整个为零。</b><span class='k'>② 在当前点上，代理和真实的<b>一阶导也相同</b></span>。<b>这一条才是真正值钱的。</b>", "<b>为什么第二条值钱：它意味着「沿着 <code>L</code> 的梯度走」和「沿着真实值的梯度走」在起点处是同一个方向。</b><span class='k'>于是你用代理目标算出来的梯度，就是真梯度</span>——<b>一点都不差。</b><span class='w'>代理和真实的分歧只出现在二阶及以上，也就是「走远之后」</span>。<b>这正好把问题的形状说死了：方向是对的，问题只在距离。</b><span class='k'>而「该走多远」正是这一讲后半的题目。</span>", "<b>把这件事和 p29 那句「梯度只是一阶近似」接起来，你会发现它们是同一句话的两种说法。</b><span class='w'>p29 说：梯度近处准、远处不准</span>；<span class='k'>p36 说：代理目标在当前点值和导数都对，走远了 <code>ρ</code> 就不对了</span>。<b>两者描述的是同一个几何事实。</b><span class='w'>区别在于 p36 把「远处不准」变成了一个可以<b>量化</b>的东西</span>——<b>因为现在你知道不准的来源具体是哪一项（<code>ρ</code> 换错了），于是可以去界定它的误差。</b>", "<b>老师在这一页收尾时说的那句话，正好是下一步的预告：</b><span class='k'>「下一步是用它推出新值函数的一个下界，如果我们在下界上取得改进，就能保证真实值函数单调上升。」</span><b>注意这句话的结构：它把「单调改进」这个愿望（p9）和「代理目标」这个工具（本页）接上了。</b><span class='w'>中间缺的那一环就是下界，而它在 p37–p40。</span>"], "say": "老师在这一页收尾，并明说：<b>下一步是用它推出新值函数的一个下界</b>，「如果我们在下界上取得改进，就能保证真实值函数单调上升」。<span class='w'>这部分留到了下一讲。</span>", "quote": "<b>Can we remove the dependency on the discounted visitation frequencies under the new policy?</b> &nbsp;·&nbsp; Substitute in the discounted visitation frequencies under the current policy to define a new objective function &nbsp;·&nbsp; <b>L_π(π̃) = V(θ) + Σ_s ρ^π(s) Σ_a π̃(a|s) A^π(s,a)</b> &nbsp;·&nbsp; Note that <b>L_{π_{θ_0}}(π_{θ_0}) = V(θ_0)</b> &nbsp;·&nbsp; Gradient of L is identical to gradient of value function: <b>∇_θ L_{π_{θ_0}}(π_θ)|_{θ=θ_0} = ∇_θ V(θ)|_{θ=θ_0}</b>", "tbl": {"head": ["", "真实目标 <code>V(θ̃)</code>", "代理目标 <code>L_π(π̃)</code>"], "rows": [["用谁的访问频率", "<span class='w'><code>ρ^{π̃}</code>（新，算不出）</span>", "<span class='k'><code>ρ^π</code>（旧，有）</span>"], ["在 θ₀ 处的取值", "<code>V(θ₀)</code>", "<span class='k'>相同</span>"], ["在 θ₀ 处的梯度", "<code>∇V(θ₀)</code>", "<span class='k'>相同</span>"], ["走远之后", "—", "<span class='w'>开始偏，偏多少见 p37–p38</span>"]]}},
{"r": [37, 37], "t": "保守策略迭代：第一个下界", "star": 3, "one": "先只看「新旧策略的混合」这种特殊情形。", "eq": "π_new(a|s) = (1−α)·π_old(a|s) + α·π′(a|s)\n\nV^{π_new}  ≥  L_{π_old}(π_new) − [ 2εγ/(1−γ)² ]·α²\n\n其中 ε = max_s | E_{a~π′}[ A^π(s,a) ] |", "pts": ["<b>α 是「改多少」的度量</b>，罚项按 <code>α²</code> 增长——走得越远，保证越弱。", "课件自带一问：<span class='k'>π_new = π_old 时这个界紧吗？</span>紧——那时 α=0，罚项为 0，两边都等于 V^{π_old}。", "局限：<span class='w'>只对「混合策略」成立</span>，不够一般。", "<b>先看这个下界的形状，它的每一部分都有明确的含义。</b><span class='k'>左边是真实的新值；右边第一项是你能算的代理目标；右边第二项是惩罚</span>。<b>翻译成话：「真实的值，至少等于你算出来的代理值，减去一个罚款」。</b><span class='w'>于是只要你把代理目标提得足够高、把罚款控制得足够小，真实值就一定变好</span>——<b>这就是把愿望变成定理的那一步。</b>", "<b>惩罚项 <code>[2εγ/(1−γ)²]·α²</code> 里，α 的平方是最该注意的地方。</b><span class='k'>α 是「改了多少」——它是新策略里「新东西」的混合比例</span>。<b>罚款按 <code>α²</code> 增长，而收益（代理目标的提升）大致按 <code>α</code> 增长。</b><span class='w'>一次项对二次项：小 α 时收益占优，大 α 时罚款占优</span>——<b>所以一定存在一个最优的步长，而且它可以被算出来。</b><span class='k'>这就是「自动选步长」这件事的数学根据。</span>", "<b>课件自带的那一问值得当场答一遍：<span class='k'>π_new = π_old 时这个界紧吗？</span></b><b>紧。</b><span class='w'>此时 α = 0，罚项为零；而 <code>L_{π_old}(π_old) = V^{π_old}</code>（p36 的第一条性质）</span>——<b>于是不等式两边都等于 <code>V^{π_old}</code>，取等号。</b><span class='k'>一个在「不动」这个点上紧的界，说明它至少没有白白浪费精度</span>。<b>而离开这个点之后它会松，松的速度就是 <code>α²</code>。</b>", "<b>那个 <code>1/(1−γ)²</code> 的系数是整个下界里最刺眼的部分，必须理解它从哪来。</b><span class='k'>p33 已经铺垫过：<code>ρ</code> 在所有状态上的和是 <code>1/(1−γ)</code>，不是 1</span>。<b>而误差要在「换掉 ρ」这件事上累积两次</b>——<span class='w'>一次来自分布本身的差距，一次来自那个差距在整条轨迹上的传播</span>——<b>于是出现了平方。</b><span class='k'>直观地说：有效视野越长，一个小的分布偏差被放大的次数越多。</span>", "<b>最后说这个界的局限，课件也明说了：<span class='w'>它只对「混合策略」成立</span>。</b><span class='k'>也就是形如 <code>(1−α)π_old + απ′</code> 的那种</span>——<b>你必须以 α 的概率整个换成另一个策略，以 1−α 的概率照旧。</b><span class='w'>而实践中你做的是「把参数挪一点」，新策略不是旧策略和别的什么的混合</span>。<b>所以这个界虽然漂亮，却还不能直接用。</b><span class='k'>p38 会把它推广到一般的随机策略，代价是常数从 2 变成 4。</span>"], "tip": {"t": "完整推导在第十讲", "v": "这堂课只讲到 p36。p37 起的下界、信赖域和 TRPO，在<b>第十讲</b>（lecture10_1.pdf）有逐页的展开，这里只做指路。"}, "quote": "Is there a bound on the performance of a new policy obtained by optimizing the surrogate objective? &nbsp;·&nbsp; Consider <b>mixture policies</b>: π_new(a|s) = (1−α) π_old(a|s) + α π′(a|s) &nbsp;·&nbsp; <b>V^{π_new} ≥ L_{π_old}(π_new) − [2εγ/(1−γ)²] α²</b> &nbsp;·&nbsp; where ε = max_s |E_{a∼π′}[A^π(s,a)]| &nbsp;·&nbsp; <b>Check your understanding: is this bound tight if π_new = π_old?</b>"},
{"r": [38, 38], "t": "推广到一般随机策略", "star": 3, "one": "把「混合比例 α」换成<b>两个策略之间的距离</b>。", "eq": "定理：令 D_TV^max(π₁,π₂) = max_s D_TV( π₁(·|s), π₂(·|s) )，则\n\n  V^{π_new} ≥ L_{π_old}(π_new) − [ 4εγ/(1−γ)² ]·( D_TV^max(π_old,π_new) )²\n  其中 ε = max_{s,a} | A^π(s,a) |\n\n又因为对任意概率分布 D_TV(p,q)² ≤ D_KL(p,q)，立刻得到\n\n  V^{π_new} ≥ L_{π_old}(π_new) − [ 4εγ/(1−γ)² ]·D_KL^max(π_old,π_new)", "pts": ["<span class='k'>这一步把「改了多少」正式化成了 KL 散度</span>——后面 TRPO 的约束就是它。", "<code>1/(1−γ)²</code> 又出现了：<b>有效 horizon 越长，走偏的代价越大。</b>", "<b>这一页做的事只有一件，但它是决定性的：<span class='k'>把「改了多少」从「混合比例 α」换成「两个策略之间的距离」</span>。</b><b>于是这个界对任何两个策略都成立，不再要求新策略必须是混合形式。</b><span class='w'>代价是常数从 2 变成了 4</span>——<b>一个很小的代价，换来了完全的一般性。</b>", "<b>总变差距离 <code>D_TV</code> 值得解释一下，它的定义很直观。</b><span class='k'><code>D_TV(p,q) = ½ Σ_x |p(x) − q(x)|</code>——两个分布在每个点上差多少，加起来再除以二</span>。<b>它的取值在 0 到 1 之间：0 表示完全相同，1 表示完全不重叠。</b><span class='w'>而 <code>D_TV^max</code> 取的是「最差的那个状态」</span>——<b>所以它是一个很保守的度量：只要有一个状态上两个策略差别大，整个界就松。</b>", "<b>然后那一步 <code>D_TV(p,q)² ≤ D_KL(p,q)</code> 是整个推导里最实用的一步，虽然它只是一个已知的不等式（Pinsker 不等式）。</b><span class='k'>它让界里的距离从总变差换成了 KL 散度</span>。<b>为什么这件事重要？因为 KL 散度对常见的参数化策略有<span class='w'>闭式表达</span></b>——<span class='k'>两个高斯之间的 KL、两个 softmax 之间的 KL，都能直接写出来并对参数求导</span>。<b>而总变差距离做不到。</b><span class='w'>于是这一步把一个「理论上的界」变成了一个「可以塞进优化器的约束」。</b>", "<b>再看那个 <code>1/(1−γ)²</code>，它在这一页又出现了，而且分量更重，值得算一下它有多大。</b><span class='w'>γ = 0.9 时，<code>1/(1−γ)² = 100</code>；γ = 0.99 时是 <b>10000</b>；γ = 0.999 时是一百万</span>。<b>而 ε 是优势函数的最大绝对值，通常也不小。</b><span class='k'>于是这个惩罚系数在长 horizon 的问题上会大到荒谬</span>——<b>按它选步长，你几乎动不了。</b><span class='w'>p41 会正面承认这件事并给出对策。</span>", "<b>最后指出这个定理的一个结构性含义，它比具体的常数更值得记：<span class='k'>保证的强度，由「你改了多少」单独决定</span>。</b><b>不是由「你改得对不对」，而是由「你改得多不多」。</b><span class='w'>一个改得很小但方向完全错误的更新，仍然有很强的保证（因为它几乎没改）</span>；<b>一个改得很大但方向正确的更新，保证反而弱。</b><span class='k'>这正是信赖域思想的全部内容——它管的是距离，不管方向。</span>"], "quote": "Would like to similarly obtain a lower bound for <b>general stochastic policies</b> (not just mixture policies) &nbsp;|&nbsp; <b>Theorem</b>: Let D_TV^max(π_1,π_2) = max_s D_TV(π_1(·|s), π_2(·|s)). Then <b>V^{π_new} ≥ L_{π_old}(π_new) − [4εγ/(1−γ)²] (D_TV^max(π_old, π_new))²</b> &nbsp;·&nbsp; where ε = max_{s,a} |A^π(s,a)| &nbsp;|&nbsp; Note that D_TV(p,q)² ≤ D_KL(p,q). Then <b>V^{π_new} ≥ L_{π_old}(π_new) − [4εγ/(1−γ)²] D_KL^max(π_old, π_new)</b>", "tbl": {"head": ["γ", "<code>1/(1−γ)²</code>", "有效视野 <code>1/(1−γ)</code>", "这个系数能用吗"], "rows": [["0.9", "100", "10 步", "勉强"], ["0.95", "400", "20 步", "<span class='w'>偏大</span>"], ["0.99", "<b>10000</b>", "100 步", "<span class='w'>步长会小到没法用</span>"], ["0.999", "一百万", "1000 步", "<span class='w'>完全不可用</span>"], ["<b>有限 horizon，γ=1</b>", "<b>换成 <code>H²</code></b>", "<b>H</b>", "<span class='k'>H=5–10 时只有 25–100</span>"]]}, "res": {"tag": "推断", "v": "<b>这个 <code>1/(1−γ)²</code> 系数，是你短流水线这个结构优势到目前为止最鲜明的一次体现，值得算一笔账。</b><br><br><span class='w'>这个系数来自「折扣访问频率的总质量是 <code>1/(1−γ)</code>」，而误差在换 <code>ρ</code> 时累积两次</span>。<span class='k'>有限 horizon 下根本没有无穷和，对应的量就是 H 本身</span>——<b>于是这个系数该换成 <code>H²</code>。</b><br><br><b>代入你的数字：H = 5 到 10，所以 <code>H² = 25 到 100</code>。</b><span class='w'>而机器人那边常用 γ = 0.99，对应 <code>1/(1−γ)² = 10000</code></span>——<b>相差一百到四百倍。</b><span class='k'>这意味着同样的 KL 预算，你能安全走出的步子比他们大两个数量级；或者反过来说，同样的步子，你的保证强两个数量级。</b><br><br><b>但要把这条论证的边界标清楚，否则会被问穿：</b><br><b>① 这个替换是推断，不是课件给的结论。</b><span class='w'>课件全程用折扣形式，没给有限 horizon 的版本</span>。<b>要写进 paper，该引 Kakade &amp; Langford 2002 或 Schulman 2015 的原文，确认有限 horizon 下的确切常数。</b><br><b>② <code>ε = max_{s,a} |A^π(s,a)|</code> 这一项没有因为 H 小而变小。</b><span class='k'>它是优势函数的最大绝对值，取决于「最好的配置和最差的配置差多少」</span>——<b>如果你的 Acc 范围是 0 到 1，那 ε 的量级就是 1 附近。</b><span class='w'>所以别指望这个界变得很紧，只是别人的更松而已。</span><br><br><b>这条优势和前面几讲是同一个来源，可以在 paper 里合并成一句话：</b><span class='k'>L05 的 <code>1/(1−γ)</code> 误差放大、L07 的 <code>εT²</code>、L02 的 γ=1 合法性、以及这里的 <code>1/(1−γ)²</code></span>——<b>四处都在说「短流水线天然占便宜」。</b><span class='w'>这是一条值得单独写一段的结构性论证，而不是散在各处的四个巧合。</span>", "ref": "课件 p37–p38 定理 · L02 p13 · L05 p34 · L07 p30 科研格 · Kakade &amp; Langford 2002 · Schulman et al. 2015"}},
{"r": [39, 40], "t": "为什么优化下界就够了", "star": 3, "one": "<b>只要下界在涨，真实值就在涨。</b>", "eq": "记 M_i(π) = L_{π_i}(π) − [4εγ/(1−γ)²]·D_KL^max(π_i, π)\n\n  V^{π_{i+1}} ≥ M_i(π_{i+1})       ← 上一页的定理\n  V^{π_i}     = M_i(π_i)           ← 自己对自己，KL=0、L=V\n\n两式相减：V^{π_{i+1}} − V^{π_i} ≥ M_i(π_{i+1}) − M_i(π_i)", "pts": ["<span class='k'>只要新策略让 M 变大，真实值的改进就至少有那么多</span>。", "<b>这就是「单调改进」从愿望变成定理的那一步。</b>", "这类做法叫 <b>MM 算法</b>（minorize-maximize）：不断优化一个贴着目标的下界。", "<b>这三行是整段推导的落点，而且它们合起来只说了一件事：<span class='k'>只要下界在涨，真实值就在涨</span>。</b><b>第一行是上一页的定理（真实值不低于下界）；第二行是自己对自己的情形（KL = 0，<code>L = V</code>，所以取等号）；两式相减就是第三行。</b><span class='w'>而第三行的意思是：真实值的改进，<b>至少</b>有下界的改进那么多。</span>", "<b>第二行 <code>V^{π_i} = M_i(π_i)</code> 为什么取等号，值得自己确认一遍，因为它是关键。</b><span class='k'>把 <code>π = π_i</code> 代进 <code>M_i</code> 的定义</span>：<b><code>D_KL(π_i, π_i) = 0</code>，所以惩罚项消失；而 <code>L_{π_i}(π_i) = V^{π_i}</code>（p36 的第一条性质）。</b><span class='w'>于是 <code>M_i(π_i) = V^{π_i}</code>，严格相等</span>。<b>正是这个「在当前点上紧」的性质，让相减那一步有意义。</b>", "<b>把这个论证的结构抽出来，它就是 MM 算法（minorize-maximize）的标准形式，值得记住。</b><span class='k'>构造一个函数 <code>M</code>，使得 ① <code>M ≤ V</code> 处处成立；② 在当前点上 <code>M = V</code></span>。<b>然后最大化 <code>M</code>。</b><span class='w'>这两条合起来保证了：<code>M</code> 的任何改进都是 <code>V</code> 的真实改进</span>。<b>EM 算法是同一个骨架（E 步构造下界，M 步最大化它），变分推断也是。</b><span class='k'>认出这个骨架，你读到任何「优化一个代理目标」的方法时都可以先问：它的那两条性质成立吗？</span>", "<b>这一页还顺带解决了 p9 那个愿望，而且解决得相当漂亮。</b><span class='w'>p9 说「希望每次更新都单调改进」，那时它还只是个愿望</span>；<span class='k'>这里它变成了一个定理：只要 <code>M_i(π_{i+1}) ≥ M_i(π_i)</code>，就保证 <code>V^{π_{i+1}} ≥ V^{π_i}</code></span>。<b>而「让 M 变大」这件事是你完全可控的——最差也可以取 <code>π_{i+1} = π_i</code>，那时 M 不变，于是至少不会变差。</b><span class='w'>所以这是一个<b>无条件</b>的单调改进保证。</span>", "<b>但要提醒一句这个保证的实际分量，免得高估它：它保证的是「不变差」，不是「变好很多」。</b><span class='k'>而且它建立在那个带 <code>1/(1−γ)²</code> 的惩罚上</span>——<b>惩罚太重时，<code>M</code> 的最大值几乎就在 <code>π_i</code> 本身，于是你寸步难行。</b><span class='w'>「保证不变差」和「一步都走不动」是同一件事的两面</span>。<b>p41 要处理的正是这个。</b>"], "quote": "M_i(π) = L_{π_i}(π) − [4εγ/(1−γ)²] D_KL^max(π_i, π) &nbsp;·&nbsp; <b>V^{π_{i+1}} ≥ M_i(π_{i+1})</b> &nbsp;·&nbsp; <b>V^{π_i} = M_i(π_i)</b> &nbsp;·&nbsp; <b>V^{π_{i+1}} − V^{π_i} ≥ M_i(π_{i+1}) − M_i(π_i)</b> &nbsp;·&nbsp; So as long as the new policy π_{i+1} is equal or an improvement"},
{"r": [41, 42], "t": "从惩罚项改成硬约束：信赖域", "star": 3, "one": "理论给的惩罚系数<b>太保守，步子会小到没法用</b>——于是改成约束。", "eq": "理论形式（带惩罚）：\n  max_θ  L_{θ_old}(θ) − C·D_KL^max(θ_old, θ)，   C = 4εγ/(1−γ)²\n\n实用形式（带约束）：\n  max_θ  L_{θ_old}(θ)\n  s.t.   E_{s~ρ_{θ_old}}[ D_KL( π_{θ_old}(·|s), π_θ(·|s) ) ] ≤ δ", "pts": ["<span class='w'>课件自己说：按理论取 C，步长会非常小。</span>", "<b>信赖域</b>的含义就是：<span class='k'>在一阶近似还靠谱的那个范围内走</span>，范围用 KL 散度界定。", "顺带把 <code>max_s</code> 放松成了<b>对状态分布取期望</b>——更好估。", "<b>课件在这里做了一件很坦率的事：<span class='k'>承认理论给的那个系数没法用</span>。</b><b>原文是 <em>if we used the penalty coefficient recommended by the theory above, the step sizes would be very small</em>。</b><span class='w'>这是理论和实践之间一个非常典型的缝隙</span>——<b>界本身是对的，但它为了「对所有情况都成立」而取了最坏情况，于是在典型情况下过于保守。</b><span class='k'>这种缝隙在带保证的方法里几乎总会出现，值得养成警觉。</span>", "<b>对策是把「惩罚」改成「约束」，而这两者的差别值得想清楚。</b><span class='k'>惩罚形式：<code>max L − C·D_KL</code>，你让优化器自己权衡</span>——<b>C 定了，步子多大就定了。</b><span class='k'>约束形式：<code>max L</code> 使得 <code>D_KL ≤ δ</code></span>——<b>你直接规定步子不许超过多大，然后在这个范围内尽量优化。</b><span class='w'>后者把「步长」变成了一个你可以直接调的旋钮 δ，而不是通过 C 间接控制</span>。<b>而 δ 有一个很好的性质：它的含义不依赖于 ε 和 γ，调起来直观得多。</b>", "<b>第二处放松也很关键：<span class='k'>把 <code>max_s</code> 换成了对状态分布取期望</span>。</b><b>课件给的理由是：<em>the max requires the KL is bounded at all states and yields an impractical number of constraints</em>。</b><span class='w'>要求「在每一个状态上 KL 都小」，意味着状态有多少个就有多少条约束</span>——<b>在大状态空间下根本写不下，更别说求解。</b><span class='k'>换成期望之后只剩一条约束，而且可以用样本估计</span>。<b>代价是保证变弱了：平均 KL 小，不排除个别状态上 KL 很大。</b>", "<b>把这一页的两处放松列清楚，你就知道 TRPO 的「保证」到底还剩多少。</b><b>① 用 δ 代替理论的 C</b>：<span class='w'>失去了「单调改进」的严格保证</span>——δ 是你拍的，不是定理给的。<br><b>② 用平均 KL 代替最大 KL</b>：<span class='w'>失去了「每个状态都受控」的保证</span>。<br><span class='k'>所以 TRPO 的实际地位是：一个受理论启发的启发式方法</span>，<b>而不是一个带证明的算法。</b><span class='w'>课件 p50 说它 <em>empirically consistently does well</em>——注意是「经验上」。</span>"], "quote": "max_θ L_{θ_old}(θ) − C D_KL^max(θ_old, θ), where <b>C = 4εγ/(1−γ)²</b> is the penalty coefficient &nbsp;·&nbsp; <b>In practice, if we used the penalty coefficient recommended by the theory above, the step sizes would be very small</b> &nbsp;|&nbsp; <b>New idea: Use a trust region constraint on step sizes</b> &nbsp;·&nbsp; max_θ L_{θ_old}(θ) subject to <b>D_KL^{s∼ρ_{θ_old}}(θ_old, θ) ≤ δ</b> &nbsp;·&nbsp; This uses the <b>average KL instead of the max</b>", "tbl": {"head": ["", "理论形式（惩罚）", "实用形式（约束）"], "rows": [["式子", "<code>max L − C·D_KL^max</code>", "<code>max L</code> s.t. <code>E_s[D_KL] ≤ δ</code>"], ["步长由谁定", "<span class='w'>C = 4εγ/(1−γ)²，理论给的</span>", "<span class='k'>δ，你自己调</span>"], ["KL 怎么算", "<span class='w'>max_s（约束数等于状态数）</span>", "<span class='k'>对状态分布取期望（一条约束）</span>"], ["还有单调改进保证吗", "<span class='k'>有（定理）</span>", "<span class='w'>没有，变成受理论启发的启发式</span>"], ["实际能用吗", "<span class='w'>步子小到动不了</span>", "<span class='k'>能，且经验上一贯不错</span>"]]}},
{"r": [43, 45], "t": "从理论到实践：三次替换", "star": 3, "one": "访问频率、优势函数、求和——<b>三样都换成能从样本估出来的东西</b>。", "eq": "① Σ_s ρ^π(s)[…]        →   (1/(1−γ))·E_{s~ρ_{θ_old}}[…]\n\n② Σ_a π_θ(a|s_n)·A_{θ_old}(s_n,a)\n                       →   E_{a~q}[ (π_θ(a|s_n)/q(a|s_n))·A_{θ_old}(s_n,a) ]\n                            ↑ 重要性采样，q 是采样分布\n\n③ A_{θ_old}            →   Q_{θ_old}\n\n最终： max_θ E_{s~ρ_old, a~q}[ (π_θ(a|s)/q(a|s))·Q_{θ_old}(s,a) ]\n       s.t.  E_{s~ρ_old}[ D_KL(π_{θ_old}(·|s), π_θ(·|s)) ] ≤ δ", "pts": ["<span class='k'>这三次替换不改变最优解</span>——课件专门强调了这一句。", "<b>②用的正是第三讲的重要性采样</b>：拿旧策略的样本去估新策略下的量。", "<b>③ 把 A 换成 Q 只差一个与动作无关的 V</b>，不影响 arg max。", "标准做法是取 <code>q = π_old</code>；另有 vine 采样法见原论文。", "<b>这三次替换的共同目的只有一个：<span class='k'>把式子里每一样「要知道全局信息才能算」的东西，换成「能从样本估出来」的东西</span>。</b><b>而课件专门加了一句 <em>do not change solution</em>——这三次替换不改变最优解。</b><span class='w'>所以它们是改写，不是近似</span>（<b>当然，用有限样本去估那些期望时会有估计误差，但那是另一回事</b>）。", "<b>第一次替换：把对状态的求和写成对 <code>ρ</code> 的期望，顺带提出常数 <code>1/(1−γ)</code>。</b><span class='k'>因为 <code>ρ</code> 不是概率分布（它的和是 <code>1/(1−γ)</code>），要变成期望就得先归一化</span>——<b>归一化出来的那个因子就被提到了外面。</b><span class='w'>而它是个常数，不影响 arg max，所以实践中常常直接忽略</span>。<b>这就是为什么你在代码里往往看不到它。</b>", "<b>第二次替换是三次里最重要的一次：<span class='k'>重要性采样</span>。</b><b>你要算的是「按<b>新</b>策略选动作时的平均优势」，但你的样本是按<b>旧</b>策略采的。</b><span class='k'>于是乘一个比值 <code>π_θ(a|s)/q(a|s)</code> 把权重纠过来</span>。<span class='w'>这正是第三讲的重要性采样，一模一样</span>——<b>而它的老毛病也一并继承了：两个分布差得远时，比值会爆炸，方差失控。</b><span class='k'>而信赖域约束恰好在限制这两个分布差多远——所以它同时在控制两件事：近似的有效性，和重要性权重的方差。</span>", "<b>第三次替换最简单但容易引起疑惑：把 <code>A</code> 换成 <code>Q</code>。</b><span class='k'>因为 <code>A(s,a) = Q(s,a) − V(s)</code>，两者只差一个与动作无关的 <code>V(s)</code></span>。<b>而那个 <code>V(s)</code> 在对动作求和（或求期望）时是个常数，它贡献的那一项不依赖 <code>θ</code>。</b><span class='w'>所以换掉它不影响 arg max</span>。<b>实践上这么换的理由是 <code>Q</code> 更容易直接估</b>——<span class='k'>你不必单独再学一个 <code>V</code>。</span>", "<b>课件最后交代的采样分布选择也值得记：<span class='k'>标准做法就是取 <code>q = π_old</code></span>。</b><b>也就是用你刚刚采数据用的那个策略。</b><span class='w'>这是最自然的选择，因为样
