<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第十一讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs234-2019-l11">

<div id="bar">
  <h1>CS234 第十一讲 · <span>探索与多臂老虎机：把判据从「能不能学到」换成「要多少数据」</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 65</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture11_postclass.pdf</code>。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L11-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "这一讲相对前十讲，换掉的是什么？", "o": ["折扣因子的取法", "算法框架", "判据——从「收不收敛、收敛到哪」换成「要花多少数据、路上犯了多少错」", "状态表示"], "a": 2, "why": "第一讲列的四样要求里，「统计上和计算上都高效」一直挂着没人管（L07 p17 摊开过这笔账），这一讲开始还它。"}, {"q": "课件引入的三层词汇是什么？", "o": ["设定 / 框架 / 方法——分别是「问题长什么样」「用什么尺子量」「用什么办法达标」", "模型 / 策略 / 值函数", "偏差 / 方差 / 噪声", "输入 / 输出 / 损失"], "a": 0, "why": "三层是正交的，而且课件强调：同一个方法可以在多个设定下满足多个框架——所以核心思想只有两三个。"}],
4: [{"q": "「计算效率 ≠ 样本效率」的区别是什么？", "o": ["一个指内存一个指时间", "计算效率是一步算多久，样本效率是要和环境交互多少次——后者在真实问题里往往贵得多", "计算效率针对训练，样本效率针对推理", "两者等价"], "a": 1, "why": "多买一块显卡是花钱；多试一次新药、多撞一次车、多骚扰一次客户，代价完全不同。"}, {"q": "课件列的四个判据里，哪一个管的是整个过程而不是终点？", "o": ["收敛到最优吗", "收不收敛", "路上犯了多少错", "多快到最优"], "a": 2, "why": "这就是遗憾。前三条分别不排除「极慢」「路上代价极大」「到达前一直在做最差选择」。"}],
10: [{"q": "老虎机和 MDP 的差别是什么？", "o": ["老虎机没有奖励", "老虎机没有状态——你的动作不改变下一次面对的处境，于是延迟后果这个维度消失了", "老虎机的动作连续", "老虎机的奖励是确定的"], "a": 1, "why": "L02 p5 早就说过：bandits 是单状态的 MDP。它把四个困难里的三个拿掉，只留探索。"}, {"q": "定义里有一处不对称，是什么？", "o": ["A（动作集）是已知的，R（奖励分布）是未知的", "两者都未知", "两者都已知", "A 未知，R 已知"], "a": 0, "why": "这个设定排除了「还有没有我没想到的选项」这类现实问题，而且臂数 m 是固定有限的。"}, {"q": "「最大化累计奖励」和「找到最好的那条臂」是同一个目标吗？", "o": ["是，只要时间足够长", "是", "不是——前者在乎过程（每次都算分），后者只在乎终点（中间试错多少不要紧）", "不是，但差别可以忽略"], "a": 2, "why": "两者对应两个框架：遗憾 vs 纯探索（best-arm identification）。它们要的算法不一样。"}],
11: [{"q": "遗憾的定义里，最该注意的是哪个词？", "o": ["最优", "期望", "机会", "累计——它是对整条轨迹求和，不是对当前状态的评价"], "a": 3, "why": "一个算法现在表现完美，但前面犯了一千次错，它的遗憾仍然很大。这正是它和「收敛到最优」的根本区别。"}, {"q": "既然最小化遗憾等价于最大化累计奖励，为什么还要引入遗憾？", "o": ["遗憾是无偏的", "遗憾更容易计算", "遗憾的量级更有意义——累计奖励总是随 t 线性增长，而遗憾的增长速度直接反映算法好坏", "遗憾不需要知道 V*"], "a": 2, "why": "线性增长 = 糟糕，对数增长 = 很好。而累计奖励看不出这个差别。"}],
12: [{"q": "<code>L_t = Σ_a E[N_t(a)]·Δ_a</code> 这个改写暴露了什么结构？", "o": ["遗憾 = 每条坏臂拉了几次 × 它有多坏；而第二个因子你改不了，第一个才是设计空间", "遗憾与时间无关", "遗憾只取决于最优臂", "遗憾随臂数线性增长"], "a": 0, "why": "于是整个老虎机问题可以重述为：在不知道差距的情况下，怎么让差距大的臂被拉的次数少。"}, {"q": "UCB1 的遗憾界里 <code>Δ_a</code> 出现在分母上，这说明什么？", "o": ["分母上的 Δ 只是记号习惯", "差距越大遗憾越大", "差距小的臂难区分，被拉的次数多，虽然每次损失小，但乘起来贡献更大的遗憾", "差距为零的臂贡献无穷遗憾"], "a": 2, "why": "界的形状是 8 log t · Σ_{a:Δ>0} (1/Δ_a)。这也解释了为什么「两条很接近的臂」是最难的情形。"}],
13: [{"q": "贪心算法的致命问题，课件用哪个词强调？", "o": ["sometimes", "forever——can lock onto a suboptimal action, forever", "slowly", "approximately"], "a": 1, "why": "不是「可能慢一点」，是「可能永远不改」。机制是自我锁死：不拉 ⇒ 没数据 ⇒ 估计不变 ⇒ 更不拉。"}, {"q": "如果贪心锁死在一条差距为 Δ 的坏臂上，遗憾是什么量级？", "o": ["<code>log t</code>", "<code>√t</code>", "<code>Δ·t</code>，线性", "常数"], "a": 2, "why": "线性遗憾意味着平均每步的损失不随时间下降——也就是你永远学不会。这是本讲判「不行」的标准。"}],
14: [{"q": "固定 ε 的 ε-贪心，遗憾是什么量级？", "o": ["<code>√t</code>", "也是线性——因为它永远以 ε 的概率乱拉，这个代价不随时间衰减", "<code>log t</code>", "常数"], "a": 1, "why": "课件原话 Always will be making a sub-optimal decision ε fraction of the time。kp 那句「有探索不等于够」说的就是这个。"}, {"q": "贪心和 ε-贪心失败的原因是什么关系？", "o": ["都因为学习率不对", "相反——贪心是探索不够，ε-贪心是探索过头", "相同", "互为因果"], "a": 1, "why": "两头都不对，说明光调 ε 的大小解决不了，需要让它随时间衰减（GLIE），而且探索还该看不确定性。"}, {"q": "即使按 GLIE 让 ε 衰减，ε-贪心相对 UCB 仍差在哪？", "o": ["它有偏", "收敛更慢", "它的探索是无差别的——试过一千次确定很差的臂和从没试过的臂，被选中概率一样", "它需要知道时间horizon"], "a": 2, "why": "第十二讲 p2 会用具体数字对比：UCB 给明显坏的臂恰好零概率，ε-贪心给它 0.0333。"}],
15: [{"q": "这三个参数（0.95 / 0.90 / 0.10）的设计用意是什么？", "o": ["模拟真实医疗数据", "让计算简单", "让最优臂唯一", "两条臂很接近、一条明显很差——同时演示「快速排除坏臂」和「接近的臂很难区分」"], "a": 3, "why": "差距是 0、0.05、0.85。而 UCB 界里 Δ 在分母上，说的正是第二件事的代价。"}, {"q": "这个例子里「拉一次臂」对应什么？", "o": ["查一次文献", "做一次模拟", "训练一个 epoch", "给一个病人用一种治法，然后等六周看 X 光结果"], "a": 3, "why": "所以这里的「一步」是六周和一个真实的人。遗憾在这里数的是「本可以治好却没治好的人数」。"}, {"q": "为什么这个例子建模成老虎机是合适的？", "o": ["因为只有三个选项", "病人之间独立（治这个不改变下一个的病情），而且每个病人只治一次——没有状态转移", "因为时间很长", "因为奖励是二值的"], "a": 1, "why": "但它丢掉了病人之间的差异。把那个加回去就是「上下文老虎机」——也正是「不同难度的输入该用不同配置」的标准形式。"}],
18: [{"q": "各拉一次之后 <code>Q̂(a1)=Q̂(a2)=1</code>、<code>Q̂(a3)=0</code>，贪心下一步选谁？", "o": ["一定选 a3（因为没试够）", "三条臂各 1/3", "a1 和 a2 打平，按「打平均匀分」各 1/2，a3 概率为 0", "一定选 a1"], "a": 2, "why": "不说清打平怎么处理，这道题就没有唯一答案。老师在课上专门点了这个约定。"}, {"q": "这个演示里的三个数字说明了什么？", "o": ["a3 确实最差", "算法已经学会了", "所有数字都是「运气」不是「实力」——单次样本的信息量就是这么少", "初始化方式有问题"], "a": 2, "why": "a1 拿 +1（真实 0.95）、a2 拿 +1（0.90）、a3 拿 0（0.10）都不奇怪，但它们让你以为 a1 和 a2 一样好。"}, {"q": "在这个三臂问题上，贪心一开始就把最优臂判死刑的概率大约是多少？", "o": ["0.95", "0.05（a1 第一次拿到 0 的概率）", "接近 0", "0.5"], "a": 1, "why": "不算小。而一旦判死刑，a1 再也不会被拉，Q̂(a1) 永远停在那个倒霉的值上。"}],
21: [{"q": "ε=0.1、三条臂时，明显很差的 <code>a3</code> 被选中的概率是多少？", "o": ["0", "0.1", "0.333", "0.0333"], "a": 3, "why": "ε/3 = 0.0333，而且这个数永远不降——你已经知道它很差，可它仍然每三十次被拉一次。"}, {"q": "ε=0.1 时贪心臂被选中的概率是多少？", "o": ["0.9", "0.9333（= 1 − ε + ε/3）", "0.8667", "1"], "a": 1, "why": "随机分支里也有 1/|A| 的概率抽中它。L04 p18 讲过这个常见的算错。"}, {"q": "线性遗憾和 <code>log t</code> 遗憾，在 t=10 万时差多少？", "o": ["几乎没差", "差一个数量级以上——线性约 3000，而 log(10⁵)≈11.5 乘常数也就几百", "差一倍左右", "无法比较"], "a": 1, "why": "而且 t 越大差得越多。这就是为什么「下界是 log t」和「UCB 达到 log t」合起来是一个重要结果。"}],
24: [{"q": "「与问题无关」和「与问题有关」的遗憾界，区别是什么？", "o": ["前者更紧", "前者是上界，后者是下界", "前者只用 T 和臂数，对所有实例成立；后者把差距 Δ_a 写进结论", "后者只对特定算法成立"], "a": 2, "why": "典型形状分别是 O(√(mT log T)) 和 O(Σ log T / Δ_a)。两者在不同 T 范围内各自更紧，实践中取最小值。"}],
25: [{"q": "下界和上界的角色有什么不同？", "o": ["下界只对确定性算法成立", "下界说「任何算法都好不过这个」，是关于问题的；上界说「某个算法能做到这么好」，是关于算法的", "两者等价", "下界更紧"], "a": 1, "why": "课件 p25 第一句就是这个意思：Use lower bound to determine how hard this problem is。"}, {"q": "Lai-Robbins 下界说了什么？", "o": ["遗憾至少是 √t", "遗憾至少是线性的", "常数遗憾做不到，<code>log t</code> 是能指望的最好结果", "任何算法都能做到常数遗憾"], "a": 2, "why": "课件接着说 Promising in that lower bound is sublinear——这个「坏消息」同时是「好消息」：学得会是可能的。"}, {"q": "什么样的老虎机最难？", "o": ["臂数最多的", "看起来像但均值不同的——课件原话 Hard problems have similar looking arms with different means", "奖励方差最大的", "差距最大的"], "a": 1, "why": "下界表达式里分母是 KL 散度，两条臂越像分母越小，这一项越大。断脚趾例子里 a1(0.95) 和 a2(0.90) 正是这种。"}],
26: [{"q": "「乐观面对不确定」为什么两难都赢？", "o": ["因为它方差小", "要么这条臂真的好（赚了），要么它不好（但你学到了，它的估计会下降）", "因为它不需要探索", "因为它总是选最好的臂"], "a": 1, "why": "探索与利用的冲突被消解了——同一个动作同时服务于两者。这不是折中，是找到了两边都满足的选法。"}, {"q": "「乐观」必须满足什么条件才不退化成乱猜？", "o": ["乐观的幅度必须和不确定性挂钩——拉得越少加得越多，拉得越多加得越少", "必须配合 ε-贪心", "乐观的幅度必须是常数", "必须知道真实均值"], "a": 0, "why": "如果是随便加的常数，那么「估计会下降」这一步就不成立，你可以永远乐观下去。"}],
27: [{"q": "<code>U_t(a) = Q̂_t(a) + 半径</code>，两半各代表什么？", "o": ["前者是利用（它看起来多好），后者是探索（你对它多没把握）", "两者都是探索", "两者都是利用", "前者是探索，后者是利用"], "a": 0, "why": "于是一条臂能被选中有两条路：估计确实高，或者你对它特别没把握。两条路加起来就是「两难都赢」。"}, {"q": "为什么每一步都要更新<b>所有</b>臂的上界，而不只是刚拉过的那条？", "o": ["为了防止溢出", "为了数值稳定", "半径里有一项依赖 t（总步数），而 t 每步都在涨", "这其实不必要"], "a": 2, "why": "于是没被拉的臂的上界反而在上升。不更新的话这个机制就没了，UCB 退化成贪心。"}],
28: [{"q": "老师板书上那个 μ 是什么？", "o": ["真均值", "半径（Hoeffding 原式里的 u）——和概率论里表示均值的 μ 撞了符号", "方差", "样本均值"], "a": 1, "why": "判断方法：它出现在「X̄_n + ?」这个位置上就是半径；出现在不等式左边 E[X] 的位置才是均值。"}, {"q": "半径是怎么得到的？", "o": ["经验取值", "最小化方差得到", "由 Lai-Robbins 下界给出", "令 <code>exp(−2nu²) = δ/t²</code> 反解出 u"], "a": 3, "why": "u = √((1/2n)·log(t²/δ))。先定失败概率，再解出需要多宽的区间——这是置信界方法的标准动作。"}, {"q": "为什么右边取 <code>δ/t²</code> 而不是 δ？", "o": ["为了让 u 更小", "因为要对 t 做并集界，而 <code>Σ 1/t²</code> 收敛；取 δ 的话 <code>Σ δ</code> 发散", "为了配合 Hoeffding 的形式", "这是任意的选择"], "a": 1, "why": "那个 t² 是为了 p31 的并集界才放进去的。老师在课上也说「我们待会儿会看到为什么要选这个特定的概率」。"}],
29: [{"q": "两情形引理的作用是什么？", "o": ["给出遗憾的下界", "把不可观测的 <code>Q(a*)</code> 换成可计算的 <code>U_t(a_t)</code>", "证明半径递减", "证明 UCB 收敛"], "a": 1, "why": "遗憾的定义里有 Q(a*)——最优臂的真值，而你根本不知道它。这一步是整个推导能进行下去的关键。"}, {"q": "两情形引理的情形二用到了什么？", "o": ["大数定律", "并集界", "Hoeffding 不等式", "UCB 的定义——因为算法选的就是上界最大的那条，所以 <code>U_t(a_t) ≥ U_t(a*)</code>"], "a": 3, "why": "所以这个引理只对 UCB 成立，换个算法就不对了。"}, {"q": "<code>Σ_{t=1}^{∞} t^{-2}</code> 等于多少？", "o": ["1", "发散", "2", "<code>π²/6 ≈ 1.645</code>，小于 2"], "a": 3, "why": "这就是 Basel 问题（欧拉 1734）。于是总失败概率 ≤ m·δ·(π²/6) < 2mδ。"}, {"q": "为什么这个界对无限 horizon 也成立？", "o": ["它其实不成立", "因为并集界里的求和做到了无穷，而那个和收敛", "因为 Hoeffding 不要求有限 horizon", "因为 log t 有界"], "a": 1, "why": "所以你不需要事先知道要跑多久。反过来，如果确实知道 T，可以把 t 设成 T，log 项变成常数，界会更紧。"}, {"q": "这个界和 p11 定义的遗憾有什么不同？", "o": ["这是高概率界（以至少 1−2mδ 的概率成立），而 p11 的遗憾是期望意义上的", "两者相同", "这是下界", "这个界更松"], "a": 0, "why": "高概率界更强——它排除了「平均还行但偶尔极差」的情形。代价是界里多一个 log(1/δ)。"}],
34: [{"q": "UCB1 公式里 <code>t</code> 和 <code>N_t(a)</code> 分别是什么？", "o": ["t 是时间，N 是臂数", "t 是总共拉了任何臂多少次，N 是拉了这一条多少次", "两者相同", "t 是这条臂拉的次数，N 是总次数"], "a": 1, "why": "老师专门强调「它们不是一回事」。N 在分母（递减），log t 在分子（递增）——两个方向相反的速率。"}, {"q": "一条<b>没被拉</b>的臂，它的上界会怎样？", "o": ["下降", "立刻归零", "缓慢上升——因为 N 不变而 t 在涨", "不变"], "a": 2, "why": "于是被冷落的臂会自己「浮上来」直到重新被选中。UCB 不需要任何显式的强制探索机制。"}, {"q": "如果公式里分子是 <code>t</code> 而不是 <code>log t</code>，会怎样？", "o": ["被冷落的臂的上界迅速冲到最高，算法退化成轮流拉每条臂", "收敛更快", "没有区别", "界会更紧"], "a": 0, "why": "log t 增长极慢，恰好是「既不放弃探索、又不浪费太多」的平衡点。"}, {"q": "UCB1 的上界和 Lai-Robbins 下界的关系是什么？", "o": ["两者无关", "上界是线性的", "两者都是 <code>log t</code>，只差常数——所以 UCB 在阶上是最优的", "上界更松一个数量级"], "a": 2, "why": "上下界吻合是理论工作最想要的结果，而老虎机是少数几个真的做到了的问题。"}],
35: [{"q": "各拉一次之后，UCB 的选择和贪心相同吗？", "o": ["不同，UCB 会选 a3", "不同，UCB 会选 a1", "相同——因为三条臂的 N 都是 1，半径完全一样，加上去不改变排序", "无法确定"], "a": 2, "why": "UCB 和贪心的差别不在第一步，而在长期：贪心会永远不碰 a3，UCB 最终一定会回头再看它一眼。"}, {"q": "UCB 对待明显很差的 <code>a3</code>，和 ε-贪心有什么不同？", "o": ["UCB 拉得更频繁", "UCB 先多试几次消掉不确定性，确认它差之后就基本不碰；而 ε-贪心会永远每三十次拉一次", "两者相同", "UCB 完全不碰它"], "a": 1, "why": "这就是「按不确定性分配探索」的实际表现。ε-贪心永远不会因为「已经确定它差」而停。"}, {"q": "实现 UCB 最常见的错误是什么？", "o": ["没有归一化奖励", "忘了初始化", "只更新刚拉过的那条臂的上界——于是被冷落的臂永远不会被重新选中，UCB 退化成贪心", "半径算错"], "a": 2, "why": "课件把第 5 步写成 Compute upper confidence bound on each action，那个 each 不是废话。"}],
40: [{"q": "遗憾用的是什么？", "o": ["你观测到的奖励", "真实均值之差——拉 a3 哪怕碰巧拿到 +1，这一步遗憾仍是 0.85", "置信上界之差", "样本均值之差"], "a": 1, "why": "遗憾衡量的是「你的决策有多差」，不是「你这次运气如何」。这让它成为关于算法的指标。"}, {"q": "遗憾在实际运行时能算出来吗？", "o": ["能，直接累加", "能，用样本均值代替", "只有离线时能", "不能——它需要 V* 和 Q(a_t)，而那正是你不知道的；它是分析用的概念"], "a": 3, "why": "所以报告「遗憾曲线」的实验一定是在模拟环境里做的。真实系统里你只能报告累计奖励，而那没有基准可比。"}],
41: [{"q": "「按置信<b>下</b>界贪心」为什么会线性遗憾？", "o": ["拉它会让它的下界上升、不拉的臂下界下降——正反馈自我强化，永远锁死", "因为它不探索", "因为下界太保守", "因为半径算错了"], "a": 0, "why": "对比上界：拉它会让上界下降，其他臂有机会追上——负反馈自我纠正。符号反过来机制完全颠倒。"}, {"q": "第十二讲会给这个现象什么名字？", "o": ["最大化偏差", "确认偏误——只去验证已经相信的，不去检验不相信的", "分布漂移", "过拟合"], "a": 1, "why": "而乐观恰恰相反：它主动去试「有可能很好但我不确定」的选项——也就是最可能推翻当前信念的那些。"}, {"q": "「按下界挑」什么时候反而是对的？", "o": ["永远不对", "臂数很多时", "离线设定——数据采完、只做一次最终选择、之后不再探索；那是安全策略改进（L15）的标准形式", "奖励有界时"], "a": 2, "why": "同一个做法，在线错、离线对，差别全在「之后还探不探索」。"}],
42: [{"q": "贝叶斯老虎机相对前半讲，多了什么？", "o": ["多了状态", "多了折扣因子", "多了动作", "多了一个先验 p[R]，然后用数据更新成后验"], "a": 3, "why": "于是「不确定性」从「置信区间」变成了「一个分布」。前半讲只假设奖励在 [0,1] 之间。"}, {"q": "课件说「先验准的话表现更好」，它的反面是什么？", "o": ["先验不准只影响收敛速度", "先验永远不会不准", "先验不准可能比什么都不假设更糟——你会花时间去纠正一个错误的信念", "先验不准时表现仍然一样"], "a": 2, "why": "这是所有贝叶斯方法的共同性质：先验是双刃剑。而频率派不吃这个亏，代价是起步时什么都不知道。"}],
43: [{"q": "频率派遗憾和贝叶斯遗憾的区别是什么？", "o": ["前者针对确定性算法", "前者对每一个可能的真实参数都要成立；后者只要求在先验下平均成立", "前者是上界后者是下界", "两者等价"], "a": 1, "why": "所以频率派的界更强，也更难证——这就是为什么 p58 说「乐观的界比 Thompson 的更紧」。"}, {"q": "这个区别对做实验有什么实际影响？", "o": ["贝叶斯方法不能做实验", "没有影响", "如果你也从同一个先验里抽实例来测，你测的是贝叶斯遗憾——会系统性高估贝叶斯方法", "只影响理论分析"], "a": 2, "why": "公平的比较要在「先验之外」的实例上也测一测。"}],
44: [{"q": "贝叶斯 UCB 和 UCB1 的形状有什么关系？", "o": ["形状相同（估计 + 不确定性项），区别只在那个项是怎么算出来的", "贝叶斯版没有探索项", "完全不同", "贝叶斯版用的是下界"], "a": 0, "why": "UCB1 的半径来自 Hoeffding（对任何有界分布都成立，保守）；贝叶斯的来自后验（在分布假设下，更紧）。"}, {"q": "如果贝叶斯 UCB 的分布假设错了，会怎样？", "o": ["只是收敛慢一点", "会发散", "置信区间太窄 ⇒ 过早停止探索 ⇒ 可能锁死", "没有影响"], "a": 2, "why": "这是 p42 那句「先验准才更好」的具体表现形式。"}],
45: [{"q": "概率匹配的规则是什么？", "o": ["按方差的比例选", "按估计值的比例选", "按 1/N 的比例选", "按「它是最优臂的概率」来选它——有 30% 的把握就花 30% 的时间"], "a": 3, "why": "它是唯一一个让「行为的比例」和「信念的强度」对齐的方法。"}, {"q": "概率匹配为什么也算「乐观」？", "o": ["不确定的臂后验更宽 ⇒ 尾巴伸得更远 ⇒ 更有可能取到最大值 ⇒ 被选中概率更高", "因为它用了上界", "因为它总是选最好的", "因为它从不放弃任何臂"], "a": 0, "why": "和 UCB 不同：UCB 显式地加一个乐观量，概率匹配的乐观是从「取最大值」这个操作里自己冒出来的。"}, {"q": "概率匹配的麻烦是什么？", "o": ["它有偏", "它需要知道真值", "从后验解析地算那个概率很难——三条臂已是二重积分，十条臂基本没法解", "它收敛太慢"], "a": 2, "why": "所以它在 p45 只是一个定义不是算法。kp 那句「直观上正确，但没有明显的算法」说的就是这个。"}],
46: [{"q": "Thompson 采样做什么？", "o": ["取后验均值最大的", "从每条臂的后验里抽一个样本，然后选样本最大的那条——把抽到的当真", "按后验方差排序", "算置信上界"], "a": 1, "why": "没有置信界、没有加成项、没有要调的探索常数。探索完全来自「抽样本」这个动作本身。"}, {"q": "为什么 Thompson 采样「恰好」实现了概率匹配？", "o": ["「a 被选中」⟺「a 的样本最大」，而样本来自后验，所以选中概率 = 它是最优臂的后验概率", "因为用了伯努利分布", "因为后验是共轭的", "这是近似"], "a": 0, "why": "你不需要去算那个难算的积分，只要采样就自动得到了它——用采样绕开积分。"}, {"q": "实现 Thompson 最常见的错误是什么？", "o": ["没有归一化", "先验选错了", "更新顺序错了", "抽的是后验均值而不是样本——那样它就退化成纯贪心了"], "a": 3, "why": "另外每一步必须重新抽，而且每条臂各抽一个。抽一次连用若干步，探索就塌了。"}],
48: [{"q": "Beta 分布作为伯努利共轭先验，更新规则是什么？", "o": ["需要数值积分", "按似然比更新", "两个都加一", "观察到 1 ⇒ α 加一；观察到 0 ⇒ β 加一"], "a": 3, "why": "就这么简单，不需要任何积分。而 Beta(1,1) 恰好是 [0,1] 上的均匀分布，也就是「一无所知」。"}, {"q": "<code>Beta(α, β)</code> 里的 α、β 该怎么理解？", "o": ["方差参数", "拟合出来的参数", "学习率", "伪计数——「我好像已经看到过 α−1 次成功和 β−1 次失败」"], "a": 3, "why": "于是后验均值 α/(α+β) 正是「成功次数除以总次数」的平滑版本。这个读法让所有贝叶斯更新都变直观。"}, {"q": "Thompson 的探索和 ε-贪心最本质的区别是什么？", "o": ["Thompson 不探索", "Thompson 更快", "Thompson 的探索会自动收敛——后验变窄，探索量自动下降，不需要任何衰减调度", "ε-贪心的探索更均匀"], "a": 2, "why": "ε-贪心必须手工设计衰减曲线，而且 GLIE 说那个曲线还不能随便定。Thompson 把这件事变成自动的。"}],
57: [{"q": "「Thompson 达到下界」「UCB 的界更紧」「Thompson 实测更好」三句话矛盾吗？", "o": ["三句说的是不同算法", "矛盾", "不矛盾——「界更紧」说的是最坏情况的保证，实测测的是典型情况", "矛盾，课件写错了"], "a": 2, "why": "UCB 的半径来自 Hoeffding（最坏情况），所以偏保守、探索过多；Thompson 用后验，会适应实际数据。"}, {"q": "什么时候该选 UCB 而不是 Thompson？", "o": ["奖励是二值时", "永远选 UCB", "臂数很多时", "你对分布一无所知，或者需要一个不依赖分布假设的最坏情况保证"], "a": 3, "why": "反过来：能写出合理先验、对奖励分布形式有把握时选 Thompson，它不用调探索系数。"}],
59: [{"q": "上下文老虎机和普通老虎机的区别是什么？", "o": ["奖励是延迟的", "有多个最优臂", "臂数不固定", "每步先看到一个上下文再选臂，于是要学的是 Q(x,a) 而不是 Q(a)"], "a": 3, "why": "这意味着泛化这个维度回来了——你必须从见过的上下文推广到没见过的。"}, {"q": "上下文老虎机和 MDP 的关键区别是什么？", "o": ["MDP 的动作更多", "上下文老虎机没有奖励", "上下文是外生的——课件原话 context sampled iid each step，你的动作不影响下一个上下文", "没有区别"], "a": 2, "why": "所以它仍然没有延迟后果，仍是单步决策问题——处在普通老虎机和 MDP 之间，而且更靠近前者。"}, {"q": "p60 那句「后验采样的遗憾界和 UCB 相同」说明什么？", "o": ["常数无关紧要", "贝叶斯方法没有优势", "两条完全不同的路给出同阶保证——因为它们都在让「被选中概率」和「不确定性」挂钩", "两者是同一个算法"], "a": 2, "why": "殊途同归，而这说明「乐观面对不确定」这个原则比任何具体算法都更根本。"}],
61: [{"q": "乐观初始化为什么能产生探索？", "o": ["因为它加了随机性", "因为它用了置信界", "没试过的臂看起来最好，纯贪心就会主动去试它；试过之后估计下降，轮到下一条", "因为它从后验采样"], "a": 2, "why": "结果是贪心算法自己把每条臂都试了一遍，而你一行探索代码都没写。"}, {"q": "初始化得<b>太</b>高有什么坏处？", "o": ["会导致有偏", "没有坏处", "会发散", "每条臂需要被拉更多次估计才能降到真实水平——于是在明显很差的臂上浪费大量步数"], "a": 3, "why": "极端情况：初值设成一百万，你会把每条臂都拉上百万次才开始收敛。太低会锁死、太高会浪费。"}],
62: [{"q": "衰减 ε-贪心的「次线性」附带了什么条件？", "o": ["需要奖励有界", "衰减的时间表需要知道差距，而差距是未知的", "需要很多样本", "需要臂数已知"], "a": 1, "why": "你需要知道答案才能调出正确的参数，而知道答案的话就不需要算法了——典型的循环依赖。"}, {"q": "UCB 相对衰减 ε-贪心的真正优势是什么？", "o": ["它方差更小", "收敛更快", "它不需要知道差距，而遗憾却由差距决定——算法自动隐式地适应了问题难度", "它实现更简单"], "a": 2, "why": "公式里只有 t 和 N_t(a)，没有任何 Δ；而界是 8 log t · Σ Δ_a。第十二讲第一条 kp 说的正是这件事。"}, {"q": "固定 ε-贪心线性遗憾的证明梗概，关键在哪一步？", "o": ["差距太小", "ε 太大", "臂数太多", "每步选中某条次优臂的概率至少是 ε/m，而这个下界不随 t 变化——常数乘 t 就是线性"], "a": 3, "why": "于是 E[N_t(a)] ≥ (ε/m)·t，代入 L_t = Σ_a E[N_t(a)]·Δ_a 即得线性。"}],

{"r": [1, 3], "t": "这一讲要干什么", "star": 2, "quote": "Lecture 11: <b>Fast Reinforcement Learning</b> &nbsp;·&nbsp; Last time: Midterm &nbsp;·&nbsp; This time: Fast Learning &nbsp;·&nbsp; Next time: Fast Learning &nbsp;|&nbsp; Up Till Now: Discussed <b>optimization, generalization, delayed consequences</b>", "one": "前十讲谈了优化、泛化、延迟后果，<b>这一讲开始谈第四样：要多少数据</b>。", "tip": {"t": "这一讲的来历", "v": "幻灯片多来自 David Silver，<b>例子是新的</b>（课件自己标的 <em>Examples new</em>）。而那个断脚趾的例子贯穿全讲，三个算法都在它上面演示一遍。"}, "pts": ["<b>这一讲是整门课的一次转向，而转向的内容可以用一句话说清：<span class='k'>判据换了</span>。</b><span class='w'>前十讲问的是「这个算法收不收敛、收敛到哪」</span>；<span class='k'>从这一讲起问的是「它要花多少数据才到那里、路上犯了多少错」</span>。<b>第一讲列的四样要求里，「统计上和计算上都高效」那一条一直挂着没人管</b>（<span class='w'>L07 p17 把这笔账摊开过</span>），<b>而这一讲开始还它。</b>", "<b>为了把这件事谈清楚，课件引入了一套三层的词汇，值得先立住，否则后面会乱。</b><span class='k'>① 设定（setting）：老虎机 / MDP——问题长什么样</span>；<span class='k'>② 框架（framework）：遗憾 / PAC / 贝叶斯遗憾——用什么尺子量算法好不好</span>；<span class='k'>③ 方法（approach）：乐观面对不确定 / 概率匹配——用什么办法达到那把尺子的要求</span>。<b>这三层是正交的：同一个方法可以在多个设定下、满足多个框架。</b><span class='w'>课件自己也强调了这一点。</span>", "<b>这一讲只碰最简单的那个设定——<span class='k'>老虎机</span>，也就是「只有一步决策」的 MDP。</b><span class='w'>为什么从最简单的开始？因为连这个最简单的情形，答案都不平凡</span>：<b>你会看到贪心和固定 ε-贪心都是线性遗憾（p18–p23），而理论下界告诉你最好只能做到 <code>log T</code>（p25）。</b><span class='k'>把这件事在老虎机上弄清楚，第十二、十三讲才能把它搬回 MDP。</span>", "<b>读这一讲有一条贯穿的主线，建议现在就记住：<span class='k'>「乐观面对不确定」这五个字，是这一讲、下一讲、下下讲的共同答案</span>。</b><b>UCB 是它的频率派版本（p26 起），Thompson 采样是它的贝叶斯版本（p45 起），而第十二讲的 MBIE-EB 是它在 MDP 上的版本。</b><span class='w'>三个算法形式差很远，思想完全一样</span>——<b>认出这一点，三讲就只剩一个概念要理解。</b>", "<b>课件 p3 那行「前十讲谈了优化、泛化、延迟后果」是一句精确的清点，值得对着回忆一遍。</b><span class='k'>优化：L02 的策略迭代与值迭代、L08–L10 的策略梯度</span>；<span class='k'>延迟后果：L02 的贝尔曼方程、L03 的 TD、L04 的自举</span>；<span class='k'>泛化：L05 的函数逼近、L06 的卷积网络</span>。<span class='w'>三样都谈过了，而<b>探索</b>只在 L04 p18 露过一面（ε-贪婪），从没被正面分析过</span>。<b>这一讲就是来补这一课的。</b>", "<b>还有一个阅读上的提醒：这一讲和下一讲是连着的，课件自己在 p2 标了「This time: Fast Learning / Next time: Fast Learning」。</b><span class='k'>所以读到结尾会觉得话没说完——确实没说完</span>：<b>贝叶斯那半边（Thompson 采样）在这一讲只开了个头，第十二讲才把 PAC、MBIE-EB 补上。</b><span class='w'>而第十三讲再把这些结论证成定理，并承认它们在深度网络上还不成立。</span>"]},
{"r": [4, 7], "t": "计算效率不等于样本效率", "star": 2, "quote": "<b>Computational Efficiency ≠ Sample Efficiency</b> &nbsp;|&nbsp; How many steps did it take for DQN to learn a good policy for pong? &nbsp;|&nbsp; <b>How do we evaluate how \"good\" an algorithm is?</b> &nbsp;·&nbsp; If converges? &nbsp;·&nbsp; If converges to optimal policy? &nbsp;·&nbsp; <b>How quickly reaches optimal policy?</b> &nbsp;·&nbsp; <b>Mistakes made along the way?</b>", "one": "课件写了个不等号：<b>算得快</b>和<b>用的数据少</b>，是两回事。", "pts": ["<b>这个不等号值得停一下，因为两者在实践里经常被混为一谈。</b><span class='k'>计算效率：一步要算多久（CPU/GPU 时间）</span>；<span class='k'>样本效率：要和环境交互多少次（数据）</span>。<b>而在真实问题里，后者往往贵得多</b>——<span class='w'>多买一块显卡是花钱，多试一次新药、多撞一次车、多骚扰一次客户，代价完全不同</span>。<b>L07 p21 那三条「什么时候不管用」（动作执行慢、失败代价高、要求安全），说的全是样本贵的场合。</b>", "<b>课件用一个问句把这件事砸实：<em>How many steps did it take for DQN to learn a good policy for pong?</em></b><span class='k'>答案在 L06 p64：Atari 上通常要等 10–40M 帧</span>。<b>而 Pong 已经是课件自己说的「最可靠、最容易」的那个任务。</b><span class='w'>换算一下：按每秒 60 帧算，10M 帧是约 46 小时的连续游戏</span>——<b>而人类玩家十几分钟就能摸清规则。</b><span class='k'>DQN 的计算效率其实不差（每步就是一次前向加一次反向），差的全是样本效率。</span>", "<b>然后是这一页真正的转折：<span class='k'>那怎么衡量一个算法「好」</span>？</b><b>课件列了四个可能的答案，而它们的严格程度是递增的。</b><span class='w'>① 收不收敛——最弱，只说有没有终点</span>；<span class='w'>② 收敛到最优吗——强一点，但仍然只管终点</span>；<span class='k'>③ 多快到最优——开始管速度了</span>；<span class='k'>④ <b>路上犯了多少错</b>——管的是整个过程</span>。<b>第④个就是「遗憾」，也是这一讲的主角。</b>", "<b>为什么第④条比前三条更合适，理由在 L09 p9 已经说过一次，这里是它的另一面。</b><span class='w'>跑策略的时候你在<b>真实地承担代价</b></span>——<b>每一次试错都是真的给了病人一种治疗、真的向客户推了一个广告。</b><span class='k'>于是「最终收敛到最优」这个承诺，对那些在学习过程中被当作试验品的人没有任何安慰</span>。<b>而遗憾恰好衡量的就是这部分代价。</b>", "<b>最后把前三条判据各自的盲点指出来，这样你知道它们什么时候不够用。</b><span class='w'>「收敛」不排除「收敛得极慢」</span>；<span class='w'>「收敛到最优」不排除「路上代价极大」</span>；<span class='w'>「多快到最优」不排除「到达之前一直在做最差的选择」</span>。<b>而遗憾把这些全算进去了——它是一个对整条轨迹的积分，不是对终点的判断。</b><span class='k'>这是判据从「终点」转向「过程」的那一步。</span>", "<b>把「样本贵」这件事说得更具体一点，它在不同领域的含义差别很大。</b><span class='k'>仿真里：样本便宜，可以并行，于是样本效率几乎不重要（这就是 Atari 能用几千万帧的原因）</span>；<span class='w'>机器人：样本贵在时间和硬件磨损</span>；<span class='w'>医疗、教育、推荐：样本贵在<b>人</b>——每一次试错都落在一个具体的人身上</span>。<b>而这一讲的断脚趾例子正是第三类。</b><span class='k'>选什么判据，取决于你的样本贵在哪里。</span>", "<b>这四个判据还有一个递进关系值得点明：<span class='k'>后一个蕴含前一个</span>。</b><b>遗憾是次线性的 ⇒ 平均每步损失趋于 0 ⇒ 最终会收敛到最优 ⇒ 当然也收敛。</b><span class='w'>反过来不成立：收敛不蕴含次线性遗憾</span>（<b>贪心可能收敛到一条坏臂，遗憾线性</b>）。<span class='k'>所以「次线性遗憾」是这四条里最强的要求</span>，<b>而它也正是这一讲要用的那把尺子。</b>", "<b>最后提一个容易混的事：这一讲说的「样本效率」和第五讲说的「样本复杂度」是同一件事的两种表述。</b><span class='k'>L05 p10 说表格表示「所需样本量至少和状态数同阶」——那是样本复杂度</span>；<span class='w'>而遗憾是把这件事按时间积分之后的量</span>。<b>两者可以互相转换，但侧重点不同：样本复杂度问「要多少数据才够好」，遗憾问「路上损失了多少」。</b><span class='k'>第十二讲的 PAC 框架用的正是前一种表述。</span>"], "tbl": {"head": ["判据", "管什么", "盲点", "够用吗"], "rows": [["收不收敛", "有没有终点", "<span class='w'>不排除极慢</span>", "<span class='w'>最弱</span>"], ["收敛到最优吗", "终点对不对", "<span class='w'>不排除路上代价极大</span>", "仍只管终点"], ["多快到最优", "速度", "<span class='w'>不排除到达前一直在做最差选择</span>", "开始管过程"], ["<b>路上犯了多少错</b>", "<b>整条轨迹</b>", "—", "<span class='k'>这就是遗憾，本讲的主角</span>"]]}},
{"r": [8, 9], "t": "三层词汇：设定、框架、方法", "star": 3, "quote": "Over next couple lectures will consider 2 settings, multiple frameworks, and approaches &nbsp;·&nbsp; <b>Settings</b>: Bandits (single decisions), MDPs &nbsp;·&nbsp; <b>Frameworks</b>: evaluation criteria for formally assessing the quality of a RL algorithm &nbsp;·&nbsp; <b>Approaches</b>: Classes of algorithms for achieving particular evaluation criteria &nbsp;·&nbsp; <b>Note: some approaches can achieve multiple frameworks in multiple settings</b> &nbsp;|&nbsp; Today: Setting <b>multi-armed bandits</b>; Framework <b>Regret</b>; Approach <b>Optimism under uncertainty</b>; Framework <b>Bayesian regret</b>; Approach <b>Probability matching / Thompson sampling</b>", "one": "<b>设定 × 框架 × 方法</b>——三层正交，读后面三讲全靠这张表定位。", "pts": ["<b>这张三层表是接下来三讲的坐标系，值得现在就填一遍，后面每讲一个新东西就往里放一格。</b><b>设定只有两个</b>：<span class='k'>老虎机（单步决策）和 MDP（多步）</span>。<b>框架这一讲出现两个</b>：<span class='k'>遗憾、贝叶斯遗憾</span>（<span class='w'>下一讲还会加 PAC</span>）。<b>方法这一讲也是两个</b>：<span class='k'>乐观面对不确定、概率匹配</span>。", "<b>课件专门加了一句注，而那句注是这三讲最省力的一条线索：<em>some approaches can achieve multiple frameworks in multiple settings</em>。</b><span class='k'>也就是说：你不需要为每一个「设定 × 框架」的格子学一个新算法</span>——<b>同一个方法（比如乐观）可以同时拿下好几格。</b><span class='w'>这解释了为什么第十二、十三讲看起来内容很多，但核心思想只有两三个</span>。", "<b>把今天这一讲在这张表里的位置标清楚：<span class='k'>设定固定在老虎机，然后走两遍「框架 → 方法」</span>。</b><b>第一遍：遗憾 → 乐观（UCB）；第二遍：贝叶斯遗憾 → 概率匹配（Thompson）。</b><span class='w'>两遍的结构完全平行</span>——<b>先说用什么尺子量，再说用什么办法达标。</b><span class='k'>读到一半觉得「怎么又从头开始了」，那是因为确实开始了第二遍。</span>", "<b>为什么要把「框架」和「方法」分开，这件事在读论文时极其有用，值得说透。</b><span class='k'>框架是<b>评价标准</b>，方法是<b>达标手段</b></span>。<b>混在一起的话，你会误以为「UCB 是一种遗憾」或者「遗憾是一种算法」。</b><span class='w'>而分开之后，一篇论文的贡献就能被准确定位</span>：<b>它是提出了新框架（新的评价标准）、新方法（新算法）、还是证明了某个已有方法在某个已有框架下的界？</b><span class='k'>绝大多数论文属于第三类。</span>", "<b>这一讲会出现的那两对「框架 → 方法」，它们的配对不是任意的，而是有内在逻辑的。</b><span class='k'>遗憾是频率派的（假设有一组真实但未知的参数），所以配频率派的方法：置信上界</span>；<span class='k'>贝叶斯遗憾假设参数有先验，所以配贝叶斯的方法：从后验采样</span>。<span class='w'>两对各自自洽</span>。<b>但课件也会指出一件有意思的事（p43）：两种遗憾可以通过马尔可夫不等式联系起来</b>——<span class='k'>所以界限并不是绝对的。</span>", "<b>最后提一句这张三层表在读这一讲时的具体用法。</b><span class='k'>每读到一个新名词，先问它是三层里的哪一层</span>——<b>「遗憾」是框架，「UCB」是方法，「老虎机」是设定，「Hoeffding 不等式」则都不是（它是推导用的工具）。</b><span class='w'>分不清层次的话，这三讲会像一堆平行的新概念；分清了，就只有两三个核心思想。</span>"]},
{"r": [10, 10], "t": "多臂老虎机", "star": 3, "quote": "Multi-armed bandit is a tuple of <b>(A, R)</b> &nbsp;·&nbsp; <b>A</b>: known set of m actions (arms) &nbsp;·&nbsp; <b>R^a(r) = P[r | a]</b> is an <b>unknown</b> probability distribution over rewards &nbsp;·&nbsp; At each step t the agent selects an action a_t ∈ A &nbsp;·&nbsp; The environment generates a reward r_t ∼ R^{a_t} &nbsp;·&nbsp; <b>Goal: Maximize cumulative reward Σ_{τ=1}^{t} r_τ</b>", "eq": "老虎机 = (A, R)\n  A：m 个已知动作（臂）\n  R^a(r) = P[r | a]：每条臂的奖励分布，未知\n\n每步：选一条臂 a_t → 环境给一个奖励 r_t ~ R^{a_t}\n目标：最大化累计奖励 Σ r_τ\n\n对比 MDP 五元组 (S, A, P, R, γ)：\n  没有 S（或者说只有一个状态）\n  没有 P（动作不改变你下次面对的处境）\n  没有 γ（不需要——没有「未来的状态」可言）", "one": "<b>只有一个状态的 MDP</b>：你的动作不改变下一次的处境。", "pts": ["<b>把老虎机和 MDP 并排写，差别只有一处，但那一处决定了问题的全部性质。</b><span class='k'>MDP 里你的动作会改变下一个状态，于是「这一步做什么」要考虑「之后会落到哪」</span>；<span class='w'>老虎机里没有状态，拉完一条臂，下一次你面对的还是同一堆臂</span>。<b>于是<span class='k'>延迟后果</span>这一整个维度消失了。</b><span class='w'>L02 p5 早就说过这件事：bandits 是单状态的 MDP。</span>", "<b>而延迟后果消失之后，剩下的是什么？<span class='k'>只剩探索</span>。</b><b>这正是老虎机值得单独研究的理由</b>——<span class='w'>它把 RL 的四个困难（优化、延迟后果、探索、泛化）里的三个都拿掉了，只留下探索这一个</span>。<b>于是你可以在一个干净的环境里把探索这件事彻底弄清楚。</b><span class='k'>弄清楚之后，第十二、十三讲再把状态加回去。</span>", "<b>定义里有一处很重要的不对称，值得单独指出：<span class='k'>A 是<b>已知</b>的，R 是<b>未知</b>的</span>。</b><b>你知道有哪几条臂可以拉，但不知道每条臂的奖励分布。</b><span class='w'>这个设定排除了一大类现实问题</span>——<b>比如「还有没有我没想到的选项」。</b><span class='k'>而且臂的数量 m 是固定的、有限的</span>，<b>连续臂或者无限多臂是另一套理论（第十二讲会碰一点）。</b>", "<b>目标写成「最大化累计奖励」，而不是「找到最好的那条臂」，这个措辞差别很大。</b><span class='k'>前者在乎过程——你拉的每一次都算分</span>；<span class='w'>后者只在乎终点——中间试错多少都不要紧</span>。<b>两者对应两个不同的框架：前者是遗憾，后者叫「纯探索」或者 best-arm identification。</b><span class='k'>这一讲走的是前者，而第十二讲的 PAC 更接近后者。</span><b>它们要的算法不一样，所以先看清楚你要的是哪个。</b>"], "res": {"tag": "推断", "v": "<b>这一页请你先回答一个问题，因为它决定了你整个课题该用哪套理论：<span class='k'>你的问题是老虎机还是 MDP</span>？</b><br><br><b>课件 p16 自己也会问这件事（「为什么这个例子建模成老虎机而不是 MDP」），而判据只有一条：<span class='k'>你这一步的决定，会不会改变你下一步面对的处境</span>。</b><br><br><b>搬到你的流水线上：节点 h 选了低保真度，节点 h+1 面对的输入产物就变了</b>——<span class='w'>听起来显然是 MDP</span>。<span class='k'>但「变了」和「变得足以影响最优决策」是两回事</span>，<b>而这件事是可以实测的。</b><br><br><b>bridge-threads 那份研究笔记把这个实验写得很具体，它叫<span class='k'>可加性检验</span>：</b><br><b>① 对每个节点 h，测 <code>Δ_h^down = Acc(全高) − Acc(全高但 h 降级)</code>；</b><br><b>② 比较 <code>Σ_h Δ_h^down</code> 和 <code>Acc(全高) − Acc(全低)</code>。</b><br><span class='k'>两者在置信区间内相等 ⇒ 节点效应近似<b>可加</b>，问题实质上<b>不是</b> MDP，诚实的建模是「逐节点的上下文老虎机」</span>；<span class='w'>前者明显小于后者 ⇒ 节点之间有真实的交互，你<b>挣到了</b>序贯建模的资格</span>。<br><br><b>两种结果都是结果，而且都该报告。</b><span class='k'>审稿人尊重一篇检验了自己建模前提的论文，而惩罚一篇直接假设它的</span>。<b>更实际的是：如果答案是「可加」，那么这一讲（以及第十二讲）的老虎机理论就是你该用的全部，而 L05 那套致命三件套的顾虑、L09 那个算不出的 <code>ρ^{π̃}</code>，统统不适用</b>——<span class='w'>因为单步决策没有分布漂移。</span><b>那会让你的问题变简单一大截，而且是<b>有依据地</b>变简单。</b>", "ref": "课件 p10 p16 · research/bridge-threads.json 线 1（Week 2 可加性检验）· L02 p5"}},
{"r": [11, 11], "t": "遗憾", "star": 3, "quote": "Action-value is the mean reward for action a: <b>Q(a) = E[r | a]</b> &nbsp;·&nbsp; Optimal value <b>V* = Q(a*) = max_{a∈A} Q(a)</b> &nbsp;·&nbsp; <b>Regret is the opportunity loss for one step: l_t = E[V* − Q(a_t)]</b> &nbsp;·&nbsp; <b>Total Regret is the total opportunity loss: L_t = E[Σ_{τ=1}^{t} V* − Q(a_τ)]</b> &nbsp;·&nbsp; <b>Maximize cumulative reward ⟺ minimize total regret</b>", "eq": "Q(a) = E[r | a]                    每条臂的真实均值\nV* = max_a Q(a)                   最好那条臂的均值\n\n单步遗憾：  l_t = E[V* − Q(a_t)]\n累计遗憾：  L_t = E[ Σ_{τ=1}^{t} (V* − Q(a_τ)) ]\n\n「最大化累计奖励」和「最小化累计遗憾」是同一件事", "one": "遗憾 = <b>你本可以拿到的</b> 减去 <b>你实际拿到的</b>，而且是<b>累计</b>的。", "pts": ["<b>遗憾这个定义最该注意的是那个「累计」：<span class='k'>它是对整条轨迹求和，不是对当前状态的评价</span>。</b><b>一个算法现在表现完美，但前面犯了一千次错，它的遗憾仍然很大。</b><span class='w'>这正是它和「收敛到最优」那类判据的根本区别</span>——<b>后者只看终点，遗憾看的是整个过程欠下的债。</b><span class='k'><code>kp</code> 那句「<b>累计</b>的机会损失，不是当前有多好」说的就是这个。</span>", "<b>「机会损失」这个说法也值得琢磨，它是经济学的词，用在这里很贴切。</b><span class='k'>你拉了 <code>a_t</code>，拿到的是 <code>Q(a_t)</code>；而你<b>本来可以</b>拉 <code>a*</code>，拿到 <code>V*</code></span>。<b>差的那一块就是你为了「不知道哪条最好」付出的学费。</b><span class='w'>注意它是相对<b>事后最优</b>定义的</span>——<b>你在当时并不知道 <code>a*</code> 是哪条，但遗憾不管这个，它就是拿你和上帝比。</b>", "<b>最后那行等价关系值得确认一遍，因为它说明遗憾不是一个新目标，只是换了个写法。</b><span class='k'><code>L_t = t·V* − E[Σ r_τ]</code>——而 <code>t·V*</code> 是个常数</span>。<b>所以最小化 <code>L_t</code> 和最大化 <code>E[Σ r_τ]</code> 完全等价。</b><span class='w'>那为什么还要引入遗憾？因为它的<b>量级</b>更有意义</span>——<b>累计奖励总是随 t 线性增长（看不出好坏），而遗憾的增长速度直接告诉你算法有多好。</b><span class='k'>线性增长 = 糟糕，对数增长 = 很好。</span>"]},
{"r": [12, 12], "t": "遗憾 = 计数 × 差距", "star": 3, "quote": "Count <b>N_t(a)</b> is expected number of selections for action a &nbsp;·&nbsp; Gap <b>Δ_a</b> is the difference in value between action a and optimal action a*: <b>Δ_a = V* − Q(a)</b> &nbsp;·&nbsp; Regret is a function of gaps and counts &nbsp;·&nbsp; <b>L_t = Σ_{a∈A} E[N_t(a)] Δ_a</b> &nbsp;·&nbsp; <b>A good algorithm ensures small counts for large gap, but gaps are not known</b>", "eq": "L_t = E[ Σ_τ (V* − Q(a_τ)) ]\n    = Σ_a E[N_t(a)] · (V* − Q(a))\n    = Σ_a E[N_t(a)] · Δ_a\n\n  N_t(a)：到 t 为止拉了臂 a 多少次\n  Δ_a = V* − Q(a)：臂 a 的「差距」\n\n好算法：对差距大的臂，计数要小\n但 —— 差距是未知的", "one": "<b>遗憾可以拆成「每条坏臂拉了几次」乘「它有多坏」。</b>", "pts": ["<b>这个改写只是把求和重新分组，但它把问题的结构完全暴露出来了。</b><span class='k'>原来是「对时间求和」，现在是「对臂求和」</span>——<b>于是遗憾变成了两个因子的乘积之和：你拉了某条坏臂多少次（<code>N_t(a)</code>），以及它有多坏（<code>Δ_a</code>）。</b><span class='w'>第二个因子是问题给定的，你改不了；第一个因子完全由你的算法决定</span>。<b>所以算法设计的全部空间，就在「怎么让坏臂的计数小」上。</b>", "<b>而课件紧接着给出了这件事的难处，一句话：<span class='w'>差距是未知的</span>。</b><b>你想少拉坏臂，可你不知道哪条坏。</b><span class='k'>如果知道，问题就没了——直接一直拉最好那条，遗憾恒为零</span>。<b>于是整个老虎机问题可以重新表述为：<b>在不知道差距的情况下，怎么让差距大的臂被拉的次数少</b>。</b><span class='w'>这个表述比「探索与利用的权衡」精确得多，而且它直接指向了算法该怎么设计。</span>", "<b>这个分解还有一个很实用的推论，它解释了后面那些界的形状。</b><span class='k'>既然 <code>L_t = Σ_a N_t(a)·Δ_a</code>，那么要证明遗憾是 <code>log t</code> 量级，只需要证明<b>每条坏臂的计数</b>是 <code>log t</code> 量级</span>。<b>而 p34 的 UCB1 定理正是这个形状：<code>8 log t · Σ_{a:Δ_a>0} (1/Δ_a)</code>。</b><span class='w'>注意 <code>Δ_a</code> 跑到了分母上</span>——<b>差距越小的臂，越难区分，所以被拉的次数越多，但每次的损失也越小。</b><span class='k'>两者相乘之后，差距小的臂反而贡献更大的遗憾（因为 <code>1/Δ_a</code> 大）。</span>", "<b>最后提一个容易被略过的细节：<code>N_t(a)</code> 前面有个期望符号。</b><span class='w'>因为算法通常是随机的（ε-贪心会掷骰子，Thompson 会采样），所以计数本身是个随机变量</span>。<b>遗憾的定义里对它取了期望。</b><span class='k'>这意味着遗憾界是一个关于<b>平均表现</b>的陈述</span>——<b>某一次具体运行可能比界差得多。</b><span class='w'>p29 起要推的「高概率遗憾界」正是为了给出比期望更强的保证。</span>"], "tbl": {"head": ["因子", "是什么", "谁决定", "你能改吗"], "rows": [["<code>Δ_a</code>（差距）", "臂 a 比最优臂差多少", "<span class='w'>问题本身</span>", "<span class='w'>不能</span>"], ["<code>N_t(a)</code>（计数）", "你拉了臂 a 多少次", "<span class='k'>你的算法</span>", "<span class='k'>能——这是全部的设计空间</span>"], ["<b>难处</b>", "差距<b>未知</b>", "—", "<b>要在不知道差距的前提下压低坏臂的计数</b>"]]}},
{"r": [13, 13], "t": "贪心算法", "star": 3, "quote": "We consider algorithms that estimate <b>Q̂_t(a) ≈ Q(a)</b> &nbsp;·&nbsp; Estimate the value of each action by Monte-Carlo evaluation: <b>Q̂_t(a) = (1/N_t(a)) Σ_{t=1}^{T} r_t · 1(a_t = a)</b> &nbsp;·&nbsp; The greedy algorithm selects action with highest value: <b>a_t = arg max_{a∈A} Q̂_t(a)</b> &nbsp;·&nbsp; <b>Greedy can lock onto suboptimal action, forever</b>", "eq": "Q̂_t(a) = (1/N_t(a)) · Σ_t r_t · 1(a_t = a)      ← 就是样本平均\na_t = arg max_a Q̂_t(a)\n\n问题：greedy can lock onto a suboptimal action, FOREVER", "one": "只拉当前看起来最好的那条。<span class='w'>可能永远锁死在一条坏臂上。</span>", "pts": ["<b>估计方式就是最朴素的样本平均，这和 L04 p13 的 MC 估 Q 一模一样，没有新东西。</b><span class='k'>新的是那句警告：<em>Greedy can lock onto suboptimal action, forever</em></span>——<b>注意最后那个 <em>forever</em>。</b><span class='w'>不是「可能慢一点」，是「可能永远不改」。</span>", "<b>锁死的机制在 L04 p15 已经讲过，这里值得再走一遍，因为老虎机上它更赤裸。</b><span class='k'>假设第一次拉臂 a 运气好拿到高奖励，而真正最好的臂 a* 第一次运气差</span>。<b>于是 <code>Q̂(a) > Q̂(a*)</code>，贪心一直拉 a。</b><span class='w'>而 <code>a*</code> 再也不会被拉，所以 <code>Q̂(a*)</code> 永远停在那个倒霉的值上</span>——<b>它没有翻身的机会。</b><span class='k'>这是一个自我锁死的循环：不拉 ⇒ 没数据 ⇒ 估计不变 ⇒ 更不拉。</span>", "<b>把这件事翻译成遗憾的语言，结论就很严重了。</b><span class='k'>如果贪心锁死在一条差距为 <code>Δ</code> 的坏臂上，那么它每一步都损失 <code>Δ</code></span>——<b>于是 <code>L_t = Δ·t</code>，是 <b>线性</b> 遗憾。</b><span class='w'>而线性遗憾意味着「平均每步的损失不随时间下降」</span>，<b>也就是你永远学不会。</b><span class='k'>这是这一讲判「一个算法不行」的标准。</span>", "<b>最后提一个实现上的细节，它在 p18 的例子里会直接出现：<span class='k'>打平怎么办</span>。</b><b>学习早期大量臂的估计相同（比如都拉过一次都拿到 1），此时 <code>arg max</code> 会打平。</b><span class='w'>课件和老师都约定「打平时均匀随机挑一个」</span>——<b>老师在课上说的是：「如果你在所有臂之间按 <code>1/臂数</code> 的概率均匀地分，那么会以那个概率选中最优动作。」</b><span class='k'>这个约定在 p19 的概率计算里是关键，不说清楚那道题就做不了。</span>"]},
{"r": [14, 14], "t": "ε-贪心算法", "star": 3, "quote": "The ε-greedy algorithm proceeds as follows: &nbsp;·&nbsp; With probability 1−ε select <b>a_t = arg max_{a∈A} Q̂_t(a)</b> &nbsp;·&nbsp; With probability ε select a random action &nbsp;·&nbsp; <b>Always will be making a sub-optimal decision ε fraction of the time</b> &nbsp;·&nbsp; Already used this in prior homeworks", "one": "以 ε 的概率随机试。<span class='w'>永远有 ε 那么多时间在做次优决策。</span>", "pts": ["<b>ε-贪心解决了锁死的问题，但课件立刻指出它引入了一个新问题，而且那句话就是判决书：</b><span class='w'><em>Always will be making a sub-optimal decision ε fraction of the time</em></span>。<b>「always」这个词是关键</b>——<span class='k'>哪怕你已经完全知道哪条臂最好，你仍然以 ε 的概率去乱拉</span>。<b>这个代价不随时间衰减。</b>", "<b>算一下这个代价，你就知道固定 ε 的问题有多严重。</b><span class='k'>每步以 ε 的概率随机选，于是平均每步的额外损失大约是 <code>ε · (平均差距)</code></span>。<b>这个量是个常数，不随 t 变。</b><span class='w'>于是 <code>L_t ≈ ε·(平均差距)·t</code>——<b>又是线性遗憾</b></span>。<b>所以固定 ε 的 ε-贪心和贪心一样，都是线性遗憾，只是常数不同。</b><span class='k'><code>kp</code> 那句「有探索不等于够」说的正是这件事。</span>", "<b>这是这一讲前半最该带走的结论，值得单独摆出来：<span class='k'>贪心线性，固定 ε-贪心也线性</span>。</b><b>两个你在前面作业里一直用的算法，按这一讲的判据都不及格。</b><span class='w'>而它们失败的原因<b>相反</b></span>：<b>贪心是<b>探索不够</b>（可能永远不试别的），ε-贪心是<b>探索过头</b>（永远在试）。</b><span class='k'>两头都不对，说明光调 ε 的大小解决不了问题，需要的是让它<b>随时间衰减</b>——而那正是 L04 p23 的 GLIE。</span>", "<b>但即使按 GLIE 让 ε 衰减，ε-贪心仍然不是最优的，这一点值得先埋个伏笔。</b><span class='w'>因为它的探索是<b>无差别</b>的</span>——<b>一条已经试过一千次、确定很差的臂，和一条从没试过的臂，被随机选中的概率一样。</b><span class='k'>而 p26 起的「乐观」方法会按<b>不确定性</b>来分配探索</span>：<b>你对它越没把握，就越该去试。</b><span class='w'>这是 ε-贪心和 UCB 最根本的差别，而第十二讲 p2 会用具体数字对比：UCB 给明显坏的臂<b>恰好零</b>概率，ε-贪心给它 0.0333。</span>"], "tbl": {"head": ["算法", "遗憾", "失败的原因", "探索是怎么分配的"], "rows": [["贪心", "<span class='w'>线性</span>", "<span class='w'>探索不够——可能永远锁死</span>", "不探索"], ["固定 ε-贪心", "<span class='w'>线性</span>", "<span class='w'>探索过头——永远有 ε 在乱拉</span>", "<b>无差别</b>（所有非贪心臂等概率）"], ["衰减 ε-贪心", "可以做到次线性", "—", "仍然无差别"], ["<b>UCB（p26 起）</b>", "<span class='k'><code>log t</code></span>", "—", "<b>按不确定性分配</b>"]]}},
{"r": [15, 17], "t": "断脚趾例子：设定", "star": 2, "quote": "Consider deciding how to best treat patients with broken toes &nbsp;·&nbsp; 3 options: (1) surgery (2) surgical boot / buddy taping (3) do nothing &nbsp;·&nbsp; Outcome measure / reward is <b>binary variable: whether the toe has healed (+1) or not healed (0) after 6 weeks</b>, as assessed by x-ray &nbsp;·&nbsp; Model as a multi-armed bandit with 3 arms, each a <b>Bernoulli variable with an unknown parameter θ_i</b> &nbsp;|&nbsp; <b>Check your understanding: what does a pull of an arm correspond to? Why is it reasonable to model this as a multi-armed bandit instead of a Markov decision process?</b> &nbsp;|&nbsp; True (unknown) parameters: <b>surgery θ_1 = .95 · buddy taping θ_2 = .9 · doing nothing θ_3 = .1</b> &nbsp;|&nbsp; (课件脚注：This is a made up example, not actual efficacies)", "eq": "三条臂（三种治法），奖励是伯努利变量：\n  +1 = 六周后 X 光显示愈合，0 = 没愈合\n\n真实参数（算法不知道）：\n  a1 手术      θ_1 = 0.95\n  a2 并指固定   θ_2 = 0.90\n  a3 不处理    θ_3 = 0.10\n\n所以 V* = 0.95，差距为：\n  Δ_{a1} = 0    Δ_{a2} = 0.05    Δ_{a3} = 0.85", "say": "老师特意强调这是编的例子，不是真实的疗效数据（课件脚注也写了两遍）。她的原话大意是：想象有三种选择——<b>手术</b>、<b>把断趾和旁边的趾头绑在一起</b>（「这是互联网会告诉你的做法」）、以及<b>什么都不做</b>；结果变量是六周后 X 光看愈合没愈合。<br>她把「这个该建模成老虎机还是 MDP」留成了检验题，而没有直接给答案。", "one": "三种治法当三条臂，<b>愈合 = +1</b>。差距分别是 0、0.05、0.85。", "pts": ["<b>这三个参数的设计很讲究，值得先看出它的用意：<span class='k'>两条臂很接近（0.95 vs 0.90），一条臂明显很差（0.10）</span>。</b><b>于是三条臂的差距是 0、0.05、0.85。</b><span class='w'>这个配置能同时演示两件事</span>：<b>① 明显坏的臂该被快速排除（<code>a3</code>）；② 接近的两条臂很难区分，需要大量样本（<code>a1</code> vs <code>a2</code>）。</b><span class='k'>而 p34 的遗憾界里 <code>Δ_a</code> 在分母上，说的正是第②件事的代价。</span>", "<b>课件那道检验题的第一问（拉一条臂对应什么）值得认真答，因为它决定了「一步」有多贵。</b><span class='k'>一次「拉臂」= 给<b>一个病人</b>用<b>一种治法</b>，然后等<b>六周</b>看结果</span>。<b>所以这里的「一步」是六周和一个真实的人。</b><span class='w'>这就是为什么样本效率在这个场景下不是学术问题</span>——<b>每多试一次，就有一个人承担了可能更差的治疗。</b><span class='k'>遗憾这个判据在这里有非常具体的含义：它数的是「本可以治好却没治好的人数」。</span>", "<b>第二问（为什么是老虎机不是 MDP）是这一页真正的考点，答案有两层。</b><b>第一层：<span class='k'>病人之间是独立的</span></b>——<span class='w'>你给这个病人做手术，不改变下一个病人的病情</span>。<b>所以没有状态转移。</b><b>第二层：<span class='k'>每个病人只治一次</span></b>——<b>没有「这一步做什么会影响我下一步在这个病人身上能做什么」。</b><span class='w'>两层合起来，延迟后果这个维度确实不存在，老虎机建模是合适的。</span>", "<b>但要补一句这个建模丢掉了什么，否则你会以为老虎机是万能的。</b><span class='w'>它丢掉了<b>病人之间的差异</b></span>——<b>实际上年轻人和老年人、骨折严重程度不同的人，最优治法可能不同。</b><span class='k'>把这件事加回去，就是「上下文老虎机」（contextual bandit）</span>：<b>每次拉臂前先看到一个上下文（病人特征），再决定拉哪条。</b><span class='w'>课件这一讲不讲它，但它是这条线上最实用的那个变体</span>——<b>而且它正是你那个「不同难度的 query 该用不同配置」问题的标准形式。</b>", "<b>这个例子还有一个值得注意的设计：<span class='k'>奖励是二值的（伯努利）</span>。</b><b>这不是为了简化计算，而是为了后面的贝叶斯部分铺路</b>——<span class='w'>伯努利的共轭先验是 Beta 分布，于是 p48 起的 Thompson 采样可以写成闭式的「<code>Beta(α, β)</code> 加一个计数」</span>。<span class='k'>换成连续奖励，后验更新就没这么漂亮了</span>（<b>要用 p44 的高斯版本</b>）。<b>所以这个例子从一开始就是为了把三个算法都能手算而设计的。</b>"]},
{"r": [18, 20], "t": "贪心在这个例子上：第一轮就可能走偏", "star": 3, "quote": "<b>Greedy</b>: 1 Sample each arm once &nbsp;·&nbsp; Take action a1 (r ∼ Bernoulli(0.95)), get <b>+1</b>, Q̂(a1) = 1 &nbsp;·&nbsp; Take action a2 (r ∼ Bernoulli(0.90)), get <b>+1</b>, Q̂(a2) = 1 &nbsp;·&nbsp; Take action a3 (r ∼ Bernoulli(0.1)), get <b>0</b>, Q̂(a3) = 0 &nbsp;|&nbsp; <b>2 What is the probability of greedy selecting each arm next? Assume ties are split uniformly.</b>", "eq": "先把每条臂各拉一次（这是常规的初始化）：\n  a1 → +1  ⇒  Q̂(a1) = 1\n  a2 → +1  ⇒  Q̂(a2) = 1\n  a3 →  0  ⇒  Q̂(a3) = 0\n\n下一步贪心选谁？\n  arg max 在 a1 和 a2 之间打平\n  按「打平均匀分」的约定：\n    P(a1) = 1/2    P(a2) = 1/2    P(a3) = 0", "say": "老师在讲这道题时点出了那个约定：如果在所有打平的臂之间按「<b>一除以臂数</b>」的概率均匀分，那就会以那个概率选中最优动作。<span class='w'>不说清打平怎么处理，这道题就没有唯一答案。</span>", "one": "各拉一次之后 <code>a1</code> 和 <code>a2</code> 打平，<b>各 1/2</b>，而 <code>a3</code> 被判了死刑。", "pts": ["<b>这个演示最该注意的是：<span class='k'>所有数字都是「运气」，不是「实力」</span>。</b><b><code>a1</code> 拿到 +1 不奇怪（真实概率 0.95），<code>a2</code> 拿到 +1 也不奇怪（0.90），<code>a3</code> 拿到 0 同样不奇怪（0.10）。</b><span class='w'>但这三个数字让你以为 <code>a1</code> 和 <code>a2</code> 一样好、<code>a3</code> 一文不值</span>——<b>而真实情况是 <code>a1</code> 比 <code>a2</code> 好一点点，<code>a3</code> 确实很差。</b><span class='k'>单次样本的信息量就是这么少。</span>", "<b><code>a3</code> 的处境是贪心最危险的地方，值得单独说。</b><span class='w'><code>Q̂(a3) = 0</code>，而另外两条是 1，所以贪心<b>永远</b>不会再拉它</span>。<b>在这个例子里这碰巧是对的（<code>a3</code> 确实最差）。</b><span class='k'>但换一组运气——比如 <code>a1</code> 第一次拿到 0——贪心就会永远不碰真正最好的那条臂</span>。<b>而那个概率是 0.05，不算小。</b><span class='w'>也就是说：这个三臂问题上，贪心有大约 5% 的概率一开始就把最优臂判死刑。</span>", "<b>算一下贪心在这个例子上的期望遗憾，你会看到「线性」的具体样子。</b><span class='k'>假设它锁死在 <code>a2</code>（差距 0.05），那么 <code>L_t = 0.05t</code></span>；<span class='w'>如果不幸锁死在 <code>a3</code>（差距 0.85），<code>L_t = 0.85t</code></span>。<b>两种情况下遗憾都随 t 线性增长，区别只是斜率。</b><span class='k'>而「斜率不为零」就意味着：跑一百万步，你的平均每步损失和第一步时一样大。</span>", "<b>打平处理那个约定看起来是技术细节，但它在这里决定了答案，值得说清楚它为什么重要。</b><span class='w'>如果实现用的是「返回第一个最大值」（numpy 的默认行为），那么 <code>P(a1) = 1, P(a2) = 0</code></span>——<b>贪心会系统性地偏向编号小的臂。</b><span class='k'>而那个偏好完全来自实现细节，不来自数据</span>。<b>L04 p30 说过同一件事：打平时该随机挑，否则你会误以为算法学到了什么。</b>", "<b>这一页还暗含了一个很多人不会注意的设计选择：<span class='k'>先把每条臂各拉一次</span>。</b><b>这不是算法的一部分，而是一个初始化约定。</b><span class='w'>不这么做的话，<code>N_t(a) = 0</code>，样本平均是 <code>0/0</code>，而 UCB 的 <code>√(2log t / N_t(a))</code> 会除零</span>。<span class='k'>标准做法要么是「每条臂先拉一次」，要么是把没拉过的臂的 UCB 定义成 <code>+∞</code></span>——<b>后者更优雅，而且它本身就体现了「乐观」：没试过的东西，先假设它无限好。</b>", "<b>最后把贪心的失败机制和 L04 p15 的那个坑对一次，确认它们是同一件事。</b><span class='k'>L04 说：确定性贪心策略学不到它没试过的动作，因为不试 ⇒ 没数据 ⇒ 看起来差 ⇒ 更不试</span>。<b>这一页是那句话在老虎机上的最小演示</b>——<span class='w'>没有状态、没有转移，纯粹就是这个循环本身</span>。<b>所以如果你在 L04 那里觉得这个坑抽象，这一页就是它的具体样子。</b>"]},
{"r": [21, 23], "t": "ε-贪心在这个例子上，以及「线性」到底多糟", "star": 3, "quote": "(ε-greedy on the same example) &nbsp;·&nbsp; With probability 1−ε select arg max; with probability ε select a random action &nbsp;|&nbsp; <b>Always will be making a sub-optimal decision ε fraction of the time</b>", "eq": "设 ε = 0.1、三条臂，当前 arg max 是 a1：\n  P(选 a1) = 1 − ε + ε/3 = 0.9 + 0.0333 = 0.9333\n  P(选 a2) = ε/3 = 0.0333\n  P(选 a3) = ε/3 = 0.0333\n\n注意：明显很差的 a3 仍然拿到 0.0333 —— 而且这个数永远不降\n\n期望单步遗憾 ≈ 0.0333 × 0.05 + 0.0333 × 0.85 ≈ 0.03\n于是 L_t ≈ 0.03 t  —— 线性", "one": "探索是有了，<b>但 <code>a3</code> 永远分到 0.0333 的概率</b>，而它明明已经被判了死刑。", "pts": ["<b>把这个概率算出来，ε-贪心的毛病就一目了然了。</b><span class='k'>ε = 0.1、三条臂时，每条非贪心臂拿到 <code>ε/3 = 0.0333</code></span>（<b>贪心臂拿到 <code>1 − ε + ε/3 = 0.9333</code>，注意不是 0.9——L04 p18 讲过这个</b>）。<span class='w'>而 <code>a3</code> 的真实参数是 0.1，你已经拉过它、知道它很差</span>——<b>可它仍然每三十次就被拉一次。</b><span class='k'>第十二讲 p2 会用这个数字和 UCB 做对比：UCB 给它的概率是<b>恰好零</b>。</span>", "<b>把这个浪费累加起来，就得到线性遗憾的具体数字。</b><span class='k'>每步的期望额外损失 ≈ <code>0.0333 × 0.05 + 0.0333 × 0.85 ≈ 0.03</code></span>。<b>于是 <code>L_t ≈ 0.03 t</code>。</b><span class='w'>跑十万步，遗憾约三千——相当于三千个病人本可以治好却没治好</span>。<b>而且这个数字<b>不会</b>因为你跑得更久而改善，它只会继续线性增长。</b>", "<b>对比一下 <code>log t</code> 的量级，你就知道这个差别有多大。</b><span class='k'>线性：<code>0.03 × 100000 = 3000</code></span>；<span class='k'><code>log</code>：<code>log(100000) ≈ 11.5</code>，乘上常数也就几百</span>。<b>相差一个数量级以上，而且 t 越大差得越多。</b><span class='w'>这就是为什么 p25 的下界（<code>log t</code>）和 p34 的上界（UCB 达到 <code>log t</code>）合起来是一个重要结果</span>——<b>它说明「只能做到对数」而且「确实能做到对数」。</b>", "<b>最后把这一片的结论收一次，因为它是后半讲的全部动机。</b><span class='k'>贪心线性（探索不够），固定 ε-贪心也线性（探索过头且无差别）</span>。<b>两个我们一直在用的算法，按遗憾这把尺子都不及格。</b><span class='w'>而问题的根子是：它们的探索<b>不看不确定性</b></span>——<b>贪心完全不探索，ε-贪心对所有臂一视同仁地探索。</b><span class='k'>p26 起的「乐观面对不确定」要做的，就是让探索量和不确定性挂钩。</span>", "<b>再把「线性遗憾」这个判据的严厉之处说清楚，因为它比直觉上严厉得多。</b><span class='k'>线性意味着「平均每步的损失不趋于零」</span>——<b>也就是说，哪怕跑到时间的尽头，你每一步仍然在以固定的速率犯错。</b><span class='w'>而「次线性」意味着平均每步损失趋于 0</span>，<b>也就是你最终会几乎总是做对。</b><span class='k'>所以这条线划分的不是「好与更好」，而是「学得会」与「学不会」。</span>", "<b>最后给一条实践上的提醒，它和这个例子直接相关。</b><span class='w'>固定 ε 在实践中仍然极其常用（DQN 就是把 ε 衰减到 0.01 之后固定住）</span>，<span class='k'>而那是因为真实环境常常是非平稳的——保留一点探索是为了跟上变化，不是为了学得更好</span>。<b>所以「固定 ε 是线性遗憾」这个结论的前提是「环境平稳」。</b><span class='w'>换个前提，结论就不适用了</span>——<b>这和 L09 p9 老师澄清「单调改进假设环境平稳」是同一类限定。</b>"], "tbl": {"head": ["t", "线性遗憾（≈0.03t）", "log 遗憾（≈c·log t）", "差距"], "rows": [["100", "3", "约 5·c", "<span class='w'>差不多</span>"], ["10 000", "300", "约 9·c", "<span class='k'>一个数量级</span>"], ["100 000", "<b>3000</b>", "约 11.5·c", "<b>两个数量级</b>"], ["<b>含义</b>", "<span class='w'>每步损失不降，永远学不会</span>", "<span class='k'>平均每步损失趋于 0</span>", "<b>这条线分的是「学得会」与「学不会」</b>"]]}},
{"r": [24, 24], "t": "两类遗憾界", "star": 2, "quote": "<b>Problem independent</b>: Bound how regret grows as a function of T, the total number of time steps the algorithm operates for &nbsp;·&nbsp; <b>Problem dependent</b>: Bound regret as a function of the number of times we pull each arm and the gap Δ_a", "one": "<b>与问题无关的界</b>只看 T；<b>与问题有关的界</b>把差距写进去。", "say": "老师补了一句行情：<b>MDP 上大多数界是与问题无关的，而老虎机上有很多与问题有关的界</b>。", "pts": ["<b>两类界的差别，用一句话说清：<span class='k'>要不要把「这个问题有多难」写进结论里</span>。</b><span class='w'>与问题无关（problem independent）：只用 T 和臂数 m，对<b>所有</b>老虎机实例都成立</span>——<b>典型形状是 <code>O(√(mT log T))</code>。</b><span class='k'>与问题有关（problem dependent）：把差距 <code>Δ_a</code> 写进去</span>——<b>典型形状是 <code>O(Σ_a log T / Δ_a)</code>。</b>", "<b>两者不是谁更强，而是在不同的 T 范围内各自更紧，这一点值得想清楚。</b><span class='k'>T 很大时，<code>log T</code> 远小于 <code>√T</code>，所以与问题有关的界更好</span>；<span class='w'>但如果某个 <code>Δ_a</code> 极小，<code>1/Δ_a</code> 会爆炸，那时与问题无关的界反而更有意义</span>。<b>直觉上也对：两条臂几乎一样好时，你区分不出它们，但区分不出的代价也很小。</b><span class='k'>所以实践中常把两者取最小值当作真正的界。</span>", "<b>老师那句行情对比也值得记，它解释了为什么这一讲要从老虎机讲起。</b><span class='w'>MDP 上大多数界是与问题无关的</span>——<b>因为 MDP 的「难度」没法用一两个数（像差距）概括，它牵涉整个转移结构。</b><span class='k'>而老虎机的难度恰好可以用一组差距完全刻画</span>，<b>于是能得到更精细的、与问题有关的结论。</b><span class='w'>这是老虎机作为「干净的实验场」的又一个好处。</span>"]},
{"r": [25, 25], "t": "下界：常数遗憾做不到", "star": 3, "quote": "Use lower bound to determine <b>how hard this problem is</b> &nbsp;·&nbsp; The performance of any algorithm is determined by <b>similarity between optimal arm and other arms</b> &nbsp;·&nbsp; <b>Hard problems have similar looking arms with different means</b> &nbsp;·&nbsp; formally described by the gap Δ_a and the similarity in distributions <b>D_KL(R^a ‖ R^{a*})</b> &nbsp;|&nbsp; <b>Theorem (Lai and Robbins)</b>: Asymptotic total regret is <b>at least logarithmic</b> in number of steps &nbsp;·&nbsp; <b>lim_{t→∞} L_t ≥ log t Σ_{a|Δ_a>0} Δ_a / D_KL(R^a ‖ R^{a*})</b> &nbsp;·&nbsp; <b>Promising in that lower bound is sublinear</b>", "eq": "Lai & Robbins 下界：\n\n  lim_{t→∞} L_t  ≥  log t · Σ_{a: Δ_a > 0}  Δ_a / D_KL(R^a ‖ R^{a*})\n\n读法：\n  分子 Δ_a —— 这条臂有多坏（拉一次损失多少）\n  分母 D_KL —— 它和最优臂有多「像」（越像越难区分）\n\n两条臂越像 ⇒ D_KL 越小 ⇒ 这一项越大 ⇒ 遗憾下界越高", "one": "<b>任何算法的遗憾至少是 <code>log t</code> 量级。</b>常数遗憾做不到——但次线性是能指望的。", "pts": ["<b>下界这个东西的作用要先说清楚，它和上界的角色完全不同。</b><span class='k'>上界说「某个算法能做到这么好」，是关于<b>算法</b>的陈述</span>；<span class='w'>下界说「<b>任何</b>算法都好不过这个」，是关于<b>问题</b>的陈述</span>。<b>所以下界告诉你的是这个问题有多难，而不是某个算法有多笨。</b><span class='k'>课件 p25 第一句就是这个意思：<em>Use lower bound to determine how hard this problem is</em>。</span>", "<b>而这个下界的内容，一句话：<span class='w'>常数遗憾做不到，<code>log t</code> 是你能指望的最好结果</span>。</b><b>「常数遗憾」意味着你试错几次之后就再也不犯错了，总损失有界。</b><span class='k'>定理说这不可能</span>——<b>因为你永远无法<b>完全确定</b>哪条臂最好，所以必须持续地付出少量探索代价。</b><span class='w'>而那个代价累积起来，至少是 <code>log t</code>。</span>", "<b>课件最后那句 <em>Promising in that lower bound is sublinear</em> 值得体会它的语气。</b><span class='k'>下界是 <code>log t</code>，而 <code>log t</code> 是<b>次线性</b>的</span>——<b>所以「学得会」这件事在原则上是可能的。</b><span class='w'>如果下界是线性的，那就意味着没有任何算法能学会，整个研究方向就没了</span>。<b>所以这个「坏消息」（做不到常数）同时是个「好消息」（能做到次线性）。</b><span class='k'>而 p34 会告诉你 UCB 恰好达到了这个 <code>log t</code>，上下界吻合。</span>", "<b>那个表达式的结构值得逐项读，因为它精确地说出了「什么样的老虎机难」。</b><span class='k'>分子是 <code>Δ_a</code>（这条臂多坏），分母是 <code>D_KL(R^a ‖ R^{a*})</code>（它和最优臂的分布有多不像）</span>。<b>分母越小（两条臂越像），这一项越大。</b><span class='w'>课件的原话是 <em>Hard problems have similar looking arms with different means</em></span>——<b>难的不是「差得远」，是「看起来像但其实不一样」。</b><span class='k'>断脚趾例子里的 <code>a1</code>（0.95）和 <code>a2</code>（0.90）正是这种情形。</span>", "<b>把分子分母合起来再想一层，你会发现一个有点反直觉的结论。</b><span class='w'>差距 <code>Δ_a</code> 极小的臂，分子小但分母也小</span>——<b>而分母（KL 散度）大致按 <code>Δ_a²</code> 衰减，分子只按 <code>Δ_a</code> 衰减。</b><span class='k'>所以整项大致是 <code>1/Δ_a</code>，<b>差距越小，贡献的遗憾越大</b></span>。<b>这和 p34 的 UCB 上界形状完全一致。</b><span class='w'>直觉：区分两条几乎一样的臂需要极多样本，而那些样本里有一半花在了次优臂上。</span>"], "tbl": {"head": ["老虎机实例", "差距", "KL", "难度", "遗憾下界的贡献"], "rows": [["两条臂差很远", "<span class='k'>大</span>", "<span class='k'>大</span>", "<span class='k'>容易</span>", "小（几次就能区分）"], ["两条臂很接近", "<span class='w'>小</span>", "<span class='w'>更小（约 Δ²）</span>", "<span class='w'>难</span>", "<b>大（约 1/Δ）</b>"], ["<b>课件原话</b>", "—", "—", "<b>Hard problems have similar looking arms with different means</b>", "—"]]}},
{"r": [26, 26], "t": "乐观面对不确定", "star": 3, "quote": "<b>Approach: Optimism in the Face of Uncertainty</b> &nbsp;·&nbsp; Choose actions that <b>might</b> have a high value &nbsp;·&nbsp; Why? &nbsp;·&nbsp; <b>Two outcomes:</b>", "one": "挑<b>有可能</b>很好的那条。<span class='k'>两种结果，怎么样你都赢。</span>", "pts": ["<b>课件这一页只写了「Why? Two outcomes:」就把答案留给了课堂，而那个答案是整条线的核心，值得自己补出来。</b><span class='k'>你挑了一条「乐观估计最高」的臂去拉，接下来只有两种可能</span>：<br><b>① 它真的很好</b> ⇒ <span class='k'>那你这一拉赚到了，遗憾小</span>。<br><b>② 它其实不好</b> ⇒ <span class='k'>那你拿到了一个低奖励，它的估计会下降，以后就不会再被乐观地高估了</span>。<b>也就是说：要么你赚了，要么你学到了。</b>", "<b>这就是 <code>kp</code> 那句「一次乐观的拉动<b>两难都赢</b>」的意思，而它的分量值得强调。</b><span class='w'>探索与利用的「两难」之所以是两难，是因为通常它们互相冲突</span>——<b>探索就得放弃当下的收益，利用就学不到新东西。</b><span class='k'>而乐观把这个冲突消解了：同一个动作同时服务于两者</span>。<b>这不是折中，是找到了一个两边都满足的选法。</b>", "<b>但要注意「乐观」必须是<span class='k'>有依据的</span>乐观，否则它退化成乱猜。</b><span class='w'>如果你对一条臂的乐观估计是随便加的，那么情形②里「估计会下降」这一步就不成立</span>——<b>你可以永远乐观下去。</b><span class='k'>所以乐观的幅度必须和「你对这条臂有多不确定」挂钩</span>：<b>拉得越少，越不确定，乐观加得越多；拉得越多，估计越准，乐观加得越少。</b><span class='w'>p27–p28 要做的就是把这个「加多少」算出来。</span>", "<b>最后把乐观和前面两个算法对比一次，三者的探索策略就清楚了。</b><span class='w'>贪心：不探索</span>；<span class='w'>ε-贪心：无差别地探索（所有非贪心臂等概率）</span>；<span class='k'>乐观：按不确定性探索——你对它越没把握，它的优先级越高</span>。<b>第三种才是把探索预算花在刀刃上。</b><span class='k'>而这正是为什么前两个是线性遗憾、第三个是 <code>log t</code>。</span>"]},
{"r": [27, 27], "t": "置信上界（UCB）", "star": 3, "quote": "Estimate an <b>upper confidence U_t(a)</b> for each action value, such that <b>Q(a) ≤ U_t(a) with high probability</b> &nbsp;·&nbsp; This depends on the number of times <b>N_t(a)</b> action a has been selected &nbsp;·&nbsp; Select action maximizing Upper Confidence Bound: <b>a_t = arg max_{a∈A} U_t(a)</b>", "eq": "对每条臂维护一个置信上界 U_t(a)，使得\n    Q(a) ≤ U_t(a)   以高概率成立\n\nU_t(a) 依赖 N_t(a)（这条臂被拉过多少次）：\n    拉得少 ⇒ 不确定 ⇒ U 高出 Q̂ 很多\n    拉得多 ⇒ 确定   ⇒ U 贴近 Q̂\n\n每步选：a_t = arg max_a U_t(a)", "one": "给每条臂算一个<b>高概率上界</b>，然后<b>贪婪地选上界最大的</b>。", "say": "老师在这里点明了一个实现上的后果：<b>每拿到一个奖励，你要更新<b>所有</b>臂的置信上界</b>，然后再选下一个动作，如此反复。<span class='w'>为什么是「所有」而不只是刚拉过的那条？p28 之后会给出原因——上界里有一项依赖 t（总步数），而 t 每步都在涨。</span>", "pts": ["<b>UCB 的结构可以拆成两半，而这两半的分工值得记死。</b><span class='k'><code>U_t(a) = Q̂_t(a) + 半径</code></span>——<b>前一半是「我对它的估计」（利用），后一半是「我对这个估计有多没把握」（探索）。</b><span class='w'>于是一条臂能被选中有两条路</span>：<b>要么它的估计确实高，要么你对它特别没把握。</b><span class='k'>两条路加起来，就是 p26 说的「两难都赢」。</span>", "<b>「以高概率成立」这个限定要当真，它是整套推导的技术核心。</b><span class='w'>你没法保证 <code>Q(a) ≤ U_t(a)</code> 永远成立</span>——<b>样本总有可能极端倒霉。</b><span class='k'>你能做的是：让它以 <code>1 − δ</code> 的概率成立，而 δ 由你定</span>。<b>而「所有臂、所有时刻都成立」这个更强的要求，要靠并集界去控制</b>（<span class='w'>p31 会做这件事，而那正是 δ/t² 和 Basel 问题登场的地方</span>）。", "<b>那句 <em>This depends on the number of times N_t(a) action a has been selected</em> 是把「乐观」和「不确定性」绑在一起的那一步。</b><span class='k'>半径必须随 <code>N_t(a)</code> 递减</span>——<b>拉得越多，你越确定，加的乐观越少。</b><span class='w'>这正是 p26 说的「乐观必须有依据」</span>。<b>如果半径是个不随 N 变的常数，那么被拉过一千次的臂和从没拉过的臂享受同样的加成</b>——<span class='k'>那就退化成了「所有估计一起平移」，等于没加。</span>", "<b>老师那句「每步要更新所有臂」现在还看不出原因，但值得先记下来，因为它是这一讲最容易被忽略的一句。</b><span class='w'>直觉上你会以为：只有刚拉过的那条臂的 <code>N</code> 变了，所以只需要更新它</span>。<span class='k'>但半径里还有一个依赖 <b>t</b> 的项，而 t 每步都在涨</span>——<b>于是<b>没被拉</b>的那些臂，它们的上界反而在<b>上升</b>。</b><span class='w'>p32 的科研格会把这件事的含义说透，它是 UCB 最漂亮的一个机制。</span>"]},
{"r": [28, 28], "t": "Hoeffding 不等式：半径从哪来", "star": 3, "quote": "<b>Theorem (Hoeffding's Inequality)</b>: Let X_1, ..., X_n be i.i.d. random variables in <b>[0,1]</b>, and let <b>X̄_n = (1/n) Σ_{τ=1}^{n} X_τ</b> be the sample mean. Then &nbsp;·&nbsp; <b>P( E[X] > X̄_n + u ) ≤ exp(−2n u²)</b>", "eq": "Hoeffding：X_1..X_n 独立同分布、取值在 [0,1]，X̄_n 是样本均值，则\n\n    P( E[X] > X̄_n + u )  ≤  exp(−2n u²)\n\n读法：真均值超出「样本均值 + u」的概率，随 n 和 u 指数衰减\n\n反解：令  exp(−2n u²) = δ / t²，解出\n\n    u = √( (1/2n) · log(t² / δ) )\n\n这个 u 就是 UCB 的半径", "one": "<b>半径不是拍出来的，是从 Hoeffding 反解出来的。</b>", "say": "老师在板书上推这一步时，为了「和 Hoeffding 保持同一套记号」，把那个偏移量<b>写成了 μ</b>——原话大意是「我们想让『经验均值加上 μ』小于真均值的概率等于 δ/t²，既然如此就能解出 μ 该是多少」，最后得到 <code>μ = √( (1/2n)·log(t²/δ) )</code>。<br><span class='w'><b>注意这个 μ 是<b>半径</b>，不是真均值</b>。</span>课件原文的 Hoeffding 里这个量写作 <code>u</code>，而 μ 在概率论里几乎总是指均值——两个符号在板上撞了车。<b>读的时候按「半径」理解，别和 <code>E[X]</code> 混。</b>", "pts": ["<b>这是 <code>kp</code> 点名的第一处陷阱，务必先把符号理清：<span class='w'>板上那个 μ 是<b>半径</b>（Hoeffding 原式里的 <code>u</code>），不是均值</span>。</b><b>概率论里 μ 几乎总是指期望，所以这个撞车极其容易误导。</b><span class='k'>判断方法：它出现在「<code>X̄_n + ?</code>」这个位置上，那就是半径</span>；<b>出现在不等式左边 <code>E[X]</code> 的位置上，那才是均值。</b>", "<b>Hoeffding 本身说的是一件很朴素的事，值得先用人话说一遍。</b><span class='k'>你用 n 个样本的平均去估真均值，那么「真均值比你的估计高出 u 以上」这件事，概率随 <code>n</code> 和 <code>u²</code> 指数地小</span>。<b>样本越多越不可能，偏差要求越大越不可能。</b><span class='w'>注意它要求样本在 <code>[0,1]</code> 之间</span>——<b>这正是断脚趾例子用二值奖励的方便之处。</b><span class='k'>奖励范围变大，界会按范围的平方变松。</span>", "<b>而这一步真正的技巧是<span class='k'>反过来用</span>它：不是问「给定 u，概率是多少」，而是问「要让概率等于某个值，u 该多大」。</b><b>令 <code>exp(−2nu²) = δ/t²</code>，两边取对数解出 <code>u = √( (1/2n)·log(t²/δ) )</code>。</b><span class='w'>于是半径不是拍脑袋定的，它是「你要多大的信心」倒推出来的</span>。<span class='k'>这是整套置信界方法的标准动作：先定失败概率，再解出需要多宽的区间。</span>", "<b>为什么右边偏偏取 <code>δ/t²</code> 而不是 δ，这是这一步最该问的问题，而答案要等到 p31。</b><span class='w'>老师在课上也说了「我们待会儿会看到为什么要选这个特定的概率」</span>。<span class='k'>简短的答案：因为你要让界在<b>所有</b>时刻都成立，而不只是某一个时刻</span>——<b>于是要对 t 做并集界，而 <code>Σ_t 1/t²</code> 恰好收敛。</b><span class='w'>如果取成 δ，<code>Σ_t δ</code> 发散，整个论证就垮了。</span>", "<b>最后记一个这个半径的量纲感，它会让后面的结论容易接受。</b><span class='k'>半径大致是 <code>√(log t / n)</code></span>——<b>分母上的 n 开根号，所以样本翻四倍，半径减半（和标准误差同阶）；分子里的 <code>log t</code> 增长极慢。</b><span class='w'>两相比较：<code>n</code> 的衰减比 <code>log t</code> 的增长快得多</span>，<b>所以只要一条臂持续被拉，它的半径就会持续缩小。</b><span class='k'>而如果一条臂<b>不</b>被拉，n 不变而 t 在涨，它的半径反而会慢慢变大——这是 p32 的要点。</span>"]},
{"r": [29, 33], "t": "高概率遗憾界：板书上的完整推导", "star": 3, "quote": "High Probability Regret Bound for UCB Multi-armed Bandit &nbsp;|&nbsp; <b>Regret(UCB, T) = Σ_{t=1}^{T} [ Q(a*) − Q(a_t) ]</b> &nbsp;·&nbsp; （这五页课件上几乎是空的——整段推导是在黑板上做的）", "eq": "第 1 步 —— 定半径（p28 已做）\n  U_t(a) = Q̂_t(a) + √( (1/2N_t(a)) · log(t²/δ) )\n  单个臂、单个时刻失败的概率 ≤ δ/t²\n\n第 2 步 —— 两情形引理\n  若所有置信界都成立，则对任意 t：  U_t(a_t) ≥ Q(a*)\n    情形一 a_t = a*：  U_t(a*) ≥ Q(a*)      ← 置信界成立的直接含义\n    情形二 a_t ≠ a*：  U_t(a_t) ≥ U_t(a*) ≥ Q(a*)\n                       ↑ 因为 UCB 选的就是上界最大的那条\n\n第 3 步 —— 并集界（对所有臂、所有时刻）\n  失败概率 ≤ Σ_{a=1}^{m} Σ_{t=1}^{∞} δ/t²  =  m·δ·Σ_t t^{-2}\n  而 Σ_{t=1}^{∞} t^{-2} = π²/6 < 2        ← Basel 问题\n  ⇒ 失败概率 ≤ 2mδ\n  ⇒ 以至少 1 − 2mδ 的概率，所有置信界在所有时刻都成立\n\n第 4 步 —— 把遗憾套进去\n  Q(a*) − Q(a_t)  ≤  U_t(a_t) − Q(a_t)        ← 用第 2 步\n                  ≤  2 · 半径(a_t)             ← 上界与真值相差至多两个半径\n  再对 t 求和即得 log 量级的高概率遗憾界", "one": "<b>这五页课件是空的——推导在黑板上。</b>四步：定半径 → 两情形引理 → 并集界 → 套进遗憾。", "say": "这一段是全讲最该跟着推一遍的地方，老师也在课上让大家「和邻座讨论一下」。<br><b>两情形引理</b>她是这么引的：如果所有置信界都成立，那么 <code>U_t(a_t)</code>——也就是<b>你实际选的那条臂</b>的上界——会大于等于 <code>Q(a*)</code>，也就是最优臂的真值。<span class='k'>「为什么？这里有两种情形：要么 a_t 就是 a*，要么不是。」</span><br><b>并集界与 Basel</b>：「现在我们对所有时刻取并集、对所有臂取并集，每个是 δ 除以 t 平方。注意如果你把 t 从 1 加到无穷的 <code>t^{-2}</code>，那等于 <b>π² / 6，它小于 2</b>。所以求和之后你得到 <code>2mδ</code>。」她还补了一句：<span class='w'>「这不是我期望你们见过的东西……算是个有趣的小知识。」</span><br>而这个无穷求和还顺带回答了课堂上的一个提问：<b>正因为求和到无穷，这个界对无限 horizon 也成立。</b>", "pts": ["<b>先说这五页为什么在 PDF 上几乎是空的：<span class='k'>整段推导是在黑板上做的</span>。</b><b>所以光看课件你什么也得不到，必须跟着实录走一遍。</b><span class='w'>这也是这一讲最值得花时间的地方</span>——<b>它是整门课里少数几次完整地、从头到尾地证一个界。</b><span class='k'>而这个四步结构（定半径 → 引理 → 并集界 → 代回去）在任何「高概率界」的论证里都一样。</span>", "<b>第 2 步的两情形引理是 <code>kp</code> 点名的第二处，它的作用是<b>把一个不可观测的量消掉</b>。</b><span class='w'>遗憾的定义里有 <code>Q(a*)</code>——最优臂的真值，而你根本不知道它是多少</span>。<span class='k'>引理说：只要置信界都成立，<code>U_t(a_t) ≥ Q(a*)</code></span>，<b>于是你可以把不可观测的 <code>Q(a*)</code> 换成可计算的 <code>U_t(a_t)</code>。</b><b>这一步是整个推导能进行下去的关键。</b>", "<b>而引理本身的证明只有两行，值得自己走一遍，因为它漂亮得出奇。</b><span class='k'>情形一：<code>a_t = a*</code>。那么 <code>U_t(a_t) = U_t(a*) ≥ Q(a*)</code></span>——<b>这就是「置信界成立」的字面意思。</b><span class='k'>情形二：<code>a_t ≠ a*</code>。那么 <code>U_t(a_t) ≥ U_t(a*)</code>（因为 UCB 选的就是上界最大的那条），而 <code>U_t(a*) ≥ Q(a*)</code></span>。<b>两步相连得证。</b><span class='w'>注意情形二用到了<b>算法的定义</b>（选 arg max 上界）——所以这个引理只对 UCB 成立，换个算法就不对了。</span>", "<b>第 3 步的并集界是 <code>kp</code> 点名的第三处，而它要处理的是一个很实际的问题。</b><span class='w'>你证的是「某一条臂在某一个时刻」的界</span>，<span class='k'>而你需要的是「所有臂在所有时刻」都成立</span>——<b>否则只要有一次失手，上面那个引理就断了。</b><span class='w'>并集界说：若干个事件至少有一个发生的概率，不超过各自概率之和</span>。<b>于是失败概率 ≤ <code>Σ_a Σ_t δ/t²</code>。</b>", "<b>而这个和之所以收敛，靠的正是 p28 那个看起来随意的 <code>δ/t²</code> 选法。</b><span class='k'><code>Σ_{t=1}^{∞} t^{-2} = π²/6 ≈ 1.645 < 2</code></span>——<b>这就是 Basel 问题，欧拉 1734 年解决的那个经典结果。</b><span class='w'>于是总失败概率 ≤ <code>m·δ·(π²/6) < 2mδ</code></span>，<b>也就是以至少 <code>1 − 2mδ</code> 的概率，所有界在所有时刻成立。</b><span class='k'>如果当初取的是 δ（不除 t²），<code>Σ_t δ</code> 发散，这一步就做不了</span>——<b>那个 <code>t²</code> 是为了这里才放进去的。</b>", "<b>这里还藏着一个回答课堂提问的要点，值得单独指出：<span class='k'>因为求和到了无穷，这个界对<b>无限 horizon</b> 也成立</span>。</b><b>也就是说，你不需要事先知道要跑多久。</b><span class='w'>而另一位同学问的正是这件事的反面：如果你<b>确实</b>知道 horizon T，那就可以把 t 直接设成 T，于是 <code>log</code> 那一项变成常数，界会紧一些</span>。<b>老师承认了这一点（「你说得对，我这里说得稍微不精确」）。</b><span class='k'>两种做法都对，取决于你知不知道 T。</span>", "<b>第 4 步把前三步串起来，而串法只有两个不等号。</b><span class='k'>第一个：<code>Q(a*) − Q(a_t) ≤ U_t(a_t) − Q(a_t)</code></span>（<b>用第 2 步的引理，把 <code>Q(a*)</code> 换掉</b>）；<span class='k'>第二个：<code>U_t(a_t) − Q(a_t) ≤ 2 × 半径</code></span>（<b>因为上界高出估计一个半径，而估计离真值也不超过一个半径</b>）。<span class='w'>于是单步遗憾被一个<b>可以算的</b>量控制住了</span>，<b>再对 t 求和，就得到 <code>log</code> 量级的结果。</b>", "<b>最后把这个界的性质说准，因为它和前面那些「期望遗憾」的结论不是一回事。</b><span class='k'>这是一个<b>高概率</b>界：以至少 <code>1 − 2mδ</code> 的概率，遗憾不超过某个量</span>；<span class='w'>而 p11 定义的遗憾是<b>期望</b>意义上的</span>。<b>高概率界更强——它排除了「平均还行但偶尔极差」的情形。</b><span class='k'>而代价是界里多了一个 δ，而且它出现在 <code>log(1/δ)</code> 里</span>——<b>你要的信心越高，界越松，但只是对数地松。</b>"], "tbl": {"head": ["步骤", "做什么", "用掉什么", "kp 标的陷阱"], "rows": [["① 定半径", "<code>exp(−2nu²) = δ/t²</code> 反解出 u", "Hoeffding", "<span class='w'>板上写成 μ，但它是<b>半径</b>不是均值</span>"], ["② 两情形引理", "<code>U_t(a_t) ≥ Q(a*)</code>", "<b>UCB 的定义（选 arg max 上界）</b>", "<span class='k'>作用是把不可观测的 Q(a*) 消掉</span>"], ["③ 并集界", "失败概率 ≤ 2mδ", "<code>Σ t^{-2} = π²/6 < 2</code>（Basel）", "<span class='k'>这就是当初取 δ/t² 的原因；也让界对无限 horizon 成立</span>"], ["④ 代回遗憾", "单步遗憾 ≤ 2×半径", "①②", "得到 <code>log</code> 量级的<b>高概率</b>界"]]}, "res": {"tag": "推断", "v": "<b>这四步的结构，比它证出来的那个界更值得你带走——因为它是「怎么给一个自适应算法开出可信保证」的标准模板，而你的课题正需要这种保证。</b><br><br><b>把四步抽象一下：</b><br><b>① </b><span class='k'>给每个候选配一个置信区间，宽度由样本量和你要的信心决定</span>；<br><b>② </b><span class='k'>证明一个引理，把你<b>不知道</b>的那个量（真实最优）换成你<b>能算</b>的量</span>；<br><b>③ </b><span class='w'>用并集界把「某一个候选、某一次」的保证升级成「所有候选、所有次」</span>；<br><b>④ </b><b>把前面的结论代回你真正关心的那个指标。</b><br><br><b>第 ③ 步对你尤其要紧，而且很容易被忽略。</b><span class='k'>L04 p42 的最大化偏差，本质上就是「没做并集界」的后果</span>——<b>你对<b>每一个</b>配置的估计都是无偏的、区间也是对的，但你要在 2187 个候选里挑最大的那个，就必须对<b>所有</b>候选同时成立。</b><span class='w'>而「同时成立」要付的价正是这里的 <code>log m</code>（m 是候选数）</span>。<b>所以：候选越多，你给每个候选的区间就必须越宽。</b><br><br><b>落到具体做法上，这给了你一条比 L04 的样本拆分更精细的选择：</b><span class='k'>与其把留出集拆两半，不如给每个候选的 <code>Ĝ</code> 配一个<b>经过并集界修正</b>的置信下界，然后挑<b>下界</b>最大的那个</span>。<b>修正的方式就是把 δ 换成 <code>δ/m</code>（Bonferroni），于是半径里多一个 <code>√log m</code> 的因子——m = 2187 时约是 <code>√7.7 ≈ 2.8</code> 倍。</b><span class='w'>代价是区间宽了约三倍，但换来的是「我报告的那个数，以 1−δ 的概率不高于真值」这个真正的保证</span>。<b>而这正是你在 §4d 想要的那种「上线前的证书」（L10 p16 科研格讨论过它该长什么样）。</b><br><br><span class='k'>注意「挑下界最大」和 p41 那道检验题说的「按下界贪心」不是一回事</span>——<b>那里是在线学习、要继续探索；你这里是离线一次性选择、不再探索。</b><span class='w'>离线选择时按置信下界挑是对的，这正是安全策略改进的标准做法（L15 会讲）。</span>", "ref": "课件 p28–p33 板书推导 · 实录 L11 · L04 p42 · L10 p16 科研格 · 简报 §4d"}},
{"r": [34, 34], "t": "UCB1 与对数遗憾定理", "star": 3, "quote": "This leads to the <b>UCB1</b> algorithm &nbsp;·&nbsp; <b>a_t = arg max_{a∈A} [ Q̂(a) + √(2 log t / N_t(a)) ]</b> &nbsp;|&nbsp; <b>Theorem</b>: The UCB algorithm achieves <b>logarithmic asymptotic total regret</b> &nbsp;·&nbsp; <b>lim_{t→∞} L_t ≤ 8 log t Σ_{a|Δ_a>0} Δ_a</b>", "eq": "UCB1（Auer, Cesa-Bianchi, Fischer 2002）：\n\n    a_t = arg max_a [ Q̂(a) + √( 2 log t / N_t(a) ) ]\n                      └ 利用 ┘   └──── 探索 ────┘\n\n定理：  lim_{t→∞} L_t  ≤  8 log t · Σ_{a: Δ_a > 0} Δ_a\n\n对照 p25 的下界：     L_t  ≥  log t · Σ_a Δ_a / D_KL\n⇒ 上下界都是 log t —— 只差常数", "one": "<b><code>Q̂ + √(2 log t / N)</code></b>——一行公式，上下界吻合。", "say": "老师在这里把那个半径的两个下标掰开讲了一遍，而这是全讲最该记住的一句：<b><code>t</code> 是「总共拉了任何臂多少次」，<code>n</code>（也就是 <code>N_t(a)</code>）是「拉了<b>这一条</b>臂多少次」——两者不是一回事。</b><br><span class='k'>「所以在这个置信界里，有一项按『这条臂被拉了多少次』的速率<b>递减</b>，还有一个 log 项按『任何臂被拉了多少次』的速率<b>递增</b>。这就是为什么每一步之后你都得更新<b>所有</b>臂的置信上界。你有这么两个互相竞争的速率。」</span><br><span class='w'>她还回答了两个提问：如果你知道时间 horizon，可以把 t 直接设成最大值，那样 log 项就固定了；而 δ 是你指定的「这个界成立的概率」。</span>", "pts": ["<b>这个公式只有两项，但两项的方向相反，而这正是 <code>kp</code> 点名的第四处。</b><span class='k'><code>Q̂(a)</code>：利用——这条臂看起来有多好</span>；<span class='k'><code>√(2 log t / N_t(a))</code>：探索——你对它有多没把握</span>。<b>而括号里那两个量的方向是相反的：</b><span class='w'><code>N_t(a)</code> 在分母上（这条臂拉得越多，半径越小）</span>，<span class='w'><code>log t</code> 在分子上（总步数越多，半径越大）</span>。", "<b>这两个相反的速率，产生了 UCB 最漂亮的一个机制，值得单独想明白。</b><span class='k'>一条<b>没被拉</b>的臂：<code>N</code> 不变，而 <code>t</code> 在涨⇒ 它的上界在<b>缓慢上升</b></span>。<b>也就是说，一条被冷落的臂会自己「浮上来」，直到重新被选中。</b><span class='w'>于是 UCB 不需要任何显式的「强制探索」机制</span>——<b>遗忘本身就产生了探索压力。</b><span class='k'>这就是为什么每一步都要更新所有臂的上界：不更新，这个机制就不存在了。</span>", "<b>而 <code>log t</code> 增长得极慢这件事，保证了这个机制不会失控。</b><span class='w'>如果分子是 <code>t</code> 而不是 <code>log t</code>，那么被冷落的臂的上界会迅速冲到最高，算法就退化成了轮流拉每条臂</span>。<span class='k'>而 <code>log t</code> 的增长慢到：一条已经被判定很差的臂，要等很久才会重新浮上来</span>。<b>这个速度恰好就是「既不放弃探索、又不浪费太多」的那个平衡点。</b>", "<b>定理的形状和 p25 的下界对照一次，这是这一讲最重要的一次呼应。</b><span class='k'>下界：<code>L_t ≥ log t · Σ_a Δ_a / D_KL(R^a‖R^{a*})</code></span>；<span class='k'>上界：<code>L_t ≤ 8 log t · Σ_a Δ_a</code></span>。<b>两者都是 <code>log t</code>，只差常数因子。</b><span class='w'>这意味着 UCB 在<b>阶</b>上是最优的</span>——<b>不可能有算法在数量级上比它更好。</b><span class='k'>上下界吻合是理论工作最想要的结果，而老虎机是少数几个真的做到了的问题。</span>", "<b>最后提一个关于 <code>8</code> 这个常数的实践提醒。</b><span class='w'>8 是为了让证明走得通而取的，不是最优的</span>——<b>实践中大家常把 <code>√(2 log t / N)</code> 里的 2 换成一个更小的调参系数 <code>c</code>（比如 <code>√(c log t / N)</code>，<code>c</code> 取 0.5 到 2）。</b><span class='k'>小的 <code>c</code> 探索少、收敛快，但可能锁死；大的探索多、更稳</span>。<b>这和 L10 p20 的那个 39600ε 是同一类情形：理论常数太保守，实践中要调。</b>"]},
{"r": [35, 39], "t": "UCB1 在断脚趾例子上", "star": 2, "quote": "<b>UCB1 (Auer, Cesa-Bianchi, Fischer 2002)</b> &nbsp;·&nbsp; 1 Sample each arm once &nbsp;·&nbsp; Take a1, get +1, Q̂(a1)=1 · a2, get +1, Q̂(a2)=1 · a3, get 0, Q̂(a3)=0 &nbsp;·&nbsp; 2 Set t = 3, Compute upper confidence bound on each action: <b>UCB(a) = Q̂(a) + √(2 log t / N_t(a))</b> &nbsp;·&nbsp; 3 Select a_t = arg max_a UCB(a) &nbsp;·&nbsp; 4 Observe reward &nbsp;·&nbsp; 5 Recompute upper confidence bounds on <b>each</b> action", "eq": "各拉一次后：Q̂ = (1, 1, 0)，N = (1, 1, 1)，t = 3\n\n半径 = √(2 log 3 / 1) = √(2 × 1.0986) = √2.197 ≈ 1.482\n三条臂的半径相同（因为 N 都是 1）\n\n  UCB(a1) = 1 + 1.482 = 2.482\n  UCB(a2) = 1 + 1.482 = 2.482\n  UCB(a3) = 0 + 1.482 = 1.482\n\n⇒ 仍在 a1、a2 之间打平，a3 暂时出局\n但注意：a3 没出局多久 —— 它的 N 不再增加，而 t 在涨，半径会追上来", "one": "各拉一次后三条臂半径相同，所以<b>这一步和贪心选一样</b>——差别要再过几步才显出来。", "pts": ["<b>第一轮之后 UCB 的选择和贪心<b>相同</b>，这件事值得注意，它说明 UCB 不是靠「一开始就不一样」取胜的。</b><span class='k'>因为三条臂的 <code>N</code> 都是 1，半径完全相同，加上去不改变排序</span>。<b>所以这一步仍然在 <code>a1</code>、<code>a2</code> 之间打平。</b><span class='w'>UCB 和贪心的差别不在第一步，而在<b>长期</b>——贪心会永远不碰 <code>a3</code>，而 UCB 最终一定会回头再看它一眼。</span>", "<b>算一下 <code>a3</code> 要等多久才会重新浮上来，这个数字能让你对那个机制有实感。</b><span class='k'>假设 <code>a1</code>、<code>a2</code> 轮流被拉，而 <code>a3</code> 的 <code>N</code> 一直是 1</span>。<b><code>a3</code> 的上界是 <code>0 + √(2 log t)</code>，而另两条大致是 <code>1 + √(2 log t / (t/2))</code>。</b><span class='w'>前者随 <code>√(log t)</code> 增长，后者趋向 1</span>——<b>所以当 <code>√(2 log t) > 1</code>，也就是 <code>t > e^{0.5} ≈ 1.65</code> 时，<code>a3</code> 的上界就已经超过了……</b><span class='k'>也就是说它很快就会被重新拉一次</span>。<b>这正是 UCB 不会像贪心那样把一条臂永久判死刑的原因。</b>", "<b>但它也不会一直拉 <code>a3</code>——每拉一次，<code>N(a3)</code> 加一，半径缩小。</b><span class='w'>拉几次之后，<code>Q̂(a3)</code> 稳定在 0.1 附近，半径也缩到足够小，于是它的上界再也追不上 <code>a1</code> 和 <code>a2</code></span>。<span class='k'>这就是「按不确定性分配探索」的实际表现</span>：<b>先多试几次把不确定性消掉，确认它确实差，然后就基本不碰了。</b><b>对比 ε-贪心：它会<b>永远</b>每三十次拉一次 <code>a3</code>，而且永远不会因为「已经确定它差」而停。</b>", "<b>课件把第 5 步写成 <em>Compute upper confidence bound on <b>each</b> action</em>，那个 each 不是废话。</b><span class='k'>每一步之后，<b>所有</b>臂的上界都变了——因为 <code>t</code> 变了</span>。<b>只更新刚拉过的那条是实现 UCB 最常见的错误。</b><span class='w'>这个错误的后果很具体：被冷落的臂的上界不再上升，于是它们永远不会被重新选中</span>——<b>UCB 就退化成了贪心。</b><span class='k'>老师在 p27 和 p34 两次强调这一点，可见它多容易被忽略。</span>", "<b>最后留意课件在这几页上的一处笔误，免得你对着抄的时候困惑。</b><span class='w'>p37 的第 3 步写的是 <code>t = 3</code>，而 p38 的同一步写成了 <code>t = t + 1</code></span>。<span class='k'>按后者理解是对的：每拉一次，<code>t</code> 加一</span>。<b>前者是在交代「刚拉完三次初始化，现在 t 等于 3」，两句说的是不同的时刻。</b><span class='w'>这几页 PDF 的页脚也串行了（标题文字和脚注叠在一起），属于排版问题，不影响内容。</span>"]},
{"r": [40, 40], "t": "把遗憾一步步记下来", "star": 2, "quote": "Toy Example: Ways to Treat Broken Toes, Optimism, <b>Assessing Regret</b> &nbsp;·&nbsp; Action / Optimal Action / Regret &nbsp;·&nbsp; a1→a1, a2→a1, a3→a1, a1→a1, a2→a1", "eq": "逐步记账（最优臂恒为 a1，V* = 0.95）：\n\n  选 a1  ⇒  单步遗憾 = 0.95 − 0.95 = 0\n  选 a2  ⇒  单步遗憾 = 0.95 − 0.90 = 0.05\n  选 a3  ⇒  单步遗憾 = 0.95 − 0.10 = 0.85\n\n注意：遗憾用的是**真实均值**，不是你观测到的奖励\n  ——你拉 a3 哪怕碰巧拿到 +1，这一步的遗憾仍然是 0.85", "one": "一张逐步记账表。<b>关键：遗憾算的是真实均值之差，和你这次的运气无关。</b>", "pts": ["<b>这张表最该注意的是：<span class='k'>遗憾用的是<b>真实均值</b>，不是你观测到的奖励</span>。</b><b>你拉 <code>a3</code>，哪怕碰巧拿到 +1，这一步的遗憾仍然是 0.85。</b><span class='w'>反过来，你拉 <code>a1</code> 碰巧拿到 0，遗憾仍然是 0</span>。<span class='k'>因为遗憾衡量的是「你的<b>决策</b>有多差」，不是「你这次运气如何」</span>。<b>这个区分很重要：它让遗憾成为一个关于算法的指标，而不是关于运气的指标。</b>", "<b>直接的后果是：<span class='w'>遗憾是一个你在实际运行时<b>算不出来</b>的量</span>。</b><b>因为它需要 <code>V*</code> 和 <code>Q(a_t)</code>，而那正是你不知道的东西。</b><span class='k'>它是一个<b>分析用</b>的概念，不是一个可以监控的指标</span>。<b>这一点在读论文时要清楚：报告「遗憾曲线」的实验，一定是在模拟环境里做的（真值已知）。</b><span class='w'>真实系统里你只能报告累计奖励，而那个数没有基准可比。</span>", "<b>这张表还提示了一个计算上的便利，在做题时很有用。</b><span class='k'>因为最优臂恒为 <code>a1</code>，所以单步遗憾只有三个可能的取值：0、0.05、0.85</span>。<b>于是累计遗憾 = <code>0.05 × (拉 a2 的次数) + 0.85 × (拉 a3 的次数)</code>。</b><span class='w'>这正是 p12 那个「计数 × 差距」分解的具体样子</span>——<b>你只需要数两个计数，不需要逐步累加。</b>"]},
{"r": [41, 41], "t": "检验题：为什么不能用置信下界", "star": 3, "quote": "<b>Check Your Understanding</b> &nbsp;·&nbsp; An alternative would be to always select the arm with the <b>highest lower bound</b> &nbsp;·&nbsp; <b>Why can this yield linear regret?</b> &nbsp;·&nbsp; Consider a two arm case for simplicity", "eq": "假设两条臂，真值 Q(a1) = 0.9 > Q(a2) = 0.5\n初始各拉一次，运气使得  Q̂(a1) = 0  而  Q̂(a2) = 1\n\n按「下界最大」选：\n  LCB(a1) = 0 − 半径   很低\n  LCB(a2) = 1 − 半径   较高\n  ⇒ 选 a2\n\n拉 a2 ⇒ N(a2) 增加 ⇒ a2 的半径缩小 ⇒ 它的下界**升高**\n而 a1 不被拉 ⇒ N(a1) 不变 ⇒ 它的下界**不会升高**\n\n⇒ 永远锁死在 a2 上 ⇒ 线性遗憾", "one": "<b>用下界贪心会把自己锁死。</b>因为「拉它」只会让它的下界更高，而没拉的那条永远翻不了身。", "pts": ["<b>这道题是整讲最该想明白的一道，因为它解释了「为什么必须是<b>上</b>界」。</b><span class='k'>直觉上「挑下界最高的」听起来很稳健——至少它保证不差</span>。<span class='w'>但它会产生线性遗憾，而且机制和贪心的锁死一模一样，只是更隐蔽</span>。", "<b>机制是这样的：<span class='k'>拉一条臂会让它的下界<b>上升</b>（因为半径缩小），而不拉一条臂会让它的下界<b>下降</b>（因为 <code>t</code> 涨、半径变大）</span>。</b><b>于是「下界最高」这个标准，本身就在奖励「已经被拉得多的那条」。</b><span class='w'>一旦某条臂因为运气好被选中几次，它的下界就会一路升高，而其余臂的下界一路降低</span>——<b>再也翻不了身。</b><span class='k'>这是一个正反馈：选它 ⇒ 它的下界更高 ⇒ 更选它。</span>", "<b>和上界对比，你就看出符号反过来之后机制完全颠倒了。</b><span class='k'>上界：拉它 ⇒ 半径缩小 ⇒ 上界<b>下降</b> ⇒ 其他臂有机会追上</span>（<b>负反馈</b>）；<span class='w'>下界：拉它 ⇒ 半径缩小 ⇒ 下界<b>上升</b> ⇒ 其他臂更没机会</span>（<b>正反馈</b>）。<b>负反馈自我纠正，正反馈自我强化。</b><span class='k'>这就是为什么乐观（上界）对而悲观（下界）错。</span>", "<b>第十二讲会给这件事一个更有名的名字：<span class='k'>确认偏误</span>。</b><b>按下界贪心的算法，只会去验证它已经相信的东西，而不会去检验它不相信的东西。</b><span class='w'>而乐观恰恰相反：它主动去试那些「有可能很好但我不确定」的选项</span>——<b>也就是最可能推翻当前信念的那些。</b><span class='k'>从这个角度看，「乐观面对不确定」其实是一条关于<b>怎么做实验</b>的原则，而不只是一个算法技巧。</span>", "<b>最后提醒一个边界，免得这条结论被用错：<span class='w'>「按下界挑」在<b>离线</b>设定下是对的</span>。</b><b>这道题的前提是在线学习——你还要继续拉、继续学。</b><span class='k'>而如果数据已经采完、你只做一次最终选择、之后不再探索，那么按置信下界挑恰恰是正确的做法</span>——<b>它给你的是「我选的这个，以高概率不比报告的差」。</b><span class='w'>那就是安全策略改进的标准形式，第十五讲的主题。</span><b>同一个做法，在线错、离线对，差别全在「之后还探不探索」。</b>"], "tbl": {"head": ["", "按上界挑（UCB）", "按下界挑"], "rows": [["拉了它之后", "<span class='k'>上界下降</span>", "<span class='w'>下界上升</span>"], ["没拉的臂", "<span class='k'>上界缓慢上升（有机会翻身）</span>", "<span class='w'>下界缓慢下降（更没机会）</span>"], ["反馈类型", "<span class='k'>负反馈，自我纠正</span>", "<span class='w'>正反馈，自我强化</span>"], ["在线遗憾", "<span class='k'><code>log t</code></span>", "<span class='w'>线性</span>"], ["<b>离线一次性选择呢</b>", "—", "<b>反而是对的——安全策略改进（L15）</b>"]]}},
