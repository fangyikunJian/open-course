var TH = {"title": "L15 就是你这个课题的技术底座 —— 也是它被点名的那个缺口", "arc": "<b>这一讲和别的讲不一样：它不是一个你要去借用的工具箱，它就是你课题所在的那片地。</b> 从 p1 的问题陈述（<em>只有一份旧数据，怎么在上线之前就知道新策略更好</em>）到 p69 的「该会什么」，整讲在回答一个和你完全同形的问题。<br><br><b>三样可以直接拿走的东西。</b><br><b>① p18 的安全性定义</b>：<code>Pr( V<sup>A(D)</sup> ≥ V<sup>π<sub>b</sub></sup> ) ≥ 1−δ</code>。<span class='k'>这是一个可以逐符号替换的模板</span>——把 <code>V</code> 换成 <code>G = Acc − λ·Cost</code>、<code>π<sub>b</sub></code> 换成「全用 72B 的 AFlow 工作流」、<code>A(D)</code> 换成你的节点级指派算法，<b>你的目标陈述就写完了，而且是别人认得的形式</b>。注意这个定义的两处精确：它允许「拒绝」（返回 π<sub>b</sub> 本身也算满足），它只管均值不管单条轨迹。<br><b>② p20 的三段配方</b>：OPE → HCOPE → SPI。价值在于<span class='k'>接口干净</span>——第三格只依赖「一个 1−δ 下界」，所以前两格可以随便换实现。p49–61 整整十三页在返工前两格，而第三格一个字没改。<b>你的论文可以照这个结构组织：先说怎么估 G，再说怎么给 G 一个下界，最后说什么时候才换掉默认配置。</b><br><b>③ p67 第一条</b>：<em>What to do when the behavior policy is <b>deterministic</b>?</em> <b>Brunskill 把它列为本讲范围之外的开放问题</b>——而这正是你的处境（AFlow 搜出来的工作流是确定性的）。<span class='w'>这句话比任何「我们把 OPE 用到 LLM workflow 上」都更能定位你的工作</span>：你不是在应用这套方法，你在它自己承认的缺口上工作。<br><br><b>一个贯穿全讲的警告。</b> IS 的方差不是「调参可以改善」的问题，是结构性的：权重是 <code>Π π<sub>e</sub>/π<sub>b</sub></code>，取值范围随步数指数增长。p50 那个例子——<span class='w'>十万条轨迹、真实值 0.19 ∈ [0,1]、95% 下界是负的百万量级</span>——说明加数据救不了。你的处境好得多（H ≤ 10，均匀随机化时 π<sub>min</sub>=0.5，b ≈ 2<sup>k</sup>），<b>但前提是 k 小</b>：k=4 时 b≈16 可控，k=10 时 b=1024。<span class='k'>这给「把一步偏离扫描的 k 压到 3~4」提供了第二个独立理由</span>（第一个是 ESS）。<br><br><b>还有一件必须记住的事：这一讲停在 2019。</b> FQE、密度比方法、CQL/IQL 全都没有，<b>而简报推荐的恰恰是 FQE</b>。所以这一讲给你的是**问题的形状和保证的语言**，不是最新的估计量——后者要出课去找。而你真正的解法（穷举 oracle）绕开了整个 IS 家族：<span class='k'>没有权重，于是没有重尾，于是 Hoeffding 里的 b 是真实的小数，于是最保守的无分布假设的界也是有用的界</span>。<b>本讲花十三页修的那个病，你用一个不同的数据采集方式就不得了。这个对照本身就是穷注成本的理由。</b>", "pitfalls": [{"v": "<b>写「我们保证新配置优于基线」而不写「以多大概率、相对什么基线、在什么分布上」。</b> p18 的定义把四件事都钉住了：<span class='k'>概率 1−δ、比较对象是 π<sub>b</sub>、不等号是弱的（允许相等，即允许拒绝）、而且是对期望而非单条</span>。<b>照这个模板写，省掉一轮审稿人追问</b>；漏掉任一项，那个「保证」就是一句修辞。", "tag": "已核", "ref": "课件 p18 原文（逐句核对）· 本讲 p18 科研格"}, {"v": "<b>以为 IS 的方差问题是「样本量不够」。</b> <span class='w'>p50：十万条轨迹，真实值 0.19 ∈ [0,1]，95% 下界是负的百万量级</span>。病因是 <code>b ~ (1/π<sub>min</sub>)<sup>L</sup></code> 指数增长而 <code>√n</code> 只线性回拉。<b>所以你要控的是 k（随机化的节点数），不是 n</b>——这和 ESS 指向同一个数。", "tag": "已核", "ref": "课件 p49–p51（逐句核对）· 简报 §4b §4c"}, {"v": "<b>用同一批数据既挑配置、又给这个配置算置信界。</b> 本讲在 p15（保证不能依赖调参）和 p55（20% 选截断点 c / 80% 算界）两处都要求切开，<span class='k'>而 L04 p43 和 L13 p13 给的是另外两条独立理由</span>（防最大化偏差、要求数据与被评估对象独立）。<b>四个角度、同一个做法。⚠ 而且切分会叠加</b>：若既要选 c 又要挑配置，有效样本量掉得很快——设计实验时要提前算这笔账。", "tag": "推断", "ref": "课件 p15 · p55 · L04 p43 · L13 p13"}, {"v": "<b>把本讲的保证当成覆盖所有情形。</b> p69 明确要求你能说清 <em>the <b>scope</b> of the guarantees</em>。本讲<b>不</b>保证：单条轨迹（p67）、非平稳环境（p46）、π<sub>b</sub> 不可知时、尾部风险（只管均值）、以及 2019 之后的方法。<b>主动把这张「不保证」清单写进论文的局限一节，是最有效的防守。</b>", "tag": "已核", "ref": "课件 p67 · p69 · p46（逐句核对）"}, {"v": "<b>对 m 个候选配置各算一个 1−δ 下界，然后取最大。</b> <span class='w'>整体失败概率可以接近 m·δ</span>——这是多重比较，课件没强调。要么对 δ 做修正（Bonferroni 之类），要么先用一部分数据筛候选。<b>你的候选配置数量可能很大（节点级指派的组合），这条特别要当心。</b>", "tag": "推断", "ref": "课件 p60–p61 · L04 p42（最大化偏差）"}, {"v": "<b>把 PDIS 当成「反正更好、用上准没错」。</b> 本讲 p29 的 PDIS 利用「第 t 步的奖励只被前 t 步的动作影响」。<span class='k'>而你的准确率是终局奖励——前面每个节点都影响它，PDIS 对这一半毫无增益</span>；<b>但成本是逐节点累加的，PDIS 对这一半确实有用</b>。<b>这是「估计量拆成两半」的第四个独立理由</b>（前三个在简报里）。用错半边，白费功夫还以为自己用了更好的方法。", "tag": "推断", "ref": "课件 p29 · 本讲 p29 科研格 · 简报 §4f"}, {"v": "<b>照抄幻灯片上的数字。</b> ⚠ p50 那个下界在 PDF 上印成了格式错乱的数（逗号位置不成立），实录里说的是「−5 million」。<span class='w'>p54–p55、p62–p66 全是图，PDF 无正文</span>。<b>要引用具体数值请查 Thomas et al. AAAI 2015 / ICML 2015 原文。</b>", "tag": "已核", "ref": "课件 p50（与实录对照）· p62–p66"}], "ammo": [{"q": "你的「安全」到底保证了什么？", "a": "<b>直接给 p18 的形式</b>：<code>Pr( G<sup>A(D)</sup> ≥ G<sup>默认</sup> ) ≥ 1−δ</code>，其中默认是「全用 72B 的 AFlow 工作流」，<code>A(D)</code> 是我们的节点级指派算法，概率是对留出集 query 分布与数据采集的随机性取的。<b>然后立刻说清它不保证什么</b>：不保证单条 query（只管分布上的期望）、不保证新的 query 分布、不保证 oracle 表之外的配置、不保证尾部。<span class='k'>注意不等号是弱的——算法在证据不足时返回默认配置，这也算满足保证</span>。<b>「允许拒绝」不是退让，它是这个定义的一部分</b>（p27）。", "tag": "已核", "ref": "课件 p18 · p27 · p69（逐句核对）· 简报 §2"}, {"q": "你为什么不用重要性采样？这不是离策略评估的标准做法吗？", "a": "<b>因为我们的行为策略是确定性的 —— 而这正是 Brunskill 在 CS234 L15 p67 把它列为 <em>Other Relevant Work</em> 的那个问题。</b> AFlow 搜出来的工作流对每个节点只有一个确定的选择，<span class='w'>于是 IS 的权重分母要么是 1 要么是 0</span>，覆盖条件根本不成立（deficient support，Sachdeva et al. / Su et al. / Joachims）。我们的回答是换一种数据采集方式：<b>对留出集穷举节点级配置，得到 G 的精确值而非重加权估计</b>。<span class='k'>代价是穷举的 LLM 调用成本，收益是三条</span>——没有重尾所以 Hoeffding 的 b 是真实的小数（本讲 p49–59 整整十一页在对付这个病）、不需要正态性假设、不需要截尾带来的保守偏差。<b>如果要覆盖 oracle 表之外的配置，我们会走随机化 + 记录 propensity 这条路，而那时本讲的全部取舍就回来了。</b>", "tag": "已核", "ref": "课件 p67（逐句核对）· p22（覆盖条件）· p49–p59 · 简报 §4a §4d"}, {"q": "你的置信界用了什么假设？", "a": "<b>只要 G 有界 —— 这是最弱的假设。</b> Acc ∈ [0,1]，Cost 有上限，<span class='k'>所以 Hoeffding 里那个 b 是真实的、小的</span>。<b>我们不需要 Student t 的正态性假设</b>（本讲 p58 列出的那条，而 IS 权重重尾下 CLT 收敛极慢），<b>也不需要截尾带来的保守偏差</b>（p52）。<b>这是「不用重加权估计量」带来的直接好处，而且值得在论文里明说一句。</b> ⚠ 但要记得：<span class='w'>bootstrap 我们仍然用，只是用途不同</span>——不是对付重尾，而是按 query 重采样检验 config* 的排名有多稳（L13 p32 那个诊断）。两种用途别混。", "tag": "推断", "ref": "课件 p52 · p58 · 简报 §4d（已核）· L13 p32 科研格"}, {"q": "你的论文结构该怎么组织？", "a": "<b>照 p20 那三格，它的接口是干净的。</b> ① <b>怎么估 G</b>——oracle 表（或 FQE，若扩展到表外）、以及为什么拆成准确率与成本两半（五个独立理由：量纲、方差结构、PDIS 只对成本有用、p42 的非马尔可夫性、以及 λ 可调）；② <b>怎么给 G 一个下界</b>——Hoeffding + 按 query 的 paired bootstrap；③ <b>什么时候才换掉默认配置</b>——下界高于默认才换，否则返回默认。<span class='k'>本讲 p49–61 整整十三页在返工 ①②，而 ③ 一个字没改</span>——<b>这说明按这个结构组织，你以后换估计量不用重写第三节</b>。", "tag": "推断", "ref": "课件 p20 · p48 · p60–p61 · 简报 §4f"}, {"q": "为什么是一个序贯决策问题，而不是 H 个独立的选择？", "a": "<b>p42 给了这门课自己的说法</b>：<em>part of the world is non-Markovian … other parts are Markov</em>——<span class='k'>课件承认同一个系统的不同部分可以有不同的马尔可夫性，并据此选不同的估计量</span>。这正是你那个「拆成两半」的做法的权威依据：<b>成本在节点上可加、近似独立（马尔可夫那一半）；准确率是终局的、整条链共同决定（非马尔可夫那一半）</b>。所以既不是纯 H 个独立选择（准确率否决了），也不是一个干净的 MDP（成本那一半太简单，用 MDP 机器是浪费）。<b>这个回答比「我们建模成 MDP 因为有多步」强得多，而且有课件原话撑着。</b>", "tag": "已核", "ref": "课件 p42 实录（逐句核对）· 本讲 p42 科研格 · 简报 §7 第 1 拳"}], "papers": [{"t": "Thomas, Theocharous &amp; Ghavamzadeh — High confidence off-policy evaluation", "id": "AAAI 2015（课件 p53 点名）", "why": "<b>本讲第二格的出处：截尾 + Hoeffding 怎么给出非空洞的下界。</b> p50 那个负百万量级的例子、p52 的「截掉上尾只会让期望变小」、p55 的 20%/80% 切数据选截断点，都在这一篇。<b>要引用具体数字查这里，不要抄幻灯片</b>（p50 的数印坏了）。"}, {"t": "Thomas, Theocharous &amp; Ghavamzadeh — High confidence policy improvement", "id": "ICML 2015（课件 p61 点名）", "why": "<b>第三格的出处：SPI 的完整形式与定理。</b> p18 那个安全性定义的正式陈述在这里。<span class='k'>你要照模板写目标陈述，应该引这一篇而不是引课件</span>。"}, {"t": "Jiang &amp; Li — Doubly Robust Off-policy Value Evaluation for Reinforcement Learning", "id": "ICML 2016（课件 p40 左右点名，课上说的是 2015 的预印本）", "why": "<b>双重稳健估计量在 RL 里的出处。</b> 核心是「模型当基线 + IS 修残差」：<span class='k'>模型对了就省方差，模型错了 IS 还能纠偏</span>。⚠ 它仍然要求覆盖条件——<b>DR 解决的是方差不是支撑</b>，这一点很容易误读。"}, {"t": "Hanna, Stone &amp; Niekum — Bootstrapping with Models: Confidence Intervals for Off-Policy Evaluation", "id": "AAMAS 2017（课件 p58 点名，标注 <em>without importance sampling</em>）", "why": "<b>p58 三条替代路径里唯一绕开 IS 的那条</b>，所以对你最相关。前两条（t 检验、bootstrap）都在修补 IS 的重尾，这一条换了估计量。<span class='w'>行为策略确定性时，这个方向比修 IS 更有希望</span>。"}, {"t": "Efron — Bootstrap 方法（BCa）", "id": "课件 p58 点名", "why": "不假设分布形式，用重采样逼近统计量的抽样分布，在重尾下通常比 t 检验稳健。<b>你用得上，但用途不同</b>：按 <b>query</b> 重采样（不能按「query×配置」拆开，同一条 query 的不同配置结果是相关的），检验 config* 稳居第一的比例。"}, {"t": "Thomas, Theocharous, Ghavamzadeh et al. — 非平稳环境下的安全策略改进", "id": "AAAI 2017（课件 p46 点名）", "why": "本讲全程假设环境平稳；<span class='k'>这一篇处理「环境会漂」的情形</span>。<b>对你直接相关的是「query 分布会漂」以及「模型 API 会换版本」</b>——后者是 LLM 场景特有的、而且比环境漂移更突然的一种非平稳。"}, {"t": "Wager &amp; Athey（因果推断方向）", "id": "课件 p68 点名（斯坦福统计系）", "why": "<b>p68 把这个领域定位成「因果推断与控制的交叉」。</b> IS 在那边叫逆概率加权、DR 是那边的原生概念。<span class='k'>如果你的审稿人有因果推断背景，用 IPW / 倾向得分 / 双重稳健的语言比用 IS 的语言更容易沟通</span>——同一批问题，两套术语。"}, {"t": "⚠ 本讲<b>没有</b>覆盖的（2019 之后）", "id": "FQE · 密度比方法（DualDICE 等）· CQL / IQL", "why": "<b>而简报推荐的恰恰是 FQE。</b> 本讲给你的是<b>问题的形状和保证的语言</b>，不是最新的估计量。<span class='w'>不要因为课件没提就以为 IS/DR 是当前最好的做法</span>——这是 2019 年的课。"}]};

    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      var nf=frame.cloneNode(false); nf.removeAttribute("src");
      frame.parentNode.replaceChild(nf,frame); frame=nf;
      frame.src=SRC+HASH;
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
