{"r": [1, 2], "t": "这一讲是什么：一门课里的一次研究报告", "star": 3, "quote": "<b>CS234 Reinforcement Learning</b> · <b>Class Structure</b><br>每页页脚：<em>Slides drawn from <b>Philip Thomas</b></em>", "one": "<b>这一讲几乎整讲建在 Brunskill 与她从前的博士后 Philip Thomas 的工作上——它是一次研究报告，不是教科书章节。</b>", "pts": ["<b>先看页脚：<em>Slides drawn from Philip Thomas</em> 出现在几乎每一页。</b> <span class='k'>这不是普通的致谢，而是说明整讲的内容线就是一条具体的研究线</span>——高置信离策略评估与安全策略改进，Thomas 的博士工作加上他与 Brunskill 的后续合作。", "<b>这决定了这一讲的读法：它比别的讲更「窄」也更「深」。</b> 别的讲在介绍一个领域；<b>这一讲在把一条研究路线从问题讲到算法再讲到实验</b>。<span class='k'>所以它的结构是「三段式配方」而不是「几个并列的方法」</span>。", "<b>也决定了它的边界。</b> <span class='w'>本讲不覆盖 FQE、边缘化 / 密度比方法、以及现代离线 RL（CQL、IQL 那一类）</span>——这些都是 2019 年之后的东西。<b>要用它们必须出这门课去找</b>。这一点在 p67「Other Relevant Work」会被课件自己提到一部分。", "<b>全讲的主线可以用一句话概括</b>：<b>只有一份旧数据，怎么在上线之前就知道新策略更好——而且要敢于说「不知道」。</b><span class='k'>最后半句是本讲最独特的地方</span>：算法被允许拒绝给出新策略。", "<b>这一讲在整门课里的位置也值得说一句：它是唯一一讲把「要不要部署」当成输出的。</b> <span class='k'>前面十四讲的算法都输出策略或值函数</span>，<b>而这一讲的算法输出的是一个决定——换，或者不换</b>。这个转变使它比别的讲更接近真实工程里的样子。", "<b>读法建议：按三段式配方分三次读。</b> 第一遍读 p1–p28（问题、记号、配方、朴素版的每一格）；第二遍读 p29–p47（把第一格做好：从朴素 IS 到 MAGIC）；第三遍读 p49–p70（把第二格做好：Hoeffding 为什么失效、怎么修，以及最终的 SPI）。<span class='w'>中间两次都是「返工」，不是新内容</span>——<b>认清这一点，70 页就不吓人了</b>。"], "tbl": {"head": ["", "本课大多数讲", "<b>L15</b>"], "rows": [["内容来源", "教科书与领域共识", "<b>一条具体的研究线</b>（Thomas 的工作）"], ["结构", "几个并列的方法", "<b>一个三段式配方</b>"], ["覆盖范围", "较宽", "<b>较窄但深</b>"], ["不覆盖的", "—", "<span class='w'>FQE · 密度比方法 · CQL/IQL（均为 2019 后）</span>"]]}, "tip": {"t": "读法", "v": "<b>70 页不吓人，因为其中两段是返工而不是新内容。</b><br><b>第一遍 p1–p28</b>：问题、记号、三段式配方、每一格的朴素版；<br><b>第二遍 p29–p47</b>：<span class='k'>只改第一格</span>——从朴素 IS 到每步 IS、加权 IS、双重稳健、MAGIC；<br><b>第三遍 p49–p70</b>：<span class='k'>只改第二格</span>——Hoeffding 为什么给出 −5 百万，怎么修，最终的 SPI。<br><b>配方那一页（p20）会在 p24、p48、p60 三次回来标记进度</b>，读不下去时翻回去看一眼。"}},
{"r": [3, 7], "t": "一个科学实验：反事实与泛化", "star": 3, "quote": "<b>A Scientific Experiment</b> · <b>What Should We Do For a New Student?</b> · <b>Involves Counterfactual Reasoning</b> · <b>Involves Generalization</b>〔这五页以图为主，正文极少〕", "one": "<b>开场用一个教育实验铺路：你有一批学生的历史数据，现在来了一个新学生，该怎么教？这件事同时需要反事实推理和泛化。</b>", "pts": ["<b>这组页的标题本身就是论证</b>：从「一个科学实验」到「对新学生该怎么办」，再点出它<b>同时</b>涉及两件难事。<span class='k'>两件事缺一不可，而它们的困难性质完全不同</span>。", "<b>反事实推理（p6）</b>：你只看到了「这个学生按方案 A 学了之后怎么样」，<span class='w'>看不到「他按方案 B 会怎么样」</span>。<b>这正是 L01 p17 的「删失数据」</b>——只有你选的那个动作的结果可见。", "<b>泛化（p7）</b>：新学生和历史里的任何一个都不完全一样。<b>所以你不只要回答反事实，还要把答案迁移到一个没见过的个体上</b>。<span class='k'>这是 L01 四要素里的第四格</span>。", "<b>把这两件事叠起来，就是本讲的问题</b>：<b>用一批在别的策略下产生的数据，评估一个从没执行过的策略</b>。反事实管「没选的动作会怎样」，泛化管「没见过的情形会怎样」。", "⚠️ <b>这五页在 PDF 上几乎没有正文，全靠图。</b> 本精读按标题与讲课逻辑还原其论证结构，<span class='w'>不补具体的实验细节</span>——那些在图里，而图的内容无法从文本可靠还原。", "<b>为什么用「科学实验」而不是直接讲算法开场？因为这个类比把问题的难点一次说清了。</b> 一个随机对照实验之所以能回答因果问题，是因为<span class='k'>分组是随机的</span>——于是两组除了处理之外统计上可比。<b>而批量 RL 的数据不是这么来的</b>：<span class='w'>历史上谁被分到哪个方案，是由某个策略决定的，而那个策略很可能跟学生的特征有关</span>。<b>所以你手上的是一个「观察性研究」而不是实验</b>，混杂是默认存在的。", "<b>这也解释了为什么 π_b 必须已知这件事如此关键。</b> 在观察性研究里，<span class='k'>只要你知道「分配机制」本身，混杂就可以被调整掉</span>——重要性权重做的正是这件事：把按 π_b 出现的频率，重新加权成按 π_e 该有的频率。<b>这在因果推断里叫逆概率加权（IPW），和重要性采样是同一个想法的两个名字。</b>", "<b>反事实与泛化这两件事的困难程度不同，值得分开掂量。</b> <b>反事实</b>有明确的解法（只要覆盖条件成立，加权就能解决）；<span class='w'>而泛化没有免费的解法</span>——它依赖「相似的个体会有相似的反应」这个无法从数据本身验证的假设。<b>本讲几乎全部篇幅在处理前者，后者基本没碰。</b>", "⚠️ <b>把这组页读成「问题陈述」而不是「内容」。</b> 它们定义了本讲要解决什么，<span class='k'>而真正的方法从 p17 的记号开始</span>。"], "tbl": {"head": ["这个开场例子涉及的两件事", "具体是什么", "在本课哪里讲过"], "rows": [["<b>反事实推理</b>", "没选的那个方案会怎样", "<b>L01 p17 删失数据</b> · L01 p70"], ["<b>泛化</b>", "把答案迁移到没见过的个体", "<b>L01 p18–19</b> · L05 L06"], ["两者叠加", "<b>用旧策略的数据评估没跑过的新策略</b>", "<b>本讲</b> · L03 p54–62"], ["<b>随机实验 vs 观察性研究</b>", "历史数据的分配不是随机的 ⇒ <b>混杂是默认存在的</b>", "本讲靠「π<sub>b</sub> 已知」来调整"], ["两者的解法差别", "反事实<b>有</b>解法（加权）；泛化<b>没有</b>免费解法", "本讲几乎只处理前者"]]}, "res": {"tag": "推断", "v": "<b>这个开场类比给了你一个在论文里定位自己工作的现成说法：你做的是观察性研究，不是实验。</b><br>AFlow 的日志里，哪个节点用了哪个模型，<span class='k'>是由 AFlow 的搜索过程决定的，不是随机分配的</span>。<b>所以配置与 query 难度之间很可能是相关的</b>——搜索倾向于在难的 query 上保留强模型。<span class='w'>这正是混杂</span>，而它会让「用 72B 的那些 query 准确率更高」这种观察变得没有意义。<br><b>好消息是：这类混杂有标准解法，而且前提你满足得了</b>——只要知道分配机制（π_b），逆概率加权就能调整掉它。<span class='k'>而在因果推断里这叫 IPW，在 RL 里叫重要性采样，是同一个东西</span>。<b>这个双重命名对你有用</b>：审稿人里懂因果推断的那一拨，用 IPW 的语言比用 IS 的语言更容易沟通，而「无混杂 / 分配机制已知」是他们熟悉的前提表述。<br><b>但「泛化」那一半要诚实。</b> 反事实有解法，<span class='w'>泛化没有</span>——它依赖「相似的 query 会有相似的反应」，而这个假设无法从数据本身验证。<b>你的 oracle 表在 200–300 条留出 query 上是精确的，但要外推到整个分布，靠的就是这个未经验证的假设</b>。<span class='k'>这应该被明确写成一条 limitation，而不是默认成立</span>——可做的缓解是按 query 难度分层报告，看结论在各层是否一致。<br>标【推断】：这套定位与建议是我做的；oracle 的精确性在简报里是【已核】。", "ref": "课件 p3–p7 · 简报 §4d（oracle，已核）· §7 第 6 拳（分层报告，已核）"}},
{"r": [8, 10], "t": "批量强化学习的设定", "star": 3, "quote": "<b>Batch Reinforcement Learning</b> · <b>Batch RL</b>〔以图为主〕", "one": "<b>数据是固定的一批，不能再去和世界交互。你要做的是把这批数据推过一个黑箱，输出一个策略。</b>", "pts": ["<b>「批量」这个词定义了全部约束：你不能采新数据。</b> <span class='k'>于是探索-利用的权衡消失了</span>——没有「要不要花一次机会去试」这回事，因为你连试的机会都没有。<b>剩下的只有「这批数据够不够回答我的问题」。</b>", "<b>这与 L11–L13 那三讲的设定正好相反，值得对照着记</b>：那三讲里数据是你自己采的，核心问题是<b>怎么采得聪明</b>；这一讲里数据已经给定，核心问题是<b>怎么从中榨出可靠的结论</b>。", "<b>讲稿里她把流程说得很具体</b>：<em>we're gonna take our data as input and push it through some black box, and get out a policy that we think is good … instead of interacting with the real world and getting to make decisions and choose its data, it's just taking this fixed data</em>。<span class='w'>「不能选择自己的数据」是这个设定的全部特殊性</span>。", "<b>「批量 RL」与「离线 RL」在今天基本是同义词</b>，后者是 2019 年之后更常用的叫法。<b>本讲用的是前者。</b>", "<b>批量设定下，「数据够不够」取代了「探索够不够」，成为唯一的问题——而这两者的性质完全不同。</b> <span class='k'>探索不够可以继续探索</span>；<b>数据不够就是不够</b>，<span class='w'>你唯一能做的是诚实地说出「这个问题我回答不了」</span>。<b>本讲最独特的那个设计（算法可以拒绝）就是从这里长出来的。</b>", "<b>和 L03 的 off-policy 那九页对照着看，会发现两者的立场不同。</b> L03 把重要性采样当成一个<b>估计技术</b>介绍（怎么算），<span class='k'>本讲把它当成一个<b>决策流程</b>的第一步</span>（算完之后要据此做什么）。<b>后者才是它在真实问题里的样子</b>——没人只是想知道一个数，都是想据此决定做不做。", "<b>还有一个实践上的差别本讲全程默认但没明说：批量设定下你可以反复使用同一批数据。</b> <span class='w'>而这正是危险所在</span>——反复在同一批数据上试不同的策略、调不同的参数，<b>会把「1−δ 的保证」悄悄消耗掉</b>。p15 第四条限定（不依赖调参）防的就是这个。", "<b>最后提醒一个容易混的说法：「批量 RL」不等于「从头离线学一个策略」。</b> <span class='k'>本讲做的是「评估并决定要不要换」，不是「学一个全新的策略」</span>。<b>后者（从固定数据里学策略）是 2019 之后 CQL / IQL 那一支的主题</b>，<span class='w'>本讲不覆盖</span>。两者共用「离线」这个词，但目标不同：一个要安全地改进，一个要尽可能学得好。"], "say": "她把这个设定与前面的在线设定对照时用了一个很形象的说法：在线的算法可以<em>choose its data</em>，而批量算法只能<em>take this fixed data</em>。<b>「能不能选自己的数据」——这一句就把两类问题分开了。</b>", "tbl": {"head": ["", "在线（L11–L13）", "<b>批量 / 离线（本讲）</b>"], "rows": [["数据从哪来", "<b>算法自己采</b>", "<b>给定的一批，不能再采</b>"], ["核心问题", "怎么采得聪明", "<b>这批数据够不够回答我的问题</b>"], ["探索-利用权衡", "存在", "<span class='k'>不存在</span>（没有试的机会）"], ["不够时怎么办", "继续探索", "<span class='w'>说「我回答不了」</span>"], ["数据能否反复用", "—", "<b>能，但会消耗掉 1−δ 的保证</b>"]]}, "tip": {"t": "记号", "v": "<b>「批量 RL」与「离线 RL」今天基本同义</b>，后者是 2019 之后更常用的叫法。<span class='w'>但要区分两件常被混在一起的事</span>：<b>本讲做的是「评估并决定要不要换」</b>（安全改进），<span class='k'>而「从固定数据里从头学一个策略」是 CQL / IQL 那一支的主题</span>，<b>本讲不覆盖</b>。两者共用「离线」这个词，目标却不同：一个要安全地改进，一个要尽可能学得好。"}},
{"r": [11, 15], "t": "为什么必须「安全」，以及安全该是什么意思", "star": 3, "quote": "<b>The Problem</b> — <em>If you apply an existing method, do you have confidence that it will work?</em><br><b>A property of many real applications</b> — <em>Deploying \"bad\" policies can be <b>costly or dangerous</b></em><br><b>What property should a safe batch RL algorithm have?</b> — <em>Given past experience, produce a new policy</em> · <em>\"<b>Guarantee that with probability at least 1−δ, will not change your policy to one that is worse than the current policy.</b>\"</em> · <em>You get to choose δ</em> · <em><b>Guarantee not contingent on the tuning of any hyperparameters</b></em>", "one": "<b>部署坏策略可能很贵也可能很危险。所以要的不是「平均更好」，而是「以 1−δ 的概率不会更差」。</b>", "pts": ["<b>p11 那个问句是整讲的出发点</b>：<em>if you apply an existing method, do you have confidence that it will work?</em> <span class='k'>注意问的是「有没有把握」，不是「效果好不好」</span>。<b>这是一个关于保证的问题，不是关于性能的问题。</b>", "<b>安全性要求的措辞要逐字读，三个限定缺一不可</b>：<br>① <b>「不会更差」</b>——参照系是<b>当前策略</b>，不是最优策略；<br>② <b>「以至少 1−δ 的概率」</b>——允许失手，但失手的概率可控；<br>③ <b>「δ 由你选」</b>——<span class='k'>风险容忍度是使用者的决定，不是算法的</span>。", "<b>第四条限定最容易被忽略，但它最严厉</b>：<em>guarantee <b>not contingent on the tuning of any hyperparameters</b></em>。<span class='w'>保证不能依赖调参</span>——也就是说，不能出现「如果学习率设对了那就安全」这种话。<b>调参本身会消耗数据、引入选择效应，而那正是保证失效的地方。</b>", "<b>把「不会更差」当参照系是一个非常务实的选择。</b> 和最优策略比需要知道最优值（不可知）；<span class='k'>和当前策略比只需要评估两个具体的策略</span>，而当前策略的值还可以直接从历史数据里算（它就是 on-policy 的）。<b>务实，而且刚好够用——因为真正的决策是「要不要换」。</b>", "⚠️ <b>p13–p14 用两页分别举「贵」和「危险」的例子</b>（以图为主）。<b>两者的区别值得注意</b>：贵是可以用钱衡量、可以接受一定比例的；<span class='w'>危险是不可接受的，再小的概率也要专门对待</span>。", "<b>「贵」与「危险」这两类代价，对应的是两种完全不同的风险态度，而安全性定义只覆盖了其中一种。</b> <span class='k'>Pr(V ≥ V^{π_b}) ≥ 1−δ 管的是「平均值不下降」</span>，<span class='w'>它不管那 δ 的失败有多惨</span>。<b>如果失败意味着病人受伤，δ=0.05 就远远不够——你要管的是尾部而不是均值</b>。这正是 L01 p28「稳健性 / 风险敏感」那一格被搁置的内容。", "<b>这里还有一个常被忽略的不对称：不部署也是一种决策，而且它也有代价。</b> 安全性定义把「不换」当成零风险的默认，<span class='k'>但如果当前策略本身很糟，不换就是持续承担那个糟糕</span>。<b>所以「安全」在这里是一个相对概念</b>——相对于现状安全，不是绝对安全。", "<b>最后一条限定（不依赖调参）在实践中最难做到，值得想一想为什么。</b> 任何「用同一批数据既选模型又评估模型」的流程都会违反它。<span class='w'>而离线 RL 的典型工作流恰恰是这样</span>：手上就这么一批数据，既要用它训策略，又要用它评策略。<b>唯一干净的解法是把数据切开，而数据本来就不够——这是离线 RL 最根本的紧张关系之一。</b>", "<b>把 p11 那个问句和整门课对照一下，会发现它问的是前十四讲都没问过的事。</b> <span class='k'>前面讲的每个算法都有「在某某假设下收敛」或「遗憾是对数的」这类结论</span>，<b>但那些都是关于算法本身的渐近性质，不是关于「我手上这次跑出来的策略能不能用」</b>。<span class='w'>p11 问的正是后者</span>——<em>if you apply an existing method, do you have confidence that it will work?</em> <b>这是一个部署前的问题，而整门课到这里才第一次正面处理它。</b>"], "tbl": {"head": ["安全性要求的四个限定", "说什么", "为什么要紧"], "rows": [["不会<b>更差</b>", "参照系是<b>当前策略</b>", "不需要知道最优值；而且这才是真正的决策"], ["概率 ≥ <b>1−δ</b>", "允许失手但可控", "确定性的保证在有限数据下不可能"], ["<b>δ 由你选</b>", "风险容忍是使用者的决定", "不是算法的参数，是约定"], ["<b>不依赖调参</b>", "保证不能建立在超参数调对的前提上", "<span class='w'>调参消耗数据、引入选择效应</span>"]]}, "res": {"tag": "推断", "v": "<b>这一页写的就是你要向人做出的那个承诺，一字不差。</b><br>你的目标是「把新的保真度分配策略上线之前，确信它不会更差」——<span class='k'>而这一页把它形式化成了「以至少 1−δ 的概率，不会换成一个比当前更差的策略」</span>。<b>当前策略在你这里就是 AFlow 现在跑的那个固定配置（all-72B 或别的）。</b><br><b>四个限定逐条对你都成立，而且第四条尤其要注意</b>：<span class='w'>「保证不能依赖调参」</span>——如果你在留出集上调了 λ、调了阈值、调了随机化强度，<b>再用同一批数据报告保证，那个保证就不成立了</b>。这与 L04 p43 的「留出集拆两半」和 L13 p13 的「数据要与被评估策略独立」是同一件事的第三次出现。<span class='k'>三讲从三个角度指向同一个做法</span>。<br><b>「与当前策略比」这个参照系对你特别有利</b>：你的当前策略（固定配置）的值<b>可以直接从日志里算出来</b>，因为那是 on-policy 的。<span class='k'>简报 §4a 把它叫做「Pareto 前沿上白送的两个点」</span>——all-72B 与 all-7B 的 on-policy 蒙特卡洛值不需要任何估计量。<b>所以比较的一端是精确已知的，只有另一端需要估</b>，这比一般的离线 RL 处境好。<br>标【推断】：对应关系是我做的；「白送的两个点」在简报里是【已核】。", "ref": "课件 p15 原文 · 简报 §4a（已核）· L04 p43 科研格 · L13 p13 科研格"}, "tip": {"t": "记这一条", "v": "<b>「安全」在本讲里是一个相对概念：相对于现状安全，不是绝对安全。</b> <span class='k'>它管的是「平均值不下降」，不管那 δ 的失败有多惨</span>。如果失败不可接受（医疗、金融），你要的不是更小的 δ，<b>而是一个管尾部的量（CVaR 之类），那是另一套东西</b>——L01 p28 把它列为本课搁置的三件事之一。"}},
{"r": [16, 18], "t": "记号与形式定义", "star": 3, "quote": "<b>Notation</b> — 策略 <em>π(a|s) = P(a<sub>t</sub>=a | s<sub>t</sub>=s)</em> · 轨迹 <em>T = (s₁,a₁,r₁, …, s<sub>L</sub>,a<sub>L</sub>,r<sub>L</sub>)</em> · 历史数据 <em>D = {T₁, …, T<sub>n</sub>}</em>，来自<b>行为策略 π<sub>b</sub></b> · 目标 <em>V<sup>π</sup> = E[Σ<sub>t=1</sub><sup>L</sup> γ<sup>t</sup>R<sub>t</sub> | π]</em><br><b>Safe batch RL algorithm</b> — <em>A 作用在随机变量 D 上，输出的策略 A(D) 也是随机变量</em><br><b><em>Pr(V<sup>A(D)</sup> ≥ V<sup>π<sub>b</sub></sup>) ≥ 1 − δ</em></b>，一般形式 <em>Pr(V<sup>A(D)</sup> ≥ V<sub>min</sub>) ≥ 1 − δ</em>", "one": "<b>一行式子把上一页的话变成了数学：算法输出的策略，以至少 1−δ 的概率不差于行为策略。</b>", "pts": ["<b>这个式子里有一个关键的细节：<code>A(D)</code> 是随机变量。</b> <span class='k'>数据 D 是随机的，所以算法的输出也是随机的</span>——<b>概率是对「数据可能是什么样」取的</b>，不是对策略的执行取的。<b>这个区分不搞清楚，整讲的保证都会读错。</b>", "<b>换句话说：这个保证说的是「如果你把这整套流程重复一万次（每次换一批数据），其中至少 (1−δ)×10000 次你不会变差」。</b> <span class='w'>它不保证你手上这一次成功</span>——这是所有高概率保证的共同性质。", "<b>一般形式 <code>Pr(V<sup>A(D)</sup> ≥ V<sub>min</sub>) ≥ 1−δ</code> 把参照系放开了。</b> <code>V<sub>min</sub></code> 可以是行为策略的值，也可以是任何你定的底线。<span class='k'>这让同一套机器可以服务不同的约定</span>——比如「不低于现有水平的 95%」。", "<b>注意目标里的折扣从 <code>t=1</code> 起且写作 <code>γ<sup>t</sup></code></b>（而不是 <code>γ<sup>t−1</sup></code>），<b>所以第一步的奖励已经被打了一次折</b>。<span class='w'>这与常见写法差一个 γ 的全局因子</span>，<b>比较不同来源的公式时要先对齐</b>——本课 13 讲共统计出 165 条记号陷阱。", "<b>轨迹长度写作 L 而不是 H 或 T</b>，且是有限的。<b>这一点在后面很要紧</b>：重要性采样的权重是 <code>L</code> 个比值的连乘，<span class='k'>L 越大权重的方差越可怕</span>。", "<b>把 V^π 的定义和 p23 的 IS 估计量并排看，能看清 IS 到底在估什么。</b> <code>V^π = E[Σ γ^t R_t | π]</code> 里的期望是<b>对 π 产生的轨迹分布</b>取的；<span class='k'>而你手上的轨迹是 π_b 产生的</span>。<b>重要性权重做的就是把「按 π_b 的频率出现的样本」重新加权成「按 π_e 的频率」</b>——期望的下标被换掉了，这就是全部。", "<b>记号里有一处值得警惕：π(a|s) 被写成了 π(a) = P(a_t=a | s_t=s)。</b> <span class='w'>左边省掉了 s，右边又条件在 s 上</span>——这是课件的简写，不是定义不一致。<b>后面 p23 的式子里写的是完整的 π_e(a_t|s_t)</b>，以那个为准。", "<b>「D 是随机变量」这个强调不是形式主义，它决定了保证能说什么。</b> <span class='k'>如果 D 是固定的，那么 A(D) 也是固定的，「以 1−δ 概率」就无从谈起</span>。<b>保证的随机性全部来自「数据本可以是别的样子」</b>——所以它回答的是「这套方法可靠吗」，不是「这次结果对吗」。"], "eq": "安全批量 RL 算法的定义：\n\n   Pr( V^{A(D)}  ≥  V^{π_b} )  ≥  1 − δ\n       └ 算法输出 ┘  └ 行为策略 ┘\n\n   一般形式： Pr( V^{A(D)} ≥ V_min ) ≥ 1 − δ\n\n⚠ 概率是对「数据 D 可能是什么样」取的，不是对策略执行取的\n   它不保证你手上这一次成功，而是保证整套流程重复多次时的失败比例 ≤ δ", "tbl": {"head": ["符号", "含义", "要注意的"], "rows": [["π<sub>b</sub>", "行为策略（数据来自它）", "<b>它的值可以直接从 D 算</b>（on-policy）"], ["π<sub>e</sub>", "评估策略（想知道它值多少）", "没跑过"], ["D = {T₁…T<sub>n</sub>}", "n 条轨迹", "<b>D 是随机变量</b>"], ["A(D)", "算法输出的策略", "<b>也是随机变量</b>"], ["L", "轨迹长度", "<span class='w'>IS 权重是 L 个比值的连乘</span>"], ["γ<sup>t</sup>，t 从 1 起", "折扣", "<b>第一步已打一次折</b>，与常见写法差一个 γ"]]}, "tip": {"t": "记号", "v": "两处要当心：① p17 把策略写成 <code>π(a) = P(a<sub>t</sub>=a | s<sub>t</sub>=s)</code>，<span class='w'>左边省了 s 右边又条件在 s 上</span>——这是简写，以 p23 的 <code>π<sub>e</sub>(a<sub>t</sub>|s<sub>t</sub>)</code> 为准；② 折扣写作 <code>γ<sup>t</sup></code> 且 t 从 1 起，<b>第一步已打一次折</b>，与常见的 <code>γ<sup>t−1</sup></code> 差一个全局因子 γ。<span class='k'>跨来源比较公式前先对齐这两条</span>。"}, "res": {"tag": "推断", "v": "<b>p18 那一行式子，是你论文里「保证」那一节该写的句子的模板。</b><br>把符号换成你的：<code>Pr( G(config*) ≥ G(当前固定配置) ) ≥ 1 − δ</code>，<span class='k'>其中概率是对「留出集可能抽到哪些 query」取的</span>。<br><b>这个写法有三个好处</b>：<br>① <b>它把「提升了 x%」换成了一个带置信度的承诺</b>，而后者经得起「提升是否落在种子方差内」那一拳；<br>② <b>它明确了随机性的来源是数据抽样</b>，于是读者知道这个保证在说什么、不在说什么；<br>③ <b>它给了 δ 一个位置</b>——δ 由使用者选，这把「多大的风险可接受」从技术问题还原成约定问题。<br><b>而你有一个本讲设定没有的便利</b>：右边那一项 <code>G(当前配置)</code> 是 on-policy 的，<span class='k'>可以从日志精确算出，没有不确定性</span>。本讲里两端都要估，<b>你只需要估左边一端</b>。<br>⚠️ <b>但「D 是随机变量」这件事要想清楚你的 D 是什么。</b> 如果留出集是固定选定的那 300 条 query，<span class='w'>那它不是随机变量，上面那个概率就无从谈起</span>。<b>正确的做法是把 D 理解成「从 query 分布中独立抽取的 n 条」</b>，于是概率是对这次抽样取的——<b>而这要求你的留出集确实是随机抽的，而且抽完之后没再动过</b>。<span class='k'>如果你在留出集上调过任何东西，这个前提就破了</span>（p15 第四条限定）。<br>标【推断】：模板与三条好处是我写的；on-policy 值可精确算在简报里是【已核】。", "ref": "课件 p18 原文 · 简报 §4a（白送的两个点，已核）· §7 第 6 拳（已核）· 本讲 p15"}},
{"r": [19, 20], "t": "三段式配方：整讲的骨架", "star": 3, "quote": "<b>Create a safe batch RL algorithm</b><br>① <b>OPE</b> — <em>For any evaluation policy π<sub>e</sub>, convert historical data D into <b>n independent and unbiased estimates</b> of V<sup>π<sub>e</sub></sup></em><br>② <b>HCOPE</b> — <em>Use a <b>concentration inequality</b> to convert the n independent unbiased estimates into a <b>1−δ confidence lower bound</b> on V<sup>π<sub>e</sub></sup></em><br>③ <b>SPI</b> — <em>Use HCOPE method to create a safe batch RL algorithm</em>", "one": "<b>三步：先把数据变成 n 个独立无偏的估计，再把这 n 个数变成一个置信下界，最后用这个下界去决定换不换策略。</b>", "pts": ["<b>这张配方是整讲的骨架，后面所有内容都挂在这三格上。</b> <span class='k'>p24、p48、p60 会三次回到这一页</span>，每次标记「现在做到哪一格」——<b>读不下去时翻回来看一眼。</b>", "<b>第一格的措辞极其精确：<em>n independent and unbiased estimates</em>。</b> 不是「一个估计」，而是 <b>n 个</b>——<span class='w'>因为第二格的集中不等式需要一组独立样本才能用</span>。<b>每条轨迹贡献一个估计，n 条轨迹给 n 个</b>。", "<b>「独立」这个要求决定了很多设计。</b> 轨迹之间要独立（不同的回合），<span class='k'>而且估计不能共享参数</span>——这也是为什么后面加权 IS 会带来麻烦：它用了所有轨迹的权重和做分母，<b>于是各条之间不再独立</b>。", "<b>第二格「集中不等式」是本讲最脆弱的一环，而课件暂时没说。</b> p26 会先给 Hoeffding，<span class='w'>然后 p49–51 会演示它在这里彻底失效</span>（给出 −5 百万的下界）。<b>所以这三格里第二格要返工两次。</b>", "<b>第三格只有一句话，但它藏着本讲最独特的设计</b>：有了下界之后怎么决定？<b>如果下界不够高，就不换</b>——<span class='k'>算法被允许拒绝输出新策略</span>。p27–28 与 p61 会展开。", "<b>这个配方还有一个结构上的优点值得点明：三格之间的接口是干净的。</b> 第一格输出「n 个独立无偏估计」，<span class='k'>第二格只要这个</span>，不关心它们怎么来的；第二格输出「一个下界」，<span class='k'>第三格只要这个</span>。<b>于是三格可以各自独立改进</b>——本讲后面正是这么做的：p29–47 只换第一格，p49–59 只换第二格，<b>而第三格的逻辑从头到尾没变</b>。<span class='w'>这种「接口固定、实现可换」的结构在方法论上值得学</span>。"], "tbl": {"head": ["格", "输入", "输出", "靠什么", "后面在哪返工"], "rows": [["① <b>OPE</b>", "历史数据 D", "<b>n 个独立无偏估计</b>", "重要性采样", "<b>p29–p47</b>（每步 IS / 加权 IS / DR / MAGIC）"], ["② <b>HCOPE</b>", "n 个估计", "<b>1−δ 置信下界</b>", "集中不等式", "<span class='w'>p49–p59</b>（Hoeffding 失效）</span>"], ["③ <b>SPI</b>", "下界", "换 / 不换", "比较下界与 V<sup>π<sub>b</sub></sup>", "p61"]]}, "res": {"tag": "推断", "v": "<b>这三格是你整个评估流程的标准结构，而你目前只有第一格的一部分。</b><br><b>① OPE</b>——你有穷举 oracle（在留出集上是<b>精确值</b>，比「无偏估计」更强）。<span class='k'>但注意第一格要的是「n 个<b>独立</b>的估计」</span>，而 oracle 表给的是「每条 query 的精确值」——<b>这其实正好符合</b>：每条 query 一个数，query 之间独立。<br><b>② HCOPE</b>——<span class='w'>这一格你现在是空的</span>。你有点估计，没有置信下界。<b>而这正是「上线前确信不更差」与「平均看起来更好」的全部差别</b>。<br><b>③ SPI</b>——也是空的，但它依赖第二格。<br><b>好消息是：因为你的第一格给的是精确值而非 IS 估计，第二格会容易得多。</b> 本讲 p49–59 那整段痛苦（Hoeffding 在 IS 上失效、要截尾、要换不等式）<span class='k'>根源都是 IS 权重的范围 b 随 L 指数爆炸</span>。<b>而 oracle 表没有权重</b>——每条 query 的 G 就落在一个已知的有界区间里（Acc∈[0,1]，Cost 有上限）。<b>所以你可以直接对 n 条 query 的 G 用标准的集中不等式，b 是真实的、小的</b>。<br><b>这是你相对本讲设定的最大优势，值得专门写一段</b>：我们不走 IS 路线，所以不继承 IS 的方差灾难；代价是结论只在留出集覆盖的配置上成立。<br>标【推断】：三格对照与「第二格会容易得多」是我推的；oracle 的精确性在简报里是【已核】。", "ref": "课件 p20 · 简报 §4d（oracle，已核）· 本讲 p49–p51（Hoeffding 失效）"}, "tip": {"t": "记这一条", "v": "<b>三格之间的接口是干净的，这是本讲方法论上最值得学的地方。</b> 第一格输出「n 个独立无偏估计」，第二格只要这个；第二格输出「一个下界」，第三格只要这个。<span class='k'>于是三格可以各自独立改进</span>——本讲后面正是这么做的，而<b>第三格的逻辑从头到尾一个字没改</b>。"}},
{"r": [21, 23], "t": "重要性采样：环境的因子全部约掉", "star": 3, "quote": "<b>Off-policy policy evaluation (OPE)</b> · <b>Importance Sampling</b><br><b><em>IS(D) = (1/n) Σ<sub>i=1</sub><sup>n</sup> [ Π<sub>t=1</sub><sup>L</sup> π<sub>e</sub>(a<sub>t</sub>|s<sub>t</sub>) / π<sub>b</sub>(a<sub>t</sub>|s<sub>t</sub>) ] · [ Σ<sub>t=1</sub><sup>L</sup> γ<sup>t</sup>R<sup>i</sup><sub>t</sub> ]</em></b><br><em><b>E[IS(D)] = V<sup>π<sub>e</sub></sup></b></em>", "one": "<b>每条轨迹按「两个策略产生它的概率之比」加权，再平均。而这个比值里，环境的所有因子都约掉了。</b>", "pts": ["<b>先把式子的结构看清：外层是对 n 条轨迹求平均，内层每条轨迹是「权重 × 该轨迹的折扣回报」。</b> <span class='k'>权重是 L 个单步比值的连乘</span>，回报是这条轨迹实际拿到的。", "<b>为什么权重里只剩策略，环境去哪了？</b> 因为一条轨迹的概率是 <code>P(s₁)·Π[π(a<sub>t</sub>|s<sub>t</sub>)·P(r<sub>t</sub>|s<sub>t</sub>,a<sub>t</sub>)·P(s<sub>t+1</sub>|s<sub>t</sub>,a<sub>t</sub>)]</code>，<span class='w'>而初始状态分布、奖励分布、转移分布都不依赖策略</span>——<b>求比值时上下完全相同，全部约掉</b>。L03 p59 推过这一步。", "<b>这个约掉带来了两个极强的性质，而且它们是本讲 IS 路线的全部底气</b>：<br>① <b>不需要模型</b>——转移概率根本没出现在式子里；<br>② <b>不需要 Markov 假设</b>——它对整条轨迹加权，从不把某个状态当成未来的充分统计量。<br><span class='k'>在本课所有估计量里，这是假设最少的一个</span>。", "<b>注意这里的 <code>1/n</code>。</b> <span class='w'>L03 p60 那个版本漏掉了它</span>——同一门课两处写同一个估计量，这里是对的。<b>少了 1/n，估计量会随样本数线性增长。</b>", "<b><code>E[IS(D)] = V<sup>π<sub>e</sub></sup></code> 这一行是「无偏」的声明</b>，而它正好对应三段式配方第一格要的「unbiased estimates」。<b>但无偏只是第一格的要求，第二格还要求方差可控</b>——<span class='k'>而那正是 IS 做不到的地方</span>，p49 会摊开。", "⚠️ <b>重要性采样用在 RL 上的出处，她在课上提了</b>：<em>I think it was first used for RL in Doina Precup's paper, Precup 2000, around then. It's been around for a lot longer</em>。<b>想法本身在统计学里早得多。</b>", "<b>一个实现上的要点：权重的连乘应当在对数域里算。</b> <span class='w'>L 个比值相乘，很容易下溢到 0 或上溢到 inf</span>，<b>而一旦下溢成 0，那条轨迹就被静默丢弃了</b>——<span class='k'>这会造成一个看不见的偏差，而且不会报错</span>。正确做法是累加 <code>log π_e − log π_b</code>，最后再统一取指数并做数值稳定处理。<b>课件不会提这种事，但它是实际跑 IS 时最常见的 bug 来源之一。</b>"], "eq": "IS(D) = (1/n) Σ_{i=1..n}  [ Π_{t=1..L}  π_e(a_t|s_t) / π_b(a_t|s_t) ]  ·  [ Σ_{t=1..L} γ^t R^i_t ]\n                             └──────── 权重 w_i ────────┘      └── 这条轨迹的回报 ──┘\n\n为什么只剩策略：轨迹概率 = P(s₁) · Π[ π(a|s) · P(r|s,a) · P(s'|s,a) ]\n                                        └ 依赖策略 ┘  └──── 不依赖策略，约掉 ────┘\n\n⇒ 不需要模型，不需要 Markov 假设      E[IS(D)] = V^{π_e}（无偏）", "tbl": {"head": ["IS 不需要什么", "为什么", "代价"], "rows": [["环境模型", "转移与奖励分布在比值里约掉", "—"], ["Markov 假设", "对整条轨迹加权，不做充分统计量假设", "—"], ["—", "—", "<b>必须知道 π<sub>b</sub> 的动作概率</b>"], ["—", "—", "<b>必须满足覆盖条件</b>（下一条）"], ["—", "—", "<span class='w'>权重是 L 个比值的连乘 ⇒ 方差随 L 爆炸</span>"]]}, "res": {"tag": "已核", "v": "<b>这一页的两个「不需要」，正好匹配你对 workflow 几乎一无所知的处境。</b><br>你建不出 workflow 的转移模型（给定当前节点与保真度，下一个节点的输入分布是什么？没人写得出来），<span class='k'>而 IS 根本不问这个</span>。你也不知道节点状态是不是充分统计量（那正是 P2/P3 消融在检验的），<span class='k'>而 IS 也不问</span>。<br><b>但代价那一栏的两条你都踩了</b>：<br><b>① 必须知道 π<sub>b</sub> 的动作概率。</b> 讲稿里她专门讨论了什么时候能知道——<em>when your decisions were made by reinforcement learning agents, or supervised learning agents … <b>we have access to the code that is being used to generate decisions automatically. In that case, we can just look it up, <span class='w'>as long as we've saved it</span></b></em>。<br><b>你正是她说的这种情形</b>：决策由 AFlow 的代码做出，π<sub>b</sub> 原则上完全可知。<span class='w'>唯一的问题是「有没有存」</span>——而这正是简报列为<b>第 1 天</b>的动作：审计日志，确认记的是动作分布还是只有实际 model id。<b>她那句 as long as we've saved it 把这件事的全部重量压在了一个工程决定上。</b><br><b>② 覆盖条件</b>——下一条展开，你不满足。<br><b>还有一条必须跟着记：L03 p60 漏了 1/n，这里没漏。</b> 写代码时以这一页为准。", "ref": "课件 p23 原文 · 讲稿实录（π_b 可知性，逐句核对）· 简报 §9 动作表第 1 条（已核）· L03 p59–60"}, "tip": {"t": "记这一条", "v": "<b>IS 的两个「不需要」是它在本课里最独特的地方，值得和别的估计量并排记</b>：<span class='k'>不需要模型</span>（转移与奖励在比值里约掉）、<span class='k'>不需要 Markov 假设</span>（对整条轨迹加权，不做充分统计量假设）。<b>对照：TD / FQE 两样都要，确定性等价要模型。</b><span class='w'>代价是方差——假设越少，方差越大</span>，这与 L03 p28 说的「方差是 MC 为诚实付的价钱」是同一句话。"}},
{"r": [24, 26], "t": "覆盖条件，与 Hoeffding 的登场", "star": 3, "quote": "<b>HCOPE</b> — <em>Use a concentration inequality to convert the n independent unbiased estimates into a 1−δ confidence lower bound</em><br><b>Hoeffding's inequality</b> — <em>Let X₁,…,X<sub>n</sub> be i.i.d. with <b>X<sub>i</sub> ∈ [0, b]</b>. Then with probability at least 1−δ:</em><br><b><em>E[X<sub>i</sub>] ≥ (1/n)Σ<sub>i</sub>X<sub>i</sub> − b·√(ln(1/δ)/(2n))</em></b><br><em>where X<sub>i</sub> = w<sub>i</sub>·Σ<sub>t</sub>γ<sup>t</sup>R<sup>i</sup><sub>t</sub> in our case</em>", "one": "<b>有了 n 个无偏估计，用 Hoeffding 把它们变成一个下界。式子里那个 b 是取值范围——它会在 p49 要了这套方法的命。</b>", "pts": ["<b>先补上课件没写但讲稿讲了的覆盖条件</b>：<code>π<sub>e</sub>(a|s) &gt; 0 ⟹ π<sub>b</sub>(a|s) &gt; 0</code>。<span class='k'>凡是评估策略可能选的动作，行为策略必须也有正概率选到</span>——否则那一项的分母为 0，<b>估计量没有定义</b>。", "<b>她对这个条件的直觉说法非常好用</b>：<em>you can think of the behavior policy as kind of defining a <b>ball</b> under which you can evaluate other potential policies … you kind of have a radius … these are essentially the policies for which you have support over, and <b>anything else you can't evaluate</b></em>。<span class='w'>行为策略在策略空间里画了一个球，球外的策略你根本评不了</span>。", "<b>她还给了一个让人警觉的例子</b>：<em>under a random behavior policy in Montezuma's Revenge or Atari, you're never gonna get to see a lot of states … unless you have an enormous amount of data</em>。<b>覆盖条件「听起来不太严格，但实践中可能是个大问题」</b>——这是她的原话大意。", "<b>Hoeffding 这一页的关键是那个 <code>b</code>：随机变量的取值范围。</b> 下界里 <code>b</code> 是<b>线性</b>进去的，所以 <span class='k'>b 大一倍，下界就松一倍</span>。<b>而最后一行点明了在这里 <code>X<sub>i</sub> = w<sub>i</sub>·Σγ<sup>t</sup>R<sup>i</sup><sub>t</sub></code>——它带着重要性权重</b>。", "<b>现在就可以预见灾难了</b>：权重 <code>w<sub>i</sub></code> 是 L 个比值的连乘，<span class='w'>它能有多大取决于 π<sub>b</sub> 的最小概率，量级是 <code>(1/π<sub>min</sub>)<sup>L</sup></code></b>。<b>于是 b 随轨迹长度指数增长，而下界与 b 成正比。</b> p49 会把这件事算成一个具体的数。", "⚠️ <b>Hoeffding 要求 i.i.d.</b>。这里靠的是「不同轨迹之间独立」——<span class='k'>这也是三段式配方第一格坚持要 n 个<b>独立</b>估计的原因</span>。", "<b>顺带把三条「什么时候 IS 用不了」收齐，它们的性质各不相同</b>：<b>① 不知道 π<sub>b</sub></b> ⇒ 权重算不出来（工程问题，可能靠补记录解决）；<b>② 覆盖条件不满足</b> ⇒ <span class='w'>估计量没有定义</span>（结构问题，只能改数据采集）；<b>③ 覆盖满足但权重方差爆炸</b> ⇒ 估计量有定义但没用（统计问题，靠加权 IS / DR / 截尾缓解）。<span class='k'>三者常被笼统地说成「IS 不好用」，但对应的解法完全不同</span>。"], "eq": "覆盖条件（讲稿补，课件未写成式子）：\n   π_e(a|s) > 0   ⟹   π_b(a|s) > 0\n   否则分母为 0，估计量**没有定义**（不是方差大）\n\nHoeffding：X_i ∈ [0, b] 且 i.i.d.，则以概率 ≥ 1−δ\n   E[X_i]  ≥  (1/n) Σ X_i  −  b · sqrt( ln(1/δ) / (2n) )\n                               └ b 线性进入 ⇒ b 大一倍，下界松一倍 ┘\n\n而在这里 X_i = w_i · Σ_t γ^t R^i_t ，w_i 是 L 个比值的连乘\n⇒ b 的量级是 (1/π_min)^L  ——  随 L 指数增长", "tbl": {"head": ["", "内容", "后果"], "rows": [["覆盖条件", "π<sub>e</sub>&gt;0 处 π<sub>b</sub> 必须 &gt;0", "<b>不满足 ⇒ 估计量无定义</b>"], ["「球」的直觉", "π<sub>b</sub> 在策略空间里画一个球", "<b>球外的策略评不了</b>"], ["Hoeffding 的 b", "随机变量的取值范围", "<b>线性进入下界</b>"], ["这里的 X<sub>i</sub>", "w<sub>i</sub> × 折扣回报", "<span class='w'>b ~ (1/π<sub>min</sub>)<sup>L</sup>，指数爆炸</span>"]]}, "res": {"tag": "推断", "v": "<b>覆盖条件你不满足，而且「球」这个直觉正好说明了该怎么办。</b><br>AFlow 的日志是确定性的，π<sub>b</sub>(a|h) ∈ {0,1}——<span class='w'>用她的比喻说，你的「球」半径是 0</span>：只有行为策略自己落在球里，<b>任何不同的配置都在球外，评不了</b>。这就是 deficient support，而且它不是方差问题，是定义问题。<br><b>「球」这个比喻给了两条出路，而且它们是本讲框架下仅有的两条</b>：<br><b>① 把球撑大</b>——给节点执行器加随机化并记 propensity。<span class='k'>但球撑大是有代价的</span>：均匀随机化 k 个节点时 <code>E[ESS] = n·2^(−k)</code>，<b>球大了但球里的点变稀了</b>。所以要先做一步偏离扫描把 k 压到 3~4，<b>这是在「球要多大」和「球里要多密」之间取平衡</b>。<br><b>② 换一种不需要球的方法</b>——穷举 oracle。它不是把数据重新加权，<span class='k'>而是真的把每个配置都跑一遍</span>，所以根本不需要覆盖条件。<b>代价是只在枚举过的配置与留出的 query 上成立。</b><br><b>这两条正是简报 §4c 与 §4d，而本讲给了它们一个统一的解释</b>：①在扩大可评估的策略集，②在放弃「用旧数据评估」转而直接测量。<b>把这个对照写进论文，比单独介绍任一条都清楚。</b><br>标【推断】：用「球」统一解释两条路线是我做的；ESS 推导与两条动作在简报里是【已核】。", "ref": "讲稿实录（ball 比喻，逐句核对）· 简报 §4a（deficient support）· §4b（ESS）· §4c §4d（已核）"}, "tip": {"t": "记这一条", "v": "<b>「IS 用不了」有三种，解法完全不同，别混为一谈</b>：<br><b>① 不知道 π<sub>b</sub></b> —— 权重算不出来。<span class='k'>工程问题</span>，决策若由代码做出就「只要存了就能查」。<br><b>② 覆盖条件不满足</b> —— <span class='w'>估计量没有定义</span>。<b>结构问题</b>，加再多数据也没用，只能改数据采集。<br><b>③ 覆盖满足但方差爆炸</b> —— 有定义但没用。<b>统计问题</b>，靠加权 IS（p31）、双重稳健（p33）、截尾（p52）缓解。<br><span class='k'>诊断时先问是哪一种</span>——问错了会在②上浪费时间做③的功夫。"}},
{"r": [27, 28], "t": "安全策略改进：算法可以拒绝", "star": 3, "quote": "<b>Safe policy improvement (SPI)</b>〔两页以图为主，正文在讲授中〕", "one": "<b>有了下界之后的决策规则：只有当新策略的置信下界高于当前策略的值时才换，否则就不换。</b>", "pts": ["<b>这是三段式配方的最后一格，而它的逻辑简单到一句话</b>：<span class='k'>比较「新策略值的 1−δ 置信下界」与「当前策略的值」</span>——<b>前者高才换</b>。", "<b>为什么用下界而不是点估计？因为安全性要求的是单边的。</b> 你怕的是「换了之后更差」，<span class='w'>不怕「其实它比你以为的还好」</span>。<b>所以只需要一个下界，而且下界越保守越安全</b>——代价是更容易错过真正的改进。", "<b>这个设计最特别的地方是：算法被允许拒绝。</b> 如果所有候选策略的下界都不够高，<b>它就返回「不换」</b>——<span class='k'>而「不换」永远是安全的</span>，因为当前策略的值就是 <code>V<sup>π<sub>b</sub></sup></code> 本身。<b>这保证了 <code>Pr(V<sup>A(D)</sup> ≥ V<sup>π<sub>b</sub></sup>) ≥ 1−δ</code> 这个式子在最坏情况下也成立。</b>", "<b>「可以拒绝」在机器学习里不常见，值得停一下。</b> 大多数算法被要求总是输出点什么；<span class='w'>而这里「我不知道」是一个合法且有价值的输出</span>。<b>它把「没有足够证据」与「证据表明不好」区分开了</b>——两者都导致不换，但含义完全不同。", "⚠️ <b>这两页在 PDF 上以图为主。</b> 具体的算法形式要等到 p61「Safe policy improvement (revisited)」——那时候前面两格都已经返工过了。"], "tbl": {"head": ["情形", "下界 vs V<sup>π<sub>b</sub></sup>", "决策", "安全吗"], "rows": [["证据充分且新策略确实更好", "下界 &gt; V<sup>π<sub>b</sub></sup>", "<b>换</b>", "是（以 1−δ 概率）"], ["证据不足", "下界 &lt; V<sup>π<sub>b</sub></sup>", "<b>不换</b>", "<b>是（恒成立）</b>"], ["新策略确实更差", "下界 &lt; V<sup>π<sub>b</sub></sup>", "不换", "是"]]}, "res": {"tag": "推断", "v": "<b>「算法可以拒绝」这个设计，是你最该从这一讲搬走的东西之一——而且它改变的是结论的写法，不是算法。</b><br>你现在的流程必然输出一个 config*（<code>argmax</code> 总会给出一个）。<span class='w'>而这一页说：如果证据不足，正确的输出是「保持现状」</span>。<br><b>具体化到你的设定</b>：对每个候选配置算一个 G 的 1−δ 置信下界，<b>只有当某个配置的下界高于当前固定配置的 G 时才推荐切换</b>；<span class='k'>如果没有配置过关，结论就是「在现有数据下，没有证据支持切换」</span>。<br><b>这个结论看起来像是负面结果，其实是一篇论文里很有分量的一句话</b>——它把「我们的方法提升了 x%」换成了「我们的方法在 1−δ 置信下能保证不更差，并在 m 个 benchmark 上找到了确实更优的配置」。<span class='k'>后者经得起审稿人第 6 拳（提升是否落在种子方差内）</span>。<br><b>而且你有一个本讲设定没有的便利</b>：当前配置的值 <code>V<sup>π<sub>b</sub></sup></code> 在你这里是<b>精确已知</b>的（on-policy，直接从日志算），<span class='k'>所以比较的一端没有不确定性</span>。本讲里两端都要估，你只要估一端。<br>⚠️ <b>但别忘了多重比较</b>：你有 2187 个候选，<span class='w'>每个都做一次 1−δ 的检验，整体失败概率会远超 δ</span>。<b>要么对 δ 做 Bonferroni 式的修正，要么先用 split A 把候选缩到少数几个再在 split B 上检验</b>——后者就是 L04 p43 的做法，而且更省统计功效。<br>标【推断】：对应与多重比较提醒是我做的；审稿人第 6 拳在简报里是【已核】。", "ref": "课件 p27–p28 · L04 p43（split samples）· L02 p30 科研格（2187 候选）· 简报 §7 第 6 拳（已核）· §4a（白送的两个点）"}, "tip": {"t": "读法", "v": "p27–28 只是第一遍。<b>真正的 SPI 算法在 p61</b>，那时前两格都已经返工过（第一格换成 MAGIC，第二格换成截尾后的单边界）。<span class='k'>所以这两页记住「比较下界与 V<sup>π<sub>b</sub></sup>，不够就拒绝」这一条逻辑就够</span>，细节留到 p61。"}},
{"r": [29, 29], "t": "每步重要性采样：未来影响不了已经拿到的奖励", "star": 3, "quote": "<b>Off-policy policy evaluation</b><br><b>IS</b>: <em>IS(D) = (1/n) Σ<sub>i</sub> [ Π<sub>t=1</sub><sup>L</sup> π<sub>e</sub>/π<sub>b</sub> ] ( Σ<sub>t=1</sub><sup>L</sup> γ<sup>t</sup>R<sup>i</sup><sub>t</sub> )</em><br><b>Per-decision IS (PDIS)</b>: <em>PDIS(D) = Σ<sub>t=1</sub><sup>L</sup> γ<sup>t</sup> (1/n) Σ<sub>i</sub> [ <b>Π<sub>τ=1</sub><sup>t</sup></b> π<sub>e</sub>(a<sub>τ</sub>|s<sub>τ</sub>)/π<sub>b</sub>(a<sub>τ</sub>|s<sub>τ</sub>) ] R<sup>i</sup><sub>t</sub></em>", "one": "<b>把两个式子叠起来看，差别只有一处：内层连乘的上限从 L 变成了 t。</b>", "pts": ["<b>朴素 IS 用<b>整条轨迹</b>的权重去乘<b>整条轨迹</b>的回报</b>；<span class='k'>PDIS 把回报拆成逐步的，每一步只乘到那一步为止的权重</span>。<b>一个字的差别——<code>Π<sub>τ=1</sub><sup>t</sup></code> 而不是 <code>Π<sub>t=1</sub><sup>L</sup></code>——就是全部改动。</b>", "<b>理由是一句朴素到近乎显然的话：未来的动作影响不了已经拿到的奖励。</b> <code>R<sub>t</sub></code> 在 t 时刻就已经收到了，<span class='w'>而 t 之后的那些 <code>π<sub>e</sub>/π<sub>b</sub></code> 比值是在描述 t 之后的行为</span>——<b>拿它们去给 <code>R<sub>t</sub></code> 加权，纯粹是在往估计量里注入无关的噪声</b>。", "<b>去掉这些无关因子不改变期望（仍然无偏），但方差严格下降。</b> <span class='k'>这是一次「免费」的改进</span>——不需要额外假设、不需要额外数据、不引入偏差。本讲后面的每一步改进都要付代价，<b>只有这一步不用</b>。", "<b>这个论证你在 L08–L09 见过一模一样的版本：策略梯度里的基线与「未来不影响过去」。</b> <span class='k'>两处用的是同一个结构性事实</span>——<b>在期望里，与被加权量独立的因子可以摘掉而不改变期望</b>。记住这个模式，后面 p34 的控制变量还是它的变形。", "⚠️ <b>注意 PDIS 的外层求和与内层求和顺序：先对 t 求和，再对样本 i 求平均。</b> <span class='w'>两层顺序写反不影响数值，但写代码时容易把权重算错</span>——每个 (i, t) 都有自己的累积权重 <code>Π<sub>τ≤t</sub></code>，要按时间逐步累乘。"], "eq": "IS  (D) = (1/n) Σ_i  [ Π_{t=1..L} ρ_t^i ]  ·  ( Σ_{t=1..L} γ^t R_t^i )\n                       └─ 整条轨迹的权重 ─┘     └─ 整条轨迹的回报 ─┘\n\nPDIS(D) = Σ_{t=1..L} γ^t · (1/n) Σ_i  [ Π_{τ=1..t} ρ_τ^i ]  ·  R_t^i\n                                        └─ 只到 t ─┘\n\n其中 ρ_t = π_e(a_t|s_t) / π_b(a_t|s_t)\n\n理由：未来的动作影响不了已经拿到的 R_t ⇒ 摘掉 t 之后的因子\n结果：仍然无偏，方差严格下降 —— 本讲唯一一次「免费」的改进", "tbl": {"head": ["", "朴素 IS", "<b>PDIS</b>"], "rows": [["R<sub>t</sub> 乘的权重", "<b>Π 到 L</b>（整条）", "<b>Π 到 t</b>（只到当前）"], ["无偏", "是", "<b>是</b>"], ["方差", "大", "<b>严格更小</b>"], ["代价", "—", "<b>没有代价</b>"], ["同样的论证在哪见过", "—", "<b>L08–L09 策略梯度的基线</b>"]]}, "res": {"tag": "已核", "v": "<b>PDIS 对你这个问题的准确率那一半，一点好处都没有——而这件事可以一眼看出来。</b><br>PDIS 的收益来自「把 <code>R<sub>t</sub></code> 身上多余的权重摘掉」。<span class='k'>而你的奖励只在 t=H 出现</span>（整条 workflow 跑完才知道答对没有），<b>中间所有 <code>R<sub>t</sub></code> 都是 0</b>。<br>于是 PDIS 的求和里只有最后一项非零，而那一项要乘的权重是 <code>Π<sub>τ=1</sub><sup>H</sup></code>——<span class='w'>正好就是整条轨迹的权重</span>。<b>PDIS 在算术上退化成了朴素轨迹 IS。</b><br><b>但对成本那一半不同。</b> 成本是<b>逐节点累积</b>的：每个节点调用 LLM 都产生 token 开销，<span class='k'>所以 <code>R<sub>t</sub></code> 在每一步都非零</span>。<b>PDIS 在这一半上是有实质增益的</b>——节点 t 的成本只该被前 t 步的权重加权。<br><b>所以这一页给了「两半分开估」第四个独立的理由</b>：<br>① 可学性差一个数量级（简报 §4e）；<br>② 只有准确率那一半暴露在致命三件套下（L03 p41）；<br>③ 确定性等价的核心风险只打中准确率那一半（L03 p48）；<br>④ <b>PDIS 只对成本那一半有效</b>（本页）。<br><span class='k'>四条理由来自四个不同的角度，指向同一个设计</span>——这在论文里是很强的论证结构。", "ref": "课件 p29 · 简报 §4e（PDIS 对终局奖励无增益，已核）· L03 p41 · L03 p48 科研格"}, "tip": {"t": "记这一条", "v": "<b>「未来影响不了已经拿到的奖励」这条原则在本讲出现了三次</b>：<b>① PDIS</b>（本页，摘掉 t 之后的权重）；<b>② DR 式子里 v̂(S<sub>t</sub>) 的权重下标是 t−1</b>（p36）；<b>③ 策略梯度的基线</b>（L08–L09，同一个结构）。<span class='k'>它的一般形式是：在期望里，与被加权量独立的因子可以摘掉而不改变期望</span>。<b>看到估计量里有「多余的乘积项」，先问它和被乘的量是不是独立的。</b>"}},
{"r": [30, 32], "t": "加权重要性采样：有偏，但方差小得多", "star": 3, "quote": "<b>Weighted importance sampling (WIS)</b><br><em>WIS(D) = (1 / Σ<sub>i=1</sub><sup>n</sup> w<sub>i</sub>) Σ<sub>i</sub> w<sub>i</sub> ( Σ<sub>t</sub> γ<sup>t</sup>R<sup>i</sup><sub>t</sub> )</em><br><em><b>Biased.</b> When n = 1, <b>E[WIS] = V(π<sub>b</sub>)</b></em> · <em><b>Strongly consistent</b> estimator of V<sup>π<sub>e</sub></sup></em>, i.e. <em>Pr(lim<sub>n→∞</sub> WIS(D) = V<sup>π<sub>e</sub></sup>) = 1</em><br><em>If: Finite horizon · One behavior policy, or bounded rewards</em><br>p32: <em>Weighted per-decision IS — <b>A fun exercise!</b></em>", "one": "<b>把分母从 n 换成权重和。一个符号的改动，换来有偏但方差小得多的估计量。</b>", "pts": ["<b>改动只有分母：<code>1/n</code> → <code>1/Σw<sub>i</sub></code>。</b> <span class='k'>直觉是「按权重做加权平均，而不是按样本数做算术平均」</span>——<b>权重大的轨迹本来就该算得重一些，而归一化让总权重始终为 1</b>。", "<b>n=1 时的那个性质极其说明问题：<code>E[WIS] = V(π<sub>b</sub>)</code>。</b> 只有一条轨迹时，分子分母的 <code>w₁</code> 直接约掉，<span class='w'>剩下的就是那条轨迹的回报——而它来自 π<sub>b</sub></span>。<b>所以 WIS 在小样本下会把答案拉回行为策略的值</b>。<b>这正是它偏在哪里，也正是它方差小的原因：它在保守。</b>", "<b>「强一致」比「一致」更强，值得读准。</b> 式子写的是 <code>Pr(lim<sub>n→∞</sub> WIS = V<sup>π<sub>e</sub></sup>) = 1</code>——<span class='k'>以概率 1 收敛（几乎必然收敛）</span>，不只是依概率收敛。", "<b>但一致性是有条件的，课件把它们列了出来</b>：<b>有限时域</b>，加上<b>单一行为策略，或者奖励有界</b>。<span class='w'>多个行为策略混在一起时，权重的含义会乱掉</span>——这在实际系统里很常见（策略一直在更新）。", "<b>WIS 与 IS 的取舍是本讲第三次出现的同一个模式</b>：L03 p22 的每次访问 vs 首次访问 MC、L03 p41 的 TD vs MC，<b>现在是 WIS vs IS</b>。<span class='k'>三次的结论一致：有偏但方差小的那个，实践中常常赢</span>——因为 <code>MSE = Var + Bias²</code>，偏差是平方进去的。", "⚠️ <b>p32 把「加权的每步 IS」留成了练习（<em>A fun exercise!</em>）。</b> 两种改进可以叠加，<b>但叠加之后一致性的证明要重做</b>——这正是它被留作练习的原因。", "<b>WIS 有一个容易被忽略的副作用：它破坏了「n 个独立估计」这个结构。</b> <span class='w'>分母 Σw_i 用到了所有轨迹</span>，<b>于是每条轨迹的贡献不再是一个独立的数</b>。<span class='k'>而三段式配方的第二格（集中不等式）恰恰要求一组独立样本</span>——<b>所以 WIS 虽然方差小，却不能直接喂给 Hoeffding</b>。这是一个在配方层面的冲突，课件没点明，但它解释了为什么后面 HCOPE 那一节仍然在处理朴素 IS。", "<b>「有限时域」这个条件也要当真。</b> <span class='k'>L 无界时权重的连乘没有上限</span>，<b>WIS 的归一化虽然压住了尺度，却压不住「少数几条轨迹主导全部权重」这种退化</b>——极端情形下一条轨迹的 w 占了 Σw 的 99%，<span class='w'>那 WIS 实际上只用了一个样本</span>。<b>这正是有效样本量 ESS 要度量的东西。</b>"], "eq": "IS (D) = (1/n)        Σ_i w_i ( Σ_t γ^t R_t^i )\nWIS(D) = (1/Σ_i w_i)  Σ_i w_i ( Σ_t γ^t R_t^i )\n          └─ 唯一的改动 ─┘\n\nn = 1 时：w₁ 上下约掉  ⇒  E[WIS] = V^{π_b}\n          （小样本下把答案拉回行为策略，这就是它的偏差方向）\n\n强一致： Pr( lim_{n→∞} WIS(D) = V^{π_e} ) = 1\n条件：   有限时域 + （单一行为策略 或 奖励有界）", "tbl": {"head": ["", "IS", "<b>WIS</b>", "本课同类取舍"], "rows": [["分母", "n", "<b>Σw<sub>i</sub></b>", "—"], ["偏差", "<b>无偏</b>", "有偏（小样本时偏向 V<sup>π<sub>b</sub></sup>）", "—"], ["方差", "<span class='w'>大</span>", "<b>小得多</b>", "—"], ["收敛性", "无偏且一致", "<b>强一致</b>（需额外条件）", "—"], ["实践中谁赢", "—", "<b>通常是 WIS</b>", "每次访问 MC（L03 p22）· TD（L03 p41）"]]}, "tip": {"t": "记这一条", "v": "<b>「有偏但方差小的那个实践中常常赢」，这是本课第三次出现同一个结论。</b><br>L03 p22 每次访问 MC vs 首次访问 · L03 p41 TD vs MC · <b>本页 WIS vs IS</b>。<span class='k'>根源都是 MSE = Var + Bias²，偏差是平方进去的</span>——小偏差的代价是二阶的，而方差的收益是一阶的。<b>但 WIS 有一个前两次没有的副作用</b>：<span class='w'>它的分母用到了所有轨迹，于是破坏了「n 个独立估计」的结构</span>，不能直接喂给后面的集中不等式。"}},
{"r": [33, 34], "t": "控制变量：减方差的通用工具", "star": 3, "quote": "<b>Control variates</b><br>给定 X，要估 <em>μ = E[X]</em>。朴素做法 <em>μ̂ = X</em>，<em>Var(μ̂) = Var(X)</em><br>若另有 Y 且 <b>E[Y] 已知</b>：<em>μ̂ = X − Y + E[Y]</em><br><em>Unbiased: E[μ̂] = E[X] − E[Y] + E[Y] = μ</em><br><em>Var(μ̂) = Var(X − Y) = <b>Var(X) + Var(Y) − 2Cov(X, Y)</b></em><br><em><b>Lower variance if 2Cov(X,Y) &gt; Var(Y)</b></em> · <em>We saw this idea before: <b>baseline term in policy gradient estimation</b></em>", "one": "<b>找一个与 X 相关、但期望已知的 Y，用 X − Y + E[Y] 代替 X。期望不变，方差可能大降。</b>", "pts": ["<b>为什么期望不变？因为你减掉 Y 又把 E[Y] 加回来了。</b> <span class='k'>这是「加一项再减一项」的标准技巧</span>，和 L03 的重要性采样「乘 q/q」是同一类手法——<b>形式上什么都没做，但方差结构变了</b>。", "<b>方差为什么会降？因为 Y 带走了 X 中「可以被预测的那部分波动」。</b> 如果 Y 与 X 高度相关，<code>X − Y</code> 就只剩下 Y 解释不了的残差，<span class='k'>而残差的波动比 X 本身小</span>。<b>Y 越能「预测」X，减得越干净。</b>", "<b>但这不是免费的：Y 自己也有方差。</b> 展开 <code>Var(X−Y) = Var(X) + Var(Y) − 2Cov(X,Y)</code>——<span class='w'>Y 既带走相关的部分（−2Cov），又引入自己的噪声（+Var(Y)）</span>。<b>净收益的条件就是 <code>2Cov(X,Y) &gt; Var(Y)</code>。</b>", "<b>这个条件的含义很直观：Y 必须「相关得足够多，而自己又不太吵」。</b> 一个与 X 无关的 Y（Cov=0）只会让方差变大；<span class='k'>一个本身噪声极大的 Y，即使相关，也可能得不偿失</span>。", "⚠️ <b>实录里她把这个判据说成了「Cov(X,Y) 大于 Var(Y)」，漏掉了那个 2。</b> <b>课件 p34 印的带 2，是对的。</b><span class='k'>口误的方向是偏严</span>（要求 Cov 大一倍才算赢），<b>所以照口误做不会得到错误的结论，只会错过一些本来可用的 Y</b>。", "<b>课件最后一行点出了你已经见过它</b>：<em>baseline term in policy gradient estimation</em>。<b>L08–L09 的基线就是一个控制变量</b>——<span class='k'>减去一个与动作无关的 b(s)，期望不变而方差下降</span>。<b>同一个工具，第二次出现。</b>"], "eq": "控制变量：已知 E[Y]，用  μ̂ = X − Y + E[Y]  代替  μ̂ = X\n\n  无偏：  E[μ̂] = E[X] − E[Y] + E[Y] = E[X] = μ\n  方差：  Var(μ̂) = Var(X) + Var(Y) − 2Cov(X, Y)\n                            └ Y 的噪声 ┘  └ Y 带走的相关部分 ┘\n\n  净赚的条件：  2·Cov(X, Y)  >  Var(Y)\n                 ⚠ 实录口误成 Cov(X,Y) > Var(Y)，漏了 2（偏严，不危险）\n\n同一个工具的第二次出现：策略梯度里的基线（L08–L09）", "tbl": {"head": ["Y 的性质", "−2Cov 项", "+Var(Y) 项", "净效果"], "rows": [["与 X 高度相关、自身方差小", "<b>大</b>", "小", "<b>方差大降</b>"], ["与 X 无关（Cov=0）", "0", "正", "<span class='w'>方差变大</span>"], ["相关但自身噪声极大", "大", "<b>更大</b>", "<span class='w'>得不偿失</span>"], ["判据", "—", "—", "<b>2Cov(X,Y) &gt; Var(Y)</b>"]]}},
{"r": [35, 36], "t": "双重稳健：把控制变量接到 IS 上", "star": 3, "quote": "<b>Off-policy policy evaluation (revisited)</b><br><em>Idea: add a control variate to importance sampling estimators</em> · <em>X is the IS estimator</em> · <em>Y is a control variate <b>built from an approximate model of the MDP</b></em> · <em>E[Y] = 0 in this case</em><br><em>PDIS<sub>CV</sub>(D) = PDIS(D) − CV(D)</em> · <em>Called the <b>doubly robust</b> estimator (<b>Jiang and Li, 2015</b>)</em><br><em>Robust to (1) <b>poor approximate model</b>, and (2) <b>error in estimates of π<sub>b</sub></b></em><br>p36: <em>DR(π<sub>e</sub>|D) = (1/n)Σ<sub>i</sub>Σ<sub>t</sub> γ<sup>t</sup>w<sup>i</sup><sub>t</sub>(R<sup>i</sup><sub>t</sub> − q̂<sup>π<sub>e</sub></sup>(S<sup>i</sup><sub>t</sub>,A<sup>i</sup><sub>t</sub>)) + γ<sup>t</sup>ρ<sup>i</sup><sub>t−1</sub>v̂<sup>π<sub>e</sub></sup>(S<sup>i</sup><sub>t</sub>)</em>", "one": "<b>用一个近似模型造出控制变量，减到 PDIS 上。名字叫「双重稳健」——因为它对模型不准和 π_b 估错这两件事都稳健。</b>", "pts": ["<b>「双重稳健」这个名字说的是一个很强的性质：两个组件只要有一个对，结果就对。</b> <span class='k'>模型不准但 π<sub>b</sub> 准 ⇒ IS 那一半救场；π<sub>b</sub> 估错但模型准 ⇒ 模型那一半救场</span>。<b>要两个都错，估计才会错。</b>", "<b>控制变量的 <code>E[Y] = 0</code> 这一条是它能用的前提。</b> 课件说 <em>E[Y] = 0 in this case</em>——<span class='w'>控制变量被构造成期望为零的形式</span>，所以减掉它不改变期望，连 <code>+E[Y]</code> 那一项都不用加。", "<b>p36 的式子拆开看就是「残差加权 + 模型兜底」两部分</b>：<br><code>w<sup>i</sup><sub>t</sub>(R<sup>i</sup><sub>t</sub> − q̂(S<sup>i</sup><sub>t</sub>,A<sup>i</sup><sub>t</sub>))</code>——<b>只对模型预测不了的残差做重要性加权</b>；<br><code>ρ<sup>i</sup><sub>t−1</sub> v̂(S<sup>i</sup><sub>t</sub>)</code>——<b>模型自己给出的那部分，用更短的权重</b>。<br><span class='k'>模型越准，残差越小，需要被 IS 放大的部分就越少</span>——<b>这就是方差下降的来源</b>。", "<b>注意第二项的权重下标是 <code>t−1</code> 而不是 <code>t</code>。</b> <span class='w'>这不是笔误</span>：<code>v̂(S<sub>t</sub>)</code> 是在看到 <code>S<sub>t</sub></code> 之后、<b>选动作之前</b>的量，所以它只该被前 <code>t−1</code> 步的权重加权。<b>这又是「未来影响不了过去」那条原则的一次应用。</b>", "<b>把 p33–p36 连起来读，逻辑链很干净</b>：控制变量是通用工具（p33–34）→ 用近似模型造一个期望为零的控制变量（p35）→ 代进 PDIS 得到 DR（p36）。<span class='k'>每一步都只做一件事</span>。", "<b>再补一句关于「双重稳健」这个名字的来历：它来自因果推断，不是 RL 原创。</b> <span class='k'>在那边它指的是「结果模型」与「倾向得分模型」只要有一个正确设定，估计就一致</span>。<b>Jiang 和 Li 2015 把它搬到了序贯决策上</b>，对应关系是：结果模型 ↔ q̂/v̂，倾向得分 ↔ π_b。<span class='w'>知道这个对应，读因果推断那边的文献会省很多力气</span>。"], "eq": "DR(π_e|D) = (1/n) Σ_i Σ_t [ γ^t w_t^i ( R_t^i − q̂(S_t^i, A_t^i) )  +  γ^t ρ_{t−1}^i v̂(S_t^i) ]\n                             └── 残差，需要 IS 加权 ──┘    └─ 模型给的，权重只到 t−1 ─┘\n\n模型越准 ⇒ 残差越小 ⇒ 需要被 IS 放大的部分越少 ⇒ 方差越低\n\n「双重稳健」：模型准 或 π_b 准，有一个对结果就对\n⚠ 第二项的权重下标是 t−1：v̂(S_t) 是选动作**之前**的量", "tbl": {"head": ["组件", "出错时", "谁救场"], "rows": [["近似模型 q̂, v̂", "模型不准", "<b>IS 那一半</b>（残差项仍然无偏）"], ["行为策略 π<sub>b</sub> 的估计", "π<sub>b</sub> 估错", "<b>模型那一半</b>"], ["<b>两个都错</b>", "—", "<span class='w'>没人救</span>"]]}, "res": {"tag": "推断", "v": "<b>双重稳健的结构，和你「成本用回归 + 准确率用别的」那个设计几乎是同构的——但有一处关键不同要说清楚。</b><br><b>同构的地方</b>：DR 用一个近似模型吸收掉可预测的部分，<span class='k'>只对模型预测不了的残差做重要性加权</span>。而你的成本模型预期 R² &gt; 0.95，<b>意味着残差只剩 5%</b>——<span class='k'>如果你走 IS 路线，需要被权重放大的就只有那 5%</span>，方差下降会非常可观。<b>这正是 DR 的收益机制，而你的模型准度让这个收益达到了接近上限。</b><br><b>不同的地方，而且要诚实</b>：<span class='w'>DR 的「双重稳健」依赖 IS 那一半仍然有定义</span>——也就是覆盖条件成立。<b>而你的日志不满足覆盖</b>（L15.a p24）。<span class='w'>所以在当前数据上，DR 的两条腿断了一条，剩下的就只是那个近似模型本身</span>，「双重」无从谈起。<br><b>这给了你一个很清楚的先后顺序</b>：<b>先解决覆盖（随机化 + 记 propensity），DR 才成为一个真实的选项</b>；在那之前，你能用的只有穷举 oracle（不需要覆盖）与成本回归（本来就是监督学习）。<br><b>还有一条可以直接搬的</b>：DR 对「π<sub>b</sub> 估计有误差」稳健这一条，在你这里有实际意义——<span class='k'>即使你开始记 propensity，记录也可能不完整或有偏差</span>（比如中途改过采样策略）。<b>DR 的这一半稳健性正是为这种情况准备的。</b><br>标【推断】：同构与顺序是我推的；R² 预期与覆盖缺失在简报里是【已核】/【推断】。", "ref": "课件 p35–p36 · Jiang &amp; Li 2015 · 简报 §4e（已核）· §4a（覆盖，推断）· 本讲 p24"}},
{"r": [37, 42], "t": "实验结果与混合：按情形在两者之间调", "star": 3, "quote": "<b>Empirical Results (Gridworld)</b>〔p37–41，以图为主〕<br><b>Blending</b> — <em>Importance sampling is <b>unbiased but high variance</b></em> · <em>Model based estimate is <b>biased but low variance</b></em> · <em>Doubly robust is one way to combine the two</em> · <em>Can also trade between IS and model based estimate <b>within a trajectory</b></em> · <em>Can be particularly useful when <b>part of the world is non-Markovian</b> in the given model, and <b>other parts of the world are Markov</b></em>", "one": "<b>IS 无偏但方差大，基于模型的估计有偏但方差小。双重稳健是一种混合方式，而且可以在一条轨迹内部按段切换。</b>", "pts": ["<b>这一页把整个 OPE 这一节的取舍压成了两行</b>：<span class='k'>IS 无偏、方差大；模型估计有偏、方差小</span>。<b>所有改进都在这条线上找位置</b>——PDIS 往左挪一点（方差小些，仍无偏），WIS 往右一点（有偏，方差小很多），DR 则是把两端接起来。", "<b>「可以在一条轨迹内部切换」是一个比 DR 更细的想法。</b> <span class='w'>不是整条轨迹用一种估计量</span>，而是<b>前几步用模型、后几步用 IS</b>（或反过来），按每一段的情况决定。", "<b>而决定依据是本页最值得记的一句</b>：<em>particularly useful when <b>part of the world is non-Markovian</b> in the given model, and <b>other parts of the world are Markov</b></em>。<span class='k'>模型只在它成立的那些部分可信</span>——<b>在那些部分用模型（低方差），在模型不成立的部分退回 IS（无偏但吵）</b>。", "<b>这把「要不要相信模型」从一个全局决定变成了逐段决定。</b> <span class='k'>而这正是下一页 MAGIC 要自动化的事情</span>：不用人去判断哪段 Markov，而是直接最小化估计出来的 MSE。", "⚠️ <b>p37–p41 是五页 gridworld 实验图，PDF 上没有正文。</b> 本精读不补具体数字——<span class='w'>图里的数字无法从文本可靠还原</span>。<b>要看结论去 p45：标题就是「可能需要少一个数量级的数据」。</b>", "<b>为什么 gridworld 值得花五页？因为它小到可以算出真值。</b> <span class='k'>OPE 的实验有一个特殊困难：你要评估的那个策略从没跑过，所以「真值」本来是不可知的</span>。<b>而在 gridworld 上你可以把 π_e 真的跑一遍（或直接解 MDP），拿到真正的 V^{π_e}</b>，于是各种估计量的误差可以被精确度量。<span class='w'>这在真实问题里做不到</span>——<b>所以 OPE 的实证几乎只能在玩具问题上做，这是这个领域一个结构性的限制。</b>", "<b>这一节的几个估计量可以按「往哪个方向挪」排成一条线，而不是按好坏排。</b> 起点是朴素 IS（无偏、方差最大）；<b>PDIS 只是摘掉无关因子</b>（严格更好，不是权衡）；<b>WIS 用偏差换方差</b>（真正的权衡）；<b>DR 用一个模型去吸收可预测的部分</b>（偏差取决于模型）。<span class='k'>四者里只有 PDIS 是无条件更优的，其余都要看情形</span>。", "<b>混合的那个想法还有一层没说破：它把「模型可信度」变成了一个局部的量。</b> 传统做法是整体决定「信不信模型」，<span class='w'>而现实里模型往往是局部可信的</span>——<b>某些状态/时段上它很准，另一些上它完全不行</b>。<span class='k'>按段切换等于承认了这件事，并把它变成算法的一部分</span>。", "<b>而「按什么标准切换」这个问题，课件留给了 MAGIC（p46 之后那条线）。</b> 基本思路是<b>直接最小化估计出来的 MSE</b>——不用人去判断哪段 Markov，<span class='k'>而是用「模型估计」与「IS 置信区间」之间的差距当作模型偏差的下界</span>，据此在两者之间定权重。<b>本讲没展开细节，但这个思路值得记：把「信多少」变成一个可优化的量。</b>"], "tbl": {"head": ["估计量", "偏差", "方差", "在取舍线上的位置"], "rows": [["朴素 IS", "<b>无偏</b>", "<span class='w'>最大</span>", "最左端"], ["PDIS", "无偏", "小一些", "左端偏右"], ["WIS", "有偏", "小很多", "中间偏右"], ["<b>双重稳健</b>", "无偏（若一半对）", "<b>随模型准度下降</b>", "<b>把两端接起来</b>"], ["纯模型估计", "<span class='w'>有偏</span>", "<b>最小</b>", "最右端"]]}, "res": {"tag": "推断", "v": "<b>p42 最后那句话，是这门课自己给出的「把估计量按分量拆开」的理由——而且它和你的情形匹配得异常精确。</b><br>原话是：<span class='k'>当世界的一部分在给定模型下是非 Markov 的、而另一部分是 Markov 的时候，分段混合特别有用</span>。<br><b>把「部分」从「轨迹的时间段」换成「目标的分量」，这句话就是你的两半拆分</b>：<br>· <b>成本那一半</b>——给定保真度与输入长度，token 成本<b>近乎确定</b>（R² &gt; 0.95）。<span class='k'>它在模型下表现得非常「Markov」</span>：当前节点的成本只取决于当前节点的配置，不需要知道历史。<b>⇒ 用模型，方差几乎为零。</b><br>· <b>准确率那一半</b>——终局才出现，而且是否答对可能依赖整条轨迹的质量。<span class='w'>它在模型下恰恰是最可疑的那部分</span>，P2/P3 消融要检验的就是它。<b>⇒ 不能全靠模型。</b><br><b>所以「两半用不同估计量」不是工程上的权宜，而是这一页所说的那个原则的直接应用</b>——只不过切分的维度不是时间而是分量。<span class='k'>这个说法在论文里比「我们分开建模因为效果更好」有力得多</span>，因为它引用的是课程 / 文献里已有的原则。<br><b>这是「两半分开」的第五个理由</b>，而且是唯一一个来自方法论原则而非经验观察的。<br>标【推断】：维度转换是我做的；原则本身是课件原文，R² 与 P2/P3 是已有结论。", "ref": "课件 p42 原文 · 简报 §4e（已核）· §5（P2/P3，已核）· L03 p41 · L03 p48 科研格"}, "tip": {"t": "读法", "v": "p37–p41 五页实验图、p45 一页结论图，<b>PDF 上都没有正文</b>。本精读只引用标题给出的定性结论（p45：<em>Can Need An Order of Magnitude Less Data</em>），<span class='w'>不补图里的数字</span>——那些无法从文本可靠还原。<b>要看这一节的收益，记住那个标题就够了。</b>"}},
{"r": [43, 44], "t": "支撑集的边界情形：零样本时该返回什么", "star": 3, "quote": "<b>What if supp(π<sub>e</sub>) ⊄ supp(π<sub>b</sub>)?</b> — <em>There is a (s,a) such that π<sub>e</sub>(a|s) = 0 but π<sub>b</sub>(a|s) ≠ 0. If we see a history where (s,a) occurs, what weight should we give it?</em><br><b>What if there are zero samples (n = 0)?</b> — <em>The IS estimate is <b>undefined</b></em><br><b>What if no samples are in supp(π<sub>e</sub>)?</b> — <em>Importance sampling says: <b>the estimate is zero</b></em> · <em>Alternate approach: <b>undefined</b></em><br><em>IS estimator is unbiased <b>if n &gt; 0</b></em>", "one": "<b>两种方向的支撑集问题。而最该警惕的是：没有任何样本落在评估策略的支撑集里时，IS 会安静地返回 0。</b>", "pts": ["<b>先分清两个方向，它们的严重程度完全不同。</b><br><b>① π<sub>e</sub> 的支撑比 π<sub>b</sub> 窄</b>（p43）：有些 (s,a) 行为策略会做而评估策略不会。<span class='k'>这没问题</span>——那些轨迹的权重里会出现 0，<b>整条轨迹的权重变成 0，被自动排除</b>。这是正确行为。<br><b>② π<sub>e</sub> 的支撑比 π<sub>b</sub> 宽</b>（L15.a p24 的覆盖条件）：评估策略会做而行为策略不会。<span class='w'>这是致命的</span>——分母为 0，估计量没有定义。", "<b>p44 的那个对比是本页最该记住的东西。</b> 当没有任何样本落在 <code>supp(π<sub>e</sub>)</code> 里时：<br><b>IS 说：估计值是 0</b>；<br><b>另一种做法说：未定义</b>。<br><span class='w'>IS 会安静地给你一个数，而那个数是编出来的</span>——所有权重都是 0，加权和自然是 0，<b>但真实的 <code>V<sup>π<sub>e</sub></sup></code> 完全可能很高</b>。", "<b>「返回 0」和「返回未定义」的差别，在安全策略改进的语境下是生死攸关的。</b> <span class='k'>如果回报都是非负的，返回 0 意味着给出一个极低的估计</span>——<b>于是这个策略会被判为「不够好」而被拒绝</b>。在这个方向上它是安全的（宁可不换）。<b>但如果回报可以是负的，返回 0 可能反而是一个「看起来不错」的值</b>，<span class='w'>那就危险了</span>。", "<b>课件最后那行限定也要读准：<em>IS estimator is unbiased <b>if n &gt; 0</b></em>。</b> <span class='k'>无偏性是有前提的</span>，而「另一种做法」的无偏性前提是「至少有一个样本落在支撑集里」——<b>比 n&gt;0 更强</b>。", "⚠️ <b>这两页在实现上对应一类很具体的 bug</b>：权重全为 0 时不报错、不警告，<span class='w'>就是静静地返回 0</span>。<b>任何 IS 实现都应该显式检查「有效样本数」并在它过小时拒绝输出</b>，而不是让 0 混进下游的比较里。", "<b>把这两页和 L15.a p24 的覆盖条件合起来，可以得到一个完整的支撑集检查清单</b>：<b>① 算每条轨迹的权重</b>，② <b>统计有多少条权重非零</b>（这就是真正参与估计的样本数），③ <b>算 ESS = (Σw)²/Σw²</b>，④ <b>若 ESS 低于阈值，拒绝输出而不是输出一个数</b>。<span class='k'>这四步应该是任何 IS 实现的标准前置检查</span>，<b>而课件只在 p44 用一句话暗示了它的必要性</b>。"], "tbl": {"head": ["情形", "IS 的行为", "严重程度", "正确做法"], "rows": [["π<sub>e</sub> 支撑更<b>窄</b>（p43）", "那些轨迹权重为 0，被排除", "<b>无害</b>，这是正确行为", "照常"], ["π<sub>e</sub> 支撑更<b>宽</b>", "分母为 0", "<span class='w'>致命</span>，估计量无定义", "改数据采集"], ["n = 0", "<b>未定义</b>", "明显，会报错", "—"], ["无样本落在 supp(π<sub>e</sub>)", "<b>安静地返回 0</b>", "<span class='w'>最危险：不报错</span>", "<b>显式检查有效样本数</b>"]]}, "res": {"tag": "推断", "v": "<b>p44 那个「安静地返回 0」，是你在实现任何 IS 诊断时第一个要防的 bug——而它在你的设定下几乎必然触发。</b><br>你的日志是确定性的，所以对任何与已跑配置不同的候选策略，<span class='w'>所有轨迹的权重都是 0</span>。<b>朴素实现会返回 <code>0/n = 0</code>，不报错、不警告</b>。<br><b>而你的 G = Acc − λ·Cost 可以是负的</b>（成本项带负号），<span class='k'>所以「0」未必是一个显眼的坏值</span>——它可能恰好落在候选们的中间，<b>于是这个「其实无法评估」的配置会被当成一个普通的候选参与排序</b>。<b>这比返回一个明显荒谬的数危险得多。</b><br><b>必须做的检查有两条，而且应该是硬性的</b>：<br>① <b>有效样本量门槛</b>：算 <code>ESS = (Σw)²/Σw²</code>，<span class='k'>低于某个阈值就拒绝输出而不是输出一个数</span>；<br>② <b>显式区分「估计为 0」与「无法估计」</b>——在数据结构层面就分开，不要让它们共用一个 float。<br><b>这和本讲 SPI 的「算法可以拒绝」是同一个精神</b>：<span class='k'>「我不知道」必须是一个可表达的输出</span>，否则它就会伪装成一个数混进下游。<br><b>顺带：这也是为什么穷举 oracle 这条路更干净</b>——它不存在「权重全为 0」这种状态，<b>一个配置要么跑过（有精确值）要么没跑过（表里没有这一行）</b>，两者在数据结构上天然分开。<br>标【推断】：触发分析与两条检查是我推的；确定性日志与 G 的形式是已有设定。", "ref": "课件 p44 原文 · 本讲 p27–28（算法可以拒绝）· 简报 §4a §4d"}, "tip": {"t": "记这一条", "v": "<b>任何 IS 实现的标准前置检查，四步</b>：① 算每条轨迹的权重；② 统计<b>权重非零的条数</b>（真正参与估计的样本数）；③ 算 <b>ESS = (Σw)² / Σw²</b>；④ <b>ESS 低于阈值就拒绝输出，而不是输出一个数</b>。<br><span class='w'>课件只在 p44 用一句话暗示了它的必要性</span>，但「安静地返回 0」是这类代码最常见、也最难发现的 bug——<span class='k'>它不报错、不警告，而那个 0 会直接混进下游的比较里</span>。"}},
{"r": [45, 48], "t": "收益有多大，以及非平稳的情形", "star": 2, "quote": "<b>Can Need An Order of Magnitude Less Data</b>〔p45，以图为主〕<br>p46: <em>Thomas et al. <b>Predictive Off-Policy Policy Evaluation for Nonstationary Decision Problems, with Applications to Digital Marketing</b> (AAAI 2017)</em><br>p48: <b>Create a safe batch RL algorithm</b>〔配方页第三次出现，标记第一格已完成〕", "one": "<b>标题就是结论：好的估计量可能让你少用一个数量级的数据。而 p46 指向一个本讲没展开的方向——环境本身在变。</b>", "pts": ["<b>p45 的标题本身就是这一整节的收益声明</b>：<em>Can Need An Order of Magnitude Less Data</em>。<span class='k'>从朴素 IS 走到 DR / MAGIC，不是精度上的小改进，而是数据量上的数量级差别</span>。<b>在数据昂贵的场景里，这个差别决定了项目做不做得成。</b>", "<b>p46 引的那篇处理的是「非平稳」</b>：<em>Predictive Off-Policy Policy Evaluation for <b>Nonstationary</b> Decision Problems</em>。<span class='w'>本讲全程默认环境是平稳的</span>——行为策略产生数据的那个世界，和你要部署新策略的那个世界，是同一个。", "<b>而这个假设在真实系统里经常不成立，这是本讲最大的隐含前提之一。</b> 数字营销里用户在变、季节在变、竞争对手在变；<span class='k'>于是「历史数据上评估得好」不保证「部署后表现好」</span>——<b>不是估计量不准，而是被估计的那个量本身已经变了</b>。", "<b>p48 是配方页第三次出现</b>（p20、p24 之后），<b>标记第一格 OPE 已经做完</b>。<span class='k'>接下来是第二格 HCOPE，而那一格会在 p49 立刻翻车</b>——Hoeffding 给出 −5 百万的下界。", "⚠️ <b>p37–p41 与 p45 都是实验图，PDF 上无正文。</b> 本精读只引用标题给出的定性结论，<span class='w'>不补图里的具体数字</span>。", "<b>「少一个数量级的数据」这个说法，换算一下就知道分量。</b> <span class='k'>如果朴素 IS 需要十万条轨迹才能给出有用的结论，好的估计量可能一万条就够</span>。<b>在医疗、教育这类每条轨迹都对应一个真实个体的场景里，这是「做得成」与「做不成」的差别</b>，不是「快一点」与「慢一点」的差别。", "<b>非平稳这件事值得再说一层，因为它和前面所有讨论的性质不同。</b> 前面处理的都是<b>统计问题</b>（方差大、支撑不足、偏差），<span class='k'>它们原则上都能靠更好的估计量或更多数据缓解</span>；<b>而非平稳是一个<b>识别</b>问题</b>——<span class='w'>你要估的那个量在你估它的过程中变了</span>，<b>再好的估计量也估不出一个不存在的固定值</b>。", "<b>处理非平稳的思路和本讲完全不同，所以它只能被引用而不能被纳入。</b> 大致方向是把「估一个值」换成「预测一个趋势」——<span class='k'>p46 那篇标题里的 <em>Predictive</em> 正是这个意思</span>：不问「这个策略现在值多少」，而问「部署之后它会值多少」。<b>这是两个不同的问题。</b>", "⚠️ <b>p48 这一页值得停一下：配方第一格到此完成，而它用了整整 20 页。</b> <span class='w'>而第二格会在下一页立刻翻车</span>——这个节奏本身是课件的设计：<b>先把估计量做到很好，再让你看到即使估计量很好，朴素的置信界仍然毫无用处</b>。"], "tbl": {"head": ["本讲的隐含前提", "不成立时会怎样", "本讲处理了吗"], "rows": [["环境<b>平稳</b>", "被估计的量本身变了，估得再准也没用", "<span class='w'>没有</span>（p46 只给了一篇引文）"], ["π<sub>b</sub> <b>已知</b>", "权重算不出来", "讨论过（可查代码则可知）"], ["<b>覆盖</b>条件成立", "估计量无定义", "讨论过（p24、p43–44）"], ["轨迹长度 L <b>有限</b>", "WIS 的一致性条件破掉", "列为条件（p31）"], ["问题的<b>性质</b>", "统计问题（方差、支撑、偏差）能靠更好的估计量缓解；<b>非平稳是识别问题</b>——<span class='w'>要估的量本身在变</span>", "—"]]}},
{"r": [49, 51], "t": "第二格翻车：下界是负的百万量级", "star": 3, "quote": "<b>HCOPE (revisited)</b> — <em>Consider using IS + Hoeffding's inequality for HCOPE on <b>mountain car</b></em><br><em>Using <b>100,000 trajectories</b></em> · <em>Evaluation policy's true performance is <b>0.19 ∈ [0,1]</b></em> · <em>We get a 95% confidence lower bound of: <b>负的百万量级</b></em><br><b>What went wrong</b> — <em>w<sub>i</sub> = Π<sub>t=1</sub><sup>L</sup> π<sub>e</sub>(a<sub>t</sub>|s<sub>t</sub>)/π<sub>b</sub>(a<sub>t</sub>|s<sub>t</sub>)</em>", "one": "<b>十万条轨迹，真实值 0.19，而 Hoeffding 给出的 95% 下界是负的百万量级。这个界是对的，也是完全无用的。</b>", "pts": ["<b>先体会一下这个数有多荒谬。</b> 回报的取值范围是 <code>[0,1]</code>——<span class='k'>任何策略的值都不可能是负的</span>。<b>「至少是负一百万」这句话完全正确，而且毫无信息量</b>。她在课上用的词是 <b>vacuous</b>（空洞的）：<em>a bound that is <b>true but entirely uninformative</b></em>。", "<b>这里要把两种失败分清楚，因为它们的处理方式完全不同。</b> 一个界可以<b>错</b>（真值掉到界外面去了，那是定理用错了或者前提不成立），也可以<b>没用</b>（界是对的，但宽到什么都没说）。<span class='k'>Hoeffding 从不说假话——它给的界永远成立</span>。<b>p50 翻的是第二种车</b>，而第二种车比第一种更隐蔽：<span class='w'>你跑完程序会得到一个「有 95% 置信度」的数字，它在形式上完全合规，于是很容易被当成结果报出去</b>。", "<b>p51 一页纸只写了一个式子，那就是病因</b>：<code>w<sub>i</sub> = Π<sub>t=1</sub><sup>L</sup> π<sub>e</sub>/π<sub>b</sub></code>。<span class='k'>权重是 L 个比值的连乘</span>。如果某一步 <code>π<sub>b</sub></code> 只有 0.1，那一步的比值最大就是 10；<b>L 步下来，权重的上界是 <code>(1/π<sub>min</sub>)<sup>L</sup></code> 量级</b>。", "<b>接上 Hoeffding 就知道为什么致命了</b>：下界是 <code>均值 − b·√(ln(1/δ)/2n)</code>，而 <span class='w'><code>b</code> 是随机变量的取值范围，它在这里就是权重能有多大</span>。<b><code>b</code> 指数增长，下界就指数地往下掉</b>——而 <code>√n</code> 只能线性地往回拉。<span class='k'>十万条的 √n 是 316，根本抵不过 <code>10<sup>L</sup></code></span>。", "<b>Hoeffding 最要紧的那个性质在这里变成了缺点：它根本不看你的数据。</b> <code>b</code> 不是你那十万条轨迹里权重的实际离散程度，<span class='k'>而是权重<b>理论上</b>能取到的范围</span>。<b>哪怕你那十万条里权重全都挤在 1 附近、方差小得可怜，<code>b</code> 还是 <code>10<sup>L</sup></code></b>——<span class='w'>因为 Hoeffding 必须对「权重极度集中在少数几条」那种最坏分布也成立</span>。<b>这是「无分布假设」的代价，而 p57 的小标题「认知失调」说的就是这件事。</b>", "<b>再算一笔账，看看「加数据」这条路有多没希望。</b> 要让误差项 <code>b·√(ln(1/δ)/2n)</code> 降到某个固定水平，<code>n</code> 必须随 <code>b<sup>2</sup></code> 增长。<span class='k'>而 <code>b ~ (1/π<sub>min</sub>)<sup>L</sup></code></span>，于是 <b><code>n ~ (1/π<sub>min</sub>)<sup>2L</sup></code></b>。<b>L 每多一步，需要的数据量乘以 <code>(1/π<sub>min</sub>)<sup>2</sup></code></b>——<span class='w'>π<sub>min</sub>=0.1 时是一百倍</span>。<b>十万条换成一千万条，只够多走一步。</b>", "<b>她选 mountain car 不是随意的，而这一点值得想清楚。</b> 这个任务<em>需要一串相当特定的动作</em>才能成功（要先往反方向荡起来积累动能）。<span class='k'>于是沿途每一步在 π<sub>b</sub> 下的概率都不高</span>，连乘起来权重就爆炸。<b>反过来说：越是需要精巧配合、越是「只有一条窄路能通」的任务，IS 的方差越可怕</b>——<span class='w'>而这恰恰是我们最想用 RL 去解的那类任务</span>。<b>方法最吃力的地方，和问题最有意思的地方，是同一个地方。</b>", "<b>和 L03 对一下，会发现这不是一个新问题，只是终于量化了。</b> L03 p58–p60 讲 IS 时已经说过方差大；<span class='k'>但那里只是定性地说「方差大」，这里给出了一个具体的数字，让「大」变成「大到下界是负一百万」</span>。<b>定性的警告很容易被读成「注意调参」，而这个数字说明它是结构性的。</b>", "<b>有一个比 <code>b</code> 更有用的日常诊断指标，课件没提但该记住：有效样本量（ESS）。</b> <code>ESS = (Σw<sub>i</sub>)<sup>2</sup> / Σw<sub>i</sub><sup>2</sup></code>。<span class='k'>它衡量的是「你那 n 条轨迹，实际上相当于多少条独立样本」</span>。<b>权重全相等时 ESS = n；权重集中在一条上时 ESS = 1</b>。<span class='w'>p50 那种情形下 ESS 大概是个位数——十万条轨迹，有效的只有几条</span>。<b>ESS 是你拿到数据后<b>立刻</b>该算的那个数，它比事后发现下界是负一百万要早得多。</b>", "⚠️ <b>p50 幻灯片上那个数字印坏了</b>（逗号位置不成立），<span class='w'>本精读只引用量级</span>。实录里她说的是「−5 million」。<b>要引用具体数字请查 Thomas et al. AAAI 2015 原文，不要抄幻灯片。</b>"], "eq": "Hoeffding 下界：  E[X] ≥ (1/n)ΣX_i − b·sqrt( ln(1/δ) / (2n) )\n                                        └ b 线性进入 ┘ └ 只有 sqrt(n) 往回拉 ┘\n\n而在这里   X_i = w_i · (回报)，   w_i = Π_{t=1..L} π_e/π_b\n⇒ b 的量级 ~ (1/π_min)^L        指数增长\n\n十万条轨迹的 sqrt(n) = 316，抵不过 10^L\n⇒ 真实值 0.19 ∈ [0,1]，而下界是负的百万量级：**true but entirely uninformative**\n\n「加数据」要加多少：误差 ∝ b/sqrt(n)，要压住 b 就得 n ~ b^2 ~ (1/π_min)^{2L}\n          ⇒ L 每多一步，n 要乘 (1/π_min)^2       π_min=0.1 时是 100 倍\n\n一个该先算的诊断量（课件未提）：\n   ESS = (Σ w_i)^2 / Σ w_i^2        权重全相等 ⇒ ESS = n；集中在一条 ⇒ ESS = 1", "tbl": {"head": ["", "数值", "说明"], "rows": [["轨迹数 n", "<b>100,000</b>", "不算少"], ["真实表现", "<b>0.19</b>", "而且回报范围是 [0,1]"], ["95% 置信下界", "<b>负的百万量级</b>", "<span class='w'>正确但空洞（vacuous）</span>"], ["病因", "w = Π<sub>t=1..L</sub> π<sub>e</sub>/π<sub>b</sub>", "<b>b ~ (1/π<sub>min</sub>)<sup>L</sup></b>"], ["b 来自哪里", "<b>理论取值范围</b>，不是数据的离散程度", "<span class='w'>Hoeffding 根本不看你的数据</span>"], ["为什么救不了", "n 要 ~ b<sup>2</sup> ~ (1/π<sub>min</sub>)<sup>2L</sup>", "<b>加数据没用</b>"], ["界的两种失败", "<b>错</b>（真值出界）vs <b>没用</b>（宽到无信息）", "<b>这里是第二种，也更容易被当成结果报出去</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页是你应该绕开 IS 路线的最有力的一条证据，而且理由是结构性的、不是调参能解决的。</b><br>你的 workflow 有 H ≤ 10 个节点。<span class='k'>如果对 k 个节点做均匀随机化（每个 2 选 1），那么 π<sub>min</sub> = 0.5，权重上界是 2<sup>k</sup></span>——<b>这比 mountain car 的情形好得多</b>（那里 π<sub>min</sub> 可能是 0.1 量级、L 还很长）。<b>k=4 时 b ≈ 16，完全可控。</b><br><b>所以你的处境其实没那么糟，但有一个前提：k 必须小。</b> <span class='w'>k=10 时 b = 1024，而按上面那笔账 n 要 ~ b² ≈ 10⁶ 量级才压得住</span>——这正是简报 §4c 要求「一步偏离扫描把 k 压到 3~4」的第二个理由（第一个是 ESS）。<b>两个理由指向同一个数，而且它们其实是同一件事的两面</b>：ESS 衡量实际退化，b 衡量最坏退化。<br><b>而穷举 oracle 这条路根本不碰这个问题</b>：它没有权重，<span class='k'>每条 query 的 G 直接落在一个已知的、小的有界区间里</span>（Acc∈[0,1]，Cost 有上限）。<b>于是 Hoeffding 里的 b 是真实的、小的，下界会是有意义的数</b>。<br><b>这给了你一个可以写进论文的、很干净的对照</b>：<br>· <b>IS 路线</b>：b ~ 2<sup>k</sup>，需要先降 k，而且降 k 就限制了能评估的配置范围；<br>· <b>oracle 路线</b>：b 是 G 的真实范围，与 k 无关，代价是穷举的调用成本。<br><span class='k'>本讲花了十一页（p49–59）处理 IS 的 b 爆炸问题，而你可以用一个不同的数据采集方式直接绕过去</span>——<b>这个对照本身就说明了为什么值得付穷举的成本。把它写成一段，比单说「我们穷举」有说服力得多。</b><br><b>还有一条可以立刻执行的：无论走哪条路，先把 ESS 算出来。</b> <span class='w'>如果 ESS 掉到两位数以下，后面所有的置信界都不值得算</span>——这是一个几行代码的检查，能省掉一整轮无效实验。<br>标【推断】：数值估算与对照是我推的；一步偏离扫描在简报里是【已核】。", "ref": "课件 p49–p51 · 简报 §4b（ESS）· §4c（扫描降 k，已核）· §4d（oracle，已核）"}},
{"r": [52, 55], "t": "截尾修复：只压低不抬高，所以界还成立", "star": 3, "quote": "<b>HCOPE (revisited)</b> — <em><b>Removing the upper tail only decreases the expected value.</b></em><br><em>Thomas et al., <b>High confidence off-policy evaluation</b>, AAAI 2015</em><br><em>Use <b>20%</b> of the data to optimize c (cutoff)</em> · <em>Use <b>80%</b> to compute lower bound with optimized c</em> · <em>Mountain car results:</em>", "one": "<b>把权重超过某个阈值 c 的部分砍掉。砍掉上尾只会让期望变小，所以砍完之后算出的下界，对原来那个量仍然成立。</b>", "pts": ["<b>整个修复的逻辑只有一句话，而它漂亮在「单边」。</b> <span class='k'>截掉上尾 ⇒ 期望只会下降</span>。于是：<br><code>真实期望 ≥ 截尾后的期望 ≥ 截尾后算出的下界</code><br><b>所以那个下界对真实期望仍然成立</b>——<span class='w'>而 b 已经从 <code>(1/π<sub>min</sub>)<sup>L</sup></code> 降到了 c</span>。<b>一个不等式串起来三项：中间那项是我们能算的，两端是我们要的。</b>", "<b>注意这个技巧为什么只对<b>下界</b>有效。</b> 如果你要的是上界，截掉上尾会让上界失效（你把大的那些扔了）。<span class='k'>而安全策略改进恰恰只需要下界</span>——p27 讲过，安全性的要求是单边的。<b>需求的单边性和技巧的单边性正好对上，这不是巧合，是设计</b>：<span class='w'>先把问题的需求收窄成单边，才换来了一个单边的技巧可用</span>。<b>如果当初把目标定成「给出 V 的区间估计」，这一页的修复就用不了。</b>", "⚠️ <b>这里有一个课件没说、但你必须自己确认的前提：回报必须是非负的。</b> <span class='k'>「把 w 砍到 min(w, c) ⇒ 乘积只会变小」这一步，依赖被乘的那个回报 ≥ 0</span>。<b>如果回报可以是负的，把权重压小反而会把一个负的贡献<b>抬高</b></b>，<span class='w'>「只压低不抬高」就不成立，整个论证断在这里</span>。<b>本讲的 mountain car 回报落在 [0,1]，所以没问题</b>；<b>但你换一个有负奖励的任务就要先平移到非负，而平移会改变 b，进而改变界的松紧</b>。<b>这是本讲最容易被漏掉的一条前提。</b>", "<b>再分清两个不同的操作，它们常被混为一谈。</b> ① <b>裁剪</b>（clipping）：把 <code>w<sub>i</sub></code> 换成 <code>min(w<sub>i</sub>, c)</code>，<span class='k'>这条轨迹还在，只是权重被压住</span>；② <b>丢弃</b>（discarding）：把 <code>w<sub>i</sub> &gt; c</code> 的轨迹整条扔掉，相当于把它的贡献置 0。<b>非负回报下两者都满足「只压低」</b>，所以界都成立；<span class='w'>但丢弃扔掉的信息多得多，偏差也大得多</span>。<b>课件说的是 removing the upper tail，而在 AAAI 2015 的做法里对应的是裁剪。</b>", "<b>代价是引入了偏差，而且方向是确定的——朝保守那一侧。</b> 截尾后的期望严格小于真实期望，<span class='w'>所以你得到的下界比本可以得到的更松</span>。<b>这个偏差不是「误差」，它是你为了换一个有用的界而<b>主动付出</b>的东西</b>：<span class='k'>偏差的方向可控，才敢用</span>。<b>c 取得越小，b 越小（界越紧），但截掉的越多（偏差越大）——c 就是这个取舍的旋钮。</b>", "<b>两端都走到极限看一眼，这个旋钮的形状就清楚了。</b> <code>c → ∞</code>：不截，回到 p50 那个负一百万；<code>c → 0</code>：全截掉，<span class='k'>估计量恒为 0，下界也是 0——又是一个正确但无用的界</span>（因为真值确实 ≥ 0）。<b>两端都空洞，所以最优的 c 一定在中间，而且它依赖数据</b>——<span class='w'>这就逼出了下一个问题：c 怎么选</span>。", "<b>p55 给的做法值得注意：用 20% 的数据选 c，用剩下 80% 算下界。</b> <span class='k'>这是本讲第二次出现「把数据切开」</span>——第一次是 p15 那条「保证不能依赖调参」。<b>如果用同一批数据既选 c 又算界，c 就是看着数据挑的，界的 1−δ 保证会失效</b>：<span class='w'>Hoeffding 要求随机变量的范围 c 是<b>事先定下</b>的常数，而不是从同一批样本里挑出来的</span>。<b>挑过之后 c 本身成了随机变量，定理的前提就破了。</b>", "<b>这个「切开」的模式在本课出现了四次，而且每次的理由不同——值得一起记。</b> L04 p43 的 split samples（防最大化偏差）、L13 p13（高置信界要求数据与被评估对象独立）、本讲 p15（保证不能依赖调参）、<b>本页（选超参数的数据不能参与算界）</b>。<span class='k'>四个角度，同一个做法</span>。<b>而四个理由说服的是不同的人</b>，所以写论文时不必挑一个——都提。", "<b>顺便回答一个该问的问题：第一格里那个 WIS 为什么不能直接拿来当第二格用？</b> WIS 把分母换成 <code>Σw<sub>i</sub></code>，<span class='k'>权重被归一化了，于是估计量自动落在回报的范围内，看起来 b 很小</span>。<b>但 WIS 是有偏的，而且分母是随机的</b>——<span class='w'>Hoeffding 要求对独立有界随机变量的<b>均值</b>用，而 WIS 不是一个这样的均值</span>。<b>所以它没有现成的有限样本高置信界</b>。<b>这解释了本讲的结构：WIS 出现在第一格（降方差），截尾出现在第二格（给界）——两格要的东西不同，所以用的工具不同。</b>（这条是我的推断，课件没明说。）", "⚠️ <b>p54 在 PDF 上没有正文</b>（截尾的图示），p55 的 mountain car 结果也是图。<b>本精读不补图里的数字</b>，要引用请查 AAAI 2015 原文。"], "eq": "裁剪（clipping）：w_i  ->  min(w_i, c)\n\n  真实期望  ≥  截尾后的期望  ≥  截尾后算出的 1−δ 下界\n              └ 只压低不抬高 ┘    └ 这里的 b 已经降到 c ┘\n\n  ⇒ 下界对真实期望仍然成立\n\n⚠ 「只压低」依赖 **回报非负**：\n     回报 ≥ 0 时   min(w,c)·R ≤ w·R        成立\n     回报 < 0 时   min(w,c)·R ≥ w·R        反向！论证断在这里\n\n为什么只对**下界**有效：截掉上尾会让**上界**失效\n而安全策略改进只需要下界（p27）—— 需求与技巧的单边性正好对上\n\n两端极限：c -> ∞  回到负一百万（不截）\n          c -> 0   估计量恒为 0，下界 = 0（也空洞）\n          ⇒ 最优 c 在中间，而且依赖数据 ⇒ 必须切数据来选它\n\n选 c 的做法（p55）：20% 数据选 c，80% 数据算界\n（Hoeffding 要求 c 是**事先定下**的常数；看着同一批数据挑，c 成了随机变量，前提就破了）", "tbl": {"head": ["c 的取值", "b", "界的紧度", "偏差"], "rows": [["c → ∞（不截）", "<span class='w'>仍然爆炸</span>", "<b>空洞（负一百万）</b>", "无偏"], ["c 很大", "<span class='w'>仍然很大</span>", "很松", "小"], ["c 适中", "可控", "<b>有用</b>", "中"], ["c 很小", "很小", "紧", "<span class='w'>大，过于保守</span>"], ["c → 0（全截）", "0", "<b>空洞（下界=0）</b>", "<span class='w'>最大</span>"], ["怎么选", "—", "—", "<b>20% 数据选 c，80% 算界</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页有两样东西你会直接用上，而且都不是「截尾」本身。</b><br><b>第一样是那个论证形式：主动引入一个方向可控的偏差，换一个能用的保证。</b> <span class='k'>截尾是有偏的，但偏差只朝保守那一侧，于是下界仍然合法</span>。<b>你的 oracle 表上有一个同形的问题</b>：留出集里某些 (query, 配置) 格子可能跑失败（超时、解析失败、API 报错）。<span class='w'>这些缺失值怎么填？</span> <b>按这一页的逻辑：填一个<b>保守</b>的值</b>——准确率填 0、成本填该配置的上限。<b>于是你报的 G 只会低估不会高估，「我们的配置优于默认」这个结论仍然成立</b>。<span class='k'>这比「丢掉失败的格子」干净得多</span>：丢掉是在看着结果筛数据，会系统性地偏向那些恰好跑通的配置。<br><b>第二样是那个前提：非负性。</b> ⚠ <span class='w'>你的 <code>G = Acc − λ·Cost</code> <b>可以是负的</b></span>（λ 大、成本高时）。<b>所以「只压低不抬高」那类论证在你这里不能直接照搬</b>，任何涉及裁剪、截断、缺失值填充的推理都要先确认符号。<b>最干净的做法是把两半分开处理</b>：<span class='k'>Acc ∈ [0,1] 非负，Cost ≥ 0 非负，各自做保守填充，最后才合成 G</span>——而不是在 G 这个可正可负的量上动手。<b>这是「拆成两半」的第六个理由，而且是本讲给的。</b><br><b>第三件事是切数据会叠加，必须提前算账。</b> 你已经需要切一次（L04 p43：选配置的数据不能参与评估它）。<span class='w'>如果再引入任何需要调的超参数（λ、阈值、裁剪点），按这一页就得再切一次</span>。<b>两次切分叠加，有效样本量掉得很快</b>——<b>设计留出集大小时要把这笔账算进去，而不是事后发现不够。</b><br>标【推断】：缺失值填充策略与非负性警告是我由本页逻辑推的；oracle 表与两半拆分在简报里是【已核】。", "ref": "课件 p52 · p55 · p27 · L04 p43 · 简报 §4d（已核）· §4f"}},
{"r": [56, 59], "t": "换不等式：从最坏情况退到分布假设", "star": 3, "quote": "<b>HCOPE (revisited)</b> — Digital marketing · <em><b>Cognitive dissonance</b></em>: <em>E[X<sub>i</sub>] ≥ (1/n)ΣX<sub>i</sub> − b√(ln(1/δ)/(2n))</em><br><b>Student's t-test</b> — <em>Assumes that IS(D) is <b>normally distributed</b></em> · <em>By the central limit theorem, it is as n → ∞</em><br><em><b>Efron's Bootstrap methods (e.g., BCa)</b></em> · <em>Also, without importance sampling: <b>Hanna, Stone, and Niekum, AAMAS 2017</b></em>", "one": "<b>另一条路：不修估计量，改用更松的不等式。代价是从「无分布假设」退到「假设近似正态」。</b>", "pts": ["<b>「认知失调」这个小标题用得很准，而且要读懂它指的是什么。</b> <span class='k'>p57 把那个刚刚失败的 Hoeffding 式子<b>又贴了一遍</b></span>——失调之处在于：<b>Hoeffding 的最大优点，正是它在这里失败的原因</b>。<span class='w'>优点是它<b>不需要任何分布假设</b>，只要有界就行；而这意味着它必须对最坏的分布也成立，最坏的分布就是「权重极度集中在少数几条」</span>。<b>你没法既不做假设、又得到紧的界——这是一个真实的取舍，不是技术不够好。</b>", "<b>Student t 检验走的是相反的路：假设 <code>IS(D)</code> 近似正态。</b> 依据是中心极限定理——<b>n 足够大时样本均值趋于正态</b>。<span class='k'>于是界可以用<b>样本标准差</b>而不是取值范围 b 来算</span>，<b>而样本标准差反映的是数据实际的离散程度，不是理论上的最坏情况</b>。<b>这是上一页那句「Hoeffding 根本不看你的数据」的正面解法：让界去看数据。</b>", "<b>但这个假设在这里恰恰最可疑，值得警惕。</b> <span class='w'>中心极限定理收敛得快不快，取决于分布的尾巴有多重</span>——<b>而 IS 权重的分布是出了名的重尾</b>（少数几条轨迹占据绝大部分权重，也就是上一页那个 ESS 很小的情形）。<b>重尾分布下 CLT 收敛得极慢，n=10 万可能仍然不够。</b>", "<b>把「不够」说得更具体一点：那个 ESS 才是真正的 n。</b> <span class='k'>如果十万条的 ESS 只有个位数，那么对 CLT 来说你的样本量就是个位数</span>，<b>而个位数样本上的正态近似是没有依据的</b>。<span class='w'>这里有一个很隐蔽的危险：t 检验会算出一个漂亮的、不空洞的界，而它可能根本不成立</span>。<b>Hoeffding 失败时是明着失败（给你一个荒谬的负数，你立刻知道出事了）；t 检验失败时是暗着失败</b>——<b>后者更危险，因为它看起来是对的。</b>", "<b>所以这是一个明确的交易：用「可能不成立的分布假设」换「不空洞的界」。</b> <span class='k'>课件把它列出来而不是推荐它</span>——<b>p58 同时列了三条替代路径</b>（t 检验、bootstrap、以及完全不用 IS 的做法），<b>并列而不排序，说明这件事没有标准答案</b>。<b>在这种地方，诚实的做法是两条都算、都报</b>：<span class='w'>Hoeffding 的界（无假设但松）和 t 的界（紧但有假设），同时给出，让读者看到差距有多大</span>。<b>差距本身就是信息——它告诉你结论有多依赖那个正态性假设。</b>", "<b>Efron 的 bootstrap（BCa）是第三条路，它的位置在前两者之间。</b> <span class='k'>不假设分布形式，而是用重采样去逼近统计量的抽样分布</span>：有放回地抽 n 条、重算一遍估计量、重复 B 次，拿这 B 个值的分位数当区间。<b>BCa 里那两个字母是两处修正</b>——<b>bias-corrected</b>（校正估计量本身的偏差）与 <b>accelerated</b>（校正分布的偏斜）。<span class='w'>而 IS 权重的分布正是重尾且高度偏斜的</span>，<b>所以这两处修正不是装饰，是针对性的</b>——这也是课件点名 BCa 而不是朴素百分位法的原因。", "<b>但 bootstrap 也不是免费的，它的弱点要说清。</b> <span class='k'>它的保证是渐近的</span>——<b>有限样本下不保证覆盖率恰好是 1−δ</b>。<span class='w'>而且它只能重采样你<b>已有</b>的那些轨迹：如果真正的大权重轨迹在你的十万条里一条都没出现，重采样永远也造不出它来</span>。<b>也就是说，重尾分布最危险的那部分，恰恰是 bootstrap 看不见的那部分。</b>", "<b>最后那条引文方向完全不同，而对你最相关</b>：<em>Also, without importance sampling: Hanna, Stone, Niekum AAMAS 2017</em>——<span class='w'>绕开 IS 本身</span>。<b>前两条（t 检验、bootstrap）都在修补「IS 权重重尾」这一个病，这一条换掉了病人</b>。<b>思路是用模型：先从数据学一个环境模型，再在模型里评估新策略，置信区间由模型的不确定性给出</b>（所以叫 bootstrapping with models）。<span class='k'>代价是引入了模型偏差，收益是摆脱了权重连乘</span>——<b>而这正是 p67 那个开放问题（行为策略确定性时怎么办）唯一还走得通的方向</b>。", "<b>把这四条排成一列，会看到一条很清楚的轴：你愿意假设多少，就能换到多紧的界。</b> <span class='k'>Hoeffding 假设最少（只要有界）、界最松；t 假设最多（正态）、界最紧；bootstrap 居中；换模型则是换掉了整个问题</span>。<b>这条轴在统计里到处都是，而本讲把它摆在一页纸上了</b>——<b>值得记住的不是哪个最好，而是「没有免费的紧界」这件事。</b>"], "eq": "同一个量，四种给界的方式 —— 假设越强，界越紧：\n\n  Hoeffding      只要有界          界 ∝ b/sqrt(n)        b = 理论范围   -> 空洞\n  Hoeffding+截尾  有界 + 回报非负    界 ∝ c/sqrt(n)        c = 截断点     -> 可用、保守\n  Student t       近似正态（CLT）    界 ∝ s/sqrt(n)        s = 样本标准差  -> 紧，但假设可疑\n  Bootstrap BCa   不设分布形式       重采样分位数           渐近保证       -> 稳健，但看不见未出现的尾\n  换掉估计量       模型正确性         模型不确定性           绕开权重连乘\n\n⚠ CLT 的「n」实际上是 ESS，不是你的样本条数\n   ESS 个位数 ⇒ 正态近似没有依据 ⇒ t 检验会给出一个好看但不成立的界\n\n   Hoeffding 失败：明着失败（荒谬的负数，立刻发现）\n   t 检验失败：  暗着失败（界很漂亮，但不成立）   <- 更危险", "tbl": {"head": ["方法", "假设什么", "界的来源", "在重尾下"], "rows": [["<b>Hoeffding</b>", "<b>只要有界</b>（无分布假设）", "取值范围 b", "<span class='w'>空洞</span>"], ["Hoeffding + 截尾", "有界 + <b>回报非负</b>", "截断点 c", "<b>可用，但保守</b>"], ["<b>Student t</b>", "<b>近似正态</b>（靠 CLT）", "样本标准差", "<span class='w'>CLT 的 n 其实是 ESS，可能不成立</span>"], ["<b>Bootstrap (BCa)</b>", "不假设分布形式", "重采样分位数", "<b>较稳健</b>，但渐近保证、看不见未出现的尾"], ["不用 IS（换模型）", "<b>模型足够准</b>", "模型不确定性", "<b>绕开整个问题</b>，代价是模型偏差"]]}, "res": {"tag": "推断", "v": "<b>这一页的取舍在你这里可以跳过一半、但另一半必须接住。</b><br><b>可以跳过的那半</b>：三条替代路线（截尾、t 检验、bootstrap）<span class='k'>都是在修补「IS 权重重尾」这一个病</span>。而你的 oracle 表没有权重——每条 query 的 G 是精确值，落在一个已知的小区间里。<span class='w'>于是重尾不存在，Hoeffding 的 b 是真实的、小的</span>。<b>你可以直接用最保守、无分布假设的那一条，而且仍然得到有用的界。这是值得在论文里明说一句的优势</b>：<span class='k'>审稿人问「你的置信界用了什么假设」，答案是「只要 G 有界」——这是最弱的假设，不需要正态性，也不需要截尾的保守偏差</span>。<br><b>必须接住的那半是最后一条：Hanna, Stone 与 Niekum 的「不用 IS」。</b> <span class='w'>一旦你要评估 oracle 表之外的配置（而指数级的组合空间意味着你早晚要），穷举就不够了</span>，<b>而 IS 又因为行为策略确定性而不可用</b>——<b>那时唯一走得通的就是这条「学个模型再在模型里评估」的路</b>。<span class='k'>而你已经有那个模型了：简报 §4e 的成本模型 R² &gt; 0.95</span>。<b>所以你的技术路线可以这样铺</b>：表内靠穷举（精确、无假设），表外靠模型外推（有偏，但偏差可估），<b>并在表内的格子上<b>校准</b>模型外推的误差</b>——<span class='w'>这是穷举 oracle 除了「给基准」之外的第二个用途，而且可能是更有价值的那个</span>。<b>⚠ 但 L13 p26 那条缝在这里会回来</b>：模型是按预测损失训的，而你要的是「用它挑出来的配置好」。<b>校准必须按「决策是否一致」来做，不是按 R²。</b><br><b>还有一条关于 bootstrap 的用途澄清，别混。</b> <span class='k'>你仍然要用 bootstrap，但不是用来对付重尾，而是用来做 L13 p32 那个诊断</span>：按 query 重采样，看 config* 稳居第一的比例。<b>一个是算置信界，一个是检验选择的稳健性——两种用途，同一个工具。</b><br>标【推断】：两段式路线与校准建议是我推的；成本模型 R² 与 oracle 的精确性在简报里是【已核】。", "ref": "课件 p57–p58 · 简报 §4d §4e（已核）· L13 p26 · L13 p32 科研格"}},
{"r": [60, 61], "t": "安全策略改进：最终形态", "star": 3, "quote": "<b>Create a safe batch RL algorithm</b>〔配方页第四次出现，两格都已返工完〕<br><b>Safe policy improvement (revisited)</b> — <em>Thomas et al., <b>ICML 2015</b></em>", "one": "<b>两格都修好之后，第三格的逻辑一个字没变：算下界，够高就换，不够就拒绝。</b>", "pts": ["<b>这是配方页第四次出现</b>（p20、p24、p48 之后）。<span class='k'>前两格都返工过了</span>——第一格从朴素 IS 走到了 PDIS / WIS / DR / 混合（p29–47），第二格从朴素 Hoeffding 走到了截尾或别的不等式（p49–59）。<b>而第三格从 p27 到这里，逻辑一个字没改。</b>", "<b>这正是 p20 那个「接口干净」的设计的回报，值得停一下想清楚它为什么干净。</b> <span class='k'>第三格只依赖一件事：「给我一个 1−δ 下界」</span>。<b>至于那个下界是 IS 还是 DR 算的、是 Hoeffding 还是 bootstrap 给的，它完全不关心</b>。<span class='w'>于是前两格可以在十三页里被彻底重写，而第三格的正确性论证不用动一个字</span>。<b>在系统设计里这叫依赖抽象而非实现；在这里它意味着你的论文第三节可以在换估计量之后原样保留。</b>", "<b>最终的算法形态可以用三行写完</b>：<br>① 对每个候选策略 π<sub>e</sub>，用改进后的估计量 + 不等式算一个 1−δ 下界；<br>② 找下界最高的那个；<br>③ <b>只有当它高于 <code>V<sup>π<sub>b</sub></sup></code> 时才返回它，否则返回 π<sub>b</sub> 本身</b>。", "<b>第三步里「否则返回 π<sub>b</sub>」就是「拒绝」的具体形式，而它让安全性在最坏情况下也成立。</b> <span class='k'>返回 π<sub>b</sub> 时 <code>V<sup>A(D)</sup> = V<sup>π<sub>b</sub></sup></code>，p18 那个不等式取等号</span>。<b>所以这个算法永远不会违反它的承诺——最差的情况是它什么也不做</b>。<span class='w'>代价是它可能经常什么也不做</span>：<b>数据不够、或者候选确实没好多少，它就一直返回 π<sub>b</sub></b>。<b>这不是缺陷，而是这个保证的必然形状：你要「几乎不出错」，就得接受「经常不动」。</b>", "<b>这里要注意第二步和第三步的顺序，它比看起来讲究。</b> <span class='k'>是先按<b>下界</b>排序取最大，而不是按<b>点估计</b>排序取最大再去算它的下界</span>。<b>两者不一样</b>：<span class='w'>点估计最高的那个策略，可能方差极大、下界反而很低</span>。<b>按下界排序意味着这个算法天然偏好「估计值不错<b>而且</b>证据扎实」的候选</b>——<b>它把「有多好」和「有多确定」合在一个数里比较。</b>", "⚠️ <b>多个候选策略时有一个课件没强调的陷阱：多重比较。</b> <span class='w'>对 m 个候选各算一个 1−δ 下界，每个单独失败的概率是 δ，而「至少有一个失败」的概率可以接近 m·δ</span>。<b>于是你以为自己有 95% 的保证，实际上可能只有一半</b>。<b>严格做法有两条</b>：<span class='k'>要么对 δ 做修正（最简单的是 Bonferroni，每个用 δ/m），要么先用一部分数据把候选筛到很少几个、再用另一部分算界</span>——<b>又是切数据</b>。", "<b>Bonferroni 的代价要算一下，不然会以为它很贵。</b> <span class='k'>每个候选用 δ/m，而界里出现的是 <code>√(ln(1/δ))</code></span>，<b>所以 m 变大时惩罚只按 <code>√(ln m)</code> 增长——这是很温和的</b>。<span class='w'>m 从 10 到 1000，<code>ln(1/δ)</code> 里那一项只从约 5.3 涨到约 10</span>，<b>界松了不到一半</b>。<b>这是个好消息：候选多不可怕，可怕的是不修正。</b>", "<b>还有一个课件没问但很实际的问题：候选策略从哪来？</b> <span class='k'>这个配方假设你已经有一个候选集合</span>。<b>如果候选是从同一批数据上学出来的（比如跑一遍批量 Q 学习），那它们和数据已经不独立了</b>，<span class='w'>再在同一批数据上算下界就是 L13 p13 那条「数据必须与被评估对象独立」的直接违反</span>。<b>所以完整的流程至少要切三刀</b>：<b>生成候选、选超参数（c、δ 分配）、算最终的界</b>。<b>这三刀叠加，才是这个方法真实的数据成本。</b>"], "eq": "最终的 SPI（三行）：\n  ① 对每个候选 π_e：用改进的估计量 + 不等式，算 1−δ 置信下界 LB(π_e)\n  ② 取 π* = argmax_{π_e} LB(π_e)        <- 按**下界**排序，不是按点估计\n  ③ 若 LB(π*) > V^{π_b}  则返回 π*  否则返回 π_b\n                                        └─ 「拒绝」的具体形式 ─┘\n\n为什么安全：返回 π_b 时 V^{A(D)} = V^{π_b}，p18 的不等式取等号\n           ⇒ 永不违反承诺，代价是可能经常什么也不做\n\n⚠ m 个候选各算一个 1−δ 下界 ⇒ 「至少一个失败」的概率可接近 m·δ\n   Bonferroni：每个用 δ/m。代价只按 sqrt(ln m) 增长 —— 很温和\n              m: 10 -> 1000 时 ln(1/δ) 约 5.3 -> 10，界松不到一半\n   ⇒ 候选多不可怕，不修正才可怕\n\n⚠ 候选若是从同一批数据学出来的，就已与数据不独立（L13 p13）\n   完整流程要切三刀：生成候选 / 选超参数 / 算最终的界", "tbl": {"head": ["配方的格", "朴素版（p20–p28）", "<b>最终版</b>", "改了吗"], "rows": [["① OPE", "朴素 IS", "<b>PDIS / WIS / DR / 混合</b>", "<b>改了</b>（p29–47）"], ["② HCOPE", "朴素 Hoeffding", "<b>截尾 / t 检验 / bootstrap</b>", "<b>改了</b>（p49–59）"], ["③ SPI", "下界够高就换", "<b>下界够高就换</b>", "<span class='k'>一个字没改</span>"]]}, "res": {"tag": "推断", "v": "<b>这一页给你的是论文第三节的骨架，以及一个必须正面处理的数量级问题。</b><br><b>骨架：按下界排序，而不是按点估计排序。</b> <span class='k'>你现在的做法是「选 G 的留出集均值最高的那个配置」——这是按点估计排序</span>。<b>按这一页改成「选 G 的置信下界最高的那个」，你会同时拿到两样东西</b>：<span class='w'>① 它自动惩罚那些「均值好看但方差大」的配置（也就是 L04 p42 那个最大化偏差的直接解药）；② 它给了你一个天然的「不换」判据</b>——<b>没有任何配置的下界超过默认配置，就报告「数据不足以支持更换」</b>。<b>这个「拒绝」选项是审稿人会尊重的，而「我们总能找到更好的配置」听起来反而可疑。</b><br><b>数量级问题：你的 m 很大。</b> <span class='w'>节点级指派在 H 个节点上各选一档，候选数是指数的</span>——<b>这正是多重比较最该担心的场景，而课件只用一句话带过</b>。<b>好消息是上面那笔 Bonferroni 的账：惩罚按 √(ln m) 走</b>，<span class='k'>m = 2¹⁰ 约 1000 时 <code>ln(1/δ)</code> 从 5.3 涨到 10，界只松约 1.4 倍</span>——<b>完全付得起</b>。<b>所以结论很干净：候选数指数增长，而置信界的代价只是对数增长的平方根。这句话值得写进论文，它把一个看起来致命的问题变成一个脚注。</b><br><b>而那三刀切分是你真正要算的成本。</b> <span class='w'>生成候选（AFlow 搜索 + 指派策略训练）、选超参数（λ、阈值）、算最终的界</span>——<b>如果这三件事都用同一个留出集，所有保证都是假的</b>。<b>实操上最省数据的安排</b>：<span class='k'>用训练集生成候选与调 λ，留出集只做最后一件事——算界</b>。<b>这样留出集只被用一次，Bonferroni 修正也只需要对「最终比较的候选数」做，而不是对搜索过程中见过的全部配置做。</b> ⚠ <b>这一点很容易搞错</b>：<span class='w'>如果你在留出集上反复看结果来调方法，实际的 m 是「你看了多少次」，而那个数你往往数不清</span>——<b>这就是为什么留出集要锁起来。</b><br>标【推断】：Bonferroni 的数量级估算与三刀安排是我推的；节点级指派与 λ 在简报里是【已核】。", "ref": "课件 p60–p61 · L04 p42 · L13 p13 · 简报 §2 §4c（已核）"}},
{"r": [62, 66], "t": "两个应用：数字营销与糖尿病治疗", "star": 2, "quote": "<b>Empirical Results: Digital Marketing</b>〔p62–65〕 · <b>Example Results: Diabetes Treatment</b>〔p66〕〔均以图为主〕", "one": "<b>两个真实领域的结果：数字营销与糖尿病治疗。前者数据多、代价是钱；后者数据少、代价是人。</b>", "pts": ["<b>这两个应用的选择正好覆盖了 p12–p14 说的两类代价。</b> <span class='k'>数字营销对应「贵」</span>（投错广告损失转化率，可量化、可承受）；<span class='k'>糖尿病治疗对应「危险」</span>（用药方案错了伤害病人，不可逆）。<b>同一套方法，两种截然不同的风险态度</b>——<span class='w'>而 δ 该取多少，正是由这个区别决定的</span>。<b>营销里 δ=0.05 很合理；医疗里你可能要小得多，而那会让界松很多。</b>", "<b>数字营销是 OPE 的理想试验场，原因值得逐条想一遍，因为每一条都是前面某个假设的来源。</b> ① <span class='k'>行为策略是算法，所以 <code>π<sub>b</sub></code> 完全可知，而且是随机的</span>（投放系统本来就在做探索）——<b>这是整讲所有方法的前提</b>；② 数据量极大；③ 单次失败代价小；④ <b>而且可以真的上线做 A/B 验证</b>。", "<b>第 ④ 条是最关键的，它让这个领域成为少数能验证 OPE 方法<b>本身</b>的地方。</b> <span class='k'>你先用旧数据离线估一个值，再真的上线跑一遍拿到真值，两个数一对比，就知道你的估计量准不准</span>。<b>这是在给方法做校准，而不是在用方法做决策</b>——<span class='w'>而没有这一步，你永远不知道自己的 OPE 是不是在系统性地撒谎</span>。<b>p50 那个负一百万之所以能被认定为「空洞」，正因为她知道真值是 0.19。</b>", "<b>医疗正相反，而这正是 OPE 最被需要的地方——这是一个结构性的困境。</b> <span class='w'>数据少（病人数量有限）、<code>π<sub>b</sub></code> 往往是医生的判断（未必可知、而且可能是近乎确定性的）、不能做 A/B 验证（不能为了验证方法而给病人用一个你不确定的方案）</span>。<b>于是：方法最被需要的地方，恰恰最难验证方法本身。</b>", "<b>把这个困境说完整：它不只是「数据少」，而是「连检查你做得对不对的手段都没有」。</b> <span class='k'>营销里你可以反复校准，医疗里你只能依赖假设是否成立</span>。<b>所以医疗应用里那些假设的审查必须严厉得多</b>——<span class='w'>覆盖条件、平稳性、<code>π<sub>b</sub></code> 可知性，每一条都不能含糊过去</span>。<b>这也解释了为什么这个方向上「高置信」三个字是必须的，而不是锦上添花。</b>", "<b>顺带留一条给自己的提醒：<code>π<sub>b</sub></code> 不可知时该怎么办，本讲没给答案。</b> <span class='k'>医生的决策没有概率表</span>，<b>常见做法是先从数据里<b>估</b>一个行为策略（行为克隆）再当成 <code>π<sub>b</sub></code> 用</b>——<span class='w'>但那样权重的分母本身带误差，而误差会被连乘放大</span>。<b>这是本讲整个框架在医疗上落地时第一个要处理的缺口，p67 把它的近亲（确定性 <code>π<sub>b</sub></code>）列进了开放问题。</b>", "⚠️ <b>p62–p66 全是图，PDF 上无正文。</b> 本精读不补图里的数字——<span class='w'>那些无法从文本可靠还原</span>。要引用结果请查 p53 与 p61 给出的两篇原文。"], "tbl": {"head": ["", "数字营销", "糖尿病治疗"], "rows": [["对应哪类代价（p12–14）", "<b>贵</b>（可量化、可承受）", "<b>危险</b>（不可逆）"], ["数据量", "<b>极大</b>", "<span class='w'>少</span>"], ["π<sub>b</sub> 可知吗", "<b>可知且随机</b>（算法决策）", "<span class='w'>往往不可知、近乎确定性</span>"], ["能做在线验证吗", "<b>能</b>（A/B 测试）", "<span class='w'>不能</span>"], ["δ 该取多少", "0.05 量级就够", "<b>要小得多，界会松很多</b>"], ["于是", "<b>能验证 OPE 方法本身</b>", "<b>最需要 OPE，却最难验证它</b>"]]}, "res": {"tag": "推断", "v": "<b>你的处境在这张表上是「营销那一列的数据条件 + 医疗那一列的策略条件」，而这个组合其实是最好的那一种。</b><br><b>像营销的地方</b>：<span class='k'>你能做在线验证</span>——想知道某个节点级指派配置到底多好，<b>直接把它跑一遍就有真值</b>。<span class='w'>这是医疗做不到、而对你几乎免费的事（只是 API 调用费）</span>。<b>所以你应该做 Brunskill 在 p62–65 做的那件事：拿一小部分配置，同时给出「离线估计」和「实际跑出来的真值」，画一张散点图。</b><b>这张图是你整篇论文最有说服力的一张</b>——<span class='k'>它校准的是方法本身，而不是用方法得出的结论</span>。<b>没有这张图，你所有的 G 估计都只能被当成假设。</b><br><b>像医疗的地方</b>：<span class='w'>你的 π<sub>b</sub>（AFlow 搜出来的工作流）是确定性的、而且不是为探索设计的</span>——<b>这是 p67 那条开放问题</b>。<br><b>而两者合起来给了你一个别人没有的位置：你有一个「π<sub>b</sub> 确定性」的难问题，却有「可以随时拿到真值」的便利条件。</b> <span class='k'>于是你可以把那些在医疗里只能靠假设的事情，在你这里<b>实测</b></span>：<b>覆盖不足到什么程度估计就开始偏？模型外推的误差有多大？按下界排序和按点估计排序选出的配置差多少？</b><span class='w'>这些问题在医疗数据上无法回答，在你的设定里每一个都是一次实验</span>。<b>这是一个被低估的优势，值得在动机一节里明说。</b><br><b>⚠ 但有一条必须守住：能拿到真值不等于可以拿真值去挑配置。</b> <span class='k'>真值只能用在「校准方法」这一步，一旦用来选配置，留出集就污染了</span>——<b>这和 p55 的 20%/80% 是同一条规矩。校准用的那批配置，之后不能进最终比较。</b><br>标【推断】：散点图建议与「两列的组合」这个定位是我推的；确定性 π<sub>b</sub> 在简报里是【已核】。", "ref": "课件 p62–p66 · p12–p14 · p55 · p67 · 简报 §4a（已核）"}},
{"r": [67, 70], "t": "本讲没覆盖的，与该记住的", "star": 3, "quote": "<b>Other Relevant Work</b> — <em><b>What to do when the behavior policy is deterministic?</b></em> · <em>What to do when care about safe exploration?</em> · <em>What to do when care about performance on a single trajectory</em><br><b>OPE and Selection</b> — <em>Very important topic: healthcare, education, marketing</em> · <em>Big focus of my lab</em> · <em>Very interesting area at the <b>intersection of causality and control</b></em><br><b>What You Should Know</b> — 定义并应用 IS · 说出 IS 的局限（方差）· 列举替代方案（WIS、DR）· 说清为什么要安全 RL · <em><b>Define the scope of the guarantees</b> implied by safe policy improvement as defined in this lecture</em>", "one": "<b>最后一页把本讲没解决的问题列了出来，而第一条就是：行为策略是确定性的时候该怎么办。</b>", "pts": ["<b>p67 第一条是本讲最诚实的一句话</b>：<em>What to do when the behavior policy is <b>deterministic</b>?</em> <span class='w'>整讲的方法全部建立在 π<sub>b</sub> 是随机的这个前提上</span>——<b>没有随机性就没有分母，没有分母就没有权重，没有权重整套机器（IS、WIS、PDIS、DR、截尾、HCOPE、SPI）就一台也开不动</b>。<span class='k'>而课件把「它不是随机的怎么办」明确列为本讲范围之外</span>。", "<b>把这条的分量说清楚：这不是一个边角情形，而是现实里的常态。</b> <span class='w'>任何已经上线的、调好的、确定性的系统</span>——推荐系统的最终排序、编译器的优化选项、一个搜出来的工作流——<b>都是确定性的 π<sub>b</sub></b>。<b>换句话说：这套方法要求你在收集数据<b>之前</b>就决定要做离策略评估，并故意把系统做成随机的</b>。<span class='k'>如果数据已经收完了而且是确定性策略收的，那就太晚了</span>。<b>这是一条关于「什么时候做决定」的教训，而不只是一条技术限制。</b>", "<b>p67 另外两条也值得记，而且它们指向同一个方向。</b> <b>② 安全探索</b>：不只是安全地<b>改进</b>策略，还要在<b>探索过程中</b>保持安全（本讲允许你在收集数据时任意探索，只在上线前谨慎）；<b>③ 单条轨迹上的表现</b>：<span class='k'>本讲的保证全是关于<b>期望</b>的，不保证任何一条具体的轨迹</span>。<b>这两条都指向「关心尾部」，而本讲只管均值。</b>", "<b>第 ③ 条在医疗语境下尤其刺眼，值得想透。</b> <span class='w'>「新方案的平均效果以 95% 置信度优于旧方案」完全不排除「有一小部分病人会严重变差」</span>。<b>要管这个就得换目标函数——不是最大化期望，而是管住分布的下尾</b>（<span class='k'>条件风险价值 CVaR、或者最坏情况的保证</span>）。<b>这和 L01 p28 那句「本课全程搁置风险度量」是同一个缺口，在这里第二次出现。</b>", "<b>p68 把这个领域定位成「因果推断与控制的交叉」，并点了两位斯坦福统计系的名字</b>（Stefan Wager、Susan Athey）。<span class='k'>这个定位非常准，而且对你有实际用处：两边在研究同一批问题，只是术语不同</span>。<b>记住这张对照表，你就能读懂另一半文献</b>：<span class='w'>IS 在那边叫<b>逆概率加权</b>（IPW）、双重稳健在那边叫 AIPW 而且是原生概念、覆盖条件在那边叫<b>正值性</b>（positivity）、<code>π<sub>b</sub></code> 可知在那边叫<b>倾向得分已知</b></span>。", "<b>而有一个概念是因果那边有、RL 这边习惯性假设掉的：混淆。</b> <span class='k'>RL 的标准设定假设状态 <code>s</code> 被完整观测，于是行为策略只依赖 <code>s</code>，没有未观测的混淆因子</span>。<b>现实里这个假设经常不成立</b>——<span class='w'>医生根据某些没记进病历的信息做了决定，那个信息同时影响了治疗选择和结果</span>。<b>这时所有权重都是错的，而且错得无法从数据里发现</b>。<b>「因果与控制的交叉」最硬的那部分就在这里。</b>", "<b>p69 那五条「该会什么」里，最后一条最值得停</b>：<em>define the <b>scope</b> of the guarantees implied by safe policy improvement <b>as defined in this lecture</b></em>。<span class='w'>她要求你能说清这个保证<b>不</b>保证什么</span>——注意那句 <em>as defined in this lecture</em>，<b>这是在提醒你「安全」这个词有很多种定义，本讲只给了一种</b>。", "<b>「能说清保证的边界」这个要求，比「会用这个方法」难得多，也有用得多。</b> <span class='k'>本讲前面每一处「⚠」其实都在为这一条做准备</span>：覆盖条件（p22）、平稳性假设（p46）、有限时域、单一行为策略、回报非负（p52 那条隐含前提）、δ 只管均值不管尾部、以及多重比较。<b>把它们列全，就是这一讲最好的复习</b>——<b>而且这份清单就是你论文局限一节的草稿。</b>", "⚠️ <b>最后记住这一讲停在 2019。</b> <span class='w'>FQE、密度比方法（DualDICE 一类）、CQL / IQL 全都没有</span>，<b>而离线 RL 后来最常用的恰恰是这些</b>。<b>本讲给你的是<b>问题的形状和保证的语言</b>，不是最新的估计量</b>——<span class='k'>不要因为课件没提就以为 IS/DR 是当前最好的做法</span>。"], "eq": "本讲的保证 **不** 包括（p69 要求你能说清的 scope）：\n\n  · π_b 是确定性的情形            p67 第一条，明确列为范围之外\n  · 单条轨迹上的表现              p67 第三条 —— 只保证期望\n  · 探索过程中的安全              p67 第二条\n  · 非平稳环境                    p46（Thomas et al. AAAI 2017）\n  · 尾部风险（CVaR 一类）          L01 p28 起全程搁置\n  · 回报可以为负时的截尾论证        p52 的隐含前提\n  · 多重比较（m 个候选）            p60 未强调\n  · 存在未观测混淆时                RL 标准设定直接假设掉了\n  · 2019 年之后的方法（FQE/CQL/IQL） 本课时间之外\n\n因果推断 <-> 强化学习 术语对照（p68「intersection of causality and control」）：\n   IS  (重要性采样)        =  IPW（逆概率加权）\n   DR  (双重稳健)          =  AIPW           <- 那边的原生概念\n   覆盖条件                =  positivity（正值性）\n   π_b 可知                =  倾向得分已知\n   —（RL 常直接假设掉）     =  confounding（混淆）  <- 最硬的那部分在这里", "tbl": {"head": ["本讲的保证<b>不</b>包括", "出处", "该找什么"], "rows": [["π<sub>b</sub> 是<b>确定性</b>的情形", "<b>p67 第一条</b>", "<span class='w'>明确列为范围之外</span>；deficient support 文献"], ["单条轨迹上的表现", "p67 第三条", "风险度量 / CVaR"], ["探索过程中的安全", "p67 第二条", "安全探索文献"], ["非平稳环境", "p46", "Thomas et al. AAAI 2017"], ["尾部风险（只管均值）", "L01 p28", "本课全程搁置"], ["回报为负时的截尾", "<b>p52 的隐含前提</b>", "<b>先平移到非负</b>，但 b 会变"], ["多重比较（m 个候选）", "p60（未强调）", "Bonferroni，代价只按 √(ln m) 走"], ["未观测混淆", "RL 标准设定假设掉了", "<b>因果推断那一侧</b>"], ["FQE / 密度比 / CQL / IQL", "—", "<b>2019 之后，需出课找</b>"]]}, "res": {"tag": "已核", "v": "<b>p67 第一条就是你的问题，而且这门课明确把它放在了范围之外——这件事本身对你的论文有用。</b><br>原文：<em>What to do when the behavior policy is <b>deterministic</b>?</em> <span class='k'>整讲的机器（IS、WIS、PDIS、DR、截尾、HCOPE、SPI）全部建立在 π<sub>b</sub> 随机这个前提上</span>，而 Brunskill 在最后一页把「它不随机怎么办」列为 <em>Other Relevant Work</em>。<br><b>这给了你一句可以直接用的定位</b>：你面对的不是这套方法的一个应用，<b>而是它明确承认未解决的那个入口</b>。<span class='w'>这比「我们把 OPE 用到 LLM workflow 上」有分量得多</span>——后者听起来像应用，前者是在一个被点名的缺口上工作。<b>在引言里引这一句（课件 p67 或 ICML 2015 的 future work），你的问题陈述就立住了。</b><br><b>而文献里对这个缺口的回答你已经有了</b>：Sachdeva / Su / Joachims 的 deficient support（限制目标策略类，或接受有偏但可控的估计），以及你自己的两条路——<b>把球撑大</b>（随机化 + 记 propensity）或<b>绕开球</b>（穷举 oracle）。<span class='k'>本讲的 p67 给了这两条路一个权威的「为什么需要它们」</span>。<br><b>p67 第二条和第三条也各自对上了你的一处取舍。</b> <b>安全探索</b>：<span class='w'>你收集 oracle 表的过程本身是要花钱的、而且会产生低质量输出</span>——如果那些输出会被用户看到，那就是「探索期间的安全」问题，而本讲不管这个（它假设你可以随便探索、只在上线前谨慎）。<b>所以 oracle 表必须在离线、不面向用户的环境里跑</b>，这不是实现细节，是本讲框架成立的条件。<b>单条轨迹</b>：<span class='k'>你的保证是「留出集上 G 的期望更好」，不保证任何单条 query 不变差</span>——<b>如果有「每条 query 的准确率都不能下降」这种需求，本讲的全部机器都不适用</b>，要换 CVaR 一类的目标。<b>这条该主动写进局限。</b><br><b>p68 那张术语对照表是最实用的一条。</b> <span class='w'>如果你的审稿人有因果推断背景，用 IPW / 倾向得分 / AIPW / positivity 的语言会比用 IS / 覆盖条件的语言更容易沟通</span>——<b>而「行为策略确定性」在那边叫「倾向得分退化、正值性不成立」，那边对这个情形的讨论比 RL 这边多得多</b>。<b>多读一侧文献，等于多一条出路。</b> ⚠ <b>还有混淆这一条要当心</b>：<span class='k'>你的设定里「状态」是什么？如果指派策略只看节点编号，那么 query 的难度就是一个未观测的混淆因子</span>——<b>它同时影响「哪些配置被跑过」和「结果好不好」。这正是 P2/P3 消融在回答的问题，而用因果的语言说会更清楚。</b><br><b>最后，p69 最后一条值得当成写作要求</b>：能说清保证<b>不</b>保证什么。对你而言这至少包括：不保证单条 query、不保证 query 分布漂移后仍成立、不保证 oracle 表之外的配置、不保证尾部、不保证模型 API 换版本后仍成立。<b>把这些主动列出来，是最有效的防守。</b>", "ref": "课件 p67 · p68 · p69 原文（逐句核对）· 简报 §4a §4c §4d · §5（P2/P3）"}}
