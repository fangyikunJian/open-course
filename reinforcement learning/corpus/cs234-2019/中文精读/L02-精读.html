<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS234 第二讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs234-2019-l02">

<div id="bar">
  <h1>CS234 第二讲 · <span>已知世界模型：MP / MRP / MDP，策略迭代与值迭代</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 60</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <a class="btn" id="openpdf" hidden target="_blank" rel="noopener"
     title="在新标签页打开原课件 —— 跨域 PDF 能不能内嵌取决于浏览器">原课件 ↗</a>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../slides/lecture2.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs234-2019</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/中文精读/L02-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "这一讲和下一讲的分界线是什么？", "o": ["有没有折扣因子", "策略是不是确定性的", "状态是不是有限", "知不知道世界怎么运作"], "a": 3, "why": "这一讲<b>给定模型</b>，只谈怎么算；下一讲开始「不知道模型」，那才是学习。"}, {"q": "这一讲标题里 <em>Given a Model of the World</em> 这半句意味着什么？", "o": ["你有一个模拟器可以反复采样", "你知道 P 和 R，所以不需要与环境交互，闭着眼就能算出最优策略", "你已经有一批专家演示数据", "状态空间小到可以查表"], "a": 1, "why": "从第三讲起这个前提就没了，而那之后的所有困难追根溯源都是「不知道 P 和 R」。"}],
4: [{"q": "这一讲的四步路线，正确的顺序是？", "o": ["MP → MRP → MDP → 评估与控制", "MDP → MRP → MP → 控制", "MP → MDP → MRP → 控制", "MRP → MP → MDP → 评估"], "a": 0, "why": "一次只加一样：先只有状态，加奖励成 MRP，再加动作成 MDP。"}, {"q": "MP、MRP、MDP 三级各自多了什么？", "o": ["分别多了状态、动作、奖励", "MRP 比 MP 多了折扣，MDP 比 MRP 多了奖励", "三者只是同一个模型的不同叫法", "MRP 比 MP 多了奖励，MDP 比 MRP 多了动作"], "a": 3, "why": "只有最后一步引入了「你」这个角色。前两级里你是旁观者。"}, {"q": "「评估」和「控制」分别是什么性质的问题？", "o": ["两者都是统计估计问题", "评估是优化问题，控制是计算问题", "两者都是优化问题", "评估是计算问题（给定策略它值多少），控制是优化问题（哪个策略最好）"], "a": 3, "why": "这门课几乎每一讲都能归进这两格之一，先判断在哪一格，就知道该拿什么去对比它。"}],
5: [{"q": "按这一页，bandit 是什么？", "o": ["单状态的 MDP", "状态取历史的 MDP", "连续状态的 MDP", "没有奖励的 MDP"], "a": 0, "why": "连续状态的是最优控制，状态取历史的是 POMDP。"}],
6: [{"q": "马尔可夫性那个等式真正在说什么？", "o": ["历史不重要，可以丢掉", "历史里有用的部分都已经装进当前状态了，所以多看历史没有好处", "转移概率不随时间变化", "未来是确定的"], "a": 1, "why": "这是关于「状态设计得好不好」的条件，不是关于世界的条件。所以问题看起来不马尔可夫时，先改状态而不是换算法。"}],
7: [{"q": "马尔可夫过程（马尔可夫链）里<b>没有</b>什么？", "o": ["转移概率", "随机性", "奖励和动作", "状态"], "a": 2, "why": "定义只有状态集 S 和转移模型 P。奖励要到 MRP 才加，动作要到 MDP 才加。"}],
8: [{"q": "火星车链里，为什么 <code>P(s1|s1)=0.6</code> 而中间状态原地只有 0.2？", "o": ["s1 在一端，本该往左的 0.4 没处去，只好留在原地", "s1 的马达坏了", "s1 的奖励更高", "这是随机设定的"], "a": 0, "why": "0.2 + 0.4 = 0.6。两端都是这样，s7 同理。"}, {"q": "这一页的转移概率是谁决定的？", "o": ["奖励函数", "世界本身的动态，这里还没有动作", "折扣因子", "agent 选的动作"], "a": 1, "why": "老师说这就是「那个假火星车的世界」——马达就这么转，agent 还插不上手。"}, {"q": "火星车两端为什么是原地 0.6 而不是 0.4？", "o": ["为了让矩阵的行和为 1 而随意凑的", "两端是吸收态", "两端的状态更黏", "往外的那 0.4 无处可去，被折回了「原地」（0.2+0.4）"], "a": 3, "why": "这叫把越界的概率质量反射回来。另一种常见做法是设成吸收态，那样两端就是 1.0。"}],
9: [{"q": "同一个起点 s4 为什么能跑出完全不同的三条轨迹？", "o": ["转移是随机的，每一步世界替你抽签", "策略在变", "起点其实不同", "奖励在变"], "a": 0, "why": "分布是你算出来的，实际发生的只有一条。agent 不可能同时在多个状态里。"}],
10: [{"q": "MRP 比马尔可夫链多了什么？", "o": ["奖励函数和折扣因子", "策略", "动作", "状态"], "a": 0, "why": "MRP = (S, P, R, γ)。<b>仍然没有动作</b>——那要到 MDP。"}],
12: [{"q": "回报 <code>G_t</code> 和值函数 <code>V(s)</code> 的关系是？", "o": ["两者无关", "完全一样", "G 是 V 的期望", "V 是 G 的期望"], "a": 3, "why": "G 是走一趟拿到的数，V 是无数趟的平均。过程确定时两者才相同。"}],
13: [{"q": "课上问「γ 非得几何衰减吗」，老师的回答是？", "o": ["不是必须，但这个选择的数学性质特别好", "取决于状态数", "必须，否则不收敛", "必须，否则无意义"], "a": 0, "why": "后面证贝尔曼备份是压缩算子时，靠的正是这个几何衰减。"}, {"q": "什么时候可以放心用 <code>γ=1</code>？", "o": ["动作数有限时", "任何时候", "状态数有限时", "片段长度总是有限时"], "a": 3, "why": "γ 的一个主要作用是保证无限 horizon 下回报有界。horizon 本来就有限，这个顾虑就没了。"}, {"q": "课件说「片段长度总是有限的话，可以用 γ = 1」，为什么？", "o": ["因为有限 horizon 下值函数一定有界于 1", "因为有限片段的回报更容易计算", "γ<1 的唯一硬性理由是防止无穷和发散；片段必然结束时这个理由就不存在了", "因为 γ=1 时算法收敛更快"], "a": 2, "why": "此时强行打折扣等于人为轻视结尾的奖励，而很多任务里结尾恰恰最重要。"}, {"q": "γ 隐含的「有效视野」大约是多少步？", "o": ["<code>γ</code> 步", "<code>log γ</code> 步", "<code>1/γ</code> 步", "<code>1/(1−γ)</code> 步"], "a": 3, "why": "γ=0.9 大约看 10 步，γ=0.99 大约看 100 步。第五讲 p34 那个误差放大因子来源正是这里。"}],
14: [{"q": "<code>s4,s5,s6,s7</code> 这条四步轨迹，γ=½ 时回报是 1.25。那个 <code>⅛</code> 是怎么来的？", "o": ["γ 的三次方——奖励在第 4 步才拿到", "s7 的转移概率", "γ 的平方", "1/10 的近似"], "a": 0, "why": "前三步奖励都是 0，只有最后一步的 +10 被折了三次：⅛ × 10 = 1.25。"}, {"q": "三条轨迹的回报分别是 1.25、0、0.125。这个差距说明了什么？", "o": ["γ 选得不对", "单次回报方差很大，所以才需要取期望", "s4 不是好起点", "课件算错了"], "a": 1, "why": "同一个起点差十倍。值函数就是为了把这种随机性平掉。"}],
16: [{"q": "<code>V = [1.53 0.37 0.13 0.22 0.85 3.59 15.31]</code>，为什么中间的 s3 最低？", "o": ["s3 的奖励是负的", "s3 离两个奖励源都远，而右边的 +10 又压过左边的 +1", "这是计算误差", "s3 的转移概率特殊"], "a": 1, "why": "从 s3 往两边都升高，往右升得快得多——+10 比 +1 有吸引力得多。"}, {"q": "上一页那条走到 s7 的样本回报是 1.25，而 <code>V(s4)</code> 只有 0.22。矛盾吗？", "o": ["不矛盾，因为 γ 不同", "不矛盾，因为起点不同", "不矛盾，1.25 是一次的运气，0.22 是所有可能的平均", "矛盾，肯定算错了"], "a": 2, "why": "那条恰好一路向右，是三条里最好的一条。大部分轨迹没这么走运。"}],
17: [{"q": "用模拟估 MRP 的值，最特别的优点是？", "o": ["不需要奖励模型", "收敛最快", "精度最高", "不需要马尔可夫假设"], "a": 3, "why": "它只是在求平均，压根没用到马尔可夫结构——代价是也<b>浪费</b>了这个结构。"}, {"q": "三种算 MRP 值函数的方法里，哪一种不需要马尔可夫假设？", "o": ["模拟求平均", "三种都需要", "动态规划", "解析解"], "a": 0, "why": "课件原文 Requires no assumption of Markov structure。它只是在估一个期望，而大数定律不要求马尔可夫性。"}, {"q": "模拟求平均的误差大致按什么速度下降？", "o": ["<code>γⁿ</code>", "<code>1/n</code>", "<code>1/√n</code>，所以误差减半要四倍的片段数", "<code>1/n²</code>"], "a": 2, "why": "这是一条很慢的曲线，而 p14 已经让你看到方差有多大。这正是第三讲要花大力气降方差的原因。"}],
18: [{"q": "<code>V(s) = R(s) + γ Σ P(s′|s) V(s′)</code>——等号两边都有 V，这是循环定义吗？", "o": ["是，所以只能用模拟", "不是，这是一组方程，V 是它的解", "不是，因为右边的 V 是上一轮的", "是，所以这个式子有问题"], "a": 1, "why": "后面三种解法（解析、迭代、模拟）都是在解这组方程。"}],
20: [{"q": "解析解 <code>V=(I−γP)^{-1}R</code> 的代价主要在哪？", "o": ["要知道策略", "要跑很多次模拟", "要求一次矩阵逆，N² 到 N³", "要 γ=1"], "a": 2, "why": "而且只适用于状态有限的情形。"}, {"q": "<code>I − γP</code> 什么时候保证可逆？", "o": ["γ = 1 时", "γ < 1 时（P 是随机矩阵，特征值 ≤1）", "任何时候", "状态数是偶数时"], "a": 1, "why": "课上被问住了，老师回头才给的答案。这也是折扣因子的又一项好处。"}, {"q": "<code>(I − γP)⁻¹</code> 为什么在 γ&lt;1 时一定存在？", "o": ["因为 P 是对称的", "因为 P 是稀疏的", "P 是随机矩阵，谱半径为 1，所以 γP 的谱半径是 γ<1，I−γP 无零特征值", "因为 R 非零"], "a": 2, "why": "还有个漂亮的展开：(I−γP)⁻¹ = I + γP + γ²P² + …，正是「把未来一步步加起来」的无穷和。"}, {"q": "γ = 1 且过程不结束时，<code>I − P</code> 为什么一定奇异？", "o": ["因为 R 的某个分量为 0", "全 1 向量满足 P·1 = 1，所以 (I−P)·1 = 0，矩阵有零特征值", "因为 P 的行列式为 0", "因为 P 不可逆"], "a": 1, "why": "直观地说：γ=1 且永不结束时值可以是无穷大，当然解不出来。此时该换 p55 的倒推。"}, {"q": "解析解这条路最大的问题是什么？", "o": ["数值不稳定", "需要知道初始状态分布", "只能算单个状态的值", "<code>O(N³)</code> 的求逆，状态上万就很勉强，上亿彻底没戏"], "a": 3, "why": "最优雅的一条路恰恰最没用。它的价值在于告诉你理论上答案长什么样。"}],
21: [{"q": "动态规划算 MRP 值，每轮的复杂度是？", "o": ["O(|S|)", "O(|S|³)", "O(1)", "O(|S|²)"], "a": 3, "why": "对每个状态做一次，每次对所有可能的下一状态求和。比求逆便宜。"}, {"q": "三种算法里，<b>唯一</b>加上动作之后还能原样用下去的是？", "o": ["动态规划", "模拟", "解析解", "三种都能"], "a": 0, "why": "后面的策略评估、策略迭代、值迭代全是它的变体。"}, {"q": "动态规划里 <code>V_k</code> 的确切含义是什么？", "o": ["误差小于 <code>1/k</code> 的近似", "只活 k 步时从 s 出发的期望回报", "第 k 个状态的值", "第 k 条采样轨迹的回报"], "a": 1, "why": "所以迭代 k 轮 = 把视野推远 k 步。而 γᵏ 在衰减，远处贡献越来越小，所以会收敛。"}],
22: [{"q": "MDP 比 MRP 多了什么？", "o": ["状态", "动作，且转移模型每个动作各有一份", "折扣因子", "奖励"], "a": 1, "why": "MDP = (S, A, P, R, γ)。奖励也随之可以依赖动作。"}, {"q": "课上问「都指定动作了，转移为什么还是随机的」。老师的理由是？", "o": ["随机算得快", "为了数学方便", "因为我们的模型不够好，用随机性兜住这份不确定", "世界本质随机"], "a": 2, "why": "机器人在地毯上有时卡住、开车有时堵车。你也可以把更多变量塞进状态让它变确定。"}],
25: [{"q": "「MDP + 策略 = MRP」这件事为什么重要？", "o": ["因为可以去掉奖励", "因为 MRP 更简单", "因为评估一个策略的值不需要新工具，MRP 那三种办法直接拿来用", "因为可以去掉折扣"], "a": 2, "why": "把策略定死，动作这一维被积掉。这是整讲的枢纽。"}, {"q": "为什么说 p25 是整讲的枢纽？", "o": ["它第一次给出了最优策略的定义", "固定策略后 MDP 塌回 MRP，于是前面算 MRP 的三种办法原样可用", "它引入了 Q 函数", "它证明了策略迭代收敛"], "a": 1, "why": "课件原话就是 we can use same techniques。这也把「评估」和「控制」彻底切开了：难的不是评估，是策略有指数多个。"}, {"q": "这个塌缩有什么前提？", "o": ["策略必须是确定性的", "γ 必须小于 1", "奖励必须非负", "策略必须是平稳的；若 π 随时间变，P^π 也随时间变，就不是标准 MRP"], "a": 3, "why": "这一点在 p56 的有限 horizon 情形会变得要紧——那时最优策略不平稳。"}],
26: [{"q": "策略备份和最优备份的唯一区别是什么？", "o": ["前者有 max_a，后者没有", "后者有 max_a，前者照着策略走不做选择", "前者作用于 Q，后者作用于 V", "前者用 γ，后者不用"], "a": 1, "why": "一个 max 的有无，分出了策略迭代和值迭代两条路，也分出了 V^π 和 V*。"}],
27: [{"q": "这道题老师说是「陷阱」，陷在哪？", "o": ["她没给转移模型，而答案根本不需要转移模型", "奖励写错了", "策略不是确定性的", "γ 写错了"], "a": 0, "why": "γ=0 把整个求和项乘没了，只剩即时奖励，转移模型用不上。"}],
28: [{"q": "<code>V(s6)</code> 从 0 变成 2.5，这一步真正想演示的是？", "o": ["随机动态更难算", "信息在往回流：s7 的 +10 开始向左渗", "γ 的作用", "s6 是特殊状态"], "a": 1, "why": "第一次备份只铺开即时奖励，此后每一轮好消息往左传一格。"}, {"q": "<code>V_{k+1}(s6) = 0 + 0.5·0.5·0 + 0.5·0.5·10</code>。第一个 0.5 和第二个 0.5 分别是什么？", "o": ["都是 γ", "都是转移概率", "γ 和转移概率", "γ 和奖励"], "a": 2, "why": "γ=0.5，转移 p(s6|s6,a1)=p(s7|s6,a1)=0.5。别把两者混成一个数。"}],
29: [{"q": "关于最优解，这一页断言的是？", "o": ["两者都唯一", "最优策略唯一", "最优值函数唯一", "两者都不唯一"], "a": 2, "why": "值函数唯一；策略可能有并列——两个动作的最优值打平就是。"}],
30: [{"q": "7 个状态、2 个动作，确定性策略有多少个？", "o": ["7", "2⁷ = 128", "7² = 49", "14"], "a": 1, "why": "每个状态各自挑一个动作，挑法相乘：|A|^|S|。指数级，不是线性。"}, {"q": "为什么确定性策略有 <code>2⁷</code> 个而不是 <code>2×7</code> 个？", "o": ["因为策略可以随机化", "因为要考虑所有起始状态", "一个策略要给每个状态各指定一个动作，7 个独立的二选一相乘", "因为有 7 个动作"], "a": 2, "why": "老师用两个状态演示的 a1a1/a1a2/a2a1/a2a2 就是这个道理的最小版本。"}, {"q": "「策略数是指数的」这件事，在 p42 被用来证明什么？", "o": ["策略迭代一定会在有限轮内停：指数大，但是有限的", "策略迭代比枚举快", "最优策略唯一", "值迭代收敛"], "a": 0, "why": "「指数但有限」这五个字，是策略迭代能保证停机的全部依据。"}],
31: [{"q": "无限 horizon 下最优策略「平稳」，靠的是什么直觉？", "o": ["γ < 1", "奖励不随时间变", "无论你在第几步，前面都还剩无穷多步，处境完全一样", "状态数有限"], "a": 2, "why": "所以在 s7 该做什么，第 1 步和第 242 步是同一个答案。p56 会说有限 horizon 就不成立了。"}, {"q": "p31 那三条性质里，哪一条依赖「无限 horizon」这个前提？", "o": ["确定性", "唯一性", "平稳性", "三条都依赖"], "a": 2, "why": "无限 horizon 下任何时刻面前都还剩无穷多步，处境相同；有限 horizon 下「剩 2 步」和「剩 200 步」完全不同。p56 会拆掉它。"}, {"q": "「最优策略可以是确定性的」这条结论的依据是什么？", "o": ["确定性策略更容易存储", "随机策略会破坏马尔可夫性", "随机策略的值是各动作值的加权平均，而平均不超过其中最大的那个", "这是一条无法证明的公理"], "a": 2, "why": "注意这用到了「值是线性可加的期望」。一旦目标不是期望回报（要控风险、要满足约束），随机策略可能严格更好。"}],
32: [{"q": "什么时候穷举所有策略反而可能更划算？", "o": ["γ 很小时", "你有非常多处理器、在乎的是墙钟时间时", "动作只有两个时", "状态很多时"], "a": 1, "why": "策略之间互不依赖，天然可并行。策略迭代的优势是串行算得省。"}],

34: [{"q": "<code>Q^π(s,a)</code> 和 <code>V^π(s)</code> 的差别在哪？", "o": ["Q 不折扣", "Q 只对最优策略有定义", "Q 的第一步动作由你指定，之后才听 π 的", "Q 不需要模型"], "a": 2, "why": "只差第一步。正因为能「先换一个动作试试」，才问得出「改进有没有余地」。"}, {"q": "<code>Q^π(s,a)</code> 的语义是什么？", "o": ["先在 s 做 a（可能不是 π 会选的），之后按 π 走到底", "在 s 永远做 a 的回报", "策略 π 在 s 选 a 的概率", "最优策略在 s 做 a 的回报"], "a": 0, "why": "「先叛变一步，再归队」。这正是「改进」所需要的全部信息。"}, {"q": "为什么第四讲学的是 Q-learning 而不是「V-learning」？", "o": ["V 在大状态空间下存不下", "Q 的方差更小", "从 V 推出动作需要 P 和 R；而从 Q 取动作只要 arg max_a Q(s,a)，不需要模型", "Q 收敛更快"], "a": 2, "why": "这个差别在这一讲无所谓（你有模型），但没有模型时它就是 Q 存在的唯一理由。"}],

{"r": [1, 2], "t": "这一讲要干什么", "one": "<b>已知世界模型</b>的情况下，怎么做出一串好决策。", "pts": ["上一讲：agent 的三个部件——模型、策略、值函数。", "这一讲：给定一个 MDP，怎么做好决策。", "下一讲：<span class='w'>不知道</span>世界怎么运作时怎么做策略评估。", "<b>标题里那半句 <em>Given a Model of the World</em> 是这一讲的全部前提，也是它和后面所有讲的分界线。</b><span class='k'>这一讲你知道 <code>P</code>（世界怎么转）和 <code>R</code>（什么有奖励）</span>，<b>于是你根本不需要和环境交互——闭上眼睛就能把最优策略算出来。</b><span class='w'>从第三讲起这个前提就没了</span>，<b>而那一刻起你碰到的所有困难，追根溯源都是「不知道 P 和 R」。</b>", "<b>所以读这一讲有个很省力的读法：把它当成「上界」来读。</b><span class='k'>这里算出来的东西是你在信息最充分时能做到的最好结果</span>，<b>后面几讲做的全是「在信息不全时怎么逼近它」。</b><span class='w'>比如第三讲的蒙特卡洛，就是在没有 P 的情况下重做这一讲 p17 那件事；第四讲的 Q-learning，是在没有 P 的情况下重做 p46 的值迭代。</span><b>认出这个对应，后面会轻松很多。</b>", "<b>课件自己给的路线是四段：马尔可夫过程 → 马尔可夫奖励过程 → 马尔可夫决策过程 → MDP 的评估与控制。</b><span class='k'>这四段是逐层加东西，而且每一层加的东西非常明确</span>：<b>第一层只有「怎么转」；第二层加「有奖励」；第三层加「你能选」；第四层问「怎么选最好」。</b><span class='w'>每加一层，前一层的工具都还能用</span>——<b>这一点在 p25 会变成整讲的枢纽：固定策略之后，MDP 退回 MRP，于是前面算 MRP 的三招原样可用。</b>", "<b>这一片（p1–p21）对应前两层，所以它里面<span class='w'>一个动作都没有</span>。</b><span class='k'>这不是在拖时间——它是在把「评估」这件事和「决策」彻底分开</span>。<b>评估问的是「这值多少」，决策问的是「该做什么」。</b><span class='w'>这门课后面反复出现的所有算法，几乎都是这两件事的某种交替。</span><b>先把评估这一半弄干净，后面拼起来就不会乱。</b>", "<b>还有一个贯穿这一讲的小习惯值得先立下：每看到一个算法，先问它要什么、给什么。</b><span class='k'>要什么 = 它假设你手里有哪些东西（P？R？能不能和环境交互？）；给什么 = 它输出值函数还是策略，是精确的还是近似的。</span><b>这一讲会出现五个算法（模拟、解析解、动态规划、策略迭代、值迭代），而它们之间的全部差别都能用这两问说清楚。</b><span class='w'>p57 那张对比表就是这两问的答案汇总，但你最好在读到那里之前自己先填一遍。</span>"], "say": "老师开宗明义：<b>今天不讲「学」，只讲「算」</b>——世界怎么动是给定的，问题只是「该怎么走」。", "quote": "Lecture 2: <b>Making Sequences of Good Decisions Given a Model of the World</b> &nbsp;|&nbsp; This Time: Making good decisions given a Markov decision process &nbsp;·&nbsp; Next Time: Policy evaluation when don't have a model of how the world works"},
{"r": [3, 3], "t": "复习：模型 / 策略 / 值函数", "one": "模型＝动态与奖励的数学描述；策略＝状态到动作的映射；值函数＝该策略下的未来回报。", "pts": ["这三个词第一讲已经给过，这一讲每一个都会被拆开写成式子。", "<b>这三个词的定义里，值函数那条最长，而长出来的那半句是关键：<em>when following a particular policy</em>。</b><span class='k'>值函数永远是「某个策略下的」值，没有脱离策略的值</span>。<b>所以 <code>V</code> 上面那个 π 不是装饰，去掉它句子就不完整。</b><span class='w'>唯一的例外是 <code>V*</code>（最优值），而那其实是「所有策略里最好的那个的值」，仍然挂在策略上。</span>", "<b>三者的依赖关系值得画一遍，因为这门课后面所有方法都在这张图上挑位置。</b><br><span class='k'>模型 + 策略 ⇒ 值函数</span>（这一讲就是干这个，p26 的策略评估）；<br><span class='k'>值函数 ⇒ 更好的策略</span>（p35 的策略改进）；<br><b>于是「模型 → 值 → 策略 → 值 → …」转成一个圈，这个圈就是 p33 的策略迭代。</b><span class='w'>而第三讲之后模型没了，那个圈的第一步就得换成「从数据里估」。</span>", "<b>再提醒一处容易混的：模型包含两样东西，动力学和奖励，而它们的难度完全不对称。</b><span class='k'>动力学 <code>P</code> 通常是客观的、可观测的、可学的</span>；<span class='w'>奖励 <code>R</code> 常常是你自己定的，而且定错了后果很严重</span>（<b>第七讲整讲在处理「奖励从哪来」</b>）。<b>这一讲把两者都当作已知，是一种很大方的假设。</b>"], "quote": "<b>Model</b>: Mathematical models of dynamics and reward &nbsp;·&nbsp; <b>Policy</b>: Function mapping agent's states to actions &nbsp;·&nbsp; <b>Value function</b>: future rewards from being in a state and/or action when following a particular policy"},
{"r": [4, 4], "t": "今天的路线", "star": 2, "one": "MP → MRP → MDP → MDP 上的评估与控制。", "pts": ["<b>一次只加一样东西</b>：马尔可夫过程只有状态；加奖励成 MRP；再加动作成 MDP。", "整讲的骨架就是这四步，迷路了就回来看这一页。", "<b>把这四级的差别压成一张清单，整讲就有了骨架——而且这张清单你会用一整个学期。</b><br><b>马尔可夫过程</b> = <code>⟨S, P⟩</code>：<span class='k'>只有「怎么转」</span>。<br><b>MRP</b> = <code>⟨S, P, R, γ⟩</code>：<span class='k'>加上「什么有奖励」</span>，于是「这值多少」有了意义。<br><b>MDP</b> = <code>⟨S, A, P, R, γ⟩</code>：<span class='k'>加上「你能选」</span>，于是 <code>P</code> 从 <code>P(s′|s)</code> 变成 <code>P(s′|s,a)</code>。<br><span class='w'>注意只有最后一步引入了「你」这个角色</span>——<b>前两级里你是个旁观者，第三级起你才是参与者。</b>", "<b>最后一行 <em>Evaluation and Control</em> 这对词，是整门课的坐标轴，务必现在就分清。</b><span class='k'>评估（evaluation）</span>：给定一个策略，它值多少？——<b>这是个计算问题。</b><br><span class='k'>控制（control）</span>：哪个策略最好？——<b>这是个优化问题。</b><br><span class='w'>几乎这门课的每一讲都可以被归进这两格之一</span>：<b>第三讲是无模型的评估，第四讲是无模型的控制，第五讲是带函数逼近的评估和控制。</b><span class='k'>你读任何一个新算法，先问它在哪一格，立刻就知道该拿什么去对比它。</span>", "<b>还有一件事值得先说：这四级之间不只是「越来越复杂」，它们之间有可以互相化归的通道。</b><span class='k'>MDP + 固定策略 = MRP</span>（p25，整讲枢纽）；<span class='k'>MRP + 恒零奖励 = 马尔可夫过程</span>。<b>所以上层的工具永远能退回去用在下层，而下层的结论永远是上层的特例。</b><span class='w'>这正是为什么课件肯花十几页讲没有动作的 MRP</span>——<b>那十几页的东西，在 p26 之后会被原封不动地搬去评估策略。</b>"], "tip": {"t": "为什么这么搭", "v": "老师说这个顺序的好处是：可以先想清楚「<b>你控制不了世界，但世界还在动</b>」是什么情形，再谈 agent 该怎么插手。"}, "quote": "Today: Given a model of the world &nbsp;·&nbsp; Markov Processes &nbsp;·&nbsp; Markov Reward Processes (MRPs) &nbsp;·&nbsp; Markov Decision Processes (MDPs) &nbsp;·&nbsp; <b>Evaluation and Control in MDPs</b>", "tbl": {"head": ["", "组成", "新增了什么", "能问什么问题"], "rows": [["马尔可夫过程", "<code>⟨S, P⟩</code>", "—", "会走到哪里去"], ["MRP", "<code>⟨S, P, R, γ⟩</code>", "<b>奖励</b>", "<span class='k'>这值多少（评估）</span>"], ["MDP", "<code>⟨S, A, P, R, γ⟩</code>", "<b>动作</b>", "<span class='k'>该怎么做（控制）</span>"], ["<b>MDP + 固定策略</b>", "退回 <code>⟨S, P^π, R^π, γ⟩</code>", "<span class='w'>动作被积掉了</span>", "<b>又变回评估 → 见 p25</b>"]]}},
{"r": [5, 5], "t": "MDP 装得下什么", "one": "很多设定其实都是 MDP 的特例。", "pts": ["<b>bandit</b> = 单状态的 MDP。", "<b>最优控制</b>大多是连续状态的 MDP。", "<b>POMDP</b> = 把状态取成历史的 MDP。", "<b>这一页在做一件很重要的事：它告诉你 MDP 这个框架有多宽，宽到几个看起来完全不同的领域都是它的特例。</b><span class='k'>老虎机 = 只有一个状态的 MDP</span>——<b>没有状态就没有「延迟后果」，于是整个难点只剩探索</b>（<span class='w'>第十一讲整讲在讲它</span>）。<span class='k'>最优控制 = 连续状态的 MDP</span>——<b>换了状态空间的形状，框架没变。</b>", "<b>第三条最该琢磨：<em>Partially observable MDPs = MDP where state is history</em>。</b><span class='w'>部分可观测的意思是「你看不到真实状态，只看得到一些观测」</span>。<span class='k'>而这一行说：只要你把「到目前为止的全部历史」当作状态，它就又是个标准 MDP 了。</span><b>这句话在理论上完全正确，在实践上几乎没用</b>——<span class='w'>因为历史的长度随时间增长，状态空间立刻爆炸。</span><b>但它给了你一个思路：真正要做的是找一个「足够的历史摘要」，而不是全部历史。</b><span class='k'>这正是下一页「信息状态 = 历史的充分统计量」那句话的意思。</span>", "<b>所以这一页的真正信息是：MDP 的局限不在表达力上，在计算上。</b><span class='k'>几乎任何序贯决策问题都能写成 MDP</span>，<span class='w'>代价是状态空间可能大到没法算</span>。<b>于是这门课后面所有的「困难」，本质上都是「状态空间太大」的不同表现</b>——<b>第五讲用函数逼近压它，第七讲用演示绕开它，第十一讲研究探索它要花多少样本。</b>"], "tip": {"t": "接上一讲", "v": "第一讲说「把状态取成整段历史，马尔可夫假设总能满足」——这一页就是那句话的兑现：POMDP 并不是 MDP 之外的东西。"}, "quote": "MDPs can model a huge number of interesting problems and settings &nbsp;·&nbsp; <b>Bandits: single state MDP</b> &nbsp;·&nbsp; Optimal control mostly about continuous-state MDPs &nbsp;·&nbsp; <b>Partially observable MDPs = MDP where state is history</b>"},
{"r": [6, 6], "t": "复习：马尔可夫性", "one": "状态是历史的<b>充分统计量</b>。", "eq": "p(s_{t+1} | s_t, a_t) = p(s_{t+1} | h_t, a_t)", "pts": ["给定现在，未来与过去无关。", "<b>把那个等式读准：它说的不是「历史不重要」，而是「历史里有用的部分都已经装进当前状态了」。</b><span class='k'>左边只看 <code>s_t</code>，右边看整段历史 <code>h_t</code>，两者给出同一个分布</span>——<b>所以多看历史一点好处都没有。</b><span class='w'>这是一个关于「状态设计得好不好」的条件，不是关于世界的条件</span>。<b>同一个世界，状态定义得粗糙就不马尔可夫，定义得充分就马尔可夫。</b>", "<b>这一点非常实用，值得记成一条操作：当你的问题「看起来不马尔可夫」时，先别换算法，先改状态。</b><span class='k'>经典例子是只看一帧画面的 Atari</span>——<b>单帧里看不出球在往哪个方向飞，于是不马尔可夫；把连续四帧叠起来当状态，速度信息就有了，马尔可夫性就回来了。</b><span class='w'>第六讲的 DQN 正是这么做的。</span><b>换状态比换算法便宜得多，而且常常更有效。</b>", "<b>「充分统计量」这个词是从统计学借来的，借得很准。</b><span class='k'>统计里的充分统计量是「关于参数，样本能告诉你的全部信息都在它里面」</span>；<b>这里是「关于未来，历史能告诉你的全部信息都在状态里面」。</b><span class='w'>两处都是在说「可以把原始数据扔掉，只留摘要」</span>——<b>而扔掉的前提是摘要真的够用，这需要你自己论证，没人替你检查。</b>"], "quote": "Information state: <b>sufficient statistic of history</b> &nbsp;·&nbsp; State s_t is Markov if and only if: <b>p(s_{t+1}|s_t, a_t) = p(s_{t+1}|h_t, a_t)</b> &nbsp;·&nbsp; Future is independent of past given present"},
{"r": [7, 7], "t": "马尔可夫过程 / 马尔可夫链", "star": 2, "one": "无记忆的随机过程：一串满足马尔可夫性的随机状态。", "pts": ["定义只有两样：状态集 <code>S</code>，转移模型 <code>P</code>（给定 s 下一步是 s′ 的概率）。", "<span class='w'>没有奖励，也没有动作。</span>", "状态有限时 <code>P</code> 就是一个矩阵。", "<b>课件特意加粗了 <em>no rewards, no actions</em>，这不是提醒而是定义的一部分。</b><span class='k'>马尔可夫过程只回答一个问题：从这里出发，会走到哪里去。</span><b>它既不说「好不好」（没有奖励），也不说「能不能换一条路走」（没有动作）。</b><span class='w'>所以这一级上根本没有「最优」这个概念</span>——<b>没有偏好，就无所谓优劣。</b>", "<b>「无记忆」这个说法容易引起一个误会，值得先堵掉：它不是说过程会忘掉一切。</b><span class='k'>转移概率只看当前状态，这是对的</span>；<span class='w'>但「你现在在哪」这件事本身，就是过去一路走过来的结果</span>。<b>所以历史的影响全都压缩在当前状态里，没有消失。</b><span class='k'>说「无记忆」，说的是更新规则无记忆，不是轨迹无记忆。</span>", "<b>把 <code>P</code> 写成矩阵这件事，比它看起来重要，因为它把一个概率问题变成了一个线性代数问题。</b><span class='k'>第 i 行是「从 <code>s_i</code> 出发，去各个状态的概率」，所以每一行加起来等于 1。</span><b>这种矩阵叫随机矩阵。</b><span class='w'>而一旦问题变成线性代数，你就得到了一整套现成的工具</span>——<b>p20 的解析解 <code>(I − γP)⁻¹R</code> 正是这么来的。</b>"], "say": "老师的例子：<b>股市</b>。你投不投钱它都在动，你可以只是旁观着它变。", "quote": "Markov Process or Markov Chain: Memoryless random process &nbsp;·&nbsp; Sequence of random states with Markov property &nbsp;·&nbsp; <b>Note: no rewards, no actions</b> &nbsp;·&nbsp; If finite number (N) of states, can express P as a matrix"},
{"r": [8, 8], "t": "火星车的转移矩阵", "star": 2, "one": "七个状态排成一条线，每一步向左 0.4、向右 0.4、原地 0.2。", "eq": "P(s1|s1)=0.6   P(s2|s1)=0.4\n中间各状态：左 0.4 · 原地 0.2 · 右 0.4\nP(s7|s7)=0.6   P(s6|s7)=0.4", "pts": ["两端只有一侧可走，所以原地概率是 <b>0.6</b> 而不是 0.2。", "这里<span class='w'>还没有动作</span>——马达就是这么转的，不是 agent 选的。", "<b>先把这个例子的结构看清楚，因为它会在这一讲里被反复使用，一直用到 p54。</b><span class='k'>七个状态排成一条线，火星车在上面左右晃</span>：<b>中间的状态往左 0.4、原地 0.2、往右 0.4；两头的状态因为撞墙，原地的概率变成 0.6。</b><span class='w'>注意这里还没有奖励也没有动作</span>——<b>车子不是在「决定」往哪走，它就是随机晃。</b>", "<b>矩阵的形状本身透露了一个重要性质：它是三对角的。</b><span class='k'>每一行只有相邻的两三个位置非零，其余全是 0</span>——<b>因为一步只能走一格。</b><span class='w'>这种「只跟邻居有关」的结构在真实问题里极其常见</span>（网格世界、排队系统、流水线），<b>而它的好处是：<code>P</code> 虽然是 <code>N×N</code>，非零元却只有 <code>O(N)</code> 个，矩阵乘法可以做得很快。</b>", "<b>两头为什么是 0.6 而不是 0.4，值得想一下，因为这里有个通用的建模手法。</b><span class='k'>原本往左 0.4、原地 0.2、往右 0.4</span>；<b>在最左端，「往左」这个动作无处可去，于是那 0.4 的概率被折回了「原地」</b>——<span class='w'>0.2 + 0.4 = 0.6</span>。<b>这叫把越界的概率质量反射回来，是处理边界最省事的办法。</b><span class='k'>另一种常见做法是把边界设成吸收态（进去就出不来），那样两头就是 1.0。</span><b>选哪种取决于你要建模的是「撞墙弹回」还是「掉下悬崖」。</b>"], "say": "课上被追问「哪一维是初始状态」。老师的回答：这页不指定初始状态；要算下一步，就把初始状态写成 one-hot 向量去乘 <code>P</code>。", "quote": "Example: Mars Rover Markov Chain Transition Matrix, P &nbsp;·&nbsp; (7 states; from each interior state: 0.4 left, 0.2 stay, 0.4 right; at the two ends 0.6 stays in place)"},
{"r": [9, 9], "t": "从这个过程里采样", "one": "从 s4 出发，世界替你抽签，抽出一条轨迹。", "eq": "s4, s5, s6, s7, s7, s7, …\ns4, s4, s5, s4, s5, s6, …\ns4, s3, s2, s1, …", "pts": ["同一个起点、同一套动态，跑出来的<b>片段完全不同</b>——因为转移是随机的。", "记住这三条，p14 要拿它们算回报。", "<b>这三条轨迹全都从 <code>s4</code> 出发，而它们走得完全不一样——这一页的全部意义就在这里。</b><span class='k'>同一个起点、同一个过程，采样出来的结果可以天差地别</span>：<b>第一条一路向右冲到头，第二条在原地附近来回磨，第三条一路向左。</b><span class='w'>于是你立刻看到一个问题：单看一条轨迹，你根本不知道「从 s4 出发」到底意味着什么。</span><b>这正是 p16 要引入值函数（取期望）的理由。</b>", "<b>第一条轨迹末尾那串 <code>s7, s7, s7, …</code> 不是打印错误，它在演示边界的性质。</b><span class='k'>到了最右端，有 0.6 的概率留在原地</span>，<b>所以一旦走到 <code>s7</code>，就很容易在那里待上好几步。</b><span class='w'>这个细节在 p14 算回报时会直接影响数字</span>——<b>而且在 p11 给了 <code>s7</code> 一个 +10 的奖励之后，「容易赖在 s7」会变成一件非常值钱的事。</b>", "<b>这一页还顺带定义了一个后面天天用的词：片段（episode）。</b><span class='k'>一个片段就是一次完整的采样轨迹</span>。<b>第三讲的蒙特卡洛方法要求片段必须结束（否则回报算不出来），而时序差分不要求</b>——<span class='w'>这个区别在那一讲是主要矛盾，而它的源头就是这一页「片段可以无限长」。</span>"], "say": "老师强调：agent <b>不能同时在多个状态里</b>。分布是你算出来的，实际发生的只有一条。", "quote": "Example: Sample episodes starting from S4 &nbsp;·&nbsp; s4, s5, s6, s7, s7, s7, ... &nbsp;·&nbsp; s4, s4, s5, s4, s5, s6, ... &nbsp;·&nbsp; s4, s3, s2, s1, ..."},
{"r": [10, 10], "t": "马尔可夫奖励过程（MRP）", "star": 2, "one": "MRP = 马尔可夫链 + 奖励 + 折扣因子。", "eq": "MRP = (S, P, R, γ)\nR(s_t = s) = E[r_t | s_t = s]", "pts": ["<span class='w'>仍然没有动作。</span>状态有限时 <code>R</code> 就是一个向量。", "<b>注意 <code>R</code> 的定义里有个期望：<code>R(s) = E[r_t | s_t = s]</code>。</b><span class='k'>这是说奖励本身可以是随机的，而 <code>R(s)</code> 是它的均值</span>。<b>课件之后一律只用 <code>R(s)</code>，等于把奖励的随机性提前平均掉了。</b><span class='w'>这么做是合法的——因为值函数本身就是期望，奖励的方差不影响 <code>V</code>。</span><b>但它确实藏起了一件事：奖励方差会影响你「估」<code>V</code> 的难度。</b><span class='k'>这一讲不估，直接算，所以无所谓；第三讲开始要估了，它就重新变得要紧。</span>", "<b>这一级多出来的 γ 值得单独点一下：它不是奖励的一部分，而是问题定义的一部分。</b><span class='k'>同一个 <code>⟨S, P, R⟩</code> 配不同的 γ，是两个不同的 MRP，值函数完全不同</span>。<b>所以 γ 不是超参数，它是你对「未来有多重要」的建模声明。</b><span class='w'>下一页会专门讲它，而 p13 那句「片段长度总是有限的话可以用 γ = 1」在实践里比它看起来重要得多。</span>", "<b>「没有动作」这件事到这一级仍然成立，所以这里依然不存在「最优」。</b><span class='k'>有了奖励之后你可以问「这个状态值多少」，但还不能问「我该怎么办」</span>——<b>因为你什么都做不了，只能看着。</b><span class='w'>这个区分在 p22 才会被打破。</span><b>在那之前，这一片所有的内容都属于「评估」这一格，一条控制都没有。</b>"], "quote": "Markov Reward Process is a Markov Chain + rewards &nbsp;·&nbsp; S is a (finite) set of states &nbsp;·&nbsp; P is dynamics/transition model &nbsp;·&nbsp; <b>R is a reward function R(s_t = s) = E[r_t | s_t = s]</b> &nbsp;·&nbsp; Discount factor γ ∈ [0, 1] &nbsp;·&nbsp; <b>Note: no actions</b>"},
{"r": [11, 11], "t": "火星车 MRP", "one": "奖励：<code>s1</code> 给 +1，<code>s7</code> 给 +10，其余全是 0。", "pts": ["和第一讲用的是同一组数字。<b>整讲的算例都建在这三个数上。</b>", "<b>这个奖励设计是故意的，而且设计得很妙：两头都有奖励，但一头是另一头的十倍。</b><span class='k'>于是火星车面临一个真实的权衡</span>——<b><code>s1</code> 的 +1 可能更近，<code>s7</code> 的 +10 更值钱但更远。</b><span class='w'>如果只有一头有奖励，这个例子就什么也演示不了。</span><b>而且因为这一级还没有动作，车子<span class='w'>没法选</span>去哪一头</b>——<span class='k'>它只能随机晃，于是值函数算的是「随机晃的情况下平均能捞到多少」。</span>", "<b>中间五个状态奖励全为 0，这一点在后面会制造一个很有教育意义的现象。</b><span class='k'>它们的值不为 0</span>——<b>因为值是「未来能拿到的」，而不是「现在拿到的」。</b><span class='w'>p16 给出的 <code>V = [1.53 0.37 0.13 0.22 0.85 3.59 15.31]</code> 里，<code>s3</code> 的值 0.13 全部来自未来</span>。<b>这正是值函数这个概念的全部意义：它把「未来」折算成「现在」的一个数。</b>", "<b>顺便留意 <code>s7</code> 的值 15.31 比它的即时奖励 10 还大，这不是算错了。</b><span class='k'>因为到了 <code>s7</code> 有 0.6 的概率留在原地，下一步又能再拿一次 +10</span>。<b>于是「待在 s7」这件事本身在持续产出。</b><span class='w'>这个现象在真实问题里很常见</span>——<b>一个能自我维持的好状态，它的值会远高于单次奖励。</b>"], "say": "有人问「奖励一定只跟当前状态绑定吗」。老师答：MDP 里奖励可以是 s、(s,a) 或 (s,a,s′) 的函数；但现在还在 MRP，<b>没有动作</b>，所以只能挂在状态（或状态对）上。", "quote": "Example: Mars Rover MRP &nbsp;·&nbsp; <b>Reward: +1 in s1, +10 in s7, 0 in all other states</b>"},
{"r": [12, 12], "t": "回报与值函数", "star": 3, "one": "回报是<b>一次</b>的折扣奖励和；值函数是它的<b>期望</b>。", "eq": "G_t = r_t + γ·r_{t+1} + γ²·r_{t+2} + …\nV(s) = E[G_t | s_t = s]", "pts": ["<b>horizon</b>＝一个片段有几步，可以是无穷。", "过程若是确定性的，这两者<span class='k'>完全相同</span>；随机的话就不同了——这正是后面所有算法要处理的东西。", "<b>这一页定义了整门课最重要的两个符号，而它们的区别是后面无数混乱的源头，值得钉死。</b><span class='k'><code>G_t</code> 是一个随机变量</span>——<b>你跑一趟，拿到一个数；再跑一趟，拿到另一个数。</b><span class='k'><code>V(s)</code> 是一个确定的数</span>——<b>它是 <code>G_t</code> 的期望，跑多少趟都不会变。</b><span class='w'>一个是样本，一个是真值。</span>", "<b>这个区别直接决定了第三讲两大方法的分野，现在先埋个扣子。</b><span class='k'>蒙特卡洛的做法是：跑很多趟，把 <code>G</code> 平均起来当 <code>V</code></span>——<b>无偏，但要等片段结束，而且方差大。</b><span class='k'>时序差分的做法是：用 <code>r + γV(s′)</code> 顶替 <code>G</code></span>——<b>不用等结束，方差小，但有偏。</b><span class='w'>两条路的全部差异，都来自「怎么从 G 走到 V」。</span>", "<b>回报这个和式里，γ 的指数是「从现在算起的步数」，不是绝对时刻，这一点容易写错。</b><span class='k'><code>G_t</code> 里的 <code>r_t</code> 系数是 <code>γ⁰ = 1</code>，不管 t 是 0 还是 100</span>。<b>也就是说，「现在」永远是折扣的原点。</b><span class='w'>正因如此，<code>V(s)</code> 才可以只依赖 s 而不依赖时刻</span>——<b>这是无限 horizon 下策略平稳（p31）的技术根源，而 p55–p56 的有限 horizon 会把它打破。</b>"], "tip": {"t": "别混", "v": "<code>G</code> 是你走了一趟拿到的数，<code>V</code> 是无数趟的平均。下一页开始，三条样本轨迹算出来的三个 <code>G</code> 会和 <code>V</code> 差很远。"}, "quote": "Definition of Horizon: Number of time steps in each episode; <b>can be infinite</b> &nbsp;|&nbsp; <b>G_t = r_t + γr_{t+1} + γ²r_{t+2} + γ³r_{t+3} + ...</b> &nbsp;|&nbsp; <b>V(s) = E[G_t | s_t = s]</b>", "tbl": {"head": ["", "<code>G_t</code>（回报）", "<code>V(s)</code>（值函数）"], "rows": [["是什么", "<span class='w'>随机变量</span>", "<span class='k'>确定的数</span>"], ["怎么得到", "跑一趟，加起来", "<b>所有可能轨迹的期望</b>"], ["每次一样吗", "<span class='w'>不一样</span>", "<span class='k'>一样</span>"], ["p14 的例子", "1.25 / 0 / 0.125（三趟三个值）", "<b>1.53 0.37 0.13 0.22 0.85 3.59 15.31</b>"], ["谁用它", "蒙特卡洛（第三讲）", "动态规划（本讲 p21）"]]}},
{"r": [13, 13], "t": "折扣因子 γ", "star": 2, "one": "既有数学上的方便，也确实像人的行为。", "pts": ["<b>数学上</b>：保证回报有界，不至于发散。", "<code>γ=0</code>：只看眼前这一步（短视）。<code>γ=1</code>：未来和现在一样重。", "片段长度总是有限时，<code>γ=1</code> 没问题。", "<b>课件给 γ 列了三种完全不同性质的理由，混在一起容易以为它们是一回事，其实差别很大。</b><br><b>① 数学上的方便</b>：<span class='k'>防止无穷和发散</span>。这是技术理由——如果奖励有界且 <code>γ &lt; 1</code>，回报必然收敛到 <code>r_max/(1−γ)</code> 以内。<br><b>② 描述人的行为</b>：<span class='k'>人确实表现得像在打折扣未来</span>。这是建模理由，属于「这样更像真的」。<br><b>③ 不需要的情形</b>：<span class='w'>片段长度总是有限的话，可以直接用 γ = 1</span>。<b>这是最后一行，也是最实用的一行。</b>", "<b>第三条值得专门强调，因为很多人不假思索地把 γ 设成 0.99，而那常常是错的。</b><span class='k'>γ 小于 1 的唯一硬性理由是「防止无穷和发散」</span>——<b>如果你的任务本来就会在有限步内结束，这个理由就不存在了。</b><span class='w'>此时强行打折扣，等于人为地让算法轻视结尾的奖励</span>，<b>而在很多任务里结尾恰恰是最重要的（比如「最后有没有答对」）。</b><span class='k'>于是 γ 从一个技术参数，变成了一个会扭曲目标的东西。</span>", "<b>两个极端也值得各看一眼，因为它们对应两类真实的做法。</b><span class='k'>γ = 0：只看眼前</span>——<b>此时 MDP 退化成一串互不相干的单步决策，也就是老虎机（p5 说过）。</b><span class='w'>这不是「坏的 γ」，而是「问题本来就没有延迟后果」。</span><span class='k'>γ = 1：未来和现在一样重</span>——<b>这是有限 horizon 任务的正确选择。</b><span class='w'>p27 的检验题会让你亲手算一遍 γ = 0 的情形，届时你会看到它有多极端。</span>", "<b>最后补一条课件没写但很有用的直觉：γ 隐含了一个「有效视野」。</b><span class='k'>折扣权重 <code>γᵏ</code> 衰减到可以忽略的步数，大约是 <code>1/(1−γ)</code></span>——<b>γ = 0.9 大约看 10 步，γ = 0.99 大约看 100 步。</b><span class='w'>所以选 γ 其实是在选「你想让算法考虑多远」</span>，<b>而这个数应该和你问题的真实时间尺度对上。</b><span class='k'>第五讲 p34 那个 <code>1/(1−γ)</code> 的误差放大因子，来源正是这里。</span>"], "say": "有人问「γ 非得是几何衰减吗」。老师答：<b>不是必须</b>，只是这个选择的数学性质特别好，后面证压缩性时就靠它。", "quote": "Mathematically convenient (avoid infinite returns and values) &nbsp;·&nbsp; Humans often act as if there's a discount factor &lt; 1 &nbsp;·&nbsp; γ = 0: Only care about immediate reward &nbsp;·&nbsp; γ = 1: Future reward is as beneficial as immediate reward &nbsp;·&nbsp; <b>If episode lengths are always finite, can use γ = 1</b>", "res": {"tag": "推断", "v": "<b>这一页最后那行 <em>If episode lengths are always finite, can use γ = 1</em>，对你的课题是一条可以直接执行的结论。</b><br><br><span class='k'>你的流水线是 H ≈ 5–10 个节点，跑完必然结束，没有无限 horizon。</span><b>所以 γ = 1 不但合法，而且是正确选择。</b><span class='w'>如果你沿用了 RL 代码库里默认的 0.99，等于在告诉算法「最后一个节点的收益只值 0.9 左右」</span>——<b>而你的终局奖励恰恰全部产生在最后一个节点上。</b><span class='k'>这会系统性地低估整条流水线的价值，而且越靠后的节点被压得越狠。</span><br><br><b>这件事还连着一条更大的好处：γ = 1 把 L05 那个 <code>1/(1−γ)</code> 的放大因子直接拿掉了。</b><span class='w'>注意是「拿掉了那个因子」，不是「没有误差了」</span>——<b>有限 horizon 下该用的是 H 而不是 <code>1/(1−γ)</code>，而 H 只有 5–10。</b><span class='k'>这是你短流水线这个结构优势的又一处体现，和 L07 p30 那条 εT² 是同一个来源。</span><br><br><b>一个必须一并接受的代价</b>：<span class='w'>γ = 1 时 p20 的解析解 <code>(I − γP)⁻¹</code> 可能不存在</span>（<b>p20 的科研格会说清楚什么时候塌</b>）。<b>但对你无所谓——有限 horizon 根本不用那个公式，直接倒着递推 H 步就行</b>（<span class='k'>这正是 p55 的有限 horizon 值迭代</span>）。", "ref": "课件 p13 最后一行 · p20 · p55 · L05 p34 · L07 p30 科研格"}},
{"r": [14, 15], "t": "三条轨迹，三个回报", "star": 2, "one": "同一个起点 s4，四步为限，<code>γ=1/2</code>。", "eq": "s4,s5,s6,s7:  0 + ½·0 + ¼·0 + ⅛·10 = 1.25\ns4,s4,s5,s4:  0 + 0 + 0 + 0      = 0\ns4,s3,s2,s1:  0 + 0 + 0 + ⅛·1   = 0.125", "pts": ["同一个起点，回报能差十倍。<span class='k'>这就是为什么要取期望。</span>", "注意 <code>⅛</code> 是 <code>γ³</code>——奖励在第 4 步拿到，折三次。", "<b>三条轨迹同一个起点，算出来 1.25、0、0.125——这一页就是为了让你被这个差距吓一跳。</b><span class='k'>最大值和最小值之间差了无穷倍（因为有一条是 0）</span>，<b>而它们是同一个状态的同一个过程产生的。</b><span class='w'>所以「跑一趟看看」完全不足以告诉你一个状态值多少</span>——<b>这就是为什么需要 p16 的期望，以及为什么第三讲的蒙特卡洛需要「很多」片段。</b>", "<b>把 1.25 这个数拆开看，能顺便把折扣的机制看明白。</b><span class='k'>轨迹 <code>s4 → s5 → s6 → s7</code> 只在最后一步拿到 +10</span>，<b>而它距离起点有 3 步，所以乘 <code>γ³ = 1/8</code>，得到 1.25。</b><span class='w'>同样是 +10，早一步拿到就值 2.5，晚一步就只值 0.625</span>——<b>γ = 1/2 的折扣非常凶狠，每一步砍一半。</b><span class='k'>课件选这么小的 γ 正是为了让手算容易，真实问题里很少用这么小的。</span>", "<b>第二条轨迹算出 0，这个 0 特别值得盯一眼，因为它展示了一种常见的失败模式。</b><span class='k'>轨迹 <code>s4 → s4 → s5 → s4</code> 在原地附近磨了四步，一分没拿到</span>。<b>它不是「走错了」——随机过程里这完全正常。</b><span class='w'>但如果你只跑了这一条就下结论，你会认为 s4 一文不值</span>，<b>而真值是 0.22。</b><span class='k'>稀疏奖励下这种情况会频繁发生，这正是第七讲蒙特祖玛那个例子的小号版本。</span>", "<b>最后注意一个限定：课件算的是「四步片段」，而回报的定义是无穷和。</b><span class='k'>所以这三个数其实是被截断的回报，不是真正的 <code>G</code></span>。<span class='w'>截断误差有多大？由 <code>γ⁴ = 1/16</code> 控制</span>——<b>γ 这么小的时候，第五步以后的东西几乎不重要，截断是安全的。</b><span class='k'>但如果 γ = 0.99，四步截断会丢掉绝大部分信息。</span><b>这是实现蒙特卡洛时第一个会踩的坑：截断长度必须和 γ 匹配。</b>", "<b>最后提一句这三条轨迹的来历，它解释了为什么偏偏挑这三条。</b><span class='k'>它们正是 p9 列出的那三条采样片段，一条向右、一条原地磨、一条向左</span>——<b>课件是先让你看「走法差别有多大」（p9），再让你看「算出来的数差别有多大」（p14）。</b><span class='w'>这两页是同一个论证的两半</span>，<b>结论在 p16：所以必须取期望。</b><span class='k'>读课件时留意这种「同一个例子连用三四页」的写法——重复出现的例子通常是作者认为最该记住的那个。</span>"], "say": "老师顺带解释了为什么用四步：很多真实场景 horizon 天然有界，比如「顾客跟网站平均就互动两三步」。", "quote": "Sample returns for sample 4-step episodes, γ = 1/2 &nbsp;|&nbsp; s4, s5, s6, s7: 0 + ½·0 + ¼·0 + ⅛·10 = <b>1.25</b> &nbsp;·&nbsp; s4, s4, s5, s4: 0 + ½·0 + ¼·0 + ⅛·0 = <b>0</b> &nbsp;·&nbsp; s4, s3, s2, s1: 0 + ½·0 + ¼·0 + ⅛·1 = <b>0.125</b>"},
{"r": [16, 16], "t": "值函数：把它们平均起来", "star": 3, "one": "对所有可能的轨迹取期望，就得到每个状态的值。", "eq": "V = [1.53  0.37  0.13  0.22  0.85  3.59  15.31]", "pts": ["<b>形状比数值更值得看</b>：从 s3（0.13）往两边都在升高，右边升得快得多——因为 s7 的 +10 压过了 s1 的 +1。", "s4 的值是 0.22，而上一页那条走到 s7 的样本回报是 1.25。<span class='w'>单次回报和期望差得很远，一点都不奇怪。</span>", "<b>把这七个数和地图对一下，整个值函数的形状立刻就有意义了。</b><span class='k'><code>V = [1.53, 0.37, 0.13, 0.22, 0.85, 3.59, 15.31]</code></span>——<b>两头高、中间低，而且右边远高于左边。</b><span class='w'>右高是因为 <code>s7</code> 的奖励是 +10 而 <code>s1</code> 只有 +1</span>；<b>中间低是因为离两头都远，折扣把什么都压没了。</b><span class='k'>最低点在 <code>s3</code>（0.13）而不是正中间的 <code>s4</code>（0.22）</span>——<b>因为 <code>s4</code> 稍微偏向值钱的那一头。</b>", "<b>这一页最该体会的是：这七个数没有任何一个等于某条轨迹的回报。</b><span class='k'>上一页三条轨迹给的是 1.25、0、0.125，而 <code>V(s4) = 0.22</code></span>——<b>它不在那三个数中间的任何一个位置上，它是全部可能轨迹的加权平均。</b><span class='w'>所以期望不是「样本的代表」，而是一个样本可能从来达不到的值</span>。<b>（事实上 <code>V(s4)</code> 的真值 0.22 比三条样本里两条都要大。）</b>", "<b>还有一件事值得先记下，它在 p19 会变成一个方程：这七个数不是互相独立的。</b><span class='k'><code>V(s4)</code> 的值依赖于 <code>V(s3)</code> 和 <code>V(s5)</code>，而后两者又依赖它们的邻居</span>——<b>整张表是一个互相咬合的整体。</b><span class='w'>于是「求值函数」不是算七个独立的数，而是解一个七元方程组。</span><b>p18 到 p20 走的正是这条路。</b>"], "quote": "Value function: expected return from starting in state s &nbsp;·&nbsp; V(s) = E[G_t | s_t = s] &nbsp;|&nbsp; <b>V = [1.53 0.37 0.13 0.22 0.85 3.59 15.31]</b>"},
{"r": [17, 17], "t": "算法一：模拟", "one": "反复跑，把回报平均起来。", "pts": ["精度大致按 <code>1/√N</code> 收敛（N 是跑的次数）。", "<span class='k'>它不需要马尔可夫假设</span>——压根没用到这个结构，只是在求平均。", "<b>这一页最后那行加粗的字，是这一讲给整门课埋的最大一个伏笔：<em>Requires no assumption of Markov structure</em>。</b><span class='k'>模拟求平均这件事，根本不在乎过程是不是马尔可夫的</span>——<b>它只是在估一个期望，而大数定律不要求马尔可夫性。</b><span class='w'>后面两种算法（解析解、动态规划）都重度依赖马尔可夫性</span>，<b>只有这一种不依赖。</b><span class='k'>这个性质在第五讲 p27 会再次出现并被用来论证一件重要的事。</span>", "<b>「集中不等式界定了平均值多快逼近期望」这半句，说的是这条路的代价。</b><span class='k'>误差大致按 <code>1/√n</code> 下降</span>（n 是片段数）——<b>要把误差减半，片段数要翻四倍。</b><span class='w'>这是一条很慢的曲线</span>。<b>而上一页已经让你看到方差有多大（1.25 / 0 / 0.125），</b><span class='k'>方差越大，达到同样精度需要的 n 越多</span>——<b>这正是第三讲要花大力气降方差的原因。</b>", "<b>把这条路的优缺点摆清楚：它是三条里<span class='w'>最笨</span>的，也是<span class='k'>唯一能在不知道 P 的时候用的</span>。</b><b>这一讲里它看起来毫无必要——既然知道 <code>P</code> 和 <code>R</code>，何必去跑模拟？</b><span class='k'>但从第三讲起 <code>P</code> 就没了，那时这条「最笨」的路会变成唯一的路</span>，<b>而它的名字叫蒙特卡洛策略评估。</b><span class='w'>所以这一页不是陪衬，它是下一讲的主角提前出场。</span>"], "tip": {"t": "这条优点是双刃的", "v": "不依赖马尔可夫，意味着模型estimate 得不准时它也还站得住；但世界真是马尔可夫时，它<b>白白浪费了这个结构</b>，算得比下面两种慢。"}, "quote": "Could estimate by simulation &nbsp;·&nbsp; Generate a large number of episodes &nbsp;·&nbsp; Average returns &nbsp;·&nbsp; Concentration inequalities bound how quickly average concentrates to expected value &nbsp;·&nbsp; <b>Requires no assumption of Markov structure</b>", "res": {"tag": "已核", "v": "<b>这一行 <em>Requires no assumption of Markov structure</em> 是 L05 科研格那条论证的出处，值得在这里就认下来。</b><br><br><span class='k'>L05 p27 在批量蒙特卡洛的解析解旁边印着同一句话</span>，而那条科研格用它论证了：<b>把 <code>G = Acc − λ·Cost</code> 拆成两半分别估，不只是方差上的改进——它把一半的工作从「有前提的策略评估」搬进了「无前提的监督回归」。</b><span class='w'>这里是这句话在本门课里的第一次出现，所以它的适用范围在这里就定下了</span>：<b>只要你是在估一个期望，马尔可夫性就不是必需品。</b><br><br><b>对你的直接含义：成本那一半不需要你的状态定义是马尔可夫的。</b><span class='k'>给定保真度配置与输入长度，token 成本近乎确定，你直接对它做回归即可，不必论证「(query 特征, 节点 id, 部分轨迹) 构成马尔可夫状态」</span>。<b>而准确率那一半要走自举（FQE），它就吃马尔可夫假设</b>——<span class='w'>于是这条拆分不只是降方差，它让两半各自需要论证的前提不一样，而且少的那一半更稳。</span><b>这件事值得在 method 一节里单独写一句。</b>", "ref": "课件 p17 原文 · L05 p27 同一句话 · 简报 §4e"}},
{"r": [18, 18], "t": "马尔可夫结构给出的分解", "star": 3, "one": "一个状态的值 = 当下的奖励 + 折扣后的「下一个状态的值」。", "eq": "V(s) = R(s) + γ · Σ_{s′} P(s′|s) · V(s′)", "pts": ["左边是 <code>V</code>，右边也有 <code>V</code>——这不是循环定义，是一组<b>方程</b>。", "整门课后面的算法，几乎都是在用不同办法解这组方程。", "<b>这个方程是整门课的中心，而它凭什么成立，一句话就能说清：因为马尔可夫性让「未来」只取决于「落到哪」。</b><span class='k'>从 <code>s</code> 出发，你先拿到 <code>R(s)</code>，然后以 <code>P(s′|s)</code> 的概率落到某个 <code>s′</code></span>；<b>而一旦落到 <code>s′</code>，之后能拿到的期望回报就是 <code>V(s′)</code>，和你是怎么来的毫无关系。</b><span class='w'>如果没有马尔可夫性，这最后一句就不成立，整个方程就垮了。</span>", "<b>方程的形式值得单独欣赏：它把一个无穷和变成了一个只涉及「一步」的关系。</b><span class='k'>左边 <code>V(s)</code> 装着无限远的未来，右边只出现了即时奖励和一步之后的 <code>V(s′)</code></span>。<b>无穷被折叠进了递归。</b><span class='w'>这正是动态规划能存在的全部理由</span>——<b>你不需要展开无穷项，只需要反复用这一个式子。</b>", "<b>这也是「自举」这个词第一次有了具体形态，虽然课件还没这么叫。</b><span class='k'>用 <code>V(s′)</code> 来定义 <code>V(s)</code>，就是用估计去定义估计</span>。<b>在这一讲里它完全安全，因为你有真实的 <code>P</code>，而且是表格表示。</b><span class='w'>到第五讲 p38，自举会变成致命三件套的第二条腿</span>——<b>不是它本身变坏了，而是另外两个条件（函数逼近、off-policy）凑齐了。</b><span class='k'>认清它在这里有多无害，才能理解它在那里为什么致命。</span>"], "quote": "Markov property yields additional structure &nbsp;·&nbsp; MRP value function satisfies: <b>V(s) = R(s) + γ Σ_{s′∈S} P(s′|s) V(s′)</b> &nbsp;·&nbsp; (Immediate reward + Discounted sum of future rewards)"},
{"r": [19, 19], "t": "写成矩阵", "one": "有限状态下，上一页那组方程就是一个矩阵方程。", "eq": "V = R + γ · P · V", "quote": "For finite state MRP, we can express V(s) using a matrix equation &nbsp;·&nbsp; <b>V = R + γPV</b>", "pts": ["<b>这一页只做了一件事：把 <code>|S|</code> 个标量方程捆成一个向量方程。</b><span class='k'><code>V</code> 和 <code>R</code> 是长度 N 的列向量，<code>P</code> 是 <code>N×N</code> 的转移矩阵</span>，<b>于是 <code>PV</code> 这个矩阵–向量乘积，第 i 个分量正好是 <code>Σ_{s′} P(s′|s_i) V(s′)</code></b>——<span class='w'>也就是上一页那个求和。</span><b>写法变了，内容一个字没变。</b>", "<b>但这个改写的意义不止是省笔墨：它把问题从「概率」搬到了「线性代数」。</b><span class='k'>一旦写成 <code>V = R + γPV</code>，你立刻可以问一堆线性代数的问题</span>——<b>这个方程有解吗？解唯一吗？怎么解最快？</b><span class='w'>而这些问题都有现成的、完整的答案。</span><b>下一页就是直接把 <code>V</code> 解出来。</b>", "<b>顺便留意这个方程的结构：<code>V</code> 在等号两边都出现。</b><span class='k'>这叫不动点方程——你要找的是「代进去之后等于自己」的那个 <code>V</code></span>。<b>不动点有两种求法，而这两种正好对应接下来的 p20 和 p21</b>：<span class='k'>一种是直接解方程（解析解），一种是反复迭代直到不动（动态规划）</span>。<span class='w'>这个「解方程 vs 迭代」的二选一，在 p57 对比值迭代与策略迭代时会再出现一次。</span>", "<b>再补一个实现上的细节：<code>PV</code> 这个乘法的方向很容易搞反。</b><span class='k'><code>P</code> 的第 i 行是「从 <code>s_i</code> 出发去各处的概率」，所以 <code>(PV)_i = Σ_j P(s_j|s_i) V(s_j)</code>，是把 <code>V</code> 按第 i 行的权重加权平均</span>。<b>如果你把 <code>P</code> 存成了「列是出发点」的约定，这里就要用 <code>Pᵀ</code>。</b><span class='w'>这个错误不会报错，只会悄悄给出一个错的值函数</span>——<b>检查办法很简单：<code>P</code> 的每一行加起来应该等于 1。</b>"]},
{"r": [20, 20], "t": "算法二：解析解", "star": 2, "one": "移项、求逆，一步到位。", "eq": "(I − γP) · V = R\nV = (I − γP)^{-1} · R", "pts": ["代价是求一次矩阵逆：<b>N² 到 N³</b> 之间，看用哪种算法。", "只适用于<span class='w'>状态有限</span>的情形。", "<b>推导只有三行移项，但结果值得停一下：值函数有闭式解。</b><span class='k'>不需要迭代、不需要采样、不需要收敛判据——一个矩阵求逆就完事了</span>。<b>这在整门课里是极其罕见的待遇</b>，<span class='w'>而它之所以可能，全靠两个条件：你知道 <code>P</code>，而且状态是有限的表格</span>。<b>这两个条件里任何一个没了，这一页就作废。</b>", "<b>那个逆矩阵凭什么一定存在，课件没证，但理由很干净，值得知道。</b><span class='k'><code>P</code> 是随机矩阵，它的谱半径等于 1</span>（每行和为 1）；<b>于是 <code>γP</code> 的谱半径是 γ。</b><span class='w'>当 <code>γ &lt; 1</code> 时，<code>I − γP</code> 的所有特征值都不等于 0，所以可逆</span>——<b>而且还有个漂亮的展开：<code>(I − γP)⁻¹ = I + γP + γ²P² + …</code>，<span class='k'>这正好就是「把未来一步步加起来」的那个无穷和</span>。</b><b>解析解和定义是同一件事的两种写法。</b>", "<b>γ = 1 时会发生什么，必须单独说，因为它正是上一页 p13 鼓励你用的那个值。</b><span class='w'><code>I − P</code> 一定是奇异的</span>——<b>因为全 1 向量满足 <code>P·1 = 1</code>，所以 <code>(I − P)·1 = 0</code>，矩阵有零特征值。</b><span class='k'>直观地说：γ = 1 且过程永不结束时，值可以是无穷大，当然解不出来。</span><b>但这不意味着 γ = 1 不能用</b>——<span class='w'>它意味着「有限 horizon 时要换一条路」，而那条路是 p55 的倒推。</span>", "<b>最后那句 <code>O(N³)</code> 是这条路的死穴，而且死得很快。</b><span class='k'>七个状态时求逆是瞬间的事；一万个状态时 <code>N³ = 10¹²</code>，已经很勉强；一百万个状态时彻底没戏</span>。<b>而真实问题的状态数动辄上亿。</b><span class='w'>所以这条最优雅的路，恰恰是最没用的一条</span>——<b>它的价值在于告诉你「理论上答案长什么样」，而不是拿来真算。</b>"], "say": "课上有人问「这个矩阵会不会不可逆」。老师当场没敢打包票，过了一段回来给了答案：<b>P 是随机矩阵，特征值都 ≤1，所以只要 γ&lt;1，<code>I − γP</code> 一定可逆</b>。", "quote": "V = R + γPV &nbsp;·&nbsp; V − γPV = R &nbsp;·&nbsp; (I − γP)V = R &nbsp;·&nbsp; <b>V = (I − γP)⁻¹ R</b> &nbsp;·&nbsp; <b>Solving directly requires taking a matrix inverse ~ O(N³)</b>", "tbl": {"head": ["γ", "<code>I − γP</code> 可逆吗", "为什么", "该怎么办"], "rows": [["<code>γ &lt; 1</code>", "<span class='k'>一定可逆</span>", "γP 的谱半径 = γ &lt; 1", "<b>直接用 <code>(I − γP)⁻¹R</code></b>"], ["<code>γ = 1</code>，过程不结束", "<span class='w'>一定奇异</span>", "<code>P·1 = 1</code> ⇒ <code>(I − P)·1 = 0</code>", "<span class='w'>值可能无穷，问题本身没良定义</span>"], ["<code>γ = 1</code>，有限 horizon", "<b>不需要它</b>", "根本没有无穷和", "<span class='k'>倒着递推 H 步（p55）</span>"]]}, "res": {"tag": "推断", "v": "<b>这一页的 <code>O(N³)</code> 对绝大多数人是死穴，对你可能不是——这值得算一下。</b><br><br><span class='k'>你的状态是 (节点 id, 已选配置前缀)，而节点只有 H ≈ 5–10 个、每节点 k ≈ 3 档</span>。<b>如果状态只到「第 h 个节点 + 前面选了什么」这一层，状态数大致是 <code>Σ_h kʰ</code>，k=3、H=7 时不过三千出头。</b><span class='w'><code>N³ ≈ 3×10¹⁰</code> 偏大，但如果你把状态压成「节点 id + 一个低维摘要」，N 会掉到几百，求逆是毫秒级的事。</span><br><br><b>这条路的真正价值不在于快，在于它是<span class='k'>精确</span>的。</b><span class='w'>FQE 给你的是一个可能发散的近似（L05 p38），而解析解给你的是真值——前提是你肯接受一个表格化的状态。</span><b>于是你有了一个很实际的选择：在一个粗粒度的状态表示上精确求解，拿它当 FQE 的交叉校验。</b><span class='k'>两者差得远，说明要么状态压得太粗，要么 FQE 在跑飞——无论哪种，你都学到了东西。</span><br><br><b>注意前提：这一切要求你知道 <code>P</code>。</b><span class='w'>你近似知道</span>——给定配置，流水线怎么走基本确定，<span class='k'>随机性主要来自 LLM 输出本身，而那可以从日志里频率估计</span>。<b>这是你比标准 off-policy 设定有利的一点，别浪费掉。</b>", "ref": "课件 p20（O(N³)）· L05 p38 · 简报 §4d"}},
{"r": [21, 21], "t": "算法三：动态规划", "star": 3, "one": "从 <code>V₀=0</code> 出发，反复用上一轮的 V 算这一轮的 V。", "eq": "V_k(s) = R(s) + γ · Σ_{s′} P(s′|s) · V_{k-1}(s′)", "pts": ["每轮 <code>O(|S|²)</code>，比求逆便宜。", "停在哪：<code>‖V_k − V_{k-1}‖ &lt; ε</code>。", "初始化成什么都行——只要跑到收敛。", "<b>第三条路的思路是：既然 <code>V = R + γPV</code> 是个不动点方程，那就反复代入直到不动。</b><span class='k'>从 <code>V_0 = 0</code> 开始，每轮把右边算一遍当作新的左边</span>。<b>注意下标：右边用的是 <code>V_{k−1}</code>，左边写的是 <code>V_k</code></b>——<span class='w'>整轮用的都是上一轮的值，而不是边算边更新</span>。<b>这叫同步更新，它让每一轮的结果与遍历顺序无关。</b>", "<b><code>V_k</code> 有一个很实在的含义，知道了之后这个算法就不再神秘。</b><span class='k'><code>V_k(s)</code> 恰好是「只活 k 步」时从 s 出发的期望回报</span>。<b><code>V_0 = 0</code> 是「活 0 步，什么也拿不到」；<code>V_1 = R</code> 是「只拿即时奖励」；<code>V_2</code> 把一步之后也算上……</b><span class='w'>于是迭代 k 轮 = 把视野推远 k 步</span>。<b>而因为 <code>γᵏ</code> 在衰减，远处的贡献越来越小，所以它会收敛。</b><span class='k'>这个解释在 p55 的有限 horizon 值迭代里会变成字面意义上的「剩几步」。</span>", "<b>代价对比是这一页的要点：每轮 <code>O(N²)</code>，而解析解是一次性的 <code>O(N³)</code>。</b><span class='k'>所以迭代 N 轮才和解析解打平</span>，<b>而实践中通常远不需要 N 轮——几十轮就够准了。</b><span class='w'>这就是动态规划在状态多时胜过解析解的理由</span>：<b>它用「要多少精度花多少钱」换掉了「一次付清」。</b><span class='k'>另外 <code>O(N²)</code> 还能再降</span>——<b>像火星车这样的三对角 <code>P</code>，每行只有三个非零元，一轮其实是 <code>O(N)</code>。</b>", "<b>把这一片的三条路并排放一次，这张对比你会用一整个学期。</b><span class='k'>模拟：最慢、最笨，但不需要 <code>P</code>，也不需要马尔可夫性</span>；<span class='k'>解析解：最优雅、一步到位，但要 <code>O(N³)</code> 且要 <code>γ &lt; 1</code></span>；<span class='k'>动态规划：折中，要 <code>P</code> 但按需付费</span>。<b>第三讲丢掉 <code>P</code> 之后，后两条全废，只剩第一条</b>——<span class='w'>而那一讲的全部工作，就是想办法把第三条路的「自举」思想，在没有 <code>P</code> 的情况下重新造出来。</span><b>造出来的东西叫时序差分。</b>"], "tip": {"t": "三种算法的分工", "v": "<b>模拟</b>不需要模型结构但慢；<b>解析解</b>一步到位但要求逆、要有限状态；<b>动态规划</b>每轮便宜，而且加上动作之后还能继续用——后面全靠它。"}, "quote": "Dynamic programming &nbsp;·&nbsp; Initialize V_0(s) = 0 for all s &nbsp;·&nbsp; For k = 1 until convergence: For all s in S: <b>V_k(s) = R(s) + γ Σ_{s′} P(s′|s) V_{k−1}(s′)</b> &nbsp;·&nbsp; <b>Computational complexity: O(|S|²) for each iteration</b>", "tbl": {"head": ["算法", "代价", "要 P 吗", "要马尔可夫吗", "γ=1 能用吗", "第三讲还能用吗"], "rows": [["① 模拟求平均", "<span class='w'>慢（误差 ~1/√n）</span>", "<span class='k'>不要</span>", "<span class='k'>不要</span>", "<span class='k'>能（片段有限时）</span>", "<b>能 → 蒙特卡洛</b>"], ["② 解析解", "<code>O(N³)</code> 一次", "<span class='w'>要</span>", "<span class='w'>要</span>", "<span class='w'>不能（奇异）</span>", "<span class='w'>不能</span>"], ["③ 动态规划", "<code>O(N²)</code> 每轮", "<span class='w'>要</span>", "<span class='w'>要</span>", "<span class='w'>不能（不收敛）</span>", "<span class='k'>思想能 → 时序差分</span>"]]}},
{"r": [22, 22], "t": "马尔可夫决策过程（MDP）", "star": 3, "one": "MDP = MRP + 动作。", "eq": "MDP = (S, A, P, R, γ)\nP(s_{t+1}=s′ | s_t=s, a_t=a)\nR(s_t=s, a_t=a) = E[r_t | s_t=s, a_t=a]", "pts": ["转移模型现在<b>每个动作各有一份</b>。", "奖励可以定义成 s、(s,a) 或 (s,a,s′) 的函数；这门课<b>多数时候用 (s,a)</b>。", "<b>和 MRP 比，变的只有一处：<code>P</code> 和 <code>R</code> 都多吃了一个参数 <code>a</code>。</b><span class='k'>从 <code>P(s′|s)</code> 变成 <code>P(s′|s,a)</code>，从 <code>R(s)</code> 变成 <code>R(s,a)</code></span>。<b>就这一个改动，让「你」第一次成为这个系统里的角色</b>——<span class='w'>在 MRP 里世界自己往前滚，你只能看；在 MDP 里世界等你出手。</span><b>整门课剩下的全部内容，都建立在这一个参数上。</b>", "<b>课件那个脚注值得认真读一遍，因为奖励的三种写法在不同教材里混用，不看清会算错。</b><span class='k'>① <code>R(s)</code>：只看你在哪</span>（MRP 和火星车早期用的）；<span class='k'>② <code>R(s,a)</code>：看你在哪、做了什么</span>（<b>本课默认</b>）；<span class='k'>③ <code>R(s,a,s′)</code>：还要看落到了哪</span>。<b>三者的表达力是递增的，而且后者总能化归成前者</b>——<span class='w'>比如 <code>R(s,a) = Σ_{s′} P(s′|s,a) R(s,a,s′)</code>。</span><b>所以选哪种是方便问题，不是表达力问题。</b>", "<b>注意 <code>R(s,a)</code> 的定义里仍然有期望，和 p10 一样。</b><span class='k'>它是「在 s 做 a 能拿到的平均奖励」</span>，<b>所以单次执行拿到的 <code>r_t</code> 可能和它差很远。</b><span class='w'>这一讲因为直接算不估计，所以随机性被提前平均掉了</span>；<b>但从第三讲起你要从样本里估它，那时奖励的方差会直接决定你需要多少数据。</b>", "<b>最后把五元组 <code>(S, A, P, R, γ)</code> 当成一张检查清单记住，它比看起来有用。</b><span class='k'>你以后碰到任何一个序贯决策问题，第一件事就是逐项把它填出来</span>：<b>状态是什么？动作是什么？转移怎么写？奖励怎么定？γ 取多少？</b><span class='w'>这五个问题里，前两个决定了问题的规模，后三个决定了问题的性质</span>。<b>填不出来，说明你还没想清楚自己要解什么——这比选错算法严重得多。</b>"], "say": "有人问「为什么转移要是随机的，我都指定动作了」。老师答：<b>因为模型不够好</b>——机器人在地毯上有时卡住、开车有时堵车。你可以把更多变量塞进状态让它变确定，也可以就用随机性把这份不确定性兜住。", "quote": "Markov Decision Process is Markov Reward Process + actions &nbsp;·&nbsp; P specifies P(s_{t+1}=s′ | s_t=s, <b>a_t=a</b>) &nbsp;·&nbsp; R(s_t=s, <b>a_t=a</b>) = E[r_t | s_t=s, a_t=a] &nbsp;·&nbsp; MDP is a tuple <b>(S, A, P, R, γ)</b> &nbsp;|&nbsp; footnote: Reward is sometimes defined as a function of the current state, or as a function of the (state, action, next state) tuple. <b>Most frequently in this class, we will assume reward is a function of state and action</b>"},
{"r": [23, 23], "t": "火星车 MDP：两个确定性动作", "star": 2, "one": "<code>a1</code> 往左，<code>a2</code> 往右，都是<b>确定</b>的。", "eq": "a1：能左就左，到 s1 就停在 s1\na2：能右就右，到 s7 就停在 s7", "pts": ["两个转移矩阵都只有 0 和 1——这是为了后面手算方便，不是一般情形。", "<span class='w'>注意 p28 会临时换成随机动态</span>（s6 各 0.5），别把两页的数字混用。", "<b>这一页把 p8 那个随机晃的火星车改造成了可控的，而改造方式很干脆：两个动作都是确定性的。</b><span class='k'><code>a1</code> 往左走一格，<code>a2</code> 往右走一格，到头就原地不动</span>——<b>两个转移矩阵里全是 0 和 1，没有中间值。</b><span class='w'>这和 p8 那个 0.4/0.2/0.4 的随机矩阵形成鲜明对比</span>：<b>p8 的车子没法选，这一页的车子完全说了算。</b>", "<b>为什么课件要把随机性全部去掉，这个选择是有教学意图的。</b><span class='k'>确定性转移让你能在脑子里手算</span>——<b>往右走到底就是 <code>s7</code>，不用算概率。</b><span class='w'>于是 p27、p28、p30 那几道检验题才有可能当堂做出来。</span><b>但要记住这是简化：真实 MDP 的 <code>P</code> 通常是随机的，</b><span class='k'>而随机性恰恰是值函数这个概念存在的理由（p9–p16 演示过）</span>。<b>p28 的练习会把随机性加回来一点，让你体会差别。</b>", "<b>顺便留意一个细节：两个矩阵都是在边界「撞墙原地」而不是「越界」。</b><span class='k'><code>a1</code> 在最左端 <code>s1</code> 是 <code>P(s1|s1,a1) = 1</code></span>，<b>也就是你可以在那儿一直往左撞墙。</b><span class='w'>这个设定会在 p27 产生一个有趣的后果</span>：<b>策略「永远往左」会把车子推到 <code>s1</code> 然后永远留在那里，于是每步都稳拿 +1。</b><span class='k'>这是个次优但不坏的策略——真正的最优是去右边吃 +10。</span>"], "quote": "Example: Mars Rover MDP &nbsp;·&nbsp; <b>2 deterministic actions</b> &nbsp;·&nbsp; P(s′|s, a1) = (shift left, the leftmost state stays) &nbsp;·&nbsp; P(s′|s, a2) = (shift right, the rightmost state stays)"},
{"r": [24, 24], "t": "MDP 的策略", "one": "策略规定每个状态该做什么动作。", "eq": "π(a|s) = P(a_t = a | s_t = s)", "pts": ["可以是确定性的，也可以是随机的；为了一般性写成条件分布。", "这门课大部分时候用<b>确定性策略</b>，到策略搜索那几讲才大量用随机策略。", "<b>策略被定义成一个条件分布，而不是一个函数，这个选择值得想一下为什么。</b><span class='k'>写成 <code>π(a|s)</code> 就同时装下了确定性和随机性两种情形</span>——<b>确定性策略只是「在某个动作上放概率 1」的特例。</b><span class='w'>用更一般的形式当默认，可以让后面的公式只写一遍</span>（<b>比如 p25 的那两个求和</b>）。<span class='k'>这是数学写作的常见手法：选一个能覆盖全部情形的表示，哪怕你主要用的是特例。</span>", "<b>但要立刻记住 p31 的那个结论，否则你会高估随机策略的地位：<span class='w'>无限 horizon 的 MDP，最优策略一定可以是确定性的</span>。</b><b>也就是说，随机性在这里<span class='w'>买不到任何好处</span>。</b><span class='k'>这和你在别处见到的直觉可能冲突</span>——<b>在博弈里随机化是必要的（否则对手能预判你），在探索时随机化是必要的（否则你不会尝试新东西）。</b><span class='w'>但在「已知模型、单方决策、只求期望回报」这个设定里，随机化纯属多余。</span><b>把这三个前提记住，你就知道什么时候随机策略才真的需要。</b>", "<b>还有一个限定藏在符号里：<code>π(a|s)</code> 只依赖 <code>s</code>，不依赖时刻 t。</b><span class='k'>这叫平稳策略</span>。<b>它看起来理所当然，其实是个假设</b>——<span class='w'>完全可以想象一个「第一步这么做、第二步那么做」的策略</span>。<b>p31 会告诉你无限 horizon 下不需要这种策略，</b><span class='k'>而 p56 会告诉你有限 horizon 下你<b>必须</b>用这种策略</span>。<b>所以这个符号里省掉的那个 t，后面会被专门请回来。</b>"], "quote": "Policy specifies what action to take in each state &nbsp;·&nbsp; Can be deterministic or stochastic &nbsp;·&nbsp; For generality, consider as a conditional distribution &nbsp;·&nbsp; <b>Policy: π(a|s) = P(a_t = a | s_t = s)</b>"},
{"r": [25, 25], "t": "MDP + 策略 = MRP", "star": 3, "one": "把策略定死，动作这一维就被积掉了，剩下的就是一个 MRP。", "eq": "R^π(s) = Σ_a π(a|s) · R(s,a)\nP^π(s′|s) = Σ_a π(a|s) · P(s′|s,a)", "pts": ["<span class='k'>这一页是整讲的枢纽。</span>它意味着：评估一个策略的值，<b>不需要新工具</b>——前面算 MRP 的三种办法原样拿来用。", "<b>这一页做的事用一句话说：把动作这一维「积掉」。</b><span class='k'>原来 <code>P(s′|s,a)</code> 有三个下标，你不知道该用哪个 a；现在策略告诉你每个 a 的概率，于是按 <code>π(a|s)</code> 加权平均，a 就消失了</span>。<b>剩下的 <code>P^π(s′|s)</code> 只有两个下标——这正是 MRP 的形状。</b><span class='w'>奖励同理。</span>", "<b>为什么说它是整讲的枢纽：因为它让 p17–p21 那三条路一次性全部复活。</b><span class='k'>你想评估一个策略？把它塌成 MRP，然后模拟、或解析解、或动态规划，三选一</span>。<b>不需要任何新工具。</b><span class='w'>课件自己的原话就是 <em>we can use same techniques</em></span>——<b>这不是一句客套，它是在宣布前面 11 页的投资现在开始回本。</b>", "<b>这个化归还有一个更深的含义，值得专门点出来：它把「评估」和「控制」彻底切开了。</b><span class='k'>评估一个固定策略，是个 MRP 问题，有闭式解，难度完全可控</span>；<span class='w'>而控制（找最好的策略）之所以难，难的不是评估，是「策略有指数多个」</span>（<b>p30 会给出那个数</b>）。<b>于是整个 MDP 控制问题的结构变成了：在一个指数大的集合里搜，而集合里每一个元素的评估都很便宜。</b><span class='k'>p33 的策略迭代正是利用了这个结构。</span>", "<b>最后留意一个容易忽略的前提：这个塌缩要求策略是平稳的。</b><span class='k'>如果 <code>π</code> 随时间变，<code>P^π</code> 也会随时间变，那就不是一个标准的 MRP 了</span>（<b>它是个时变的马尔可夫链</b>）。<span class='w'>这一点在 p56 的有限 horizon 情形会变得要紧</span>——<b>那时最优策略不平稳，于是这个干净的塌缩要做一点修改：每个时刻一个 MRP。</b>"], "quote": "<b>MDP + π(a|s) = Markov Reward Process</b> &nbsp;·&nbsp; Precisely, it is the MRP (S, R^π, P^π, γ), where &nbsp;·&nbsp; R^π(s) = Σ_{a∈A} π(a|s) R(s,a) &nbsp;·&nbsp; P^π(s′|s) = Σ_{a∈A} π(a|s) P(s′|s,a) &nbsp;|&nbsp; <b>Implies we can use same techniques to evaluate the value of a policy for a MDP as we could to compute the value of a MRP</b>", "res": {"tag": "推断", "v": "<b>这一页给了你课题里最常做的那件事一个准确的名分：固定一套配置去评估它，就是把 MDP 塌成 MRP。</b><br><br><span class='k'>你的「策略」是「每个节点选哪一档保真度」。</span><b>一旦这套配置定死，整条流水线就不再有决策，它退化成一个「输入进来 → 按固定流程走 → 出一个 (Acc, Cost)」的随机过程</b>——<span class='w'>也就是一个 MRP</span>。<b>而 MRP 的值有三条现成的算法（p17 / p20 / p21），其中第一条连马尔可夫假设都不要。</b><br><br><b>这解释了一件你可能已经凭经验知道、但没想清楚为什么的事：评估一个已知配置很容易，难的是比较所有配置。</b><span class='k'>难不在单次评估，难在候选有 <code>k^H</code> 个</span>（<b>见 p30 的科研格</b>）。<span class='w'>认清这一点能帮你把力气花对地方</span>——<b>别去优化「怎么把单个配置评得更准」，去优化「怎么少评几个配置」。</b><br><br><b>还有一个直接可用的推论：你的 off-policy 困难，全部来自「策略不固定」这件事。</b><span class='k'>如果你只关心日志里跑过的那些配置，那根本没有 off-policy 问题，直接按 MRP 算就行</span>。<span class='w'>L05 那一整套致命三件套的顾虑，是在你要评估「没跑过的配置」时才出现的。</span><b>所以「哪些配置跑过、哪些没跑过」这条界线，比任何算法选择都更该先画清楚。</b>", "ref": "课件 p25 原文 · 本讲 p17 p20 p21 p30 · L05 p38 · 简报 §4d"}},
{"r": [26, 26], "t": "策略评估的迭代算法", "one": "和 MRP 的迭代算法一模一样，只是奖励和转移都按策略选好的动作去查表。", "eq": "V^π_k(s) = r(s, π(s)) + γ · Σ_{s′} p(s′|s, π(s)) · V^π_{k-1}(s′)", "pts": ["这叫<b>给定策略的贝尔曼备份</b>（Bellman backup）。", "<b>把这个式子和 p21 并排放，你会发现它们一模一样，只是把 <code>R(s)</code> 换成了 <code>r(s, π(s))</code>、<code>P(s′|s)</code> 换成了 <code>p(s′|s, π(s))</code>。</b><span class='k'>这正是 p25 承诺的那件事在兑现</span>——<b>策略把动作填进去之后，算法原样复用。</b><span class='w'>所以这一页严格来说没有新内容</span>，<b>它的价值在于让你亲眼看到「同一个算法」。</b>", "<b>课件给这个操作起了个名字，而这个名字后面会反复出现：<em>Bellman backup</em>，贝尔曼备份。</b><span class='k'>「备份」的意思是把未来的值往回搬一步</span>——<b><code>V_{k−1}(s′)</code> 是未来，经过一次备份它贡献进了 <code>V_k(s)</code>。</b><span class='w'>注意这里的备份是「针对某个特定策略的」</span>，<b>它只看 <code>π(s)</code> 那一个动作，不做任何比较。</b><span class='k'>p45 会出现另一个版本：对所有动作取 max。</span><b>两个备份算子的差别，就是评估和控制的全部差别。</b>", "<b>这里值得先把两个备份摆在一起对比一次，因为这一讲后半全靠这个区分。</b><br><b>策略备份</b>（本页）：<code>V(s) ← r(s,π(s)) + γΣ p(s′|s,π(s)) V(s′)</code>，<span class='k'>照着策略走，不做选择</span>。<br><b>最优备份</b>（p45）：<code>V(s) ← max_a [ R(s,a) + γΣ P(s′|s,a) V(s′) ]</code>，<span class='k'>每一步都挑最好的动作</span>。<br><span class='w'>前者收敛到 <code>V^π</code>（这个策略值多少），后者收敛到 <code>V*</code>（最好能值多少）。</span><b>一个 max 的有无，分出了策略迭代和值迭代两条路。</b>"], "quote": "Initialize V_0(s) = 0 for all s &nbsp;·&nbsp; For k = 1 until convergence: For all s in S: <b>V_k(s) = r(s, π(s)) + γ Σ_{s′∈S} p(s′|s, π(s)) V_{k−1}(s′)</b> &nbsp;·&nbsp; <b>This is a Bellman backup for a particular policy</b>", "tbl": {"head": ["", "策略备份（p26）", "最优备份（p45）"], "rows": [["式子里有 max 吗", "<span class='w'>没有</span>", "<span class='k'>有</span>"], ["用哪个动作", "<code>π(s)</code> 指定的那一个", "<b>让右边最大的那一个</b>"], ["收敛到", "<code>V^π</code>", "<b><code>V*</code></b>"], ["回答的是", "<span class='k'>这个策略值多少（评估）</span>", "<span class='k'>最好能值多少（控制）</span>"], ["用在哪个算法里", "策略迭代的内循环", "<b>值迭代</b>"]]}},
{"r": [27, 27], "t": "检验题：γ=0 时这个策略值多少", "star": 2, "one": "策略是「处处做 <code>a1</code>」，<code>γ=0</code>。", "eq": "V^π = [1  0  0  0  0  0  10]", "pts": ["<code>γ=0</code> 把整个求和项乘没了，只剩当下这一步的奖励。", "<b>这道题的答案之所以是 <code>[1 0 0 0 0 0 10]</code>，全在于 γ = 0 这个设定，它把整个问题砍成了一步。</b><span class='k'>γ = 0 时，<code>V(s) = r(s,π(s)) + 0·(未来) = r(s,π(s))</code></span>——<b>值函数退化成即时奖励，和转移、和策略的长期后果统统无关。</b><span class='w'>于是只有 <code>s1</code>（+1）和 <code>s7</code>（+10）非零，其余全是 0。</span>", "<b>这道题的教学价值在于它让你看到 γ 不是个小参数，它能改变问题的种类。</b><span class='k'>γ = 0 的 MDP 根本不是序贯决策问题</span>——<b>它是 <code>|S|</code> 个互不相干的单步选择，也就是 p5 说的老虎机。</b><span class='w'>「延迟后果」这整个维度消失了</span>。<b>所以当你看到某人把 γ 设得很小时，要意识到他其实在说「我认为这个问题的长期结构不重要」</b>——<span class='k'>那是个很强的断言，应该被论证而不是被默认。</span>", "<b>顺便把这个策略本身看一眼：<code>π(s) = a1</code>，也就是「永远往左」。</b><span class='k'>在 γ = 0 下它的值是 <code>[1 0 0 0 0 0 10]</code></span>，<b>但如果 γ 大一点，这个策略的值会完全不同</b>——<span class='w'>因为往左走最终会撞到 <code>s1</code> 然后每步稳拿 +1</span>，<b>于是中间那些 0 会被未来的 +1 流逐渐填起来。</b><span class='k'>而最优策略显然是往右去吃 +10。</span><b>γ = 0 把这两个策略的差别彻底抹平了，这正是它危险的地方。</b>"], "say": "老师说这题<b>故意是个陷阱</b>：她没给转移模型。而答案根本不需要转移模型——γ=0 的时候它压根用不上。", "quote": "Reward: for all actions, +1 in state s1, +10 in state s7, 0 otherwise &nbsp;·&nbsp; Let π(s) = a1 ∀s. <b>γ = 0.</b> What is the value of this policy? &nbsp;·&nbsp; <b>V^π = [1 0 0 0 0 0 10]</b>"},
{"r": [28, 28], "t": "练习：做一次备份", "star": 3, "one": "这一页把动态换成随机的，让你亲手算一格。", "eq": "已知：p(s6|s6,a1)=0.5, p(s7|s6,a1)=0.5\nV_k = [1 0 0 0 0 0 10],  γ = 0.5\n\nV_{k+1}(s6) = 0 + 0.5·0.5·0 + 0.5·0.5·10 = 2.5", "pts": ["s6 原本的值是 0，一次备份之后变成 <b>2.5</b>。", "<b>这道练习值得自己动手算一遍，因为它是整讲唯一一次把备份拆到最细。</b><span class='k'>三项分别是：即时奖励 <code>r(s6,a1) = 0</code>；以 0.5 的概率留在 <code>s6</code>，贡献 <code>γ·0.5·V_k(s6) = 0.5·0.5·0 = 0</code>；以 0.5 的概率去 <code>s7</code>，贡献 <code>γ·0.5·V_k(s7) = 0.5·0.5·10 = 2.5</code></span>。<b>加起来 2.5。</b>", "<b>注意这里的转移变随机了——<code>p(s6|s6,a1) = 0.5</code>、<code>p(s7|s6,a1) = 0.5</code>。</b><span class='w'>这和 p23 那两个确定性矩阵不一致</span>，<b>是课件为了让练习更有代表性而临时改的设定。</b><span class='k'>随机转移下，备份里的那个求和才真的要算多项</span>；<b>确定性转移时求和只剩一项，看不出结构。</b><span class='w'>做题时别被这个不一致绊住，按题面给的动力学算就对了。</span>", "<b>从这个数字里能读出备份的工作方式：值是从有奖励的地方往外「渗」的。</b><span class='k'>这一轮之前 <code>V(s6) = 0</code>，这一轮之后变成 2.5</span>——<b>而 <code>s6</code> 自己一分奖励都没有，这 2.5 全部来自邻居 <code>s7</code> 的 10。</b><span class='w'>再迭代一轮，<code>s5</code> 也会从 <code>s6</code> 这里分到一点</span>。<b>于是奖励像墨水一样，一轮扩散一格。</b><span class='k'>这正是 p21 说的「迭代 k 轮 = 视野推远 k 步」的具象版本，也解释了为什么稀疏奖励的问题需要很多轮才能把信号传到起点。</b>"], "tip": {"t": "这题真正想给你看的", "v": "<b>信息在往回流。</b>第一次备份只把即时奖励铺开，此后每一轮，s7 那个 +10 就往左渗一格。「我现在没奖励，但再走几步可能够得着」——迭代就是在把这句话算出来。"}, "quote": "Dynamics: p(s6|s6, a1) = 0.5, p(s7|s6, a1) = 0.5, ... &nbsp;·&nbsp; assume V_k = [1 0 0 0 0 0 10], k = 1, γ = 0.5 &nbsp;|&nbsp; V_{k+1}(s6) = r(s6,a1) + γ·0.5·V_k(s6) + γ·0.5·V_k(s7) &nbsp;·&nbsp; = 0 + 0.5·0.5·0 + 0.5·0.5·10 &nbsp;·&nbsp; <b>= 2.5</b>"},
{"r": [29, 29], "t": "MDP 控制", "star": 2, "one": "不再是评估某个策略，而是<b>找出最好的那个</b>。", "eq": "π*(s) = arg max_π V^π(s)", "pts": ["<span class='k'>最优值函数是唯一的。</span>", "无限 horizon 的有限状态 MDP，最优策略一定<b>存在确定性的一个</b>。", "<b>这一页第一次出现「控制」，而它的定义里藏着一个不平凡的断言，值得挑明。</b><span class='k'><code>π*(s) = arg max_π V^π(s)</code> 这个写法默认了「存在一个策略，它在<b>每一个</b>状态上都同时最优」</span>。<b>这件事一点都不显然</b>——<span class='w'>完全可以想象策略 A 在 <code>s1</code> 更好、策略 B 在 <code>s2</code> 更好，谁也压不倒谁。</span><b>MDP 的一条基本定理保证了这种情况不会发生，而这正是整套理论能成立的地基。</b>", "<b>「最优值函数唯一」和「最优策略未必唯一」这对说法要分清，它们一点都不矛盾。</b><span class='k'><code>V*</code> 是一个数值表，它唯一</span>；<span class='w'>而能达到这个表的策略可以有好几个</span>——<b>只要两个动作的 <code>Q*(s,a)</code> 打平，挑哪个都行。</b><span class='k'>打个比方：山顶的高度唯一，但上山的路可以有好几条。</span><b>p30 的检验题正是在问这件事。</b>", "<b>「最优策略是确定性的」这条结论，直觉上可以这么理解。</b><span class='k'>随机策略的值是各动作值的加权平均，而平均永远不会超过其中最大的那个</span>。<b>所以把全部概率压到最好的那个动作上，至少不会更差。</b><span class='w'>注意这个论证用到了「值是线性可加的期望」这个性质</span>——<b>一旦你的目标不是期望回报（比如要控制风险、要满足约束），这条结论就可能不成立</b>，<span class='k'>那时随机策略真的可能严格更好</span>。"], "quote": "Compute the optimal policy: <b>π*(s) = arg max_π V^π(s)</b> &nbsp;·&nbsp; <b>There exists a unique optimal value function</b> &nbsp;·&nbsp; Optimal policy for a MDP in an infinite horizon problem is deterministic"},
{"r": [30, 30], "t": "检验题：有多少个策略", "star": 3, "one": "7 个状态、2 个动作。", "eq": "确定性策略个数 = 2⁷ = 128\n一般地：|A|^|S|", "pts": ["<b>指数级</b>，不是线性。每个状态各自挑一个动作，挑法相乘。", "最优策略<span class='w'>不一定唯一</span>——两个动作的最优值打平就有并列。", "<b>为什么是 <code>2⁷</code> 而不是 <code>2×7</code>，这里的计数逻辑要彻底搞清，因为后面 p42 的轮数上界直接用它。</b><span class='k'>一个确定性策略必须给<b>每一个</b>状态指定一个动作</span>——<b>它是一张有 7 行的表，每行填 L 或 R。</b><span class='w'>7 个独立的二选一，所以是 <code>2×2×…×2 = 2⁷ = 128</code></span>。<b>老师用两个状态演示的四种组合（a1a1 / a1a2 / a2a1 / a2a2）就是这个道理的最小版本。</b>", "<b>把一般公式 <code>|A|^{|S|}</code> 的量级感建立起来，你才知道「搜索策略」有多绝望。</b><span class='k'>7 个状态 2 个动作：128 个，随便枚举</span>；<span class='k'>100 个状态 4 个动作：<code>4¹⁰⁰ ≈ 10⁶⁰</code>，宇宙里的原子都不够数</span>。<b>而 100 个状态在真实问题里算是极小的。</b><span class='w'>所以「把所有策略列出来比一比」这条路，在几乎所有实际问题上都是死的</span>——<b>p32 会正式宣判它。</b>", "<b>但这个指数有一个很重要的性质常被忽略：它是<span class='k'>有限</span>的。</b><span class='w'>指数大，但不是无穷大</span>。<b>这一点在 p42 会变成策略迭代的终止性证明</b>——<span class='k'>因为策略只有有限个，而每轮都严格变好，所以不可能无限循环下去</span>。<b>「指数但有限」这五个字，是策略迭代能保证停机的全部依据。</b>", "<b>第二问「最优策略唯一吗」答案是否，而这个「否」在实践里有具体后果。</b><span class='k'>两个动作的 <code>Q*</code> 打平时，<code>arg max</code> 的结果取决于实现细节</span>——<b>numpy 的 <code>argmax</code> 返回第一个最大值，换个库可能返回最后一个。</b><span class='w'>于是同样正确的代码可能给出不同的策略</span>，<b>而它们的值完全一样。</b><span class='k'>如果你在对比两份实现时发现策略不同，先检查是不是打平，再怀疑有 bug。</span>"], "say": "有同学正是按「线性」猜的。老师用两个状态演示：a1a1 / a1a2 / a2a1 / a2a2，四个都是不同的策略——所以是 <b>2²</b> 而不是 2。", "quote": "7 discrete states, 2 actions: Left or Right &nbsp;·&nbsp; How many deterministic policies are there? <b>2⁷</b> &nbsp;·&nbsp; Is the optimal policy for a MDP always unique? <b>No, there may be two actions that have the same optimal value function</b>", "res": {"tag": "推断", "v": "<b>这一页请你把自己的策略数算出来，因为答案会让你对整个课题的难度重新估计。</b><br><br><span class='k'>你的「状态」在策略这一层就是节点编号 h，共 H ≈ 5–10 个；每个节点的动作是 k ≈ 3 档保真度。</span><b>于是确定性策略数 = <code>k^H</code>。</b><span class='w'>k=3、H=7 时是 <code>3⁷ = 2187</code>；k=3、H=10 时是 <code>3¹⁰ = 59049</code>；k=4、H=10 时是 <code>4¹⁰ ≈ 10⁶</code>。</span><br><br><b>2187 是个什么概念？它是你可以<span class='k'>全部跑一遍</span>的数。</b><b>这正是简报 §4d 那张穷举 oracle 表能存在的理由</b>——<span class='w'>而绝大多数 RL 问题里这件事根本做不到</span>（<b>p30 那个 <code>4¹⁰⁰</code> 的例子就是常态</b>）。<span class='k'>所以你手上有一个几乎没人有的东西：一个真实的最优基准。</span><b>这不是细节，这是你实验设计里最硬的一张牌，该在 paper 里明说。</b><br><br><b>但要诚实地标出它的边界，否则会被问穿：</b><br><b>① </b><span class='w'><code>k^H</code> 对 H 是指数的</span>——H 从 7 涨到 15，就从 2187 变成一千四百万，穷举立刻失效。<b>所以「可穷举」是你当前规模的性质，不是方法的性质。</b><br><b>② </b><span class='k'>穷举的是<b>策略</b>，不是<b>评估</b></span>——每个配置还要在一批 query 上跑才能得到可靠的 (Acc, Cost)，<b>真实成本是 <code>k^H × 样本数</code>。</b><span class='w'>这才是你 oracle 表的实际预算，算清楚再承诺。</span><br><b>③ </b><b>一旦策略允许依赖状态（而不只是节点编号），策略数就从 <code>k^H</code> 涨成 <code>k^{状态数}</code></b>——<span class='k'>这是 p30 原本的那个公式，而它会立刻爆炸</span>。<b>你的「可穷举」其实依赖于一个很强的限制：策略只按节点位置决定，不看中间产物。</b><span class='w'>这个限制是真的限制（见 p56 和 L07 p30），该写进 limitation。</span>", "ref": "课件 p30 p32 · 本讲 p42 p56 · L07 p30 科研格 · 简报 §4d"}},
{"r": [31, 31], "t": "最优策略的三个性质", "star": 2, "one": "确定性 · 平稳 · 不一定唯一。", "pts": ["<b>平稳</b>＝不依赖时间步。在 s7 该做什么，第 1 步和第 242 步是同一个答案。", "理由：无限 horizon 下，<span class='k'>无论你在哪一步，前面都还剩无穷多步</span>，处境完全一样。", "唯一性：值函数唯一，策略不一定。", "<b>这三条性质要连着它们的前提一起背，否则会用错地方——而课件把前提写在括号里：<em>in an infinite horizon problem (agent acts forever)</em>。</b><span class='w'>三条里有两条依赖这个前提</span>，<b>而且 p56 会亲自来拆掉其中一条。</b><span class='k'>所以请把「无限 horizon」当成这一页真正的主语。</span>", "<b>逐条拆：确定性——这条最稳，前面 p29 已经论证过（平均不超过最大）。</b><span class='k'>它不依赖 horizon，有限 horizon 下最优策略同样可以是确定性的</span>。<b>这条你可以放心用。</b>", "<b>平稳性——这条<span class='w'>完全依赖</span>无限 horizon，而理由非常简单。</b><span class='k'>无限 horizon 下，无论你现在是第 3 步还是第 3000 步，你面前都还剩无穷多步，处境一模一样</span>。<b>既然处境相同，最优做法当然相同，所以不需要看时钟。</b><span class='w'>而有限 horizon 下处境不同</span>——<b>还剩 2 步和还剩 200 步，该做的事可以完全相反。</b><span class='k'>p55–p56 会把这件事讲透，而那正是这一讲和你的问题最相关的一段。</span>", "<b>唯一性——这条是「否」，而课件给的理由是打平。</b><span class='k'>注意它说的是 <em>state-actions with identical optimal values</em></span>，<b>也就是 <code>Q*(s,a1) = Q*(s,a2)</code> 的情形。</b><span class='w'>这时两个策略都是最优的，值函数完全相同，没有任何办法区分优劣</span>。<b>如果你需要在它们之间挑，判据必须来自模型之外</b>（比如更简单、更可解释、更保守）——<span class='k'>这又是一次「约束不够，要自己补一条」，和 L07 那条暗线是同一个结构。</span>"], "quote": "Optimal policy for a MDP in an infinite horizon problem (agent acts forever) is: <b>Deterministic</b> &nbsp;·&nbsp; <b>Stationary (does not depend on time step)</b> &nbsp;·&nbsp; Unique? <b>Not necessarily</b>, may have state-actions with identical optimal values", "tbl": {"head": ["性质", "无限 horizon", "有限 horizon", "依据"], "rows": [["确定性", "<span class='k'>成立</span>", "<span class='k'>成立</span>", "平均不超过最大（p29）"], ["平稳（不看时钟）", "<span class='k'>成立</span>", "<span class='w'>不成立</span>", "<b>剩几步不同，处境就不同（p56）</b>"], ["唯一", "<span class='w'>不保证</span>", "<span class='w'>不保证</span>", "<code>Q*</code> 可能打平（p30）"]]}},
{"r": [32, 32], "t": "策略搜索：能不能直接枚举", "one": "可以，但一般不划算。", "pts": ["确定性策略共 <code>|A|^|S|</code> 个，有限但指数级。", "机器多到不像话时，<b>并行枚举反而可能更快</b>；串行就该用策略迭代。", "<b>这一页只有三行，但它是整讲的转折点：它先摆出最笨的办法，然后宣布有更好的。</b><span class='k'>最笨的办法是枚举——把 <code>|A|^{|S|}</code> 个策略全部评估一遍，挑最好的</span>。<b>它一定正确，而且 p25 已经告诉你每个策略的评估都不难。</b><span class='w'>唯一的问题是数量。</span>", "<b>值得想清楚枚举为什么「笨」，因为笨在一个很具体的地方：它不利用策略之间的关系。</b><span class='k'>枚举把 128 个策略当成 128 个互不相干的候选，一个个试</span>。<b>但它们之间明明有结构</b>——<span class='w'>两个只在一个状态上不同的策略，它们的值应该差不多，而且你能从其中一个的值<b>算出</b>该往哪改</span>。<b>策略迭代用的正是这个结构：不盲目试，而是从当前策略算出改进方向。</b><span class='k'>这和「随机搜索 vs 梯度下降」的区别是同一回事。</span>", "<b>课件那句 <em>generally more efficient</em> 里的 <em>generally</em> 很克制，值得照着说。</b><span class='w'>策略迭代的最坏情况轮数上界仍然是 <code>|A|^{|S|}</code></span>（<b>p42 会给出这个界</b>），<span class='k'>也就是理论上它可能退化成枚举</span>。<b>但实践中它通常几轮到几十轮就收敛，远远用不到那个界。</b><span class='w'>「最坏情况一样差，平均情况好得多」是算法里非常常见的一种局面</span>——<b>单纯形法也是这样。</b>"], "say": "老师特意补了这句：如果你在乎的是墙钟时间、而且有非常多处理器，穷举是可以的。策略迭代的优势是<b>串行</b>算得省。", "quote": "One option is searching to compute best policy &nbsp;·&nbsp; Number of deterministic policies is <b>|A|^{|S|}</b> &nbsp;·&nbsp; <b>Policy iteration is generally more efficient than enumeration</b>"},
{"r": [33, 33], "t": "策略迭代（PI）", "star": 3, "one": "手里始终攥着一个策略：评估它 → 改进它 → 再评估，直到不再变。", "eq": "i = 0，π₀ 随机初始化\n当 i==0 或 ‖π_i − π_{i-1}‖₁ > 0：\n    V^{π_i} ← 策略评估\n    π_{i+1} ← 策略改进\n    i = i + 1", "pts": ["停止条件就是<b>策略不再变化</b>（L1 范数为 0）。", "评估这一步是老工具（MDP+策略=MRP）；<span class='k'>新东西只有「改进」</span>。", "<b>策略迭代就是两步交替，而这两步各自都已经讲过了，这一页只是把它们拼起来。</b><span class='k'>① 评估：给定 <code>π_i</code>，算出 <code>V^{π_i}</code></span>（<b>p25 塌成 MRP，然后用 p21 的迭代或 p20 的解析解</b>）；<span class='k'>② 改进：给定 <code>V^{π_i}</code>，算出更好的 <code>π_{i+1}</code></span>（<b>p35，下面马上讲</b>）。<span class='w'>然后回到①，直到策略不再变。</span>", "<b>停机判据值得单独看一眼，因为它和后面值迭代的判据性质完全不同。</b><span class='k'>这里判的是 <code>‖π_i − π_{i−1}‖₁ &gt; 0</code>，也就是「策略有没有变」——这是个<b>离散</b>的判断</span>。<b>策略是一张「每个状态选哪个动作」的表，它要么变了要么没变，没有中间状态。</b><span class='w'>所以这个判据是精确的：一旦不变，就是真的收敛了，没有误差</span>（<b>p43 会证明「不变之后永远不变」</b>）。<span class='k'>对比值迭代：那里判的是值的变化小于 ε，而 ε 小不等于误差小</span>——<b>这是两条路最实际的一个差别。</b>", "<b>初始化是随机的，而这不要紧，值得说明为什么。</b><span class='k'>因为每一轮都严格变好（p39 的单调改进定理）</span>，<b>所以无论从哪里出发，都在往上爬，而且爬的是同一座山（最优值唯一，p29）。</b><span class='w'>初始策略只影响你走多少轮，不影响你走到哪</span>。<b>这是一条很强的保证</b>——<span class='k'>对比深度 RL，那里初始化能决定成败（第六讲 p12 要你跑两个种子就是因为这个）</span>。"], "quote": "Set i = 0 &nbsp;·&nbsp; Initialize π_0(s) randomly for all states s &nbsp;·&nbsp; While i == 0 or <b>‖π_i − π_{i−1}‖_1 &gt; 0</b> (L1-norm, measures if the policy changed for any state): &nbsp;·&nbsp; V^{π_i} ← MDP V function policy evaluation of π_i &nbsp;·&nbsp; π_{i+1} ← Policy improvement &nbsp;·&nbsp; i = i + 1"},
{"r": [34, 34], "t": "新定义：状态–动作值 Q", "star": 3, "one": "先做动作 <code>a</code>（哪怕策略不这么说），<b>之后</b>再按 π 走。", "eq": "Q^π(s,a) = R(s,a) + γ · Σ_{s′} P(s′|s,a) · V^π(s′)", "pts": ["和 <code>V</code> 的差别只在<b>第一步</b>：V 从头到尾听 π 的，Q 的第一步是你指定的。", "有了它才能问出「换个动作会不会更好」——这正是改进要的。", "<b>课件那句 <em>Take action a, then follow the policy π</em> 是 Q 的全部定义，而它的结构是「先叛变一步，再归队」。</b><span class='k'>第一步你做 <code>a</code>（可能不是 <code>π</code> 会选的那个），之后老老实实按 <code>π</code> 走到底</span>。<b>所以 <code>Q^π(s,a)</code> 回答的是：「在这里破例做一次 a，值不值？」</b><span class='w'>这正是「改进」所需要的全部信息。</span>", "<b>为什么需要 Q 而不能只用 V，理由很实际，值得说死。</b><span class='k'><code>V(s)</code> 告诉你「这个状态值多少」，但没告诉你「该做什么」</span>——<b>要从 V 推出动作，你必须算 <code>R(s,a) + γΣP(s′|s,a)V(s′)</code>，而这需要 <code>P</code> 和 <code>R</code>。</b><span class='w'><code>Q(s,a)</code> 把这一步预先算好了，于是选动作只要取 <code>arg max_a Q(s,a)</code>，什么模型都不用。</span><b>这个差别在这一讲无所谓（你有模型），</b><span class='k'>但到第四讲没有模型时，它就是 Q-learning 存在而不是「V-learning」的唯一原因</span>。", "<b>还有一条关系式要记牢，它在这一讲和后面都会反复用：<code>V^π(s) = Σ_a π(a|s) Q^π(s,a)</code>。</b><span class='k'>V 是 Q 按策略加权的平均</span>。<b>确定性策略下更简单：<code>V^π(s) = Q^π(s, π(s))</code></b>——<span class='w'>「照着策略做」正是 Q 定义里那个「破例」恰好不破例的情形</span>。<b>这个等式是 p37 那个关键不等式的起点。</b>"], "quote": "State-action value of a policy &nbsp;·&nbsp; <b>Q^π(s, a) = R(s, a) + γ Σ_{s′∈S} P(s′|s, a) V^π(s′)</b> &nbsp;·&nbsp; <b>Take action a, then follow the policy π</b>"},
{"r": [35, 35], "t": "策略改进", "star": 3, "one": "对每个状态，挑让 Q 最大的那个动作。", "eq": "对所有 s, a：Q^{π_i}(s,a) = R(s,a) + γ Σ P(s′|s,a) V^{π_i}(s′)\nπ_{i+1}(s) = arg max_a  Q^{π_i}(s,a)", "quote": "Compute state-action value of a policy π_i: For s in S and a in A: <b>Q^{π_i}(s, a) = R(s, a) + γ Σ_{s′∈S} P(s′|s, a) V^{π_i}(s′)</b> &nbsp;·&nbsp; Compute new policy π_{i+1}, for all s ∈ S: <b>π_{i+1}(s) = arg max_a Q^{π_i}(s, a)</b>", "pts": ["<b>改进这一步简单到只有一行，但它干的事值得说清楚：它在每个状态上独立地「贪一步」。</b><span class='k'>对每个 <code>s</code>，把所有动作的 <code>Q^{π_i}(s,a)</code> 算出来，挑最大的那个</span>。<b>注意各个状态是分开挑的，互不协商。</b><span class='w'>这正是下一页要问的那个奇怪之处</span>：<b>每个状态各自贪心，凭什么合起来整体更好？</b>", "<b>把这一步的计算量算一下，你会看到它为什么便宜。</b><span class='k'>每个 <code>(s,a)</code> 对要做一次求和，代价 <code>O(|S|)</code>；一共 <code>|S|·|A|</code> 个对</span>——<b>所以改进一步是 <code>O(|S|²|A|)</code>。</b><span class='w'>而评估那一步要么是 <code>O(|S|³)</code>（解析解）、要么是若干轮 <code>O(|S|²)</code>（迭代）</span>。<b>两边量级相当，所以策略迭代的每一轮都不便宜</b>——<span class='k'>它赢在轮数少，不是赢在每轮快。这一点 p57 会正面对比。</span>", "<b>这里的 <code>arg max</code> 还隐含了一件事：新策略一定是确定性的。</b><span class='k'>哪怕你从一个随机策略出发，一次改进之后它就变成确定性的了</span>。<b>这和 p29「最优策略是确定性的」是同一条脉络</b>——<span class='w'>随机化在这个设定里不买任何东西，所以算法自动把它扔掉了。</span>"]},
{"r": [36, 36], "t": "把两步拼起来", "one": "p33 的流程图再放一遍——现在「策略改进」那一格有内容了。", "pts": ["评估用的是 p26 的老办法（MDP+策略=MRP）；改进用的是 p34–35 的 Q 与 arg max。", "剩下的问题只有一个：<span class='k'>这样改真的会更好吗？</span>下一页开始回答。", "<b>课件用 <em>Delving Deeper</em> 开一页，说明接下来要处理的是一个真正值得停下来想的问题。</b><span class='k'>到此为止，策略迭代的每一步你都看懂了，但整件事还没被证明是对的</span>——<b>你只知道「每个状态上贪一步」，不知道「这样做出来的新策略真的更好」。</b><span class='w'>这中间的缝隙比看上去大，下一页会把它展开。</span>", "<b>先把这个缝隙说准，带着问题读下一页会清楚得多。</b><span class='k'><code>Q^{π_i}(s,a)</code> 这个量的含义是「破例一步，然后<b>按旧策略</b> <code>π_i</code> 走到底」</span>。<b>所以 <code>max_a Q^{π_i}(s,a)</code> 保证的只是「破例一次更好」。</b><span class='w'>但新策略 <code>π_{i+1}</code> 要做的是<b>每一步都破例</b></span>——<b>它在 <code>s</code> 破例，到了 <code>s′</code> 还要破例，一直破例下去。</b><span class='k'>「破例一次更好」和「一直破例更好」之间，差着一个需要证明的跳跃。</span>", "<b>读证明之前先建立一个心理预期：这个缺口是真的，不是作者故意卖关子。</b><span class='k'>在一般的优化问题里，「每个分量各自取最优」做出来的解通常不是全局最优</span>——<b>坐标下降法会卡在非最优点，多人各自最优化会得到纳什均衡而非社会最优。</b><span class='w'>所以 MDP 这里能成立，一定用到了某个特殊结构</span>，<b>而那个结构就是贝尔曼方程的递归形式加上 γ 的衰减。</b><span class='k'>带着「特殊在哪」这个问题去读 p40，收获会大得多。</span>"], "quote": "Delving Deeper Into Policy Improvement Step &nbsp;·&nbsp; Q^{π_i}(s, a) = R(s, a) + γ Σ_{s′∈S} P(s′|s, a) V^{π_i}(s′)"},
