{"r": [1, 2], "t": "这一讲要干什么", "star": 2, "quote": "<b>CS234 Reinforcement Learning</b><br><em>The value function approximation structure for today closely follows much of David Silver's Lecture 6. For additional reading please see SB 2018 Sections 9.3, 9.6-9.7.</em><br><b>Table of Contents</b> — <em>1 Introduction · 2 VFA for Prediction · 3 Control using Value Function Approximation</em>", "one": "<b>状态多到写不下表格时，用一个带参数的函数去代替那张表。</b>", "pts": ["<b>三节的切分值得先记一下，因为它们的难度完全不同</b>：引入（p1–13）讲动机和工具；<b>预测</b>（p14–36）讲「只评估一个固定策略」，<span class='k'>这一节结论干净、有定理</span>；<b>控制</b>（p37–49）讲「边学边改策略」，<span class='w'>这一节几乎全是坏消息</span>。整讲真正的转折在 p38。", "<b>为什么分节的顺序是「先预测后控制」</b>：这和第三、四讲的编排是同一个套路——先把「给定策略，它值多少」弄清楚，再问「怎么找到更好的策略」。<span class='k'>本讲会让你看到这个顺序不只是教学方便：预测这一节能证的定理，到了控制那一节大半不成立。</span>", "<b>课件自己标的参考读物是 Sutton &amp; Barto 的 9.3、9.6–9.7</b>。9.3 是随机梯度与半梯度方法，9.6–9.7 是特征构造（瓦片编码等）。<span class='w'>注意它没有列 11.x</span>——而第 11 章才是讲 off-policy 发散的那一章，本讲 p43、p46 两次指过去。<b>这说明本讲对致命三件套只做定性交代，不做展开。</b>", "<b>本讲在整门课里的位置值得先摆正。</b> L02–L04 回答的是「怎么做」——给定模型怎么算、没有模型怎么估、怎么边学边改。<span class='k'>这三讲全部建立在一个没有说出口的前提上：值函数写得下</span>。<b>本讲把这个前提拿掉，于是前三讲的每一个算法都要重做一遍。</b>", "<b>一个贯穿全讲的判据，现在就记住</b>：<span class='k'>你是在 on-policy 还是 off-policy？</span><br>on-policy（数据来自你正在评估的那个策略）⇒ 本讲第二节，<b>有定理、有误差界、收敛</b>；<br>off-policy（数据来自别的策略）⇒ 本讲第三节，<b>可能发散</b>。<br><b>这一条分界比「线性还是神经网络」重要得多</b>——p45 那张表里坏掉的那一格，坏的原因正是 off-policy，不是非线性。"], "tbl": {"head": ["节", "页", "问题", "这一节的结论形态"], "rows": [["引入", "p1–13", "为什么要换掉表格，换成什么", "动机与工具，没有定理"], ["预测", "p14–36", "<b>固定策略</b>，它值多少", "<span class='k'>有定理，有误差界</span>"], ["控制", "p37–49", "边学边改策略", "<span class='w'>基本没保证，会发散</span>"]]}, "tip": {"t": "课件自己标的来源", "v": "紧跟 David Silver 的 Lecture 6；对应 Sutton &amp; Barto 2018 的 9.3、9.6–9.7。"}},
{"r": [3, 4], "t": "表格表示撑不住了", "star": 3, "quote": "<b>Last time: Model-Free Control</b><br><em>So far, have been assuming we can represent the value function or state-action value function as a vector/matrix — Tabular representation</em><br><em>Many real world problems have enormous state and/or action spaces</em><br><b><em>Tabular representation is insufficient</em></b>", "one": "<b>前四讲都默认「值函数可以写成一个向量/矩阵」。<span class='w'>真实问题里不行。</span></b>", "pts": ["<b>「写不下」这件事要分两层看，课件只说了第一层。</b><br><b>第一层是存不下</b>：Atari 一帧是 210×160 像素、每像素 128 色，可能的画面数远超原子总数，<span class='w'>这张表物理上不存在</span>。<br><b>第二层更要命：就算存得下，你也填不满它。</b> 表格表示下每个状态的值<b>只能靠访问那个状态来学</b>，状态之间不共享任何信息。<span class='k'>于是学习所需的样本量至少和状态数同阶</span>。", "<b>所以「表格撑不住」其实是两个不同的问题，而函数逼近主要解决的是第二个。</b>内存只是表面；<b>真正买到的是「见过 A 就能对没见过的 B 说点什么」</b>——这就是 p10 那三条好处里最容易被忽略的第三条。", "<b>注意课件的措辞是 <em>enormous state and/or action spaces</em>——动作空间也在内。</b>本讲全程只处理状态空间大的情形；<span class='w'>动作空间大是另一个问题，这门课基本不碰</span>（第八讲会提一句连续动作，但那是靠策略参数化绕过去，不是靠 Q 的函数逼近）。", "<b>把这一页和第一讲 p18 接起来</b>：那里用 Atari 论证「不能把策略写死成 if-then 表」，理由是可能的画面数写不完。<span class='k'>这一页是同一个论证用在值函数上</span>。<b>第一讲说的是「策略要泛化」，这一讲说的是「值函数要泛化」——而值函数是策略的来源，所以这才是根上的那一刀。</b>", "<b>第二层那个「填不满」的说法可以量化，而且结论很刺眼。</b>表格情形下要让每个状态的估计可靠，<span class='k'>每个状态至少要被访问若干次</span>；状态数一旦超过你能采集的样本数，<b>绝大多数格子就永远是初值</b>。此时算法不是「学得慢」，是<span class='w'>对没访问过的状态完全没有意见</span>——而那恰恰是你最需要它有意见的地方。", "<b>这就引出函数逼近真正的赌注</b>：它用「相似的状态有相似的值」这个假设，把没访问过的状态的估计<span class='k'>从别处借过来</span>。<b>赌对了，样本量需求从「和状态数同阶」降到「和特征维数同阶」；赌错了，你会对没见过的状态给出自信的错答案。</b><span class='w'>本讲后半的全部坏消息，都是这个赌注输掉时的样子。</span>", "<b>还有一个连带后果，课件没说但第四讲已经埋过伏笔</b>：表格表示下，<span class='k'>探索的目标是「把每个格子都访问到」</span>；函数逼近下，<b>目标变成「把特征空间覆盖到」</b>。这两件事的难度差着量级——<span class='w'>前者在大状态空间里不可能，后者还有戏</span>。<b>这也是为什么深度 RL 里 ε-贪婪还能勉强工作：它不需要访问遍所有状态，只需要访问到足够有代表性的那些。</b>"], "say": "老师说得很直接：你会遇到「跟见过的那些只差一点点的像素」，<b>那时候你得能从旧经验推过去</b>。这就是泛化。"},
{"r": [5, 6], "t": "四要素：今天轮到泛化", "star": 2, "quote": "<b>Recall: Reinforcement Learning Involves</b> — <em>Optimization · Delayed consequences · Exploration · Generalization</em><br><b>Today: Focus on Generalization</b>", "one": "<b>优化 · 延迟后果 · 探索 · <span class='k'>泛化</span>——前三样都碰过了，这一讲还最后一笔。</b>", "pts": ["<b>把前四讲对着这四个字复盘一遍，这一讲的位置就清楚了</b>：<br>L02 处理<b>优化</b>（给定模型求最优策略）与<b>延迟后果</b>（折扣与贝尔曼方程）；<br>L03 处理<b>延迟后果</b>的估计问题（MC vs TD）；<br>L04 第一次正面处理<b>探索</b>（ε-贪婪、GLIE）；<br><span class='k'>泛化一直欠着</span>，因为前四讲全是表格情形。", "<b>这四样不是并列的，它们会互相加重。</b> 第四讲讲 GLIE 时要求「每个 (s,a) 被访问无穷多次」——<span class='w'>状态空间一大，这个条件就从「理论上的小字」变成「物理上不可能」</span>。<b>所以泛化不只是第四件事，它还会把前三件的难度全部改写。</b>", "<b>课件把这两页排成「同一张清单，第二张把 Generalization 高亮」</b>，是在强调这是一次<span class='k'>视角切换而不是新内容</span>——前面讲的所有算法都要在这一讲里重做一遍，只是把查表换成拟合函数。", "<b>还有一条值得先说破：这四样在真实系统里是同时出现的，而课程是一次只碰一样。</b><span class='k'>这是教学上的必要简化，不是问题的实际形状</span>。<b>比如本讲全程假设「策略固定、只是值函数写不下」，而真实系统里状态空间大的同时，探索也更难、延迟后果也更长。</b><span class='w'>p38 的致命三件套，正是几样东西第一次被允许同时出现时发生的事。</span>"], "res": {"tag": "推断", "v": "<b>这四个字对你的项目有个很干净的对照，值得一次性想清楚。</b><br><b>优化</b>：你要的是在准确率与成本之间找最优分配，目标是 <code>G = Acc − λ·Cost</code>。<br><b>延迟后果</b>：<span class='w'>这一条是待验的</span>——节点 h 的保真度选择会不会真的影响 h+1 之后的结果，正是简报 §5 可加性检验要回答的。<b>如果效应近似可加，这一条就不成立，整个序贯框架也就不必要。</b><br><b>探索</b>：你的日志是固定的，<span class='k'>现阶段没有探索问题</span>——这也是为什么你关心的是 OPE（评估）而不是控制。<br><b>泛化</b>：<b>这一条对你最硬</b>。构型空间 2^k，日志里绝大多数构型样本数为 0，<span class='k'>不靠泛化就什么都估不出来</span>——这正是 FQE 相对穷举 oracle 的唯一优势所在。<br><b>所以这一讲对你不是「第五讲内容」，是「你那条技术路线的可行性论证」。</b>", "ref": "课件 p5–p6 原文 · 简报 §5（可加性检验）· §4a（日志是固定的）· §4d（穷举 oracle）"}},
{"r": [7, 7], "t": "目录：引入讲完了", "star": 1, "quote": "<b>Table of Contents</b> — <em>1 Introduction · <b>2 VFA for Prediction</b> · 3 Control using Value Function Approximation</em>", "one": "<b>这张目录页在本讲出现三次（p2、p7、p14、p37），每次高亮当前位置。</b>", "pts": ["<b>p7 这一次仍然停在 Introduction</b>——引入这一节还没讲完，后面还有 p8–p13 六页。<span class='k'>课件在这里插一张目录，是因为前六页讲的是「为什么」，后六页讲的是「用什么」</span>，两段性质不同。", "<b>引入这一节（p1–p13）回答的是两个「什么」</b>：<b>为什么</b>要换掉表格（p3–p6），以及<b>换成什么</b>（p8–p13）。<span class='k'>它没有任何算法</span>——第一个算法要到 p21 才出现。", "<b>接下来的第二节（p14–p36）有一条很清晰的推进线，现在先看一眼地图</b>：<br>① 先假设有神谕，把目标函数写对（p15–p16）；<br>② 把神谕换成 MC 的回报（p21–p22），看它收敛到哪（p25–p26）；<br>③ 再换成 TD 的 bootstrap 目标（p29–p32），看它收敛到哪（p34）；<br>④ 用一道检验题把两者对齐（p35）。<br><b>中间插两次 Baird 例子（p23、p33）做手算。</b>", "<b>为什么课件要把目录重复四次（p2、p7、p14、p37）</b>：因为这一讲的三节<span class='w'>结论性质完全不同</span>——引入没有定理，预测有干净的定理，控制几乎全是反例。<b>反复提醒你现在站在哪一节，是为了让你别把第二节的保证误用到第三节去。</b>"]},
{"r": [8, 9], "t": "值函数逼近（VFA）是什么", "star": 3, "quote": "<b>Value Function Approximation (VFA)</b><br><em>Represent a (state-action/state) value function with a <b>parameterized function</b> instead of a table</em><br><em>s → V̂(s; w)　　(s,a) → Q̂(s,a; w)</em><br><b>Motivation for VFA</b> — <em>Don't want to have to explicitly store or learn for every single state a: Dynamics or reward model · Value · State-action value · Policy</em><br><em>Want more compact representation that <b>generalizes across states</b> or states and actions</em>", "one": "<b>查表 → 换成 <code>V̂(s; w)</code> 或 <code>Q̂(s,a; w)</code>，<code>w</code> 是一组参数。</b>", "eq": "s      ──►  V̂(s; w)        w 是参数向量\n(s,a)  ──►  Q̂(s,a; w)\n\n表格表示其实是它的特例：\n  每个状态一个特征（one-hot），w 就是那张表本身", "pts": ["<b>最要紧的一句在第二页：<em>generalizes across states</em>。</b>换成函数不只是省地方，<span class='k'>是让「学到 s 的值」这件事能自动改善对 s′ 的估计</span>——只要它们的特征像。<b>表格表示下这件事的强度恰好是零。</b>", "<b>注意课件列的四样东西：模型、值、Q、策略。</b> 函数逼近<span class='k'>对这四样都适用</span>，本讲只做值和 Q；策略的参数化要到第八讲（策略梯度），模型的参数化要到第十六讲。<b>所以这一讲学到的套路，后面会被原样搬用两次。</b>", "<b><code>w</code> 可以是深度网络的全部权重，也可以只是几个系数。</b>从表格到线性到深度网络是一条连续的谱，<span class='w'>谱上越往右表达力越强、保证越弱</span>——p45 那张收敛表就是按这条谱排的三列。", "<b>一个值得现在就想清楚的点</b>：表格表示<b>也是</b>函数逼近，只是特征取成 one-hot。<span class='k'>所以前四讲的所有结论都是本讲结论的特例</span>（p35 那道检验题正是在确认这件事）。<b>反过来说：本讲所有的坏消息，都是「特征没那么好」时才出现的——而真实问题里特征永远没那么好。</b>", "<b>这一页的图示值得多看一眼：输入是 <code>s</code>，参数 <code>w</code> 从旁边进来。</b><span class='k'>这个画法强调的是「w 和 s 的地位完全不同」</span>——<b>s 是查询，w 是你要学的东西</b>。表格表示下这两者是混在一起的（表格既是查询结构也是被学的内容），函数逼近把它们分开了。", "<b>分开之后带来一个表格情形没有的现象，整讲的麻烦都从这里来</b>：<span class='w'>改动 w 会同时改变所有状态的估值</span>。表格下你更新 <code>V(s₃)</code> 只动一格，别的格子纹丝不动；函数逼近下你为了把 <code>V̂(s₃)</code> 调对，<b>可能把 <code>V̂(s₅)</code> 调坏</b>——而你未必会发现。<span class='k'>p43 的「压缩 vs 扩张」就是这件事的正式说法。</span>", "<b>两种写法 <code>V̂(s;w)</code> 与 <code>Q̂(s,a;w)</code> 的分工和前面一致</b>：做<b>预测</b>（评估一个固定策略）用 V 就够；做<b>控制</b>（要挑动作）必须用 Q，因为 <span class='k'>arg max 需要按动作比较</span>，而 V 不带动作这一维。<b>所以本讲第二节全程用 V，第三节一上来就换成 Q。</b>"]},
{"r": [10, 10], "t": "泛化买到了三样东西", "star": 2, "quote": "<b>Benefits of Generalization</b><br><em>Reduce memory needed to store (P,R)/V/Q/π</em><br><em>Reduce computation needed to compute (P,R)/V/Q/π</em><br><b><em>Reduce experience needed to find a good (P,R)/V/Q/π</em></b>", "one": "<b>省内存 · 省计算 · <span class='k'>省数据</span>。第三样最要紧，也最容易被跳过。</b>", "pts": ["<b>前两样是工程问题，第三样是统计问题。</b> 内存和计算不够可以加机器；<span class='w'>数据不够加不了机器</span>——尤其当数据来自病人、学生、客户的时候。<b>所以第三条才是函数逼近在真实问题里真正不可替代的理由。</b>", "<b>为什么泛化能省数据，一句话</b>：表格表示下，关于 s 的每一条经验<b>只</b>改善对 s 的估计；函数逼近下，它会改善<span class='k'>所有特征相近的状态</span>。<b>一条数据被用了很多次，所以需要的数据条数就少了。</b>", "<b>这三条都带着同一个前提，课件没说</b>：特征得选对。特征选错时，省内存和省计算照样成立，<span class='w'>但省数据这一条会反向——你会很快收敛到一个错的答案</span>。<b>p25–p26 的 MSVE 下界就是这件事的正式说法。</b>"], "tbl": {"head": ["买到什么", "性质", "特征选错时还成立吗"], "rows": [["省内存", "工程", "成立"], ["省计算", "工程", "成立"], ["<b>省数据</b>", "<b>统计</b>", "<span class='w'>不成立，而且会更糟</span>"]]}, "tip": {"t": "但这笔买卖有代价", "v": "老师举了个极端例子：假设「所有游戏画面都是同一个状态」——这个表示极省内存、极省数据，<b>但你再也没法在游戏的不同部分做不同决策</b>。<b>表达能力</b>和<b>内存/计算/数据</b>之间永远在换，而且你事先并不知道多大的表达能力才够。"}},
{"r": [11, 12], "t": "选哪种函数逼近器", "star": 2, "quote": "<b>Function Approximators</b><br><em>Many possible function approximators including: Linear combinations of features · Neural networks · Decision trees · Nearest neighbors · Fourier/wavelet bases</em><br><em>In this class we will focus on function approximators that are <b>differentiable (Why?)</b></em><br><em>Two very popular classes: <b>Linear feature representations (Today)</b> · Neural networks (Next lecture)</em>", "one": "<b>这门课只用<b>可微</b>的：线性特征（今天）和神经网络（下一讲）。</b>", "pts": ["<b>课件自己在「可微」后面打了个问号 <em>(Why?)</em>，答案它没写。</b>理由是<span class='k'>我们要用梯度下降去拟合</span>——而梯度下降需要梯度。<b>这不是「可微的更准」，是「可微的好优化」</b>，两件事别混。", "<b>先讲线性的两个理由，第二个更重要</b>：<br>① 它被研究得最透，p25、p34 那两条误差界都只对线性成立；<br>② <span class='k'>深度网络可以看成「先算出一堆复杂特征，再对它们做线性逼近」</span>——<b>最后一层就是线性的</b>。所以线性情形不是玩具，是深度情形的最后一层。", "<b>被排除掉的那些也值得看一眼</b>：决策树、最近邻不可微，<span class='w'>但它们在某些场合恰恰更合适</span>——下面讲稿里老师自己举了例子。", "<b>把这五种逼近器按「归纳偏置」排一下，选型的逻辑就清楚了</b>：线性组合假设<b>值随特征线性变化</b>；最近邻假设<b>近邻的值相近</b>；决策树假设<b>值是分段常数</b>；傅里叶/小波基假设<b>值有周期或多尺度结构</b>。<span class='k'>没有哪个假设天生更对——对不对取决于你的问题</span>。<b>「可微」只是把候选集缩小到好优化的那些，不是在挑更准的那些。</b>", "<b>老师提的那条折中路子（先拟合深度网络，再用决策树去拟合它）有个名字</b>：<span class='k'>模型蒸馏 / 事后可解释</span>。值得注意的是它<b>不保证忠实</b>——树拟合的是网络的输出，<span class='w'>树说得通的理由未必是网络真正用的理由</span>。在医疗这类场合，这个区别可能正是你最在意的那一点。"], "tbl": {"head": ["逼近器", "可微", "本课用吗", "特点"], "rows": [["线性特征组合", "是", "<b>今天</b>", "有理论保证，是深度网络的最后一层"], ["神经网络", "是", "<b>下一讲</b>", "表达力最强，保证最弱"], ["决策树", "否", "不用", "<span class='k'>可解释</span>"], ["最近邻", "否", "不用", "局部，天然不外推"], ["傅里叶 / 小波基", "是", "不用", "适合周期性结构"]]}, "say": "有同学提到<b>决策树</b>的可解释性。老师接过去展开：如果这个策略要给医生当决策支持，深度网络很难解释「为什么推荐这个疗法」，决策树就好办。她还提到一条折中路子：<b>先拟合深度网络，再用决策树去拟合它</b>，两头的好处都想要。", "res": {"tag": "推断", "v": "<b>「选哪种逼近器」这个问题，在你的项目里要分两次回答，因为两半的性质完全不同。</b><br><b>成本那一半</b>：简报 §4e 说给定保真度和输入长度，token 成本<span class='k'>近乎确定</span>，预期 <code>R² &gt; 0.95</code>。<b>这是个几乎无噪声的回归问题</b>——线性或浅层模型就够，<span class='w'>上深度网络只会增加方差、拖慢交叉验证，没有任何收益</span>。<br><b>准确率那一半</b>：终局奖励、信号稀疏、特征是文本派生的，<b>真值很可能在任何手工特征上都不线性</b>。这一半才需要表达力。<br><b>但这一页的提醒在这里格外要紧</b>：表达力上去了，本讲后半的保证就全没了——<span class='w'>p45 那张表的「非线性 VFA」一列是「基本没保证」</span>。<b>所以 FQE 用深度网络时，你拿不到任何收敛保证，只能靠 oracle 表去验</b>（简报 §4d）。<br><b>一条可写进论文的方法学理由</b>：把 <code>G = Acc − λ·Cost</code> 拆成两半分别估，<span class='k'>不只是为了降方差，也是为了让成本那一半完全避开本讲的全部麻烦</span>——它根本不是策略评估问题，是监督回归。", "ref": "课件 p11–p12 原文 · 简报 §4e（两半分开、成本回归 R²>0.95，已核）· §4d（oracle 当量尺）· 本讲 p45"}},
{"r": [13, 13], "t": "复习：梯度下降", "star": 1, "quote": "<b>Review: Gradient Descent</b><br><em>Consider a function J(w) that is a differentiable function of a parameter vector w</em><br><em>Goal is to find parameter w that minimizes J</em>", "one": "<b>沿梯度反方向挪参数。</b>", "eq": "w ← w − α·∇_w J(w)\n\n其中 ∇_w J(w) = [ ∂J/∂w₁, …, ∂J/∂w_n ]ᵀ", "pts": ["<b>做够多次能到<span class='w'>局部</span>最优。</b>「局部」这两个字后面会反复回来——<span class='k'>而且本讲还会遇到更坏的情形：连局部最优都到不了，因为更新根本不是在下降任何目标函数</span>（p43）。", "<b>这一页之所以值得单列，是因为接下来每一个算法都是这个式子的一次具体化。</b>差别只在 <code>J(w)</code> 取什么：<br>p16 取 <code>E[(V^π − V̂)²]</code>（有神谕时）；<br>p21 把 <code>V^π</code> 换成回报 <code>G</code>（MC）；<br>p30 换成 <code>r + γV̂(s′)</code>（TD）。<br><b>整节「预测」就是这三次替换。</b>", "<b>有两个前提这一页没写，但后面会反复用到</b>：<br>① <b>步长 α 要合适</b>——太大越过最优、太小爬不动；第四讲的 Robbins–Munro 条件（<code>Σα=∞</code> 且 <code>Σα²&lt;∞</code>）在这里同样适用。<br>② <b>J(w) 得真的存在</b>。<span class='w'>这一条看起来是废话，但它正是 p43 要推翻的东西</span>——TD + 函数逼近的更新<b>不是任何目标函数的梯度</b>，于是这一页的全部直觉在那里都失效。", "<b>所以读本讲时建议随时问一句：我现在做的这一步，是在下降某个 J 吗？</b><br>MC + VFA：<span class='k'>是</span>，目标是 <code>E[(G − V̂)²]</code>，所以它老老实实收敛。<br>TD + VFA：<span class='w'>不是</span>，目标里那个 <code>V̂(s′;w)</code> 也含 w，<b>但更新时把它当常数处理了</b>（这叫半梯度 semi-gradient）。<b>一整讲的收敛性差异，根子就在这一句上。</b>"]},
{"r": [14, 14], "t": "目录：进入「用 VFA 做预测」", "star": 1, "quote": "<b>Table of Contents</b> — <em>1 Introduction · <b>2 VFA for Prediction</b> · 3 Control</em>", "one": "<b>引入讲完，进入第二节：固定一个策略，估它的值。</b>", "pts": ["<b>「预测」（prediction）在 RL 文献里就是「策略评估」的同义词</b>，和第三讲的用法一致。<span class='k'>这一节的全部内容是：把第三讲的 MC 与 TD 各做一次函数逼近版</span>。", "<b>「预测」这一节的三个替换，可以先摆成一张表记住</b>——后面六页都是在填这张表的某一格。<span class='k'>注意三者的目标函数形状完全一样，只有「目标值」那一列在换</span>。", "<b>这一节还藏着一条暗线：每换一次目标，收敛的保证就弱一档。</b><br>神谕 ⇒ 标准监督学习，<b>收敛到真正的最优逼近</b>；<br>MC ⇒ 目标无偏，<b>仍然收敛到最优逼近</b>（p26，等式）；<br>TD ⇒ 目标有偏且含 w，<b>只能收敛到最优逼近的常数倍之内</b>（p34，不等式）。<br><span class='w'>而到了第三节，连不等式都没有了。</span>", "<b>读这一节时有个省力的办法</b>：每看到一个新算法，先问「它把 <code>V^π(s)</code> 换成了什么」，再问「换完之后还无偏吗」。<span class='k'>这两问能解释本讲第二节的全部结论</span>，包括为什么 MC 得到等式而 TD 只得到不等式。"], "tbl": {"head": ["用什么顶替 V^π(s)", "出现在", "无偏吗", "收敛到"], "rows": [["真值（神谕）", "p15–p16", "—", "最优线性逼近"], ["回报 G_t", "p21–p22", "<b>是</b>", "<span class='k'>最优线性逼近（等式）</span>"], ["r + γV̂(s′;w)", "p29–p32", "<span class='w'>否</span>", "<span class='w'>最优逼近的 1/(1−γ) 倍之内（不等式）</span>"]]}},
{"r": [15, 16], "t": "先假设有个神谕", "star": 3, "quote": "<b>Value Function Approximation for Policy Evaluation with an Oracle</b><br><em>First assume we could query any state s and an oracle would return the true value for V<sup>π</sup>(s)</em><br><b>Stochastic Gradient Descent</b><br><em>Generally use mean squared error and define the loss as</em> <em>J(w) = E<sub>π</sub>[(V<sup>π</sup>(s) − V̂(s;w))²]</em><br><em>Stochastic gradient descent (SGD) samples the gradient</em> · <em><b>Expected SGD is the same as the full gradient update</b></em>", "one": "<b>假装你能查到任意状态的真值 <code>V^π(s)</code>，问题就退化成监督学习。</b>", "eq": "J(w) = E_π[ ( V^π(s) − V̂(s; w) )² ]\n\nΔw = −(1/2)·α·∇_w J(w)\n   = α·E_π[ ( V^π(s) − V̂(s;w) )·∇_w V̂(s;w) ]\n\n随机梯度下降：只在一个样本上算这个梯度，不取期望", "pts": ["<b>这一页的手法在整门课里反复出现：先假设一个你没有的东西，把问题化简，再把它换掉。</b>第二讲假设知道模型，第三讲假设有真值——<span class='k'>每次都是先把形式写对，再去想怎么估</span>。<b>p17 就会立刻把神谕拿掉。</b>", "<b>那个 <code>−1/2</code> 不是笔误</b>：平方项求导出来一个 2，乘上 <code>−1/2</code> 正好把它约掉，于是更新式干净成 <code>α·(误差)·∇V̂</code>。<span class='k'>这是写法上的方便，不是数学内容。</span>", "<b>「随机梯度下降的期望等于整批梯度」是这一页的技术要点。</b>它保证了：<span class='k'>一次只看一个样本，长期看方向是对的</span>。<b>这条性质是后面一切的基础</b>——没有它，用单条经验更新权重就没有道理。", "<b>式子里那个期望是对什么取的？</b> 课件写的是 <code>E_π</code>，意思是<span class='k'>「按 π 行动时会遇到的状态分布」</span>。<b>这句话 p24 会变成一个正式定义（平稳分布 d(s)），而 p44 会证明它一旦不成立，整件事就会炸。</b><span class='w'>现在先记住：目标函数里藏着一个分布，它不是均匀的。</span>", "<b>「退化成监督学习」这句话值得较真一下，因为它只对了一半。</b>标准监督学习里，<span class='k'>样本是独立同分布的、标签是固定的</span>。这一页假设有神谕，于是标签确实固定了；<b>但样本仍然不是 i.i.d.——它们来自同一条轨迹，前后高度相关</b>。<span class='w'>这一点本讲不展开，但它正是第六讲要用经验回放去打散的东西。</span>"], "res": {"tag": "推断", "v": "<b>「先假设有神谕，再把它换掉」这个手法，正是你那张穷举 oracle 表的角色。</b><br>简报 §4d 的做法：取 200–300 条留出 query，枚举 k 个决策节点的全部 2^k 种分配，跨分支共享前缀，得到精确表 <code>R(x, a₁..a_k)</code>。<span class='k'>那张表就是这一页说的 oracle——它对表内的任何确定性策略都能精确求值，方差为零</span>。<br><b>所以你和这门课的处境有一处不同，而且是好处</b>：课件说 <em>we don't actually have access to an oracle</em>（p17），<b>而你在 k≤4 的规模上付得起这个 oracle</b>。<br><b>用法上的建议</b>：不要把 oracle 当成最终方案（它不可扩展），<span class='w'>把它当成「用来检验别的估计量对不对」的量尺</span>——这正是这一页的逻辑：先有真值，才知道逼近得好不好。<b>没有 oracle 表，FQE 给出的任何数字你都无法判断它是对是错。</b>", "ref": "课件 p15–p16 原文 · 简报 §4d（穷举 oracle，已核）"}},
{"r": [17, 18], "t": "但神谕并不存在", "star": 2, "quote": "<b>Model Free VFA Policy Evaluation</b><br><em>Don't actually have access to an oracle to tell true V<sup>π</sup>(s) for any state s</em><br><b>Model Free VFA Prediction / Policy Evaluation</b><br><em>Recall model-free policy evaluation (Lecture 3) · Maintained a <b>look up table</b> to store estimates</em><br><em>Now: in value function approximation, <b>change the estimate update step to include fitting the function approximator</b></em>", "one": "<b>真有神谕就不用学了。所以要找个东西顶替真值——第三讲的两个顶替品原样拿来用。</b>", "pts": ["<b>这一页把本讲和第三讲的关系说死了：唯一的改动是「更新那一步」。</b>第三讲：观察到新数据 → <span class='k'>改表格里的一格</span>；本讲：观察到新数据 → <span class='k'>重新拟合函数</span>。<b>采样方式、目标值的构造、偏差方差的取舍，全都没变。</b>", "<b>两个顶替品，和第三讲逐字对应</b>：<br><b>MC</b> 用回报 <code>G_t</code>——无偏、高方差、要等回合结束、<span class='k'>不需要 Markov 性</span>；<br><b>TD</b> 用 <code>r + γV̂(s′; w)</code>——有偏、低方差、每步可更新、<span class='w'>需要 Markov 性</span>。<br><b>这两条性质在函数逼近下不但保留，而且后果被放大了</b>（p34 那个 <code>1/(1−γ)</code> 因子）。", "<b>注意 TD 的顶替品在这里多了一层近似。</b> 第三讲的 TD 目标是 <code>r + γV(s′)</code>，其中 <code>V(s′)</code> 是表格里的一个数；<b>这里是 <code>V̂(s′; w)</code>，是函数算出来的</b>。<span class='w'>所以它既有偏（因为 bootstrap），又是近似的（因为函数类装不下）</span>——p29 会把这叫做「三层近似」。", "<b>这一步换掉神谕的代价，可以提前算出来</b>：<br>用 <code>G_t</code> 顶替 ⇒ 目标是<span class='k'>无偏</span>的，于是整件事仍然是标准的监督学习，<b>收敛性质干净</b>（p25–p26）。<br>用 <code>r + γV̂(s′;w)</code> 顶替 ⇒ 目标<span class='w'>既有偏，又含有待学的 w</span>，<b>于是它连「监督学习」都不完全算</b>——标签会随着你学习而移动。<span class='k'>这正是第六讲 DQN 要用「固定 Q 目标」去对付的那个非平稳性</span>。", "<b>把这件事和第三讲接起来，会得到一个更整齐的说法。</b>第三讲里 MC 与 TD 的差别是「等不等得起」和「要不要 Markov 性」；<b>到了函数逼近下，差别升级成了「是不是在优化一个固定的目标」</b>。<span class='w'>这是一次性质上的变化，不只是程度上的</span>——也是为什么本讲对 MC 能给等式、对 TD 只能给不等式（p26 vs p34）。", "<b>最后提醒一个记号陷阱</b>：课件这里仍然写 <code>V^π(s)</code>（带上标 π），<span class='k'>意思是「这是对某个固定策略的评估」</span>。整个第二节 π 都是固定的、不变的。<b>到了第三节 π 会随 Q̂ 一起变——那一变，这一节的全部定理就都不适用了。</b>"]},
{"r": [19, 19], "t": "特征向量", "star": 3, "quote": "<b>Feature Vectors</b><br><em>Use a feature vector to represent a state s</em><br><em>x(s) = [ x₁(s), x₂(s), …, x<sub>n</sub>(s) ]<sup>T</sup></em>", "one": "<b>把状态写成一串数。<span class='k'>这一步做得好不好，决定了后面全部的上限。</span></b>", "pts": ["<b>这一页只有一个式子，但它是整讲最有现实影响的一页。</b>后面所有定理的形式都是「<span class='k'>在你这个特征张成的空间里，能做到的最好是多少</span>」——<b>特征定了，上限就定了，算法再好也突破不了。</b>", "<b>特征的两个要求是矛盾的</b>：要<b>够丰富</b>（装得下真值，否则 p25 那个 min 不为 0），又要<b>够紧凑</b>（否则就退回表格，省不了数据）。<span class='w'>这对矛盾没有通用解法</span>——深度学习的卖点正是「让网络自己去学特征」，把这个难题从人转移给了优化。", "<b>一个容易忽略的点：特征可以比状态还多。</b> p23 的 Baird 例子就是 7 个状态、8 个特征。<span class='k'>特征数多于状态数并不意味着「装得下真值」</span>——重要的是张成的空间，不是维数。<b>Baird 例子的全部凶险都建立在这件事上。</b>", "<b>好特征的判据不是「信息全」，而是「值函数在它上面接近线性」。</b>一个包含了全部信息但组合方式很别扭的特征集，照样让线性逼近很差。<span class='k'>这就是为什么深度学习之前，特征工程是整个领域的主要工作量。</span>"], "say": "老师举的是<b>激光测距仪</b>：180 度，每度一个到障碍物的距离，那就是 180 维特征。<br>紧接着她自己拆台：<span class='w'>这个表示多半不是马尔可夫的</span>——很多走廊的读数长得一模一样，一楼二楼也分不开。<b>「有混叠就不是马尔可夫」</b>——但它仍然可能是个够用的决策依据。", "res": {"tag": "推断", "v": "<b>这一页直接对应简报 §4a 里那条「本周就能挖」的事：节点级特征工程与难度打分。</b><br>你的「状态」是什么？<span class='k'>至少是 (query 特征, 节点 id, 已走过的部分轨迹)</span>。而简报 §5 的 <b>P2 vs P3 消融</b>问的正是：<b>要不要把最后那一项放进特征里。</b><br><b>这一页给了那个消融一个更准确的说法</b>：它不是在问「状态该怎么定义」，而是在问「<span class='k'>加上部分轨迹这一维，值函数在特征空间里是不是明显更接近线性</span>」。<b>若提升不到 2 个百分点，说明这一维没有带来可用的结构，那就别加</b>——多出来的维度只会稀释数据、抬高方差。<br><span class='w'>还有一条和老师的激光测距仪例子完全平行的风险</span>：如果你的特征在不同 query 之间「混叠」（两个难度差别很大的 query 特征长得一样），<b>那这个表示就不是 Markov 的，bootstrap 一定会出错</b>——而那正是 L03 p46 的 AB 例子演示过的后果。", "ref": "课件 p19 原文 · 简报 §4a（节点级特征工程，已核）· §5（P2/P3 消融，已核）· L03 p46（AB 例子）"}},
{"r": [20, 20], "t": "线性 VFA：更新式读成三个因子", "star": 3, "quote": "<b>Linear Value Function Approximation for Prediction With An Oracle</b><br><em>V̂(s;w) = Σ<sub>j</sub> x<sub>j</sub>(s)w<sub>j</sub> = x(s)<sup>T</sup>w</em><br><em>J(w) = E<sub>π</sub>[(V<sup>π</sup>(s) − V̂(s;w))²]</em> · <em>Δw = −½α∇<sub>w</sub>J(w)</em><br><b><em>Update = step-size × prediction error × feature value</em></b>", "one": "<b>值 = 特征与权重的内积；更新量 = 步长 × 预测误差 × 特征值。</b>", "eq": "V̂(s; w) = Σ_j x_j(s)·w_j = x(s)ᵀw\n\nΔw = α·( V^π(s) − x(s)ᵀw )·x(s)\n      └步长┘ └──预测误差──┘ └特征┘", "pts": ["<b>课件那行小字值得背下来：<em>Update = step-size × prediction error × feature value</em>。</b>三个因子各管一件事——<b>步长</b>管挪多少，<b>预测误差</b>管往哪边挪，<span class='k'><b>特征值</b>管改哪几个权重、各改多少</span>。", "<b>第三个因子的后果最值得停留：只有特征非零的那些权重会被改动。</b><span class='k'>这就是「泛化」在式子里的样子</span>——你在状态 s 上学到的东西，会通过共享的那几个权重，<b>自动改变所有在这些维度上非零的状态的估值</b>。<span class='w'>好处与坏处都从这一条来</span>：p23 的算例会把它演示一遍，而 p44 的发散也是它。", "<b>线性情形下梯度特别干净：<code>∇_w V̂(s;w) = x(s)</code>。</b><span class='k'>梯度就是特征本身</span>，不依赖 w。<b>这是线性 VFA 所有好性质的技术来源</b>——目标函数是 w 的二次函数，于是它只有一个最小值，没有局部最优的烦恼。<span class='w'>换成神经网络，这一条立刻失效。</span>", "<b>注意这一页标题里还挂着 <em>With An Oracle</em>。</b>也就是说式子里的 <code>V^π(s)</code> 还是真值，<b>还没被顶替掉</b>。下一页才换成 <code>G_t</code>。<span class='k'>课件坚持把「形式」和「估计」分两步讲，是为了让你看清后面出的所有问题都来自第二步，不是第一步。</span>"]},
{"r": [21, 22], "t": "蒙特卡洛 VFA", "star": 3, "quote": "<b>Monte Carlo Value Function Approximation</b><br><em>Return G<sub>t</sub> is an <b>unbiased but noisy</b> sample of the true expected return V<sup>π</sup>(s<sub>t</sub>)</em><br><em>Therefore can reduce MC VFA to doing <b>supervised learning</b> on a set of (state, return) pairs: ⟨s₁,G₁⟩, ⟨s₂,G₂⟩, …</em><br><em>Δw = α(G<sub>t</sub> − x(s<sub>t</sub>)<sup>T</sup>w)x(s<sub>t</sub>)</em> · <em>Note: G<sub>t</sub> may be a very noisy estimate of true return</em>", "one": "<b>用回报 <code>G_t</code> 顶替真值，于是变成对 <code>⟨s_t, G_t⟩</code> 做监督学习。</b>", "eq": "Δw = α·( G_t − V̂(s_t; w) )·∇_w V̂(s_t; w)\n   = α·( G_t − x(s_t)ᵀw )·x(s_t)\n\n算法：\n  w = 0, k = 1\n  循环：按 π 采第 k 个片段\n    对片段里首次访问到的 s：G_t(s) = Σ_{j≥t} r_{k,j}\n    更新 w\n    k += 1", "pts": ["<b>「reduce to supervised learning」这句话是这一页的全部内容，但它有个前提值得说破</b>：<span class='k'>只有当标签（这里是 G_t）与 w 无关时，这个归约才成立</span>。<b>MC 满足这一条</b>——回报是实际跑出来的，不含任何估计。<span class='w'>TD 不满足，所以它只是「看起来像」监督学习。</span>", "<b><code>G_t</code> 无偏，所以 MC VFA 是在真正地下降 <code>E[(V^π − V̂)²]</code>。</b>这是 p26 能给出<b>等式</b>的根本原因。<span class='k'>无偏 ⇒ 期望意义上目标正确 ⇒ SGD 的收敛理论原样适用</span>。", "<b>代价写在课件最后一行：<em>G_t may be a very noisy estimate</em>。</b>在函数逼近下这个噪声的后果和表格时不同——<b>表格下噪声只污染那一格，函数逼近下它会通过共享权重污染一片</b>。<span class='w'>所以 MC + VFA 往往需要更小的步长、更多的数据</span>。", "<b>首次访问 / 每次访问的取舍和第三讲完全一样</b>：首次访问无偏、每次访问有偏但数据更省。课件的算法框里写的是 <em>if First visit</em>，<span class='k'>但两种都可以</span>。", "<b>「每个首次访问的状态各更新一次」这件事在函数逼近下有个新含义。</b>表格情形下这些更新互不干扰（各改各的格子）；<span class='w'>函数逼近下它们会互相拉扯</span>——同一个片段里的状态特征往往相似，<b>于是对后面状态的更新会部分抵消对前面状态的更新</b>。<span class='k'>这是「一个片段里的样本不是 i.i.d.」在权重空间里的具体后果。</span>"], "say": "有人问 episodic 情形下要不要写 γ。老师答：<b>episodic 时 γ 取 1 总是安全的</b>（γ&lt;1 的主要作用是保证有界，而片段必然终止时这个顾虑没了），但写上 γ 也完全可以。<br>还有人问「一个片段里更新几次」——答：<b>片段里每个首次访问的状态各更新一次</b>，不是一次。"},
{"r": [23, 23], "t": "Baird 例子：MC 走一步", "star": 3, "quote": "<b>Baird (1995)-Like Example with MC Policy Evaluation</b><br><em>MC update: Δw = α(G<sub>t</sub> − x(s<sub>t</sub>)<sup>T</sup>w)x(s<sub>t</sub>)</em><br><em>Small prob s₇ goes to terminal state, x(s₇)<sup>T</sup> = [0 0 0 0 0 0 1 2]</em>", "one": "<b>7 个状态、<b>8 个特征</b>，奖励处处为 0。先把 MC 的一次更新亲手算出来。</b>", "eq": "x(s1) = [2 0 0 0 0 0 0 1]      x(s7) = [0 0 0 0 0 0 1 2]\nw 初始化为全 1  ⇒  V̂(s1) = x(s1)ᵀw = 2 + 1 = 3\nα = 0.5，某片段从 s1 出发，回报 G = 0\n\nΔw = 0.5 · (0 − 3) · x(s1) = −1.5 · [2 0 0 0 0 0 0 1]\n   ⇒ 第 1 个权重 −3，第 8 个权重 −1.5\n\n新的 w = [−2  1  1  1  1  1  1  −0.5]", "pts": ["<b>先把这个环境记清楚，后面还要用两次（p33、p44）</b>：动作 <code>a1</code>（实线）<span class='k'>确定地</span>把你送到 s7；动作 <code>a2</code>（虚线）以 1/6 的概率均匀送回 s1–s6。<b>奖励处处为 0，所以真值 <code>V^π(s) ≡ 0</code> 对任何策略都成立。</b>", "<b>特征数（8）多于状态数（7），完全合法。</b><span class='w'>但这并不意味着函数类装得下真值</span>——真值是全零向量，而全零显然可以表示（取 w=0）。<b>所以这个例子的逼近误差是 0</b>，发散跟「装不下」无关。<span class='k'>这正是它作为反例的价值：排除掉最容易想到的那个解释。</span>", "<b>算例里只有两个权重被改动</b>，因为 <code>x(s1)</code> 只有第 1、8 位非零。<b>这就是 p20 第三个因子的直接后果。</b><span class='k'>注意第 8 位是 s1 和 s7 共享的</span>——改它会同时影响这两个状态的估值，<b>而这正是后面出事的那条通道</b>。", "<b>更新幅度 −3 和 −1.5 都相当大，值得记住这个量级</b>，下一处（p33）要和 TD 的 −0.3 对比。<span class='w'>大不等于错</span>——MC 看到的是「从 s1 出发实际拿到 0」，而当前估值是 3，<b>差 3 是真实的误差，不是噪声</b>。"], "tip": {"t": "现在还看不出毛病", "v": "老师特意说明：<b>这一页一切正常</b>。Baird 例子的凶险要到 p44 的<span class='w'>off-policy 控制</span>才露出来——on-policy 做策略评估时，函数逼近其实很太平。"}},
{"r": [24, 24], "t": "平稳分布 d(s)", "star": 3, "quote": "<b>Convergence Guarantees for Linear VFA for Policy Evaluation: Preliminaries</b><br><em>The Markov Chain defined by a MDP with a particular policy will eventually converge to a probability distribution over states d(s)</em><br><em>d(s) is called the <b>stationary distribution</b> over states of π</em> · <em>Σ<sub>s</sub> d(s) = 1</em><br><em>d(s) satisfies the balance equation</em>", "one": "<b>策略定死之后，MDP 就是一条马尔可夫链，它最终会稳定到一个状态分布。</b>", "eq": "Σ_s d(s) = 1\n\nd(s′) = Σ_s Σ_a π(a|s)·p(s′|s,a)·d(s)\n\n读法：下一步的状态分布 = 当前分布按动态推一步；平稳就是「推一步还是它自己」", "pts": ["<b>直观：长期来看，你有百分之几的时间待在每个状态。</b><span class='k'>这是第二讲平稳分布那一页的原样复用</span>，但这里它第一次有了实质作用——<b>下一页的误差度量要拿它加权</b>。", "<b>为什么误差要按 d(s) 加权，而不是对所有状态一视同仁？</b>因为<span class='k'>你更在乎常去的状态上的误差</span>。一个几乎不会到达的状态估错了，对实际回报几乎没有影响。<b>这个加权不是数学上的方便，是对「什么叫估得好」的一次定义。</b>", "<span class='w'>它不告诉你要多久才混合到位</span>——可能几步，也可能几百万步。<b>而所有的收敛结论都是「混合之后」的结论</b>，<span class='k'>于是「跑了多久才算够」这个实践问题，理论上没有回答</span>。", "<b>最要紧的一句话在这一页没写，但贯穿后半讲</b>：<span class='k'>d(s) 是由策略决定的</span>。换一个策略，d 就换一个。<b>于是「按 d 加权的误差最小」这件事，只对产生这些数据的那个策略成立</b>——<span class='w'>这正是 p44 发散的全部来源，也是 off-policy 一切困难的根。</span>"], "say": "有人问混合时间有没有界。老师答：<b>据我所知没有好办法</b>，而且「有没有简单的检验能判断已经混合了」同样很难。这是 off-policy 评估里的真痛点。", "res": {"tag": "推断", "v": "<b>这一页是你整个 OPE 问题的数学根。</b><br>你的日志由行为策略（AFlow 跑过的那些固定配置）产生，<span class='k'>它的状态分布就是那个策略的 d_b(s)</span>。你想评估的目标策略有另一个 <code>d_e(s)</code>，而<b>你手上没有任何来自 d_e 的数据</b>。<br><b>所以「按 d 加权的误差最小」这条保证，保的是错的那个 d。</b>你拟合出来的 Q̂ 会在「行为策略常去的那些 (query, 节点, 部分轨迹)」上很准，<span class='w'>而在目标策略常去、行为策略罕至的地方很差——偏偏后者才是你要下结论的地方</span>。<br><b>这给了简报 §4a 那条结论一个更深的说法</b>：deficient support 不只是「权重分母为 0」这个代数现象，<b>它的几何形态就是这一页的 d_b ≠ d_e</b>。<span class='k'>而且它不随数据量减轻</span>——采再多来自 d_b 的样本，也不会在 d_e 的区域上多出一个点。<br><b>可操作的推论</b>：报告 FQE 结果时，应当同时报<b>目标策略的访问分布与日志分布的重叠程度</b>（如有效样本量或密度比的分位数）。简报 §7 第 6 拳问「提升在统计上是真的吗」，这是预案的一部分。", "ref": "课件 p24 原文 · 简报 §4a（deficient support，推断）· §7 第 6 拳 · 本讲 p44"}},
{"r": [25, 26], "t": "MC + 线性 VFA 收敛到哪", "star": 3, "quote": "<b>Convergence Guarantees for Linear VFA for Policy Evaluation</b><br><em>MSVE(w) = Σ<sub>s∈S</sub> d(s)(V<sup>π</sup>(s) − V̂<sup>π</sup>(s;w))²</em><br><em><b>Monte Carlo policy evaluation with VFA converges to the weights w<sub>MC</sub> which has the minimum mean squared error possible</b></em><br><em>Tsitsiklis and Van Roy. An Analysis of Temporal-Difference Learning with Function Approximation. 1997.</em>", "one": "<b>收敛到你这个函数类里能做到的最小均方误差。<span class='k'>是等式，不是不等式。</span></b>", "eq": "MSVE(w) = Σ_s d(s)·( V^π(s) − V̂^π(s; w) )²\n\nMC 收敛到 w_MC：\n  MSVE(w_MC) = min_w Σ_s d(s)·( V^π(s) − V̂^π(s; w) )²", "pts": ["<b>这是本讲最强的一条保证，而且它是等式。</b><span class='k'>MC 不只是收敛，它收敛到「在你这个函数类里能做到的最好」</span>。<b>说白了：MC 就是在做你能做的最好的那次线性回归。</b>", "<b>但这个最小值<span class='w'>不一定是 0</span>。</b>如果你的线性类装不下真值，<code>min_w</code> 就是个正数——<b>而 MC 只保证够到这个正数，不保证够到真值</b>。<span class='k'>这是整讲第一次把「特征选得好不好」变成式子里的一项。</span>", "<b>读这条结论时要一直记着那个 d(s)</b>：误差是按平稳分布加权的。<span class='w'>换个策略，连「什么叫最优逼近」都会变</span>——<b>同一组特征、同一个真值函数，对不同策略的最优 w 不同</b>。这一点在 on-policy 下无所谓（因为就那一个策略），<b>到第三节就成了灾难。</b>", "<b>出处值得记一笔</b>：Tsitsiklis &amp; Van Roy 1997。<span class='k'>这篇论文同时给出了本页的 MC 结论和 p34 的 TD 结论</span>——<b>两条结论来自同一篇、同一套分析，所以它们的强弱差异是实质的，不是证明技巧的差别。</b>", "<b>有一个常见误读值得点破：这条结论不保证「MC 估出来的值接近真值」。</b>它保证的是<span class='k'>「接近你这个函数类里离真值最近的那个」</span>。<b>如果特征选得差，这两件事可以相差很远，而算法本身一点问题都没有。</b><span class='w'>换句话说，收敛性结论不替你检查特征——那是你自己的事。</span>", "<b>这也解释了为什么 p19 说「特征定了上限就定了」。</b>p26 这条等式的右边是一个<span class='k'>只依赖于特征和真值、不依赖于算法</span>的量。<b>任何算法都不可能做得比它更好，MC 只是恰好做到了它。</b>"], "tbl": {"head": ["", "收敛吗", "收敛到", "式子形态"], "rows": [["MC + 线性 VFA", "是", "<b>最优线性逼近</b>", "<span class='k'>等式</span>"], ["TD + 线性 VFA", "是", "最优逼近的常数倍之内", "<span class='w'>不等式（p34）</span>"], ["逼近误差为 0 时", "—", "<b>两者都到真值</b>", "p35 的检验题"]]}, "tip": {"t": "出处", "v": "Tsitsiklis &amp; Van Roy, <i>An Analysis of Temporal-Difference Learning with Function Approximation</i>, 1997。老师顺口提了一句：Van Roy 就在斯坦福。"}},
{"r": [27, 27], "t": "批量 MC：直接解出来", "star": 3, "quote": "<b>Batch Monte Carlo Value Function Approximation</b><br><em>May have a set of episodes from a policy π · Can <b>analytically solve</b> for the best linear approximation that minimizes mean squared error on this data set</em><br><em>arg min<sub>w</sub> Σ<sub>i=1</sub><sup>N</sup> (G(s<sub>i</sub>) − x(s<sub>i</sub>)<sup>T</sup>w)²</em> → <em>w = (X<sup>T</sup>X)<sup>−1</sup>X<sup>T</sup>G</em><br><b><em>Note: not making any Markov assumptions</em></b>", "one": "<b>手里已有一批片段时，这就是一个线性回归，可以解析求解。</b>", "eq": "arg min_w Σ_{i=1}^N ( G(s_i) − x(s_i)ᵀw )²\n\n求导置零：w = (XᵀX)^{-1} Xᵀ G\n\nX 是 N×n 的特征矩阵，G 是 N 维回报向量", "pts": ["<b>课件最后那行小字是整页最值钱的一句：<em>not making any Markov assumptions</em>。</b><span class='k'>这是 MC 路线在本讲唯一一次被明确标注「不需要 Markov 性」</span>。<b>它用的是整条真实回报，不自举，所以根本不关心「状态是不是未来的充分统计量」。</b>", "<b>代价是求一次矩阵逆。</b> <code>XᵀX</code> 是 n×n（n 是特征维数），求逆大致 <code>O(n³)</code>；而且 <b>X 可能大到根本写不下</b>（N 是样本数）。<span class='w'>特征维数一高，这条路就不通。</span>", "<b>和增量式 SGD 的关系</b>：两者收敛到同一个解（都是最小二乘解），<span class='k'>区别只在你是愿意一次性付清计算，还是分期付</span>。<b>数据量小、特征少时直接解更省事，也更精确</b>（没有步长、没有收敛判据）。"], "say": "老师给的判断：数据不多、特征不多时值得直接解；「<b>Facebook 不可能这么干</b>」。中间路线是小批量——她提到近年的工作表明，在深度学习里掺一点这种解析步骤常常很有帮助。", "res": {"tag": "已核", "v": "<b>这一页就是简报 §4e 里「成本那一半」的完整方案，一字不差。</b><br>简报说：<em>给定保真度和输入长度，token 成本近乎确定 → 直接回归（预期 R² &gt; 0.95），完全不用重要性权重。</em><br><b>而这一页给了它两条理论支撑</b>：<br>① <span class='k'>解析解存在</span>，<code>w = (XᵀX)⁻¹XᵀG</code>，不需要调步长、不需要判收敛；<br>② <span class='k'>不需要 Markov 假设</span>——<b>于是简报 §5 那个还没做的可加性检验，对成本这一半根本不构成前提</b>。成本模型现在就能拟，不必等实验结果。<br><b>这是本讲对你最直接可用的一页</b>：它说明「把 G 拆成两半分别估」不只是方差上的改进，<span class='w'>更是把一半的工作从「有前提的策略评估」搬到了「无前提的监督回归」</span>。<b>这句话可以原样写进 method 一节。</b>", "ref": "课件 p27 原文（含 <em>not making any Markov assumptions</em>）· 简报 §4e（成本回归，已核）· §5"}},
{"r": [28, 28], "t": "复习：查表式 TD", "star": 1, "quote": "<b>Recall: Temporal Difference Learning w/ Lookup Table</b><br><em>Uses <b>bootstrapping and sampling</b> to approximate V<sup>π</sup></em><br><em>V<sup>π</sup>(s) = V<sup>π</sup>(s) + α(r + γV<sup>π</sup>(s′) − V<sup>π</sup>(s))</em><br><em>Target is r + γV<sup>π</sup>(s′), a <b>biased</b> estimate · Represent value for each state with a separate table entry</em>", "one": "<b>第三讲的 TD 原样搬过来，最后一句是本页的关键：每个状态一个表格项。</b>", "eq": "V^π(s) ← V^π(s) + α·( r + γV^π(s′) − V^π(s) )", "pts": ["<b>课件特意在最后写了 <em>separate table entry</em>，是为了让下一页的改动显出来</b>：<span class='k'>下一页唯一变的就是这一句</span>——表格项换成函数。<b>其余一个字都不动。</b>", "<b>「bootstrapping and sampling」这两个词的分工</b>：<b>采样</b>指用实际到达的那一个 s′代替对所有 s′ 求期望；<b>自举</b>指用 <code>V(s′)</code> 这个估计代替真实的未来回报。<span class='w'>两者都引入误差，但性质不同</span>——采样带来方差，自举带来偏差。", "<b>这一页还值得提一句第三讲没强调的事：TD 的更新是「就地」的。</b>拿到一条 <code>(s,a,r,s′)</code> 就改 <code>V(s)</code>，<span class='k'>不需要等这条轨迹走完，也不需要保留它</span>。<b>这是 TD 能做在线学习的全部原因</b>，而 MC 做不到。", "<b>但「就地更新」在函数逼近下会变成一个问题。</b>表格情形下改 <code>V(s)</code> 不影响别人；<span class='w'>函数逼近下每次就地更新都会微调所有状态的估值</span>，<b>而目标值本身又依赖这些估值</b>——<span class='k'>于是「目标」在你追它的过程中一直在动</span>。下一页会把这件事写成式子。"]},
{"r": [29, 31], "t": "TD(0) + 值函数逼近：三层近似", "star": 3, "quote": "<b>Temporal Difference (TD(0)) Learning with Value Function Approximation</b><br><em>In value function approximation, target is r + γV̂<sup>π</sup>(s′;w), a <b>biased and approximated</b> estimate of the true value V<sup>π</sup>(s)</em><br><em><b>3 forms of approximation</b></em><br><em>Δw = α(r + γx(s′)<sup>T</sup>w − x(s)<sup>T</sup>w)x(s)</em>", "one": "<b>目标换成 <code>r + γV̂(s′;w)</code>——<b>既有偏，又是近似的</b>。</b>", "eq": "Δw = α·( r + γV̂(s′;w) − V̂(s;w) )·∇_w V̂(s;w)\n   = α·( r + γ·x(s′)ᵀw − x(s)ᵀw )·x(s)\n\n三层近似：\n  ① 采样   —— 用实际的 s′ 代替对所有 s′ 求期望\n  ② 自举   —— 用 V̂(s′) 代替真实未来回报\n  ③ 函数逼近 —— V̂ 本身装不下真值", "pts": ["<b>课件自己点明「三层近似」，这是本讲第一次把三者并排摆出来。</b><span class='k'>MC 只有①和③，DP 只有②和③，TD 三样全有</span>。<b>这个计数直接预告了 p38 的致命三件套</b>——那里会把「off-policy」补成第四样。", "<b>有一处极易被忽略，但它是整讲的技术核心</b>：目标 <code>r + γx(s′)ᵀw</code> <span class='w'>里面也含 w</span>。<b>严格求梯度的话，这一项也要对 w 求导</b>；<span class='k'>但 TD 把它当成常数处理了</span>。<b>这种做法叫「半梯度」（semi-gradient）——它意味着 TD 的更新不是任何目标函数的真梯度</b>。p43 会把这件事的后果摊开。", "<b>为什么不干脆算真梯度？</b> 可以，那叫残差梯度（residual gradient）法，<span class='k'>它确实收敛</span>，<b>但实测收敛得很慢，而且需要双采样</b>（同一个状态要独立采两次下一状态）。<span class='w'>所以实践里几乎都用半梯度，拿保证换速度。</span>", "<b>但只要还在 on-policy，日子就好过。</b><span class='k'>数据分布稳定在 d(s) 上，接近监督学习的情形</span>，p34 仍然能给出一条（弱一些的）保证。<b>真正的灾难要等到分布开始漂。</b>", "<b>把三层近似各自的「代价形态」分开记，后面读任何算法都能用上这张清单。</b><br><b>① 采样</b>：用实际到达的那一个 <code>s′</code> 代替对所有 <code>s′</code> 求期望。<span class='k'>带来方差，不带来偏差</span>——多采几次就平掉了。<br><b>② 自举</b>：用 <code>V̂(s′)</code> 代替真实未来回报。<span class='w'>带来偏差，而且数据再多也不会自己消失</span>，只有当 <code>V̂</code> 本身变准了它才变小。<br><b>③ 函数逼近</b>：<code>V̂</code> 的函数类可能根本装不下真值。<span class='w'>这一层的误差是结构性的</span>——换多少数据、跑多少轮都在那里。", "<b>三层里只有第①层是「越多数据越好」，另外两层不是。</b><span class='k'>这条区分在实践里极其有用</span>：当你的估计不准时，<b>先判断是哪一层出了问题</b>——方差大（多次运行结果抖）就加数据；系统性偏移（多次运行一致地偏）就要么换函数类，要么减少自举。", "<b>再把本讲前面的内容对进这张清单，MC 和 TD 的全部差异就一目了然了</b>：MC 有①③、没有②，<span class='k'>于是它无偏，于是 p26 给等式</span>；TD 三样全有，<span class='w'>于是它有偏，于是 p34 只能给不等式</span>。<b>第三节会补上第④样（off-policy），那时连不等式都没有了。</b>"], "say": "老师澄清了记号：<b>全课说的 TD 都是 TD(0)</b>。书上还有 TD(λ) 等变体，这里不展开。", "tbl": {"head": ["近似", "来自", "误差类型", "多采数据能治吗", "谁有"], "rows": [["采样", "只看到实际的 s′", "<b>方差</b>", "<span class='k'>能</span>", "MC · TD"], ["自举", "拿 V̂(s′) 当未来", "<b>偏差</b>", "<span class='w'>不能</span>", "TD · DP"], ["函数逼近", "函数类装不下真值", "<b>结构性误差</b>", "<span class='w'>不能</span>", "三者皆有"], ["（第四样）", "off-policy，分布漂移", "<b>可能发散</b>", "<span class='w'>不能</span>", "p38 起"]]}},
{"r": [32, 32], "t": "TD(0) 线性 VFA 算法", "star": 1, "quote": "<b>TD(0) Linear Value Function Approximation for Policy Evaluation</b><br><em>1: Initialize w = 0, k = 1 · 2: loop · 3: Sample tuple (s<sub>k</sub>,a<sub>k</sub>,r<sub>k</sub>,s<sub>k+1</sub>) given π · 4: Update weights: w = w + α(r + γx(s′)<sup>T</sup>w − x(s)<sup>T</sup>w)x(s) · 5: k = k+1</em>", "one": "<b>三行。和 MC 版的唯一差别在第 3–4 行：采的是一条 tuple，不是一个片段。</b>", "eq": "w = 0\n循环：\n  按 π 采一个 (s, a, r, s′)\n  w ← w + α·( r + γ·x(s′)ᵀw − x(s)ᵀw )·x(s)", "pts": ["<b>把它和 p22 的 MC 算法并排看，差别只有两处</b>：<span class='k'>MC 采「一个片段」并等它结束，TD 采「一条转移」立刻就更新</span>；MC 的目标是 <code>G_t</code>，TD 的目标是 <code>r + γx(s′)ᵀw</code>。<b>其余完全一致——这正是第三讲那套对比在函数逼近下的复刻。</b>", "<b>实现上有个坑值得提前说</b>：更新式里 <code>w</code> 出现了三次（两次在目标与预测里，一次是被更新的对象）。<span class='w'>必须先用旧的 w 把整个 Δw 算完，再一次性加上去</span>——<b>边算边改会得到一个完全不同（而且错误）的算法</b>。", "<b>把这个算法和 p27 的批量解析解对照一下，能看出一件事</b>：<span class='w'>TD 没有对应的解析解</span>。原因正是 p29 那条——<b>它不是在最小化任何一个写得出来的目标函数</b>，<span class='k'>所以没有「求导置零」这一步可做</span>。<b>这是 TD 和 MC 在方法论上最深的一条分界。</b>", "<b>有一类折中做法值得知道名字：LSTD（最小二乘 TD）。</b>它通过解一个线性方程组直接求 TD 的不动点，<span class='k'>不需要步长</span>，样本效率也更高，代价是 <code>O(n²)</code> 的内存与 <code>O(n³)</code> 的计算。<b>本讲不展开，但它说明「没有目标函数」不等于「没有不动点」。</b>"]},
{"r": [33, 33], "t": "Baird 例子：TD 走一步", "star": 3, "quote": "<b>Baird Example with TD(0) On Policy Evaluation</b><br><em>TD update: Δw = α(r + γx(s′)<sup>T</sup>w − x(s)<sup>T</sup>w)x(s)</em><br><em>Figure from Sutton and Barto 2018</em>", "one": "<b>同一条 tuple，TD 挪的幅度比 MC 小十倍。</b>", "eq": "同样 x(s1)=[2 0 0 0 0 0 0 1]，w 全 1，α=0.5，γ=0.9\ntuple = (s1, a1, r=0, s7)\n\nV̂(s1) = 3      V̂(s7) = x(s7)ᵀw = 1 + 2 = 3\n\nTD 误差 = 0 + 0.9·3 − 3 = −0.3      （MC 那边是 0 − 3 = −3）", "pts": ["<b>为什么小得多，一句话</b>：MC 认定「从 s1 出发的回报是 0」，和当前估值 3 差了整整 3；TD 只说「下一步是 s7，它现在估 3」，<span class='k'>于是差距只有折扣带来的那一点</span>。", "<b>这正是第三讲「MC 高方差、TD 低方差」在权重空间里的样子。</b><span class='k'>同一条数据，MC 推 10 倍远</span>——<b>推得远意味着对单条数据反应大，也就是方差大。</b>", "<b>但这一页也埋了一个陷阱，值得现在就看出来</b>：TD 误差小，<span class='w'>不代表 TD 更对</span>。此刻 <code>V̂(s1)=V̂(s7)=3</code>，而真值都是 0——<b>TD 之所以觉得「差不多」，是因为它拿一个同样错的估计当了参照</b>。<span class='k'>两个错得一样的数相减，差值当然小。</span><b>这就是自举在估计很差时的典型表现：它会显得很平静。</b>", "<b>把这条和 p44 连起来</b>：那里行为策略不停回到 s1–s6，目标策略却只待在 s7。<span class='w'>于是「s1 和 s7 共享第 8 个权重」这条通道会被反复推动，而推动它的误差又是自举出来的假平静</b>——<b>权重就这样一步步跑到无穷。</b>"], "tbl": {"head": ["", "目标值", "与 V̂(s1)=3 的差", "权重改动量"], "rows": [["MC（p23）", "G = 0", "<b>−3</b>", "第 1 位 −3，第 8 位 −1.5"], ["TD（本页）", "0 + 0.9×3 = 2.7", "<b>−0.3</b>", "<span class='k'>约为 MC 的 1/10</span>"]]}},
{"r": [34, 34], "t": "TD + 线性 VFA 收敛到哪", "star": 3, "quote": "<b>Convergence Guarantees for Linear VFA for Policy Evaluation</b><br><em><b>TD(0) policy evaluation with VFA converges to weights w<sub>TD</sub> which is within a constant factor of the minimum mean squared error possible</b></em><br><em>MSVE(w<sub>TD</sub>) ≤ (1/(1−γ)) min<sub>w</sub> Σ<sub>s∈S</sub> d(s)(V<sup>π</sup>(s) − V̂<sup>π</sup>(s;w))²</em>", "one": "<b>不如 MC，但只差一个常数倍。<span class='k'>注意这里是不等式。</span></b>", "eq": "MSVE(w_TD)  ≤  1/(1−γ) · min_w Σ_s d(s)·( V^π(s) − V̂^π(s;w) )²", "pts": ["<b><code>1/(1−γ)</code> 大致就是有效 horizon。</b>γ=0.9 时是 10，γ=0.99 时是 100，<span class='w'>γ=0.999 时是 1000</span>。<b>所以这个「常数倍」在长 horizon 问题上一点也不小。</b>", "<b>误差被乘上这个因子，<span class='w'>根源是 bootstrap</span>。</b>你把逼近误差一步步往回传，<span class='k'>每传一步它就被累加一次</span>，传了大约 <code>1/(1−γ)</code> 步。<b>MC 不 bootstrap，所以没有这份损失。</b>", "<b>为什么只能给不等式而不是等式</b>：MC 的目标无偏，于是它真的在最小化 MSVE；<span class='w'>TD 最小化的是另一个东西</span>（贝尔曼误差的投影），<b>那个东西的最小点和 MSVE 的最小点不是同一个 w</b>。<span class='k'>这条不等式界的正是两个最小点之间的距离。</span>", "<b>但别据此判 TD 的死刑。</b> 这是<b>最坏情况</b>的界，<span class='k'>实测里 TD 的解往往离 MC 的解很近，而且收敛快得多</span>（p36）。<b>而且逼近误差为 0 时，这个因子乘的是 0</b>——p35 就是在确认这一点。"], "res": {"tag": "推断", "v": "<b>这条界对你的 workflow 有个直接的量化含义，而且结论是乐观的。</b><br>你的 horizon 很短：<span class='k'>k 个决策节点，H ≈ 5–10</span>，而且简报 §4c 建议把随机化节点压到 <b>k = 3–4</b>。episodic 情形下 γ 可取 1，但有效 horizon 由 H 决定而非 γ——<b>对应的放大因子大致是 H，不是 1/(1−γ) 那种上百的量级</b>。<br><b>所以本讲这条「TD 比 MC 差一个常数倍」的坏消息，在你这里相对温和</b>——<span class='k'>这是 FQE 路线在你的问题上比在一般 RL 问题上更可行的一个具体理由</span>，值得在 method 里写明，而不是默认读者知道。<br><span class='w'>但要注意它治不了另一个问题</span>：这条界的前提是 <b>on-policy</b>（误差按产生数据的那个策略的 d 加权）。<b>你是 off-policy，所以这条界对你根本不适用</b>——适用的是 p44 那张「可能发散」的图。<span class='k'>短 horizon 缓解的是偏差累积，不是分布不匹配。</span>", "ref": "课件 p34 原文 · 简报 §4b（H=5~10）· §4c（k 压到 3–4，已核）· 本讲 p44"}},
{"r": [35, 35], "t": "检验题：表格表示时误差是多少", "star": 3, "quote": "<b>Check Your Understanding</b><br><em>If the VFA is a <b>tabular representation</b> (one feature for each state), what is the MSVE for MC and TD?</em>", "one": "<b>两者都是 0。</b>", "pts": ["<b>表格表示 = 每个状态一个特征（one-hot）。</b>这时线性类<span class='k'>装得下真值</span>——把 <code>w_s</code> 设成 <code>V^π(s)</code> 就精确相等，所以 <code>min_w (…) = 0</code>。", "<b>于是两条结论同时塌缩</b>：MC 的 MSVE <b>等于</b>那个 min，所以是 0；TD 的界是 <code>1/(1−γ)</code> 乘以同一个 min，<span class='k'>0 乘以任何常数还是 0</span>。<b>两者都收敛到真值。</b>", "<b>这道题真正的用意是划一条界</b>：<span class='k'>前四讲全是表格情形，所以从来没遇到过「收敛到的不是真值」这件事</span>。<b>本讲所有的新麻烦，都是从「函数类装不下真值」这一刻开始的。</b>", "<b>还可以反过来问一句，答案更有用：什么时候那个常数因子真的咬人？</b><span class='k'>当 <code>min_w</code> 大、而且 γ 接近 1 的时候</span>。<b>也就是：特征不够好 + horizon 很长。</b><span class='w'>这两件事在真实问题里往往同时出现</span>——状态空间大所以特征只能粗糙，任务长所以 γ 接近 1。<b>于是这个在课堂例子里看着无害的因子，在真实系统里可能放大上百倍。</b>"], "tip": {"t": "这题真正的用意", "v": "<b>逼近误差为 0 时，MC 和 TD 收敛到同一处</b>，那个 1/(1−γ) 一点也不吃亏。只有当你的函数类装不下真值时，这个因子才开始咬人。——前四讲全是表格情形，所以从来没遇到过这件事。"}},
{"r": [36, 36], "t": "谁收敛得更快", "star": 2, "quote": "<b>Convergence Rates for Linear VFA for Policy Evaluation</b><br><em>Does TD or MC converge faster to a fixed point?</em> · <em><b>Not (to my knowledge) definitively understood</b></em><br><em>Practically TD learning often converges faster to its fixed value function approximation point</em>", "one": "<b>课件自己承认：不确定。但实践中 TD 往往更快。</b>", "pts": ["<b>注意最后那句话里的限定词：<em>to <span class='k'>its</span> fixed point</em>。</b><span class='w'>TD 收敛得快，是收敛到它自己那个（略差的）不动点快</span>，<b>不是比 MC 更快地逼近真值</b>。两件事混起来就会得出错误的结论。", "<b>把 p34 和这一页合起来，才是完整的取舍</b>：<span class='k'>TD 的终点略差（最多差 1/(1−γ) 倍），但到得快</span>；<b>MC 的终点最优，但走得慢、方差大。</b><span class='w'>样本有限时，走得快往往比终点好更要紧</span>——这和第三讲「MSE = 偏差² + 方差」那条是同一个道理。", "<b>课件用「据我所知没有定论」这种措辞，本身是个信号</b>：<span class='k'>这是个 1997 年就有收敛性结论、但到 2019 年仍没有干净收敛速率结论的问题</span>。<b>遇到这种地方要意识到：实践里的选择只能靠实测，不要指望从理论里读出答案。</b>", "<b>最后给一条实践上的判据，本讲没写但从前面几页能推出来</b>：<span class='k'>数据贵、horizon 短、特征可信 ⇒ 偏向 TD</span>（收敛快、样本省，而那个 1/(1−γ) 因子在短 horizon 下不大）；<br><span class='k'>数据便宜、horizon 长、特征存疑 ⇒ 偏向 MC</span>（无偏、不吃 Markov 假设，而它的方差可以靠数据量压下去）。<br><b>注意这条判据的两端都不是「哪个算法更先进」，而是「你手上缺的是什么」。</b>"], "tbl": {"head": ["你的处境", "偏向", "理由"], "rows": [["数据贵 · horizon 短 · 特征可信", "<b>TD</b>", "收敛快、样本省；1/(1−γ) 在短 horizon 下不大"], ["数据便宜 · horizon 长 · 特征存疑", "<b>MC</b>", "无偏、不吃 Markov 假设；方差可用数据量压"], ["<b>不确定特征好不好</b>", "<span class='k'>先用 MC 当量尺</span>", "它收敛到的就是「这个特征类的上限」"]]}},
{"r": [37, 37], "t": "目录：进入控制，气候要变了", "star": 2, "quote": "<b>Table of Contents</b> — <em>1 Introduction · 2 VFA for Prediction · <b>3 Control using Value Function Approximation</b></em>", "one": "<b>第二节有定理，这一节几乎全是反例。读法要换。</b>", "pts": ["<b>先把第二节的成果清点一遍，因为接下来要逐条失效</b>：<br><span class='k'>MC + 线性 VFA 收敛到最优逼近（等式）</span>；<br><span class='k'>TD + 线性 VFA 收敛到最优逼近的 1/(1−γ) 倍之内（不等式）</span>。<br><b>这两条的前提都是 on-policy——数据来自你正在评估的那个策略。</b>", "<b>控制为什么必然破坏这个前提</b>：做控制就要改策略，<span class='w'>而策略一改，产生数据的分布 d(s) 就跟着变</span>。<b>于是「按 d 加权的误差」里的 d 在你优化它的过程中一直在动</b>——p24 埋下的那句「d 是由策略决定的」，到这里才显出分量。", "<b>这一节只有 13 页，但它是本讲唯一会影响你技术选型的一节。</b><span class='k'>前两节告诉你「能做到多好」，这一节告诉你「什么时候会彻底失败」</span>。<b>工程上后者更要紧。</b>", "<b>一个读法上的建议：这一节的每一页都先问「它在拆哪一条保证」。</b>p38 拆的是「on-policy」这个前提；p43 拆的是「贝尔曼算子是压缩」；p44 拆的是「数据合规就安全」这个直觉。<span class='k'>三页拆的是三件不同的东西，而它们的交集正好是第二节全部定理的立足点</span>。<b>把这三页读成「反例三连」，比逐页记结论有用得多。</b>"]},
{"r": [38, 38], "t": "致命三件套", "star": 3, "quote": "<b>Control using Value Function Approximation</b><br><em>Use value function approximation to represent state-action values Q̂<sup>π</sup>(s,a;w) ≈ Q<sup>π</sup></em><br><em>Interleave: Approximate policy evaluation using VFA · Perform ϵ-greedy policy improvement</em><br><b><em>Can be unstable. Generally involves intersection of the following: Function approximation · Bootstrapping · Off-policy learning</em></b>", "one": "<b>函数逼近 + 自举 + off-policy，<span class='w'>三者凑齐就可能发散</span>。</b>", "eq": "三件套：\n  ① 函数逼近   —— 值写不下，只能拟合\n  ② 自举       —— 目标里含自己的估计\n  ③ off-policy —— 数据来自别的策略\n\n任意两样都安全；三样齐了，就没有收敛保证", "pts": ["<b>最该记住的是「任意两样都安全」这件事</b>，课件没明说但可以从前面推出来：<br><b>①+②，没有③</b> = 本讲第二节的 TD + 线性 VFA ⇒ <span class='k'>收敛（p34）</span>；<br><b>①+③，没有②</b> = off-policy 的 MC ⇒ <span class='k'>收敛</span>（MC 不自举）；<br><b>②+③，没有①</b> = 表格式 Q-learning ⇒ <span class='k'>收敛（第四讲证过）</span>。<br><b>三样齐了才出事。</b>", "<b>做控制为什么必然带上第③样</b>：ε-贪婪意味着你<b>行动时</b>会以 ε 的概率乱走，<span class='w'>而你要评估的是贪婪策略</span>。<b>行为策略和目标策略天生不同</b>——Q-learning 的那个 <code>max</code> 就是这个差异的来源。<span class='k'>所以「做控制」几乎等同于「off-policy」。</span>", "<b>第③样坏在哪，一句话</b>：它<span class='w'>毁掉了那个稳定的 d(s)</span>。前两节所有的误差界都写成「按 d 加权的 MSVE」，<b>而 d 一旦既不稳定又不是你关心的那个分布，这些界就失去了意义</b>。", "<b>Sutton 把这三样叫做 <em>the deadly triad</em>（致命三件套）</b>，出处是 Sutton &amp; Barto 第 11 章。<span class='k'>注意课件在这里用的词是 <em>intersection</em>（交集）而不是「之一」</span>——<b>它要强调的正是「必须同时具备」。</b>"], "tbl": {"head": ["组合", "典型算法", "收敛？", "出处"], "rows": [["① + ②（on-policy）", "TD + 线性 VFA", "<span class='k'>收敛</span>", "本讲 p34"], ["① + ③（不自举）", "off-policy MC / 重要性采样", "<span class='k'>收敛</span>", "L03"], ["② + ③（表格）", "表格式 Q-learning", "<span class='k'>收敛</span>", "L04 p40"], ["<b>① + ② + ③</b>", "<b>Q-learning + VFA</b>", "<span class='w'>可能发散</span>", "<b>本讲 p44</b>"]]}, "res": {"tag": "推断", "v": "<b>这一页是整门课对你的项目最直接的一次警告：FQE 把三条腿全占了。</b><br><b>① 函数逼近</b>：你的状态是 (query 特征, 节点, 部分轨迹)，<span class='k'>必须拟合，不可能查表</span>。✓<br><b>② 自举</b>：FQE 的定义就是用 <code>Q̂(s′,·)</code> 顶替未来。<span class='k'>终局奖励下中间步骤全靠它</span>。✓<br><b>③ off-policy</b>：你的日志来自 AFlow 跑过的固定配置，<span class='k'>目标策略从来没跑过</span>。✓<br><b>三样齐全。所以「FQE 可能不收敛」对你不是小概率的角落情形，而是<span class='w'>默认配置</span>。</b><br><b>这一条该怎么用，有三个落点</b>：<br><b>（甲）不要把 FQE 的输出当定论。</b> 简报 §4d 的穷举 oracle 不是「锦上添花的验证」，<span class='k'>它是唯一能告诉你 FQE 有没有跑飞的东西</span>。<br><b>（乙）监控发散，而不是只看最终数字。</b> 记录 Q̂ 的权重范数与预测值的量级随迭代的变化；<b>发散的征兆是量级单调爆炸</b>，而不是损失不降。<br><b>（丙）这是论文里「我们不主张什么」那一节的现成素材。</b>简报 §7 第 2 拳预判了审稿人会问 bound 的假设——<span class='w'>坦白承认「FQE 在我们的设定下没有收敛保证，所以我们用 oracle 表做校验」，比含糊其辞强得多</span>。", "ref": "课件 p38 原文（intersection of the following）· 简报 §4e（FQE）· §4a（off-policy）· §4d（oracle）· §7 第 2 拳"}},
{"r": [39, 40], "t": "Q 的线性逼近", "star": 2, "quote": "<b>Action-Value Function Approximation with an Oracle</b><br><em>J(w) = E<sub>π</sub>[(Q<sup>π</sup>(s,a) − Q̂<sup>π</sup>(s,a;w))²]</em><br><b>Linear State Action Value Function Approximation</b><br><em>Use features to represent <b>both the state and action</b>: x(s,a) = [x₁(s,a), …, x<sub>n</sub>(s,a)]<sup>T</sup></em><br><em>Q̂(s,a;w) = x(s,a)<sup>T</sup>w</em>", "one": "<b>和 V 的版本逐字对应，只是特征同时编码状态和动作。</b>", "eq": "Q̂(s,a; w) = x(s,a)ᵀw\n\nJ(w) = E_π[ ( Q^π(s,a) − Q̂(s,a;w) )² ]\n\nΔw = α·( Q^π(s,a) − Q̂(s,a;w) )·x(s,a)", "pts": ["<b>两种做法，课件选了后者</b>：<br><b>（甲）每个动作各一套权重</b>：<code>Q̂(s,a) = x(s)ᵀw_a</code>。<span class='w'>动作之间完全不共享</span>，参数量翻 |A| 倍。<br><b>（乙）把动作也编进特征</b>：<code>x(s,a)</code>。<span class='k'>动作之间能共享结构</span>，参数量不随 |A| 增长。<br><b>（乙）在动作多、动作之间有相似性时明显更好</b>；（甲）在动作少且彼此无关时更简单，<b>深度 Q 网络实际用的是（甲）的变体</b>（输出层每个动作一个头）。", "<b>为什么控制必须用 Q 而不能用 V</b>：挑动作要做 <code>arg max_a</code>，<span class='k'>而 V 不带动作这一维</span>。<b>用 V 挑动作需要模型</b>（第二讲 <code>arg max_a [R + γΣPV]</code>），而本讲全程无模型。<b>所以从预测转到控制，V → Q 不是风格选择，是硬性要求。</b>", "<b>一个实践上的提醒：<code>x(s,a)</code> 的构造比 <code>x(s)</code> 难得多。</b>最朴素的做法是把动作 one-hot 后与状态特征做外积，<span class='w'>这会让特征维数乘以 |A|，等于退回做法（甲）</span>。<b>要真正共享，特征必须捕捉「这个动作在这个状态下意味着什么」</b>——<span class='k'>这又回到 p19 那句：特征定了上限就定了。</span>"]},
{"r": [41, 42], "t": "三个算法的 VFA 版", "star": 3, "quote": "<b>Incremental Model-Free Control Approaches</b><br><em>In Monte Carlo methods, use a return G<sub>t</sub> as a substitute target:</em> <em>Δw = α(G<sub>t</sub> − Q̂(s<sub>t</sub>,a<sub>t</sub>;w))∇<sub>w</sub>Q̂</em><br><em>For <b>SARSA</b> instead use a TD target r + γQ̂(s′,a′;w)</em><br><em>For <b>Q-learning</b> instead use a TD target r + γ max<sub>a′</sub> Q̂(s′,a′;w)</em>", "one": "<b>结构完全一样，<b>只换目标值</b>。和第四讲的表格版逐字对应。</b>", "eq": "MC：        Δw = α( G_t − Q̂(s_t,a_t;w) )·∇_w Q̂\nSARSA：     Δw = α( r + γ·Q̂(s′,a′;w) − Q̂(s,a;w) )·∇_w Q̂\nQ-learning：Δw = α( r + γ·max_{a′} Q̂(s′,a′;w) − Q̂(s,a;w) )·∇_w Q̂\n\n线性时 ∇_w Q̂ = x(s,a)", "pts": ["<b>三个目标值对应三种「未来怎么算」</b>：<br><b>MC</b> 用<span class='k'>真实走出来的回报</span>——不自举；<br><b>SARSA</b> 用<span class='k'>实际要做的下一个动作</span>的 Q̂——自举，但仍是 on-policy；<br><b>Q-learning</b> 用<span class='w'>最好的下一个动作</span>的 Q̂——自举，<b>而且是 off-policy</b>。", "<b>那个 <code>max</code> 就是 off-policy 的全部来源，也是三件套第③样的入口。</b><span class='k'>你按 ε-贪婪行动，却用「假设下一步最优」来更新</span>——<b>更新用的那个策略，和产生数据的那个策略不是同一个。</b><span class='w'>p45 那张表里只有 Q-learning 那一格坏掉，原因就在这一个 max 上。</span>", "<b>SARSA 在这张表上的位置值得注意</b>：它自举、也用函数逼近，<span class='k'>但它是 on-policy 的</span>，所以只占三件套的两样。<b>这就是为什么 p45 里 SARSA 在线性 VFA 下仍然（抖着）收敛，而 Q-learning 不。</b><span class='k'>第四讲那个「悬崖漫步里 SARSA 早期更好」的现象，在这里有了第二重、而且更严重的理由。</span>", "<b>唯一新增的符号是 <code>∇_w Q̂</code>，线性时它就是 <code>x(s,a)</code>。</b><span class='k'>换成神经网络时它由反向传播给出</span>——<b>第六讲的 DQN 就是把这一行的 Q̂ 换成卷积网络，其余一字不改。</b>"], "tbl": {"head": ["算法", "目标值", "自举", "on/off-policy", "线性 VFA 下"], "rows": [["MC 控制", "G_t", "<span class='k'>否</span>", "on", "收敛（会抖）"], ["SARSA", "r + γQ̂(s′,a′)", "是", "<span class='k'>on</span>", "收敛（会抖）"], ["Q-learning", "r + γ<b>max</b>Q̂(s′,·)", "是", "<span class='w'>off</span>", "<span class='w'>可能发散</span>"]]}},
{"r": [43, 43], "t": "为什么会出问题：压缩 vs 扩张", "star": 3, "quote": "<b>Convergence of TD Methods with VFA</b><br><em><b>TD with value function approximation is not following the gradient of an objective function</b></em><br><em>Informally, updates involve doing an (approximate) Bellman backup followed by best trying to fit underlying value function to a particular feature representation</em><br><em><b>Bellman operators are contractions, but value function approximation fitting can be an expansion</b></em>", "one": "<b>贝尔曼算子是压缩的，但「把结果投影回可表示的函数空间」这一步可能是扩张的。</b>", "eq": "一步更新其实是两步：\n  ① 做一次（近似的）贝尔曼备份    ← 压缩，系数 γ\n  ② 把结果投影回线性函数空间      ← 可能扩张，系数可以 > 1\n\n两步合起来的系数 = γ × (扩张系数)，未必 < 1", "pts": ["<b>第二讲证过：压缩 ⇒ 唯一不动点 ⇒ 必然收敛。</b><span class='w'>这里第二步把这个保证毁了。</span><b>只要投影的扩张系数大于 <code>1/γ</code>，合成算子就不再是压缩</b>——<span class='k'>此时不动点可以不存在，迭代可以跑到无穷。</span>", "<b>为什么投影会扩张，直觉上说</b>：投影是按某个度量找最近点，<span class='k'>而这个度量由数据分布 d(s) 决定</span>。<b>如果 d 在某些状态上几乎没有权重，投影就「不在乎」那些状态上的误差</b>，<span class='w'>于是可以为了拟合常去的状态，把罕至状态的估值推得非常离谱</span>。<b>而自举又会把那个离谱的值当作目标传回来。</b>", "<b>这解释了为什么 on-policy 时没事</b>：on-policy 下投影所用的 d<span class='k'>恰好就是自举时会访问到的那个分布</span>，<b>「不在乎」的状态也正好是「不会去」的状态，两者对齐</b>。<span class='w'>off-policy 下这个对齐被打破</span>——<b>你在 d_b 上做投影，却要在 d_e 上自举</b>。p44 就是这件事的具体演示。", "<b>另一个等价的说法：TD + VFA 并不是在沿着某个目标函数的梯度走</b>（p29 说的「半梯度」）。<span class='k'>没有目标函数，就没有「下降」可言</span>，<b>于是「更新会不会让事情变好」这个问题根本没有定义</b>。"], "tip": {"t": "想读原始讨论", "v": "Sutton &amp; Barto 第 11 章；早期讨论见 Jeff Gordon 1995 关于 averagers 的论文，那里讲了线性值函数逼近为什么可能是扩张。"}},
{"r": [44, 44], "t": "Baird：off-policy 真的会炸", "star": 3, "quote": "<b>Challenges of Off-Policy Control: Baird Example</b><br><em>Behavior policy and target policy are not identical</em> · <em><b>Value can diverge</b></em>", "one": "<b>权重可以发散到无穷——<span class='w'>而且连数据都是「合规」的。</span></b>", "eq": "目标策略：恒取 a1（实线）\n行为策略：6/7 取 a2，1/7 取 a1\nγ = 0.99\n\n做法：把 a ≠ π(s) 的 tuple 全部丢掉，只留合规的，再跑 TD\n结果：权重发散", "pts": ["<b>这个做法叫「拒绝采样式的 off-policy 修正」，而且它在「动作」这一层是完全正确的</b>——留下来的每条数据，动作都确实是目标策略会选的。<span class='w'>可它还是炸了。</span><b>这说明问题不在「动作对不对」，而在别处。</b>", "<b>根子在状态分布不匹配。</b><br>真按目标策略走：s1 → s7，然后<span class='k'>一直待在 s7</span>——数据几乎全在 s7；<br>按行为策略走：a2 不停把你<span class='k'>传送回 s1–s6</span>——数据几乎全在前六个状态。<br><b>两个分布差得极远</b>，而你是在<b>前者的目标</b>下、用<b>后者的分布</b>做投影。", "<b>把 p33 那条观察接进来，发散的机制就完整了</b>：s1 与 s7 共享第 8 个权重；行为策略反复喂来 s1–s6 的数据，于是第 8 个权重被反复推动；<span class='w'>而推动它的 TD 误差是自举出来的「假平静」</span>（两个同样错的估值相减）。<b>每推一次，两边的估值一起抬高一点，下一次的目标又因此更高</b>——<span class='k'>正反馈，于是跑到无穷。</span>", "<b>最该带走的一句话</b>：<span class='w'>发散不需要恶意的数据，也不需要错误的实现</span>。<b>一个逼近误差为 0 的函数类、一份动作完全合规的数据、一个教科书式的 TD 更新，三者凑在一起照样炸。</b><span class='k'>这就是为什么「致命三件套」被叫做三件套，而不是三个注意事项。</span>"], "res": {"tag": "推断", "v": "<b>这一页描述的「做法」，几乎就是你手上日志的处境，只是更乐观一点。</b><br>课件的做法是：<em>把 a ≠ π(s) 的 tuple 全部丢掉</em>。<span class='k'>这正是简报 §4b 说的「WIS 在确定性目标下精确退化为拒绝采样」</span>——字面上就是「留下碰巧和你的策略一致的那些」。<br><b>而你的处境更差一层</b>：Baird 例子里行为策略<b>有</b> 1/7 的概率取 a1，所以还留得下一些数据；<span class='w'>你的日志 π_b(a|h) ∈ {0,1}，凡是目标策略与已跑配置不同的节点，一条都留不下</span>（§4a 的 deficient support）。<br><b>所以这一页对你的教训是双重的</b>：<br><b>（甲）就算你随机化了日志、拿到了合规数据，也不等于安全</b>——<span class='k'>Baird 的数据全部合规，照样发散</span>。动作对齐只解决了重要性权重有没有定义，<b>没解决状态分布对不对</b>。<br><b>（乙）简报 §4c 那条「先把随机化节点压到 k=3–4」除了提 ESS，还有这一层好处</b>：<span class='k'>k 越小，目标策略与行为策略能产生的状态分布差距越小</span>，<b>投影与自举所用的分布越接近对齐</b>。<span class='w'>这是降低发散风险的结构性手段，比调学习率可靠得多。</span>", "ref": "课件 p44 原文 · 简报 §4a（deficient support）· §4b（WIS 退化为拒绝采样，已核）· §4c（k 压到 3–4，已核）· 本讲 p33"}},
{"r": [45, 45], "t": "收敛性总表", "star": 3, "quote": "<b>Convergence of Control Methods with VFA</b><br><em>Algorithm | Tabular | Linear VFA | Nonlinear VFA</em><br><em>Monte-Carlo Control · Sarsa · Q-learning</em>", "one": "<b>表格全绿；线性能抖着收；<b>Q-learning 在线性下就可能发散</b>；非线性基本没保证。</b>", "eq": "                 表格      线性 VFA        非线性 VFA\nMC 控制          收敛      收敛（会抖）     基本没保证\nSARSA            收敛      收敛（会抖）     基本没保证\nQ-learning       收敛      可能发散         基本没保证", "pts": ["<b>「会抖」（chatter）和「发散」要分清，这是读这张表最容易混的一处。</b><br><span class='k'>抖</span>：基本收敛，但会在最优附近<b>来回振荡、不完全停下来</b>——原因是策略改进这一步是离散的（ε-贪婪的 arg max 会跳变），值估计的微小变化能让策略翻转。<br><span class='w'>发散</span>：<b>权重的量级炸到无穷</b>，完全不是「在附近晃」。", "<b>横着读，纵着读，结论不同</b>：<br>横着看一行 ⇒ <span class='k'>表达力越强，保证越弱</span>（这是 p8 那条谱的直接后果）；<br>纵着看一列 ⇒ <span class='w'>off-policy 的那个算法单独坏掉</span>。<br><b>前者是程度问题，后者是性质问题。</b>", "<b>最后一列「基本没保证」要正确理解</b>：<span class='k'>它不等于「一定不行」</span>——<b>DQN 就在非线性那一列里，而且管用</b>。它只是说<b>没有定理替你兜底</b>，所以第六讲才要靠经验回放和固定目标这类<span class='w'>工程手段</span>去换稳定性，而那些手段<b>同样没有收敛保证</b>（第六讲明说过）。"], "tbl": {"head": ["算法", "表格", "线性 VFA", "非线性 VFA", "坏在哪"], "rows": [["MC 控制", "<span class='k'>收敛</span>", "收敛（会抖）", "基本没保证", "—"], ["SARSA", "<span class='k'>收敛</span>", "收敛（会抖）", "基本没保证", "—"], ["Q-learning", "<span class='k'>收敛</span>", "<span class='w'>可能发散</span>", "基本没保证", "<b>那个 max ⇒ off-policy</b>"]]}},
{"r": [46, 46], "t": "这是个活跃的研究方向", "star": 2, "quote": "<b>Hot Topic: Off-Policy Function Approximation Convergence</b><br><em>Extensive work in better TD-style algorithms with VFA, some with convergence guarantees: see Chp 11 S&amp;B</em><br><em>Exciting recent work on <b>batch RL</b> that can converge with nonlinear VFA (Dai et al. ICML 2018): uses primal dual optimization</em><br><em><b>An important issue is not just whether the algorithm converges, but what solution it converges to</b></em><br><em>Critical choices: objective function and feature representation</em>", "one": "<b>有带收敛保证的 TD 类算法了；但<b>更要紧的问题是「收敛到什么」</b>。</b>", "pts": ["<b>课件这句话值得抄下来：<em>not just whether the algorithm converges, but what solution it converges to</em>。</b><span class='k'>收敛但逼近得很烂，一样没用</span>。<b>一个收敛到常数函数的算法是完美稳定的，也是完全无用的。</b>", "<b>两个关键选择：目标函数、特征表示。</b><span class='k'>这两样都不在算法里</span>——<b>它们是你在跑算法之前就定死的东西</b>，而本讲所有的定理都只管算法那一段。<span class='w'>这意味着「用了有收敛保证的算法」并不能让你免于想清楚这两件事。</span>", "<b>那条「批量 RL 在非线性下也能收敛」（Dai et al. ICML 2018，用原始–对偶优化）对你格外相关</b>：<span class='k'>批量正是你的设定</span>——数据固定、不能重新采。<b>这是本讲唯一一条明确指向「你这种处境有专门的办法」的线索。</b>", "<b>顺带一提，这一页也是全课少数几处明确说「这是开放问题」的地方。</b><span class='w'>遇到这种标记要当成信号</span>：它意味着你在这一块上<b>不能指望从教材里读到现成答案</b>，只能靠实测和文献跟踪。"]},
{"r": [47, 47], "t": "那张几何图", "star": 2, "quote": "<b>Linear Value Function Approximation</b><br><em>Figure from Sutton and Barto 2018</em>", "one": "<b>一个平面代表「线性类能表示的所有值函数」，贝尔曼备份把你顶出平面，投影再把你拉回来。</b>", "pts": ["<b>这张图把 p43 那两步画成了几何</b>：你在平面上的某点 <code>V̂</code>，做一次贝尔曼备份 <code>BV̂</code> <span class='w'>一般会落在平面外</span>（因为真实的贝尔曼备份结果未必是线性可表示的），<b>然后投影 Π 把它拉回平面</b>。TD 的不动点就是 <code>ΠB</code> 的不动点。", "<b>图上好几段不同的距离，对应好几种不同的误差，也就是好几个可选的目标函数</b>：<br><b>到真值 V^π 的距离</b> ⇒ 均方值误差（MSVE），本讲全程用的就是它；<br><b>到 BV̂ 的距离</b> ⇒ 贝尔曼误差；<br><b>投影后与投影前的差</b> ⇒ 投影贝尔曼误差（TD 实际在压的那个）。", "<b>这一讲只用了其中一个（均方值误差）；<span class='w'>它未必是最好的那个</span></b>——<b>误差最小的逼近器，不一定是在真实问题上表现最好的那个</b>。<span class='k'>因为你最终要的是好策略，而不是好估值</span>，而值函数上一点点误差落在 arg max 上可能毫无影响，也可能彻底翻转。"]},
{"r": [48, 49], "t": "这一讲你该掌握什么", "star": 2, "quote": "<b>What You Should Understand</b><br><em>Be able to implement TD(0) and MC on policy evaluation with linear VFA</em><br><em>Be able to define what TD(0) and MC on policy evaluation with linear VFA are <b>converging to</b> and when this solution has 0 error and non-zero error</em><br><em>Be able to implement Q-learning and SARSA and MC control algorithms</em><br><em><b>List the 3 issues that can cause instability</b>: function approximation, bootstrapping and off-policy learning</em>", "one": "<b>课件自己给的清单，四条里有两条是「说得清」而不是「会实现」。</b>", "pts": ["<b>第二条和第四条才是这一讲的真正产出。</b><span class='k'>实现 TD 和 MC 的线性版本是第三讲的延伸，不难</span>；<b>难的是说清「它收敛到什么」以及「什么时候误差为 0」</b>——<span class='w'>那要求你同时记住 d(s)、min_w、以及 1/(1−γ) 这三样东西的角色。</span>", "<b>一张自检表，离开这一讲前逐条过</b>：<br>① 能说出 MC 与 TD 在线性 VFA 下各自收敛到什么吗？（等式 vs 不等式）<br>② 能说出什么时候两者的误差都是 0 吗？（函数类装得下真值）<br>③ 能说出致命三件套是哪三样、并举出「只占两样所以安全」的例子吗？<br>④ 能解释为什么 Q-learning 在线性 VFA 下单独坏掉吗？（那个 max）<br><span class='k'>这四问覆盖本讲全部承重内容。</span>", "<b>下一讲：深度强化学习。</b><span class='w'>注意它做的事情正好是本讲说「基本没保证」的那一列</span>——<b>DQN 把 Q̂ 换成卷积网络，三件套一样不少</b>。<span class='k'>所以第六讲的经验回放和固定 Q 目标，读的时候要当成「对这一讲三件套的两个工程对策」来读</span>，而不是两个孤立的技巧。"], "res": {"tag": "推断", "v": "<b>整讲落到你项目上，是三条可直接写进方法节的话。</b><br><b>① 成本那一半不受本讲约束。</b> p27 明确标注 <em>not making any Markov assumptions</em>，解析解存在、不自举、不需要分布假设——<span class='k'>它是监督回归，不是策略评估</span>。简报 §4e 的拆分在这里拿到了理论依据。<br><b>② 准确率那一半踩满三件套。</b> FQE = 函数逼近 + 自举 + off-policy，<span class='w'>没有任何收敛保证</span>。<b>所以 oracle 表（§4d）不是可选的验证步骤，是必需的量尺</b>；而「监控权重范数是否爆炸」应当作为训练日志的固定一项。<br><b>③ 降低风险的结构性手段是减小 k，不是调超参。</b> p44 说明了发散的根源是行为策略与目标策略的状态分布差距；<span class='k'>§4c 把随机化节点压到 3–4，同时压小了这个差距</span>。<br><b>一条可写进 limitation 的话</b>：<em>我们采用 FQE 估计准确率分量，但在我们的设定（函数逼近 + 自举 + off-policy 日志）下该估计量不具备收敛保证；因此所有 FQE 结果均以枚举 oracle 表为基准做了校验。</em><span class='k'>这正是简报 §7 第 2 拳建议的「写一小节说明我们不主张什么」。</span>", "ref": "课件 p48 原文 · 简报 §4d §4e（已核）· §4c · §7 第 2 拳 · 本讲 p27 p38 p44"}}
];

var TH = {"title": "L05 接上课题的哪一段：你选的估计量，三条腿全踩在雷上", "arc": "<b>这一讲的 p38 用一句话给了你一张风险清单</b>：<em>Can be unstable. Generally involves <b>intersection</b> of the following: Function approximation · Bootstrapping · Off-policy learning</em>。注意课件用的词是 <b>intersection</b>（交集）——<span class='k'>三样必须同时具备才出事，任意两样都有收敛保证</span>。<br><br><b>把 FQE 对着这三条打勾，三条全中。</b><br><b>① 函数逼近</b>：状态是 (query 特征, 节点 id, 部分轨迹)，查表不可能。<br><b>② 自举</b>：FQE 的定义就是用 <code>Q̂(s′,·)</code> 顶替未来；<span class='w'>终局奖励下中间节点 r≡0，整条信号全靠自举往回爬</span>。<br><b>③ off-policy</b>：日志来自 AFlow 跑过的固定配置，目标策略从未跑过。<br><br><b>所以「FQE 可能不收敛」对你不是角落情形，是默认配置。</b>这不是劝你别用 FQE——简报 §4e 推荐它是对的，终局奖励下你几乎没有别的选择。<span class='k'>这是在说：用它就必须配一把量尺</span>，而那把量尺就是 §4d 的穷举 oracle 表。<br><br><b>这一讲还顺带给了另一半一个干净的理论依据。</b> p27 的批量 MC 解析解<code>w = (XᵀX)⁻¹XᵀG</code> 旁边印着一行小字：<em>not making any Markov assumptions</em>。<b>成本那一半正是这个形状</b>——不自举、不需要分布假设、解析可解。<span class='k'>§4e 把 G 拆成两半分别估，不只是方差上的改进：它把一半的工作从「有前提的策略评估」搬进了「无前提的监督回归」。</span><b>这句话可以原样写进 method 一节。</b>", "pitfalls": [{"v": "<b>以为「随机化了日志、动作对齐了」就安全。</b> p44 的 Baird 例子把不合规的 tuple <span class='k'>全部丢掉</span>，留下的每条数据动作都合规，<span class='w'>照样发散</span>。动作对齐只解决了重要性权重有没有定义，<b>没解决状态分布对不对</b>。", "tag": "推断", "ref": "课件 p44 · 简报 §4a"}, {"v": "<b>把 FQE 的损失下降当成「它在收敛」。</b> p43 说得很直接：<em>TD with VFA is not following the gradient of an objective function</em>。<span class='w'>没有目标函数，损失曲线就不是收敛的证据</span>。<b>该监控的是权重范数与预测值的量级</b>——发散的征兆是量级单调爆炸，不是损失不降。", "tag": "推断", "ref": "课件 p43 · p29（半梯度）"}, {"v": "<b>用「我们用了带收敛保证的算法」来回避特征问题。</b> p46 的原话是<em>not just whether the algorithm converges, but what solution it converges to</em>，而两个关键选择是<b>目标函数</b>与<b>特征表示</b>——<span class='k'>它们都不在算法里</span>。收敛到一个烂逼近和不收敛，对你同样没用。", "tag": "已核", "ref": "课件 p46 原文"}, {"v": "<b>以为短 horizon 能抵消 off-policy 的风险。</b> p34 那条 <code>1/(1−γ)</code> 的放大因子确实因为你 H≈5–10 而温和，<span class='w'>但那条界的前提是 on-policy</span>。<b>短 horizon 缓解的是偏差累积，不是分布不匹配</b>——后者对应的是 p44 那张发散图。", "tag": "推断", "ref": "课件 p34 p44 · 简报 §4b"}, {"v": "<b>在成本那一半上也堆重要性权重。</b> 成本给定保真度与输入长度近乎确定，<span class='k'>它根本不是策略评估问题</span>。按 p27 的形式直接回归即可，<b>加权只会给一个本来无噪声的回归平白添方差</b>。", "tag": "已核", "ref": "课件 p27（not making any Markov assumptions）· 简报 §4e"}], "ammo": [{"q": "你们用 FQE，可它有收敛保证吗？", "a": "<b>没有，我们明确不主张有。</b>我们的设定同时具备函数逼近、自举与 off-policy 日志，正是 Sutton 所说的 deadly triad（CS234 L05 p38 的 <em>intersection</em> 三条）。<span class='k'>因此我们不把 FQE 的输出当作结论，而是以留出集上的枚举 oracle 表为基准做校验</span>，并在训练日志中监控权重范数以检测发散。", "tag": "推断", "ref": "课件 p38 p43 · 简报 §4d §7 第 2 拳"}, {"q": "成本那一半为什么不需要 OPE 的那一套？", "a": "因为给定保真度与输入长度，token 成本近乎确定，<b>它是监督回归不是策略评估</b>。这一点有现成的理论依据：批量蒙特卡洛的最小二乘解<span class='k'>不作任何 Markov 假设</span>，解析可得。<b>所以把 G = Acc − λ·Cost 拆成两半分别估，是把一半工作搬出了假设依赖区。</b>", "tag": "已核", "ref": "课件 p27 · 简报 §4e"}, {"q": "你们怎么降低 FQE 跑飞的风险？", "a": "<b>结构性手段，不是调超参。</b>发散的根源是行为策略与目标策略的状态分布差距（p44）。我们按敏感度扫描把随机化决策节点压到 k=3–4，<span class='k'>这同时提升 ESS 并压小两个分布的差距</span>，比调学习率可靠得多。", "tag": "推断", "ref": "课件 p44 · 简报 §4c"}], "papers": [{"t": "Tsitsiklis &amp; Van Roy — An Analysis of Temporal-Difference Learning with Function Approximation", "id": "IEEE TAC 1997", "why": "本讲 p25 与 p34 两条结论的同一个出处：MC 收敛到最小 MSVE（等式），TD 收敛到它的 1/(1−γ) 倍之内（不等式）。<b>你需要它来说明「为什么 on-policy 的保证不能搬到你的 off-policy 设定」</b>——两条结论的前提都写在同一篇里。"}, {"t": "Sutton &amp; Barto — Reinforcement Learning: An Introduction, 第 11 章", "id": "2018, 2nd ed.", "why": "deadly triad 的正式处理，以及带收敛保证的 gradient-TD 系列算法。<b>本讲 p43、p46 两次指过去而不展开</b>；你写 limitation 一节时需要引它，而不是只引课件。"}, {"t": "Dai et al. — SBEED / Learning from Conditional Distributions via Dual Embeddings", "id": "ICML 2018", "why": "本讲 p46 点名的那条线：<b>批量 RL 在非线性 VFA 下可收敛</b>，用原始–对偶优化。<span class='k'>批量正是你的设定</span>——数据固定、不能重采。这是本讲唯一一条明确指向「你这种处境有专门办法」的线索，值得读方法节。"}, {"t": "Baird — Residual Algorithms: Reinforcement Learning with Function Approximation", "id": "ICML 1995", "why": "p23/p33/p44 那个反例的原始出处，也是「残差梯度法」的提出处。<b>它给出了「算真梯度确实收敛但很慢、且需要双采样」这个取舍</b>——若你想论证为何仍用半梯度的 FQE，这是该引的那一篇。"}, {"t": "Gordon — Stable Function Approximation in Dynamic Programming", "id": "ICML 1995", "why": "p43「投影可能是扩张」的早期讨论（averagers）。<b>它刻画了哪一类函数逼近器能保证不扩张</b>（如最近邻、核平均），若你愿意用表达力换稳定性，这是起点。"}]};

    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      var nf=frame.cloneNode(false); nf.removeAttribute("src");
      frame.parentNode.replaceChild(nf,frame); frame=nf;
      frame.src=SRC+HASH;
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
