{"r": [48, 50], "t": "第四条路：确定性等价", "star": 3, "quote": "<b>Alternative: Certainty Equivalence V<sup>π</sup> MLE MDP Model Estimates</b><br><em>Model-based option for policy evaluation without true models</em><br>After each (s,a,r,s′): recompute MLE MDP model · <em>P̂(s′|s,a) = (1/N(s,a)) Σ 1(···)</em> · <em>r̂(s,a) = (1/N(s,a)) Σ 1(···)r</em> · then compute V<sup>π</sup> using MLE MDP<br>p50: <em>r̂ = [1 0 0 0 0 0 0], p̂(terminate|s₁,a₁) = p̂(s₁|s₂,a₁) = p̂(s₂|s₃,a₁) = 1, <b>V = [1 1 1 0 0 0 0]</b></em>", "one": "<b>第四条路：用数据估出一个 MDP，然后把它当真的，在上面做 DP。</b>", "pts": ["<b>名字的意思就是「把估计出来的东西当成确定的」</b>——你估出 P̂ 和 r̂ 之后，<span class='w'>不再考虑它们本身的不确定性</span>，直接拿去精确求解。这个「假装它是真的」正是它的名字由来，也是它的主要风险。", "<b>它在 p39 那张表上的位置很特别：它是 model-based 的，但不需要真实模型。</b> 所以它既不是 DP（DP 要真模型），也不是 MC/TD（那两个是 model-free）。<b>课件把它放在最后，是因为它在数据效率上通常最好。</b>", "<b>火星车上它给 [1 1 1 0 0 0 0]，和 MC 一样</b>，但<span class='k'>理由完全不同</span>：MC 是因为真的观察到了那些回报；确定性等价是因为它从一条轨迹里估出了 <code>p̂(s₂|s₃,a₁)=1</code> 这样的转移，然后<b>精确地把信息传遍全链</b>。<b>一遍数据，效果和跑很多遍 TD 一样。</b>", "<b>和批量 TD 的关系值得点明</b>：p46 说批量 TD(0) 收敛到「MLE 模型上做 DP 的值」——<span class='k'>那正是确定性等价的定义</span>。所以<b>确定性等价 = 批量 TD 的收敛目标，只是直接算出来而不是迭代逼近</b>。", "<b>代价是计算与存储</b>：要维护 <code>N(s,a)</code>、<code>P̂</code>、<code>r̂</code>，而 P̂ 的大小是 |S|²|A|。每来一个数据点就重算一次 DP 更是昂贵——<span class='w'>这是整讲里计算效率最差的方法</span>。", "⚠️ <b>它继承了 L01 p59 那句警告：model may be wrong。</b> 数据少时 P̂ 会很不准，而确定性等价对此<b>毫无防备</b>——它把一个噪声很大的估计当成了真值。L13 的 PAC 方法与 L16 的模型误差复合都在处理这件事。"], "tbl": {"head": ["", "怎么得到 V", "数据效率", "计算效率", "风险"], "rows": [["MC", "平均观察到的回报", "中", "O(L)/回合", "方差大"], ["TD(0)", "一步自举，迭代", "<b>低</b>（用一次就丢）", "O(L)/回合", "有偏 · 函数逼近下可能发散"], ["批量 TD", "反复喂同一批数据", "高", "高", "收敛到 MLE 模型的解"], ["<b>确定性等价</b>", "<b>估出 MDP 再精确求解</b>", "<b>高</b>", "<span class='w'>最差</span>", "<b>把噪声模型当真值</b>"]]}, "say": "讲稿最后一段她专门提了一句：<em>I encourage you to think about how you would compute these sort of models — it's called certainty equivalence … take your data, compute your estimated dynamics and reward model, and then do dynamic programming with that, and that <b>often can be much more data efficient</b> than these other methods.</em><b>这是她在这一讲结束前留下的最后一条建议。</b>", "res": {"tag": "推断", "v": "<b>你的成本模型就是确定性等价，而且是它最顺利的那种情形。</b><br>流程一模一样：用日志估一个模型（给定保真度与输入长度 → token 成本），然后<b>不再考虑它的不确定性</b>，直接拿去精确求值。<br><span class='k'>而这一页列的主要风险在成本这一半几乎不存在</span>：确定性等价怕的是「P̂ 噪声大却被当成真值」，但你的成本关系<b>近乎确定性</b>（预期 R² &gt; 0.95），估计误差本来就小。<b>所以这条路在成本上是安全的，在准确率上才是危险的</b> —— 准确率的「模型」（Q̂）噪声大得多。<br>这给了「两半分开」第三个理由，而且现在三个理由指向同一个结论：<br>① 可学性差一个数量级（§4e）<br>② 只有准确率那一半暴露在致命三件套下（p41）<br>③ <b>确定性等价的核心风险只打中准确率那一半</b>（本页）<br><b>还有一个具体做法可以借</b>：课件的 MLE 公式是逐 (s,a) 计数平均。你的成本模型可以做得更好 —— 不必按节点分桶，<b>直接回归</b>（保真度 × 输入长度 → 成本），因为成本有参数化的结构而转移概率没有。<span class='w'>这是你比课件这一页更有利的地方，值得在论文里说明</span>。<br>标【推断】：这整段对应是我做的；成本模型的 R² 预期与两半拆分在简报里是【已核】。", "ref": "课件 p48–p50 原文 · 简报 §4e（已核）· L01 p59「model may be wrong」（原课）"}},
{"r": [51, 51], "t": "比较维度：补上第四条", "star": 2, "quote": "<b>Some Important Properties to Evaluate Policy Evaluation Algorithms</b> — <b><em>Robustness to Markov assumption</em></b> · <em>Bias/variance characteristics</em> · <em>Data efficiency</em> · <em>Computational efficiency</em>", "one": "<b>和 p40 同一张清单，但最前面加了一条：对 Markov 假设的稳健性。</b>", "pts": ["<b>这一条是 AB 例子之后才加上去的，而且被放在了第一位。</b> <span class='k'>顺序变化本身就是结论</span>——看过 V(A) 那 0 与 0.75 的分歧之后，「这个方法在 Markov 假设不成立时会怎样」就不再是技术细节，而是首要问题。", "<b>四条标准对应四种失败方式</b>：Markov 假设不成立 → 收敛到错的东西（TD）；偏差方差差 → 估不准；数据效率低 → 数据不够用；计算效率低 → 跑不动。<b>前两条关乎对不对，后两条关乎做不做得到。</b>", "<b>按这四条给三个方法打分，没有赢家</b>：MC 稳健但方差大；TD 方差小但不稳健；确定性等价数据效率高但计算最贵且把噪声当真值。<span class='w'>选哪个取决于你最怕哪种失败</span>。", "<b>新加的那条排在第一位，不是排在最后。</b> 课件把 <em>Robustness to Markov assumption</em> 放在偏差方差、数据效率、计算效率<b>之前</b>。<span class='k'>这个顺序是有主张的</span>：假设不成立时，后面三条讨论的都是「一个错答案算得多快多省」。"], "res": {"tag": "已核", "v": "<b>这条维度对你不是理论顾虑，是已经写进计划的一个实验。</b><br>简报 §5 的 <b>P2 vs P3 消融</b>：策略只看 <code>(query, 节点 id)</code>，还是也看部分轨迹？<span class='k'>若序贯信息带来的提升不到 2 个百分点，就不要用 MDP 框架</span>。配套的<b>可加性检验</b>是比较 <code>Σ_h Δ_h^down</code> 与 <code>Acc(全强) − Acc(全弱)</code>——在置信区间内一致，就说明节点效应近似可加，<b>这个问题实质上不是 MDP，而是「每节点代价敏感选择」</b>。<br><b>这一页给了你一个把实验写进论文的角度</b>：那不是「我们检查了一下假设」，而是<span class='w'>「我们先确定这条维度上站在哪一边，再去挑估计量」</span>。简报 §7 第一拳问的正是「为什么是 MDP 而不是 H 个独立决策」，<b>而这张四条维度的表就是回答的框架</b>。", "ref": "课件 p51 原文 · 简报 §5（可加性检验与 P2/P3 消融，已核）· §7 第 1 拳"}},
{"r": [52, 53], "t": "小结与路线图", "star": 1, "quote": "<b>Summary: Policy Evaluation</b> — Dynamic Programming · Monte Carlo policy evaluation（<em>given on policy samples</em> / <em><b>given off policy samples</b></em>）· Temporal Difference (TD) · Metrics to evaluate and compare algorithms", "one": "<b>小结页在 MC 那一支下面分出了两条：on-policy 与 off-policy。后者就是接下来九页的内容。</b>", "pts": ["<b>注意这张清单比 p3 和 p30 多了一行</b>：<em>Given off policy samples</em>。<span class='k'>它是在这里才被补进清单的</span>——前面三次出现时都没有。", "<b>off-policy 挂在 MC 那一支下面，不是独立的一支。</b> 这个归类是对的：重要性采样<b>就是</b>蒙特卡洛，只不过把等权平均换成加权平均（p29 的原话是 <em>reweighted empirical average</em>）。", "⚠️ <b>接下来九页（p54–p62）讲座没有讲到。</b> 讲稿在 AB 例子与确定性等价之后就结束了，最后一句是 <em>next time we'll start to talk a little bit about control</em>。<b>所以这张小结页实际上是讲座的终点，而不是中点。</b>", "<b>整讲收束成一句话</b>：无模型的策略评估有三条路——<b>直接平均</b>（MC）、<b>一步自举</b>（TD）、<b>先估模型再规划</b>（确定性等价）。<span class='k'>三条路的分歧不在算法形式，在对世界的假设强弱</span>：MC 什么都不假设；TD 假设 Markov 性；确定性等价把这个假设显式写成一个模型。", "<b>再往回看，会发现本讲其实只讲了一件事的两面。</b>正面是 p18 那条分解 <code>V(s) = R(s) + γΣP(s′|s)V(s′)</code>——<b>Markov 性让值函数可以递归地拆开</b>；反面是 p46 的 AB 例子——<span class='w'>这条分解一旦不成立，用它的方法会收敛到一个自信的错答案</span>。<b>所有的偏差/方差讨论，都是在这条分解的「用」与「不用」之间取舍。</b>", "<b>一张自检表，离开这一讲前值得逐条过</b>：① 能不能说出 MC 与 TD 各自不需要什么假设？② 能不能解释为什么只有 MC 不怕非 Markov？③ 能不能手算 AB 例子的两个答案并说出分歧来自哪？④ 能不能说出批量 TD(0) 收敛到的到底是什么？<span class='k'>这四问覆盖了本讲全部的承重内容</span>。"], "tbl": {"head": ["", "蒙特卡洛", "时序差分", "确定性等价"], "rows": [["怎么估", "平均真实回报", "一步奖励 + 自举", "先估 P̂ 和 r̂，再做 DP"], ["假设了什么", "<b>什么都不假设</b>", "Markov 性", "<b>Markov 性（显式写成模型）</b>"], ["偏差 / 方差", "无偏 · 高方差", "<b>有偏 · 低方差</b>", "有偏 · 低方差"], ["批量下收敛到", "最小均方误差解", "<b>极大似然 MDP 的 DP 解</b>", "同左（就是它本身）"], ["数据效率", "中", "低（朴素）/ 高（批量）", "<b>最高</b>"], ["计算代价", "低", "低", "<b>高（每步重估模型）</b>"]]}, "res": {"tag": "推断", "v": "<b>整讲落到你项目上，是三句话。</b><br><b>① 你的处境是批量 off-policy</b>（p43 + p54 起那一段）：数据固定、不能重跑、目标策略没跑过。<span class='w'>而讲座在这里就结束了，p54–p62 只有课件没有讲解</span>——也就是说，<b>这门课把你的问题陈述摆出来了，却没有给解法</b>。<br><b>② 该用哪条路，取决于一个还没做的实验</b>（p37–p39 + p51）：Markov 性成立 ⇒ TD 路线（FQE）能借到别处的数据；不成立 ⇒ 只能走 MC 路线。<span class='k'>P2/P3 消融与可加性检验必须排在估计量选择之前</span>。<br><b>③ 两半要分开估</b>（p41 + 简报 §4e）：成本那一半是监督回归，<b>和这一讲讲的全部内容都无关</b>；准确率那一半才是策略评估问题。<span class='w'>把它们混在一个估计量里，是在给本来不需要重要性权重的那一半平白添方差。</span><br><b>下一讲（L04）讲的是控制</b>——先把评估弄明白是对的顺序，因为<span class='k'>你的项目现阶段要的就是评估，不是控制</span>：你要的是「不重跑就知道新配置好不好」，不是「在线学一个策略」。", "ref": "课件 p52–p53 原文 · 简报 §4a §4c §4e（已核）· §5（可加性检验）"}},
{"r": [54, 54], "t": "为什么需要 off-policy 评估", "star": 3, "quote": "<b>MC Off-Policy Evaluation</b> — <em>Sometimes trying actions out is costly or high stakes</em> · <em>Would like to use <b>old data</b> about policy decisions and their outcomes to estimate the potential value of an <b>alternate policy</b></em>", "one": "<b>有时候「试一下」代价太高或赌注太大。于是想用旧数据——别的策略跑出来的——去估一个还没跑过的策略值多少。</b>", "pts": ["<b>这一页是整段的问题陈述，两句话各管一件事。</b> 「costly or high stakes」说的是<span class='k'>为什么不能直接试</span>；「use old data to estimate an alternate policy」说的是<span class='k'>那要怎么办</span>。", "<b>注意措辞是 <em>potential</em> value</b>——你要估的是一个<b>还没发生过的</b>策略的值。这和前面 53 页做的事根本不同：前面是「我跑了这个策略，它值多少」，这里是「我没跑过它，但我想知道它值多少」。", "<b>「高赌注」在哪些领域是字面意思</b>：医疗（换一套用药方案不能先在病人身上试）、金融（新策略先上线会真亏钱）、教育（一届学生只有一次）。L01 p11–p12 那两页应用正是这几个。", "⚠️ <b>这一页开始，本讲进入一个讲座实际没讲到的区段。</b> 讲稿里她说过 <em>we're gonna talk about important sampling at the end of class if we have time, otherwise we'll probably end up pushing that towards later</em>——结果讲稿在 AB 例子之后就结束了，<b>全文 13350 词里 importance sampling 出现 0 次</b>。所以 p54–p62 只有课件，没有讲解。本精读对这一段全部标【补课】。"], "tbl": {"head": ["", "p1–p53（已讲）", "p54–p62（本段）"], "rows": [["要估谁的值", "<b>你正在跑的那个策略</b>", "<b>另一个还没跑过的策略</b>"], ["数据来自", "同一个策略", "<b>行为策略 π₂</b>"], ["叫什么", "on-policy 评估", "<b>off-policy 评估</b>"], ["讲座讲了吗", "讲了", "<span class='w'>没讲</span>（讲稿 0 次提及）"]]}, "tip": {"t": "补课", "v": "这一段的全部讲解都是补的——课件有，讲座没讲。好在 <b>L15（批量离线强化学习）整讲都在做这件事</b>，而且那是 Brunskill 自己的研究讲座。<b>这 9 页可以当作 L15 的提纲来读。</b>"}, "res": {"tag": "已核", "v": "<b>这一页是你的问题陈述，几乎一字不差。</b><br>「trying actions out is costly」——你每跑一次完整的 workflow 配置都要真实的 LLM 调用；72B 那一档尤其贵。<br>「use <b>old data</b> about policy decisions and their outcomes」——你的 AFlow 运行日志，记了每个节点用了哪个模型、结果如何。<br>「estimate the potential value of an <b>alternate policy</b>」——一套新的节点级保真度分配，<b>在把它跑一遍之前</b>就想知道 Acc 和 Cost。<br>所以你的课题不是「RL 的一个应用」，它<span class='k'>就是这一页定义的那个问题</span>。<br><b>但下一页会给出一个条件，而你的日志不满足它。</b>", "ref": "课件 p54 原文 · 简报 §4a"}},
{"r": [55, 55], "t": "形式化，以及那个从未兑现的承诺", "star": 3, "quote": "<b>Monte Carlo (MC) Off-Policy Evaluation</b><br>Aim: estimate value of policy π₁, <em>V<sup>π₁</sup>(s)</em>, given episodes generated under <b>behavior policy π₂</b><br><em>If π₂ is <b>stochastic</b>, can often use it to estimate the value of an alternate policy <b>(formal conditions to follow)</b></em><br><em>Again, no requirement that have a model nor that state is Markov</em>", "one": "<b>目标策略 π₁，行为策略 π₂。课件给了一个前提——「如果 π₂ 是随机的」——并承诺稍后给出形式条件。</b>", "pts": ["<b>两个策略必须分清楚，本段所有符号都挂在这组命名上</b>：<span class='k'>π₁ 是目标策略</span>（你想知道它值多少，但没跑过它）、<span class='k'>π₂ 是行为策略</span>（数据实际是它跑出来的）。文献里更常写 π_e（evaluation）与 π_b（behavior）。", "<b>「If π₂ is stochastic」这个前提不是修辞，是硬条件。</b> 如果 π₂ 是确定性的，它在每个状态只会选一个动作，于是<span class='w'>你永远看不到 π₁ 想选而 π₂ 不选的那些动作的后果</span>。这一条在 L01 p70 以「agent 只经历它试过的动作」的形式出现过，这里是它的正式版本。", "<b>「formal conditions to follow」——这个承诺在本讲没有兑现。</b> 往后翻到 p61，给的是 <em>under some assumptions, unbiased &amp; consistent</em>，仍然没有把条件写出来。<b>整讲到结束都没有出现 coverage、support 或任何形式陈述。</b>", "<b>那些条件是什么？</b> 标准说法是 <b>coverage（支撑集覆盖）</b>：凡是 π₁ 会以正概率选的动作，π₂ 也必须以正概率选。写成式子就是<br><code>π₁(a|s) &gt; 0 ⟹ π₂(a|s) &gt; 0</code><br>不满足时重要性权重的分母为 0，<span class='w'>估计量不是方差大，是没有定义</span>。", "<b>最后一句「no requirement that have a model nor that state is Markov」值得单独记。</b> 重要性采样是<b>纯蒙特卡洛</b>的——它对整条轨迹的回报做加权平均，不碰转移概率，也不需要状态是充分统计量。这是它相对后面各种方法的唯一优势：<span class='k'>假设极少</span>。代价是方差极大，L15 会详细讲。"], "eq": "π₁ = 目标策略（想评估，没跑过）\nπ₂ = 行为策略（数据实际来自它）\n\ncoverage：π₁(a|s) > 0  ⟹  π₂(a|s) > 0\n（课件承诺「formal conditions to follow」，但本讲未兑现）", "tbl": {"head": ["课件说的", "原文", "本讲兑现了吗"], "rows": [["前提", "<em>If π₂ is stochastic</em>", "说了，但没解释为什么必须"], ["形式条件", "<em>(formal conditions to follow)</em>", "<span class='w'>没有</span>"], ["p61 的说法", "<em>under some assumptions</em>", "<span class='w'>仍然没有</span>"], ["不需要什么", "模型 · Markov 性", "说清楚了"]]}, "tip": {"t": "补课", "v": "课件承诺的形式条件，本讲没给。<b>正式处理在 L15</b>（批量离线 RL），那里会讲 IS / 逐步 IS / 加权 IS / 双重稳健，以及它们各自需要什么假设。读到这里觉得「好像少了点什么」是对的——确实少了。"}, "res": {"tag": "已核", "v": "<b>「If π₂ is stochastic」这个前提，你的日志不满足——而课件没告诉你不满足会怎样。</b><br>AFlow 每次运行<b>固定</b>模型配置。你的 fork 记了哪个模型执行了哪个节点，但<span class='w'>没有随机化、没有动作分布</span>，所以 π_b(a|h) ∈ {0,1}。<br>于是 coverage 条件在每一个「候选策略与已跑配置不同」的节点上都破掉：权重分母为 0。<br><b>这不是「高方差的 IS」，是 IS 无定义。加再多数据也不会好转</b>——缺的不是样本量，是支撑集。文献里叫 <em>deficient support</em>（Sachdeva / Su / Joachims）。<br>所以 p54 定义的那个问题，你<b>目前解不了</b>，而解法不在估计量里，在<b>数据采集</b>里：把节点执行器改成随机策略并记 propensity。这是第 1 周的动作项，成本几乎为零，<b>但不记就永远补不回来</b>。<br>⚠️ 别急着对所有节点均匀随机化——下一条科研格会说为什么。", "ref": "课件 p55 原文 · 简报 §4a（deficient support，推断）· §9 动作表第 2 条（已核）"}},
{"r": [56, 56], "t": "分布不匹配：问题的几何形状", "star": 2, "quote": "<b>MC Off-Policy Evaluation: Distribution Mismatch</b> — <em>Distribution of episodes &amp; resulting returns differs between policies</em>", "one": "<b>换一个策略，你会走到不同的地方，于是回报的分布也不同。这就是全部困难所在。</b>", "pts": ["<b>「不匹配」不匹配在两个层面，而课件这一句把它们合并了。</b><br>① <b>轨迹分布</b>不同：π₁ 和 π₂ 会走出不同的状态序列。<br>② <b>回报分布</b>不同：即使走到同一个状态，后续动作不同，回报也不同。<br><span class='k'>第一层是第二层的原因</span>。", "<b>为什么「取平均」直接失效？</b> 因为你手上那堆回报是<b>按 π₂ 的频率</b>出现的。π₂ 常去的地方样本多，π₁ 常去的地方样本可能很少甚至没有。<b>直接平均等于在用 π₂ 的权重回答 π₁ 的问题。</b>", "<b>重要性采样的全部想法就是「把权重改回来」</b>：一条轨迹在 π₁ 下本该出现得更频繁，就给它更大的权重；本该更少，就给更小的权重。下一页给一般形式。", "⚠️ <b>这一页只有一句话和一张图，但它是这一段的枢纽。</b> 后面三页都是在把这一句话写成式子。"]},
{"r": [57, 57], "t": "重要性采样：一般形式（以及课件这一页的三处笔误）", "star": 3, "quote": "<b>Importance Sampling</b><br>Goal: estimate <em>E<sub>x∼p</sub>[f(x)]</em>, the expected value of f(x) under distribution <em>p(x)</em><br>Have data x₁, x₂, …, xₙ sampled from distribution <em>q(s)</em><br>Under a few assumptions, we can use samples to obtain an unbiased estimate of <em>E<sub>x∼q</sub>[f(x)]</em><br>E<sub>x∼q</sub>[f(x)] = ∫<sub>x</sub> q(x)f(x)", "one": "<b>想要 p 下的期望，手上只有 q 的样本——办法是乘上比值 p(x)/q(x)。</b>", "pts": ["<b>完整的推导只有两步，课件这一页印不下，所以补在这里</b>：<br><code>E_{x∼p}[f(x)] = ∫ p(x)f(x) dx</code><br><code>= ∫ q(x) · [p(x)/q(x)] · f(x) dx</code>（乘 1，写成 q/q）<br><code>= E_{x∼q}[ (p(x)/q(x)) · f(x) ]</code><br><span class='k'>整个技巧就是「乘一个 1」</span>——把 q 提出来当采样分布，剩下的 p/q 当权重。", "<b>这一步要成立，q 必须在 p 有质量的地方也有质量</b>：<code>p(x) &gt; 0 ⟹ q(x) &gt; 0</code>。否则 q(x)=0 处没法除。<b>这就是 p55 承诺而未给的那个 formal condition</b>，在一般形式下就是这么一行。", "<b>估计量是样本平均</b>：<code>(1/n) Σᵢ [p(xᵢ)/q(xᵢ)] f(xᵢ)</code>。它是<b>无偏</b>的——期望等于 E_p[f]；但<span class='w'>方差可能极大</span>，当 p/q 在某些点很大时，少数样本会主导整个估计。", "⚠️ <b>本页课件有三处笔误，照抄会推不下去</b>，逐条列在下表。这不是刁难——数学陈述必须与课件对齐后才能落笔，对不上就要标出来。"], "tbl": {"head": ["处", "课件印的", "应该是", "为什么要紧"], "rows": [["数据来源", "sampled from distribution <em>q(<b>s</b>)</em>", "q(<b>x</b>)", "笔误，不影响理解"], ["那句承诺", "unbiased estimate of <em>E<sub>x∼<b>q</b></sub>[f(x)]</em>", "<b>E<sub>x∼p</sub>[f(x)]</b>", "<span class='w'>下标反了</span>。按印的读，等于说「用 q 的样本估 q 的期望」——那直接平均就行，整页没有内容"], ["那个式子", "E<sub>x∼q</sub>[f(x)] = ∫ q(x)f(x)", "只是期望的定义，<b>推导没走完</b>", "缺了「乘 q/q」那一步，比值 p/q 没出现"]]}, "tip": {"t": "记号", "v": "本课 13 讲共统计出 <b>165 条记号陷阱</b>。这一页占三条。遇到这种情形的硬规矩是：<b>以 Sutton &amp; Barto 或标准教材对齐后再落笔，并把差异标出来</b>——不要默默「修好」，那样下次看课件还会再困惑一次。"}},
{"r": [58, 60], "t": "用到策略评估上：动力学会约掉", "star": 3, "quote": "<b>IS for Policy Evaluation</b> — Let h<sub>j</sub> be episode j: <em>h<sub>j</sub> = (s<sub>j,1</sub>, a<sub>j,1</sub>, r<sub>j,1</sub>, …, s<sub>j,L<sub>j</sub></sub>)</em><br>p(h<sub>j</sub>|π, s) = <em>Π<sub>t=1</sub><sup>L<sub>j</sub>−1</sup> π(a<sub>j,t</sub>|s<sub>j,t</sub>) · p(r<sub>j,t</sub>|s<sub>j,t</sub>,a<sub>j,t</sub>) · p(s<sub>j,t+1</sub>|s<sub>j,t</sub>,a<sub>j,t</sub>)</em><br><b>V<sup>π₁</sup>(s) ≈ Σ<sub>j=1</sub><sup>n</sup> [ p(h<sub>j</sub>|π₁,s) / p(h<sub>j</sub>|π₂,s) ] · G(h<sub>j</sub>)</b>", "one": "<b>把「x」换成「整条轨迹」，p 和 q 换成两个策略下的轨迹概率——重要性采样就落到策略评估上了。</b>", "pts": ["<b>p59 把轨迹概率拆成了三样东西的连乘</b>：策略项 <code>π(aₜ|sₜ)</code>、奖励项 <code>p(rₜ|sₜ,aₜ)</code>、转移项 <code>p(sₜ₊₁|sₜ,aₜ)</code>。<span class='k'>这个分解是整段的关键</span>。", "<b>关键在于：求比值时，奖励项和转移项完全相同，于是约掉。</b> 它们只依赖环境，不依赖策略。所以<br><code>p(h|π₁,s)/p(h|π₂,s) = Π_t π₁(aₜ|sₜ) / Π_t π₂(aₜ|sₜ)</code><br><b>这就是为什么重要性采样不需要模型</b>——环境那一半自己消失了。p55 那句 <em>no requirement that have a model</em> 的根据就在这里。", "<b>权重是逐步比值的连乘</b>：<code>w_j = Π_{t=1}^{L_j−1} [π₁(a_{j,t}|s_{j,t}) / π₂(a_{j,t}|s_{j,t})]</code>。<span class='w'>连乘是方差的来源</span>——每多一步就多乘一个可能远离 1 的数，长轨迹下权重会指数地散开。", "⚠️ <b>p60 的估计量漏了 1/n。</b> 课件印的是 <code>V^π₁(s) ≈ Σ_{j=1}^n w_j·G(h_j)</code>，没有除以样本数。照这样写，估计量会<b>随 n 线性增长</b>。正确形式是 <code>(1/n) Σ_j w_j·G(h_j)</code>，即普通重要性采样（ordinary IS）。", "<b>还有一个变体课件没提：加权重要性采样（WIS）</b>，用 <code>Σ_j w_j G_j / Σ_j w_j</code> 代替 <code>(1/n)Σ_j w_j G_j</code>。它<b>有偏但一致</b>，方差通常小得多。L15 会讲这一对的取舍。"], "eq": "权重（动力学已约掉）：\n  w_j = Π_{t=1}^{L_j−1}  π₁(a_{j,t}|s_{j,t}) / π₂(a_{j,t}|s_{j,t})\n\n普通 IS：   V̂ = (1/n) Σ_j w_j G(h_j)        ← 课件 p60 漏了 1/n\n加权 IS：   V̂ = Σ_j w_j G(h_j) / Σ_j w_j   ← 课件未提，有偏但一致", "tbl": {"head": ["轨迹概率的三项", "依赖策略吗", "求比值时"], "rows": [["π(a<sub>t</sub>\\|s<sub>t</sub>) 策略", "<b>依赖</b>", "<b>留下</b>"], ["p(r<sub>t</sub>\\|s<sub>t</sub>,a<sub>t</sub>) 奖励", "不依赖", "<b>约掉</b>"], ["p(s<sub>t+1</sub>\\|s<sub>t</sub>,a<sub>t</sub>) 转移", "不依赖", "<b>约掉</b>"]]}, "res": {"tag": "已核", "v": "<b>连乘那一项，在你的问题里就是 ESS 坍缩的根源。</b><br>把式子换成你的符号：节点 h 的「动作」是保真度档位，权重 <code>w = Π_h [π_e(a_h|·) / π_b(a_h|·)]</code>。<br>设你在 k 个决策节点上<b>均匀</b>随机化 2 个选项，评估一个<b>确定性</b>目标策略：匹配的轨迹权重 <code>w = 2^k</code>，不匹配的 <code>w = 0</code>。于是<span class='w'>有效样本量 ESS = m</span>（匹配轨迹数），而 <code>E[m] = n·2^(−k)</code>。<br><b>推论：均匀日志 + 确定性目标下，加权 IS 精确退化为拒绝采样</b>——它字面上就是「碰巧和你的策略一致的那些轨迹的平均回报」。k=10 时 ESS = n/1024。<br><b>所以必须先降有效时域，再谈估计量。</b> 做法：对每个节点 j 跑「节点 j 用 7B、其余 72B」vs「全 72B」，约 100 条 query，按准确率跌幅与 token 占比排序，<b>只保留 top k=3~4 作为随机化节点，其余按扫描结果钉死</b>。ESS 从 n·2^−10 提到 n·2^−4，<b>64 倍</b>。而且那张敏感度表本身就是论文插图。<br><b>另外注意「动力学约掉」这件事在你这里不成立得那么干净</b>：节点 h 的输出<b>就是</b> h+1 的输入，所以「转移」依赖于你在 h 选了哪个模型。<span class='k'>你的转移项是依赖策略的</span>——这正是 L01 p18–19 那格说的「后续节点不可交换」，也是为什么 conformal / Learn-then-Test 不能直接套。", "ref": "课件 p59–p60 原文 · 简报 §4b（ESS 推导，已核）· §4c（先扫描后 OPE，已核）· §8 开放问题第 5 条"}},
{"r": [61, 61], "t": "小结：它要什么、不要什么", "star": 3, "quote": "<b>Importance Sampling for Policy Evaluation</b><br><em>IS = Monte Carlo estimate given off-policy data</em> · <em>Model-free method</em> · <em>Does not require Markov assumption</em> · <em>Under some assumptions, unbiased &amp; consistent estimator of V<sup>π₁</sup></em> · <em>Can be used when agent is interacting with environment to estimate value</em>", "one": "<b>重要性采样 = 用 off-policy 数据做的蒙特卡洛估计。无模型、不要 Markov 性、在某些假设下无偏且一致。</b>", "pts": ["<b>把「不要什么」读清楚，才知道它为什么值钱。</b> 不要模型（动力学约掉了）、不要 Markov 性（它对整条轨迹加权，不对状态做任何假设）。<span class='k'>这是本课假设最少的估计量</span>，没有之一。", "<b>「要什么」只剩两样</b>：① <b>coverage</b>（p55 承诺而未给的那个条件）；② 知道 <b>π₂ 的动作概率</b>——你必须能算出 <code>π₂(aₜ|sₜ)</code>，否则权重算不出来。<b>第二条经常被忽略：光记下「做了什么」不够，必须记下「以多大概率做的」。</b>", "<b>「unbiased &amp; consistent」这两个词不是一回事。</b> 无偏＝估计量的期望等于真值（普通 IS 有，加权 IS 没有）；一致＝样本趋于无穷时收敛到真值（两者都有）。<b>有限样本下你真正关心的是方差，而这一页一个字没提方差。</b>", "<b>最后一句「can be used when agent is interacting with environment」指向一个实际用法</b>：在线学习时，用旧策略的数据评估新策略，决定要不要切换。这是 L15「安全策略改进」的雏形。", "⚠️ <b>到这一页，p55 承诺的 formal conditions 仍然没有出现</b>——换成了 <em>under some assumptions</em>。<b>整讲到结束都没有把 coverage 写出来。</b>"], "tbl": {"head": ["", "IS 要求", "本课其它方法的对比"], "rows": [["模型", "<b>不要</b>", "确定性等价（p48–49）要"], ["Markov 性", "<b>不要</b>", "TD 要（靠它才能自举）"], ["coverage", "<b>要</b>（课件未明说）", "on-policy 方法不涉及"], ["知道 π₂ 的动作概率", "<b>要</b>", "on-policy 方法不涉及"], ["方差", "<span class='w'>很大，随轨迹长度指数增长</span>", "TD 方差小得多"]]}, "res": {"tag": "推断", "v": "<b>把这一页的「要什么」逐条对着你的日志打勾，结论是两条全不满足——而且第二条比第一条更容易修。</b><br><b>① coverage</b>：不满足（确定性日志）。修法是改数据采集，见 p55 那格。<br><b>② 知道 π₂ 的动作概率</b>：<span class='w'>这一条你现在多半也不满足</span>，而且它独立于第一条。就算你明天开始随机化，<b>如果只记「这个节点用了 7B」而不记「选 7B 的概率是 0.5」，权重照样算不出来</b>。<br>所以简报把「<b>审计现有日志：有没有记动作分布，还是只有实际 model id</b>」列为<b>第 1 天</b>的动作，排在随机化之前——先搞清楚现在记了什么，再决定要补什么。<br><b>而「不要什么」那两条在你这里是真便宜</b>：你不需要 workflow 的转移模型（本来也建不出来），也不需要假设节点状态是充分统计量（那正是 P2/P3 消融在检验的东西）。<span class='k'>IS 的低假设正好匹配你对 workflow 几乎一无所知的处境</span>——代价是方差，而方差可以用穷举 oracle 在留出集上绕过去。<br>标【推断】：逐条对账是我做的；两条动作项在简报里是【已核】。", "ref": "课件 p61 原文 · 简报 §9 动作表第 1、2 条（已核）· §4d（oracle，已核）"}},
{"r": [62, 62], "t": "下一讲：从评估走到控制", "star": 1, "quote": "<b>Today's Plan</b> — <em>Last Time</em>: policy evaluation &amp; control when have true model · <em>Today</em>: policy evaluation when don't have a model · <em>Next Time</em>: <b>control</b> when don't have a model", "one": "<b>三讲一条线：有模型（L02）→ 无模型但只做评估（本讲）→ 无模型且要做控制（L04）。</b>", "pts": ["<b>这条线就是 L01 p73「评估与控制」那一对的展开</b>，而且顺序从不颠倒：<span class='k'>先会评估，才能控制</span>——因为控制方法的内核是「评估 → 改进 → 再评估」。", "<b>本讲拿掉的是「模型」这一项</b>，下一讲拿掉的是「只评估」这个限制。两步各拿掉一样，不同时拿。", "⚠️ 讲稿最后一句是 <em>next time we'll start to talk a little bit about control</em>——<b>她确实在这里结束了</b>，p54–p62 没讲到。"]}

var TH = {"title": "L03 接上课题的哪一段：问题陈述在这里，条件没给", "arc": "<b>这一讲的最后 9 页（p54–p62）是你课题的问题陈述，几乎一字不差</b>：<em>trying actions out is costly or high stakes · use old data about policy decisions and their outcomes to estimate the potential value of an alternate policy</em>。<br><br>但它同时留下了两个窟窿，而这两个窟窿正好是你现在卡住的地方：<br><b>一、形式条件从未给出。</b> p55 写着「<em>If π₂ is stochastic, can often use it …（formal conditions to follow）</em>」，p61 换成「<em>under some assumptions</em>」——<span class='w'>整讲到结束都没有把 coverage 写出来</span>。而你的日志不满足的恰恰就是它。<br><b>二、这 9 页讲座根本没讲。</b> 讲稿全文 13350 词里 importance sampling 出现 <b>0 次</b>；她在 53% 处说「if we have time, otherwise we'll push it later」，然后讲稿结束在 AB 例子。<br><br>所以 L03 对你的用法是：<b>拿它当问题陈述和符号表，不要指望它给条件</b>。条件、方差分析、各种变体（PDIS / WIS / DR / FQE）全在 <b>L15</b>——那是 Brunskill 自己的研究讲座，几乎全建在 Philip Thomas 的工作上。<b>这 9 页可以当作 L15 的提纲来读。</b><br><br>前 53 页（MC / TD / 偏差方差 / AB 例子 / 确定性等价）与你的关系是间接但真实的：<b>MC vs TD 的偏差-方差权衡，就是你在「穷举 oracle（无偏、零方差、但只覆盖留出集）」与「FQE（有偏、低方差、覆盖全集）」之间的那个选择</b>。p46 那个 AB 例子说的「世界不是 Markov 时 MC 更好，是 Markov 时 TD 更好」，在你这里就是 P2/P3 消融的结论会决定你该用哪一边。", "pitfalls": [{"v": "<b>把「π₂ 是随机的」当成软性建议。</b> 它是硬条件。确定性日志下 π_b(a|h) ∈ {0,1}，coverage 破掉，<span class='w'>重要性权重的分母为 0 —— 估计量不是方差大，是没有定义</span>。加再多数据也不会好转，缺的是支撑集不是样本量（deficient support）。", "tag": "推断", "ref": "课件 p55 · 简报 §4a（基于 agent 对执行器的分析 + OPE 标准理论）"}, {"v": "<b>只记「做了什么」不记「以多大概率做的」。</b> 权重是 Π π₁(a|s)/π₂(a|s)，分母必须能算出来。就算明天开始随机化，<b>不记 propensity 权重照样算不出来</b>。这一条独立于 coverage，而且补不回来——没记就是没记。所以第 1 天的动作是<b>审计日志</b>：现在记的是动作分布，还是只有实际 model id？", "tag": "已核", "ref": "课件 p61 · 简报 §9 动作表第 1 条"}, {"v": "<b>随机化了就对所有节点均匀随机。</b> 匹配轨迹权重 2^k、不匹配为 0，<code>ESS = m</code>，<code>E[m] = n·2^(−k)</code>。k=10 时 ESS = n/1024，加权 IS 精确退化为拒绝采样。<b>必须先降有效时域</b>：一步偏离扫描 → 只留 top k=3~4 → ESS 提升 64 倍。", "tag": "已核", "ref": "简报 §4b §4c"}, {"v": "<b>以为「动力学会约掉」在你这里也成立得那么干净。</b> 课件 p59 的约分成立，是因为转移 p(s'|s,a) 不依赖策略。但在 workflow 里<b>节点 h 的输出就是 h+1 的输入</b>——你在 h 选了哪个模型，直接改变 h+1 看到什么。<span class='w'>你的「转移项」是依赖策略的</span>。这也是为什么 conformal / Learn-then-Test 不能直接套：它们要求校准点与测试点可交换，而后续节点不可交换。", "tag": "推断", "ref": "课件 p59 · 简报 §8 开放问题第 5 条（不可交换，已核）"}, {"v": "<b>照抄 p60 的估计量。</b> 课件印的是 <code>V^π₁ ≈ Σ_j w_j G(h_j)</code>，<b>漏了 1/n</b>，照这样写估计量会随样本数线性增长。正确是 <code>(1/n)Σ_j w_j G(h_j)</code>。课件也没提加权 IS（<code>Σw·G / Σw</code>，有偏但一致、方差小得多）。", "tag": "已核", "ref": "课件 p60 原文（逐页核对过）"}, {"v": "<b>先挑估计量，后补数据。</b> 正确顺序是：审计日志 → 一步偏离扫描（带止损闸与可加性检验）→ 穷举 oracle 表 → <b>才轮到估计量</b>。扫描在决定状态表示，而状态表示决定了你还剩多少有效数据——先对一个还没定下来的分母做优化是白做。", "tag": "已核", "ref": "简报 §4c §9 动作表"}], "ammo": [{"q": "你为什么不直接用重要性采样评估？", "a": "因为<b>估计量在我们的日志上没有定义</b>，不是方差大。AFlow 固定模型配置，π_b(a|h) ∈ {0,1}，违反 coverage —— 这是 deficient support，不是数据不够。我们因此把工作分成两半：<b>改数据采集</b>（propensity 采样与记录）与 <b>在留出集上建穷举 oracle</b>（方差为零的 ground truth）。", "tag": "推断", "ref": "简报 §4a §4d"}, {"q": "既然 IS 不行，你的 oracle 表凭什么可信？", "a": "它<b>不是估计量，是全因子实验</b>。200–300 条留出 query，枚举 k 个决策节点的全部 2^k 种分配，跨分支共享前缀（拓扑前缀一致的分支，节点输出可逐字复用）。k=4 时每 query ≤16 个叶子、约 30 次节点调用，300 条 ≈ 9000 次调用且多数是 7B。得到精确表 <code>R(x, a₁..a_k)</code>，<b>任何确定性节点级策略都能查表精确求值，方差为零</b>。在我们付得起的规模上，它碾压任何估计量。", "tag": "已核", "ref": "简报 §4d（含成本估算）"}, {"q": "准确率和成本为什么用两种不同的估计量？", "a": "因为两者的可学性差一个数量级。<b>成本</b>给定保真度与输入长度近乎确定 → 直接回归，预期 R² &gt; 0.95，<b>完全不用重要性权重</b>；<b>准确率</b>是终局奖励 → FQE + 5 折 cross-fitting。混在一个估计量里，等于让确定的那一半去承担随机那一半的方差。<b>这是真实且可辩护的方差缩减，不是工程细节。</b><br>顺带：奖励在 t=H 时，per-decision IS 对准确率那一半<b>算术上等同于轨迹 IS</b>，买不到任何东西——它只对逐节点累积的成本有用。", "tag": "已核", "ref": "简报 §4e"}], "papers": [{"t": "Precup, Sutton &amp; Singh — Eligibility Traces for Off-Policy Policy Evaluation", "id": "ICML 2000", "why": "逐步重要性采样（per-decision IS）的出处。你需要它来论证「终局奖励下 PDIS 对准确率那一半无增益」这个判断——那是从它的构造直接读出来的。"}, {"t": "Thomas &amp; Brunskill — Data-Efficient Off-Policy Policy Evaluation", "id": "ICML 2016", "why": "双重稳健 OPE。L15 整讲建在 Thomas 的工作上，这篇是主干。你的「成本回归 + 准确率 FQE」拆分，就是 DR 把 nuisance 分量与 IS 分量分开那个思路的特例。"}, {"t": "Thomas, Theocharous &amp; Ghavamzadeh — High-Confidence Off-Policy Evaluation", "id": "AAAI 2015", "why": "把 OPE 从点估计推到<b>置信下界</b>。你要的「上线前确信不更差」就是这一类陈述，而不是「期望更高」。"}, {"t": "Sachdeva, Su &amp; Joachims — Off-policy Bandits with Deficient Support", "id": "KDD 2020", "why": "<b>你现在处境的正式名字。</b> 日志支撑集不足时该怎么办——限制目标策略类、或接受有偏但可控的估计。引用它比自己论证「IS 无定义」有力。"}, {"t": "Le, Voloshin &amp; Yue — Batch Policy Learning under Constraints", "id": "ICML 2019", "why": "带约束的离线策略学习（FQE 在约束下的用法）。你的 <code>G = Acc − λ·Cost</code> 若改写成「成本受限下最大化准确率」，形式化可以直接引这一篇。"}]};

      right=document.getElementById("right");
  var cur=0, map={}, cells=[];
  /* 科研格出处档位 → 类名。三档与 research/00-BRIEFING 的原始标注一致。 */
  var RESC={"已核":"t1","推断":"t2","待核":"t3"};

  /* 存档键带课程前缀 —— file:// 下所有本地页面共用一个 origin，
     两门课都用 "l01quiz" 会互相覆盖。 */
  var KEY = document.body.dataset.key;
  try {                       // 一次性迁移：早期版本用的是不带课程前缀的键
    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("l03quiz");
      if(_old){
        localStorage.setItem(KEY+"quiz", _old);
        var _p = localStorage.getItem("l03p");
        if(_p) localStorage.setItem(KEY+"p", _p);
      }
      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，
         用户「清空全部记录」之后下次打开又被复活一遍。 */
      localStorage.removeItem("l03quiz");
      localStorage.removeItem("l03p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=SRC+"?p="+p+"#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
