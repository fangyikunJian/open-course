{"r": [1, 4], "t": "这一讲要干什么", "star": 2, "one": "<b>不再绕值函数，直接把策略参数化，对它求导。</b>", "pts": ["四节：引入 → 策略梯度 → score function 与策略梯度定理 → 算法与降方差。", "上一讲：模仿学习。下一讲：策略搜索续。", "<b>这一讲在课程结构里的位置，上一讲 p18 已经预告过了：它是「额外知识」的第二种形态。</b><span class='k'>模仿学习的额外知识是专家演示，策略搜索的额外知识是<b>你选的策略类本身</b></span>——<b>课件 L07 的原话是 <em>can encode domain knowledge in the form of the policy class used</em>。</b><span class='w'>所以这一讲不需要任何人来演示，但需要你对「好策略大概长什么样」有判断。</span><b>把问题的结构编进策略类，是这一讲全部省力的来源。</b>", "<b>老师开场那句「策略梯度大概是现在用得最多的一类方法」不是客套，值得解释一下为什么。</b><span class='k'>三个现实理由</span>：<b>① 连续动作空间里基于值的方法几乎没法用</b>（<code>arg max_a Q</code> 在连续 a 上要解一个优化问题）；<b>② 策略往往比值函数简单</b>——「往右推」比「每个状态值多少」好表示得多；<b>③ 它能直接优化你真正关心的目标</b>，不用绕一圈。<span class='w'>今天大模型上做的 RLHF、PPO，骨架都在这一讲里。</span>", "<b>把这一讲和前七讲的关系摆一次，你会看出它是一次路线的切换，而不是一次改良。</b><span class='k'>前七讲的主线是：学值函数 → 从值函数里读出策略</span>（<b>L02 的 <code>arg max_a Q</code>、L04 的 Q-learning、L06 的 DQN，全是这条</b>）。<span class='w'>这一讲把中间那一环整个拆掉</span>——<b>不再问「这个状态值多少」，直接问「参数往哪边挪一点，回报会高一点」。</b><span class='k'>于是「值函数」这个概念在这一讲的前半段完全不出现。</span>", "<b>读这一讲有一条主线值得先立住，否则中间十几页的推导会像在变魔术：全部工作都是为了把 <code>∇_θ J(θ)</code> 变成一个「能用采样估出来」的形式。</b><span class='w'>难点在于 <code>J(θ)</code> 是一个对轨迹的期望，而轨迹的分布本身依赖 θ</span>——<b>你要对一个「分布也在动」的期望求导。</b><span class='k'>p34 的似然比技巧就是解决这件事的，而它的副产品（p40–p41 动态项消失）是整讲最漂亮的一步。</span>", "<b>p2–p3 是把第一讲那张「我们要什么」的清单又抬出来了一次，而且是第二次用它当引子。</b><span class='k'>优化、延迟后果、探索、泛化，外加「统计上和计算上都高效」</span>——<b>L07 p17 用它引出了「还缺效率」，这一讲用它引出「还有第二种加结构的办法」。</b><span class='w'>同一张清单连着两讲当开场，说明它不是装饰，是这门课真正的议程表。</span><b>你每学一个新方法，都可以回去问它补了哪一格。</b>", "<b>这一讲补的那一格值得说准：它补的不是「探索」也不是「泛化」，而是<span class='k'>优化</span>。</b><span class='w'>前面七讲的「优化」都是间接的——先把值估准，再贪心</span>；<b>而这一讲第一次把问题写成一个标准的「最大化 <code>J(θ)</code>」，然后用标准的优化工具去做。</b><span class='k'>p14 那句「策略梯度是个优化问题」不是比喻，是字面陈述</span>——<b>于是整个连续优化的工具箱（梯度下降、共轭梯度、拟牛顿）一下子全可以用了。</b>", "<b>还有一件小事值得先交代，免得你以为自己漏看了：这一讲没有「值迭代」「Q」这些老面孔。</b><span class='w'>前半段连值函数都不出现（p6 的三分法里明写 <em>No Value Function</em>）</span>，<b>它们要到 p53 讲基线时才以「可选的降方差工具」的身份回来。</b><span class='k'>所以读到一半觉得「怎么不提 Q 了」是正常的——那正是这条路线的特点。</span>"], "say": "老师开场就给了定位：<b>策略梯度大概是现在用得最多的一类方法</b>，非常值得熟悉。", "tip": {"t": "课件自己标的来源", "v": "补充阅读 Sutton &amp; Barto 2018 第 13 章；幻灯片多来自 David Silver、John Schulman 和 Pieter Abbeel。"}, "quote": "Lecture 8: Policy Gradient I &nbsp;·&nbsp; Additional reading: Sutton and Barto 2018 Chp. 13 &nbsp;|&nbsp; Last time: Imitation Learning &nbsp;·&nbsp; <b>This time: Policy Search</b> &nbsp;·&nbsp; Next time: Policy Search Cont."},
{"r": [5, 5], "t": "目录", "quote": "Table of Contents &nbsp;·&nbsp; 1 Introduction &nbsp;·&nbsp; 2 Policy Gradient &nbsp;·&nbsp; 3 Score Function and Policy Gradient Theorem &nbsp;·&nbsp; 4 Policy Gradient Algorithms and Reducing Variance", "one": "四节：<b>为什么要 → 梯度怎么来 → 定理 → 怎么把方差压下去</b>。", "pts": ["<b>这四节的分工非常清楚，而且第四节的标题已经剧透了全讲最大的麻烦。</b><br><b>① 引入</b>（p6–p20）：<span class='k'>论证「为什么值得直接参数化策略」</span>，重点是两个「随机策略必需」的例子。<br><b>② 策略梯度</b>（p21–p33）：<span class='k'>从最笨的有限差分开始</span>，顺带讲一个真实的机器人案例。<br><b>③ score function 与定理</b>（p34–p45）：<span class='k'>核心推导</span>，似然比技巧 + 动态项消失。<br><b>④ 算法与降方差</b>（p46–p62）：<span class='w'>因为方差大到不降就没法用</span>。", "<b>第四节标题里那句 <em>Reducing Variance</em> 值得现在就记住：它说明这类方法有一个固有的病。</b><span class='k'>p8 的「缺点」里也写了：<em>Evaluating a policy is typically inefficient and high variance</em></span>。<b>策略梯度的估计是无偏的，但噪声极大</b>（<span class='w'>p46 会专门讲这件事</span>）。<b>所以这一讲后三分之一全在处理方差</b>——<span class='k'>因果性（p47）、基线（p53）、值函数当基线（p59）</span>，<b>三招都是在同一件事上使劲。</b>", "<b>还可以按「需要什么」给这四节排个序，这样你知道哪些内容是能单独拿走用的。</b><span class='k'>第①节只需要你理解 MDP 和部分可观测，不需要任何推导</span>——<b>它的结论（什么时候必须用随机策略）可以单独拿走。</b><span class='k'>第②③节是推导，需要一点概率和微积分</span>。<span class='k'>第④节是工程，需要你已经接受了第③节的结论</span>。<span class='w'>如果你时间紧，第①节和第④节的实用价值最高，第③节是理解它们为什么成立的地方。</span>"]},
{"r": [6, 7], "t": "基于值 vs 基于策略", "star": 3, "one": "上一讲参数化的是 <code>V</code> / <code>Q</code>，策略是<b>从里面挤出来的</b>（ε-贪婪）；这一讲<b>直接参数化策略</b>。", "eq": "上一讲：V_θ(s) ≈ V^π(s)，Q_θ(s,a) ≈ Q^π(s,a)，策略靠 ε-贪婪从 Q 里取\n这一讲：π_θ(s,a) = P[a | s, θ]，目标是找到值最高的那个 π\n\n基于值   ：学值函数，策略是隐式的\n基于策略 ：不要值函数，直接学策略\nActor-Critic：两个都显式地学", "pts": ["仍然是 <b>model-free</b>：不假设知道动态或奖励模型。", "<span class='k'>参数化的选择就是你能学到的策略空间</span>——这一点和第五讲选特征时是同一个问题。", "<b>三分法里最值得琢磨的是「基于策略」那一格写着 <em>No Value Function</em>。</b><span class='k'>这是字面意思——这一讲前半段真的一个值函数都不出现</span>。<b>你直接问「参数挪一点，期望回报变多少」，中间不经过任何「这个状态值多少」的判断。</b><span class='w'>这听起来像是绕远路，其实是抄近道</span>：<b>值函数是手段不是目的，而手段可能比目的更难学。</b>", "<b>为什么「策略可能比值函数简单」，有个很好的例子可以记住。</b><span class='k'>想象一根倒立摆：最优策略大致是「往倾斜的那一侧推」，一条线性规则就差不多了</span>；<span class='w'>而它的值函数是一个在状态空间上起伏复杂的曲面</span>。<b>学那条线性规则，比学那个曲面容易得多。</b><span class='k'>这个不对称在很多控制问题里都成立</span>——<b>于是「绕过值函数」就不是放弃信息，而是避开了一个更难的子问题。</b>", "<b>Actor-Critic 这一格现在先记个名字，它是下一讲的主角，而它的动机正是这一讲的缺点。</b><span class='w'>纯策略梯度方差大（p46）</span>；<span class='k'>而降方差最有效的办法是用一个值函数当基线（p59）</span>——<b>一旦你开始学这个值函数，你就同时在学 actor（策略）和 critic（值），那就是 Actor-Critic。</b><span class='w'>所以这三格不是三个门派，是一条连续谱：从「完全不要值函数」到「完全靠值函数」。</span>", "<b>最后留意那句 <em>focus again on model-free</em>，它划定了这一讲的工作条件。</b><span class='k'>不假设知道 <code>P</code> 或 <code>R</code>，只能采样</span>。<b>而这一讲最惊人的一个结果（p40–p41）正是：即使你不知道 <code>P</code>，梯度公式里也不会出现它——它自己消掉了。</b><span class='w'>这不是近似，是精确的恒等式。</span><b>记住现在这个「model-free」的设定，到那一页你才会觉得它足够震撼。</b>"], "quote": "In the last lecture we approximated the value or action-value function using parameters θ &nbsp;·&nbsp; <b>In this lecture we will directly parametrize the policy: π_θ(s,a) = P[a|s,θ]</b> &nbsp;·&nbsp; Goal is to find a policy π with the highest value function V^π &nbsp;·&nbsp; We will focus again on <b>model-free</b> reinforcement learning &nbsp;|&nbsp; <b>Value Based</b>: Learnt Value Function, Implicit policy &nbsp;·&nbsp; <b>Policy Based</b>: No Value Function, Learnt Policy &nbsp;·&nbsp; <b>Actor-Critic</b>: Learnt Value Function, Learnt Policy", "tbl": {"head": ["", "学值函数吗", "学策略吗", "策略从哪来", "典型方法"], "rows": [["基于值", "<span class='k'>学</span>", "<span class='w'>不学</span>", "<b>从 Q 里挤出来（ε-贪婪）</b>", "Q-learning · DQN（L04 L06）"], ["基于策略", "<span class='w'>不学</span>", "<span class='k'>学</span>", "<b>就是参数本身</b>", "REINFORCE（本讲 p49）"], ["Actor-Critic", "<span class='k'>学</span>", "<span class='k'>学</span>", "参数本身，值函数只当基线", "<b>下一讲</b>"]]}},
{"r": [8, 8], "t": "利弊", "star": 3, "one": "三个好处，两个代价。", "pts": ["<b>收敛性质更好</b>（有争议，取决于跟谁比、算多少）。", "<b>高维或连续动作空间</b>里更有效。", "<span class='k'>能学随机策略</span>——下面两页专门讲为什么这很重要。", "<span class='w'>通常只收敛到局部最优</span>，不是全局最优。", "<span class='w'>评估一个策略往往低效且方差大。</span>", "<b>「高维或连续动作空间更有效」这一条值得说透，因为它是策略梯度最硬的一个优势。</b><span class='k'>基于值的方法要选动作，就得算 <code>arg max_a Q(s,a)</code></span>——<b>离散动作时这是遍历一遍，连续动作时这本身就是一个优化问题，每一步都要解一次。</b><span class='w'>而策略梯度直接输出动作（或动作的分布），根本没有这个 max</span>。<b>这是结构性的差别，不是效率上的微调。</b>", "<b>「只收敛到局部最优」这个缺点要摆正位置：它比听起来轻，原因有两层。</b><span class='k'>第一层：基于值的方法在函数逼近下连局部最优都不保证</span>（<b>L05 p38 的致命三件套，Q-learning + VFA 可能直接发散</b>）。<span class='w'>「保证收敛到局部最优」其实比「可能发散」强</span>。<span class='k'>第二层：实践中局部最优往往够用</span>——<b>深度学习整个领域都建立在「局部最优够好」这个经验事实上。</b><span class='w'>老师也强调了：深度 RL 里基本所有策略梯度方法都只保证局部最优。</span>", "<b>「评估一个策略低效且方差大」才是真正要命的那一条，而且它贯穿后面整整十几页。</b><span class='k'>为什么方差大？因为你得真的跑完一条轨迹才知道它值多少</span>——<b>而 L02 p14 早就演示过：同一个起点的三条轨迹，回报可以是 1.25、0、0.125。</b><span class='w'>更糟的是「低效」：每次参数一改，旧数据就作废了</span>（<b>因为轨迹分布变了，这是 on-policy 方法的通病</b>）。<span class='k'>DQN 可以用几百万步之前的经验，策略梯度的经验用一次就扔。</span><b>这是策略梯度和基于值方法在样本效率上最大的鸿沟。</b>", "<b>把两列并起来看，你会发现这张表其实在描述一个取舍，而不是列优缺点。</b><span class='k'>策略梯度买到的是：能处理连续动作、能学随机策略、有收敛保证</span>；<span class='w'>付出的是：样本效率差、方差大、只到局部最优</span>。<b>所以「用哪个」取决于你的瓶颈是什么</b>——<span class='k'>数据贵就偏基于值（样本可复用），动作连续或策略必须随机就偏策略梯度</span>。"], "say": "老师强调：<b>深度强化学习里基本所有策略梯度方法都只保证局部最优</b>。后面会点出几个例外。", "quote": "<b>Advantages</b>: Better convergence properties &nbsp;·&nbsp; Effective in high-dimensional or continuous action spaces &nbsp;·&nbsp; <b>Can learn stochastic policies</b> &nbsp;|&nbsp; <b>Disadvantages</b>: Typically converge to a local rather than global optimum &nbsp;·&nbsp; <b>Evaluating a policy is typically inefficient and high variance</b>", "tbl": {"head": ["", "基于值（L04 L06）", "策略梯度（本讲）"], "rows": [["连续动作", "<span class='w'>要解 arg max，很难</span>", "<span class='k'>直接输出动作，天然支持</span>"], ["随机策略", "<span class='w'>只能靠 ε-贪婪硬加</span>", "<span class='k'>策略本身就是分布</span>"], ["样本复用", "<span class='k'>能（经验回放）</span>", "<span class='w'>不能，参数一改旧数据就作废</span>"], ["方差", "<span class='k'>较小（自举）</span>", "<span class='w'>很大（要跑完整条轨迹）</span>"], ["收敛保证", "<span class='w'>VFA 下可能发散（L05 p38）</span>", "<span class='k'>局部最优</span>"]]}},
{"r": [9, 9], "t": "为什么要随机策略（一）：石头剪刀布", "star": 3, "one": "确定性策略<b>会被对手吃死</b>；均匀随机才是最优（纳什均衡）。", "pts": ["<span class='k'>第一讲说过：表格 MDP 里一定存在确定性的最优策略</span>——所以随机策略在那里不需要。", "<b>这里不是表格 MDP</b>：环境不是中立的，对手会针对你的策略调整，而且是非平稳的、对抗性的。", "<b>这个例子的要害在于它打破了 L02 p29 那条定理所依赖的一个前提，而且打破得非常彻底。</b><span class='k'>L02 p29 证「最优策略可以是确定性的」，用的论证是：随机策略的值是各动作值的加权平均，而平均不超过最大</span>。<b>这个论证默认了「各动作的值是固定的」。</b><span class='w'>而在石头剪刀布里，你一旦固定出石头，对手就改出布，于是「出石头的值」就变了</span>——<b>动作的值依赖于你选它的概率。</b><span class='k'>前提不成立，结论当然不成立。</span>", "<b>把这件事说得更一般一点：这里的环境不是一个 MDP。</b><span class='w'>MDP 假设 <code>P</code> 和 <code>R</code> 是固定的、不随你的策略变的</span>；<span class='k'>而对手会根据你的策略调整，所以「环境」本身依赖于你的策略</span>。<b>这在形式上已经出了 MDP 的范围，进了博弈论。</b><span class='w'>所以严格说这个例子证明的不是「MDP 里需要随机策略」，而是「博弈里需要随机策略」</span>——<b>下一页那个例子才是在 MDP 框架内（但部分可观测）的版本，对这门课更相关。</b>", "<b>「均匀随机是纳什均衡」这件事也值得想一下它的含义：它是一个<span class='k'>防守</span>性质，不是进攻性质。</b><span class='w'>均匀随机保证你的期望收益是 0，不管对手怎么打</span>——<b>它让你不可被利用，但也放弃了利用对手的机会。</b><span class='k'>如果对手有可预测的习惯，针对性的确定性策略能赢得更多</span>。<b>所以随机化在这里买到的是「最坏情况的保证」，代价是「最好情况的收益」。</b><span class='w'>这个取舍在任何对抗设定里都成立。</span>"], "quote": "Two-player game of rock-paper-scissors &nbsp;·&nbsp; Consider policies for iterated rock-paper-scissors &nbsp;·&nbsp; <b>A deterministic policy is easily exploited</b> &nbsp;·&nbsp; <b>A uniform random policy is optimal (i.e. Nash equilibrium)</b>"},
{"r": [10, 12], "t": "为什么要随机策略（二）：混叠网格世界", "star": 3, "one": "两个灰格<b>传感器读数一模一样</b>，确定性策略必然在其中一个做错。", "eq": "特征形如：φ(s,a) = 1(北边有墙, a = 向东)\n\n确定性最优策略：两个灰格都向西，或都向东 —— 无论哪种都会卡住\n\n随机最优策略：π(北有墙且西有墙, 向东) = 0.5\n              π(北有墙且西有墙, 向西) = 0.5\n  ⇒ 几步之内大概率就到目标", "pts": ["<b>基于值的方法学出来的是近乎确定性的策略</b>（贪婪或 ε-贪婪），所以它会在走廊里来回耗很久。", "<span class='k'>根子是环境不是马尔可夫的</span>——部分可观测 + 混叠。", "注意中间那格<b>看起来不一样</b>，所以到了中间它知道该怎么走。", "<b>这个例子比石头剪刀布更该记住，因为它的毛病是<span class='k'>你自己造成的</span>，而且随时可能在你的问题里重演。</b><span class='w'>环境本身是个正常的 MDP，真实状态是互不相同的</span>；<b>出问题的是<span class='k'>特征</span>——你只看「北边有没有墙」，于是两个不同的格子在你眼里一模一样。</b><span class='w'>这叫状态混叠（aliasing）。</span><b>它不是环境的缺陷，是你的表示的缺陷。</b>", "<b>混叠一旦发生，确定性策略就被逼进了一个死角，这个逻辑链很短但很硬。</b><span class='k'>策略是特征的函数；两个格子特征相同；所以策略在它们上必须输出同一个动作</span>。<b>而这两个格子的正确动作恰好相反（一个该向东，一个该向西）。</b><span class='w'>于是无论你选哪个，都有一个格子会走错，而走错就会卡在走廊里来回</span>。<b>注意这不是「学得不够好」，是策略类本身装不下正确答案。</b><span class='k'>这和 L02 p56 那条「只看节点编号的策略类装不下最优解」是同一种病。</span>", "<b>随机策略为什么能救，理由朴素到有点好笑：因为它不会一直错下去。</b><span class='k'>在灰格里五五开地选东或西，意味着你每一步都有一半的机会走对</span>——<b>于是几步之内大概率就能走出走廊。</b><span class='w'>它并没有变聪明，它只是不再「一条道走到黑」</span>。<b>这是随机化在这里的全部作用：把「必然卡死」换成「大概率脱困」。</b>", "<b>老师回答学生提问时给的那个更正，是这一页最有价值的一句话，务必记住。</b><span class='k'>「部分可观测时随机策略是不是总更好？」——不是。更好的其实是去维持一个<b>信念状态</b></span>：<b>「我刚才在那一格，所以现在一定在这一格」，然后确定性地走。</b><span class='w'>随机化并没有在灰格里做任何聪明的事，它只是不会卡死</span>。<b>换句话说：<span class='k'>随机化是补救，修表示才是治本</span>。</b><span class='w'>如果你能把历史（或更多特征）放进状态，混叠就消失了，确定性策略又够用了。</span>", "<b>把这一页和 L02 的结论对起来数一遍，你就有了一张「什么时候需要随机策略」的完整清单。</b><span class='k'>L02 p29/p31 说确定性策略够用，但那条结论有三个前提</span>：<b>① 状态是马尔可夫的（完全可观测）；② 无限 horizon（所以策略平稳）；③ 目标是期望回报（线性可加，无约束）。</b><br><span class='w'>p9 的石头剪刀布破的是①和③（环境随你变，而且是对抗的）</span>；<span class='w'>这一页破的是①（混叠 = 部分可观测）</span>；<span class='w'>而 L02 主线卡提到的带约束 MDP 破的是③</span>。<b>三个前提，三种破法，各对应一类需要随机策略的问题。</b>"], "say": "有同学问「部分可观测时随机策略是不是总更好」。老师的回答更精确：<b>更好的其实是去维持一个信念状态</b>（POMDP 策略）——「刚才在那一格，那现在一定在这一格」，然后确定性地走。随机化只是在灰格里<span class='w'>并没有做什么聪明事</span>，但它至少不会卡死。", "quote": "<b>The agent cannot differentiate the grey states</b> &nbsp;·&nbsp; φ(s,a) = 1(wall to N, a = move E) &nbsp;|&nbsp; Under aliasing, an optimal deterministic policy will either move W in both grey states or move E in both grey states &nbsp;·&nbsp; <b>Either way, it can get stuck and never reach the money</b> &nbsp;|&nbsp; An optimal stochastic policy will randomly move E or W in grey states: <b>π(wall to N and W, move E) = 0.5</b> &nbsp;·&nbsp; <b>It will reach the goal state in a few steps with high probability</b>", "tbl": {"head": ["「确定性就够」的前提", "谁打破了它", "后果", "该怎么办"], "rows": [["① 状态马尔可夫 / 完全可观测", "<b>状态混叠</b>（本页）", "<span class='w'>策略被迫在不同状态上做同样的事</span>", "<span class='k'>先修表示（信念状态 / 加特征）；做不到才随机化</span>"], ["① + ③ 环境固定、目标是期望回报", "<b>对抗环境</b>（p9）", "<span class='w'>确定性策略会被针对</span>", "<span class='k'>均匀随机（纳什均衡）</span>"], ["② 无限 horizon", "<b>有限 horizon</b>（L02 p56）", "<span class='w'>最优策略不平稳</span>", "<span class='k'>策略带上剩余步数</span>"], ["③ 目标线性可加、无约束", "<b>硬约束</b>（L02 主线卡）", "<span class='w'>最优策略可能必须随机</span>", "<span class='k'>用带约束 MDP 的理论</span>"]]}, "res": {"tag": "推断", "v": "<b>这一页给你的 §4c 随机化决策节点提供了第二个、而且更强的理由——原先它是个采数据的手段，现在它还是个「最优策略的形态」。</b><br><br><b>先说混叠在你的问题里长什么样。</b><span class='k'>如果策略只看「第几个节点」（L02 p56 讨论过的那个策略类），那么一道简单题和一道难题在节点 3 上<b>特征完全相同</b></span>——<b>而它们的最优保真度显然不同（难题该上高保真，简单题不该）。</b><span class='w'>这就是字面意义上的状态混叠：看起来一样，正确动作相反。</span><b>此时确定性策略被迫一视同仁，必然在其中一类上做错。</b><br><br><b>于是有两条路，而课件明确告诉你哪条是治本的。</b><br><b>① 修表示（治本）</b>：<span class='k'>把 query 特征放进状态</span>——难度估计、输入长度、上游产物的某些统计量。<b>混叠消失，确定性策略又够用了，而且策略会更好。</b><span class='w'>老师回答学生时说的正是这个：更好的是维持信念状态，而不是随机化。</span><br><b>② 随机化（补救）</b>：<span class='k'>做不到①时，在混叠的节点上按概率混合几档保真度</span>。<b>它不聪明，但不会「一条道走到黑」。</b><br><br><b>而这对你有一个很实际的好处：你本来就要随机化（§4c 是为了提升 ESS、让日志覆盖多种配置）。</b><span class='k'>这一页说明那个随机化<b>不只是采数据的代价，它本身可能就是更优的策略</b></span>——<span class='w'>于是「为了评估而随机化」和「为了表现而随机化」指向同一件事，你不必在两者之间权衡。</span><b>这个论点值得在 method 一节里明说，它把一个看起来像妥协的设计变成了一个有依据的选择。</b><br><br><b>但要诚实标注边界</b>：<span class='w'>随机策略优于确定性策略，前提是<b>确实存在混叠</b></span>。<b>如果你把 query 特征放进了状态、混叠被消除了，那么随机化就只剩下采数据那一个理由，而且会轻微损害表现。</b><span class='k'>所以这条论证要和「你的状态里有没有 query 特征」绑在一起说，不能单独拿出来用。</span>", "ref": "课件 p10–p12 原文 · p10 老师问答（信念状态）· L02 p29 p31 p56 · 简报 §4c"}},
{"r": [13, 13], "t": "怎么衡量一个策略好不好", "star": 2, "one": "三种目标函数，今天主要用第一种。", "eq": "episodic：   J₁(θ) = V^{π_θ}(s₁) = E_{π_θ}[v₁]\n平均值：     J_avV(θ) = Σ_s d^{π_θ}(s)·V^{π_θ}(s)\n平均每步奖励：J_avR(θ) = Σ_s d^{π_θ}(s) Σ_a π_θ(s,a)·R_s^a", "pts": ["<code>d^{π_θ}(s)</code> 就是第五讲那个<b>平稳分布</b>。", "今天只讲 episodic，但方法能推广到连续/无限 horizon 的情形。", "<b>三个目标函数对应三类不同的任务，选错了会优化出完全不同的东西。</b><br><b>① 起始值 <code>J₁</code></b>：<span class='k'>适合有明确开始和结束的任务</span>——下棋、走迷宫、跑一条流水线。<b>你只关心从起点出发这一整趟值多少。</b><br><b>② 平均值 <code>J_avV</code></b>：<span class='k'>适合永远运行下去的系统</span>——服务器调度、交易。<b>没有「起点」可言，所以按平稳分布加权。</b><br><b>③ 平均每步奖励 <code>J_avR</code></b>：同样是持续任务，<span class='w'>但关心的是「单位时间产出」而不是「累计值」</span>。", "<b>注意 <code>d^{π_θ}(s)</code> 这个平稳分布依赖 θ，这件事比它看起来麻烦。</b><span class='k'>你改策略，不只是改了「在每个状态做什么」，还改了「你会待在哪些状态」</span>。<b>于是求导时这两部分都要算。</b><span class='w'>这正是策略梯度推导的全部难点</span>——<b>如果分布固定，求导就是普通的链式法则；而分布随 θ 动，你得先把这件事处理掉。</b><span class='k'>p34 的似然比技巧就是来处理它的。</span>", "<b>课件选 episodic 情形来讲，对你是好消息，因为那是最干净的一种。</b><span class='k'><code>J₁(θ) = E_{π_θ}[G]</code>，一条轨迹一个回报，取期望</span>——<b>没有平稳分布，没有极限，就是一个对轨迹分布的期望。</b><span class='w'>而且它正好对上有限 horizon 的任务</span>（<b>L02 p55 的那一类，也是你的流水线的形状</b>）。<b>课件说这套方法能「轻松推广」到持续情形，这是真的，但推导会多出平稳分布那一层麻烦。</b>"], "quote": "But how do we measure the quality for a policy π_θ? &nbsp;·&nbsp; In episodic environments we can use the start value: <b>J_1(θ) = V^{π_θ}(s_1) = E_{π_θ}[v_1]</b> &nbsp;·&nbsp; In continuing environments we can use the average value: J_avV(θ) = Σ_s d^{π_θ}(s) V^{π_θ}(s) &nbsp;·&nbsp; Or the average reward per time-step: J_avR(θ) = Σ_s d^{π_θ}(s) Σ_a π_θ(s,a) R_s^a &nbsp;·&nbsp; <b>where d^{π_θ}(s) is the stationary distribution of Markov chain for π_θ</b>"},
{"r": [14, 18], "t": "先说无梯度的那一类", "star": 3, "one": "爬山、单纯形、遗传算法、<b>CEM</b>、<b>CMA-ES</b>——完全不用导数。", "pts": ["<b>好处</b>：策略怎么参数化都行，<span class='k'>连不可微的都行</span>；而且极易并行。", "<span class='w'>局限</span>：样本效率通常不高，因为它<b>完全不利用问题的时序结构</b>。", "OpenAI 的说法：进化策略在现代 RL 基准（Atari / MuJoCo）上<b>能和标准 RL 方法掰手腕</b>。", "<b>无梯度方法的工作方式可以一句话说完：把策略参数当成一个黑箱的输入，跑一遍看得分，再根据得分挪参数。</b><span class='k'>它完全不关心「这是个 MDP」「有状态有动作有时序」——在它眼里就是一个从参数向量到标量得分的函数</span>。<b>这既是它的优点（什么策略类都能用，不可微也行），也是它的缺点（<span class='w'>完全不利用序贯结构</span>）。</b>", "<b>外骨骼那个例子值得记住细节，因为它说明无梯度方法在什么场合真的是首选。</b><span class='k'>人戴上装置 → 试一组控制律 → 测代谢消耗 → 换一组 → CMA-ES 生成下一代，约一小时后能耗平均降低 24%</span>。<b>注意这个场景的三个特点</b>：<span class='w'>① 每次评估都很贵（要人真的走一段）；② 没有可微的模型（人体代谢不可微）；③ 参数维度不高（控制律只有几个参数）</span>。<b>三条合起来，无梯度方法恰好合适。</b>", "<b>这里必须更正老师口头说的一句话，因为它会误导你的方法选择。</b><span class='w'>课堂上说 CMA-ES「能保证趋向全局最优」，这不准确</span>——<span class='k'>CMA-ES 是一个局部搜索的启发式方法，在一般的非凸问题上<b>没有</b>全局收敛保证</span>。<b>它在多峰问题上表现稳健（协方差自适应让它不容易被狭长山谷卡住），重启策略也能提高找到好解的机会，但这和「保证全局最优」是两回事。</b><span class='w'>课件本身的 p8 写的是 <em>typically converge to a local rather than global optimum</em>，并没有给无梯度方法开例外。</span><b>按课件写的记，别按那句口误记。</b>", "<b>OpenAI 那句引文值得认真对待，但也要看清它的适用范围。</b><span class='k'>进化策略在 Atari / MuJoCo 上能和标准 RL 掰手腕</span>——<b>这是真的，而且相当打脸。</b><span class='w'>但它买到这个结果的方式是「极大的并行」</span>：<b>用成千上万个 CPU 同时跑不同的参数扰动，拿总样本量换墙上时间。</b><span class='k'>所以它赢的是「时钟」，不是「样本效率」</span>。<b>如果你的瓶颈是每次评估的成本（而不是等待时间），这条结论就不适用。</b>", "<b>课件那句 <em>a great simple baseline to try</em> 是这一页最该执行的建议。</b><span class='k'>无梯度方法实现简单、没有超参地狱、不会因为梯度爆炸而悄悄失败</span>——<b>所以它是一条非常好的对照线。</b><span class='w'>如果你精心调出来的策略梯度跑不过一个随机搜索，那说明问题出在别处</span>（<b>这和 L06 p12「先在 Pong 上体检」是同一种思路：先要一个能证伪的基准</b>）。", "<b>把 CEM 的流程摊开，你会发现它简单到可以十行写完，而这正是它值得当基线的原因。</b><span class='k'>① 从一个分布（通常是高斯）里采 N 组参数；② 每组跑几条轨迹拿到得分；③ 挑得分最高的那一小撮（比如前 10%，叫「精英」）；④ 用这撮精英重新拟合分布；⑤ 回到①</span>。<b>没有梯度，没有学习率，几乎没有超参要调。</b><span class='w'>唯一的关键参数是「精英比例」——取太大就退化成随机搜索，取太小会过早收敛。</span>", "<b>CMA-ES 比 CEM 多的那一样东西，名字里就写着：协方差自适应。</b><span class='k'>CEM 每轮重新拟合的高斯通常是各向同性或对角的，而 CMA-ES 维护一个完整的协方差矩阵，并根据历史上成功的搜索方向去更新它</span>。<b>效果是：如果最优解藏在一条狭长的山谷里，它会学会沿着山谷的方向拉长采样分布。</b><span class='w'>代价是协方差矩阵有 <code>O(d²)</code> 个元素，所以参数维度一高就吃不消</span>——<b>这也是它适合外骨骼那种几个参数的问题，而不适合百万参数网络的原因。</b>", "<b>「极易并行」这一条在工程上的分量比它听起来重，值得算一笔账。</b><span class='k'>无梯度方法每一代的 N 组参数之间完全独立，可以撒到 N 台机器上同时跑，最后只需要回收 N 个标量得分</span>——<b>通信量小到可以忽略。</b><span class='w'>而策略梯度要回传整个梯度向量（和参数一样大），同步开销随参数量线性增长</span>。<b>所以在「机器多、每次评估慢、参数少」的场合，无梯度方法能把墙上时间压得非常低。</b>"], "say": "老师举了同事 Steve Collins 的<b>外骨骼</b>工作（Zhang et al., Science 2017）：让人戴上装置，试一组控制律、测代谢消耗，再换一组，一代试完用 <b>CMA-ES</b> 生成下一代。<span class='k'>约一小时之后，能耗比不加助力平均降低 24%。</span><br>她强调两点：一是效果确实好；二是 <b>CMA-ES 是无梯度的，而且能保证趋向全局最优</b>——高风险场合这一条可能比样本效率更重要。", "tip": {"t": "记住这是工具箱里的一件", "v": "「一个很好的简单基线，值得先试」。别默认非梯度法不行。"}, "quote": "Can use <b>gradient free optimization</b>: Hill climbing &nbsp;·&nbsp; Simplex / amoeba / Nelder Mead &nbsp;·&nbsp; Genetic algorithms &nbsp;·&nbsp; <b>Cross-Entropy method (CEM)</b> &nbsp;·&nbsp; <b>Covariance Matrix Adaptation (CMA)</b> &nbsp;|&nbsp; Can often work embarrassingly well: <em>evolution strategies rivals the performance of standard RL techniques on modern RL benchmarks</em> &nbsp;|&nbsp; Benefits: <b>Can work with any policy parameterizations, including non-differentiable</b> &nbsp;·&nbsp; Frequently very easy to parallelize", "tbl": {"head": ["", "无梯度（CEM / CMA-ES）", "策略梯度（本讲）"], "rows": [["要策略可微吗", "<span class='k'>不要</span>", "<span class='w'>要</span>"], ["用序贯结构吗", "<span class='w'>完全不用</span>", "<span class='k'>用（p47 的因果性就是）</span>"], ["并行难度", "<span class='k'>极易</span>", "较难"], ["样本效率", "<span class='w'>低</span>", "<span class='k'>较高</span>"], ["全局最优保证", "<span class='w'>没有（课堂口误，按 p8 为准）</span>", "<span class='w'>没有，局部最优</span>"]]}},
{"r": [19, 20], "t": "转向梯度法", "one": "用上梯度通常效率更高：梯度下降、共轭梯度、拟牛顿。", "pts": ["今天聚焦梯度下降，以及<span class='k'>能利用序贯结构</span>的那些方法。", "CMA-ES 压根不知道世界是个 MDP；接下来的方法要把这个结构用起来。", "<b>最后那句 <em>methods that exploit sequential structure</em> 是这一讲和上一页那堆方法的分水岭，值得先想清楚「序贯结构」具体指什么。</b><span class='k'>它指的是：一条轨迹不是一个黑箱得分，它是由一串决策组成的</span>——<b>你知道哪一步做了什么，也知道每一步之后拿到了多少奖励。</b><span class='w'>无梯度方法把这些信息全扔了，只看最后那个总分</span>。<b>而这一讲后面的每一个改进，本质上都是在多捡回一点这类信息。</b>", "<b>把这条线索预先摆出来，后面十几页就有了统一的解释。</b><br><b>p40–p41</b>：<span class='k'>利用「动态和策略是分开的」这个结构，把 <code>P</code> 消掉</span>；<br><b>p47</b>：<span class='k'>利用「第 t 步的决策影响不了第 t 步之前的奖励」，把每个 score 只乘它之后的回报</span>；<br><b>p53</b>：<span class='k'>利用「基线不依赖动作」，减掉一个常数而不引入偏差</span>；<br><b>p59</b>：<span class='k'>利用值函数本身当基线</span>。<br><span class='w'>四处都在做同一件事：把「这条轨迹得了多少分」这个粗糙信号，拆成更细、噪声更小的部分。</span>", "<b>为什么梯度能更高效，有个很直观的理由值得记住：维度。</b><span class='k'>无梯度方法要靠扰动来猜方向，而在 d 维参数空间里随机扰动能撞对方向的概率随 d 下降</span>；<b>梯度则一次性给出全部 d 个分量的正确方向。</b><span class='w'>所以参数越多，梯度的优势越大</span>——<b>这正是深度网络时代策略梯度压过进化策略的根本原因</b>（<span class='k'>网络有百万参数，随机扰动根本不够用</span>）。<b>反过来，参数只有几个时，无梯度方法完全有竞争力（外骨骼那个例子就是）。</b>", "<b>顺带把「梯度下降」这个说法里的一个小别扭挑明：我们要的是<span class='k'>最大化</span> <code>J(θ)</code>，所以实际做的是梯度<b>上升</b>。</b><span class='w'>课件沿用了优化领域的习惯说法「gradient descent」</span>，<b>而公式里你会看到 <code>θ ← θ + α∇_θ J(θ)</code>，是加号。</b><span class='k'>两种写法都对——对 <code>−J</code> 做下降等于对 <code>J</code> 做上升</span>，<b>但读代码时要留意符号，这是实现策略梯度最常见的低级错误之一。</b>"], "quote": "Greater efficiency often possible using gradient &nbsp;·&nbsp; Gradient descent &nbsp;·&nbsp; Conjugate gradient &nbsp;·&nbsp; Quasi-newton &nbsp;·&nbsp; We focus on gradient descent, many extensions possible &nbsp;·&nbsp; <b>And on methods that exploit sequential structure</b>"},
{"r": [21, 22], "t": "策略梯度", "star": 2, "one": "沿 <code>∇_θ V(θ)</code> 爬坡，找局部最大。", "eq": "V(θ) ≡ V^{π_θ}      （把值对策略参数的依赖写明）\n\nθ ← θ + α·∇_θ V(θ)\n\n∇_θ V(θ) = [ ∂V/∂θ₁, …, ∂V/∂θ_n ]ᵀ", "pts": ["和第五讲的值函数逼近形式上一样，<span class='k'>只是求导对象从「Q 的参数」换成了「策略的参数」</span>。", "<b>第一行那个记号的改动看着不起眼，其实是整讲的起手式：<code>V(θ) ≡ V^{π_θ}</code>。</b><span class='k'>它把「值」从「策略的性质」重新写成「参数的函数」</span>——<b>一旦写成参数的函数，它就是一个可以求导的东西。</b><span class='w'>前七讲里 <code>V</code> 的自变量是状态，这里 <code>V</code> 的自变量是参数</span>。<b>这个视角的切换，就是整条路线的起点。</b>", "<b>课件写的是 <em>search for a local maximum</em>，这个措辞要当真，而不是谦虚。</b><span class='k'><code>V(θ)</code> 关于 θ 一般是非凸的</span>——<b>沿梯度爬坡只能保证爬到附近的一个山头，爬不到最高的那座。</b><span class='w'>这和 L02 完全不同：那里值迭代收敛到唯一的 <code>V*</code>，初始化根本不影响结果</span>（<b>L02 p54</b>）。<b>这里初始化决定你掉进哪个坑</b>——<span class='k'>p25 的 AIBO 实验里，论文自己把「初始策略参数」列为影响结果的第一个因素。</span>", "<b>步长 α 在这里比在监督学习里更难处理，原因值得说清楚。</b><span class='w'>监督学习里参数走大了，顶多是这一步的损失没降好，数据分布不变</span>；<span class='k'>而这里参数一改，<b>你采样到的轨迹分布就跟着改了</b></span>——<b>走大一步可能把策略推到一个烂区域，而你接下来采的全部数据都来自那个烂区域。</b><span class='w'>于是一次坏更新不只是浪费一步，它会污染后面的所有数据。</span><b>这正是第十讲 TRPO 存在的理由：它要给「一步能走多远」加一个信赖域。</b>", "<b>最后把这一讲的优化问题和你熟悉的监督学习摆在一起，差别只有一处，但那一处是全部困难的来源。</b><span class='k'>监督学习：目标是 <code>E_{(x,y)∼D}[loss]</code>，而数据分布 D 是<b>固定</b>的</span>；<span class='w'>这里：目标是 <code>E_{τ∼P(·;θ)}[R]</code>，而轨迹分布<b>依赖 θ</b></span>。<b>于是你每走一步，被优化的那个期望所依据的分布也跟着动。</b><span class='k'>这正是为什么不能简单套用监督学习的全部直觉</span>——<b>从「旧数据能不能复用」到「步长该多大」，结论都不一样。</b>"], "quote": "Define V(θ) = V^{π_θ} to make explicit the dependence of the value on the policy parameters &nbsp;·&nbsp; <b>Assume episodic MDPs</b> &nbsp;·&nbsp; Policy gradient algorithms search for a <b>local maximum</b> in V(θ) by ascending the gradient of the policy, w.r.t parameters θ &nbsp;·&nbsp; Δθ = α ∇_θ V(θ) &nbsp;·&nbsp; and α is a step-size parameter"},
{"r": [23, 24], "t": "最笨的办法：有限差分", "star": 2, "one": "每个维度各扰动一点点，看值变了多少。", "eq": "∂V(θ)/∂θ_k  ≈  [ V(θ + ε·u_k) − V(θ) ] / ε\n\nu_k 是第 k 个分量为 1、其余为 0 的单位向量", "pts": ["n 维要做 <b>n 次评估</b>。简单、噪声大、不高效——<span class='k'>但有时管用</span>。", "<b>最大的好处：策略不必可微。</b>", "<b>有限差分的代价结构要记清楚，它决定了这条路什么时候还能走：<span class='w'>n 维要 n 次评估</span>。</b><span class='k'>而在 RL 里，「一次评估」意味着把策略跑若干条完整轨迹</span>——<b>不是算一次前向传播，是真的去和环境交互。</b><span class='w'>所以参数量 n 直接乘在你的采样预算上</span>。<b>12 个参数（AIBO）还行，百万参数的网络完全不可能。</b><span class='k'>对比：解析梯度一次反向传播就能同时得到全部 n 个分量。</span>", "<b>「噪声大」这一条在 RL 里尤其严重，而原因是分子上两个带噪声的量相减。</b><span class='k'><code>V(θ + εu_k)</code> 和 <code>V(θ)</code> 都是采样估计，各自带噪声</span>；<b>而它们的差被一个很小的 ε 除。</b><span class='w'>于是噪声被放大了 <code>1/ε</code> 倍</span>。<b>ε 取小一点能减少差分的偏差，却会放大方差——这是一个没法两全的取舍。</b><span class='k'>AIBO 那个实验「每个策略评估 3 次取平均」正是在压这个方差。</span>", "<b>那句「策略不必可微」是有限差分唯一的、但相当硬的优势，值得想清楚它买到了什么。</b><span class='w'>解析梯度要求你能写出 <code>∇_θ log π_θ(a|s)</code></span>——<b>于是你的策略必须是一个可微函数。</b><span class='k'>而有限差分只要求「给我一组参数，我能跑出一个得分」</span>：<b>策略可以是一棵决策树、一段 if-else 规则、甚至一个外部黑箱系统。</b><span class='w'>在参数少而结构怪的场合（比如调一个现有系统的配置），这常常是唯一可用的办法。</span>", "<b>再补一个很实用的改进，课件没提但你一动手就会想到：用<span class='k'>中心差分</span>。</b><span class='w'>课件给的是前向差分 <code>[V(θ+εu) − V(θ)]/ε</code>，偏差是 <code>O(ε)</code></span>；<span class='k'>中心差分 <code>[V(θ+εu) − V(θ−εu)]/(2ε)</code> 的偏差是 <code>O(ε²)</code></span>。<b>代价是评估次数翻倍（<code>2n</code> 次而不是 <code>n+1</code> 次）。</b><span class='w'>在评估很贵的 RL 场景里这笔买卖往往不划算</span>——<b>因为这里的主要误差来自采样噪声，不是差分的截断偏差。</b>"], "quote": "To evaluate policy gradient of π_θ(s,a), for each dimension k ∈ [1,n]: Estimate kth partial derivative by perturbing θ by small amount in kth dimension &nbsp;·&nbsp; <b>∂V(θ)/∂θ_k ≈ [V(θ + ε u_k) − V(θ)] / ε</b> &nbsp;|&nbsp; <b>Uses n evaluations to compute policy gradient in n dimensions</b> &nbsp;·&nbsp; Simple, noisy, inefficient - but sometimes effective &nbsp;·&nbsp; <b>Works for arbitrary policies, even if policy is not differentiable</b>", "tbl": {"head": ["", "有限差分（p23）", "解析梯度（p30 起）"], "rows": [["n 维梯度要几次评估", "<span class='w'>n 次</span>", "<span class='k'>1 次（一条轨迹就够）</span>"], ["策略要可微吗", "<span class='k'>不要</span>", "<span class='w'>要</span>"], ["噪声", "<span class='w'>被 1/ε 放大</span>", "<span class='w'>大，但不被 1/ε 放大</span>"], ["利用序贯结构吗", "<span class='w'>不利用</span>", "<span class='k'>利用（p47 因果性）</span>"], ["适用规模", "<b>参数几个到几十个</b>", "<b>参数可到百万级</b>"]]}},
{"r": [25, 29], "t": "用有限差分教 AIBO 走路", "star": 3, "one": "Robocup 的四足机器人，<b>12 个连续参数</b>定义一套步态。", "eq": "策略是 open-loop 的（不看状态，就是一串动作）：\n  前足轨迹 3 个参数（高度、x、y）、后足轨迹 3 个\n  轨迹长度、x-y 平面内的倾斜系数（用于转向）\n  身体前部高度、后部高度\n  每只脚走完一圈的时间、每只脚着地时间的比例\n\n新策略：每个参数随机加上 (ε, 0, 或 −ε)\n\n3 台 AIBO 同时跑 · 每轮 15 个策略 · 每个策略测 3 次取平均\n每轮 7.5 分钟 · 学习率 η = 2", "pts": ["<b>全部评估都在真机器人上做</b>，「唯一需要人介入的是换电池，约每小时一次」。", "<span class='k'>几十到几百个策略就够了</span>，不是几百万步——和你在作业二里体验的 DQN 完全是两个量级。", "但代价是<b>注入了大量领域知识</b>：那 12 个参数就是 Peter Stone 组多年经验的结晶。", "<b>这个实验的预算结构值得算一遍，因为它和你平时见的深度 RL 数字差了几个数量级。</b><span class='k'>每轮 15 个策略 × 每个测 3 次 = 45 次评估，3 台机器并行，耗时 7.5 分钟</span>。<b>就算跑 100 轮，也不过 4500 次评估、十几个小时。</b><span class='w'>而作业二的 DQN 要 10–40M 帧</span>（<b>L06 p12</b>）。<span class='k'>差距在哪？在那 12 个参数</b>——<b>它们把一个本来极其高维的控制问题，压成了一个 12 维的连续优化问题。</b>", "<b>而那 12 个参数是怎么来的，是这一页最该带走的东西：它们是领域知识，不是算法产物。</b><span class='k'>前足轨迹的高度/x/y、后足轨迹的三个、轨迹长度、倾斜系数、身体前后高度、每只脚走一圈的时间、着地时间比例</span>——<b>这是 Peter Stone 组多年研究四足步态的结晶。</b><span class='w'>有人替这个问题想清楚了「好的步态长什么样」，才有这 12 个旋钮可调</span>。<b>这正是 L07 p18 说的 <em>encode domain knowledge in the form of the policy class</em>，而且是最漂亮的一个实例。</b>", "<b>「open-loop 策略」这个概念必须单独理解，它在这一讲里是个异类。</b><span class='w'>它不是状态到动作的映射，它就是一串固定的动作</span>——<b>刮大风了，机器人下一个动作也不变。</b><span class='k'>老师的说法很准：「是个计划，不是个反应式策略」</span>。<b>严格说它根本不是这门课定义的策略（<code>π(a|s)</code> 要吃状态）。</b><span class='w'>但策略梯度的框架对它照样适用</span>——<b>因为框架只要求「参数 → 轨迹分布 → 期望回报」这条链，不要求中间必须看状态。</b>", "<b>「每个策略评估 3 次取平均」这个细节，是整页最实用的一条工程经验。</b><span class='k'>单次评估的噪声会被有限差分的 <code>1/ε</code> 放大，所以必须先把它压下去</span>。<b>重复 3 次把标准差压到约 <code>1/√3 ≈ 0.58</code> 倍。</b><span class='w'>代价是评估次数翻三倍</span>——<b>于是这里有个明确的预算分配问题：同样的总次数，是多试几个策略，还是把每个测得更准？</b><span class='k'>答案取决于噪声相对于策略间真实差异的大小</span>：<b>噪声大到盖过策略差异时，多试没用，必须先测准。</b>", "<b>论文自己列的几个影响因素，连起来正好是一张「这类方法的超参清单」。</b><span class='k'>初始参数（决定掉进哪个局部最优）、ε 多大（偏差–方差取舍）、η 多大（步长，这里取 2）、以及策略参数化本身</span>。<b>注意最后一项不是超参，是建模选择，而它的影响往往最大。</b><span class='w'>前三个你可以网格搜索，第四个只能靠对问题的理解</span>——<b>而这一页的成功，八成来自第四项。</b>", "<b>把这个实验的总预算和它取得的效果对照一下，你会对「参数化的威力」有更具体的感受。</b><span class='k'>它学的是「走得多快」，评估方式是测场地穿越时间——一个极其直接的目标</span>。<b>而整个学习过程在真机器人上完成，唯一的人工介入是每小时换一次电池。</b><span class='w'>这意味着它的样本预算被硬性限制在「机器人能连续跑多久」这个物理约束上</span>——<b>不可能有几百万次评估。</b><span class='k'>能在这种预算下学出结果，靠的不是算法多聪明，是那 12 个参数选得好。</span>", "<b>「每个参数随机加上 (ε, 0, 或 −ε)」这个扰动方式，比教科书版的有限差分聪明一点，值得注意。</b><span class='w'>教科书版是一次只扰动一个维度，12 维要 12 次评估</span>；<span class='k'>他们的做法是同时扰动所有维度，每个维度三选一，然后用一组随机扰动的结果去估整个梯度</span>。<b>这其实更接近「随机方向的有限差分」，效率高得多。</b><span class='w'>代价是每个维度的估计更粗糙，需要更多组扰动来平均</span>——<b>那 15 个策略每轮，就是在凑这个平均。</b>"], "say": "老师顺带解释了什么叫 <b>open-loop 策略</b>：它<span class='w'>不是状态到动作的映射，而是一串固定的动作</span>——中间刮起大风，机器人下一个动作也不变。「是个计划，不是个反应式策略。」<br>论文自己讨论了哪些因素影响结果：初始参数、ε 多大、η 多大，以及<b>策略参数化本身</b>。有同学问为什么初始参数要紧——因为<span class='k'>只保证局部最优，起点决定你掉进哪个坑</span>。", "quote": "Goal: learn a fast AIBO walk (useful for Robocup) &nbsp;·&nbsp; <b>AIBO walk policy is open-loop policy. No state</b>, choosing set of action parameters that define an ellipse &nbsp;·&nbsp; Specified by <b>12 continuous parameters</b> &nbsp;·&nbsp; New policies: for each parameter, randomly add (ε, 0, or −ε) &nbsp;|&nbsp; <em>All of the policy evaluations took place on actual robots... only human intervention required during an experiment involved replacing discharged batteries ... about once an hour</em> &nbsp;·&nbsp; <b>Ran on 3 Aibos at once &nbsp;·&nbsp; Evaluated 15 policies per iteration &nbsp;·&nbsp; Each policy evaluated 3 times (to reduce noise) and averaged &nbsp;·&nbsp; Each iteration took 7.5 minutes</b> &nbsp;·&nbsp; Used η = 2 &nbsp;|&nbsp; (Kohl and Stone, ICRA 2004)", "res": {"tag": "推断", "v": "<b>AIBO 这个实验的结构和你的课题高度相似，值得当作一个可以直接对照的参照系。</b><br><br><span class='k'>三条共同点</span>：<b>① 每次评估都贵</b>（他们要真机器人走一趟，你要真跑一遍流水线）；<b>② 参数维度低</b>（他们 12 个连续参数，你 H 个节点各 k 档）；<b>③ 评估结果带噪声</b>（他们是机械与地面的随机性，你是 LLM 输出的随机性）。<br><br><b>于是他们那套预算分配可以直接搬：每轮试若干配置，每个配置重复评估几次取平均。</b><span class='w'>而「重复几次」这个数不是随便定的</span>——<span class='k'>它取决于「单次评估的噪声」相对于「配置之间的真实差距」有多大</span>。<b>这件事你可以先测：拿同一个配置跑 n 次，看 Acc 的标准差；再拿两个相邻配置各跑若干次，看它们的差。</b><span class='w'>如果噪声的量级盖过了差距，那么多试配置是浪费——先把单点测准。</span><b>这个诊断花不了多少预算，但能让后面所有实验的预算用在刀刃上。</b><br><br><b>还有一条更重要的类比：那 12 个参数是领域知识，而你的「逐节点保真度」也是。</b><span class='k'>你没有在「所有可能的工作流」上搜索，你在「给定结构、只调每个节点的保真度」这个极小的参数化上搜索</span>——<b>这正是 AIBO 用 12 个参数替代「所有可能的关节轨迹」的同一手。</b><span class='w'>它是你样本效率的真正来源，也是你该在 paper 里主动说明的一个设计决定</span>，<b>而不是当成一个不言自明的前提。</b>", "ref": "课件 p25–p29（Kohl &amp; Stone, ICRA 2004）· L07 p18 · L06 p12 · 简报 §4c §4d"}},
{"r": [30, 31], "t": "改成解析地求梯度", "one": "假设 <code>π_θ</code> 在非零处可微，而且 <code>∇_θ π_θ(s,a)</code> <b>算得出来</b>。", "pts": ["「知道」在这里的意思就是<b>可计算</b>。", "从这里开始只谈梯度法，<span class='w'>因此只能指望局部最优</span>。", "<b>这两行假设是接下来十几页推导的全部入场券，值得逐字读。</b><span class='k'>「在非零处可微」——注意不是「处处可微」</span>。<b>这个措辞是为了容纳一类常见情形：策略在某些动作上概率恰好为 0。</b><span class='w'>而 <code>log 0</code> 没有定义，score function 在那里也就没有意义</span>。<b>实践中这正是为什么 softmax 策略（p51）这么受欢迎：它给每个动作的概率都严格大于 0。</b>", "<b>「我们知道 <code>∇_θ π_θ(s,a)</code>」这句话里的「知道」，意思就是「算得出来」。</b><span class='k'>它不是一个关于世界的假设，而是一个关于你自己代码的要求</span>——<b>你写的策略必须是你能求导的。</b><span class='w'>这和「知道转移模型」那种假设性质完全不同</span>：<b>后者要你了解环境，前者只要你了解自己。</b><span class='k'>这个区别很重要——它说明策略梯度的假设负担比动态规划轻得多。</span>", "<b>从这一页开始，无梯度那条路就被放下了，而代价写在上一句话里：只能指望局部最优。</b><span class='w'>所以这是一次明确的交换</span>：<span class='k'>用「策略必须可微」这个限制，换来「n 维梯度只要一次评估」这个效率</span>。<b>换不换划算，取决于你的 n 有多大。</b><span class='w'>AIBO 的 n = 12，不换也行；深度网络的 n 上百万，不换就没法做。</span>", "<b>这里值得把「可微」这个要求落到具体的策略上看一眼，否则它听着像个空条件。</b><span class='k'>softmax 策略（p51）：<code>π_θ(a|s) ∝ exp(θᵀφ(s,a))</code>，处处为正、处处可微</span>——<b>完全满足。</b><span class='k'>高斯策略（p52）：<code>a ∼ N(μ_θ(s), σ²)</code>，同样处处可微</span>。<span class='w'>而 ε-贪婪策略<b>不</b>满足</span>——<b>它里面有个 <code>arg max</code>，在动作值打平的地方不可微。</b><span class='k'>这正是基于值的方法没法直接套进这个框架的原因之一。</span>", "<b>「在非零处可微」这个措辞还有一层实践含义，和数值稳定直接相关。</b><span class='w'>如果训练过程中某个动作的概率被推到接近 0，那么 <code>log π</code> 趋向负无穷，score 会爆炸</span>。<span class='k'>这是策略梯度最常见的数值事故之一</span>。<b>常见的两种防法：① 在 softmax 的 logits 上加权重衰减，防止它们跑太大；② 在目标里加一个熵奖励，主动阻止策略过早变得确定。</b><span class='w'>后者还顺带维持了探索，所以在实践里几乎是标配。</span>"], "quote": "We now compute the policy gradient <b>analytically</b> &nbsp;·&nbsp; Assume policy π_θ is differentiable whenever it is non-zero &nbsp;·&nbsp; and we know the gradient ∇_θ π_θ(s,a)"},
{"r": [32, 33], "t": "换个记号：按轨迹来写", "star": 3, "one": "把值写成「对所有轨迹求和」。", "eq": "τ = (s₀, a₀, r₀, …, s_{T-1}, a_{T-1}, r_{T-1}, s_T)\nR(τ) = Σ_t R(s_t, a_t)\n\nV(θ) = E_{π_θ}[ Σ_t R(s_t,a_t) ] = Σ_τ P(τ; θ)·R(τ)\n\n目标：arg max_θ Σ_τ P(τ; θ)·R(τ)", "pts": ["<span class='k'>注意策略参数只出现在 P(τ;θ) 里</span>——<code>R(τ)</code> 是轨迹的确定性函数，和 θ 无关。", "和上一讲的模仿学习呼应：那里比的是<b>状态分布</b>，这里是<b>轨迹分布</b>。", "<b>这个换记号的动作是整段推导里最关键的一次准备，而它的妙处在于「把 θ 赶到一个地方去」。</b><span class='k'>展开之后，<code>V(θ) = Σ_τ P(τ;θ)·R(τ)</code>：θ 只出现在 <code>P(τ;θ)</code> 里，<code>R(τ)</code> 和 θ 一点关系都没有</span>。<b>因为轨迹一旦定了，它的回报就定了——回报是轨迹的确定性函数。</b><span class='w'>于是求导时只需要处理 <code>∇_θ P(τ;θ)</code> 这一项</span>，<b>而这正是下一页要攻的目标。</b>", "<b>这个写法还解决了一个概念上的麻烦：「期望」到底是对谁取的。</b><span class='k'>写成 <code>E_{π_θ}[·]</code> 时，θ 既在期望符号的下标里，又在被求期望的东西里，求导时容易搞混</span>。<b>展开成显式的求和之后，一切都清楚了：这就是一个有限（或可数）项的加权和，权重是 <code>P(τ;θ)</code>。</b><span class='w'>求导就是对每一项求导再加起来，没有任何微妙之处。</span><b>把期望写成显式求和再求导，是处理这类问题的标准动作。</b>", "<b>注意轨迹的定义里 <code>T</code> 是有限的，这和 p21 那句「假设 episodic MDP」是配套的。</b><span class='k'>有限 T 意味着轨迹的集合（至少在离散动作下）是可数的，<code>Σ_τ</code> 这个写法才合法</span>。<b>无限 horizon 的情形要用测度论的语言重写，结论一样但形式麻烦。</b><span class='w'>课件选 episodic 来讲，就是为了避开这层技术细节</span>——<b>而这恰好也是你的流水线的形状（L02 p55 那一类）。</b>", "<b>最后把这一页和上一讲接一次，你会看到一个很整齐的对应。</b><span class='k'>L07 比的是<b>状态分布</b> <code>μ(π)</code>，这一页比的是<b>轨迹分布</b> <code>P(τ;θ)</code></span>。<b>两处都在说同一件事：策略的全部影响，都体现在「它会产生什么样的轨迹」上。</b><span class='w'>L07 用这一点来做特征匹配（匹配分布就等于匹配值）</span>；<b>这一讲用这一点来求导（分布对参数求导）。</b><span class='k'>同一个洞见，两种用法。</span>", "<b>还有一个这个记号带来的便利值得点出来：它让「on-policy」这件事变得一目了然。</b><span class='k'>式子里的 <code>P(τ;θ)</code> 用的就是当前参数 θ</span>——<b>所以估计这个期望时，轨迹必须由当前策略产生。</b><span class='w'>换别的策略采的数据，对应的是另一个 <code>P(τ;θ′)</code>，不能直接用</span>。<b>这是策略梯度是 on-policy 的最直观证据，比抽象地说「分布变了」清楚得多。</b>"], "quote": "Denote a state-action trajectory as τ = (s_0, a_0, r_0, ..., s_{T−1}, a_{T−1}, r_{T−1}, s_T) &nbsp;·&nbsp; Use R(τ) = Σ_{t=0}^{T} R(s_t, a_t) to be the sum of rewards for a trajectory τ &nbsp;|&nbsp; <b>V(θ) = E[Σ_t R(s_t,a_t); π_θ] = Σ_τ P(τ; θ) R(τ)</b> &nbsp;·&nbsp; where P(τ; θ) is the probability over trajectories when executing policy π_θ &nbsp;·&nbsp; <b>arg max_θ V(θ) = arg max_θ Σ_τ P(τ; θ) R(τ)</b>"},
{"r": [34, 36], "t": "似然比技巧", "star": 3, "one": "<b>乘一个再除一个，把梯度变成 log 的梯度。</b>", "eq": "∇_θ V(θ) = ∇_θ Σ_τ P(τ;θ)·R(τ)\n          = Σ_τ ∇_θ P(τ;θ)·R(τ)\n          = Σ_τ  [P(τ;θ)/P(τ;θ)] · ∇_θP(τ;θ) · R(τ)     ← 乘一除一\n          = Σ_τ  P(τ;θ) · R(τ) · ∇_θ log P(τ;θ)          ← 因为 ∇log P = ∇P / P\n\n用 m 条采样轨迹近似：\n  ĝ = (1/m) Σ_{i=1}^m  R(τ⁽ⁱ⁾) · ∇_θ log P(τ⁽ⁱ⁾; θ)", "pts": ["这一步单看毫无必要，<span class='k'>它的价值要到 p40 才兑现</span>：log 把连乘变成连加，动态项才能被求导消掉。", "变成期望之后就能<b>采样估计</b>了——跑 m 次策略，平均。", "<b>这一步的技术内容只有一个恒等式：<code>∇ log P = ∇P / P</code>，也就是对数求导。</b><span class='k'>所以「乘一个 P 再除一个 P」之后，<code>∇P/P</code> 就被改写成了 <code>∇ log P</code></span>，<b>而剩下的那个 <code>P</code> 正好把整个式子变回一个期望的形式。</b><span class='w'>从 <code>Σ_τ (···)</code> 变成 <code>Σ_τ P(τ;θ)·(···)</code>，就是从「一个求和」变成「一个期望」。</span>", "<b>为什么非要变成期望不可，这是这一步真正的动机，而且它很实际。</b><span class='k'>原式 <code>Σ_τ ∇_θP(τ;θ) R(τ)</code> 虽然正确，但没法算</span>——<b>轨迹有指数多条，你不可能逐条求和；而且它不是一个期望，所以也不能用采样去估。</b><span class='w'>变成 <code>E_{τ∼P(·;θ)}[R(τ) ∇_θ log P(τ;θ)]</code> 之后就不一样了</span>：<b>按你当前的策略跑 m 条轨迹，对每条算一下括号里的东西，平均——这就是一个无偏估计。</b><span class='k'>「把不可算的求和变成可采样的期望」是蒙特卡洛方法的核心套路，这里是一次典型应用。</span>", "<b>但这一步还有第二个、而且更深的理由，课件要到 p40 才揭晓，现在值得先记住悬念。</b><span class='w'>如果只是为了变成期望，有别的办法</span>；<span class='k'>而 <code>log</code> 带来了一个独一无二的好处：它把<b>连乘变成连加</b></span>。<b>而轨迹的概率 <code>P(τ;θ)</code> 恰好是一长串东西的连乘（初始分布 × 各步的转移 × 各步的策略）。</b><span class='w'>连乘求导要用乘法法则，一团乱；连加求导就是逐项求导，干净利落</span>——<b>而逐项求导之后，不含 θ 的那些项自己变成 0。</b><span class='k'>这就是 p40 的全部内容，而它的伏笔埋在这一页。</span>", "<b>这个技巧有好几个名字，知道它们指的是同一件事能省很多困惑。</b><span class='k'>似然比（likelihood ratio）、score function 估计量、REINFORCE 技巧</span>——<b>在不同文献里叫法不同，内容一样。</b><span class='w'>它在 RL 之外也到处都是</span>：<b>变分推断里的 REINFORCE 梯度、离散隐变量模型的训练、以及任何「要对一个分布的参数求期望的导数」的场合。</b><span class='k'>学会了这一个恒等式，受益远不止这一讲。</span>", "<b>这个恒等式有一个很值得记住的几何解释，它能让你一眼看出为什么估计量会有方差问题。</b><span class='k'><code>∇_θ log P(τ;θ)</code> 指向「让这条轨迹更可能发生」的方向</span>。<b>于是整个梯度是一堆方向向量的加权平均，权重是各条轨迹的回报。</b><span class='w'>如果所有权重都是大的正数，这些方向会互相抵消得很厉害</span>——<b>因为「让 A 更可能」和「让 B 更可能」在概率归一化下是互相拉扯的。</b><span class='k'>真正有用的信号藏在权重的<b>差异</b>里，而不是权重的绝对大小里。</span><b>这就是 p53 基线的全部动机，而它在这一页就已经看得出来了。</b>", "<b>再给一个最小的例子，把这个技巧的作用范围摸清楚。</b><span class='k'>假设你要最大化 <code>E_{x∼p_θ}[f(x)]</code>，而 x 是离散的、<code>f</code> 是一张查好的表</span>。<b>直接求导做不了——<code>f</code> 在离散点上根本没有导数。</b><span class='w'>但似然比告诉你：<code>∇_θ E[f] = E[f(x)·∇_θ log p_θ(x)]</code></span>，<b>右边完全可以采样估计。</b><span class='k'>这就是它在 RL 之外也到处都是的原因</span>——<b>任何「分布可微、但被求期望的函数不可微」的场合，它都适用。</b>", "<b>最后指出这个技巧的一个前提，它平时不碍事但该知道：求导和求和要能交换次序。</b><span class='k'>第一步 <code>∇_θ Σ_τ (…) = Σ_τ ∇_θ (…)</code> 就是在交换</span>。<span class='w'>有限轨迹、有限动作时这毫无问题</span>；<b>连续动作或无限 horizon 时，需要一些正则性条件才能保证合法。</b><span class='k'>课件 p21 那句「假设 episodic MDP」就是在回避这层技术细节</span>——<b>而这恰好也是你的流水线的形状，所以你不必担心。</b>"], "quote": "∇_θ V(θ) = ∇_θ Σ_τ P(τ;θ) R(τ) = Σ_τ ∇_θ P(τ;θ) R(τ) &nbsp;·&nbsp; = Σ_τ <b>[P(τ;θ)/P(τ;θ)]</b> ∇_θ P(τ;θ) R(τ) &nbsp;·&nbsp; <b>= Σ_τ P(τ;θ) R(τ) ∇_θ log P(τ;θ)</b>", "tbl": {"head": ["这一步", "做了什么", "为了什么"], "rows": [["<code>∇Σ → Σ∇</code>", "求导进到求和里面", "<span class='k'>有限项时合法</span>"], ["<b>乘一除一</b>", "插入 <code>P/P</code>", "<b>凑出 <code>∇P/P</code> 的形状</b>"], ["<code>∇P/P = ∇log P</code>", "换成对数的梯度", "<span class='k'>① 变回期望，可采样；② log 把连乘变连加</span>"], ["<span class='w'>（第②个好处要到 p40 才兑现）</span>", "—", "<b>这才是这一步真正的理由</b>"]]}},
{"r": [37, 39], "t": "score function 的直觉", "star": 3, "one": "<b>往「好样本」的方向推高它的对数概率，推多少取决于它有多好。</b>", "eq": "ĝ_i = f(x_i) · ∇_θ log p(x_i | θ)\n\nf(x) 衡量这个样本有多好（这里就是 R(τ)）", "pts": ["<span class='k'>f(x) 不连续、甚至形式未知都没关系</span>，样本空间是离散集合也行——这正是它比「对奖励直接求导」强的地方。", "直观：把参数往「能产出高回报轨迹」的方向挪。", "<b>这一页把那个公式翻译成了一句人话，而这句人话值得背下来：<span class='k'>往「好样本」的方向推高它的对数概率，推多少取决于它有多好</span>。</b><b>拆成两半看</b>：<span class='k'><code>∇_θ log p(x|θ)</code> 指出「要让这个样本更可能，参数该往哪挪」</span>；<span class='k'><code>f(x)</code> 决定「挪多少、往哪个方向」</span>——<b>好样本（f 大）就使劲推高，坏样本（f 为负）就反过来压低。</b>", "<b>最后那句 <em>valid even if f(x) is discontinuous, and unknown</em> 是这个估计量最反直觉的地方。</b><span class='w'>你在对一个<b>你没法求导、甚至不知道形式</b>的函数做梯度优化</span>。<span class='k'>怎么可能？因为你根本没对 <code>f</code> 求导</span>——<b>求导的对象是 <code>log p(x|θ)</code>，那是你自己写的分布，当然可导。</b><span class='w'><code>f(x)</code> 只是作为一个数值权重出现的。</span><b>于是「环境的奖励函数不可微」这件事完全不构成障碍，这正是它能用在 RL 里的根本原因。</b>", "<b>把这个洞见和上一讲的某处对照，你会发现它们是互补的。</b><span class='k'>L07 的行为克隆要求你知道「正确动作是什么」（专家标签）</span>；<span class='k'>这里只要求你知道「这条轨迹有多好」（一个标量）</span>。<b>后者的信息量少得多，但获取成本也低得多</b>——<span class='w'>你不需要有人告诉你每一步该怎么做，只需要事后给个总分。</span><b>这正是 RL 相对于监督学习的那个「便宜但稀疏」的监督信号（L07 p21）。</b>", "<b>最后提醒一个这个估计量的著名弱点，它直接通向这一讲的后三分之一。</b><span class='w'>注意 <code>f(x)</code> 是乘在整个 score 上的，而且是<b>一个标量乘一个向量</b></span>。<span class='k'>如果所有样本的 <code>f</code> 都是大的正数（比如回报都在 100 附近），那么所有样本的对数概率都会被推高</span>——<b>而概率要归一化，全推高等于谁也没推高，净效果只剩下噪声。</b><span class='w'>这就是为什么 p53 的基线那么重要</span>：<b>减掉一个基线，让「比平均好」的样本被推高、「比平均差」的被压低，信号才出得来。</b>", "<b>把这个估计量和监督学习的梯度并排写，差别会非常刺眼，而这个差别正是 RL 难的地方。</b><span class='k'>监督学习：<code>∇_θ log p_θ(y*|x)</code>——有人告诉你正确答案 <code>y*</code>，你直接推高它</span>。<span class='k'>这里：<code>f(x)·∇_θ log p_θ(x)</code>——没人告诉你正确答案，你只能把自己试过的样本按得分加权</span>。<b>于是监督学习的梯度是「朝着答案走」，而这里是「朝着试过的好样本走」。</b><span class='w'>后者的信息量低得多，这就是 RL 比监督学习费数据的根本原因。</span>", "<b>这也解释了一个常见的实践现象：策略梯度在早期几乎学不动。</b><span class='w'>训练刚开始时策略接近随机，采到的轨迹得分都差不多（而且都很低）</span>——<span class='k'>权重没有差异，于是梯度里几乎只有噪声</span>。<b>必须等到偶然采到一条明显更好的轨迹，才会出现有效的信号。</b><span class='w'>奖励越稀疏，等的时间越长</span>——<b>这正是 L07 p19 蒙特祖玛那个问题在策略梯度框架下的版本。</b><span class='k'>所以「用演示初始化策略」在实践中极其常用：它把你直接放到有信号的区域。</span>", "<b>最后提一个这个估计量的别名和它在今天的影响，这样你读新论文时能认出它。</b><span class='k'>RLHF 训练大模型时用的 PPO，骨架就是这个估计量</span>——<b><code>f(x)</code> 换成了奖励模型给的分数，<code>p_θ(x)</code> 换成了语言模型生成一段文本的概率。</b><span class='w'>「文本的好坏」显然是不可微的、而且形式未知</span>，<b>正好落在课件那句 <em>valid even if f(x) is discontinuous, and unknown</em> 的适用范围里。</b><span class='k'>这一页的公式和今天最热的那条技术线之间，只隔着若干工程细节。</span>"], "quote": "<b>ĝ_i = f(x_i) ∇_θ log p(x_i | θ)</b> &nbsp;·&nbsp; f(x) measures how good the sample x is &nbsp;·&nbsp; <b>Moving in the direction ĝ_i pushes up the logprob of the sample, in proportion to how good it is</b> &nbsp;·&nbsp; Valid even if f(x) is discontinuous, and unknown, or sample space (containing x) is a discrete set", "tbl": {"head": ["", "监督学习", "score function 估计量"], "rows": [["梯度形式", "<code>∇_θ log p_θ(y*|x)</code>", "<code>f(x)·∇_θ log p_θ(x)</code>"], ["谁告诉你方向", "<span class='k'>标签 y*</span>", "<span class='w'>只有一个得分 f(x)</span>"], ["被优化的量要可微吗", "<span class='w'>要</span>", "<span class='k'>不要，甚至可以形式未知</span>"], ["早期有信号吗", "<span class='k'>一直有</span>", "<span class='w'>得分都差不多时几乎只有噪声</span>"]]}},
{"r": [40, 41], "t": "拆开轨迹：动态项自己消失了", "star": 3, "one": "<b>这是整讲的转折点。</b>", "eq": "log P(τ⁽ⁱ⁾; θ) = log[ μ(s₀) · Π_{t} p(s_{t+1}|s_t,a_t) · π_θ(a_t|s_t) ]\n\n取 log 之后连乘变连加，再对 θ 求导：\n\n∇_θ log P = ∇_θ log μ(s₀)              ← 与 θ 无关，为 0\n          + Σ_t ∇_θ log p(s_{t+1}|s_t,a_t)  ← 与 θ 无关，为 0\n          + Σ_t ∇_θ log π_θ(a_t|s_t)       ← 只剩这一项", "pts": ["<span class='k'>初始状态分布和转移模型都不含 θ，求导直接归零。</span>", "<b>所以我们不需要知道动态模型</b>——这正是 model-free 的来由。", "回头看 p34 那个「乘一除一」：<b>它存在的全部理由就是为了这一步能拆开</b>。", "<b>这一页是整讲的转折点，而转折只用了三行。值得一行一行地看它凭什么成立。</b><span class='k'>第一行：轨迹的概率是一长串连乘</span>——<b>初始状态的概率 <code>μ(s₀)</code>，乘上每一步「策略选这个动作」的概率，再乘上每一步「环境转移到那个状态」的概率。</b><span class='w'>这个分解本身只用到了马尔可夫性，没有任何技巧。</span>", "<b>第二行：取 log，连乘变连加。</b><span class='k'>这正是 p34 那个似然比技巧埋下的伏笔在兑现</span>——<b>如果没有那个 log，你现在面对的是一个 <code>2T+1</code> 项的乘积求导，要反复用乘法法则。</b><span class='w'>有了 log，它变成一个加法，而加法的导数就是逐项的导数。</span>", "<b>第三行是全讲最漂亮的一步：逐项求导之后，三类项里有两类直接归零。</b><span class='k'><code>∇_θ log μ(s₀) = 0</code>，因为初始状态分布不含 θ</span>；<span class='k'><code>∇_θ log P(s_{t+1}|s_t,a_t) = 0</code>，因为转移模型不含 θ</span>；<b>只剩下 <code>Σ_t ∇_θ log π_θ(a_t|s_t)</code>——全是你自己的策略。</b><span class='w'>课件在那一行下面直接写了 <em>no dynamics model required!</em>，还带感叹号。</span>", "<b>这件事为什么值得感叹，一句话：<span class='k'>model-free 在这里不是一个妥协，是一个结论</span>。</b><span class='w'>前面几讲的 model-free 是「我们没有模型，所以只好采样」——是被迫的</span>；<b>而这里是「即使你有模型，梯度公式里也不会用到它」——是数学上的事实。</b><span class='k'>转移模型不是被近似掉的，是被精确地消掉的，一点误差都没留下。</span><b>于是策略梯度对「环境有多复杂、多难建模」完全不敏感。</b>", "<b>学生那个问题和老师的回答，恰好堵住了这里最容易产生的误解，值得再说一遍。</b><span class='w'>「动态难道不依赖策略吗？」——依赖，但只通过动作这一项</span>。<span class='k'>换个策略确实会走出不同的轨迹，所以你遇到的转移<b>确实</b>不一样</span>；<b>但「给定 <code>(s,a)</code> 之后环境怎么转」这个条件概率本身不含 θ。</b><span class='w'>影响是通过「你选了哪个 a」传递的，不是通过 <code>P</code> 这个函数本身</span>。<b>正是这个解耦让那一项的导数为零。</b>", "<b>最后提一个这个结论的边界，免得用过头：它说的是「梯度公式里不出现 P」，不是「P 对结果没影响」。</b><span class='k'>你采样到的轨迹当然受 <code>P</code> 支配</span>——<b><code>P</code> 的影响全部体现在「你采到了什么样本」上。</b><span class='w'>所以环境越随机，你的梯度估计方差越大，需要的样本越多</span>。<b>消掉的是「需要知道 P 的显式形式」这个要求，不是「P 带来的难度」。</b>", "<b>最后用一句话把这一页钉住，方便以后回忆：<span class='k'>环境出现在样本里，不出现在公式里</span>。</b><span class='w'>它决定你采到什么轨迹，但不出现在梯度的表达式中</span>。<b>所以你永远不需要写下 <code>P</code>，只需要能从环境里采样。</b>"], "say": "有同学问「动态难道不依赖策略吗」。老师答得很准：<b>依赖，但只通过动作这一项</b>。agent 选了动作之后，环境怎么转移和 agent 无关——<span class='k'>正是这个解耦让转移项的导数为零</span>。换个策略当然会走出不同的轨迹，但影响是通过动作传递的，不是通过转移模型本身。", "quote": "<b>∇_θ log P(τ^{(i)}; θ) = ∇_θ log [ μ(s_0) · Π_{t=0}^{T−1} π_θ(a_t|s_t) P(s_{t+1}|s_t,a_t) ]</b> &nbsp;·&nbsp; = ∇_θ [ log μ(s_0) + Σ_t log π_θ(a_t|s_t) + Σ_t log P(s_{t+1}|s_t,a_t) ] &nbsp;·&nbsp; <b>= Σ_{t=0}^{T−1} ∇_θ log π_θ(a_t|s_t)</b> &nbsp;·&nbsp; <b>no dynamics model required!</b>", "res": {"tag": "推断", "v": "<b>这一页对你的课题是一个很实际的解脱：你一直纠结的「我的转移模型准不准」，在策略梯度这条路上根本不用问。</b><br><br><span class='k'>你的处境是「近似有模型」——给定配置，流水线怎么走基本确定，但 LLM 的输出本身不可预测，所以 <code>P</code> 既不精确也不好估</span>（<b>L02 p20 的科研格讨论过这一点</b>）。<b>而这一页说：策略梯度的公式里 <code>P</code> 会精确地消掉。</b><span class='w'>不是近似消掉，是恒等地消掉</span>——<b>所以你不需要为了用它而去建一个工作流的转移模型。</b><br><br><b>这给了你一条和 FQE 截然不同的技术路线，而且它的假设负担轻得多。</b><span class='k'>FQE 要自举，所以吃马尔可夫假设，而且踩在致命三件套上（L05）</span>；<span class='k'>而 REINFORCE 式的策略梯度用的是整条轨迹的回报，不自举</span>——<b>于是它天然避开了三件套里的第二条腿。</b><span class='w'>代价是方差大、而且是 on-policy 的</span>（<b>p8 的缺点那两条</b>）。<br><br><b>所以两条路的取舍对你是这样的：</b><br><b>① FQE</b>：<span class='k'>能用现成日志（off-policy），样本效率高</span>；<span class='w'>但吃马尔可夫假设、可能发散、要配 oracle 校验</span>。<br><b>② 策略梯度</b>：<span class='k'>不要模型、不自举、假设少</span>；<span class='w'>但必须按当前策略重新采样，日志用一次就作废</span>。<br><b>而你恰好可以重新采样（跑一次流水线是 API 调用，不是人工）</b>——<span class='k'>这和 L07 p33 科研格说的是同一件事：你的「专家标签」是自动的，所以 on-policy 对你没有别人那么贵。</span><b>这一条值得认真评估，它可能比你当前的 FQE 路线假设更干净。</b>", "ref": "课件 p40–p41 原文（no dynamics model required）· L05 p38 · L07 p33 科研格 · L02 p20 科研格"}, "tbl": {"head": ["log P(τ;θ) 拆出来的项", "含 θ 吗", "求导结果", "什么意思"], "rows": [["<code>log μ(s₀)</code>（初始状态分布）", "<span class='w'>不含</span>", "<span class='k'>0</span>", "起点在哪跟你的参数无关"], ["<code>Σ_t log P(s_{t+1}|s_t,a_t)</code>（转移）", "<span class='w'>不含</span>", "<span class='k'>0</span>", "<b>给定 (s,a) 后环境怎么转，跟你的参数无关</b>"], ["<code>Σ_t log π_θ(a_t|s_t)</code>（策略）", "<span class='k'>含</span>", "<b>唯一留下的那一项</b>", "<span class='k'>全部梯度都来自你自己的策略</span>"]]}},
{"r": [42, 43], "t": "score function 与合起来的式子", "star": 2, "one": "<code>∇_θ log π_θ(s,a)</code> 就叫 score function。", "eq": "ĝ = (1/m) Σ_{i=1}^m  R(τ⁽ⁱ⁾) · Σ_{t=0}^{T-1} ∇_θ log π_θ(a_t⁽ⁱ⁾ | s_t⁽ⁱ⁾)", "pts": ["每个见过的 <code>(s,a)</code> 都能算出一个 score，<b>全程不需要动态模型</b>。", "代价：<span class='w'>你的策略参数化必须让这个导数算得出来</span>——p51/p52 给两个现成的。", "<b>把这个最终式子的每一部分指认一遍，你就知道实现它要写哪些代码了。</b><span class='k'><code>(1/m) Σ_i</code>：跑 m 条轨迹，取平均</span>；<span class='k'><code>R(τ⁽ⁱ⁾)</code>：第 i 条轨迹的总回报，一个标量</span>；<span class='k'><code>Σ_t ∇_θ log π_θ(a_t|s_t)</code>：这条轨迹上每一步的 score 加起来，一个向量</span>。<b>于是每条轨迹贡献「一个标量 × 一个向量」，m 条平均，就是梯度估计。</b><span class='w'>全部材料都来自你自己的策略和观测到的奖励，没有一样需要环境的内部信息。</span>", "<b>老师对「score function」这个名字的吐槽值得记一下，因为它确实容易误导：「这个术语我不觉得特别有帮助，但到处都在用。」</b><span class='k'>这个词来自统计学——在最大似然估计里，对数似然对参数的梯度就叫 score</span>。<b>它在那里的含义是「数据对参数的敏感度」。</b><span class='w'>搬到这里，含义变成了「让这个动作更可能，参数该往哪挪」</span>——<b>和原本的统计含义关系不大，但名字留下来了。</b><span class='k'>记住它的式子，别纠结它的名字。</span>", "<b>这个式子有一个现在就该看出来的问题，它是后面降方差那一整节的起因。</b><span class='w'>注意 <code>R(τ⁽ⁱ⁾)</code> 乘在<b>整条轨迹</b>的每一个 score 上</span>——<b>包括第 0 步的那个。</b><span class='k'>也就是说，如果这条轨迹最后结果很好，那么第 0 步的动作也会被推高，哪怕它其实是个烂动作，好结果全是后面几步挣回来的</span>。<b>这叫「功劳分配」做得太粗。</b><span class='w'>p47 的因果性修正就是来治这个的，而它的理由干净得不得了：第 t 步的动作影响不了第 t 步之前已经发生的奖励。</span>", "<b>最后那句「策略参数化必须让这个导数算得出来」是对实现的唯一硬要求。</b><span class='k'>好消息是常用的两种参数化都有闭式的 score</span>：<b>softmax 策略（p51）和高斯策略（p52）。</b><span class='w'>而且在自动微分框架里你根本不用手推</span>——<b>写出 <code>log π_θ(a|s)</code>，框架替你求导。</b><span class='k'>所以实践中这条要求几乎是免费的，只要你的策略是用可微算子搭的。</span>", "<b>实现时还有一个几乎人人都会踩的坑，顺带说清楚：框架里没有「梯度」这个 API，只有「损失」。</b><span class='k'>所以你不是直接写梯度，而是写一个「代理损失」(surrogate loss)，让它的梯度恰好等于你要的那个</span>：<b><code>L = −(1/m) Σ_i R(τ⁽ⁱ⁾) Σ_t log π_θ(a_t|s_t)</code>，然后对它做常规的反向传播。</b><span class='w'>注意 <code>R(τ)</code> 必须被当成常数（detach / stop-gradient）</span>——<b>它虽然也是从环境里来的数，但在数学上它和 θ 无关（p32 说过），一旦让梯度流进去就完全错了。</b>"], "say": "老师对这个名字没什么好感：「<b>这个术语我不觉得特别有帮助，但到处都在用</b>，所以还是介绍一下。」", "quote": "Define <b>score function</b> as ∇_θ log π_θ(s,a) &nbsp;|&nbsp; <b>∇_θ V(θ) ≈ ĝ = (1/m) Σ_{i=1}^{m} R(τ^{(i)}) Σ_{t=0}^{T−1} ∇_θ log π_θ(a_t^{(i)} | s_t^{(i)})</b> &nbsp;·&nbsp; <b>Do not need to know dynamics model</b>"},
{"r": [44, 45], "t": "策略梯度定理", "star": 3, "one": "把上面那套推广到三种目标函数，答案是<b>同一个形式</b>。", "eq": "对任何可微的 π_θ(s,a)，\n对 J = J₁（episodic）、J_avR（平均每步奖励）或 (1/(1−γ))·J_avV（平均值）：\n\n     ∇_θ J(θ) = E_{π_θ}[ ∇_θ log π_θ(s,a) · Q^{π_θ}(s,a) ]", "pts": ["<span class='k'>把 R(τ) 换成了 Q</span>——这为后面用 critic 估 Q 铺好了路。", "细节见 Sutton &amp; Barto 第 13 章。", "<b>这个定理的价值在于它把 p42 那个具体的式子一般化了，而一般化的方向有两个，都值得注意。</b><span class='k'>第一个方向：对三种目标函数都成立</span>——<b>你不用为「episodic」和「持续任务」各推一遍。</b><span class='k'>第二个方向、也是更重要的：<code>R(τ)</code> 被换成了 <code>Q^{π_θ}(s,a)</code></span>。<b>这一换打开了后面所有的门。</b>", "<b>为什么换成 Q 是一个大改进，想清楚这一点就懂了后半讲和下一讲。</b><span class='w'><code>R(τ)</code> 是一整条轨迹的总回报，一个标量，噪声极大</span>；<span class='k'><code>Q^{π}(s,a)</code> 是「在 s 做 a 之后的期望回报」，它已经对未来的随机性取过期望了</span>。<b>换句话说，Q 是 <code>R(τ)</code> 的一个「去噪版本」。</b><span class='w'>但代价是你不知道 Q，得估</span>——<b>而估 Q 正是 critic 的工作，于是 Actor-Critic 就这么出来了。</b>", "<b>把这个定理读成一个「配方」，后面的所有变体就都能对号入座了。</b><span class='k'>公式的形状永远是 <code>E[∇log π · (某个衡量这个动作有多好的量)]</code></span>。<b>换掉括号里那个量，就得到一个新算法</b>：<span class='w'>用整条轨迹回报 <code>R(τ)</code> ⇒ 最朴素的版本（p42）</span>；<span class='w'>用之后的回报 <code>G_t</code> ⇒ REINFORCE（p49）</span>；<span class='w'>用 <code>G_t − b(s)</code> ⇒ 带基线（p53）</span>；<span class='w'>用 <code>Q(s,a) − V(s)</code>（也就是优势）⇒ Actor-Critic（下一讲）</span>。<b>四个算法，一个骨架。</b>", "<b>最后提醒一处容易漏看的细节：定理里的 <code>E_{π_θ}</code> 是对「状态和动作」取期望，而状态的分布是策略诱导的。</b><span class='k'>所以这个期望不能用别的策略采的数据去估</span>——<b>这就是策略梯度是 on-policy 方法的根源。</b><span class='w'>参数一更新，诱导的状态分布就变了，旧数据的分布就不对了</span>。<b>要想用旧数据，就得做重要性修正（这是第十讲和 PPO 的起点）</b>——<span class='k'>而那又把你拖回 L05 那个「两个分布差太远就不行」的老问题。</span>", "<b>顺便留意定理里那个 <code>1/(1−γ)</code> 因子只挂在 <code>J_avV</code> 上，这不是笔误。</b><span class='k'>三个目标函数的量纲不一样</span>——<b>平均值和累计值之间差一个「有效视野」的倍数，正好是 <code>1/(1−γ)</code>（L02 p13 讲过这个数的含义）。</b><span class='w'>加上这个因子之后，三者的梯度才能写成同一个式子</span>。<b>这种「配一个常数让几个结论统一」的做法在教材里很常见，看到不用慌。</b>"], "quote": "The policy gradient theorem generalizes the likelihood ratio approach &nbsp;|&nbsp; <b>Theorem</b>: For any differentiable policy π_θ(s,a), for any of the policy objective function J = J_1 (episodic reward), J_avR (average reward per time step), or (1/(1−γ)) J_avV (average value), the policy gradient is &nbsp;·&nbsp; <b>∇_θ J(θ) = E_{π_θ}[ ∇_θ log π_θ(s,a) · Q^{π_θ}(s,a) ]</b>", "tbl": {"head": ["括号里换成什么", "得到的算法", "方差", "出现在"], "rows": [["<code>R(τ)</code> 整条轨迹回报", "最朴素的似然比估计", "<span class='w'>最大</span>", "本讲 p42"], ["<code>G_t</code> 第 t 步之后的回报", "<b>REINFORCE</b>", "<span class='w'>较大</span>", "本讲 p47–p49"], ["<code>G_t − b(s_t)</code>", "带基线的 REINFORCE", "<span class='k'>小</span>", "本讲 p53–p59"], ["<code>Q(s,a) − V(s)</code>（优势）", "<b>Actor-Critic</b>", "<span class='k'>最小</span>", "<b>下一讲</b>"]]}},
{"r": [46, 46], "t": "无偏，但噪声极大", "star": 3, "one": "能用是能用，<b>方差大到不实用</b>。", "pts": ["和第三讲的<b>蒙特卡洛</b>是同一个味道：跑完整条轨迹、求和、平均。无偏、高方差。", "两个让它实用起来的修法：<span class='k'>利用时间结构</span>、<span class='k'>引入基线</span>。", "<b>「无偏但噪声极大」这六个字要分开理解，因为它们指向两件完全不同的事。</b><span class='k'>无偏</span>：<b>如果你能跑无穷多条轨迹，平均出来就是真梯度，一点系统性偏差都没有。</b><span class='w'>噪声极大</span>：<b>而你只能跑几条，所以每次算出来的那个向量可能指向任何方向。</b><span class='k'>无偏是一个关于「极限」的性质，方差是一个关于「你实际拿到什么」的性质</span>——<b>后者才决定算法能不能用。</b>", "<b>方差大到什么程度，可以从 p42 那个式子的结构直接看出来，而且相当吓人。</b><span class='k'>整条轨迹的回报 <code>R(τ)</code> 是一个标量，它乘在轨迹上<b>每一个</b> score 上</span>。<b>而 <code>R(τ)</code> 本身的方差，L02 p14 早就演示过：同一起点三条轨迹，1.25 / 0 / 0.125。</b><span class='w'>轨迹越长，<code>R(τ)</code> 的方差越大（更多步的随机性累加），而被它乘的 score 项也越多</span>——<b>于是方差大致随 <code>T</code> 平方级增长。</b><span class='k'>长 horizon 的任务里，朴素的策略梯度基本没法用。</span>", "<b>课件列的两个修法，各自攻的是方差的不同来源，这一点值得先分清。</b><br><b>① 时间结构（p47）</b>：<span class='k'>攻的是「功劳分配太粗」</span>——第 t 步的动作被整条轨迹的回报加权，包括它之前的部分。<b>那部分纯属噪声。</b><br><b>② 基线（p53）</b>：<span class='k'>攻的是「权重的绝对值太大」</span>——所有轨迹的回报都是大正数时，信号藏在差异里而不是绝对值里。<br><span class='w'>两招正交，可以叠加，而且实践中都是标配。</span>", "<b>要特别注意这两招都<span class='k'>不引入偏差</span>，这是它们之所以是「免费午餐」的原因。</b><span class='w'>一般来说降方差要付偏差的代价（比如自举就是拿偏差换方差）</span>；<b>而这两招是纯粹的方差削减，期望一点没变。</b><span class='k'>p55 会给出基线那一招的完整证明</span>，<b>而因果性那一招的理由更简单：被删掉的那些项，期望本来就是 0。</b><span class='w'>既然期望为 0，删掉它只减方差不改均值。</span>"], "say": "老师现场问「怎么降方差」，有同学答 <b>bootstrap</b>。老师说完全正确——但今天先做一件不走那么远的事（时间结构），bootstrap 那条线下一讲再走。", "quote": "∇V(θ) ≈ (1/m) Σ_i R(τ^{(i)}) Σ_t ∇_θ log π_θ(a_t|s_t) &nbsp;|&nbsp; <b>Unbiased but very noisy</b> &nbsp;·&nbsp; Fixes that can make it practical: <b>Temporal structure</b> &nbsp;·&nbsp; <b>Baseline</b> &nbsp;·&nbsp; Next time will discuss some additional tricks", "tbl": {"head": ["修法", "攻的是什么", "引入偏差吗", "在哪一页"], "rows": [["<b>① 时间结构（因果性）</b>", "功劳分配太粗：score 被它之前的奖励加权", "<span class='k'>不</span>", "p47–p48"], ["<b>② 基线</b>", "权重绝对值太大，信号藏在差异里", "<span class='k'>不（p55 证）</span>", "p53–p56"], ["<b>③ 值函数当基线</b>", "基线取得越准，方差削得越狠", "<span class='k'>不（它仍是基线）</span>", "p59"], ["<b>④ n 步估计</b>", "用自举换掉一部分采样噪声", "<span class='w'>引入（拿偏差换方差）</span>", "p60"]]}},
{"r": [47, 48], "t": "修法一：利用时间结构", "star": 3, "one": "<b>t 时刻的动作管不着 t 之前的奖励。</b>", "eq": "原式： ∇_θE[R] = E[ (Σ_t r_t) · (Σ_t ∇_θ log π_θ(a_t|s_t)) ]\n\n对单个奖励 r_{t′} 重做一遍同样的推导：\n  ∇_θ E[r_{t′}] = E[ r_{t′} · Σ_{t=0}^{t′} ∇_θ log π_θ(a_t|s_t) ]\n                                   ↑ 只加到 t′，不是加到 T\n\n对 t′ 求和并重排，把 t 提到外层：\n  ∇_θE[R] = E[ Σ_t ∇_θ log π_θ(a_t|s_t) · Σ_{t′=t}^{T-1} r_{t′} ]\n                                          └──── 就是回报 G_t ────┘", "pts": ["<b>重排之后，每个 score 只乘上它「负责得起」的那部分奖励。</b>", "早期的 score 出现在很多项里，最后一个只管最后一个奖励——<span class='k'>把这些项收拢，方差就降下来了</span>。", "结果里出现的 <code>G_t</code> 正是第三讲那个回报。", "<b>这一招的道理用一句话就能说完，而且说完之后你会觉得它是显然的：<span class='k'>第 t 步的动作，影响不了第 t 步之前已经发生的奖励</span>。</b><b>所以把 <code>r_0, …, r_{t−1}</code> 乘在第 t 步的 score 上，毫无道理。</b><span class='w'>它们和这个动作在统计上独立，乘积的期望等于期望的乘积，而 score 的期望是 0（p55 的证明会用到这一点）</span>——<b>于是这些项对梯度的<span class='k'>期望</span>贡献为零，只贡献方差。</b><span class='w'>删掉它们，纯赚。</span>", "<b>课件的推导顺序值得注意，它是反过来做的：先对<span class='k'>单个奖励项</span>推，再求和。</b><span class='k'>对 <code>r_{t′}</code> 这一项用同样的似然比论证，得到它只和 <code>t ≤ t′</code> 的那些 score 有关</span>；<b>然后对所有 <code>t′</code> 求和，交换求和次序，就得到「每个 score 乘它之后的回报」。</b><span class='w'>这个「先拆到最细再重组」的做法，比直接论证「前面的项能删」更严谨</span>——<b>它顺带证明了保留下来的那些项是对的，而不只是删掉的那些是错的。</b>", "<b>改完之后的式子有一个很好的名字可以记：每个动作乘上「它<span class='k'>之后</span>的回报」<code>G_t</code>。</b><span class='w'>原来是 <code>Σ_t ∇log π(a_t|s_t) · R(τ)</code>，所有 t 共用同一个 R</span>；<span class='k'>现在是 <code>Σ_t ∇log π(a_t|s_t) · G_t</code>，每个 t 用自己的 <code>G_t</code></span>。<b>而 <code>G_t</code> 正是 L02 p12 定义的那个回报——「从 t 时刻算起的折扣奖励和」。</b><span class='w'>老朋友在这里又出现了。</span>", "<b>这一招削掉多少方差，可以估一估，结论是：<span class='k'>长 horizon 下削得非常多</span>。</b><b>原来第 t 步的 score 被 T 个奖励加权，现在只被 <code>T − t</code> 个</b>——<span class='w'>平均下来少了一半的噪声来源</span>。<b>对早期的步骤削得少（<code>t</code> 小时 <code>T−t</code> 仍然大），对后期的步骤削得多（最后一步只剩一个奖励）。</b><span class='k'>所以它对「结尾的动作」帮助最大，而那往往正是最该学准的部分。</span>", "<b>顺带提一个记忆口诀，避免写代码时把方向搞反：<span class='k'>「向后看的奖励要删，向前看的回报要留」</span>。</b><span class='w'>第 t 步的 score 乘的是 <code>G_t</code>，而 <code>G_t</code> 的求和从 t 开始往后</span>——<b>实现时通常是从轨迹末尾往前倒着累加，一遍扫完。</b>"], "quote": "E[r_{t′}] = E[ r_{t′} Σ_{t=0}^{t′} ∇_θ log π_θ(a_t|s_t) ] &nbsp;·&nbsp; Summing this formula over t′: <b>∇_θ V(θ) = E[ Σ_{t=0}^{T−1} ∇_θ log π_θ(a_t,s_t) Σ_{t′=t}^{T−1} r_{t′} ]</b> &nbsp;|&nbsp; Recall for a particular trajectory, <b>Σ_{t′=t}^{T−1} r_{t′} is the return G_t</b> &nbsp;·&nbsp; E[R] ≈ (1/m) Σ_i Σ_t ∇_θ log π_θ(a_t,s_t) G_t^{(i)}"},
{"r": [49, 49], "t": "REINFORCE", "star": 3, "one": "似然比 + 时间结构，合起来就是这个算法。", "eq": "Δθ_t = α · ∇_θ log π_θ(s_t, a_t) · G_t\n\n随机初始化 θ\n对每个片段 {s₁,a₁,r₂,…,s_{T-1},a_{T-1},r_T} ~ π_θ：\n    for t = 1 … T−1：\n        θ ← θ + α·∇_θ log π_θ(s_t,a_t)·G_t\n返回 θ", "pts": ["<b>RL 里最常见的策略梯度算法。</b>", "一个片段跑完之后，用<b>更新过的</b>参数再采下一个片段。", "<b>REINFORCE 是这一讲第一个完整的算法，而它简单到可以用三句话说完。</b><span class='k'>① 按当前策略跑完一个片段；② 对片段里的每一步，算出它之后的回报 <code>G_t</code>；③ 按 <code>∇log π(a_t|s_t)·G_t</code> 更新参数</span>。<b>没有值函数，没有回放池，没有目标网络。</b><span class='w'>它是整门课里结构最简单的算法之一，而且 1992 年就有了。</span>", "<b>名字的来历值得一提，因为它其实是个缩写，而拆开之后正好描述了算法本身。</b><span class='k'>REINFORCE = REward Increment = Nonnegative Factor × Offset Reinforcement × Characteristic Eligibility</span>（Williams, 1992）。<b>翻译过来大致是：参数增量 = 一个非负的步长 × 一个「比基准好多少」的量 × 一个「这个动作对参数的敏感度」。</b><span class='w'>最后那个「特征资格」就是 score function</span>。<b>缩写很勉强，但它确实把式子的三个因子都点到了。</b>", "<b>这个算法有一个必须注意的性质，它解释了为什么它在实践中那么难用：<span class='w'>它必须等片段结束才能更新</span>。</b><span class='k'>因为 <code>G_t</code> 需要知道 t 之后的全部奖励</span>。<b>于是它是一个彻底的蒙特卡洛方法</b>——<span class='w'>片段不结束就一个字都学不了，而且片段越长，等得越久、方差越大</span>。<b>这正是 L03 里 MC 和 TD 那条分界线在策略梯度上的翻版</b>，<span class='k'>而 p60 的 n 步估计就是在这条线上找中间点。</span>", "<b>最后提一个实现上的坑，几乎每个第一次写 REINFORCE 的人都会踩。</b><span class='w'>伪代码里写的是「对每个 t 做一次更新」，但那样做会让同一个片段里的更新互相干扰</span>——<span class='k'>第 1 步更新完参数之后，第 2 步的 <code>∇log π</code> 已经是新参数下的了，而 <code>G_2</code> 是旧策略采的</span>。<b>正确做法是把整个片段（或一批片段）的梯度累加起来，最后统一更新一次。</b><span class='w'>这既符合推导（梯度是一个期望），也避免了片段内的分布漂移。</span>"], "quote": "Leverages likelihood ratio / score function and temporal structure &nbsp;·&nbsp; <b>Δθ_t = α ∇_θ log π_θ(s_t, a_t) G_t</b> &nbsp;|&nbsp; <b>REINFORCE</b>: Initialize policy parameters θ arbitrarily &nbsp;·&nbsp; for each episode {s_1, a_1, r_2, ..., s_{T−1}, a_{T−1}, r_T} ~ π_θ do &nbsp;·&nbsp; for t = 1 to T−1 do: θ ← θ + α ∇_θ log π_θ(s_t,a_t) G_t &nbsp;·&nbsp; endfor &nbsp;·&nbsp; return θ"},
{"r": [50, 50], "t": "可微的策略类", "one": "Softmax、高斯、神经网络。", "pts": ["选哪个决定了 <code>∇_θ log π_θ</code> 好不好算。", "<b>这三个选项其实分成两层，混在一起容易误解，值得拆开。</b><span class='k'>softmax 和高斯说的是「输出层的形状」</span>——<b>前者给离散动作一个分布，后者给连续动作一个分布。</b><span class='k'>神经网络说的是「从状态到那些参数的映射有多复杂」</span>。<span class='w'>两者是正交的</span>：<b>你完全可以用一个神经网络输出 softmax 的 logits，或者输出高斯的均值——实践中这正是标准做法。</b>", "<b>选哪个的判据只有一条，而且很硬：<span class='k'>动作空间是离散的还是连续的</span>。</b><b>离散（选哪一档保真度、按哪个键）⇒ softmax；连续（转多少度、设多大的 temperature）⇒ 高斯。</b><span class='w'>如果动作既有离散部分又有连续部分</span>（<b>很常见</b>），<span class='k'>就让网络同时输出两组参数，联合概率是两者的乘积，score function 也就是两个 score 相加</span>——<b>因为 <code>log(pq) = log p + log q</code>。</b>", "<b>还有一类课件没列但你会遇到的参数化：确定性策略加上固定噪声。</b><span class='k'><code>a = f_θ(s) + ε</code>，其中 ε 是外加的探索噪声</span>。<b>它在形式上就是一个方差固定的高斯策略，所以仍然在这个框架里。</b><span class='w'>但如果你把噪声也当成「环境的一部分」而不是策略的一部分，推导就不成立了</span>——<b>此时需要的是确定性策略梯度（DPG），那是另一套公式。</b><span class='k'>区分的关键：随机性是不是由你的参数控制的。</span>"], "quote": "Many choices of differentiable policy classes including: <b>Softmax</b> &nbsp;·&nbsp; <b>Gaussian</b> &nbsp;·&nbsp; <b>Neural networks</b>"},
{"r": [51, 51], "t": "Softmax 策略（离散动作）", "star": 3, "one": "特征线性加权后取指数再归一化。", "eq": "π_θ(s,a) = exp(φ(s,a)ᵀθ) / Σ_{a′} exp(φ(s,a′)ᵀθ)\n\nscore：∇_θ log π_θ(s,a) = φ(s,a) − E_{π_θ}[ φ(s,·) ]", "pts": ["<b>读法：你实际观察到的特征，减去按策略平均的特征。</b>", "适用于<span class='k'>离散动作空间</span>——很多 Atari 游戏就是。", "<b>这个 score function 的形式极其漂亮，而且它的含义可以一眼看出来：<span class='k'>实际用的特征，减去平均会用的特征</span>。</b><b><code>φ(s,a)</code> 是你这次选的动作的特征，<code>E_{π_θ}[φ(s,·)]</code> 是按当前策略加权的平均特征。</b><span class='w'>如果你选的动作就是「平均水平」，这个差就是 0，参数不动</span>；<span class='k'>如果你选了一个特征和平均很不一样的动作，差就大，参数会被推一下</span>。<b>推的方向是「让这类动作更可能」，推多少由回报加权决定。</b>", "<b>这个「减去均值」的结构在机器学习里到处都是，认出它能省很多推导。</b><span class='k'>softmax + 交叉熵的梯度是「预测分布 − 真实分布」</span>；<span class='k'>指数族分布的对数似然梯度是「观测到的充分统计量 − 期望的充分统计量」</span>。<b>这一页就是后者的一个特例。</b><span class='w'>所以如果你以后要给一个新的策略类推 score function，先看它是不是指数族——是的话，直接套这个形式就行。</span>", "<b>实践上有两件事值得知道，它们都和数值稳定有关。</b><span class='k'>① 计算 softmax 时要减去最大的 logit 再取指数</span>（<b><code>e^{x−max}</code> 而不是 <code>e^x</code></b>），<span class='w'>否则 logit 稍大就会溢出</span>。<span class='k'>② 加一个温度参数 <code>τ</code>：<code>π ∝ e^{φᵀθ/τ}</code></span>——<b><code>τ</code> 大则策略接近均匀（多探索），<code>τ</code> 小则接近贪心。</b><span class='w'>这给了你一个独立于 θ 的探索旋钮，调起来比调 θ 的初始化方便得多。</span>"], "quote": "Weight actions using linear combination of features φ(s,a)^T θ &nbsp;·&nbsp; Probability of action is proportional to exponentiated weight &nbsp;·&nbsp; <b>π_θ(s,a) = e^{φ(s,a)^T θ} / Σ_{a′} e^{φ(s,a′)^T θ}</b> &nbsp;·&nbsp; The score function is &nbsp;·&nbsp; <b>∇_θ log π_θ(s,a) = φ(s,a) − E_{π_θ}[φ(s,·)]</b>", "tbl": {"head": ["", "softmax（离散动作）", "高斯（连续动作）"], "rows": [["策略形式", "<code>π ∝ e^{φ(s,a)ᵀθ}</code>", "<code>a ~ N(μ_θ(s), σ²)</code>"], ["score function", "<code>φ(s,a) − E[φ(s,·)]</code>", "<code>(a − μ(s))·φ(s) / σ²</code>"], ["读法", "<span class='k'>实际特征 − 平均特征</span>", "<span class='k'>实际动作 − 平均动作，按特征摊开</span>"], ["数值陷阱", "<span class='w'>logits 太大会溢出，要减 max</span>", "<span class='w'>σ 变小会让梯度爆炸，要设下界或加熵</span>"], ["探索旋钮", "温度 τ", "σ"]]}},
{"r": [52, 52], "t": "高斯策略（连续动作）", "star": 3, "one": "均值是特征的线性组合，方差先当固定的。", "eq": "μ(s) = φ(s)ᵀθ\na ~ N( μ(s), σ² )\n\nscore：∇_θ log π_θ(s,a) = (a − μ(s))·φ(s) / σ²", "pts": ["<b>读法：你实际做的动作比均值高出多少，就往那个方向推多少。</b>", "控制和机器人里最常用——<span class='k'>连续动作空间</span>。", "σ² 也可以参数化去学，这里为简单起见固定。", "<b>高斯策略的 score function 同样可以一眼读懂：<span class='k'>实际动作减去均值，再乘上特征，除以方差</span>。</b><b><code>(a − μ(s))</code> 是「这次实际做的，比平均高还是低」</b>；<span class='k'>乘上 <code>φ(s)</code> 把这个偏离分配到各个参数上</span>；<span class='w'>除以 <code>σ²</code> 做归一化</span>。<b>于是如果你偏高地采样、而且回报好，均值就被往上推——完全符合直觉。</b>", "<b>那个 <code>1/σ²</code> 是这一页最该警惕的地方，它藏着一个实践中的大坑。</b><span class='w'>σ 越小，score 越大，梯度越大</span>。<span class='k'>而训练过程中策略往往会越来越确定，也就是 σ 越来越小</span>——<b>于是梯度会越来越大，训练后期容易爆炸。</b><span class='w'>标准的两种防法：① 给 σ 设一个下界；② 在目标里加熵奖励，不让策略过早变确定</span>。<b>第二种还顺带保住了探索，所以更常用。</b>", "<b>「方差可以固定，也可以参数化」这个选择值得想一下，它影响的东西比看起来多。</b><span class='k'>固定 σ：简单、稳定，但探索的幅度全程不变</span>——<b>早期可能不够探索，后期又停不下来。</b><span class='k'>参数化 σ：算法可以自己学「什么时候该大胆、什么时候该保守」</span>，<span class='w'>但也可能学会把 σ 压到极小来「作弊」地降低方差，然后卡在局部最优</span>。<b>实践中常见的折中是：让 σ 可学，但加熵正则拉住它。</b>", "<b>最后指出为什么「连续动作第一次变得自然」这句话值得强调。</b><span class='w'>基于值的方法要在连续动作上取 <code>arg max_a Q(s,a)</code>，这本身是个优化问题，每一步都要解一次</span>；<span class='k'>而高斯策略直接从分布里采一个动作就完了，根本没有 max</span>。<b>这就是 p8 那条「连续动作空间更有效」的具体兑现</b>——<span class='w'>不是快一点，是结构上根本不需要那一步。</span>"], "quote": "In continuous action spaces, a Gaussian policy is natural &nbsp;·&nbsp; Mean is a linear combination of state features <b>μ(s) = φ(s)^T θ</b> &nbsp;·&nbsp; Variance may be fixed σ², or can also be parametrised &nbsp;·&nbsp; Policy is Gaussian <b>a ∼ N(μ(s), σ²)</b> &nbsp;·&nbsp; The score function is <b>∇_θ log π_θ(s,a) = (a − μ(s)) φ(s) / σ²</b>"},
{"r": [53, 54], "t": "修法二：引入基线", "star": 3, "one": "从回报里减去一个只依赖状态的 <code>b(s)</code>，<b>方差降了，偏差没来</b>。", "eq": "∇_θE[R] = E[ Σ_t ∇_θ log π(a_t|s_t,θ) · ( Σ_{t′=t}^{T-1} r_{t′} − b(s_t) ) ]\n\n对任何 b(s)，这个估计量都是无偏的。\n接近最优的取法：b(s_t) ≈ E[ r_t + r_{t+1} + … + r_{T-1} ]", "pts": ["<b>读法：把动作 a_t 的对数概率推高多少，取决于回报比「预期」好多少。</b>", "<span class='k'>b(s) 只能依赖状态，不能依赖动作</span>——下一页的证明就靠这一点。", "<b>基线的直觉，课件那句 <em>better than expected</em> 已经说尽了，但值得把它和「不用基线」对比着说。</b><span class='w'>不用基线时，只要回报是正的，这个动作的概率就被推高</span>——<b>哪怕它其实是所有动作里最差的那个（只是恰好也拿到了正回报）。</b><span class='k'>用了基线之后，推高还是压低取决于「比预期好还是差」</span>。<b>于是信号从「绝对好坏」变成了「相对好坏」，而后者才是你真正需要的。</b>", "<b>为什么减一个数能削方差，可以用一个极端例子看明白。</b><span class='k'>假设所有轨迹的回报都在 1000 附近，彼此只差 ±1</span>。<b>不减基线：权重都是 1000 左右，于是所有动作的概率都被使劲推高</b>——<span class='w'>而概率要归一化，全推高等于白推，净效果只剩这些大权重带来的噪声。</span><span class='k'>减去基线 1000：权重变成 ±1，真正反映了差异</span>。<b>期望没变（p55 会证），但估计量的量级小了三个数量级，方差也跟着小了。</b>", "<b>「任何 <code>b(s)</code> 都不引入偏差」这句话里的限定条件要看清楚，它是这一招的使用说明。</b><span class='k'>基线只能依赖<b>状态</b>，不能依赖<b>动作</b></span>。<b>写成 <code>b(s_t)</code> 而不是 <code>b(s_t, a_t)</code>，这个区别是生死攸关的。</b><span class='w'>p55 的证明里，关键一步正是「把 <code>b(s_t)</code> 提到对动作的期望外面」</span>——<b>如果它含 <code>a_t</code>，这一步就做不了，证明垮掉，估计量就有偏了。</b><span class='k'>这是实现时最容易犯的错误之一：顺手把动作信息塞进基线。</span>", "<b>「最优基线近似是期望回报」这一条，背后有一个可以推出来的完整结论，值得知道。</b><span class='k'>严格求解「哪个 b 让方差最小」，答案是一个按 <code>‖∇log π‖²</code> 加权的期望回报</span>，<b>而不是纯粹的期望回报。</b><span class='w'>但那个加权版本既难估又收益有限</span>，<b>所以实践中一律用 <code>b(s) ≈ V(s)</code>——也就是 p59 要讲的。</b><span class='k'>这是一个「理论最优 vs 实践够用」的典型例子：知道有更好的，但不用它。</span>", "<b>再补一个最省事、也最常被忽略的基线：<span class='k'>这一批轨迹回报的均值</span>。</b><span class='w'>它甚至不依赖状态（是个常数），所以显然满足「不依赖动作」的条件</span>，<b>而且一行代码就能加上。</b><span class='k'>它削方差的效果远不如 <code>V(s)</code>，但代价是零</span>——<b>在你还没打算学一个值函数时，这是第一个该加的东西。</b>"], "quote": "Reduce variance by introducing a baseline b(s) &nbsp;·&nbsp; <b>∇E[R] = E[ Σ_t ∇_θ log π(a_t|s_t,θ) ( Σ_{t′=t}^{T−1} r_{t′} − b(s_t) ) ]</b> &nbsp;·&nbsp; <b>For any choice of b(s), gradient estimator is unbiased</b> &nbsp;·&nbsp; Near optimal choice is expected return, b(s_t) ≈ E[r_t + r_{t+1} + ... + r_{T−1}] &nbsp;·&nbsp; <b>Interpretation: increase logprob of action a_t proportionally to how much returns are better than expected</b>"},
{"r": [55, 56], "t": "为什么基线不引入偏差", "star": 2, "one": "四步，最后落在「概率之和的导数是 0」。", "eq": "E_τ[ ∇_θ log π(a_t|s_t,θ) · b(s_t) ]\n  = E[ b(s_t) · E_{a_t}[ ∇_θ log π(a_t|s_t,θ) ] ]     ← b 与 a 无关，提出来\n  = E[ b(s_t) · Σ_a π_θ(a|s_t)·∇_θπ(a|s_t,θ)/π_θ(a|s_t) ]   ← 似然比\n  = E[ b(s_t) · ∇_θ Σ_a π(a|s_t,θ) ]\n  = E[ b(s_t) · ∇_θ 1 ] = 0", "pts": ["<span class='k'>Σ_a π = 1 是常数，导数为 0</span>——整项归零，所以不偏。", "<b>这个证明的落点只有一句话，而且这句话值得单独记住：<span class='k'>score function 的期望是 0</span>。</b><b>因为 <code>E_a[∇log π] = Σ_a π · (∇π/π) = Σ_a ∇π = ∇(Σ_a π) = ∇1 = 0</code>。</b><span class='w'>概率加起来恒等于 1，而常数的导数是 0</span>。<b>于是任何不依赖动作的东西乘上 score，期望都是 0，减掉它当然不改变期望。</b>", "<b>把证明的四步拆开，你会看到每一步各自用掉了一个条件。</b><br><b>① 拆开期望</b>：<span class='k'>按时间把 <code>s_{0:t}</code> 和 <code>a_t</code> 分层</span>。<br><b>② 把 <code>b(s_t)</code> 提出去</b>：<span class='w'>这一步要求 b 不依赖 <code>a_t</code></span>——<b>这是全部证明里唯一的实质性假设。</b><br><b>③ 用似然比</b>：<span class='k'><code>π·∇log π = ∇π</code></span>。<br><b>④ 求和与求导交换</b>：<span class='k'><code>Σ_a ∇π = ∇ Σ_a π = ∇1 = 0</code></span>。<br><span class='w'>整个证明里没有任何关于环境、奖励、或策略形式的假设</span>——<b>所以它对任何 MDP、任何可微策略都成立。</b>", "<b>这个「score 期望为 0」的结论还有两个用处，顺带记下来。</b><span class='k'>第一，它解释了 p47 的因果性为什么也不引入偏差</span>——<b>被删掉的那些项（之前的奖励 × 当前的 score），由于独立性，期望正好是「奖励的期望 × score 的期望」= 某个数 × 0 = 0。</b><span class='k'>第二，它给了你一个调试手段</span>：<b>如果你实现的 score function 在大量采样下均值明显偏离 0，那一定是实现错了。</b><span class='w'>这是个几行代码就能跑的检查，很值得写进单元测试。</span>", "<b>最后把这条结论推广成一条可以照搬的判据，它在别处也用得上。</b><span class='k'>任何「不依赖被积变量」的量，都可以从这类估计量里自由加减而不改变期望</span>。<b>这正是「控制变量法」(control variates) 的标准形式</b>——<span class='w'>统计里一整套降方差技巧都建立在这上面</span>。<b>认出这个结构之后，你在任何蒙特卡洛估计里都可以问一句：有没有一个和被估量相关、但期望已知的东西可以减掉？</b>"], "quote": "E[∇_θ log π(a_t|s_t,θ) b(s_t)] &nbsp;·&nbsp; = E_{s_{0:t}, a_{0:(t−1)}}[ b(s_t) E_{a_t}[∇_θ log π(a_t|s_t,θ)] ] &nbsp;·&nbsp; = E[ b(s_t) Σ_a π(a_t|s_t) ∇π(a_t|s_t,θ)/π(a_t|s_t) ] &nbsp;·&nbsp; = E[ b(s_t) ∇_θ Σ_a π(a_t|s_t,θ) ] &nbsp;·&nbsp; = E[ b(s_t) ∇_θ 1 ] &nbsp;·&nbsp; <b>= E[b(s_t) · 0] = 0</b>", "res": {"tag": "推断", "v": "<b>这一页给你一条可以直接照搬的判据，而且它正好能用在你那个「拆成两半估」的设计上。</b><br><br><span class='k'>判据是：任何不依赖「被积变量」的量，都可以自由加减而不改变期望，但会改变方差</span>。<b>这是控制变量法的标准形式，而基线只是它的一个特例。</b><br><br><b>搬到你的问题上，有两处可用。</b><br><b>① 成本那一半本身就是一个现成的基线。</b><span class='w'>你的 <code>G = Acc − λ·Cost</code> 里，<code>Cost</code> 给定配置与输入长度后近乎确定（L02 p17 科研格说过它是回归不是策略评估）</span>——<span class='k'>也就是说它<b>可以被很准地预测</b></span>。<b>而「能被准确预测的那部分」正是最好的基线材料：减掉它，剩下的方差就只来自真正不可预测的部分。</b><br><b>② 用 query 难度当基线。</b><span class='k'>不同 query 的 Acc 基线差别极大——简单题谁跑都对，难题谁跑都错</span>。<b>这部分差异和你选哪套配置完全无关，纯属噪声。</b><span class='w'>减去一个「这道题的平均正确率」，剩下的才是配置带来的差异</span>。<b>这一步能削掉的方差可能比任何算法改进都多。</b><br><br><b>但必须守住那个唯一的条件：基线不能依赖你的决策。</b><span class='w'>「这道题的平均正确率」要在<b>所有配置上</b>平均，不能只在某个配置上算</span>；<span class='k'>「成本的预测值」要用输入长度等<b>决策前</b>就知道的量，不能用实际跑出来的 token 数</span>。<b>一旦基线含了决策信息，p55 的证明第②步就垮了，你的估计量会变成有偏的——而且这种偏差不会报错，只会悄悄让结论错。</b>", "ref": "课件 p53–p56 原文（for any choice of b(s)；证明第②步把 b 提出期望）· L02 p17 科研格 · 简报 §4e"}},
{"r": [57, 58], "t": "「香草」策略梯度算法", "star": 3, "one": "把回报、基线、优势估计串成一个循环。", "eq": "初始化策略参数 θ、基线 b\n每轮：\n  用当前策略采一批轨迹\n  每个时间步算：回报 R_t = Σ_{t′=t}^{T-1} r_{t′}\n                优势估计 Â_t = R_t − b(s_t)\n  重新拟合基线：最小化 Σ ‖b(s_t) − R_t‖²\n  用 ĝ = Σ_t ∇_θ log π(a_t|s_t,θ)·Â_t 更新策略（喂给 SGD 或 ADAM）\n\n自动微分下的写法：定义「代理目标」\n  L(θ) = Σ_t log π(a_t|s_t;θ)·Â_t        则 ĝ = ∇_θ L(θ)\n  也可以把值函数的拟合误差一起写进去：\n  L(θ) = Σ_t [ log π(a_t|s_t;θ)·Â_t − ‖V(s_t) − R̂_t‖² ]", "pts": ["<b>代理目标这一招很实用</b>：直接写一个标量让框架去求导，还能批处理。", "<span class='w'>注意 Â_t 在求导时当常数</span>——它不是 θ 的函数。", "<b>这个算法把前面所有零件装到了一起，而装配顺序本身就是一张检查清单。</b><span class='k'>① 用当前策略采一批轨迹；② 算每一步之后的回报 <code>R_t</code>（因果性，p47）；③ 减去基线得到优势 <code>Â_t</code>（p53）；④ 重新拟合基线；⑤ 用 <code>Σ_t ∇log π · Â_t</code> 更新策略</span>。<b>五步里有三步是降方差的，这个比例本身就说明了方差是这类方法的主要矛盾。</b>", "<b>第④步「重新拟合基线」是一个容易被当成细节、其实决定成败的地方。</b><span class='k'>基线用的是回归：最小化 <code>‖b(s_t) − R_t‖²</code></span>——<b>也就是让 <code>b</code> 去预测实际观察到的回报。</b><span class='w'>注意它用的是<b>同一批</b>数据</span>，<b>而这会带来一点微妙的偏差：基线是从你正要用它的那批数据里拟合出来的。</b><span class='k'>严格说这破坏了 p55 的独立性</span>，<b>实践中影响很小，但讲究的实现会用上一轮的数据拟合基线。</b>", "<b>自动微分那一页讲的是一个纯工程但极重要的技巧：代理损失。</b><span class='w'>框架只会对「损失」做反向传播，不会接受你手写的梯度</span>；<span class='k'>所以你定义 <code>L(θ) = Σ_t log π(a_t|s_t;θ)·Â_t</code>，它的梯度恰好就是你要的 <code>ĝ</code></span>。<b>关键是 <code>Â_t</code> 必须被当成常数（detach）</b>——<span class='w'>它虽然是算出来的，但在数学上和 θ 无关</span>。<b>忘了 detach，梯度会多出一堆不该有的项，而且不报错。</b>", "<b>课件最后给的那个合并损失值得单独看一眼，因为它是现代实现的标准形态。</b><code>L(θ) = Σ_t log π(a_t|s_t;θ)·Â_t − ‖V(s_t) − R̂_t‖²</code>——<span class='k'>把策略的代理损失和基线的回归损失写成一个，一次反向传播同时更新两者</span>。<b>这就是 Actor-Critic 的工程形态</b>：<span class='w'>actor 是前一项，critic 是后一项，常常还共享底层网络</span>。<b>再加一个熵正则项，你就得到了今天 PPO 实现里那个损失函数的全貌。</b>"], "quote": "<b>\"Vanilla\" Policy Gradient Algorithm</b> &nbsp;·&nbsp; Initialize policy parameter θ, baseline b &nbsp;·&nbsp; for iteration = 1, 2, ... do &nbsp;·&nbsp; Collect a set of trajectories by executing the current policy &nbsp;·&nbsp; At each timestep compute the return R_t = Σ_{t′=t}^{T−1} r_{t′}, and the advantage estimate <b>Â_t = R_t − b(s_t)</b> &nbsp;·&nbsp; <b>Re-fit the baseline, by minimizing ||b(s_t) − R_t||²</b> &nbsp;·&nbsp; Update the policy using ĝ, a sum of terms ∇_θ log π(a_t|s_t,θ) Â_t &nbsp;|&nbsp; Practical Implementation with Autodiff: <b>L(θ) = Σ_t log π(a_t|s_t;θ) Â_t</b>"},
{"r": [59, 60], "t": "值函数当基线，以及 n 步估计", "star": 3, "one": "<code>V</code> 是天然的基线；<code>Q − V</code> 就是优势函数。", "eq": "Q^{π,γ}(s,a) = E[ r₀ + γr₁ + γ²r₂ + … | s₀=s, a₀=a ]\nV^{π,γ}(s)   = E_{a~π}[ Q^{π,γ}(s,a) ]      ← 极好的基线\nA^{π,γ}(s,a) = Q^{π,γ}(s,a) − V^{π,γ}(s)\n\nn 步目标（在 TD 和 MC 之间调）：\n  R̂⁽¹⁾_t = r_t + γV(s_{t+1})\n  R̂⁽²⁾_t = r_t + γr_{t+1} + γ²V(s_{t+2})\n  R̂⁽∞⁾_t = r_t + γr_{t+1} + γ²r_{t+2} + …\n\n各自减去基线就得到优势估计：\n  Â⁽¹⁾_t = r_t + γV(s_{t+1}) − V(s_t)\n  Â⁽∞⁾_t = r_t + γr_{t+1} + … − V(s_t)", "pts": ["<span class='k'>Â⁽¹⁾ 方差低、偏差高；Â⁽∞⁾ 方差高、偏差低。</span>这正是第三讲 TD ↔ MC 那条轴，换了个场合又出现一次。", "<b>n 就是那根旋钮。</b>", "<b>用 <code>V(s)</code> 当基线之后，那个被加权的量就有了一个名字：<span class='k'>优势函数</span>。</b><b><code>A^π(s,a) = Q^π(s,a) − V^π(s)</code>——「这个动作比该状态下的平均水平好多少」。</b><span class='w'>这正好是 L06 dueling DQN 里那个 A</span>（<b>L07 p7 复习过</b>），<span class='k'>只不过那里用它来拆网络结构，这里用它来降方差</span>。<b>同一个量，两个完全不同的用途。</b>", "<b>为什么 <code>V(s)</code> 是「极好的基线」，理由和 p53 那个最优基线的讨论对得上。</b><span class='k'>基线削方差的效果，取决于它和被减的量有多相关</span>——<b>越相关，减完剩下的波动越小。</b><span class='w'>而 <code>V(s_t)</code> 正是 <code>G_t</code> 的条件期望</span>，<b>相关性再高不过了。</b><span class='k'>减掉之后剩下的，恰好是「这次实际走出来的，比在这个状态下该期望的好多少」</span>——<b>一个均值为 0、方差小得多的量。</b>", "<b>n 步估计是这一页的第二件事，而它的结构你已经在第三讲见过了。</b><span class='k'><code>R̂^{(1)} = r_t + γV(s_{t+1})</code> 只往前看一步，剩下全靠自举——这是 TD</span>；<span class='k'><code>R̂^{(inf)}</code> 一路加到底，完全不自举——这是 MC</span>；<b>中间的 n 步是两者的混合。</b><span class='w'>课件那个反问 <em>Like which model-free policy estimation techniques?</em>问的就是这个</span>——<b>答案是 L03 的 TD 与蒙特卡洛。</b>", "<b>偏差–方差的方向也和第三讲完全一致，可以直接套用那里的结论。</b><span class='k'>n 小（偏 TD）：自举成分多，<b>偏差大、方差小</b></span>——<b>因为 <code>V</code> 本身不准，但它是个确定的数，不带采样噪声。</b><span class='k'>n 大（偏 MC）：自举成分少，<b>偏差小、方差大</b></span>——<b>因为用的是真实奖励，无偏，但每一步的随机性都累加进来。</b><span class='w'>课件建议取中间值（比如 20）</span>，<b>而更精细的做法是把所有 n 按几何权重混起来，那就是 GAE。</b>", "<b>最后把这一讲降方差的四招按「代价」排一次序，这张顺序比记住招数本身更有用。</b><span class='k'>① 因果性：免费，不引入偏差，无条件该用</span>；<span class='k'>② 基线：免费（只要 b 不依赖动作），该用</span>；<span class='k'>③ 用 <code>V</code> 当基线：要多学一个 <code>V</code>，但仍不引入偏差</span>；<span class='w'>④ n 步自举：<b>引入偏差</b>，是一笔真正的交易</span>。<b>前三招没有理由不用，第四招需要你判断「偏差换方差」在你的问题上划不划算。</b>"], "quote": "<b>State-value function can serve as a great baseline</b>: V^{π,γ}(s) = E[r_0 + γr_1 + ...] = E_a[Q^{π,γ}(s,a)] &nbsp;·&nbsp; <b>Advantage function: A^{π,γ}(s,a) = Q^{π,γ}(s,a) − V^{π,γ}(s)</b> &nbsp;|&nbsp; N-step estimators: R̂_t^{(1)} = r_t + γV(s_{t+1}) &nbsp;·&nbsp; R̂_t^{(2)} = r_t + γr_{t+1} + γ²V(s_{t+2}) &nbsp;·&nbsp; R̂_t^{(inf)} = r_t + γr_{t+1} + ... &nbsp;|&nbsp; <b>Â_t^{(1)} has low variance &amp; high bias. Â_t^{(inf)} high variance but low bias. (Why? Like which model-free policy estimation techniques?)</b>", "tbl": {"head": ["估计量", "式子", "偏差", "方差", "对应第三讲的"], "rows": [["<code>Â^{(1)}</code>", "<code>r_t + γV(s_{t+1}) − V(s_t)</code>", "<span class='w'>大</span>", "<span class='k'>小</span>", "<b>TD</b>"], ["<code>Â^{(n)}</code>", "<code>n 步奖励 + γⁿV(s_{t+n}) − V(s_t)</code>", "中", "中", "n 步 TD"], ["<code>Â^{(inf)}</code>", "<code>G_t − V(s_t)</code>", "<span class='k'>小（无偏）</span>", "<span class='w'>大</span>", "<b>蒙特卡洛</b>"]]}},
{"r": [61, 62], "t": "应用与下一讲", "one": "机器人运动是策略梯度最出彩的场合之一。", "pts": ["下一讲继续策略搜索：<b>基线、actor-critic，以及「一步该走多远」</b>。", "<b>把这一讲的脉络收一次，它其实是一条「同一个式子反复改良」的链子。</b><span class='k'>起点是 <code>∇J = E[∇log π · R(τ)]</code>（p42）</span>；<b>因果性把 <code>R(τ)</code> 换成 <code>G_t</code>（p47）；基线把它换成 <code>G_t − b(s_t)</code>（p53）；值函数把 <code>b</code> 具体化成 <code>V(s)</code>（p59）；n 步估计再把 <code>G_t</code> 换成自举的版本（p60）。</b><span class='w'>括号里那个量一路在变，而 <code>∇log π</code> 这个骨架从头到尾没动过。</span>", "<b>这一讲留下的两个问题，正好是下一讲的内容，值得先知道它们是什么。</b><span class='w'>① 步长怎么定？</b><span class='k'>p21 说过，参数一改轨迹分布就变，一步走大了会污染后面所有数据</span>——<b>所以需要一个「信赖域」来限制每步能走多远。</b><span class='w'>② 数据能不能复用？</b><span class='k'>策略梯度是 on-policy 的（p44），采一批用一次就扔</span>——<b>而重要性采样可以让你把同一批数据多用几轮。</b><span class='k'>这两个问题的答案就是 TRPO 和 PPO。</span>", "<b>最后提醒一条这一讲最容易被带偏的印象：策略梯度不是「比基于值更先进」。</b><span class='w'>p8 那张优缺点表是实打实的取舍</span>——<b>它的样本效率明显不如能用回放池的基于值方法。</b><span class='k'>它赢的场合很明确：连续动作、需要随机策略、策略本身比值函数简单</span>。<b>而它今天用得多，很大程度是因为这三条在深度学习的典型应用里恰好都成立。</b><span class='w'>换个场合，结论可能反过来。</span>", "<b>课件最后那页「机器人移动」的应用图，回头看正好和 p25 的 AIBO 形成一个对照，值得点一下。</b><span class='k'>AIBO 用的是有限差分 + 12 个手工参数，几百次评估就学会了走路</span>；<span class='w'>而这一页展示的是神经网络策略 + 策略梯度，参数上万、需要的样本多得多，但不需要任何人去设计步态参数</span>。<b>两者是同一个问题的两种解法，分别代表「注入领域知识」和「用数据换知识」。</b><span class='k'>哪种更好，取决于你有没有那个愿意花几年研究步态的人。</span>", "<b>最后给一条读这一讲之后最该保留的习惯：看到任何一个策略梯度类的算法，先去找它式子里 <code>∇log π</code> 后面乘的是什么。</b><span class='k'>那个位置上的量决定了算法的名字和性质</span>——<b><code>R(τ)</code> 是最朴素的，<code>G_t</code> 是 REINFORCE，<code>G_t − V</code> 是带基线，<code>Q − V</code> 是 Actor-Critic，带截断的重要性比是 PPO。</b><span class='w'>骨架永远是 <code>E[∇log π · (某个优势估计)]</code></span>，<b>这一讲之后的所有发展，都是在换括号里那一项，以及限制每步能走多远。</b>"], "say": "老师在课上只讲到高斯策略（p52）就结束了；<span class='w'>p53–p61 的基线、香草算法、n 步估计是留到下一讲展开的</span>——所以这几页和第九讲会有重叠，属于正常。", "quote": "Application: Robot Locomotion &nbsp;|&nbsp; Last time: Imitation Learning &nbsp;·&nbsp; This time: Policy Search &nbsp;·&nbsp; <b>Next time: Policy Search Cont.</b>"}
];

var TH = {"title": "L08 接上课题的哪一段：一条假设负担比 FQE 轻得多的备选路线", "arc": "<b>这一讲给了你一条和现方案完全不同的技术路线，而且它的假设比 FQE 干净得多——值得认真评估一次，而不是因为「我们已经选了 FQE」就跳过。</b><br><br><b>关键在 p40–p41 那一行：<em>no dynamics model required!</em></b><span class='k'>轨迹概率拆成「初始分布 × 转移 × 策略」的连乘，取 log 变连加，前两项不含 θ，求导直接归零</span>。<b>转移模型不是被近似掉的，是被<span class='w'>精确地消掉</span>的。</b><span class='w'>于是你一直纠结的「工作流的转移模型准不准」在这条路上根本不用问。</span><br><br><b>把两条路的假设摆在一起比，差别相当明显。</b><br><b>FQE</b>：<span class='w'>要自举（吃马尔可夫假设）、是 off-policy、配函数逼近——致命三件套三条腿全占（L05 p38）</span>。<span class='k'>换来的是能用现成日志，样本效率高。</span><br><b>REINFORCE 式的策略梯度</b>：<span class='k'>不要模型、不自举、假设只有「策略可微」这一条，而那是关于你自己代码的要求，不是关于世界的假设</span>。<span class='w'>换来的代价是 on-policy——采一批用一次就扔。</span><br><br><b>而 on-policy 这个代价，对你恰好比对别人轻。</b><span class='k'>L07 p33 已经论证过同一件事：你的「重新采样」是一次 API 调用，不是一次人类标注</span>。<b>机器人领域因为 on-policy 太贵而不得不想办法复用数据，你没有这个约束。</b><span class='w'>这是你该主动利用、而不是跟着别人一起回避的一个领域差异。</span><br><br><b>这一讲还顺手解决了另外两件事。</b><br><b>① 你的随机化决策节点（§4c）有了第二个、更强的理由。</b><span class='k'>p10–p12 说：状态混叠时，随机策略严格优于确定性策略</span>。<b>而如果你的策略只看节点编号，那么难题和简单题在同一节点上就是混叠的——最优保真度不同，特征却相同。</b><span class='w'>于是随机化不只是采数据的代价，它本身就可能是更优的策略形态。</span><b>但课件也明说了治本的办法是修表示（把 query 特征放进状态），随机化只是补救。</b><br><b>② p53–p56 的基线给了你一条可以照搬的降方差判据</b>，<span class='k'>而你手上恰好有两个现成的基线材料：可准确预测的成本，和 query 自身的难度</span>（<b>详见 p55 的科研格</b>）。", "pitfalls": [{"v": "<b>把基线做成依赖决策的量。</b> p55 的证明里，唯一的实质性假设是<span class='k'>「基线不依赖动作」</span>——第②步要把 <code>b(s_t)</code> 提到对动作的期望外面。<span class='w'>一旦 b 含了决策信息，证明垮掉，估计量变成有偏的，而且不会报错</span>。<b>具体到你：「这道题的平均正确率」要在所有配置上平均；「成本的预测值」要用决策前就知道的量（输入长度），不能用实际跑出来的 token 数。</b>", "tag": "已核", "ref": "课件 p53（for any choice of b(s)）· p55–p56 证明第②步"}, {"v": "<b>照抄代码库默认的 <code>γ = 0.99</code>，然后在这一讲里继续用。</b> <span class='k'>L02 p13 已经定过：你的片段必然结束，γ 该是 1</span>。<b>策略梯度里这件事同样成立，而且后果更直接</b>——<span class='w'>折扣会让 <code>G_t</code> 低估结尾的奖励，而你的终局奖励全在最后一个节点</span>。", "tag": "推断", "ref": "L02 p13 p51 · 本讲 p47 p59"}, {"v": "<b>以为「策略梯度不要模型」等于「环境多复杂都不要紧」。</b> <span class='k'>消掉的是「需要知道 <code>P</code> 的显式形式」，不是「<code>P</code> 带来的难度」</span>。<span class='w'>环境越随机，你的梯度估计方差越大，需要的样本越多</span>。<b>而 LLM 的输出随机性正是你这里的主要噪声源，它会实打实地体现在采样预算上。</b>", "tag": "推断", "ref": "课件 p40–p41 · 本讲 p46"}, {"v": "<b>拿「随机策略在混叠下更优」当成随机化的充分理由。</b> <span class='w'>这个论证成立的前提是<b>确实存在混叠</b></span>。<span class='k'>老师回答学生时明说：更好的是维持信念状态然后确定性地走，随机化只是不会卡死</span>。<b>如果你把 query 特征放进了状态、混叠被消除了，随机化就只剩采数据那一个理由，而且会轻微损害表现。</b><span class='w'>这两件事必须绑在一起说，不能单独拿出来用。</span>", "tag": "已核", "ref": "课件 p10–p12 老师问答"}, {"v": "<b>在实现里忘了 detach 优势项。</b> <span class='k'><code>R(τ)</code> 和 <code>Â_t</code> 虽然是算出来的，但在数学上和 θ 无关（p32）</span>。<b>自动微分框架不会替你判断这件事，让梯度流进去会多出一堆不该有的项，而且不报错。</b><span class='w'>这是写策略梯度最常见的 bug，表现是「训着训着就崩了」而查不出原因。</span>", "tag": "已核", "ref": "课件 p57–p58（surrogate loss）· 本讲 p42"}, {"v": "<b>把这一讲当成「比基于值更先进」。</b> p8 那张表是实打实的取舍：<span class='w'>策略梯度的样本效率明显不如能用回放池的基于值方法</span>。<span class='k'>它赢的场合很明确：连续动作、需要随机策略、策略本身比值函数简单</span>。<b>你的动作是离散的几档保真度，所以第一条对你不成立；该不该用，要靠另外两条和「on-policy 对你便宜」来论证。</b>", "tag": "推断", "ref": "课件 p8 · L07 p33 科研格"}], "ammo": [{"q": "你们的转移模型是怎么建的？不准的话结论还成立吗？", "a": "<b>如果走策略梯度这条路，我们根本不需要转移模型。</b><span class='k'>轨迹概率拆开后，初始分布项和转移项都不含策略参数，求导直接归零</span>（CS234 L08 p40–p41，课件原话是 <em>no dynamics model required!</em>）。<b>这不是近似，是恒等式。</b><span class='w'>环境的随机性只体现在「我们采到什么样本」上，会影响方差，不会影响正确性。</span>", "tag": "已核", "ref": "课件 p40–p41 原文"}, {"q": "既然 FQE 可能发散，为什么不干脆换一条路？", "a": "<b>这正是我们评估过的另一条路。</b><span class='k'>REINFORCE 式的策略梯度不自举、不要模型，于是致命三件套里的第二条腿自动不成立</span>。<span class='w'>它的代价是 on-policy——采一批数据用一次就作废</span>；<b>而这个代价对我们比对机器人领域轻得多，因为我们重新采样只是一次 API 调用。</b><b>两条路的取舍是「样本效率 vs 假设负担」，我们报告了两者的对比。</b>", "tag": "推断", "ref": "课件 p8 p40 · L05 p38 · L07 p33 科研格"}, {"q": "你们为什么要在决策节点上随机化？这不是损害性能吗？", "a": "<b>不一定，而且有两个独立的理由。</b><span class='k'>第一是采数据：随机化提升有效样本量、让日志覆盖多种配置</span>。<span class='k'>第二、也是更强的：如果策略只看节点位置，那么难度不同的 query 在同一节点上是<b>混叠</b>的——特征相同而最优动作不同</span>。<b>课件证明了混叠下随机策略严格优于确定性策略（L08 p10–p12）。</b><span class='w'>我们同时报告了治本的做法：把 query 特征放进状态以消除混叠。</span>", "tag": "推断", "ref": "课件 p10–p12 · 简报 §4c"}, {"q": "你们的方差这么大，结论可信吗？", "a": "<b>我们用的是课件 p53–p59 那套标准降方差手段，而且它们都不引入偏差。</b><span class='k'>基线只要不依赖决策就一定不改变期望（p55 有完整证明）</span>，<b>而我们有两个很强的基线材料：成本在给定输入长度后近乎可预测，以及每道 query 自身的难度基线。</b><span class='w'>后者尤其关键——不同 query 的正确率差异和我们选哪套配置完全无关，纯属噪声。</span><b>减掉它之后，剩下的才是配置带来的差异。</b>", "tag": "推断", "ref": "课件 p53–p56 · 本讲 p55 科研格 · L02 p17 科研格"}], "papers": [{"t": "Williams — Simple Statistical Gradient-Following Algorithms for Connectionist Reinforcement Learning (REINFORCE)", "id": "Machine Learning 1992", "why": "p49 那个算法的原始出处。<b>你要引它来说明「不自举的策略梯度估计是无偏的」</b>——<span class='k'>这正是它相对 FQE 在假设上的优势所在</span>，而课件只给了算法没给这个论证。"}, {"t": "Sutton, McAllester, Singh &amp; Mansour — Policy Gradient Methods for Reinforcement Learning with Function Approximation", "id": "NIPS 2000", "why": "p44 那个策略梯度定理的出处。<b>关键是它处理了「带函数逼近」的情形</b>——<span class='k'>而这恰好是 L05 里基于值方法翻车的地方</span>。<span class='w'>两相对照，正好说明为什么策略梯度在函数逼近下的处境好得多。</span>"}, {"t": "Kohl &amp; Stone — Policy Gradient Reinforcement Learning for Fast Quadrupedal Locomotion", "id": "ICRA 2004", "why": "p25–p29 那个 AIBO 实验。<b>它的预算结构和你的高度相似</b>（评估贵、参数少、结果带噪声），<span class='k'>特别是「每个配置重复评估 3 次取平均」这个设计</span>——你可以直接引它来支撑自己的重复采样方案。"}, {"t": "Schulman, Moritz, Levine, Jordan &amp; Abbeel — High-Dimensional Continuous Control Using Generalized Advantage Estimation (GAE)", "id": "ICLR 2016", "why": "p59–p60 的 n 步估计讲到一半就停了，<b>GAE 是它的完整版本</b>：把所有 n 按几何权重混起来，用一个参数 λ 连续地在偏差和方差之间滑动。<span class='k'>这是今天几乎所有策略梯度实现的默认组件</span>，真要动手就得读它。"}, {"t": "Sutton &amp; Barto — Reinforcement Learning: An Introduction, 第 13 章", "id": "2018, 2nd ed.", "why": "课件自己在 p1 指定的补充阅读。<b>它对基线和因果性给的推导比课件完整</b>，<span class='k'>而且专门讨论了「最优基线」的确切形式</span>（按 <code>‖∇log π‖²</code> 加权的期望回报，不是纯期望回报）——本讲 p53 只说了「近似是期望回报」。"}]};

(function(){
  var PDF="../slides/lecture8.pdf", MAX=62;
  /* 线上（GitHub Pages）库里没有讲义 PDF（被 .gitignore 挡着），左栏会 404。
     声明了 canonical 源就改指它；本地 file:// 与 localhost 仍走相对路径，

     PAGEOFF：切章 PDF 的第 1 页在整本里是第 1+PAGEOFF 页（S&B 用）。 */
  var PDF_REMOTE="", PAGEOFF=0;
  var USE_REMOTE = !!PDF_REMOTE && /(^|\.)github\.io$/i.test(location.hostname);
  var openLink = document.getElementById("openpdf");
  if (openLink && USE_REMOTE) openLink.hidden = false;
  var SRC = USE_REMOTE ? PDF_REMOTE : PDF, POFF = USE_REMOTE ? PAGEOFF : 0;
  var frame=document.getElementById("pdf"), card=document.getElementById("card"),
      pnum=document.getElementById("pnum"), strip=document.getElementById("strip"),
      right=document.getElementById("right");
  var cur=0, map={}, cells=[];
  /* 科研格出处档位 → 类名。三档与 research/00-BRIEFING 的原始标注一致。 */

  var KEY = document.body.dataset.key;
