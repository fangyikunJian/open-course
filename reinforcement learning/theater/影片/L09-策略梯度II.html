<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}

/* ══ RL 图元包 ══ */

/* #quiz 缺容器兜底。引擎里 #sum 有 max-height:90vh + overflow:auto，而 #quiz 两者都没有；
   又因为 #quizL 是 align-items:center，一旦内容超高就**上下对称裁切** ——
   最先看不见的是最底部的 .why，也就是那一拍的全部教学载荷（解析）。
   这比 SUM 卡溢出更隐蔽：SUM 至少还能滚，QUIZ 是直接两头切掉。
   选择器同为 (1,0,0)，本段注入在引擎样式之后，靠顺序取胜。 */
#quiz{max-height:88vh;overflow:auto}
.pt.b{fill:var(--coral)} .pt.c{fill:var(--green)} .pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)}
.box.y{stroke:var(--yellow)} .box.v{stroke:var(--violet)} .box.b{stroke:var(--blue)}
/* 层级只用颜色区分，字号一律沿用引擎的 .slbl 14px —— ML 版就是这么做的，
   混用字号会让画面每次切换都「跳」一下。sm / big 是**兜底色**，不是字号。

   顺序至关重要：sm/big/ink 必须排在语义色**之前**。三者特异度相同（0,2,0），
   靠先后决胜 —— 上一版把它们写在后面，于是 note(txt,x,y,cls+" sm") 这类调用
   （bars 第 187 行、errbar 第 303 行等，全片 15 处）的语义色被静默压成 --dim，
   而深底上的暗灰标签看起来像正常标签，所以没人反馈。
   「层级只靠颜色」这个正解，被为兼容它而保留的别名从内部取消掉了。
   现在的顺序下：class="slbl y sm" → 黄（语义色在后，赢）；class="slbl sm" → 暗色。 */
.slbl.ink{fill:var(--ink)} .slbl.sm{fill:var(--dim)} .slbl.big{fill:var(--ink)}
/* 五个语义色必须**全部**在别名之后重新声明 —— 包括 g 与 r。
   它们原本定义在 eng.txt 的基础样式里，而本段整体注入在基础样式之后，
   所以只在本段内部调顺序是不够的：第一次修完，slbl.y.sm 变对了，
   而 slbl.g.sm 仍被压成暗灰（实测 rgb(147,161,181)）—— 因为 .slbl.g 来自上游。 */
.slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)} .slbl.v{fill:var(--violet)}
.slbl.g{fill:var(--green)} .slbl.r{fill:var(--coral)}

/* ── 动画铁律 ──────────────────────────────────────────────────────────
   动画必须演示机制。看完一段动画，观众应当明白一件<b>之前不明白的事</b>。
   不解释任何东西的动画（呼吸、脉冲环、无限循环的小车、行进虚线）一律不要——
   它们只是视觉噪音，会盖过真正要看的东西。

   因此这里没有 infinite 动画。每个动画都：
     · 播一次就停在正确的终态；
     · 终态本身携带完整信息（后台标签页暂停也不丢内容）；
     · 有明确的「它在演示什么」的答案。
   ──────────────────────────────────────────────────────────────────── */
@keyframes rl-slide{to{offset-distance:100%}}
.tracer{animation:rl-slide var(--walk-dur,2.4s) ease-in-out 1 forwards;offset-rotate:0deg}
.trail{stroke-dasharray:none}

.arw{stroke:#3A4759;stroke-width:1.8;fill:none;marker-end:url(#ah)}
.arw.g{stroke:var(--green);marker-end:url(#ah-g)}
.arw.y{stroke:var(--yellow);marker-end:url(#ah-y)}
.arw.r{stroke:var(--coral);marker-end:url(#ah-r)}
.arw.b{stroke:var(--blue);marker-end:url(#ah-b)}
.arw.v{stroke:var(--violet);marker-end:url(#ah-v)}

.snode{fill:#101724;stroke:#2B3646;stroke-width:1.8}
.snode.g{stroke:var(--green)} .snode.y{stroke:var(--yellow)}
.snode.r{stroke:var(--coral)} .snode.b{stroke:var(--blue)} .snode.v{stroke:var(--violet)}

.gcell{fill:#0E1420;stroke:#1E2836;stroke-width:1.2}
.gcell.wall{fill:#1B2230;stroke:#243044}
.gcell.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:2}
.gcell.g{fill:#0E2A24;stroke:var(--green);stroke-width:2}
.gcell.r{fill:#3A1A1E;stroke:var(--coral);stroke-width:2}
.gcell.b{fill:#0E1F33;stroke:var(--blue);stroke-width:2}

.vbar{fill:var(--blue);opacity:.85}
.vbar.g{fill:var(--green)} .vbar.y{fill:var(--yellow)}
.vbar.r{fill:var(--coral)} .vbar.v{fill:var(--violet)}

.ebar{stroke:var(--dim);stroke-width:1.7;fill:none}
.ebar.y{stroke:var(--yellow)} .ebar.g{stroke:var(--green)} .ebar.r{stroke:var(--coral)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class",cls||"fit")
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false,eqT=null;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
/* 事故实录：setEq 的非 FAST 分支把写入推迟 150ms。连着翻镜时，上一镜那个
   还没触发的 setTimeout 会在 showSum 的 setEq(null) 之后才落地，把刚清干净的
   公式带重新填上 —— 总结卡上于是挂着上一镜的残留公式。
   L01 实测镜 8/45/65/74、L02 实测镜 79，全是这么来的。
   只有顺序翻才复现：从头 reload 直接跳到镜 8 是干净的，
   所以之前那次「跳过去看一眼」的单镜抽查给出了假的「已修好」。
   修法是把 pending 的定时器记下来，任何一次 setEq 先撤销它。 */
function setEq(h,pos){if(eqT){clearTimeout(eqT);eqT=null;}
  if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqT=null;eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");eqT=setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});
  eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");
  if(!eqBox.animate)return;
  eqBox.querySelectorAll("[data-id]").forEach(function(e){
    var r=b[e.dataset.id];
    if(r){var a=e.getBoundingClientRect(),dx=r.left-a.left,dy=r.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)
        e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:780,easing:"cubic-bezier(.35,0,.15,1)"});}
    else e.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
      {duration:520,delay:250,easing:"cubic-bezier(.3,.7,.3,1)",fill:"backwards"});});}
function T(id,t,c){return '<span class="tok '+(c||"")+'" data-id="'+id+'">'+t+'</span>';}
function setTitle(a,h,p){titleBox.classList.remove("off");
  titleBox.innerHTML='<p class="act">'+(a||"")+'</p><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'<div class="rule"></div>';}
function noTitle(){titleBox.classList.add("off");}
function setNarr(t){if(!t||!narrOn){narrEl.hidden=true;return;}
  narrEl.hidden=false;narrEl.innerHTML=t;narrEl.classList.remove("off");}
function clearSum(){sumEl.hidden=true;sumEl.classList.add("off");sumEl.innerHTML="";}
function showSum(kp,s){
  /* 总结卡是整屏覆盖层，但它盖不住公式带的顶边：实测 eqBox 顶边 y≈46，
     而 #sum 顶边 y≈94 —— 上一镜的公式会有约 48px 露在卡片上方。
     showSum 原本完全不碰 eqBox，于是 135 张卡里有 5 张挂着上一镜的残留公式。
     在这里清掉，比让每一集的最后一镜各自记得 setEq(null) 可靠。 */
  setEq(null);
  var ord=[["k","核心结论"],["m","底层机制"],["w","常见误解"],["e","与你的考试"]];
  sumEl.innerHTML='<p class="sh">知识点 '+kp+' · 总结</p><h3>'+s.h+'</h3><div class="rows">'+
    ord.filter(function(o){return s[o[0]];}).map(function(o){
      return '<div class="row '+o[0]+'"><p class="rk">'+o[1]+'</p><p class="rv">'+s[o[0]]+'</p></div>';}).join("")+'</div>';
  sumEl.hidden=false;void sumEl.offsetWidth;sumEl.classList.remove("off");}
function clearQuiz(){quizEl.hidden=true;quizEl.classList.add("off");quizEl.innerHTML="";locked=false;}
function askQ(kp,q){
  if(FAST){clearQuiz();return;}
  locked=true;
  quizEl.innerHTML='<p class="qh">知识点 '+kp+' · 检验</p><p class="qq">'+q.t+'</p><div class="qo">'+
    q.o.map(function(o,i){return '<button data-i="'+i+'">'+o+'</button>';}).join("")+
    '</div><p class="why" hidden>'+q.w+'</p>';
  quizEl.hidden=false;void quizEl.offsetWidth;quizEl.classList.remove("off");
  var bs=[].slice.call(quizEl.querySelectorAll("button"));
  bs.forEach(function(b,i){b.addEventListener("click",function(){
    if(b.classList.contains("lk"))return;
    bs.forEach(function(x,k){x.classList.add("lk");x.classList.add(k===q.a?"ok":(k===i?"no":"off2"));});
    quizEl.querySelector(".why").hidden=false;locked=false;
    document.getElementById("hint").textContent=(cur+1)+" / "+SHOTS.length+"  ·  空格继续";});});}

var SHOTS=[],KPS=[];
function S(t,fn,narr){SHOTS.push({t:t,enter:fn,n:narr});}
function KP(name,build){var from=SHOTS.length;build();KPS.push({name:name,from:from,len:SHOTS.length-from});}
function SUM(t,kp,s){SHOTS.push({t:t,sum:{kp:kp,s:s},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}
function QUIZ(t,kp,q){SHOTS.push({t:t,quiz:{kp:kp,q:q},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}

/* 把引擎暴露给内容区 */
function axes(P){gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.r).attr("y1",P.b).attr("y2",P.b);
  gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.l).attr("y1",P.t).attr("y2",P.b);}
window.__engine={gS:gS,gN:gN,DUR:DUR,isFast:function(){return FAST;},clearScene:clearScene,note:note,dots:dots,curve:curve,fn:fn,boxNode:boxNode,
  link:link,matrix:matrix,rng:rng,axes:axes,setCap:setCap,setBig:setBig,setEq:setEq,flip:flip,T:T,
  setTitle:setTitle,noTitle:noTitle,S:S,KP:KP,SUM:SUM,QUIZ:QUIZ,W:W,H:H};

/* ════════════════ 放映机（无需改动） ════════════════ */
function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];
  KPS.forEach(function(k){
    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);
    for(var i=0;i<k.len;i++){var p=document.createElement("span"),sh=SHOTS[k.from+i];
      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}
    FAST=false;
    cur=n;clearQuiz();clearSum();
    var sh=SHOTS[n];
    noTitle();clearScene();setBig(null);setEq(null);setCap(null);
    if(sh.enter)sh.enter();
    setNarr(sh.n);
    if(sh.sum){setNarr(null);showSum(sh.sum.kp,sh.sum.s);}
    if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});
  window.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}
window.__startProjector=startProjector;
})();
</script>


<script>

/* ══════════════ RL 图元包（在 __engine 之上扩展，不改原引擎） ══════════════ */
(function(){
var E=window.__engine, gS=E.gS, gN=E.gN, DUR=E.DUR, W=E.W, H=E.H;
var note=E.note;
function fast(){return E.isFast();}
function fadeIn(sel,delay){
  if(fast()){sel.attr("opacity",1);return sel;}
  return sel.attr("opacity",0).transition().duration(420).delay(delay||0).attr("opacity",1);
}

/* 箭头标记（各色一份），只建一次 */
(function(){
  var svg=d3.select("#scene");
  if(!svg.select("defs#rlmk").empty())return;
  var defs=svg.append("defs").attr("id","rlmk");
  var cols={"ah":"#3A4759","ah-g":"#5BDDA8","ah-y":"#FFD36E",
            "ah-r":"#FF7C87","ah-b":"#54A9F7","ah-v":"#B48BF5"};
  Object.keys(cols).forEach(function(id){
    defs.append("marker").attr("id",id).attr("viewBox","0 0 10 10")
      .attr("refX",9).attr("refY",5).attr("markerWidth",6).attr("markerHeight",6)
      .attr("orient","auto")
      .append("path").attr("d","M0,0.6L10,5L0,9.4z").attr("fill",cols[id]);
  });
})();

/* ── arrow ── */
function arrow(x1,y1,x2,y2,cls,bend){
  var d;
  if(bend){
    var mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy)||1;
    d="M"+x1+","+y1+"Q"+(mx-dy/L*bend)+","+(my+dx/L*bend)+" "+x2+","+y2;
  } else d="M"+x1+","+y1+"L"+x2+","+y2;
  var p=gS.append("path").attr("class","arw "+(cls||"")).attr("d",d);
  if(!fast()&&p.node().getTotalLength){
    var L2=p.node().getTotalLength();
    p.attr("stroke-dasharray",L2+" "+L2).attr("stroke-dashoffset",L2)
     .transition().duration(520).attr("stroke-dashoffset",0);
  }
  return p;
}

/* ── mdpChain ──
   o={n,x,y,r,gap,w, label:fn(i), lcls:fn(i), cls:fn(i), rew:fn(i),
      arcs:[[from,to,label,cls,bend]]} */
function mdpChain(o){
  var n=o.n, r=o.r||30, gap=o.gap||((o.w||900)/(n-1)),
      x0=o.x!=null?o.x:(W-(n-1)*gap)/2, y=o.y||300, pos=[];
  for(var i=0;i<n;i++){
    var cx=x0+i*gap; pos.push([cx,y]);
    var c=gS.append("circle").attr("class","snode "+((o.cls&&o.cls(i))||""))
      .attr("cx",cx).attr("cy",y).attr("r",r);
    fadeIn(c,i*55);
    if(o.label)note(o.label(i),cx,y+5,(o.lcls&&o.lcls(i))||"ink");
    if(o.rew&&o.rew(i)!=null)note(o.rew(i),cx,y-r-14,"y");
  }
  (o.arcs||[]).forEach(function(a){
    var A=pos[a[0]],B=pos[a[1]],sgn=B[0]>=A[0]?1:-1,bend=a[4]||0;
    arrow(A[0]+sgn*r,A[1],B[0]-sgn*r,B[1],a[3]||"",bend);
    /* 事故实录：这里原来是 Math.abs(bend)，把弧的方向丢掉了。两个后果都实测到过：
       (1) L02 KP1 的 A⇄B 来回弧，两个「1.0」标签落在同一个像素框 (627,255)-(653,273)；
       (2) L02 KP2 的 bend=-84 让弧向下弯，标签却仍算在上方，离自己的弧 100px。
       arrow 的控制点 y = my+(dx/L)*bend，故弧顶 y = A[1]+sgn*bend/2；标签跟着弧顶走。 */
    if(a[2]){
      var eff=sgn*bend, ay=A[1]+eff/2;
      note(a[2],(A[0]+B[0])/2, bend?(eff<0?ay-12:ay+20):A[1]-16, a[3]||"");
    }
  });
  return pos;
}

/* ── bars ──
   o={vals:[],x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v)} */
function bars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62, mx=o.max;
  if(mx==null){
    mx=0; for(var q=0;q<n;q++) if(Math.abs(v[q])>mx) mx=Math.abs(v[q]);
  }
  if(!mx)mx=1;
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var hh=Math.abs(v[i])/mx*h, cx=x0+i*gap+gap/2;
    var b=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    if(fast())b.attr("y",y0-hh).attr("height",hh);
    else b.attr("y",y0).attr("height",0).transition().duration(DUR).delay(i*45)
          .attr("y",y0-hh).attr("height",hh);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
    note(o.fmt?o.fmt(v[i]):(Math.round(v[i]*100)/100),
         cx,y0-hh-9,((o.cls&&o.cls(i))||"")+" sm");
  }
}

/* ── gridworld ──
   o={rows,cols,x,y,cs, val:fn(i,j), pol:fn(i,j)->"u|d|l|r",
      cls:fn(i,j), wall:fn(i,j), tag:fn(i,j)} */
function gridworld(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var isW=o.wall&&o.wall(i,j);
    var cl=isW?"wall":((o.cls&&o.cls(i,j))||"");
    var rc=gS.append("rect").attr("class","gcell "+cl)
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    fadeIn(rc,(i*C+j)*16);
    if(isW)continue;
    var cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2;
    if(o.val&&o.val(i,j)!=null)note(o.val(i,j),cx,cy+5,((o.cls&&o.cls(i,j))||"ink"));
    if(o.tag&&o.tag(i,j))note(o.tag(i,j),x0+j*cs+7,y0+i*cs+15,"sm","start");

/* ── backup：Sutton&Barto 回溯图 ──
   o={x,y,dy,spread,r, levels:["s","a","s"], branch:[1,2], labels:[], hl:[]} */
function backup(o){
  var x=o.x!=null?o.x:W/2, y=o.y!=null?o.y:150, dy=o.dy||105, r=o.r||20,
      lv=o.levels, br=o.branch||[], hl=o.hl||[], lab=o.labels||[], cur=[[x,y]];
  for(var k=0;k<lv.length;k++){
    var kind=lv[k], isHL=hl.indexOf(k)>=0, next=[];
    (function(kind,isHL,k){
      cur.forEach(function(p,pi){
        var c;
        if(kind==="s")
          c=gS.append("circle").attr("class","snode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r);
        else
          c=gS.append("circle").attr("class","anode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r*0.42);
        fadeIn(c,k*90);
        if(lab[k]&&pi===0)note(lab[k],p[0]-r-12,p[1]+5,isHL?"y":"","end");
      });
    })(kind,isHL,k);
    if(k<lv.length-1){
      var b=br[k]||1, spread=(o.spread||150)/Math.pow(1.7,k);
      cur.forEach(function(p){
        for(var m=0;m<b;m++){
          var nx=p[0]+(b===1?0:(m-(b-1)/2)*spread), ny=p[1]+dy;
          gS.append("path").attr("class","tedge").attr("d","M"+p[0]+","+p[1]+"L"+nx+","+ny);
          next.push([nx,ny]);
        }
      });
      cur=next;
    }
  }
}

/* ── tree：upto 控制画到第几个节点 ──
   o={nodes:[{id,parent,x,y,label,sub,cls}], upto, r} */
function tree(o){
  var r=o.r||24, N=o.nodes, up=o.upto!=null?o.upto:N.length, pos={};
  N.forEach(function(nd){ pos[nd.id]=[nd.x,nd.y]; });
  N.forEach(function(nd,i){
    if(i>=up)return;
    if(nd.parent!=null&&pos[nd.parent]){
      var p=pos[nd.parent];
      var e=gS.append("path").attr("class","tedge "+(nd.cls==="hl"?"hl":""))
        .attr("d","M"+p[0]+","+p[1]+"L"+nd.x+","+nd.y);
      if(!fast()&&e.node().getTotalLength){
        var L=e.node().getTotalLength();
        e.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
         .transition().duration(380).delay(i*70).attr("stroke-dashoffset",0);
      }
    }
    var c=gS.append("circle").attr("class","tnode "+(nd.cls||""))
      .attr("cx",nd.x).attr("cy",nd.y).attr("r",r);
    fadeIn(c,i*70);
    if(nd.label)note(nd.label,nd.x,nd.y+5,"ink");
    if(nd.sub)note(nd.sub,nd.x,nd.y+r+15,"sm");
  });
}

/* ═══════════ 演示机制的动画 ═══════════
   每个函数下面都写了「它在演示什么」。写不出这一句的动画不要写。

/* ── trace ──
   演示什么：智能体<b>沿这条路走了一趟</b>，走过的地方留下痕迹。
   用于：策略的轨迹、示范轨迹与偏移轨迹的对比。
   o={pts:[[x,y]..], dur, cls, r, label, trail:true} */
function trace(o){
  var pts=o.pts, d="M"+pts[0][0]+","+pts[0][1];
  for(var i=1;i<pts.length;i++)d+="L"+pts[i][0]+","+pts[i][1];
  if(o.trail!==false){
    var tp=gS.append("path").attr("class","arw "+(o.cls||"y")+" trail")
      .attr("d",d).attr("marker-end",null);
    if(!fast()&&tp.node().getTotalLength){
      var L=tp.node().getTotalLength();
      tp.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
        .transition().duration((o.dur||2.4)*1000).ease(d3.easeSinInOut)
        .attr("stroke-dashoffset",0);
    }
  }
  var g=gS.append("g").attr("class","tracer")
    .style("offset-path",'path("'+d+'")')
    .style("--walk-dur",(o.dur||2.4)+"s");
  g.append("circle").attr("class","snode "+(o.cls||"y"))
    .attr("cx",0).attr("cy",0).attr("r",o.r||13);
  if(o.label)g.append("text").attr("class","slbl ink")
    .attr("x",0).attr("y",4).attr("text-anchor","middle").text(o.label);
  return g;
}

/* ── morphBars ──
   演示什么：参数一变，<b>每根柱子怎么随之变化</b>——谁涨谁跌、谁反超谁。
   用于：γ 从一个值变到另一个值时值函数的重排。柱子从 from 高度<b>过渡到</b> to 高度，
   数字同步滚动，所以「反超」这件事是看得见的，而不是两张静态图。
   o={from:[], to:[], x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v), dur} */
function morphBars(o){
  var A=o.from, B=o.to, n=B.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, dur=(o.dur||1400);
  if(mx==null){mx=0;B.forEach(function(v){if(Math.abs(v)>mx)mx=Math.abs(v);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(v){return (Math.round(v*100)/100).toString();};
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    (function(i){
      var cx=x0+i*gap+gap/2,
          hA=Math.abs(A[i])/mx*h, hB=Math.abs(B[i])/mx*h;
      var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
        .attr("x",cx-bw/2).attr("width",bw).attr("rx",3)
        .attr("y",y0-hA).attr("height",hA);
      var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(i))||""))
        .attr("x",cx).attr("text-anchor","middle").attr("y",y0-hA-9).text(fmt(A[i]));
      if(o.label)note(o.label(i),cx,y0+22,"sm");
      if(fast()){bar.attr("y",y0-hB).attr("height",hB);txt.attr("y",y0-hB-9).text(fmt(B[i]));return;}
      bar.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB).attr("height",hB);
      txt.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB-9)
         .tween("t",function(){var iv=d3.interpolateNumber(A[i],B[i]),self=this;
           return function(t){self.textContent=fmt(iv(t));};});
    })(i);
  }
}

/* ── fillBars ──
   演示什么：动态规划的<b>回代顺序</b>——每个值都要等它右边那个算完才能算。
   用于：Bellman 一致性方程从终点向起点回代。柱子按 order 依次出现，一次。
   o={vals:[], order:[下标顺序], x,y,w,h,max, label, cls, fmt, step:每步毫秒} */
function fillBars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, step=o.step||260;
  if(mx==null){mx=0;v.forEach(function(q){if(Math.abs(q)>mx)mx=Math.abs(q);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(q){return (Math.round(q*100)/100).toString();};
  var order=o.order;
  if(!order){order=[];for(var k=n-1;k>=0;k--)order.push(k);}  // 默认从右往左
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var cx=x0+i*gap+gap/2;
    gS.append("rect").attr("class","gcell")
      .attr("x",cx-bw/2).attr("y",y0-h).attr("width",bw).attr("height",h)
      .attr("rx",3).attr("opacity",.16);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
  }
  order.forEach(function(idx,rank){
    var cx=x0+idx*gap+gap/2, hh=Math.abs(v[idx])/mx*h,
        delay=fast()?0:rank*step;
    var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx).attr("y",y0-hh-9).attr("text-anchor","middle").text(fmt(v[idx]));
    if(fast()){bar.attr("y",y0-hh).attr("height",hh);return;}
    bar.attr("y",y0).attr("height",0).transition().duration(320).delay(delay)
       .attr("y",y0-hh).attr("height",hh);
    txt.attr("opacity",0).transition().duration(320).delay(delay).attr("opacity",1);
  });
}

/* ── sweepGrid ──
   演示什么：值迭代时信息<b>从目标格向外一圈圈扩散</b>的顺序。
   用于：格子世界的一轮扫描。格子按 order 依次点亮并写入值，一次。
   o={rows,cols,x,y,cs, val:fn(i,j), order:[[i,j]..], cls:fn(i,j), step} */
function sweepGrid(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150, step=o.step||190;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    gS.append("rect").attr("class","gcell")
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
  }
  (o.order||[]).forEach(function(ij,rank){
    var i=ij[0], j=ij[1],
        cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2,
        delay=fast()?0:rank*step;
    var rc=gS.append("rect").attr("class","gcell "+((o.cls&&o.cls(i,j))||"hl"))
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    var tx=gN.append("text").attr("class","slbl ink")
      .attr("x",cx).attr("y",cy+5).attr("text-anchor","middle")
      .text(o.val?o.val(i,j):"");
    if(fast())return;
    rc.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
    tx.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
  });
  return {x0:x0,y0:y0,cs:cs,
          cx:function(j){return x0+j*cs+(cs-4)/2;},
          cy:function(i){return y0+i*cs+(cs-4)/2;}};
}

/* ── reveal ──
   演示什么：一组元素之间的<b>因果或时间顺序</b>（先有这个，才有那个）。
   用于：信用分配里奖励回传的路径、推导步骤的先后。
   sel 是 d3 选择集，按数据顺序依次淡入，一次。 */
function reveal(sel,step){
  if(fast())return sel.attr("opacity",1);
  return sel.attr("opacity",0).transition().duration(340)
            .delay(function(d,i){return i*(step||240);}).attr("opacity",1);
}

E.sweepGrid=sweepGrid; E.reveal=reveal;

    },"证明的骨架：把期望写成对动作求和，<b>b(s) 不依赖 a，所以可以提到求和号外面</b>；里面剩下 Σ_a π·∇log π，用似然比技巧反着走一步变成 Σ_a ∇π；交换求和与求导得到 ∇Σ_a π；而 Σ_a π(a|s) = 1；<b>∇1 = 0</b>。  讲座在板上走的就是这六步，最后一步她特意点明是「对常数 1 求导」。  这和 L8 第八集因果性用的是<b>同一条引理</b>：score function 的期望恒为零。那里用它删掉了过去的奖励，这里用它减掉一个基线。  <b>关键的前提是 b 不能依赖动作</b>。如果 b 依赖 a，它就不能提到求和号外面，整个推导塌掉——而且那时减去它确实会改变梯度。");
  /* 主体 */
  S(1050,function(){
      clearScene();setBig(null);
      setEq("$$\\hat g=\\textstyle\\sum_t\\nabla_\\theta\\log\\pi_\\theta(a_t|s_t)\\big(G_t-b(s_t)\\big)$$","top");
      note("只保留「比基准好多少」",640,320,"g lg");
      setCap("于是可以放心地减：估计量变成 <b>(回报 − 基准)</b>，而期望不变。");
    },"有了这条保证，就可以把估计量改写成：score 乘上 <b>G_t − b(s_t)</b>。  读法回到 L8 第七集那个骨架，但判断标准变了：原来是「这条轨迹的回报是多少」，现在是「<b>比这个状态的基准好多少</b>」。回报高于基准的动作被加强，低于基准的被压低——终于有了负号。  最自然的基线是 <b>b(s) ≈ V^π(s)</b>：这个状态本来预期能拿多少。那样 G_t − b(s_t) 就近似是<b>优势</b>——这个动作比平均水平好多少。  注意「近似」两个字。这里的 G_t − b(s_t) 是一个<b>由采样回报和拟合基线算出来的经验量</b>，它和后面第七集里那个精确的 A^π(s,a) <b>不是同一个对象</b>，而讲座在板上把它们写成一样。这一处本片会在第七集再强调一次。");
  /* 反驳 */
  S(1062,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"b 只依赖状态",sub:"期望不变 · 可以减",state:"on"},
      {label:"b 依赖动作",sub:"提不出求和号 · 改变梯度",state:"dead"},
      {label:"同一条引理",sub:"与 L8 因果性共用",state:"on"}]});
      note("前提就这一条",640,420,"y");
      setCap("<b>指名反驳</b>：能减不是因为它小，是因为 <b>b 不依赖动作</b>。");
    },"指名回去：可以减掉基线，<b>不是因为它影响小，而是因为它的期望贡献精确为零</b>。这不是近似，和 L8 第八集删掉过去奖励一样，是恒等变形。  前提只有一条，但必须守住：<b>b 只能依赖状态，不能依赖动作</b>。依赖动作的「基线」提不出求和号，减掉它会真的改变梯度——那时你优化的就不是原来那个目标了。  这条引理在这一讲里已经是第二次出现（L8 第八集是第一次），而且它的用法是同一个模式：<b>往估计量里加减任何期望为零的东西，都不改变正确性</b>。  于是一个很自然的问题冒出来：既然随便减都不改期望，那 b 是不是可以随便取？下一集回答它，而答案是<b>不能</b>。");
  SUM(1014,1,{h:"只依赖状态的基线，减掉它期望完全不变",
    k:"六步证明，终点是 <b>∇1 = 0</b>：b(s) 不依赖 a ⟹ 提出求和号 ⟹ b·∇Σ_a π = b·∇1 = 0。",
    m:"与 L8 第八集<b>共用同一条引理</b>（score function 期望为零）。模式：往估计量里加减任何期望为零的东西，都不改变正确性。",
    w:"<s>误解</s>：「减掉一个数就不是原梯度了」。只要不依赖动作就不改期望 —— 这是恒等式不是近似。",
    e:"前提只有一条且必须守住：<b>b 不能依赖动作</b>。依赖动作就提不出求和号，减掉它会真的改变梯度。"});
  QUIZ(1014,1,{t:"为什么可以从策略梯度估计里减去一个基线 b(s)？",
    o:["因为 b(s) 通常很小，影响可以忽略","<b>因为 b 不依赖动作，可提出对动作的求和号，剩下 b·∇Σ_a π = b·∇1 = 0</b>","因为减去它之后估计变成有偏但方差更小","因为 b(s) 会被折扣因子抵消"],
    a:1,
    w:"b(s) 与 a 无关 ⟹ 提到求和号外；里面 Σ_a π∇log π = Σ_a ∇π = ∇Σ_a π = <b>∇1 = 0</b>。所以期望<b>精确</b>不变，这是恒等变形而非近似，与 L8 第八集因果性共用同一条引理。<s>「影响小可忽略」</s>不对：b 可以很大（比如 100），关键是它的期望贡献恰为 0。<s>「变成有偏」</s>正好相反 —— 它仍然<b>无偏</b>。<s>折扣抵消</s>与此无关。注意前提：b <b>不能</b>依赖动作，否则提不出求和号。"});
});

KP("2 · 无偏是无条件的，<b>降方差不是</b> —— 坏基线会加方差",function(){
  /* 钩子 */
  S(1250,function(){
      clearScene();setBig(null);setEq(null);
      note("任何 b(s) 都不改期望",640,280,"g lg");
      note("那 b 取什么都一样吗",640,350,"y lg");
      setCap("上一集证明了<b>任何</b>基线都保持无偏。<b>那还有什么可选的？</b>");
    },"上一集的结论很强：<b>任何</b>只依赖状态的 b 都不改变期望。b 取 0、取 100、取 −5000，梯度的期望完全相同。  这听起来像是说 b 无所谓。  但我们引入基线本来就不是为了改期望——期望已经是对的了。<b>引入它是为了降方差</b>。而方差和期望不是同一件事：一个量可以不影响前者却剧烈影响后者。  这一集把方差随 b 怎么变<b>算出来</b>。");
  /* 错误答案 */
  S(1262,function(){
      clearScene();setEq(null);
      setBig("既然无偏，随便取","反正证明说了任何 b 都行");
      setCap("「无偏」是<b>无条件</b>的，「降方差」<b>不是</b> —— 坏基线会把方差加大。");
    },"这个错误模型是上一集那条结论的过度推广：证明确实说了「任何 b」，但它说的是<b>无偏性</b>。  这里要把两句话分清楚，而且讲座在这一处的措辞被字幕弄坏了（转录成「他们当然不可能靠选好的选择把它变得更好」，读不通）。她的意思是：  <b>无偏性是无条件的</b>——任何 b 都保持无偏。 <b>方差下降不是无条件的</b>——好基线降方差，<b>坏基线会把方差加大</b>。  下面用一个能解析算完的例子把这条曲线画出来。");
  /* 铺陈 */
  S(1274,function(){
      clearScene();setBig(null);
      setEq("$$\\mathrm{Var}=\\mathbb{E}\\big[(R-b)^2\\big]-\\big(\\mathbb{E}[\\cdot]\\big)^2$$","top");
      note("关于 b 是二次函数",640,300,"y lg");
      note("二次 ⟹ U 形，有唯一最低点",640,360,"g lg");
      setCap("方差是 b 的<b>二次函数</b> —— 所以它是一条 U 形曲线，两边都会翘起来。");
    },"设一个最小的例子，小到可以解析算完：单状态、两个动作，π 各 0.5；两个动作的 score 分别是 +1 和 −1（和为零，符合上一集的引理）；回报分别是 <b>100 和 102</b>——差别只有 2，但基数很大。  真梯度 = 0.5×(+1)×100 + 0.5×(−1)×102 = <b>−1</b>。  估计量是 score×(R − b)。因为 score² 恒为 1，方差就等于 <b>E[(R−b)²] − 1</b>，这是关于 b 的一个<b>二次函数</b>。  二次函数意味着：它有唯一的最低点，而且<b>两侧都会翘起来</b>。这就是下一镜那条曲线的形状，也是这一集全部的要点。");
  /* 主体 */
  S(1286,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3,4],step:520,vals:[10201,2601,0,2401,22201],
      x:300,y:430,w:680,h:170,max:24000,
      label:function(i){return ["b=0","b=50","b=101","b=150","b=250"][i];},
      cls:function(i){return i===2?"g":(i===4?"r":"v");},
      fmt:function(v){return String(v);}});
      note("梯度期望恒为 −1",640,466,"y");
      setCap("实测 U 形：最优基线把方差压到 <b>0</b>，而 b=250 反弹到 <b>22201</b>。");
    },"<b>看什么：</b>看柱子<b>先降到底再翘起来</b>：中间那根（b=101）高度就是 <b>0</b>——不是画错，方差真的被压没了。而最右边那根比最左边<b>还高一倍多</b>。五根柱子对应的梯度期望<b>全都是 −1</b>。　—— 把曲线算出来。  <b>b=0</b>（不用基线）：方差 <b>10201</b>。 <b>b=101</b>（正好是两个回报的平均）：方差 <b>0</b>——这个例子里最优基线把方差完全消掉了。 <b>b=202</b>：方差又回到 10201，和不用基线<b>完全相同</b>（曲线对称）。 <b>b=250</b>：方差 <b>22201</b>，是不用基线的 <b>2.18 倍</b>。  而这五种取法的<b>梯度期望全都是 −1</b>，一个字都没变。  这就是这一集的全部内容：<b>无偏性完全不受 b 影响，方差剧烈地受它影响，而且可以被弄得更糟</b>。  实践中取什么：<b>b(s) ≈ V^π(s)</b>。本例里 V = 0.5×100 + 0.5×102 = 101，正好是最优点——这不是巧合，状态的期望回报本来就是回报的自然基准。");
  /* 反驳 */
  S(1298,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"无偏",sub:"任何 b 都成立",state:"on"},
      {label:"降方差",sub:"只有好 b 成立",state:"dead"},
      {label:"取 b ≈ V(s)",sub:"状态的期望回报",state:"on"}]});
      note("两句话必须分开说",640,420,"y");
      setCap("<b>指名反驳</b>：无偏无条件，降方差有条件。<b>b 取远了会更糟。</b>");
    },"指名回去：「既然无偏就随便取」把两句话合并成了一句。  <b>无偏是无条件的</b>——上一集的证明对任何不依赖动作的 b 都成立。 <b>降方差是有条件的</b>——方差是 b 的二次函数，有最优点，而且离得远时比不用基线更糟（实测 2.18 倍）。  所以基线不是一个「加了总没坏处」的技巧，它<b>要被学出来</b>。这也是为什么下一集那个模板里会有专门的一步：<b>用最小二乘把 b 重新拟合到当前的回报上</b>。  这条经验在整门课里反复出现：L3 第四集说判据是总 MSE 不是有没有偏差；这里是它的镜像——<b>保住了无偏，不等于这个估计量可用</b>。两件事都要看。");
  SUM(1250,2,{h:"无偏是无条件的，降方差不是",
    k:"实测（R=100/102、π 各 0.5、score=±1）：b=0 → 方差 <b>10201</b>；b=101（=V）→ <b>0</b>；b=202 → 10201（与不用基线相同）；b=250 → <b>22201（2.18×，更差）</b>。五者梯度期望<b>全是 −1</b>。",
    m:"方差是 b 的<b>二次函数</b> ⟹ U 形，有唯一最优点，两侧都会翘起来。最优点就在 <b>b ≈ V^π(s)</b>。",
    w:"<s>误解</s>：「证明说任何 b 都行，所以随便取」。那条证明说的是<b>无偏性</b>，不是方差。",
    e:"所以基线<b>要被学出来</b> —— 下一集那个模板里有专门一步：用最小二乘把 b 重新拟合到当前回报上。"});
  QUIZ(1250,2,{t:"策略梯度里选一个「坏」的基线 b(s)，会发生什么？",
    o:["梯度估计变成有偏的","<b>仍然无偏，但方差可能比完全不用基线还大</b>","梯度方向反转","算法收敛到另一个策略"],
    a:1,
    w:"只要 b 不依赖动作，无偏性<b>无条件</b>成立 —— 本集五个 b 的梯度期望全是 −1。但方差是 b 的<b>二次函数</b>：最优点（b≈V=101）把方差压到 0，而 b=250 时方差 22201，是不用基线（10201）的 <b>2.18 倍</b>。<s>「变有偏」</s>是把这一集和上一集的结论搞混了。<s>「方向反转」</s>与<s>「收敛到另一个策略」</s>都不成立 —— 期望一点没变，只是估计更抖，实践中表现为需要更多样本、训练更不稳。"});
});

KP("3 · vanilla policy gradient：把这一讲装配成一个模板",function(){
  /* 钩子 */
  S(1657,function(){
      clearScene();setBig(null);setEq(null);
      note("score · 因果性 · 基线",640,280,"b lg");
      note("零件齐了",640,350,"g lg");
      setCap("L8 到这里的零件已经够了。<b>装配成一个能跑的循环。</b>");
    },"到这里，L8 和 L9 的零件已经凑齐：  score function（L8 第六集）、因果性的 reward-to-go（L8 第八集）、以及基线（这一讲前两集）。  把它们装配起来，就是讲座称作 <b>vanilla policy gradient</b> 的那个模板。  这一集把它写成五步，并指出一处会让人读错板书的记号问题。");
  /* 错误答案 */
  S(1669,function(){
      clearScene();setEq(null);
      setBig("这是一个新算法","又要单独记一套流程");
      setCap("它是<b>模板</b>不是算法 —— 后面所有策略梯度方法都在往这五步里换零件。");
    },"「vanilla policy gradient」听起来像是清单上又多了一个要背的算法。  换个读法会省很多力气：它是一个<b>模板</b>。后面几乎所有策略梯度方法——A3C、TRPO、PPO——都保持这五步的骨架不变，<b>只替换其中一两个零件</b>。  所以值得记住的不是这五步本身，而是<b>每一步可以被换成什么</b>。这一讲后面几集正是在换：第五集换掉回报（用 critic），第六集换掉回报的长度（n 步），第九集换掉「走多远」那一步。");
  /* 铺陈 */
  S(1681,function(){
      clearScene();setBig(null);setEq(null);
      note("① 跑 m 条轨迹",360,250,"b lg","start");
      note("② 算 reward-to-go",360,310,"b lg","start");
      note("③ 算优势 G − b",360,370,"g lg","start");
      setCap("前三步：<b>采样 → 算回报 → 减基线</b>。");
    },"模板的前三步。  <b>① 用当前策略跑 m 条轨迹。</b>这是从 P(τ;θ) 抽样——L8 第七集说过，「抽样」在这里就是「跑一个回合」。  <b>② 对每条轨迹的每一步，算 reward-to-go G_t</b>，也就是从 t 开始往后的折扣回报。这一步实现的是 L8 第八集的因果性：只算<b>之后</b>的奖励。  <b>③ 算优势估计 Â_t = G_t − b(s_t)</b>，也就是「比这个状态的基准好多少」。  按约定标一处记号：讲座在这里把 <b>i</b> 用成了两个意思——外层循环的迭代计数，以及 G_{i,t} 里的轨迹编号；而每轮的轨迹数她先后用了 <b>D、d、m</b> 三个符号。本片统一用 <b>m 表示轨迹数</b>。");
  /* 主体 */
  S(1693,function(){
      clearScene();setBig(null);setEq(null);
      note("④ 最小二乘重拟合 b",360,270,"y lg","start");
      note("⑤ 沿 Σ ∇log π · Â 走一步",360,350,"g lg","start");
      note("然后回到 ①",360,420,"sm lg","start");
      setCap("后两步：<b>重新拟合基线</b>，<b>走一步梯度</b>，然后回到采样。");
    },"后两步。  <b>④ 用刚收集的回报，把基线 b 重新拟合一遍</b>——通常是最小二乘：让 b(s) 去逼近观测到的 G_t。这一步直接对应上一集的结论：<b>基线要被学出来，因为坏基线会加方差</b>。  <b>⑤ 沿 Σ_t ∇log π_θ(a_t|s_t)·Â_t 的方向走一步</b>，更新 θ。  然后回到第一步——<b>用新策略重新采样</b>。这一点很关键：旧数据不能重用，因为它来自旧策略。策略梯度天生是<b>在策略</b>的，这和 L4 的 Q-learning 正好相反。  这也提前说明了第四集要讲的问题：既然每走一步都要重新收集数据，那<b>这一步走坏了，代价就是下一批数据都是坏的</b>。");
  /* 反驳 */
  S(1705,function(){
      clearScene();setBig(null);setEq(null);
      note("经验的 G − b",400,280,"b lg");
      note("精确的 A^π(s,a)",880,280,"v lg");
      note("板上写成一样，其实不是",640,400,"r lg");
      setCap("<b>指名反驳</b>：这是模板不是算法。另外<b>「优势」在这一讲指两个不同的对象</b>。");
    },"指名回去：这是一个<b>模板</b>，值得记的是每一步能换成什么，而不是五步本身。  最后把一处会真正造成误解的记号说破，因为它在这一讲后半段会变成麻烦。  <b>「优势」在这一讲里指两个不同的对象</b>：  <b>Â_t = G_t − b(s_t)</b> 是一个<b>经验量</b>——由采样回报和拟合出来的基线算出来的估计，带着采样噪声和拟合误差。  <b>A^π(s,a) = Q^π(s,a) − V^π(s)</b> 是一个<b>精确量</b>——旧策略的真实优势函数，第七集的相对性能恒等式里用的是它。  两者在板上被写成一样。混起来的后果是：你会以为第七集那个恒等式是可以直接采样估计的，而它不是。  顺带纠一处口误：她一度把优势念成「Q(s_t,a_t) 减去旧策略下的 Q(s_t)」，第二项应该是 <b>V^π(s_t)</b>。");
  SUM(1657,3,{h:"vanilla policy gradient 是模板，不是又一个算法",
    k:"五步：<b>① 跑 m 条轨迹 → ② 算 reward-to-go → ③ 算 Â=G−b → ④ 最小二乘重拟合 b → ⑤ 沿 Σ∇log π·Â 走一步</b>，回到 ①。",
    m:"后面的方法（A3C、TRPO、PPO）都<b>保持这个骨架，只换零件</b>：换回报（critic）、换回报长度（n 步）、换步长规则。",
    w:"<s>误解</s>：「又一个要背的算法」。该记的是<b>每一步能换成什么</b>。",
    e:"记号陷阱：<b>「优势」指两个对象</b> —— 经验的 <b>Â=G−b</b>（带噪声）与精确的 <b>A^π=Q^π−V^π</b>（第七集用的），板上写成一样。另：每轮轨迹数讲座用了 D/d/m 三个符号。"});
  QUIZ(1657,3,{t:"vanilla policy gradient 模板里，为什么每一轮都要<b>重新</b>采样轨迹？",
    o:["为了增加数据总量","<b>因为策略梯度是在策略的：旧数据来自旧策略，不能用来估当前策略的梯度</b>","为了让基线的拟合更准","因为回放缓冲太占内存"],
    a:1,
    w:"梯度的表达式是 E_{τ~P(τ;θ)}[…] —— 期望是对<b>当前</b> θ 诱导的轨迹分布取的，所以样本必须来自当前策略。这使策略梯度天生<b>在策略</b>，与 L4 的 Q-learning（离策略、可用回放）正好相反。<s>「增加数据量」</s>不是理由，重采样并不比复用旧数据得到更多样本。<s>「基线更准」</s>是顺带效果不是原因。<s>内存</s>无关 —— 即使内存无限也不能复用旧策略的数据。这也引出第四集：既然每步都要重采样，<b>一步走坏，下一批数据就都是坏的</b>。"});
});

KP("4 · 在 RL 里「走多远」是真问题 —— 策略<b>决定</b>数据分布",function(){
  /* 钩子 */
  S(2067,function(){
      clearScene();setBig(null);setEq(null);
      note("监督学习：数据集固定",400,280,"g lg");
      note("RL：策略决定数据",880,280,"r lg");
      setCap("同样是「梯度上升一步」，这两种设定里<b>走坏一步的后果完全不同</b>。");
    },"模板的第五步是「沿梯度走一步」。步长该取多大？  在监督学习里这是个调参问题：步子大了损失震荡，小了慢，试几个值就行。走坏了也不要紧——<b>数据集还在那儿</b>，下一步照样能算出正确的梯度，慢慢纠回来。  在 RL 里不是这样。第三集最后已经提过：<b>每走一步都要用新策略重新采样</b>。  所以这一步走坏了，下一批数据<b>全部来自那个坏策略</b>。这一集要说的是这件事有多严重。");
  /* 错误答案 */
  S(2079,function(){
      clearScene();setEq(null);
      setBig("步长就是个超参数","调一调总能调对");
      setCap("在监督学习里这是对的。<b>RL 里走坏一步可能再也回不来。</b>");
    },"把步长当超参数，是从监督学习带过来的习惯，而那个习惯建立在一个前提上：<b>目标函数是固定的</b>。你在一个不动的地形上找最低点，走岔了退回来就是。  RL 里地形不是不动的——准确地说，<b>你能看到的那一块地形，取决于你站在哪里</b>。策略变了，状态分布跟着变，你接下来采到的样本也跟着变。  于是有一种失败是监督学习里不存在的：<b>你走进了一个采不到有用信息的区域</b>。梯度估计在那里要么几乎全是噪声，要么指向别处。这时候「退回来」不是免费的，因为你得先有信息才知道该往哪退。");
  /* 铺陈 */
  S(2091,function(){
      clearScene();setBig(null);setEq(null);
      mdpChain({n:4,y:290,r:28,x:400,gap:160,
      label:function(i){return ["θ","θ′","?","?"][i];},
      cls:function(i){return i<2?"g":"r";},
      arcs:[[0,1,"一步","y",0],[1,2,"","r",0],[2,3,"","r",0]]});
      note("数据从这里起都是坏的",640,400,"r");
      setCap("一步走坏 ⟹ <b>接下来采到的每一批数据都来自那个坏策略</b>。");
    },"画成链条就清楚了：θ 走一步到 θ′，如果 θ′ 明显更差，那么<b>从这里开始收集的所有数据</b>都是由它产生的。  三件事同时恶化：  <b>数据质量</b>——坏策略走出来的轨迹回报低，能学到的东西少。 <b>覆盖范围</b>——坏策略可能根本到不了那些好状态，于是关于它们的信息一点也收集不到。 <b>梯度信号</b>——优势估计 Â 在低回报区域可能几乎处处相同，梯度接近噪声。  讲座的说法是：一步坏的更新可能把你<b>困在一个收集不到有用信息的地方</b>。这和 L7 第五集那个分布偏移是同一个家族的问题——<b>你的决策决定了你接下来看到什么</b>。");
  /* 主体 */
  S(2103,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"监督学习",sub:"数据固定 · 可以纠回来",state:"on"},
      {label:"强化学习",sub:"数据跟着策略走",state:"dead"},
      {label:"所以要",sub:"保证每步都不变差",state:"on"}]});
      note("目标从「快」变成「稳",640,420,"y");
      setCap("于是目标变了：不再是「走得快」，而是<b>保证每一步都不把事情弄糟</b>。");
    },"既然走坏一步的代价是不可逆的，优化的目标就变了。  监督学习追求<b>快</b>：在给定预算下尽量降低损失，偶尔震荡无所谓。  RL 这里追求的是<b>单调改进</b>：<b>宁可慢，也要保证每一步都不比上一步差</b>。  这正是讲座在开头就提到「monotonically improving」的原因，也是这一讲后半段全部机器的目的地：先写出一个能算的下界，再证明<b>单调地改进这个下界就单调地改进了真值</b>。  那个最后一步是 TRPO 的论证，而<b>讲座明确说了要推到期中之后</b>——所以这一讲只铺到下界为止。后面三集就是在铺这个下界。");
  /* 反驳 */
  S(2115,function(){
      clearScene();setBig(null);setEq(null);
      note("步长不是调参问题",640,290,"r lg");
      note("是信息可得性问题",640,360,"y lg");
      setCap("<b>指名反驳</b>：坏步子毁掉的不只是这一步，<b>是接下来的数据来源</b>。");
    },"指名回去：在 RL 里步长不是一个纯粹的优化超参数，它<b>决定了你接下来能采到什么数据</b>。  把这一讲和前面几讲连起来看，这是同一个主题的第三次出现：  <b>L7 第五集</b>——行为克隆：你的动作把你推出训练分布，误差从 εT 变 εT²。 <b>L6 第八集</b>——DQN：回放缓冲让数据来自旧策略，加重了离策略。 <b>这一集</b>——策略梯度：一步走坏，接下来的数据全由坏策略产生。  三处的共同形状是 L1 第一集那个「序贯」：<b>你的决策影响你接下来看到的数据</b>。它在这门课里从来没有停止过发作。  接下来两集先回到降方差（critic 和 n 步回报），第七集之后再正面处理「走多远」。");
  SUM(2067,4,{h:"RL 里步长决定的是「接下来能采到什么数据」",
    k:"策略梯度是<b>在策略</b>的：走一步就要重新采样。所以一步走坏 ⟹ <b>之后每一批数据都来自那个坏策略</b>。",
    m:"三件事同时恶化：<b>数据质量</b>（回报低）、<b>覆盖范围</b>（到不了好状态）、<b>梯度信号</b>（优势处处相同，接近噪声）。",
    w:"<s>误解</s>：「步长就是超参数，调一调就行」。监督学习里数据集固定、可以纠回来；这里不行。",
    e:"于是目标从「走得快」变成<b>单调改进</b>。这是 L1 第一集那个「序贯」的第三次发作（另两次：L7 行为克隆、L6 回放）。"});
  QUIZ(2067,4,{t:"为什么在策略梯度里，步长比在监督学习里更要紧？",
    o:["因为 RL 的损失函数不可微","<b>因为策略决定数据分布：走坏一步之后，接下来采到的所有数据都来自那个坏策略</b>","因为 RL 的梯度是有偏的","因为 RL 用的是随机梯度下降"],
    a:1,
    w:"策略梯度是<b>在策略</b>的，每走一步都要用新策略重新采样。一步走坏，之后的数据质量、覆盖范围、梯度信号<b>同时</b>恶化，可能把你困在一个采不到有用信息的区域 —— 而监督学习的数据集是固定的，走岔了下一步照样能算出正确梯度。<s>「不可微」</s>不对：目标对 θ 可微，L8 整讲都在求它的导数。<s>「梯度有偏」</s>也不对，REINFORCE 与加基线后都<b>无偏</b>。<s>随机梯度下降</s>监督学习同样在用，不是差别所在。"});
});

KP("5 · actor-critic：把回报换成 critic 的估计",function(){
  /* 钩子 */
  S(2400,function(){
      clearScene();setBig(null);
      setEq("$$\\hat A_t=G_t-b(s_t)$$","top");
      note("G_t 还是整条回报",640,300,"r lg");
      note("方差还在那里",640,360,"r lg");
      setCap("基线砍掉了一部分方差。<b>但 G_t 仍然是蒙特卡洛回报。</b>");
    },"基线解决了「所有动作都被推高」的问题，也砍掉了一大块方差。但估计量里还有一个方差大户没动过：<b>G_t 本身</b>。  G_t 是从 t 开始一路走到回合结束的实际折扣回报。L3 第三集说过，蒙特卡洛回报<b>把整条轨迹的随机性吞进一个数</b>——那条结论在这里原样成立。  而且还有一个实际限制：要算 G_t 必须<b>等回合结束</b>。永不终止的任务根本没法用。  于是自然的问题是：能不能用一个<b>估计</b>去代替这个实际回报？");
  /* 错误答案 */
  S(2412,function(){
      clearScene();setEq(null);
      setBig("用 critic 只是图省事","不用等回合结束而已");
      setCap("省事是真的 —— 但真正买到的是<b>方差</b>，付出的是<b>偏差</b>。");
    },"「不用等回合结束」确实是 critic 带来的一个好处，而且很实际。  但把它当成主要理由，会让你看不清这是一次<b>有代价的交换</b>——而代价恰恰是这门课反复强调的那一对。  L3 第一集已经把这组取舍建立好了：用估计去替代实际回报，就是<b>自举</b>。自举带来偏差，换来方差下降。  这里发生的事完全一样，只是被替换的东西从 V 换成了策略梯度里的那个权重。");
  /* 铺陈 */
  S(2424,function(){
      clearScene();setBig(null);
      setEq("$$\\hat A_t=r_t+\\gamma \\hat V(s_{t+1};\\,\\phi)-\\hat V(s_t;\\,\\phi)$$","top");
      note("actor：策略 π_θ",400,320,"g lg");
      note("critic：值函数 V̂_φ",880,320,"b lg");
      setCap("<b>actor-critic</b>：一个网络演（选动作），一个网络评（估值）。");
    },"把 G_t 换成一个学出来的值函数，就得到 <b>actor-critic</b>。  <b>actor</b> 是策略 π_θ——它决定做什么。 <b>critic</b> 是值函数 V̂_φ（或 Q̂_φ）——它评价做得怎么样。  优势估计可以只用一步：Â_t = r_t + γV̂(s_{t+1}) − V̂(s_t)。这正是 <b>TD 误差</b>（L3 第八集那个 δ），只不过现在它被用作策略梯度的权重。  注意 critic 在这里<b>同时扮演两个角色</b>：它既是基线（被减掉的 V̂(s_t)），也是自举的目标（加上去的 γV̂(s_{t+1})）。前一个角色不引入偏差（第一集证过），<b>后一个引入</b>。  讲座提到 <b>A3C</b> 是当时最主流的深度实例。");
  /* 主体 */
  S(2436,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"蒙特卡洛 G_t",sub:"无偏 · 方差大 · 要等回合",state:"on"},
      {label:"critic 自举",sub:"有偏 · 方差小 · 可在线",state:"on"},
      {label:"判据",sub:"总 MSE",state:"on"}]});
      note("和 L3 是同一组取舍",640,420,"y");
      setCap("这就是 L3 那组取舍<b>原样搬过来</b>：偏差换方差。");
    },"把两端摆清楚。  <b>蒙特卡洛 G_t</b>：无偏（L3 第三集），方差大，必须等回合结束。 <b>critic 自举</b>：有偏——因为 V̂ 不等于 V^π，方差小得多，而且可以在线更新。  这和 L3 第一到第四集<b>完全是同一组取舍</b>，判据也一样：<b>总 MSE，不是有没有偏差</b>（L3 第四集）。  有一处新的风险值得点明：critic 的偏差<b>不是静态的</b>。它是被学出来的，训练早期 V̂ 可能离谱，于是优势估计也离谱，而策略又按这个离谱的信号去更新——<b>两个网络互相喂对方的误差</b>。  这也是为什么 actor-critic 在实践上比 vanilla PG 更难调，尽管它的方差更小。");
  /* 反驳 */
  S(2448,function(){
      clearScene();setBig(null);setEq(null);
      note("买到：方差 + 在线",400,290,"g lg");
      note("付出：偏差",880,290,"r lg");
      note("critic 还身兼基线",640,400,"y lg");
      setCap("<b>指名反驳</b>：不是图省事，是<b>用偏差换方差</b> —— L3 那组取舍的第二次出场。");
    },"指名回去：用 critic 不是为了省事，是一次明确的<b>偏差换方差</b>。省掉「等回合结束」是顺带的好处。  把 critic 的两个角色再分清楚一次，因为它们的性质相反：  作为<b>基线</b>（减掉的 V̂(s_t)）——不引入偏差，这是第一集证过的，<b>任何</b>只依赖状态的量都行。 作为<b>自举目标</b>（加上的 γV̂(s_{t+1})）——<b>引入偏差</b>，因为 V̂ ≠ V^π。  同一个 V̂ 出现在两处，一处无害一处有害。这个区分在读 actor-critic 的各种变体时很有用：有些变体只用它做基线（保持无偏），有些两处都用。  下一集把这个交换变成一个<b>连续的旋钮</b>：n 步回报。");
  SUM(2400,5,{h:"actor-critic 是用偏差换方差，不是图省事",
    k:"把 G_t 换成 critic 的估计：Â_t = r_t + γV̂(s_{t+1}) − V̂(s_t)，正是 <b>TD 误差</b>被用作策略梯度的权重。深度实例：<b>A3C</b>。",
    m:"critic <b>身兼两职</b>：作<b>基线</b>（减掉的 V̂(s_t)）<b>不引入偏差</b>；作<b>自举目标</b>（加上的 γV̂(s_{t+1})）<b>引入偏差</b>。",
    w:"<s>误解</s>：「用 critic 只是不用等回合结束」。省事是顺带的，真正的交换是 L3 那组<b>偏差换方差</b>。",
    e:"新风险：critic 的偏差<b>不是静态的</b> —— 早期 V̂ 离谱 ⟹ 优势离谱 ⟹ 策略按错信号更新，<b>两个网络互喂误差</b>。"});
  QUIZ(2400,5,{t:"actor-critic 里，critic 的值函数 V̂ 出现在两个位置，它们的性质有什么不同？",
    o:["两处都不引入偏差","<b>作基线（减去的 V̂(s_t)）不引入偏差；作自举目标（加上的 γV̂(s_{t+1})）引入偏差</b>","两处都引入偏差","作基线引入偏差，作自举目标不引入"],
    a:1,
    w:"第一集证明了<b>任何只依赖状态</b>的量做基线都不改变期望 —— V̂(s_t) 满足这一条，所以减掉它无害，哪怕 V̂ 估得很差。而 γV̂(s_{t+1}) 是<b>自举目标</b>：它替代了真实的后续回报，而 V̂ ≠ V^π，<b>这一处引入偏差</b>。同一个 V̂，两个位置，性质相反 —— 有些 actor-critic 变体只用它做基线以保持无偏。"});
});

KP("6 · n 步回报：TD(0) 与蒙特卡洛之间的连续谱",function(){
  /* 钩子 */
  S(2666,function(){
      clearScene();setBig(null);setEq(null);
      note("n=1：TD(0)",400,280,"b lg");
      note("n=T：蒙特卡洛",880,280,"g lg");
      note("中间呢",640,400,"y lg");
      setCap("上一集给了两个<b>端点</b>。<b>中间是空的吗？</b>");
    },"上一集把两个端点摆了出来：一端是完全自举的 TD 式估计（方差小、偏差大），另一端是完全不自举的蒙特卡洛回报（无偏、方差大）。  但这两个端点之间<b>不是空的</b>。  你可以选择「用真实奖励走 n 步，然后才开始自举」——n 是一个你可以调的整数。n=1 回到 TD(0)，n=T 回到蒙特卡洛，中间是一整条连续的谱。  讲座称它们为 <b>n 步回报</b>。");
  /* 错误答案 */
  S(2678,function(){
      clearScene();setEq(null);
      setBig("n 越大越好","越接近无偏，当然越准");
      setCap("n 大确实偏差小 —— <b>但方差跟着一起长</b>。判据还是总 MSE。");
    },"这个错误模型来自一个片面但正确的观察：n 越大，自举的成分越少，偏差越小；n=T 时完全无偏。  它漏掉了另一半：<b>n 越大，进来的真实奖励越多，而每一个都带着自己的随机性</b>。方差随 n 一起长。  所以这是一条标准的偏差-方差曲线，判据仍然是 L3 第四集那条：<b>总 MSE</b>。两个端点通常都不是最优的——<b>最优的 n 往往在中间</b>。  实践中 n 取 5 到 20 是常见的选择，而具体多少取决于问题。");
  /* 铺陈 */
  S(2690,function(){
      clearScene();setBig(null);
      setEq("$$G^{(n)}_t=r_t+\\gamma r_{t+1}+\\cdots+\\gamma^{n-1}r_{t+n-1}+\\gamma^{n}\\hat V(s_{t+n})$$","top");
      note("前 n 项是真实奖励",640,310,"g lg");
      note("最后一项才自举",640,370,"b lg");
      setCap("<b>n 步回报</b>：先用 n 个真实奖励，<b>第 n 步之后</b>才交给 V̂。");
    },"写出来很直白：前 n 项是<b>实际收到的奖励</b>，最后一项是 γ^n 乘以第 n 步之后那个状态的估值。  n=1 时它退化成 r_t + γV̂(s_{t+1})——就是 TD(0) 的目标。 n=T 时自举项的位置已经到了回合终点（V̂=0），它退化成完整的蒙特卡洛回报。  关键在最后那个 <b>γ^n</b>：它是自举那部分在整个目标里的<b>权重</b>。而 V̂ 正是偏差的唯一来源，所以——  <b>偏差大致按 γ^n 衰减</b>。这给了 n 一个很具体的读法：n 控制的是「你让那个可能不准的估计参与多少」。  按约定标一处字幕：这里的 γ^{t′−t}·r_{t′} 被转录成「gamma 2 the t prime minus t times r t prime」，而目标里的 γ^t·r(s_t,a_t) 被转录成「gamma t_r S_t a_t」。");
  /* 主体 */
  S(2702,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3],step:560,vals:[0.9000,0.8100,0.5905,0.3487],
      x:360,y:430,w:560,h:170,max:1,
      label:function(i){return ["n=1","n=2","n=5","n=10"][i];},
      cls:function(i){return i===0?"r":"b";},
      fmt:function(v){return v.toFixed(3);}});
      note("γ=0.9 时的 γ^n",640,466,"y");
      setCap("自举成分按 <b>γ^n</b> 衰减：γ=0.9 时 n=10 已降到 <b>0.349</b>。");
    },"<b>看什么：</b>看柱子<b>降得有多慢</b>：n 从 1 走到 10，自举的权重只从 0.900 降到 0.349 —— 还剩三分之一。所以「多走几步」买到的偏差下降，比直觉少。　—— 把自举成分的权重 γ^n 算出来。γ=0.9 时：n=1 是 0.900，n=2 是 0.810，n=5 是 0.591，n=10 是 <b>0.349</b>。  读法：n=10 时，那个可能不准的 V̂ 仍然占着三分之一的权重。<b>「多走几步」买到的偏差下降比直觉少得多</b>，而方差是实打实地跟着涨的。  γ 越大这件事越明显。γ=0.99 时，n=10 的 γ^n 是 <b>0.904</b>——走了十步，自举的权重几乎没降。要把它压到一半得走到 n≈69。  所以 n 的选择和 γ 强相关：<b>γ 越接近 1，要达到同样的偏差下降就得走越多步，而方差的代价也越大</b>。这也是为什么长时域问题特别难调。");
  /* 反驳 */
  S(2714,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"n 小",sub:"偏差大 · 方差小",state:"on"},
      {label:"n 大",sub:"偏差小 · 方差大",state:"on"},
      {label:"最优 n",sub:"通常在中间",state:"on"}]});
      note("端点很少是最优的",640,420,"y");
      setCap("<b>指名反驳</b>：n 不是越大越好。<b>两个端点通常都不是最优的。</b>");
    },"指名回去：n 越大偏差越小，但方差同时变大，<b>判据是总 MSE</b>，所以两个端点通常都不是最优解。  这条结论把 L3 和这一讲连成了一件事。L3 第二集画过那张「采样 / 自举」的两轴图，TD 和 MC 分别落在两个格子里，当时它们看起来是<b>离散</b>的两个选择。  n 步回报说明其实不是——<b>自举那根轴是连续的</b>，n 就是它上面的坐标。TD(0) 和蒙特卡洛只是 n=1 和 n=T 两个端点。  再往前一步就是 TD(λ)：不选一个 n，而是把所有 n 的结果按 λ 的几何权重<b>平均起来</b>。讲座提到了它（字幕把名字念成「TD Gamma」），并指向 Sutton &amp; Barto 第 12 章。  到这里降方差的部分就结束了。接下来三集回到第四集那个问题：<b>该走多远</b>。");
  SUM(2666,6,{h:"n 步回报：自举那根轴是连续的，端点很少最优",
    k:"G⁽ⁿ⁾_t = r_t + … + γ^{n−1}r_{t+n−1} + <b>γⁿ V̂(s_{t+n})</b>。n=1 是 TD(0)，n=T 是蒙特卡洛。",
    m:"<b>偏差大致按 γⁿ 衰减</b>（γ^n 是自举成分的权重）。实测 γ=0.9：n=1→0.900，n=10→<b>0.349</b>；γ=0.99：n=10→<b>0.904</b>，几乎没降。",
    w:"<s>误解</s>：「n 越大越好，越接近无偏」。n 大偏差小但<b>方差同时变大</b>，判据仍是总 MSE。",
    e:"n 的选择与 γ <b>强相关</b>：γ 越接近 1，同样的偏差下降要走越多步，方差代价越大。再进一步是 TD(λ)（字幕念成「TD Gamma」）。"});
  QUIZ(2666,6,{t:"γ = 0.99 时，n 步回报取 n = 10，自举成分 V̂ 在目标里的权重是多少？",
    o:["0.10","<b>0.904，即 γ¹⁰ —— 走了十步几乎没降</b>","0.349","0，因为已经走了十步真实奖励"],
    a:1,
    w:"n 步回报的最后一项是 <b>γⁿ·V̂(s_{t+n})</b>，所以自举成分的权重就是 γⁿ。γ=0.99、n=10 时是 0.99¹⁰ ≈ <b>0.904</b> —— 走了十步真实奖励，那个可能不准的估计<b>仍占九成权重</b>。<s>0.349</s>是 <b>γ=0.9</b> 时 n=10 的值，两个 γ 差别巨大，这正是「n 的选择与 γ 强相关」的含义。<s>0.10</s>没有依据。<s>0</s>把 n 步回报误当成了蒙特卡洛 —— 只有走到回合终点（V̂=0）自举才真正消失。"});
});

KP("7 · 相对性能恒等式 —— 以及那个会把推导反过来的下标",function(){
  /* 钩子 */
  S(3650,function(){
      clearScene();setBig(null);setEq(null);
      note("新策略比旧策略好多少",640,280,"y lg");
      note("要能写成一个式子",640,350,"g lg");
      setCap("要保证「每步都不变差」，先得能<b>精确地写出差了多少</b>。");
    },"第四集立下的目标是<b>单调改进</b>：每一步都不比上一步差。  要做到这件事，第一步是能把「新策略比旧策略好多少」<b>精确地写出来</b>——不是估一个近似，而是一个恒等式。  这一集给出那个恒等式。它形式很简洁，但里面有一个下标，<b>弄反了整个推导就倒过来</b>，而课堂上确实有学生问到了它。");
  /* 错误答案 */
  S(3662,function(){
      clearScene();setEq(null);
      setBig("优势当然用新策略的","我们在评价新策略，那就用它的 A");
      setCap("学生在课上问的正是这个 —— <b>答案是：不，用旧策略的</b>。");
    },"这个错误模型非常自然：我们要评价的是新策略 π̃，那式子里的优势函数应该是 A^π̃ 才对。  课堂上有学生明确问了这个问题——上标该不该是 π̃。  <b>答案是不该。</b>  而且这不是一个可以两边都行的记号选择。弄反了，整个推导的方向就反了，后面的代理目标和下界全部失去依据。下一镜写出正确的形式。");
  /* 铺陈 */
  S(3674,function(){
      clearScene();setBig(null);
      setEq("$$V(\\tilde\\pi)=V(\\pi)+\\mathbb{E}_{s,a\\sim\\tilde\\pi}\\Big[\\textstyle\\sum_t\\gamma^t A^{\\pi}(s_t,a_t)\\Big]$$","top");
      note("分布用新策略",400,320,"v lg");
      note("优势用旧策略",880,320,"b lg");
      setCap("<b>相对性能恒等式</b>：分布来自<b>新</b>策略，优势来自<b>旧</b>策略。");
    },"恒等式是这样的：新策略的值，等于旧策略的值，加上一个期望项。  而那个期望项里<b>两个下标不一样</b>：  <b>状态-动作分布</b> s,a ~ π̃——<b>新</b>策略走出来的轨迹。 <b>优势函数</b> A^π——<b>旧</b>策略的优势。  读法其实很直观：<b>沿着新策略实际会走的路，逐步累计「按旧策略的标准，这一步赚了多少」</b>。旧策略的优势是评分标准，新策略决定你走到哪里被评分。  为什么不能换成 A^π̃：那样右边就成了 V(π̃) = V(π) + (关于 π̃ 自己的量)，式子会自我指涉，也不再给出任何关于「相对于 π 改进了多少」的信息。");
  /* 主体 */
  S(3686,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"A^π 可算",sub:"旧策略的数据在手",state:"on"},
      {label:"分布 ~ π̃",sub:"还没有它的数据",state:"dead"},
      {label:"所以",sub:"恒等式不可直接估",state:"dead"}]});
      note("这正是下两集要解决的",640,420,"y");
      setCap("恒等式是<b>精确</b>的 —— 但右边那个期望<b>算不出来</b>。");
    },"现在看这个恒等式好不好用。  <b>A^π 是可以算的</b>：它是旧策略的优势，而旧策略的数据你刚刚采过一批。  <b>分布不可算</b>：期望要对 π̃ 走出来的状态取，而 π̃ 是你<b>正在考虑但还没执行</b>的策略。要采它的数据，你就得先真的换过去——可是换不换正是你要决定的事。  这是一个<b>先有鸡还是先有蛋</b>的困境，而它<b>不是</b>近似造成的：恒等式本身完全精确，问题在于右边那个期望没法在决定之前估出来。  第九集给出的解决办法是一个替换，而第八集要先把那个分布是什么说清楚——因为讲座在那里用错了名字。");
  /* 反驳 */
  S(3698,function(){
      clearScene();setBig(null);setEq(null);
      note("优势：旧",400,290,"b lg");
      note("分布：新",880,290,"v lg");
      note("反了推导就倒过来",640,400,"r lg");
      setCap("<b>指名反驳</b>：优势用<b>旧</b>策略的。<b>这不是可以两边都行的记号选择。</b>");
    },"指名回去：恒等式里的优势是 <b>A^π</b>，旧策略的。学生问的那个「该不该是 π̃」，答案是不该。  把两个下标的分工记清楚：<b>旧策略提供评分标准，新策略决定在哪些地方被评分</b>。  这里还要把 L9 第三集那处记号陷阱再提一次，因为它在这里会造成实际的误解：  第三集里 vanilla PG 用的 <b>Â_t = G_t − b(s_t)</b> 是一个<b>经验估计</b>；而这里的 <b>A^π(s,a) = Q^π(s,a) − V^π(s)</b> 是一个<b>精确量</b>。讲座把它们都写成「advantage」，写在板上也长得一样。  混起来的后果很具体：你会以为这个恒等式可以像第三集那样直接用采样估出来。<b>不能</b>——它的分布来自一个你还没有数据的策略。");
  SUM(3650,7,{h:"相对性能恒等式：分布用新策略，优势用旧策略",
    k:"<b>V(π̃) = V(π) + E_{s,a~π̃}[Σ γᵗ A^π(s_t,a_t)]</b>。读法：沿新策略实际会走的路，累计「按<b>旧</b>策略的标准这一步赚了多少」。",
    m:"两个下标分工不同：<b>旧策略提供评分标准，新策略决定在哪里被评分</b>。换成 A^π̃ 会让式子自我指涉。",
    w:"<s>误解</s>：「评价新策略当然用它自己的优势」。课堂上有学生问过，<b>答案是不</b> —— 反了整个推导就倒过来。",
    e:"恒等式<b>精确但不可直接估</b>：分布来自一个你还没有数据的策略。另：这里的 A^π 是<b>精确量</b>，不是第三集那个经验的 G−b。"});
  QUIZ(3650,7,{t:"相对性能恒等式 V(π̃) = V(π) + E[Σγᵗ A(s,a)] 里，优势函数 A 的上标应该是哪个策略？",
    o:["新策略 π̃，因为我们在评价它","<b>旧策略 π —— 旧策略提供评分标准，新策略只决定在哪些状态被评分</b>","两者都可以，只是记号习惯不同","取决于 γ 的大小"],
    a:1,
    w:"优势是 <b>A^π</b>（旧策略），而状态-动作分布才是 ~π̃（新策略）。读法：沿新策略实际会走的路，逐步累计「按旧策略的标准这一步赚了多少」。换成 A^π̃ 后右边会自我指涉，也不再给出「相对 π 改进了多少」的信息。<s>「两者都可以」</s>正是这一集要反驳的 —— 课堂上有学生问过，答案是明确的「不」，弄反了整个推导就倒过来。<s>γ</s>与下标无关。"});
});

KP("8 · 折扣占用测度<b>不是</b>平稳分布，它的和是 1/(1−γ)",function(){
  /* 钩子 */
  S(3900,function(){
      clearScene();setBig(null);
      setEq("$$\\textstyle\\sum_t \\gamma^t P(s_t=s\\mid\\pi)$$","top");
      note("上一集那个分布",640,300,"y lg");
      note("它到底是什么",640,360,"r lg");
      setCap("上一集那个期望是对<b>这个东西</b>取的。先把它的身份弄清楚。");
    },"上一集恒等式里的期望，是对这个量取的：把每个时刻处在状态 s 的概率，按 γ^t 加权，再对所有 t 求和。  讲座全程把它叫作<b>平稳分布</b>，写成 μ_π。  这个名字是错的，而且错得有后果。这一集把它改正——<b>这是整讲里最要命的一处记号问题</b>，因为后面的代理目标和下界都建立在它上面。");
  /* 错误答案 */
  S(3912,function(){
      clearScene();setEq(null);
      setBig("它就是平稳分布","带个折扣而已");
      setCap("讲座原话是「带折扣的平稳分布」 —— <b>而它根本不是一个分布</b>。");
    },"讲座的说法是「带折扣的平稳分布」，而且她中途半更正过一次，改口叫「折扣加权分布」，但两个词在后面仍然混用。  这个叫法为什么危险：<b>平稳分布是一个概率分布，它的和是 1</b>（L2 第一集专门讲过它，包括它存在的前提）。  而这里这个量<b>不是</b>概率分布。它的和不是 1。  差多少？下一镜算出来——差的是一个在实践参数下大得离谱的因子。");
  /* 铺陈 */
  S(3924,function(){
      clearScene();setBig(null);
      setEq("$$\\textstyle\\sum_s\\sum_t\\gamma^t P(s_t=s)=\\textstyle\\sum_t\\gamma^t=\\frac{1}{1-\\gamma}$$","top");
      note("和是 1/(1−γ)，不是 1",640,320,"r lg");
      setCap("把它全部加起来：每个 t 的概率和是 1，于是总和是 <b>Σγᵗ = 1/(1−γ)</b>。");
    },"算一下它的总和。先对状态求和：任意固定时刻 t，Σ_s P(s_t=s) = 1（那确实是一个概率分布）。  于是整个量的总和就是 Σ_t γ^t = <b>1/(1−γ)</b>。  所以它是一个<b>未归一化</b>的量——正确的名字是<b>折扣占用测度</b>（discounted occupancy measure）。要把它变成概率分布，得乘上 (1−γ)：  <b>d^π(s) = (1−γ)·Σ_t γ^t P(s_t=s|π)</b>  注意 L3 第四集出现过<b>真正的</b>平稳分布 d(s)——那个满足 d(s′)=Σ_sΣ_a d(s)π(a|s)P(s′|s,a)，和是 1，而且存在性需要不可约加非周期（L2 第一集）。<b>那是另一个对象</b>，不是这里这个。");
  /* 主体 */
  S(3936,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1],step:760,vals:[10,100],
      x:380,y:430,w:520,h:170,max:110,
      label:function(i){return ["γ=0.9","γ=0.99"][i];},
      cls:function(i){return i===1?"r":"v";},
      fmt:function(v){return String(v);}});
      note("它的总和（分布应为 1）",640,466,"r");
      setCap("γ=0.9 时和是 <b>10</b>，γ=0.99 时是 <b>100</b> —— 而分布的和该是 1。");
    },"<b>看什么：</b>看两根柱子的<b>高度</b>：它们是这个「分布」的<b>总和</b>。一个概率分布的总和应该是 1，而这里是 10 和 100 —— 柱子本身就是误差的大小。　—— 把差距算出来。γ=0.9 时总和是 <b>10</b>；γ=0.99 时是 <b>100</b>；γ=0.999 时是 <b>1000</b>。  而概率分布的总和是 1。  所以把它当成平稳分布，在 γ=0.99 的标准设定下就是<b>差一百倍</b>。这不是一个可以忽略的措辞问题。  实际后果在哪里：下一集的代理目标 L_π 和 CPI 下界<b>都是对这个测度写的</b>。如果你按「平稳分布」去理解它、去实现它，常数因子就错了——而那个因子恰好又是 1/(1−γ)，和这一整门课里反复出现的那个放大系数是同一个。  请把它和前面几处放在一起记：L2 第九集的停机判据 γ/(1−γ)、L5 第五集的 MSVE 界 1/(1−γ)、这里的占用测度 1/(1−γ)。<b>凡是沿时域累加的东西，这个因子就会出现。</b>");
  /* 反驳 */
  S(3948,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"平稳分布",sub:"和为 1 · 要不可约非周期",state:"on"},
      {label:"折扣占用测度",sub:"和为 1/(1−γ) · 未归一化",state:"on"},
      {label:"讲座",sub:"两者混用",state:"dead"}]});
      note("差一个 1/(1−γ)",640,420,"r");
      setCap("<b>指名反驳</b>：它是<b>折扣占用测度</b>，不是平稳分布。两者差 1/(1−γ)。");
    },"指名回去：这个量是<b>折扣占用测度</b>，未归一化，总和 1/(1−γ)。它<b>不是</b>平稳分布。  两者的差别不止在归一化上，还在<b>存在条件</b>上：平稳分布需要链不可约且非周期（L2 第一集那个 A↔B 反例就是反证），而折扣占用测度对<b>任何</b>策略、任何链都有定义——γ<1 保证了那个级数收敛。  所以这不是「同一个东西的两种写法」，是两个不同的对象。  这也是这一讲里我认为最值得带走的一处更正，因为它影响的是<b>你读 TRPO 原文时能不能对上号</b>：那些论文写的是占用测度，而如果你脑子里装的是「平稳分布」，常数和条件都会对不齐。");
  SUM(3900,8,{h:"它是折扣占用测度，不是平稳分布",
    k:"Σ_t γᵗP(s_t=s|π) 的总和是 <b>Σγᵗ = 1/(1−γ)</b>，不是 1。实测：γ=0.9 → <b>10</b>；γ=0.99 → <b>100</b>；γ=0.999 → 1000。",
    m:"归一化版本是 <b>d^π(s)=(1−γ)Σ_t γᵗP(s_t=s|π)</b>。而 L3 第四集那个真正的平稳分布是<b>另一个对象</b>（和为 1）。",
    w:"<s>讲座说法</s>：「带折扣的平稳分布」。它<b>不是分布</b> —— γ=0.99 时差一百倍。这是整讲最要命的记号问题。",
    e:"两者<b>存在条件</b>也不同：平稳分布要不可约+非周期（L2 第一集反例），折扣占用测度对<b>任何</b>策略都有定义（γ&lt;1 即收敛）。"});
  QUIZ(3900,8,{t:"Σ_t γᵗ P(s_t = s | π) 对所有状态求和，结果是多少？",
    o:["1，它是一个概率分布","<b>1/(1−γ) —— 它是未归一化的折扣占用测度</b>","γ/(1−γ)","取决于策略"],
    a:1,
    w:"先对状态求和：每个固定时刻 Σ_s P(s_t=s)=1；再对 t 求和得 Σ_t γᵗ = <b>1/(1−γ)</b>。γ=0.9 时是 10，γ=0.99 时是 <b>100</b> —— 而概率分布的和该是 1。<s>「它是概率分布」</s>正是讲座把它叫成「平稳分布」时的误解。<s>γ/(1−γ)</s>是 L2 第九集停机判据里那个系数，不是这个。<s>「取决于策略」</s>不对：总和只依赖 γ，与策略无关 —— 策略只改变这个测度在各状态间怎么分配。"});
});

KP("9 · 代理目标与 CPI 下界：惩罚是 O(α²)，但系数是 1/(1−γ)²",function(){
  /* 钩子 */
  S(4314,function(){
      clearScene();setBig(null);setEq(null);
      note("恒等式精确",400,280,"g lg");
      note("但分布来自 π̃",880,280,"r lg");
      note("还没有它的数据",640,400,"r lg");
      setCap("困境很具体：<b>要评估才能决定换不换，要换了才能评估</b>。");
    },"第七集留下的困境：恒等式精确，但右边的期望要对新策略 π̃ 的占用测度取——而你还没有它的数据。  要评估才能决定换不换，要换了才能评估。  这一集给出破局的办法，它简单得有点像作弊：<b>把分布换成旧策略的</b>。");
  /* 错误答案 */
  S(4326,function(){
      clearScene();setEq(null);
      setBig("那就先换过去采一批","试试看不就知道了");
      setCap("可以试 —— 但第四集说过，<b>试错的代价是不可逆的</b>。");
    },"最直接的想法是：先把策略换过去，采一批数据，好就留下，不好就换回来。  这在有模拟器、可以随时回滚的场景里确实可行，而且实践中很多人就是这么调的。  但第四集已经说过为什么这不令人满意：<b>一步走坏的代价不只是这一步</b>。你在坏策略上采的那批数据本身就是坏的，它给出的梯度也不可靠——你连「该往哪退」都未必看得清。  而且在真实系统上（机器人、线上推荐、医疗），「先试试」的代价可能根本付不起。  所以我们想要的是：<b>在换过去之前，就能保证不会变差</b>。");
  /* 铺陈 */
  S(4338,function(){
      clearScene();setBig(null);
      setEq("$$L_{\\pi}(\\tilde\\pi)=V(\\pi)+\\mathbb{E}_{s\\sim\\pi,\\,a\\sim\\tilde\\pi}\\Big[\\textstyle\\sum_t\\gamma^t A^{\\pi}(s_t,a_t)\\Big]$$","top");
      note("状态分布换成旧的",640,320,"g lg");
      setCap("<b>代理目标 L_π</b>：只改一处 —— <b>状态分布用旧策略的</b>，于是可算了。");
    },"代理目标 L_π(π̃) 和真实的 V(π̃) 只差<b>一处</b>：<b>状态从哪个分布来</b>。  真值用 π̃ 的占用测度（不可算）；代理目标用 <b>π 的</b>（你刚采过数据，可算）。<b>动作仍然按 π̃ 抽</b>——那一部分可以用重要性采样处理，因为两个策略在同一个状态上都能算概率。  于是 L_π(π̃) <b>完全可以用旧策略的数据估出来</b>：拿旧数据里的状态，问「如果在这里按新策略选动作，按旧标准能赚多少」。  一个立刻可验证的性质：<b>L_π(π) = V(π)</b>。把 π̃ 换成 π，两个分布重合，代理目标就回到真值。所以它<b>在当前点是精确的</b>——这正是它能当局部替身的理由。");
  /* 主体 */
  S(4350,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1],step:760,vals:[49.5,198],
      x:380,y:430,w:520,h:170,max:220,
      label:function(i){return ["α=0.05","α=0.10"][i];},
      cls:function(i){return i===1?"r":"v";},
      fmt:function(v){return v.toFixed(1)+"ε";}});
      note("γ=0.99 时的惩罚系数",640,466,"r");
      setCap("CPI 下界的惩罚 <b>2εγα²/(1−γ)²</b>：α 翻倍，惩罚翻<b>四</b>倍。");
    },"<b>看什么：</b>看右边那根是左边的<b>四倍高</b>：α 只翻了一倍（0.05→0.10），惩罚翻了四倍 —— 因为它随 <b>α²</b> 增长。这就是「小步走」在数学上的依据。　—— 换掉分布当然是有代价的，而 Kakade 与 Langford 的<b>保守策略迭代</b>（CPI）下界把这个代价写了出来：对混合策略，  <b>V(π̃) ≥ L_π(π̃) − 2εγα²/(1−γ)²</b>  其中 α 是混合系数（走多远），ε 是 <b>max_s |E_{a~π′}A^π(s,a)|</b>——<b>这个 ε 在讲座里从未被定义过</b>，本片按约定补上。  算一下惩罚系数（γ=0.99）：α=0.05 时是 <b>49.5ε</b>，α=0.10 时是 <b>198ε</b>。  两件事同时成立，而它们指向同一个结论：  <b>惩罚随 α² 增长</b>——步子小时它是二阶小量，所以<b>小步一定安全</b>。 <b>系数带着 1/(1−γ)²</b>——γ=0.99 时是 10000，所以<b>「小」必须非常小</b>。  按约定标一处字幕：这个分式被转录成「minus 2 epsilon gamma, 1 minus gamma squared alpha squared」，完全读不出原式。");
  /* 反驳 */
  S(4362,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"L_π 可算",sub:"用旧数据估",state:"on"},
      {label:"L_π(π)=V(π)",sub:"当前点精确",state:"on"},
      {label:"最后一步",sub:"讲座推到期中之后",state:"dead"}]});
      note("下界铺好了，论证没走完",640,420,"y");
      setCap("<b>指名反驳</b>：不必先换过去试。<b>但讲座在这里停了。</b>");
    },"指名回去：不需要「先换过去试试」。代理目标 L_π 可以<b>完全用旧数据</b>估出来，而 CPI 下界告诉你这个替换的误差被 α² 控住。  但必须诚实地说清楚<b>讲座停在了哪里</b>。  它铺好了三块：<b>相对性能恒等式</b>（精确但不可算）、<b>代理目标 L_π</b>（可算，且在当前点精确）、<b>CPI 下界</b>（替换的代价是 O(α²)）。  而最后那一步——<b>单调地改进这个下界，就单调地改进了真值</b>——她明确说了推到期中考之后，本讲没有讲。那一步正是 TRPO 的全部论证，也是下一讲的内容。  所以这一讲的结尾是一个<b>半成品</b>，而且是讲座自己声明的半成品。知道它停在哪里，比以为它讲完了要好。");
  SUM(4314,9,{h:"代理目标：把分布换成旧策略的，于是可算",
    k:"<b>L_π(π̃)</b> 与 V(π̃) 只差<b>一处</b>：状态分布用<b>旧</b>策略的（可算），动作仍按 π̃ 抽。性质：<b>L_π(π) = V(π)</b>，在当前点精确。",
    m:"CPI 下界：<b>V(π̃) ≥ L_π(π̃) − 2εγα²/(1−γ)²</b>，其中 <b>ε = max_s |E_{a~π′}A^π(s,a)|</b>（讲座从未定义）。",
    w:"<s>误解</s>：「先换过去采一批试试」。第四集说过试错代价不可逆；而 L_π 可以<b>在换之前</b>用旧数据估。",
    e:"惩罚随 <b>α²</b>（小步是二阶小量 ⟹ 安全）但系数带 <b>1/(1−γ)²</b>（γ=0.99 时 10000 ⟹ 「小」必须很小）。实测 α=0.05→49.5ε，α=0.10→<b>198ε</b>。<b>讲座在此停止</b>，最后一步推到期中后。"});
  QUIZ(4314,9,{t:"代理目标 L_π(π̃) 与真实的 V(π̃) 相比，改动的是哪一处？",
    o:["把优势函数从 A^π 换成 A^π̃","<b>把状态分布从新策略的换成旧策略的，于是可以用旧数据估</b>","把折扣因子 γ 换成 1","把期望换成最大值"],
    a:1,
    w:"真值 V(π̃) 的期望要对 <b>π̃ 的</b>占用测度取（你还没有它的数据）；L_π 只把<b>状态分布</b>换成 <b>π 的</b>（刚采过，可算），<b>动作仍按 π̃ 抽</b>。于是它能完全用旧数据估出来，且 <b>L_π(π)=V(π)</b> —— 在当前点精确，所以能当局部替身。<s>换优势</s>会破坏第七集那个恒等式的结构。<s>γ→1</s>与<s>期望换最大值</s>都不是这个构造。替换的代价由 CPI 下界给出：<b>2εγα²/(1−γ)²</b>。"});
});

KP("完",function(){
  S(4700,function(){
      clearScene();setBig(null);setCap(null);setEq(null);
      setTitle("CS234 · Lecture 9 · 完","下界铺好了，最后一步没走",
      "L10 · Policy Gradient III：把「单调改进一个下界」变成 TRPO，以及复习");
    },"回头看这九集，承重的是三件事。  第一，<b>无偏是无条件的，降方差不是</b>。任何只依赖状态的基线都不改变期望——证明六步，最后一步是「对常数 1 求导等于 0」，和 L8 因果性用的是同一条引理。但方差是一条 <b>U 形曲线</b>：实测 b=0 时方差 10201，最优基线（≈平均回报 101）压到 <b>0</b>，而 b=250 时反弹到 <b>22201</b>——<b>比不用基线还差 2.18 倍</b>。好基线降方差，坏基线加方差。  第二，<b>RL 里「走多远」是一个监督学习没有的问题</b>。监督学习的数据集是固定的，一步走坏了下一步还能纠回来；RL 里策略<b>决定</b>数据分布，走坏一步可能把你扔到一个连有用梯度都收集不到的地方。这就是后面整条 TRPO/PPO 路线存在的理由。  第三，<b>代理目标是怎么来的</b>。相对性能恒等式里，优势 A^π 取自<b>旧</b>策略，而状态-动作分布取自<b>新</b>策略——后者不可算。代理目标 L_π 的全部内容就是<b>把分布换成旧策略的</b>，于是变得可算，并且在 π̃=π 处与真值相等。CPI 下界给出这个替换的代价：惩罚是 O(α²)，但系数带着 1/(1−γ)²——γ=0.99、α=0.1 时是 <b>198ε</b>。  下一讲把最后一步走完：<b>单调地改进一个下界，就单调地改进了真值</b>——这就是 TRPO 的论证。");
});
