<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

/* ══ RL 图元包 ══ */

/* #quiz 缺容器兜底。引擎里 #sum 有 max-height:90vh + overflow:auto，而 #quiz 两者都没有；
   又因为 #quizL 是 align-items:center，一旦内容超高就**上下对称裁切** ——
   最先看不见的是最底部的 .why，也就是那一拍的全部教学载荷（解析）。
   这比 SUM 卡溢出更隐蔽：SUM 至少还能滚，QUIZ 是直接两头切掉。
   选择器同为 (1,0,0)，本段注入在引擎样式之后，靠顺序取胜。 */
#quiz{max-height:88vh;overflow:auto}
.pt.b{fill:var(--coral)} .pt.c{fill:var(--green)} .pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)}
.box.y{stroke:var(--yellow)} .box.v{stroke:var(--violet)} .box.b{stroke:var(--blue)}
/* 层级只用颜色区分，字号一律沿用引擎的 .slbl 14px —— ML 版就是这么做的，
   混用字号会让画面每次切换都「跳」一下。sm / big 是**兜底色**，不是字号。

   顺序至关重要：sm/big/ink 必须排在语义色**之前**。三者特异度相同（0,2,0），
   靠先后决胜 —— 上一版把它们写在后面，于是 note(txt,x,y,cls+" sm") 这类调用
   （bars 第 187 行、errbar 第 303 行等，全片 15 处）的语义色被静默压成 --dim，
   而深底上的暗灰标签看起来像正常标签，所以没人反馈。
   「层级只靠颜色」这个正解，被为兼容它而保留的别名从内部取消掉了。
   现在的顺序下：class="slbl y sm" → 黄（语义色在后，赢）；class="slbl sm" → 暗色。 */
.slbl.ink{fill:var(--ink)} .slbl.sm{fill:var(--dim)} .slbl.big{fill:var(--ink)}
/* 五个语义色必须**全部**在别名之后重新声明 —— 包括 g 与 r。
   它们原本定义在 eng.txt 的基础样式里，而本段整体注入在基础样式之后，
   所以只在本段内部调顺序是不够的：第一次修完，slbl.y.sm 变对了，
   而 slbl.g.sm 仍被压成暗灰（实测 rgb(147,161,181)）—— 因为 .slbl.g 来自上游。 */
.slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)} .slbl.v{fill:var(--violet)}
.slbl.g{fill:var(--green)} .slbl.r{fill:var(--coral)}

/* ── 动画铁律 ──────────────────────────────────────────────────────────
   动画必须演示机制。看完一段动画，观众应当明白一件<b>之前不明白的事</b>。
   不解释任何东西的动画（呼吸、脉冲环、无限循环的小车、行进虚线）一律不要——
   它们只是视觉噪音，会盖过真正要看的东西。

   因此这里没有 infinite 动画。每个动画都：
     · 播一次就停在正确的终态；
     · 终态本身携带完整信息（后台标签页暂停也不丢内容）；
     · 有明确的「它在演示什么」的答案。
   ──────────────────────────────────────────────────────────────────── */
@keyframes rl-slide{to{offset-distance:100%}}
.tracer{animation:rl-slide var(--walk-dur,2.4s) ease-in-out 1 forwards;offset-rotate:0deg}
.trail{stroke-dasharray:none}

.arw.v{stroke:var(--violet);marker-end:url(#ah-v)}

.snode{fill:#101724;stroke:#2B3646;stroke-width:1.8}

.snode.r{stroke:var(--coral)} .snode.b{stroke:var(--blue)} .snode.v{stroke:var(--violet)}

.gcell{fill:#0E1420;stroke:#1E2836;stroke-width:1.2}
.gcell.wall{fill:#1B2230;stroke:#243044}

.gcell.g{fill:#0E2A24;stroke:var(--green);stroke-width:2}
.gcell.r{fill:#3A1A1E;stroke:var(--coral);stroke-width:2}

.vbar{fill:var(--blue);opacity:.85}
.vbar.g{fill:var(--green)} .vbar.y{fill:var(--yellow)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class",cls||"fit")
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false,eqT=null;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
/* 事故实录：setEq 的非 FAST 分支把写入推迟 150ms。连着翻镜时，上一镜那个
   还没触发的 setTimeout 会在 showSum 的 setEq(null) 之后才落地，把刚清干净的
   公式带重新填上 —— 总结卡上于是挂着上一镜的残留公式。
   L01 实测镜 8/45/65/74、L02 实测镜 79，全是这么来的。
   只有顺序翻才复现：从头 reload 直接跳到镜 8 是干净的，
   所以之前那次「跳过去看一眼」的单镜抽查给出了假的「已修好」。
   修法是把 pending 的定时器记下来，任何一次 setEq 先撤销它。 */
function setEq(h,pos){if(eqT){clearTimeout(eqT);eqT=null;}
  if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqT=null;eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");eqT=setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});
  eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");
  if(!eqBox.animate)return;
  eqBox.querySelectorAll("[data-id]").forEach(function(e){
    var r=b[e.dataset.id];
    if(r){var a=e.getBoundingClientRect(),dx=r.left-a.left,dy=r.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)
        e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:780,easing:"cubic-bezier(.35,0,.15,1)"});}
    else e.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
      {duration:520,delay:250,easing:"cubic-bezier(.3,.7,.3,1)",fill:"backwards"});});}
function T(id,t,c){return '<span class="tok '+(c||"")+'" data-id="'+id+'">'+t+'</span>';}
function setTitle(a,h,p){titleBox.classList.remove("off");
  titleBox.innerHTML='<p class="act">'+(a||"")+'</p><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'<div class="rule"></div>';}
function noTitle(){titleBox.classList.add("off");}
function setNarr(t){if(!t||!narrOn){narrEl.hidden=true;return;}
  narrEl.hidden=false;narrEl.innerHTML=t;narrEl.classList.remove("off");}
function clearSum(){sumEl.hidden=true;sumEl.classList.add("off");sumEl.innerHTML="";}
function showSum(kp,s){
  /* 总结卡是整屏覆盖层，但它盖不住公式带的顶边：实测 eqBox 顶边 y≈46，
     而 #sum 顶边 y≈94 —— 上一镜的公式会有约 48px 露在卡片上方。
     showSum 原本完全不碰 eqBox，于是 135 张卡里有 5 张挂着上一镜的残留公式。
     在这里清掉，比让每一集的最后一镜各自记得 setEq(null) 可靠。 */
  setEq(null);
  var ord=[["k","核心结论"],["m","底层机制"],["w","常见误解"],["e","与你的考试"]];
  sumEl.innerHTML='<p class="sh">知识点 '+kp+' · 总结</p><h3>'+s.h+'</h3><div class="rows">'+
    ord.filter(function(o){return s[o[0]];}).map(function(o){
      return '<div class="row '+o[0]+'"><p class="rk">'+o[1]+'</p><p class="rv">'+s[o[0]]+'</p></div>';}).join("")+'</div>';
  sumEl.hidden=false;void sumEl.offsetWidth;sumEl.classList.remove("off");}
function clearQuiz(){quizEl.hidden=true;quizEl.classList.add("off");quizEl.innerHTML="";locked=false;}
function askQ(kp,q){
  if(FAST){clearQuiz();return;}
  locked=true;
  quizEl.innerHTML='<p class="qh">知识点 '+kp+' · 检验</p><p class="qq">'+q.t+'</p><div class="qo">'+
    q.o.map(function(o,i){return '<button data-i="'+i+'">'+o+'</button>';}).join("")+
    '</div><p class="why" hidden>'+q.w+'</p>';
  quizEl.hidden=false;void quizEl.offsetWidth;quizEl.classList.remove("off");
  var bs=[].slice.call(quizEl.querySelectorAll("button"));
  bs.forEach(function(b,i){b.addEventListener("click",function(){
    if(b.classList.contains("lk"))return;
    bs.forEach(function(x,k){x.classList.add("lk");x.classList.add(k===q.a?"ok":(k===i?"no":"off2"));});
    quizEl.querySelector(".why").hidden=false;locked=false;
    document.getElementById("hint").textContent=(cur+1)+" / "+SHOTS.length+"  ·  空格继续";});});}

var SHOTS=[],KPS=[];
function S(t,fn,narr){SHOTS.push({t:t,enter:fn,n:narr});}
function KP(name,build){var from=SHOTS.length;build();KPS.push({name:name,from:from,len:SHOTS.length-from});}
function SUM(t,kp,s){SHOTS.push({t:t,sum:{kp:kp,s:s},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}
function QUIZ(t,kp,q){SHOTS.push({t:t,quiz:{kp:kp,q:q},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}

/* 把引擎暴露给内容区 */
function axes(P){gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.r).attr("y1",P.b).attr("y2",P.b);
  gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.l).attr("y1",P.t).attr("y2",P.b);}
window.__engine={gS:gS,gN:gN,DUR:DUR,isFast:function(){return FAST;},clearScene:clearScene,note:note,dots:dots,curve:curve,fn:fn,boxNode:boxNode,
  link:link,matrix:matrix,rng:rng,axes:axes,setCap:setCap,setBig:setBig,setEq:setEq,flip:flip,T:T,
  setTitle:setTitle,noTitle:noTitle,S:S,KP:KP,SUM:SUM,QUIZ:QUIZ,W:W,H:H};

/* ════════════════ 放映机（无需改动） ════════════════ */
function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];
  KPS.forEach(function(k){
    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);
    for(var i=0;i<k.len;i++){var p=document.createElement("span"),sh=SHOTS[k.from+i];
      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}
    FAST=false;
    cur=n;clearQuiz();clearSum();
    var sh=SHOTS[n];
    noTitle();clearScene();setBig(null);setEq(null);setCap(null);
    if(sh.enter)sh.enter();
    setNarr(sh.n);
    if(sh.sum){setNarr(null);showSum(sh.sum.kp,sh.sum.s);}
    if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});
  window.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}
window.__startProjector=startProjector;
})();
</script>


<script>

/* ══════════════ RL 图元包（在 __engine 之上扩展，不改原引擎） ══════════════ */
(function(){
var E=window.__engine, gS=E.gS, gN=E.gN, DUR=E.DUR, W=E.W, H=E.H;
var note=E.note;
function fast(){return E.isFast();}
function fadeIn(sel,delay){
  if(fast()){sel.attr("opacity",1);return sel;}
  return sel.attr("opacity",0).transition().duration(420).delay(delay||0).attr("opacity",1);
}

/* 箭头标记（各色一份），只建一次 */
(function(){
  var svg=d3.select("#scene");
  if(!svg.select("defs#rlmk").empty())return;
  var defs=svg.append("defs").attr("id","rlmk");
  var cols={"ah":"#3A4759","ah-g":"#5BDDA8","ah-y":"#FFD36E",
            "ah-r":"#FF7C87","ah-b":"#54A9F7","ah-v":"#B48BF5"};
  Object.keys(cols).forEach(function(id){
    defs.append("marker").attr("id",id).attr("viewBox","0 0 10 10")
      .attr("refX",9).attr("refY",5).attr("markerWidth",6).attr("markerHeight",6)
      .attr("orient","auto")
      .append("path").attr("d","M0,0.6L10,5L0,9.4z").attr("fill",cols[id]);
  });
})();

/* ── arrow ── */
function arrow(x1,y1,x2,y2,cls,bend){
  var d;
  if(bend){
    var mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy)||1;
    d="M"+x1+","+y1+"Q"+(mx-dy/L*bend)+","+(my+dx/L*bend)+" "+x2+","+y2;
  } else d="M"+x1+","+y1+"L"+x2+","+y2;
  var p=gS.append("path").attr("class","arw "+(cls||"")).attr("d",d);
  if(!fast()&&p.node().getTotalLength){
    var L2=p.node().getTotalLength();
    p.attr("stroke-dasharray",L2+" "+L2).attr("stroke-dashoffset",L2)
     .transition().duration(520).attr("stroke-dashoffset",0);
  }
  return p;
}

/* ── mdpChain ──
   o={n,x,y,r,gap,w, label:fn(i), lcls:fn(i), cls:fn(i), rew:fn(i),
      arcs:[[from,to,label,cls,bend]]} */
function mdpChain(o){
  var n=o.n, r=o.r||30, gap=o.gap||((o.w||900)/(n-1)),
      x0=o.x!=null?o.x:(W-(n-1)*gap)/2, y=o.y||300, pos=[];
  for(var i=0;i<n;i++){
    var cx=x0+i*gap; pos.push([cx,y]);
    var c=gS.append("circle").attr("class","snode "+((o.cls&&o.cls(i))||""))
      .attr("cx",cx).attr("cy",y).attr("r",r);
    fadeIn(c,i*55);
    if(o.label)note(o.label(i),cx,y+5,(o.lcls&&o.lcls(i))||"ink");
    if(o.rew&&o.rew(i)!=null)note(o.rew(i),cx,y-r-14,"y");
  }
  (o.arcs||[]).forEach(function(a){
    var A=pos[a[0]],B=pos[a[1]],sgn=B[0]>=A[0]?1:-1,bend=a[4]||0;
    arrow(A[0]+sgn*r,A[1],B[0]-sgn*r,B[1],a[3]||"",bend);
    /* 事故实录：这里原来是 Math.abs(bend)，把弧的方向丢掉了。两个后果都实测到过：
       (1) L02 KP1 的 A⇄B 来回弧，两个「1.0」标签落在同一个像素框 (627,255)-(653,273)；
       (2) L02 KP2 的 bend=-84 让弧向下弯，标签却仍算在上方，离自己的弧 100px。
       arrow 的控制点 y = my+(dx/L)*bend，故弧顶 y = A[1]+sgn*bend/2；标签跟着弧顶走。 */
    if(a[2]){
      var eff=sgn*bend, ay=A[1]+eff/2;
      note(a[2],(A[0]+B[0])/2, bend?(eff<0?ay-12:ay+20):A[1]-16, a[3]||"");
    }
  });
  return pos;
}

/* ── bars ──
   o={vals:[],x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v)} */
function bars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62, mx=o.max;
  if(mx==null){
    mx=0; for(var q=0;q<n;q++) if(Math.abs(v[q])>mx) mx=Math.abs(v[q]);
  }
  if(!mx)mx=1;
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var hh=Math.abs(v[i])/mx*h, cx=x0+i*gap+gap/2;
    var b=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    if(fast())b.attr("y",y0-hh).attr("height",hh);
    else b.attr("y",y0).attr("height",0).transition().duration(DUR).delay(i*45)
          .attr("y",y0-hh).attr("height",hh);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
    note(o.fmt?o.fmt(v[i]):(Math.round(v[i]*100)/100),
         cx,y0-hh-9,((o.cls&&o.cls(i))||"")+" sm");
  }
}

/* ── gridworld ──
   o={rows,cols,x,y,cs, val:fn(i,j), pol:fn(i,j)->"u|d|l|r",
      cls:fn(i,j), wall:fn(i,j), tag:fn(i,j)} */
function gridworld(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var isW=o.wall&&o.wall(i,j);
    var cl=isW?"wall":((o.cls&&o.cls(i,j))||"");
    var rc=gS.append("rect").attr("class","gcell "+cl)
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    fadeIn(rc,(i*C+j)*16);
    if(isW)continue;
    var cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2;
    if(o.val&&o.val(i,j)!=null)note(o.val(i,j),cx,cy+5,((o.cls&&o.cls(i,j))||"ink"));

/* ── backup：Sutton&Barto 回溯图 ──
   o={x,y,dy,spread,r, levels:["s","a","s"], branch:[1,2], labels:[], hl:[]} */
function backup(o){
  var x=o.x!=null?o.x:W/2, y=o.y!=null?o.y:150, dy=o.dy||105, r=o.r||20,
      lv=o.levels, br=o.branch||[], hl=o.hl||[], lab=o.labels||[], cur=[[x,y]];
  for(var k=0;k<lv.length;k++){
    var kind=lv[k], isHL=hl.indexOf(k)>=0, next=[];
    (function(kind,isHL,k){
      cur.forEach(function(p,pi){
        var c;
        if(kind==="s")
          c=gS.append("circle").attr("class","snode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r);
        else
          c=gS.append("circle").attr("class","anode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r*0.42);
        fadeIn(c,k*90);
        if(lab[k]&&pi===0)note(lab[k],p[0]-r-12,p[1]+5,isHL?"y":"","end");
      });
    })(kind,isHL,k);
    if(k<lv.length-1){
      var b=br[k]||1, spread=(o.spread||150)/Math.pow(1.7,k);
      cur.forEach(function(p){
        for(var m=0;m<b;m++){
          var nx=p[0]+(b===1?0:(m-(b-1)/2)*spread), ny=p[1]+dy;
          gS.append("path").attr("class","tedge").attr("d","M"+p[0]+","+p[1]+"L"+nx+","+ny);
          next.push([nx,ny]);
        }
      });
      cur=next;
    }
  }
}

/* ── tree：upto 控制画到第几个节点 ──
   o={nodes:[{id,parent,x,y,label,sub,cls}], upto, r} */
function tree(o){
  var r=o.r||24, N=o.nodes, up=o.upto!=null?o.upto:N.length, pos={};
  N.forEach(function(nd){ pos[nd.id]=[nd.x,nd.y]; });

      var e=gS.append("path").attr("class","tedge "+(nd.cls==="hl"?"hl":""))
        .attr("d","M"+p[0]+","+p[1]+"L"+nd.x+","+nd.y);
      if(!fast()&&e.node().getTotalLength){
        var L=e.node().getTotalLength();

         .transition().duration(380).delay(i*70).attr("stroke-dashoffset",0);

/* ═══════════ 演示机制的动画 ═══════════

/* ── trace ──
   演示什么：智能体<b>沿这条路走了一趟</b>，走过的地方留下痕迹。
   用于：策略的轨迹、示范轨迹与偏移轨迹的对比。
   o={pts:[[x,y]..], dur, cls, r, label, trail:true} */
function trace(o){
  var pts=o.pts, d="M"+pts[0][0]+","+pts[0][1];
  for(var i=1;i<pts.length;i++)d+="L"+pts[i][0]+","+pts[i][1];
  if(o.trail!==false){
    var tp=gS.append("path").attr("class","arw "+(o.cls||"y")+" trail")
      .attr("d",d).attr("marker-end",null);
    if(!fast()&&tp.node().getTotalLength){
      var L=tp.node().getTotalLength();
      tp.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
        .transition().duration((o.dur||2.4)*1000).ease(d3.easeSinInOut)
        .attr("stroke-dashoffset",0);
    }
  }
  var g=gS.append("g").attr("class","tracer")
    .style("offset-path",'path("'+d+'")')
    .style("--walk-dur",(o.dur||2.4)+"s");
  g.append("circle").attr("class","snode "+(o.cls||"y"))
    .attr("cx",0).attr("cy",0).attr("r",o.r||13);
  if(o.label)g.append("text").attr("class","slbl ink")
    .attr("x",0).attr("y",4).attr("text-anchor","middle").text(o.label);
  return g;
}

/* ── morphBars ──
   演示什么：参数一变，<b>每根柱子怎么随之变化</b>——谁涨谁跌、谁反超谁。
   用于：γ 从一个值变到另一个值时值函数的重排。柱子从 from 高度<b>过渡到</b> to 高度，
   数字同步滚动，所以「反超」这件事是看得见的，而不是两张静态图。
   o={from:[], to:[], x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v), dur} */
function morphBars(o){
  var A=o.from, B=o.to, n=B.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, dur=(o.dur||1400);
  if(mx==null){mx=0;B.forEach(function(v){if(Math.abs(v)>mx)mx=Math.abs(v);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(v){return (Math.round(v*100)/100).toString();};
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    (function(i){
      var cx=x0+i*gap+gap/2,
          hA=Math.abs(A[i])/mx*h, hB=Math.abs(B[i])/mx*h;
      var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
        .attr("x",cx-bw/2).attr("width",bw).attr("rx",3)
        .attr("y",y0-hA).attr("height",hA);
      var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(i))||""))
        .attr("x",cx).attr("text-anchor","middle").attr("y",y0-hA-9).text(fmt(A[i]));
      if(o.label)note(o.label(i),cx,y0+22,"sm");
      if(fast()){bar.attr("y",y0-hB).attr("height",hB);txt.attr("y",y0-hB-9).text(fmt(B[i]));return;}
      bar.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB).attr("height",hB);
      txt.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB-9)
         .tween("t",function(){var iv=d3.interpolateNumber(A[i],B[i]),self=this;
           return function(t){self.textContent=fmt(iv(t));};});
    })(i);
  }
}

/* ── fillBars ──
   演示什么：动态规划的<b>回代顺序</b>——每个值都要等它右边那个算完才能算。
   用于：Bellman 一致性方程从终点向起点回代。柱子按 order 依次出现，一次。
   o={vals:[], order:[下标顺序], x,y,w,h,max, label, cls, fmt, step:每步毫秒} */
function fillBars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, step=o.step||260;
  if(mx==null){mx=0;v.forEach(function(q){if(Math.abs(q)>mx)mx=Math.abs(q);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(q){return (Math.round(q*100)/100).toString();};
  var order=o.order;
  if(!order){order=[];for(var k=n-1;k>=0;k--)order.push(k);}  // 默认从右往左
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var cx=x0+i*gap+gap/2;
    gS.append("rect").attr("class","gcell")
      .attr("x",cx-bw/2).attr("y",y0-h).attr("width",bw).attr("height",h)
      .attr("rx",3).attr("opacity",.16);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
  }
  order.forEach(function(idx,rank){
    var cx=x0+idx*gap+gap/2, hh=Math.abs(v[idx])/mx*h,
        delay=fast()?0:rank*step;
    var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx).attr("y",y0-hh-9).attr("text-anchor","middle").text(fmt(v[idx]));
    if(fast()){bar.attr("y",y0-hh).attr("height",hh);return;}
    bar.attr("y",y0).attr("height",0).transition().duration(320).delay(delay)
       .attr("y",y0-hh).attr("height",hh);
    txt.attr("opacity",0).transition().duration(320).delay(delay).attr("opacity",1);
  });
}

/* ── sweepGrid ──
   演示什么：值迭代时信息<b>从目标格向外一圈圈扩散</b>的顺序。
   用于：格子世界的一轮扫描。格子按 order 依次点亮并写入值，一次。
   o={rows,cols,x,y,cs, val:fn(i,j), order:[[i,j]..], cls:fn(i,j), step} */
function sweepGrid(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150, step=o.step||190;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    gS.append("rect").attr("class","gcell")
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
  }
  (o.order||[]).forEach(function(ij,rank){
    var i=ij[0], j=ij[1],
        cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2,
        delay=fast()?0:rank*step;
    var rc=gS.append("rect").attr("class","gcell "+((o.cls&&o.cls(i,j))||"hl"))
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    var tx=gN.append("text").attr("class","slbl ink")
      .attr("x",cx).attr("y",cy+5).attr("text-anchor","middle")
      .text(o.val?o.val(i,j):"");
    if(fast())return;
    rc.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
    tx.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
  });
  return {x0:x0,y0:y0,cs:cs,
          cx:function(j){return x0+j*cs+(cs-4)/2;},
          cy:function(i){return y0+i*cs+(cs-4)/2;}};
}

/* ── reveal ──
   演示什么：一组元素之间的<b>因果或时间顺序</b>（先有这个，才有那个）。
   用于：信用分配里奖励回传的路径、推导步骤的先后。
   sel 是 d3 选择集，按数据顺序依次淡入，一次。 */
function reveal(sel,step){
  if(fast())return sel.attr("opacity",1);
  return sel.attr("opacity",0).transition().duration(340)
            .delay(function(d,i){return i*(step||240);}).attr("opacity",1);
}

    },"这是快速 RL 这一块的收尾，也是<b>全课证明最密的一小时</b>。  它做三件事。  <b>第一，把 PAC 和遗憾的差别说清</b>。这两个判据经常被并列提起，好像只是同一件事的两种度量。不是。它们的<b>参照系不同</b>：遗憾拿你和「从第一步起就最优、因而会走到的那些状态」比；PAC 只拿你和「<b>你自己走到的这个状态下</b>最好的动作」比。后者宽容得多——它问的是「在你所在的地方，你尽力了吗」。  <b>第二，给出证 PAC 的三条充分条件，并在板上真的证完其中一条</b>：MBIE-EB 的奖励加成 β/√n <b>够大</b>，足以让算出来的 Q 是乐观的。这个证明由三块组成——Hoeffding 偏差界、对 |S||A|m 次估计更新的并集界、以及沿值迭代扫的归纳——而它有一处精巧得值得单独看一集：<b>Hoeffding 指数里的 n 恰好被 β/√n 的 n 抵消掉</b>，这正是奖励加成要长成 1/√n 的全部理由。另外两条只给了梗概。  <b>第三，掉头承认理论的边界</b>。后验采样搬到 MDP 是干净的；但一进函数逼近，<b>计数就不泛化</b>了——两个从没有完全相同的状态，「访问过多少次」这个问题在连续状态空间里没有意义。伪计数、哈希计数、学到的嵌入都是在补这个洞。讲师的结论很坦白：<b>「we still haven't made sufficient progress in how to do exploration plus generalization」</b>。  这一讲的板书有多处 Q 与 V 混用，包括 PAC 定义本身——本片逐处修好。讲师也提前声明了：<b>「throughout today I'm going to be a little bit loose about constants」</b>。");
});

    },"这个错误模型有一个特别的来源：<b>讲师自己说了这句话，然后当场自我更正</b>。  说的是「PAC can give much smaller regret」，随即改口。改得对：<b>PAC 和遗憾是两个不同的量，它们的数值不能直接比大小</b>。说「PAC 给出更小的遗憾」就像说「摄氏度比公里少」。  她想说的是另一件事，而那件事是对的：<b>PAC 度量的「差多少」是局部的，因此通常比遗憾那个全局参照的差距要小</b>。  下一镜把「局部」和「全局」讲清楚。");
  /* 铺陈 */
  S(621,function(){

      note("遗憾：从第一步就最优",640,270,"b lg");
      note("会走到的那些状态",640,325,"sm lg");

      setCap("遗憾的基准是<b>一条你没走的路</b>；PAC 的基准是<b>你脚下这一步</b>。");
    },"把两个基准摆出来。  <b>遗憾</b>：拿你实际拿到的回报，和「<b>从第一步起就一直最优</b>」能拿到的回报比。注意后者不只是「每步选对动作」——最优策略会把你带到<b>完全不同的状态</b>去。所以遗憾隐含地把「你走错了路、落到一个糟糕的地方」这件事<b>也算在账上</b>。  <b>PAC</b>：拿你在<b>当前这个状态</b>选的动作，和「<b>这个状态下</b>最好的动作」比。它<b>不问你怎么走到这里的</b>。  一句话概括 PAC 的立场：<b>「在你所在的地方，尽力做到最好。」</b>  所以 PAC 明显更宽容。一个算法早期误入歧途、落到一个整体很差的区域，遗憾会一直为此收费；而 PAC 只要它在那个差区域里<b>还是选得不错</b>，就算它过关。");
  /* 主体 */
  S(633,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("ellipse").attr("class","cellbg r").attr("cx",520).attr("cy",300)
      .attr("rx",130).attr("ry",66).attr("opacity",0.34);
      note("差区域",520,306,"r");
      dots([[330,180]],"y",10);note("起点",330,158,"sm");
      dots([[1000,214]],"g",10);note("终点",1000,192,"sm");
      curve([[330,180],[520,168],[740,186],[1000,214]],"fit g");
      curve([[330,180],[430,262],[520,300],[700,286],[860,240],[1000,214]],"fit r");
      note("遗憾一直收费",760,318,"r");
      note("PAC 不追究",760,344,"sm");
      note("差别在「怎么走到这里的」",640,390,"y");
      setCap("差别只在一件事上显形：<b>你有没有因为早期的错落到坏地方</b>。");
    },"两个判据在什么时候会给出很不同的读数？  <b>只在一种情况下</b>：算法因为早期的错，落进了一个整体很差的区域，并且<b>出不来</b>。  这时遗憾<b>一直在收费</b>，因为基准是那条你没走的好路；而 PAC <b>不追究</b>，只要你在这个坏区域里选得还行。  反过来，什么时候两者接近？<b>回合制的设定</b>——每个回合都重置到固定的起点。那时「你自己走到的状态」和「最优策略会走到的状态」都从同一个地方出发，不会长期偏离，两个基准自然靠拢。  这解释了一个现象：<b>老虎机文献主要用遗憾，MDP 文献里 PAC 更常见</b>。老虎机只有一个状态，「走错路落到坏地方」这件事根本不存在，两个判据本来就重合；而在 MDP 里它们会真的分开，于是要选。");
  /* 反驳 */
  S(645,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline y").attr("d","M320,168L1000,168");

      note("跟当下最好比",900,268,"g");
      note("选哪个取决于要负什么责",640,390,"y");
      setCap("<b>指名反驳</b>：不是「谁的数更小」。是<b>拿你和谁比</b>。");
    },"指名回去：问「PAC 给的数是不是比遗憾小」这个问题本身就不成立，因为两者量的不是同一样东西。讲师自己也立刻改口了。  可以说的是：<b>PAC 的参照系是局部的，因此它的「差多少」通常比遗憾那个全局参照的要小</b>——但这是两把不同的尺子，不是同一把尺子上的两个读数。  选哪一个，和 L12 第七集是同一类判断：<b>看你要对什么负责</b>。  如果「走到了坏地方」这件事本身就是你的责任（比如一个会把系统带进不可逆状态的策略），<b>遗憾</b>才在问对的问题。 如果处境已经给定、你只能在当下做最好的选择（比如接手一个已经恶化的病人），<b>PAC</b> 才是对的尺子。  下一集看这个定义在板上是怎么写的——那里有一处<b>数学上不可能成立</b>的写法。");
  SUM(597,1,{h:"PAC 与遗憾的参照系不同：一个比全局，一个比当下",
    k:"<b>遗憾</b>的基准是「从第一步起就最优、因而会走到的那些状态」——把「走错路落到坏地方」也算在账上。<b>PAC</b> 只比「<b>你自己所在的状态</b>下最好的动作」，不问你怎么来的。",
    m:"差别只在一种情况下显形：<b>算法因早期的错落进坏区域且出不来</b>。遗憾一直收费，PAC 不追究。",
    w:"<s>误解</s>：「PAC 能给更小的遗憾」。讲师说了这句并<b>当场自我更正</b> —— 两个数不可直接比较，就像说「摄氏度比公里少」。",
    e:"<b>回合制</b>（每回合重置到固定起点）下两者靠近，因为两个基准从同一处出发。这也解释了为什么<b>老虎机主要用遗憾</b>（只有一个状态，两者本就重合），<b>MDP 里 PAC 更常见</b>。"});
  QUIZ(597,1,{t:"PAC 和遗憾这两个判据最本质的区别是什么？",
    o:["PAC 是高概率语句，遗憾是期望语句","<b>参照系不同：遗憾比的是「从头最优会走到的状态」，PAC 只比「你自己所在的状态下最好的动作」</b>","PAC 适用于有限时域，遗憾适用于无限时域","PAC 的数值总是小于遗憾"],
    a:1,
    w:"遗憾隐含地把「你走错路、落到一个糟糕的地方」也算在账上，因为它的基准是<b>一条你没走的路</b>；PAC <b>不问你怎么走到这里的</b>，只问「在你所在的地方，你尽力了吗」。所以 PAC 明显更宽容，而两者在<b>回合制</b>（每回合重置到固定起点）下会靠近。<s>「高概率 vs 期望」</s>是表述差异，不是本质 —— 遗憾也有高概率版本。<s>「有限/无限时域」</s>两个判据在两种设定下都有定义。<s>「数值总是更小」</s><b>两者不可直接比较</b>，讲师说了这句并当场自我更正。"});
});

KP("2 · 板上的 PAC 定义把 Q 和 V 混了 —— <b>Q* ≤ V* 恒成立</b>",function(){
  /* 钩子 */
  S(702,function(){
      clearScene();setBig(null);
      setEq("$$Q^*(s_t,a_t)\\ \\overset{?}{\\ge}\\ V^*(s_t)-\\varepsilon$$","top");
      note("板上是这么写的",640,300,"r lg");
      note("这个不等式没法当条件用",640,360,"y lg");
      setCap("PAC 定义写在板上是这个样子。<b>它作为一条要求是空的</b>。");
    },"PAC 定义写在板上是这样：算法选的动作，它的「真实最优 Q 值」不小于「这个状态下你能拿到的最好值」减 ε。  讲座的原话是：<b>「the Q value of that action, the true optimal Q value is greater than or equal to... the best possible you could have for that state, minus epsilon」</b>。  左边写的是 Q*，右边写的是 V*。  问题在于：<b>Q* 和 V* 之间有一个恒成立的关系，而它让这个不等式没法当作一条对算法的要求</b>。  下面两镜说清楚。");
  /* 错误答案 */
  S(714,function(){
      clearScene();setEq(null);
      setBig("Q* 可能超过 V*","某个动作特别好，就会顶出去");
      setCap("<b>不可能</b>。V* 就是所有 Q* 里的最大值 —— 按定义。");
    },"为什么这个不等式有问题？先把它背后的假设揭出来：要让「Q*(s,a) ≥ V*(s) − ε」成为一条<b>非平凡的</b>要求，必须存在 Q* 超过或接近 V* 的余地。  <b>没有这个余地。</b>  按定义，V*(s) = max_a Q*(s,a)。所以对<b>每一个</b>动作，<b>Q*(s,a) ≤ V*(s) 恒成立</b>，取等号当且仅当这个动作是最优的。  这不是近似的、通常成立的关系，是一个恒等式的直接推论。下一镜验一遍。");
  /* 铺陈 */
  S(726,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2],step:520,vals:[0.4544,0.1741,0.0000],
      x:380,y:410,w:520,h:150,max:0.55,
      label:function(i){return ["a1","a2","a3"][i];},
      cls:function(i){return i===2?"g":"r";},
      fmt:function(v){return v.toFixed(4);}});
      note("V*(s) − Q*(s,a)",640,452,"sm");
      setCap("差值<b>永不为负</b>；<b>恰好为零</b>的那一个，就是最优动作。");
    },"<b>看什么：</b>第三根柱子<b>高度为零</b> —— 那是最优动作，它的 Q* 就<b>等于</b> V*。另外两根是正的：次优动作的 Q* 严格<b>低于</b> V*。<b>没有一根是负的，也永远不会有</b>，因为 V* 按定义就是这些 Q* 的最大值。　—— 一个具体的例子。某个状态下三个动作的 V*(s) − Q*(s,a)：  a1 → <b>0.4544</b> a2 → <b>0.1741</b> a3 → <b>0.0000</b>  第三个恰好为零，它就是最优动作。  再做一次系统的检验：我生成了 <b>3000 个随机 MDP</b>，遍历它们的<b>所有</b>状态动作对，算 Q*(s,a) − V*(s) 的最大值：  <b>0.000e+00</b>  <b>一次都没有超过零。</b>这是定义的直接后果，不是巧合。  于是板上那条不等式塌掉了：对<b>最优</b>动作它自动成立（差值是 0，对任何 ε>0 都满足）；对<b>次优</b>动作，差值是 MDP 本身决定的固定数，和算法做了什么<b>毫无关系</b>。  <b>一条完全不约束算法的条件。</b>");
  /* 主体 */
  S(738,function(){
      clearScene();setBig(null);
      setEq("$$V^{A_t}(s_t)\\ \\ge\\ V^*(s_t)-\\varepsilon$$","top");
      note("算法当前策略的值",470,330,"g lg");
      note("这个状态的最优值",880,330,"b lg");
      setCap("修好：左边换成<b>算法自己策略</b>的值。这才是标准的 Kakade 式定义。");
    },"正确的写法是把左边换掉：不是「这个动作的最优 Q 值」，是<b>「算法当前策略的值」</b>。  <b>V^{A_t}(s_t) ≥ V*(s_t) − ε</b>  这才是标准的 Kakade 式 PAC 定义，而且现在它<b>真的在约束算法</b>：左边的 A_t 是<b>算法此刻的行为</b>，它可好可坏；要求它不比这个状态的最优值差过 ε。  对照一下修好前后：  <b>坏版本</b>的左边是 Q*——一个<b>只跟 MDP 有关</b>的量，算法改不动它。 <b>好版本</b>的左边是 V^{A_t}——一个<b>完全由算法决定</b>的量。  <b>判断一条「条件」是不是真的条件，看它左边那个量算法能不能改。</b>  再补完整个定义的其余部分：这条不等式要以概率至少 1−δ 成立，<b>除了 N 步之外的所有步</b>，而 N 是定义域参数的多项式。（讲座把 N 说成「多项式于 |S|、|A|、<b>γ</b>、ε、δ」——按 L12 第九集标过的，真正的依赖是 <b>1/(1−γ)</b>、1/ε、1/δ。）");
  /* 反驳 */
  S(750,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1],step:760,vals:[0.01,0.19],
      x:400,y:350,w:480,h:150,max:0.22,
      label:function(i){return ["(1−γ)²","1−γ²"][i];},
      cls:function(i){return i===0?"g":"r";},
      fmt:function(v){return v.toFixed(4);}});
      note("γ=0.9 时，差 19 倍",640,392,"sm");
      setCap("<b>指名反驳</b>：Q* 不可能超过 V*。顺带另一处：<b>是 (1−γ)²，不是 1−γ²</b>。");
    },"<b>看什么：</b>右边那根<b>高出近二十倍</b>。左边是正确的 (1−γ)²，右边是把口述读成 1−γ² 的结果。这两个量在分母上，差 19 倍意味着样本复杂度被<b>低估</b>了 19 倍 —— 而 γ 越接近 1 差得越多。　—— 指名回去：Q* 不可能超过 V*，所以板上那条不等式不构成对算法的约束。正确的左边是 <b>V^{A_t}(s_t)</b>——算法自己策略的值。  这一处还连着一个更普遍的记号问题：<b>这一讲从头到尾 V 和 Q 混用</b>。第三集那个「乐观」条件也是——左边写的是 V_t，却同时用 s_t 和 a_t 两个下标索引，<b>那显然是一个 Q</b>。而自动字幕把 V* 反复念成「B star」，更是雪上加霜。  <b>读这一讲的板书时，靠下标数目判断是 V 还是 Q，比靠字母可靠。</b>  最后标一处会造成数值错误的口误：样本复杂度里的分母被念成「epsilon times 1 minus gamma squared」。正确的是 <b>ε·(1−γ)²</b>——<b>(1−γ) 整体平方</b>，不是 1−γ²。  差多少：γ=0.9 时 <b>0.01 对 0.19</b>，19 倍；γ=0.99 时 <b>199 倍</b>；γ=0.999 时 <b>1999 倍</b>。这不是排版问题。  定义修好了。下一集看怎么证一个算法满足它。");
  SUM(702,2,{h:"板上的 PAC 定义把 Q 和 V 混了 —— Q* ≤ V* 恒成立",
    k:"按定义 <b>V*(s) = max_a Q*(s,a)</b>，所以 <b>Q*(s,a) ≤ V*(s) 恒成立</b>（3000 个随机 MDP 全部 (s,a)：max[Q*−V*] = <b>0.000e+00</b>）。于是板上那条不等式<b>不约束算法</b>。",
    m:"正确写法：<b>V^{A_t}(s_t) ≥ V*(s_t) − ε</b>（Kakade 式）。判据：<b>看左边那个量算法能不能改</b> —— Q* 改不动，V^{A_t} 由算法完全决定。",
    w:"<s>误解</s>：「某个动作特别好，Q* 会顶出 V*」。V* 就是所有 Q* 的最大值，没有余地。",
    e:"全讲 <b>V 与 Q 混用</b>（第三集的「乐观」条件写 V_t 却带 s_t、a_t 两个下标 —— 那是 Q；字幕还把 V* 念成「B star」）。<b>靠下标数目判断比靠字母可靠</b>。另：样本复杂度分母是 <b>ε(1−γ)²</b> 不是 ε(1−γ²) —— γ=0.9 差 19 倍，0.99 差 199 倍，0.999 差 1999 倍。"});
  QUIZ(702,2,{t:"为什么「Q*(s_t,a_t) ≥ V*(s_t) − ε」不能当作 PAC 的定义？",
    o:["因为 Q* 在连续状态空间里没有定义","<b>因为 Q* ≤ V* 恒成立且只与 MDP 有关 —— 这条不等式完全不约束算法在做什么</b>","因为 ε 应该出现在左边","因为它没有写出 1−δ 的高概率部分"],
    a:1,
    w:"<b>V*(s) = max_a Q*(s,a)</b>，所以 Q* 永远不超过 V*（3000 个随机 MDP 验证：max[Q*−V*] = 0.000e+00）。于是这条式子对<b>最优</b>动作自动成立，对<b>次优</b>动作则是 MDP 本身决定的固定差值 —— <b>和算法做了什么无关</b>。正确的是 <b>V^{A_t}(s_t) ≥ V*(s_t) − ε</b>：左边换成<b>算法自己策略</b>的值。判断一条条件是不是真条件，看<b>左边那个量算法能不能改</b>。<s>「连续空间没定义」</s>无关。<s>「ε 位置」</s>移到左边等价。<s>「没写 1−δ」</s>那部分讲座是写了的，不是这里的问题。"});
});

KP("3 · 三条充分条件，以及<b>为什么光有乐观不行</b>",function(){
  /* 钩子 */
  S(1290,function(){
      clearScene();setBig(null);setEq(null);
      var px=[300,560,820];
      for(var k=0;k<3;k++){
      E.gS.append("path").attr("class","axline").attr("d","M"+px[k]+",300L"+(px[k]+200)+",300");}
      var q1=[],q2=[];
      for(var i=0;i<=30;i++){var t=i/30;
      q1.push([300+t*200,262-24*t]);q2.push([300+t*200,286-16*t]);}
      curve(q1,"fit g");curve(q2,"fit sm");
      var v1=[],v2=[];
      for(var i=0;i<=30;i++){var t=i/30;
      v1.push([560+t*200,272-12*Math.sin(t*7)]);v2.push([560+t*200,272]);}
      curve(v2,"fit sm");curve(v1,"fit g");
      var c1=[];

      curve(c1,"fit g");
      note("乐观",400,336,"g");note("准确",660,336,"g");note("复杂度有界",920,336,"g");
      note("三条凑齐就是 PAC",640,390,"y");
      setCap("证一个算法是 PAC，有一个<b>三条充分条件</b>的模板。");
    },"怎么证一个算法是 PAC？这一讲给了一个模板——<b>三条充分条件</b>，凑齐就够：  <b>一、乐观</b>：算法算出来的值<b>不低估</b>真实的最优值。 <b>二、准确</b>：等你对某些状态动作对攒够了信息，算出来的值就得<b>真的接近</b>一个参照 MDP 上的值。 <b>三、学习复杂度有界</b>：算法重算值函数的<b>次数</b>有上限。  讲师说明了这个模板的来历：基本取自一篇论文，但<b>那篇论文并不分析 MBIE-EB</b>，所以细节要改。她自己的评价是：<b>「I found this paper super helpful when I was starting to do PAC proofs in my PhD」</b>。  这一集说清为什么是这三条——特别是<b>第二条为什么非有不可</b>。");
  /* 错误答案 */
  S(1302,function(){
      clearScene();setEq(null);
      setBig("乐观就够了","乐观保证你会去试，试遍了自然就学会了");
      setCap("<b>反例一句话</b>：把所有值设成超高、<b>永不更新</b> —— 乐观自动成立。");
    },"这个错误模型很有诱惑力，因为前两讲一直在讲乐观，而乐观确实解决了「会不会去试」这个问题。  讲师用一句话就把它打掉了：  <b>「optimism would be easy to hold by just setting our values super high and never updating.」</b>  把所有值设成超高，然后<b>永远不更新</b>。乐观条件<b>完美成立</b>——算出来的值永远不低估真值，因为它高得离谱。  而这个算法<b>什么也学不到</b>，永远在乱试。  <b>乐观是一个「不要过早放弃」的条件，它不包含任何「要收敛」的内容。</b>所以必须再加一条，专门管收敛。");
  /* 铺陈 */
  S(1314,function(){
      clearScene();setBig(null);setEq(null);
      note("乐观：别过早放弃",640,270,"g lg");
      note("准确：别永远不放弃",640,335,"v lg");
      note("一个推你去试，一个让你停",640,400,"y lg");
      setCap("两条<b>方向相反</b>：乐观管「去试」，准确管「<b>停下来</b>」。");
    },"第二条「准确性」的作用，讲师说得很清楚：  <b>「if something really is bad, you don't want to be really optimistic forever.」</b>  如果一个东西真的很差，你不该<b>永远</b>对它乐观。  于是两条条件的分工是<b>方向相反</b>的：  <b>乐观</b>：值不能低估 ⟹ 你不会<b>过早放弃</b>任何一个选项。 <b>准确</b>：攒够信息之后值要接近真值 ⟹ 你不会<b>永远不放弃</b>任何一个选项。  一个推着你去试，一个让你<b>停下来</b>。缺任何一个都不行——只有乐观就是永远乱试，只有准确就退化成贪心（L12 第三集那个确认偏误）。  准确性的精确陈述里有一个关键的细节，容易搞错：<b>算法算出来的值要接近的，不是真 MDP 上的值，也不是 V*</b>，而是<b>一个人为构造的混合 MDP 上、算法当前策略 π_t 的值</b>。这个混合 MDP 是什么，第六集专讲。  <b>这一条搞错，引入混合 MDP 的全部意义就没了。</b>");
  /* 主体 */
  S(1326,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline").attr("d","M320,330L1000,330");
      E.gS.append("path").attr("class","axline y").attr("d","M320,180L1000,180");
      note("最优",1020,184,"y");
      var a=[],b=[],c=[];
      for(var i=0;i<=40;i++){var t=i/40,x=320+t*680;
      a.push([x,300-104*Math.abs(Math.sin(t*7))]);
      b.push([x,286]);
      c.push([x,300-96*(1-Math.exp(-5*t))+18*Math.sin(t*13)]);}
      curve(a,"fit r");curve(b,"fit sm");curve(c,"fit y");
      note("只有乐观",1020,206,"r");note("永远乱试",1020,228,"r");
      note("只有准确",1020,282,"sm");note("卡在次优",1020,304,"sm");
      note("缺第三条",1020,244,"y");note("停不下来",1020,266,"y");
      note("每一条都在堵一个漏洞",640,390,"y");
      setCap("三条各堵一个漏洞。第三条堵的是「<b>会不会一直折腾下去</b>」。");
    },"第三条「学习复杂度有界」堵的是最后一个漏洞。  前两条加起来说的是：<b>该试的会去试，攒够了会停</b>。但它们没有说<b>要多久</b>。一个算法可以满足前两条，却无限地在「发现新信息 → 重算 → 又发现新信息」之间循环。  第三条要求：<b>算法重新跑乐观值迭代的次数有上限</b>。  这里要标一处容易误读的地方：条件里说的「Q 更新的总次数」指的是<b>算法因为模型变化而重跑一次乐观值迭代的次数</b>，<b>不是</b>一次值迭代内部的单个 Bellman 回退的次数。后者当然多得多，而且和这个条件无关。  三条凑齐，PAC 就出来了。而这三条各自要怎么证，难度完全不同：  <b>乐观</b>：这一讲在板上<b>完整证完</b>了（第四、五集）。 <b>准确</b>：只给了梗概（第六集）。 <b>学习复杂度</b>：也只给了梗概，但核心想法一句话就说得清（第七集）。");
  /* 反驳 */
  S(1338,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline").attr("d","M330,330L1000,330");
      E.gS.append("rect").attr("class","cellbg g").attr("x",330).attr("y",214)
      .attr("width",670).attr("height",34).attr("opacity",0.3);
      note("ε 带",1020,236,"g");
      var q=[];
      for(var i=0;i<=40;i++){var t=i/40;q.push([330+t*670,176+10*Math.sin(t*9)]);}
      curve(q,"fit r");
      note("Q_t 一直高着",1020,180,"r");
      note("永远不收敛",640,146,"r");
      note("缺一不可",640,390,"y");
      setCap("<b>指名反驳</b>：乐观<b>不够</b> —— 它不含任何「要收敛」的内容。");
    },"指名回去：乐观不够。它是一个纯粹的「<b>不要过早放弃</b>」条件，里面<b>没有任何</b>要求你收敛的内容——「把值设成超高、永不更新」就能满足它。  三条的分工可以这样记：  <b>乐观</b>：不会太早放弃。 <b>准确</b>：不会太晚放弃。 <b>学习复杂度有界</b>：折腾得完。  <b>缺一不可，而且三条互相不能替代。</b>  这个模板值得记住，因为它的形状在别的地方也出现：任何「边探索边优化」的算法要给保证，都要回答同样的三个问题——<b>会不会漏掉好的？会不会守着坏的？会不会没完没了？</b>  下面两集证第一条。而这个证明的第一步会做一件看上去很奇怪的事：<b>算法故意把数据扔掉。</b>");
  SUM(1290,3,{h:"三条充分条件：乐观 + 准确 + 学习复杂度有界",
    k:"<b>乐观</b>：算出来的值不低估。<b>准确</b>：攒够信息后值要接近<b>混合 MDP 上 π_t 的值</b>（不是真 MDP，也不是 V*）。<b>学习复杂度</b>：重跑乐观值迭代的次数有上限。",
    m:"<b>乐观不够</b>，一句话反例（讲师原话）：「setting our values super high and <b>never updating</b>」—— 乐观完美成立，而算法什么也学不到。",
    w:"<s>误解</s>：「乐观就够了，试遍了自然学会」。乐观里<b>不含任何「要收敛」的内容</b>。",
    e:"分工：<b>乐观 = 不会太早放弃；准确 = 不会太晚放弃；有界 = 折腾得完</b>。第三条里「Q 更新的次数」指<b>重跑值迭代的次数</b>，不是一次值迭代内部的 Bellman 回退数。"});
  QUIZ(1290,3,{t:"证 PAC 的三条充分条件里，为什么光有「乐观」不够？",
    o:["因为乐观在连续状态空间里无法验证","<b>因为把所有值设成超高且永不更新就满足乐观 —— 这个算法什么也学不到</b>","因为乐观只对确定性 MDP 成立","因为乐观需要知道 V*"],
    a:1,
    w:"讲师用一句话打掉它：<b>「optimism would be easy to hold by just setting our values super high and never updating」</b>。乐观是纯粹的「<b>不要过早放弃</b>」条件，不含任何收敛要求。所以要配上<b>准确性</b>（攒够信息后值要接近真值 —— 「if something really is bad, you don't want to be really optimistic forever」），以及<b>学习复杂度有界</b>（折腾得完）。三条分别对应：不会太早放弃 / 不会太晚放弃 / 有终点。<s>「连续空间」</s>这一段讨论的是表格 MDP。<s>「只对确定性」</s>事实错误。<s>「需要知道 V*」</s>V* 只出现在<b>分析</b>里，算法用不到。"});
});

KP("4 · 算法<b>故意扔掉</b>第 m 个之后的数据 —— 这不是笔误",function(){
  /* 钩子 */
  S(2033,function(){
      clearScene();setBig(null);setEq(null);
      note("只用前 m 个样本",640,290,"y lg");
      note("之后的全部扔掉",640,360,"r lg");
      setCap("算法里写着一条很奇怪的规定：每个 (s,a) <b>只用前 m 个样本</b>。");
    },"证明的第一步之前，先看算法里一条很奇怪的规定。  MBIE-EB 规定：对每一个状态动作对，<b>只用前 m 个样本</b>来更新经验模型 R̂ 和 T̂。  讲座原话：<b>「After that we're gonna throw away our data.」</b>  第 m+1 次访问同一个 (s,a)，拿到的奖励和转移<b>直接丢弃</b>，模型不再更新。  这看上去像一个 bug。这一集说明它<b>不是</b>——以及它是被什么逼出来的。");
  /* 错误答案 */
  S(2045,function(){
      clearScene();setEq(null);
      setBig("这肯定是笔误","哪有算法嫌数据多的");
      setCap("讲师自己点破了这有多反常 —— 然后说明<b>为什么非这样不可</b>。");
    },"这个反应完全正当，而且讲师自己先说了出来。  她引了 Tom Mitchell——机器学习的奠基者之一——对整个领域的定义：机器学习研究的是一个智能体<b>如何学习</b>，以及如何设计出<b>能随着数据增多而持续改进</b>的算法。  <b>而这个算法恰恰相反：它到了 m 就停止改进。</b>  讲师把这个反讽摆出来是对的，因为它提醒了一件重要的事：  <b>这不是这个算法的优点，是为了拿到证明付的代价。</b>  代价从哪来？下一镜。");
  /* 铺陈 */
  S(2057,function(){
      clearScene();setBig(null);setEq(null);
      note("并集界要覆盖每一次估计更新",640,280,"y lg");
      note("所以更新次数必须有限",640,345,"r lg");
      note("于是每个 (s,a) 封顶 m",640,410,"g lg");
      setCap("<b>并集界逼出来的</b>：要盖住所有更新，更新次数就不能是无穷。");
    },"原因在并集界上。  证明需要的是：<b>所有</b>状态动作对的<b>所有</b>估计，<b>同时</b>都落在置信范围内。这是 L11 第八集那一套，换了个场合。  并集界把每次估计的失败概率<b>相加</b>。所以要让总失败概率有界，<b>估计更新的次数必须是有限的</b>。  如果算法永远更新下去，更新次数是无穷，并集界给出的总失败概率上界就是<b>无穷</b>——等于什么都没说。  于是只能封顶：每个 (s,a) 最多更新 m 次，总更新次数 ≤ <b>|S|·|A|·m</b>，一个有限的数。  <b>这不是算法设计上的选择，是证明技术的硬约束。</b>  对照 L11 第八集那个更聪明的处理：那里没有封顶，而是让每一步的<b>失败预算按 1/t² 衰减</b>，靠 Basel 和收敛。这里为什么不那么做？因为那里的对象是<b>一维的臂均值</b>，而这里要同时控制转移模型和奖励模型，构造要复杂得多。<b>封顶是更粗但更省事的办法。</b>");
  /* 主体 */
  S(2069,function(){
      clearScene();setBig(null);setEq(null);
      saGrid({y:160,sLab:1,aLab:1,
      fill:function(i,j){return Math.min(1,0.18+((i*7+j*3)%11)/11);},
      bar:function(i,j){return ((i*7+j*3)%11)>8?"g":"y";}});
      note("每格封顶 m=100",640,306,"sm");
      note("10 × 4 × 100 = 4000",640,340,"g");
      note("|S|·|A|·m",640,390,"y");
      setCap("预算 = <b>|S|·|A|·m</b>。有限，所以失败概率加得起来。");
    },"把预算算出来。  |S|=10、|A|=4、m=100 → 总更新次数上限 <b>4000</b>。 |S|=100、|A|=10、m=1000 → <b>1000000</b>。  数字本身不重要，重要的是它<b>有限</b>。有限就能被并集界吃掉。  下一集会看到 β 正是按这个预算倒推出来的：让<b>每一次</b>更新的失败概率恰好是 δ/(2|S||A|m)，乘以双侧、乘以 |S||A|m 次，总失败概率<b>精确等于 δ</b>。  所以 m 在这个证明里同时出现在三个地方，而且是同一个 m：  <b>算法里</b>：每个 (s,a) 用几个样本。 <b>预算里</b>：|S||A|m 次更新。 <b>β 里</b>：log(2|S||A|m/δ)。  （顺带标一处：字幕把 β 公式里的这个 m 写成了大写 <b>M</b>，容易被读成「一个 MDP」。它就是这个<b>样本上限 m</b>。）");
  /* 反驳 */
  S(2081,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline").attr("d","M300,280L1010,280");
      for(var k=0;k<30;k++){
      var x=310+k*23, keep=k<14;
      E.gS.append("path").attr("class","axline "+(keep?"g":"sm"))
      .attr("opacity",keep?1:0.4).attr("d","M"+x+",256L"+x+",280");
      if(!keep)E.gS.append("path").attr("class","axline r").attr("opacity",0.5)
      .attr("d","M"+(x-7)+",262L"+(x+7)+",274");}
      E.gS.append("path").attr("class","axline y").attr("d","M632,226L632,300");
      note("第 m 个",632,216,"y");
      note("这些进模型",420,320,"g");
      note("第 m 个之后全扔",860,320,"r");
      note("实践中不会这么做",640,390,"y");
      setCap("<b>指名反驳</b>：不是笔误。但也<b>不是优点</b> —— 是为了拿到定理付的价。");
    },"指名回去：扔数据不是笔误，是并集界逼出来的硬约束。  但同样重要的是反过来说一遍：<b>它也不是优点</b>。  实践中没人会这么做——你当然应该用上所有数据，多出来的样本只会让估计更准，绝不会更差。<b>扔掉它们纯粹是为了让证明能写下去。</b>  这个区分值得记住，它和 L10 第九集那个是同一类：<b>看一个算法的时候，要能分清哪些成分是任务需要的，哪些成分只是为了证明方便</b>。  判断方法也很简单：<b>问一句「去掉这一条，算法会变差吗」</b>。去掉扔数据这一条，算法只会变好——所以它显然不是为性能服务的。  还有一个实用推论：如果你在读一篇论文，看到一个「反常识」的算法细节，先别急着认为作者有洞见。<b>先查一下它是不是被某个证明步骤逼出来的。</b>很多时候是。  下一集开始真正的证明。");
  SUM(2033,4,{h:"算法故意扔掉第 m 个之后的数据 —— 并集界逼的",
    k:"并集界把每次估计的失败概率<b>相加</b>，所以更新次数<b>必须有限</b>。于是每个 (s,a) 封顶 m 次，总预算 <b>|S|·|A|·m</b>（10×4×100 = 4000）。",
    m:"m 在证明里出现三次且是同一个：<b>算法里</b>（用几个样本）、<b>预算里</b>（|S||A|m 次更新）、<b>β 里</b>（log(2|S||A|m/δ)）。字幕把它写成大写 M，容易读成「一个 MDP」。",
    w:"<s>误解</s>：「这肯定是笔误」。不是笔误 —— <b>但也不是优点</b>。讲师自己引 Tom Mitchell：机器学习的要义是设计<b>能随数据增多而持续改进</b>的算法，而它到 m 就停。",
    e:"对照 L11 第八集：那里不封顶，靠<b>失败预算按 1/t² 衰减</b>（Basel 和收敛）。这里要同时控转移与奖励两个模型，<b>封顶更粗但更省事</b>。判断法：<b>去掉这一条算法会变差吗？</b>不会 ⟹ 它不为性能服务。"});
  QUIZ(2033,4,{t:"MBIE-EB 为什么规定每个 (s,a) 只用前 m 个样本？",
    o:["为了限制内存占用","<b>因为并集界要求估计更新的总次数有限，否则总失败概率的上界是无穷</b>","因为后期样本的分布会漂移，不再可靠","为了让算法忘掉早期的坏策略产生的数据"],
    a:1,
    w:"证明需要<b>所有</b> (s,a) 的<b>所有</b>估计<b>同时</b>落在置信范围内，而并集界把失败概率<b>相加</b> —— 更新次数无穷则总上界无穷，等于什么都没说。封顶后总预算是 <b>|S||A|m</b>，有限，β 正是按它倒推的。<b>这是证明技术的硬约束，不是算法优点</b>：实践中当然该用上所有数据。判断法：去掉这一条算法只会<b>变好</b>。<s>「内存」</s>不是理由。<s>「分布漂移」</s>不成立 —— 这里的 (s,a) 的奖励与转移分布是<b>固定</b>的。<s>「忘掉坏数据」</s>模型估计与策略好坏无关，样本都是有效的。"});
});

KP("5 · 乐观归纳证明：Hoeffding 里的 <b>n 恰好抵消</b>",function(){
  /* 钩子 */
  S(2297,function(){
      clearScene();setBig(null);
      setEq("$$\\tilde{R}(s,a)=\\hat{R}(s,a)+\\frac{\\beta}{\\sqrt{n}}$$","top");
      note("要证这个加成「够大」",640,330,"y lg");
      setCap("三条条件里的第一条：证明 <b>β/√n 大到足以让算出的 Q 乐观</b>。");
    },"现在证第一条条件：<b>乐观</b>。  要证的是：MBIE-EB 给奖励加的那个 β/√n，<b>大到足以补偿经验模型的误差</b>，使得算出来的 Q 值<b>不低估</b>真实的最优 Q。  证明由三块拼成：  <b>Hoeffding 偏差界</b>——控制单次估计的误差。 <b>并集界</b>——让所有 |S||A|m 次估计同时成立（上一集那个预算）。 <b>归纳</b>——沿值迭代的每一次扫推下去。  这一集看第一块，因为它里面有一处<b>非常精巧</b>的事情发生。");
  /* 错误答案 */
  S(2309,function(){
      clearScene();setEq(null);
      setBig("1/√n 是挑出来的","衰减快慢调一调就行");
      setCap("<b>不是挑的</b>。换成别的幂次，Hoeffding 里的 n <b>就不会抵消</b>。");
    },"很自然的印象是：奖励加成要随访问次数衰减，1/√n 是一个合理的选择，1/n 或 1/n^0.4 也可以，调一调看哪个好用。  <b>不是这样。</b>  <b>1/√n 是被 Hoeffding 唯一地逼出来的</b>——换成任何别的幂次，证明的关键一步就断掉。  断在哪里、为什么，下一镜。这是这个证明里最漂亮的一处，而且它只需要一行代数。");
  /* 铺陈 */
  S(2321,function(){
      clearScene();setBig(null);
      setEq("$$P\\big(|\\bar{X}-\\mathbb{E}X|\\ge t\\big)\\le 2\\exp\\!\\Big(\\!-\\frac{2nt^2}{R^2}\\Big),\\qquad R=\\frac{1}{1-\\gamma}$$","top");
      note("取值范围宽度",880,340,"v lg");
      note("这个前提讲座没念出来",640,400,"r lg");
      setCap("Hoeffding 的一般形式。这里被平均的量落在<b>宽度 1/(1−γ)</b> 的范围里。");
    },"先把 Hoeffding 写成带取值范围的一般形式：n 个独立同分布、落在宽度 R 的区间里的量，它们的均值偏离期望 t 以上的概率不超过 2exp(−2nt²/R²)。  这里被平均的是什么？是用<b>真实的 V*</b> 构造的 Bellman 目标——也就是 R(s,a) + γV*(s′)。  <b>它的取值范围宽度是多少？</b>  如果奖励落在 [0,1]，那么 V* 落在 [0, 1/(1−γ)]，于是这个目标的取值范围宽度是 <b>R = 1/(1−γ)</b>。  <b>「奖励落在 [0,1]」这个前提讲座从头到尾没有念出来</b>，但后面那个指数完全依赖它。补上它，下一镜的代数才成立。  （顺带标一处：这里的下标 i 用来数样本 X_i，而归纳那一段的下标 i 数的是<b>值迭代的扫次</b>。<b>同一个字母，两个完全不同的计数器。</b>）");
  /* 主体 */
  S(2333,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3],step:420,vals:[0.18,0.18,0.18,0.18],
      x:330,y:350,w:620,h:150,max:0.24,
      label:function(i){return ["n=1","10","10³","10⁵"][i];},
      cls:function(i){return "g";},
      fmt:function(v){return v.toFixed(4);}});
      note("|Hoeffding 指数|",640,392,"sm");
      setCap("代入 t = β/√n：<b>n 精确地约掉</b>。四个 n 差十万倍，指数完全相同。");
    },"<b>看什么：</b>四根柱子<b>一模一样高</b> —— 这不是画错了。n 从 <b>1</b> 到 <b>100000</b>，相差十万倍，而 Hoeffding 指数<b>完全不变</b>，都是 0.1800。<b>这就是奖励加成必须长成 β/√n 的全部理由</b>：只有这个幂次能让 n 从指数里彻底消失。　—— 现在做那一行代数。把偏差取成 <b>t = β/√n</b>，代进 Hoeffding 的指数：  −2n·t²/R² = −2n·(β²/n)·(1−γ)² = <b>−2β²(1−γ)²</b>  <b>n 精确地约掉了。</b>  我数值验了一遍（β=3、γ=0.9）：  n=1 → 指数 <b>−0.1800000000</b> n=10 → <b>−0.1800000000</b> n=10³ → <b>−0.1800000000</b> n=10⁵ → <b>−0.1800000000</b>  <b>一位都不差。</b>  这就是为什么加成必须是 <b>1/√n</b>：只有<b>这一个</b>幂次能让 n 从指数里消失。换成 1/n，指数会变成 −2β²(1−γ)²/n，随 n 增大而<b>趋于零</b>——失败概率趋于 1，界作废。换成 1/n^0.25，指数会随 n <b>发散</b>，界是成立了但松到毫无意义。  <b>1/√n 是唯一让失败概率「与访问次数无关」的选择。</b>而「与 n 无关」正是并集界需要的——每一次更新都用同一个失败预算。  （标一处字幕：这个指数被念成「exponential minus 2 beta squared, 1 minus gamma squared」。念的是对的，但<b>只有在补上「奖励在 [0,1]」这个前提</b>之后才对。）");
  /* 反驳 */
  S(2345,function(){
      clearScene();setBig(null);
      setEq("$$\\beta=\\frac{1}{1-\\gamma}\\sqrt{\\tfrac12\\ln\\frac{2|S||A|m}{\\delta}}\\ \\Longrightarrow\\ e^{-2\\beta^2(1-\\gamma)^2}=\\frac{\\delta}{2|S||A|m}$$","top");
      note("双侧 × |S||A|m 次 = δ",640,340,"g lg");
      setCap("<b>指名反驳</b>：1/√n 不是挑的。β 也不是 —— 它是从<b>总预算 δ</b> 倒推的。");
    },"指名回去：1/√n 不是挑出来的，它是 Hoeffding 唯一允许的幂次。  <b>而 β 也不是挑出来的。</b>把上一集那个预算接进来，整条公式就是倒推出来的：  <b>要求</b>：总失败概率 = δ。 <b>手上有</b>：|S||A|m 次更新，每次双侧。 <b>所以</b>：每次单侧的失败概率必须是 δ/(2|S||A|m)。 <b>令</b> exp(−2β²(1−γ)²) = δ/(2|S||A|m)，解出 β = (1/(1−γ))·√(½·ln(2|S||A|m/δ))。  我验了一遍这条链是不是真的闭合：取 |S|=10、|A|=4、m=100、δ=0.05、γ=0.9，β = <b>24.4775</b>；代回 exp(−2β²(1−γ)²) = <b>6.250000×10⁻⁶</b>，而 δ/(2|S||A|m) = <b>6.250000×10⁻⁶</b>——<b>相等到机器精度</b>；再乘双侧、乘 4000 次更新，总失败率 = <b>0.050000</b>，<b>精确等于 δ</b>。  <b>整个 β 里没有一个数是自由的。</b>1/(1−γ) 来自取值范围，½ 和根号来自 Hoeffding 反解，log 里的 2|S||A|m/δ 来自并集界的预算。  这和 L11 第六集是同一个手法：<b>先定失败预算，再反解半径</b>。剩下的归纳部分把这个单点的界沿值迭代的每一次扫推下去，从 1/(1−γ) 的乐观初始化开始——那一步是标准的，本片不单开一集。  第一条条件证完了。下一集看第二条要跟谁比。");
  SUM(2297,5,{h:"乐观归纳证明：Hoeffding 里的 n 恰好被 β/√n 抵消",
    k:"取偏差 t = β/√n 代进 exp(−2nt²/R²)（R = 1/(1−γ)）：<b>−2n·(β²/n)·(1−γ)² = −2β²(1−γ)²</b>，<b>n 精确约掉</b>。实测 n 从 1 到 10⁵ 指数恒为 −0.1800000000。",
    m:"所以 1/√n <b>是唯一选择</b>：换 1/n 指数随 n 趋零（界作废），换 1/n^0.25 会发散（界松到无意义）。<b>只有它让失败概率与访问次数无关</b> —— 并集界正需要这一条。",
    w:"<s>误解</s>：「1/√n 是挑出来的，幂次可调」。它是 Hoeffding 唯一允许的幂次。<b>β 也不是挑的</b>，是从总预算 δ 倒推的。",
    e:"<b>讲座没念出的前提</b>：奖励落在 [0,1]，于是 Bellman 目标的取值范围宽度是 1/(1−γ)。<b>闭合验证</b>：β=24.4775 → exp(−2β²(1−γ)²) = 6.25×10⁻⁶ = δ/(2|S||A|m)，×2×4000 = <b>0.050000 = δ</b>。"});
  QUIZ(2297,5,{t:"为什么 MBIE-EB 的奖励加成必须是 β/√n 这个形状？",
    o:["因为 1/√n 是样本均值标准误的衰减率，最自然","<b>因为只有这个幂次能让 Hoeffding 指数里的 n 精确约掉，使每次更新的失败概率与访问次数无关</b>","因为 √n 计算最便宜","因为 1/√n 恰好等于 Beta 后验的标准差"],
    a:1,
    w:"把 t = β/√n 代进 exp(−2nt²/R²)：<b>−2n·(β²/n)·(1−γ)² = −2β²(1−γ)²</b>，<b>n 消失</b>（实测 n 从 1 到 10⁵ 指数恒为 −0.18）。这正是并集界需要的：每一次更新用<b>同一个</b>失败预算 δ/(2|S||A|m)，加起来才精确等于 δ。换 1/n 指数会随 n <b>趋零</b>（失败概率趋于 1，界作废）；换 1/n^0.25 指数<b>发散</b>（界成立但松到无意义）。<s>「最自然」</s>方向对但不是<b>理由</b> —— 理由是抵消。<s>「计算便宜」</s>不是考量。<s>「等于 Beta 后验标准差」</s>无关，这里是频率派论证。"});
});

KP("6 · 两个混合 MDP：<b>M̂ 与 M̃ 只差奖励</b>，M′ 只在已知集上换",function(){
  /* 钩子 */
  S(3225,function(){
      clearScene();setBig(null);setEq(null);
      note("准确性条件：值要接近",640,280,"y lg");
      note("接近谁？",640,350,"r lg");
      setCap("第二条条件说「算出来的值要够接近」。<b>接近谁</b>，是这一集全部的内容。");
    },"第二条条件「准确性」说：等你对某些状态动作对攒够了信息，算出来的值就得<b>够接近</b>。  接近谁？  这个问题听上去像细节，其实是整条证明的关键分岔。<b>选错参照对象，引入混合 MDP 的全部意义就没了。</b>  这一集把这些人造的 MDP 理清楚——一共三个，而它们之间的差别比名字看上去要小得多。");
  /* 错误答案 */
  S(3237,function(){
      clearScene();setEq(null);
      setBig("跟真 MDP 比","不然还能跟谁比");
      setCap("跟真 MDP 比<b>做不到</b> —— 没探索过的地方，你对它一无所知。");
    },"最自然的答案是：算出来的值要接近它在<b>真 MDP</b> 上的值，或者接近 V*。  <b>两个都做不到。</b>  道理很直接：算法只在<b>访问够多次</b>的状态动作对上有可靠的估计。对那些只去过一两次的地方，它对真 MDP <b>一无所知</b>——凭什么要求算出来的值接近真值？  而且这个要求<b>也不该成立</b>：在没探索过的地方，算法<b>应该</b>保持乐观（第三集那条条件），也就是<b>应该</b>高估。要求它准确，恰好和乐观冲突。  所以参照对象必须是一个<b>介于两者之间</b>的东西：在熟悉的地方像真 MDP，在陌生的地方像乐观模型。  <b>这样的东西现实中不存在。所以就造一个。</b>");
  /* 铺陈 */
  S(3249,function(){
      clearScene();setBig(null);setEq(null);
      function chain(x0,y0,cls,rlab){
      for(var k=0;k<3;k++){
      E.gS.append("circle").attr("class","tnode "+(k===1?cls:"")).attr("cx",x0+k*104)
      .attr("cy",y0).attr("r",17);
      if(k<2)E.gS.append("path").attr("class","tedge").attr("d","M"+(x0+k*104+17)+","+y0+"L"+(x0+(k+1)*104-17)+","+y0);}
      note(rlab,x0+104,y0+44,cls);}
      chain(330,214,"sm","R̂(s,a)");
      chain(760,214,"g","R̂ + β/√n");
      note("M̂",330,178,"sm");note("M̃",760,178,"g");
      note("同一个 T̂",640,290,"sm");
      note("名字像，差别只在奖励",640,390,"y");
      setCap("先分清两个：<b>M̂ 与 M̃ 共用同一个转移模型，只差那个奖励加成</b>。");
    },"先分清两个最容易混的。  <b>M̂</b>（M-hat）：<b>纯经验模型</b>。用计数拟合出来的 T̂ 和 R̂，没有别的。 <b>M̃</b>（M-tilde）：<b>经验模型加奖励加成</b>。转移还是 T̂，奖励是 R̂ + β/√n。  <b>关键：两者用的是同一个转移模型 T̂，唯一的差别在奖励。</b>  这一处非记不可，因为 M-hat 和 M-tilde 在英语里<b>近乎同音</b>，自动字幕把它们调换过好几次。<b>课上就有学生专门举手问这两个是不是一回事。</b>  记法可以这样：<b>带波浪的那个多了一项</b>（波浪像加上去的一笔）；而无论哪个，<b>转移模型都是同一个 T̂</b>。  还有一处名字要分清：<b>MBIE</b> 和 <b>MBIE-EB</b> 在讲座里被混着用了。只有 <b>MBIE-EB</b>（带 β/√n 加成项那个）是上一集那个乐观证明真正分析的对象；<b>不带 EB 的 MBIE 用的是模型上的置信集</b>，是另一套东西。");
  /* 主体 */
  S(3261,function(){
      clearScene();setBig(null);setEq(null);
      saGrid({y:164,
      cls:function(i,j){return ((i*3+j)%7<3)?"hl":"";},
      fill:function(i,j){return ((i*3+j)%7<3)?0.9:0.22;},
      bar:function(i,j){return ((i*3+j)%7<3)?"g":"r";}});
      note("已知集：用真模型",430,310,"g");
      note("其余：用 M̃",880,310,"r");
      note("现实里不存在，只是分析工具",640,390,"y");
      setCap("第三个：<b>M′</b> —— 在<b>已知</b>的 (s,a) 上用<b>真</b>模型，其余用 M̃。");
    },"第三个 MDP 是 <b>M′</b>，它就是那个「介于两者之间」的东西：  <b>对已知集里的 (s,a)</b>（访问够 m 次、估计可靠的那些）：用<b>真实</b>的 R 和 T。 <b>对其余的 (s,a)</b>：用 <b>M̃</b> 的模型（经验转移 + 带加成的奖励）。  讲师明确说了这东西的性质：<b>「Again, this doesn't exist in the real world we're just gonna use it as a tool for our analysis.」</b>——现实中不存在，纯粹是分析工具。  于是准确性条件的正确陈述是：<b>算法算出来的值，要接近「算法当前策略 π_t 在 M′ 上的值」</b>——<b>不是</b> V*，<b>不是</b>真 MDP 上的值。  为什么这样构造刚好合用？因为它把两种情形都摆平了：  <b>在熟悉的地方</b>，M′ 用的是真模型，所以「接近 M′ 上的值」就意味着「接近真值」——准确性起作用了。 <b>在陌生的地方</b>，M′ 用的是乐观模型，所以「接近 M′ 上的值」允许算法保持高估——不和乐观冲突。  把 M′ 上的值和真 MDP 上的值联系起来，靠的是 <b>simulation lemma</b>（模拟引理）：<b>两个 MDP 的模型接近，则同一策略在两者上的值也接近</b>。讲座提了这个名字但没展开。");
  /* 反驳 */
  S(3273,function(){
      clearScene();setBig(null);setEq(null);
      vLadder([{y:190,label:"V* 真 MDP",cls:"y"},
      {y:250,label:"V^π_t 在 M′",cls:"g"},
      {y:308,label:"V^π_t 真实",cls:"sm"}],360,900);
      E.gS.append("path").attr("class","axline g").attr("d","M330,250L330,308");
      E.gS.append("path").attr("class","axline g").attr("d","M322,250L338,250");
      E.gS.append("path").attr("class","axline g").attr("d","M322,308L338,308");
      note("比这一对",250,282,"g");
      note("不是 V*，不是真 MDP",640,390,"y");
      setCap("<b>指名反驳</b>：不跟真 MDP 比。跟 <b>π_t 在 M′ 上的值</b>比。");
    },"指名回去：准确性不是拿算出来的值和真 MDP 比，也不是和 V* 比。是和<b>算法当前策略 π_t 在混合 MDP M′ 上的值</b>比。  把三个人造 MDP 收在一起：  <b>M̂</b>：经验模型。 <b>M̃</b>：经验模型 + 奖励加成（<b>与 M̂ 共用 T̂，只差奖励</b>）。 <b>M′</b>：已知集上用真模型，其余用 M̃。  这个构造的手法本身值得记住，它在理论工作里很常见：<b>当你要比较的两个对象差太远、没法直接比时，造一个「中间体」，让每一边只跟它比一次</b>。M′ 就是这么用的——一边连着算法算出来的值，另一边通过模拟引理连着真 MDP。  最后提醒一处适用范围：<b>这一整套机器（M′、M̂′、已知集 K）在 Sutton & Barto 里完全没有</b>。从教科书过来的读者会发现这一段没有任何可对照的记号，这不是你漏读了，是它真的不在里面。  第二条条件的梗概到此。下一集是第三条，而它的核心只是一个鸽笼原理。");
  SUM(3225,6,{h:"三个人造 MDP：M̂ 与 M̃ 只差奖励，M′ 只在已知集上换",
    k:"<b>M̂</b> = 经验模型（T̂, R̂）。<b>M̃</b> = 经验模型 + 奖励加成（<b>共用同一个 T̂</b>，唯一差别在奖励）。<b>M′</b> = 已知集上用<b>真</b> R、T，其余用 M̃。",
    m:"准确性比的是「<b>π_t 在 M′ 上的值</b>」，<b>不是</b> V*、<b>不是</b>真 MDP。这样构造才不与乐观冲突：熟悉处 M′ 是真模型（准确起作用），陌生处是乐观模型（允许高估）。",
    w:"<s>误解</s>：「跟真 MDP 比」。没探索过的地方你对真 MDP 一无所知，而且那里<b>本来就该</b>高估（乐观条件），要求准确会和乐观直接冲突。",
    e:"<b>M-hat 与 M-tilde 近乎同音</b>，字幕调换过，课上有学生专门问。另：<b>MBIE 与 MBIE-EB 被混用</b> —— 只有带 β/√n 的 MBIE-EB 是乐观证明的对象。连接 M′ 与真 MDP 靠 <b>simulation lemma</b>。这套机器 <b>S&B 没有</b>。"});
  QUIZ(3225,6,{t:"M̂（M-hat）和 M̃（M-tilde）的区别是什么？",
    o:["M̂ 用经验转移，M̃ 用真实转移","<b>两者共用同一个经验转移模型 T̂，唯一的差别是 M̃ 的奖励多了 β/√n 的加成</b>","M̂ 是已知集上的模型，M̃ 是未知集上的模型","M̂ 用于规划，M̃ 用于评估"],
    a:1,
    w:"<b>转移模型是同一个 T̂</b>，差别<b>只在奖励</b>：M̂ 用 R̂，M̃ 用 R̂ + β/√n。这一处必须记牢，因为 M-hat 与 M-tilde 近乎同音、字幕调换过，课上有学生专门举手问。<s>「M̃ 用真实转移」</s>算法根本不知道真实转移。<s>「已知集 / 未知集」</s>那是第三个 MDP <b>M′</b> 的构造 —— 它在已知集上用<b>真</b>模型、其余用 M̃。<s>「规划 vs 评估」</s>不是它们的区别。"});
});

KP("7 · 学习复杂度有界：<b>鸽笼二分法</b>",function(){
  /* 钩子 */
  S(3503,function(){
      clearScene();setBig(null);setEq(null);
      note("第三条：折腾得完",640,290,"y lg");
      note("犯大错的次数有上限",640,360,"sm lg");
      setCap("最后一条条件：算法犯「大于 ε 的错」的<b>次数</b>要有上限。");
    },"最后一条条件：<b>学习复杂度有界</b>。  要证的是：算法选出「比最优差过 ε 的动作」的<b>次数</b>，有一个上限——而且这个上限是定义域参数的多项式。  注意这正是 PAC 定义里的那个 N。所以这一条不是辅助条件，它<b>就是</b>要证的结论的一半。  而它的核心只是一个中学就学过的原理。");
  /* 错误答案 */
  S(3515,function(){
      clearScene();setEq(null);
      setBig("得先证它会收敛","证明次数有限，总要先有个收敛性吧");
      setCap("<b>不用</b>。二分法只需要<b>穷尽两种情形</b>，两边各自成立就够。");
    },"很自然的想法是：要说「犯大错的次数有限」，得先证明算法会收敛到某个东西，然后再数收敛之前犯了多少错。  <b>不需要。</b>  这个论证完全不谈收敛。它做的是：把每一个时刻<b>分成两类</b>，然后证明<b>两类各自都没问题</b>——第一类不犯大错，第二类次数有限。  两类合起来覆盖所有时刻，结论就出来了。  <b>这是一个穷尽式论证，不是一个收敛性论证。</b>下面两镜看这两类怎么分。");
  /* 铺陈 */
  S(3527,function(){
      clearScene();setBig(null);setEq(null);
      note("把经验流切成若干段",640,270,"sm lg");
      note("每段问一句：",640,330,"y lg");
      note("会不会碰到没探明的 (s,a)",640,395,"g lg");
      setCap("切成段，每段只问一个问题：<b>这一段里会不会走到陌生的地方</b>。");
    },"把经验流切成若干段（讲座说不必是回合制 MDP，但按回合想最容易）。  对每一段，只问一个问题：  <b>在接下来的 T 步里，走到一个「未知」状态动作对的概率有多大？</b>  这里「未知」的意思很具体：<b>访问次数还没到让估计可靠的程度</b>——讲座的说法是「我们只去过一次之类的」。访问够了的那些构成<b>已知集</b>。  注意这个概率是<b>算法当前策略在真实环境里</b>的一个量，我们不需要算出它，只需要按它的大小<b>分两种情形</b>。  讲座管这个叫<b>逃逸概率</b>的想法，而整个论证就是对它做二分。");
  /* 主体 */
  S(3539,function(){
      clearScene();setBig(null);setEq(null);
      saGrid({y:164,
      cls:function(i,j){return (j<6)?"hl":"";},
      fill:function(i,j){return (j<6)?0.85:0.2;},
      bar:function(i,j){return (j<6)?"g":"r";}});
      var pth=[[1,0],[1,1],[2,2],[2,3],[1,4],[0,5]];
      for(var k=0;k<pth.length;k++){
      var x=330+pth[k][1]*32+13,y=164+pth[k][0]*32+13;
      dots([[x,y]],"y",6);
      if(k)E.gS.append("path").attr("class","tedge hl")
      .attr("d","M"+(330+pth[k-1][1]*32+13)+","+(164+pth[k-1][0]*32+13)+"L"+x+","+y);}
      note("基本待在已知区",470,310,"g");
      note("情形一",640,390,"y");
      setCap("<b>情形一</b>：逃逸概率小 ⟹ 你基本待在已知区 ⟹ 估计准 ⟹ <b>近最优</b>。");
    },"<b>情形一：逃逸概率小。</b>  那么这一段里你基本上一直待在<b>已知集</b>内。而已知集的定义就是「估计已经可靠」，所以你在那里算出来的值是准的（第六集那条准确性条件，M′ 在已知集上用的正是真模型）。  值准 ⟹ 按它贪心选出来的动作就是近最优的 ⟹ <b>不犯大于 ε 的错</b>。  讲座的说法：<b>「if that probability is small, we're being near accurate, near optimal」</b>。  这一段<b>不消耗任何预算，也不产生任何大错</b>。所以这类时刻要多少有多少，不影响结论。  关键在于另一半。");
  /* 反驳 */
  S(3551,function(){
      clearScene();setBig(null);setEq(null);
      saGrid({y:150,
      cls:function(i,j){return (j<6)?"hl":"";},
      fill:function(i,j){return (j<6)?0.85:((j===6&&i<3)?0.55:0.2);},
      bar:function(i,j){return (j<6)?"g":"r";}});
      for(var i=0;i<3;i++)dots([[330+6*32+13,150+i*32+13]],"r",7);
      note("每次撞上烧一格",900,300,"r");
      E.gS.append("rect").attr("class","cellbg").attr("x",400).attr("y",330)
      .attr("width",480).attr("height",18).attr("rx",4);
      E.gS.append("rect").attr("class","vbar y").attr("x",402).attr("y",332)
      .attr("width",132).attr("height",14).attr("rx",3);
      note("预算 |S||A|m",640,364,"sm");
      note("鸽笼原理",640,390,"y");
      setCap("<b>指名反驳</b>：不用证收敛。<b>情形二</b>撞上未知就<b>烧掉一格计数</b> —— 而格子有限。");
    },"<b>情形二：逃逸概率大。</b>  那么你<b>很可能真的会撞上</b>一个未知的状态动作对。而每撞上一次，那个 (s,a) 的计数就<b>加一</b>——你在<b>消耗</b>一格预算。  而预算是<b>有限</b>的：每个 (s,a) 封顶 m 次（第四集那条规定），总共 <b>|S|·|A|·m</b> 格。  所以「逃逸概率大」的段数不可能超过这个预算（乘上一个常数）。<b>格子用完了，你就再也不会有「概率大」的段了。</b>  <b>这就是鸽笼原理</b>：有限多个格子，每次事件填掉一格，事件总数就被格子数封住。  指名回去：整个论证<b>没有用到任何收敛性</b>。它只是把所有时刻分成两类，证明第一类<b>不犯大错</b>、第二类<b>次数有限</b>。两类穷尽所有时刻，于是大错总数有限——正是 PAC 定义里的那个 N。  现在回头看第四集那条「故意扔数据」的规定：<b>它在这里第二次发挥作用</b>。第一次是让并集界能加起来，第二次是让鸽笼有一个有限的格子数。<b>同一个 m，撑起了整个证明的两根支柱。</b>  三条条件到此讲完。下面两集掉头看理论之外。");
  SUM(3503,7,{h:"学习复杂度有界：鸽笼二分法",
    k:"把经验流切段，每段问「<b>会不会走到未知 (s,a)</b>」。<b>概率小</b> ⟹ 待在已知区、估计准 ⟹ 近最优，不犯大错。<b>概率大</b> ⟹ 会撞上未知 ⟹ 每次<b>烧掉一格计数</b>。",
    m:"预算 <b>|S||A|m</b> 有限 ⟹「概率大」的段数有限 ⟹ 大错总数有限，正是 PAC 定义里的 N。这就是<b>鸽笼原理</b>。",
    w:"<s>误解</s>：「得先证它会收敛」。这是一个<b>穷尽式</b>论证，不是收敛性论证 —— 两类覆盖所有时刻，各自成立就够。",
    e:"第四集那条「故意扔数据」在这里<b>第二次发挥作用</b>：第一次让并集界加得起来，第二次给鸽笼一个<b>有限的格子数</b>。同一个 m 撑起证明的两根支柱。"});
  QUIZ(3503,7,{t:"「学习复杂度有界」这一条是怎么证的？",
    o:["先证算法收敛到最优策略，再数收敛前犯了多少错","<b>二分：逃逸概率小则待在已知区、不犯大错；逃逸概率大则每次撞上未知都烧掉一格计数，而计数预算 |S||A|m 有限</b>","用 Hoeffding 界住每一步犯错的概率，再求和","假设 MDP 是遍历的，用平稳分布计算犯错频率"],
    a:1,
    w:"这是一个<b>穷尽式</b>论证，<b>完全不谈收敛</b>：把所有时刻分成两类，证明第一类不犯大错、第二类次数有限，两类覆盖全部时刻即可。第二类靠<b>鸽笼原理</b> —— 每次撞上未知 (s,a) 就消耗一格计数，而封顶规定让总格子数只有 <b>|S||A|m</b>。<s>「先证收敛」</s>不需要，也做不到（算法一直在探索）。<s>「Hoeffding 求和」</s>那是<b>乐观</b>那一条用的工具。<s>「遍历 + 平稳分布」</s>不需要这个假设。"});
});

KP("8 · MDP 的后验采样：抽<b>一整个 MDP</b>，然后解它",function(){
  /* 钩子 */
  S(3920,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline").attr("d","M300,300L560,300");
      betaCurve(5,3,300,560,300,110,"g");
      E.gS.append("path").attr("class","axline y").attr("d","M462,196L462,300");
      note("抽到一个 θ",462,182,"y");
      note("L12：抽一个 θ",430,336,"sm");
      for(var k=0;k<3;k++){
      E.gS.append("circle").attr("class","tnode").attr("cx",800+k*90).attr("cy",250).attr("r",16);
      if(k<2)E.gS.append("path").attr("class","tedge").attr("d","M"+(800+k*90+16)+",250L"+(800+(k+1)*90-16)+",250");}
      note("0.7",845,232,"g");note("0.3",935,232,"g");
      note("L13：抽一整个 MDP",890,336,"g");
      note("同一个想法，放大",640,390,"y");
      setCap("把 L12 那四步搬到 MDP：抽一次、当真、贪心、更新。");
    },"理论部分讲完了。这一集把 L12 第六集那个想法搬到 MDP——它常被叫做 <b>MDP 的后验采样</b>（posterior sampling for MDPs，PSRL）。  四步一模一样：<b>抽一次、当真、贪心、更新</b>。  变的只有「一次抽的是什么」：  <b>L12</b>：抽一组臂的参数 θ。 <b>L13</b>：抽<b>一整个 MDP</b>——所有状态的转移分布，所有状态动作对的奖励。  而「贪心」这一步也随之升级：老虎机里贪心就是取 argmax；MDP 里<b>贪心意味着要在抽出来的那个 MDP 上做一次完整的规划</b>。");
  /* 错误答案 */
  S(3932,function(){
      clearScene();setEq(null);
      setBig("每一步重抽一次","每步都用最新的后验，不是更好吗");
      setCap("标准答案是<b>不行</b>（时间一致性）—— 但<b>我三次都没能实测出差别</b>。");
    },"一个很自然的改动：既然后验每一步都在更新，那每一步都重抽一次、重新规划，岂不是更及时？  标准的回答是<b>不行</b>，理由是结构性的：抽一次样本的意思是<b>提出一个关于世界的、内部一致的假设</b>。在这个假设上规划出来的策略，是<b>为了检验这个假设</b>而设计的——而检验它可能需要<b>一长串动作</b>（比如「一直往前走十五步去看看那边有没有东西」）。每一步重抽就是每一步换一个假设，于是没有任何一个长计划被执行完。这个性质有个名字叫<b>深度探索</b>。  <b>这里我要把话说清楚：上面这段是推理，不是我的实测结果。</b>我试了三次想把这个差别在一条链上做出来（链长 10 到 15，最后一次连余量都拿掉、让回合步数恰好等于链长），<b>三次的比值分别是 1.00、0.99、1.04——没有差别</b>。  回头看原因是我的实例挑错了：在一条链上，每步重抽时「抽出来的最大值落在右边」的概率是 (N−1−s)/(N−1)，在起点附近接近 1。<b>所以每步重抽仍然有很强的向右漂移，并不是我以为的随机游走。</b>链太仁慈，分不开这两种做法。  深度探索这件事在文献里是确立的，但<b>我没有复现出来</b>，所以本片只把结构性理由讲给你，不把它当成一个已验证的数值结论。");
  /* 铺陈 */
  S(3944,function(){
      clearScene();setBig(null);
      setEq("$$Beta(\\alpha,\\beta)\\;\\to\\;Beta(r+\\alpha,\\,1-r+\\beta)$$","top");
      E.gS.append("path").attr("class","axline").attr("d","M380,320L960,320");
      betaCurve(2,2,380,960,320,120,"sm");
      betaCurve(3,2,380,960,320,120,"g");
      note("观测前",470,190,"sm");
      note("观测到 r=1 之后",820,182,"g");
      note("共轭，更新还是加一",640,390,"y");
      setCap("怎么抽：转移用 <b>Dirichlet</b>，奖励用 <b>Beta</b> —— 都是共轭的。");
    },"具体怎么抽？靠的还是 L12 第四集那个共轭性，只是换了分布族。  <b>转移</b>：从状态 s 做动作 a 之后落到哪个状态，这是一个<b>多项式分布</b>（|S| 个可能的结果）。它的共轭先验是 <b>Dirichlet</b>。  <b>奖励</b>：如果是伯努利奖励，共轭先验还是 <b>Beta</b>（L12 那个）。  Dirichlet 是 Beta 的多维推广，参数同样是<b>伪计数</b>：从 (s,a) 转移到 s′ 观察到几次，对应的那一维就加一。  <b>所以更新仍然是「加一」</b>，和 L12 完全一样。共轭性让「维护一个关于整个 MDP 的后验」这件听起来很吓人的事，落地成一堆整数计数。  抽一个 MDP，就是从每个 Dirichlet 抽一个转移分布、从每个 Beta 抽一个奖励——然后把它们拼成一个完整的 MDP。");
  /* 主体 */
  S(3956,function(){
      clearScene();setBig(null);setEq(null);
      var segs=[[0.06,"抽","sm"],[0.74,"解","r"],[0.14,"走","g"],[0.06,"更新","sm"]];
      var x=300,W=700;
      for(var k=0;k<segs.length;k++){
      var w=W*segs[k][0];
      E.gS.append("rect").attr("class","vbar "+segs[k][2]).attr("x",x).attr("y",232)
      .attr("width",w-3).attr("height",52).attr("rx",3);
      note(segs[k][1],x+w/2,306,segs[k][2]);
      x+=w;}
      note("一个回合的开销",640,208,"sm");
      note("贵在「解」这一步",640,390,"y");
      setCap("抽出来之后<b>要解它</b> —— 每个回合一次完整规划，这是主要开销。");
    },"整个循环：  <b>抽</b>：从后验抽一个完整的 MDP。 <b>解</b>：在这个 MDP 上做值迭代，得到它的最优策略。 <b>走</b>：按这个策略走完一个回合。 <b>更新</b>：把观察到的转移和奖励计入计数。  代价在<b>「解」</b>那一步：每个回合都要做一次完整的规划。老虎机那边「贪心」只是取一个 argmax，几乎不花钱；MDP 这边它是一次值迭代。  但要看清这个代价换来了什么：  <b>它换来了 MBIE-EB 需要用整整六集去构造的那个东西——乐观</b>。MBIE-EB 要算 β、要维护计数、要设奖励加成、还要人为扔掉数据。后验采样<b>什么都不用设计</b>：抽一次样本，乐观就自动来了——因为抽出来的样本<b>本来就有一定概率</b>比真值好。  这是 L12 第六集那句话在 MDP 上的重演：<b>一个看上去需要精心设计的东西，被一次采样免费实现了。</b>");
  /* 反驳 */
  S(3968,function(){
      clearScene();setBig(null);setEq(null);
      for(var k=0;k<24;k++){

    },"指名回去：抽一次样本得到的是一个<b>内部一致的世界假设</b>；在它上面规划出来的策略，是为了<b>检验这个假设</b>而生的。而检验往往需要一整段连贯的行动。每步重抽等于每步换一个假设。  <b>这是标准的论证，而我上一镜说了：我自己三次都没能把它在数值上做出来。</b>所以请把它当成一条值得知道的<b>理由</b>，而不是一条本片替你验过的<b>结论</b>。要做出这个差别，需要的实例得让「走错一步就彻底失去机会」，一条可以来回走的链做不到。  <b>乐观不只要在数值上成立，还要在时间上保持一致</b>——这一条在老虎机里看不出来，那里每一步都是独立的一次决策，没有「长计划」这回事。一到 MDP 它才浮出来。  对照一下三种做法怎么获得乐观：  <b>UCB / MBIE-EB</b>：<b>造</b>一个奖励加成，要推导常数、要控制并集界。 <b>后验采样</b>：<b>抽</b>一个样本，乐观是抽样自带的。 <b>乐观初始化</b>：<b>设</b>一个高初值，而它<b>不带保证</b>（L12 第八集）。  理论部分到这里就完整了。但这一整套——MBIE-EB 也好，后验采样也好——都有一个共同的前提，而下一集会看到这个前提在深度学习里<b>直接失效</b>。");
  SUM(3920,8,{h:"MDP 的后验采样：抽一整个 MDP，解它，跟着走完一个回合",
    k:"共轭仍然管用：<b>转移是多项式，配 Dirichlet</b>；<b>奖励是伯努利，配 Beta</b>。Dirichlet 是 Beta 的多维推广，参数同样是<b>伪计数</b>，更新还是<b>加一</b>。",
    m:"四步：<b>抽一个完整 MDP → 值迭代解它 → 按解出的策略走完整个回合 → 计数加一</b>。代价在「解」那一步（每回合一次完整规划）。",
    w:"<s>误解</s>：「每一步重抽更及时」。标准答案是<b>不行</b> —— 抽出来的是一个<b>内部一致的世界假设</b>，检验它需要一整段连贯行动（<b>深度探索</b>）。<b>但本片三次尝试都没做出这个差别</b>（比值 1.00 / 0.99 / 1.04）。<b>当理由记，别当结论记。</b>",
    e:"三种获得乐观的方式：<b>造</b>一个奖励加成（MBIE-EB，要推常数、控并集界）；<b>抽</b>一个样本（后验采样，乐观自带）；<b>设</b>一个高初值（<b>不带保证</b>）。「时间一致性」是从老虎机到 MDP <b>真正新增</b>的困难。"});

KP("9 · 函数逼近下的探索：<b>计数不泛化</b>，而理论还没跟上",function(){

    },"回头看前八集，所有东西都挂在同一个量上：<b>N(s,a)，这个状态动作对访问过几次</b>。  UCB 的奖励项是 √(2 log t / N)。MBIE-EB 的加成是 β/√N。已知集的定义是 N ≥ m。鸽笼的预算是 |S||A|m。Dirichlet 的参数是计数。  <b>全部是计数。</b>  而一进函数逼近，这个量就<b>失去意义</b>了：在连续状态空间里，你<b>永远不会两次到达完全相同的状态</b>。每个状态的访问次数都是 <b>1</b>，或者 0。  这一集是这一讲的最后一集，也是讲师最坦白的一段。");
  /* 错误答案 */

    },"最直接的想法：既然表格存不下，那就训练一个网络来预测访问次数。  <b>问题在于这件事没有监督信号。</b>  值函数可以回归，因为有 Bellman 目标当标签。策略可以优化，因为有回报当信号。而「这个状态我见过多少次」——<b>在连续空间里每个状态的真实答案都是 0 或 1</b>，学出来的东西没有意义。  你真正想要的其实是另一个量：<b>「这一带我探索得够不够」</b>——一个关于<b>密度</b>的问题，不是关于计数的问题。  所以要做的不是「把计数换成网络」，而是<b>先把问题换掉</b>。下一镜看三条替代路线。");

      for(var i=0;i<4;i++)for(var j=0;j<5;j++)
      E.gS.append("rect").attr("class","cellbg").attr("x",566+j*38).attr("y",174+i*33)

      dots([[880,210],[902,226],[866,232],[960,266],[982,252],[944,278]],"g",6);
      note("密度",400,330,"sm");note("哈希",660,330,"sm");note("嵌入",920,330,"sm");
      note("三条替代路线",640,390,"y");
      setCap("三条路：<b>伪计数、哈希计数、学到的嵌入</b> —— 都在补同一个洞。");
    },"讲座列了几条实际在走的路，本质上都是在把「计数」换成某种能泛化的东西：  <b>密度模型 / 伪计数</b>（Bellemare 等人）：显式地估计一个关于「访问过的状态」的<b>密度模型</b>，然后从密度反推一个<b>伪计数</b>。密度高的地方相当于去得多。  <b>哈希计数</b>（Berkeley 一系）：把状态空间<b>哈希</b>到有限多个桶里，在桶上数数，并随时间更新哈希函数。讲师说这在某种意义上和嵌入是相近的——<b>都是先降维成可数的东西，再数</b>。  <b>学到的嵌入</b>：在一个学出来的表示空间里做同样的事。  三条路的共同形状：<b>先找一个「相似的状态会被算作同一类」的划分，再在这个划分上恢复计数</b>。  <b>共同的代价也一样：前八集那些保证，一条都不再成立。</b>划分是学出来的，而所有的界都建立在「计数是对的」之上。");

    },"现在可以回答一个前面一直没说的问题：<b>为什么这一讲花了六集讲 MBIE-EB，而不是别的算法？</b>  讲师自己给了答案：<b>「that's why I chose MBIE-EB is the algorithm to show you before, because I think that those sort of reward bonuses are much easier to extend to the model-free case」</b>。  理由是<b>可移植性</b>：  <b>显式置信集</b>（不带 EB 的那个 MBIE 用的）在深度网络上<b>写不出来</b>。如果你的动态模型是一个深度网络，要给它写一个置信集——讲师的说法是「really tricky」。  <b>奖励加成</b>则不同：它只是在 Q 学习更新里<b>加一项</b>。不需要模型，不需要置信集，直接就能用在无模型的设定里。  而且讲师还提了经验上的结论：<b>奖励加成在实践中大体和显式置信集做得一样好</b>。  <b>所以这六集的理论选择，其实是被「哪个能搬到深度学习里」倒推出来的。</b>  （顺带一个实现细节：加成项通常在<b>访问的当时</b>算好存下来；而 MBIE-EB 原本是可以<b>事后重算</b>的——如果你的回放缓冲区留着数据。两种做法不等价。）");

  S(4216,function(){

      setCap("<b>指名反驳</b>：不是换个网络。<b>计数不泛化</b>，而理论<b>还没跟上</b>。");
    },"指名回去：不是「把计数换成网络」就行。<b>计数在连续空间里不成立</b>，得先把问题换成密度或划分，而换完之后<b>所有保证都失效了</b>。  讲座最后比较了两条估计 Q* 不确定性的路线，评价很直接：  <b>bootstrap DQN</b>（Osband）：用自助采样训练 C 个不同的智能体，得到 C 个 Q 值，对这一组乐观地行动。讲师的评价是——<b>「It's not incredibly effective. It gives you some performance gain.」</b>  <b>冻结嵌入 + 贝叶斯线性回归</b>：把深度网络的嵌入<b>固定住</b>，只在它上面做一层线性回归；用<b>贝叶斯</b>线性回归就自然带出不确定性。她的评价是——<b>「super simple」</b>，而且<b>「actually gives a lot of performance gains in a lot of cases」</b>。  <b>更简单的那个反而更好用。</b>这个结论值得记住，它在深度 RL 里不算罕见：在一个深度网络顶上放一点点不确定性表示，往往比把整个网络贝叶斯化更划算。  最后是讲师对整块领域的判断，本片照录：  <b>「we still haven't made sufficient progress in how to do exploration plus generalization.」</b>  <b>这不是谦辞。</b>这一讲花了七集把表格情形的探索证成了定理，而这些定理<b>没有一条能跨过函数逼近这道门</b>。快速 RL 这条线，理论走到哪里、实践走到哪里，中间这段空白就是这一讲留下的题目。");
  SUM(4168,9,{h:"计数不泛化 —— 理论到函数逼近为止",
    k:"前八集<b>全部</b>挂在 N(s,a) 上（UCB 的 √(2log t/N)、MBIE-EB 的 β/√N、已知集 N≥m、鸽笼的 |S||A|m）。而连续空间里<b>每个状态只到达一次</b>。",
    m:"三条替代：<b>密度模型/伪计数</b>（Bellemare）、<b>哈希计数</b>（Berkeley）、<b>学到的嵌入</b>。共同形状是「先把相似状态归为一类，再恢复计数」；<b>共同代价是所有保证都失效</b>。",

  QUIZ(4168,9,{t:"为什么这一讲花六集讲的是 MBIE-EB，而不是用置信集的 MBIE？",
    o:["因为 MBIE-EB 的样本复杂度更低","<b>因为奖励加成只是在更新里加一项，能直接搬到无模型/深度网络的设定；而在深度网络上写置信集非常棘手</b>","因为置信集方法没有 PAC 保证","因为 MBIE-EB 不需要计数"],

KP("完",function(){
  S(4700,function(){
      clearScene();setBig(null);setCap(null);setEq(null);
      setTitle("CS234 · Lecture 13 · 完","快速强化学习这条线到此为止",
      "L15 · 之后进入课程最后一块（L14 不在本语料里）");
    },"回头看这九集，承重的是五件事。  第一，<b>判据的差别在参照系，不在数值</b>。遗憾和 PAC 不能直接比大小——讲师自己说了一句「PAC can give much smaller regret」然后<b>当场自我更正</b>。两者衡量的东西不同：遗憾的基准是「从头最优会到的地方」，PAC 的基准是「你现在所在的地方」。在回合制、每次重置到固定起点的设定里，两者会靠得近一些。  第二，<b>光有乐观不够，这是三条充分条件里第二条存在的全部理由</b>。讲师的反例一句话就说完了：<b>把所有值设成超高然后永不更新，乐观自动成立</b>——而这个算法什么也学不到。所以必须再要求「准确性」：等你对某些状态动作对攒够了信息，你算出来的值就得<b>真的接近</b>它们的值。乐观负责让你去试，准确负责让你<b>停下来</b>。  第三，<b>β/√n 这个形状不是猜的，是被 Hoeffding 逼出来的</b>。X_i 的取值范围宽度是 1/(1−γ)，偏差取 β/√n 代进 exp(−2n t²/R²)，<b>n 精确地约掉</b>：我从 n=1 试到 n=10⁵，指数一动不动，都是 −2β²(1−γ)²。然后把 β 定成 (1/(1−γ))√(½ln(2|S||A|m/δ))，单次失败概率<b>恰好等于</b> δ/(2|S||A|m)，双侧再乘 |S||A|m 次更新，总失败率<b>精确等于 δ</b>——我验到机器精度。整条 β 是从「总预算是 δ」倒推回来的，和 L11 第六集是同一个手法。  第四，<b>「故意扔掉数据」是并集界逼出来的，不是失误</b>。并集界要覆盖<b>所有</b>估计更新，所以更新次数必须有限；于是算法规定每个 (s,a) 只用前 m 个样本。讲师自己点破了这有多反常——她引了 Tom Mitchell 对机器学习的定义：<b>设计能随数据增多而持续改进的算法</b>——而这个算法恰恰相反。<b>这是为了拿到证明而付的代价，不是这个算法的优点。</b>  第五，<b>理论到函数逼近为止</b>。计数不泛化，于是所有基于计数的保证都断在这里。伪计数、哈希、嵌入是工程上的替代，都没有 PAC 保证。讲师对两种主流做法的评价也很直接：bootstrap DQN <b>「not incredibly effective」</b>，只有一些提升；而在<b>冻结的嵌入上做贝叶斯线性回归</b>——「super simple」——反而在很多情形下带来明显收益。  快速 RL 这条线到此为止。");
});
