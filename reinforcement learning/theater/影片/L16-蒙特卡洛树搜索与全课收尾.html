<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

/* fix: 面板 .off 立即不可见 */

/* ══ RL 图元包 ══ */

/* #quiz 缺容器兜底。引擎里 #sum 有 max-height:90vh + overflow:auto，而 #quiz 两者都没有；
   又因为 #quizL 是 align-items:center，一旦内容超高就**上下对称裁切** ——
   最先看不见的是最底部的 .why，也就是那一拍的全部教学载荷（解析）。
   这比 SUM 卡溢出更隐蔽：SUM 至少还能滚，QUIZ 是直接两头切掉。
   选择器同为 (1,0,0)，本段注入在引擎样式之后，靠顺序取胜。 */
#quiz{max-height:88vh;overflow:auto}
.pt.b{fill:var(--coral)} .pt.c{fill:var(--green)} .pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)}
.box.y{stroke:var(--yellow)} .box.v{stroke:var(--violet)} .box.b{stroke:var(--blue)}
/* 层级只用颜色区分，字号一律沿用引擎的 .slbl 14px —— ML 版就是这么做的，
   混用字号会让画面每次切换都「跳」一下。sm / big 是**兜底色**，不是字号。

   顺序至关重要：sm/big/ink 必须排在语义色**之前**。三者特异度相同（0,2,0），
   靠先后决胜 —— 上一版把它们写在后面，于是 note(txt,x,y,cls+" sm") 这类调用
   （bars 第 187 行、errbar 第 303 行等，全片 15 处）的语义色被静默压成 --dim，
   而深底上的暗灰标签看起来像正常标签，所以没人反馈。
   「层级只靠颜色」这个正解，被为兼容它而保留的别名从内部取消掉了。
   现在的顺序下：class="slbl y sm" → 黄（语义色在后，赢）；class="slbl sm" → 暗色。 */
.slbl.ink{fill:var(--ink)} .slbl.sm{fill:var(--dim)} .slbl.big{fill:var(--ink)}
/* 五个语义色必须**全部**在别名之后重新声明 —— 包括 g 与 r。
   它们原本定义在 eng.txt 的基础样式里，而本段整体注入在基础样式之后，
   所以只在本段内部调顺序是不够的：第一次修完，slbl.y.sm 变对了，
   而 slbl.g.sm 仍被压成暗灰（实测 rgb(147,161,181)）—— 因为 .slbl.g 来自上游。 */
.slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)} .slbl.v{fill:var(--violet)}
.slbl.g{fill:var(--green)} .slbl.r{fill:var(--coral)}

/* ── 动画铁律 ──────────────────────────────────────────────────────────
   动画必须演示机制。看完一段动画，观众应当明白一件<b>之前不明白的事</b>。
   不解释任何东西的动画（呼吸、脉冲环、无限循环的小车、行进虚线）一律不要——
   它们只是视觉噪音，会盖过真正要看的东西。

   因此这里没有 infinite 动画。每个动画都：
     · 播一次就停在正确的终态；
     · 终态本身携带完整信息（后台标签页暂停也不丢内容）；
     · 有明确的「它在演示什么」的答案。
   ──────────────────────────────────────────────────────────────────── */
@keyframes rl-slide{to{offset-distance:100%}}
.tracer{animation:rl-slide var(--walk-dur,2.4s) ease-in-out 1 forwards;offset-rotate:0deg}
.trail{stroke-dasharray:none}

.arw{stroke:#3A4759;stroke-width:1.8;fill:none;marker-end:url(#ah)}
.arw.g{stroke:var(--green);marker-end:url(#ah-g)}
.arw.y{stroke:var(--yellow);marker-end:url(#ah-y)}
.arw.r{stroke:var(--coral);marker-end:url(#ah-r)}
.arw.b{stroke:var(--blue);marker-end:url(#ah-b)}
.arw.v{stroke:var(--violet);marker-end:url(#ah-v)}
.arw.dash{stroke-dasharray:5 4}

.snode{fill:#101724;stroke:#2B3646;stroke-width:1.8}
.snode.g{stroke:var(--green)} .snode.y{stroke:var(--yellow)}
.snode.r{stroke:var(--coral)} .snode.b{stroke:var(--blue)} .snode.v{stroke:var(--violet)}

.anode.y{fill:var(--yellow)} .anode.g{fill:var(--green)} .anode.r{fill:var(--coral)}

.gcell{fill:#0E1420;stroke:#1E2836;stroke-width:1.2}
.gcell.wall{fill:#1B2230;stroke:#243044}
.gcell.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:2}
.gcell.g{fill:#0E2A24;stroke:var(--green);stroke-width:2}
.gcell.r{fill:#3A1A1E;stroke:var(--coral);stroke-width:2}
.gcell.b{fill:#0E1F33;stroke:var(--blue);stroke-width:2}

.vbar{fill:var(--blue);opacity:.85}
.vbar.g{fill:var(--green)} .vbar.y{fill:var(--yellow)}
.vbar.r{fill:var(--coral)} .vbar.v{fill:var(--violet)}

.ebar{stroke:var(--dim);stroke-width:1.7;fill:none}

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class",cls||"fit")
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false,eqT=null;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
/* 事故实录：setEq 的非 FAST 分支把写入推迟 150ms。连着翻镜时，上一镜那个
   还没触发的 setTimeout 会在 showSum 的 setEq(null) 之后才落地，把刚清干净的
   公式带重新填上 —— 总结卡上于是挂着上一镜的残留公式。
   L01 实测镜 8/45/65/74、L02 实测镜 79，全是这么来的。
   只有顺序翻才复现：从头 reload 直接跳到镜 8 是干净的，
   所以之前那次「跳过去看一眼」的单镜抽查给出了假的「已修好」。
   修法是把 pending 的定时器记下来，任何一次 setEq 先撤销它。 */
function setEq(h,pos){if(eqT){clearTimeout(eqT);eqT=null;}
  if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqT=null;eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");eqT=setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});
  eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");
  if(!eqBox.animate)return;
  eqBox.querySelectorAll("[data-id]").forEach(function(e){
    var r=b[e.dataset.id];
    if(r){var a=e.getBoundingClientRect(),dx=r.left-a.left,dy=r.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)
        e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:780,easing:"cubic-bezier(.35,0,.15,1)"});}
    else e.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
      {duration:520,delay:250,easing:"cubic-bezier(.3,.7,.3,1)",fill:"backwards"});});}
function T(id,t,c){return '<span class="tok '+(c||"")+'" data-id="'+id+'">'+t+'</span>';}
function setTitle(a,h,p){titleBox.classList.remove("off");
  titleBox.innerHTML='<p class="act">'+(a||"")+'</p><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'<div class="rule"></div>';}
function noTitle(){titleBox.classList.add("off");}
function setNarr(t){if(!t||!narrOn){narrEl.hidden=true;return;}
  narrEl.hidden=false;narrEl.innerHTML=t;narrEl.classList.remove("off");}
function clearSum(){sumEl.hidden=true;sumEl.classList.add("off");sumEl.innerHTML="";}
function showSum(kp,s){
  /* 总结卡是整屏覆盖层，但它盖不住公式带的顶边：实测 eqBox 顶边 y≈46，
     而 #sum 顶边 y≈94 —— 上一镜的公式会有约 48px 露在卡片上方。
     showSum 原本完全不碰 eqBox，于是 135 张卡里有 5 张挂着上一镜的残留公式。
     在这里清掉，比让每一集的最后一镜各自记得 setEq(null) 可靠。 */
  setEq(null);
  var ord=[["k","核心结论"],["m","底层机制"],["w","常见误解"],["e","与你的考试"]];
  sumEl.innerHTML='<p class="sh">知识点 '+kp+' · 总结</p><h3>'+s.h+'</h3><div class="rows">'+
    ord.filter(function(o){return s[o[0]];}).map(function(o){
      return '<div class="row '+o[0]+'"><p class="rk">'+o[1]+'</p><p class="rv">'+s[o[0]]+'</p></div>';}).join("")+'</div>';
  sumEl.hidden=false;void sumEl.offsetWidth;sumEl.classList.remove("off");}
function clearQuiz(){quizEl.hidden=true;quizEl.classList.add("off");quizEl.innerHTML="";locked=false;}
function askQ(kp,q){
  if(FAST){clearQuiz();return;}
  locked=true;
  quizEl.innerHTML='<p class="qh">知识点 '+kp+' · 检验</p><p class="qq">'+q.t+'</p><div class="qo">'+
    q.o.map(function(o,i){return '<button data-i="'+i+'">'+o+'</button>';}).join("")+
    '</div><p class="why" hidden>'+q.w+'</p>';
  quizEl.hidden=false;void quizEl.offsetWidth;quizEl.classList.remove("off");
  var bs=[].slice.call(quizEl.querySelectorAll("button"));
  bs.forEach(function(b,i){b.addEventListener("click",function(){
    if(b.classList.contains("lk"))return;
    bs.forEach(function(x,k){x.classList.add("lk");x.classList.add(k===q.a?"ok":(k===i?"no":"off2"));});
    quizEl.querySelector(".why").hidden=false;locked=false;
    document.getElementById("hint").textContent=(cur+1)+" / "+SHOTS.length+"  ·  空格继续";});});}

var SHOTS=[],KPS=[];
function S(t,fn,narr){SHOTS.push({t:t,enter:fn,n:narr});}
function KP(name,build){var from=SHOTS.length;build();KPS.push({name:name,from:from,len:SHOTS.length-from});}
function SUM(t,kp,s){SHOTS.push({t:t,sum:{kp:kp,s:s},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}
function QUIZ(t,kp,q){SHOTS.push({t:t,quiz:{kp:kp,q:q},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}

/* 把引擎暴露给内容区 */
function axes(P){gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.r).attr("y1",P.b).attr("y2",P.b);
  gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.l).attr("y1",P.t).attr("y2",P.b);}
window.__engine={gS:gS,gN:gN,DUR:DUR,isFast:function(){return FAST;},clearScene:clearScene,note:note,dots:dots,curve:curve,fn:fn,boxNode:boxNode,
  link:link,matrix:matrix,rng:rng,axes:axes,setCap:setCap,setBig:setBig,setEq:setEq,flip:flip,T:T,
  setTitle:setTitle,noTitle:noTitle,S:S,KP:KP,SUM:SUM,QUIZ:QUIZ,W:W,H:H};

/* ════════════════ 放映机（无需改动） ════════════════ */
function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];
  KPS.forEach(function(k){
    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);
    for(var i=0;i<k.len;i++){var p=document.createElement("span"),sh=SHOTS[k.from+i];
      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}
    FAST=false;
    cur=n;clearQuiz();clearSum();
    var sh=SHOTS[n];
    noTitle();clearScene();setBig(null);setEq(null);setCap(null);
    if(sh.enter)sh.enter();
    setNarr(sh.n);
    if(sh.sum){setNarr(null);showSum(sh.sum.kp,sh.sum.s);}
    if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});
  window.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}
window.__startProjector=startProjector;
})();
</script>


<script>

/* ══════════════ RL 图元包（在 __engine 之上扩展，不改原引擎） ══════════════ */
(function(){
var E=window.__engine, gS=E.gS, gN=E.gN, DUR=E.DUR, W=E.W, H=E.H;
var note=E.note;
function fast(){return E.isFast();}
function fadeIn(sel,delay){
  if(fast()){sel.attr("opacity",1);return sel;}
  return sel.attr("opacity",0).transition().duration(420).delay(delay||0).attr("opacity",1);
}

/* 箭头标记（各色一份），只建一次 */
(function(){
  var svg=d3.select("#scene");
  if(!svg.select("defs#rlmk").empty())return;
  var defs=svg.append("defs").attr("id","rlmk");
  var cols={"ah":"#3A4759","ah-g":"#5BDDA8","ah-y":"#FFD36E",
            "ah-r":"#FF7C87","ah-b":"#54A9F7","ah-v":"#B48BF5"};
  Object.keys(cols).forEach(function(id){
    defs.append("marker").attr("id",id).attr("viewBox","0 0 10 10")
      .attr("refX",9).attr("refY",5).attr("markerWidth",6).attr("markerHeight",6)
      .attr("orient","auto")
      .append("path").attr("d","M0,0.6L10,5L0,9.4z").attr("fill",cols[id]);
  });
})();

/* ── arrow ── */
function arrow(x1,y1,x2,y2,cls,bend){
  var d;
  if(bend){
    var mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy)||1;
    d="M"+x1+","+y1+"Q"+(mx-dy/L*bend)+","+(my+dx/L*bend)+" "+x2+","+y2;
  } else d="M"+x1+","+y1+"L"+x2+","+y2;
  var p=gS.append("path").attr("class","arw "+(cls||"")).attr("d",d);
  if(!fast()&&p.node().getTotalLength){
    var L2=p.node().getTotalLength();
    p.attr("stroke-dasharray",L2+" "+L2).attr("stroke-dashoffset",L2)
     .transition().duration(520).attr("stroke-dashoffset",0);
  }
  return p;
}

/* ── mdpChain ──
   o={n,x,y,r,gap,w, label:fn(i), lcls:fn(i), cls:fn(i), rew:fn(i),
      arcs:[[from,to,label,cls,bend]]} */
function mdpChain(o){
  var n=o.n, r=o.r||30, gap=o.gap||((o.w||900)/(n-1)),
      x0=o.x!=null?o.x:(W-(n-1)*gap)/2, y=o.y||300, pos=[];
  for(var i=0;i<n;i++){
    var cx=x0+i*gap; pos.push([cx,y]);
    var c=gS.append("circle").attr("class","snode "+((o.cls&&o.cls(i))||""))
      .attr("cx",cx).attr("cy",y).attr("r",r);
    fadeIn(c,i*55);
    if(o.label)note(o.label(i),cx,y+5,(o.lcls&&o.lcls(i))||"ink");
    if(o.rew&&o.rew(i)!=null)note(o.rew(i),cx,y-r-14,"y");
  }
  (o.arcs||[]).forEach(function(a){
    var A=pos[a[0]],B=pos[a[1]],sgn=B[0]>=A[0]?1:-1,bend=a[4]||0;
    arrow(A[0]+sgn*r,A[1],B[0]-sgn*r,B[1],a[3]||"",bend);
    /* 事故实录：这里原来是 Math.abs(bend)，把弧的方向丢掉了。两个后果都实测到过：
       (1) L02 KP1 的 A⇄B 来回弧，两个「1.0」标签落在同一个像素框 (627,255)-(653,273)；
       (2) L02 KP2 的 bend=-84 让弧向下弯，标签却仍算在上方，离自己的弧 100px。
       arrow 的控制点 y = my+(dx/L)*bend，故弧顶 y = A[1]+sgn*bend/2；标签跟着弧顶走。 */
    if(a[2]){
      var eff=sgn*bend, ay=A[1]+eff/2;
      note(a[2],(A[0]+B[0])/2, bend?(eff<0?ay-12:ay+20):A[1]-16, a[3]||"");
    }
  });
  return pos;
}

/* ── bars ──
   o={vals:[],x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v)} */
function bars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62, mx=o.max;
  if(mx==null){
    mx=0; for(var q=0;q<n;q++) if(Math.abs(v[q])>mx) mx=Math.abs(v[q]);
  }
  if(!mx)mx=1;
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var hh=Math.abs(v[i])/mx*h, cx=x0+i*gap+gap/2;
    var b=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    if(fast())b.attr("y",y0-hh).attr("height",hh);
    else b.attr("y",y0).attr("height",0).transition().duration(DUR).delay(i*45)
          .attr("y",y0-hh).attr("height",hh);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
    note(o.fmt?o.fmt(v[i]):(Math.round(v[i]*100)/100),
         cx,y0-hh-9,((o.cls&&o.cls(i))||"")+" sm");
  }
}

/* ── gridworld ──
   o={rows,cols,x,y,cs, val:fn(i,j), pol:fn(i,j)->"u|d|l|r",
      cls:fn(i,j), wall:fn(i,j), tag:fn(i,j)} */
function gridworld(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var isW=o.wall&&o.wall(i,j);
    var cl=isW?"wall":((o.cls&&o.cls(i,j))||"");
    var rc=gS.append("rect").attr("class","gcell "+cl)
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    fadeIn(rc,(i*C+j)*16);
    if(isW)continue;
    var cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2;
    if(o.val&&o.val(i,j)!=null)note(o.val(i,j),cx,cy+5,((o.cls&&o.cls(i,j))||"ink"));

          cx:function(j){return x0+j*cs+(cs-4)/2;},

/* ── backup：Sutton&Barto 回溯图 ──
   o={x,y,dy,spread,r, levels:["s","a","s"], branch:[1,2], labels:[], hl:[]} */
function backup(o){
  var x=o.x!=null?o.x:W/2, y=o.y!=null?o.y:150, dy=o.dy||105, r=o.r||20,
      lv=o.levels, br=o.branch||[], hl=o.hl||[], lab=o.labels||[], cur=[[x,y]];
  for(var k=0;k<lv.length;k++){
    var kind=lv[k], isHL=hl.indexOf(k)>=0, next=[];
    (function(kind,isHL,k){
      cur.forEach(function(p,pi){
        var c;
        if(kind==="s")
          c=gS.append("circle").attr("class","snode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r);
        else
          c=gS.append("circle").attr("class","anode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r*0.42);
        fadeIn(c,k*90);
        if(lab[k]&&pi===0)note(lab[k],p[0]-r-12,p[1]+5,isHL?"y":"","end");
      });
    })(kind,isHL,k);
    if(k<lv.length-1){
      var b=br[k]||1, spread=(o.spread||150)/Math.pow(1.7,k);
      cur.forEach(function(p){
        for(var m=0;m<b;m++){
          var nx=p[0]+(b===1?0:(m-(b-1)/2)*spread), ny=p[1]+dy;
          gS.append("path").attr("class","tedge").attr("d","M"+p[0]+","+p[1]+"L"+nx+","+ny);
          next.push([nx,ny]);
        }
      });
      cur=next;
    }
  }
}

/* ── tree：upto 控制画到第几个节点 ──
   o={nodes:[{id,parent,x,y,label,sub,cls}], upto, r} */
function tree(o){
  var r=o.r||24, N=o.nodes, up=o.upto!=null?o.upto:N.length, pos={};
  N.forEach(function(nd){ pos[nd.id]=[nd.x,nd.y]; });
  N.forEach(function(nd,i){
    if(i>=up)return;
    if(nd.parent!=null&&pos[nd.parent]){
      var p=pos[nd.parent];
      var e=gS.append("path").attr("class","tedge "+(nd.cls==="hl"?"hl":""))
        .attr("d","M"+p[0]+","+p[1]+"L"+nd.x+","+nd.y);
      if(!fast()&&e.node().getTotalLength){
        var L=e.node().getTotalLength();
        e.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
         .transition().duration(380).delay(i*70).attr("stroke-dashoffset",0);
      }
    }
    var c=gS.append("circle").attr("class","tnode "+(nd.cls||""))
      .attr("cx",nd.x).attr("cy",nd.y).attr("r",r);
    fadeIn(c,i*70);
    if(nd.label)note(nd.label,nd.x,nd.y+5,"ink");
    if(nd.sub)note(nd.sub,nd.x,nd.y+r+15,"sm");
  });
}

/* ═══════════ 演示机制的动画 ═══════════
   每个函数下面都写了「它在演示什么」。写不出这一句的动画不要写。
   全部播一次即停在正确终态，不循环。 */

/* ── trace ──
   演示什么：智能体<b>沿这条路走了一趟</b>，走过的地方留下痕迹。
   用于：策略的轨迹、示范轨迹与偏移轨迹的对比。
   o={pts:[[x,y]..], dur, cls, r, label, trail:true} */
function trace(o){
  var pts=o.pts, d="M"+pts[0][0]+","+pts[0][1];
  for(var i=1;i<pts.length;i++)d+="L"+pts[i][0]+","+pts[i][1];
  if(o.trail!==false){
    var tp=gS.append("path").attr("class","arw "+(o.cls||"y")+" trail")
      .attr("d",d).attr("marker-end",null);
    if(!fast()&&tp.node().getTotalLength){
      var L=tp.node().getTotalLength();
      tp.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
        .transition().duration((o.dur||2.4)*1000).ease(d3.easeSinInOut)
        .attr("stroke-dashoffset",0);
    }
  }
  var g=gS.append("g").attr("class","tracer")
    .style("offset-path",'path("'+d+'")')
    .style("--walk-dur",(o.dur||2.4)+"s");
  g.append("circle").attr("class","snode "+(o.cls||"y"))
    .attr("cx",0).attr("cy",0).attr("r",o.r||13);
  if(o.label)g.append("text").attr("class","slbl ink")
    .attr("x",0).attr("y",4).attr("text-anchor","middle").text(o.label);
  return g;
}

/* ── morphBars ──
   演示什么：参数一变，<b>每根柱子怎么随之变化</b>——谁涨谁跌、谁反超谁。
   用于：γ 从一个值变到另一个值时值函数的重排。柱子从 from 高度<b>过渡到</b> to 高度，
   数字同步滚动，所以「反超」这件事是看得见的，而不是两张静态图。
   o={from:[], to:[], x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v), dur} */
function morphBars(o){
  var A=o.from, B=o.to, n=B.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, dur=(o.dur||1400);
  if(mx==null){mx=0;B.forEach(function(v){if(Math.abs(v)>mx)mx=Math.abs(v);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(v){return (Math.round(v*100)/100).toString();};
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    (function(i){
      var cx=x0+i*gap+gap/2,
          hA=Math.abs(A[i])/mx*h, hB=Math.abs(B[i])/mx*h;
      var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
        .attr("x",cx-bw/2).attr("width",bw).attr("rx",3)
        .attr("y",y0-hA).attr("height",hA);
      var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(i))||""))
        .attr("x",cx).attr("text-anchor","middle").attr("y",y0-hA-9).text(fmt(A[i]));
      if(o.label)note(o.label(i),cx,y0+22,"sm");
      if(fast()){bar.attr("y",y0-hB).attr("height",hB);txt.attr("y",y0-hB-9).text(fmt(B[i]));return;}
      bar.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB).attr("height",hB);
      txt.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB-9)
         .tween("t",function(){var iv=d3.interpolateNumber(A[i],B[i]),self=this;
           return function(t){self.textContent=fmt(iv(t));};});
    })(i);
  }
}

/* ── fillBars ──
   演示什么：动态规划的<b>回代顺序</b>——每个值都要等它右边那个算完才能算。
   用于：Bellman 一致性方程从终点向起点回代。柱子按 order 依次出现，一次。
   o={vals:[], order:[下标顺序], x,y,w,h,max, label, cls, fmt, step:每步毫秒} */
function fillBars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, step=o.step||260;
  if(mx==null){mx=0;v.forEach(function(q){if(Math.abs(q)>mx)mx=Math.abs(q);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(q){return (Math.round(q*100)/100).toString();};
  var order=o.order;
  if(!order){order=[];for(var k=n-1;k>=0;k--)order.push(k);}  // 默认从右往左
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var cx=x0+i*gap+gap/2;
    gS.append("rect").attr("class","gcell")
      .attr("x",cx-bw/2).attr("y",y0-h).attr("width",bw).attr("height",h)
      .attr("rx",3).attr("opacity",.16);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
  }
  order.forEach(function(idx,rank){
    var cx=x0+idx*gap+gap/2, hh=Math.abs(v[idx])/mx*h,
        delay=fast()?0:rank*step;
    var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx).attr("y",y0-hh-9).attr("text-anchor","middle").text(fmt(v[idx]));
    if(fast()){bar.attr("y",y0-hh).attr("height",hh);return;}
    bar.attr("y",y0).attr("height",0).transition().duration(320).delay(delay)
       .attr("y",y0-hh).attr("height",hh);
    txt.attr("opacity",0).transition().duration(320).delay(delay).attr("opacity",1);
  });
}

/* ── sweepGrid ──
   演示什么：值迭代时信息<b>从目标格向外一圈圈扩散</b>的顺序。
   用于：格子世界的一轮扫描。格子按 order 依次点亮并写入值，一次。
   o={rows,cols,x,y,cs, val:fn(i,j), order:[[i,j]..], cls:fn(i,j), step} */
function sweepGrid(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150, step=o.step||190;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    gS.append("rect").attr("class","gcell")
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
  }
  (o.order||[]).forEach(function(ij,rank){
    var i=ij[0], j=ij[1],
        cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2,
        delay=fast()?0:rank*step;
    var rc=gS.append("rect").attr("class","gcell "+((o.cls&&o.cls(i,j))||"hl"))
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    var tx=gN.append("text").attr("class","slbl ink")
      .attr("x",cx).attr("y",cy+5).attr("text-anchor","middle")
      .text(o.val?o.val(i,j):"");
    if(fast())return;
    rc.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
    tx.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
  });
  return {x0:x0,y0:y0,cs:cs,
          cx:function(j){return x0+j*cs+(cs-4)/2;},
          cy:function(i){return y0+i*cs+(cs-4)/2;}};
}

/* ── reveal ──
   演示什么：一组元素之间的<b>因果或时间顺序</b>（先有这个，才有那个）。
   用于：信用分配里奖励回传的路径、推导步骤的先后。
   sel 是 d3 选择集，按数据顺序依次淡入，一次。 */
function reveal(sel,step){
  if(fast())return sel.attr("opacity",1);
  return sel.attr("opacity",0).transition().duration(340)
            .delay(function(d,i){return i*(step||240);}).attr("opacity",1);
}

E.sweepGrid=sweepGrid; E.reveal=reveal;

    },"最后一讲做两件事：<b>把基于模型的 RL 扶回一线工具的位置</b>，然后在它上面搭出 <b>蒙特卡洛树搜索</b>——AlphaGo 背后那个在<b>决策时</b>做规划的方法。  前半讲的论点只有一句：<b>一旦你拟合出一个转移和奖励模型，你就拥有了一个模拟器；而有了模拟器，你什么都能干</b>——动态规划、在合成轨迹上跑 Q 学习、策略搜索，还有一个额外的好处：<b>奖励换了而动力学没换时，可以零样本迁移</b>。  代价是两层近似误差<b>叠在一起</b>：模型本身的误差，和在模型上规划的误差。而它们复合的方式，和 L07 行为克隆在分布漂移下的误差复合<b>是同一个形状</b>。  后半讲是一条从笨到巧的阶梯：<b>完整前向搜索</b>（正确，但叶子数是 (|S||A|)^H，而且它还固执地<b>拒绝合并相同的状态</b>）→ <b>基于模拟的搜索</b> → <b>简单蒙特卡洛搜索</b>（它恰好是<b>一步策略改进</b>）→ <b>MCTS</b>。  <b>而这一讲最好的部分是它的结尾</b>：Brunskill 对 UCT 提出了一个诚实的批评。UCT 把每个树节点当成一个独立的老虎机、用 UCB 的乐观加成去选动作。但老虎机里乐观之所以对，是因为<b>你真的会为坏决策付出代价</b>；而在规划里，<b>在脑子里模拟一个坏动作，你什么也不疼</b>。所以正确的目标应该是「关于根节点 argmax 的<b>信息增益</b>」，而不是累积遗憾。  我把这个批评验了一遍，它站得住：同样的模拟预算，花在<b>不确定</b>的那个动作上，把两条置信区间分开的概率是 <b>0.5274</b>；花在乐观会选的那个上，只有 <b>0.0604</b>——<b>差 8.7 倍</b>。");
});

KP("2 · 代价：<b>模型误差和规划误差叠在一起</b>，而且会复合",function(){
  /* 钩子 */
  S(459,function(){
      clearScene();setBig(null);setEq(null);
      boxNode(150,200,190,58,"真实世界","");
      boxNode(545,200,190,58,"学到的模型","r");
      boxNode(940,200,190,58,"策略","r");
      arrow(344,229,541,229,"sm",0);note("模型学习",442,206,"sm");
      arrow(739,229,936,229,"sm",0);note("规划",838,206,"sm");
      note("误差①",640,300,"r");note("误差②",1035,300,"r");
      note("世界估错了",640,326,"sm");note("又没解准",1035,326,"sm");
      note("两层叠在一起",640,392,"r");
      setCap("基于模型要付的账：<b>两层近似误差叠在一起</b>。");
    },"上一集把好处说完了，这一集算账。  无模型的方法只有<b>一层</b>近似：直接估值或估策略，估得准不准就是全部。  基于模型的方法有<b>两层</b>：  <b>第一层，模型误差</b>：你拟合的 P̂ 和 R̂ 不等于真的 P 和 R。 <b>第二层，规划误差</b>：就算模型是对的，你在上面规划也未必解得精确——值迭代截断、函数逼近、MCTS 只展开了一部分树。  两层叠在一起。而问题不在于「叠」，在于<b>它们叠的方式</b>。");
  /* 错误答案 */
  S(471,function(){
      clearScene();setEq(null);
      setBig("模型误差小就没事","1% 的误差能有多大影响");
      setCap("误差会<b>沿着规划的路径复合</b> —— 和 L07 行为克隆是同一个形状。");
    },"这个直觉在监督学习里通常是对的：模型准 99%，预测就大体可信。  <b>在这里不对，而且不对的理由这门课已经讲过一次了。</b>  <b>L07 第四集</b>：行为克隆的误差为什么会复合？因为一个小错误把你带到一个<b>训练数据没覆盖的状态</b>，在那里你的策略更不可靠，于是错得更远。误差沿着时间轴<b>放大</b>，那一集给的量级是 εT(T+1)/2。  <b>基于模型的规划是完全一样的机制</b>：规划器会沿着模型的预测往前推很多步。每一步的模型误差<b>不是独立叠加</b>的——它会把你推到模型更不准的区域，在那里下一步的误差更大。  更糟的是规划器会<b>主动</b>找模型的漏洞：如果模型在某个地方错误地预测了高回报，规划器<b>恰恰会挑中那里</b>。  <b>它在优化模型的误差，而不是优化真实回报。</b>");
  /* 铺陈 */
  S(483,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline").attr("d","M290,352L1000,352");
      var T=[],M=[];
      for(var i=0;i<=60;i++){var t=i/60,x=290+t*700;
      var yt=312-66*Math.sin(t*3.1416);
      T.push([x,yt]);
      M.push([x,yt-48*Math.exp(-Math.pow((t-0.72)/0.055,2))]);}
      curve(T,"fit g");curve(M,"fit r");
      note("真值",700,306,"g");note("模型高估",742,182,"r");
      arrow(946,304,812,216,"r",0);
      note("argmax 停在这",946,326,"r");
      note("规划器在利用模型的错误",640,392,"r");
      setCap("最坏的一环：<b>规划器会主动去找模型高估的地方</b>。");
    },"把最坏的那一环单独拎出来说，因为它常被低估。  规划器做的事是<b>在模型里找回报最高的路径</b>。而模型在某些地方会高估、某些地方会低估。  <b>规划器的 argmax 会系统性地偏向被高估的那些地方。</b>  这不是巧合，是 argmax 的性质——而这门课里已经见过它两次了：  <b>L04 第八集</b>：最大化偏差。对一组有噪声的估计取 max，得到的期望<b>大于</b>真值的 max。 <b>L12 第一集</b>：依赖差距的界里，难的是区分两个都不错的选项。  <b>同一个 argmax，在这里第三次咬人。</b>规划得越深、搜索得越广，找到模型漏洞的机会就越多——<b>更强的规划器，在一个有误差的模型上，可能表现更差</b>。  这是基于模型 RL 里一个真实且反直觉的现象。");
  /* 主体 */
  S(495,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline").attr("d","M290,352L1000,352");
      var M=[],U=[],Lo=[];
      for(var i=0;i<=60;i++){var t=i/60,x=290+t*700;
      var y=312-66*Math.sin(t*3.1416)-48*Math.exp(-Math.pow((t-0.72)/0.055,2));
      M.push([x,y]);U.push([x,y-14-26*t]);Lo.push([x,y+14+26*t]);}
      curve(U,"fit sm");curve(Lo,"fit sm");curve(M,"fit r");curve(Lo,"fit g");
      E.gS.append("path").attr("class","axline y").attr("d","M520,150L520,352");
      note("短程规划",520,138,"y");
      note("不确定带",930,206,"sm");
      note("集成取悲观",930,330,"g");
      note("三种常见的缓解",640,392,"y");
      setCap("缓解的办法都朝同一个方向：<b>不要相信模型太远、太深</b>。");
    },"实践里缓解这个问题的办法，形状都一样：<b>不要相信模型太远</b>。  <b>短程规划</b>：只往前推几步，然后接一个学出来的值函数。误差没有时间放大。 <b>显式建模不确定性</b>：模型不只给一个预测，还给一个置信范围；规划时对不确定的地方<b>保守</b>而不是乐观。 <b>集成</b>：训练多个模型，只在它们<b>一致</b>的地方相信预测；不一致的地方按最悲观的那个算。  注意第二条和第三条的方向：<b>对模型的不确定性要悲观，不是乐观</b>。  这和 L11 到 L13 那一整块<b>正好相反</b>——那里对<b>环境</b>的不确定性要乐观（因为去试探是有价值的）。这里对<b>模型</b>的不确定性要悲观（因为你不是去试探，你是在拿模型当真）。  <b>同一个「不确定性」，在探索里是机会，在规划里是风险。</b>下一集看一个更基本的例子：连「用模型」和「不用模型」收敛到的东西都不一样。");
  /* 反驳 */
  S(507,function(){
      clearScene();setBig(null);setEq(null);
      E.gS.append("path").attr("class","axline").attr("d","M290,352L1000,352");
      var R=[],P=[];
      for(var i=0;i<=50;i++){var t=i/50,x=290+t*700;
      var y=286-16*Math.sin(t*6.3);
      R.push([x,y]);P.push([x,y-104*t*t]);}
      curve(R,"fit g");curve(P,"fit r");
      note("真实轨迹",944,296,"g");note("模型预测",944,170,"r");
      arrow(866,282,866,196,"sm",0);note("误差复合",806,240,"sm");
      note("更强的规划器可能更差",640,392,"r");
      setCap("<b>指名反驳</b>：不是「1% 误差没事」。误差会<b>复合</b>，而且规划器会<b>放大</b>它。");
    },"指名回去：模型误差不是一个可以按百分比折算的量。  三个理由叠在一起：  <b>误差沿规划路径复合</b>——同 L07 行为克隆的机制，小错把你推到模型更不准的地方。 <b>argmax 系统性偏向被高估处</b>——同 L04 的最大化偏差，第三次出现。 <b>规划越强，找到漏洞的机会越多</b>——所以<b>更强的规划器可能表现更差</b>。  这一条尤其值得记住，因为它违反了一个很深的直觉：在监督学习里，优化器更强通常更好。<b>在一个近似模型上不是这样</b>——你优化的是模型，不是世界。  代价说完了。下一集是一个把「用不用模型」这件事逼到极限的例子：<b>同一份数据，批 TD 和批 MC 收敛到两个不同的值</b>，而它们的差别恰恰就是「有没有假设马尔可夫」。");
  SUM(459,2,{h:"两层误差叠在一起，而且规划器会放大模型的错误",

    m:"最坏的一环：<b>规划器的 argmax 系统性偏向被模型高估的地方</b>（同 L04 的最大化偏差，第三次出现）。后果反直觉：<b>更强的规划器在有误差的模型上可能表现更差</b>。",
    w:"<s>误解</s>：「模型准 99% 就没事」。在监督学习里通常对；这里不对 —— 你优化的是<b>模型</b>，不是世界。",
    e:"缓解办法方向一致：<b>不要相信模型太远太深</b> —— 短程规划接值函数、显式建模型不确定性、多模型集成取悲观。注意：<b>对模型的不确定性要悲观，与 L11–L13 对环境的不确定性要乐观正好相反</b>。同一个不确定性，<b>探索里是机会，规划里是风险</b>。"});

    },"很自然的期待：同一份数据，两种算法反复跑到收敛，应该得到同一个答案。数据是同一份，真值只有一个。  <b>不是这样。</b>  <b>批量 TD</b> 收敛到 V(A) = <b>0.75</b>。 <b>批量蒙特卡洛</b> 收敛到 V(A) = <b>0.00</b>。  两个都确实收敛了——反复在这八个回合上迭代到不动为止，各自停在这两个数上。  <b>它们收敛到了两个不同的东西。</b>而差别的来源只有一个，下面两镜说清楚。  先说 V(B)：这个两边一致，都是 <b>6/8 = 0.75</b>。分歧只在 A 上。");

  /* 主体 */
  S(859,function(){

    },"<b>看什么：</b>左边那根<b>高度为零</b> —— 批 MC 给 V(A)=0.00。右边 0.75。<b>同一份数据、同一个状态</b>，两个算法给出两个不同的数，而且都已经收敛。差别<b>不在数值精度上，在它们假设了什么</b>。　—— <b>批量 TD</b> 做的事完全不同：它先用数据<b>拟合一个 MDP</b>，再解那个 MDP。  拟合出来的最大似然 MDP 是：<b>从 A 出发，100% 转移到 B，奖励 0</b>（因为数据里从 A 出发的那一次就是这样）。  于是解它：V(A) = 0 + γ·V(B) = 0 + 1×0.75 = <b>0.75</b>。  这就是<b>确定性等价</b>（certainty equivalence）：<b>把估计出来的模型当成真的，然后精确求解</b>。  <b>而 TD 之所以能这么做，是因为它假设了马尔可夫。</b>「A 转到 B」这个结构，让它把 B 的七次观测<b>借</b>给了 A——虽然从来没有第二个回合经过 A。  <b>这就是分歧的全部来源</b>：TD 假设马尔可夫，于是能跨状态共享信息；MC 不假设，于是只能用直接观测。");

      mT(940,158,"g");mT(940,272,"");
      note("TD 0.75",400,286,"g");note("MC 0",400,312,"r");
      note("哪个对取决于世界",640,392,"y");
      setCap("<b>指名反驳</b>：不是谁算错了。是<b>它们假设了不同的东西</b>。");
    },"指名回去：两个算法都没算错，它们<b>在回答不同的问题</b>。  <b>批 TD</b> 回答：「如果这是一个马尔可夫过程，最可能的 V(A) 是多少？」 <b>批 MC</b> 回答：「只看我实际观测到的回报，最拟合的 V(A) 是多少？」  哪个对？<b>取决于世界是不是马尔可夫的。</b>  如果是：TD 更好——它用上了结构，同样的数据榨出更多信息。这就是 L03 到 L04 一路上 TD 比 MC 样本效率高的原因。 如果不是：<b>MC 更稳</b>——它不会因为一个错误的假设而被带偏。这也正是 L15 第二集里重要性采样「不需要马尔可夫」值钱的原因。  <b>同一个假设，是 TD 的力量来源，也是它的风险来源。</b>  最后标两处记号：这个例子被反复叫作「MDP」，但它只有一个动作，其实是一个<b>马尔可夫奖励过程</b>——做的是策略评估，不是控制。讲座自己也纠正了这一点。  模型这一半讲完了。下面六集全部在回答一个问题：<b>手上有个模拟器，怎么用它想事情？</b>");
  SUM(823,3,{h:"AB 例子：批 TD 与批 MC 收敛到两个不同的值",
    k:"八回合数据（A→B 得 0 一次；B 单独 7 次，6 次得 1）。<b>V(B) 两法一致 = 6/8 = 0.75</b>。而 <b>V(A)：批 MC = 0.00，批 TD = 0.75</b>。两个都收敛了。",

    w:"<s>误解</s>：「同一份数据必然收敛到同一个值」。差别<b>不在数值精度，在假设</b>。",
    e:"哪个对<b>取决于世界</b>：是马尔可夫 ⟹ TD 更好（跨状态借信息，所以样本效率高）；不是 ⟹ <b>MC 更稳</b>（不会被错误假设带偏，同 L15 第二集 IS 不需要马尔可夫的价值）。记号：这个例子只有一个动作，其实是<b>马尔可夫奖励过程</b>，讲座自己纠正过；且 <b>γ=1</b>，V(A) 的答案依赖它。"});

    },"把前向搜索的毛病说准，因为这决定了后面几集要修什么。  <b>它不是算错了，它是不肯取舍。</b>  前向搜索对每一个分支<b>一视同仁</b>：一个明显是自杀的走法，和一个明显很强的走法，它会花<b>同样多</b>的力气展开到底。  而人类下棋显然不是这样。一个棋手看一个局面，大部分分支<b>连想都不会想</b>，剩下的几个里又有一两个会想得特别深。<b>他的搜索树是极度不对称的。</b>  所以要修的不是「让树小一点」，是<b>「让树长在该长的地方」</b>。  后面几集就是一步步实现这件事：先用采样代替穷举（基于模拟的搜索），再只做一步改进（简单蒙特卡洛搜索），最后让树自己决定往哪长（MCTS）。");

    },"指名回去：不该把所有分支都展开。  第一步改动叫<b>基于模拟的搜索</b>：<b>不枚举，改成采样</b>。从当前状态出发，用模型<b>抽一条完整的轨迹</b>出来，然后……然后就把它当成真实经验，跑任何一个无模型算法。  <b>这一步的意义在于代价的结构变了。</b>  <b>穷举</b>：代价是 (|S||A|)^H —— <b>深度每加一，代价乘一个因子</b>。 <b>采样</b>：代价是「抽几条 × 每条多长」—— <b>深度只线性地进来</b>。  换句话说：<b>你可以想得很深，只要你不要求想得很全。</b>而这正是人类下棋的样子。  注意这里有一个概念上的小转折：模拟出来的轨迹是<b>假的</b>（来自模型），但对无模型算法来说，它和真实经验<b>长得一模一样</b>。<b>所以前十五讲所有的无模型工具，在这里可以原样搬进来用。</b>  下一集看这条路上最简单的那个算法——而它的身份有点意外。");

KP("5 · 简单蒙特卡洛搜索：<b>恰好一步策略改进</b>",function(){

    },"这条路上最简单的算法叫<b>简单蒙特卡洛搜索</b>（simple Monte Carlo search）。Sutton & Barto 管它叫 <b>rollout 算法</b>。  四步：  <b>一</b>、对当前状态的<b>每一个</b>可能的首动作。 <b>二</b>、模拟：先做这个动作，之后<b>按一个固定的策略</b> π 走到底。 <b>三</b>、这样抽若干条轨迹，算平均回报。 <b>四</b>、<b>选平均回报最大的那个首动作</b>，真的走它。  就这么多。没有树，没有递归，没有回传。  而这个算法的身份，比它看起来有意思得多。");
  /* 错误答案 */
  S(2814,function(){

    },"第一印象通常是：这也太糙了，就是把几个动作各试几次取最好的，凭什么有用？  <b>凭 L02 那条策略改进定理。</b>  把这个算法翻译一遍：  它在估的是 <b>Q^π(s, a)</b>——在状态 s 做动作 a，<b>之后按 π 走</b>的期望回报。这正是第二步在做的事。  然后它取 <b>argmax_a Q^π(s,a)</b>。  <b>这就是策略改进的定义式。</b>L02 第五集：给定一个策略 π，对它的 Q 取贪心，得到的新策略<b>保证不比 π 差</b>。  <b>所以简单蒙特卡洛搜索恰好是一步策略改进 —— 在当前这个状态上执行的一步。</b>");
  /* 铺陈 */
  S(2826,function(){
      clearScene();setBig(null);
      setEq("$$a^*=\\arg\\max_a\\ \\hat{Q}^{\\pi}(s,a)\\quad\\Longrightarrow\\quad \\text{不比 }\\pi\\text{ 差}\\ (\\text{L02})$$","top");
      note("rollout 策略 π 是基准",640,340,"y lg");
      setCap("所以它<b>继承了那条定理</b>：结果不比<b>用来 rollout 的那个策略</b>差。");
    },"认出这个身份之后，两件事立刻跟着来。  <b>第一，它有保证</b>：只要 Q̂ 估得够准，这个算法选出的动作<b>不比直接按 π 走差</b>。而且基准很明确——<b>是那个 rollout 策略 π</b>，不是最优策略。  <b>第二，它的上限也清楚了</b>：一步策略改进<b>只有一步</b>。它不会比「π 迭代改进到收敛」更好。  这解释了一个很实际的现象：<b>rollout 策略越好，这个算法越好</b>。用一个随机策略去 rollout，你得到的是「比随机好一点」；用一个已经训练过的策略去 rollout，你得到的是「比它还好一点」。  <b>AlphaGo 的做法正是后者</b>——用一个训练好的策略网络当 rollout 策略，于是搜索是在一个已经很强的基准上再改进一步。  <b>「决策时再想一想」的价值，是在你已有的策略上白加一层。</b>");
  /* 主体 */
  S(2838,function(){
      clearScene();setBig(null);setEq(null);
      var px=[250,360,470,580];
      for(var i=0;i<4;i++){
      E.gS.append("circle").attr("class","tnode"+(i===3?" g":"")).attr("cx",px[i]).attr("cy",192).attr("r",15);

      note("训练时：迭代",415,150,"sm");
      mN(900,150,19,"y");note("s",900,156,"ink");
      for(var j=0;j<3;j++){mE(900,150,820+j*80,220,j===1?"hl":"");mN(820+j*80,220,11,j===1?"g":"");}
      note("决策时：加一层",900,266,"sm");
      note("同一条定理",640,320,"g");
      arrow(640,306,470,214,"g",26);arrow(700,306,860,192,"g",-26);
      note("L02 的定理在这里第二次用",640,392,"y");
      setCap("同一条策略改进定理：<b>训练时用它迭代，决策时用它加一层</b>。");
    },"把这个对照摆出来，因为它把这门课的开头和结尾接上了。  <b>L02 的用法</b>：反复做「评估 → 改进 → 评估 → 改进」，一直到收敛。这是<b>训练时</b>的策略迭代。  <b>这一集的用法</b>：拿一个现成的策略，<b>只在当前这个状态上</b>做一次改进。这是<b>决策时</b>的规划。  <b>同一条定理，两个完全不同的用法。</b>  而决策时那个用法有一个训练时没有的好处：<b>计算可以随时停</b>。抽的轨迹越多，Q̂ 越准，改进越可靠；但抽得少也照样出一个答案。讲座说得很直接——<b>「你可以整晚跑八小时来算这一个决策」</b>，也可以「需要多快就少抽几条」，<b>总能给出答案</b>。  <b>这类算法叫「随时算法」（anytime），而它是决策时规划最实用的性质。</b>  但简单蒙特卡洛搜索仍然一视同仁：它给每个首动作<b>同样多</b>的模拟。下一集修这一点。");

      setCap("<b>指名反驳</b>：不糙。它<b>恰好是一步策略改进</b>，定理原样适用。");
    },"指名回去：它不糙，它<b>恰好</b>是一步策略改进，L02 那条定理原样适用。  把这个算法的边界画清楚：  <b>保住的</b>：不比 rollout 策略差（前提是 Q̂ 估得够准）；随时可停；实现极其简单。 <b>放掉的</b>：只有<b>一步</b>改进，不会趋向最优；而且它<b>仍然对每个首动作一视同仁</b>——明显很差的那个和最有希望的那个，分到<b>同样多</b>的模拟预算。  最后这一条正是第四集批评前向搜索时说的<b>同一个毛病</b>，只是从「展开」换到了「采样」。  <b>而模拟预算是有限的。</b>花在一个明显很差的首动作上的每一条轨迹，都是从最需要分辨的那几个动作那里抢来的。  下一集让这棵树<b>自己决定往哪长</b>。");
  SUM(2802,5,{h:"简单蒙特卡洛搜索恰好是一步策略改进",

    w:"<s>误解</s>：「太糙了，没什么保证」。它有保证，而且基准明确；只是<b>上限也明确</b> —— 一步改进就是一步。",
    e:"同一条定理的两个用法：<b>L02 是训练时</b>反复迭代到收敛，<b>这里是决策时</b>只在当前状态加一层。决策时用法多一个好处：<b>随时算法</b>（讲座：可以跑八小时算一个决策，也可以少抽几条马上给答案）。但它<b>仍然一视同仁</b> —— 每个首动作分到同样多的预算。"});
  QUIZ(2802,5,{t:"简单蒙特卡洛搜索（rollout 算法）的保证来自哪里？",

    a:1,
    w:"算法第二步「先做动作 a，之后按 π 走到底」估的正是 <b>Q^π(s,a)</b>；第四步取 <b>argmax_a Q^π(s,a)</b> —— 这就是策略改进的定义式，所以 L02 那条定理<b>原样适用</b>：结果不比 π 差。基准是<b>那个 rollout 策略</b>，不是最优策略，所以「rollout 策略越好它越好」。<s>「无偏性」</s>是估计 Q^π 的手段，不是<b>保证的来源</b>。<s>「压缩性」</s>这里没有迭代到不动点。<s>「UCB 的乐观」</s>简单 MC 搜索<b>不用</b>乐观 —— 它给每个动作同样多的预算，这正是下一集要修的。"});

KP("6 · MCTS：<b>故意长成偏的</b>一棵树",function(){
  /* 钩子 */
  S(2897,function(){

      for(var i=0;i<3;i++){mE(RX,RY,LV1[i][0],LV1[i][1],i===1?"hl":"");
      mN(LV1[i][0],LV1[i][1],15,i===1?"y":"");}
      mE(LV1[1][0],LV1[1][1],LV2[2][0],LV2[2][1],"hl");mN(LV2[2][0],LV2[2][1],13,"y");

      mE(LV2[2][0],LV2[2][1],LV2[2][0],DIVY,"hl");

      note("两个策略，两种要求",640,392,"y");
      setCap("<b>MCTS</b> 的全部结构：树里一个策略，树外另一个。");
    },"<b>蒙特卡洛树搜索</b>把前两集的东西合起来，结构只有两块：  <b>树策略</b>（tree policy）：在<b>已经长出来的那部分树</b>里，按<b>统计量</b>选动作——哪个看起来更有希望、哪个试得还不够。  <b>rollout 策略</b>：一旦走出树的边界，就换成一个<b>便宜的</b>策略一路走到底——通常就是<b>随机</b>。  讲座反复强调：<b>「the key part is that tree policy」</b>——真正做事的是树策略，rollout 只是用来给叶子一个粗糙的估值。  然后把这条轨迹的回报<b>沿路回传</b>，更新沿途每个节点的统计量。  <b>然后再来一遍。</b>每来一遍，树就在最有希望的方向上长出一点。");
  /* 错误答案 */

      clearScene();setEq(null);
      setBig("树要均匀展开才公平","不然某些分支被冷落了");

    },"这个直觉来自搜索算法的传统印象：广度优先、迭代加深，都是「一层一层公平地铺开」。  <b>而 MCTS 故意不这样。</b>  它长出来的树是<b>极度不对称</b>的：在几个看起来最有希望的分支上深入得很远，在明显很差的分支上<b>几乎不展开</b>。  讲座的说法是：<b>「只把树填在那些看起来最终会被 max 选中、会把值回传到根的部分」</b>。  <b>这不是偷懒，这就是目的。</b>第四集已经说过：完整前向搜索的毛病<b>恰恰是</b>它一视同仁。修的就是这一点。  而「公平」在这里是一个错误的目标——<b>你的模拟预算是有限的，花在一个明显自杀的走法上的每一条轨迹，都是从真正需要分辨的地方抢来的。</b>");

      note("一次迭代四步",640,392,"y");
      setCap("一次迭代：<b>选 → 扩 → 模拟 → 回传</b>。然后重复几千几万次。");
    },"一次迭代四步：  <b>选</b>：从根开始，用<b>树策略</b>一路往下走，直到走到树的边界。 <b>扩</b>：在边界上<b>加一个新节点</b>。 <b>模拟</b>：从这个新节点用 <b>rollout 策略</b>（通常随机）一路走到终局。 <b>回传</b>：把这条轨迹的回报，沿着刚才走过的路径<b>回传</b>，更新每个节点的访问次数和平均回报。  重复几千几万次，然后在根节点选那个统计上最好的动作。  关于「回传」要标一处，因为它常被误解：<b>回传的是平均，不是自举</b>。  课上有学生专门问了这个：这算不算 TD？<b>不算。</b>讲座的回答是——每个节点的「奖励」就是<b>从这个节点出发的整条 rollout 的回报</b>，因为「那正是我们在平均的东西」。  <b>所以原始的 MCTS 是纯蒙特卡洛回传，没有任何自举。</b>（后来的 AlphaZero 一类才把值网络接进来，那是另一回事。）");
  /* 主体 */
  S(2933,function(){
      clearScene();setBig(null);setEq(null);
      mN(RX,RY,19,"y");note("s_t",RX,RY+5,"ink");
      for(var i=0;i<3;i++){mE(RX,RY,LV1[i][0],LV1[i][1],"");mN(LV1[i][0],LV1[i][1],15,"");}
      mStat(LV1[0][0],LV1[0][1],12,"0.31");
      mStat(LV1[1][0],LV1[1][1],71,"0.62","g");
      mStat(LV1[2][0],LV1[2][1],5,"0.18");
      mDiv();
      mE(LV1[1][0],LV1[1][1],LV1[1][0],DIVY,"");
      mRoll(LV1[1][0],1,"sm");
      note("精度花在该花的地方",640,392,"y");
      setCap("两个策略的分工：<b>把「仔细想」的预算，只花在树里那一段</b>。");
    },"两个策略的分工，是这个算法真正的设计。  <b>树里</b>：用统计量仔细选。这一段的每个节点都<b>记着访问次数和平均回报</b>，选择是有依据的。代价是要维护这些统计量。  <b>树外</b>：随机走到底。这一段<b>什么都不记</b>，纯粹是为了给叶子一个粗糙的估值。代价几乎为零。  <b>而边界会随着迭代往外推</b>：每次迭代加一个节点，于是「仔细想」的范围<b>一点点扩大</b>，而且是<b>往最有希望的方向</b>扩大。  这个设计回答了第四集那个问题——「怎么让树长在该长的地方」：  <b>让树自己的统计量决定往哪长。</b>  注意这意味着一个很强的性质：<b>在极限下，MCTS 会填满整棵 expectimax 树</b>，所以它是渐近正确的。讲座提了这一点，<b>紧接着说这在实践中从来不会发生</b>——这是一个关于渐近完备性的陈述，不是一个关于效率的承诺。  <b>而这个算法的价值恰恰在「远未填满」的时候。</b>");
  /* 反驳 */
  S(2945,function(){

      note("12",LV1[0][0],LV1[0][1]+28,"sm");

      mE(LV1[1][0],LV1[1][1],LV2[2][0],LV2[2][1],"hl");mN(LV2[2][0],LV2[2][1],13,"g");
      mE(LV1[1][0],LV1[1][1],LV2[1][0],LV2[1][1],"");mN(LV2[1][0],LV2[1][1],9,"");
      mE(LV2[2][0],LV2[2][1],LV2[2][0]+40,DIVY-16,"hl");
      mN(LV2[2][0]+40,DIVY-16,10,"g");
      note("树策略怎么选？下一集",640,392,"y");
      setCap("<b>指名反驳</b>：不对称<b>是目的</b>。而具体怎么不对称，全看<b>树策略</b>。");
    },"指名回去：均匀展开不是公平，是<b>浪费</b>。不对称是这个算法的<b>设计目标</b>，不是它的妥协。  把 MCTS 相对前两集修好了什么列清楚：  <b>相对完整前向搜索</b>：不再穷举，改成采样；不再一视同仁，改成按统计量倾斜。 <b>相对简单蒙特卡洛搜索</b>：不再只看第一步，而是<b>在树里递归地</b>做同样的事；而且不再给每个动作同样的预算。  <b>但整个算法的行为，完全取决于树策略怎么选动作。</b>讲座说的 <b>「the key thing is really this tree policy」</b> 就是这个意思——换掉树策略，就是换一个算法。  下一集看最常用的那个树策略。而它是一个<b>老朋友</b>——L11 那个。");
  SUM(2897,6,{h:"MCTS：故意长成偏的一棵树",
    k:"两块结构：<b>树策略</b>（树里，按统计量选，贵但准）+ <b>rollout 策略</b>（树外，通常随机，糙但便宜）。一次迭代四步：<b>选 → 扩 → 模拟 → 回传</b>。",
    m:"<b>不对称是目的不是缺陷</b>：预算有限，花在明显自杀的走法上的每条轨迹都是从真正需要分辨的地方抢来的。讲座：只把树填在「会被 max 选中、会把值回传到根」的那部分。",
    w:"<s>误解</s>：「树要均匀展开才公平」。完整前向搜索的毛病<b>恰恰是</b>一视同仁 —— 修的就是这一点。",
    e:"<b>回传的是平均，不是自举</b>：课上有学生问这算不算 TD，答案是<b>不算</b> —— 每个节点的「奖励」是<b>从它出发的整条 rollout 的回报</b>。原始 MCTS 是<b>纯蒙特卡洛回传</b>。另：「极限下会填满整棵 expectimax 树」是<b>渐近完备性</b>的陈述，讲座紧接着说实践中从不会发生。"});
  QUIZ(2897,6,{t:"MCTS 回传时更新的是什么？",
    o:["用下一个节点的值做 TD 自举更新","<b>从该节点出发的整条 rollout 的回报的平均 —— 纯蒙特卡洛回传，没有自举</b>","该节点这一步获得的即时奖励","该节点的 UCB 上置信界"],
    a:1,
    w:"课上有学生专门问了这个。讲座的回答是：每个节点的「奖励」就是<b>从这个节点出发的整条 rollout 的回报</b>，「因为那正是我们在平均、在计数的东西」，并明说<b>「It's not like TD」</b>。所以原始 MCTS 是<b>纯蒙特卡洛回传，没有任何自举</b>（后来的 AlphaZero 一类才把值网络接进来）。<s>「TD 自举」</s>正是讲座否定的。<s>「即时奖励」</s>回传的是<b>整条回报</b>。<s>「UCB 上界」</s>那是<b>树策略选动作</b>时用的量，不是被回传更新的量。"});
});

KP("7 · UCT：每节点当独立老虎机，回报是<b>整条 rollout</b>",function(){
  /* 钩子 */
  S(3070,function(){
      clearScene();setBig(null);setEq(null);
      mN(RX,120,22,"y");note("s",RX,126,"ink");
      var a=[430,640,850];
      for(var i=0;i<3;i++){mE(RX,120,a[i],214,"");mN(a[i],214,15,"");
      E.gS.append("rect").attr("class","box").attr("x",a[i]-34).attr("y",250)
      .attr("width",68).attr("height",54).attr("rx",5);}
      note("a₁",430,219,"ink");note("a₂",640,219,"ink");note("a₃",850,219,"ink");
      note("N=12",430,282,"sm");note("N=71",640,282,"g");note("N=5",850,282,"sm");
      note("这个节点 = 一台老虎机",640,346,"y");
      note("L11 那一套原样搬来",640,392,"y");
      setCap("树策略用什么？<b>UCT</b> 的答案：把每个节点当成<b>一个独立的老虎机</b>。");
    },"上一集说整个算法取决于树策略。最常用的那个答案叫 <b>UCT</b>（UCB applied to Trees）。  它的想法一句话：<b>把树里的每一个状态节点，当成一个独立的多臂老虎机</b>——这个节点上的每个动作是一条臂，选哪条臂就用 L11 那套 <b>UCB</b>。  讲座原话：<b>「we're treating each of the nodes, so each state node as a separate bandit」</b>。  <b>L11 整整一讲的机器，在这里被原样搬了进来。</b>  这一集看它具体怎么搬，以及搬的过程中有一处转录稿把关键的东西说反了。");
  /* 错误答案 */
  S(3082,function(){
      clearScene();setEq(null);
      setBig("那个加成是个折扣因子","看起来像访问次数什么的");
      setCap("<b>不是折扣因子</b>。是 UCB 的<b>乐观加成</b>，方向和作用完全不同。");
    },"这一集要修的是一处<b>转录稿把概念说错</b>的地方。  那个探索加成在讲座里<b>从头到尾没有被写下来</b>，转录稿把它含糊成了「一个折扣因子，看起来像是你在那个节点待过多少次」。  <b>它不是折扣因子。</b>  折扣因子是一个小于 1 的常数，作用是<b>压低远期的回报</b>。而这里说的东西是 <b>UCB1 的探索加成</b>，作用是<b>抬高试得不够的动作的分数</b>。  两者：  <b>作用对象不同</b>——折扣作用在<b>时间</b>上，加成作用在<b>不确定性</b>上。 <b>方向不同</b>——折扣让远的变小，加成让<b>陌生的变大</b>。 <b>是不是常数</b>——折扣是超参数，加成<b>随访问次数变</b>。  下一镜把正确的式子写出来。");
  /* 铺陈 */
  S(3094,function(){
      clearScene();setBig(null);
      setEq("$$\\arg\\max_a\\ \\Big[\\bar{Q}(s,a)+c\\sqrt{\\frac{\\ln N(s)}{N(s,a)}}\\Big]$$","top");
      note("父节点总访问数：分子",420,340,"v lg");
      note("这个动作自己的：分母",880,340,"b lg");
      setCap("正确的形式：<b>父节点访问越多它越大，这个动作试得越多它越小</b>。");
    },"正确的树策略是：  <b>argmax_a [ Q̄(s,a) + c·√( ln N(s) / N(s,a) ) ]</b>  <b>Q̄(s,a)</b>：这个节点这个动作下，所有 rollout 回报的<b>平均</b>（上一集说的那个）。 <b>N(s)</b>：<b>父节点</b>被访问的总次数——在<b>分子的 log 里</b>。 <b>N(s,a)</b>：<b>这个动作</b>自己被选中的次数——在<b>分母</b>里。  和 L11 第九集那个对照，<b>形状完全一样</b>：  <b>分母上的那个计数让加成缩</b>——这个动作试得越多，越不需要再试。 <b>分子里的那个计数让加成涨</b>——这个节点被反复访问而某个动作一直没被选，它的加成<b>越来越大</b>，最终一定会被试到。  <b>两个方向相反的计数器</b>，L11 第九集专门讲过这一点，这里原样重现。");
  /* 主体 */
  S(3106,function(){
      clearScene();setBig(null);setEq(null);
      mN(RX,100,18,"y");
      mE(RX,100,470,172,"");mN(470,172,11,"");
      mE(RX,100,810,172,"hl");mN(810,172,16,"g");
      note("Q̄ 低",470,204,"r");note("Q̄ 高",810,208,"g");
      mE(470,172,470,238,"");mN(470,238,7,"");
      for(var i=0;i<2;i++){mE(810,172,770+i*80,238,"hl");mN(770+i*80,238,12,"g");}
      for(var i=0;i<3;i++){mE(770+(i>1?80:0),238,728+i*56,300,"hl");mN(728+i*56,300,8,"g");}
      for(var i=0;i<3;i++){mE(728+i*56,300,716+i*56,356,"hl");mN(716+i*56,356,5,"g");}
      note("几乎不长",470,290,"r");note("反复深入",900,330,"g");
      note("树的形状是统计量决定的",640,392,"y");
      setCap("上一集那个「不对称」，具体<b>就是这个式子造出来的</b>。");
    },"现在可以回答上一集留下的问题：<b>树为什么会长成偏的？</b>  讲座说得很直接：<b>「下一次到达同一个节点时，我们可能会做不一样的事，因为计数变了」</b>。  机制就在那个式子里：  某个动作的 Q̄ 很高 ⟹ 它会被<b>反复选中</b> ⟹ 它下面的子树被反复深入 ⟹ <b>那一支长得很深</b>。 某个动作的 Q̄ 很低 ⟹ 加成虽然在涨，但涨的是 √ln，<b>涨得很慢</b> ⟹ 它偶尔被试一次 ⟹ <b>那一支几乎不长</b>。  <b>√ln 这个增长率是关键</b>：它慢到不会浪费预算（不会强迫你均匀展开），又快到最终一定会试（不会永久放弃任何一支）。  <b>树的形状不是设计出来的，是这个式子长出来的。</b>  这就是 MCTS 最漂亮的地方：<b>它没有任何一处显式地说「往哪长」，形状完全是统计量的副产品。</b>");
  /* 反驳 */
  S(3118,function(){
      clearScene();setBig(null);
      setEq("$$c\\sqrt{\\dfrac{\\ln n(s)}{n(s,a)}}$$","top");
      E.gS.append("path").attr("class","axline").attr("d","M300,362L1000,362");
      E.gS.append("path").attr("class","axline").attr("d","M300,236L300,362");
      var p1=[],p2=[];
      for(var i=0;i<=40;i++){var t=i/40;
      p1.push([300+t*700,362-118*Math.sqrt(Math.log(6+t*90)/6)/1.5]);
      p2.push([300+t*700,362-118/Math.sqrt(1+t*26)*0.92]);}
      curve(p1,"fit g");curve(p2,"fit r");
      note("父节点计数 → 涨",880,248,"g");
      note("自己的计数 → 缩",880,352,"r");
      note("最后一条留到第九集",640,392,"r");
      setCap("<b>指名反驳</b>：是 UCB 的乐观加成，<b>两个方向相反的计数器</b>。");
    },"指名回去：那不是折扣因子，是 <b>UCB1 的探索加成</b> c·√(ln N(s)/N(s,a))。父节点的计数让它<b>涨</b>，这个动作自己的计数让它<b>缩</b>——L11 第九集那对方向相反的计数器，在这里第二次出现。  <b>但 UCT 有两个假设值得存疑，而讲座两个都点了名。</b>  <b>第一个</b>：「每个节点是一个<b>独立</b>的老虎机」——那么同一个状态在树的两个不同位置出现时，它们的统计量<b>不合并</b>。下一集。  <b>第二个</b>：「用 UCB，也就是用<b>乐观</b>」——而乐观在规划里到底对不对？课上就有学生把这个问题提了出来，讲座当时的回应是 <b>「这是不是个好主意（笑）……我们等下回来说」</b>。  <b>第九集就是回来说这件事，而那是这一讲最好的部分。</b>");
  SUM(3070,7,{h:"UCT：每个树节点当成一个独立的老虎机",
    k:"树策略 = <b>argmax_a [ Q̄(s,a) + c·√(ln N(s)/N(s,a)) ]</b>。<b>N(s)</b>（父节点总访问）在分子 log 里让加成<b>涨</b>；<b>N(s,a)</b>（这个动作自己）在分母让它<b>缩</b> —— L11 第九集那对方向相反的计数器，第二次出现。",
    m:"上一集那个「不对称」<b>就是这个式子造出来的</b>：Q̄ 高的分支被反复深入，Q̄ 低的分支加成按 <b>√ln</b> 涨得很慢、几乎不长。<b>树的形状不是设计的，是统计量的副产品。</b>",
    w:"<s>误解</s>：「那个加成是个折扣因子」（转录稿的说法）。折扣作用在<b>时间</b>上、是常数、让远的变小；加成作用在<b>不确定性</b>上、随计数变、让<b>陌生的变大</b>。",
    e:"讲座自己点名了 UCT 的两个可疑假设：① 每个节点<b>独立</b>（同一状态在两处不合并，下一集）；② 用<b>乐观</b>（第九集 —— 学生当场问，讲座回「这是不是个好主意（笑）……等下回来说」）。"});
  QUIZ(3070,7,{t:"UCT 的树策略里，父节点访问数 N(s) 和该动作自身计数 N(s,a) 各起什么作用？",
    o:["两者都让探索加成变小，只是速度不同","<b>N(s) 在分子 log 里让加成涨（没被选的动作迟早会被试到），N(s,a) 在分母让加成缩（试够了就不必再试）</b>","N(s) 是折扣因子，N(s,a) 是学习率","两者只影响 Q̄ 的平均，不影响加成"],
    a:1,
    w:"加成是 <b>c·√(ln N(s)/N(s,a))</b>：父节点被反复访问而某动作一直没被选中时，加成<b>越来越大</b>，<b>最终一定会被试到</b>；而这个动作试得越多，分母越大、加成越小。这正是 L11 第九集那对<b>方向相反的计数器</b>。<b>√ln 的增长率是关键</b> —— 慢到不浪费预算，快到不会永久放弃任何分支，树的不对称形状就是这么长出来的。<s>「都变小」</s>方向错。<s>「折扣因子/学习率」</s>正是转录稿把加成说成折扣因子的那个误解。<s>「不影响加成」</s>它们<b>就在</b>加成里。"});
});

      note("统计量合不合并？",640,392,"y");
      setCap("同一个状态动作对，在树的<b>两个不同位置</b>出现。合并吗？");
    },"MCTS 长出来的是一棵<b>树</b>。而树有一个性质：<b>每个节点只有一个父亲</b>。  现实不是这样。围棋里同一个局面可以由<b>不同的着法顺序</b>到达；网格世界里同一个格子可以从上面来也可以从左边来。  讲座举的例子就是这个：<b>「你可能在树的这部分有 s₁, a₁，在那边也有 s₁, a₁」</b>。  那么问题是：<b>这两处的统计量要不要合并？</b>  直觉上显然要——同一个状态就是同一个状态，合并了信息量翻倍。  <b>而 UCT 不合并。</b>");
  /* 错误答案 */
  S(3136,function(){
      clearScene();setEq(null);
      setBig("当然要合并","马尔可夫嘛，同一个状态就是同一个状态");
      setCap("讲座原话：<b>「我们不合并它们的计数，把每个节点当成完全不同的」</b>。");
    },"这个直觉<b>在原理上是对的</b>——而这正是这一集有意思的地方。  讲座的原话是：  <b>「we're not combining their counts. We're treating every node as if it's totally distinct.」</b>  然后她自己补了最关键的一句：  <b>「Even though often the model we'll be using to simulate will be Markov.」</b>  <b>——尽管我们用来模拟的那个模型通常是马尔可夫的。</b>  也就是说：<b>算法明知道这两个节点是同一个状态，却故意装作不知道。</b>  这显然浪费信息。那为什么还这么做？");
  /* 铺陈 */
  S(3148,function(){
      clearScene();setBig(null);setEq(null);
      var L=380,R=920;
      mN(L,112,14,"");mE(L,112,L-60,190,"");mE(L,112,L+60,190,"");
      mN(L-60,190,11,"");mN(L+60,190,11,"");
      mE(L-60,190,L-60,268,"");mE(L+60,190,L+60,268,"");
      mN(L-60,268,9,"");mN(L+60,268,9,"");
      mN(R,112,14,"");mE(R,112,R-60,190,"");mE(R,112,R+60,190,"");
      mN(R-60,190,11,"");mN(R+60,190,11,"");
      mE(R-60,190,R,268,"hl");mE(R+60,190,R,268,"hl");mN(R,268,11,"r");
      note("树：一个父亲",L,320,"g");note("图：可以多个",R,320,"r");
      note("「选→扩→模拟→回传」全都要改",640,392,"r");
      setCap("理由是<b>实现复杂度</b>：在图上做那四步，比在树上难得多。");
    },"讲座给的理由很实在：<b>「you can do it, it's mostly that it becomes a lot more complicated for implementation if you wanted to basically treat it as a graph instead of a tree」</b>。  <b>可以做，只是实现复杂得多。</b>  具体难在哪？上一集那四步全都要改：  <b>回传</b>：树上只有<b>一条</b>路径回到根，沿着它更新就完了。图上一个节点有<b>多个</b>父亲，一次模拟的结果要回传给<b>哪些</b>祖先、各算几次？处理不好会<b>重复计数</b>，让某些路径的统计量被系统性放大。 <b>选</b>：UCB 里的 N(s) 是「父节点的访问数」——在图上「父节点」不唯一，这个量本身要重新定义。 <b>循环</b>：图可以有环，而「从这个节点出发的回报」在有环的图上不再是一个良定义的有限展开。  <b>所以这是一个工程取舍，不是一个原理判断。</b>");
  /* 主体 */
  S(3160,function(){
      clearScene();setBig(null);setEq(null);
      var xs=[380,530,680];
      for(var i=0;i<3;i++){mN(xs[i],150,15,"y");note("(s₁,a₁)",xs[i],198,"sm");}
      note("24",380,226,"sm");note("19",530,226,"sm");note("28",680,226,"sm");
      note("分成三份",530,268,"r");
      mN(980,150,26,"g");note("71",980,156,"ink");
      note("合并的话",980,226,"g");
      arrow(760,170,930,164,"sm",-22);
      note("知道自己在放弃什么",640,392,"y");
      setCap("账要算全：<b>浪费了信息，换来了正确性上的简单和实现上的可控</b>。");
    },"把这笔账算全，因为两边都是真的。  <b>亏的</b>：同一个状态在树的 k 个位置出现，它的统计量被<b>分成 k 份</b>。每一份都更嘈杂，收敛更慢。状态空间里「殊途同归」越多，浪费越大——围棋里这个现象（叫「转置」）非常普遍。  <b>赚的</b>：  <b>回传只有一条路径</b>，不会重复计数，不需要考虑该给哪些祖先记账。 <b>N(s) 有明确含义</b>，UCB 的式子可以直接用。 <b>没有环</b>，「从这个节点出发的回报」永远良定义。  <b>这个取舍的形状值得记住</b>：<b>放弃一部分统计效率，换取一个结构上更简单、更不容易出错的算法</b>。  它和 L13 第四集那个「故意扔掉数据」是同一类，但理由不同：那里是<b>证明</b>逼出来的，这里是<b>实现</b>逼出来的。<b>两个都不是优点，两个都要知道自己在放弃什么。</b>");
  /* 反驳 */
  S(3172,function(){
      clearScene();setBig(null);setEq(null);
      mN(RX,104,17,"y");
      mE(RX,104,430,180,"");mN(430,180,12,"");
      mE(RX,104,850,180,"");mN(850,180,12,"");
      mE(430,180,400,256,"");mN(400,256,15,"y");
      mE(850,180,880,256,"");mN(880,256,15,"y");
      E.gS.append("path").attr("class","tedge").attr("stroke-dasharray","6 7")
      .attr("opacity",.55).attr("d","M400,256Q640,332 880,256");
      note("原理上该合并",640,336,"g");
      note("实践上不合并",640,300,"r");
      note("取舍会随工程能力变",640,392,"y");
      setCap("<b>指名反驳</b>：直觉<b>没错</b>。是算法为了实现简单<b>主动放弃</b>了它。");
    },"指名回去——但这一次<b>不是反驳，是确认</b>：  <b>「同一个状态该合并」这个直觉是对的。</b>是 UCT 为了实现上的简单，<b>主动放弃</b>了这份信息。讲座自己说得很清楚：可以做，只是复杂得多。  <b>而这类取舍会随着工程能力变化。</b>后来的实现里处理转置（把树变成有向无环图）是常见做法；AlphaZero 一类用神经网络给节点估值，本身就带来了跨位置的泛化——<b>网络不知道也不在乎这是树的哪一处</b>，相同的局面自然得到相同的估值。  <b>所以这一条是「2019 年的 UCT 是这样」，不是「MCTS 必须这样」。</b>  读算法时能分清这两种陈述，是这一整套片子一直在练的事：  <b>哪些是原理</b>（策略改进定理、UCB 的两个计数器方向相反）。 <b>哪些是当时的工程取舍</b>（不合并转置、随机 rollout、扔掉第 m 个之后的数据）。  <b>前者过十年还对，后者不一定。</b>  下一集是最后一集，也是这一讲最好的一集：讲座回头质疑了它自己刚教完的东西。");
  SUM(3124,8,{h:"树不是图 —— UCT 拒绝合并相同的状态",
    k:"同一个 (s,a) 出现在树的多处，<b>统计量不合并</b>。讲座原话：「we're not combining their counts... every node as if it's <b>totally distinct</b>」，并补了「<b>even though the model is often Markov</b>」。",
    m:"理由是<b>实现复杂度</b>（讲座：「it becomes a lot more complicated for implementation」）：图上一个节点多个父亲，<b>回传该记给谁</b>、会不会重复计数、N(s) 怎么定义、有环怎么办 —— 四步全要改。",
    w:"<s>这一条不是反驳</s>：「该合并」这个<b>直觉是对的</b>，是算法<b>主动放弃</b>了它。",
    e:"账要算全：<b>亏</b>了统计效率（同一状态分 k 份，围棋的「转置」非常普遍）；<b>赚</b>了回传唯一、无重复计数、无环。同 L13 第四集的形状，但那里是<b>证明</b>逼的、这里是<b>实现</b>逼的。"});
  QUIZ(3124,8,{t:"UCT 为什么不合并树中不同位置出现的同一个状态？",
    o:["因为模拟用的模型不是马尔可夫的，两处确实不同","<b>因为在图上做「选→扩→模拟→回传」实现复杂得多（回传该记给哪些父亲、会不会重复计数、N(s) 怎么定义、有环怎么办）</b>","因为合并会破坏 UCB 的无偏性","因为树结构能保证收敛，图结构不能"],
    a:1,
    w:"讲座自己说得很清楚：<b>「you can do it, it's mostly that it becomes a lot more complicated for implementation」</b>，而且明确点出<b>「even though often the model we'll be using to simulate will be Markov」</b> —— <b>算法明知道两处是同一个状态，却故意装作不知道</b>。这是<b>工程取舍，不是原理判断</b>，所以它会随工程能力变化（后来处理转置很常见）。<s>「模型不是马尔可夫」</s>恰恰相反，讲座说它通常<b>是</b>。<s>「破坏无偏性」</s>没有这回事。<s>「图不能收敛」</s>不是理由。"});
});

KP("9 · 而乐观在规划里<b>是错的</b> —— 在脑子里做坏决策不疼",function(){
  /* 钩子 */
  S(3678,function(){
      clearScene();setBig(null);setEq(null);
      note("讲座自己回头问了一句",640,280,"y lg");
      note("每个节点上做老虎机",640,340,"sm lg");
      note("这是个好主意吗",640,405,"r lg");
      setCap("最后一集：讲者回头<b>质疑了她自己刚教完的东西</b>。");
    },"最后一集。  讲完 UCT 之后，Brunskill 主动回到一个学生提过的问题，而她的开场白是：  <b>「It's a little weird that we do bandits in each of the nodes.」</b>  <b>——在每个节点上做老虎机，这件事有点怪。</b>  这是整门课里少见的一段：讲者把自己刚教完的、而且是业界标准做法的东西，拿出来做结构性的质疑。  而她的论证只有两句话，下面两镜。");
  /* 错误答案 */
  S(3690,function(){
      clearScene();setEq(null);
      setBig("乐观在这里同样正确","L11 证过的，搬过来就行");
      setCap("L11 的乐观<b>有一个前提</b>：<b>你真的会为坏决策付出代价</b>。");
    },"这个错误模型特别值得拆，因为<b>它看起来完全合规</b>：L11 用四集证明了 UCB 的遗憾界，UCT 把它搬到树里，一切照章办事。  <b>但搬一个原理的时候，要重新问一遍「它当初为什么对」。</b>  L11 第五集给的理由是：乐观的拉动<b>两难都赢</b>——要么它真的好（不亏），要么它不好（但你学到了）。  <b>而这个论证里有一个前提：结局一里的「不亏」和结局二里的「亏了这一步」，都是真的在发生。</b>  Brunskill 的话是：  <b>「We do it because we're actually incurring the pain of making bad decisions.」</b>  <b>——我们之所以要乐观，是因为我们真的在承受坏决策的痛。</b>  那么在规划里呢？");
  /* 铺陈 */
  S(3702,function(){
      clearScene();setBig(null);setEq(null);
      boxNode(190,160,240,60,"真实世界","r");
      boxNode(850,160,240,60,"模型里","");
      mN(310,286,21,"r");note("坏动作",310,340,"r");
      mN(970,286,21,"");note("坏动作",970,340,"sm");
      arrow(310,224,310,262,"r",0);
      arrow(970,224,970,262,"sm",0);
      note("真的亏了",310,368,"r");
      note("什么也不疼",970,368,"g");
      note("前提没了，结论也就没了",640,392,"r");
      setCap("<b>在脑子里模拟一个坏动作，你什么也不疼</b> —— 那个前提不成立。");
    },"在规划里，那个前提<b>不成立</b>。  Brunskill 的原话：<b>「The weird thing about doing that for planning is that we're not suffering if we make bad decisions in our head.」</b>  <b>——在脑子里做坏决策，我们什么也不疼。</b>  模拟一个自杀的走法，没有任何人受损失。你花的只有<b>计算</b>。  于是整个目标函数错了：  <b>UCB 最小化的是累积遗憾</b>——「我在这些拉动里一共亏了多少」。而在规划里，<b>这个量根本不该被在乎</b>。  <b>该在乎的是：我花这些模拟，能多快确定根节点该走哪一步。</b>  她的说法是：<b>「it doesn't actually matter if I simulate out bad actions, if it allows me to get a better decision at the root」</b>——<b>模拟坏动作根本不要紧，只要它能让我在根上做出更好的决定</b>。  <b>正确的目标是关于根节点 argmax 的信息增益，不是遗憾。</b>");
  /* 主体 */
  S(3714,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1],step:760,vals:[0.0604,0.5274],
      x:400,y:350,w:480,h:150,max:0.62,
      label:function(i){return ["采 A1（乐观会选）","采 A2（不确定）"][i];},
      cls:function(i){return i===0?"r":"g";},
      fmt:function(v){return v.toFixed(4);}});
      note("两条区间分离的比例",640,392,"sm");
      setCap("同样的预算：采<b>不确定</b>的那个，分开区间的概率高 <b>8.7 倍</b>。");
    },"<b>看什么：</b>右边那根<b>高出近九倍</b>。左边是把模拟预算花在<b>乐观会选的那个动作</b>上，右边是花在<b>更不确定的那个</b>上。要确定根节点该走哪一步，<b>该采的是不确定的那个</b> —— 而 UCB 会一直采左边。　—— 讲座给了一个口头的例子，我把它做成了可以量的。  设定（正是她画在板上的那个形状）：  <b>A1</b>：均值高（0.60），而且<b>已经测得很准</b>（400 个样本）。 <b>A2</b>：均值低（0.40），但<b>很不确定</b>（只有 9 个样本）。  现在再给 400 个模拟的预算，花在哪个上更能<b>确定根节点的 argmax</b>？我用「之后两条 95% 区间<b>分离</b>的比例」来量（分离了就说明能确定谁更好）：  花在 <b>A1</b> 上 → <b>0.0604</b> 花在 <b>A2</b> 上 → <b>0.5274</b>  <b>差 8.7 倍。</b>  道理不难懂：A1 已经很准了，再给它 400 个样本，区间几乎不变；而 A2 的区间又宽又不确定，给它样本<b>立刻收窄</b>，于是两条区间<b>分开了</b>。  <b>而 UCB 会一直选 A1</b>——因为它的上置信界更高。用讲座的话说：<b>「它就像在说，我不想在脑子里承受选错动作的代价，所以我还是选 A1」</b>。  <b>它在优化一个它根本不需要优化的东西。</b>");
  /* 反驳 */
  S(3726,function(){
      clearScene();setBig(null);setEq(null);
      boxNode(210,180,400,72,"实证上：相当高效","g");
      boxNode(690,180,400,72,"理论上：最优性不清楚","");
      note("✓",410,296,"g lg");note("?",890,296,"sm lg");
      note("两句都说，才叫判断",640,344,"y lg");
      note("能同时说出这两半",640,392,"y lg");
      setCap("<b>指名反驳</b>：不能直接搬。搬一个原理时，要重新问<b>它当初为什么对</b>。");
    },"指名回去：乐观不能直接从老虎机搬到规划，因为它当初成立的<b>理由</b>——「坏决策真的疼」——在规划里不成立。  <b>而 Brunskill 的结论值得一字不改地记住</b>，因为它把「批评」和「实用」两半同时说完了：  <b>「it's not clear that the bandits at each node is the optimal thing to do, but it's pretty efficient.」</b>  <b>——在每个节点上做老虎机是不是最优的，不清楚；但它相当高效。</b>  <b>一个能同时说出这两半的判断，是这门课最值得学的东西。</b>不是「UCT 有缺陷所以不该用」，也不是「AlphaGo 用了它所以它是对的」——而是<b>知道它为什么好用，同时知道它的理由在哪里断了</b>。  这也是这十六讲反复在做的事。整门课最后落在这句话上，很合适。  <b>三个值得带走的形状</b>，作为全课的结尾：  <b>搬一个原理时，重新问它当初为什么对</b>（这一集）。 <b>分清哪部分是定理、哪部分是工程</b>（L10 的 TRPO、L13 的 MBIE-EB、上一集的转置）。 <b>正确不等于有用</b>（L15 那个 −5 百万的界；L10 的 C=39600ε；L12 的 10^T）。  十六讲到此结束。");
  SUM(3678,9,{h:"乐观在规划里是错的 —— 在脑子里做坏决策不疼",
    k:"L11 的乐观有一个前提：<b>「we're actually incurring the pain of making bad decisions」</b>。而规划里 <b>「we're not suffering if we make bad decisions in our head」</b> —— 前提没了，结论也就没了。",
    m:"实测（A1 均值 0.60 已测准 n=400，A2 均值 0.40 很不确定 n=9，再给 400 个模拟）：把预算花在 A1 上，两条区间分离的比例 <b>0.0604</b>；花在 A2 上 <b>0.5274</b> —— <b>差 8.7 倍</b>。而 UCB 会一直选 A1。",
    w:"<s>误解</s>：「L11 证过了，搬过来就行」。<b>搬一个原理时要重新问它当初为什么对</b>。正确目标是<b>关于根节点 argmax 的信息增益</b>，不是累积遗憾。",
    e:"讲座的结论一字不改：<b>「it's not clear that the bandits at each node is the optimal thing to do, but it's pretty efficient.」</b> —— <b>能同时说出这两半的判断，是这门课最值得学的东西。</b>"});
  QUIZ(3678,9,{t:"为什么把 UCB 的乐观原则搬到规划里是可疑的？",
    o:["因为树里的节点不是独立的老虎机","<b>因为乐观在老虎机里成立的理由是「坏决策真的会让你受损」，而在脑子里模拟一个坏动作不会 —— 该优化的是关于根节点 argmax 的信息增益，不是累积遗憾</b>","因为 UCB 的遗憾界只对有限动作成立","因为模拟出的轨迹不是独立同分布的"],
    a:1,
    w:"L11 第五集的论证是「乐观的拉动<b>两难都赢</b>」，而它的前提是<b>那些亏损真的在发生</b>（讲座：「we're actually incurring the pain of making bad decisions」）。规划里<b>不疼</b>，前提没了。实测：预算花在<b>不确定</b>的那个动作上，把两条区间分开的概率是 <b>0.5274</b>，花在乐观会选的那个上只有 <b>0.0604</b> —— <b>差 8.7 倍</b>。<s>「节点不独立」</s>那是<b>上一集</b>的另一个质疑，讲座分开点名的。<s>「只对有限动作」</s>树里动作本来就有限。<s>「不是独立同分布」</s>不是这里的论点。"});
});
