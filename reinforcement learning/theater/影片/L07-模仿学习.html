<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

.pt.a{fill:var(--blue)} .pt.b{fill:var(--coral)} .pt.c{fill:var(--green)}

/* 画布上没有图、文字本身就是内容时用这一档 —— 标签的 16.5px 是按

.slbl.lg{font-size:clamp(15px,1.6vw,23px)}
.slbl.g{fill:var(--green)} .slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
/* fix: 面板 .off 立即不可见 */
#big.off,#cap.off,#eqBox.off,#titleBox.off,#sum.off,#quiz.off{visibility:hidden}

/* ══ RL 图元包 ══ */

/* #quiz 缺容器兜底。引擎里 #sum 有 max-height:90vh + overflow:auto，而 #quiz 两者都没有；
   又因为 #quizL 是 align-items:center，一旦内容超高就**上下对称裁切** ——
   最先看不见的是最底部的 .why，也就是那一拍的全部教学载荷（解析）。
   这比 SUM 卡溢出更隐蔽：SUM 至少还能滚，QUIZ 是直接两头切掉。
   选择器同为 (1,0,0)，本段注入在引擎样式之后，靠顺序取胜。 */
#quiz{max-height:88vh;overflow:auto}
.pt.b{fill:var(--coral)} .pt.c{fill:var(--green)} .pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)}
.box.y{stroke:var(--yellow)} .box.v{stroke:var(--violet)} .box.b{stroke:var(--blue)}
/* 层级只用颜色区分，字号一律沿用引擎的 .slbl 14px —— ML 版就是这么做的，
   混用字号会让画面每次切换都「跳」一下。sm / big 是**兜底色**，不是字号。

   顺序至关重要：sm/big/ink 必须排在语义色**之前**。三者特异度相同（0,2,0），
   靠先后决胜 —— 上一版把它们写在后面，于是 note(txt,x,y,cls+" sm") 这类调用
   （bars 第 187 行、errbar 第 303 行等，全片 15 处）的语义色被静默压成 --dim，
   而深底上的暗灰标签看起来像正常标签，所以没人反馈。
   「层级只靠颜色」这个正解，被为兼容它而保留的别名从内部取消掉了。
   现在的顺序下：class="slbl y sm" → 黄（语义色在后，赢）；class="slbl sm" → 暗色。 */
.slbl.ink{fill:var(--ink)} .slbl.sm{fill:var(--dim)} .slbl.big{fill:var(--ink)}
/* 五个语义色必须**全部**在别名之后重新声明 —— 包括 g 与 r。
   它们原本定义在 eng.txt 的基础样式里，而本段整体注入在基础样式之后，
   所以只在本段内部调顺序是不够的：第一次修完，slbl.y.sm 变对了，
   而 slbl.g.sm 仍被压成暗灰（实测 rgb(147,161,181)）—— 因为 .slbl.g 来自上游。 */
.slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)} .slbl.v{fill:var(--violet)}
.slbl.g{fill:var(--green)} .slbl.r{fill:var(--coral)}

/* ── 动画铁律 ──────────────────────────────────────────────────────────
   动画必须演示机制。看完一段动画，观众应当明白一件<b>之前不明白的事</b>。
   不解释任何东西的动画（呼吸、脉冲环、无限循环的小车、行进虚线）一律不要——
   它们只是视觉噪音，会盖过真正要看的东西。

   因此这里没有 infinite 动画。每个动画都：
     · 播一次就停在正确的终态；
     · 终态本身携带完整信息（后台标签页暂停也不丢内容）；
     · 有明确的「它在演示什么」的答案。
   ──────────────────────────────────────────────────────────────────── */
@keyframes rl-slide{to{offset-distance:100%}}
.tracer{animation:rl-slide var(--walk-dur,2.4s) ease-in-out 1 forwards;offset-rotate:0deg}
.trail{stroke-dasharray:none}

.arw{stroke:#3A4759;stroke-width:1.8;fill:none;marker-end:url(#ah)}
.arw.g{stroke:var(--green);marker-end:url(#ah-g)}
.arw.y{stroke:var(--yellow);marker-end:url(#ah-y)}
.arw.r{stroke:var(--coral);marker-end:url(#ah-r)}
.arw.b{stroke:var(--blue);marker-end:url(#ah-b)}
.arw.v{stroke:var(--violet);marker-end:url(#ah-v)}
.arw.dash{stroke-dasharray:5 4}

.snode{fill:#101724;stroke:#2B3646;stroke-width:1.8}
.snode.g{stroke:var(--green)} .snode.y{stroke:var(--yellow)}
.snode.r{stroke:var(--coral)} .snode.b{stroke:var(--blue)} .snode.v{stroke:var(--violet)}
.anode{fill:var(--dim);stroke:none}
.anode.y{fill:var(--yellow)} .anode.g{fill:var(--green)} .anode.r{fill:var(--coral)}

.gcell{fill:#0E1420;stroke:#1E2836;stroke-width:1.2}
.gcell.wall{fill:#1B2230;stroke:#243044}
.gcell.hl{fill:#2A2410;stroke:var(--yellow);stroke-width:2}
.gcell.g{fill:#0E2A24;stroke:var(--green);stroke-width:2}
.gcell.r{fill:#3A1A1E;stroke:var(--coral);stroke-width:2}
.gcell.b{fill:#0E1F33;stroke:var(--blue);stroke-width:2}

.vbar{fill:var(--blue);opacity:.85}
.vbar.g{fill:var(--green)} .vbar.y{fill:var(--yellow)}
.vbar.r{fill:var(--coral)} .vbar.v{fill:var(--violet)}

.ebar{stroke:var(--dim);stroke-width:1.7;fill:none}
.ebar.y{stroke:var(--yellow)} .ebar.g{stroke:var(--green)} .ebar.r{stroke:var(--coral)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class",cls||"fit")
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false,eqT=null;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
/* 事故实录：setEq 的非 FAST 分支把写入推迟 150ms。连着翻镜时，上一镜那个
   还没触发的 setTimeout 会在 showSum 的 setEq(null) 之后才落地，把刚清干净的
   公式带重新填上 —— 总结卡上于是挂着上一镜的残留公式。
   L01 实测镜 8/45/65/74、L02 实测镜 79，全是这么来的。
   只有顺序翻才复现：从头 reload 直接跳到镜 8 是干净的，
   所以之前那次「跳过去看一眼」的单镜抽查给出了假的「已修好」。
   修法是把 pending 的定时器记下来，任何一次 setEq 先撤销它。 */
function setEq(h,pos){if(eqT){clearTimeout(eqT);eqT=null;}
  if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqT=null;eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");eqT=setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});
  eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");
  if(!eqBox.animate)return;
  eqBox.querySelectorAll("[data-id]").forEach(function(e){
    var r=b[e.dataset.id];
    if(r){var a=e.getBoundingClientRect(),dx=r.left-a.left,dy=r.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)
        e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:780,easing:"cubic-bezier(.35,0,.15,1)"});}
    else e.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
      {duration:520,delay:250,easing:"cubic-bezier(.3,.7,.3,1)",fill:"backwards"});});}
function T(id,t,c){return '<span class="tok '+(c||"")+'" data-id="'+id+'">'+t+'</span>';}
function setTitle(a,h,p){titleBox.classList.remove("off");
  titleBox.innerHTML='<p class="act">'+(a||"")+'</p><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'<div class="rule"></div>';}
function noTitle(){titleBox.classList.add("off");}
function setNarr(t){if(!t||!narrOn){narrEl.hidden=true;return;}
  narrEl.hidden=false;narrEl.innerHTML=t;narrEl.classList.remove("off");}
function clearSum(){sumEl.hidden=true;sumEl.classList.add("off");sumEl.innerHTML="";}
function showSum(kp,s){
  /* 总结卡是整屏覆盖层，但它盖不住公式带的顶边：实测 eqBox 顶边 y≈46，
     而 #sum 顶边 y≈94 —— 上一镜的公式会有约 48px 露在卡片上方。
     showSum 原本完全不碰 eqBox，于是 135 张卡里有 5 张挂着上一镜的残留公式。
     在这里清掉，比让每一集的最后一镜各自记得 setEq(null) 可靠。 */
  setEq(null);
  var ord=[["k","核心结论"],["m","底层机制"],["w","常见误解"],["e","与你的考试"]];
  sumEl.innerHTML='<p class="sh">知识点 '+kp+' · 总结</p><h3>'+s.h+'</h3><div class="rows">'+
    ord.filter(function(o){return s[o[0]];}).map(function(o){
      return '<div class="row '+o[0]+'"><p class="rk">'+o[1]+'</p><p class="rv">'+s[o[0]]+'</p></div>';}).join("")+'</div>';
  sumEl.hidden=false;void sumEl.offsetWidth;sumEl.classList.remove("off");}
function clearQuiz(){quizEl.hidden=true;quizEl.classList.add("off");quizEl.innerHTML="";locked=false;}
function askQ(kp,q){
  if(FAST){clearQuiz();return;}
  locked=true;
  quizEl.innerHTML='<p class="qh">知识点 '+kp+' · 检验</p><p class="qq">'+q.t+'</p><div class="qo">'+
    q.o.map(function(o,i){return '<button data-i="'+i+'">'+o+'</button>';}).join("")+
    '</div><p class="why" hidden>'+q.w+'</p>';
  quizEl.hidden=false;void quizEl.offsetWidth;quizEl.classList.remove("off");
  var bs=[].slice.call(quizEl.querySelectorAll("button"));
  bs.forEach(function(b,i){b.addEventListener("click",function(){
    if(b.classList.contains("lk"))return;
    bs.forEach(function(x,k){x.classList.add("lk");x.classList.add(k===q.a?"ok":(k===i?"no":"off2"));});
    quizEl.querySelector(".why").hidden=false;locked=false;
    document.getElementById("hint").textContent=(cur+1)+" / "+SHOTS.length+"  ·  空格继续";});});}

var SHOTS=[],KPS=[];
function S(t,fn,narr){SHOTS.push({t:t,enter:fn,n:narr});}
function KP(name,build){var from=SHOTS.length;build();KPS.push({name:name,from:from,len:SHOTS.length-from});}
function SUM(t,kp,s){SHOTS.push({t:t,sum:{kp:kp,s:s},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}
function QUIZ(t,kp,q){SHOTS.push({t:t,quiz:{kp:kp,q:q},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}

/* 把引擎暴露给内容区 */
function axes(P){gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.r).attr("y1",P.b).attr("y2",P.b);
  gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.l).attr("y1",P.t).attr("y2",P.b);}
window.__engine={gS:gS,gN:gN,DUR:DUR,isFast:function(){return FAST;},clearScene:clearScene,note:note,dots:dots,curve:curve,fn:fn,boxNode:boxNode,
  link:link,matrix:matrix,rng:rng,axes:axes,setCap:setCap,setBig:setBig,setEq:setEq,flip:flip,T:T,
  setTitle:setTitle,noTitle:noTitle,S:S,KP:KP,SUM:SUM,QUIZ:QUIZ,W:W,H:H};

/* ════════════════ 放映机（无需改动） ════════════════ */
function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];
  KPS.forEach(function(k){
    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);
    for(var i=0;i<k.len;i++){var p=document.createElement("span"),sh=SHOTS[k.from+i];
      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}
    FAST=false;
    cur=n;clearQuiz();clearSum();
    var sh=SHOTS[n];
    noTitle();clearScene();setBig(null);setEq(null);setCap(null);
    if(sh.enter)sh.enter();
    setNarr(sh.n);
    if(sh.sum){setNarr(null);showSum(sh.sum.kp,sh.sum.s);}
    if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});
  window.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}
window.__startProjector=startProjector;
})();
</script>


<script>

/* ══════════════ RL 图元包（在 __engine 之上扩展，不改原引擎） ══════════════ */
(function(){
var E=window.__engine, gS=E.gS, gN=E.gN, DUR=E.DUR, W=E.W, H=E.H;
var note=E.note;
function fast(){return E.isFast();}
function fadeIn(sel,delay){
  if(fast()){sel.attr("opacity",1);return sel;}
  return sel.attr("opacity",0).transition().duration(420).delay(delay||0).attr("opacity",1);
}

/* 箭头标记（各色一份），只建一次 */
(function(){
  var svg=d3.select("#scene");
  if(!svg.select("defs#rlmk").empty())return;
  var defs=svg.append("defs").attr("id","rlmk");
  var cols={"ah":"#3A4759","ah-g":"#5BDDA8","ah-y":"#FFD36E",
            "ah-r":"#FF7C87","ah-b":"#54A9F7","ah-v":"#B48BF5"};
  Object.keys(cols).forEach(function(id){
    defs.append("marker").attr("id",id).attr("viewBox","0 0 10 10")
      .attr("refX",9).attr("refY",5).attr("markerWidth",6).attr("markerHeight",6)
      .attr("orient","auto")
      .append("path").attr("d","M0,0.6L10,5L0,9.4z").attr("fill",cols[id]);
  });
})();

/* ── arrow ── */
function arrow(x1,y1,x2,y2,cls,bend){
  var d;
  if(bend){
    var mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy)||1;
    d="M"+x1+","+y1+"Q"+(mx-dy/L*bend)+","+(my+dx/L*bend)+" "+x2+","+y2;
  } else d="M"+x1+","+y1+"L"+x2+","+y2;
  var p=gS.append("path").attr("class","arw "+(cls||"")).attr("d",d);
  if(!fast()&&p.node().getTotalLength){
    var L2=p.node().getTotalLength();
    p.attr("stroke-dasharray",L2+" "+L2).attr("stroke-dashoffset",L2)
     .transition().duration(520).attr("stroke-dashoffset",0);
  }
  return p;
}

/* ── mdpChain ──
   o={n,x,y,r,gap,w, label:fn(i), lcls:fn(i), cls:fn(i), rew:fn(i),
      arcs:[[from,to,label,cls,bend]]} */
function mdpChain(o){
  var n=o.n, r=o.r||30, gap=o.gap||((o.w||900)/(n-1)),
      x0=o.x!=null?o.x:(W-(n-1)*gap)/2, y=o.y||300, pos=[];
  for(var i=0;i<n;i++){
    var cx=x0+i*gap; pos.push([cx,y]);
    var c=gS.append("circle").attr("class","snode "+((o.cls&&o.cls(i))||""))
      .attr("cx",cx).attr("cy",y).attr("r",r);
    fadeIn(c,i*55);
    if(o.label)note(o.label(i),cx,y+5,(o.lcls&&o.lcls(i))||"ink");
    if(o.rew&&o.rew(i)!=null)note(o.rew(i),cx,y-r-14,"y");
  }
  (o.arcs||[]).forEach(function(a){
    var A=pos[a[0]],B=pos[a[1]],sgn=B[0]>=A[0]?1:-1,bend=a[4]||0;
    arrow(A[0]+sgn*r,A[1],B[0]-sgn*r,B[1],a[3]||"",bend);
    /* 事故实录：这里原来是 Math.abs(bend)，把弧的方向丢掉了。两个后果都实测到过：
       (1) L02 KP1 的 A⇄B 来回弧，两个「1.0」标签落在同一个像素框 (627,255)-(653,273)；
       (2) L02 KP2 的 bend=-84 让弧向下弯，标签却仍算在上方，离自己的弧 100px。
       arrow 的控制点 y = my+(dx/L)*bend，故弧顶 y = A[1]+sgn*bend/2；标签跟着弧顶走。 */
    if(a[2]){
      var eff=sgn*bend, ay=A[1]+eff/2;
      note(a[2],(A[0]+B[0])/2, bend?(eff<0?ay-12:ay+20):A[1]-16, a[3]||"");
    }
  });
  return pos;
}

/* ── bars ──
   o={vals:[],x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v)} */
function bars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62, mx=o.max;
  if(mx==null){
    mx=0; for(var q=0;q<n;q++) if(Math.abs(v[q])>mx) mx=Math.abs(v[q]);
  }
  if(!mx)mx=1;
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var hh=Math.abs(v[i])/mx*h, cx=x0+i*gap+gap/2;
    var b=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    if(fast())b.attr("y",y0-hh).attr("height",hh);
    else b.attr("y",y0).attr("height",0).transition().duration(DUR).delay(i*45)
          .attr("y",y0-hh).attr("height",hh);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
    note(o.fmt?o.fmt(v[i]):(Math.round(v[i]*100)/100),
         cx,y0-hh-9,((o.cls&&o.cls(i))||"")+" sm");
  }
}

/* ── gridworld ──
   o={rows,cols,x,y,cs, val:fn(i,j), pol:fn(i,j)->"u|d|l|r",
      cls:fn(i,j), wall:fn(i,j), tag:fn(i,j)} */
function gridworld(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var isW=o.wall&&o.wall(i,j);
    var cl=isW?"wall":((o.cls&&o.cls(i,j))||"");
    var rc=gS.append("rect").attr("class","gcell "+cl)
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    fadeIn(rc,(i*C+j)*16);
    if(isW)continue;
    var cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2;
    if(o.val&&o.val(i,j)!=null)note(o.val(i,j),cx,cy+5,((o.cls&&o.cls(i,j))||"ink"));
    if(o.tag&&o.tag(i,j))note(o.tag(i,j),x0+j*cs+7,y0+i*cs+15,"sm","start");

/* ── backup：Sutton&Barto 回溯图 ──
   o={x,y,dy,spread,r, levels:["s","a","s"], branch:[1,2], labels:[], hl:[]} */
function backup(o){
  var x=o.x!=null?o.x:W/2, y=o.y!=null?o.y:150, dy=o.dy||105, r=o.r||20,
      lv=o.levels, br=o.branch||[], hl=o.hl||[], lab=o.labels||[], cur=[[x,y]];
  for(var k=0;k<lv.length;k++){
    var kind=lv[k], isHL=hl.indexOf(k)>=0, next=[];
    (function(kind,isHL,k){
      cur.forEach(function(p,pi){
        var c;
        if(kind==="s")
          c=gS.append("circle").attr("class","snode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r);
        else
          c=gS.append("circle").attr("class","anode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r*0.42);
        fadeIn(c,k*90);
        if(lab[k]&&pi===0)note(lab[k],p[0]-r-12,p[1]+5,isHL?"y":"","end");
      });
    })(kind,isHL,k);
    if(k<lv.length-1){
      var b=br[k]||1, spread=(o.spread||150)/Math.pow(1.7,k);
      cur.forEach(function(p){
        for(var m=0;m<b;m++){
          var nx=p[0]+(b===1?0:(m-(b-1)/2)*spread), ny=p[1]+dy;
          gS.append("path").attr("class","tedge").attr("d","M"+p[0]+","+p[1]+"L"+nx+","+ny);
          next.push([nx,ny]);
        }
      });
      cur=next;
    }
  }
}

/* ── tree：upto 控制画到第几个节点 ──
   o={nodes:[{id,parent,x,y,label,sub,cls}], upto, r} */
function tree(o){
  var r=o.r||24, N=o.nodes, up=o.upto!=null?o.upto:N.length, pos={};
  N.forEach(function(nd){ pos[nd.id]=[nd.x,nd.y]; });
  N.forEach(function(nd,i){

    if(nd.parent!=null&&pos[nd.parent]){
      var p=pos[nd.parent];
      var e=gS.append("path").attr("class","tedge "+(nd.cls==="hl"?"hl":""))
        .attr("d","M"+p[0]+","+p[1]+"L"+nd.x+","+nd.y);
      if(!fast()&&e.node().getTotalLength){
        var L=e.node().getTotalLength();
        e.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
         .transition().duration(380).delay(i*70).attr("stroke-dashoffset",0);
      }

    var c=gS.append("circle").attr("class","tnode "+(nd.cls||""))
      .attr("cx",nd.x).attr("cy",nd.y).attr("r",r);

    if(nd.label)note(nd.label,nd.x,nd.y+5,"ink");
    if(nd.sub)note(nd.sub,nd.x,nd.y+r+15,"sm");
  });
}

/* ═══════════ 演示机制的动画 ═══════════
   每个函数下面都写了「它在演示什么」。写不出这一句的动画不要写。

/* ── trace ──
   演示什么：智能体<b>沿这条路走了一趟</b>，走过的地方留下痕迹。
   用于：策略的轨迹、示范轨迹与偏移轨迹的对比。
   o={pts:[[x,y]..], dur, cls, r, label, trail:true} */
function trace(o){
  var pts=o.pts, d="M"+pts[0][0]+","+pts[0][1];
  for(var i=1;i<pts.length;i++)d+="L"+pts[i][0]+","+pts[i][1];
  if(o.trail!==false){
    var tp=gS.append("path").attr("class","arw "+(o.cls||"y")+" trail")
      .attr("d",d).attr("marker-end",null);
    if(!fast()&&tp.node().getTotalLength){
      var L=tp.node().getTotalLength();
      tp.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
        .transition().duration((o.dur||2.4)*1000).ease(d3.easeSinInOut)
        .attr("stroke-dashoffset",0);
    }
  }
  var g=gS.append("g").attr("class","tracer")
    .style("offset-path",'path("'+d+'")')
    .style("--walk-dur",(o.dur||2.4)+"s");
  g.append("circle").attr("class","snode "+(o.cls||"y"))
    .attr("cx",0).attr("cy",0).attr("r",o.r||13);
  if(o.label)g.append("text").attr("class","slbl ink")
    .attr("x",0).attr("y",4).attr("text-anchor","middle").text(o.label);
  return g;
}

/* ── morphBars ──
   演示什么：参数一变，<b>每根柱子怎么随之变化</b>——谁涨谁跌、谁反超谁。
   用于：γ 从一个值变到另一个值时值函数的重排。柱子从 from 高度<b>过渡到</b> to 高度，
   数字同步滚动，所以「反超」这件事是看得见的，而不是两张静态图。
   o={from:[], to:[], x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v), dur} */
function morphBars(o){
  var A=o.from, B=o.to, n=B.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, dur=(o.dur||1400);
  if(mx==null){mx=0;B.forEach(function(v){if(Math.abs(v)>mx)mx=Math.abs(v);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(v){return (Math.round(v*100)/100).toString();};
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    (function(i){
      var cx=x0+i*gap+gap/2,
          hA=Math.abs(A[i])/mx*h, hB=Math.abs(B[i])/mx*h;
      var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
        .attr("x",cx-bw/2).attr("width",bw).attr("rx",3)
        .attr("y",y0-hA).attr("height",hA);
      var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(i))||""))
        .attr("x",cx).attr("text-anchor","middle").attr("y",y0-hA-9).text(fmt(A[i]));
      if(o.label)note(o.label(i),cx,y0+22,"sm");
      if(fast()){bar.attr("y",y0-hB).attr("height",hB);txt.attr("y",y0-hB-9).text(fmt(B[i]));return;}
      bar.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB).attr("height",hB);
      txt.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB-9)
         .tween("t",function(){var iv=d3.interpolateNumber(A[i],B[i]),self=this;
           return function(t){self.textContent=fmt(iv(t));};});
    })(i);
  }
}

/* ── fillBars ──
   演示什么：动态规划的<b>回代顺序</b>——每个值都要等它右边那个算完才能算。
   用于：Bellman 一致性方程从终点向起点回代。柱子按 order 依次出现，一次。
   o={vals:[], order:[下标顺序], x,y,w,h,max, label, cls, fmt, step:每步毫秒} */
function fillBars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, step=o.step||260;
  if(mx==null){mx=0;v.forEach(function(q){if(Math.abs(q)>mx)mx=Math.abs(q);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(q){return (Math.round(q*100)/100).toString();};
  var order=o.order;
  if(!order){order=[];for(var k=n-1;k>=0;k--)order.push(k);}  // 默认从右往左
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var cx=x0+i*gap+gap/2;
    gS.append("rect").attr("class","gcell")
      .attr("x",cx-bw/2).attr("y",y0-h).attr("width",bw).attr("height",h)
      .attr("rx",3).attr("opacity",.16);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
  }
  order.forEach(function(idx,rank){
    var cx=x0+idx*gap+gap/2, hh=Math.abs(v[idx])/mx*h,
        delay=fast()?0:rank*step;
    var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx).attr("y",y0-hh-9).attr("text-anchor","middle").text(fmt(v[idx]));
    if(fast()){bar.attr("y",y0-hh).attr("height",hh);return;}
    bar.attr("y",y0).attr("height",0).transition().duration(320).delay(delay)
       .attr("y",y0-hh).attr("height",hh);
    txt.attr("opacity",0).transition().duration(320).delay(delay).attr("opacity",1);
  });
}

/* ── sweepGrid ──
   演示什么：值迭代时信息<b>从目标格向外一圈圈扩散</b>的顺序。
   用于：格子世界的一轮扫描。格子按 order 依次点亮并写入值，一次。
   o={rows,cols,x,y,cs, val:fn(i,j), order:[[i,j]..], cls:fn(i,j), step} */
function sweepGrid(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150, step=o.step||190;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    gS.append("rect").attr("class","gcell")
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
  }
  (o.order||[]).forEach(function(ij,rank){
    var i=ij[0], j=ij[1],
        cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2,
        delay=fast()?0:rank*step;
    var rc=gS.append("rect").attr("class","gcell "+((o.cls&&o.cls(i,j))||"hl"))
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    var tx=gN.append("text").attr("class","slbl ink")
      .attr("x",cx).attr("y",cy+5).attr("text-anchor","middle")
      .text(o.val?o.val(i,j):"");
    if(fast())return;
    rc.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
    tx.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
  });
  return {x0:x0,y0:y0,cs:cs,
          cx:function(j){return x0+j*cs+(cs-4)/2;},
          cy:function(i){return y0+i*cs+(cs-4)/2;}};
}

/* ── reveal ──
   演示什么：一组元素之间的<b>因果或时间顺序</b>（先有这个，才有那个）。
   用于：信用分配里奖励回传的路径、推导步骤的先后。
   sel 是 d3 选择集，按数据顺序依次淡入，一次。 */
function reveal(sel,step){
  if(fast())return sel.attr("opacity",1);
  return sel.attr("opacity",0).transition().duration(340)
            .delay(function(d,i){return i*(step||240);}).attr("opacity",1);
}

      note("差别在「冻不冻」",640,420,"y");
      setCap("目标网络的第二份是<b>过时的</b>；Double DQN 的第二份是<b>同样新的</b>。");
    },"把两者的结构摊开。  <b>目标网络</b>：主权重 w 每步更新，另一份 w⁻ 被<b>冻结</b>，每 C 步（讲座里提到过几十个回合的量级）才同步一次。它的第二份权重是<b>过时的</b>。  <b>Double DQN</b>：两份权重地位<b>对称</b>，每一步随机挑一份来选动作、另一份来报值，然后只更新被选中的那份。两份都在持续更新，<b>都是新的</b>。  这个结构差别直接决定了信息传播的速度——下一镜说清楚。");
  /* 主体 */
  S(290,function(){
      clearScene();setBig(null);setEq(null);
      note("目标网络：等 C 步",400,290,"r lg");
      note("Double：立刻可用",880,290,"g lg");
      note("解耦的代价不同",640,400,"y lg");
      setCap("目标网络用<b>信息延迟</b>换解耦；Double DQN <b>不付这个代价</b>。");
    },"目标网络的代价是<b>信息延迟</b>：你刚学到的东西，要等到下次同步才会进入目标，最长要等 C 步。C 越大越稳，但学得越慢——L6 第七集说过这是一个真实的取舍。  Double DQN 没有这个代价：两份权重都在持续更新，任何一步学到的东西<b>立刻</b>可以被另一份用上。它仅仅是换了一下「谁选、谁评」的角色。  所以准确的对照是：  <b>目标网络</b>治的是「目标非平稳」这个病（L6 第七集），代价是延迟。 <b>Double DQN</b> 治的是「最大化偏差」这个病（L4 第八集），代价几乎为零——它只要求两份权重，而 DQN 本来就有。  两件事可以、而且通常<b>同时</b>使用。");
  /* 反驳 */
  S(302,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:270,gap:300,items:[
      {label:"目标网络",sub:"治目标非平稳",state:"on"},
      {label:"Double DQN",sub:"治最大化偏差",state:"on"},
      {label:"同时用",sub:"两个病不一样",state:"on"}]});
      note("别记成同一件事",640,420,"y");
      setCap("<b>指名反驳</b>：一个治<b>目标漂移</b>，一个治<b>偏差</b>。病不同，代价也不同。");
    },"指名回去：两者都用两份权重、都造成解耦，但它们治的是两个不同的病。  <b>目标网络</b>——病是目标非平稳（L6 第七集），手段是冻结，代价是信息延迟 C 步。 <b>Double DQN</b>——病是最大化偏差（L4 第八集），手段是对称的两份权重每步互换角色，代价接近于零。  把它们记成一件事的坏处很具体：你会以为「已经有目标网络了，所以偏差问题也解决了」。不是——目标网络的那个 max 仍然在同一份权重上取，最大化偏差原封不动。  这也是 L6 第九集那条判别法的一次应用：<b>看到一个机制时，先问它治的是哪个已命名的病</b>。");
  SUM(254,1,{h:"目标网络与 Double DQN 治的是两个不同的病",
    k:"<b>目标网络</b>：第二份权重 w⁻ <b>冻结</b> C 步 ⟹ 代价是信息延迟；<b>Double DQN</b>：两份<b>对称、可每步互换</b> ⟹ 几乎零代价。",
    m:"两者都造成「选动作」与「评动作」解耦，但目标网络的第二份是<b>过时的</b>，Double 的第二份是<b>同样新的</b>。",
    w:"<s>误解</s>：「有目标网络了，偏差问题也就解决了」。目标网络的 max 仍在同一份权重上取，<b>最大化偏差原封不动</b>。",
    e:"字幕：DQN 目标应读作 <b>r_t+γ·max_a Q(s_{t+1},a;w⁻) − Q(s_t,a_t;w)</b>；全篇「queuing network」是 <b>Q-network</b>。"});
  QUIZ(254,1,{t:"Double DQN 与固定 Q 目标（目标网络）最主要的结构差别是什么？",
    o:["Double DQN 用三份权重","<b>目标网络的第二份权重被冻结 C 步（信息有延迟），Double DQN 的两份对称、可每步互换（无延迟）</b>","Double DQN 不需要经验回放","目标网络只用于 SARSA，Double DQN 只用于 Q-learning"],
    a:1,
    w:"两者都造成解耦，差别在第二份权重<b>是不是过时的</b>：目标网络的 w⁻ 冻结 C 步，所以刚学到的东西要等到下次同步才进入目标；Double DQN 的两份地位对称、都在持续更新，任何一步学到的立刻可用。对应地，它们治的病也不同 —— 目标漂移 vs 最大化偏差，通常<b>同时</b>使用。<s>三份权重</s>是事实错误。<s>「不需要回放」</s>无关，两者都可搭配回放。<s>「只用于 SARSA」</s>也不对：目标网络是 DQN 的组件，而 DQN 是 Q-learning。"});
});

KP("2 · dueling 的 (V, A) 分解<b>不唯一</b> —— 必须定规范",function(){
  /* 钩子 */
  S(737,function(){
      clearScene();setBig(null);
      setEq("$$Q(s,a)=V(s)+A(s,a)$$","top");
      note("两条流，合成一个 Q",640,300,"b lg");
      note("网络只被 Q 监督",640,360,"r lg");
      setCap("dueling 把头拆成 V 与 A 两路。<b>但训练信号只作用在合起来的 Q 上。</b>");
    },"dueling 网络把输出头拆成两路：一路估 V(s)，一路估优势 A(s,a)，相加得到 Q。  动机是 L6 第九集说过的：很多状态下选哪个动作都差不多，但 V(s) 差别很大；把共同的那部分抽进 V，所有动作可以共享它的学习。  但这里有一个立刻要面对的问题：<b>训练信号只作用在合起来的 Q 上</b>。没有任何数据直接告诉网络「这个状态的 V 应该是多少」。  那网络怎么知道该把多少算进 V、多少算进 A？");
  /* 错误答案 */
  S(749,function(){
      clearScene();setEq(null);
      setBig("网络自己会学出来","反正 V 和 A 各有各的含义");
      setCap("它<b>学不出来</b> —— 因为有无穷多组 (V, A) 给出同一个 Q。");
    },"这个错误模型来自深度学习里一个常见的乐观：只要结构设计对了，网络会自己找到有意义的分解。  在这里它不成立，而且原因是<b>数学上的</b>，不是训练不够：给 V 加一个常数 c、同时给 A 减去 c，<b>Q 完全不变</b>。于是有无穷多组 (V, A) 对应同一个 Q，而训练信号只看得见 Q。  这叫<b>不可辨识</b>（unidentifiable）。网络不是学不好，是<b>没有唯一解可学</b>——它会随便落在那条直线上的某一点，而那一点的 V 不代表状态价值，A 也不代表优势。  于是 dueling 的全部动机就落空了：你拆成两路本来是为了让 V 被共享，可如果 V 里装的是任意一个偏移，共享的就是噪声。");
  /* 铺陈 */
  S(761,function(){
      clearScene();setBig(null);
      setEq("$$(V+c)+(A-c)=V+A=Q \\qquad \\forall c$$","top");
      note("整条直线都给同一个 Q",640,310,"r lg");
      setCap("不可辨识：<b>加一个常数再减掉</b>，Q 一个字节都不变。");
    },"把它写出来就一行：(V + c) + (A − c) = V + A = Q，对任意常数 c 都成立。  所以 (V, A) 的解不是一个点，是<b>一整条直线</b>。训练只约束了它们的<b>和</b>，没有约束它们各自。  这里必须把讲座里混在一起的两件事拆开。她在说完这个不变性之后，紧接着说「你可以把奖励平移一个常数，策略不变、值函数会变」。<b>那是另一回事</b>：  <b>奖励平移</b>说的是环境层面——R + c 不改变最优策略，但改变 V。 <b>(V, A) 不可辨识</b>说的是网络参数化层面——同一个 Q 有无穷多组 (V, A)。  两者都是「加常数」，但一个关于 MDP，一个关于表示，不能互相推出。");
  /* 主体 */
  S(773,function(){
      clearScene();setBig(null);
      setEq("$$Q(s,a)=V(s)+A(s,a)-\\max_{a'}A(s,a')$$","top");
      note("强制最优动作的 A = 0",640,300,"g lg");
      note("直线上钉死一个点",640,360,"y lg");
      setCap("解法是<b>定规范</b>：强制 <b>A(s, a*) = 0</b>，于是 V(s) 就等于 max_a Q(s,a)。");
    },"解法是人为加一个约束，把那条直线上的点<b>钉死一个</b>。这在物理里叫定规范（gauge fixing）。  标准做法是要求<b>贪心动作的优势为零</b>：A(s, a*) = 0。实现成一行就是 Q = V + A − max_{a′} A(s,a′)。  代进去就能看出它恢复了两者的含义：此时 <b>V(s) = max_a Q(s,a)</b>，也就是状态的最优值；而 <b>A(s,a) = Q(s,a) − max_a Q</b>，是这个动作相对最优动作差多少。两者都变回了有意义的量。  论文里还给了一个启发式替代：把 max 换成<b>均值</b>，即减去 A 在动作上的平均。它牺牲了上面那个干净的解释（V 不再恰好是 max Q），但实践中更稳定，因为均值比 max 对噪声不敏感。  按约定标一处记号：讲座在陈述这条约束时说「force the advantage for state and action to be zero if A is the action taken」——这里的 <b>A 指的是动作</b>，而两句话之前的 A 是优势函数。同一个字母，两个含义。");
  /* 反驳 */
  S(785,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:270,gap:300,items:[
      {label:"不加约束",sub:"无穷多组 (V,A)",state:"dead"},
      {label:"减 max A",sub:"V = max Q，含义恢复",state:"on"},
      {label:"减均值 A",sub:"启发式 · 更稳",state:"on"}]});
      note("这不是训练问题",640,420,"y");
      setCap("<b>指名反驳</b>：不是网络学不好，是<b>没有唯一解可学</b> —— 必须人为定规范。");
    },"指名回去：网络<b>不可能</b>自己学出有意义的 (V, A)，因为训练信号只约束它们的和，而同一个和有无穷多种拆法。这是不可辨识，不是欠训练。  解法必须是人为的：减去 max A（严格，使 V = max Q）或减去均值 A（启发式，更稳）。  这条经验可以迁移。<b>每当你把一个被监督的量拆成几个不被单独监督的部分时，先问一句：这个分解唯一吗？</b>如果不唯一，你就必须自己补一个约束，否则拆分带来的好处会被任意偏移吃掉。这在表示学习、多头网络、以及后面几讲的 actor-critic 里会反复出现。  最后重复一次那个必须拆开的混淆：<b>奖励平移不变</b>（R+c 不改最优策略）与 <b>(V,A) 不可辨识</b>是两件独立的事，讲座把它们说在了一起。");
  SUM(737,2,{h:"(V, A) 分解不唯一 —— 必须人为定规范",
    k:"(V+c)+(A−c)=Q 对<b>任意 c</b> 成立 ⟹ 解是一整条直线。训练只约束<b>和</b>，不约束各自。",
    m:"定规范：<b>Q = V + A − max_{a′}A</b> 强制 A(s,a*)=0，于是 <b>V(s)=max_a Q(s,a)</b>，含义恢复；减均值是更稳的启发式。",
    w:"<s>误解</s>：「网络自己会学出有意义的 V 和 A」。这是<b>不可辨识</b>，不是欠训练 —— 没有唯一解可学。",
    e:"讲座把两件事混在一起：<b>奖励平移不变</b>（R+c 不改最优策略，属 MDP 层面）与 <b>(V,A) 不可辨识</b>（属表示层面）。"});
  QUIZ(737,2,{t:"dueling 网络为什么必须人为加上「减去 max A」或「减去均值 A」？",
    o:["为了让梯度数值稳定","<b>因为 (V+c)+(A−c)=Q 对任意 c 成立，(V,A) 不可辨识，训练只约束它们的和</b>","为了让 A 的取值落在 [0,1]","因为 Q 必须非负"],
    a:1,
    w:"训练信号只作用在合起来的 Q 上，而给 V 加常数、给 A 减同一个常数时 Q 完全不变 —— 解是<b>一整条直线</b>而不是一个点。这是<b>不可辨识</b>，再训练多久也定不下来。加约束 A(s,a*)=0（即 Q=V+A−max A）把点钉死，此时 V(s)=max_a Q(s,a)，含义恢复。<s>数值稳定</s>是减均值那个启发式的<b>副作用</b>，不是引入约束的理由。<s>「A 落在 [0,1]」</s>与<s>「Q 非负」</s>都不是任何一条要求 —— Q 和 A 都可以是负的。"});
});

KP("3 · 探索在最坏情况下很贵，所以去找<b>别的监督信号</b>",function(){
  /* 钩子 */
  S(998,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:290,gap:290,items:[
      {label:"Double DQN",sub:"修偏差",state:"on"},
      {label:"优先回放",sub:"修效率",state:"on"},
      {label:"dueling",sub:"修数据利用",state:"on"},
      {label:"Montezuma",sub:"仍然不会玩",state:"dead"}]});
      note("三个改动都没碰探索",640,430,"r");
      setCap("Rainbow 把这些叠起来收益近似可加 —— <b>而 Montezuma 依然没被解决</b>。");
    },"L6 最后那三个改动——Double DQN、优先回放、dueling——各修一个已命名的病，而 Rainbow 的实验说明它们的收益大体是<b>可加</b>的：叠起来确实更好。  但有一个游戏一直不动：<b>Montezuma's Revenge</b>。讲座点名说这些方法「没有一个真正在处理探索」。  这不是巧合。三个改动分别针对偏差、样本效率、数据利用——<b>没有一个改变智能体去哪里收集数据</b>。而 Montezuma 的困难恰恰在于：随机乱走几乎永远拿不到第一个奖励。  于是这一讲的后半段从一个新问题开始：既然探索这么贵，有没有<b>别的监督信号</b>？");
  /* 错误答案 */
  S(1010,function(){
      clearScene();setEq(null);
      setBig("探索只是慢一点","ε 开大些、多跑几轮总能找到");
      setCap("这在小的表格问题上成立。<b>而最坏情况下有下界，不是慢，是贵。</b>");
    },"这个错误模型来自前几讲的经验：在火星车那样的小问题上，ε-greedy 加上足够多的回合确实能走遍所有 (s,a)。L4 第五集甚至证明了 GLIE 下这件事一定会发生。  问题是「一定会发生」和「多久发生」是两回事。  表格 MDP 的样本复杂度<b>下界</b>说明：在最坏情况下，要保证学到近似最优的策略，所需的样本数随状态数与动作数增长，而且没有任何算法能绕过这个下界。这不是某个算法笨，是<b>问题本身的代价</b>。  而 Montezuma 这类任务更糟：奖励极其稀疏，随机策略拿到第一个正奖励的概率小到可以忽略。<b>你连能学的信号都没有。</b>");
  /* 铺陈 */
  S(1022,function(){
      clearScene();setBig(null);setEq(null);
      note("奖励",400,280,"y lg");
      note("示范",880,280,"g lg");
      note("两种监督信号",640,400,"ink lg");
      setCap("于是问一个新问题：<b>除了奖励，还有什么能当监督？</b>");
    },"既然探索很贵，自然的问题是：<b>还有别的监督信号吗？</b>  前六讲的监督信号只有一种：<b>奖励</b>。智能体自己去试，环境给分，从分里学。探索的代价就是从这个设定来的——你得自己把好的行为撞出来。  这一讲给的另一种是<b>示范</b>：有人已经会做这件事，把他做的轨迹给你看。  这个换位带来的好处很直接：你不需要自己撞出好行为，它已经在数据里了。而它带来的新问题——以及这一讲后面六集的全部内容——是：<b>看着别人做，和自己会做，中间隔着什么？</b>");
  /* 主体 */
  S(1034,function(){
      clearScene();setBig(null);setEq(null);
      note("状态空间 · 动作空间",400,270,"g lg","start");
      note("转移 · 奖励函数",400,340,"r lg","start");
      note("专家轨迹",400,410,"g lg","start");
      setCap("示范学习的设定：<b>有</b>状态动作空间与专家轨迹，<b>没有</b>转移和奖励。");
    },"把这一讲后半段的设定写清楚，因为它和前六讲都不同。  <b>已知</b>：状态空间、动作空间，以及一组来自<b>假定最优</b>的老师的轨迹。  <b>未知</b>：转移动力学（和 L3 起一样），以及——这是新的——<b>奖励函数</b>。  注意最后这一条有多重。前六讲里奖励一直是问题定义的一部分（L1 第八集专门讲过 γ 和奖励是问题定义而非超参数）。现在它被拿走了，所以你甚至说不出「这个策略有多好」。  还有一个假设要点名：<b>老师被假定是最优的</b>。这个假设在真实数据上几乎总是不成立（人类示范有噪声、不一致、有时次优），而这一讲的分析全部建立在它之上。这是一处需要记住的前提。");
  /* 反驳 */
  S(1046,function(){
      clearScene();setBig(null);setEq(null);
      note("探索：自己撞出好行为",400,290,"r lg");
      note("示范：好行为已在数据里",880,290,"g lg");
      note("换掉的是监督来源",640,400,"y lg");
      setCap("<b>指名反驳</b>：探索不是「慢一点」，它有下界。示范换掉的是<b>监督的来源</b>。");
    },"指名回去：探索不是速度问题，它在最坏情况下有<b>样本复杂度下界</b>，而在稀疏奖励任务上你甚至拿不到可学的信号。Rainbow 那些改动一个都没碰它——Montezuma 就是证据。  示范提供的是<b>另一种监督来源</b>：好的行为不需要你撞出来，它已经在数据里。  但这不是免费的。接下来六集会看到它引入的三个新问题：  <b>分布偏移</b>——你只见过专家去过的状态，而你自己会走到别处（第五、六集）。 <b>奖励不可辨识</b>——从行为反推奖励没有唯一解（第九集）。 <b>老师最优这个假设</b>——它在真实数据上基本不成立。  下一集先把三条技术路线分开。");
  SUM(998,3,{h:"探索有下界，所以去找另一种监督：示范",
    k:"表格 MDP 的样本复杂度<b>下界</b>说明最坏情况下探索本身就贵；稀疏奖励任务（Montezuma）连可学的信号都拿不到。",
    m:"Rainbow 的三个改动（偏差 / 效率 / 数据利用）<b>没有一个改变智能体去哪里收集数据</b>，所以对探索无效。",
    w:"<s>误解</s>：「探索只是慢一点，ε 开大、多跑就行」。GLIE 保证的是<b>一定会</b>，不是<b>多久</b>。",
    e:"新设定：<b>已知</b>状态/动作空间与专家轨迹，<b>未知</b>转移与<b>奖励函数</b>。并假定<b>老师是最优的</b> —— 真实数据上几乎不成立。"});
  QUIZ(998,3,{t:"为什么 Double DQN、优先回放、dueling 都没能解决 Montezuma's Revenge？",
    o:["因为这个游戏的动作空间太大","<b>因为三者分别修偏差、效率、数据利用，没有一个改变智能体去哪里收集数据</b>","因为网络容量不够","因为它的状态不满足 Markov 性"],
    a:1,
    w:"三个改动各修一个已命名的病 —— 最大化偏差、样本效率、数据利用 —— 但<b>没有一个改变探索行为</b>，而 Montezuma 的困难是随机策略几乎拿不到第一个正奖励，<b>连可学的信号都没有</b>。<s>动作空间太大</s>是事实错误：Atari 的动作都在 4–18 之间。<s>网络容量</s>不是瓶颈，同一架构在别的游戏上超过人类。<s>Markov 性</s>确实<b>也</b>是这个游戏的问题（L6 第四集讲过四帧编码不了钥匙），但那是另一条独立的困难 —— 即使状态完全可观测，稀疏奖励下的探索问题依旧存在。"});
});

KP("4 · 从示范学的三条路：学 π / 学 R / 学 R 再规划",function(){
  /* 钩子 */
  S(1535,function(){
      clearScene();setBig(null);setEq(null);
      note("手上只有轨迹",640,280,"b lg");
      note("没有奖励，也没有模型",640,350,"r lg");
      setCap("专家轨迹到手了。<b>接下来学什么？</b>这里有三条不同的路。");
    },"设定已经定下来：你有一组专家轨迹，没有奖励函数，也没有转移模型。  接下来的问题是：<b>你要从这些数据里学出什么？</b>  有三个可能的答案，而它们通向三条技术路线。这一集把它们分开，因为选哪一条决定了你学到的东西<b>能不能搬到别的地方去用</b>。");
  /* 错误答案 */
  S(1547,function(){
      clearScene();setEq(null);
      setBig("都是从示范里学","叫法不同而已，差别不大");
      setCap("三条路学的是<b>三个不同的对象</b>，可迁移性差别很大。");
    },"把三条路当成同一件事的不同叫法，是最省事的读法，而且名字确实容易混：模仿学习、行为克隆、逆强化学习、学徒学习。  但它们学的是<b>三个不同的对象</b>：一个学策略，一个学奖励，一个学奖励之后再去规划。  差别的实际后果只有一条，但很重：<b>你学到的东西，在环境变了之后还能不能用。</b>");
  /* 铺陈 */
  S(1559,function(){
      clearScene();setBig(null);setEq(null);
      note("行为克隆：直接学 π",360,260,"b lg","start");
      note("逆强化学习：学 R",360,340,"g lg","start");
      note("学徒学习：学 R 再规划",360,420,"v lg","start");
      setCap("三条路：<b>学 π</b> · <b>学 R</b> · <b>学 R 然后用它规划出 π</b>。");
    },"三条路。  <b>行为克隆</b>：把 (状态, 专家动作) 当成 (输入, 标签)，直接监督学习出一个策略。最直接，也最快。  <b>逆强化学习</b>：不学策略，学<b>奖励函数</b>——反过来问「什么样的 R 会让专家的行为成为最优」。  <b>学徒学习</b>：先用逆强化学习恢复 R，再拿这个 R 去做正向的规划或强化学习，得到策略。它是前两者的串联。  讲座提到最后这一步「往往就是把它接到一个正向 RL 上」。所以实质上是两类：<b>学策略</b>还是<b>学奖励</b>。");
  /* 主体 */
  S(1571,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"学到 π",sub:"动力学一变就失效",state:"dead"},
      {label:"学到 R",sub:"换环境仍可重新规划",state:"on"},
      {label:"代价",sub:"R 更难学，且不唯一",state:"dead"}]});
      note("差别在可迁移性",640,420,"y");
      setCap("<b>奖励比策略更可迁移</b>：策略绑在动力学上，奖励不绑。");
    },"为什么值得绕远路去学奖励？因为<b>奖励比策略更可迁移</b>。  策略是「在什么状态做什么动作」，它把<b>意图</b>和<b>动力学</b>焊在了一起。换一辆车、换一个地形、换一组传感器，同一个策略立刻失效——即使你的意图完全没变。  奖励只编码<b>意图</b>：「撞车很糟、到得快很好」。动力学变了，这句话还是对的，你只要在新动力学上重新规划一次。  这就是学徒学习绕这一圈的全部理由，也是 Ng 与 Russell 在 2000 年那篇逆强化学习论文的动机之一。  代价同样要说清：<b>R 比 π 难学得多，而且解不唯一</b>——第九集会看到 R ≡ 0 能解释任何行为。所以这条路不是免费的升级。");
  /* 反驳 */
  S(1583,function(){
      clearScene();setBig(null);setEq(null);
      note("学 π：快，但绑在动力学上",360,290,"b lg","start");
      note("学 R：慢，但编码的是意图",360,370,"g lg","start");
      setCap("<b>指名反驳</b>：三条路学的是三个对象，选择取决于<b>你要不要迁移</b>。");
    },"指名回去：三条路不是同一件事的不同叫法，它们学的是三个不同的对象，而选择的依据是一个很实际的问题——<b>你需不需要把学到的东西搬到别的环境去</b>。  <b>只在同一个环境里复现专家</b>：行为克隆最直接，而且下一集会看到它就是监督学习，工具链是现成的。  <b>要换环境、换机器人、换地形</b>：必须学奖励，否则每换一次都要重新收集示范。  接下来三集（第五到第七集）追行为克隆这条路，因为它的失败方式是这一讲最有价值的内容；第八、第九集再回到逆强化学习。");
  SUM(1535,4,{h:"三条路学三个对象，差别在可迁移性",
    k:"<b>行为克隆</b>学 π；<b>逆强化学习</b>学 R；<b>学徒学习</b>学 R 再规划出 π（实质是前两者串联）。",
    m:"<b>策略把意图与动力学焊在一起</b>，换环境即失效；<b>奖励只编码意图</b>，换环境后重新规划即可。",
    w:"<s>误解</s>：「都是从示范学，叫法不同」。选择依据是一个实际问题：<b>要不要迁移</b>。",
    e:"学 R 不是免费升级：它<b>更难学且解不唯一</b>（第九集：R ≡ 0 能解释任何行为）。"});
  QUIZ(1535,4,{t:"为什么学徒学习要绕一圈先恢复奖励函数，而不是直接克隆策略？",
    o:["因为奖励函数比策略更容易从数据里估计","<b>因为奖励只编码意图，动力学变了仍然有效；策略把意图和动力学焊在一起</b>","因为行为克隆需要知道转移模型","因为奖励函数的解是唯一的"],
    a:1,
    w:"策略说的是「在什么状态做什么动作」，一旦换车、换地形、换传感器就失效；奖励说的是「什么算好」，动力学变了这句话依然成立，只需在新动力学上重新规划。<s>「更容易估计」</s>正好相反：R 比 π 难学得多。<s>「行为克隆需要转移模型」</s>是事实错误 —— 行为克隆是纯监督学习，不需要模型。<s>「奖励的解唯一」</s>更是反的，这正是第九集的主题：<b>R ≡ 0 就能解释任何行为</b>，逆强化学习必须外加准则才能定解。"});
});

KP("5 · 行为克隆就是监督学习 —— 然后它在第一次犯错时坏掉",function(){
  /* 钩子 */
  S(1599,function(){
      clearScene();setBig(null);
      setEq("$$\\{(s_1,a_1),(s_2,a_2),\\ldots\\}\\ \\longrightarrow\\ \\text{supervised learning}$$","top");
      note("状态当输入，动作当标签",640,310,"b lg");
      setCap("行为克隆没有任何新东西：<b>它就是一个分类（或回归）问题</b>。");
    },"行为克隆的做法一句话说完：把专家轨迹拆成 (状态, 动作) 对，状态当输入，动作当标签，训练一个分类器（离散动作）或回归器（连续动作）。  <b>一个强化学习的概念都没用到</b>：没有值函数，没有 Bellman 方程，没有探索，没有折扣。整套监督学习的工具链——交叉熵、数据增强、正则化——直接可用。  这个简单性是真实的优势。它也是为什么在很多工业系统里，行为克隆是第一个被尝试的方法。  然后它会以一种很特别的方式坏掉，而那个坏法是这一讲的主要内容。");
  /* 错误答案 */
  S(1611,function(){
      clearScene();setEq(null);
      setBig("那误差界直接能用","监督学习的理论都是现成的");
      setCap("监督学习的保证有一个<b>前提</b>，而那个前提在 MDP 里会被打破。");
    },"既然它就是监督学习，那把监督学习的泛化界搬过来，似乎顺理成章：训练得好、泛化得好，每步的错误率 ε 很小，整体自然就好。  这个推理漏掉了监督学习那条保证的<b>前提</b>，而这个前提在监督学习里从来不需要特别强调，因为它默认成立。  前提是：<b>测试数据和训练数据来自同一个分布</b>。  在图像分类里这条通常成立（你从同一批数据里划训练测试）。在 MDP 里它<b>不成立</b>，而且是被你自己打破的。");
  /* 铺陈 */
  S(1623,function(){
      clearScene();setBig(null);setEq(null);
      note("训练分布：专家去过的状态",360,280,"g lg","start");
      note("测试分布：你自己会到的状态",360,360,"r lg","start");
      setCap("训练数据来自<b>专家的</b>状态分布，而你要在<b>自己的</b>状态分布上工作。");
    },"把两个分布写清楚。  <b>训练分布</b>：专家走出来的那些状态。专家开得好，所以这些状态基本都是「车在路中间」这类正常情形。  <b>测试分布</b>：<b>你自己的策略</b>走出来的状态。只要你和专家有一点不同，你到达的状态分布就和专家的不一样。  关键在于这个偏差是<b>自我强化</b>的：你走偏一点 → 到了专家没去过的状态 → 那里你没有训练数据 → 更容易再错 → 偏得更远。  这不是过拟合。<b>即使你在训练分布上泛化得完美</b>，这个机制照样发生——因为问题出在你被带到了训练分布<b>之外</b>。");
  /* 主体 */
  S(1635,function(){
      clearScene();setBig(null);setEq(null);
      mdpChain({n:5,y:280,r:26,x:340,gap:150,
      label:function(i){return i<2?"✓":"?";},
      cls:function(i){return i<2?"g":"r";},
      arcs:[[0,1,"","g",0],[1,2,"一次错","r",0],[2,3,"","r",0],[3,4,"","r",0]]});
      note("从这里起没有数据",640,392,"r");
      setCap("一次错误就把你推出专家的分布，<b>之后的每一步都在没有数据的区域里</b>。");
    },"画出来就是这样：前两步你和专家一致，第三步犯了一次错，从此进入专家从未到过的状态。  在那之后，你的分类器面对的是<b>训练时没见过的输入</b>。它仍然会输出一个动作，而且往往还很自信——但那个输出没有任何保证支撑。  最常被引用的例子是自动驾驶的行为克隆：专家从不把车开到路肩上，所以数据里没有「车在路肩上该怎么办」。模型一旦偏出去一点，就进入了一个它完全没有训练信号的区域，而<b>正确的恢复动作恰恰只在那里才需要</b>。  注意这个失败的形状：<b>数据最缺的地方，恰好是最需要正确动作的地方</b>。这不是巧合，是专家最优这个前提的直接推论——专家不犯错，所以没有犯错后的数据。");
  /* 反驳 */
  S(1647,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"不是过拟合",sub:"训练分布上可以完美",state:"on"},
      {label:"是分布偏移",sub:"被推到分布之外",state:"dead"},
      {label:"而且自我强化",sub:"越偏越没数据",state:"dead"}]});
      note("这是 MDP 特有的",640,420,"y");
      setCap("<b>指名反驳</b>：监督学习的保证是<b>同分布</b>的，而 MDP 让你自己走出那个分布。");
    },"指名回去：监督学习的误差界不能直接搬，因为它的前提是<b>训练与测试同分布</b>，而在 MDP 里<b>你的动作决定了你会到达哪些状态</b>——你自己把自己带出了训练分布。  三件事要分清楚：  这<b>不是过拟合</b>。哪怕你在专家分布上的泛化是完美的，一旦偏出去仍然没有保证。 这<b>是分布偏移</b>，而且是由你自己的策略造成的。 这<b>会自我强化</b>：越偏越没数据，越没数据越偏。  这也是监督学习和强化学习之间最本质的一条区别，而 L1 第一集那个「序贯」正是在说这件事：<b>你的动作影响你接下来看到的数据</b>。  下一集把这个偏移的代价<b>算出来</b>——它比直觉大得多。");
  SUM(1599,5,{h:"行为克隆就是监督学习 —— 而监督学习的保证是同分布的",
    k:"训练分布 = <b>专家</b>去过的状态；测试分布 = <b>你自己</b>会到达的状态。一次犯错就把你推到后者里去。",
    m:"偏移<b>自我强化</b>：走偏 → 进入没数据的区域 → 更容易再错 → 偏得更远。",
    w:"<s>误解</s>：「它是监督学习，所以误差界直接能用」。漏掉的前提是<b>训练与测试同分布</b>。",
    e:"<b>不是过拟合</b> —— 即使在专家分布上泛化完美也照样发生。失败的形状是：<b>数据最缺的地方恰是最需要正确动作的地方</b>。"});
  QUIZ(1599,5,{t:"行为克隆失败的根本原因是什么？",
    o:["模型过拟合了专家数据","<b>分布偏移：训练数据来自专家的状态分布，而执行时你走在自己的状态分布上</b>","专家数据量总是不够","动作标签有噪声"],
    a:1,
    w:"监督学习的保证要求<b>训练与测试同分布</b>，而在 MDP 里你的动作决定了你会到达哪些状态 —— 一次犯错就把你推到专家从未到过的区域，那里没有训练信号，于是更容易再错，<b>偏移自我强化</b>。<s>过拟合</s>不是原因：即使在专家分布上泛化完美，偏出去之后依然没有保证。<s>数据量</s>也不是 —— 再多专家数据也仍然只覆盖专家的分布（下一集会看到 DAgger 要的正是<b>不同分布</b>的数据而非更多数据）。<s>标签噪声</s>是另一个独立问题，而且这一讲假定专家是最优的。"});
});

KP("6 · εT 变成 εT²：一次错误的代价是<b>剩下的整条轨迹</b>",function(){
  /* 钩子 */
  S(1900,function(){
      clearScene();setBig(null);
      setEq("$$\\varepsilon=0.01,\\qquad T=100$$","top");
      note("每步错 1%",640,300,"b lg");
      note("整条轨迹代价多少",640,360,"y lg");
      setCap("每步 1% 的错误率，跑 100 步。<b>总代价是多少？</b>");
    },"把上一集那个分布偏移的代价算出来。  设定很简单：策略在专家分布上的每步错误率是 ε = 0.01，也就是 1%；任务的时域 T = 100 步。  问题是：相比专家，这个策略总共差多少？  这一集的全部内容就是这个数，因为它比几乎所有人的直觉都大。");
  /* 错误答案 */
  S(1912,function(){
      clearScene();setEq(null);
      setBig("εT = 1 次错","1% 乘 100 步，就这么简单");
      setCap("这是<b>监督学习</b>的算法 —— 它默认每一步的错误<b>互不影响</b>。");
    },"最自然的算法是 εT：每步 1%，100 步，期望错 1 次。  这个算法在<b>监督学习</b>里是对的：一百张图片各自独立分类，1% 错误率就是期望错一张。错了第 7 张，不影响第 8 张。  它在 MDP 里错在哪：<b>每一步的错误不是独立的</b>。第 7 步错了，第 8 步就在一个不同的、没有数据的状态上做决策。  上一集已经把机制说清楚了。这一集把它的<b>代价</b>算出来。");
  /* 铺陈 */
  S(1924,function(){
      clearScene();setBig(null);
      setEq("$$J(\\pi)-J(\\pi^*)\\;\\le\\;\\varepsilon\\sum_{t=1}^{T}(T-t+1)\\;=\\;\\varepsilon\\,\\frac{T(T+1)}{2}$$","top");
      note("第 t 步错 → 毁掉 T−t+1 步",640,310,"r lg");
      setCap("一次错误的代价不是 1，是<b>剩下的整条轨迹</b>。");
    },"推导只有一步。  <b>在第 t 步犯一次错，代价不是 1，而是剩下的 T−t+1 步</b>——因为从那以后你就在分布之外，之后的每一步都可能是错的，而每一步最多损失 1。  在第 1 步犯错最贵，毁掉 T 步；在最后一步犯错最便宜，只毁掉 1 步。把每一步犯错的概率 ε 乘上它各自的代价再加起来：  ε·[T + (T−1) + … + 1] = <b>ε·T(T+1)/2</b>  这就是行为克隆的标准界，来自 Ross 与 Bagnell 的工作。注意它是 <b>O(εT²)</b>，而监督学习的直觉给的是 O(εT)。  多出来的那个 T，正是「一次错误会污染剩下整条轨迹」这件事。");
  /* 主体 */
  S(1936,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2],step:620,vals:[5.5,15.5,50.5],
      x:380,y:430,w:520,h:170,max:55,
      label:function(i){return ["T=10","T=30","T=100"][i];},
      cls:function(i){return i===2?"r":"v";},
      fmt:function(v){return "×"+v.toFixed(1);}});
      note("放大倍数 = (T+1)/2",640,466,"r");
      setCap("实际代价是监督直觉的多少倍：<b>T=100 时 50.5 倍</b>。");
    },"<b>看什么：</b>看柱子<b>一根比一根高多少</b>：放大倍数本身随 T <b>线性</b>增长（正好是 (T+1)/2）。时域越长，这个错误估得越离谱 —— 而长时域恰恰是 RL 的主场。　—— 把放大倍数算出来：εT(T+1)/2 除以 εT，正好是 <b>(T+1)/2</b>。  T=10 时放大 <b>5.5</b> 倍；T=30 时 <b>15.5</b> 倍；T=100 时 <b>50.5</b> 倍。  请注意这不是一个固定的倍数——<b>放大倍数本身随 T 线性增长</b>。所以任务越长，用 εT 估算就错得越离谱，而长时域恰恰是强化学习问题的常态。  再往下代一组：T=1000 时，监督直觉说 εT = 10，而实际界是 <b>5005</b>——差 500 倍。  具体地读这些数：ε=0.01、T=100 时，εT=1 意味着「一百步里大概错一步，基本还是专家水平」；而 50.5 意味着<b>这个策略可以和专家差出半条轨迹那么多</b>。两个结论完全不同，而它们来自同一个 1% 的错误率。");
  /* 反驳 */
  S(1948,function(){
      clearScene();setBig(null);setEq(null);
      note("O(εT)",400,290,"g lg");
      note("O(εT²)",880,290,"r lg");
      note("差的是阶，不是倍数",640,400,"y lg");
      setCap("<b>指名反驳</b>：εT 与 εT² 差的是<b>阶</b>。把 ε 减半救不了它。");
    },"指名回去：εT 是<b>监督学习</b>的账，它默认每步的错误互不影响。在 MDP 里一次错误会污染剩下的整条轨迹，账是 <b>ε·T(T+1)/2 = O(εT²)</b>。  最要紧的一点是：<b>两者差的是阶，不是倍数</b>。  这意味着「把模型做得更准一点」救不了它。你把 ε 从 0.01 压到 0.005，代价也只是从 50.5 降到 25.25，<b>T² 那一项还在</b>。要真正解决，你必须改变<b>数据从哪个分布来</b>——那正是下一集 DAgger 做的事，它把界压回 <b>O(εT)</b>。  顺带把 L1 那一集接上：L1 第一集讲「序贯」时说过同样的形状（那里也出现过 εT 与 εT(T+1)/2 这两个式子）。当时它是一个关于监督学习与强化学习差别的抽象说明；这里它变成了一个具体算法失败的定量解释。");
  SUM(1900,6,{h:"一次错误的代价是剩下的整条轨迹：εT 变 εT²",
    k:"第 t 步犯错毁掉 <b>T−t+1</b> 步 ⟹ J(π)−J(π*) ≤ ε·Σ(T−t+1) = <b>ε·T(T+1)/2</b>（Ross &amp; Bagnell）。",
    m:"放大倍数正好是 <b>(T+1)/2</b>，它<b>本身随 T 线性增长</b>：T=10 → 5.5×，T=30 → 15.5×，T=100 → <b>50.5×</b>，T=1000 → 500.5×。",
    w:"<s>误解</s>：「εT = 0.01×100 = 1 次错」。那是<b>监督学习</b>的账，它默认每步错误互不影响。",
    e:"差的是<b>阶</b>不是倍数：把 ε 减半只把 50.5 变成 25.25，<b>T² 还在</b>。必须改数据来自哪个分布（下一集）。"});
  QUIZ(1900,6,{t:"ε = 0.01、T = 100 的行为克隆，J(π*) − J(π) 的界大约是多少？",
    o:["1，即 εT","<b>50.5，即 ε·T(T+1)/2</b>","0.01，即 ε","100，即 T"],
    a:1,
    w:"第 t 步犯错会把你推出专家分布，之后 <b>T−t+1</b> 步都可能是错的，所以界是 ε·Σ_{t=1..T}(T−t+1) = ε·T(T+1)/2 = 0.01×100×101/2 = <b>50.5</b>。<s>εT = 1</s>是<b>监督学习</b>的账，它默认每步错误互不影响 —— 在 MDP 里不成立。<s>ε</s>只是单步错误率，没有乘时域。<s>T</s>是时域本身，与错误率无关。关键是 εT 与 εT² <b>差的是阶</b>：把 ε 减半只能把 50.5 降到 25.25，T² 那一项还在。"});
});

KP("7 · DAgger：要的不是更多数据，是<b>你自己分布上</b>的数据",function(){
  /* 钩子 */
  S(2292,function(){
      clearScene();setBig(null);setEq(null);
      note("病因：数据来自专家的分布",640,280,"r lg");
      note("而你走在自己的分布上",640,350,"r lg");
      setCap("诊断已经很清楚了。<b>那修法应该冲着哪一项去？</b>");
    },"两集下来，病因已经定得很死：训练数据来自<b>专家的</b>状态分布，而你执行时走在<b>自己的</b>状态分布上，一次犯错就跨出去，代价是 O(εT²)。  上一集末尾已经排除了一条路：<b>把 ε 做小救不了</b>，因为差的是阶。  所以修法只能冲着另一项去——<b>分布</b>。");
  /* 错误答案 */
  S(2304,function(){
      clearScene();setEq(null);
      setBig("多收集点专家数据","数据越多，覆盖越全");
      setCap("再多也没用：<b>专家的数据永远只覆盖专家的分布</b>。");
    },"最自然的反应是加数据。数据多了覆盖更全、ε 更小，看起来两头都在改善。  但请看它加的是<b>什么</b>数据：专家跑出来的轨迹。再收集一万条，它们<b>仍然全都落在专家的状态分布上</b>。  而你需要数据的地方，恰恰是专家<b>不会去</b>的那些状态——车偏到路肩上之后该怎么打方向。专家永远不会偏到那里，所以那里永远没有数据。  上一集那句话在这里变成了行动指南：<b>数据最缺的地方，恰好是最需要正确动作的地方</b>。加更多同分布的数据，一个字节都补不到那里。");
  /* 铺陈 */
  S(2316,function(){
      clearScene();setBig(null);setEq(null);
      note("① 用当前策略跑",360,250,"b lg","start");
      note("② 在这些状态上问专家",360,330,"g lg","start");
      note("③ 加进数据集，重训",360,410,"y lg","start");
      setCap("<b>DAgger</b>：让专家标注<b>你自己会到达的</b>那些状态。");
    },"DAgger（Dataset Aggregation）的做法是把数据的<b>来源分布</b>换掉。  <b>第一步</b>：用<b>当前的策略</b>去跑，记录它到达的状态——包括那些偏出去的、专家从不会到的状态。  <b>第二步</b>：把这些状态拿给专家，问「如果是你，在这里会怎么做」。注意专家<b>不需要真的走这条轨迹</b>，只需要在这些状态上给出动作。  <b>第三步</b>：把这些新的 (状态, 专家动作) 对<b>加进</b>数据集（不是替换），重新训练，然后回到第一步。  每一轮之后，数据集覆盖的分布都更接近<b>你自己策略的</b>分布，而标签始终来自专家。");
  /* 主体 */
  S(2328,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1],step:760,vals:[4.65,0.30],
      x:380,y:430,w:520,h:170,max:5.1,
      label:function(i){return ["行为克隆 εT(T+1)/2","DAgger O(εT)"][i];},
      cls:function(i){return i===0?"r":"g";},
      fmt:function(v){return v.toFixed(2);}});
      note("ε=0.01, T=30",640,466,"y");
      setCap("同样的 ε 与 T：界从 <b>4.65</b> 降到 <b>0.30</b>，而且<b>阶</b>从 T² 变回 T。");
    },"<b>看什么：</b>看右边那根<b>只剩一小截</b>：同样的错误率、同样的时域，只因为数据来自不同的分布。左边是 T² 那一项，右边没有它。　—— 把界代出来。ε=0.01、T=30 时，行为克隆的界是 ε·T(T+1)/2 = <b>4.65</b>；DAgger 是 O(εT) = <b>0.30</b>。  但重点不是这个倍数，是<b>阶</b>：DAgger 把 T² 变回了 T。所以 T 越大，差距越夸张——T=1000 时是 5005 对 10。  为什么能做到：因为训练分布和执行分布<b>被强行对齐了</b>。上一集那个「一次错误污染剩下整条轨迹」的机制，前提是「出界之后没有数据」；DAgger 把出界之后的数据也收了进来，那个机制就断了。  请注意它<b>没有</b>让策略不犯错——ε 还是 ε。它做的是让犯错之后不再失控。");
  /* 反驳 */
  S(2340,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"要的不是更多",sub:"是不同分布的数据",state:"on"},
      {label:"代价",sub:"专家必须能被反复询问",state:"dead"},
      {label:"且要标怪状态",sub:"人类在这上面很不可靠",state:"dead"}]});
      note("这一条最难满足",640,420,"r");
      setCap("<b>指名反驳</b>：要的不是更多数据，是<b>不同分布</b>的数据。");
    },"指名回去：修法不是加数据，是<b>换数据的来源分布</b>。这个区分是这一讲最可迁移的一条——<b>「数据量」和「数据来自谁的分布」是两个独立的旋钮</b>，而这里坏掉的是后一个。  但 DAgger 的代价必须说清楚，因为它常常是致命的。  <b>它要求一个可以被反复询问的交互式专家</b>。不是一批录好的轨迹，而是一个你随时能问「这个状态你会怎么做」的人或程序。在很多场景里这根本拿不到——历史日志就是死的。  <b>而且要标注的恰恰是怪状态</b>。人类专家在「车已经歪到路肩上」这种自己从没经历过的情形里，给出的动作往往犹豫、不一致，甚至是错的。你要的标签正好落在人类最不可靠的区域。  所以 DAgger 在理论上干净，在落地上受限于<b>能不能问到专家</b>。");
  SUM(2292,7,{h:"DAgger 要的不是更多数据，是不同分布的数据",
    k:"三步循环：<b>用当前策略跑 → 在它到达的状态上问专家 → 加进数据集重训</b>。界从 O(εT²) 压回 <b>O(εT)</b>。",
    m:"它<b>没有</b>让策略少犯错（ε 不变），而是让「出界之后没数据」这个机制断掉 —— 出界后的数据也被收了进来。",
    w:"<s>误解</s>：「多收集点专家数据」。再多也只覆盖<b>专家的</b>分布，而你缺的恰是专家<b>不会去</b>的状态。",
    e:"代价常常致命：要求<b>可反复询问的交互式专家</b>（死日志做不到），而且要标的正是<b>人类最不可靠</b>的怪状态。"});
  QUIZ(2292,7,{t:"DAgger 相对行为克隆，改变的关键是什么？",
    o:["用了更大的网络和更多专家轨迹","<b>标注的是「当前策略自己会到达的状态」，从而把训练分布对齐到执行分布</b>","在损失函数里加了正则项","把监督学习换成了强化学习"],
    a:1,
    w:"行为克隆的数据全部落在<b>专家</b>的状态分布上，而执行时你走在<b>自己</b>的分布上；DAgger 先用当前策略跑出轨迹、再请专家在<b>那些</b>状态上给动作，于是训练分布被对齐到执行分布，界从 O(εT²) 回到 <b>O(εT)</b>。<s>更大网络/更多轨迹</s>正是这一集反驳的那条 —— 再多同分布数据也补不到缺口。<s>正则项</s>治的是过拟合，而这里不是过拟合。<s>「换成强化学习」</s>不对：DAgger 每一轮仍然是监督学习，它要的是奖励之外的<b>专家标签</b>。"});
});

KP("8 · 逆强化学习的特征匹配：μ 是<b>特征</b>计数，不是状态分布",function(){
  /* 钩子 */
  S(2700,function(){
      clearScene();setBig(null);
      setEq("$$R(s)=w^{\\top}x(s) \\qquad \\mu(\\pi)=\\sum_t \\gamma^t x(s_t)$$","top");
      note("值就变成 wᵀμ",640,300,"g lg");
      note("于是可以只比 μ",640,360,"y lg");
      setCap("若奖励对特征<b>线性</b>，策略的值就写成 <b>wᵀμ(π)</b> —— 只剩一个向量要比。");
    },"回到逆强化学习。第一个可操作的想法是：假设奖励对特征<b>线性</b>，R(s) = wᵀx(s)。  这个假设让一切变得可算：策略的期望折扣回报变成 <b>wᵀμ(π)</b>，其中 μ(π) = Σ_t γ^t x(s_t) 的期望，叫<b>折扣特征计数</b>。  于是「让我的策略和专家一样好」这件事，被化简成「让我的 μ 和专家的 μ 接近」——<b>不需要知道 w 是多少</b>，因为只要 μ 相同，任何 w 下的值都相同。  这是 Abbeel 与 Ng 的学徒学习的核心。而这一段里讲座有三处需要更正，本集逐条处理。");
  /* 错误答案 */
  S(2712,function(){
      clearScene();setEq(null);
      setBig("匹配 μ 就等于策略相同","特征一样，行为当然一样");
      setCap("匹配 μ 只保证<b>线性奖励下的值</b>接近 —— 不保证策略相同。");
    },"这个错误模型来自对 μ 的一个误读：把它当成了「状态访问分布」。如果 μ 真是状态分布，那两个策略的 μ 相同确实接近于说它们在每个状态上行为相同。  但 <b>μ 不是状态分布</b>。它是一个<b>特征空间</b>的向量，维数等于特征数 k，而不是状态数。两个完全不同的策略，只要它们访问的状态在特征上<b>平均起来</b>一样，μ 就一样。  举个极端的例子：如果 x(s) 只有一维「离终点的距离」，那么「稳稳走过去」和「先冲后退再冲」只要平均距离相同，μ 就完全相同——而这两个策略显然不一样。  只有当 x 是状态的 <b>one-hot 编码</b>时，μ 才退化成（未归一化的）折扣状态分布，那时两者才接近等价。");
  /* 铺陈 */
  S(2724,function(){
      clearScene();setBig(null);setEq(null);
      note("μ 的维数 = 特征数 k",360,270,"y lg","start");
      note("不是状态数",360,340,"r lg","start");
      note("也没有 (1−γ) 归一化",360,410,"r lg","start");
      setCap("两处记号必须更正：μ <b>按特征编号</b>，而且它<b>不是概率分布</b>。");
    },"按约定把这一段的记号更正清楚，因为它们直接影响你读原始论文。  <b>第一，μ 是按特征编号的，不是按状态。</b>讲座把它说成「μ of s」，好像它是状态的函数。它的维数是 k = dim x(s)。只有当 x 是 one-hot 时两者才重合——而那正好是 L5 第六集那个让一切变简单的特例。  <b>第二，μ 不是概率分布。</b>讲座称它是「带折扣的平稳分布」。精确的对象是归一化折扣占用测度 d^π(s) = (1−γ)Σ_t γ^t P(s_t=s)，而 μ <b>没有那个 (1−γ) 的归一化</b>，所以它是一个未归一化的折扣特征计数，加起来不等于 1。  <b>第三，和 Sutton &amp; Barto 的符号会撞车</b>：S&amp;B 用 μ(s) 表示在策略状态分布、用 η(s) 表示期望访问次数，而这里 μ 是特征空间的量。在两边之间切换时这个字母最容易出错。");
  /* 主体 */
  S(2736,function(){
      clearScene();setBig(null);
      setEq("$$|w^{\\top}\\mu(\\pi)-w^{\\top}\\mu_E| \\le \\lVert w\\rVert\\,\\lVert \\mu(\\pi)-\\mu_E\\rVert$$","top");
      note("配对必须一致",640,300,"r lg");
      note("原文用 L2 / L2",640,360,"g lg");
      setCap("两个值的差被<b>范数乘积</b>控住 —— 但两个范数必须<b>配成一对</b>。");
    },"为什么匹配 μ 有用：两个策略的值之差是 |wᵀμ(π) − wᵀμ_E|，由不等式它被 ‖w‖·‖μ(π) − μ_E‖ 控住。所以只要把 μ 逼近到 ε 之内，且 w 的范数有界，值的差距就有界。  这里是本讲<b>记号最乱</b>的一段，必须说清楚。  讲座把 μ 的匹配条件写成 <b>L1</b>，把 w 的约束写成 <b>L2 球</b>，然后引用 <b>Hölder 不等式</b>。这三者配不起来：Hölder 配的是 L1 与 L∞，Cauchy–Schwarz 配的才是 L2 与 L2。  <b>Abbeel 与 Ng 的原文用的是 ‖w‖₂ ≤ 1 与 ‖μ(π) − μ_E‖₂ ≤ ε</b>，配 Cauchy–Schwarz，于是值差 ≤ ε。本片采用这一套。  还有一处是<b>数学上直接错的</b>：讲座在讲 L1 时说「把所有这些误差加起来，它必须等于 1」。L1 范数是各分量绝对值之和，而条件是这个和<b>要小</b>（被 ε 控住），不是等于 1。");
  /* 反驳 */
  S(2748,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"μ 匹配",sub:"线性奖励下值接近",state:"on"},
      {label:"策略相同",sub:"不保证",state:"dead"},
      {label:"除非",sub:"x 是 one-hot",state:"on"}]});
      note("保证的是值，不是行为",640,420,"y");
      setCap("<b>指名反驳</b>：μ 匹配保证的是<b>值</b>接近，不是<b>行为</b>相同。");
    },"指名回去：匹配特征计数保证的是——在<b>任何线性于这组特征的奖励下</b>——你的值和专家的值接近。它<b>不</b>保证你的策略和专家的策略相同。  两个前提要记住，它们都是可能失效的：  <b>奖励必须真的线性于 x</b>。如果真实奖励依赖某个不在 x 里的东西，匹配 μ 就毫无意义——你在一组错误的坐标上对齐。 <b>x 的选择决定了什么叫「像」</b>。特征是你挑的，而「行为相似」这件事完全由这个选择定义。特征里没有的维度，你就永远不会去匹配它。  这也把这一讲和 L6 第一集接上了：那里说线性逼近要你<b>先猜对一组基</b>；这里同样——<b>你得先猜对什么特征决定了「好」</b>，而这一次连验证的办法都没有，因为真实奖励本来就不知道。  最后一集处理一个更根本的问题：就算特征选对了，奖励本身<b>是不是唯一的</b>。");
  SUM(2700,8,{h:"μ 是特征空间的折扣计数，不是状态分布",
    k:"R=wᵀx ⟹ 值 = <b>wᵀμ(π)</b>，其中 μ(π)=E[Σ_t γ^t x(s_t)]。匹配 μ 就能不知道 w 而对齐值。",
    m:"两处更正：μ <b>按特征编号</b>（维数 k，不是状态数）；它<b>没有 (1−γ) 归一化</b>，不是概率分布。",
    w:"<s>误解</s>：「μ 一样就策略一样」。只有 x 是 <b>one-hot</b> 时才近似成立；一般情形下不同策略可以有相同的 μ。",
    e:"范数配对：讲座 L1(μ) + L2(w) + Hölder <b>配不起来</b>。原文用 <b>‖w‖₂≤1 与 ‖μ−μ_E‖₂≤ε</b>（Cauchy–Schwarz）。另：「误差加起来等于 1」是错的，应为<b>被 ε 控住</b>。"});
  QUIZ(2700,8,{t:"在学徒学习里匹配特征计数 μ(π) = μ_E，能保证什么？",
    o:["保证学到的策略与专家策略相同","<b>保证在任何线性于该组特征的奖励下，两者的值接近</b>","保证恢复出唯一的奖励函数","保证访问的状态分布相同"],
    a:1,
    w:"R=wᵀx 时值等于 wᵀμ，所以 |值差| ≤ ‖w‖·‖μ(π)−μ_E‖ —— 匹配 μ 就在<b>不知道 w</b> 的情况下把值对齐了。但它<b>只</b>保证值，不保证行为：μ 是<b>特征空间</b>的向量（维数 k），不同策略完全可以有相同的 μ。<s>「策略相同」</s>只在 x 是 one-hot 时才近似成立。<s>「恢复唯一奖励」</s>恰恰相反，这是下一集的主题。<s>「状态分布相同」</s>把 μ 误读成了状态分布 —— 讲座那句「μ of s」正是这个误读的来源。"});
});

KP("9 · 奖励不可辨识：R ≡ 0 能解释任何行为",function(){
  /* 钩子 */
  S(3000,function(){
      clearScene();setBig(null);setEq(null);
      note("看见最优行为",400,280,"g lg");
      note("反推奖励",880,280,"y lg");
      note("这个反问题有解吗",640,400,"r lg");
      setCap("逆强化学习问的是一个<b>反问题</b>：什么样的 R 让专家的行为最优？");
    },"逆强化学习的问题陈述很干净：给定一个（假定最优的）专家策略，找出一个奖励函数 R，使得这个策略在 R 下是最优的。  这是一个<b>反问题</b>——正向是「给 R，求最优 π」，反向是「给 π，求 R」。  反问题的第一件事永远是问：<b>解存在吗？唯一吗？</b>  存在性没问题。而唯一性——这一集全部的内容——答案是斩钉截铁的<b>不</b>，而且不唯一得相当彻底。");
  /* 错误答案 */
  S(3012,function(){
      clearScene();setEq(null);
      setBig("专家最优，R 就定了","行为已经把偏好全暴露了");
      setCap("行为确实暴露了偏好 —— <b>但暴露得远远不够定出一个 R</b>。");
    },"这个错误模型的直觉很强：如果一个人的每一个选择你都看见了，他的偏好还能有什么不确定的？  而且在有限的例子上它常常像是对的——看见司机减速让行人，你确实推断出「撞人是很负的」。  问题是「推断出一条约束」和「定出一个函数」之间差得很远。观察到的行为只给出<b>不等式</b>：专家选的动作不差于别的动作。而满足这组不等式的 R 有无穷多个。  下一镜给出最极端的那个，它一下就把唯一性打死。");
  /* 铺陈 */
  S(3024,function(){
      clearScene();setBig(null);
      setEq("$$R\\equiv 0 \\;\\Longrightarrow\\; \\text{every policy is optimal}$$","top");
      note("包括专家那个",640,300,"r lg");
      note("所以它是一个合法解",640,360,"r lg");
      setCap("取 <b>R ≡ 0</b>：所有策略的值都是 0，<b>每一个</b>策略都是最优的。");
    },"取 <b>R ≡ 0</b>。那么每个策略的值都恰好是 0，于是<b>所有</b>策略都是最优的——包括专家那一个。  所以 R ≡ 0 完美满足「让专家的行为成为最优」这个要求。它是一个合法解，而且它对专家的偏好<b>什么都没说</b>。  这就是 Ng 与 Russell 在 2000 年那篇论文里的核心观察：<b>逆强化学习是严重不适定的</b>（ill-posed）。R ≡ 0 只是最刺眼的一个；此外还有无穷多个非平凡的解。  注意这和上一集那个「(V,A) 不可辨识」是同一个形状：<b>约束只落在某个组合上，个体不被约束</b>。那里训练信号只看得见 V+A，这里观察只看得见「谁比谁好」。");
  /* 主体 */
  S(3036,function(){
      clearScene();setBig(null);setEq(null);
      note("特征匹配",360,260,"g lg","start");
      note("最大间隔",360,335,"b lg","start");
      note("最大熵",360,410,"v lg","start");
      setCap("既然解不唯一，就必须<b>外加一条准则</b>去挑一个。三种常见做法。");
    },"既然解集非空且巨大，唯一的出路是<b>外加一条准则</b>，从解集里挑一个。这正是各种逆强化学习方法的真正分歧所在。  <b>特征匹配</b>（上一集）：挑一个让 μ 对齐的 —— 实际上是把问题从「定 R」换成了「定值」。  <b>最大间隔</b>：挑一个让专家的策略<b>比其他策略好得最多</b>的 R。它显式地排除了 R ≡ 0，因为那个解的间隔是 0。  <b>最大熵</b>：在所有能解释数据的 R 里，挑那个让行为分布<b>最不确定</b>的 —— 也就是不多假设任何没被数据支持的东西。这是后来最常用的一路。  讲座还提到了 GAIL，把它读作「generative adversarial inverse imitation learning」——正确的名字是 <b>Generative Adversarial Imitation Learning</b>（Ho 与 Ermon, 2016），名字里没有 inverse。");
  /* 反驳 */
  S(3048,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"解不唯一",sub:"R ≡ 0 就是一个",state:"dead"},
      {label:"必须加准则",sub:"间隔 / 熵 / 特征",state:"on"},
      {label:"准则即假设",sub:"它决定你恢复出什么",state:"on"}]});
      note("这是建模选择，不是技术细节",640,420,"y");
      setCap("<b>指名反驳</b>：行为定不出 R。<b>你选的准则，才决定了恢复出什么。</b>");
    },"指名回去：观察最优行为<b>不足以</b>确定奖励函数。R ≡ 0 让每个策略都最优，是一个合法解——这一个反例就够了。  所以每个逆强化学习方法都必须外加一条准则，而这才是真正该看的地方：<b>你选的准则，决定了你恢复出什么样的奖励</b>。这不是实现细节，是一个<b>建模假设</b>，和选特征、选先验是一回事。  把这一讲的三条限制并排放，它们都指向同一个方向：  <b>老师被假定最优</b>——真实人类示范基本不满足。 <b>特征是你挑的</b>——「像」的定义由它决定（第八集）。 <b>准则是你挑的</b>——从无穷多个解里挑哪个由它决定。  三条都是<b>你带进来的假设</b>，而不是数据告诉你的。这是模仿学习最该带走的一条判断：<b>看一个方法学出了什么之前，先看它假设了什么</b>。  最后补几处被字幕弄坏的名字：「Sergei Lamin」是 <b>Sergey Levine</b>；「Stephane Ross」与「Drew Bagnell」（J. Andrew Bagnell）是对的，DAgger 出自他们；Ng 与 Russell 那篇逆强化学习论文被说成「1999, 2000」，实际是 <b>ICML 2000</b>。");
  SUM(3000,9,{h:"奖励不可辨识：R ≡ 0 能解释任何行为",
    k:"取 <b>R ≡ 0</b>，所有策略的值都是 0，<b>每个</b>策略都最优 —— 包括专家的。这一个反例就打死了唯一性（Ng &amp; Russell, ICML 2000）。",
    m:"和 dueling 的 (V,A) 不可辨识同形：<b>约束只落在某个组合上</b>（这里是「谁比谁好」），个体不被约束。",
    w:"<s>误解</s>：「看见了全部选择，偏好就定死了」。观察只给出<b>不等式</b>，满足它们的 R 有无穷多个。",
    e:"必须外加准则（<b>特征匹配 / 最大间隔 / 最大熵</b>），而<b>准则即假设</b>：它决定你恢复出什么。与「老师最优」「特征是你挑的」并列 —— 三条都是你带进来的。"});
  QUIZ(3000,9,{t:"为什么从最优专家行为恢复奖励函数是不适定的？",
    o:["因为专家的示范数据总是有限","<b>因为 R ≡ 0 让所有策略都最优，它是一个合法解 —— 解不唯一</b>","因为专家实际上并不最优","因为转移模型未知"],
    a:1,
    w:"R ≡ 0 时每个策略的值都是 0，<b>所有</b>策略都最优，当然包括专家的 —— 所以它完美满足「让专家行为最优」这个要求，却对偏好什么都没说。一个反例就够了（Ng &amp; Russell, ICML 2000）。<s>数据有限</s>不是根本原因：即使给你<b>无穷多</b>条完美示范，R ≡ 0 仍然是合法解。<s>「专家并不最优」</s>是另一个独立的现实问题，而这一讲恰恰<b>假定</b>了专家最优，不适定性在这个假定下依然成立。<s>转移未知</s>也不是原因：即使模型完全已知，解集照样无穷。"});
});

KP("完",function(){
  S(3400,function(){
      clearScene();setBig(null);setCap(null);setEq(null);
      setTitle("CS234 · Lecture 7 · 完","监督学习的保证过不了 MDP 这道门",
      "L8 · Policy Gradient：不再通过值函数绕路，直接对策略的参数求梯度");
    },"回头看这九集，承重的是三件事。  第一，<b>分布偏移不是小毛病，它是模仿学习的全部困难</b>。行为克隆在专家的状态分布上是标准的监督学习，误差界 εT；但一次犯错就把你推到分布之外，那里的保证一条都不剩，界变成 ε·T(T+1)/2。ε=0.01、T=100 时是 <b>50.5 对 1</b>，T=1000 时是 <b>5005 对 10</b>。  第二，<b>DAgger 要的不是更多数据，是不同分布的数据</b>。它让你先用当前策略跑出轨迹，再去问专家「你在这些状态会怎么做」——标注的是<b>你自己会到达的状态</b>。这把界压回线性的 O(εT)。区分「数据量」和「数据来自谁的分布」，是这一讲最可迁移的一条。  第三，<b>奖励不可辨识</b>。从最优行为恢复奖励这件事没有唯一解——R ≡ 0 就能解释任何策略的最优性。所以逆强化学习必须外加准则（特征匹配、最大熵、边际最大化），而<b>你选哪个准则，就决定了你恢复出什么奖励</b>。  下一讲换一条路。前七讲都在估值函数、再从中读出策略；L8 的策略梯度<b>不再绕这一道</b>，而是直接对策略的参数求梯度——于是连续动作空间和随机策略第一次变得自然。");
});
window.__startProjector(CFG);
})();
