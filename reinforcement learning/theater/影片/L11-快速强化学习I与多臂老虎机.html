<!--
  ═══════════════════════════════════════════════════════════════════════════
   通用「放映厅」学习模板  ·  v1
  ═══════════════════════════════════════════════════════════════════════════

  这是一个可复用的框架。所有引擎代码（放映机、字幕层、总结卡、必答测验、
  SVG 绘图工具箱、字幕防遮挡）都已内置。你只需要改动一个地方：

     ↓↓↓ 最下方 <script> 里 “========= 在这里填内容 =========” 之间的部分 ↓↓↓

  ── 怎么用 ───────────────────────────────────────────────────────────────
  1. 改 CFG：标题、副标题、视频链接（可留空）。
  2. 用 KP / S / SUM / QUIZ 四个函数搭出每个知识点，结构固定：
        KP("知识点名", function(){
          S(时间秒, 画面函数, "讲解段落（可选，按 N 显示）");   // 讲解镜头，可多个
          SUM(时间秒, 知识点号, {h:标题, k:核心结论, m:底层机制, w:常见误解, e:与考试});
          QUIZ(时间秒, 知识点号, {t:题干, o:[选项...], a:正确下标, w:解析});
        });
  3. 画面函数里可用的绘图工具（全部已内置）：
        clearScene()                    清空画布
        setTitle(小标,大标题,副标题)     标题卡
        setBig(大字, 小字)               居中大字（数字/结论）
        setCap(html)                     顶部一句话（支持 <b><i><em><s>）
        setEq("$$...$$", "top")          MathJax 公式（"top" 顶部对齐）
        flip("...<span data-id=x>..")    公式项级变形动画（FLIP）
        T(id, 文本, "hl/res/ded")        flip 用的 token
        note(文本,x,y,"g/y/b/r/v",锚)    画布上的标注
        dots([[x,y]...], "a/b/c", 半径)  散点
        curve(点数组, "fit/fit g/...")    折线/曲线（带描边动画）
        boxNode(x,y,w,h,标签,"g/y/b/r/v") 方块节点
        link(x1,y1,x2,y2)                连线
        matrix({rows,cols,cw,ch,x,y,cell:fn,dim:fn,hl:fn,label,labelCls})  表格/矩阵
        坐标系是 1280×720（16:9），原点左上。
  4. 颜色语义（保持一致，学习者会形成条件反射）：
        蓝 blue = 模型/输入   黄 yellow = 注意力/结论   绿 green = 正确/答案
        珊瑚 coral = 误差/错误   紫 violet = 强调
  5. 交互（已内置，无需改）：空格/→ 推进 · ← 回退 · 数字键跳知识点 · N 开关讲解。
     测验必答才能继续；总结卡与测验不需要讲解。

  ── 这个模板里放了 3 个知识点作为“怎么写”的活样例，可整段替换。 ────────────
-->

/* ══ RL 图元包 ══ */

/* #quiz 缺容器兜底。引擎里 #sum 有 max-height:90vh + overflow:auto，而 #quiz 两者都没有；
   又因为 #quizL 是 align-items:center，一旦内容超高就**上下对称裁切** ——
   最先看不见的是最底部的 .why，也就是那一拍的全部教学载荷（解析）。
   这比 SUM 卡溢出更隐蔽：SUM 至少还能滚，QUIZ 是直接两头切掉。
   选择器同为 (1,0,0)，本段注入在引擎样式之后，靠顺序取胜。 */
#quiz{max-height:88vh;overflow:auto}
.pt.b{fill:var(--coral)} .pt.c{fill:var(--green)} .pt.y{fill:var(--yellow)} .pt.v{fill:var(--violet)}
.box.y{stroke:var(--yellow)} .box.v{stroke:var(--violet)} .box.b{stroke:var(--blue)}
/* 层级只用颜色区分，字号一律沿用引擎的 .slbl 14px —— ML 版就是这么做的，
   混用字号会让画面每次切换都「跳」一下。sm / big 是**兜底色**，不是字号。

   顺序至关重要：sm/big/ink 必须排在语义色**之前**。三者特异度相同（0,2,0），
   靠先后决胜 —— 上一版把它们写在后面，于是 note(txt,x,y,cls+" sm") 这类调用
   （bars 第 187 行、errbar 第 303 行等，全片 15 处）的语义色被静默压成 --dim，
   而深底上的暗灰标签看起来像正常标签，所以没人反馈。
   「层级只靠颜色」这个正解，被为兼容它而保留的别名从内部取消掉了。
   现在的顺序下：class="slbl y sm" → 黄（语义色在后，赢）；class="slbl sm" → 暗色。 */
.slbl.ink{fill:var(--ink)} .slbl.sm{fill:var(--dim)} .slbl.big{fill:var(--ink)}
/* 五个语义色必须**全部**在别名之后重新声明 —— 包括 g 与 r。
   它们原本定义在 eng.txt 的基础样式里，而本段整体注入在基础样式之后，
   所以只在本段内部调顺序是不够的：第一次修完，slbl.y.sm 变对了，
   而 slbl.g.sm 仍被压成暗灰（实测 rgb(147,161,181)）—— 因为 .slbl.g 来自上游。 */
.slbl.y{fill:var(--yellow)} .slbl.b{fill:var(--blue)} .slbl.v{fill:var(--violet)}
.slbl.g{fill:var(--green)} .slbl.r{fill:var(--coral)}

/* ── 动画铁律 ──────────────────────────────────────────────────────────
   动画必须演示机制。看完一段动画，观众应当明白一件<b>之前不明白的事</b>。
   不解释任何东西的动画（呼吸、脉冲环、无限循环的小车、行进虚线）一律不要——
   它们只是视觉噪音，会盖过真正要看的东西。

   因此这里没有 infinite 动画。每个动画都：
     · 播一次就停在正确的终态；
     · 终态本身携带完整信息（后台标签页暂停也不丢内容）；
     · 有明确的「它在演示什么」的答案。
   ──────────────────────────────────────────────────────────────────── */
@keyframes rl-slide{to{offset-distance:100%}}
.tracer{animation:rl-slide var(--walk-dur,2.4s) ease-in-out 1 forwards;offset-rotate:0deg}
.trail{stroke-dasharray:none}

.arw{stroke:#3A4759;stroke-width:1.8;fill:none;marker-end:url(#ah)}

.arw.v{stroke:var(--violet);marker-end:url(#ah-v)}

.snode{fill:#101724;stroke:#2B3646;stroke-width:1.8}

.snode.r{stroke:var(--coral)} .snode.b{stroke:var(--blue)} .snode.v{stroke:var(--violet)}

.gcell{fill:#0E1420;stroke:#1E2836;stroke-width:1.2}

.gcell.g{fill:#0E2A24;stroke:var(--green);stroke-width:2}
.gcell.r{fill:#3A1A1E;stroke:var(--coral);stroke-width:2}

.vbar{fill:var(--blue);opacity:.85}
.vbar.g{fill:var(--green)} .vbar.y{fill:var(--yellow)}
.vbar.r{fill:var(--coral)} .vbar.v{fill:var(--violet)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

<script>
/* ════════════════ 引擎（无需改动） ════════════════ */
(function(){
"use strict";
var W=1280,H=720,DUR=700,FAST=false;
var svg=d3.select("#scene"),gS=svg.append("g"),gN=svg.append("g");
function clearScene(){gS.selectAll("*").remove();gN.selectAll("*").remove();noTitle();}
function note(t,x,y,c,a){var e=gN.append("text").attr("class","slbl "+(c||""))
  .attr("x",x).attr("y",y).attr("text-anchor",a||"middle").text(t);
  if(FAST)e.attr("opacity",1);else e.attr("opacity",0).transition().duration(470).delay(210).attr("opacity",1);}
function dots(p,cls,r){var s=gS.selectAll(null).data(p).enter().append("circle")
  .attr("class","pt "+(cls||"")).attr("cx",function(d){return d[0];}).attr("cy",function(d){return d[1];});
  if(FAST)s.attr("r",r||7);else s.attr("r",0).transition().duration(DUR).delay(function(d,i){return i*35;}).attr("r",r||7);}
function curve(pts,cls){var p=gS.append("path").attr("class",cls||"fit")
  .attr("d","M"+pts.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1);}).join("L"));
  if(!FAST&&p.node().getTotalLength){var L=p.node().getTotalLength();
    p.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
     .transition().duration(900).attr("stroke-dashoffset",0);}}
function fn(f,a,b,N){var p=[];for(var i=0;i<=N;i++){var t=i/N,x=a+(b-a)*t;p.push([x,f(x)]);}return p;}
function boxNode(x,y,w,h,label,cls){
  gS.append("rect").attr("class","box "+(cls||"")).attr("x",x).attr("y",y).attr("width",w).attr("height",h).attr("rx",8);
  note(label,x+w/2,y+h/2+5,cls||"");}
function link(x1,y1,x2,y2){gS.append("path").attr("class","link").attr("d","M"+x1+","+y1+"L"+x2+","+y2);}
function matrix(o){
  var cw=o.cw||80,ch=o.ch||42,R=o.rows,C=o.cols;
  var x0=o.x!=null?o.x:(W-C*cw)/2,y0=o.y!=null?o.y:(H-R*ch)/2-30;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var hl=o.hl?o.hl(i,j):"";
    var rc=gS.append("rect").attr("class","cellbg "+(hl||""))
      .attr("x",x0+j*cw).attr("y",y0+i*ch).attr("width",cw-3).attr("height",ch-3).attr("rx",3);
    var tx=gS.append("text").attr("class","celltx"+(o.dim&&o.dim(i,j)?" d":""))
      .attr("x",x0+j*cw+(cw-3)/2).attr("y",y0+i*ch+(ch-3)/2).text(o.cell(i,j));
    if(!FAST){var dl=(i*C+j)*18;rc.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);
      tx.attr("opacity",0).transition().duration(360).delay(dl).attr("opacity",1);}}
  if(o.label)note(o.label,x0+C*cw/2-1,y0-20,o.labelCls||"y");}
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280;};}

var big=document.getElementById("big"),cap=document.getElementById("cap"),
    narrEl=document.getElementById("narr"),titleBox=document.getElementById("titleBox"),
    sumEl=document.getElementById("sum"),quizEl=document.getElementById("quiz"),
    eqBox=document.getElementById("eqBox");
var narrOn=true,locked=false,eqT=null;
function setCap(h){if(!h){cap.classList.add("off");cap.innerHTML="";return;}
  cap.innerHTML=h;cap.classList.remove("off");}
function setBig(v,s){if(v===null){big.classList.add("off");return;}
  big.innerHTML=v+(s?"<small>"+s+"</small>":"");big.classList.remove("off");}
/* 事故实录：setEq 的非 FAST 分支把写入推迟 150ms。连着翻镜时，上一镜那个
   还没触发的 setTimeout 会在 showSum 的 setEq(null) 之后才落地，把刚清干净的
   公式带重新填上 —— 总结卡上于是挂着上一镜的残留公式。
   L01 实测镜 8/45/65/74、L02 实测镜 79，全是这么来的。
   只有顺序翻才复现：从头 reload 直接跳到镜 8 是干净的，
   所以之前那次「跳过去看一眼」的单镜抽查给出了假的「已修好」。
   修法是把 pending 的定时器记下来，任何一次 setEq 先撤销它。 */
function setEq(h,pos){if(eqT){clearTimeout(eqT);eqT=null;}
  if(!h){eqBox.classList.add("off");eqBox.innerHTML="";return;}
  var go=function(){eqT=null;eqBox.innerHTML=h;eqBox.className=pos||"";eqBox.classList.remove("off");
    if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([eqBox]).catch(function(){});};
  if(FAST){go();return;}eqBox.classList.add("off");eqT=setTimeout(go,150);}
function flip(h){
  if(FAST){eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");return;}
  var b={};eqBox.querySelectorAll("[data-id]").forEach(function(e){b[e.dataset.id]=e.getBoundingClientRect();});
  eqBox.innerHTML=h;eqBox.className="";eqBox.classList.remove("off");
  if(!eqBox.animate)return;
  eqBox.querySelectorAll("[data-id]").forEach(function(e){
    var r=b[e.dataset.id];
    if(r){var a=e.getBoundingClientRect(),dx=r.left-a.left,dy=r.top-a.top;
      if(Math.abs(dx)>.5||Math.abs(dy)>.5)
        e.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],
          {duration:780,easing:"cubic-bezier(.35,0,.15,1)"});}
    else e.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],
      {duration:520,delay:250,easing:"cubic-bezier(.3,.7,.3,1)",fill:"backwards"});});}
function T(id,t,c){return '<span class="tok '+(c||"")+'" data-id="'+id+'">'+t+'</span>';}
function setTitle(a,h,p){titleBox.classList.remove("off");
  titleBox.innerHTML='<p class="act">'+(a||"")+'</p><h1>'+h+'</h1>'+(p?'<p>'+p+'</p>':'')+'<div class="rule"></div>';}
function noTitle(){titleBox.classList.add("off");}
function setNarr(t){if(!t||!narrOn){narrEl.hidden=true;return;}
  narrEl.hidden=false;narrEl.innerHTML=t;narrEl.classList.remove("off");}
function clearSum(){sumEl.hidden=true;sumEl.classList.add("off");sumEl.innerHTML="";}
function showSum(kp,s){
  /* 总结卡是整屏覆盖层，但它盖不住公式带的顶边：实测 eqBox 顶边 y≈46，
     而 #sum 顶边 y≈94 —— 上一镜的公式会有约 48px 露在卡片上方。
     showSum 原本完全不碰 eqBox，于是 135 张卡里有 5 张挂着上一镜的残留公式。
     在这里清掉，比让每一集的最后一镜各自记得 setEq(null) 可靠。 */
  setEq(null);
  var ord=[["k","核心结论"],["m","底层机制"],["w","常见误解"],["e","与你的考试"]];
  sumEl.innerHTML='<p class="sh">知识点 '+kp+' · 总结</p><h3>'+s.h+'</h3><div class="rows">'+
    ord.filter(function(o){return s[o[0]];}).map(function(o){
      return '<div class="row '+o[0]+'"><p class="rk">'+o[1]+'</p><p class="rv">'+s[o[0]]+'</p></div>';}).join("")+'</div>';
  sumEl.hidden=false;void sumEl.offsetWidth;sumEl.classList.remove("off");}
function clearQuiz(){quizEl.hidden=true;quizEl.classList.add("off");quizEl.innerHTML="";locked=false;}
function askQ(kp,q){
  if(FAST){clearQuiz();return;}
  locked=true;
  quizEl.innerHTML='<p class="qh">知识点 '+kp+' · 检验</p><p class="qq">'+q.t+'</p><div class="qo">'+
    q.o.map(function(o,i){return '<button data-i="'+i+'">'+o+'</button>';}).join("")+
    '</div><p class="why" hidden>'+q.w+'</p>';
  quizEl.hidden=false;void quizEl.offsetWidth;quizEl.classList.remove("off");
  var bs=[].slice.call(quizEl.querySelectorAll("button"));
  bs.forEach(function(b,i){b.addEventListener("click",function(){
    if(b.classList.contains("lk"))return;
    bs.forEach(function(x,k){x.classList.add("lk");x.classList.add(k===q.a?"ok":(k===i?"no":"off2"));});
    quizEl.querySelector(".why").hidden=false;locked=false;
    document.getElementById("hint").textContent=(cur+1)+" / "+SHOTS.length+"  ·  空格继续";});});}

var SHOTS=[],KPS=[];
function S(t,fn,narr){SHOTS.push({t:t,enter:fn,n:narr});}
function KP(name,build){var from=SHOTS.length;build();KPS.push({name:name,from:from,len:SHOTS.length-from});}
function SUM(t,kp,s){SHOTS.push({t:t,sum:{kp:kp,s:s},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}
function QUIZ(t,kp,q){SHOTS.push({t:t,quiz:{kp:kp,q:q},enter:function(){clearScene();setBig(null);setCap(null);setEq(null);noTitle();}});}

/* 把引擎暴露给内容区 */
function axes(P){gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.r).attr("y1",P.b).attr("y2",P.b);
  gS.append("line").attr("class","axline").attr("x1",P.l).attr("x2",P.l).attr("y1",P.t).attr("y2",P.b);}
window.__engine={gS:gS,gN:gN,DUR:DUR,isFast:function(){return FAST;},clearScene:clearScene,note:note,dots:dots,curve:curve,fn:fn,boxNode:boxNode,
  link:link,matrix:matrix,rng:rng,axes:axes,setCap:setCap,setBig:setBig,setEq:setEq,flip:flip,T:T,
  setTitle:setTitle,noTitle:noTitle,S:S,KP:KP,SUM:SUM,QUIZ:QUIZ,W:W,H:H};

/* ════════════════ 放映机（无需改动） ════════════════ */
function startProjector(CFG){
  var cur=-1,kpsEl=document.getElementById("kps"),pipEls=[];
  KPS.forEach(function(k){
    var bar=document.createElement("div");bar.className="kpbar";
    var lb=document.createElement("span");lb.className="kplbl";lb.textContent=k.name;bar.appendChild(lb);
    for(var i=0;i<k.len;i++){var p=document.createElement("span"),sh=SHOTS[k.from+i];
      p.className="pip"+(sh.sum?" sum":(sh.quiz?" quiz":""));bar.appendChild(p);pipEls[k.from+i]=p;}
    bar.addEventListener("click",function(){go(k.from,true);});
    kpsEl.appendChild(bar);});
  function hhmmss(s){s=Math.round(s);var m=Math.floor(s/60);
    return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
  var tcEl=document.getElementById("tc");
  if(!CFG.video)tcEl.hidden=true;
  function go(n,force){
    n=Math.max(0,Math.min(SHOTS.length-1,n));
    if(n===cur)return;
    if(locked&&n>cur&&!force)return;
    FAST=true;clearScene();
    for(var i=0;i<n;i++){if(SHOTS[i].enter)SHOTS[i].enter();}
    FAST=false;
    cur=n;clearQuiz();clearSum();
    var sh=SHOTS[n];
    noTitle();clearScene();setBig(null);setEq(null);setCap(null);
    if(sh.enter)sh.enter();
    setNarr(sh.n);
    if(sh.sum){setNarr(null);showSum(sh.sum.kp,sh.sum.s);}
    if(sh.quiz){setNarr(null);askQ(sh.quiz.kp,sh.quiz.q);}
    pipEls.forEach(function(p,i){if(!p)return;
      var base="pip"+(SHOTS[i].sum?" sum":(SHOTS[i].quiz?" quiz":""));
      p.className=base+(i===n?" now":(i<n?" seen":""));});
    var ki=0;KPS.forEach(function(k,j){if(n>=k.from)ki=j;});
    [].slice.call(kpsEl.children).forEach(function(b,j){b.classList.toggle("active",j===ki);});
    document.getElementById("hint").textContent=(n+1)+" / "+SHOTS.length+(sh.quiz?"  ·  先回答":"");
    if(CFG.video){tcEl.textContent="▶ "+hhmmss(sh.t||0);tcEl.href=CFG.video+Math.round(sh.t||0)+"s";}}
  window.__go=go;window.__n=SHOTS.length;window.__kps=KPS;
  document.getElementById("next").addEventListener("click",function(){go(cur+1);});
  document.getElementById("prev").addEventListener("click",function(){go(cur-1,true);});
  window.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();go(cur+1);}
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="Backspace"){e.preventDefault();go(cur-1,true);}
    else if(e.key==="Home"){e.preventDefault();go(0,true);}
    else if(e.key>="1"&&e.key<="9"){var k=KPS[+e.key-1];if(k){e.preventDefault();go(k.from,true);}}
    else if(e.key==="n"||e.key==="N"){e.preventDefault();narrOn=!narrOn;
      var sh=SHOTS[cur];setNarr(sh&&!sh.sum&&!sh.quiz?sh.n:null);
      document.getElementById("kbd").textContent="空格 推进 · ← 回退 · N "+(narrOn?"讲解":"显示讲解");}});
  go(0);
}
window.__startProjector=startProjector;
})();
</script>


<script>

/* ══════════════ RL 图元包（在 __engine 之上扩展，不改原引擎） ══════════════ */
(function(){
var E=window.__engine, gS=E.gS, gN=E.gN, DUR=E.DUR, W=E.W, H=E.H;
var note=E.note;
function fast(){return E.isFast();}
function fadeIn(sel,delay){
  if(fast()){sel.attr("opacity",1);return sel;}
  return sel.attr("opacity",0).transition().duration(420).delay(delay||0).attr("opacity",1);
}

/* 箭头标记（各色一份），只建一次 */
(function(){
  var svg=d3.select("#scene");
  if(!svg.select("defs#rlmk").empty())return;
  var defs=svg.append("defs").attr("id","rlmk");
  var cols={"ah":"#3A4759","ah-g":"#5BDDA8","ah-y":"#FFD36E",
            "ah-r":"#FF7C87","ah-b":"#54A9F7","ah-v":"#B48BF5"};
  Object.keys(cols).forEach(function(id){
    defs.append("marker").attr("id",id).attr("viewBox","0 0 10 10")
      .attr("refX",9).attr("refY",5).attr("markerWidth",6).attr("markerHeight",6)
      .attr("orient","auto")
      .append("path").attr("d","M0,0.6L10,5L0,9.4z").attr("fill",cols[id]);
  });
})();

/* ── arrow ── */
function arrow(x1,y1,x2,y2,cls,bend){
  var d;
  if(bend){
    var mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy)||1;
    d="M"+x1+","+y1+"Q"+(mx-dy/L*bend)+","+(my+dx/L*bend)+" "+x2+","+y2;
  } else d="M"+x1+","+y1+"L"+x2+","+y2;
  var p=gS.append("path").attr("class","arw "+(cls||"")).attr("d",d);
  if(!fast()&&p.node().getTotalLength){
    var L2=p.node().getTotalLength();
    p.attr("stroke-dasharray",L2+" "+L2).attr("stroke-dashoffset",L2)
     .transition().duration(520).attr("stroke-dashoffset",0);
  }
  return p;
}

/* ── mdpChain ──
   o={n,x,y,r,gap,w, label:fn(i), lcls:fn(i), cls:fn(i), rew:fn(i),
      arcs:[[from,to,label,cls,bend]]} */
function mdpChain(o){
  var n=o.n, r=o.r||30, gap=o.gap||((o.w||900)/(n-1)),
      x0=o.x!=null?o.x:(W-(n-1)*gap)/2, y=o.y||300, pos=[];
  for(var i=0;i<n;i++){
    var cx=x0+i*gap; pos.push([cx,y]);
    var c=gS.append("circle").attr("class","snode "+((o.cls&&o.cls(i))||""))
      .attr("cx",cx).attr("cy",y).attr("r",r);
    fadeIn(c,i*55);
    if(o.label)note(o.label(i),cx,y+5,(o.lcls&&o.lcls(i))||"ink");
    if(o.rew&&o.rew(i)!=null)note(o.rew(i),cx,y-r-14,"y");
  }
  (o.arcs||[]).forEach(function(a){
    var A=pos[a[0]],B=pos[a[1]],sgn=B[0]>=A[0]?1:-1,bend=a[4]||0;
    arrow(A[0]+sgn*r,A[1],B[0]-sgn*r,B[1],a[3]||"",bend);
    /* 事故实录：这里原来是 Math.abs(bend)，把弧的方向丢掉了。两个后果都实测到过：
       (1) L02 KP1 的 A⇄B 来回弧，两个「1.0」标签落在同一个像素框 (627,255)-(653,273)；
       (2) L02 KP2 的 bend=-84 让弧向下弯，标签却仍算在上方，离自己的弧 100px。
       arrow 的控制点 y = my+(dx/L)*bend，故弧顶 y = A[1]+sgn*bend/2；标签跟着弧顶走。 */
    if(a[2]){
      var eff=sgn*bend, ay=A[1]+eff/2;
      note(a[2],(A[0]+B[0])/2, bend?(eff<0?ay-12:ay+20):A[1]-16, a[3]||"");
    }
  });
  return pos;
}

/* ── bars ──
   o={vals:[],x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v)} */
function bars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62, mx=o.max;
  if(mx==null){
    mx=0; for(var q=0;q<n;q++) if(Math.abs(v[q])>mx) mx=Math.abs(v[q]);
  }
  if(!mx)mx=1;
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var hh=Math.abs(v[i])/mx*h, cx=x0+i*gap+gap/2;
    var b=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    if(fast())b.attr("y",y0-hh).attr("height",hh);
    else b.attr("y",y0).attr("height",0).transition().duration(DUR).delay(i*45)
          .attr("y",y0-hh).attr("height",hh);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
    note(o.fmt?o.fmt(v[i]):(Math.round(v[i]*100)/100),
         cx,y0-hh-9,((o.cls&&o.cls(i))||"")+" sm");
  }
}

/* ── gridworld ──
   o={rows,cols,x,y,cs, val:fn(i,j), pol:fn(i,j)->"u|d|l|r",
      cls:fn(i,j), wall:fn(i,j), tag:fn(i,j)} */
function gridworld(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    var isW=o.wall&&o.wall(i,j);
    var cl=isW?"wall":((o.cls&&o.cls(i,j))||"");
    var rc=gS.append("rect").attr("class","gcell "+cl)
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    fadeIn(rc,(i*C+j)*16);
    if(isW)continue;
    var cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2;
    if(o.val&&o.val(i,j)!=null)note(o.val(i,j),cx,cy+5,((o.cls&&o.cls(i,j))||"ink"));

/* ── backup：Sutton&Barto 回溯图 ──
   o={x,y,dy,spread,r, levels:["s","a","s"], branch:[1,2], labels:[], hl:[]} */
function backup(o){
  var x=o.x!=null?o.x:W/2, y=o.y!=null?o.y:150, dy=o.dy||105, r=o.r||20,
      lv=o.levels, br=o.branch||[], hl=o.hl||[], lab=o.labels||[], cur=[[x,y]];
  for(var k=0;k<lv.length;k++){
    var kind=lv[k], isHL=hl.indexOf(k)>=0, next=[];
    (function(kind,isHL,k){
      cur.forEach(function(p,pi){
        var c;
        if(kind==="s")
          c=gS.append("circle").attr("class","snode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r);
        else
          c=gS.append("circle").attr("class","anode "+(isHL?"y":""))
             .attr("cx",p[0]).attr("cy",p[1]).attr("r",r*0.42);
        fadeIn(c,k*90);
        if(lab[k]&&pi===0)note(lab[k],p[0]-r-12,p[1]+5,isHL?"y":"","end");
      });
    })(kind,isHL,k);
    if(k<lv.length-1){
      var b=br[k]||1, spread=(o.spread||150)/Math.pow(1.7,k);
      cur.forEach(function(p){
        for(var m=0;m<b;m++){
          var nx=p[0]+(b===1?0:(m-(b-1)/2)*spread), ny=p[1]+dy;
          gS.append("path").attr("class","tedge").attr("d","M"+p[0]+","+p[1]+"L"+nx+","+ny);
          next.push([nx,ny]);
        }
      });
      cur=next;
    }
  }
}

/* ── tree：upto 控制画到第几个节点 ──
   o={nodes:[{id,parent,x,y,label,sub,cls}], upto, r} */
function tree(o){
  var r=o.r||24, N=o.nodes, up=o.upto!=null?o.upto:N.length, pos={};
  N.forEach(function(nd){ pos[nd.id]=[nd.x,nd.y]; });

      var p=pos[nd.parent];
      var e=gS.append("path").attr("class","tedge "+(nd.cls==="hl"?"hl":""))
        .attr("d","M"+p[0]+","+p[1]+"L"+nd.x+","+nd.y);
      if(!fast()&&e.node().getTotalLength){
        var L=e.node().getTotalLength();
        e.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
         .transition().duration(380).delay(i*70).attr("stroke-dashoffset",0);
      }

    var c=gS.append("circle").attr("class","tnode "+(nd.cls||""))
      .attr("cx",nd.x).attr("cy",nd.y).attr("r",r);

    if(nd.label)note(nd.label,nd.x,nd.y+5,"ink");

/* ═══════════ 演示机制的动画 ═══════════

/* ── trace ──
   演示什么：智能体<b>沿这条路走了一趟</b>，走过的地方留下痕迹。
   用于：策略的轨迹、示范轨迹与偏移轨迹的对比。
   o={pts:[[x,y]..], dur, cls, r, label, trail:true} */
function trace(o){
  var pts=o.pts, d="M"+pts[0][0]+","+pts[0][1];
  for(var i=1;i<pts.length;i++)d+="L"+pts[i][0]+","+pts[i][1];
  if(o.trail!==false){
    var tp=gS.append("path").attr("class","arw "+(o.cls||"y")+" trail")
      .attr("d",d).attr("marker-end",null);
    if(!fast()&&tp.node().getTotalLength){
      var L=tp.node().getTotalLength();
      tp.attr("stroke-dasharray",L+" "+L).attr("stroke-dashoffset",L)
        .transition().duration((o.dur||2.4)*1000).ease(d3.easeSinInOut)
        .attr("stroke-dashoffset",0);
    }
  }
  var g=gS.append("g").attr("class","tracer")
    .style("offset-path",'path("'+d+'")')
    .style("--walk-dur",(o.dur||2.4)+"s");
  g.append("circle").attr("class","snode "+(o.cls||"y"))
    .attr("cx",0).attr("cy",0).attr("r",o.r||13);
  if(o.label)g.append("text").attr("class","slbl ink")
    .attr("x",0).attr("y",4).attr("text-anchor","middle").text(o.label);
  return g;
}

/* ── morphBars ──
   演示什么：参数一变，<b>每根柱子怎么随之变化</b>——谁涨谁跌、谁反超谁。
   用于：γ 从一个值变到另一个值时值函数的重排。柱子从 from 高度<b>过渡到</b> to 高度，
   数字同步滚动，所以「反超」这件事是看得见的，而不是两张静态图。
   o={from:[], to:[], x,y,w,h,max, label:fn(i), cls:fn(i), fmt:fn(v), dur} */
function morphBars(o){
  var A=o.from, B=o.to, n=B.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, dur=(o.dur||1400);
  if(mx==null){mx=0;B.forEach(function(v){if(Math.abs(v)>mx)mx=Math.abs(v);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(v){return (Math.round(v*100)/100).toString();};
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    (function(i){
      var cx=x0+i*gap+gap/2,
          hA=Math.abs(A[i])/mx*h, hB=Math.abs(B[i])/mx*h;
      var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(i))||""))
        .attr("x",cx-bw/2).attr("width",bw).attr("rx",3)
        .attr("y",y0-hA).attr("height",hA);
      var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(i))||""))
        .attr("x",cx).attr("text-anchor","middle").attr("y",y0-hA-9).text(fmt(A[i]));
      if(o.label)note(o.label(i),cx,y0+22,"sm");
      if(fast()){bar.attr("y",y0-hB).attr("height",hB);txt.attr("y",y0-hB-9).text(fmt(B[i]));return;}
      bar.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB).attr("height",hB);
      txt.transition().duration(dur).ease(d3.easeCubicInOut)
         .attr("y",y0-hB-9)
         .tween("t",function(){var iv=d3.interpolateNumber(A[i],B[i]),self=this;
           return function(t){self.textContent=fmt(iv(t));};});
    })(i);
  }
}

/* ── fillBars ──
   演示什么：动态规划的<b>回代顺序</b>——每个值都要等它右边那个算完才能算。
   用于：Bellman 一致性方程从终点向起点回代。柱子按 order 依次出现，一次。
   o={vals:[], order:[下标顺序], x,y,w,h,max, label, cls, fmt, step:每步毫秒} */
function fillBars(o){
  var v=o.vals,n=v.length,
      x0=o.x!=null?o.x:200, y0=o.y!=null?o.y:460,
      w=o.w||880, h=o.h||210, gap=w/n, bw=gap*0.62,
      mx=o.max, step=o.step||260;
  if(mx==null){mx=0;v.forEach(function(q){if(Math.abs(q)>mx)mx=Math.abs(q);});}
  if(!mx)mx=1;
  var fmt=o.fmt||function(q){return (Math.round(q*100)/100).toString();};
  var order=o.order;
  if(!order){order=[];for(var k=n-1;k>=0;k--)order.push(k);}  // 默认从右往左
  gS.append("line").attr("class","axline")
    .attr("x1",x0).attr("x2",x0+w).attr("y1",y0).attr("y2",y0);
  for(var i=0;i<n;i++){
    var cx=x0+i*gap+gap/2;
    gS.append("rect").attr("class","gcell")
      .attr("x",cx-bw/2).attr("y",y0-h).attr("width",bw).attr("height",h)
      .attr("rx",3).attr("opacity",.16);
    if(o.label)note(o.label(i),cx,y0+22,"sm");
  }
  order.forEach(function(idx,rank){
    var cx=x0+idx*gap+gap/2, hh=Math.abs(v[idx])/mx*h,
        delay=fast()?0:rank*step;
    var bar=gS.append("rect").attr("class","vbar "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx-bw/2).attr("width",bw).attr("rx",3);
    var txt=gN.append("text").attr("class","slbl "+((o.cls&&o.cls(idx))||""))
      .attr("x",cx).attr("y",y0-hh-9).attr("text-anchor","middle").text(fmt(v[idx]));
    if(fast()){bar.attr("y",y0-hh).attr("height",hh);return;}
    bar.attr("y",y0).attr("height",0).transition().duration(320).delay(delay)
       .attr("y",y0-hh).attr("height",hh);
    txt.attr("opacity",0).transition().duration(320).delay(delay).attr("opacity",1);
  });
}

/* ── sweepGrid ──
   演示什么：值迭代时信息<b>从目标格向外一圈圈扩散</b>的顺序。
   用于：格子世界的一轮扫描。格子按 order 依次点亮并写入值，一次。
   o={rows,cols,x,y,cs, val:fn(i,j), order:[[i,j]..], cls:fn(i,j), step} */
function sweepGrid(o){
  var R=o.rows,C=o.cols,cs=o.cs||88,
      x0=o.x!=null?o.x:(W-C*cs)/2, y0=o.y!=null?o.y:150, step=o.step||190;
  for(var i=0;i<R;i++)for(var j=0;j<C;j++){
    gS.append("rect").attr("class","gcell")
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
  }
  (o.order||[]).forEach(function(ij,rank){
    var i=ij[0], j=ij[1],
        cx=x0+j*cs+(cs-4)/2, cy=y0+i*cs+(cs-4)/2,
        delay=fast()?0:rank*step;
    var rc=gS.append("rect").attr("class","gcell "+((o.cls&&o.cls(i,j))||"hl"))
      .attr("x",x0+j*cs).attr("y",y0+i*cs)
      .attr("width",cs-4).attr("height",cs-4).attr("rx",5);
    var tx=gN.append("text").attr("class","slbl ink")
      .attr("x",cx).attr("y",cy+5).attr("text-anchor","middle")
      .text(o.val?o.val(i,j):"");
    if(fast())return;
    rc.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
    tx.attr("opacity",0).transition().duration(300).delay(delay).attr("opacity",1);
  });
  return {x0:x0,y0:y0,cs:cs,
          cx:function(j){return x0+j*cs+(cs-4)/2;},
          cy:function(i){return y0+i*cs+(cs-4)/2;}};
}

/* ── reveal ──
   演示什么：一组元素之间的<b>因果或时间顺序</b>（先有这个，才有那个）。
   用于：信用分配里奖励回传的路径、推导步骤的先后。
   sel 是 d3 选择集，按数据顺序依次淡入，一次。 */
function reveal(sel,step){
  if(fast())return sel.attr("opacity",1);
  return sel.attr("opacity",0).transition().duration(340)
            .delay(function(d,i){return i*(step||240);}).attr("opacity",1);
}

E.sweepGrid=sweepGrid; E.reveal=reveal;

    },"这个错误模型不是凭空来的——它就是前十讲的默认立场，而且在那十讲里是<b>对的</b>。  但把前十讲的保证摊开来看，它们有一个共同的形状：  <b>值迭代</b>收敛到 V*——<b>迭代次数</b>足够多的时候。 <b>MC 估计</b>无偏——<b>回合数</b>趋于无穷的时候。 <b>Q 学习</b>收敛——在 Robbins-Monro 条件下，<b>步数</b>趋于无穷的时候。 <b>TRPO</b>单调改进——每一步都对，但没说需要多少<b>轨迹</b>才能估准那一步。  全是<b>渐近</b>的。没有一条回答「我手上只有 200 个病人，能做到什么」。");
  /* 铺陈 */
  S(150,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:270,gap:250,items:[
      {label:"一个状态",sub:"没有转移",state:"on"},
      {label:"m 个臂",sub:"分布未知",state:"on"},
      {label:"拉一次",sub:"得一个奖励",state:"on"},
      {label:"独立同分布",sub:"没有延迟",state:"on"}]});
      note("RL 的最小形状",640,410,"y");
      setCap("要问「要多少数据」，先把问题缩到<b>还剩下探索、但别的都没有</b>。");
    },"要问清楚「要多少数据」，先得把别的困难都关掉。  <b>多臂老虎机</b>：一个状态，没有转移，m 个臂；每个臂有一个<b>固定但未知</b>的奖励分布；每次拉一个臂，得一个独立同分布的奖励。  对照 L01 那四个轴：<b>优化</b>在，<b>探索</b>在，<b>延迟后果</b>没了（没有转移，这次的动作不影响下次的处境），<b>泛化</b>也没了（状态只有一个）。  这不是玩具。它是把「探索」单独隔离出来的<b>最小实验装置</b>——在这个装置里，「要多少数据」第一次有了能写成一行的答案。");
  /* 主体 */
  S(162,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:340,items:[
      {label:"计算效率",sub:"前十讲",state:"dead"},
      {label:"样本效率",sub:"这一块",state:"on"}]});
      note("判据换了，算法也会换",640,420,"y");
      setCap("判据一换，前十讲那些「收敛就好」的算法<b>会当场出局</b>。");
    },"换判据不是换一个衡量角度，它会换掉你造出来的算法。  这一点下面几集会反复看到，先把结论摆出来：<b>贪心、固定 ε 的 ε-贪心、均匀随机探索——这三个在「收敛」的判据下全都及格，在「遗憾」的判据下全都不及格</b>。  它们不及格不是因为学不到，而是因为<b>学得太慢，而且慢的代价被永久记在账上</b>。  这就是为什么这一块要新造一个数：光看「最后学到没有」，看不出它们的差别；必须有一个数，能把「早期犯的错」算进去。");
  /* 反驳 */
  S(174,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"能不能学到",sub:"前十讲",state:"dead"},
      {label:"要多少数据",sub:"这一块",state:"on"},
      {label:"最小装置",sub:"老虎机",state:"on"}]});
      note("每个数据点是一个人",640,420,"r");
      setCap("<b>指名反驳</b>：不是「能学到就行」。问题换成了<b>要多少数据</b>。");
    },"指名回去：「能学到就行」在前十讲是对的，在这一块<b>不够了</b>。  理由不是数学上的，是应用上的：<b>当每一个数据点是一个人的时候，渐近保证等于没有保证</b>。「样本数趋于无穷时收敛」这句话，对一个只有 200 个病人的试验说不出任何有用的东西。  于是这一块做三件事：把问题缩到最小装置（老虎机）、造一个能记录「学得多快」的数（遗憾）、然后找一个在这个数上能证明的算法（UCB）。  下一集造那个数。它比看上去讲究——<b>关键在于它是累积的</b>。");
  SUM(126,1,{h:"判据从「能不能学到」换成「要多少数据」",
    k:"前十讲的保证<b>全是渐近的</b>：迭代次数 / 回合数 / 步数趋于无穷。没有一条回答「我只有 200 个病人能做到什么」。",
    m:"理由是应用上的：<b>每一个数据点是一个人</b>（病人、学生、广告受众）。Pong 要几百万帧没关系 —— 帧不要钱。",
    w:"<s>误解</s>：「能学到就行，收敛性我们已经有了」。这在前十讲是对的；判据一换，<b>贪心、固定 ε-贪心、均匀随机会当场出局</b>。",
    e:"工具：<b>多臂老虎机</b> —— 一个状态、无转移、m 个臂、独立同分布。对照 L01 四轴：优化在、<b>探索在</b>、延迟后果与泛化都关掉了。这是隔离「探索」的最小装置。"});
  QUIZ(126,1,{t:"为什么这一讲要把 RL 缩成「一个状态、没有转移」的多臂老虎机？",
    o:["因为老虎机的最优策略有闭式解","<b>为了把「探索」单独隔离出来 —— 关掉延迟后果和泛化，只留下探索这一个困难</b>","因为真实应用大多只有一个状态","因为多状态情形下遗憾没有定义"],
    a:1,
    w:"对照 L01 的四个轴：<b>优化</b>和<b>探索</b>留下，<b>延迟后果</b>（没有转移，这次动作不影响下次处境）和<b>泛化</b>（只有一个状态）都被关掉。这样「要多少数据才能学到」这个问题第一次能写出干净的答案。<s>「闭式解」</s>不对 —— 分布未知，本来就没有可直接算的最优臂。<s>「真实应用只有一个状态」</s>恰恰相反，所以 L12–L13 要把这一套搬回 MDP。<s>「多状态下遗憾没定义」</s>是事实错误，MDP 的遗憾有标准定义。"});
});

KP("2 · 遗憾：<b>累积</b>的机会损失，不是当前有多好",function(){
  /* 钩子 */
  S(623,function(){
      clearScene();setBig(null);setEq(null);
      note("怎么把「学得快」写成一个数",640,300,"y lg");
      note("要能把早期的错记在账上",640,370,"sm lg");
      setCap("要比较算法，先得有一个数。而这个数<b>必须是累积的</b>。");
    },"上一集说判据要换，这一集把新判据写出来。  需求很具体：这个数要能区分「一开始就做对」和「折腾很久才做对」。两个算法最终都找到最优臂，但一个花了 100 步，一个花了 10000 步——这个差别必须体现在数里。  所以它不能只看<b>当前</b>的表现。它必须<b>把过程中每一步的损失加起来</b>。  这个数就是<b>遗憾</b>。");
  /* 错误答案 */
  S(635,function(){
      clearScene();setEq(null);
      setBig("看平均奖励就行","拿到的奖励高，就是学得好");
      setCap("平均奖励会被<b>后期的好表现冲淡</b>，早期的代价看不见了。");
    },"为什么不直接看拿到的平均奖励？  两个问题。  <b>第一，它和「最好能拿多少」脱钩。</b>0.42 的平均奖励是好是坏，取决于最优臂是 0.43 还是 0.95。不减掉基准，这个数没法跨问题比较。  <b>第二，也是更要紧的——平均会冲淡。</b>一个算法前 1000 步全在乱试，之后 99000 步全对，它的平均奖励几乎等于最优。那 1000 步的代价<b>被除掉了</b>。  而如果那 1000 步里每一步是一个病人，那个代价<b>不该被除掉</b>。");
  /* 铺陈 */
  S(647,function(){
      clearScene();setBig(null);
      setEq("$$\\Delta_a=Q(a^*)-Q(a)\\qquad\\qquad \\mathrm{Regret}(T)=\\sum_{t=1}^{T}\\Delta_{a_t}$$","top");
      note("差距",420,320,"b lg");
      note("把差距加起来",880,320,"g lg");
      setCap("<b>差距</b> Δ_a：这个臂比最优臂差多少。<b>遗憾</b>：把每一步的差距<b>加起来</b>。");
    },"两个定义。  <b>差距</b> Δ_a = Q(a*) − Q(a)：这个臂的期望奖励比最优臂低多少。最优臂自己的差距是 0。  <b>遗憾</b> Regret(T) = Σ_{t=1}^{T} Δ_{a_t}：把你实际拉过的每一个臂的差距，从第 1 步到第 T 步全部加起来。  换句话说：<b>遗憾是累积的机会损失</b>——相对于「从第一步起就一直拉最优臂」这个不可能的基准，你一共亏了多少。  标一处记号陷阱：<b>板上把「单步的差距」和「累积的和」都写作 regret</b>，没有一致的下标。看到这个词时先确认它指的是哪一个。");
  /* 主体 */
  S(659,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3],step:420,vals:[50.063,49.978,50.029,50.006],
      x:330,y:410,w:620,h:150,max:60,
      label:function(i){return ["10³","5×10³","2×10⁴","5×10⁴"][i];},
      cls:function(i){return "r";},
      fmt:function(v){return v.toFixed(1);}});
      note("均匀随机的每千步遗憾",640,452,"sm");
      setCap("<b>每千步遗憾平不下来</b>，累积遗憾就是一条直线 —— 这叫<b>线性遗憾</b>。");
    },"<b>看什么：</b>四根柱子<b>一样高</b>，从一千步到五万步<b>一点没降</b>。每步的损失不降，累积起来就是一条直线 —— 这就是「线性遗憾」的全部含义，也是这一讲判所有天真做法出局的那把尺子。　—— 用「每千步遗憾」这个量来看，最直观。  均匀随机探索，三个臂 (0.5, 0.45, 0.4)，200 次独立重复：  T=10³ → <b>50.06</b> T=5×10³ → <b>49.98</b> T=2×10⁴ → <b>50.03</b> T=5×10⁴ → <b>50.01</b>  <b>完全不动。</b>而且这个数可以手算对上：均匀随机每步的期望差距 = (0 + 0.05 + 0.10)/3 = 0.05，每千步就是 50.0。实测四个数全在 50.0 上下 0.1 以内。  每步损失不降，累积遗憾就是一条<b>直线</b>。这叫<b>线性遗憾</b>——而它意味着：<b>时间再长也追不上</b>，亏损的绝对量随 T 无限增长，占比也不降。  这把尺子下一集就要用来判三个最自然的做法。");
  /* 反驳 */
  S(671,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"最终多好",sub:"渐近判据",state:"dead"},
      {label:"多快变好",sub:"遗憾",state:"on"},
      {label:"早期的错",sub:"永久记账",state:"on"}]});
      note("平均会冲淡，求和不会",640,420,"y");
      setCap("<b>指名反驳</b>：遗憾量的是<b>多快变好</b>，不是最终多好。");
    },"指名回去：平均奖励量的是<b>最终多好</b>，遗憾量的是<b>多快变好</b>。  差别全在「求和」这个动作上：<b>平均会把早期的错除掉，求和不会</b>。遗憾把每一步的损失永久记在账上，这正是我们要的——因为那些步里的每一个，都是一个真实的人。  判据于是变成一句话：<b>遗憾要是次线性的</b>。次线性意味着每步的平均损失<b>趋于零</b>，也就是说算法真的越来越接近最优，而不只是「最终会」。  下一集把这把尺子架到三个最自然的做法上。结果会有点难看——<b>三个全不及格</b>，包括那个大家都以为「已经在探索了」的。");
  SUM(623,2,{h:"遗憾 = 累积的机会损失，量的是「多快变好」",
    k:"差距 <b>Δ_a = Q(a*) − Q(a)</b>；遗憾 <b>Regret(T) = Σ_{t=1}^T Δ_{a_t}</b>。相对「一直拉最优臂」这个不可能的基准，一共亏了多少。",
    m:"为什么必须<b>求和</b>而不是平均：平均会把早期的错<b>除掉</b>；而如果那些步里每一步是一个病人，那个代价不该被除掉。",
    w:"<s>误解</s>：「看平均奖励就行」。两个毛病：不减基准就无法跨问题比较；且<b>后期的好表现会冲淡早期的代价</b>。",
    e:"判据：<b>遗憾要次线性</b>。实测均匀随机的每千步遗憾 50.06/49.98/50.03/50.01 —— <b>平不下来</b>，手算基准 (0+0.05+0.10)/3×1000 = 50.0 对上。"});
  QUIZ(623,2,{t:"为什么用「累积遗憾」而不是「平均奖励」来衡量算法？",
    o:["因为平均奖励难以计算","<b>因为平均会把早期的损失除掉，而累积求和把每一步的代价永久记在账上</b>","因为平均奖励不是无偏估计","因为遗憾总是有界的"],
    a:1,
    w:"一个算法前 1000 步全在乱试、之后 99000 步全对，它的<b>平均</b>奖励几乎等于最优 —— 那 1000 步的代价被除掉了。而如果那 1000 步里每一步是一个病人，代价不该被除掉。<b>求和不会冲淡</b>。平均奖励还有第二个毛病：不减去 Q(a*) 这个基准就无法跨问题比较。<s>「难以计算」</s>不是理由，两者都好算。<s>「不是无偏估计」</s>与此无关。<s>「遗憾总是有界」</s><b>恰恰相反</b> —— 线性遗憾正是无界增长的，这一讲的全部努力就是把它压到次线性。"});
});

KP("3 · 贪心和固定 ε-贪心都是<b>线性</b>遗憾 —— 有探索不等于够",function(){
  /* 钩子 */
  S(1032,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:290,items:[
      {label:"贪心",sub:"总拉均值最高的",state:"dead"},
      {label:"ε-贪心",sub:"偶尔随机",state:"dead"},
      {label:"均匀随机",sub:"一直乱拉",state:"dead"}]});
      note("三个都线性",640,420,"r");
      setCap("三个最自然的做法，用上一集那把尺子一量 —— <b>全不及格</b>。");
    },"把遗憾这把尺子架到三个最自然的做法上。  <b>贪心</b>：总拉当前经验均值最高的臂。 <b>ε-贪心</b>：以 ε 的概率随便拉一个，其余时候贪心。ε 固定。 <b>均匀随机</b>：一直随便拉。  结果：<b>三个全是线性遗憾</b>。  均匀随机线性，这不意外——它压根不学。贪心线性，也容易接受——它不探索。  意外的是中间那个。<b>ε-贪心一直在探索，而它仍然是线性的。</b>这一集就是要说清这件事。");
  /* 错误答案 */
  S(1044,function(){
      clearScene();setEq(null);
      setBig("ε-贪心已经在探索了","有探索就够了吧");
      setCap("「有探索」和「探索得对」是两件事。<b>固定的 ε 永远不停</b>。");
    },"这是这一讲最值得停下来的错误模型，因为 ε-贪心几乎是所有人写的第一个探索算法，而且它<b>确实会收敛到最优臂</b>。  它的毛病不在「学不到」，在<b>「学到之后还在乱拉」</b>。  固定的 ε 意味着：哪怕你已经把三个臂的均值估到小数点后四位、已经百分之百确定哪个最好，你<b>仍然</b>会以 ε 的概率随机挑一个。第一百万步和第十步，探索的力度<b>一模一样</b>。  下一镜算出这个代价的确切大小——它是一个<b>不随 T 衰减的正数</b>。");
  /* 铺陈 */
  S(1056,function(){
      clearScene();setBig(null);
      setEq("$$\\text{每步遗憾}\\ \\longrightarrow\\ \\frac{\\varepsilon}{m}\\sum_a \\Delta_a\\ >\\ 0$$","top");
      note("这是个正数，不是 0",640,320,"r lg");
      setCap("固定 ε 的每步遗憾收敛到一个<b>正数</b> —— 于是累积遗憾是<b>直线</b>。");
    },"把 ε-贪心的渐近每步遗憾算出来。  等到均值估准之后，贪心那部分不再犯错，损失全部来自随机探索的那 ε 份。随机探索均匀地落在 m 个臂上，所以每步的期望损失是 <b>(ε/m)·Σ_a Δ_a</b>。  代进这一集的三个臂 (0.5, 0.45, 0.4)、ε=0.1：  (0.1/3) × (0 + 0.05 + 0.10) = <b>0.005 每步</b>，也就是<b>每千步 5.00</b>。  关键在于<b>它是一个正数，而且不随 T 变</b>。每步损失不趋于零，累积起来就是斜率 0.005 的<b>直线</b>。  这就是「固定 ε 是线性遗憾」的全部内容——不是它学不到，是它<b>学到之后仍然按同样的力度在犯错</b>。");
  /* 主体 */
  S(1068,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3],step:420,vals:[6.588,5.318,5.070,5.034],
      x:330,y:350,w:620,h:150,max:8,
      label:function(i){return ["10⁴","5×10⁴","2×10⁵","5×10⁵"][i];},
      cls:function(i){return i===3?"r":"y";},
      fmt:function(v){return v.toFixed(3);}});
      note("ε-贪心的每千步遗憾",640,392,"sm");
      setCap("降、降、<b>停住</b> —— 停在 <b>5.034</b>，而理论值是 <b>5.00</b>。");
    },"<b>看什么：</b>看四根柱子<b>先降后停</b>。前两根明显在降，第三第四根几乎一样高 —— 它<b>停在了 5.03 附近</b>，而不是继续往 0 去。停住的那个高度正是上一镜手算的 ε/m·ΣΔ = 5.00。柱子不再下降的那一刻，就是「线性」被看见的那一刻。　—— 实测。40 次独立重复，三个臂 (0.5, 0.45, 0.4)，ε=0.1，看<b>每千步遗憾</b>：  T=10⁴ → <b>6.588</b> T=5×10⁴ → <b>5.318</b> T=2×10⁵ → <b>5.070</b> T=5×10⁵ → <b>5.034</b>  <b>停住了。</b>而且停在 5.00——正是上一镜手算的 (ε/m)·ΣΔ。  这里有一个陷阱值得说：如果你只跑到 T=10⁴ 就看，会看到 6.588 这个数还在往下走，很容易误判成「在收敛到零」。<b>必须跑到足够长，才看得出它是停住还是继续降。</b>这也是为什么这一讲需要一个<b>定理</b>而不只是几条实验曲线。  对照：同一组实验里，UCB 在这四个时刻是 <b>12.981 / 4.538 / 1.588 / 0.724</b>——<b>一路降，没有停</b>。注意 T=10⁴ 时 UCB 还比 ε-贪心<b>差一倍</b>，它是后来居上的。");
  /* 反驳 */
  S(1080,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:290,items:[
      {label:"贪心",sub:"45% 锁死",state:"dead"},
      {label:"固定 ε",sub:"停在正数",state:"dead"},
      {label:"要的是",sub:"探索会收",state:"on"}]});
      note("探索要随把握变小",640,420,"y");
      setCap("<b>指名反驳</b>：不是「有没有探索」，是<b>探索会不会随把握变小</b>。");
    },"指名回去：问题不在「有没有探索」，在<b>探索会不会随着把握增加而收缩</b>。  三个做法的毛病各不相同：  <b>贪心</b>：探索为零，会锁死。实测 2000 次独立重复、T=3000，有 <b>899 次（45.0%）</b>最终把大多数拉动给了次优臂。而这个比例<b>不随 T 衰减</b>——锁死就是永久的，所以期望遗憾里始终留着一份线性项。 <b>均匀随机</b>：探索恒为 1，永不收缩。 <b>固定 ε</b>：探索恒为 ε，同样<b>永不收缩</b>。  它们在光谱的两端和中间，但犯的是<b>同一个错</b>：探索的力度是一个<b>与把握无关的常数</b>。  所以要的东西现在清楚了：一个探索力度<b>随不确定性自动收缩</b>的规则。  但在去找它之前，下一集先问一个该先问的问题：<b>最好能做到多好？</b>如果理论上限本来就是线性，上面这些批评就没有意义了。");
  SUM(1032,3,{h:"贪心、固定 ε-贪心、均匀随机 —— 三个全是线性遗憾",
    k:"固定 ε 的每步遗憾收敛到 <b>(ε/m)·Σ_a Δ_a > 0</b>，不是收敛到 0。三臂 (0.5,0.45,0.4)、ε=0.1 时 = <b>0.005/步 = 每千步 5.00</b>。",
    m:"实测每千步遗憾 <b>6.588 → 5.318 → 5.070 → 5.034</b>（T 到 5×10⁵，40 次重复）：<b>停住了</b>，正好停在手算值上。",
    w:"<s>误解</s>：「ε-贪心已经在探索了，够了」。它确实收敛到最优臂 —— 毛病是<b>学到之后仍按同样力度乱拉</b>，第一百万步和第十步一模一样。",
    e:"三者犯的是<b>同一个错</b>：探索力度是与把握无关的常数（0 / ε / 1）。贪心还会<b>锁死</b>：2000 次重复里 <b>45.0%</b> 停在次优臂，且比例不随 T 衰减。<b>陷阱</b>：只跑到 T=10⁴ 会看到 6.588 仍在降，误以为次线性。"});
  QUIZ(1032,3,{t:"固定 ε 的 ε-贪心为什么是线性遗憾？",
    o:["因为它收敛不到最优臂","<b>因为它的每步遗憾收敛到正数 (ε/m)·ΣΔ_a，而不是收敛到 0</b>","因为 ε 太大了，调小就不是线性了","因为它的经验均值估计有偏"],
    a:1,
    w:"ε-贪心<b>确实</b>收敛到最优臂 —— 毛病不在这里。等均值估准后，损失全部来自那 ε 份随机探索：每步 <b>(ε/m)·ΣΔ_a</b>，三臂 (0.5,0.45,0.4)、ε=0.1 时是 0.005/步。这是个<b>正数且不随 T 变</b>，累积起来就是直线。实测每千步遗憾 6.588→5.318→5.070→<b>5.034</b>，停在手算的 5.00。<s>「收敛不到」</s>是事实错误。<s>「调小 ε」</s>只改直线的<b>斜率</b>，不改它是直线 —— 而且 ε 越小锁死风险越大。<s>「均值有偏」</s>不对，样本均值是无偏的。"});
});

KP("4 · 下界：常数遗憾做不到，<b>log T</b> 是能指望的最好结果",function(){
  /* 钩子 */
  S(2278,function(){
      clearScene();setBig(null);setEq(null);
      note("线性做不得",400,300,"r lg");
      note("那最好能到多好",880,300,"y lg");
      note("先问上限，再去找算法",640,400,"sm lg");
      setCap("批评完三个做法，该问一句：<b>理论上限本来是多少</b>？");
    },"上一集判了三个做法出局。但在去造新算法之前，有一个该先问的问题：  <b>最好能做到多好？</b>  这个顺序很重要。如果理论上限本来就是线性遗憾，那上一集那些批评就毫无意义——不是算法不行，是问题本身不允许。  所以先找下界。下界告诉你两件事：<b>哪些目标是白费力气</b>，以及<b>哪个目标值得去追</b>。  这一集只做这一件事。");
  /* 错误答案 */
  S(2290,function(){
      clearScene();setEq(null);
      setBig("前期探索完就一直贪心","这样遗憾应该是常数");
      setCap("<b>常数遗憾做不到</b>。任何算法都会被一对足够接近的臂骗到。");
    },"最自然的期望是：先花固定的若干步把每个臂都试够，估准了，之后一直拉最好的。这样总遗憾就是那段探索期的代价——一个<b>常数</b>，不随 T 增长。  听上去无懈可击。<b>但它做不到。</b>  原因在于「估准」这件事没有终点。给定<b>任何</b>固定的探索预算，总存在一对足够接近的臂，用这个预算区分不开。而一旦你选错了，之后的每一步都在亏——线性地亏。  下一镜把这个「区分不开」量化成一个公式。");
  /* 铺陈 */
  S(2302,function(){
      clearScene();setBig(null);
      setEq("$$\\liminf_{T\\to\\infty}\\frac{\\mathrm{Regret}(T)}{\\log T}\\ \\ge\\ \\sum_{a:\\,\\Delta_a>0}\\frac{\\Delta_a}{KL(R_a\\,\\|\\,R_{a^*})}\\,$$","top");
      note("差距在分子",420,330,"b lg");
      note("可区分度在分母",880,330,"v lg");
      setCap("Lai–Robbins 下界：遗憾至少<b>随 log T 增长</b>，系数由差距和 KL 决定。");
    },"下界的形状是这样的：任何「合理」的算法，遗憾除以 log T 的下极限，不小于一个由问题本身决定的常数。  那个常数是对每个次优臂求和，每一项是 <b>Δ_a 除以 KL(R_a ‖ R_{a*})</b>。  两个部分各有含义：  <b>分子 Δ_a</b>：拉错这个臂一次亏多少。 <b>分母 KL</b>：这个臂的奖励分布和最优臂的<b>有多好区分</b>。KL 越小越难区分，需要的样本越多。  于是整项就是「<b>区分它需要的样本数 × 每次亏的量</b>」。  注意最要紧的一点：<b>右边是一个正数，左边除的是 log T</b>。这意味着遗憾<b>至少</b>要随 log T 增长——常数遗憾被明确排除了。");
  /* 主体 */
  S(2314,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3],step:420,vals:[2.43,4.97,9.98,24.99],
      x:330,y:410,w:620,h:150,max:28,
      label:function(i){return ["Δ=.20","Δ=.10","Δ=.05","Δ=.02"][i];},
      cls:function(i){return i>=2?"r":"y";},
      fmt:function(v){return v.toFixed(2);}});
      note("下界系数 Δ/KL",640,452,"sm");
      setCap("差距<b>减半</b>，下界系数就<b>翻倍</b> —— 越接近的臂越难分开。");
    },"<b>看什么：</b>从左到右差距一路变小，柱子却一路<b>变高</b>。这是反直觉的地方：两个臂越像，区分它们<b>越贵</b>。看数字 —— 差距每减半（.20→.10→.05），系数就<b>翻倍</b>（2.43→4.97→9.98）。　—— 把伯努利臂代进去算。最优臂 0.5，看不同差距的次优臂：  Δ=0.20 → 系数 <b>2.43</b> Δ=0.10 → 系数 <b>4.97</b> Δ=0.05 → 系数 <b>9.98</b> Δ=0.02 → 系数 <b>24.99</b>  <b>差距减半，系数翻倍。</b>  这个反比关系有一个干净的解释：KL 在 p 附近约等于 Δ²/(2p(1−p))，所以 Δ/KL ≈ <b>2p(1−p)/Δ</b>。代 p=0.5：2×0.25/Δ = 0.5/Δ。四个数分别是 2.50、5.00、10.00、25.00——和精确值 2.43、4.97、9.98、24.99 几乎重合。  直觉是：<b>亏得少</b>（Δ 小）不等于<b>好办</b>，因为你<b>也更难发现自己亏了</b>。两个效应的比值恰好让难度随 Δ 反比增长。");
  /* 反驳 */
  S(2326,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:290,items:[
      {label:"常数遗憾",sub:"被排除",state:"dead"},
      {label:"线性遗憾",sub:"太差",state:"dead"},
      {label:"log T",sub:"值得去追",state:"on"}]});
      note("下界在指路",640,420,"y");
      setCap("<b>指名反驳</b>：常数做不到；但 <b>log T 没被禁止</b> —— 于是值得去找。");
    },"指名回去：「探索完就一直贪心」给不出常数遗憾，因为总有一对臂用固定预算区分不开。  但下界真正的价值在另一面：<b>它没有禁止 log T</b>。  于是目标清楚了：<b>找一个遗憾是 log T 量级的算法</b>。这个目标不是拍脑袋定的，是下界画出来的。  这一讲最后证出来的 UCB 界是 O(√(mT log(T²/δ)))，形状上比 log T 差——它是<b>不依赖差距</b>的界，对所有问题一致成立，代价是比逐问题的 log T 松。两种界各有用处，别把它们当成一回事。  说一句实测的对照，顺便纠正一个容易犯的误读：三臂 (0.5, 0.45, 0.4) 的下界系数合计是 <b>14.95</b>。T=5×10⁵ 时下界约 <b>196</b>，实测 UCB 是 <b>362</b>——<b>1.85 倍</b>，同一量级。但在 T=10⁴ 时实测 129.8 反而<b>低于</b>下界的 137.7——这<b>不是矛盾</b>：Lai–Robbins 是 T→∞ 的下极限，有限 T 上本来就可以在它之下。  下一集去找那个算法。它的想法只有一句话。");
  SUM(2278,4,{h:"常数遗憾做不到；log T 是能指望的最好结果",
    k:"<b>liminf Regret(T)/log T ≥ Σ_{Δ_a>0} Δ_a / KL(R_a‖R_{a*})</b>。分子 = 拉错一次亏多少，分母 = 两个分布<b>有多好区分</b>。",
    m:"差距<b>减半</b>系数就<b>翻倍</b>：Δ=.20/.10/.05/.02 → 2.43/4.97/9.98/24.99。因为 KL ≈ Δ²/(2p(1−p))，所以 Δ/KL ≈ <b>2p(1−p)/Δ</b>。",
    w:"<s>误解</s>：「前期探索完就一直贪心 = 常数遗憾」。给定<b>任何</b>固定预算，总有一对臂区分不开；一旦选错，之后每步都线性地亏。",
    e:"下界真正的价值是<b>它没禁止 log T</b>。实测：三臂下界系数 14.95，T=5×10⁵ 时下界 196、UCB 362（1.85 倍）。<b>T=10⁴ 时实测 129.8 低于下界 137.7 并不矛盾</b> —— Lai–Robbins 是 T→∞ 的下极限。"});
  QUIZ(2278,4,{t:"Lai–Robbins 下界里 Δ_a / KL(R_a‖R_{a*}) 这一项，为什么差距越小反而越大？",
    o:["因为差距小的时候算法更容易犯错，每次亏得更多","<b>因为 KL ≈ Δ²/(2p(1−p)) 比 Δ 掉得更快：亏得少，但也更难发现自己在亏</b>","因为 KL 散度在分布接近时趋于无穷","因为差距小的臂需要被拉的次数是常数"],
    a:1,
    w:"分子 Δ_a 确实随差距变小，但分母 KL 是<b>二阶</b>小量（KL ≈ Δ²/(2p(1−p))），掉得更快，所以比值 ≈ <b>2p(1−p)/Δ</b> 反而涨。代 p=0.5：Δ=.20/.10/.05/.02 给出 2.43/4.97/9.98/24.99，与近似值 2.50/5.00/10.00/25.00 几乎重合。直觉：<b>亏得少不等于好办，因为你也更难发现自己亏了</b>。<s>「每次亏得更多」</s>反了 —— Δ 小就是每次亏得少。<s>「KL 趋于无穷」</s>反了 —— 分布接近时 KL 趋于 <b>0</b>。<s>「常数次」</s>正相反，需要的次数随 1/Δ² 增长。"});
});

KP("5 · 乐观面对不确定：一次乐观的拉动<b>两难都赢</b>",function(){
  /* 钩子 */
  S(2365,function(){
      clearScene();setBig(null);setEq(null);
      note("乐观面对不确定",640,290,"y lg");
      note("整个算法就这一句",640,370,"sm lg");
      setCap("下界说 log T 可以争取。这一集的想法<b>只有一句话</b>。");
    },"目标有了：找一个遗憾是对数量级的算法。  想法只有一句话：<b>乐观面对不确定</b>（optimism in the face of uncertainty）。  具体做法也只有一句：不要拉<b>均值</b>最高的臂，要拉<b>上置信界</b>最高的臂。  这一集说清两件事：为什么这一句就够，以及它凭什么比贪心好。");
  /* 错误答案 */
  S(2377,function(){
      clearScene();setEq(null);
      setBig("拉均值最高的臂","用最好的估计做决定，这才理性");
      setCap("点估计<b>扔掉了</b>「我有多不确定」—— 而那恰恰是该用来决策的信息。");
    },"这个错误模型听起来像纯粹的理性：手上有对每个臂的最好估计，就按最好的估计行动。  毛病在于<b>点估计扔掉了信息</b>。  两个臂，经验均值都是 0.6。第一个拉过 <b>1000</b> 次，第二个拉过 <b>3</b> 次。贪心看这两个臂<b>完全一样</b>。  但它们显然不一样：第一个几乎确定就是 0.6，第二个可能是 0.9 也可能是 0.2。<b>那个不确定性本身是有价值的</b>——它标出了「这里可能藏着更好的东西」。  贪心把它扔了。下一镜看怎么把它捡回来。");
  /* 铺陈 */
  S(2389,function(){
      clearScene();setBig(null);
      setEq("$$a_t=\\arg\\max_a\\ \\big[\\hat{Q}_t(a)+u_t(a)\\big]$$","top");
      note("点估计",470,330,"b lg");
      note("不确定的半径",840,330,"v lg");
      setCap("规则：拉 <b>估计 + 半径</b> 最大的臂 —— 拉过越少的臂，半径越宽。");
    },"规则写出来只有一行：每一步，拉「经验均值 <b>加上</b> 一个不确定半径」最大的那个臂。  这个和数叫<b>上置信界</b>，记作 U_t(a)。半径 u_t(a) 随这个臂被拉的次数<b>增加而收缩</b>。  回到上一镜那两个臂：均值都是 0.6，但拉过 3 次那个的半径<b>宽得多</b>，于是它的上置信界更高，于是它<b>会被选中</b>。  注意这条规则同时做了两件事，而且<b>没有分成两个模式</b>：  它<b>不是</b>「有时探索、有时利用」。它只有一个判据。探索和利用被合并进了同一个数里——<b>均值高</b>（利用）和<b>没怎么试过</b>（探索）都会把这个数抬高。  这是它比 ε-贪心高明的地方：ε-贪心的探索是<b>外挂的、随机的、恒定的</b>；UCB 的探索是<b>内生的、定向的、会自动收缩的</b>。");
  /* 主体 */
  S(2401,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:270,gap:330,items:[
      {label:"乐观拉一下",sub:"两种结局",state:"on"},
      {label:"它真好",sub:"不亏",state:"on"},
      {label:"它不好",sub:"界会收缩",state:"on"}]});
      note("两难都赢",640,410,"y");
      setCap("<b>为什么这一句就够</b>：乐观的拉动只有两种结局，<b>两种都可以接受</b>。");
    },"为什么「拉上置信界最高的」这一条规则就够？  因为一次乐观的拉动只有两种结局，而<b>两种都可以接受</b>：  <b>结局一：它真的好。</b>那你拉对了，这一步几乎没有遗憾。  <b>结局二：它其实不好。</b>那你亏了这一步——但你<b>拿到了一个样本</b>，它的均值会被拉下来、半径会收缩，于是这个臂的上置信界下降，以后不会再被反复选中。<b>你为这一步付了钱，买到了信息。</b>  关键在于结局二的代价是<b>有限的</b>：一个臂的上置信界只能被「骗」有限多次，因为每次被拉半径都在缩。<b>错误是自限的。</b>  对比贪心：贪心犯的错<b>不自限</b>——它一旦锁死在次优臂上，就没有任何机制让它回头。这就是上一集那 45% 锁死率的来源。  这个「两难都赢」的论证，就是后面四集那个证明的直觉版本。证明要做的事，是把「两种都可以接受」翻译成一个可以求和的不等式。");
  /* 反驳 */
  S(2413,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:290,items:[
      {label:"贪心",sub:"错误不自限",state:"dead"},
      {label:"固定 ε",sub:"探索不收缩",state:"dead"},
      {label:"乐观",sub:"两者都解决",state:"on"}]});
      note("不确定性当理由，不当噪声",640,420,"y");
      setCap("<b>指名反驳</b>：别拉均值最高的。<b>不确定性是决策依据，不是待消除的噪声</b>。");
    },"指名回去：不该拉均值最高的臂，因为点估计<b>扔掉了不确定性</b>，而不确定性正是该拿来做决策的东西。  把三个做法的毛病对照着看，就知道乐观为什么一次解决了两个：  <b>贪心</b>的毛病是<b>错误不自限</b>——锁死了就回不来。乐观解决它：被高估的臂一定会被拉到，拉到就会被修正。 <b>固定 ε</b> 的毛病是<b>探索不收缩</b>——把握再大也照样乱拉。乐观解决它：半径随拉动次数自动缩，把握大了探索自然就停了。  换一句话说：<b>不确定性是决策的依据，不是一个待消除的噪声</b>。  剩下的四集把这句话变成一个定理。下一集先补上最基础的一块：<b>那个半径到底该多宽</b>——凭什么是这个数，不是别的数。");
  SUM(2365,5,{h:"乐观面对不确定：拉「估计 + 半径」最大的臂",
    k:"<b>a_t = argmax_a [ Q̂_t(a) + u_t(a) ]</b>。探索和利用被合并进<b>同一个数</b> —— 均值高（利用）和没怎么试过（探索）都会把它抬高。",
    m:"<b>两难都赢</b>：乐观的拉动要么真的好（不亏），要么不好（但均值被拉下、半径收缩，<b>错误自限</b>）。这就是后面那个证明的直觉版本。",
    w:"<s>误解</s>：「拉均值最高的才理性」。两个臂均值都 0.6，一个拉过 1000 次一个拉过 3 次 —— 贪心看它们<b>完全一样</b>，而它们显然不一样。",
    e:"一次解决两个毛病：贪心<b>错误不自限</b>（45% 锁死），固定 ε <b>探索不收缩</b>。乐观的探索是<b>内生、定向、自动收缩</b>的，不是外挂的随机扰动。"});
  QUIZ(2365,5,{t:"「乐观面对不确定」为什么能同时解决贪心和固定 ε-贪心的毛病？",
    o:["因为它在前期探索、后期利用，分成了两个阶段","<b>因为半径随拉动次数自动收缩：被高估的臂一定会被拉到并修正，而把握变大后探索自然停止</b>","因为它使用了比样本均值更准的估计量","因为它需要知道每个臂的真实方差"],
    a:1,
    w:"UCB <b>没有</b>分阶段，也没有两个模式：只有一个判据 Q̂+u，均值高（利用）和没怎么试过（探索）都会把它抬高。对贪心的<b>错误不自限</b>：被高估的臂上置信界最高，一定会被拉到，拉到就被修正。对固定 ε 的<b>探索不收缩</b>：半径随 n 增加而缩，把握大了探索自动停。<s>「分两个阶段」</s>是 explore-then-commit，那正是 KP4 排除掉的做法。<s>「更准的估计量」</s>不对 —— 用的就是样本均值。<s>「需要真实方差」</s>恰恰相反，下一集用 Hoeffding 正是<b>因为不知道方差</b>。"});
});

KP("6 · Hoeffding 给出半径 —— 板上那个 <b>u 不是 μ</b>",function(){
  /* 钩子 */
  S(2700,function(){
      clearScene();setBig(null);setEq(null);
      note("半径该多宽",640,290,"y lg");
      note("宽了太保守，窄了会骗自己",640,370,"sm lg");
      setCap("规则依赖那个半径。<b>它不能随便定</b> —— 整个保证都挂在它上面。");
    },"上一集的规则是「拉 Q̂ + u 最大的臂」。这一集回答：<b>u 该多宽</b>。  这不是调参。半径的宽度决定了整个算法的性格：  <b>太宽</b>：所有臂的上置信界都很高，算法一直在试，退化成均匀随机。 <b>太窄</b>：置信区间不再包含真值，最优臂可能被永久低估，算法退化成贪心，会锁死。  所以半径必须由一个<b>保证</b>推出来，而不是试出来。这一集就是那个推导。");
  /* 错误答案 */
  S(2712,function(){
      clearScene();setEq(null);
      setBig("±1.96 σ/√n","标准的 95% 置信区间");
      setCap("σ <b>是未知的</b> —— 它就是我们要估的那个分布的方差。");
    },"第一反应通常是正态近似的置信区间：±1.96 倍标准误。  两个问题。  <b>第一，σ 是未知的。</b>每个臂的奖励分布就是我们要学的东西，方差当然也不知道。用样本方差替代在这里不安全——尤其在只拉过两三次的时候，样本方差本身极不可靠，而那正是半径最要紧的时刻。  <b>第二，1.96 来自中心极限定理，是<b>渐近</b>的。</b>n=3 的时候它没有保证。而这一整块课的主题恰恰是<b>不要渐近保证</b>。  需要的是一个对<b>任意 n</b>都成立、且<b>不需要知道方差</b>的不等式。");
  /* 铺陈 */
  S(2724,function(){
      clearScene();setBig(null);
      setEq("$$P\\big(Q(a)>\\hat{Q}_t(a)+u\\big)\\ \\le\\ e^{-2nu^2}$$","top");
      note("只要奖励有界",420,330,"g lg");
      note("不需要知道方差",880,330,"g lg");
      setCap("Hoeffding：<b>只要奖励落在 [0,1]</b>，对<b>任意 n</b> 都成立。");
    },"Hoeffding 不等式：如果奖励有界（这里取 [0,1]），那么真均值超出经验均值加 u 的概率，不超过 <b>exp(−2nu²)</b>。  它换掉了正态近似的两个前提：  不需要知道方差——只需要知道<b>取值范围</b>。 不需要 n 大——对<b>每一个</b> n 都成立。  代价是它比正态区间<b>宽</b>：同样 n=100、δ=0.05，Hoeffding 给 <b>0.2470</b>，正态近似给 <b>0.0980</b>，宽 <b>2.5 倍</b>。  这个代价是该付的：宽出来的部分买的是「不假设分布」和「小 n 也成立」。而且下一集会看到，它还要买第三样东西——<b>所有臂、所有时刻同时成立</b>。  标一处记号陷阱：<b>exp(−2nu²) 是「整个 2nu² 在指数上」</b>，不是 exp(−2n) 乘 u²。差多少？n=100、u=0.247 时，前者是 5.0×10⁻⁶，后者是 8.4×10⁻⁸⁹。字幕把它念成了「exponential minus 2 n u squared」，容易读错。");
  /* 主体 */
  S(2736,function(){
      clearScene();setBig(null);
      setEq("$$e^{-2nu^2}=\\frac{\\delta}{t^2}\\ \\Longrightarrow\\ u_t(a)=\\sqrt{\\frac{\\log\\!\\big(t^2/\\delta\\big)}{2\\,n_t(a)}}$$","top");
      note("先定失败预算，再反解半径",640,330,"y lg");
      setCap("<b>反着用</b>：先说「我允许它以多大概率失败」，再解出半径。");
    },"关键的一步是<b>反着用</b>这个不等式。  不是「给定 u，失败概率是多少」，而是<b>「我允许多大的失败概率，那 u 该是多少」</b>。  设失败预算为 δ/t²（为什么是 t² 而不是常数，下下集专讲），令 exp(−2nu²) = δ/t²，两边取对数解出：  <b>u_t(a) = √( log(t²/δ) / (2·n_t(a)) )</b>  我数值回代验证过：n=100、t=100、δ=0.05 给出 u=0.2470，代回 exp(−2nu²) = 5.0×10⁻⁶，正好等于 δ/t² = 0.05/10000 = 5.0×10⁻⁶。  <b>三处记号陷阱一并标出，这一条式子上全齐了：</b>  转录稿把这个 <b>u 写成了 μ 或 ν</b>。而 μ 在老虎机文献里标准地表示<b>臂的均值</b>（本讲用 Q(a) 表示那个）。<b>把这里每一个 μ 都读成置信半径，绝不能读成均值。</b>  <b>根号盖住整个表达式</b>。转录稿有一处写成「Q̂ + 1/(2N) × log(t²/δ)」，没有根号——量纲和数值都错。  分母是 <b>2n</b>，n 是<b>这个臂</b>被拉的次数；分子里的 <b>t</b> 是<b>总步数</b>。<b>这是两个不同的计数器</b>，最后一集会看到它们方向相反。");
  /* 反驳 */
  S(2748,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1],step:760,vals:[0.2470,0.0980],
      x:400,y:410,w:480,h:150,max:0.30,
      label:function(i){return ["Hoeffding","正态近似"][i];},
      cls:function(i){return i===0?"g":"r";},
      fmt:function(v){return v.toFixed(4);}});
      note("n=100 时的半径",640,452,"sm");
      setCap("<b>指名反驳</b>：不用 σ，用<b>有界性</b>。宽 2.5 倍 —— 而那正是<b>保证的价格</b>。");
    },"<b>看什么：</b>左边那根<b>明显更高</b> —— Hoeffding 的半径是正态近似的 <b>2.5 倍</b>。宽出来的部分不是浪费：它买的是「不知道方差也成立」「n 很小也成立」，以及下一集要用的「所有臂所有时刻<b>同时</b>成立」。　—— 指名回去：不能用 ±1.96σ/√n，因为 <b>σ 未知</b>，而且 1.96 是渐近的。  换成 Hoeffding，只需要<b>奖励有界</b>，对任意 n 都成立。代价是区间更宽：n=100 时 <b>0.2470</b> 对 <b>0.0980</b>，宽 2.5 倍；n=1000 时这个倍数还会涨到 3.0。  <b>这个宽度就是保证的价格。</b>正态近似便宜，但它在 n=3 的时候给不出任何东西，而 n=3 恰恰是你最需要它的时候。  半径有了，规则有了。但还缺两块，都是证明里最有意思的部分：  <b>下一集</b>：遗憾的定义里有 Q(a*)，而我们<b>根本不知道哪个是 a\\*</b>——怎么把它消掉。 <b>再下一集</b>：一个区间成立是 1−δ，那 m 个臂、T 个时刻<b>同时</b>成立呢？");
  SUM(2700,6,{h:"Hoeffding 给出半径：u = √( log(t²/δ) / (2n) )",
    k:"<b>P(Q > Q̂ + u) ≤ exp(−2nu²)</b>，只要奖励有界、对<b>任意 n</b> 成立。<b>反着用</b>：令它等于失败预算 δ/t²，解出 u。数值回代已验（n=t=100, δ=.05 → u=0.2470 → 5.0×10⁻⁶ = δ/t²）。",
    m:"不能用 ±1.96σ/√n：<b>σ 未知</b>（它就是要学的东西），且 1.96 来自 CLT 是<b>渐近</b>的，n=3 时没保证。",
    w:"<s>误解</s>：「用标准 95% 置信区间」。Hoeffding 宽 <b>2.5 倍</b>（n=100 时 0.2470 vs 0.0980）—— <b>那是保证的价格</b>。",
    e:"<b>记号陷阱三连</b>：① 转录稿的 <b>μ/ν 是半径 u，不是均值</b>（文献里 μ 才是均值，本讲用 Q(a)）；② <b>根号盖住整个表达式</b>；③ <b>exp(−2nu²) 整体在指数上</b>（n=100,u=.247 时 5.0×10⁻⁶ vs 8.4×10⁻⁸⁹）。"});
  QUIZ(2700,6,{t:"为什么用 Hoeffding 不等式而不是 ±1.96σ/√n 来定置信半径？",
    o:["因为 Hoeffding 给出的区间更窄，效率更高","<b>因为 σ 未知，且 1.96 是渐近的；Hoeffding 只需要奖励有界，对任意 n 都成立</b>","因为奖励不服从正态分布，正态区间完全无效","因为 Hoeffding 不需要知道 n"],
    a:1,
    w:"σ 就是我们要学的分布的方差，<b>当然不知道</b>；而 1.96 来自中心极限定理，是 n→∞ 的渐近结果，在 n=3 时没有保证 —— 而 n=3 正是半径最要紧的时刻。Hoeffding 只要<b>奖励有界</b>，对<b>每一个</b> n 成立。<s>「更窄」</s>反了：n=100 时 Hoeffding 是 <b>0.2470</b>，正态近似 <b>0.0980</b>，宽 2.5 倍，这是保证的价格。<s>「完全无效」</s>太强 —— 正态近似在 n 大时是好的，问题是这里需要小 n 也成立。<s>「不需要知道 n」</s>是事实错误，公式里 n 就在分母上。"});
});

KP("7 · 两情形引理：把<b>不可观测</b>的 Q(a*) 从遗憾里消掉",function(){
  /* 钩子 */
  S(3274,function(){
      clearScene();setBig(null);
      setEq("$$\\mathrm{Regret}(T)=\\sum_{t=1}^{T}\\big[\\,Q(a^*)-Q(a_t)\\,\\big]$$","top");
      note("这个我们不知道",480,330,"r lg");
      note("这个也不知道",840,330,"r lg");
      setCap("要证的东西里有<b>两个不可观测的量</b> —— 而 a* 我们压根不知道是哪个。");
    },"现在有规则，有半径。要证遗憾的界，先看看要证的东西长什么样。  Regret(T) = Σ_t [ Q(a*) − Q(a_t) ]  里面有两个量我们都不知道：<b>Q(a*)</b>（最优臂的真均值）和 <b>Q(a_t)</b>（拉过的臂的真均值）。而 a* 是哪个臂，我们<b>压根不知道</b>——整个算法就是在找它。  这看上去是个死结：要证的量本身不可观测。  这一集是解开它的那一步，而且它是整个证明里最漂亮的一处。");
  /* 错误答案 */
  S(3286,function(){
      clearScene();setEq(null);
      setBig("a* 不知道，就没法算","要证界，总得先知道要比什么吧");
      setCap("不需要<b>算出</b> Q(a*)。只需要把它<b>替换成一个已知的上界</b>。");
    },"这个错误模型来自一个合理的直觉：要界定「我离最好差多少」，总得先知道最好是多少。  但证一个<b>上界</b>不需要知道确切值。只需要找到一个<b>已知的量把它替换掉</b>，并且证明替换的方向是<b>安全的</b>——替换之后的式子比原来<b>大</b>。  那么用什么替换 Q(a*)？  答案是一个在事后看来几乎显然的东西：<b>我们每一步实际选中的那个臂的上置信界</b>。这是完全可观测的——它就是算法用来做决定的那个数。  下面两镜证明这个替换是安全的，并把它执行掉。");
  /* 铺陈 */
  S(3298,function(){
      clearScene();setBig(null);
      setEq("$$U_t(a_t)\\ \\ge\\ Q(a^*)$$","top");
      note("情形一：a_t 就是 a*",420,330,"b lg");
      note("情形二：a_t 不是 a*",880,330,"v lg");
      note("两种都成立",640,395,"g lg");
      setCap("<b>核心引理</b>：只要置信区间没失效，选中的臂的上界<b>压住</b>最优臂的真值。");
    },"核心引理：只要所有置信区间都没失效，那么<b>每一步选中的那个臂的上置信界，不小于最优臂的真均值</b>。  讲座在这里停下来让大家和邻座讨论——因为它虽然只有两行，但方向很容易绕晕。两情形：  <b>情形一，a_t 就是 a*。</b>那么 U_t(a_t) = U_t(a*) ≥ Q(a*)——最后一步用的是「置信区间没失效」，上界压住真值。  <b>情形二，a_t 不是 a*。</b>算法选的是上界最大的那个，所以 U_t(a_t) ≥ U_t(a*)；再用一次置信区间没失效，U_t(a*) ≥ Q(a*)。串起来还是 U_t(a_t) ≥ Q(a*)。  讲座原话：<b>「in both cases, this is gonna hold, if the confidence bounds are correct」</b>。  顺带说一句结构上的观察：情形二那条链<b>本身就覆盖了情形一</b>，因为 argmax 的性质对所有臂成立、包括 a* 自己。分两种情形写是为了讲清楚，不是逻辑上必需。  注意这里的<b>前提</b>：「置信区间没失效」。它凭什么成立，是下一集的事。");
  /* 主体 */
  S(3310,function(){
      clearScene();setBig(null);
      setEq("$$\\sum_t\\big[Q(a^*)-Q(a_t)\\big]=\\sum_t\\big[U_t(a_t)-Q(a_t)\\big]+\\underbrace{\\sum_t\\big[Q(a^*)-U_t(a_t)\\big]}_{\\le\\,0}$$","top");
      note("加一项减一项",420,340,"y lg");
      note("这一整块 ≤ 0，丢掉",900,340,"g lg");
      setCap("<b>加减同一项</b>，再用引理把后半块整个丢掉 —— <b>a\* 就此消失</b>。");
    },"执行替换。手法是讲座说的「我们在 RL 里最喜欢的技巧之一」：<b>加上再减去同一个东西</b>。  往遗憾的每一项里同时加减 U_t(a_t)，拆成两块：  <b>第一块</b>：Σ_t [ U_t(a_t) − Q(a_t) ]——<b>全是选中臂的量</b>，可观测。 <b>第二块</b>：Σ_t [ Q(a*) − U_t(a_t) ]——由上一镜的引理，每一项都 <b>≤ 0</b>。  第二块非正，<b>丢掉它只会让不等式更松，方向是安全的</b>。于是：  Regret(T) ≤ Σ_t [ U_t(a_t) − Q(a_t) ]  讲座原话：<b>「So that's nice, right? Because now we don't have any a stars anymore.」</b>  再看一眼右边剩下什么：<b>选中臂的上置信界，减去选中臂的真均值</b>。而按定义 U_t(a_t) = Q̂_t(a_t) + u_t(a_t)，于是这个差就是「经验均值的误差 + 半径」——两样都是<b>可以界定</b>的东西。  死结解开了。");
  /* 反驳 */
  S(3322,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:330,items:[
      {label:"算出 Q(a*)",sub:"做不到",state:"dead"},
      {label:"替换成上界",sub:"做得到",state:"on"},
      {label:"方向安全",sub:"只会更松",state:"on"}]});
      note("证上界不需要知道确切值",640,420,"y");
      setCap("<b>指名反驳</b>：不是算出 a*，是<b>把它替换掉</b>，并证明替换只让界变松。");
    },"指名回去：不需要知道 a* 是哪个臂。  做的事情是<b>替换</b>：用可观测的 U_t(a_t) 顶掉不可观测的 Q(a*)，然后证明替换的方向<b>只会让不等式变松</b>。这是证上界时的通用手法，值得记住它的形状——<b>把不知道的东西换成知道的、且往安全的方向换</b>。  整个替换挂在一个前提上：<b>置信区间没失效</b>。而这个前提比看上去难得多，因为我们需要的不是「某一个区间成立」，是<b>所有臂、所有时刻的区间同时成立，而且永远成立</b>。  一个区间以 1−δ 成立；m 个臂 T 个时刻加起来还剩多少？  这是下一集，也是这个证明里最漂亮的一处：答案居然<b>和 T 无关</b>。");
  SUM(3274,7,{h:"两情形引理：把不可观测的 Q(a*) 从遗憾里消掉",
    k:"引理 <b>U_t(a_t) ≥ Q(a*)</b>（置信区间不失效时）。情形一 a_t=a*：直接用区间。情形二 a_t≠a*：argmax 给 U_t(a_t) ≥ U_t(a*)，再用区间。",
    m:"<b>加减同一项</b>：Regret = Σ[U_t(a_t) − Q(a_t)] + Σ[Q(a*) − U_t(a_t)]，第二块由引理 <b>≤ 0</b>，丢掉只让界更松。讲座：「now we don't have any a stars anymore」。",
    w:"<s>误解</s>：「a* 不知道就没法算」。证<b>上界</b>不需要知道确切值 —— 只要把它<b>替换成已知量</b>，并证明替换方向安全。",
    e:"结构观察：情形二那条链<b>本身覆盖了情形一</b>（argmax 对所有臂成立，包括 a* 自己），分两情形是为了讲清楚。<b>全部挂在一个前提上</b>：置信区间不失效 —— 那是下一集。"});
  QUIZ(3274,7,{t:"证明里是怎么处理不可观测的 Q(a*) 的？",
    o:["用经验均值最大的臂的值来估计它","<b>用选中臂的上置信界 U_t(a_t) 把它替换掉，并证明 Q(a*) − U_t(a_t) ≤ 0 所以丢掉是安全的</b>","假设 a* 已知，把它当作算法的输入","对所有可能的 a* 取最坏情形"],
    a:1,
    w:"手法是<b>加减同一项</b>：Regret = Σ[U_t(a_t) − Q(a_t)] + Σ[Q(a*) − U_t(a_t)]。核心引理说第二块每一项 <b>≤ 0</b>（置信区间不失效时 U_t(a_t) ≥ Q(a*)），所以丢掉它<b>只让上界更松</b>，方向安全 —— 讲座原话「now we don't have any a stars anymore」。这是证上界的通用手法：<b>把不知道的换成知道的，且往安全方向换</b>。<s>「用经验均值估计」</s>没有保证，且经验最大值是有偏的（见 L04 最大化偏差）。<s>「当作输入」</s>那就不是算法了。<s>「对所有 a* 取最坏」</s>会得到平凡的线性界。"});
});

KP("8 · 并集界与 δ/t²：Basel 和 <b>π²/6 &lt; 2</b> 撑起「永远成立」",function(){
  /* 钩子 */
  S(3696,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:290,items:[
      {label:"一个区间",sub:"1−δ",state:"on"},
      {label:"m 个臂",sub:"？",state:"dead"},
      {label:"所有时刻",sub:"？",state:"dead"}]});
      note("上一集的前提在这里兑现",640,420,"y");
      setCap("上一集的引理要求「<b>所有</b>区间<b>同时</b>成立」。这一集算它值多少钱。");
    },"上一集的引理挂在一个前提上：置信区间不失效。  但仔细读它需要的是什么——不是「某一个区间成立」，是：  <b>每一个臂</b>（m 个）、<b>每一个时刻</b>（一直到 T，甚至更远）的置信区间，<b>同时</b>成立。  这是一个比看上去强得多的要求。这一集算它要花多少失败概率，而答案会有点出人意料。");
  /* 错误答案 */
  S(3708,function(){
      clearScene();setEq(null);
      setBig("每个 95%，合起来还是 95%","都是同一套区间嘛");
      setCap("失败概率是<b>相加</b>的。m 个臂 T 个时刻，固定 δ 会累成 <b>Tmδ</b>。");
    },"这是统计里最常见的一个错误，而且在多重比较的场合造成过很多真实的事故。  <b>失败概率是相加的，不是取最大。</b>这就是并集界：若干个事件至少有一个发生的概率，不超过它们各自概率之和。  如果每个区间固定用 δ 的失败预算：m 个臂、T 个时刻，总失败概率上界是 <b>T·m·δ</b>。  代个数：δ=0.05、m=3、T=10000，得到 <b>1500</b>。一个概率上界是 1500，等于<b>什么都没说</b>。  而且注意它随 T <b>增长</b>——跑得越久保证越弱，这和我们要的「永远成立」恰好相反。  所以固定预算行不通。下一镜换一个。");
  /* 铺陈 */
  S(3720,function(){
      clearScene();setBig(null);
      setEq("$$\\text{第 }t\\text{ 步的失败预算}=\\frac{\\delta}{t^2}$$","top");
      note("越往后要求越严",640,330,"y lg");
      setCap("改法只有一处：让每一步的失败预算<b>随 t 按 1/t² 衰减</b>。");
    },"改法只有一处：<b>不要给每一步同样的失败预算</b>。  第 t 步分配 <b>δ/t²</b>。越往后，对置信区间的要求越严——半径也相应地更宽一点。  这就是上一集那个半径公式里 t² 的来源：令 exp(−2nu²) = δ/t²，解出 u = √(log(t²/δ)/(2n))。那个 <b>t²</b> 不是凑出来的，它就是这个衰减预算。  为什么是 1/t²，不是 1/t，也不是 1/t³？  因为 1/t 的和<b>发散</b>（调和级数），仍然会随 T 增长。而 1/t² 的和<b>收敛</b>。1/t³ 也收敛，但预算收得更快、半径更宽、算法更保守——没必要。  <b>1/t² 是让总和收敛的最省的那一档。</b>下一镜看这个和是多少。");
  /* 主体 */
  S(3732,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3],step:420,vals:[1.549768,1.634984,1.644834,1.644933],
      x:330,y:350,w:620,h:150,max:2.0,
      label:function(i){return ["10 项","100","10⁴","10⁶"][i];},
      cls:function(i){return i===3?"g":"y";},
      fmt:function(v){return v.toFixed(4);}});
      note("Σ 1/t² 的部分和",640,392,"sm");
      setCap("加到无穷也只有 <b>π²/6 = 1.6449</b>。<b>小于 2</b> —— 总失败 < <b>2mδ</b>。");
    },"<b>看什么：</b>看柱子<b>越长越慢</b>，到第三根和第四根几乎分不出高低 —— 从一万项加到一百万项，只涨了 <b>0.0001</b>。这条级数<b>收敛</b>，而收敛到的那个数 1.6449 <b>小于 2</b>。柱子停住的那个高度，就是「永远成立」的全部价格。　—— 这个和是 18 世纪的一个著名结果——<b>Basel 问题</b>：Σ_{t=1}^∞ 1/t² = <b>π²/6</b>。  部分和实测：  前 10 项 → <b>1.549768</b> 前 100 项 → <b>1.634984</b> 前 10⁴ 项 → <b>1.644834</b> 前 10⁶ 项 → <b>1.644933</b>  极限 π²/6 = <b>1.644934</b>。<b>小于 2。</b>  于是总失败概率：m 个臂，每个臂对所有 t 求和得 δ·π²/6 < 2δ，乘 m 得 <b>< 2mδ</b>。  <b>没有 T。</b>这就是整个构造的回报：区间<b>永远</b>成立（一直到 t = ∞），而代价<b>不随 T 增长</b>。讲座原话：<b>「when you do the sum you get 2m delta」</b>。  这也解释了定理里那个看着有点怪的「以概率至少 <b>1 − 2mδ</b>」——那个 <b>2</b> 就是 π²/6 向上取整来的。  一个 1735 年的级数结果，在这里撑起了一条现代 RL 定理的骨架。");
  /* 反驳 */
  S(3744,function(){
      clearScene();setBig(null);setEq(null);
      lamps({y:280,gap:290,items:[
      {label:"固定 δ",sub:"累成 Tmδ",state:"dead"},
      {label:"δ/t²",sub:"总和 < 2mδ",state:"on"},
      {label:"与 T 无关",sub:"永远成立",state:"on"}]});
      note("1 − 2mδ 里的 2 从这来",640,420,"y");
      setCap("<b>指名反驳</b>：失败概率<b>相加</b>。让它按 1/t² 衰减，<b>总和才有界</b>。");
    },"指名回去：多个置信区间的失败概率是<b>相加</b>的，不是取最大。固定预算会累成 Tmδ，随 T 增长到毫无意义。  让预算按 1/t² 衰减，总和收敛到 π²/6 < 2，于是「所有臂、所有时刻、永远成立」一共只花 <b>2mδ</b>，<b>与 T 无关</b>。  这一集的板书有三处小问题，一并标出，都不影响结论：  <b>字幕把指数念坏了</b>：「sum over t = 1 to infinity of t to the <b>-t</b>」——应该是 <b>t^(−2)</b>。t^(−t) 的和不是 π²/6。 <b>失败事件的帽子戴错了</b>：板上写成「Q̂(a_t) 大于 U」。失败事件应该是<b>真均值</b> Q(a) 超过上置信界；<b>经验</b>均值按构造总是在自己的界之下，那个事件的概率是 0。 <b>末尾有一处口误</b>：「the probability that they <b>don't</b> hold is at least 1 − 2mδ」——应该是它们<b>确实</b>成立的概率至少 1 − 2mδ。  还有一处不是错误、但容易误读：课上有学生问这是不是无穷时域的情形。<b>答案是：并集界取到 t = ∞，是为了让区间「永远」成立；但遗憾定理本身仍然是对有限 T 陈述的。</b>两个「时域」不是一回事。  三块拼完了。下一集把它们乘起来。");
  SUM(3696,8,{h:"并集界与 δ/t²：Basel 和 π²/6 < 2 撑起「永远成立」",
    k:"失败概率<b>相加</b>。固定 δ → <b>T·m·δ</b>（δ=.05,m=3,T=10⁴ 时是 1500，等于没说）。改成 <b>δ/t²</b> → Σ1/t² = <b>π²/6 = 1.644934 < 2</b> → 总失败 <b>< 2mδ</b>，<b>与 T 无关</b>。",
    m:"为什么是 1/t²：1/t 的和<b>发散</b>（调和级数），1/t³ 收敛但更保守。<b>1/t² 是让总和收敛的最省的一档</b>。半径里的 t² 就是从这来的。",
    w:"<s>误解</s>：「每个 95%，合起来还是 95%」。这是多重比较里最常见的事故 —— 失败概率是<b>相加</b>的。",
    e:"<b>三处口误/笔误</b>：① 字幕的 <b>t^(−t)</b> 应为 t^(−2)；② 失败事件写成 <b>Q̂</b> > U，应为<b>真</b>均值 Q > U；③ 「they <b>don't</b> hold is at least 1−2mδ」应为它们<b>确实</b>成立。另：并集界取到 t=∞（区间永远成立）与定理对有限 T 陈述，<b>是两个不同的「时域」</b>。"});
  QUIZ(3696,8,{t:"为什么第 t 步的失败预算要取 δ/t² 而不是固定的 δ？",
    o:["因为 δ/t² 让置信区间更窄，算法更激进","<b>因为失败概率相加：固定 δ 会累成 Tmδ 随 T 增长，而 Σ1/t² = π²/6 < 2 收敛，总失败 < 2mδ 与 T 无关</b>","因为 Hoeffding 不等式要求失败概率随时间衰减","因为 t² 让半径随时间收缩得更快"],
    a:1,
    w:"并集界让失败概率<b>相加</b>：固定 δ 时 m 个臂 T 个时刻累成 <b>Tmδ</b>（δ=.05, m=3, T=10⁴ → 1500，毫无意义），而且<b>随 T 增长</b>。取 δ/t² 后 Σ_{t≥1} 1/t² = <b>π²/6 = 1.644934 < 2</b>，总失败 <b>< 2mδ</b>，<b>不含 T</b> —— 定理里「1 − 2mδ」的那个 2 就是这么来的。<s>「更窄更激进」</s>反了：预算变小 ⟹ 区间必须更<b>宽</b>。<s>「Hoeffding 要求」</s>不对 —— Hoeffding 对任何失败概率都成立，衰减是我们<b>选的</b>。<s>「半径收缩更快」</s>反了：log(t²/δ) 随 t <b>增大</b>，是让半径<b>涨</b>的那一项。"});
});

KP("9 · 最终界：<b>n 和 t 是两个方向相反的速率</b>",function(){
  /* 钩子 */
  S(3971,function(){
      clearScene();setBig(null);
      setEq("$$\\mathrm{Regret}(T)\\ \\le\\ \\sum_{t=1}^{T}\\big[U_t(a_t)-Q(a_t)\\big]\\ \\le\\ \\sum_{t=1}^{T} 2\\,u_t(a_t)$$","top");
      note("只剩下半径的和",640,330,"g lg");
      setCap("三块拼完，遗憾被压成一句话：<b>把所有半径加起来</b>。");
    },"三块都齐了：引理把 a* 消掉，并集界保证区间永远成立，Hoeffding 给出半径。  拼起来：遗憾不超过 Σ_t [ U_t(a_t) − Q(a_t) ]，而在好事件下 Q(a_t) ≥ Q̂_t(a_t) − u_t(a_t)，于是这个差不超过 <b>2u_t(a_t)</b>。  所以整个问题变成一句话：<b>把每一步选中那个臂的半径加起来，有多大？</b>  这一集算这个和。算的过程里会出现这一讲最容易混的一对符号。");
  /* 错误答案 */
  S(3983,function(){
      clearScene();setEq(null);
      setBig("n 和 t 差不多","都是时间，都在往上涨");
      setCap("它们在半径里<b>方向相反</b>：n 让半径<b>缩</b>，t 让半径<b>涨</b>。");
    },"这是讲师自己预先点名的一处混淆，因为它会把整个算法的行为搞得完全看不懂。  半径是 u_t(a) = √( log(t²/δ) / (2·n_t(a)) )。里面有两个计数器：  <b>n_t(a)</b> = <b>这个臂</b>被拉过多少次。它在<b>分母</b>，让半径按 1/√n <b>缩</b>。 <b>t</b> = <b>一共</b>走了多少步（拉任何臂都算）。它在<b>分子的 log 里</b>，让半径<b>涨</b>。  <b>两个方向相反。</b>而这个对立正是 UCB 会持续探索的原因：你一直不拉某个臂，它的 n 不动，但 t 在涨，于是它的半径<b>慢慢变宽</b>，最终一定会重新被选中。  <b>把 n 和 t 混为一谈，这个机制就完全消失了。</b>算法会看起来像是在做一件没道理的事。");
  /* 铺陈 */
  S(3995,function(){
      clearScene();setBig(null);
      setEq("$$\\sum_{n=1}^{N}\\frac{1}{\\sqrt{n}}\\ \\le\\ 2\\sqrt{N}$$","top");
      note("N=10⁴ 时 198.54 对 200",640,330,"g lg");
      setCap("先把 t 冻住（放大成 T），剩下的就是<b>每个臂自己的 1/√n 求和</b>。");
    },"分两步算这个和。  <b>第一步，把 t 冻住。</b>证明里把每一处的 log(t²/δ) 都放大成 <b>log(T²/δ)</b>——因为 t ≤ T，放大只会让界更松，方向安全。这一步讲座做得很快，课上有学生专门举手问。它把那个随时间涨的因子变成了一个<b>常数</b>提到和号外面。  <b>第二步，按臂拆开求和。</b>剩下的 Σ_t 1/√(n_t(a_t)) 可以重新组织：对每个臂 i，它被拉的那些时刻里，n 依次取 1, 2, 3, …, N_i。于是变成 Σ_i Σ_{n=1}^{N_i} 1/√n。  而 Σ_{n=1}^{N} 1/√n ≤ <b>2√N</b>（积分论证：1/√x 从 0 到 N 的积分是 2√N）。  实测紧不紧：N=100 时和是 <b>18.5896</b>，2√N = 20，比值 0.93；N=10⁴ 时 <b>198.5446</b> 对 200，比值 <b>0.993</b>。<b>N 越大越紧。</b>");
  /* 主体 */
  S(4007,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2,3],step:420,vals:[223.61,203.95,141.42,103.98],
      x:330,y:350,w:620,h:150,max:250,
      label:function(i){return ["均分","偏斜","两臂","独大"][i];},
      cls:function(i){return i===0?"r":"b";},
      fmt:function(v){return v.toFixed(0);}});
      note("Σ√N_a，T=10⁴ m=5",640,392,"sm");
      setCap("最坏情形是<b>均分</b>：Σ√N_a 在均分时最大 = <b>√(mT)</b> = 223.61。");
    },"<b>看什么：</b><b>最左边那根最高</b> —— 这是反直觉的：把拉动<b>平均分给所有臂</b>时 Σ√N_a 最大，越集中反而越小（独大只有 103.98，不到均分的一半）。因为 √ 是<b>凹</b>的，凹函数的和在自变量均分时取到最大。所以最坏情形就是均分，代进去正好是 <b>√(mT)</b>。　—— 还剩最后一步：Σ_i √(N_i) 在 Σ_i N_i = T 的约束下最大是多少？  实测（T=10⁴、m=5）：  <b>均分</b>（每臂 2000）→ <b>223.61</b> 偏斜 60/10/10/10/10 → 203.95 两臂平分 → 141.42 一臂独大 → 103.98  <b>均分最大。</b>原因是 √ 是<b>凹函数</b>，凹函数之和在自变量均分时取到最大值。而 m·√(T/m) = <b>√(mT)</b>——223.61 正好等于 √(5×10⁴)。  把三步合起来：  Regret(T) ≲ √(log(T²/δ)) · Σ_i 2√(N_i) ≤ 2√(mT·log(T²/δ))  也就是 <b>O(√(mT log(T²/δ)))</b>，在概率至少 <b>1 − 2mδ</b> 的事件上成立。  这里必须重复讲师自己的提醒。课上有学生当场指出漏了那个 1/2：「What happened to the 1 over 2?」她的回答是——<b>「Thank you, we have a 2, we can put a 2 here. I'll be a little loose with constants but definitely catch me on them.」</b>  所以：<b>这个式子里的任何数字常数都不要当成验过的。</b>值得记住的是<b>形状</b>：√T、√m、√log。");
  /* 反驳 */
  S(4019,function(){
      clearScene();setBig(null);setEq(null);
      fillBars({order:[0,1,2],step:560,vals:[22.5,8.0,2.8],
      x:400,y:350,w:480,h:150,max:26,
      label:function(i){return ["T=10³","10⁴","10⁵"][i];},
      cls:function(i){return i===2?"g":"y";},
      fmt:function(v){return v.toFixed(1)+"%";}});
      note("遗憾占 T 的比例",640,392,"sm");
      setCap("<b>指名反驳</b>：n 缩 t 涨，方向相反。次线性 = <b>占比</b>在掉，不是遗憾在掉。");
    },"<b>看什么：</b>三根柱子<b>一路矮下去</b> —— 但要看清它们量的是<b>比例</b>不是绝对量。遗憾本身从 225 涨到 2794，<b>一直在涨</b>；掉下去的是它占 T 的比例：22.5% → 8.0% → 2.8%。<b>这才是「次线性」的意思。</b>　—— 指名回去：n 和 t 不是一回事。<b>n 让半径缩，t 让半径涨</b>，两个方向相反——而这个对立正是 UCB 永不彻底放弃任何一个臂的原因。  最后把界的含义说准，因为「次线性」经常被读错。  O(√(mT log(T²/δ)))，取 m=3、δ=0.05：  T=10³ → 遗憾约 <b>225</b>，占 T 的 <b>22.5%</b> T=10⁴ → 约 <b>802</b>，占 <b>8.0%</b> T=10⁵ → 约 <b>2794</b>，占 <b>2.8%</b>  <b>遗憾本身一直在涨</b>（225 → 802 → 2794）。次线性说的是它<b>占 T 的比例</b>在掉——也就是<b>每步的平均损失趋于零</b>。  这正好接回第二集那把尺子：均匀随机的每千步遗憾<b>停在 50.0</b>，ε-贪心<b>停在 5.03</b>，而 UCB 从 12.981 一路掉到 <b>0.724</b> 还在掉。三条曲线，两条是水平线，一条在往下走。  最后一句把它放回全课：这一讲第一次给出了一个<b>有限样本</b>的保证——不是「T 趋于无穷时收敛」，是「跑 T 步，以概率 1−2mδ，你一共亏不超过这么多」。<b>这就是把判据从「能不能学到」换成「要多少数据」之后，得到的那种答案。</b>");
  SUM(3971,9,{h:"最终界 O(√(mT log(T²/δ)))：n 和 t 方向相反",

    m:"三步：① 把 log(t²/δ) 放大成 log(T²/δ)（t≤T，安全）；② Σ_{n≤N} 1/√n ≤ <b>2√N</b>（N=10⁴ 时 198.54 vs 200）；③ Σ√N_a 在<b>均分</b>时最大 = <b>√(mT)</b>（223.61 vs 独大 103.98，因 √ 是<b>凹</b>的）。",
    w:"<s>误解</s>：「n 和 t 差不多」。也别把「次线性」读成遗憾在减少 —— 遗憾<b>一直在涨</b>（225→802→2794），掉的是<b>占比</b>（22.5%→8.0%→2.8%）。",

    o:["都让半径收缩，只是速度不同","<b>n（该臂被拉的次数）让半径按 1/√n 收缩；t（总步数）在 log 里让半径增长 —— 方向相反</b>","n 让半径增长，t 让半径收缩","t 只影响失败概率，不影响半径大小"],
    a:1,
    w:"<b>n_t(a)</b> 在分母，每多拉一次这个臂半径就按 1/√n <b>缩</b>；<b>t</b> 在分子的 log 里，每走一步（拉<b>任何</b>臂）都让它<b>涨</b>。这个对立正是 UCB 永不彻底放弃任何臂的机制：长期不拉的臂 n 不动而 t 在涨，半径慢慢变宽，<b>最终一定会被重新选中</b>。讲师专门预先点名了这处混淆，因为混了它整个算法就看不懂了。<s>「都收缩」「n 涨 t 缩」</s>方向搞反。<s>「t 只影响失败概率」</s>不对 —— 失败预算 δ/t² 正是<b>通过</b> log(t²/δ) 进入半径的。"});

    },"回头看这九集，承重的是四件事。  第一，<b>判据决定了你会造出什么算法</b>。把判据从「收敛」换成「遗憾」，贪心和固定 ε-贪心立刻出局——它们都收敛，但都是线性遗憾。实测：ε=0.1 时每千步遗憾停在 <b>5.034</b>，正是理论值 ε/m·ΣΔ = 5.00，<b>不再下降</b>；而 UCB 同期已经降到 0.724 还在降。  第二，<b>乐观是一个可以证明的策略，不是一句口号</b>。拉一个上置信界最高的臂，要么它真的好（不亏），要么它不好（但界会收缩，你学到了）。两难都赢——这就是 optimism in the face of uncertainty 的全部内容。  第三，<b>那个 δ/t² 是整个证明里最漂亮的一笔</b>。固定的失败预算在 T 步后累积成 Tmδ，毫无意义；让预算随 t 按 1/t² 衰减，总和收敛到 π²/6 = <b>1.6449 &lt; 2</b>，于是「所有置信区间同时且永远成立」这件事只花掉 <b>2mδ</b>——<b>与 T 无关</b>。一个 18 世纪的级数结果，在这里撑起了一条现代 RL 定理的骨架。  第四，<b>n 和 t 是两个方向相反的速率</b>。n 是这个臂被拉的次数，它让半径<b>缩</b>；t 是总步数，它让半径<b>涨</b>。整个 UCB 的行为就是这两个速率在拉锯。把它们混为一谈，这个算法就完全看不懂了。  最后把界的含义说准：O(√(mT log(T²/δ))) <b>本身是在涨的</b>。次线性的意思是它<b>占 T 的比例</b>在掉——T=10³ 时占 22.5%，T=10⁴ 时 8.0%，T=10⁵ 时 2.8%。  下一讲继续这条线：概率匹配与 Thompson 采样，以及怎么把这一套从单状态的老虎机搬回真正的 MDP。");
