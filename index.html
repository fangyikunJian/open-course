<!doctype html>
<meta charset="utf-8">
<title>科研学习资料站</title>
<!--
  根目录跳转页。

  为什么需要它：静态文件服务器（tailscale serve / Caddy / nginx）在根路径上
  通常要么找 index.html、要么渲染一个目录列表。这个站的真入口叫
  「★总入口.html」—— 不加这一页的话，根路径要么 404、要么甩给你一张文件列表。

  为什么用百分号编码的地址：文件名里有 ★（U+2605）和中文。阿里云那台 Apache
  上踩过「中文 URL 不编码就静默回首页」，所以这里**三条路都留着**：
    1. meta refresh —— 用编码后的地址，最稳
    2. <a> 链接 —— 浏览器自己会编码，给跳转被拦时用
    3. 原始未编码地址 —— 放在注释里，万一哪天编码那条反而不认
       原名：★总入口.html
-->
<meta http-equiv="refresh"
      content="0; url=%E2%98%85%E6%80%BB%E5%85%A5%E5%8F%A3.html">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.7 system-ui, "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1a1d21;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #12161b; color: #e7eef7; }
  }
  a { color: #3b6fd4; }
  @media (prefers-color-scheme: dark) { a { color: #8fb8ff; } }
  .box { text-align: center; }
  .hint { opacity: .6; font-size: 14px; margin-top: 1.2em; }
</style>
<div class="box">
  <p>正在进入 <a href="★总入口.html">★总入口</a> ……</p>
  <p class="hint">没有自动跳转的话，点上面那个链接。</p>
</div>
