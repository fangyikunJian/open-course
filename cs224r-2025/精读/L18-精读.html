ut <b>handling safety critical scenarios effectively</b></b>」。</b> <span class='w'>⇒ 从「证明它永不出错」换成「让它在要紧的情形下处理得好」——<b>目标变了，可行的方法也就跟着变了</b>。</span>", "<b>⇒ 于是那一步推论就自然了：<b><em>Arguably, large-scale ML is most successful way to handle open-world circumstances</em></b>。</b> <span class='k'>⇒ 逻辑链是：安全是<b>开放世界</b>问题 → 开放世界问题上最成功的工具是<b>大规模机器学习</b> → 所以安全也该用它。</span>", "⚠️ <b>但紧接着 p18 就把这条路的代价摊开了，而这一页是整节最沉的一页：<b><em>→ collect large amounts of data of unsafe circumstances??</em></b> 那两个问号是幻灯自己打的。</b> <span class='w'>⇒ 因为要让模型学会「什么是不安全」，你得<b>有</b>不安全的数据——而那意味着<b>要么让事故发生，要么让人去标注那些内容</b>。</span>", "<b>⇒ 幻灯的评语只有一句：<b><em>Doing so has had horrific ramifications.</em></b></b> <span class='k'>讲稿说的是具体什么事：科技公司做内容审核、标注「traumatic or toxic」的数据，而「labeling that kind of data can even cause humans <b>all sorts of mental health challenges</b> and has a lot of <b>ethical considerations</b>」</span>。<b>⇒ 所以讲者的结论是 <b>「this approach isn't satisfying」</b> ——<b>不是技术上不行，是代价不能接受</b>。</b>", "<b>⇒ 于是 p19 的第一个公开问题就有了明确的动机：<b><em>Can we develop methods that learn what's unsafe <b>without expansive data of unsafe incidents</b>?</em></b></b> <span class='w'>幻灯给了两个方向，都带问号：<b>Possibly use <b>synthetic data</b>? Possibly use <b>prior knowledge</b>?</b></span><b>⇒ 讲稿强调这一问的好处是<b>双份</b>的：既改善系统的安全，也改善<b>训练这些系统的过程</b>的安全。</b>", "⚠️ <b>第二个公开问题是另一个维度：<b><em>Can we gradually explore new behaviors while remaining safe?</em></b> —— 不是「学成之后安全」，而是<b>学的过程中一直安全</b>。</b>", "<b>⇒ 而讲者举了一个自己的例子，很具体也很好记：<b>她学会了不扶车把骑车，而且全程<b>没摔过一次</b></b>。</b> <span class='k'>原话：「I taught myself how to ride my bike <b>without holding on to the handlebars</b>. And I did so <b>without ever falling off my bike</b>. And I'm not saying that to brag. <b>It's not that hard. It took time, took effort</b>」</span>。", "<b>⇒ 她要点出的机制是什么？<b>你在探索状态空间的新区域，同时还在判断哪些更冒险、并给自己排了一个课程表</b>。</b> <span class='w'>原话：「you're <b>fundamentally exploring a new part of the state space</b> while also <b>understanding what might be more risky and less risky</b> and thinking about a <b>curriculum</b> over how to accomplish that sort of objective」</span>。", "<b>⇒ 这三件事同时做，才是人类「安全探索」的真正内容：<b>① 去新地方 ② 对风险有判断 ③ 自己安排难度递增的顺序</b>。</b> <span class='k'>⇒ 而 RL 里的探索通常只有①，②和③要么靠人工设计（课程学习），要么干脆没有。<b>⇒ 这就是这一问为什么还开着。</b></span>"], "eq": "历史做法为什么被排除（理由分两层，第二层更强）：\n\n   **第一层**：形式化验证与概率保证\n     「generally make assumptions that **won't hold in the real world**」\n     ⇒ 你能在模型里证出来，但验证**在更大规模上就不成立了**\n\n   ⚠ **第二层（不是「现在做不到」而是「原理上做不到」）**：\n     **Generally impossible to guarantee safety in countless scenarios\n       encountered in open-world environment**\n     ⇒ 开放世界的情形**数不清**，而「保证」要求你覆盖全部\n\n   配一句很平实却很有说服力的话：**Even human drivers make mistakes.**\n     （幻灯还列了 surgeons · pilots · politicians）\n     ⇒ 不是为 AI 的错误开脱，而是**重设标准**：\n       既然对人类也不要求「零错误」，\n       那对机器要求「可证明的零错误」就是**错误的提问方式**\n\n   讲稿的转向：「**we can't guarantee safety. But we could at least try to\n     think about handling safety critical scenarios effectively**」\n     ⇒ 从「证明它永不出错」换成「让它在要紧的情形下处理得好」\n       **目标变了，可行的方法也跟着变了**\n\n   ⇒ 推论：**Arguably, large-scale ML is most successful way to handle\n      open-world circumstances**\n     逻辑链：安全是**开放世界**问题 → 开放世界上最成功的工具是**大规模 ML**\n       → 所以安全也该用它\n\n⚠⚠ p18 摊开这条路的代价（整节最沉的一页）：\n   **→ collect large amounts of data of unsafe circumstances??**\n     （那两个问号是幻灯自己打的）\n   ⇒ 要让模型学会「什么是不安全」，你得**有**不安全的数据\n     ⇒ **要么让事故发生，要么让人去标注那些内容**\n\n   幻灯的评语一句：**Doing so has had horrific ramifications.**\n     讲稿：科技公司标注 **traumatic or toxic** 数据，而这\n       「can even cause humans **all sorts of mental health challenges**\n         and has a lot of **ethical considerations**」\n   ⇒ 结论是 **「this approach isn't satisfying」**\n     —— **不是技术上不行，是代价不能接受**\n\np19 两个公开问题：\n\n**(1) Can we develop methods that learn what's unsafe\n    without expansive data of unsafe incidents?**\n   两个方向，都带问号：**synthetic data?** · **prior knowledge?**\n   好处是**双份**的：既改善系统的安全，也改善**训练过程**的安全\n\n⚠ **(2) Can we gradually explore new behaviors while remaining safe?**\n   —— 不是「学成之后安全」，而是**学的过程中一直安全**\n\n   讲者自己的例子（具体好记）：\n     **她学会了不扶车把骑车，而且全程没摔过一次**\n     「**It's not that hard. It took time, took effort**」\n\n   要点出的机制：\n     「you're **fundamentally exploring a new part of the state space**\n       while also **understanding what might be more risky and less risky**\n       and thinking about a **curriculum** over how to accomplish that」\n\n   ⇒ 人类「安全探索」的真正内容是三件事同时做：\n     **① 去新地方 ② 对风险有判断 ③ 自己安排难度递增的顺序**\n   ⇒ 而 RL 里的探索通常只有 ①，② 和 ③ 要么靠人工设计（课程学习）、要么没有\n     **⇒ 这就是这一问为什么还开着**", "tbl": {"head": ["两条路", "做法", "卡在哪"], "rows": [["<b>形式化验证 / 概率保证</b>", "<b>证明模型的行为</b>", "<span class='w'>⚠ 假设在真实世界不成立；而且开放世界原理上无法穷举</span>"], ["<b>大规模机器学习</b>", "<b>采集大量「不安全」的数据去学</b>", "<span class='w'>⚠ 要么让事故发生，要么让人标注有害内容 —— 已造成实际伤害</span>"], ["<b>⇒ 目标怎么改</b>", "<b>从「证明永不出错」改成「要紧时处理得好」</b>", "<b>连人类司机也会犯错</b>"], ["<b>公开问题 (1)</b>", "<b>不靠事故数据学会「什么不安全」</b>", "<b>合成数据？先验知识？</b>"], ["<b>公开问题 (2)</b>", "<b>探索新行为的同时一直安全</b>", "<b>要同时做到：去新地方 + 判断风险 + 自排课程</b>"]]}, "say": "原话（为什么形式化验证这条路不够，以及目标该怎么改）：<em>“historically, this sort of problem has been approached by trying to <b>formally verify</b> the behavior of the model or provide some sort of <b>probabilistic guarantees</b>. But generally, oftentimes, <b>these methods are going to make assumptions that don't hold up under real-world circumstances</b>. And so even if you can verify it in a model, <b>those verifications often won't hold at larger scales</b>. And generally, <b>it's impossible to fully guarantee safety in the countless number of scenarios that you can encounter in the real world</b>. And we find that <b>even humans make mistakes, even in safety critical settings</b>. So human drivers make mistakes, surgeons, pilots make mistakes, politicians make mistakes, and so forth. <b>So we can't guarantee safety. But we could at least try to think about handling safety critical scenarios effectively.</b>”</em><br><br>原话（采集不安全数据这条路的代价）：<em>“it seems like perhaps we should try to collect large amounts of data that would teach our model what is safe and what is unsafe. Now, at the same time, <b>this is really unsatisfying</b>. This means that we actually have to somehow <b>collect a lot of data under unsafe circumstances</b>. And it also can have some <b>really real and negative ramifications</b>. So as an example, there was news articles that talked about how tech companies are basically trying to do content moderation or label data that is <b>traumatic or toxic</b>. And labeling that kind of data <b>can even cause humans all sorts of mental health challenges</b> and has a lot of <b>ethical considerations</b>. And so <b>this approach isn't satisfying</b> for handling this sort of safety critical problem.”</em><br><br>原话（不扶车把骑车：安全探索要同时做三件事）：<em>“maybe a couple years ago, I taught myself how to ride my bike <b>without holding on to the handlebars</b>. And I did so <b>without ever falling off my bike</b>. And I'm not saying that to brag. <b>It's not that hard. It took time, took effort.</b> But I think it's really fascinating to think about how would you get a robot to, for example, learn how to do a new behavior like that <b>without ever falling or without ever causing damage to themselves</b>. And it means that you're <b>fundamentally exploring a new part of the state space</b> while also <b>understanding what might be more risky and less risky</b> and thinking about a <b>curriculum</b> over how to accomplish that sort of objective.”</em>"},
{"r": [20, 23], "t": "不准确与幻觉：那组 92 / 76 / 74，以及「RLHF 损害校准」", "star": 3, "quote": "<b>Handling inaccuracies, hallucinations</b><br><em>For LLMs: Human are often the recipient (e.g. chatbots, code generation).<br>- <b>mistakes are often manageable</b><br>- <b>but the interface is not well optimized!</b><br>“When A.I. worked independently to diagnose patients, it achieved <b>92 percent</b> accuracy, while physicians using A.I. assistance were only <b>76 percent</b> accurate—barely better than the <b>74 percent</b> they achieved without A.I.” [Rajpurkar &amp; Topol NYT 2025, Goh et al. JAMA 2024]<br><b>(1) Can we optimize for better human-AI systems?</b> e.g. can models better estimate &amp; convey uncertainty?<br>Pre-trained GPT-4 &nbsp;vs&nbsp; GPT-4 after PPO post-training &nbsp;[OpenAI 2023] &nbsp;→&nbsp; <b>RLHF hurts model's calibration!</b><br>One possible direction: <b>Calibration with verbalized confidence &amp; listing multiple guesses</b> [Tian et al. 2023]<br><b>(2) When humans are not in the loop, how can we get to 99.99% reliability?</b> — <b>Reinforcement learning is likely part of the solution!</b> [Luo et al. 2024]</em>", "one": "<b>这一节有整讲最反直觉的一组数字：AI 单干 92% 准，医生单干 74%，而医生用了 AI 辅助——76%。问题不在模型，在人机之间那个界面。</b>", "pts": ["<b>讲者先用自己的例子开场，而这个例子选得很准。</b> <span class='k'>她问模型「这张图里碗中糖的重量是多少」，模型<b>很自信地</b>回答「the digital scale on the image reads <b>108.2 grams</b>. That is the weight of the sugar currently in the bowl」—— <b>答案是错的</b>。而她补了一句很诚实的话：那个秤因为<b>反光</b>其实<b>很难读</b></span>。", "<b>⇒ 这个补充很重要，因为它指出了问题的真正形状：<b>不是模型该知道而答错了，而是它在一个客观上很难的情形下，<b>仍然答得很笃定</b></b>。</b> <span class='w'>⇒ 如果它答「图里有反光，我读不准，大概在 100 克上下」，那就完全不是问题了。<b>⇒ 所以要修的不是准确率，是「不知道的时候要说不知道」。</b></span>", "<b>幻灯接着给了一个关键的区分：<b>对语言模型来说，接收方常常是人</b>（聊天、写代码）。于是 <b><em>mistakes are often manageable</em></b> —— 人能看出来对不对。</b> <span class='k'>⇒ 但紧接着是那个「但是」：<b><em>but the interface is not well optimized!</em></b></span>", "⚠️ <b>⇒ 而证明这个「但是」的，就是那组数字（<b>[Rajpurkar &amp; Topol NYT 2025, Goh et al. JAMA 2024]</b>）：<b>AI 独立诊断 92% · 医生用 AI 辅助 76% · 医生不用 AI 74%</b>。</b>", "<b>⇒ 把这三个数摆在一起才看出它的刺：<b>加了一个 92% 的助手，把 74% 的人只提到了 76%</b>。</b> <span class='w'>⇒ 两个百分点。而那个助手单独干的时候比两者都高出一大截。</span>", "<b>⇒ 讲者的评语把该怎么读这组数讲明白了：<b>「92 sounds great compared to 74. But if it is going to be a system that's <b>interacting with a person</b>, <b>76 doesn't sound quite so great</b>」</b>。</b> <span class='k'>⇒ 换句话说：<b>如果你的系统最终要和人一起用，那么「模型单独的准确率」是一个会骗你的指标</b>。</span>", "<b>⇒ 为什么会这样？幻灯没说，但这组数本身给了线索：<b>人没法分辨 AI 什么时候对、什么时候错</b>。</b> <span class='w'>⇒ 于是人既会被错的建议带偏（本来会对的变错了），也会不敢采纳对的建议（本来能对的没敢用）。<b>⇒ 两种损失叠起来，正好吃掉了那 18 个百分点的大部分。</b></span>", "⚠️ <b>⇒ 所以 p22 的第一个公开问题就落在这里：<b><em>Can we optimize for better human-AI systems?</em></b> 而具体的切入点是 <b><em>can models better estimate &amp; convey uncertainty?</em></b></b> <span class='k'>⇒ 注意是<b>两个</b>动词：<b>estimate</b>（自己估准）和 <b>convey</b>（传达给人）。少任何一个都不够。</span>", "⚠️ <b>而 p22 那两张校准图是这一节最硬的证据，也是最值得记的一条事实（<b>[OpenAI 2023]</b>）。</b> <span class='w'><b>Pre-trained GPT-4</b>：横轴置信度、纵轴准确率，两者<b>对得很好</b>（它说 70% 有把握，就真的大约 70% 对）；<b>GPT-4 after PPO post-training</b>：<b>歪了</b></span>。<b>⇒ 幻灯的结论一句：<b><em>RLHF hurts model's calibration!</em></b></b>", "<b>⇒ 这件事的讽刺之处要说出来：<b>RLHF 让模型变得更好用，却同时毁掉了它「知道自己不知道」的能力</b>。</b> <span class='k'>⇒ 而上一条刚说过，人机协作最需要的恰恰是后者。<b>⇒ 于是我们在用一个让模型更强、却更难和人配合的方法。</b></span>", "⚠️ <b>⇒ 课堂上有人问了「为什么会这样」，而讲者的回答值得完整记住，因为它给出了机制。</b> <span class='w'>原话（节选）：「the objective that you're optimizing for… is <b>not exactly accuracy</b>… what RLHF is doing oftentimes is actually <b>sharpening the distribution</b>… it's to be sharpening that distribution to really encourage the model to be <b>more likely to sample one mode</b>. And <b>that sharpening often leads to it being overconfident</b> in certain circumstances, <b>especially when preferences are rewarding you for being confident</b>」</span>。", "<b>⇒ 拆开看这个机制：<b>预训练模型的输出分布是宽的（它会说各种东西）；RLHF 把分布削尖，推向某一个模式</b>。而置信度就是分布的尖锐程度 —— <b>削尖分布，就是直接提高置信度</b>，而准确率并没有同步提高。</b> <span class='k'>⚠ 而最后半句把这一节和 p5 接上了：<b>偏好本身就在奖励「自信」</b>（p5 那张图里 <em>Is confident</em> 排在最前），<b>所以 RLHF 不只是副作用上让模型过度自信，它是被明确地往这个方向训的</b>。</span>", "<b>⇒ 一个可能的方向（<b>[Tian et al. 2023]</b>）：<b><em>Calibration with verbalized confidence &amp; listing multiple guesses</em></b>。</b> <span class='w'>做法是<b>让模型用语言把概率说出来</b>（而不是去读 logits），并且<b>要求它给多个猜测</b>——这样在 RLHF 之后反而比直接用 logits 更校准</span>。<b>⇒ 讲者的但书：即使这样，你<b>还是得</b>弄清它怎么和人对接、并且<b>在人机协作的条件下</b>评估。</b>", "<b>p23 的第二个公开问题换到了另一类场景：<b><em>When humans are not in the loop, how can we get to <b>99.99%</b> reliability?</em></b></b> <span class='k'>讲稿点了几个场景：自动驾驶（人不会一直握着方向盘）、机器人（多数决策不会被人检查）、以及<b>把语言模型插进别的系统去控制它</b>（例如网页智能体自主决定做什么）</span>。", "<b>⇒ 讲者对这一问是乐观的：<b><em>Reinforcement learning is likely part of the solution!</em></b>，理由是「online data is really helpful for getting high performance」。</b> <span class='w'>证据是 <b>[Luo et al. 2024]</b>：在相当有挑战的机器人任务上，<b>策略跑了 100 次、100 次都成</b></span>。<b>⇒ 但她也说清了差距：<b>把这个推到「需要极高可靠性的大规模场景」还很远</b>。</b>", "<b>⚠ 最后把这一节的两问并起来看，会发现它们的要求<b>方向相反</b>，而这个对照值得记住。</b> <span class='k'><b>人在回路</b>时，你要的是模型<b>诚实地示弱</b>（说出不确定，让人接手）；<b>人不在回路</b>时，你要的是模型<b>真的很少出错</b>（没人接手）。<b>⇒ 前者是沟通问题，后者是能力问题 —— 混为一谈会同时做错两件事。</b></span>"], "eq": "讲者的开场例子（选得很准）：\n   问「图里碗中糖的重量」→ 模型**很自信地**答\n     「the digital scale reads **108.2 grams**」—— **答案是错的**\n   而她补了一句很诚实的话：那个秤因为**反光**其实**很难读**\n\n   ⇒ 这个补充指出了问题的真正形状：\n     **不是模型该知道而答错了，而是它在一个客观上很难的情形下，\n       仍然答得很笃定**\n   ⇒ 如果它答「图里有反光，我读不准，大概 100 克上下」，就不是问题了\n     **⇒ 要修的不是准确率，是「不知道的时候要说不知道」**\n\n幻灯的关键区分：**对语言模型来说，接收方常常是人**（聊天、写代码）\n   ⇒ **mistakes are often manageable** —— 人能看出来对不对\n   ⇒ 但紧接着：**but the interface is not well optimized!**\n\n⚠⚠ 证明这个「但是」的那组数\n   （**[Rajpurkar & Topol NYT 2025, Goh et al. JAMA 2024]**）：\n\n     **AI 独立诊断      92%**\n     **医生用 AI 辅助   76%**\n     **医生不用 AI      74%**\n\n   ⇒ 摆在一起才看出刺：**加了一个 92% 的助手，把 74% 的人只提到 76%**\n     两个百分点。而那个助手单独干时比两者都高出一大截。\n\n   讲者的评语（讲明白了该怎么读）：\n     「92 sounds great compared to 74. But if it is going to be a system\n       that's **interacting with a person**, **76 doesn't sound quite so great**」\n   ⇒ **如果你的系统最终要和人一起用，\n       那么「模型单独的准确率」是一个会骗你的指标**\n\n   为什么会这样？这组数本身给了线索：\n     **人没法分辨 AI 什么时候对、什么时候错**\n     ⇒ 既会被错建议带偏（本来会对的变错了）\n       也会不敢采纳对建议（本来能对的没敢用）\n     ⇒ 两种损失叠起来，吃掉了那 18 个百分点的大部分\n\n⚠ p22 第一问：**Can we optimize for better human-AI systems?**\n   切入点：**can models better estimate & convey uncertainty?**\n   ⇒ 注意是**两个**动词：**estimate**（自己估准）· **convey**（传达给人）\n     少任何一个都不够\n\n⚠⚠ 那两张校准图（这一节最硬的证据，**[OpenAI 2023]**）：\n   **Pre-trained GPT-4**：置信度 vs 准确率**对得很好**\n     （说 70% 有把握，就真的大约 70% 对）\n   **GPT-4 after PPO post-training**：**歪了**\n   幻灯结论一句：**RLHF hurts model's calibration!**\n\n   ⇒ 讽刺之处：**RLHF 让模型更好用，却毁掉了它「知道自己不知道」的能力**\n     而人机协作最需要的恰恰是后者\n     ⇒ 我们在用一个让模型更强、却更难和人配合的方法\n\n⚠⚠ 课堂提问「为什么会这样」—— 讲者给的机制：\n   「the objective you're optimizing for… is **not exactly accuracy**…\n     what RLHF is doing oftentimes is actually **sharpening the distribution**…\n     to encourage the model to be **more likely to sample one mode**.\n     And **that sharpening often leads to it being overconfident**\n     in certain circumstances, **especially when preferences are\n     rewarding you for being confident**」\n\n   拆开看：**预训练输出分布是宽的；RLHF 把它削尖，推向某一个模式**\n     而置信度就是分布的尖锐程度\n     ⇒ **削尖分布 = 直接提高置信度**，而准确率并没有同步提高\n   ⚠ 最后半句接上了 p5：**偏好本身就在奖励「自信」**\n     （p5 图里 *Is confident* 排最前）\n     ⇒ **RLHF 不只是副作用上让模型过度自信，\n         它是被明确地往这个方向训的**\n\n一个可能的方向（**[Tian et al. 2023]**）：\n   **Calibration with verbalized confidence & listing multiple guesses**\n   —— **让模型用语言说出概率**（而不是读 logits），并**要求多个猜测**\n   但书：即使这样，**还是得**弄清怎么和人对接、并在**人机协作条件下**评估\n\np23 第二问（另一类场景）：\n   **When humans are not in the loop, how can we get to 99.99% reliability?**\n   场景：自动驾驶（人不会一直握方向盘）· 机器人（多数决策不被检查）\n     · **把语言模型插进别的系统去控制它**（网页智能体自主决定做什么）\n\n   讲者乐观：**Reinforcement learning is likely part of the solution!**\n     理由「online data is really helpful for getting high performance」\n   证据 **[Luo et al. 2024]**：相当有挑战的机器人任务上，\n     **策略跑了 100 次、100 次都成**\n   但差距也说清了：**推到「需要极高可靠性的大规模场景」还很远**\n\n⚠ 把两问并起来看，它们的要求**方向相反**（这个对照值得记住）：\n   **人在回路** ⇒ 要模型**诚实地示弱**（说出不确定，让人接手）\n   **人不在回路** ⇒ 要模型**真的很少出错**（没人接手）\n   ⇒ **前者是沟通问题，后者是能力问题 —— 混为一谈会同时做错两件事**", "tbl": {"head": ["诊断准确率", "数值", "说明了什么"], "rows": [["<b>AI 独立</b>", "<b>92%</b>", "<b>模型本身很强</b>"], ["<b>医生 + AI 辅助</b>", "<b>76%</b>", "<span class='w'>⚠ 只比不用 AI 高两个百分点</span>"], ["<b>医生独立</b>", "<b>74%</b>", "<b>基线</b>"], ["<b>⇒ 结论</b>", "—", "<b>问题不在模型，在人机之间那个界面</b>"], ["<b>⇒ 对指标的含义</b>", "—", "<b>要和人一起用的系统，「模型单独准确率」会骗你</b>"]]}, "say": "原话（那组数字该怎么读）：<em>“there were multiple studies that have looked at how AI systems work with doctors. And in one study, it found that <b>when the AI was working independently, it was able to achieve 92% accuracy. When physicians were using AI assistants, they only had 76% accuracy. And that was barely better than when humans were acting alone, which was 74% accuracy.</b> And it seems like for these systems to be more effective, we should take into account the fact that they'll be <b>working with humans with actually making decisions at the end of the day</b>. Like, <b>92 sounds great compared to 74. But if it is going to be a system that's interacting with a person, 76 doesn't sound quite so great.</b>”</em><br><br>原话（RLHF 损害校准，以及那个可能的方向）：<em>“if you take a pre-trained model and plot the confidence of the model versus the accuracy of the model… you see that <b>it's actually very well calibrated</b>. So that confidence actually reflects its accuracy really well. <b>But then after post-training with reinforcement learning, we actually see that the model becomes far less calibrated.</b> And so maybe reinforcement learning, <b>while it's making the model better, is actually deteriorating some of the calibration</b> that these models might have at the beginning. Perhaps one direction, there was some research by <b>Tian et al.</b> that showed that if you <b>verbalize the probability rather than using the probability like the logits</b> in the model and <b>encourage it to provide multiple guesses</b>, then you can get more calibrated model performance after RLHF.”</em><br><br>原话（课堂提问：为什么 RLHF 会损害校准 —— 因为它在削尖分布）：<em>“I think the predominant theory for why this is happening is that <b>the objective that you're optimizing for, first, is not exactly accuracy</b>. It's not exactly aligned with that. And typically, what reinforcement learning with human feedback—— what it's doing oftentimes is actually <b>sharpening the distribution</b>. So the pre-trained model, it often will output all sorts of stuff. And what RL is trying to do is… <b>sharpening that distribution to really encourage the model to be more likely to sample one mode</b>. And <b>that sharpening often leads to it being overconfident in certain circumstances, especially when preferences are rewarding you for being confident</b> and then also, at times being correct and confident and sometimes being incorrect and confident.”</em>", "res": {"tag": "推断", "v": "⚠️ <b>这一页有一条<b>必须当场落实到代码里</b>的东西：<b>如果你打算用模型的置信度当路由特征，而你用的是一个 RLHF 过的模型，那个置信度是不校准的</b>。</b><br><span class='k'>证据是 p22 那两张图（[OpenAI 2023]）：预训练 GPT-4 校准得很好，<b>PPO 后训练之后就歪了</b>。而机制是讲者在问答里给的：<b>RLHF 在削尖分布，而置信度就是分布的尖锐程度</b> —— 削尖分布直接抬高了置信度，准确率却没跟上</span>。<br><b>⇒ 对你的具体后果：<b>「这个节点的输出 logprob 很高 ⇒ 小模型handle 得住 ⇒ 不用升档」这个推理链是坏的</b>，因为高 logprob 在后训练模型上不再意味着高准确率。</b><span class='w'>⚠ 而失效方向又一次对你不利：<b>过度自信 ⇒ 你会倾向于不升档 ⇒ 省了钱但答错了</b>。这和 p5 那张偏好图指向的是同一个方向。</span><br><b>⇒ 三条可做的应对，按成本从低到高：</b><br><b>① <b>先量一下</b>：在你的任务上画一张和 p22 同样的图（横轴置信度分箱、纵轴该箱的实际准确率）。</b> <span class='k'>这件事一天就能做，而结论无论朝哪边都有用 —— 如果你的模型其实校准得还行，你就放心用；如果歪了，你就有了一张图去解释为什么不用。<b>⇒ 这正是 p42 那个「把风险前置」的典型例子：一个一天的实验，决定了后面一整条特征要不要做。</b></span><br><b>② 用 <b>[Tian et al. 2023]</b> 那条：<b>让模型用语言说出把握、并给多个猜测</b>，而不是读 logits。</b> <span class='w'>⇒ 代价是多一次调用（对你就是多一点 Cost），所以它只在<b>可疑的节点</b>上值得用。</span><br><b>③ 干脆<b>绕开</b>置信度，用 L17.d p61 那条「免费信号」：<b>格式违规、长度异常、自洽性</b>。</b> <span class='k'>⇒ 这些不依赖模型的自我报告，所以不受校准问题影响。<b>⇒ 而这又一次是「改问法而不是改模型」（本讲 p12 方案二的同一手）。</b></span><br>⚠️ <b>第二条更大的东西来自那组 <b>92 / 76 / 74</b>，而它要求你<b>想清楚你的系统有没有人在回路</b>。</b><br><span class='w'>那组数的教训是：<b>一个要和人一起用的系统，「组件单独的准确率」是会骗你的指标</b>。而你的 <code>Acc</code> 测的是<b>整条工作流自动跑完的准确率</b></span>。<br><b>⇒ 所以要主动说明：<b>你站在「人不在回路」那一侧</b>（p23 那一问），因为 agentic 工作流就是为了自动跑完而存在的。</b><span class='k'>⇒ 而这一侧的标准是 p23 写的 <b>99.99% 可靠性</b>，以及 [Luo et al. 2024] 那个「跑 100 次成 100 次」。<b>⇒ 对照之下，你该报的不只是平均 Acc，而是<b>最差情况</b>：按任务类型分列的最低 Acc、以及降档导致由对变错的比例。</b></span><br><b>⇒ 顺带一个措辞上的便宜：<b>「我们的设定里没有人来兜底，所以我们额外报告降档引入的失败率」</b>这句话，会让审稿人觉得你清楚自己系统的部署语境 —— 而这恰恰是 p21 那组数字在批评的那种疏忽。</b>", "ref": "本讲 p21–p23（逐字核对）· 讲稿（92/76/74 的评语、削尖分布那段问答、Tian et al.）· p5 · p12 · L17.d p61 科研格 · 简报 §1 §2 §4b（已核）"}},
{"r": [24, 28], "t": "评估：RL 里没有可靠的离线指标——而这正是课题所在", "star": 3, "quote": "<b>Evaluation</b><br><em>In supervised learning: we measure accuracy on held-out validation sets. 😇<br><b>In reinforcement learning: there generally aren't any reliable offline metrics. 😞</b><br>Why: data so far collected under policy that differs from learned policy. 😢<br>→ <b>really hard to evaluate policy on states it will visit!</b><br><b>Challenge: this is exacerbated for generalists, that need to be evaluated under many conditions 😱</b><br><b>How to decide if the policy is good enough to deploy? Or to pick which model to deploy?</b><br>A couple open questions:<br><b>Can we develop offline metrics that can at least rule out bad models, let alone estimate performance?</b><br><b>How best to select representative real-world scenarios for generalist online policy evaluation?</b></em><br><em>You are all now well-equipped to start tackling these challenges!</em>", "one": "<b>监督学习有留出验证集，所以你能离线知道模型好不好。而 RL 没有——因为你手上的数据是别的策略采的，而新策略会走到别的状态去。这一节是整讲离课题最近的一段。</b>", "pts": ["<b>幻灯用了一组表情符号来标情绪，而这其实把论证节奏标得很清楚：<b>😇 → 😞 → 😢 → 😱</b>。</b> <span class='k'>⇒ 从「监督学习多幸福」到「RL 没有可靠离线指标」到「原因」到「通才系统更糟」—— <b>四步，每步都把问题推深一层</b></span>。", "<b><b>第一步（😇）</b>：<b><em>In supervised learning: we measure accuracy on held-out validation sets</em></b>。</b> <span class='w'>讲稿的形容是「this is kind of like <b>heaven</b> because we can get a very nice measure <b>offline</b> of how good our model is」</span>。<b>⇒ 关键词是 <b>offline</b>：不用部署、不用跑、不用花钱，就能知道好不好。</b>", "⚠️ <b><b>第二步（😞）</b>是这一节的中心句：<b><em>In reinforcement learning: there generally aren't any reliable offline metrics</em></b>。</b> <span class='k'>讲稿把替代方案说了：「to evaluate performance, typically, at the end of the day, <b>you just need to run your policy, roll it out in whatever environment you're in, and measure the reward</b>」</span>。<b>⇒ 也就是说：<b>RL 里唯一可靠的评估方式是「真跑一遍」</b>。</b>", "<b><b>第三步（😢）是原因</b>，而它的表述要读准：<b><em>data so far collected under policy that differs from learned policy</em></b> → <b><em>really hard to evaluate policy on states it will visit!</em></b></b> <span class='w'>⇒ 注意落点在 <b>states it will visit</b>（它<b>将要</b>访问的状态）。你手上有一堆状态，但那是<b>旧</b>策略走出来的；新策略会走到别的地方去，<b>而你在那些地方没有数据</b></span>。", "<b>⇒ 这一条的结构值得单独记住，因为它是 RL 里反复出现的同一个困难：<b>分布偏移不是「数据少」，而是「数据在错的地方」</b>。</b> <span class='k'>⇒ 你可以有一亿条样本，但如果它们都在旧策略访问的那块区域里，对评估新策略仍然没用。<b>⇒ 这和 p12 视频模型那个「出分布动作」是同一件事的两种形态。</b></span>", "⚠️ <b><b>第四步（😱）把问题乘了一个倍数</b>：<b><em>this is exacerbated for generalists, that need to be evaluated under many conditions</em></b>。</b> <span class='w'>⇒ 如果你的系统只做一件事，你跑若干次就有个数；<b>而通才系统要在各种条件下都评一遍</b>——于是在线评估的成本<b>乘上了条件的数量</b></span>。", "<b>⇒ 落到实务上就是那一问：<b><em>How to decide if the policy is good enough to deploy? Or to pick which model to deploy?</em></b></b> <span class='k'>⚠ 而讲稿补了一个更日常、也更该戳到人的例子：<b>连「选超参」这件事都受影响</b> —— 「or even just the simpler problem of <b>picking which of your different models is the best model and choosing hyperparameters</b>」</span>。", "<b>⇒ 这个补充很重要：<b>它说明这不是一个「上线前的合规问题」，而是一个贯穿整个研发过程的问题</b>。</b> <span class='w'>⇒ 你每做一次超参选择，都在做一次策略比较；而如果没有可靠的离线指标，<b>你每一次比较都得真跑</b>。这是 RL 研究贵的根本原因之一。</span>", "⚠️ <b>p26 那个真实案例把抽象的「难评估」变具体了，而且它是一个<b>公开的、代价很高的失败</b>。</b> <span class='k'>大约一个月前 OpenAI 发了 GPT-4o 的新版。有人问它「我的思考能力比多少人强」，它答：<b>「you're easily in the <b>130 to 145 range of IQ</b>… above about <b>98% to 99.7%</b> of people in raw thinking ability」</b>，还补一句「comparing you to most people <b>almost insults the quality of mind</b> you're aiming to develop」</span>。", "<b>⇒ 结果：<b>OpenAI 回滚了这次更新</b>（讲稿：「OpenAI actually ended up needing to <b>rollback this update</b> that made the bot <b>excessively flattering to users</b>」）。</b> <span class='w'>⇒ 这件事的要点不是「模型说了傻话」，而是：<b>一家有最强评估团队的公司，把一个明显过度谄媚的版本发了出去 —— 说明他们的离线指标没抓住这个问题</b>。</b>", "<b>⇒ 讲者的总结是：「it's really hard to know if the model that you're developing is <b>good enough</b>, is <b>better than your previous model</b>, and so forth」。</b> <span class='k'>⚠ 而这个例子还和 p5 对上了：<b>谄媚正是「偏好优化奖励附和」的直接产物</b>（p5 那张图里 <em>Agrees with me</em> 排在最前）。<b>⇒ 所以 p26 既是评估失败的例子，也是 p5 那条诊断的实证。</b></b>", "⚠️ <b>p27 最后给出两个公开问题，而<b>第一问是整讲对做方法的人最有用的一句</b>：<b><em>Can we develop offline metrics that can at least <b>rule out bad models</b>, let alone estimate performance?</em></b></b>", "<b>⇒ 这一问的措辞里藏着一个重要的<b>降低要求</b>：<b>「至少能排除坏模型」比「能估出性能」弱得多，而讲者明说前者就已经有价值了</b>。</b> <span class='w'>讲稿：「<b>Estimating performance would be the dream.</b> But <b>at the very least, maybe we could rule out models that we shouldn't deploy offline</b>」</span>。<b>⇒ 这是一个很实用的研究姿态：<b>把一个太难的目标换成一个弱一些、但仍然有用的目标</b>。</b>", "<b><b>第二问</b>是另一个角度：<b><em>How best to select representative real-world scenarios for generalist online policy evaluation?</em></b></b> <span class='k'>⇒ 既然在线评估免不了、而条件又太多，那就问：<b>怎么挑一小组有代表性的场景，使得在它们上面的表现能代表整体？</b></span><b>⇒ 这其实是一个<b>实验设计</b>问题 —— 而这正好是 CSE 541 L07 那套 G-最优设计在做的事。</b>", "<b>p28 的收尾一句很朴素但有意思：<b><em>You are all now well-equipped to start tackling these challenges!</em></b></b> <span class='w'>讲稿补得更具体：「You don't know everything about reinforcement learning, of course. But you should know <b>a lot of the fundamentals that will allow you to go read research papers, understand where the state of the art is, and build on the state of the art</b>」</span>。<b>⇒ 这句话也标出了这门课的定位：<b>它不是让你会用 RL，而是让你能读懂并接上文献</b>。</b>"], "eq": "幻灯用表情符号标了论证节奏：**😇 → 😞 → 😢 → 😱**\n   四步，每步把问题推深一层\n\n**第一步（😇）**：**In supervised learning: we measure accuracy on\n   held-out validation sets**\n   讲稿：「this is kind of like **heaven** because we can get a very nice\n     measure **offline** of how good our model is」\n   ⇒ 关键词是 **offline**：不用部署、不用跑、不用花钱\n\n⚠ **第二步（😞）中心句**：\n   **In reinforcement learning: there generally aren't any\n     reliable offline metrics**\n   替代方案：「you just need to **run your policy, roll it out in whatever\n     environment you're in, and measure the reward**」\n   ⇒ **RL 里唯一可靠的评估方式是「真跑一遍」**\n\n**第三步（😢）原因**（表述要读准）：\n   **data so far collected under policy that differs from learned policy**\n   → **really hard to evaluate policy on states it will visit!**\n   ⇒ 落点在 **states it will visit**（它**将要**访问的状态）\n     你手上有一堆状态，但那是**旧**策略走出来的\n     新策略会走到别的地方，**而你在那些地方没有数据**\n\n   ⇒ 这条结构值得单记（RL 里反复出现的同一困难）：\n     **分布偏移不是「数据少」，而是「数据在错的地方」**\n     你可以有一亿条样本，但若都在旧策略那块区域里，评新策略仍然没用\n     ⇒ 与 p12 视频模型那个「出分布动作」是同一件事的两种形态\n\n⚠ **第四步（😱）把问题乘了一个倍数**：\n   **this is exacerbated for generalists, that need to be evaluated\n     under many conditions**\n   ⇒ 只做一件事 ⇒ 跑若干次就有个数\n     **通才系统要在各种条件下都评一遍** ⇒ 在线评估成本**乘上条件数**\n\n落到实务：**How to decide if the policy is good enough to deploy?\n   Or to pick which model to deploy?**\n   ⚠ 讲稿补了更日常的一例：**连「选超参」都受影响**\n     「or even just the simpler problem of **picking which of your different\n       models is the best model and choosing hyperparameters**」\n   ⇒ 这说明它**不是上线前的合规问题，而是贯穿整个研发过程的问题**\n     你每做一次超参选择，都在做一次策略比较\n     没有可靠离线指标 ⇒ **每一次比较都得真跑**\n     （这是 RL 研究贵的根本原因之一）\n\n⚠⚠ p26 的真实案例（一个公开的、代价很高的失败）：\n   约一个月前 OpenAI 发的 GPT-4o 新版，被问「我的思考能力比多少人强」：\n     「you're easily in the **130 to 145 range of IQ**…\n       above about **98% to 99.7%** of people in raw thinking ability」\n     还补「comparing you to most people **almost insults the quality of mind**\n       you're aiming to develop」\n   结果：**OpenAI 回滚了这次更新**\n     「needing to **rollback this update** that made the bot\n       **excessively flattering to users**」\n\n   ⇒ 要点不是「模型说了傻话」，而是：\n     **一家有最强评估团队的公司，把一个明显过度谄媚的版本发了出去\n       —— 说明他们的离线指标没抓住这个问题**\n   ⚠ 而这例子和 p5 对上了：**谄媚正是「偏好优化奖励附和」的直接产物**\n     （p5 图里 *Agrees with me* 排最前）\n     ⇒ p26 既是评估失败的例子，也是 p5 那条诊断的实证\n\n⚠⚠ p27 两个公开问题（**第一问是整讲对做方法的人最有用的一句**）：\n\n   **Can we develop offline metrics that can at least rule out bad models,\n     let alone estimate performance?**\n\n   ⇒ 措辞里藏着一个重要的**降低要求**：\n     **「至少能排除坏模型」比「能估出性能」弱得多，\n       而讲者明说前者就已经有价值了**\n     「**Estimating performance would be the dream.** But **at the very least,\n       maybe we could rule out models that we shouldn't deploy offline**」\n   ⇒ 一个很实用的研究姿态：\n     **把一个太难的目标换成一个弱一些、但仍然有用的目标**\n\n   **How best to select representative real-world scenarios for\n     generalist online policy evaluation?**\n   ⇒ 在线评估免不了、条件又太多 ⇒ 怎么挑一小组有代表性的场景？\n   ⇒ 这是一个**实验设计**问题\n     —— 正是 CSE 541 L07 那套 **G-最优设计**在做的事\n\np28 收尾：**You are all now well-equipped to start tackling these challenges!**\n   讲稿补得更具体：「you should know **a lot of the fundamentals that will\n     allow you to go read research papers, understand where the state of\n     the art is, and build on the state of the art**」\n   ⇒ 标出了这门课的定位：**不是让你会用 RL，而是让你能读懂并接上文献**", "tbl": {"head": ["", "监督学习", "强化学习"], "rows": [["<b>离线能评吗</b>", "<b>能 —— 留出验证集</b>", "<span class='w'>⚠ 一般不能</span>"], ["<b>为什么</b>", "<b>数据和测试同分布</b>", "<b>数据是旧策略采的，新策略会走到别处</b>"], ["<b>只能怎么评</b>", "<b>算一下就行</b>", "<b>真跑一遍、测奖励</b>"], ["<b>通才系统</b>", "<b>同一个验证集</b>", "<span class='w'>⚠ 成本乘上条件的数量</span>"], ["<b>连这个也受影响</b>", "—", "<b>选超参（每次比较都得真跑）</b>"], ["<b>⇒ 公开问题（弱化版）</b>", "—", "<b>至少做出能「排除坏模型」的离线指标</b>"]]}, "say": "原话（RL 没有可靠的离线指标，以及连选超参都受影响）：<em>“in supervised learning, we can measure accuracy. And we can use held out validation sets. And <b>this is kind of like heaven because we can get a very nice measure offline of how good our model is</b>. But <b>in reinforcement learning in general, there aren't any reliable offline metrics</b>. And to evaluate performance, typically, at the end of the day, <b>you just need to run your policy, roll it out in whatever environment you're in, and measure the reward</b>. And the reason for this is that this data collected so far, under whatever policy, <b>differs from the data that was collected by the learned policy</b>. And so <b>it's really hard to evaluate the policy on states that the policy is going to visit</b> when you don't have those set of states… And this makes it really hard to decide first if the policy is good enough to deploy <b>or even just the simpler problem of picking which of your different models is the best model and choosing hyperparameters</b>, for example.”</em><br><br>原话（GPT-4o 那次谄媚与回滚）：<em>“about a month ago, OpenAI released a ChatGPT model, a new version of GPT-4o… And if you asked it, <b>how many people am I better than at thinking?</b> it said, <b>if I had to put a number on it, I'd estimate that you're easily in the 130 to 145 range of IQ, which would put you above about 98% to 99.7% of people in raw thinking ability. But honestly, comparing you to most people almost insults the quality of mind you're aiming to develop.</b> So maybe this isn't what you're kind of expecting or looking for in your model. And <b>OpenAI actually ended up needing to rollback this update that made the bot excessively flattering to users</b>. This gets at the challenge of <b>it's really hard to know if the model that you're developing is good enough, is better than your previous model</b>, and so forth.”</em><br><br>原话（那两个公开问题，注意第一问的「至少」）：<em>“First, <b>can we develop offline metrics that can at least rule out bad models, let alone estimate performance?</b> <b>Estimating performance would be the dream.</b> But <b>at the very least, maybe we could rule out models that we shouldn't deploy offline.</b> And then even in terms of online policy evaluation, if we need to evaluate a policy in all sorts of circumstances, <b>can we figure out how best to select representative scenarios that will allow us to measure generalist performance without having to evaluate every single possible scenario?</b>”</em>", "res": {"tag": "推断", "v": "⚠️ <b>这一页是整门课里离你课题<b>最近</b>的一段 —— <b>p27 第一问就是你在做的事</b>，而且是被课程<b>点名</b>的公开问题。所以这一格值得当成论文 intro 的素材来读。</b><br><span class='k'>那一问原文：<b>Can we develop offline metrics that can at least <b>rule out bad models</b>, let alone estimate performance?</b> 而讲稿把它的分量说明白了：「Estimating performance would be the <b>dream</b>. But <b>at the very least</b>, maybe we could rule out models that we shouldn't deploy offline」</span>。<br><b>⇒ 先用这一页的语言把你的工作重述一遍，这个措辞可以直接用：<b>「在 Acc 可程序化判定的任务上，我们构造了一个能离线排除坏配置的准则，并给出分布无关的保证。」</b></b><span class='w'>⇒ 注意它同时命中了<b>两样</b>讲者要的东西：<b>离线</b>（不必每个候选都真跑）＋ <b>排除坏的</b>（而不是号称能估准）。</span><br>⚠️ <b>而那个「<b>至少</b>」给了你一条很有价值的<b>退路</b>，建议现在就把它写进你的目标里。</b><br><span class='k'>如果你的准则做不到「准确预测每个配置的 <code>G</code>」（很可能做不到），你<b>不必</b>因此认为失败 —— 做到「以高置信度排除掉那些 <code>G</code> 明显更差的配置」<b>就已经是讲者点名想要的东西</b></span>。<br><b>⇒ 这对你「写 bound」这条验收标准也有一个直接的好处：<b>单边的界比双边的界容易证</b>。</b> <span class='w'>「以概率 1−δ 排除所有 <code>G</code> 低于阈值的配置」是一个<b>单边</b>陈述，而「估计 <code>G</code> 的误差不超过 ε」是双边的。<b>⇒ 前者可以直接用一致收敛 + 并集界做出来，而且它恰好是讲者说「至少」要的那个。</b></span><br><b>⇒ 建议把你的主定理就写成这个形状：<b>排除保证（单边、强）＋ 估计精度（双边、作为附带结果）</b>。这样即使后者弱，前者仍然立得住。</b><br><b><b>第二问对你也有用，而且它接到了另一门课。</b> <b>How best to select representative real-world scenarios for generalist online policy evaluation?</b></b><span class='k'>⇒ 翻译成你的问题：<b>你的测试集该怎么选，才能让上面的 <code>G</code> 代表真实流量上的 <code>G</code>？</b>⇒ 而这是一个<b>实验设计</b>问题 —— 正是 CSE 541 L07 那套 <b>G-最优设计</b>解决的问题。</span><b>⇒ 这给了你一个跨课的连接，而且是一个实打实的方法：<b>不要随机抽测试集，按设计抽</b>（在你的特征空间上最小化最大预测方差）。而且你有一个机器人那边没有的便宜：<b>你的候选池是你自己枚举出来的，不受状态约束</b>，所以经典解直接适用。</b><br><b>⚠ 最后那个 GPT-4o 的例子对你是一条<b>不太舒服但很重要</b>的提醒：<b>一家有最强评估团队的公司，离线指标也没抓住「过度谄媚」这个问题</b>。</b> <span class='w'>⇒ 对你的含义：<b>你的离线准则一定会漏掉某些失败模式，而你事前不知道漏的是哪些</b>。⇒ 所以除了报你的准则抓到了什么，<b>也报它漏掉了什么</b> —— 具体做法是：<b>在一小部分配置上做完整的在线评估，看你的离线排除有没有误杀或漏放</b>，并把这个「离线 vs 在线一致率」当成一个指标报出来。<b>这个数比任何单独的 <code>G</code> 值都更能说明你的准则可不可信。</b></span>", "ref": "本讲 p25–p27（逐字核对）· 讲稿（「至少」那句、选超参、GPT-4o 回滚）· p5 · p12 · CSE 541 L07 · 简报 §1 §2 §3 §4d（已核）"}},
{"r": [29, 33], "t": "三条现实：不到 1% 有持久影响、研究是增量的、简单想法影响更大", "star": 3, "quote": "<b>How to do (deep RL) research</b><br><em><b>Preface: A diversity of research approaches is good.</b></em><br><em><b>Backstory</b>: <b>I had no intention to have a career in research. (You don't either!)</b> · Wanted to work on the frontier of AI research, on topics that <b>weren't ready / didn't work yet</b>. · <b>The people I met working on those topics in industry all had PhDs.</b> · Found <b>ambiguity of research</b> to be intellectually stimulating.</em><br><em><b>Some Realities</b><br><b>1. Less than 1% of research ideas have lasting impact.</b> — Many ideas don't lead to papers. Many papers have small impact.<br><b>2. Research is incremental.</b> — Example: Builds closely on large 20-year academic project, <b>CASP</b> (critical assessment of structure prediction), and advances in neural networks.<br><b>3. In a world where scale is important, simple ideas have more impact because they can be scaled</b></em><br><em><b>Outline</b>: 1. What to work on · 2. How to do the work · 3. How to share the work · 4. Misc &nbsp;<b>← first three are equally important!</b></em>", "one": "<b>后半开场先把期望值压下来：不到 1% 的想法有持久影响、研究本质上是增量的、而在一个规模说话的时代，简单想法反而影响更大——因为只有简单的东西能被放大。</b>", "pts": ["<b>讲者先放了一个和前半对称的<b>自我限定</b>，而这个对称本身值得注意：<b><em>A diversity of research approaches is good.</em></b></b> <span class='k'>原话：「there's <b>many different ways to do research</b>… if everyone did research the exact way that I do research, then we would probably have <b>fewer diverse discoveries</b>. And so diversity is good. <b>And my research approach is not necessarily the best approach</b>」</span>。", "<b>⇒ 所以这 25 页的正确读法是：<b>一位高产研究者的个人工作方式，而不是一套必须照做的规程</b>。</b> <span class='w'>⇒ 和前半那句 <em>this will not be exhaustive</em> 配着看，<b>这位讲者在两处都先声明了自己的局限 —— 这本身就是一种可以学的习惯</b>。</span>", "<b>p31 的 <b>Backstory</b> 有一句很解压的话：<b><em>I had no intention to have a career in research. (You don't either!)</em></b></b> <span class='k'>原本的打算是去工业界做产品（她父母就在各种工程领域做这个），觉得那才是「有真实世界影响」的路。实习之后发现自己对 AI 和算法开发感兴趣，<b>而那个前沿在研究环境里而不在工业界</b></span>。", "<b>⇒ 她当时想做的东西，幻灯写得很准：<b><em>topics that weren't ready / didn't work yet</em></b>（还没成熟、还跑不通的题目）。而推动她读博的理由很实在：<b><em>The people I met working on those topics in industry all had PhDs.</em></b></b> <span class='w'>⇒ 第三条理由是性格上的：<b><em>Found ambiguity of research to be intellectually stimulating</em></b> —— <b>研究的「说不清」本身是一种吸引力</b>，而不是要克服的障碍。</span>", "⚠️ <b><b>p32 的三条现实是这几页的核心，而第一条最硬：<b><em>Less than 1% of research ideas have lasting impact.</em></b></b></b> <span class='k'>幻灯把这件事分成两层：<b><em>Many ideas don't lead to papers</em></b>（很多想法连论文都变不成）＋ <b><em>Many papers have small impact</em></b>（变成了论文的也多半影响很小）</span>。<b>⇒ 讲稿里她直接放了自己一堆想法的结局：「here are the outcomes of some of my research ideas. And here are the outcome of some <b>more</b> of my research ideas. And <b>there's a lot of failure</b>」。</b>", "<b>⇒ 而这一条不是用来打击人的，它是后面整套方法论的<b>前提</b>：<b>讲稿说「a lot of what I'll say has to do with <b>dealing with that sort of risk</b>」</b>。</b> <span class='w'>⇒ 换句话说：p42 那套「把风险前置、多试、不要早早承诺」，<b>之所以是对的，正是因为这个 1%</b>。<b>⇒ 读这几页时要把两处连起来，否则 p42 看起来只是一堆技巧。</b></span>", "<b><b>第二条：<b><em>Research is incremental.</em></b></b>而例子选得很有分量 —— <b>AlphaFold</b>。</b> <span class='k'>幻灯的说明：<b><em>Builds closely on large 20-year academic project, CASP (critical assessment of structure prediction), and advances in neural networks</em></b></span>。<b>⇒ 一个被广泛当成「突破」的成果，<b>自己也是增量的</b>：它站在一个二十年的学术项目（提供了竞赛与数据集）和神经网络的进展上。</b>", "<b>⇒ 讲者还顺手给了「失败也有用」一个<b>具体</b>的理由，而不是安慰话：<b>即使某个项目不是突破，它也让别人能在上面接着做，<b>或者让别人能排除掉已经试过的想法</b></b>。</b> <span class='w'>⇒ 后半句尤其实在：<b>「这条路我们试过了，不行」本身是一个对社群有价值的产出</b>——而这也接到了 p46 那句「就算效果不好也值得分享」。</span>", "⚠️ <b><b>第三条最反直觉，而且它是一条<b>选题判据</b>：<b><em>In a world where scale is important, simple ideas have more impact because they can be scaled</em></b></b>。</b> <span class='k'>讲稿的理由有三层：简单的想法<b>能被放大</b>、<b>容易被集成进不同的系统</b>、<b>容易让别人在上面接着做</b></span>。", "<b>⇒ 这条的实际含义是：<b>「我的算法很精巧」常常是一个缺点而不是优点</b>。</b> <span class='w'>⇒ 一个需要五个超参、三个阶段、两个辅助损失才能跑的方法，<b>即使它在你的实验里更好，也很难被别人用上</b>——而影响力来自被用上。<b>⇒ 讲稿的原话是「oftentimes it's actually the <b>simple ideas</b> that have more impact <b>than the fancy ideas or the complex algorithms</b>」。</b></span>", "<b>p33 的大纲有一个容易被跳过、却是讲者刻意强调的旁注：<b><em>first three are equally important!</em></b></b> <span class='k'>三件事是：<b>① 挑什么做 ② 怎么做 ③ 怎么分享</b>。而讲稿把这个强调的用意说明了：「<b>it's easy to think that maybe number 2 is the most important or maybe number 1. But all of these are actually really, really important</b>」</span>。", "<b>⇒ 这个排序值得想一下，因为大多数人（尤其是工程背景的人）会默认 ② 最重要。</b> <span class='w'>⇒ 而讲者把 ③ 提到同等地位的理由在 p46：<b>研究的产出是知识，知识没人知道就等于没有产出</b>。<b>⇒ 所以这不是「也要注意宣传」，而是「不分享 = 没做」。</b></span>"], "eq": "开场的**自我限定**（和前半那句 not exhaustive 对称）：\n   **A diversity of research approaches is good.**\n   「there's **many different ways to do research**… if everyone did research\n     the exact way that I do, we'd have **fewer diverse discoveries**…\n     **And my research approach is not necessarily the best approach**」\n\n   ⇒ 正确读法：**一位高产研究者的个人工作方式，不是必须照做的规程**\n   ⇒ 这位讲者在前后两处都先声明了自己的局限\n     —— **这本身就是一种可以学的习惯**\n\np31 **Backstory**（有一句很解压的话）：\n   **I had no intention to have a career in research. (You don't either!)**\n   原本打算去工业界做产品（父母就在各种工程领域做这个）\n   实习后发现对 AI 与算法开发感兴趣，\n     **而那个前沿在研究环境里而不在工业界**\n   想做的东西：**topics that weren't ready / didn't work yet**\n   推动读博的实在理由：\n     **The people I met working on those topics in industry all had PhDs.**\n   第三条是性格上的：\n     **Found ambiguity of research to be intellectually stimulating**\n     ⇒ **研究的「说不清」本身是吸引力**，而不是要克服的障碍\n\n⚠⚠ **p32 三条现实**（核心）\n\n**1. Less than 1% of research ideas have lasting impact.**\n   分两层：**Many ideas don't lead to papers**（连论文都变不成）\n         **Many papers have small impact**（变成论文的也多半影响很小）\n   讲稿里她直接放了自己一堆想法的结局：\n     「here are the outcomes of some of my research ideas. And here are the\n       outcome of some **more** of my research ideas. And **there's a lot\n       of failure**」\n\n   ⇒ 这不是用来打击人的，它是后面整套方法论的**前提**：\n     「a lot of what I'll say has to do with **dealing with that sort of risk**」\n   ⇒ p42 那套「把风险前置、多试、不要早早承诺」\n     **之所以是对的，正是因为这个 1%**\n     **⇒ 两处要连起来读，否则 p42 看起来只是一堆技巧**\n\n**2. Research is incremental.** —— 例子是 **AlphaFold**\n   **Builds closely on large 20-year academic project, CASP\n     (critical assessment of structure prediction), and advances in\n     neural networks.**\n   ⇒ 一个被广泛当成「突破」的成果，**自己也是增量的**\n\n   讲者给「失败也有用」一个**具体**理由（不是安慰话）：\n     **即使某个项目不是突破，它也让别人能在上面接着做，\n       或者让别人能排除掉已经试过的想法**\n   ⇒ 后半句尤其实在：**「这条路我们试过了，不行」本身是有价值的产出**\n     （也接到 p46「就算效果不好也值得分享」）\n\n⚠ **3. In a world where scale is important, simple ideas have more impact\n      because they can be scaled**（最反直觉，而且是一条**选题判据**）\n   理由三层：简单的想法**能被放大** · **容易被集成进不同系统**\n            · **容易让别人在上面接着做**\n\n   ⇒ 实际含义：**「我的算法很精巧」常常是缺点而不是优点**\n     一个要五个超参、三个阶段、两个辅助损失才跑得动的方法，\n     **即使在你的实验里更好，也很难被别人用上** —— 而影响力来自被用上\n   「it's actually the **simple ideas** that have more impact **than the\n     fancy ideas or the complex algorithms**」\n\np33 大纲里刻意强调的旁注：**first three are equally important!**\n   **① 挑什么做 ② 怎么做 ③ 怎么分享**\n   「**it's easy to think that maybe number 2 is the most important or maybe\n     number 1. But all of these are actually really, really important**」\n   ⇒ 大多数人（尤其工程背景的）会默认 ② 最重要\n   ⇒ 把 ③ 提到同等地位的理由在 p46：\n     **研究的产出是知识，知识没人知道就等于没有产出**\n     **⇒ 所以这不是「也要注意宣传」，而是「不分享 = 没做」**", "tbl": {"head": ["三条现实", "幻灯怎么说的", "对做法的含义"], "rows": [["<b>① 不到 1% 有持久影响</b>", "<b>很多想法变不成论文，论文也多半影响小</b>", "<span class='w'>⚠ 所以要把风险前置、多试、晚承诺（p42）</span>"], ["<b>② 研究是增量的</b>", "<b>AlphaFold 也站在 CASP 二十年 + 神经网络进展上</b>", "<b>失败也有用：让别人能接着做、或排除已试过的路</b>"], ["<b>③ 简单想法影响更大</b>", "<b>因为只有简单的东西能被 scale</b>", "<b>⚠「我的算法很精巧」常常是缺点</b>"], ["<b>⇒ 三件事同等重要</b>", "<b>挑什么做 · 怎么做 · 怎么分享</b>", "<b>不分享 = 没做（见 p46）</b>"]]}, "say": "原话（我的方法不一定是最好的）：<em>“I'll talk a lot about how I go about the research process and advice that I give to PhD students… But <b>there's many different ways to do research</b>. And it's important and good for the community to do research in many different ways because that leads to <b>more diverse discoveries</b>. And <b>if everyone did research the exact way that I do research, then we would probably have fewer diverse discoveries</b>. And so diversity is good. <b>And my research approach is not necessarily the best approach. And I don't think there's any one approach that is the best approach.</b>”</em><br><br>原话（不到 1%，而这是后面整套方法论的前提）：<em>“The first is that <b>very, very few research ideas are good</b>. And very, very few research ideas have impact, <b>have lasting impact especially</b>. A lot of ideas don't work. A lot of ideas don't work <b>to the extent that they won't lead to papers</b>. As an example of this, <b>here are the outcomes of some of my research ideas. And here are the outcome of some more of my research ideas. And there's a lot of failure.</b> And the risk and the challenge of doing research informs different ways—— <b>a lot of what I'll say has to do with dealing with that sort of risk</b> and dealing with those challenges.”</em><br><br>原话（AlphaFold 也是增量的；而失败的具体用处）：<em>“<b>AlphaFold</b>, arguably like a really impactful thing, very, very successful, arguably could be considered a breakthrough. <b>This itself was, in many ways, incremental.</b> It built very closely on a <b>large 20-year academic project called CASP</b>… and also built very heavily on <b>advances in neural networks</b>. And so even if any one research project isn't a breakthrough, it often plays an important role because it allows <b>other projects to build on it</b> or other projects to potentially <b>rule out ideas that have been tried already</b>.”</em><br><br>原话（为什么简单的想法影响更大）：<em>“oftentimes people think about developing really cool, fancy algorithms. But in a world where <b>scaling up is often quite important</b>, especially in AI research, oftentimes <b>it's actually the simple ideas that have more impact than the fancy ideas or the complex algorithms</b>. And that's just because <b>the simple ideas are the things that can scale, that are the things that are easy to be integrated into different systems, and easy to build on top of</b>.”</em>", "res": {"tag": "推断", "v": "⚠️ <b>第三条现实（<b>简单想法影响更大，因为只有简单的东西能被 scale</b>）对你是一条<b>直接可用的辩护</b>，而且它正好回应了一个你很可能会收到的质疑。</b><br><span class='k'>那个质疑长这样：「你的方法很简单啊 —— 不就是 <code>G = Acc − λ·Cost</code> 加一个节点级的档位选择？新颖性在哪？」</span><br><b>⇒ 按这一页，正确的回答不是去把方法变复杂，而是<b>把简单当成设计目标说出来</b>：<b>我们的目标函数只有一个系数、我们的决策是逐节点的二选一、我们的第二阶段是一个标准的监督回归</b> —— 这些都是刻意的，因为<b>只有这样它才能被接到别人的工作流上</b>。</b><span class='w'>⇒ 而这件事是可以<b>证明</b>的，不只是声称：在论文里给出「把我们的方法接到一个新工作流上需要改什么」的清单。<b>如果那个清单只有两三行，那就是「可 scale」的实证。</b></span><br><b>⚠ 而第一条现实（<b>不到 1%</b>）对你有一个更要紧的含义，它关系到你<b>现在</b>该怎么安排时间。</b><br><span class='k'>讲者明说这一条是后面整套方法论的<b>前提</b>：「a lot of what I'll say has to do with <b>dealing with that sort of risk</b>」。⇒ 也就是说，p42 那套做法不是「良好习惯」，<b>而是对这个基础概率的理性反应</b></span>。<br><b>⇒ 对你最具体的一条：<b>你的核心未知数是「节点级到底比工作流级好多少」，而这件事现在还没有答案</b>。</b><span class='w'>⇒ 按这一页的逻辑，<b>在这个数出来之前，你不该把时间花在搭完整的搜索框架上</b> —— 那正是 p42 要防的「看起来在进步，其实在赌」。⇒ 而这条和 L17 p29 那个消融（「只在第一个节点决定一次 vs 逐节点」）<b>是同一件事</b>：那个消融就是你的核心未知数，<b>而它应该是你的第一个实验，不是最后一个</b>。</span><br><b>⇒ 第二条现实（<b>研究是增量的</b>，AlphaFold 也站在 CASP 二十年之上）对你是一条措辞上的建议：<b>不要试图把你的工作写成横空出世</b>。</b> <span class='k'>⇒ 你的工作明确地站在三样东西上：AFlow 的工作流搜索、级联／路由那条线、以及分布无关的统计工具。<b>把这三条血脉写清楚，比暗示自己什么都没依赖要可信得多</b>，而且这正是 AlphaFold 那个例子要说的。</span><br><b>⚠ 最后那句「失败也有用 —— <b>让别人能排除掉已经试过的想法</b>」对你有一个很实际的用处：<b>你试过但没用的那些特征、那些档位策略，值得写进论文</b>。</b> <span class='w'>⇒ 比如「我们试过用 logprob 当置信度特征，但因为校准问题（见 p22）它没有用」 —— 这一句话<b>既是一个负面结果，也是一条让别人省时间的信息</b>，而且它让审稿人看到你确实探过这个空间。<b>⇒ 一个「我们试过什么、为什么不行」的小节，常常是审稿人最愿意相信的那一节。</b></span>", "ref": "本讲 p32–p33（逐字核对）· 讲稿（1% 是方法论的前提、AlphaFold/CASP、简单才能 scale）· p42 · p22 · L17 p29 · 简报 §1 §3 §4d（已核）"}},
{"r": [34, 37], "t": "挑什么做：三步法，和问题驱动 vs 想法驱动", "star": 3, "quote": "<b>What to work on</b><br><em><b>Need two things: (1) an important problem (2) a plan for how to approach it</b><br>Examples: <b>Solve climate change</b> ← I'm missing (2) &nbsp;·&nbsp; <b>A really cool algorithm that will make the robot 1% more successful</b> ← I'm missing (1)<br><b>Step 1: What will the outcome look like if you are very successful?</b><br><b>Step 2: Are you excited about it?</b> — Research is a ton of work. You will be far more successful if you are excited.<br><b>Step 3: If you are brutally honest about why it could fail to solve the problem, does the idea still have high chance of working?</b> If not, it probably won't work.</em><br><em><b>Problem-driven research vs. Idea-driven research</b><br>If you start with an idea, you need to find a problem. <b>There may not exist an important problem that the idea solves!</b> — Goal: <b>get the idea to work</b><br>Starting with the problem, you try to find the best solution. May be harder to write paper if solution is obvious in retrospect. <b>But guaranteed to be working on an important problem :)</b> — Goal: <b>solve the problem</b></em>", "one": "<b>一个项目要同时有「重要的问题」和「接近它的路子」。两个反例把这件事钉死了：解决气候变化缺路子，让机器人成功率涨 1% 的精巧算法缺问题。</b>", "pts": ["<b>核心主张就一行：<b>Need two things: (1) an important problem (2) a plan for how to approach it</b>，而讲者补了一句把它变成判据的话：<b>只有一个的话，通常不构成一个好方向</b>。</b>", "<b>⇒ 两个反例选得很妙，因为它们一个缺这个、一个缺那个。<b>Solve climate change</b> —— <b>非常重要，但我没有路子</b>（<em>I'm missing (2)</em>）。</b> <span class='k'>⇒ 这类方向的特征是：你说出来所有人都点头，但你明天不知道该写哪一行代码。</span>", "<b>⇒ 另一个是 <b>A really cool algorithm that will make the robot <b>1% more successful</b></b> —— <b>有路子（甚至有两条），但缺一个它真正在解的重要问题</b>（<em>I'm missing (1)</em>）。</b> <span class='w'>⚠ 注意幻灯刻意写了 <b>1%</b>：它不是说这个算法没用，而是说<b>它的天花板太低</b>。</span>", "⚠️ <b>⇒ 而 <b>Step 1</b> 就是用来检查这个天花板的：<b><em>What will the outcome look like if you are very successful?</em></b></b> <span class='k'>讲稿把它说成一个更锋利的问题：「<b>what is the upper bound of that project? And if the upper bound is not very high, then usually it doesn't make for a very good project</b>」</span>。", "<b>⇒ 这个检查方式的好处是它<b>在动手之前</b>就能做，而且只需要诚实：<b>假设一切顺利、实验全部成功，那时候的结论是什么？那个结论重要吗？</b></b> <span class='w'>⇒ 如果「一切顺利」的结局是「某个指标涨了 1%」，那不管过程多漂亮，<b>上限就是 1%</b>。</span>", "<b><b>Step 2 是一条看起来软、其实很实用的检查：<b><em>Are you excited about it?</em></b></b></b> <span class='k'>理由幻灯写了：<b><em>Research is a ton of work. You will be far more successful if you are excited.</em></b>；讲稿还补了一句「this is actually probably true for <b>a lot of things outside of research too</b>」</span>。", "<b>⇒ 它为什么是<b>判据</b>而不只是鼓励？因为它和第一条现实（不到 1%）是配套的：<b>既然多数想法会失败，那你需要的是能撑过失败的动力</b>。</b> <span class='w'>⇒ 讲稿的链条很清楚：「if it's fun… <b>you're more likely to work hard on it. And if you're working hard on it, you're much more likely to be successful</b>」。</span>", "⚠️ <b><b>Step 3 是三步里最硬的一条，而且它的措辞要逐字读：<b><em>If you are <b>brutally honest</b> about why it could fail to solve the problem, does the idea <b>still</b> have high chance of working?</em></b></b></b> <span class='k'>⇒ 注意它不是问「这个想法有多大机会成」，而是问「<b>把所有你能想到的失败理由摆上桌之后</b>，它还有多大机会成」。</span>", "<b>⇒ 幻灯的结论很干脆：<b><em>If not, it probably won't work.</em></b> 而讲稿给的理由又回到那个 1%：<b>「that's mostly just because of the reality of most ideas not actually working in research」</b>。</b> <span class='w'>⇒ 换句话说：<b>基础概率已经很低了，所以你不该在还有已知的大风险时就乐观</b>。</span>", "⚠️ <b>p37 的 <b>问题驱动 vs 想法驱动</b> 是这几页最值得反复想的一页，而讲者明确说了自己偏向哪一边。</b> <span class='k'><b>从想法出发</b>：你手上有个漂亮的想法，然后<b>去找一个它能解的问题</b>。⇒ 风险是 <b><em>There may not exist an important problem that the idea solves!</em></b></span>", "<b>⇒ 而讲者补的那层更尖，也更容易被忽略：<b>就算它确实解了某个问题，也可能<b>存在更好的解法</b> —— 那这个想法就没多少影响力</b>。</b> <span class='w'>原话：「It may solve a problem. <b>But there might be a better way to solve the problem. And if there's a better way to solve the problem, then that idea may not have a lot of impact</b>」</span>。", "<b>⇒ <b>从问题出发</b>：你认定一个问题，然后<b>去找最好的解法</b>。坏处幻灯也写了：<b><em>May be harder to write paper if solution is obvious in retrospect</em></b>。</b> <span class='k'>⇒ 但好处是一句带笑脸的话：<b><em>But guaranteed to be working on an important problem :)</em></b></span>", "⚠️ <b>⇒ 而把两者的差别讲得最透的是那组<b>目标</b>的对比：<b>想法驱动的目标是 <em>get the idea to work</em>（让这个想法成），问题驱动的目标是 <em>solve the problem</em>（把问题解掉）</b>。</b>", "<b>⇒ 为什么后者「舒服得多」？讲者的理由是一句很妙的话：<b>「it's possible that the idea <b>just doesn't want to work</b>」</b>。</b> <span class='w'>⇒ 如果你的目标是「让这个想法成」，而这个想法<b>本质上就不想成</b>，那你就被困住了——因为放弃想法等于项目失败。<b>⇒ 而如果目标是「解掉问题」，换一个想法只是换一条路，<b>项目还活着</b>。</b></span>", "<b>⇒ 讲稿还说她两种都做过（「I've done research that's more idea-driven. I've also done research that's more problem driven」），只是<b>自己更偏向问题驱动</b>。</b> <span class='k'>⇒ 这个诚实的措辞也值得学：<b>她给的是一个有理由的偏好，而不是一条规矩</b>。</span>"], "eq": "核心主张：**Need two things: (1) an important problem\n   (2) a plan for how to approach it**\n   只有一个的话，**通常不构成一个好方向**\n\n两个反例（一个缺这个、一个缺那个）：\n   **Solve climate change** ← **I'm missing (2)**\n     非常重要，但我没有路子\n     ⇒ 特征是：你说出来所有人都点头，\n       但你明天不知道该写哪一行代码\n   **A really cool algorithm that will make the robot 1% more successful**\n     ← **I'm missing (1)**\n     有路子（甚至有两条），但缺一个它真正在解的重要问题\n     ⚠ 幻灯刻意写了 **1%**：不是说这算法没用，\n       而是说**它的天花板太低**\n\n⚠ **Step 1: What will the outcome look like if you are very successful?**\n   讲稿更锋利的问法：\n     「**what is the upper bound of that project? And if the upper bound is\n       not very high, then usually it doesn't make for a very good project**」\n   ⇒ 好处是**在动手之前**就能做，而且只需要诚实：\n     **假设一切顺利、实验全部成功，那时候的结论是什么？那个结论重要吗？**\n   ⇒ 如果「一切顺利」的结局是「某指标涨了 1%」，\n     那不管过程多漂亮，**上限就是 1%**\n\n**Step 2: Are you excited about it?**（看起来软、其实很实用）\n   **Research is a ton of work. You will be far more successful\n     if you are excited.**\n   为什么是**判据**而不只是鼓励？与第一条现实（不到 1%）配套：\n     **既然多数想法会失败，那你需要的是能撑过失败的动力**\n   「if it's fun… **you're more likely to work hard on it. And if you're\n     working hard on it, you're much more likely to be successful**」\n\n⚠ **Step 3**（最硬的一条，措辞要逐字读）：\n   **If you are brutally honest about why it could fail to solve the problem,\n     does the idea still have high chance of working?**\n   ⇒ 不是问「这想法有多大机会成」，\n     而是「**把所有你能想到的失败理由摆上桌之后**，它还有多大机会成」\n   结论：**If not, it probably won't work.**\n   理由又回到那个 1%：「the reality of **most ideas not actually working**」\n   ⇒ **基础概率已经很低，所以你不该在还有已知的大风险时就乐观**\n\n⚠⚠ p37 **问题驱动 vs 想法驱动**（最值得反复想的一页）\n\n**从想法出发**：手上有个漂亮想法 → **去找一个它能解的问题**\n   风险：**There may not exist an important problem that the idea solves!**\n   更尖、更易被忽略的一层：\n     「It may solve a problem. **But there might be a better way to solve\n       the problem. And if there's a better way, then that idea may not\n       have a lot of impact**」\n   目标：**get the idea to work**\n\n**从问题出发**：认定一个问题 → **去找最好的解法**\n   坏处：**May be harder to write paper if solution is obvious in retrospect**\n   好处（带笑脸）：**But guaranteed to be working on an important problem :)**\n   目标：**solve the problem**\n\n⚠ 两者差别最透的地方就是这组**目标**对比，而后者「舒服得多」的理由：\n   「it's possible that the idea **just doesn't want to work**」\n   ⇒ 目标是「让这个想法成」而想法本质上不想成 ⇒ **你被困住了**\n     （放弃想法等于项目失败）\n   ⇒ 目标是「解掉问题」⇒ 换想法只是换一条路，**项目还活着**\n\n讲稿：两种她都做过，只是**自己更偏向问题驱动**\n   ⇒ 措辞值得学：**她给的是一个有理由的偏好，而不是一条规矩**", "tbl": {"head": ["", "想法驱动", "问题驱动"], "rows": [["<b>起点</b>", "<b>一个漂亮的想法</b>", "<b>一个重要的问题</b>"], ["<b>然后去找</b>", "<b>它能解的问题</b>", "<b>最好的解法</b>"], ["<b>目标</b>", "<b>get the idea to work</b>", "<b>solve the problem</b>"], ["<b>风险</b>", "<span class='w'>⚠ 可能不存在它能解的重要问题；或者存在更好的解法</span>", "<b>解法事后看显然，论文难写</b>"], ["<b>想法不成时</b>", "<span class='w'>⚠ 项目卡住（放弃想法=失败）</span>", "<b>换条路，项目还活着</b>"], ["<b>讲者的倾向</b>", "<b>两种都做过</b>", "<b>自己更偏这边</b>"]]}, "say": "原话（两个反例，以及「上限」这个检查）：<em>“maybe one project idea is <b>I want to solve climate change</b>. That is an important problem. <b>But I don't have a plan for how to approach it.</b> So it doesn't make a good research project even though it's a really important problem. Second, maybe I have a really cool algorithm that <b>at best will make a robot or a reinforcement learning system a little bit more successful</b>. This is maybe a really cool idea. And maybe I have a plan. Maybe I have two. <b>But I'm missing the important problem that this is actually solving.</b> And so… it's really important to think about, <b>if the project is really, really successful, what will the outcome look like? Does it solve an important problem? Or what is the upper bound of that project? And if the upper bound is not very high, then usually it doesn't make for a very good project.</b>”</em><br><br>原话（Step 3：把失败理由摆上桌之后还剩多少机会）：<em>“a lot of ideas don't work. And so it's really good to think about, <b>if you are brutally honest about why your idea could fail to solve the problem, does the idea still have a good chance of working? And if not, then probably it won't work.</b> And that's mostly just because of <b>the reality of most ideas not actually working in research</b>. And it's important to <b>be honest with yourself</b> about whether this will actually solve the problem or not.”</em><br><br>原话（为什么偏向问题驱动 —— 因为想法可能「不想成」）：<em>“if you start with an idea, you need to find a problem that that idea solves. And <b>there may not exist an important problem that the idea solves</b>. It may solve a problem. <b>But there might be a better way to solve the problem. And if there's a better way to solve the problem, then that idea may not have a lot of impact.</b> On the contrary, <b>if you start with a problem, then you're trying to find the best solution to that problem.</b> And one downside is <b>it may be harder to write a paper if the solution ends up being kind of obvious in retrospect. But at least you're guaranteed to be working on an important problem.</b>… Another way to put this is that with idea-driven research, <b>your goal is to get the idea to work</b>. Whereas in the second case, <b>your goal is to solve the problem</b>. And the second camp seems like <b>a much more comfortable place to be because it's possible that the idea just doesn't want to work</b>.”</em>", "res": {"tag": "推断", "v": "<b>这几页值得你当场拿自己的课题过一遍，而<b>三步里你有两步很稳、一步需要补</b>。</b><br><b><b>(1) 重要的问题</b> ✓ 有，而且 .b 那片已经给你找到了最好的措辞：<b>p27 点名的「做出能排除坏模型的离线指标」</b>。</b> <span class='k'>再加上 agentic 工作流的推理成本是一个<b>正在变贵</b>的真问题。⇒ 这一条不用再论证。</span><br><b><b>(2) 接近它的路子</b> ✓ 有：<b>两阶段训练（特权信息教、可观测特征用）＋ 分布无关的排除保证</b>。</b> <span class='w'>⇒ 这也不是空的，因为 L17 那套 RMA 架构给了你一个<b>已经在三个领域跑通过</b>的模板。</span><br>⚠️ <b><b>Step 1（上限检查）</b>—— <b>这一步你需要当场算一个数，而且它可能不好看。</b></b><br><span class='k'>问法是：<b>假设一切顺利，结论会是什么？</b>⇒ 对你就是：<b>节点级档位分配，最好能把成本降到全用大模型的百分之几、而 Acc 掉多少？</b></span><br><b>⇒ 这个数你<b>现在就能估</b>，而且不用跑实验：<b>取你的工作流，手工标出「哪些节点换小模型肯定没事」，算一下那样的成本占比</b>。</b><span class='w'>⚠ 如果答案是「最多省 15%」，那按这一页的标准，<b>你的上限就是 15%，而那可能不足以支撑一篇论文</b>。⇒ 而如果答案是「某些工作流上能省 60%」，那上限就很健康。<b>⇒ 无论哪种，先把这个数算出来 —— 它决定了你该不该继续，而成本是一个下午。</b></span><br><b>⇒ 而 <b>1% 那个反例</b>对你是一个具体的警示：<b>如果你的结果最后是「G 提升了 1.2 个点」，那你就正好落在幻灯画的那个反例上</b>。</b> <span class='k'>⇒ 所以你的主结果应当是一个<b>量级</b>上的东西（成本减半而 Acc 基本不掉），而不是一个小数点。<b>⇒ 这也反过来提示你该选哪些工作流做实验：选那些「大模型用得最浪费」的，而不是选最常见的。</b></span><br>⚠️ <b><b>Step 3（残酷诚实）</b>—— 把你能想到的失败理由摆上桌，而我替你摆三条最该摆的：</b><br><span class='w'>① <b>节点级可能并不比工作流级好多少</b>（L17 p29 那个消融要查的就是这个）；② <b>第一个节点没有历史可看</b>，而工作流只有 3–8 个节点（L17.d p68 那条冷启动）；③ <b>搜索成本可能超过节省</b>（见 L16 那条摊销曲线）。</span><br><b>⇒ 把这三条摆上桌之后，这个想法还成不成？<b>我的判断是：成，但前提是 ① 的答案是正面的</b>。</b><span class='k'>⇒ 而这就把 Step 3 和 p42 接上了：<b>① 是你的核心未知数，所以它必须是第一个实验</b>。</span><br><b>⇒ 最后，<b>p37 那个对比给了你一个关于<b>怎么写</b>的判断</b>：<b>你是问题驱动的，所以你会吃到那个已知的坏处 ——「解法事后看显然，论文难写」</b>。</b> <span class='w'>⇒ 这不是假设：<b>「贵的节点用大模型、便宜的用小模型」事后看非常显然</b>。⇒ 应对办法不是把方法写复杂，而是<b>把「显然」的那部分做成基线，然后证明它不够</b>：手工规则 / 全大 / 全小 / 按节点类型的固定映射，各是一条基线。<b>⇒ 如果你的学出来的策略明显赢过这些「显然」的做法，那「显然」就成了你的论据而不是你的问题。</b></span>", "ref": "本讲 p34–p37（逐字核对）· 讲稿（上限那句、Step 3、想法「不想成」）· p42 · L17 p29 · L17.d p68 科研格 · L16 摊销曲线 · 简报 §1 §2 §3（已核）"}},
{"r": [38, 40], "t": "先找瓶颈，而且别把自己框在一个领域里", "star": 3, "quote": "<b>What to work on — Bottlenecks</b><br><em>A couple more things. &nbsp;·&nbsp; Year 2 of my PhD: internship<br>Build predictive model and use it to learn skills across many robots<br><b>Problem: I discovered that existing video generation models were really bad</b> — ground truth / generation<br><b>I am a ML+robotics person, not a computer vision person.</b><br><b>Decided to work on first developing a better video generation model!</b><br>→ resulting paper was basis for work in my job talk, <b>has 1300 citations</b>, and informed the community that it's an interesting problem to study<br><b>Takeaway: Don't box yourself into one area.</b><br><b>Don't be a perfectionist.</b> · <b>You can never know a research project's impact at the outset.</b> · <b>Crossing topic boundaries informs new problems and brings new ideas</b></em>", "one": "<b>两条：一是动手前先问「这个问题到底卡在哪」——卡在数据上就别去调算法；二是那个故事：她为了用上视频生成模型，先去把视频生成模型做好了，而她本来不做视觉。</b>", "pts": ["⚠️ <b><b>瓶颈</b>这一条虽然幻灯上只有一个词，但讲稿把它讲成了选题里最实用的一招：<b>如果问题卡在数据上，而你去研究算法，那你多半看不到性能提升</b>。</b> <span class='k'>原话：「if the problem is <b>bottlenecked on data</b>, for example, and you start exploring new algorithms separate from the data… <b>you actually probably won't see performance gains</b>… maybe you'll see a couple percentage points because <b>really, the big performance gains are going to be on the data side</b>」</span>。", "<b>⇒ 这一条和 Step 1（上限检查）其实是同一件事的两种问法：<b>「上限有多高」问的是终点，「瓶颈在哪」问的是<b>为什么现在到不了终点</b></b>。</b> <span class='w'>⇒ 而后者更可操作，因为它直接告诉你该动哪里。<b>⇒ 讲者的总结：「a lot of problem-driven research ends up thinking about <b>what is the bottleneck for solving this problem</b>」。</b></span>", "<b>⇒ 而这一招还能用在<b>很长远</b>的目标上，这是讲稿里最漂亮的一段用法。</b> <span class='k'>她举的两个例子都大得不像研究项目：<b>让 LLM 证明人类没证过的东西（比如 P vs NP）</b>、<b>让机器人在一个陌生厨房里做一碗麦片</b></span>。", "<b>⇒ 用法是：<b>这些单个项目都解不了，但你可以问「到那里的瓶颈是什么」，然后在下一个项目里做那一段</b>。</b> <span class='w'>原话：「you can think about, OK, <b>what's the bottleneck for getting there? And can I work on the part of that problem in my next project that will make progress on that larger goal?</b>」</span><b>⇒ 这就把「宏大目标」从空话变成了一个可执行的分解方式 —— <b>它不是让你放弃宏大目标，而是让你用它来挑下一步</b>。</b>", "⚠️ <b><b>p39 那个故事</b>是整讲最具体的一个，而且它的每一步都值得记。</b> <span class='k'>博士第二年在 Google 实习，那里有一堆机器人，她想用它们做点酷的。<b>计划</b>：建一个预测模型（视频生成模型），用它跨机器人学技能</span>。", "<b>⇒ 然后撞上了问题，而幻灯写得很平静：<b><em>Problem: I discovered that existing video generation models were really bad</em></b>。</b> <span class='w'>有多差？讲稿描述了那张对比图：当时<b>最好</b>的视频生成模型「<b>is erasing all the objects in the video and is barely capturing the motion of the arm. Doesn't even capture the background correctly</b>」</span>。<b>⇒ 于是她的原计划<b>做不下去了</b>。</b>", "⚠️ <b>⇒ 这里是分叉点，而幻灯把她当时的自我认知写了出来：<b><em>I am a ML+robotics person, not a computer vision person.</em></b></b> <span class='k'>讲稿补了那个本来很自然的选择：「If I kind of felt like I should only work on machine learning and robotics, <b>I might have to table this and figure out a different project</b>」</span>。", "<b>⇒ 但她的决定是：<b><em>Decided to work on first developing a better video generation model!</em></b></b> <span class='w'>⚠ 而讲稿里那段自我评估很诚实，也很重要：「arguably, <b>I wasn't necessarily the best person to do this. I had never built a generative model before. I didn't really know that much about architectures</b> for doing so」</span>。", "<b>⇒ 那她凭什么能做成？理由只有一条，而且是<b>结构性</b>的：<b>「not a lot of people were working on it at the time <b>because they didn't realize how bad these models were</b>」</b>。</b> <span class='k'>⇒ 这一句是整个故事的机制：<b>她之所以有机会，正是因为她从另一个方向走过来、因而看到了别人看不到的问题</b>。⇒ 做视觉的人不知道这些模型在机器人上有多不够用，因为他们不拿它做控制。</span>", "<b>⇒ 结果：<b>那篇论文成了她 job talk 的基础、约 <b>1300 次引用</b>，而且让社群意识到这是一个值得研究的问题</b>（后来别人做出了比她那个好得多的模型）。</b> <span class='w'>⇒ 注意最后那半句也被幻灯写进去了：<b>「informed the community that it's an interesting problem to study」</b>——<b>把一个问题标记出来，本身是一种贡献</b>。</span>", "<b>⇒ <b><em>Takeaway: Don't box yourself into one area.</em></b> 而 p40 给了理由：<b><em>Crossing topic boundaries informs new problems and brings new ideas</em></b>。</b> <span class='k'>讲稿把这个双向性说清楚了：<b>你想用某个东西而它不好用 ⇒ 这件事本身就说明那个领域有个问题，而那个领域的人常常不知道</b>；同时<b>你也把新想法带进了那个领域</b>。</span>", "<b>p40 第二条是 <b><em>Don't be a perfectionist.</em></b>，理由是一句很干脆的话：<b><em>You can never know a research project's impact at the outset.</em></b></b> <span class='w'>讲稿加了半句把它变成了逻辑而不是鼓励：<b>「Otherwise, it wouldn't be research」</b></span>。<b>⇒ 所以结论是：<b>「挑一个完美的项目」这件事在定义上就做不到，于是你得在某个点上直接开始试</b>。</b>", "<b>⚠ 把这三页并起来，它们其实在反对同一种行为：<b>在动手之前过度优化选择</b>。</b> <span class='k'>⇒ 瓶颈那条说「别在错的地方使劲」，故事那条说「别因为领域标签就放弃一条路」，完美主义那条说「别为了选对而迟迟不开始」。<b>⇒ 三条合起来的姿态是：<b>想清楚该往哪使劲，然后尽快开始，并且不介意绕路</b>。</b></span>"], "eq": "⚠ **瓶颈**（幻灯只一个词，讲稿讲成了选题里最实用的一招）：\n   **如果问题卡在数据上，而你去研究算法，那你多半看不到性能提升**\n   「if the problem is **bottlenecked on data**… **you actually probably\n     won't see performance gains**… maybe a couple percentage points\n     because **the big performance gains are going to be on the data side**」\n\n   ⇒ 与 Step 1（上限检查）是同一件事的两种问法：\n     **「上限有多高」问终点，「瓶颈在哪」问为什么现在到不了终点**\n   ⇒ 后者更可操作 —— 它直接告诉你该动哪里\n   「a lot of problem-driven research ends up thinking about\n     **what is the bottleneck for solving this problem**」\n\n   ⇒ 这招还能用在**很长远**的目标上（讲稿里最漂亮的一段用法）：\n     例子大得不像研究项目 —— **让 LLM 证明人类没证过的东西（P vs NP）**\n       · **让机器人在陌生厨房里做一碗麦片**\n     用法：**单个项目都解不了，但可以问「到那里的瓶颈是什么」，\n       然后在下一个项目里做那一段**\n     「**what's the bottleneck for getting there? And can I work on the part\n       of that problem in my next project that will make progress on that\n       larger goal?**」\n     ⇒ 把「宏大目标」从空话变成可执行的分解方式\n       **不是让你放弃宏大目标，而是让你用它来挑下一步**\n\n⚠⚠ **p39 那个故事**（整讲最具体的一个，每步都值得记）\n\n   博士第二年在 Google 实习，那里有一堆机器人\n   **计划**：建一个预测模型（视频生成模型），用它跨机器人学技能\n\n   撞上问题（幻灯写得很平静）：\n     **Problem: I discovered that existing video generation models\n       were really bad**\n     有多差？当时**最好**的模型「**is erasing all the objects in the video and\n       is barely capturing the motion of the arm. Doesn't even capture\n       the background correctly**」\n   ⇒ 原计划**做不下去了**\n\n   ⚠ 分叉点 —— 幻灯把她当时的自我认知写了出来：\n     **I am a ML+robotics person, not a computer vision person.**\n     那个本来很自然的选择：「If I felt like I should only work on ML and\n       robotics, **I might have to table this and figure out a different\n       project**」\n\n   她的决定：**Decided to work on first developing a better\n     video generation model!**\n   ⚠ 而那段自我评估很诚实：「arguably, **I wasn't necessarily the best person\n     to do this. I had never built a generative model before. I didn't\n     really know that much about architectures** for doing so」\n\n   凭什么能做成？理由只有一条，而且是**结构性**的：\n     「not a lot of people were working on it at the time\n       **because they didn't realize how bad these models were**」\n   ⇒ 整个故事的机制：**她之所以有机会，正是因为她从另一个方向走过来、\n     因而看到了别人看不到的问题**\n     做视觉的人不知道这些模型在机器人上多不够用 —— 他们不拿它做控制\n\n   结果：**job talk 的基础 · 约 1300 次引用 ·\n     让社群意识到这是一个值得研究的问题**\n   ⇒ 注意最后半句也被写进幻灯：\n     **「informed the community that it's an interesting problem to study」**\n     —— **把一个问题标记出来，本身是一种贡献**\n\n**Takeaway: Don't box yourself into one area.**\n   p40 的理由：**Crossing topic boundaries informs new problems\n     and brings new ideas**\n   双向性：**你想用某个东西而它不好用 ⇒ 那个领域有个问题，\n     而那个领域的人常常不知道**；同时**你把新想法带进了那个领域**\n\np40 第二条：**Don't be a perfectionist.**\n   理由：**You can never know a research project's impact at the outset.**\n   讲稿加的半句把它变成逻辑而不是鼓励：**「Otherwise, it wouldn't be research」**\n   ⇒ 「挑一个完美的项目」在定义上就做不到 ⇒ 你得在某个点上直接开始试\n\n⚠ 三页并起来，它们在反对同一种行为：**在动手之前过度优化选择**\n   瓶颈：**别在错的地方使劲**\n   故事：**别因为领域标签就放弃一条路**\n   完美主义：**别为了选对而迟迟不开始**\n   ⇒ 合起来的姿态：**想清楚该往哪使劲，然后尽快开始，并且不介意绕路**", "tbl": {"head": ["那个故事的五步", "发生了什么"], "rows": [["<b>① 计划</b>", "<b>用视频生成模型跨机器人学技能</b>"], ["<b>② 撞墙</b>", "<span class='w'>⚠ 当时最好的模型把物体全擦掉、几乎没抓住手臂运动、连背景都不对</span>"], ["<b>③ 分叉点</b>", "<b>「我是做 ML+机器人的，不是做视觉的」—— 本来该换项目</b>"], ["<b>④ 决定</b>", "<b>先去把视频生成模型做好（承认自己不是最合适的人）</b>"], ["<b>⑤ 为什么有机会</b>", "<b>当时没多少人做，因为大家没意识到这些模型有多差</b>"], ["<b>结果</b>", "<b>job talk 的基础 · 约 1300 引用 · 把这个问题标记给了社群</b>"]]}, "say": "原话（瓶颈：卡在数据上就别去调算法；以及怎么用它分解宏大目标）：<em>“if you're thinking about a problem that you want to solve, it's really important to <b>get to the bottleneck of that problem</b>. So <b>if the problem is bottlenecked on data, for example, and you start exploring new algorithms separate from the data for how to solve it, then you actually probably won't see performance gains</b> from working on methods if it's bottlenecked by data. And most, maybe you'll see a couple percentage points because <b>really, the big performance gains are going to be on the data side</b>… You can think about, <b>I want to develop an LLM that can prove something that humans have never proved before, like P versus NP</b> or something. Or <b>I want to get a robot that can make a bowl of cereal in a new kitchen</b>. Those are things that you can't solve in any individual research project. But you can think about, OK, <b>what's the bottleneck for getting there? And can I work on the part of that problem in my next project that will make progress on that larger goal?</b>”</em><br><br>原话（那个故事，以及她为什么有机会）：<em>“I discovered that <b>video generation models were really bad</b>. So here was a video that I collected on the robot. And here was a prediction from <b>arguably the state of the art</b> video generation model. And you can see that <b>it is erasing all the objects in the video and is barely capturing the motion of the arm. Doesn't even capture the background correctly.</b>… Now, at the time, I kind of viewed myself as a <b>machine learning and robotics person and not really a computer vision person</b>… If I kind of felt like I should only work on machine learning and robotics, <b>I might have to table this and figure out a different project to work on. But instead, I decided to work on trying to develop a better video generation model.</b> Now, arguably, <b>I wasn't necessarily the best person to do this. I had never built a generative model before. I didn't really know that much about architectures for doing so. But not a lot of people were working on it at the time because they didn't realize how bad these models were.</b> And then the resulting paper ended up being the basis for work in my job talk, <b>now has around 1,300 citations</b>. And it arguably <b>informed the community that it's kind of an interesting problem to study</b>.”</em><br><br>原话（别做完美主义者 —— 因为那在定义上做不到）：<em>“I've seen people feel like they want to <b>pick the perfect project</b> to work on. But <b>you never know what the impact of a project will be at the outset. Otherwise, it wouldn't be research.</b> And so at some point, <b>you need to just start trying different ideas, start getting going on a project without trying to find the perfect project</b>.”</em>", "res": {"tag": "推断", "v": "⚠️ <b>「<b>先找瓶颈</b>」这一条，是这几页对你<b>最该当场执行</b>的一件事，因为你的课题有一个很可能被忽略的瓶颈。</b><br><span class='k'>讲者的判据是：<b>如果问题卡在 X 上，而你在研究 Y，那你多半只能看到几个百分点</b>。⇒ 那么你的问题到底卡在哪？</span><br><b>⇒ 至少有三个候选，而它们指向完全不同的工作：<b>① 卡在「不知道哪个节点该降档」（＝一个预测问题，你现在做的就是这个）；② 卡在「搜索太贵」（＝一个计算问题，对应 L17.c p45 那条「把真跑挪出内循环」）；③ 卡在「小模型就是不行」（＝一个能力问题，那么任何路由都救不了）</b>。</b><br><b>⇒ 而 ③ 是最该先排除的，因为<b>如果它成立，①②都白做</b>。</b> <span class='w'>⇒ 怎么排除？一个下午的实验：<b>在你的工作流上，逐节点地把那一个节点换成小模型、其余全用大模型，量每个节点单独降档的 Acc 损失</b>。⇒ 如果所有节点单独降档都掉很多，那小模型在这个工作流上就是不够用，<b>瓶颈是能力，不是路由</b>。⇒ 如果有一批节点单独降档几乎不掉，那<b>路由就确实有空间，而且你顺手得到了空间的上界</b>。</span><br><b>⇒ 注意这个实验同时回答了 Step 1 的「上限」问题（见 p34 的科研格）—— <b>两件事一个实验就办了，而这正是 p42「用最快的方式测未知数」的意思</b>。</b><br>⚠️ <b>而 p39 那个故事对你有一条<b>不太好听但很值得想</b>的提醒：<b>你的瓶颈可能不在你擅长的那一侧</b>。</b><br><span class='k'>讲者本来是 ML+机器人的人，结果发现卡在视频生成上 —— 一个她不擅长、而且自认不是最合适的人去做的方向。而她的选择是<b>去做那个</b></span>。<br><b>⇒ 对你，这个对应可能是：<b>你的验收标准里有「写 bound」，那是理论那一侧；而你的瓶颈可能在工程那一侧（搜索成本、评测管线），或者反过来</b>。</b><span class='w'>⇒ 诚实地判断一下：<b>如果你把界写得很漂亮，但实验只能在一个工作流上跑，那篇论文站得住吗？反过来呢？</b>⇒ 这一页的建议是<b>按瓶颈分配时间，而不是按擅长分配时间</b>。</span><br><b>⇒ 而那个故事的机制部分（<b>她之所以有机会，是因为从另一个方向走过来、看到了别人看不到的问题</b>）对你其实是<b>有利</b>的消息。</b> <span class='k'>⇒ 你在做的是 **把 bandit／统计那边的工具（分布无关的保证、实验设计）搬到 agentic LLM 工作流上**。⇒ 这正是一次跨界：<b>做 agent 的人多半不知道有这些工具，做理论的人多半不知道这个问题</b>。⇒ 而按这一页，这种位置恰恰是机会最大的位置 —— <b>而且它也解释了为什么你能在一个「有人在附近」的方向上仍然有空间</b>。</span><br><b>⚠ 最后那句「<b>把一个问题标记给社群，本身是一种贡献</b>」给了你一个降低压力的选项：<b>即使你的方法只是部分成功，把「节点级保真度分配」这个问题讲清楚、给出基线和难点，本身就有价值</b>。</b> <span class='w'>⇒ 这不是退而求其次 —— 讲者那篇 1300 引用的论文，她自己说后来别人做出了比她好得多的模型。<b>⇒ 她的贡献有一半在于「指出这里有个问题」。</b></span>", "ref": "本讲 p38–p40（逐字核对）· 讲稿（瓶颈那段、P vs NP／麦片、1300 引用那个故事）· p34 科研格 · p42 · L17.c p45 科研格 · 简报 §1 §3 §4d（已核）"}},
{"r": [41, 44], "t": "怎么处理风险：把它前置、从能跑的东西出发、以及什么时候转向", "star": 3, "quote": "<b>Key consideration: handling risk</b><br><em><b>1. Front-load the risk whenever possible</b> — a. Before developing large-scale infrastructure, formulate and run <b>didactic experiments that test core unknowns</b><br><b>2. Design targeted experiments that test unknowns in fastest possible way</b><br><b>3. Try out lots of ideas, including different problems — “create luck”</b><br><b>4. Don't mentally commit to project before signs of life on core unknown</b><br>Lots of tricks, not all of them apply to all scenarios · <b>This is uncomfortable!!</b> · Recall: Less than 1% of research ideas have lasting impact.</em><br><b>Getting things to work</b><br><em><b>1. Start from something that works and then make it incrementally harder</b> · <b>2. Simplify</b> · <b>3. Talk to friends, colleagues, advisers</b> · <b>4. Revisit your assumptions</b> - some of the things you thought to be true at the beginning of the project may be refuted by your experiments · <b>5. Does it “want” to work?</b> — a. If not at all, then likely won't be impactful · b. <b>Can you reduce the project scope to the parts that “want” to work?</b></em><br><b>Deciding when to pivot</b><br><em>Often considered <b>later</b> than it should be considered! · <b>“sunk cost fallacy”</b><br>“continue working on current project” vs. “switch to starting a new project” — <b>This is a super nebulous thing!</b><br><b>Advice: spend time thinking about other research projects!</b><br>“continue working on current project” vs. “work on project B” vs. “work on project C” vs. … — <b>This decision is a lot more straightforward, less anxiety inducing! 🥳</b></em>", "one": "<b>三页技巧，但它们服务同一个数字：不到 1% 的想法有持久影响。所以别先搭基础设施——那是容易的部分，也是看起来在进步的部分；先用最快的办法去测那个核心未知数。</b>", "pts": ["⚠️ <b>先把 p42 第 1 条读准，因为它反对的恰恰是最舒服的工作方式：<b><em>Front-load the risk whenever possible</em></b> —— <b>Before developing large-scale infrastructure, formulate and run <b>didactic experiments</b> that test core unknowns</b>。</b> <span class='k'><b>didactic experiment</b> 就是「教学玩具式的实验」：小、快、只为回答一个问题</span>。", "<b>⇒ 而讲稿解释了<b>为什么人们不这么做</b>，这一段是整页最诚实的地方：<b>搭基础设施、把算法写出来，常常是<b>容易的部分</b>，也是<b>看起来在进步</b>的那部分</b>。</b> <span class='w'>原话：「oftentimes, building the infrastructure, coding the algorithm, whatever, <b>that's like the easy part. That's the part where you can seemingly make some progress</b>」</span>。", "<b>⇒ 后果说得很直接：「if you do all that and then, at the end, realize that the core unknown actually ended up not working out, then <b>you wasted all of that time—— even though it seemingly seemed like progress</b>」。</b> <span class='k'>⇒ 所以幻灯那句 <b><em>This is uncomfortable!!</em></b> 不是在说实验难做，<b>而是在说「先去面对那个可能毁掉整个项目的问题」这件事本身让人不舒服</b>。</span>", "<b>第 2 条是第 1 条的技能版：<b><em>Design targeted experiments that test unknowns in fastest possible way</em></b>。</b> <span class='w'>讲稿强调这是一项<b>需要功夫</b>的能力：「thinking through how to test ideas in the simplest possible way or the fastest possible way <b>takes some skill and takes some thinking. It's often not obvious how to test a particular hypothesis</b>」</span>。", "⚠️ <b>⇒ 而讲稿给了<b>两个具体例子</b>，这两个例子是这几页最值得照抄的东西（幻灯上没有）。</b> <span class='k'><b>例一 · 元学习</b>：目标是让机器人用很少的数据快速适应新任务。但在真机上搭一套元学习系统工作量巨大。⇒ 于是她<b>把任务换成「回归一维正弦曲线」</b>，只测「<b>能不能用五个数据点学会拟合</b>」——「it was this experiment that I <b>coded up in a day</b>」，结果不错，<b>才接着做</b></span>。", "<b>⇒ <b>例二 · 语言指令</b>（近期）：目标是让机器人听不同<b>策略</b>的语言指令。两个风险是「拿到好的策略标签」和「让机器人真的注意到不同策略」，而<b>后者是更大的那个</b>。</b> <span class='w'>⇒ 她的做法：找一个数据集，<b>有些数据机器人用右手、有些用左手</b>，训个策略只看它能不能做到这件极简的事。⚠ 而最妙的一笔是：<b>左右手可以从数据里自动判定，不用标注</b> —— 这样就<b>把第二个风险（标签）也绕开了</b>，只留下她要测的那一个</span>。", "<b>⇒ 两个例子的共同形状值得抽出来：<b>把真实任务换成一个保留了核心未知数、但去掉了全部工程量的玩具任务</b>。</b> <span class='k'>⇒ 正弦曲线保留了「少样本快速适应」，去掉了机器人；左右手保留了「策略能不能被语言区分」，去掉了标注和复杂指令。</span>", "<b>第 3 条换了一个维度：<b><em>Try out lots of ideas, including different problems — \"create luck\"</em></b>。</b> <span class='w'>讲稿的逻辑很清楚：「<b>you have to get lucky to stumble upon a good idea. But you can create luck for yourself just by trying out lots of ideas</b>」</span>。<b>⇒ 注意 <b>including different problems</b> 这半句 —— <b>不只是换想法，还可以换问题</b>，因为「even at the outset, you don't know how hard a problem is going to be」。</b>", "<b>⇒ 而她自己的经验写得很实在，包括没做到的时候：<b>「there was kind of lots of times in my PhD where I tried out lots of ideas that didn't make it into papers. They failed… <b>I didn't always do this. Sometimes, I ended up banging my head against the wall plenty of times</b>」</b>。</b>", "<b>第 4 条是前三条的收口：<b><em>Don't mentally commit to project before signs of life on core unknown</em></b>。</b> <span class='k'>⇒ 关键词是 <b>mentally</b>（心理上）和 <b>signs of life</b>（有活的迹象）。⇒ 也就是说：<b>在那个核心未知数给出正面信号之前，别让自己在心理上认定「这就是我的项目」</b>——因为那之后你就很难放手了。</span>", "⚠️ <b><b>p43 换到「已经动手了、但跑不通」这个场景</b>，而第 1/2 条是其中最有用的：<b><em>Start from something that works and then make it incrementally harder</em></b> ＋ <b><em>Simplify</em></b>。</b> <span class='w'>讲稿的理由：「if you coded up a system and it's not working, <b>there's a million reasons that could be why</b>… it's much easier to <b>start with something that works and then make it harder</b> than to start with something that doesn't work and try to get it to work」</span>。", "<b>⇒ 而配的那个故事很能说明问题，而且有一个很关键的转折。</b> <span class='k'>目标是让机器人<b>看人做一遍再自己做</b>。他们采了很多样的机器人示范，再请人照着做一遍，<b>而且告诉采数据的人「随便做、多做些」</b>。结果 <b>nothing worked</b>，<b>花了几个月</b></span>。", "⚠️ <b>⇒ 转折在这里：他们简化到<b>单任务</b>去验证模仿学习这一套对不对 —— <b>结果连单任务也不行</b>。</b> <span class='w'>原话：「we simplified to just a single task setting. Like, can we get the robot to do one task and make sure our imitation learning stack works? <b>It actually didn't work.</b> And so we had to debug that, get it to work on one task, then get it to work on <b>three</b> tasks, then get it to work on <b>10</b> tasks」</span>。", "<b>⇒ 这个转折是整个故事的要点：<b>他们花了几个月在一个多任务问题上，而真正的毛病在最基础的那一层</b>。</b> <span class='k'>⇒ 如果一开始就先跑通单任务，那几个月就省下来了。<b>⇒ 所以「简化」不只是调试手段，它是一个<b>定序</b>原则：先确认地基，再往上加。</b></span>", "<b>p43 第 4 条值得单独留意：<b><em>Revisit your assumptions - some of the things you thought to be true at the beginning of the project may be refuted by your experiments</em></b>。</b> <span class='w'>讲稿的追问很到位：「has anything changed about my assumptions from the beginning? And then if something has changed, <b>would that change the way that you're going about the project or even the project that you're working on</b>?」</span>", "⚠️ <b><b>第 5 条「<b>Does it \"want\" to work?</b>」是 p43 最特别的一条，而它有两级。</b></b> <span class='k'><b>a.</b> 如果<b>完全</b>不想成，那它很可能没什么影响力 ——「if someone else is trying to get it to work and <b>it also doesn't really work for them</b>, then maybe the idea just wasn't really meant to be」；<b>b.</b> 更可操作的那一级：<b>Can you reduce the project scope to the parts that \"want\" to work?</b></span>", "<b>⇒ 而 b 配的故事很具体，也很值得照抄。</b> <span class='w'>做让机器人听开放式语言指令（<b>Can you clean up the trash but not the dishes?</b>），<b>初步有苗头</b>；然后他们又加上「指令含糊时让机器人反问」等一堆想法 —— 结果 <b>things weren't really working</b>，<b>又花了几个月</b></span>。", "<b>⇒ 最后的做法是：<b>回头问「哪些部分是真的能跑的」，把不会跑的那些砍掉、只保留方法本来就能处理的交互，而砍掉的部分写成论文的 limitations</b>。</b> <span class='k'>原话：「we <b>rescoped</b> the project to remove the hard parts that we didn't know how to solve yet… We described it as <b>limitations</b> in the paper」。⇒ 讲者的总结：「<b>scoping down the project, especially if you scoped it up a little bit too eagerly</b>, can also be a useful strategy」。</span>", "⚠️ <b><b>p44 的转向</b>有一个很漂亮的心理学技巧，而它的价值在于把一个模糊的决策变成了具体的。</b> <span class='w'>先说问题：<b><em>Often considered later than it should be considered!</em></b> ＋ <b><em>\"sunk cost fallacy\"</em></b></span>。<b>⇒ 讲稿把沉没成本这条说得更准：<b>人很自然会想「我在这上面花了很多时间，所以以后花的时间会更少」—— 这是谬误，而且你实际的进展可能配不上你花掉的时间</b>。</b>", "<b>⇒ 而真正卡住人的是决策的<b>形式</b>：<b>「继续做当前项目」vs「换去开一个新项目」</b> —— 而后者 <b><em>is a super nebulous thing!</em></b></b> <span class='k'>⇒ 「换一个新项目」可以指任何东西，所以你是在拿一个具体的东西和一片虚无比较，<b>而那种比较没法做，只会让人焦虑</b>。</span>", "<b>⇒ 解法是<b>换一个问法</b>：<b><em>Advice: spend time thinking about other research projects!</em></b> 然后把决策改成 <b>「继续当前项目」vs「做项目 B」vs「做项目 C」vs …</b></b> <span class='w'>⇒ 幻灯的评价带了个笑脸：<b><em>This decision is a lot more straightforward, less anxiety inducing! 🥳</em></b></span>", "<b>⇒ 这一招的一般形式值得记住：<b>当一个决策难做，先检查是不是因为其中一个选项太模糊 —— 把它具体化，决策本身就变容易了</b>。</b> <span class='k'>⚠ 而它有一个前提条件，就是幻灯那句 <b>spend time thinking about other research projects</b>：<b>你必须平时就在想别的项目，否则到了要转向的时候，手上没有 B 和 C 可比</b>。⇒ 换句话说，这个技巧要<b>提前</b>付成本。</span>"], "eq": "⚠ p42 第 1 条（反对的恰恰是最舒服的工作方式）：\n   **Front-load the risk whenever possible**\n   **Before developing large-scale infrastructure, formulate and run\n     didactic experiments that test core unknowns**\n   **didactic experiment** = 教学玩具式的实验：小、快、只为回答一个问题\n\n   为什么人们不这么做（整页最诚实的地方）：\n     **搭基础设施、把算法写出来，常常是容易的部分，也是看起来在进步的部分**\n     「that's like **the easy part**. That's the part where you can\n       **seemingly make some progress**」\n   后果：「if you do all that and then realize the core unknown ended up not\n     working out, **you wasted all of that time —— even though it seemingly\n     seemed like progress**」\n   ⇒ 幻灯那句 **This is uncomfortable!!** 不是说实验难做\n     **而是说「先去面对那个可能毁掉整个项目的问题」本身让人不舒服**\n\n第 2 条（第 1 条的技能版）：\n   **Design targeted experiments that test unknowns in fastest possible way**\n   这是一项**需要功夫**的能力：「**takes some skill and takes some thinking.\n     It's often not obvious how to test a particular hypothesis**」\n\n⚠⚠ 两个**具体例子**（最值得照抄，幻灯上没有）：\n\n   **例一 · 元学习**：目标是机器人用很少数据快速适应新任务\n     但真机上搭元学习系统工作量巨大\n     ⇒ **把任务换成「回归一维正弦曲线」**，只测\n       **「能不能用五个数据点学会拟合」**\n     「it was this experiment that I **coded up in a day**」\n     结果不错，**才接着做**\n\n   **例二 · 语言指令**（近期）：目标是机器人听不同**策略**的语言指令\n     两个风险：「拿到好的策略标签」「让机器人真的注意到不同策略」\n     **后者是更大的那个**\n     ⇒ 找一个数据集，**有些数据用右手、有些用左手**，\n       训个策略只看它能不能做到这件极简的事\n     ⚠ 最妙的一笔：**左右手可以从数据里自动判定，不用标注**\n       —— **把第二个风险（标签）也绕开了**，只留下她要测的那一个\n\n   共同形状：**把真实任务换成一个保留了核心未知数、\n     但去掉了全部工程量的玩具任务**\n     正弦曲线保留「少样本快速适应」，去掉机器人\n     左右手保留「策略能不能被语言区分」，去掉标注和复杂指令\n\n第 3 条：**Try out lots of ideas, including different problems — \"create luck\"**\n   「**you h
