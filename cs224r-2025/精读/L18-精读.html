ave to get lucky to stumble upon a good idea. But you can create\n     luck for yourself just by trying out lots of ideas**」\n   ⇒ 注意 **including different problems**：**不只换想法，还可以换问题**\n     （「even at the outset, you don't know how hard a problem is going to be」）\n   她自己的经验（包括没做到的时候）：\n     「**I didn't always do this. Sometimes, I ended up banging my head\n       against the wall plenty of times**」\n\n第 4 条（前三条的收口）：\n   **Don't mentally commit to project before signs of life on core unknown**\n   关键词：**mentally**（心理上）· **signs of life**（有活的迹象）\n   ⇒ **在核心未知数给出正面信号之前，别让自己心理上认定「这就是我的项目」**\n     —— 因为那之后你就很难放手了\n\n⚠ **p43（已经动手、但跑不通）**，最有用的是第 1/2 条：\n   **Start from something that works and then make it incrementally harder**\n   ＋ **Simplify**\n   理由：「if you coded up a system and it's not working, **there's a million\n     reasons that could be why**… much easier to **start with something that\n     works and then make it harder**」\n\n   配的故事（有一个关键转折）：\n     目标：机器人**看人做一遍再自己做**\n     采了很多样的机器人示范，再请人照着做，\n       **而且告诉采数据的人「随便做、多做些」**\n     结果 **nothing worked**，**花了几个月**\n\n   ⚠ 转折：简化到**单任务**去验证模仿学习这一套 —— **结果连单任务也不行**\n     「can we get the robot to do one task and make sure our imitation\n       learning stack works? **It actually didn't work.** And so we had to\n       debug that, get it to work on one task, then **three**, then **10**」\n\n   ⇒ 要点：**他们花了几个月在一个多任务问题上，而真正的毛病在最基础那一层**\n     如果一开始就先跑通单任务，那几个月就省下来了\n   ⇒ **「简化」不只是调试手段，它是一个定序原则：先确认地基，再往上加**\n\np43 第 4 条：**Revisit your assumptions** —— 开始时以为真的事，\n   可能被你自己的实验推翻\n   「**would that change the way that you're going about the project\n     or even the project that you're working on**?」\n\n⚠ 第 5 条 **Does it \"want\" to work?**（p43 最特别的一条，有两级）\n   **a.** 完全不想成 ⇒ 很可能没什么影响力\n     「if someone else is trying to get it to work and **it also doesn't\n       really work for them**, then maybe the idea just wasn't meant to be」\n   **b.**（更可操作）**Can you reduce the project scope to the parts\n      that \"want\" to work?**\n\n   b 配的故事：开放式语言指令（**Can you clean up the trash but not\n     the dishes?**），**初步有苗头**\n     然后又加上「指令含糊时让机器人反问」等一堆想法\n     ⇒ **things weren't really working**，**又花了几个月**\n   最后：**回头问「哪些部分是真的能跑的」，把不会跑的砍掉、\n     只保留方法本来就能处理的交互，砍掉的部分写成论文的 limitations**\n   「we **rescoped** the project… We described it as **limitations** in the paper」\n   总结：「**scoping down the project, especially if you scoped it up\n     a little bit too eagerly**, can also be a useful strategy」\n\n⚠ **p44 的转向**（一个很漂亮的心理学技巧）\n   问题：**Often considered later than it should be considered!**\n        ＋ **\"sunk cost fallacy\"**\n   沉没成本讲稿说得更准：**人很自然会想「我在这上面花了很多时间，\n     所以以后花的时间会更少」—— 这是谬误，\n     而且你实际的进展可能配不上你花掉的时间**\n\n   真正卡住人的是决策的**形式**：\n     **「继续做当前项目」vs「换去开一个新项目」**\n     而后者 **is a super nebulous thing!**\n   ⇒ 「换一个新项目」可以指任何东西 ⇒ 你在拿一个具体的东西和一片虚无比\n     **那种比较没法做，只会让人焦虑**\n\n   解法是**换一个问法**：\n     **Advice: spend time thinking about other research projects!**\n     ⇒ **「继续当前项目」vs「做项目 B」vs「做项目 C」vs …**\n     **This decision is a lot more straightforward,\n       less anxiety inducing! 🥳**\n\n   ⇒ 一般形式值得记住：**当一个决策难做，先检查是不是因为其中一个选项太模糊\n     —— 把它具体化，决策本身就变容易了**\n   ⚠ 前提条件就是幻灯那句 **spend time thinking about other research projects**：\n     **你必须平时就在想别的项目，否则到了要转向的时候手上没有 B 和 C 可比**\n     ⇒ 这个技巧要**提前**付成本", "tbl": {"head": ["两个「把风险前置」的例子", "真实目标", "换成的玩具实验", "去掉了什么"], "rows": [["<b>元学习</b>", "<b>机器人用少量数据快速适应新任务</b>", "<b>用五个点回归一维正弦曲线（一天写完）</b>", "<b>整套机器人系统</b>"], ["<b>语言指令</b>", "<b>机器人听懂不同「策略」的指令</b>", "<b>有些数据用右手、有些用左手，看策略能不能区分</b>", "<span class='w'>⚠ 标注（左右手可从数据自动判定）＋ 复杂指令</span>"], ["<b>共同形状</b>", "—", "<b>保留核心未知数，去掉全部工程量</b>", "—"], ["<b>为什么人们不这么做</b>", "—", "<b>搭基础设施是容易的、而且看起来在进步</b>", "<span class='w'>⚠ This is uncomfortable!!</span>"]]}, "say": "原话（为什么「先搭基础设施」是陷阱）：<em>“wherever possible, it's good to <b>front load the risk</b> in the project. Think about, what is the reason why this might not succeed? And <b>before developing infrastructure, before coding up the entire algorithm</b> and so forth, if you can formulate and run <b>simple experiments that test the core unknowns</b> that you have, then you can <b>bring the risk to the beginning of the project</b>. And this can be really uncomfortable. Because oftentimes, <b>building the infrastructure, coding the algorithm, whatever, that's like the easy part. That's the part where you can seemingly make some progress on the project.</b> But if you do all that and then, at the end, realize that <b>the core unknown actually ended up not working out, then you wasted all of that time—— even though it seemingly seemed like progress</b>.”</em><br><br>原话（两个把风险前置的具体例子）：<em>“I worked on meta learning in the past. And the goal was to see if you can quickly adapt with a very small amount of data… But actually, designing a meta learning system on a real robot is a ton of work… And so what I did is I first set up an experiment where the tasks—— instead of learning robot tasks, <b>the tasks were regressing to simple 1D sinusoid curves</b>. So really, really simple problem. And then just tested, <b>can you learn with a few data points, like five data points, to regress to the curve?</b> And so it was this experiment that I <b>coded up in a day</b>… Another example… I've been thinking a little bit about how to get robots to follow different kinds of language instructions, including language instructions for <b>different strategies</b>. And there's a couple of risks for this. One is <b>getting good labels for the strategies</b>. And the second is actually <b>getting the robot to pay attention to those different strategies</b>. And <b>that second one actually seemed like the bigger challenge</b>. And I took a data set where it was like a really, really simple problem, where <b>in some of the data, the robot used the right gripper. And in some of the data, the robot used the left gripper.</b> And then I trained a policy just to see if it could do that very simple thing, <b>very easy to evaluate, and I could automatically determine if it was using the right or left from the data rather than doing labeling</b>.”</em><br><br>原话（简化那个故事，以及那个「连单任务都不行」的转折）：<em>“at one point, I was trying to train robots to be able to <b>see a video of a human doing a task and then do the task themselves</b> with imitation learning. Collected a really diverse data set of robot demonstrations and then asked a human to do what the robot did of all sorts of tasks. And <b>we just told people collecting the data, do whatever you want. Do lots of things. Nothing worked when training on this data. Spent like months trying to get the robot to do it.</b> And then what we did is we <b>simplified to just a single task setting</b>. Like, can we get the robot to do one task and make sure our imitation learning stack works? <b>It actually didn't work.</b> And so we had to debug that, <b>get it to work on one task, then get it to work on three tasks, then get it to work on 10 tasks</b>.”</em><br><br>原话（把项目砍回「它愿意成」的那部分）：<em>“despite having positive initial signs of life, after we introduced all those ideas, <b>things weren't really working</b>. And we kind of tried all sorts of—— <b>we spent a couple of months trying to get it to work</b>. And at some point, we kind of went back and thought about, well, OK, <b>it was working before. What parts of this thing do work? And what parts of these things are harder to work with our current method?</b> And then we <b>rescoped the project to remove the hard parts that we didn't know how to solve yet</b> and to only consider the kind of interactions that our method did work with… <b>We described it as limitations in the paper.</b> And so <b>scoping down the project, especially if you scoped it up a little bit too eagerly, can also be a useful strategy</b>.”</em><br><br>原话（转向：把「换个新项目」换成「做项目 B 还是 C」）：<em>“deciding when to pivot is really hard because you're often thinking about, <b>should I continue working on my current project? Or should I switch to starting a new project?</b> And <b>this option of switching to a new project is really nebulous. This could mean a lot of different things.</b>… And so one kind of mental trick for thinking about this sort of decision about whether to pivot is to change this decision and actually <b>spend time thinking about other projects that you would do</b> and then try to formulate the decision as <b>continuing working on the current project versus working on project B or working on project C</b> and so forth. And <b>this decision is much more concrete, a lot more straightforward to think about, less anxiety inducing</b>.”</em>", "res": {"tag": "推断", "v": "⚠️ <b>这三页对你的用处最直接，而且第一条是<b>一个该在本周做完的实验</b>。</b><br><span class='k'>按 p42：<b>在搭基础设施之前，先用最快的方式测核心未知数</b>。而你的核心未知数已经很清楚了：<b>节点级档位分配，到底比「整条工作流统一一档」好多少？</b></span><br><b>⇒ 而那两个例子给了你照抄的形状：<b>保留核心未知数，去掉全部工程量</b>。</b><br><b>⇒ 所以你的「正弦曲线实验」应该长这样：<b>取一个</b>工作流、<b>一个</b>数据集的 200 条 query，<b>穷举</b>所有节点的档位组合（3 个节点 × 2 档 = 8 种；5 个节点就抽样），全部真跑一遍，然后直接算三个数：</b><br><b>① <b>最好的逐 query 节点级配置</b>的 <code>G</code>（事后最优，这是上界）；② <b>最好的单一全局配置</b>的 <code>G</code>（工作流级最优）；③ 二者之差。</b><span class='w'>⇒ <b>那个差就是你整篇论文的空间</b>。而这个实验<b>不需要任何学习、不需要任何框架</b> —— 一个脚本、一个下午、几十美元的 API 费。</span><br><b>⇒ 如果差很小（比如 2%），那按 p42 第 4 条，<b>你现在就该知道，而不是在搭完框架之后才知道</b>。</b> <span class='k'>⇒ 而且那也不是坏消息：它会把你推向一个更好的问题（比如「怎么为每个工作流选一个全局配置」—— 更简单、也许更有用）。<b>⇒ 这正是「不要在核心未知数有活的迹象之前，心理上认定这就是我的项目」。</b></span><br><b>⇒ 顺带注意例二里那个最妙的细节，它对你有一个直接的对应：<b>她把「左右手」这个可以<b>从数据里自动判定</b>的属性当成标签，从而把「标注」这个次要风险也绕开了</b>。</b> <span class='w'>⇒ 你的对应是：<b>第一阶段的「理想档位」标签可以完全自动算出来</b>（跑一遍、对答案），不需要任何人工。⇒ 这意味着你的核心实验<b>没有标注瓶颈</b> —— 这是一个真实的便宜，值得在论文里点一句。</span><br>⚠️ <b>p43 那个「<b>连单任务都不行</b>」的转折，对你是一条具体的执行顺序建议。</b><br><span class='k'>他们花了几个月在多任务上，而毛病在最基础那层。⇒ 你的对应基础层是什么？<b>「在一个节点上，给定档位，我能可靠地判定它的输出对不对吗？」</b></span><br><b>⇒ 这件事听起来太基础，但它正是会出问题的地方：<b>中间节点的输出往往没有标准答案</b>（只有最终答案有）。</b> <span class='w'>⇒ 所以在做任何路由之前，先确认：<b>你的 <code>Acc</code> 信号是挂在最终输出上的，那么单个节点的「对不对」你其实<b>测不到</b></b>。⇒ 这会直接影响你第一阶段的设计（只能做端到端的信用分配，不能做逐节点的直接监督）。<b>⇒ 先把这件事想透，否则你会在一个测不到的量上建方法。</b></span><br><b>⇒ 而 p43 第 5 条（<b>砍回「它愿意成」的那部分</b>）给了你一条预备方案，建议现在就想好：<b>如果逐 query 的节点级太难，退到「按任务类型的节点级」</b></b>（同一类任务共用一套节点档位配置）。<span class='k'>⇒ 这保留了「节点级」这个核心卖点，去掉了「逐 query 预测」这个最难的部分，而且<b>砍掉的那部分正好写成 limitations</b> —— 讲者那个故事就是这么做的。</span><br><b>⚠ 最后 p44 那个转向技巧对你有一个<b>需要现在付成本</b>的含义：<b>你必须平时就在想别的项目，否则到了该转向的时候，手上没有 B 和 C 可比</b>。</b> <span class='w'>⇒ 具体建议：<b>维护一个「候选项目」的小清单</b>，每条只写两行（问题是什么 + 路子是什么）。⇒ 这门课的 L18 前半那七个开放问题就是现成的素材来源，而 <b>p27 第一问（离线指标）</b>已经是你的 A，<b>p15 第 1 问（大规模准确的价值函数）</b>和 <b>p19 第 2 问（边探索边保持安全）</b>都可以当 B 和 C 记下来。</span>", "ref": "本讲 p42–p44（逐字核对）· 讲稿（正弦曲线与左右手两例、连单任务都不行、rescope、转向那个技巧）· p34 科研格 · p15 · p19 · p27 · 简报 §1 §2 §3 §4d（已核）"}},
{"r": [45, 48], "t": "怎么分享：研究的产出是知识，而知识没人知道就等于没有产出", "star": 3, "quote": "<b>How to share your research — Why?</b><br><em><b>What is the output of research?</b> → <b>Ideas, knowledge, learnings.</b> &nbsp;·&nbsp; Almost always not: product, service<br><b>If no one knows about the learnings, then there was no output!!</b> &nbsp;(+ even companies have massive marketing efforts!)<br><b>But it feels like self promotion! :(</b> → You are teaching people and sharing cool findings<br><b>But it didn't work that well.</b> → Still very useful, since other people may think of the idea!<br><b>But it's all obvious to me now.</b> → After enough research, you will know far more than others!</em><br><b>How?</b><br><em>Clear writing, visuals, presentations. · Think about your audience, and how they will interpret what you say. · <b>When in doubt, assume your audience knows less rather than more.</b> · Many people still appreciate refreshers! · <b>Avoid jargon if possible.</b> · <b>Practice, practice, practice.</b> · <b>Get honest feedback.</b></em><br><b>Writer's block</b><br><em><b>Break down the task.</b> (e.g. on pen &amp; paper, write down some ideas / write down an outline)<br><b>My recommendation: think through your own ideas before asking your friend ChatGPT</b></em>", "one": "<b>这一节的论证只有两步，但它很硬：研究的产出不是产品，而是知识；而如果没人知道那些知识，那就没有产出。所以「分享」不是宣传，是交付。</b>", "pts": ["⚠️ <b>讲者没有从「你应该多宣传」开始，而是从一个<b>定义性的问题</b>开始，这个起点决定了整节的说服力：<b><em>What is the output of research?</em></b></b> <span class='k'>答案：<b><em>Ideas, knowledge, learnings</em></b>；而且 <b><em>Almost always not: product, service</em></b></span>。", "<b>⇒ 一旦接受了这个定义，推论就无法回避：<b><em>If no one knows about the learnings, then there was no output!!</em></b></b> <span class='w'>讲稿把这个对比讲得更清楚：<b>如果产出是产品，那「有影响力」意味着很多人在用它做好事；而产出是知识的话，<b>没人知道你学到了什么，就等于没有产出</b></b></span>。", "<b>⇒ 所以这一节的真正主张不是「要注意传播」，而是：<b>分享是交付的一部分，不分享等于没做完</b>。</b> <span class='k'>⚠ 而这也解释了 p33 那个旁注为什么说三件事「同等重要」—— <b>如果不分享等于没产出，那它当然和「做出来」一样重要</b>。</span>", "<b>⇒ 幻灯还加了一条旁证来堵「做得好自然有人知道」这种想法：<b><em>(+ even companies have massive marketing efforts!)</em></b></b> <span class='w'>⇒ 连有真实产品、能直接卖钱的公司都要花大力气让人知道，<b>那只有知识可交付的研究者凭什么指望自动被发现</b>。</span>", "⚠️ <b>接着幻灯做了一件很实用的事：<b>把三种最常见的「不想分享」的理由逐条摆出来并驳掉</b>。这种写法本身就值得学。</b>", "<b>⇒ <b>理由一「<em>But it feels like self promotion!</em>」</b> → 回答是换一个框架：<b><em>You are teaching people and sharing cool findings</em></b>。</b> <span class='k'>讲稿的说法更贴切：「you can think about it as more actually <b>doing a service to them</b> to teach them something new and useful and interesting」。⇒ 从「我在推销我自己」换成「我在给别人一个有用的东西」—— <b>同一个行为，两种自我叙述，而后者做得下去</b>。</span>", "<b>⇒ <b>理由二「<em>But it didn't work that well.</em>」</b> → <b><em>Still very useful, since other people may think of the idea!</em></b></b> <span class='w'>讲稿补得很具体：别人<b>可能也会想到同一个想法</b>，而他们会想知道<b>它到底效果如何</b>、以及<b>在哪些情形下比别的情形更有效</b></span>。<b>⇒ 这和 p32 那条「失败能让别人排除掉已经试过的想法」是同一件事，<b>而这里把它变成了一个分享的理由</b>。</b>", "<b>⇒ <b>理由三「<em>But it's all obvious to me now.</em>」</b> → <b><em>After enough research, you will know far more than others!</em></b></b> <span class='k'>⇒ 这一条指出的是一个很常见的<b>认知偏差</b>：你在一个问题上做久了，很多东西对你变成了常识，<b>于是你会低估它对别人的价值</b>。⇒ 讲稿：「There will be things that <b>seem really obvious to you that are not obvious to other people</b>」。</span>", "<b>p47 转到 <b>怎么做</b>，而七条里有一条是重点：<b><em>When in doubt, assume your audience knows less rather than more.</em></b></b> <span class='w'>讲稿给了理由，而这个理由很朴素也很对：<b>「If they don't understand what you're saying, then they won't understand the knowledge」</b></span>。<b>⇒ 顺着上面的定义链：<b>听不懂 ⇒ 知识没传过去 ⇒ 没有产出</b>。</b>", "<b>⇒ 而她承认这件事<b>做起来有点难</b>（「This can actually be a little bit tricky to do」）—— 因为你已经懂了，所以很难估计别人不懂什么。</b> <span class='k'>⇒ 配套的两条是：<b><em>Avoid jargon if possible</em></b>（「They might know the jargon. But if there's ways to avoid it, then it <b>makes it more accessible</b>」）和 <b><em>Many people still appreciate refreshers!</em></b></span>", "<b>⇒ 而「回顾」那一条有一层额外的好处，讲稿才说了：<b>一个清楚的回顾可能让<b>已经懂的人</b>换一个角度重新想那件事</b>。</b> <span class='w'>原话：「even if they do know a lot of what you're going to say, a lot of people still appreciate refreshers… and it might actually <b>cause them to think about something that they know in a new way</b>」</span>。<b>⇒ 所以讲基础不是浪费时间，<b>它对专家也有价值，只要讲得清楚</b>。</b>", "<b>⇒ 最后两条是关于<b>怎么变好</b>的，而它们很朴素：<b><em>Practice, practice, practice</em></b>（写、讲，一个人练或者找人练）＋ <b><em>Get honest feedback</em></b>。</b> <span class='k'>⇒ 注意是 <b>honest</b>（诚实的）反馈 —— 这个限定词是必要的，因为客气的反馈没有用。</span>", "⚠️ <b><b>p48 处理的是一个很具体的卡点：<b>写不出来</b>（writer's block）。办法是 <b><em>Break down the task</em></b></b>。</b> <span class='w'>做法很朴素：<b>拿纸笔，先写下一些想法，再写一个大纲</b>。⇒ 讲稿解释了为什么需要这一步：「it's easy to get a little bit <b>overwhelmed by how much you have to do and where even to get started</b>」</span>。", "<b>⇒ 而最后那条建议值得逐字记住，因为它是这一页唯一带「我建议」的：<b><em>My recommendation: think through your own ideas <b>before</b> asking your friend ChatGPT</em></b>。</b> <span class='k'>⇒ 注意她的措辞不是「不要用」，而是 <b>before</b>（在那之前）—— <b>顺序问题，不是禁令</b>。</span>", "<b>⇒ 这条建议的道理和这一节的定义链是一致的：<b>如果研究的产出是「你学到的东西」，那么写作本身就是在整理你自己学到了什么</b>。</b> <span class='w'>⇒ 让别人（或模型）先替你想一遍，省掉的恰恰是那个整理过程 —— <b>而那个过程就是产出本身</b>。</span>"], "eq": "起点是一个**定义性的问题**（这个起点决定了整节的说服力）：\n   **What is the output of research?**\n   → **Ideas, knowledge, learnings**\n   而且 **Almost always not: product, service**\n\n⚠⚠ 一旦接受这个定义，推论无法回避：\n   **If no one knows about the learnings, then there was no output!!**\n   讲稿讲得更清楚：**产出是产品 ⇒「有影响力」= 很多人在用它做好事；\n     产出是知识 ⇒ 没人知道你学到了什么，就等于没有产出**\n\n   ⇒ 真正的主张不是「要注意传播」，而是：\n     **分享是交付的一部分，不分享等于没做完**\n   ⚠ 这也解释了 p33 那个旁注为什么说三件事「同等重要」\n\n   堵「做得好自然有人知道」的旁证：\n     **(+ even companies have massive marketing efforts!)**\n   ⇒ 连有真实产品、能直接卖钱的公司都要花大力气让人知道，\n     **只有知识可交付的研究者凭什么指望自动被发现**\n\n⚠ 三种「不想分享」的理由，逐条摆出并驳掉（这种写法本身值得学）：\n\n   **「But it feels like self promotion!」**\n     → **You are teaching people and sharing cool findings**\n     「you can think about it as more actually **doing a service to them**」\n     ⇒ 从「我在推销我自己」换成「我在给别人一个有用的东西」\n       **同一个行为，两种自我叙述，而后者做得下去**\n\n   **「But it didn't work that well.」**\n     → **Still very useful, since other people may think of the idea!**\n     别人**可能也会想到同一个想法**，而他们想知道\n       **它到底效果如何**、以及**在哪些情形下比别的情形更有效**\n     ⇒ 与 p32「失败能让别人排除掉已试过的想法」是同一件事，\n       **这里把它变成了一个分享的理由**\n\n   **「But it's all obvious to me now.」**\n     → **After enough research, you will know far more than others!**\n     ⇒ 指出一个常见的**认知偏差**：在一个问题上做久了，\n       很多东西对你变成常识，**于是你会低估它对别人的价值**\n     「There will be things that **seem really obvious to you\n       that are not obvious to other people**」\n\np47 **怎么做**（七条里的重点）：\n   **When in doubt, assume your audience knows less rather than more.**\n   理由很朴素也很对：\n     **「If they don't understand what you're saying,\n       then they won't understand the knowledge」**\n   ⇒ 顺着定义链：**听不懂 ⇒ 知识没传过去 ⇒ 没有产出**\n   而她承认这件事**做起来有点难**（你已经懂了，很难估计别人不懂什么）\n\n   配套两条：\n     **Avoid jargon if possible**\n       「They might know the jargon. But if there's ways to avoid it,\n         it **makes it more accessible**」\n     **Many people still appreciate refreshers!**\n       额外的好处（讲稿才说）：**清楚的回顾可能让已经懂的人\n         换一个角度重新想那件事**\n       「it might **cause them to think about something they know in a new way**」\n       ⇒ **讲基础不是浪费时间，它对专家也有价值，只要讲得清楚**\n\n   怎么变好：**Practice, practice, practice** ＋ **Get honest feedback**\n   ⇒ 注意是 **honest** —— 这个限定词是必要的，客气的反馈没有用\n\n⚠ **p48 · 写不出来（writer's block）**：**Break down the task**\n   做法很朴素：**拿纸笔，先写下一些想法，再写一个大纲**\n   为什么需要这一步：「it's easy to get **overwhelmed by how much you have\n     to do and where even to get started**」\n\n   这一页唯一带「我建议」的一条（值得逐字记）：\n     **My recommendation: think through your own ideas\n       before asking your friend ChatGPT**\n   ⇒ 措辞不是「不要用」，而是 **before**（在那之前）\n     —— **顺序问题，不是禁令**\n\n   ⇒ 这条建议与整节的定义链一致：\n     **如果研究的产出是「你学到的东西」，\n       那么写作本身就是在整理你自己学到了什么**\n   ⇒ 让别人（或模型）先替你想一遍，省掉的恰恰是那个整理过程\n     **—— 而那个过程就是产出本身**", "tbl": {"head": ["三种「不想分享」的理由", "幻灯的回答"], "rows": [["<b>感觉像在自我推销</b>", "<b>你是在教别人、在分享有意思的发现 —— 这是给对方的服务</b>"], ["<b>做得不怎么好</b>", "<b>仍然有用：别人也可能想到这个主意，他们想知道它到底行不行</b>"], ["<b>现在看都是显然的</b>", "<b>做够了研究，你知道的会远多于别人 —— 对你显然的事对别人不显然</b>"], ["<b>⇒ 底层的论证</b>", "<b>研究的产出是知识；没人知道 = 没有产出</b>"], ["<b>⇒ 旁证</b>", "<b>连有真实产品的公司都要大力宣传</b>"]]}, "say": "原话（研究的产出是知识，所以不分享等于没有产出）：<em>“if you think about what is the output or the outcome of research, <b>the output of research is essentially ideas, knowledge, things that you learned from doing the research. It's not a product. It's not a service. It's really knowledge.</b> It's things that you learn. And if it were a product, then the high impact would mean that lots of people are using the product for good things. But since it's more like knowledge, <b>if no one knows about what you learned, then there was really no impact or no output as a result</b>. And even for companies that have products and services, <b>they have massive marketing efforts</b> to try to get those products out. And so <b>for your work to have impact, you need to share it</b>.”</em><br><br>原话（三种不想分享的理由，逐条回答）：<em>“even if it feels like self-promotion, <b>you're teaching people. You're sharing cool new findings. And you can think about it as more actually doing a service to them</b> to teach them something new and useful and interesting. <b>Even if it didn't work that well, it's really useful to share because other people might think of that idea and might want to know how well did it work. And did it work in certain circumstances more better than other circumstances?</b> And then, yeah, after enough research, you're going to know a lot more than other people. <b>There will be things that seem really obvious to you that are not obvious to other people.</b>”</em><br><br>原话（假设听众知道得更少；以及回顾对专家也有用）：<em>“It's important to think about their audience and how they will interpret what you say, what they know. <b>When in doubt, assume that your audience knows less rather than more. This can actually be a little bit tricky to do.</b> It's good to <b>avoid jargon if possible</b>. They might know the jargon. But if there's ways to avoid it, then <b>it makes it more accessible</b>. And even if they do know a lot of what you're going to say, <b>a lot of people still appreciate refreshers</b>, especially if those refreshers are clear. And it might actually <b>cause them to think about something that they know in a new way</b>.”</em><br><br>原话（写不出来的时候，以及那条关于 ChatGPT 的建议）：<em>“when trying to write a paper or when trying to create a slide deck or something, <b>it's easy to get a little bit overwhelmed by how much you have to do and where even to get started</b> on that. I find it really helpful to <b>break down the task</b>. And even on a pen and paper, just <b>write down some ideas for how I want to do it. Maybe write down an outline.</b> <b>My recommendation would be to think through your ideas for what you want to communicate before asking your friend, before asking your friend ChatGPT.</b>”</em>", "res": {"tag": "推断", "v": "⚠️ <b>这一节的定义链（<b>产出是知识 ⇒ 没人知道就没有产出</b>）对你有一条很具体、而且现在就该排进日程的含义：<b>你那套还没写出来的东西，按这个定义是不存在的</b>。</b><br><span class='k'>而你手上已经有相当多的东西了：<code>G = Acc − λ·Cost</code> 的设定、两阶段架构、DAgger 那条界的来源、以及一整套从这门课里攒下来的边界声明和基线设计。⇒ 但这些现在只存在于笔记和脑子里</span>。<br><b>⇒ 按这一节的逻辑，最该做的不是「等有结果了再写」，而是<b>现在就把问题陈述和方法写成一份草稿</b>。</b> <span class='w'>理由不只是「早写早好」：<b>写作本身会暴露你的论证漏洞</b>。⇒ 比如你一旦要动笔写「我们的方法为什么比工作流级好」，你就会发现自己需要 L17 p29 那个消融的数 —— <b>而那正是你该先做的实验</b>。</span><br><b>⇒ 这和 p42 那条「把风险前置」是同一个方向的：<b>先写，会让你发现哪些未知数是非测不可的</b>。</b><br>⚠️ <b>第二条，那三个「不想分享」的理由里，<b>第二个和第三个都已经适用于你了</b>，建议现在就按幻灯的回答处理。</b><br><span class='k'><b>「做得不怎么好」</b>：你试过但没用的那些特征（比如 logprob 当置信度，而 p22 说它在后训练模型上不校准）、那些失败的档位策略 —— <b>按这一页，这些都值得写进去</b>，因为别人也会想到同样的主意，他们想知道「它到底行不行、在哪些情形下更行」</span>。<br><b>⇒ 具体建议：<b>在论文里留一个「我们试过但没用的东西」小节</b>。</b> <span class='w'>它的成本是半页，而回报有两重：<b>① 让别人省时间（这是 p32 说的那种「排除已试过的想法」的贡献）；② 让审稿人看到你确实探过这个空间</b>。⇒ 而第二重的实际效果常常被低估 —— <b>一个老实列出负面结果的工作，比一个只报正面结果的工作更可信</b>。</span><br><b>⇒ <b>「现在看都是显然的」</b>这一条对你尤其适用，因为 p37 已经点明过：<b>问题驱动的研究，解法事后看常常显然</b>。</b> <span class='k'>⇒ 「贵的节点用大模型、便宜的用小模型」在你心里现在肯定已经是常识了。<b>但对读者不是</b> —— 他们没有你积累的那些观察（哪些节点其实不敏感、为什么难度预测行不通、为什么裁判不能进目标函数）。<b>⇒ 所以把你觉得「显然」的那些中间观察<b>写出来</b>，它们才是这篇论文真正的信息量。</b></span><br><b>⚠ 最后那条「<b>先自己想清楚，再去问 ChatGPT</b>」对你有一个和本项目直接相关的提醒。</b> <span class='w'>你正在用一个 AI 助手读这门课、整理这些连接。⇒ 按这条建议，正确的用法是<b>顺序</b>上的：<b>先自己想你要论证什么，再用它来检查、找反例、补文献</b>；而不是让它替你生成论证的骨架。</span><b>⇒ 理由就是这一节的定义链：<b>如果产出是「你学到的东西」，那省掉思考过程就等于省掉了产出</b>。⇒ 一个可操作的做法：<b>每次要写一段重要论证前，先在纸上写三行你自己的版本，再对照</b>。</b>", "ref": "本讲 p46–p48（逐字核对）· 讲稿（产出是知识、三条理由的回答、ChatGPT 那条建议）· p32 · p37 · p42 · p22 · L17 p29 · 简报 §1 §3（已核）"}},
{"r": [49, 51], "t": "导师与自信：那些让你觉得自己不行的理由，恰好都是真的", "star": 2, "quote": "<b>Misc: Mentorship</b><br><em><b>If you have it, don't be afraid to lean on it!</b><br><b>I often find that students do best when learning gradually.</b></em><br><b>Misc: Confidence</b><br><em>Many reasons to lack confidence in research<br><b>No one knows the best way to do research right now.</b><br><b>No one knows what research will be the most impactful in the future.</b><br><b>Many ideas don't work. Many papers get rejected</b><br><b>Many researchers have been thinking about a domain for years! They will be “smarter” than you in that domain — no reason to be intimidated.</b><br><b>Yet, confidence is really important.</b><br><b>Self-doubt, overthinking, etc. can really slow you down.</b></em>", "one": "<b>这一页的结构很特别：它先把所有让人缺乏自信的理由列出来并承认它们都是真的，然后说——但这些都不意味着你做得差。</b>", "pts": ["<b><b>导师</b>那一页只有两句，但第一句的措辞值得注意：<b><em>If you have it, don't be afraid to lean on it!</em></b> —— 是 <b>lean on</b>（倚靠），而不是「适当请教」。</b>", "<b>⇒ 而讲者用自己的例子把这件事的尺度定下来了，这个例子比任何劝说都有力：<b>她博士第一篇论文「<b>hardly wrote any of the paper</b>」（几乎没怎么写），而合作者后来告诉她，<b>连她写的那一节他也重写了</b></b>。</b> <span class='k'>⇒ 这个细节的作用是把「可以依靠别人」的边界推得很远：<b>不是「某些部分可以求助」，而是「第一篇论文你几乎可以不会写」</b>。</span>", "<b>⇒ 她的结论是一句很直白的许可：<b><em>It's OK to not know everything and not know how to do every part of the research process.</em></b></b> <span class='w'>讲稿的理由很实在：<b>做新研究 + 写论文 + 讲出来 + 挑题目，这整套是一个「really, really huge undertaking」</b>，所以在学的过程中倚靠别人是合理的</span>。", "<b>⇒ 第二句 <b><em>I often find that students do best when learning gradually</em></b> 给了一个相反方向的提醒：<b>一开始就什么都自己扛，效果反而不好</b>。</b> <span class='k'>原话：「students and myself do most successful when they're <b>learning more gradually</b> and when they're <b>not trying to take on everything themselves</b>」。⇒ 注意她把自己也算进去了。</span>", "⚠️ <b><b>p51 的结构是这一节最值得学的东西：<b>先把所有让人缺乏自信的理由列出来，而且承认它们都是真的</b></b>。</b> <span class='w'>四条：<b>① 现在没人知道做研究的最好方式；② 没人知道什么研究将来最有影响力；③ 很多想法不成、很多论文被拒；④ 很多研究者在一个领域里想了好多年，他们在那个领域会比你「更聪明」</b></span>。", "<b>⇒ 而第 ①② 两条后面藏着一个很妙的逻辑，幻灯只在别处点了一句（p40）：<b>如果有人知道，那它就不是研究了</b>。</b> <span class='k'>讲稿原话：「No one knows how to do research right now. No one knows what research is going to be most impactful. <b>If they did, it wouldn't be research</b>」</span>。<b>⇒ 也就是说：<b>①② 不是你的缺陷，而是「研究」这个词的定义的一部分</b>——每个人都处在同样的无知里。</b>", "<b>⇒ 第 ④ 条的处理方式也很诚实：<b>它没有否认别人更懂，而是解释了为什么那不构成威胁</b>。</b> <span class='w'>幻灯的措辞是：他们在那个领域会「更聪明」—— <b>引号是幻灯自己加的</b> —— 因为 <b>they've been thinking about it for many years</b>，于是 <b><em>no reason to be intimidated</em></b></span>。<b>⇒ 逻辑是：<b>那是时间带来的差距，不是能力上的差距</b>，而时间你也会有。</b>", "⚠️ <b>⇒ 然后是反转，而反转的句式值得注意：<b><em>Yet, confidence is really important.</em></b></b> <span class='k'>理由是功能性的，不是心理安慰：<b><em>Self-doubt, overthinking, etc. can really slow you down.</em></b></span><b>⇒ 也就是说<b>自信在这里被当成一种生产力因素</b>，而不是一种心态偏好。</b>", "<b>⇒ 而讲稿把这个反转的逻辑补完整了，这一句是全页的落点：<b>那些事（知道得少、被拒过、很多想法不成）确实都是真的，<b>但它们并不意味着你做研究做得差</b></b>。</b> <span class='w'>原话：「it's easy to think that you know very little, that you have been rejected many times, that a lot of your ideas don't work, <b>because all of those things are kind of true. But that doesn't mean that you're actually doing a bad job at research</b>」</span>。", "<b>⇒ 这个论证形式值得单独记住，因为它比「要自信一点」有用得多：<b>它不是否认那些负面事实，而是指出那些事实<b>不能推出</b>你想推出的那个结论</b>。</b> <span class='k'>⇒ 「我很多想法不成」是真的；「所以我不适合做研究」不成立 —— 因为 p32 已经说了<b>不到 1% 的想法有持久影响，那是这个行业的基础概率，对所有人都一样</b>。</span>", "<b>⇒ 所以 p51 和 p32 是配套的：<b>p32 给出基础概率，p51 告诉你怎么在知道那个概率之后还能接着干</b>。</b> <span class='w'>⇒ 把两页连起来读，这一节就不是励志话，<b>而是一个关于「如何不被正确的统计事实击垮」的具体建议</b>。</span>"], "eq": "**导师**那一页只有两句，第一句的措辞值得注意：\n   **If you have it, don't be afraid to lean on it!**\n   —— 是 **lean on**（倚靠），而不是「适当请教」\n\n   讲者用自己的例子把尺度定下来了（比任何劝说都有力）：\n     **她博士第一篇论文「hardly wrote any of the paper」（几乎没怎么写），\n       而合作者后来告诉她，连她写的那一节他也重写了**\n   ⇒ 这个细节把「可以依靠别人」的边界推得很远：\n     **不是「某些部分可以求助」，而是「第一篇论文你几乎可以不会写」**\n\n   结论是一句很直白的许可：\n     **It's OK to not know everything and not know how to do\n       every part of the research process.**\n   理由：**做新研究 + 写论文 + 讲出来 + 挑题目，\n     这整套是一个「really, really huge undertaking」**\n\n   第二句给了相反方向的提醒：\n     **I often find that students do best when learning gradually**\n     **一开始就什么都自己扛，效果反而不好**\n   「students **and myself** do most successful when they're **learning more\n     gradually** and when they're **not trying to take on everything themselves**」\n   ⇒ 注意她把自己也算进去了\n\n⚠⚠ **p51 的结构是这一节最值得学的东西**：\n   **先把所有让人缺乏自信的理由列出来，而且承认它们都是真的**\n\n   ① **现在没人知道做研究的最好方式**\n   ② **没人知道什么研究将来最有影响力**\n   ③ **很多想法不成、很多论文被拒**\n   ④ **很多研究者在一个领域里想了好多年，\n       他们在那个领域会比你「更聪明」**\n\n   ⇒ ①② 后面藏着一个很妙的逻辑：**如果有人知道，那它就不是研究了**\n     「No one knows how to do research right now. No one knows what research\n       is going to be most impactful. **If they did, it wouldn't be research**」\n     ⇒ **①② 不是你的缺陷，而是「研究」这个词的定义的一部分**\n       —— 每个人都处在同样的无知里\n\n   ⇒ ④ 的处理也很诚实：**没有否认别人更懂，而是解释了为什么那不构成威胁**\n     幻灯写他们会「更聪明」—— **引号是幻灯自己加的** ——\n     因为 **they've been thinking about it for many years**\n     于是 **no reason to be intimidated**\n     ⇒ 逻辑：**那是时间带来的差距，不是能力上的差距**，而时间你也会有\n\n⚠ 然后是反转（句式值得注意）：**Yet, confidence is really important.**\n   理由是功能性的，不是心理安慰：\n     **Self-doubt, overthinking, etc. can really slow you down.**\n   ⇒ **自信在这里被当成一种生产力因素**，而不是一种心态偏好\n\n   讲稿把反转的逻辑补完整了（全页的落点）：\n     「it's easy to think that you know very little, that you have been\n       rejected many times, that a lot of your ideas don't work,\n       **because all of those things are kind of true. But that doesn't\n       mean that you're actually doing a bad job at research**」\n\n   ⇒ 这个论证形式值得单记（比「要自信一点」有用得多）：\n     **它不是否认那些负面事实，\n       而是指出那些事实「不能推出」你想推出的那个结论**\n   ⇒ 「我很多想法不成」是真的；「所以我不适合做研究」不成立\n     —— p32 已经说了**不到 1% 的想法有持久影响，\n       那是这个行业的基础概率，对所有人都一样**\n\n⇒ 所以 p51 和 p32 是配套的：\n   **p32 给出基础概率，p51 告诉你怎么在知道那个概率之后还能接着干**\n   ⇒ 连起来读，这一节不是励志话，\n     **而是一个关于「如何不被正确的统计事实击垮」的具体建议**", "tbl": {"head": ["缺乏自信的理由", "是真的吗", "但它推不出什么"], "rows": [["<b>没人知道怎么做研究才最好</b>", "<b>真的</b>", "<b>这是「研究」定义的一部分 —— 知道了就不是研究</b>"], ["<b>没人知道什么研究将来最有影响</b>", "<b>真的</b>", "<b>同上，大家处在同样的无知里</b>"], ["<b>很多想法不成、论文被拒</b>", "<b>真的</b>", "<span class='w'>⚠ 那是行业的基础概率（p32 的不到 1%），对所有人一样</span>"], ["<b>别人在那个领域比你「更聪明」</b>", "<b>真的（引号是幻灯加的）</b>", "<b>那是时间带来的差距，不是能力差距</b>"], ["<b>⇒ 为什么还要自信</b>", "—", "<b>自我怀疑和过度思考会真的拖慢你（功能性理由）</b>"]]}, "say": "原话（第一篇论文她几乎没怎么写，连她写的那节也被重写了）：<em>“I think mentorship can play a huge role in research. And <b>if you have it, don't be afraid to lean on it</b>. <b>In my first research paper in my PhD, I like hardly wrote any of the paper.</b> And I talked to actually my co-author. And <b>he told me that he actually even rewrote the section that I wrote.</b> And so <b>it's OK to not know everything and not know how to do every part of the research process</b>. And lean on other people for the things that you don't know how to do yet. Generally, I've seen <b>students and myself do most successful when they're learning more gradually and when they're not trying to take on everything themselves</b> because doing novel research and writing a paper about it and presenting it—— like, picking a problem, all of that is <b>a really, really huge undertaking</b>.”</em><br><br>原话（那些理由都是真的，但它们推不出「你做得差」）：<em>“there's a lot of reasons to lack confidence in research. <b>No one knows how to do research right now. No one knows what research is going to be most impactful. If they did, it wouldn't be research.</b> Many ideas don't work. Many papers get rejected. <b>Many researchers have been thinking about a domain for many years. And they will be smarter than you in that domain because they've been thinking about it for many years.</b> And so <b>it's easy to think that you know very little, that you have been rejected many times, that a lot of your ideas don't work, because all of those things are kind of true. But that doesn't mean that you're actually doing a bad job at research.</b> And <b>confidence is really important. If you're not confident, if you're second guessing, overthinking things, it can really slow you down.</b> And even though these things are challenging, <b>they're actually not reasons to be unconfident</b>.”</em>"},
{"r": [52, 53], "t": "收尾：正因为 RL 现在「能用了」，现在才比以往更适合做研究", "star": 2, "quote": "<b>Closing Thoughts</b><br><em><b>This is the last lecture!</b> Thank you all for the engaging questions, your patience with new course components, and your feedback throughout the quarter to make the course better. <b>It's been a pleasure having you all in the course!</b></em>", "one": "<b>最后一段先承认了一个很真实的想法：既然 RL 现在能用了，也许不必做研究，直接拿去应用就好。而她的回答是——恰恰相反，现在是做研究最好的时候。</b>", "pts": ["⚠️ <b>讲者收尾时先把一个<b>她猜学生正在想</b>的念头摆出来，而这个起手很诚实。</b> <span class='k'>原话：「in terms of the time that we're in right now, I think that you might feel like <b>reinforcement learning works now to some extent</b>. And so maybe we don't need to do research. <b>Maybe we can just use the thing that works and apply it in all sorts of circumstances</b>」</span>。", "<b>⇒ 而她没有否认这条路：<b>「there's a lot of merit to applying research in the real world. <b>It's good for some people to do that</b>」</b>。</b> <span class='w'>⇒ 这个让步很重要，因为它让后面的结论不是立场宣言，<b>而是一个有对照的判断</b>。</span>", "⚠️ <b>然后是结论，而它的措辞是比较级：<b>现在比以往任何时候都更适合做研究</b>（「now is a <b>better time than ever</b> to do research」）。</b>", "<b>⇒ 理由只有一条，但它是经验性的而不是鼓励性的：<b>我们正在看到新研究被转化成非常真实的现实影响</b>。</b> <span class='k'>原话：「we are actually seeing <b>new research being translated into very real-world impact</b>」</span>。", "<b>⇒ 而她用一个<b>时间对比</b>把这条理由钉实：<b>像 AlphaFold、ChatGPT 这样的突破，和 10 年或 20 年前的突破相比，是真的在今天的世界里产生了巨大影响</b>。</b> <span class='w'>原话：「a lot of the big breakthroughs, like AlphaFold, like ChatGPT, and so forth, <b>compared to the breakthroughs of like 10 years ago or 20 years ago, these are things that are actually leading to really massive impact in the world today</b>」</span>。", "<b>⇒ 所以推论是：<b>如果你现在做研究，你能参与贡献那种新的突破，而它们在未来会有更大的影响 —— 比你 10 年或 20 年前做研究要更有机会</b>。</b> <span class='k'>⇒ 注意这个论证的形状：<b>它比较的不是「做研究 vs 做应用」，而是「现在做研究 vs 过去做研究」</b>。</span>", "⚠️ <b>⇒ 而这个结论和那个担忧其实是<b>同一件事的两面</b>，这一点讲者没点明但值得想清楚：<b>「RL 现在能用了」正是「研究能被转化成影响」的另一种说法</b>。</b> <span class='w'>⇒ 换句话说：<b>那个让人觉得「不必做研究」的现象，恰恰是「现在做研究更值得」的证据</b>。⇒ 十年前做 RL 研究的人，看不到自己的工作变成现实影响；现在能看到。</span>", "<b>⇒ 把这一段接回 p32 的第二条现实（<b>研究是增量的</b>），逻辑就完整了。</b> <span class='k'>AlphaFold 站在 CASP 二十年之上 ⇒ 今天的突破用的是十年二十年前那些人铺的路 ⇒ <b>而现在铺路的人，会更快看到路通向哪里</b>。</span>", "<b>p53 是致谢页，而它提到的三样东西顺带透露了这门课的状态：<b>engaging questions</b>（活跃的提问）· <b>patience with new course components</b>（对新课程组件的耐心）· <b>feedback throughout the quarter</b>（整学期的反馈）。</b> <span class='w'>⇒ 第二条说明<b>这门课那一年有新加的部分</b>（而 L17 那场客座讲座、以及这一讲后半的研究方法论，可能就属于这类新组件）。</span>", "<b>⚠ 最后值得把这一讲的两半连起来看，因为它们的结构是对称的：<b>前半列出七个还没解决的问题，后半教你怎么去解问题</b>。</b> <span class='k'>⇒ 而 p28 那句承接写得很准：<b><em>You are all now well-equipped to start tackling these challenges!</em></b>⇒ 讲稿的补充把这门课的定位说明白了：<b>你不会什么都懂，但你有了足够的基础去读论文、搞清前沿在哪、并在前沿上接着做</b>。</span>"], "eq": "收尾先摆出一个**她猜学生正在想**的念头（起手很诚实）：\n   「you might feel like **reinforcement learning works now to some extent**.\n     And so maybe we don't need to do research. **Maybe we can just use\n     the thing that works and apply it in all sorts of circumstances**」\n\n   她没有否认这条路：\n     「there's a lot of merit to applying research in the real world.\n       **It's good for some people to do that**」\n   ⇒ 这个让步很重要：让后面的结论不是立场宣言，**而是一个有对照的判断**\n\n⚠ 结论的措辞是**比较级**：\n   **现在比以往任何时候都更适合做研究**\n   （「now is a **better time than ever** to do research」）\n\n   理由只有一条，而且是经验性的而非鼓励性的：\n     **我们正在看到新研究被转化成非常真实的现实影响**\n     「we are actually seeing **new research being translated into\n       very real-world impact**」\n\n   用一个**时间对比**钉实：\n     「a lot of the big breakthroughs, like **AlphaFold**, like **ChatGPT**…\n       **compared to the breakthroughs of like 10 years ago or 20 years ago,\n       these are things that are actually leading to really massive impact\n       in the world today**」\n\n   ⇒ 推论：**如果你现在做研究，你能参与贡献那种新的突破，\n     而它们在未来会有更大的影响 —— 比你 10 年或 20 年前做研究更有机会**\n   ⇒ 注意论证的形状：\n     **它比较的不是「做研究 vs 做应用」，而是「现在做研究 vs 过去做研究」**\n\n⚠ 而这个结论和那个担忧其实是**同一件事的两面**（讲者没点明，但值得想清楚）：\n   **「RL 现在能用了」正是「研究能被转化成影响」的另一种说法**\n   ⇒ **那个让人觉得「不必做研究」的现象，\n       恰恰是「现在做研究更值得」的证据**\n   ⇒ 十年前做 RL 研究的人看不到自己的工作变成现实影响；现在能看到\n\n接回 p32 第二条现实（**研究是增量的**），逻辑就完整了：\n   AlphaFold 站在 CASP 二十年之上\n   ⇒ 今天的突破用的是十年二十年前那些人铺的路\n   ⇒ **而现在铺路的人，会更快看到路通向哪里**\n\np53 致谢页提到的三样东西顺带透露了这门课的状态：\n   **engaging questions** · **patience with new course components**\n   · **feedback throughout the quarter**\n   ⇒ 第二条说明**这门课那一年有新加的部分**\n     （L17 那场客座讲座、以及这一讲后半的研究方法论，可能就属于这类）\n\n⚠ 把这一讲两半连起来看，结构是对称的：\n   **前半列出七个还没解决的问题，后半教你怎么去解问题**\n   而 p28 那句承接写得很准：\n     **You are all now well-equipped to start tackling these challenges!**\n   讲稿的补充把这门课的定位说明白了：\n     **你不会什么都懂，但你有了足够的基础去读论文、\n       搞清前沿在哪、并在前沿上接着做**", "tbl": {"head": ["那个担忧 vs 讲者的回答"], "rows": [["<b>担忧：RL 现在能用了，也许不必做研究，直接拿去应用就好</b>"], ["<b>让步：应用确实有价值，也该有人做</b>"], ["<b>结论：现在比以往任何时候都更适合做研究</b>"], ["<b>理由：我们正在看到新研究被转化成非常真实的现实影响</b>"], ["<b>证据：AlphaFold、ChatGPT 这类突破，比 10–20 年前的突破真的在今天产生了巨大影响</b>"], ["<span class='w'>⚠ 而两者其实是一件事的两面：「RL 能用了」就是「研究能被转化成影响」</span>"]]}, "say": "原话（那个担忧，和为什么现在反而更适合做研究）：<em>“in terms of the time that we're in right now, I think that you might feel like <b>reinforcement learning works now to some extent. And so maybe we don't need to do research. Maybe we can just use the thing that works and apply it in all sorts of circumstances.</b> And <b>there's a lot of merit to applying research in the real world. It's good for some people to do that.</b> But at the same time, I think that <b>now is a better time than ever to do research because we are actually seeing new research being translated into very real-world impact</b>. And a lot of the big breakthroughs, <b>like AlphaFold, like ChatGPT</b>, and so forth, <b>compared to the breakthroughs of like 10 years ago or 20 years ago, these are things that are actually leading to really massive impact in the world today</b>. And <b>if you work on research now, you can help contribute to those kinds of new breakthroughs that will have even more impact in the future compared to if you were doing research 10 or 20 years ago</b>. So I think that <b>now is actually a better time than ever to be doing research</b>, including in deep reinforcement learning.”</em>", "res": {"tag": "推断", "v": "<b>这一页对你的用处是一个<b>定位</b>上的提醒，而它正好回应你可能有的一个顾虑。</b><br><span class='k'>那个顾虑是：<b>「成本优化」听起来像工程优化而不像研究</b> —— 毕竟级联、路由这些东西工业界早就在做了，而你做的事看起来只是把它做细一点</span>。<br><b>⇒ 而这一页的论证形状给了你一个答法：<b>讲者把「做研究」和「做应用」的区别定在<b>产出是不是新知识</b>上，而不是定在题目听起来新不新上</b>。</b><span class='w'>⇒ 所以关键的自检是：<b>你这篇做完之后，世界上会多出一条什么「之前没人知道」的事实？</b></span><br><b>⇒ 按你现在手上的东西，候选答案有三个，而它们的分量差别很大：</b><br><b>① <b>「节点级比工作流级好 X%」</b> —— 这是一个经验事实，有用但不强（它随模型、随工作流变）。</b><br><b>② <b>「在什么条件下节点级才有收益」</b> —— 强得多，因为它是一个<b>可迁移</b>的结论。</b> <span class='k'>⇒ 比如「当工作流里节点的难度方差大时收益大、方差小时收益可忽略」。这种形式的结论别人换个模型也能用。</span><br><b>③ <b>「一个能以 1−δ 排除坏配置的离线准则，而它不依赖分布假设」</b> —— 最强，因为它是一个<b>方法与保证</b>，而且正好对上 p27 那个被点名的公开问题。</b><br><b>⇒ 建议把论文的贡献声明<b>按 ③ → ② → ① 的顺序</b>排，而不是反过来。</b> <span class='w'>⇒ 很多做实验的人会把 ① 放第一（因为它最好量），但那恰恰是最像「工程优化」的那一条。<b>⇒ 把 ③ 放第一，你的工作就从「我们省了钱」变成「我们给出了一个带保证的离线筛选准则，并在省钱这个任务上验证了它」。</b></span><br><b>⚠ 而那句「<b>RL 能用了 = 研究能被转化成影响</b>」对你有一个具体的、也是好消息的含义：<b>你的问题之所以存在，正是因为 agentic 工作流真的被用起来了</b>。</b> <span class='k'>⇒ 三年前没人关心工作流的推理成本，因为没人在生产里跑它们。<b>⇒ 这意味着你的问题有一个真实的、而且在变大的需求方 —— 这在 p34 那个「重要的问题」检查上是一个加分项，而且值得在 intro 的第一段就点出来（用数字：工作流的 token 消耗是单次调用的多少倍）。</b></span><br><b>⇒ 最后，把这一讲整体当成一份清单收起来：<b>前半七问给了你「什么问题值得做」的候选池（p27 是你的 A，p15 和 p19 可以当 B 和 C），后半给了你「怎么做」的流程</b>。</b> <span class='w'>⇒ 而那个流程里对你最紧的两条，现在就该排进日程：<b>p42 的「先用最快的办法测核心未知数」（那个穷举档位组合的下午）＋ p46 的「现在就把问题陈述写成草稿」</b>。<b>⇒ 这两件事都不需要等任何东西就位。</b></span>", "ref": "本讲 p52–p53（逐字核对）· 讲稿（那个担忧与比较级结论、AlphaFold/ChatGPT 的时间对比）· p27 · p34 · p42 · p46 · 简报 §1 §2 §3（已核）"}}

var TH = {"title": "L18 接上课题的哪一段：你的问题被这门课点名列成了公开问题，而后半 25 页给了你一套该怎么往下走的流程", "arc": "<b>这是整门课离课题最近的一讲，而且近得有点不寻常：<b>p27 那个公开问题几乎就是你的课题陈述</b>。前半给了你「这件事值得做」的课程级依据，后半给了你一套可以照着执行的研究流程 —— 而其中两件事现在就该做，不需要等任何东西就位。</b><br><br>⚠️ <b>① <b>p25/p27：你的课题是这门课点名的公开问题</b>，而那个措辞比你自己想的还有利。</b><br><span class='k'>原话：<b>Can we develop offline metrics that can at least <b>rule out bad models</b>, let alone estimate performance?</b> 而讲稿把分量说明白了：「Estimating performance would be the <b>dream</b>. But <b>at the very least</b>, maybe we could rule out models that we shouldn't deploy offline」</span>。<br><b>⇒ 用这一页的语言重述你的工作，这句可以直接进 intro：<b>「在 Acc 可程序化判定的任务上，我们构造了一个能离线排除坏配置的准则，并给出分布无关的保证。」</b></b><span class='w'>它同时命中讲者要的两样东西：<b>离线</b>（不必每个候选都真跑）＋ <b>排除坏的</b>（而不是号称能估准）。</span><br>⚠️ <b>⇒ 而那个「<b>至少</b>」给了你一条该现在就写进目标的<b>退路</b>，而且它对「写 bound」有直接好处：<b>单边的界比双边的界容易证</b>。</b><span class='k'>「以概率 1−δ 排除所有 <code>G</code> 低于阈值的配置」是<b>单边</b>陈述，可以用一致收敛 + 并集界直接做出来；「估计 <code>G</code> 的误差不超过 ε」是双边的，难得多。<b>⇒ 建议主定理就写成这个形状：排除保证（单边、强）＋ 估计精度（双边、作为附带结果）。这样即使后者弱，前者仍然立得住。</b></span><br><br><b>② <b>p14–p15 给了你的实验设定一个有出处的名字：<code>batch online</code></b>，而它一次解决两个麻烦。</b><br><span class='w'>你的搜索不是全在线（不可能每跑一条 query 就更新策略 —— 和自动驾驶「每 30 秒更新一次」一样不现实），也不是纯离线（你确实要跑新配置采新数据）。<b>它正是「攒一大批、更新一次、再重复几轮」</b></span>。<br><b>⇒ 两个麻烦：① 你有了一个文献里有出处的设定名（本讲 p15、Dong et al. 2025），不必自造词；② <b>「我们只更新了少数几轮」从一个妥协变成了一个有名字的设定</b>。</b><br>⚠️ <b>⇒ 而 Dong et al. 那条指出了一个<b>你很可能已经踩了的坑</b>：<b>批量设定下，多样性必须由策略自己提供</b></b> —— 因为你没有「频繁换策略」这个多样性来源。<span class='k'>⇒ 具体后果：<b>如果你采这一批数据时路由策略是确定性的，你采回来的数据只覆盖它「现在」认为对的那些配置，于是你永远看不到「其实降档也行」的证据</b>，策略会卡在一个保守的局部解上，而你从数据里看不出来。<b>⇒ 采集必须刻意带随机性（ε 概率随机换一档，并记录下来 —— 这样这批数据天然带上反事实对比）。</b></span><br><br>⚠️ <b>③ <b>p5 那张偏好图，把 L17 p77 那条警告从「会被钻」升级成了「会往哪个方向钻」</b>，而这是一条该进论文的引文。</b><br><span class='w'>[Sharma &amp; Tong et al., 2023]：人类偏好里排最前的是 <b>Is confident</b>（自信）与 <b>Agrees with me</b>（合我意），而 <b>Is actually true!</b> 排在<b>最底下</b>。而任何用人类偏好训出来的裁判都会继承这个排序</span>。<br><b>⇒ 对你的直接含义：<b>用一个 RLHF 过的模型当节点级裁判，它偏好的是「说得笃定」的中间输出而不是「对的」中间输出 —— 而小模型在吃不住的任务上恰恰容易产出自信而错误的输出</b>。⇒ 于是裁判会系统性地<b>低估</b>降档的风险。</b><br><b>⇒ 可以直接用的句式：<b>「我们不使用 LLM-as-judge 作为奖励信号，因为人类偏好已被证明系统性地偏好自信与附和而非真实性 [Sharma &amp; Tong et al., 2023]，而我们要检测的恰恰是自信而错误的输出。」</b></b><span class='k'>这比泛泛说「可验证奖励更可靠」有力得多 —— <b>它指出了具体的失效方向和一篇具体的证据</b>。</span><br><br>⚠️ <b>④ <b>p22 有一条必须当场落实到代码里的事</b>：<b>如果你打算用模型置信度当路由特征，而模型是 RLHF 过的，那个置信度是不校准的</b>。</b><br><span class='w'>[OpenAI 2023] 那两张图：预训练 GPT-4 校准得很好，<b>PPO 后训练之后就歪了</b>。机制是讲者在问答里给的：<b>RLHF 在削尖分布，而置信度就是分布的尖锐程度</b> —— 削尖直接抬高置信度，准确率却没跟上</span>。<br><b>⇒ 后果：<b>「这个节点的 logprob 很高 ⇒ 小模型 handle 得住 ⇒ 不用升档」这个推理链是坏的</b>，而失效方向又一次对你不利（过度自信 ⇒ 倾向于不升档 ⇒ 省了钱但答错了）。</b><br><b>⇒ 成本最低的应对是<b>先量一下</b>：在你的任务上画一张同样的图（置信度分箱 vs 该箱实际准确率）。<b>一天就能做，而结论无论朝哪边都有用</b></b> —— 校准还行就放心用，歪了就有一张图去解释为什么不用。<span class='k'>⇒ 这正是 p42「把风险前置」的典型例子：<b>一个一天的实验，决定了后面一整条特征要不要做。</b></span>", "pitfalls": [{"v": "⚠️ <b>先搭框架，再测核心未知数。</b> <span class='k'>p42 第 1 条反对的恰恰是最舒服的工作方式，而讲稿把原因说得很诚实：<b>搭基础设施、把算法写出来常常是「容易的部分」，也是「看起来在进步」的那部分</b>；而你要是先做完这些、最后才发现核心未知数不成立，<b>那些时间全白费了 —— 虽然当时看起来像在进步</b></span>。<b>⇒ 你的核心未知数很清楚：<b>节点级到底比「整条工作流统一一档」好多少</b>。⇒ 而它可以用一个下午测出来：取一个工作流、200 条 query、穷举档位组合全部真跑，算「逐 query 节点级最优的 <code>G</code>」减「单一全局最优的 <code>G</code>」。<b>那个差就是你整篇论文的空间，而这个实验不需要任何学习、任何框架。</b></b>", "tag": "推断", "ref": "本讲 p42（逐字核对）· 讲稿（「容易的部分」那段、正弦曲线与左右手两例）· L17 p29 · 简报 §2 §4d"}, {"v": "<b>把主结果押在一个小数点上。</b> <span class='w'>p34 那个反例写的是 <b>A really cool algorithm that will make the robot <b>1% more successful</b></b> ←<em>I'm missing (1)</em> —— 幻灯刻意写了 1%，意思是<b>它的上限太低</b></span>。<b>⚠ 如果你的结果最后是「<code>G</code> 提升了 1.2 个点」，你就正好落在幻灯画的那个反例上。</b><span class='k'>⇒ 所以主结果应当是一个<b>量级</b>上的东西（成本减半而 Acc 基本不掉），而不是一个小数点。<b>⇒ 这反过来提示你该选哪些工作流做实验：选那些「大模型用得最浪费」的，而不是选最常见的。</b>⇒ 而 Step 1 的上限检查现在就能做、不用跑实验：手工标出「哪些节点换小模型肯定没事」，算一下那样的成本占比。</span>", "tag": "推断", "ref": "本讲 p34（逐字核对）· 讲稿（上限那句）· 简报 §2"}, {"v": "⚠️ <b>在一个你其实测不到的量上建方法。</b> <span class='k'>p43 那个故事的转折是：他们在多任务上卡了几个月，简化到单任务去验证时发现 —— <b>连单任务也不行</b>。<b>毛病在最基础那一层</b></span>。<b>⇒ 你的基础层是：<b>「在一个节点上，给定档位，我能可靠地判定它的输出对不对吗？」</b></b><span class='w'>⚠ 而答案很可能是<b>不能</b> —— <b>中间节点的输出往往没有标准答案，只有最终答案有</b>。⇒ 这会直接决定你第一阶段的设计（只能做端到端的信用分配，不能做逐节点的直接监督）。<b>⇒ 先把这件事想透，否则你会在一个测不到的量上建方法，而且是在跑了几个月之后才发现。</b></span>", "tag": "推断", "ref": "本讲 p43（逐字核对）· 讲稿（「连单任务也不行」那个故事）· 简报 §1 §2"}, {"v": "<b>批量采数据时让路由策略保持确定性。</b> <span class='k'>p15 ＋ [Dong et al., 2025]：<b>全在线时策略马上要变，所以确定性一点没关系（多样性来自频繁换策略）；而批量设定下你没有这个奢侈，多样性必须由策略自己提供</b></span>。<b>⚠ 你的版本：确定性路由采回来的数据只覆盖它<b>现在</b>认为对的配置 ⇒ <b>看不到「其实降档也行」的证据</b> ⇒ 卡在保守的局部解上，而你从数据里看不出来。</b><span class='w'>⇒ 做法：<b>以 ε 概率在某个节点随机换一档并记录</b>（更好的是按不确定性采样 —— 在策略最拿不准的节点多探索）。⇒ 顺带这给了你一个很有说服力的消融：<b>确定性采集 vs ε-随机采集，在同样的数据预算下比最终 <code>G</code></b>。差距明显就等于你在一个全新领域<b>复现</b>了 Dong et al. 那条结论。</span>", "tag": "推断", "ref": "本讲 p15（逐字核对）· 讲稿（Dong et al. 那段解释）· 简报 §2 §4d"}, {"v": "⚠️ <b>把模型自报的置信度当成可信的路由特征。</b> <span class='w'>p22 ＋ [OpenAI 2023]：<b>RLHF 让校准变差</b>，机制是<b>削尖分布</b>（而置信度就是分布的尖锐程度）。⚠ 失效方向对你不利：<b>过度自信 ⇒ 倾向于不升档 ⇒ 省钱但答错</b></span>。<b>⇒ 三条应对，按成本从低到高：<b>① 先画一张置信度 vs 实际准确率的图量一下</b>（一天，结论朝哪边都有用）；<b>② 用 [Tian et al. 2023] 那条</b> —— 让模型用语言说出把握并给多个猜测（代价是多一次调用，所以只在可疑节点用）；<b>③ 绕开置信度</b>，改用 L17.d p61 那些免费信号（格式违规、长度异常、自洽性）。</b><span class='k'>⇒ ③ 不依赖模型的自我报告，所以不受校准问题影响 —— 而这又是一次「改问法而不是改模型」（本讲 p12 方案二的同一手）。</span>", "tag": "推断", "ref": "本讲 p22（逐字核对）· 讲稿（削尖分布那段问答）· p12 · L17.d p61 科研格 · 简报 §1 §4b"}, {"v": "<b>只报平均 <code>G</code>，不报左尾。</b> <span class='k'>p23 那一问是 <b>When humans are not in the loop, how can we get to 99.99% reliability?</b> —— 而 agentic 工作流就是为了自动跑完而存在的，<b>所以你站在「人不在回路」那一侧，没有人来兜底</b></span>。<b>⚠ 而你的方法一定会有「省错了」的时候，<b>平均 <code>G</code> 会把这些失败藏起来</b>。</b><span class='w'>⇒ 该报的三个数：<b>① 按任务类型分列的最低 Acc；② 因降档而由对变错的 query 比例；③ 平均延迟</b>（p39 那个「别每次上楼梯都先撞一下」的对应 —— 少一次失败重试就是用户少等一整轮，<b>这是你本来就改善了却容易忘了说的收益</b>）。</span>", "tag": "推断", "ref": "本讲 p23 p39（逐字核对）· L17.c p39 科研格 · 简报 §2 §4d"}, {"v": "⚠️ <b>把贡献按「最好量的」而不是「最强的」排序。</b> <span class='w'>p52 的论证把「研究 vs 应用」的区别定在<b>产出是不是新知识</b>上。⇒ 自检：<b>这篇做完之后，世界上会多出一条什么「之前没人知道」的事实？</b></span><b>⇒ 你手上三个候选，分量差别很大：<b>① 「节点级比工作流级好 X%」</b>（经验事实，随模型随工作流变，最弱、但最好量）；<b>② 「在什么条件下节点级才有收益」</b>（可迁移，强得多 —— 比如「节点难度方差大时收益大」）；<b>③ 「一个能以 1−δ 排除坏配置、不依赖分布假设的离线准则」</b>（方法＋保证，最强，而且正对 p27）。</b><span class='k'>⚠ 很多做实验的人把 ① 放第一，<b>而那恰恰是最像「工程优化」的一条</b>。<b>⇒ 按 ③ → ② → ① 排，你的工作就从「我们省了钱」变成「我们给出了一个带保证的离线筛选准则，并在省钱这个任务上验证了它」。</b></span>", "tag": "推断", "ref": "本讲 p52 p27 p34（逐字核对）· 简报 §1 §3"}, {"v": "<b>等有结果了再开始写。</b> <span class='k'>p46 的定义链：<b>研究的产出是知识 ⇒ 没人知道就等于没有产出</b>。而你手上已经有相当多东西了（设定、两阶段架构、DAgger 那条界的来源、一整套边界声明和基线设计），<b>但它们现在只存在于笔记和脑子里</b></span>。<b>⚠ 更实际的理由不是「早写早好」，而是：<b>写作本身会暴露你的论证漏洞</b>。</b><span class='w'>⇒ 你一旦要动笔写「我们的方法为什么比工作流级好」，就会发现自己需要那个消融的数 —— <b>而那正是你该先做的实验</b>。⇒ 所以「先写草稿」和 p42「把风险前置」是同一个方向：<b>先写，会让你发现哪些未知数是非测不可的。</b></span>", "tag": "推断", "ref": "本讲 p46 p42（逐字核对）· L17 p29 · 简报 §3"}], "ammo": [{"q": "这不就是成本优化吗？这算研究还是算工程？", "a": "<b>我们解的是一个被明确提出的公开问题：<b>RL 里没有可靠的离线指标</b>，而具体的问法是「能不能做出至少能<b>排除坏模型</b>的离线指标」（本讲 p27，Finn 的 CS224R 前沿讲座）。</b><br><span class='k'>我们的贡献按强度排序是：<b>① 一个能以 1−δ 排除坏配置、不依赖分布假设的离线准则</b>（方法＋保证）；<b>② 在什么条件下节点级分配才有收益</b>（一个可迁移的条件，而不是一个数）；<b>③ 在具体工作流上的成本节省</b></span>。<br><b>⇒ 而我们刻意把 ③ 放在最后，因为它是最不可迁移的那一条 —— 它随模型、随工作流变，而 ① 和 ② 不会。</b><br><b>⚠ 关于「简单」我们不回避，而且把它当成设计目标：<b>目标函数只有一个系数、决策是逐节点的二选一、第二阶段是一个标准的监督回归</b>。</b><span class='w'>这是刻意的，因为按同一场讲座 p32 的说法，<b>在一个规模说话的时代，只有简单的东西能被 scale、能被集成进别人的系统、能让别人在上面接着做</b>。⇒ 而这件事我们<b>证明</b>而不只是声称：论文里给出「把本方法接到一个新工作流上需要改什么」的清单。</span>", "tag": "推断", "ref": "本讲 p27 p32 p34（逐字核对）· 讲稿（「至少」那句、简单才能 scale）· 简报 §1 §3"}, {"q": "你的目标函数为什么不用一个更强的模型来当评判？那样不是能覆盖更多任务吗？", "a": "<b>因为用学出来的评判会引入一个<b>已知方向</b>的偏差，而那个方向正好掩盖我们要防的失败模式。</b><br><span class='w'>[Sharma &amp; Tong et al., 2023]（本讲 p5）测过人类偏好：排最前的是<b>自信</b>与<b>合我意</b>，<b>真实性排在最底下</b>。而任何用人类偏好训出来的裁判都会继承这个排序</span>。<br><b>⇒ 我们要检测的恰恰是<b>自信而错误</b>的输出 —— 小模型在吃不住的任务上最典型的失败就是这个。<b>所以那个裁判会系统性地低估降档的风险。</b></b><br><b>⇒ 而这不只是一个猜测：<b>RL 会钻奖励模型的空子，这件事有两个现成的证据</b></b> —— <span class='k'>RLHF 继续调下去模型会完全跑偏；DeepSeek 那篇也报告，不用可验证／规则型奖励的话，RL 迟早开始钻奖励（CS224R L17 p77 点名引用了这两个）</span>。<br><b>⚠ 而被钻的方向对我们格外不利：<b>裁判偏好啰嗦的输出 ⇒ 搜索选出话多的配置 ⇒ token 变多 ⇒ 成本上升，而 <code>G</code> 看起来还变好了</b>。</b><br><b>⇒ 所以我们的 <code>G</code> 完全由可验证的量构成（Acc 来自标准答案、Cost 来自 token 计数），<b>因此不存在奖励模型被利用的风险</b>。我们把裁判留在分析里，不让它进入目标函数。</b>", "tag": "推断", "ref": "本讲 p5（逐字核对）· Sharma &amp; Tong et al. 2023 · L17 p77（RLHF 与 DeepSeek 两个证据）· 简报 §1 §4b"}, {"q": "你只更新了几轮策略，而且在固定的测试集上评估。这个实验设定是不是太弱了？", "a": "<b>这是一个有名字的设定：<b><code>batch online</code></b>（本讲 p15）—— 少数几轮「攒一大批数据 → 更新一次模型」，而它之所以被研究，恰恰因为它是真实系统里唯一可行的那一档。</b><br><span class='k'>讲座里的例子很贴切：一家自动驾驶公司<b>不可能让所有车一起采数据、然后每 30 秒更新一次策略</b>；现实做法是攒几天到一周再更新。而我们的情形一样：每跑一条 query 就更新一次路由策略，成本上不现实</span>。<br><b>⇒ 而我们按这个设定该有的样子做了两件事：</b><br><b>① <b>采集刻意带随机性</b>。</b><span class='w'>[Dong et al., 2025] 指出批量设定下<b>多样性必须由策略自己提供</b> —— 因为你没有「频繁换策略」这个来源。所以我们以 ε 概率随机换档并记录，这样数据天然带反事实对比。<b>而我们报了消融：确定性采集 vs ε-随机采集，同样数据预算下的最终 <code>G</code>。</b></span><br><b>② <b>定量与定性分开报</b>。</b><span class='k'>固定测试集上的结果给数（成功率、<code>G</code>、误差棒、≥3 个种子、按任务类型分列）；真实流量上的观察只说「发生了什么」，不当证据使。</b></span><br><b>⚠ 而我们不用机器人领域那个「真机实验样本量天然小」的借口 —— <b>我们的「真机」几乎不贵</b>，所以真实设定上也给带误差棒的数字。</b>", "tag": "推断", "ref": "本讲 p15（逐字核对）· 讲稿（自动驾驶那段、Dong et al. 的解释）· L17.b p21 科研格 · 简报 §2 §4d"}, {"q": "你的方法会不会把该用大模型的地方也降了档？你怎么知道它是安全的？", "a": "<b>会，而且我们把这件事当成主要指标之一来报，不藏在平均数后面。</b><br><span class='k'>理由是设定决定的：按本讲 p23 的分类，<b>我们站在「人不在回路」那一侧</b> —— agentic 工作流就是为了自动跑完而存在的，<b>没有人来接手</b>。而那一侧的标准是 p23 写的 <b>99.99% 可靠性</b>，以及 [Luo et al. 2024] 那个「跑 100 次成 100 次」</span>。<br><b>⇒ 所以除了平均 <code>G</code>，我们报三个数：<b>① 按任务类型分列的最低 Acc；② 因降档而由对变错的 query 比例（分布的左尾）；③ 平均延迟</b>（因为少一次失败重试就是用户少等一整轮）。</b><br><b>⚠ 而我们也主动报<b>我们的准则漏掉了什么</b>，因为这件事是可以预期的。</b><span class='w'>本讲 p26 那个例子很有教育意义：<b>一家有最强评估团队的公司，离线指标也没抓住「过度谄媚」这个问题，最后不得不回滚</b>。⇒ 所以我们在一小部分配置上做完整的在线评估，看离线排除有没有误杀或漏放，并把这个「<b>离线 vs 在线一致率</b>」当成一个指标报出来。<b>这个数比任何单独的 <code>G</code> 值都更能说明准则可不可信。</b></span>", "tag": "推断", "ref": "本讲 p23 p26（逐字核对）· 讲稿（GPT-4o 回滚、Luo et al. 跑 100 次成 100 次）· 简报 §2 §4d"}, {"q": "这个方向已经有人在做了，你们怎么确保不被抢发？", "a": "<b>我们的策略是<b>在执行与评估上花足够的功夫</b>，而不是赶时间把评估做薄。</b><br><span class='k'>这正是 Finn 在这场讲座的问答里被问到同一个问题时给的回答：<b>抢先做某个想法确实有优势，但把一个项目执行得很好也有很大优势 —— 而且被执行得更好的项目常常比「第一个提出那个想法」的项目更有影响力</b></span>。<br><b>⇒ 具体到我们这里，「执行得好」有三个可核验的落点：<b>① 给出保证而不只是经验结果</b>（那条 1−δ 的排除界）；<b>② 把「什么条件下才有收益」说清楚</b>，而不只报一个数；<b>③ 把负面结果也报出来</b>（我们试过但没用的特征与策略）。</b><br><b>⚠ 而第三条有一个常被低估的作用：<b>一个老实列出负面结果的工作，比一个只报正面结果的工作更可信</b>。</b><span class='w'>而且按同一场讲座 p32 的说法，<b>「这条路我们试过了，不行」本身是一个对社群有价值的产出</b>（它让别人能排除掉已经试过的想法）。</span><br><b>⇒ 另外我们的位置本身有优势：<b>我们把统计那边的工具（分布无关的保证、实验设计）搬到 agentic LLM 工作流上</b>。</b><span class='k'>按 p39 那个故事的机制，<b>跨界的位置恰恰是机会最大的位置</b> —— 做 agent 的人多半不知道有这些工具，做理论的人多半不知道这个问题。</span>", "tag": "推断", "ref": "讲稿（关于被抢发那段课堂问答，逐字核对）· 本讲 p32 p39 · 简报 §1 §3"}, {"q": "你的测试集是怎么选的？它凭什么能代表真实情况？", "a": "<b>这是本讲 p27 的第二个公开问题：<b>How best to select representative real-world scenarios for generalist online policy evaluation?</b> —— 而它本质上是一个<b>实验设计</b>问题。</b><br><span class='k'>⇒ 所以我们不随机抽，而是<b>按设计抽</b>：在配置／任务的特征空间上最小化最大预测方差，也就是 <b>G-最优设计</b>那一套（CSE 541 L07）</span>。<br><b>⇒ 而我们在这里有一个机器人场景<b>没有</b>的便宜，值得点明：<b>我们的候选池是自己枚举出来的、不受状态可达性约束</b>，所以经典的设计解直接适用，不需要近似。</b><br><b>⚠ 另外我们留出了一类<b>训练时完全没出现过</b>的任务类型，单独报它的结果。</b><span class='w'>⇒ 这比在同分布测试集上多刷一个点有说服力得多，而且它检验的正是「这是一个方法，还是一组调好的参数」。⇒ 做法上参考 CS224R L17 那条：<b>那个策略处理了仿真里压根没有的物体，而证明泛化的办法就是故意在测试集里放训练分布里没有的东西</b>。</span>", "tag": "推断", "ref": "本讲 p27（第二问，逐字核对）· CSE 541 L07（G-最优设计）· L17 p67 · 简报 §2 §4d"}], "papers": [{"t": "Sharma, Tong et al. — <b>人类偏好里「自信」与「合我意」压过「真实性」</b>", "id": "2023（本讲 p5 那张图的出处）", "why": "⚠️ <b>这一篇是你论文里「我们不用 LLM-as-judge」那句话的<b>反面引用</b>，建议优先找来读。</b> <span class='w'>它的实验设计很干净：横轴是「<b>其他条件相同时，带某个特征的回答被偏好的概率</b>」—— 一个控制变量设计。而结果是 <b>Is confident</b> 与 <b>Agrees with me</b> 排最前，<b>Is actually true!</b> 排最底下</span><b>⇒ 对你的用法：它把 L17 p77 那条「RL 会钻奖励模型的空子」从「会被钻」升级成了「<b>会往哪个方向钻</b>」—— 而那个方向（偏好自信）正好掩盖你要防的失败模式（小模型自信而错误）。</b><span class='k'>⇒ 这比泛泛地说「可验证奖励更可靠」有力得多，因为它给出了具体的失效方向和一篇具体的证据。</span>"}, {"t": "Dong et al. — <b>批量在线 RL 需要更有表达力的策略</b>", "id": "2025（本讲 p15 点名引用）", "why": "<b>为了给你的实验设定找到正确的名字和正确的做法而读它。</b> <span class='k'>它的结论是：在 <code>batch online</code> 设定下，用<b>扩散策略</b>这类更有表达力的策略类<b>非常关键</b>。而讲者给的解释最值得想通：<b>全在线时策略马上要变，所以确定性一点没关系（多样性来自频繁换策略）；而批量设定下你没有这个奢侈</b></span><b>⚠ 对你的直接含义：<b>如果你的路由策略在采集这一批数据时是确定性的，你就看不到「其实降档也行」的那些配置的证据</b> —— 而这个盲点在数据里是看不出来的。</b><span class='w'>⇒ 做完这个消融（确定性 vs ε-随机，同样数据预算）之后，你等于<b>在一个全新领域复现了一条已知的算法结论</b> —— 而那本身就是一个可报告的发现。</span>"}, {"t": "Tian et al. — <b>用语言说出概率 + 给多个猜测，比读 logits 更校准</b>", "id": "2023（本讲 p22 给出的那个「可能的方向」）", "why": "<b>只在你确实需要置信度特征时才需要它，但值得先知道它存在。</b> <span class='w'>背景是 [OpenAI 2023] 那两张图：<b>预训练 GPT-4 校准得很好，PPO 后训练之后就歪了</b>；而这一篇给的解法是<b>让模型用语言把概率说出来</b>（而不是去读 logits）并<b>要求它给多个猜测</b></span><b>⇒ 对你的用法是有条件的：<b>它要多一次调用，所以只在「可疑的节点」上值得用</b>。</b><span class='k'>⇒ 而更省的替代是绕开置信度，改用 L17.d p61 那些免费信号（格式违规、长度异常、自洽性）—— 它们不依赖模型的自我报告，<b>所以根本不受校准问题影响</b>。⇒ 读这一篇主要是为了<b>知道「置信度不可用」不是绝路</b>，以及在论文里能给出一个有引文的替代方案。</span>"}, {"t": "Rajpurkar &amp; Topol (NYT 2025) · Goh et al. (JAMA 2024) — <b>AI 92% / 医生用 AI 76% / 医生 74%</b>", "id": "2024–2025（本讲 p21 引的那组数）", "why": "<b>读它是为了<b>把你的部署语境说清楚</b>，而不是为了方法。</b> <span class='k'>那组数的教训是：<b>一个要和人一起用的系统，「组件单独的准确率」是一个会骗你的指标</b> —— 加了一个 92% 的助手，只把 74% 的人提到了 76%</span><b>⇒ 对你的用法：它让你能明确地站到<b>另一侧</b> —— 「我们的设定里<b>没有人在回路</b>（agentic 工作流就是为了自动跑完），所以我们额外报告降档引入的失败率」。</b><span class='w'>⇒ 这一句会让审稿人看到你清楚自己系统的部署语境 —— <b>而那恰恰是这组数字在批评的那种疏忽</b>。⇒ 配着 p23 那一问（人不在回路时怎么做到 99.99% 可靠）一起引，你的指标选择就有了依据而不是品味。</span>"}, {"t": "Ball et al. — <b>只灌回放缓冲区、不用预训练权重</b>", "id": "2023（本讲 p10 的那个反例）", "why": "<b>读它是为了那条<b>可迁移的判据</b>，而不是为了具体方法。</b> <span class='w'>它的结果是反直觉的：<b>预训练权重反而比不预训练更差</b>。而讲者给的机制解释很干净：<b>预训练模型的输出层可能已经收敛到相当确定性的分布，于是「那一层探索得不好」</b>；而语言模型之所以是例外，是因为<b>它的输出 token 分布天然很分散</b></span><b>⇒ 判据是：<b>想用预训练权重做 RL 初始化，先看那个模型的输出分布还有没有宽度</b>。</b><span class='k'>⇒ 而对你最具体的用处在<b>采样温度</b>上：如果你第一阶段用 <code>T=0</code> 算「理想档位」，你得到的是一个<b>窄</b>分布下的结果 —— <b>一个在 <code>T=0</code> 下答错、但采五次能对一次的节点，会被错标成「这个档撑不住」</b>。⇒ 所以第一阶段的标签应该是分布层面的（采 k 次有多少次对），而那个不确定性本身又是第二阶段很有用的监督信号。</span>"}, {"t": "Ross, Gordon, Bagnell — <b>DAgger</b>（模仿学习到 no-regret 在线学习的归约）", "id": "AISTATS 2011（本讲没提，但它是 L17 两阶段架构第二阶段的理论来源）", "why": "⚠️ <b>这一篇对你的「写 bound」这条验收标准最直接有用 —— 它和本讲 p27 那条「至少能排除坏模型」是你两条界的两个来源，建议并着读。</b> <span class='w'>DAgger 给的界形如 <code>J(π̂) ≲ J(π*) + O(T·ε_N)</code>，其中 <code>ε_N</code> 是在策略<b>自己诱导的状态分布</b>上的监督损失</span><b>⇒ 对你的意义：<b>你的第二阶段如果写成一个模仿学习问题，界就不用自己造</b>；而界里那个 <code>T</code> 在你这里是<b>工作流的节点数（3–8）</b>，不是机器人的上千步 —— <b>这是一个实打实的便宜，值得在分析里点出来</b>。</b><span class='k'>⇒ 而把它和 p27 那条合起来，你的主定理就有了一个很清楚的形状：<b>排除保证（单边、强，对应 p27 的「至少」）＋ 模仿误差传播（来自 DAgger）</b>。⇒ 这条路比自己硬推一个新界要稳得多，<b>而且审稿人认</b>。</span>"}]};

      bindNav(); return;

    var n=N[i], multi=n.r[0]!==n.r[1], h="";

  function go(p){

    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      // ⚠ 不能换掉 iframe 元素：error/load 两个监听器是初始化时挂上去的，
      //   换元素会把它们孤儿化，「打不开？」面板就再也不会弹，
      //   读者只剩一个空白框、毫无线索（2026-10-23 我就是这么写错的）。
      //   先 about:blank、下一个 tick 再设真地址 —— 同样是新导航，元素不动。
      frame.src="about:blank";
      setTimeout(function(){ frame.src=SRC+HASH; }, 0);
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
