π̃ 该怎么选？讲稿把这个权衡说清了，而且结论是「看模型现在多差」</b>：<span class='w'><em>“imagine for a second that your model is really bad… Then you want a rollout policy that can actually somewhat succeed because, otherwise, there's no notion of a success that you can learn from ever. On the other hand, let's say if your model is kind of decent, like 50% accurate… maybe all you want is just <b>diverse</b> ways of solving the problem, such that you can see what ways you're more prone to failing.”</em></span> <b>⇒ 模型很差时要<b>质量</b>，模型还行时要<b>多样性</b>；讲者说这就是又一个探索/利用权衡</b>。"], "eq": "Option 2：保留 π̃ 的部分 rollout，配成共享前缀的偏好对\n\n  情形一（p21，原解答失败）\n     前缀 ──┬── π̃ 的成功 rollout     ← 优\n            └── 原解答的失败后半段   ← 劣\n\n  情形二（p22，原解答成功）\n     前缀 ──┬── 原解答的成功后半段   ← 优\n            └── π̃ 的失败 rollout     ← 劣\n\n⭐ 两条样本<b>前半段一字不差</b> ⇒ DPO 的梯度只作用在真正有差别的那一小段上\n   （绕开普通 DPO「两条完全不同的回答、分不清哪里好」的归因难题）\n\n与用法一的第二处差别：rollout 的<b>内容</b>被留下来训，不只是用来算优势\n  ⇒ π̃ 从「尺子」变成了「数据源」，它的质量直接进训练集", "tbl": {"head": ["", "用法一：按优势过滤", "用法二：共享前缀的 DPO"], "rows": [["rollout 的角色", "只用来<b>算优势</b>（尺子）", "⭐ 内容也被留下来训（数据源）"], ["训练目标", "过滤后的 SFT（加权最大似然那一族）", "DPO 损失"], ["π̃ 的质量影响", "影响尺子准不准", "⚠ 直接进训练数据"], ["π̃ 该怎么挑", "能区分好坏步骤即可", "模型差时要<b>质量</b>、模型还行时要<b>多样性</b>"]]}, "say": "<b>讲稿里把 Option 2 的算法完整写了一遍，比幻灯清楚，照抄下来就是实现清单</b>：<br><em>“for iteration in 1 to T, I'm going to sample Y1 to N from my current policy, given any question. I am going to now do these rollouts, so I'm going to do rollouts and <b>construct the preference data set D_pref</b>… And now what I'm going to do is I'm going to minimize the [DPO] loss. … And the D_pref consists of prefixes generated from your current base model. And the traces coming from—<b>one part of it is from the same model that you are training π_θ. The other segment, the other part of the preference pair comes from the rollout policy.</b>”</em><br><b>⇒ 一个偏好对里，两条样本来自<b>两个不同的模型</b>：一半是被训的 <code>π_θ</code>，另一半是 <code>π̃</code>。</b><span class='w'>⚠ 这是实现时很容易弄混的一点 —— 它不是「同一个模型采两条」，也不是「人标的偏好」</span>。", "res": {"tag": "推断", "v": "<b>「共享前缀的偏好对」这个构造，落到你的课题上是一个比优势过滤<b>更省</b>的方案，值得单独记一笔。</b> <span class='k'>优势过滤需要把每个格子的 Q 估到足够准（要多次 rollout 才能把 0.25 和 0.0 分开）；而偏好对只需要<b>一次成功、一次失败</b>就能构成一对</span>——<b>它要的是「序」，不是「值」</b>。<b>⇒ 在你这种每次 rollout 都要真金白银的场景里，这个区别可能是决定性的</b>：<span class='w'>把「前 i 个节点固定、第 i 个节点取档位 A 跑通了、取档位 B 跑砸了」直接当成一个偏好对</span>，<b>比「把两个档位的成功率各估准到 ±0.05」便宜一个数量级</b>。⚠ <b>两处要当心</b>：<span class='k'>① 偏好只给出序，<b>给不出</b>「差多少」——而你的目标 <code>G = Acc − λ·Cost</code> 需要的是可比较的<b>量</b>，所以偏好对能用来<b>筛</b>、不能直接用来定 <code>λ</code>；② 这一讲的偏好对两边来自两个不同模型，照搬时要想清楚你那两条分别对应什么</span>。", "ref": "本讲 p20–p22 · 本讲 p17（优势需要把 Q 估准）· 简报 §4d（穷举 oracle 给的是「值」）"}},
{"r": [23, 23], "t": "结果：逐步 DPO 相比只做模仿，给出八倍的数据效率 —— 论文标题里那个数", "star": 2, "quote": "<em><b>Results: Scaling for Offline RL</b></em><br><em>(GSM8K 与 MATH 两张图；图例 <b>SFT Llama2</b> / per-step DPO（橙）· <b>SFT DeepSeek</b> / per-step DPO（蓝）· <b>per-step DPO DeepSeek Pass@5</b>（绿），横轴 #questions 8k–128k)</em><br><em><b>Finding:</b> Using offline RL (via per-step RL) gives <b>8x</b> data efficiency in performance over imitation only.</em>", "one": "<b>这就是论文标题里 <span class='k'>Eight-Fold</span> 的出处：<span class='w'>达到和 SFT 同样的测试误差，逐步 DPO 只要八分之一的题目数</span>。口径仍然是「往左推」，不是「误差低八倍」。</b>", "pts": ["<b>先把图例读清，这张图叠了三组对照。</b> <span class='k'>橙色是 Llama 2（误差约 0.51–0.59，MATH 上 0.79–0.86），蓝色是 DeepSeek V2（约 0.21–0.29，MATH 上 0.58–0.61），绿色是 DeepSeek 的 <b>Pass@5</b>（约 0.08，MATH 上 0.40）</span>；<b>每组都有「SFT 实线 vs per-step DPO 虚线」的对比</b>。", "<b>⚠ 两个模型的绝对误差差了一大截（Llama 2 的 0.59 vs DeepSeek 的 0.29），但<b>八倍</b>这个结论在两者上都成立。</b> <span class='w'>讲稿：<em>“in general, this 8x also holds true for Llama 2 roughly overall”</em></span>。<b>⇒ 结论不依赖于基座模型有多强</b>。", "<b>讲者还顺手提了 Llama 2 这件事本身说明了什么</b>：<span class='k'><em>“this probably tells you how old this work is at this point. It's a year old, but <b>Llama 2 feels like a long time ago</b>.”</em></span> <b>⇒ 读这些数字时要带上「2024 年的模型」这个限定</b>。", "<b>Pass@5 那条绿线是什么意思，讲稿给了定义</b>：<span class='w'><em>“if I gave the model five chances, can it succeed even once out of those five chances?”</em></span>；<b>但他也说这一页不必纠结它</b>：<span class='k'><em>“for this particular result, it doesn't matter so much. The main thing to look at is this 8x boost in data efficiency.”</em></span>", "<b>⭐ 把三个倍数放在一起才看得出 Part 1 的叙事线：<span class='k'>RFT 2 倍 → 逐步 DPO 8 倍 → （在线）PAV 5–6 倍</span>。</b> <span class='w'>讲稿解释了为什么 p23 的图上没画 RFT 那条线：<em>“RFT was 2x for recollection. I removed that line here because it would have been too cluttered.”</em></span>", "<b>⚠ 这三个数不能简单相乘或比大小，因为<b>基准不同</b>。</b> <span class='k'>2 倍和 8 倍都是相对「在人写的参考解上做 SFT」；而 5–6 倍是相对「只有终局 0/1 奖励的在线 RL」（ORM-RL）</span>。<b>⇒ 引用时必须带上「相对什么」</b>。"], "tbl": {"head": ["Part 1 的三个倍数", "相对什么基准", "出处"], "rows": [["RFT 省 <b>2 倍</b>", "在人写的参考解上做 SFT", "讲稿（p10–p11 那段）"], ["逐步 DPO 省 <b>8 倍</b>", "同上（SFT only）", "p23，论文标题的 Eight-Fold"], ["PAV-RL 省 <b>5–6 倍</b>", "⚠ 只有终局 0/1 奖励的在线 RL（ORM-RL）", "p27"], ["⚠ 口径", "都是「达到同样误差需要的数据少几倍」", "不是「误差低几倍」"]]}},
{"r": [24, 24], "t": "在线 RL 的基本配方：就是 0/1 奖励上的策略梯度，一行公式", "star": 2, "quote": "<em><b>Online RL: Basic Recipe with 0/1 rewards</b></em><br><em><b>Key idea:</b> Train with a binary 0/1 reward using policy gradients</em><br><em>E<sub><b>x</b>~𝒟<sub>train</sub>, <b>y</b>~π(·|<b>x</b>)</sub>[ Σ<sub>j</sub> ∇<sub>π</sub> log π(<b>y</b><sub>j</sub>|<b>x</b>, <b>y</b><sub>0:j−1</sub>) · r(<b>x</b>,<b>y</b>) ]</em><br><em>r(x, y) = {0, 1}</em><br><em><b>Can also use other policy gradient methods (PPO, GRPO, etc)!</b></em>", "one": "<b>这一页几乎没有新东西，而这正是它要说的：<span class='k'>把 L03 那条 vanilla 策略梯度原样搬过来，奖励换成 0/1，就是在线 RL 版的推理训练</span>。连 PPO / GRPO 都只是「换一个策略梯度方法」。</b>", "pts": ["<b>把公式和 L03 对一下，形状逐字相同：<code>Σ_j ∇ log π(y_j | x, y_{0:j−1}) · r(x,y)</code>。</b> <span class='k'>左边是逐步的对数似然梯度，右边是整条的回报权重</span>；<b>⇒ 就是「模仿自己的数据，但按回报加权」</b>（<span class='w'>L03 p11 那句话</span>）。", "<b>⚠ 注意右边那个 <code>r(x,y)</code> <b>没有</b>下标 <code>j</code> —— 每一步共用同一个终局奖励。</b> <span class='k'>这正是 L03 p12 那个「好动作被坏结局连坐」的结构</span>；<b>而因果性修正在这里<b>一点忙都帮不上</b>（奖励只在终局，未来奖励就是全部奖励）</b>。<span class='w'>⇒ 这也正是为什么需要 p25 之后的逐步优势</span>。", "<b>讲稿把它和 RFT 的关系讲得很清楚，一句话就分开了两者</b>：<span class='k'><em>“RFT, we were explicitly filtering and training with SFT. But rather than doing this filtering or training with SFT, you can simply run on-policy reinforcement learning because <b>all in this formulation is just state action. There's an MDP. There's a reward and just do RL on top of it.</b>”</em></span>", "<b>⚠ 还有一些工程上的奖励塑形，讲稿提了但幻灯没写</b>：<span class='w'><em>“You can penalize it if it does not produce an answer. You can penalize it if it violates format. There's a bunch of reward-shaping things you can do.”</em></span> <b>⇒ 「没给答案」「格式不对」都可以扣分 —— 回到 p1 那条「奖励机制依赖模型遵守输出格式」</b>。", "<b>⭐ GRPO 是什么，讲稿给了一句很省事的定义，值得记死</b>：<span class='k'><em>“The PPO algorithm uses a learned value function. <b>The GRPO algorithm replaces that learned value function or learned Q-value function with simply this rollout-based estimation of advantages.</b>”</em></span> <b>⇒ GRPO ≈ PPO，但把「学一个值函数」换成「用 rollout 直接估优势」</b>。", "<b>⇒ 于是这一讲前半段那套 rollout 估 Q 的机器，和现在最流行的 GRPO 是<b>同一个零件</b>。</b> <span class='w'>差别只在于：前半段用它来<b>过滤/配对</b>（离线），GRPO 用它来<b>当优势</b>（在线）</span>。"], "eq": "在线 RL 的基本配方（= L03 的 vanilla 策略梯度，奖励换成 0/1）：\n\n  E_{x~𝒟_train, y~π(·|x)}[ Σ_j ∇_π log π(y_j | x, y_{0:j−1}) · r(x,y) ]\n                            └── 逐步的对数似然梯度 ──┘   └ 整条共用的 0/1 ┘\n\n  ⚠ r 没有下标 j ⇒ 每一步共用同一个终局奖励\n     ⇒ L03 的「好动作被坏结局连坐」原样重现\n     ⇒ 而因果性修正在这里帮不上忙（未来奖励 = 全部奖励）\n     ⇒ 这正是 p25 之后要做逐步优势的理由\n\nPPO  → 用一个<b>学出来的</b>值函数\nGRPO → 把那个值函数换成<b>用 rollout 直接估</b>的优势  ← 和前半段是同一个零件", "link": {"t": "你学过的对应：CS224R L03 策略梯度（这一页的公式与那一讲的 vanilla policy gradient 逐字同形。而那一讲里「因果性修正」买到的东西，在这里因为奖励只在终局而完全失效——这正是本讲要造逐步优势的根本理由）", "href": "L03-精读.html"}, "res": {"tag": "推断", "v": "<b>GRPO 那个定义（把学出来的值函数换成 rollout 估的优势）正好给你一条评估 AFlow 的新角度。</b> <span class='k'>简报 §2【已核】已经纠正过「AFlow 的搜索不是 UCT-MCTS」，它是 Boltzmann + uniform 的爬山</span>；<b>而现在可以更进一步地说清它<b>缺</b>的是什么：它既没有学出来的值函数（PPO 那一路），也没有用 rollout 估的优势（GRPO 这一路）——<b>它只有整条 workflow 的终局分数</b></b>。<span class='w'>⇒ 这就把「它为什么没有理论保证」说成了一个结构性的缺口，而不是一句笼统的批评</span>。<b>⇒ 而补上这个缺口的最小改动，正是本讲前半段那套东西：对每个节点做前缀 rollout、估出格子级的优势</b>。<span class='k'>⚠ 但成本账要先算：GRPO 里一次 rollout 是生成几百个 token，你这里一次 rollout 是跑完半条 workflow</span>——<b>所以可行性取决于简报 §4c 能把要探的节点压到多少个，而不是取决于算法本身</b>。", "ref": "本讲 p24 · 简报 §2（AFlow 的选择规则与「没有定理没有证明」）· 简报 §4c（敏感度扫描）"}},
{"r": [25, 26], "t": "在线情形下 rollout 太贵 ⇒ 拟合一个优势预测器；而「用哪个 π̃」成了核心问题", "star": 3, "quote": "<em><b>Per-Step Advantages in Online RL.</b> A solution from <s>base model</s> <b>current π</b></em><br><em><b>Question:</b> Should we do rollouts from π̃ on the fly?</em><br><em><b>Fit a parametric model to advantage predictions</b></em><br><em><b>Approach: Process Advantage Verifiers (PAVs).</b> <b>Key idea:</b> Advantage as dense reward bonus in RL. <b>Challenge:</b> These values [change] once some π̃ are fixed in RL</em><br><em><b>[Informal] Optimal Rollout Policy, π̃</b>: The optimal rollout policy π̃ is one which produces advantages that <b>most effectively distinguish</b> good and bad steps from <em>all</em> π.</em>", "one": "<b>两个变化：① 被评估的不再是固定的基座模型，而是<span class='k'>训练中不断变化的当前策略</span>（讲义把 <code>base model</code> 划掉改成 <code>current π</code>）；② 每一步都现做 rollout 太贵，于是<span class='w'>拟一个网络去预测优势</span>。而这样一来，「<span class='k'>该用哪个 π̃ 当尺子</span>」就从实现细节升级成了核心问题。</b>", "pts": ["<b>p25 那个被红线划掉的 <code>base model</code> 是整页最重要的一处改动。</b> <span class='k'>离线那一半（p18–p22）里，被评估的解答来自固定的基座模型；在线这里，它来自<b>正在被训练的</b> <code>π</code></span>；<b>⇒ 于是同一个前缀的 Q 值会随训练<b>漂移</b></b>。", "<b>这就是 p26 那个 Challenge 说的事（被弹窗遮了一半，但读得出来）：<code>These values [change] once some π̃ are fixed in RL</code>。</b> <span class='w'>⇒ 固定一个 <code>π̃</code> 去打分，而被打分的策略一直在变，两者会越走越远</span>。", "<b>解决「太贵」的办法是把 rollout 换成一个<b>参数化的预测器</b>。</b> <span class='k'>讲稿：<em>“rather than doing these rollouts, you can also potentially do something slightly different, which is basically to <b>train a reward model-like thing to fit to these advantage predictions</b>”</em></span>；<b>⇒ 先用 rollout 造一批「(前缀, 步骤) → 优势」的标注，再拟一个网络，之后就查这个网络</b>。", "<b>⚠ 它和 RLHF 里的奖励模型什么关系？讲稿点明了，而且区别很具体</b>：<span class='w'><em>“this is very similar to some of the RLHF work… except that now this is a reward model that is rewarding <b>every step</b>… as opposed to producing a reward for the whole sequence.”</em></span> <b>⇒ 粒度从「整条」变成「每一步」</b>。", "<b>⭐ PAV 这个名字的三个字母各有出处，讲稿逐个拆了，记住它能省很多查文献的力气</b>：<span class='k'><b>P</b>rocess（逐步给分）· <b>A</b>dvantage（拟的是优势函数）· <b>V</b>erifier（推理领域习惯把奖励模型叫 verifier）</span>。<b>⇒ <em>“if you see that word come up, it's just synonymous to a reward model of sorts.”</em></b>", "<b>⭐ p26 那个非正式定义是这一页的落点，而且措辞要抠：最优的 <code>π̃</code> 是「<b>能让优势最有效地区分好步骤与坏步骤</b>」的那一个，而且要对 <b>所有</b> <code>π</code> 都成立。</b> <span class='w'>⚠ 注意它<b>不是</b>「最强的那个策略」</span>——<b>一个强到什么前缀都能救回来的 <code>π̃</code>，会让所有步骤的 Q 都接近 1，优势全是 0，什么也区分不出来</b>。<span class='k'>⇒ 尺子要的是<b>分辨力</b>，不是本事大</span>。"], "eq": "在线情形的两处变化：\n  ① 被评估的解答来自<b>当前</b> π（不是固定的基座）⇒ Q 值随训练漂移\n  ② 每一步都现做 rollout 太贵 ⇒ 拟一个网络预测优势\n       先用 rollout 造标注「(前缀, 步骤) → 优势」，之后查网络\n\nPAV = Process Advantage Verifier\n  Process   逐步给分（对比 RLHF 的奖励模型：整条给一个分）\n  Advantage 拟的是优势函数\n  Verifier  推理领域对「奖励模型」的习惯叫法\n\n⭐ 最优 rollout 策略 π̃ 的非正式定义：\n   能让优势<b>最有效地区分</b>好步骤与坏步骤的那一个（对<b>所有</b> π）\n   ⚠ 不是「最强的那个」—— 太强的 π̃ 什么前缀都能救回来\n      ⇒ 所有 Q 都接近 1 ⇒ 优势全是 0 ⇒ 什么也分不出来\n   尺子要的是<b>分辨力</b>，不是本事大", "tbl": {"head": ["", "离线那一半（p18–p22）", "在线这一半（p24 起）"], "rows": [["被评估的解答来自", "固定的基座模型", "⚠ <b>当前</b>策略，一直在变"], ["Q 值稳不稳", "稳", "⚠ 随训练漂移"], ["rollout 怎么做", "离线批量做", "太贵 ⇒ 拟一个优势预测器"], ["π̃ 的角色", "尺子 / 数据源", "⭐ 升级成核心设计问题（PAV）"]]}, "res": {"tag": "推断", "v": "<b>⭐ 「尺子要的是分辨力、不是本事大」这一条，直接否掉一个你很可能会做的默认选择。</b> <span class='k'>探测某个节点的贡献时，最自然的做法是「其余节点全用最强的模型」——因为那是「最好的参考」</span>；<b>可按 p26 的定义，这恰恰是<b>最差</b>的尺子</b>：<span class='w'>全强的参考配置很可能把任何一个节点的降级都兜住，于是所有格子的优势都接近 0，你什么也分辨不出来</b>。<b>⇒ 而这不是空想：简报 §5 的止损闸写着「若某 benchmark 上 <code>Acc(全强) − Acc(全弱) < 约 4 个百分点`，该 benchmark 没有 headroom」—— 说的正是同一件事，只是换到了 benchmark 这一层</b>。<span class='k'>⇒ 两条可操作的推论</span>：<b>① 参考配置该挑在「全强」与「全弱」<b>之间</b>的某处，让单个节点的变化真的能改变成败；② 而怎么挑，可以用 p26 的判据来定 —— 让格子优势的<b>方差最大</b>的那个参考配置就是最好的尺子</b>。⚠ <b>这是推断</b>，但它把「参考配置怎么选」从拍脑袋变成了一个有判据的选择，值得在扫描阶段先试两三个。", "ref": "本讲 p26 · 简报 §5（止损闸：Acc(全强) − Acc(全弱) < 4% 则没有 headroom）· 简报 §4c"}},
{"r": [27, 28], "t": "结果：稠密奖励给五到六倍样本效率，而且它真正买到的是「难题上的探索」", "star": 3, "quote": "<em><b>Results: Dense-Reward RL Performance.</b> (两张图：Sample Efficiency (2B) 与 (9B)，图例 <b>ORM-RL</b> 虚线 vs <b>PAV-RL</b> 实线，横轴 Training Iterations) 2B 图上标着 <b>6×</b> 与 <b>7%</b>；9B 图上标着 <b>5×</b> 与 <b>6%</b></em><br><em><b>5-6x</b> sample efficiency than outcome rewards only, <b>6-7%</b> improvement</em><br><em><b>Results: Discovers Solutions to Hard Questions.</b> N = 256 independent trials · Base policy · input (x)</em><br><em>(图：Success Rate on Problems Unsolved by SFT @256，纵轴到 0.15，图例 A<sub>π</sub> 虚线 vs A<sub>π̃</sub> 实线，横轴 N 从 2<sup>1</sup> 到 2<sup>8</sup>)</em><br><em><b>Insight:</b> Specifically, PAVs give <b>exploration</b> crucial for solving hard questions</em>", "one": "<b>p27 给的是效率（5–6 倍、6–7 个百分点），而 p28 才说清这些效率<span class='k'>从哪来</span>：<span class='w'>在 SFT 完全解不出的难题上</span>，用 <code>A_π̃</code> 的成功率爬到 0.15，而用 <code>A_π</code> 只有 0.03 —— 差了五倍。</b>", "pts": ["<b>p27 的对照组要看清：<code>ORM-RL</code> 是「只有终局 0/1 奖励」（Outcome Reward Model），<code>PAV-RL</code> 是「逐步优势当稠密奖励」。</b> <span class='k'>2B 模型上准确率从 0.19 抬到 0.25（+7%，省 6 倍迭代），9B 上从 0.49 抬到 0.55（+6%，省 5 倍）</span>。", "<b>⚠ 讲者对这些绝对数值做了一个诚实的限定，值得记</b>：<span class='w'><em>“these numbers look small, but with 2B and 9B models that we were basing this off of, apparently <b>this is the best result that you can get</b> on certain data sets that we tried this on.”</em></span> <b>⇒ 0.25 的准确率看着低，但在那个规模上是当时的上限</b>。", "<b>⭐ p28 换了一个更能说明问题的度量：<b>只看 SFT 在 256 次尝试下都解不出的那些题</b>。</b> <span class='k'>横轴是尝试次数 <code>N</code>（从 2 到 256），纵轴是在这些难题上的成功率</span>；<b><code>A_π̃</code>（实线）爬到约 0.15，<code>A_π</code>（虚线）只到约 0.03</b>。", "<b>⇒ 讲义给的结论是 <code>PAVs give <b>exploration</b> crucial for solving hard questions</code>。</b> <span class='w'>也就是说，稠密奖励买到的不只是「学得快」，而是「<b>能解出原来解不出的题</b>」</span>——<b>这是一个性质上的差别，不只是效率</b>。", "<b>⚠ 注意这里对比的是 <code>A_π̃</code> 与 <code>A_π</code>，也就是「用<b>不同</b>策略做 rollout」与「用<b>自己</b>做 rollout」。</b> <span class='k'>这正好给了 p15 那条「我认为 rollout 策略应当与当前策略不同」一个实测支撑</span>；<b>⇒ 讲者在讲稿里说过「目前没有同条件的对比实验」，而这张图至少在这一个设定上给出了五倍的差距</b>。", "<b>⚠ 但这张图也有一个要留心的读法：它量的是「在 SFT 解不出的题上」。</b> <span class='w'>这是一个<b>事后筛选</b>出来的子集</span>，<b>所以它不等于「整体准确率提升五倍」</b>。<span class='k'>⇒ 两张图要配着读：p27 给整体（6–7 个百分点），p28 给难题子集（0.03 → 0.15）</span>。"], "eq": "p27（整体效率，对照组 = 只有终局 0/1 奖励的 ORM-RL）：\n  2B 模型   准确率 0.19 → 0.25   +7%，省 6 倍迭代\n  9B 模型   准确率 0.49 → 0.55   +6%，省 5 倍迭代\n  ⚠ 绝对值看着低，但讲者说在那个规模上是当时的上限\n\np28（难题子集，SFT@256 都解不出的那些题）：\n  N = 256 次独立尝试时\n    A_π̃（用<b>不同</b>策略 rollout）   成功率 ≈ 0.15\n    A_π （用<b>自己</b> rollout）       成功率 ≈ 0.03\n  ⇒ 稠密奖励买到的是「<b>能解出原来解不出的题</b>」，不只是「学得快」\n  ⚠ 这是事后筛出的子集，不等于整体提升五倍", "tbl": {"head": ["两张图量的不是一回事", "p27", "p28"], "rows": [["对象", "全部测试题", "⚠ 只看 SFT@256 解不出的那些"], ["对照", "PAV-RL vs ORM-RL（稠密 vs 终局奖励）", "A_π̃ vs A_π（不同策略 vs 自己做 rollout）"], ["结论", "5–6 倍效率、6–7 个百分点", "⭐ 0.03 → 0.15，即「探索」"], ["⇒ 合起来说明", "稠密奖励既提效率，<b>也</b>改变能力边界", "—"]]}, "res": {"tag": "推断", "v": "<b>p28 这种「只看原来解不出的那些」的度量方式，你可以原样借来报告自己的结果，而且它比报平均 <code>G</code> 更有说服力。</b> <span class='k'>对应的做法：把 query 按「全强配置能不能答对」分成两堆，分别报你的 router 在两堆上的表现</span>。<b>⇒ 理由很实在：<b>在「全强都答对」的那一堆上，你的全部价值是省钱（<code>Acc</code> 持平、<code>Cost</code> 下降）；而在「全强也答错」的那一堆上，省钱毫无意义</b></b>。<span class='w'>⇒ 平均 <code>G</code> 把这两种性质完全不同的收益混在了一起</span>，<b>而审稿人多半会问「你到底是省了钱还是提了准确率」——分堆报告直接回答了这个问题</b>。⚠ <b>一处要当心</b>：<span class='k'>p28 那个子集是事后筛出来的，所以它只能用来<b>解释</b>收益从哪来，不能当主指标</b></span>——<b>主指标仍然该是留出集上的 <code>G</code>（而且按 CSE541 L18 p16 的纪律，选与报要用不同的数据）</b>。", "ref": "本讲 p28 · 简报 §3（cost 从不进 score）· 简报 §5（止损闸）· CSE541 L18 p16（用悲观选、用留出报）"}},
{"r": [29, 29], "t": "Part 1 收尾：三句话把「挑战 / 算法 / 结果」说完", "star": 2, "quote": "<em><b>Part 1 Takeaways</b></em><br><em>➤<b>Challenge:</b> Imitating positive data scales (slowly), but it induces spurious steps, that are memorized.</em><br><em>➤<b>Algorithm:</b> Careful, model-specific negative data can help with addressing this issue via offline / online RL</em><br><em>➤<b>Result:</b> Offline RL gives <b>8x</b> sample efficiency vs imitation. Online RL w/ dense advantage reward improves <b>5-6x</b></em>", "one": "<b>三句话里最该抠的是第二句的两个定语：<span class='k'>careful</span>（要会挑）和 <span class='w'>model-specific</span>（要针对<span class='k'>这个</span>模型）—— 它们说明「用上失败数据」不是「把垃圾也倒进去」。</b>", "pts": ["<b>第一句 <code>Imitating positive data scales (<b>slowly</b>)</code>：括号里那个 slowly 对应的是 p10 那两个指数（−0.15 / −0.05）。</b> <span class='k'>后半句 <code>induces spurious steps, that are <b>memorized</b></code> 则是 p11–p12</span>；<b>⇒ 「记住了」这个词很准 —— 不是学偏了，是把多余的步骤当成模式背了下来</b>。", "<b>⭐ 第二句的 <code>careful</code>：负样本不能乱用，要按<b>优势</b>挑。</b> <span class='w'>p18 的做法是「错误解答里优势高的步骤进、正确解答里优势低的步骤不进」</span>，<b>而不是「把所有失败的解答都扔进去训」</b>。<span class='k'>⇒ 没有逐步的信用分配，失败数据只是噪声</span>。", "<b>⭐ <code>model-specific</code> 这个词更要紧，而且讲义只在这里出现过一次。</b> <span class='k'>负样本必须是<b>这个模型自己</b>产出的失败</span>——<b>因为要修的是「它自己会犯的错」</b>。<span class='w'>⇒ 换一个模型，它的 spurious steps 不一样，这批负样本就不对症了</span>。", "<b>⚠ 这一条在实践上有一个直接后果：<b>负样本不能复用</b>。</b> <span class='k'>模型一更新，之前采的失败样本就与当前模型的毛病对不上了</span>；<b>⇒ 这也解释了为什么 p25 要把「被评估的解答」从基座模型改成当前策略</b>。", "<b>第三句把两个数并排放，但基准不同，前面已经抠过：<code>8x</code> 是相对 SFT，<code>5–6x</code> 是相对只有终局奖励的在线 RL。</b> <span class='w'>⚠ 不能读成「8 倍之后再 5 倍」</span>。", "<b>⇒ 整个 Part 1 的逻辑链条到这里闭合了：<span class='k'>数据不够（p3–p4）→ 自己采样能省 2 倍（p10）→ 但过度会退化（p11）→ 病因是多余步骤（p12）→ 用 rollout 估逐步优势（p15–p17）→ 两种用法（p18 / p20–p22）→ 8 倍（p23）→ 在线版与稠密奖励（p24–p27）→ 5–6 倍</span>。</b>"], "tbl": {"head": ["第二句里两个定语各自挡住了什么误用", "定语", "不加会怎样"], "rows": [["要按优势挑，不是全都倒进去", "<b>careful</b>", "没有逐步信用分配，失败数据只是噪声"], ["必须是<b>这个</b>模型自己的失败", "<b>model-specific</b>", "⚠ 换个模型就不对症；也意味着负样本不能复用"]]}, "say": "<b>讲稿里有一问直接问到「这套东西能不能跨数据集迁移」，回答对实验设计很有用，而且幻灯上完全没有</b>：<br><em>“the question is, How generalizable is reasoning? When you train on MATH, does it improve on GSM8K? So it turns out that <b>if you train on MATH, it does not improve on GSM8K.</b> And many people have shown it. But <b>if you train on a bunch of mixture of prompts, which are of varied levels of difficulty, you can actually get there.</b>”</em><br><b>⇒ 两层意思：① 单一数据集上训出来的「推理能力」不迁移 —— 这个否定结论很多人验过；② 而<b>混合不同难度</b>的提示集就能迁移</b>。<span class='k'>他接着说这正是 DeepSeek 那类模型用的配方（“this online recipe is kind of used to train the DeepSeek carbon model”），并补了一句限定：<em>“It doesn't also generalize to every single problem out there, but to a fairly good extent it does.”</em></span><span class='w'>⚠ ⇒ 所以「难度混合」不是调参技巧，是让结论可迁移的必要条件</span>。"},
{"r": [30, 31], "t": "thinking 模型长什么样：一条反复「等一下、换个思路、我再确认一遍」的轨迹", "star": 2, "quote": "<em><b>Part 2: Training “Thinking” Models via RL.</b> Main papers covered: DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning. 2025 · Kimi K1.5: Scaling Reinforcement Learning with LLMs. · <b>[Optional]</b> Optimizing Test-Time Compute requires Solving a Meta-RL Problem. Setlur, Qu, Yang, Zhang, Smith, Kumar. CMU MLD Blog, 2025</em><br><em><b>Example: A Trace From Thinking Models.</b> Problem: James writes a 3-page letter to 2 different friends twice a week. How many pages does he write a year?</em><br><em>&lt;think&gt; … <b>Hmm</b>, let's break this down step by step. First, <b>let me understand the details</b>. […] <b>Wait,</b> if he writes to 2 friends twice a week, does that mean he writes 2 letters each time …? <b>Let me check that.</b> […] <b>Alternatively,</b> maybe it's 3-page letter to 2 different friends each time … so that's 2 * 3 = 6 pages per writing session. Then, twice a week would be 6 * 2 = 12 pages per week. … 12 pages/week * 52 weeks = 624 pages. <b>Is that right?</b> <b>Wait, let me confirm</b>. … <b>That makes sense.</b> But maybe <b>I need to double-check</b> … <b>but some people might account for leap years or something else?</b> … So, conclusion: … So the answer is 624. So I think that's correct. &lt;/think&gt;</em><br><em>Figure from: Marjanović et al. <b>DeepSeek-R1 Thoughtology.</b> arXiv 2025.</em>", "one": "<b>这条轨迹值得一字一句看，因为它把「thinking 模型到底多了什么」摆在了眼前：<span class='k'>它在一道小学算术题上<span class='w'>反复质疑自己</span>、换了两种读题方式、确认了两遍、还顺手担心了一下闰年</span>。整段被包在 <code>&lt;think&gt;…&lt;/think&gt;</code> 里，之后才给答案。</b>", "pts": ["<b>先看题：James 每周两次、每次给 2 个朋友各写一封 3 页的信，一年多少页。</b> <span class='k'>算式其实只有一行：<code>2 × 3 × 2 = 12</code> 页/周，<code>12 × 52 = 624</code></span>。<b>⇒ 这是 GSM8K 难度的题，而模型写了一大段</b>。", "<b>⭐ 真正的内容在那些<b>转折词</b>上，讲义把它们全加粗了。</b> <span class='w'><code>Hmm</code> · <code>let me understand the details</code> · <code>Wait</code> · <code>Let me check that</code> · <code>Alternatively</code> · <code>Is that right?</code> · <code>Wait, let me confirm</code> · <code>That makes sense</code> · <code>I need to double-check</code></span>；<b>⇒ 这些不是语气词，它们标记的是<b>控制流</b>：暂停、重读、换一条路、回头验证</b>。", "<b>其中 <code>Alternatively</code> 那一处最典型：模型发现题目有<b>两种读法</b>（「每次写 2 封」还是「一共 2 封」），于是把第二种也算了一遍。</b> <span class='k'>这正是 p5 那个失败案例的反面 —— 那里的模型卡住时直接断言，这里的模型卡住时<b>换一条路</b></span>。", "<b>⚠ 连那个「闰年」的岔念都值得注意：<code>but some people might account for leap years or something else?</code></b> <span class='w'>它自己提出了一个干扰因素、又自己否掉了（<code>unless specified, we take 52 weeks per year. So that's standard</code>）</span>。<b>⇒ 这是「考虑并排除」，不是「没想到」</b>。", "<b>左边那两个纵向箭头的标注也要看：<code>Thinking Process</code> 占了绝大部分篇幅，<code>Answer</code> 只有最后三行。</b> <span class='k'>⇒ 输出的结构变成了「一大段思考 + 一小段答案」，而奖励仍然只看最后那个框里的数（<code>624</code>）</span>。", "<b>⚠ 这一页也暗含一个成本事实，Part 2 后面会反复用到：<b>这么一道题花掉的 token 比直接作答多一个量级</b>。</b> <span class='w'>p36 会给出实测（AIME 上 token 长度升到约 20000），p33 则会把它写成一个<b>硬约束</b></span>。"], "tbl": {"head": ["那些加粗的转折词各自标记什么", "例子", "在 p35 的分类里叫什么"], "rows": [["回头验证", "Let me check that · Wait, let me confirm · I need to double-check", "Verifications"], ["换一条路", "Alternatively · Wait, if he writes to 2 friends twice a week…", "Backtracking"], ["拆解目标", "let me understand the details · break this down step by step", "Subgoal Setting"], ["⚠ 考虑并排除干扰", "but some people might account for leap years…", "（讲义未单列，属验证的一种）"]]}, "say": "<b>讲稿里讲者给这一段的定性很克制，而且他主动承认这个说法不严格，这个坦白值得留着</b>：<br><em>“what has changed is that <b>the action space in a way has changed</b> for these models, in my opinion. Now, this is a very crude statement to make. And to be really rigorous about it, <b>I think the statement sounds wrong</b> because these models do actually produce token by token one at a time. But these models … can actually produce a solution, maybe go out there and then try to verify the solution they have produced, maybe then backtrack to a particular point and do something else from there. And you can think of this as <b>just yet another version of defining the step</b>.”</em><br><b>⇒ 严格说动作空间没变（还是逐 token 生成），变的是「一步」这个概念能装下多大的东西</b>。<span class='k'>而这正好接回 p14 那条「一步怎么切没有通用定义」—— 现在模型自己把步切得更有结构了</span>。"},
{"r": [32, 32], "t": "到底变了什么：目标函数没变，变的是「一步」能有多大、以及允许写多长", "star": 3, "quote": "<em><b>What Changed?</b> <em>(Disclaimer: this is my version!)</em></em><br><em>➤ <b>The RL training objectives remained the same:</b> DeepSeek-R1 uses <b>GRPO</b>, another policy gradient method · Kimi-1.5 uses some version of <b>APA</b> (advantage-induced policy alignment) · Some minor changes in reward function</em><br><em>➤ <b><em>Crudely</em>, the action space changed:</b> These base models became better at performing “<b>macro</b>” actions, such as revisiting a given answer, verification, backtracking, planning, etc · Crudely, we can now think of operating in this new action space that presents several ”meta” actions</em><br><em>➤ We <b>increased the token budget drastically</b> to chain multiple macro actions</em>", "one": "<b>三条里最要紧的是第一条：<span class='k'>训练目标<b>没变</b></span>。GRPO 也好 APA 也好，都还是策略梯度。真正变的是两件<span class='w'>基座模型侧</span>的事 —— 它能做更大的「一步」，而且被允许写更长。</b>", "pts": ["<b>标题下那行 <code>(Disclaimer: this is my version!)</code> 要先记住。</b> <span class='k'>这一整页是讲者的个人解读，不是 DeepSeek 或 Kimi 的官方说法</span>；<b>⇒ 引用时必须带上这个限定</b>。", "<b>第一条把两个代表模型的算法点了名：<b>DeepSeek-R1 用 GRPO</b>、<b>Kimi-1.5 用某个版本的 APA</b>（advantage-induced policy alignment）。</b> <span class='w'>而讲者对这两个名字的态度很轻描淡写</span>：<span class='k'><em>“You don't need to know what those methods are. Just think of them roughly as <b>policy gradient methods done with slight tweaks</b> overall.”</em></span>", "<b>⇒ 于是 Part 1 那套机器一行都不用改：<span class='k'>GRPO 就是「把 PPO 里学出来的值函数换成 rollout 估的优势」（p24 讲过）</span>。</b> <b>⚠ 这也是整讲 Summary 那句 <code>Still the old recipes and RL ideas are helpful!</code> 的全部依据</b>。", "<b>第二条的 <code>macro</code> / <code>meta</code> 动作，列的四个是：<b>revisiting（回看自己的答案）· verification（验证）· backtracking（回溯）· planning（规划）</b>。</b> <span class='w'>⇒ 和 p31 那条轨迹里的转折词一一对上</span>。", "<b>⚠ 讲者两次用了 <code>crudely</code>，而且在讲稿里把保留说得更明白：严格说动作空间<b>没</b>变（仍然逐 token），变的是「一步」能装下什么。</b> <span class='k'>⇒ 这是一个<b>有用但不严谨</b>的比喻，别当定义用</span>。", "<b>第三条 <code>increased the token budget drastically</code> 是前两条的必要条件。</b> <span class='w'>宏动作要<b>串起来</b>才有用（先答、再验、发现不对、回溯、换一条）</span>，<b>而串起来就需要长度</b>。<span class='k'>⇒ 讲稿：<em>“If I give these models that playground to sample more and more tokens, turns out that RL training algorithms with these two bullet points actually give you much better performance.”</em></span>"], "eq": "What Changed?（讲者个人版本）\n\n  没变：训练目标\n    DeepSeek-R1 → GRPO（= PPO，但用 rollout 估的优势换掉学出来的值函数）\n    Kimi-1.5    → APA（advantage-induced policy alignment）\n    奖励函数只有小改动\n    ⇒ 都还是「略加改动的策略梯度」\n\n  变了：\n    ① 基座模型能做<b>宏动作</b>：回看 / 验证 / 回溯 / 规划\n       ⚠ 严格说动作空间没变（仍逐 token）—— 变的是「一步」能装下什么\n    ② token 预算<b>大幅</b>提高 —— 宏动作要串起来才有用，串起来就要长度\n\n⇒ 整讲 Summary：Still the old recipes and RL ideas are helpful!", "tbl": {"head": ["", "Part 1（经典）", "Part 2（thinking 模型）"], "rows": [["训练目标", "策略梯度 / DPO / 过滤式 SFT", "⭐ <b>一样</b> —— GRPO、APA 都是策略梯度"], ["「一步」是什么", "一个句子（这篇工作的切法）", "一个宏动作（验证 / 回溯 / 规划）"], ["输出长度", "和参考解差不多", "⚠ 大一个量级（p36 实测到约 20000 token）"], ["变化来自哪一侧", "算法", "⭐ <b>基座模型</b>"]]}, "res": {"tag": "推断", "v": "<b>「变的是基座模型，不是算法」这个判断，对你的课题有一条直接的提醒：<span class='w'>你的 router 能做到什么，上限由各档位模型<b>本来就有</b>的能力决定，而不是由路由策略决定</span>。</b> <span class='k'>这一讲的证据是 p35 那张对照图 —— 同样的 RL 配方，一个基座模型长出了验证与回溯行为并持续改进，另一个<b>什么行为都没长出来、而且在 RL 过程中完全不提升</b></span>。<b>⇒ 落到你这里：如果某个节点上弱模型<b>根本不具备</b>所需能力，那么无论怎么调 <code>λ</code>、怎么优化分配，那个格子都只能用强的</b>。<span class='w'>⚠ 这意味着「哪些格子有得选」本身是一个需要先测的事实，而不是优化过程会自动发现的东西</span> —— <b>而简报 §4c 的敏感度扫描正是在测这件事</b>。<span class='k'>⇒ 可以把扫描结果直接写成一张「这个节点上弱模型行不行」的二值表，再在<b>剩下的</b>格子上做优化；这比在全空间上优化既便宜又好解释</b></span>。", "ref": "本讲 p32、p35 · 简报 §4c（敏感度扫描，只保留 top 3–4 个随机化节点）"}},
{"r": [33, 34], "t": "⭐ 形式化：在「每题的算力预算」这个硬约束下最大化准确率", "star": 3, "quote": "<em><b>Formulation: Training Thinking Models via RL.</b> Let's start from the final goal</em><br><em>max<sub>π</sub> E<sub><b>x</b>~𝒟<sub>test</sub></sub>[ E<sub><b>z</b>~π(·|<b>x</b>)</sub>[ r(<b>x</b>,<b>z</b>) ] ]</em><br><em>on test problems · response sampled from model (longer than typical solution) · <b>Total compute constraint per problem</b></em><br><em>max<sub>π</sub> E<sub><b>x</b>~𝒟<sub>test</sub></sub>[ E<sub><b>z</b>~π(·|<b>x</b>)</sub>[ r(<b>x</b>,<b>z</b>) ] ]　<b>s.t. ∀x, E<sub>π(·|x)</sub>|<b>z</b>| ≤ C<sub>0</sub></b>　— <b>This compute budget is fixed!</b></em><br><em>⇒ max<sub>π</sub> E<sub><b>x</b>~𝒟<sub>train</sub></sub>[ E<sub><b>z</b>~π(·|<b>x</b>)</sub>[ r(<b>x</b>,<b>z</b>) ] ] s.t. …</em><br><em><b>Can optimize this via:</b> RL (like DeepSeek-R1): outcome-reward RL · SFT / RFT: collect data, filter by correctness, maximize likelihood</em>", "one": "<b>这是整讲最该抄下来的一个式子，而且它的形状很特别：<span class='k'>目标是准确率，<span class='w'>算力不是目标的一部分，是一条约束</span></span> —— <code>∀x, E|z| ≤ C₀</code>，而且讲义特意标了 <code>This compute budget is fixed!</code>。</b>", "pts": ["<b>先看没有约束的版本（p33）：<code>max_π E_{x~𝒟_test}[ E_{z~π(·|x)}[ r(x,z) ] ]</code>。</b> <span class='k'>三个彩色标注分别说明三件事：绿色「在测试题上」、蓝色「从模型采的回答（<b>比通常的解答更长</b>）」、橙色「每题的总算力约束」</span>。<b>⇒ 橙色那一条在 p33 只有文字，p34 才写成公式</b>。", "<b>⭐ 约束的形式要抠清楚：<code>∀x, E_{π(·|x)}|z| ≤ C₀</code> —— 是<b>逐题</b>的（<code>∀x</code>）、对<b>长度的期望</b>设上限。</b> <span class='w'>不是「总预算」，也不是「平均长度」在题目上再平均一次</span>；<b>⇒ 每一道题都不许超</b>。", "<b>⚠ <code>This compute budget is fixed!</code> 这个感叹号在强调：<code>C₀</code> 是<b>给定</b>的，不是优化出来的。</b> <span class='k'>⇒ 于是问题变成「给你这么多算力，怎么花最划算」，而不是「该花多少算力」</span>。", "<b>第二步（p34 的绿箭头）是一个很常规但必须点明的替换：<code>𝒟_test → 𝒟_train</code>。</b> <span class='w'>真正想要的是测试集上的期望，但只能在训练集上优化</span>；<b>⇒ 这是标准的经验风险最小化那一步，讲义用一个箭头带过</b>。", "<b>⭐ 讲义把这个目标称作 <code>Let's start from the final goal</code>，而它真正的价值在于<b>把「想得更久」变成了一个有约束的优化问题</b>。</b> <span class='k'>⇒ 之前（Part 1）优化的是「答对率」；现在优化的是「<b>固定算力下的</b>答对率」</span>。<b>两者的最优解可以完全不同</b>。", "<b>最后给的两条优化途径都不新鲜：<b>outcome-reward RL</b>（DeepSeek-R1 那一路）与 <b>SFT / RFT</b>（采数据、按正确性过滤、最大化似然）。</b> <span class='w'>⇒ 又一次印证 <code>Still the old recipes</code></span>——<b>新的是<b>问题的形状</b>（带约束），不是解法</b>。"], "eq": "最终目标（p33，无约束版）：\n  max_π  E_{x~𝒟_test}[ E_{z~π(·|x)}[ r(x,z) ] ]\n         └ 测试题 ┘  └ 模型采的回答（比通常解答更长）┘\n\n加上算力约束（p34）：\n  max_π  E_{x~𝒟_test}[ E_{z~π(·|x)}[ r(x,z) ] ]\n         s.t.  ∀x,  E_{π(·|x)}|z| ≤ C₀        ← ⭐ 逐题的长度上限，而且 C₀ 是给定的\n\n替换成可优化的形式：\n  max_π  E_{x~𝒟_train}[ … ]  s.t. …          ← 𝒟_test → 𝒟_train\n\n怎么解：outcome-reward RL（DeepSeek-R1 那一路）· SFT / RFT（采、滤、最大化似然）\n⇒ 新的是<b>问题的形状</b>（带约束），不是解法", "tbl": {"head": ["", "Part 1 的目标", "⭐ Part 2 的目标"], "rows": [["最大化什么", "答对率", "答对率"], ["算力的角色", "没出现", "⭐ 一条<b>硬约束</b>：∀x, E|z| ≤ C₀"], ["约束的粒度", "—", "<b>逐题</b>（∀x），不是总预算"], ["C₀ 怎么定", "—", "⚠ <b>给定</b>，不优化（This compute budget is fixed!）"], ["问的问题", "怎么答得更对", "⭐ <b>给你这么多算力，怎么花最划算</b>"]]}, "res": {"tag": "推断", "v": "<b>⭐⭐ 这个式子与你的 <code>G = Acc − λ·Cost</code> 是同一个问题的<b>两种标准写法</b>，而且这一页给的是<b>约束型</b>那一种 —— 这件事值得在论文里专门处理一下。</b> <span class='k'>约束型：<code>max Acc  s.t. Cost ≤ C₀</code>；惩罚型（你现在用的）：<code>max Acc − λ·Cost</code>。<b>后者正是前者的拉格朗日松弛</b>，而 <code>λ</code> 就是那条约束的乘子</span>。<b>⇒ 三条可以直接用的推论</b>：<span class='w'>① <b>「λ 该取多少」这个尴尬问题有了一个有原则的答案</b> —— 不用拍脑袋，先定一个你真正在乎的预算 <code>C₀</code>（比如「每条 query 平均不超过 X 分钱」），再去解出对应的 <code>λ</code>；这比扫一遍 <code>λ</code> 再挑一个好看的更容易向审稿人解释</span>；<b>② ⚠ 但两者<b>不完全等价</b>：惩罚型只能达到 Pareto 前沿上的<b>凸</b>部分，前沿若有凹陷，那一段无论 <code>λ</code> 取什么都取不到 —— 而配置空间离散时凹陷很常见</b>；<span class='k'>③ 这一页的约束是<b>逐题</b>的（<code>∀x</code>），而你的 <code>G</code> 是在 query 上平均的 —— 两者差别很大：逐题约束不允许「在简单题上省下来、补贴难题」，而平均约束允许，<b>后者恰恰是 node-level 自适应分配的全部价值所在</b></span>。<b>⇒ 所以你该明确主张用<b>平均</b>约束，并说明理由。</b>", "ref": "本讲 p33–p34 · 简报 §3（AFlow 报告 Acc/Cost 权衡但从不优化它）· 简报 §4d（穷举 oracle 给出精确的 Pareto 点）"}},
{"r": [35, 35], "t": "⚠ 同一套配方，有的基座模型长出了验证与回溯，有的什么都没长出来", "star": 3, "quote": "<em><b>“Action” Space: Incorporating Meta Strategies.</b> A contrast in behaviors explored by the two models</em><br><em><b>Verifications</b> “Let me check my answer …” · <b>Subgoal Setting</b> “Let's try to get to a multiple of 10” · <b>Backtracking</b> “Let's try a different approach, what if we …” · <b>Backward Chaining</b> “Working backwards, 24 is 8 times 3”</em><br><em>(左图：average count 随 RL steps 变化，Verifications 冲到约 11–12、Backtracking 约 8–9，之后回落)　(右图：<b>no behaviors shown</b>)</em><br><em><b>This model does not improve during RL</b></em><br><em>Gandhi et al. <b>Cognitive Behaviors that Enable Self-Improving Reasoners.</b> arXiv 2025.</em>", "one": "<b>这一页是整个 Part 2 最有分量的一张实证：<span class='k'>同样的 RL 配方，一个基座模型在训练中长出了大量验证与回溯行为</span>，另一个<span class='w'>一条都没有 —— 而且它在整个 RL 过程中完全不提升</span>。⇒ <b>RL 能不能起作用，先由基座模型决定。</b></b>", "pts": ["<b>四种行为先记住，它们是 p31 那条轨迹的分类学版本：</b> <span class='k'><b>Verifications</b>（回头检查答案）· <b>Subgoal Setting</b>（设中间目标，如「先凑到 10 的倍数」）· <b>Backtracking</b>（换一条路）· <b>Backward Chaining</b>（倒着推，如「24 是 8 的 3 倍」）</span>。", "<b>左图读法：横轴是 RL 步数（0 到 250），纵轴是每条回答里这类行为的平均出现次数。</b> <span class='w'>Verifications（蓝）在约第 50–60 步冲到 <b>11–12</b> 次，Backtracking（橙）到 <b>8–9</b> 次；而 Subgoal Setting 与 Backward Chaining 几乎贴着零</span>。", "<b>⚠ 一个容易看漏的细节：那两条曲线在约第 150 步之后<b>回落到接近零</b>。</b> <span class='k'>也就是说这些行为是<b>先涨后消</b>的，不是一路增长</span>；<b>⇒ 讲义没有解释这个回落，但它很可能意味着模型后来找到了更直接的解法、不再需要反复验证</b>。<span class='w'>⚠ 这属于我的读图推测，讲义与讲稿都没说</span>。", "<b>⭐ 右图才是重点：另一个模型<b>四条线全贴着零</b>，讲义直接标 <code>no behaviors shown</code>，旁边一行大字 <code>This model does not improve during RL</code>。</b> <b>⇒ 两件事同时发生：没有这些行为，而且 RL 不起作用</b>。", "<b>讲稿把这个因果说得比幻灯更直接</b>：<span class='k'><em>“if you do a counterfactual experiment where you take models which are not capable of implementing like basic answer-checking or verification or generating a better answer, it turns out that <b>you cannot do good RL with them right now</b>.”</em></span>", "<b>⇒ 于是整个 Part 2 的论点闭合了：<span class='k'>算法没变（p32），变的是基座模型能采出什么样的「步」；而<b>采不出那些步的模型，这套算法救不了</b></span>。</b> <span class='w'>⚠ 注意这也给 L03 那条「策略梯度只在采样到的行为之间重新分配概率、采不到的鼓励不了」提供了一个大规模的实证</span>。"], "eq": "四种元策略（Gandhi et al. 2025）：\n  Verifications      「Let me check my answer …」          回头检查\n  Subgoal Setting    「Let's try to get to a multiple of 10」 设中间目标\n  Backtracking       「Let's try a different approach …」    换一条路\n  Backward Chaining  「Working backwards, 24 is 8 times 3」  倒着推\n\n同一套 RL 配方，两个基座模型：\n  左：Verifications 冲到 11–12 次（约第 50–60 步）、Backtracking 8–9 次\n      ⚠ 约第 150 步后回落到接近零\n  右：<b>no behaviors shown</b> + <b>This model does not improve during RL</b>\n\n⇒ RL 能不能起作用，先由<b>基座模型</b>决定\n   讲稿：采不出验证 / 检查答案这些行为的模型，「you cannot do good RL with them」", "link": {"t": "你学过的对应：CS224R L03 策略梯度（那一讲有一问「这会鼓励机器人向前滚吗」，答「这批数据里没有滚，它就鼓励不了；有的话就能」。这一页是同一条性质在语言模型上的大规模实证——基座模型采不出验证与回溯，RL 就无从鼓励它们，于是整个训练过程不提升）", "href": "L03-精读.html"}, "res": {"tag": "推断", "v": "<b>这一页给你一条很实在的实验纪律：<span class='w'>在比较不同档位之前，先确认弱档位<b>具备</b>那个节点所需的能力</b></span>，否则你测到的不是「性价比」，是「它根本不会」。</b> <span class='k'>对应关系：右边那个「没有行为、RL 也不提升」的模型，就是你场景里「这个节点上 7B 根本做不了」的情形</span>；<b>⇒ 在那种格子上，<code>Acc</code> 的差不是一个可以用 <code>λ</code> 去权衡的连续量，而是一个<b>硬性的不可行</b></b>。<span class='w'>⚠ 把这类格子混进优化问题里，会让拟合出来的 <code>Acc</code> 模型在那一段严重非线性 —— 而线性正是 CSE541 L07 标着「待检验」的那条前提</span>。<b>⇒ 两条推论</b>：<span class='k'>① 简报 §4c 的敏感度扫描应当<b>同时</b>产出两张表 —— 一张「降档的准确率跌幅」（连续量），一张「这个格子弱档位可不可行」（二值）；② 优化只在可行的格子上做，不可行的直接钉死</span>。<b>这既省预算，又让线性假设在剩下的格子上更站得住。</b>", "ref": "本讲 p35 · 简报 §4c（敏感度扫描）· 简报 §5（可加性检验）· CSE541 L07 主线卡（线性是待检验的前提）"}},
{"r": [36, 36], "t": "RL 训练会把回答越写越长 —— 而且长度与准确率同步上升", "star": 2, "quote": "<em><b>Longer Length: RL Training Amplifies Length</b></em><br><em>(八个基准各一张图：AIME2024 · ChatGLMMath · GAOKAO · GPQA · Biology · Chemistry · Physics · KAOYAN。每张图两条线：<b>Performance</b>（蓝，左轴 Accuracy）与 <b>Token Length</b>（橙，右轴），横轴 Iterations 到约 150)</em><br><em><b>Why?</b></em><br><em>Kimi team. <b>Kimi 1.5 Technical Report.</b> arXiv 2025.</em>", "one": "<b>八张图说的是同一件事：<span class='k'>随着 RL 迭代，准确率在涨，<span class='w'>token 长度也在涨</span></span>，两条线几乎同步。讲义只问了一个字：<span class='k'>Why?</span> —— 而且<span class='w'>没有在这一页回答</span>。</b>", "pts": ["<b>先确认这不是单个基准上的偶然：八个基准（AIME2024、ChatGLMMath、GAOKAO、GPQA、生物、化学、物理、考研）<b>全都</b>呈现同样的同步上升。</b> <span class='k'>以 AIME2024 为例：准确率从约 0.13 爬到约 0.5，token 长度爬到约 20000</span>。", "<b>⚠ 要注意这<b>不是</b>「训练目标里奖励了长度」。</b> <span class='w'>奖励仍然是 0/1 的答对与否</span>；<b>⇒ 长度是<b>自己涨上去的</b>，这正是讲义问 <code>Why?</code> 的原因</b>。", "<b>这个现象与 p9 那个问答直接呼应，可以把两处接起来读。</b> <span class='k'>那里有人问「RFT 会不会逼模型说废话」，讲者答：不会刻意鼓励冗长，<b>但如果成功的轨迹恰好需要更长，它就会把长度学进去</b></span>。<b>⇒ 这八张图就是那句话在大规模训练下的结果：难题上成功的轨迹确实更长</b>。", "<b>⚠ 但这里有一个必须自己绷住的区分：<b>相关不等于因果</b>。</b> <span class='w'>「长度涨 + 准确率涨」不等于「因为写得长所以答得对」</span>；<b>也可能是「学会了验证与回溯 ⇒ 答得更对，而验证与回溯顺带占字数」</b>。<span class='k'>⇒ p35 那四种行为正好是这个解释的候选机制</span>。", "<b>⇒ 而这也解释了 p33 为什么要把算力写成<b>约束</b>：如果不设上限，优化过程会自然地把长度推上去。</b> <span class='w'>⚠ 讲义在这一页留的 <code>Why?</code> 实际上在 p41 的第三个框里有部分回答（<code>Gap grows as √H</code>）</span>。", "<b>⚠ 讲稿在对应位置没有展开这张图，讲者说要跳过一些细节（<em>“I'm going to skip some of these things”</em>）。</b> <span class='k'>⇒ 所以这一页的解释多半要去 Kimi 1.5 技术报告原文里找，不能指望讲稿</span>。"], "tbl": {"head": ["「长度涨」的两种解释", "说的是什么", "这一页能不能区分"], "rows": [["写得长 ⇒ 答得对", "长度本身带来收益", "⚠ 不能"], ["⭐ 学会验证/回溯 ⇒ 答得对，而它们占字数", "长度是副产品", "⚠ 不能 —— 但 p35 给了这个机制的证据"], ["⚠ 共同的事实", "奖励里<b>没有</b>鼓励长度，长度是自己涨的", "能 —— 这是确定的"]]}, "res": {"tag": "推断", "v": "<b>「不设上限，优化就会把算力推上去」这条在你的场景里有一个更尖锐的版本：<span class='w'>如果只以 <code>Acc</code> 为目标，搜索过程会自然地收敛到<b>全用最强模型</b></span>。</b> <span class='k'>而简报 §3【已核】记着 AFlow 正是这样 —— Executor 同时返回 score 和 cost，<b>但 cost 从不进入 score</b>，成本只出现在事后的 Pareto 图里</span>。<b>⇒ 这一页给了那条批评一个来自另一个领域的佐证：<b>只要目标里没有算力，算力就会被耗尽</b>，这不是实现疏忽而是优化的必然</b>。<span class='w'>⚠ 顺带还有一条更微妙的提醒：这八张图说明「长度」与「准确率」高度相关，所以如果你用 token 数当 <code>Cost</code> 的代理，<code>Acc</code> 与 <code>Cost</code> 之间会有很强的正相关</span>——<b>⇒ 在拟合 <code>G</code> 时这两项不是独立的，报告时要把这个相关性说清楚，否则「省了成本又没掉准确率」这种结论会显得可疑</b>。", "ref": "本讲 p36、p33 · 简报 §3（cost 从不进入 score）"}},
{"r": [37, 39], "t": "测试期扩展：同一个模型想得更久，可能比换一个更大的模型更划算", "star": 3, "quote": "<em><b>A New Paradigm: Test-Time Scaling</b></em><br><em>(p37) Language model ← input problem (x)，输出若干 token</em><br><em>(p38) <b>Bigger language model</b> ← 同样的输入，同样长度的输出</em><br><em>(p39) 左：<b>Bigger language model</b>　右：<b>Language model</b>（原尺寸）但输出长得多 —— <b>longer responses, “more thinking”, self-correction, etc.</b></em><br><em>Snell et al. <b>Scaling LLM Test-Time Compute Optimally can be more Effective than Scaling Model Parameters.</b> ICLR 2025 (Oral).</em>", "one": "<b>三页是一个动画，摆出一道选择题：<span class='k'>同样多的算力，是拿去<b>把模型做大</b>，还是拿去<b>让原来的模型多想一会</b></span>？论文标题就是答案 —— <span class='w'>后者「可以比」前者更有效</span>。</b>", "pts": ["<b>三帧的差别只有一处，要盯住：p37 是普通模型、普通长度；p38 换成 <code>Bigger language model</code>、长度不变；p39 把两者并排 —— 右边是<b>原尺寸</b>模型但输出长得多。</b> <span class='k'>⇒ 两种花钱方式，同一个预算</span>。", "<b>p39 右上角那行注解把「多想一会」具体化了：<code>longer responses, “more thinking”, self-correction, etc.</code></b> <span class='w'>⇒ 不是单纯把输出拉长，而是<b>用那些长度去做验证与自我纠错</b></span>——<b>正是 p35 的四种行为</b>。", "<b>⚠ 论文标题的措辞要抠：<code><b>can be</b> more Effective</code>，不是「总是更有效」。</b> <span class='k'>⇒ 这是一个条件性结论</span>；<b>而讲义在这三页上<b>没有</b>给出条件是什么</b>。<span class='w'>⚠ 要用这个结论必须回去查原文</span>。", "<b>⭐ 这个对比之所以重要，是因为它把「模型大小」和「推理长度」放进了<b>同一个预算</b>里比较。</b> <span class='k'>在此之前，这两件事通常分属「训练」和「推理」两本账</span>；<b>⇒ 合成一本账之后，「该买哪一边」才成为一个可以回答的问题</b>。", "<b>⚠ 这个合账在实践上有一个不对称，讲义没提但很要紧：<b>模型大小是一次性选择，推理长度是逐题可调的</b>。</b> <span class='w'>⇒ 后者天然支持「难题多花、简单题少花」，而前者不支持</span>；<b>这正是 p33 那个逐题约束 <code>∀x, E|z| ≤ C₀</code> 的意义所在</b>。", "<b>⇒ 到这里 Part 2 的三块拼起来了：<span class='k'>有了宏动作（p32/p35）→ 用更长的预算把它们串起来（p36）→ 而这个预算该怎么花，就是 test-time scaling 这个新问题（p37–p39）</span>。</b>"], "eq": "同一个预算，两种花法：\n\n  p38  Bigger language model  ← 输入 x，输出普通长度\n       └ 钱花在<b>模型大小</b>上（训练期，一次性）\n\n  p39  Language model（原尺寸） ← 输入 x，输出长得多\n       └ 钱花在<b>推理长度</b>上（测试期，<b>逐题可调</b>）\n          longer responses, “more thinking”, self-correction\n\n论文标题：Scaling Test-Time Compute Optimally <b>can be</b> more Effective\n           than Scaling Model Parameters\n  ⚠ can be —— 条件性结论，而这三页没给条件\n\n⭐ 关键的不对称（讲义未提）：模型大小是一次性选择，推理长度<b>逐题可调</b>\n   ⇒ 后者天然支持「难题多花、简单题少花」", "tbl": {"head": ["", "把模型做大", "⭐ 让模型多想一会"], "rows": [["钱花在哪一期", "训练期", "测试期"], ["能不能逐题调", "⚠ 不能 —— 一次性选择", "<b>能</b>"], ["多出来的算力用来做什么", "更强的单步能力", "验证 / 自我纠错 / 换思路"], ["这一讲的立场", "—", "「<b>可以</b>」更有效（条件未给，要查原文）"]]}, "res": {"tag": "推断", "v": "<b>⭐ 这三页把你的课题放进了一个更大的坐标系里，而且你处在一个<b>没被这篇论文覆盖</b>的位置上 —— 这件事本身就可以写进 related work。</b> <span class='k'>Snell 等人比的是「模型大小 vs 推理长度」这两种花法；而你比的是第三种：<b>同一条 workflow 里，把预算<b>在节点之间</b>重新分配</b></span>。<b>⇒ 三者是同一笔账的三种花法，而第三种的特点是<b>粒度更细</b></b>：<span class='w'>模型大小是整体一次性的、推理长度是逐题的、而节点级档位是<b>逐题 × 逐节点</b>的</span>。<b>⇒ 这给了你一句很干净的定位话术：<b>test-time scaling 问「这道题该花多少」，node-level fidelity assignment 问「这些钱该花在哪一步」</b></b>。<span class='k'>⚠ 而且两者可以叠加，不冲突 —— 这比把自己摆成它的竞争者更有说服力</span>。⚠ <b>但要留意 p33 那条约束的粒度</b>：<span class='w'>这一讲用的是<b>逐题</b>约束（<code>∀x</code>），而「难题多花、简单题少花」需要的是<b>平均</b>约束</span>——<b>两者的最优解不同，你主张哪一个要明说</b>。", "ref": "本讲 p33、p37–p39 · 简报 §1（AFlow 固定 M，node-level 是它放弃的那一维）· 简报 §8（inference-time search）"}},
{"r": [40, 41], "t": "成绩与未竟之问：三个框里最值钱的是「差距随 √H 增长」", "star": 3, "quote": "<em><b>Results: Thinking Models Top the Leaderboards!</b></em><br><em>Codeforces Competition Code (ELO): o1 <b>1891</b> · o3-mini <b>2073</b> · o3 (with terminal) <b>2706</b> · o4-mini (with terminal) <b>2719</b></em><br><em>Humanity's Last Exam, Expert-Level Questions Across Subjects (Accuracy %): o1-pro 8.12 · o3-mini 13.40 · o3 (no tools) 20.32 · o3 (python + browsing tools) 24.90 · o4-mini (no tools) 14.28 · o4-mini (with python + browsing) 17.70 · <b>Deep research 26.60</b></em><br><em>AIME 2024 (Pass@1): <b>DeepSeek-R1 79.8</b> · OpenAI-o1-1217 79.2 · DeepSeek-R1-32B 72.6 · OpenAI-o1-mini 63.6 · DeepSeek-V3 39.2</em><br><em><b>But Lots of Interesting Questions Remain!</b></em><br><em><b>Desiderata and Formulation.</b> Learning “how”: Train algorithm A<sub>θ</sub>(x) to spend <b>extra test compute</b>, search over <b>responses</b> &amp; discover the <b>final answer</b>. <b>Summary:</b> Pose it as an adaptation problem</em><br><em><b>Ingredient 1: Dense rewards.</b> <b>Summary:</b> More than outcome reward needed</em><br><em><b>Ingredient 2: RL ≫ SFT.</b> Gap grows as √H · scaling test-time compute H, #training data n = Ω(H) · <b>Summary:</b> Use reward signals for training</em>", "one": "<b>p40 给数字（DeepSeek-R1 在 AIME 2024 上 <span class='k'>79.8</span> 对 o1 的 79.2），p41 给未竟之问。三个框里最该带走的是第三个：<span class='w'>RL 相对 SFT 的差距随 <code>√H</code> 增长</span> —— 测试期算力越大，蒸馏越追不上。</b>", "pts": ["<b>p40 的三组数要分开读，因为它们量的东西不同。</b> <span class='k'>① Codeforces ELO：o1 的 1891 到 o3（带终端）的 2706，<b>跨了 800 分</b>；② Humanity's Last Exam：最高是 Deep research 的 26.60%，<b>仍然很低</b>；③ AIME 2024 Pass@1：DeepSeek-R1 79.8 略高于 o1-1217 的 79.2</span>。", "<b>⚠ 第二组最值得留意：HLE 上就算是最好的 Deep research 也只有 <b>26.6%</b>。</b> <span class='w'>⇒ 「屠榜」是相对而言的 —— 在专家级题目上这些模型仍然大面积不会</span>。<b>⚠ 另外注意「带工具」与「不带工具」的差别很大（o3：20.32 → 24.90），所以比较时必须说清工具条件</b>。", "<b>⚠ 第三组里 DeepSeek-V3 的 39.2 与 DeepSeek-R1 的 79.8 是同一个系列的「非 thinking」与「thinking」版本。</b> <span class='k'>⇒ <b>翻了一倍</b>，这是 Part 2 全部论证最直接的一个数</b>。", "<b>p41 第一个框 <code>Desiderata and Formulation</code>：把它当成一个<b>适应</b>问题（adaptation problem）。</b> <span class='w'>框里的小字说的是：训练一个算法 <code>A_θ(x)</code>，让它<b>花掉额外的测试期算力</b>、在候选回答之间<b>搜索</b>、最后<b>发现</b>答案</span>；<b>⇒ 「learning how」—— 学的是<b>怎么花这笔算力</b>，不是直接学答案</b>。", "<b>第二个框 <code>Dense rewards</code> 就是 Part 1 的 PAV 那一套：<b>光有终局奖励不够</b>。</b> <span class='k'>框里的小图画得很清楚：黑色阶跃线是 0/1 的终局奖励（最后一刻才跳起来），蓝色曲线是稠密奖励（一路有信号）</span>。", "<b>⭐ 第三个框是最有信息量的：<code>Gap grows as <b>√H</b></code>，而且标注了 <code>#training data n = Ω(H)</code>。</b> <span class='w'>横轴是测试期算力预算 <code>H</code>，纵轴是回报；RL 那条在上、SFT/蒸馏那条在下，两者的间距随 <code>√H</code> 张开</span>。<b>⇒ 结论是：<b>测试期算力给得越多，靠蒸馏／模仿就越追不上用奖励信号训出来的</b></b>。<span class='k'>⚠ 而旁边那个 <code>n = Ω(H)</code> 说的是代价：要撑起 <code>H</code> 的预算，训练数据得按 <code>H</code> 的量级增长</span>。"], "eq": "p40 三组数（注意量的不是一回事）：\n  Codeforces ELO     o1 1891 → o3-mini 2073 → o3(带终端) 2706 → o4-mini(带终端) 2719\n  Humanity's Last Exam  最高 Deep research <b>26.60%</b>  ⚠ 专家级题目上仍大面积不会\n                        o3 无工具 20.32 → 带工具 24.90（工具条件必须说清）\n  AIME 2024 Pass@1   DeepSeek-V3 39.2  →  DeepSeek-R1 <b>79.8</b>（同系列，翻倍）\n                     DeepSeek-R1 79.8  vs  OpenAI-o1-1217 79.2\n\np41 三个框：\n  ① Desiderata：当成<b>适应</b>问题 —— 学的是「怎么花这笔测试期算力」\n  ② Dense rewards：光有终局 0/1 不够（= Part 1 的 PAV）\n  ③ ⭐ RL ≫ SFT：<b>差距随 √H 增长</b>（H = 测试期算力预算）\n     代价：#training data n = Ω(H)", "tbl": {"head": ["p41 三个框各自对应前面哪一段", "框", "出处"], "rows": [["把「花多少算力」当成要学的东西", "Desiderata and Formulation", "p33–p34 的带约束目标"], ["光有终局奖励不够，要逐步的信号", "Ingredient 1: Dense rewards", "Part 1 的 p15–p27（PAV）"], ["⭐ 测试期算力越大，蒸馏越追不上", "Ingredient 2: RL ≫ SFT，Gap ~ √H", "本页（新结论，前面未展开）"]]}, "say": "<b>讲者在这里主动交代了自己跳过了内容，而且整讲最后一段的收束值得原样留着 —— 它把 Part 2 的全部论证压成了一句话</b>：<br><em>“I'm going to skip some of these things. But at a high level, we are also seeing now these newer thinking models … In my opinion, really, these are trained using <b>very similar recipes</b> that I just talked to you about for this whole lecture … So really, <b>nothing has changed in terms of the high-level techniques</b> that I talked about, <b>except that the base models have become more interesting in a way that they can sample interesting kinds of steps to train on.</b> And that has led to some of the most amazing results that we are seeing right now.”</em><br><b>⇒ 一句话版本：<b>算法还是那套；是基座模型能采出的「步」变有意思了</b>。</b><span class='w'>⚠ 而 p35 那张对照图是这句话唯一的硬证据 —— 采不出那些步的模型，同一套算法完全不起作用</span>。", "res": {"tag": "推断", "v": "<b>⭐ <code>Gap grows as √H</code> 这一条，如果成立，对你的课题是一个<b>方向性</b>的提示，值得单独记一笔。</b> <span class='k'>它说的是：测试期算力预算 <code>H</code> 越大，「用奖励信号训」相对「模仿／蒸馏」的优势越大</span>。<b>⇒ 换到你的坐标系：<b>总预算越宽裕，自适应分配相对固定配置的优势应当越大</b></b> —— <span class='w'>因为预算宽裕时「该把钱花在哪」的选择空间更大，而固定配置用不上这个空间</span>。<b>⇒ 这给了一个可以直接画的图：横轴是每条 query 的平均预算，纵轴是你的 router 相对最佳固定 workflow 的 <code>G</code> 提升 —— 如果这条曲线随预算张开，就与这一页的形状一致</b>。⚠ <b>三处必须守住</b>：<span class='k'>① 这是<b>类比</b>，不是把那个定理搬过来 —— 他们的 <code>H</code> 是 token 预算、你的是 API 开销，两者的「算力」含义不同；② 讲义只给了结论和一张示意图，<b>没有给条件也没有给证明</b>，引用前必须回到那篇 CMU MLD 博客核对；③ 旁边那个 <code>n = Ω(H)</code> 提醒了代价 —— 预算越大，要撑起它的训练／标定数据也越多，这对你就是「预算越大，穷举 oracle 那张表要越大」</span>。", "ref": "本讲 p41 第三框 · p30（CMU MLD Blog 那篇选读）· 简报 §4d（穷举 oracle 的规模）"}}
];

var TH = {"title": "L10 接上课题的哪一段：它和你做的是同一个问题，只是把「花在哪一步」换成了「花多久」", "arc": "<b>这是 CS224R 十九讲里离课题最近的一讲，而且近到可以逐条对应 —— 它研究的是「给定算力预算，怎么花最划算」，而你研究的是同一个问题的另一个切面。</b><br><br><span class='k'><b>一、设定是同构的，所以它的估计量可以直接搬（p7 · p15–p17）。</b></span> p7 把解题写成<b>稀疏奖励 MDP + 确定性动力学</b>：没有外部环境，<code>s_i</code> 就是 <code>s_{i−1}</code> 与刚写那段字的拼接，奖励只在终局、<code>γ=1</code>。<span class='w'>你的 workflow 四条全中</span>（query 是初始状态、给某节点挑档位是动作、状态是「已定下的那几个档位」、答对与否只在跑完之后）。<b>两个直接后果</b>：① <b>优势是 <code>Q − Q</code> 不是 <code>Q − V</code></b>（确定性动力学下 <code>V(s_i) = Q(s_{i−1},a_{i−1})</code>），<span class='k'>不必引入值函数网络</span>；② p16 那个「把前缀固定住、让 <code>π̃</code> 把后面补完、看成功率」的估计量，<b>落到你这里就是简报 §5 的一步偏离实验</b> —— <span class='w'>这一讲等于给那个实验补上了形式化的名字（Q 函数）与定义</span>。<br><br><span class='w'><b>二、它命名了你要找的那个东西（p12）。</b></span> <b>Spurious step</b>：一条解答答对了，但里面含着一步「既错又没被用到」的内容（Betty 那个例子：先写 <code>100×2=200</code>，下一句改口写 <code>100/2=50</code>，最终答案仍然正确）。<span class='k'>换成你的词：<b>一个答对了的配置，里面可能含着一个纯属浪费的节点档位</b></span>。<b>⇒ 而只看最终 <code>Acc</code> 的筛子<b>在原理上</b>就识别不出它们 —— 它们在 <code>Acc</code> 上完全不可见，只在 <code>Cost</code> 上可见。</b><span class='w'>这又一次、而且是从梯度那一侧，支持简报 §4e「两半要分开估」。</span><br><br><span class='k'><b>三、⭐⭐ p33–p34 给了你的目标函数一个更标准的写法。</b></span> 讲义写的是<b>约束型</b>：<code>max_π E_x[E_{z~π}[r(x,z)]]  s.t. ∀x, E|z| ≤ C₀</code>，并标注 <code>This compute budget is fixed!</code>。<b>而你的 <code>G = Acc − λ·Cost</code> 正是它的<b>拉格朗日松弛</b>，<code>λ</code> 就是那条约束的乘子。</b><span class='w'>⇒ 这给了「λ 该取多少」一个有原则的答案：先定一个你真正在乎的预算（每条 query 平均不超过多少钱），再解出对应的 <code>λ</code></span> —— <b>比扫一遍 <code>λ</code> 再挑一个好看的容易向审稿人交代得多</b>。<span class='k'>⚠ 但两处不等价必须自己守住：① 惩罚型只能达到 Pareto 前沿的<b>凸</b>部分，而配置空间离散时凹陷很常见；② 这一讲的约束是<b>逐题</b>的（<code>∀x</code>），而「难题多花、简单题少花」需要的是<b>平均</b>约束 —— 后者恰恰是 node-level 自适应的全部价值所在，所以你该明确主张平均约束并说明理由。</span><br><br><span class='w'><b>四、两条会改变实验设计的具体结论。</b></span> <b>① p26 的尺子判据</b>：最优的 rollout 策略要的是<b>分辨力</b>，<span class='k'>不是最强的那一个</span> —— 太强的 <code>π̃</code> 什么前缀都能救回来，所有 Q 趋近 1、优势全是 0。<b>⇒ 探测某节点时把其余节点全用最强模型，恰恰是最差的尺子</b>；<span class='w'>参考配置该挑在全强与全弱之间，判据就用「让格子优势方差最大」。简报 §5 的止损闸（全强与全弱差不到 4 个百分点就没 headroom）说的是同一件事，只是换到了 benchmark 那一层。</span><b>② p35 的能力门槛</b>：同一套 RL 配方，一个基座模型长出了验证与回溯行为，另一个<b>一条都没有、而且整个训练过程不提升</b>。<span class='k'>⇒ 有些格子上弱档位<b>根本不可行</b>，那不是一个可以用 <code>λ</code> 权衡的连续量</span>。<b>⇒ 敏感度扫描应当同时产出两张表：一张「降档的准确率跌幅」（连续），一张「这个格子弱档位可不可行」（二值）；优化只在可行的格子上做。</b><br><br><b>五、一张可以直接画的图（p41）。</b> <code>Gap grows as √H</code>：测试期算力预算越大，「用奖励信号训」相对「模仿／蒸馏」的优势越大。<span class='k'>类比到你这里：<b>总预算越宽裕，自适应分配相对最佳固定配置的优势应当越大</b></span>（预算宽裕时「该把钱花在哪」的选择空间更大，而固定配置用不上这个空间）。<b>⇒ 横轴每条 query 的平均预算、纵轴相对最佳固定 workflow 的 <code>G</code> 提升，如果这条曲线随预算张开，就与这一页的形状一致。</b><span class='w'>⚠ 这是类比不是定理搬运，而且讲义只给了结论与示意图、没给条件也没给证明。</span>", "pitfalls": [{"v": "<b>⚠ 这是客座讲座，而且讲者多处自标「这是我的版本」。</b> <span class='k'>主讲 Aviral Kumar（CMU），不是本课主讲；p6 那个按 DeepSeek-R1 切成前后两半的时间轴，他标了 <code>This is my characterization of this whole space</code>；p32 整页顶着 <code>(Disclaimer: this is my version!)</code>；p31–p32 的「动作空间变了」他两次用 <code>crudely</code>，并在讲稿里承认严格说<b>动作空间没变</b>（仍是逐 token），变的是「一步」能装下什么</span>。<b>⇒ 引用这一讲的<b>分类与叙事</b>时必须带上这个限定；引用它的<b>公式与实验数字</b>则没有这个问题。</b>", "tag": "已核", "ref": "本讲 p6、p31、p32 的页面标注与讲稿"}, {"v": "<b>⚠ 三个倍数的口径与基准都不同，混用会把结论说错一个量级。</b> <span class='k'>RFT <b>2 倍</b>、逐步 DPO <b>8 倍</b> —— 这两个都是相对「在人写的参考解上做 SFT」；PAV-RL <b>5–6 倍</b> 是相对「只有终局 0/1 奖励的在线 RL（ORM-RL）」</span>。<b>而且三个量的都是「达到同样测试误差需要的<b>数据</b>少几倍」，不是「性能好几倍」。</b><span class='w'>⚠ 不能相乘，也不能直接比大小。</span><b>另外 p27 那个 6–7 个百分点是<b>绝对</b>准确率提升（2B 上 0.19→0.25），与倍数是两回事。</b>", "tag": "已核", "ref": "本讲 p10–p11 讲稿 · p23 · p27"}, {"v": "<b>⚠ 这一讲的实验基准<b>已经作废</b>，引用数字必须带时间限定。</b> <span class='k'>讲者明说 GSM8K 与 MATH <code>are fully solved. So it doesn't make sense to, going forward, benchmark methods on these benchmarks</code></span>；<b>而且主力实验用的是 Llama 2 与 DeepSeek V2</b>，<span class='w'>他自己也感慨 <code>Llama 2 feels like a long time ago</code></span>。<b>⇒ 「八倍」这类结论要写成「在 2024 年的那批模型与基准上」，否则很容易被指出过时。</b>", "tag": "已核", "ref": "本讲 p10 讲稿 · p23 讲稿"}, {"v": "<b>⚠ p36 那八张「长度与准确率同涨」的图<b>区分不了因果</b>，别读成「写得长所以答得对」。</b> <span class='k'>奖励里<b>没有</b>鼓励长度（仍是 0/1 的答对与否），长度是自己涨上去的 —— 讲义自己也只问了一个 <code>Why?</code> 就过去了</span>。<b>两种解释都成立：① 长度本身带来收益；② 学会了验证与回溯 ⇒ 答得更对，而它们顺带占字数（p35 给了这个机制的证据）。</b><span class='w'>⚠ 而这对你有一个连带后果：如果用 token 数当 <code>Cost</code> 的代理，<code>Acc</code> 与 <code>Cost</code> 会有很强的正相关，拟合 <code>G</code> 时这两项<b>不独立</b>，报告时要说清楚。</span>", "tag": "推断", "ref": "本讲 p36 · p35 · p9 讲稿（RFT 不鼓励冗长那一段）"}, {"v": "<b>⚠ <code>Gap grows as √H</code> 那一条诱人，但讲义给的只是一个结论加一张示意图。</b> <span class='k'>没有条件、没有证明，出处是 p30 列的那篇<b>选读</b>博客（Setlur, Qu, Yang, Zhang, Smith, Kumar, CMU MLD Blog 2025）</span>。<b>⇒ 要在论文里用，必须回到原文核对；而且把它搬到你的场景是<b>类比</b>——他们的 <code>H</code> 是 token 预算，你的是 API 开销，「算力」的含义不同。</b><span class='w'>⚠ 旁边那个 <code>n = Ω(H)</code> 也别漏了：预算越大，要撑起它的训练／标定数据越多 —— 对你就是「预算越大，穷举 oracle 那张表要越大」。</span>", "tag": "待核", "ref": "本讲 p41 第三框 · p30（CMU MLD Blog，选读）"}, {"v": "<b>⚠ 「逐题约束」与「平均约束」的最优解不同，这一处最容易在写形式化时含糊过去。</b> <span class='k'>讲义写的是 <code>∀x, E_{π(·|x)}|z| ≤ C₀</code> —— <b>每一道题</b>都不许超</span>；<b>而「难题多花、简单题少花」需要的是 <code>E_x[Cost(x)] ≤ C₀</code>，允许在题目之间调剂</b>。<span class='w'>⇒ 后者才是 node-level 自适应分配价值的来源</span>。<b>⚠ 两者都合理，但你主张哪一个必须明说，而且报告实验时要说清你的预算是逐题卡的还是平均卡的</b> —— <span class='k'>否则「省了 30% 成本」这句话会有歧义</span>。", "tag": "推断", "ref": "本讲 p33–p34"}, {"v": "<b>⚠ 这一讲里的 rollout 几乎免费，你的每一次都要真金白银 —— 凡是「多采几条」的建议都要先过成本这一关。</b> <span class='k'>p16 的 Q 估计、p20 的偏好对、p25 的优势预测器，三者都建立在「可以大量采样」之上</span>；<b>而 p25 之所以要把 rollout 换成一个参数化的预测器，理由恰恰是<b>在线情形下现做太贵</b> —— 这个理由在你那里从一开始就成立</b>。<span class='w'>⇒ 所以简报 §4c 的敏感度扫描（先把要探的节点压到 3–4 个）不是优化项，是<b>前置条件</b>；这一讲等于从另一个方向论证了同一件事。</span>", "tag": "推断", "ref": "本讲 p16、p20–p22、p25 · 简报 §4c"}], "ammo": [{"q": "你为什么不直接按最终准确率筛配置？跑一批、留下答对的那些，不就行了吗？", "a": "<b>因为那个筛子在原理上就漏掉了我要找的东西。</b> <span class='k'>CS224R L10 p12 给了这个现象一个名字：<b>spurious step</b>。他们的例子是模型先写 <code>100 × 2 = 200</code>（多余且错），下一句改口写 <code>100 / 2 = 50</code>，最终答案完全正确 —— 于是这条解答通过了「答案对不对」这唯一的筛子，带着那句错话进了训练集</span>。<b>换成我的词：<b>一个答对了的配置，里面可能含着一个纯属浪费的节点档位</b>，而它在 <code>Acc</code> 上<b>完全不可见</b>、只在 <code>Cost</code> 上可见</b>。<span class='w'>⇒ 而识别这些浪费正是 node-level fidelity assignment 的全部价值</span>。<b>他们的解法我也照搬：把前缀固定住、让一个参考配置把后面跑完、看成功率变不变（p15–p17），这给出格子级的优势</b>。<span class='k'>他们量过效果：按优势过滤之后，原本「训得越多反而越差」的那条曲线被压住了（p11 → p19）。</span>", "tag": "推断", "ref": "本讲 p11、p12、p15–p19 · 简报 §4e"}, {"q": "你的 λ 是怎么定的？是不是扫一遍挑了个好看的？", "a": "<b>不是，而且有一个更标准的写法可以直接交代。</b> <span class='k'>CS224R L10 p33–p34 把同一类问题写成<b>约束型</b>：<code>max_π E_x[E_{z~π}[r(x,z)]]  s.t.  E|z| ≤ C₀</code>，并明确标注 <code>This compute budget is fixed!</code></span>。<b>而 <code>G = Acc − λ·Cost</code> 正是它的<b>拉格朗日松弛</b>，<code>λ</code> 就是那条约束的乘子</b>。<span class='w'>⇒ 所以我先定一个真正在乎的预算 <code>C₀</code>（每条 query 平均不超过多少钱，这个数由部署场景决定、不是我挑的），再解出对应的 <code>λ</code></span>。<b>⚠ 两处我会主动说明</b>：<span class='k'>① 惩罚型只能达到 Pareto 前沿的<b>凸</b>部分，配置空间离散时前沿常有凹陷，那一段无论 <code>λ</code> 取什么都取不到 —— 所以我同时报约束型的结果；② 我用的是<b>平均</b>约束而不是逐题约束，因为「难题多花、简单题少花」的价值恰恰来自题目之间的调剂，逐题卡死就把这个价值卡没了</span>。", "tag": "推断", "ref": "本讲 p33–p34 · 简报 §3（AFlow 报告权衡但从不优化它）"}, {"q": "你探测某个节点的贡献时，其余节点用什么配置？直觉上应该全用最强的吧？", "a": "<b>直觉上是，但那恰恰是最差的选择，而且这一讲给了判据。</b> <span class='k'>CS224R L10 p26 对「最优 rollout 策略」的定义是：能让优势<b>最有效地区分</b>好步骤与坏步骤的那一个 —— <b>不是最强的那一个</b></span>。<b>理由很直接：太强的参考配置什么前缀都能救回来，于是所有格子的 Q 都接近 1、优势全是 0，什么也分辨不出来</b>。<span class='w'>⇒ 而这不是空想：我自己的止损闸写着「若 <code>Acc(全强) − Acc(全弱) < 约 4 个百分点</code>，该 benchmark 没有 headroom」—— 说的是同一件事，只是换到了 benchmark 那一层</span>。<b>⇒ 所以参考配置挑在全强与全弱之间，而怎么挑有判据：<b>让格子优势的方差最大</b>的那个</b>。<span class='k'>我会在扫描阶段先试两三个参考配置，把这个选择本身做成一个可报告的消融。</span>", "tag": "推断", "ref": "本讲 p26 · 本讲 p15 讲稿（rollout 策略应当与被评估的不同）· 简报 §5（止损闸）"}, {"q": "你这个和现在很火的 test-time scaling 是什么关系？是不是在做同一件事？", "a": "<b>是同一笔账的三种花法，而我在的那一格他们没覆盖 —— 这正好可以写进 related work。</b> <span class='k'>CS224R L10 p37–p39（Snell et al., ICLR 2025 Oral）比的是两种：<b>把模型做大</b> vs <b>让同一个模型多想一会</b></span>；<b>而我比的是第三种：同一条 workflow 里，把预算<b>在节点之间</b>重新分配</b>。<span class='w'>⇒ 三者的差别是<b>粒度</b>：模型大小是整体一次性的、推理长度是逐题的、节点级档位是<b>逐题 × 逐节点</b>的</span>。<b>⇒ 一句话定位：<b>test-time scaling 问「这道题该花多少」，node-level fidelity assignment 问「这些钱该花在哪一步」</b></b>。<span class='k'>而且两者可以叠加、不冲突 —— 这比把自己摆成它的竞争者更站得住</span>。⚠ <b>我会同时点明一个他们那边没有的不对称</b>：<span class='w'>模型大小是一次性选择，而节点档位和推理长度一样<b>逐题可调</b> —— 可调性本身就是价值来源</span>。", "tag": "推断", "ref": "本讲 p37–p39 · 简报 §1（node-level 是 AFlow 自己放弃的那一维）· 简报 §8"}, {"q": "为什么要先花预算去测「哪些节点弱模型能胜任」？直接把它交给优化器不就行了？", "a": "<b>因为有些格子上弱档位<b>根本不可行</b>，那不是一个可以权衡的连续量，而把它混进优化问题会污染整个拟合。</b> <span class='k'>CS224R L10 p35 给了这件事一个很硬的实证：同一套 RL 配方下，一个基座模型长出了大量验证与回溯行为并持续改进，另一个<b>一条行为都没有，而且在整个 RL 过程中完全不提升</b>（讲义原话 <code>This model does not improve during RL</code>）</span>。<b>⇒ 能力是个门槛，不是个连续的旋钮</b>。<span class='w'>落到我这里：若某节点上 7B 根本做不了那件事，<code>Acc</code> 的差就是一个硬性的不可行，而不是一个 <code>λ</code> 能换算的量</span>。<b>⚠ 更要紧的是：把这类格子留在优化空间里，会让拟合出来的 <code>Acc</code> 模型在那一段严重非线性 —— 而线性正是我整套方法里标着「待检验」的那条前提</b>。<b>⇒ 所以敏感度扫描产出两张表：一张连续的「降档跌幅」，一张二值的「可不可行」；优化只在可行格子上做。这既省预算，又让线性假设在剩下的格子上更站得住。</b>", "tag": "推断", "ref": "本讲 p35 · 简报 §4c（敏感度扫描）· 简报 §5（可加性检验）· CSE541 L07 主线卡（线性待检验）"}, {"q": "AFlow 已经同时记录了 score 和 cost，你说它「不优化成本」是不是太苛刻了？", "a": "<b>不苛刻，而且这一讲从另一个领域给了佐证：<b>只要目标里没有算力，算力就会被耗尽</b> —— 这是优化的必然，不是实现疏忽。</b> <span class='k'>CS224R L10 p36（Kimi 1.5 技术报告）在八个基准上都观察到：随着 RL 训练，准确率在涨、<b>token 长度也在涨</b>，而奖励里<b>根本没有</b>鼓励长度（仍是 0/1 的答对与否）</span>。<b>⇒ 长度是自己涨上去的。讲义自己也只问了一个 <code>Why?</code></b>。<span class='w'>而这正是 p33 为什么要把算力写成一条<b>硬约束</b>的理由</span>。<b>⇒ 对照我核过的事实：AFlow 的 Executor 同时返回 score 和 cost，但 <b>cost 从不进入 score</b>，成本只出现在事后的 Pareto 图里。所以「它报告权衡但不优化权衡」是一个结构性的陈述，不是挑刺</b>。<span class='k'>⚠ 我会把它写成「方法学差异」而不是「他们错了」—— 在他们的问题设定下那个选择是合理的，只是我的设定不同。</span>", "tag": "推断", "ref": "本讲 p33、p36 · 简报 §3（cost 从不进入 score，已核）"}], "papers": [{"t": "Setlur, Garg, Geng, Garg, Smith, Kumar — RL on Incorrect Synthetic Data Scales the Efficiency of LLM Math Reasoning by Eight-Fold", "id": "NeurIPS 2024（本讲 Part 1 的主干，p8 点名）", "why": "<b>spurious step、按优势过滤、共享前缀 DPO、八倍数据效率 —— 全部出自这一篇。</b> <span class='k'>对课题最该读的是它<b>怎么量 spurious step</b>：讲者说论文里确实量过，而且它随训练增长，但幻灯上没给方法</span>。<b>⇒ 你要把「浪费的档位」做成一个可报告的量，这篇的度量方式是最直接的参照。</b>⚠ <b>另外讲者明说「普通的拟合指标看不出这件事」</b>，<span class='w'>所以别指望用训练/验证损失去发现它</span>。"}, {"t": "Setlur, Nagpal, Fisch, Geng, Eisenstein, R. Agarwal, A. Agarwal, Berant, Kumar — Rewarding Progress: Scaling up Automated Process Supervision for LLM Reasoning", "id": "ICLR 2025（本讲 Part 1 后半，PAV 的出处，p8/p24–p28 点名）", "why": "<b>PAV（Process Advantage Verifier）与 p26 那条「最优 rollout 策略」的正式定义都在这里。</b> <span class='k'>⭐ 对课题最值钱的就是那条定义：<b>尺子要的是分辨力，不是本事大</b></span>——<b>它直接否掉「探测时其余节点全用最强模型」这个默认选择</b>。<span class='w'>讲义给的是 <code>[Informal]</code> 版本，正式的表述与它依赖的条件要回原文查</b></span>。<b>另外 5–6 倍 / 6–7 个百分点那组数也出自这里，引用时记得标明对照组是 ORM-RL 而不是 SFT。</b>"}, {"t": "Snell, Lee, Xu, Kumar — Scaling LLM Test-Time Compute Optimally can be more Effective than Scaling Model Parameters", "id": "ICLR 2025 (Oral)（本讲 p37–p39 的出处）", "why": "<b>把「模型做大」与「多想一会」放进同一个预算比较的那一篇，也是你给自己定位时必引的。</b> <span class='k'>你的说法可以是：他们比的是两种花法，而 node-level fidelity assignment 是<b>第三种、粒度更细</b>的一种（逐题 × 逐节点）</span>。⚠ <b>标题里是 <code>can be</code> 而不是「总是」—— 这是条件性结论，而讲义这三页<b>没有给出条件</b></b>，<span class='w'>引用前务必回原文确认它在什么情形下成立、什么情形下不成立</span>。<b>⚠ 作者列表与年份也请自行核对，讲义只给了姓氏与会议。</b>"}, {"t": "Gandhi et al. — Cognitive Behaviors that Enable Self-Improving Reasoners", "id": "arXiv 2025（本讲 p35 那张对照图的出处）", "why": "<b>「同一套 RL 配方，一个基座模型长出验证与回溯、另一个什么都没有且完全不提升」——这个结论的出处。</b> <span class='k'>对课题的用处是给「能力是门槛不是旋钮」这句话一个可引用的依据</span>，<b>从而支撑「先用二值表筛掉不可行的格子、再在剩下的格子上优化」这个实验设计</b>。<span class='w'>⚠ 四种行为（Verifications / Subgoal Setting / Backtracking / Backward Chaining）的操作化定义——也就是<b>怎么从文本里数出这些行为</b>——讲义没给，而那恰恰是你要借用的部分。</span>"}, {"t": "Setlur, Qu, Yang, Zhang, Smith, Kumar — Optimizing Test-Time Compute requires Solving a Meta-RL Problem", "id": "CMU MLD Blog, 2025（p30 列为<b>选读</b>；p41 第三框的 √H 多半出自这里）", "why": "<b><code>Gap grows as √H</code> 与 <code>n = Ω(H)</code> 这两条的出处，而它们是 p41 三个框里信息量最大的。</b> <span class='k'>如果成立，类比到课题就是「总预算越宽裕，自适应分配相对固定配置的优势越大」——这是一张可以直接画出来的图</span>。⚠ <b>本条标为<b>待核</b></b>：<span class='w'>讲义只给了结论与一张示意图，没有条件、没有证明，而且它是一篇博客不是论文</span>。<b>⇒ 要用必须回原文核对，而且要讲清把 token 预算类比成 API 开销这一步的理由。</b>"}]};

      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      // ⚠ 不能换掉 iframe 元素：error/load 两个监听器是初始化时挂上去的，
      //   换元素会把它们孤儿化，「打不开？」面板就再也不会弹，
      //   读者只剩一个空白框、毫无线索（2026-10-23 我就是这么写错的）。
      //   先 about:blank、下一个 tick 再设真地址 —— 同样是新导航，元素不动。
      frame.src="about:blank";
      setTimeout(function(){ frame.src=SRC+HASH; }, 0);
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
