{"r": [1, 4], "t": "开场：上一讲停在哪，以及那个「只能走一步梯度」的遗憾", "star": 2, "quote": "CS 224R Actor Critic Methods.  Recap of Last Time — Online reinforcement learning with policy gradients: Run policy to collect batch of data; Improve policy using batch of data.  Do more of the above average stuff, less of the below average stuff.  ∇_θJ(θ) ≈ (1/N) Σ_i Σ_t ∇_θ log π_θ(a_{i,t}|s_{i,t}) ((Σ_{t'=t}^T r(s_{i,t'},a_{i,t'})) − b).  Definitions (attribute of online RL algorithms): on-policy: update uses only data from current policy; off-policy: update can reuse data from other, past policies.  Vanilla policy gradients is fully on-policy.  Importance weights for off-policy policy gradient → only one gradient step per batch of data.  Note: Not a silver bullet.  Only suitable when policies are very similar.", "one": "<b>两页回顾把 L03 的结论摆齐</b>：带基线的策略梯度、on/off-policy 的定义、以及重要性权重。<span class='k'>而 p4 底下那句 <b>Not a silver bullet. Only suitable when policies are very similar.</b> 是在提醒你 L03 后半那套东西有多脆弱</span> —— <b>这一讲要换一条更结实的路。</b>", "eq": "L03 留下的梯度（p3）：\n\n  ∇_θJ(θ) ≈ (1/N) Σ_{i=1}^N Σ_{t=1}^T  ∇_θ log π_θ(a_{i,t}|s_{i,t}) · ( Σ_{t'=t}^T r − b )\n            └── policy log likelihood ──┘   └─ reward to go ─┘  └ baseline ┘\n\n  一句话直觉：**Do more of the above average stuff, less of the below average stuff.**\n\n────────────────────────────────────────\nL03 的两个定义（p4，原样重放）：\n\n  **on-policy** ：update uses only data from current policy\n  **off-policy**：update can reuse data from other, past policies\n  **Vanilla policy gradients is fully on-policy.**\n\n重要性权重那条路的两句评价（p4）：\n  · → only one gradient step per batch of data\n  · **Note: Not a silver bullet. Only suitable when policies are very similar.**\n\n⚠ 注意这两句是**对 L03 后半的降级评价**：\n   它能让你多走几步，但那条路本身要求「两个策略非常接近」。\n   这一讲要动的是**另一个零件** —— 不是改采样方式，而是改那个权重。", "pts": ["<b>p4 那句 Not a silver bullet 值得单独注意，它是讲者对自己上一讲的降级评价。</b><span class='k'>L03 后半花了六页推重要性采样与 KL 约束，这里一句话把它的适用范围收紧了：只在两个策略非常接近时才合适</span>。<b>所以 off-policy 那条路是补丁，不是解法。</b>", "<b>这一讲要动的零件和 L03 后半完全不同，看清这一点整讲就不会迷路。</b><span class='w'>L03 后半改的是「怎么采样」（能不能复用旧数据）</span>；<b>这一讲改的是梯度式子里那个<span class='k'>权重</span></b> —— <span class='w'>把 <code>(Σr − b)</code> 换成一个学出来的 <code>A^π(s,a)</code></span>。<b>两件事互相独立，最后可以叠加（p25 之后就是叠加版）。</b>", "<b>p3 把那个梯度式子的四个部分都标了名字，建议记住这组术语，后面一直在用。</b><span class='k'>policy log likelihood（策略对数似然）· reward to go（剩余回报）· baseline（基线）· samples from policy（来自策略的样本）</span>。<b>这一讲改的就是中间那两项合起来的那一块。</b>", "<b>那句 Do more of the above average stuff 的「above average」是基线带来的。</b><span class='w'>没有基线时是「do more of the high-reward stuff」，而 L03 p17 的叠外套例子说明那不够</span>。<b>这一讲会把 above average 再升级一次：从「比这一批的平均好」升级成「比我在这个状态下照策略走要好」</b> —— <span class='k'>那就是优势函数。</span>"], "tbl": {"cap": "两讲各动了梯度式子的哪个零件", "head": ["", "L03 后半", "<b>L04（本讲）</b>"], "rows": [["改的是", "<b>怎么采样</b>（能否复用旧数据）", "<b>权重本身</b>（Σr − b → A^π）"], ["手段", "重要性权重 + KL 约束", "<b>学一个值函数</b>"], ["解决什么", "一批数据只能走一步梯度", "<b>梯度噪声大、数据没用好</b>"], ["讲者自评", "<b>Not a silver bullet</b>，只在策略很接近时合适", "—"], ["两者关系", "<b>互相独立，可以叠加</b>（p25 之后就是）", "—"]]}, "say": "<b>讲稿在进入正题时把这一讲的动机接得很紧，而且直接复用了 L03 那个走路的例子：</b><br><br>「<span class='k'>we talked about a couple examples on Wednesday of some scenarios that were dissatisfying about policy gradients. And the first was that if we are trying to learn how to walk and we have a policy that takes a small step forwards and then falls backwards, we will push down the likelihood of taking a step forward because we don't necessarily know that [it] might have led it to fall backwards.</span>」<br><br><b>关键在后半句：「we don't necessarily know」</b> —— <span class='w'>算法并不是判断错了，它是<b>根本没有能力去判断</b></span>：它只看得到整条轨迹的总回报。<br><br>接着是这一讲的全部动机：<br><br>「<span class='k'>if we actually had some understanding that taking a small step forward was making progress, was actually good, was advantageous, then we might [be able to use these trajectories in a positive way]</span>」<br><br><b>注意她用的词是 advantageous —— 这正是「优势函数」这个名字的来历</b>，而且它在幻灯上出现之前就在口语里出现了。", "link": {"t": "你学过的对应：CS224R L03 精读（这一讲要改的那个梯度式子，以及它的三个毛病）", "href": "L03-精读.html"}},
{"r": [5, 6], "t": "三个量，两条关系——而优势函数才是这一讲真正要的那个", "star": 5, "quote": "The plan for today — Actor critic methods: 1. Improving policy gradients  2. How to estimate the value of a policy (a. Sample & directly supervise  b. Use your own estimate  c. Something in-between?)  3. Off-policy actor-critic (a. Importance weights & constraining step size  b. Full off-policy version with replay buffers).  Key learning goals: How to estimate how good a state and action is for a policy; How to use those estimates to form a more efficient RL algorithm.  Revisiting Some Useful Objects — V^π(s) value function: future expected rewards starting at s and following π.  Q^π(s,a) Q-function: future expected rewards starting at s, taking a, then following π.  A^π(s,a) advantage: how much better it is to take a than to follow policy π at state s.  Useful relation: V^π(s) = 𝔼_{a∼π(·|s)}[Q^π(s,a)].  A^π(s,a) = Q^π(s,a) − V^π(s).", "one": "<b>V 和 Q 在 L01 p40 已经定义过了，这一页新加的是第三个：<span class='k'>优势 A</span>。</b>它问的问题最尖锐 —— <b>「在这个状态下，走 a 比照我现在的策略走，好多少？」</b><span class='w'>而这正是策略梯度需要、却一直没有的那个信号。</span>", "eq": "三个量（p6）：\n\n  **V^π(s)**    从 s 出发、之后一直按 π 走，未来的期望回报\n  **Q^π(s,a)**  从 s 出发、**先走 a**、之后再按 π 走，未来的期望回报\n  **A^π(s,a)**  在状态 s 下，**走 a 比照 π 走好多少**\n\n两条关系（p6 原文标成 Useful relation）：\n\n  ① **V^π(s)  =  𝔼_{a ∼ π(·|s)} [ Q^π(s,a) ]**\n       对动作按**当前策略**取平均，就从 Q 回到 V\n\n  ② **A^π(s,a)  =  Q^π(s,a)  −  V^π(s)**\n       「走这个动作」减去「照策略走」= 这个动作的**增量价值**\n\n────────────────────────────────────────\n三者的分工（为什么偏偏需要 A）：\n\n  V^π(s)   回答「这个**状态**好不好」      → 不能用来选动作\n  Q^π(s,a) 回答「这个**动作**绝对值多少」  → 能选动作，但含有状态本身的好坏\n  **A^π(s,a)** 回答「这个动作**相对**好多少」→ **把状态的好坏减掉了**\n\n  ⇒ 由 ① 立刻得到一条性质（讲义没写，但很有用）：\n\n       𝔼_{a ∼ π(·|s)} [ A^π(s,a) ]  =  𝔼[Q] − V  =  V − V  =  **0**\n\n     也就是说：**按当前策略平均，优势恒为零**。\n     正的优势必然对应负的优势 —— 它天生就是「比平均好多少」。", "pts": ["<b>优势函数之所以是这一讲的主角，是因为它<span class='k'>自带基线</span>。</b><span class='w'>L03 的基线是「这一批轨迹的平均回报」，一个全局的常数</span>；<b>而 A 减掉的是 <code>V^π(s)</code> —— 一个<span class='k'>依赖状态</span>的基线</b>。<span class='w'>「在这个状态下好不好」比「比全局平均好不好」精确得多。</span>", "<b>那条 <code>𝔼_{a∼π}[A^π(s,a)] = 0</code> 值得自己推一遍（讲义没写）。</b><span class='k'>由关系式 ① 一步就出来</span>。<b>它的含义很实在：优势天生是零均值的</b> —— <span class='w'>在任何状态下，有动作优势为正，就必有动作优势为负</span>。<b>所以用 A 当权重时，「鼓励」和「压制」自动是平衡的，不会像 L03 p14 那样全部被鼓励。</b>", "<b>三个量的分工可以用一句话记住：<span class='k'>V 评状态，Q 评状态+动作，A 评动作本身</span>。</b><b>而策略梯度要改的是「这个<span class='w'>动作</span>该不该多做」，所以它要的正是 A</b>。<span class='k'>用 Q 当权重也能跑，但 Q 里混着「这个状态本来就好」的成分，那部分对选动作毫无信息，只会增加方差。</span>", "<b>p5 的计划里，第 2 项「How to estimate the value of a policy」底下那三条小标题是整讲的技术骨架</b>：<span class='k'>a. 采样后直接监督 · b. 用自己的估计 · c. 中间路线</span>。<b>p24 会把它们的正式名字填上</b>：<span class='w'>蒙特卡洛估计、自举/时序差分、N 步回报</span>。<b>先记住这个三分，后面就是填空。</b>", "<b>注意 V 和 Q 都带上标 π：它们是「某个特定策略的」值，不是绝对的。</b><span class='k'>策略一变，这三个量全变</span>。<b>这件事在 p26 会变成一个真实的麻烦</b>：<span class='w'>多走几步梯度之后，你手上的优势估计是<b>旧策略</b>的，已经过期了</span>。"], "tbl": {"cap": "三个量的分工，以及为什么策略梯度要的是 A", "head": ["", "V^π(s)", "Q^π(s,a)", "<b>A^π(s,a)</b>"], "rows": [["回答什么", "这个<b>状态</b>好不好", "这个<b>动作</b>绝对值多少", "<b>这个动作<b>相对</b>好多少</b>"], ["能选动作吗", "<b>不能</b>（要知道走 a 到哪）", "能", "<b>能</b>"], ["含不含状态本身的好坏", "就是它", "<b>含</b>（增加方差）", "<b>减掉了</b>"], ["按 π 取平均等于", "—", "<b>V^π(s)</b>", "<b>0</b>"], ["当权重时", "不能用", "能用但更吵", "<b>最合适</b>"], ["自带基线吗", "—", "否", "<b>是，而且是依赖状态的基线</b>"]]}, "say": "<b>把 L03 的基线和这一页的优势并排，能看到一条清晰的升级线：</b><br><br>· <span class='w'>L03 p16 的基线 b</span>：<b>一个常数</b>，整批共用。「比这一批的平均好多少」。<br>· <span class='k'>本页的 V^π(s)</span>：<b>一个依赖状态的函数</b>。「在<b>这个状态下</b>，比照策略走好多少」。<br><br><b>升级的收益很具体，回到 L03 p17 那个叠外套的例子就看得出来</b>：<br><br><span class='w'>「只叠了袖子」那条轨迹，在 L03 里和「完全没碰外套」拿到一模一样的梯度</span>（因为总回报都是 0，减掉同一个常数还是相同）。<br><br><b>而如果你有 <code>V^π(s)</code></b>：<span class='k'>「叠完袖子」那个<b>状态</b>的价值，本来就应该高于「完全没动」那个状态</span> —— <b>于是「叠袖子」这个动作的优势是正的，它终于能被鼓励了</b>。<br><br><span class='w'>这就是这一讲要补的那个洞，而补法在 p9–p10。</span>", "link": {"t": "你学过的对应：CS224R L01 p40（V 与 Q 的定义，以及为什么无模型时要学 Q）", "href": "L01-精读.html"}, "res": {"tag": "推断", "v": "<b>「优势 = 绝对价值 − 状态本身的价值」这个减法，在你的课题里有一个非常直接的对应，而且能省评估次数。</b><br><br>你要判断「把配置里的算子 X 换成 Y 值不值」。<span class='k'>直接比较两个完整配置的分数，分数里混着「这个配置的其余部分本来就好/不好」这一大块</span> —— <b>而那一块对「X 换 Y 值不值」这个问题毫无信息，只贡献方差</b>。<br><br><b>这正是 Q 与 A 的区别</b>：<span class='w'>Q 混着状态价值，A 把它减掉了</span>。<br><br><b>落地做法就是控制变量</b>：<span class='k'>固定配置的其余部分，只改那一个算子，比较同一基底上的差值</span>。<b>这与 L03 p16 那条「配对比较」是同一个手法在不同维度上的应用</b> —— <span class='w'>一个减掉「测试样本的难易」，一个减掉「配置其余部分的好坏」</span>。<br><br><b>两个一起用，剩下的方差才是你真正想测的那个信号。</b>", "ref": "本讲 p6 的 A = Q − V；对照 L03 p16 的基线"}},
{"r": [7, 7], "t": "练鼓那个例子：一个坏策略会让所有东西看起来一样坏", "star": 4, "quote": "Let's look at an example.  Reward = 1 if I can play it in a month, 0 otherwise.  Current policy: π(a_1|s) = 1 ∀s.  Question: For each action, what are these?  Value function: V^π(s_t) = ?  Q function: Q^π(s_t, a_t) = ?  Advantage function: A^π(s_t, a_t) = ?", "one": "<b>你想学打鼓，一个月后能演奏就得 1 分。三个动作：坐海滩、看电视、练鼓。而你当前的策略是<span class='k'>永远坐海滩</span>。</b><span class='w'>问：V、Q、A 各是多少？</span><b>这个 think-pair-share 的答案里有一个容易想错的地方。</b>", "eq": "设定（p7）：\n  奖励     r = 1 如果一个月后能演奏这段音乐，否则 0\n           （所以 T = 一个月之后）\n  动作空间  a₁ 坐海滩 · a₂ 看电视 · a₃ 练鼓\n  当前策略  **π(a₁|s) = 1  ∀s**   —— 永远坐海滩\n  前提      当前状态下，你**还不会**打鼓\n\n────────────────────────────────────────\n讲稿给的答案：\n\n  **V^π(s_t) = 0**\n     照这个策略走下去永远学不会 ⇒ 期望回报为 0\n\n  **Q^π(s_t, a₁) = 0**   （现在坐海滩，之后还是坐海滩）\n  **Q^π(s_t, a₂) = 0**   （现在看电视，之后坐海滩）\n\n  **Q^π(s_t, a₃) = ?**   ⚠ **不是简单的 1**\n     它是「**练这么一段时间之后能学会的概率**」。\n     讲稿原话：It basically represents the probability in which you would\n     be able to play this, given that you had practiced for that amount of time,\n     **and that probability could be 0**.\n     —— 取决于一个时间步有多长；练一小时然后回去坐海滩，可能还是 0。\n\n  **A^π(s_t, a₃) = Q − V > 0**（正数）\n  **A^π(s_t, a₁) = A^π(s_t, a₂) = 0**", "pts": ["<b>最容易想错的是 <code>Q^π(s,a₃)</code>：它不是 1。</b><span class='k'>Q 的定义是「先走 a，<b>之后按 π 走</b>」—— 而 π 是「永远坐海滩」</span>。<b>所以你只练了<span class='w'>一个时间步</span>，之后就回去躺着了</b>。<span class='w'>讲稿说得很准：它是「练这么久之后能学会的<b>概率</b>」，而且「that probability could be 0」。</span>", "<b>这个细节揭示了 Q 的一个常被忽略的性质：<span class='k'>它被「之后按 π 走」这个尾巴拖着</span>。</b><b>一个烂策略会让所有 Q 值都显得很低</b>，<span class='w'>哪怕那个动作本身是对的</span>。<b>所以 Q 评的从来不是「这个动作好不好」，而是「这个动作 + 这个策略 好不好」。</b>", "<b>但即使在这么烂的策略下，A 仍然指对了方向，这才是这个例子的落点。</b><span class='k'>三个动作里只有 a₃ 的优势为正</span>，<b>于是策略梯度会增加练鼓的概率、降低另外两个的概率</b>。<span class='w'>讲稿的收尾正是这句：the action of practicing had a high advantage relative to the current policy, and so then we would choose to increase the likelihood for practicing。</span>", "<b>注意这个例子里优势全部为 0 或正，没有负的 —— 这恰好验证了上一页那条 <code>𝔼_{a∼π}[A] = 0</code>。</b><span class='k'>当前策略以概率 1 选 a₁，而 A(s,a₁) = 0</span>，<b>按策略取平均正好是 0</b>。<span class='w'>如果策略是随机的，就必然会出现负优势。</span>", "<b>这个例子还顺带说明了一件事：优势函数不需要策略好，就能给出改进方向。</b><span class='k'>策略烂到永远躺着，V = 0，但 A 照样把「练鼓」指出来了</span>。<b>这是策略改进能从任何起点开始的原因</b> —— <span class='w'>你不需要一个好策略来发现更好的动作，只需要能评估当前策略。</span>"], "tbl": {"cap": "练鼓例逐格填空（答案来自讲稿）", "head": ["", "a₁ 坐海滩", "a₂ 看电视", "<b>a₃ 练鼓</b>"], "rows": [["Q^π(s,a)", "0", "0", "<b>「练这段时间后学会的概率」—— 可能是 0 到 1 之间，甚至是 0</b>"], ["V^π(s)", "<b>0（照此策略永远学不会）</b>", "←同", "←同"], ["A^π(s,a) = Q − V", "<b>0</b>", "<b>0</b>", "<b>正数</b>"], ["策略梯度会怎么做", "降低概率", "降低概率", "<b>提高概率</b>"], ["<b>要点</b>", "<b>Q 被「之后按 π 走」的尾巴拖着 ⇒ 烂策略让所有 Q 都显低</b>", "—", "<b>但 A 仍然指对方向</b>"]]}, "say": "<b>讲稿里关于 Q(s,a₃) 的那段追问最值得看，因为它把「一个时间步有多长」这个实现细节和理论值连起来了：</b><br><br>「<span class='k'>The Q function for playing the drums at the current time step would be 1 if that amount of practicing is sufficient. … if you practice for an hour and then sit on the beach by following the policy afterwards, it depends a little bit on how long a given time step is.</span>」<br><br>然后是那个被学生追问出来的答案：<br><br>「<span class='w'>So the question is, if practicing is not enough to actually learn, would it be 1? Would it be between 0 and 1? Would it be 0? It basically actually represents the probability in which you would be able to play this, given that you had practiced for that amount of time, and that probability it could be 0. Maybe this is really, really hard after just practicing [for one time step].</span>」<br><br><b>「时间步定多长」这个看似工程的选择，直接改变了 Q 的数值。</b><span class='k'>时间步定得太短，任何单个动作都看不出效果，所有 Q 都是 0，优势全平 —— 算法学不到任何东西</span>。<br><br><b>这是一个在真实项目里很常见、也很隐蔽的失败模式</b>：<span class='w'>不是算法不行，是时间步的粒度和任务的时间尺度不匹配</span>。", "res": {"tag": "推断", "v": "<b>「时间步定多长会改变 Q 的数值」这件事，在你的课题里对应一个必须定清楚的设计选择：<span class='k'>一次「动作」是改一个算子，还是改一整段？</span></b><br><br>· <span class='w'>粒度太细</span>（一次只换一个算子的一个参数）：<b>单步的效果淹没在噪声里</b>，所有候选看起来都差不多 —— 正是讲稿说的「that probability could be 0」那种情形。<br>· <span class='w'>粒度太粗</span>（一次换半个 workflow）：<b>信用分配又回来了</b>，你不知道是哪一处改动起了作用。<br><br><b>判据是「单步改动的效果能不能超过评估噪声」</b>。<span class='k'>这个可以直接量</span>：<b>取若干对「只差一个算子」的配置，各评估几次，看分数差是否显著大于同一配置重复评估的方差</b>。<br><br><b>不显著 ⇒ 粒度太细，得把动作合并成更大的块。</b>这个实验很便宜，而且结果直接决定你的搜索空间该怎么组织 —— <span class='w'>值得在设计阶段先做，而不是等搜索跑不出效果再回头查</span>。", "ref": "本讲 p7 与讲稿里关于时间步长度的追问"}},
{"r": [8, 8], "t": "正面说出那个不满意：策略梯度没把采来的数据用好", "star": 5, "quote": "What is dissatisfying about policy gradients?  Policy gradients doesn't make efficient use of data!  💡Can we learn what is good & bad?  ∇_θJ(θ) ≈ (1/N) Σ_i Σ_t ∇_θ log π_θ(a_{i,t}|s_{i,t}) ((Σ_{t'=t}^T r) − b).  τ_4: one small step forward then falls backwards → pushes down likelihood of step forward.  τ_2: folds only the sleeves.  τ_3: flattens the jacket but does not fold it.  τ_4: folds the jacket.  → with sparse rewards, don't utilize τ_2 or τ_3.", "one": "<b>这一页把 L03 的两个例子并排放，然后给出一句总诊断：<span class='k'>Policy gradients doesn't make efficient use of data!</b></span><span class='w'>不是梯度算错了，是采来的数据里有信息没被提取出来。</span>", "eq": "两个旧例子（都来自 L03）：\n\n  **走路**：τ⁴ 迈了一小步然后向后倒\n      → 整条轨迹回报低 → **压低「向前迈步」的概率**\n      → 但「迈一小步」这个动作本身是**对的**\n\n  **叠外套**：τ² 只叠了袖子 · τ³ 摊平但没叠 · τ⁴ 叠好了\n      → 稀疏奖励下 τ²、τ³ 的回报都是 0\n      → **with sparse rewards, don't utilize τ₂ or τ₃**\n      → 这两条轨迹里的信息完全被浪费了\n\n────────────────────────────────────────\n诊断（p8 原文）：\n\n  **Policy gradients doesn't make efficient use of data!**\n\n提问（p8）：\n\n  💡 **Can we learn what is good & bad?**\n       （我们能不能**学**出什么是好、什么是坏？）\n\n  ⚠ 注意是 **learn**，不是 observe。这是整讲的转折点：\n     L03 只「观察」整条轨迹的回报；\n     这一讲要「学」一个函数来评价每一步。", "pts": ["<b>「doesn't make efficient use of data」这个诊断比「方差大」准确。</b><span class='k'>方差大是症状，数据没用好是病因</span>。<b>同样一批轨迹，里面明明含有「迈步是好的」「叠袖子是好的」这些信息，但那个梯度式子提取不出来</b> —— <span class='w'>因为它只会把整条轨迹的总回报，均摊到轨迹里的每一个动作上</span>。", "<b>p23 把这一页的答案总结成一对很漂亮的对照，值得提前记住</b>：<span class='k'>Policy gradients: <b>observe</b> what is good vs. bad, then do more of good stuff</span>；<span class='k'>Actor-critic: <b>learn to estimate</b> what is good vs. bad, then do more of the good stuff</span>。<b>observe 与 learn to estimate —— 一词之差就是这一讲。</b>", "<b>讲稿里有一句把「为什么算法做不到」说得很准：we don't necessarily know。</b><span class='w'>算法不是判断错了，它是<b>根本没有能力去判断</b></span> —— <b>它手上只有「整条轨迹的总回报」这一个数</b>。<span class='k'>要让它有能力，就得给它一个能评价单步的东西，那就是值函数。</span>", "<b>注意这一页把「数据效率」和「梯度噪声」接成了一件事。</b><span class='k'>提取不出的信息 ⇒ 只能靠多采样本把噪声平均掉 ⇒ 费数据</span>。<b>反过来，能把每一步评价清楚 ⇒ 同样的数据给出更确定的梯度 ⇒ 省数据</b>。<span class='w'>p10 那句 Better estimates of A lead to less noisy gradients! 说的就是这条链。</span>", "<b>这一页也解释了 Actor-Critic 这个名字。</b><span class='k'>actor（演员）= 策略 π_θ，负责「做」</span>；<span class='k'>critic（评论家）= 值函数，负责「评」</span>。<b>L01 p40 讲稿里那句「if you don't know how good your policy is, then you're not going to be able to make your policy better」</b>，<span class='w'>到这一讲才真正兑现成一个算法</span>。"], "tbl": {"cap": "observe vs. learn to estimate（p23 的那对总结）", "head": ["", "策略梯度（L03）", "<b>Actor-Critic（本讲）</b>"], "rows": [["怎么知道好坏", "<b>observe</b> —— 看整条轨迹的总回报", "<b>learn to estimate</b> —— 学一个函数评价每一步"], ["权重是什么", "Σ_{t'≥t} r − b（<b>一次采样的实现值</b>）", "<b>A^π(s,a)（期望值的估计）</b>"], ["τ² 只叠了袖子", "<b>回报 0，和没碰外套一样</b>", "<b>状态价值更高 ⇒ 优势为正</b>"], ["τ⁴ 迈一步然后倒", "<b>压低「迈步」的概率</b>", "<b>迈步那一步的优势可以是正的</b>"], ["数据效率", "<b>低 —— 信息提取不出来</b>", "<b>高</b>"], ["名字的来历", "—", "<b>actor 做，critic 评</b>"]]}, "say": "<b>讲稿里这一段的收束句，把「数据效率」这个说法定义清楚了：</b><br><br>「<span class='k'>…to summarize here, policy gradients don't always make an efficient use of data that we've collected. And if we can try to figure out what actions are advantageous versus not advantageous, we might be able to make better use of that data.</span>」<br><br><b>注意「make better use of <span class='w'>that</span> data」—— 同一批数据，不是更多数据。</b><br><br><span class='k'>这是整讲最值钱的承诺：不多采一条轨迹，只是把已有轨迹里的信息榨得更干净。</span><br><br>后面还有一个学生的追问很值得看，它澄清了 L03 那个走路例子里到底发生了什么：<br><br>「<span class='w'>the question was, if a step forward is helpful or not, is that going to be negative or neutral? In case of this policy gradient algorithm, the trajectory that we considered here in the context of the batch of trajectories, net negative was below average because the reward to go is quite [low]</span>」<br><br><b>——「迈一步然后倒」不是「中性」，是<span class='k'>负</span>的</b>：<span class='w'>它的剩余回报低于这一批的平均，所以减掉基线之后是负数，于是「迈步」这个正确动作被<b>主动压制</b>了</b>。<b>这比「学不到」更糟。</b>", "link": {"t": "你学过的对应：CS224R L01 p40（讲稿「不知道策略有多好，就不可能让它变好」—— 这一讲是它的兑现）", "href": "L01-精读.html"}, "res": {"tag": "推断", "v": "<b>「同一批数据，把信息榨得更干净」这个承诺，正是你的课题最该追求的东西 —— 因为你多采一条数据的成本远高于多算一会儿。</b><br><br>对照你的搜索：<span class='k'>每评估一个完整配置，你拿到的是一个端到端分数</span>。<b>而那次评估里其实含有更多信息，只是被你扔掉了</b>：<br>· <span class='w'>各级中间输出的质量</span>（如果 workflow 是多级的）；<br>· <span class='w'>各级实际消耗的 token / 调用次数</span>（成本那一侧的分解）；<br>· <span class='w'>在哪些输入上失败</span>（而不只是总体通过率）。<br><br><b>这些全都是「同一次评估里顺带产生、但没被用来更新搜索」的信息</b>。<span class='k'>把它们记下来并用于归因，相当于本讲的 critic 在做的事</span> —— <b>从「整条轨迹一个数」变成「每一步一个评价」</b>。<br><br><b>而这件事对你几乎是白给的</b>：<span class='w'>日志里本来就有，只是没解析</span>。⚠ 前提是你的 workflow 结构允许分解到级；<b>端到端黑盒的那部分，确实只能拿到一个数</b>。", "ref": "本讲 p8 的 doesn't make efficient use of data；讲稿「make better use of that data」"}},
{"r": [9, 10], "t": "把「这一次拿到多少」换成「期望能拿到多少」", "star": 5, "quote": "Improving policy gradients — \"reward to go\": estimate of future rewards if we take a_{i,t} in state s_{i,t}; sum together these rewards.  Can we get a better estimate?  true expected rewards to go.  This would be way better!  What about baselines?  With baseline: Recall A^π(s,a) = Q^π(s,a) − V^π(s).  Better estimates of A lead to less noisy gradients!  ∇_θJ(θ) ≈ (1/N) Σ_i Σ_t ∇_θ log π_θ(a_{i,t}|s_{i,t}) A^π(s_{i,t}, a_{i,t}).", "one": "<b>两页做完了整讲最核心的替换。</b><span class='k'>p9：把「这一条轨迹实际拿到的剩余回报」换成「期望的剩余回报」（那就是 Q）</span>；<span class='k'>p10：再减掉基线 V，就得到优势 A</span>。<b>梯度式子里那一大坨，最后缩成一个 <code>A^π(s,a)</code>。</b>", "eq": "第一步（p9）：reward to go → 期望的 reward to go\n\n  原来的权重：  Σ_{t'=t}^{T} r(s_{i,t'}, a_{i,t'})\n                「在状态 s_{i,t} 走了 a_{i,t} 之后，**这一次**实际拿到的回报总和」\n                —— 它是**一次采样的实现值**，噪声很大\n\n  想要的：      **true expected rewards to go**\n                「在 s 走 a 之后，**期望**能拿到多少」\n                —— 而这正好就是 **Q^π(s, a)** 的定义\n\n  讲义的评语：**This would be way better!**\n\n────────────────────────────────────────\n第二步（p10）：加回基线\n\n  L03 的基线是一个常数 b；现在换成依赖状态的 **V^π(s)**：\n\n      Q^π(s,a) − V^π(s)  =  **A^π(s,a)**        ← 正是 p6 的关系式 ②\n\n最终的梯度（p10）：\n\n  ∇_θ J(θ) ≈ (1/N) Σ_{i=1}^N Σ_{t=1}^T  ∇_θ log π_θ(a_{i,t}|s_{i,t}) · **A^π(s_{i,t}, a_{i,t})**\n\n  对比 L03 的版本：\n\n  L03：  … · ( Σ_{t'≥t} r − b )        ← 一次采样的实现值 − 常数\n  L04：  … · **A^π(s,a)**              ← 期望值 − 依赖状态的基线\n\n  讲义的点题：**Better estimates of A lead to less noisy gradients!**", "pts": ["<b>这个替换的本质是「用期望代替单次实现」，而这正是降方差的标准做法。</b><span class='k'>Σr 是一个随机变量的一次取值；Q^π(s,a) 是它的期望</span>。<b>把随机变量换成它的期望，方差直接归零</b> —— <span class='w'>代价是你不知道那个期望，只能估计它，于是引入了估计误差（偏差）</span>。<b>整讲后半（p14–p22）都在讲怎么估。</b>", "<b>注意这里出现了本讲第一个真正的偏差-方差取舍，而且它会贯穿到底。</b><span class='k'>L03 的权重<b>无偏但高方差</b>（真实采样）；L04 的权重<b>低方差但有偏</b>（学出来的估计）</span>。<b>这是一笔交易，不是免费升级</b> —— <span class='w'>而 p19–p20 会把这笔交易量化成一个可调的参数 n。</span>", "<b>把两步合起来看，L03 的「基线」其实是这一页的一个退化情形。</b><span class='k'>常数基线 b ≈ 对 V^π(s) 的一个「不看状态」的粗糙估计</span>。<b>升级成真正的 V^π(s)，就是让基线「看得见状态」</b>。<span class='w'>所以这不是推翻 L03，是把它的一个零件精化。</span>", "<b>「Better estimates of A lead to less noisy gradients!」这句把整讲后半的动机定死了。</b><span class='k'>A 估得越准 ⇒ 梯度越干净 ⇒ 同样的数据能走更稳的一步</span>。<b>于是「怎么把 A 估准」就成了接下来十页的唯一话题</b>，<span class='w'>而答案有三种（MC / 自举 / N 步），各有各的偏差-方差位置。</span>", "<b>为什么权重用 A 而不是 Q？讲稿给了理由，值得记。</b><span class='k'>「instead of having this be Q values, we could actually use Q minus V」</span> —— <b>用 Q 当权重时，所有动作的权重里都含着同一个 <code>V^π(s)</code></b>，<span class='w'>那部分对「该选哪个动作」毫无信息，只是让权重整体偏大偏小</span>。<b>减掉它，剩下的才是纯粹的「这个动作相对好多少」。</b>"], "tbl": {"cap": "权重的三代形态，以及各自的偏差与方差", "head": ["", "L03 原始", "L03 带基线", "<b>L04 优势</b>"], "rows": [["权重", "Σ_{t'≥t} r", "Σ_{t'≥t} r − b", "<b>A^π(s,a) = Q − V</b>"], ["基线是什么", "<b>没有</b>", "<b>一个常数</b>", "<b>V^π(s)，依赖状态</b>"], ["是期望还是单次", "<b>单次实现</b>", "单次实现", "<b>期望（的估计）</b>"], ["偏差", "<b>无偏</b>", "<b>无偏</b>", "<b>有偏（估计误差）</b>"], ["方差", "<b>最大</b>", "较小", "<b>最小</b>"], ["L03 p17 的 τ²（叠袖子）", "权重 0", "权重 = −b，和没动一样", "<b>优势为正，终于被鼓励</b>"]]}, "say": "<b>讲稿里关于「为什么要减掉 V」那一段，把这个替换的收尾说得很清楚：</b><br><br>「<span class='k'>…one would actually be to use the value function. And so instead of having this be Q values, we could actually use Q minus V. And Q minus V is what the advantage function is. And so putting this together, we would be increasing the likelihood for actions that have a high advantage and decreasing the likelihood for actions that have a low advantage.</span>」<br><br>然后她用练鼓那个例子收尾：<br><br>「<span class='w'>if you think back to the example of learning to practice playing the drums, the action of practicing had a high advantage relative to the current policy. And so then we would choose to increase the likelihood for practicing and decrease the likelihood for the other actions.</span>」<br><br><b>注意 relative to the current policy 这个限定</b>：<span class='k'>优势永远是「相对于当前策略」的</span>。<br><br><b>这有一个重要后果，到 p26 会变成真麻烦</b>：<span class='w'>策略一更新，手上的优势估计就过期了</span> —— 因为它衡量的是「比<b>旧</b>策略好多少」。<b>这正是离策略 Actor-Critic 那半讲要处理的核心问题。</b>", "link": {"t": "你学过的对应：CS224R L03 精读 p16（常数基线 —— 这一页把它升级成依赖状态的 V^π(s)）", "href": "L03-精读.html"}, "res": {"tag": "推断", "v": "<b>「用期望代替单次实现」这个降方差手法，对你的课题有一个很具体的落点：<span class='k'>别用单次评估的分数去做搜索决策</span>。</b><br><br>你的每次评估都是一次带噪的采样。<span class='w'>直接拿它当那个配置的「分数」，等价于 L03 用 Σr 当权重 —— 无偏，但方差大到会误导搜索</span>。<br><br><b>对应的升级有两档</b>：<br>· <span class='w'>重复评估取平均</span> —— 最直接，<b>但每一次都花预算</b>；<br>· <span class='k'>学一个代理模型做预测</span> —— <b>这正是本页的 critic</b>：<span class='w'>用所有历史评估训一个「配置 → 期望分数」的模型，再用它的预测而不是单次观测来决策</span>。<br><br><b>而这一页也同时给出了它的代价，这一点必须认</b>：<span class='k'>代理模型是有偏的</span>。<b>你用它换掉了方差，但换来了「模型可能系统性地看错某一类配置」的风险</b>。<br><br><b>所以这不是免费升级，而是一笔交易</b> —— <span class='w'>和本讲 p19–20 要讲的 MC vs TD 是同一笔交易</span>。<b>实践中的解法也一样：在两端之间找一个中间点</b>（部分依赖模型、部分依赖真实评估），而不是全押一边。", "ref": "本讲 p9–p10；对照 p19–20 的偏差-方差权衡"}},
{"r": [11, 13], "t": "在线 RL 的骨架多了一个方框，而整门课的后半都在填它", "star": 3, "quote": "Online RL Outline — First: Initialize the policy (randomly, with imitation learning, with heuristics).  Run policy to collect batch of data.  Fit model to estimate expected return → Estimate V^π, Q^π, or A^π.  Improve policy → θ ← θ + ∇_θJ(θ).  ∇_θJ(θ) ≈ (1/N) Σ_i Σ_t ∇_θ log π_θ(a_{i,t}|s_{i,t}) A^π(s_{i,t}, a_{i,t}).", "one": "<b>L03 的循环是两个方框：采数据 → 改进策略。</b><span class='k'>这一讲在中间插进了第三个：<b>Fit model to estimate expected return</b></span> —— <b>而这个方框就是 critic。</b><span class='w'>整门课后面十几讲，大部分都是在换这个方框里装什么。</span>", "eq": "在线 RL 的骨架（p11–p12）：\n\n  首先：初始化策略\n         （随机 / **用模仿学习** / 用启发式规则）\n                    ↓\n  ┌──────────────────────────────┐\n  │  Run policy to collect batch of data      采数据\n  │            ↓\n  │  **Fit model to estimate expected return**  ← **这一讲新加的方框**\n  │            ↓                                  估计 V^π、Q^π 或 A^π\n  │  Improve policy                            改进策略\n  │            ↓                                  θ ← θ + ∇_θJ(θ)\n  └──────────┘ （回到第一步）\n\n  改进策略用的梯度：\n\n     ∇_θ J(θ) ≈ (1/N) Σ_i Σ_t  ∇_θ log π_θ(a_{i,t}|s_{i,t}) · A^π(s_{i,t}, a_{i,t})\n\n────────────────────────────────────────\n⚠ 注意初始化那一行里的 **with imitation learning**：\n   这就是 L02 的位置 —— **模仿学习给 RL 提供起点**。\n   L02 p25 那句「Many successful methods combine imitation learning\n   and reinforcement learning!」在这张图上有了具体的位置。", "pts": ["<b>这张图值得抄下来贴在手边，因为后面每一讲都是在换其中某个方框里的东西。</b><span class='k'>换「估计」那个方框 → L04（本讲）、L06 Q-learning</span>；<span class='k'>换「采数据」那个方框 → L07 离线 RL（干脆不采）、L14 探索（采得更聪明）</span>；<span class='k'>换「改进策略」那个方框 → L05 PPO</span>。<b>十几讲，一张图。</b>", "<b>初始化那一行的三个选项不是并列的，它们的实用性差别很大。</b><span class='w'>随机初始化在稀疏奖励任务上几乎学不动</span>（因为一开始什么回报都拿不到）；<b>用模仿学习初始化则能直接把策略放到一个「已经能拿到一些回报」的位置</b>。<span class='k'>这就是为什么课程把 L02 排在前面。</span>", "<b>注意新方框的措辞是 Fit <span class='k'>model</span>，而这个 model 指的是<span class='w'>值函数</span>，不是「世界模型」。</b><b>L11 的 model-based RL 里那个 model 才是动力学模型</b> —— <span class='w'>同一个词在这门课里指两样完全不同的东西</span>。<b>读到后面不要混。</b>", "<b>这个三框循环也解释了 Actor-Critic 为什么比纯策略梯度难调。</b><span class='k'>现在有两个网络在同时学：actor（策略）和 critic（值函数）</span>，<b>而且它们互相依赖</b> —— <span class='w'>critic 要估计当前 actor 的值，actor 要用 critic 的输出来更新</span>。<b>两个都在动的系统，比一个在动的难稳定得多。</b>", "<b>p13 是 p5 的原样重复（提纲页），意味着第 1 段「Improving policy gradients」讲完了。</b><span class='k'>从 p14 开始进入第 2 段：怎么估这个值函数</span>。<span class='w'>本精读把 p13 并进这一条，不单独成条。</span>"], "tbl": {"cap": "三个方框，各由后面哪几讲来换", "head": ["方框", "这一讲装的是", "<b>后面谁来换</b>"], "rows": [["初始化", "随机 / <b>模仿学习</b> / 启发式", "<b>L02（模仿学习就是干这个的）</b>"], ["<b>采数据</b>", "用当前策略跑一批", "<b>L07 离线（不采）· L14 探索（采得更聪明）</b>"], ["<b>估计（新加）</b>", "<b>V^π / Q^π / A^π</b>", "<b>本讲 · L06 Q-learning</b>"], ["改进策略", "θ ← θ + α∇J，权重用 A", "<b>L05 PPO</b>"], ["⚠ 用词", "<b>这里的 model 指值函数</b>", "<b>L11 的 model 指动力学模型，别混</b>"]]}, "say": "<b>这张三框图是整门课的目录，建议读的时候真的把它画下来。</b><br><br>到目前为止你读过的每一讲，都能在上面找到位置：<br><br>· <span class='k'>L02 模仿学习</span> → 「初始化」那一行里的 with imitation learning<br>· <span class='k'>L03 策略梯度</span> → 「改进策略」那个框（而且当时还没有中间那个框）<br>· <span class='k'>L04 本讲</span> → <b>插入中间那个框</b><br>· <span class='w'>L05 PPO</span> → 「改进策略」框的稳定化<br>· <span class='w'>L06 Q-learning</span> → 把中间那个框做到极致（干脆不要显式的策略）<br>· <span class='w'>L07 离线 RL</span> → <b>把「采数据」那个框删掉</b><br><br><b>而这一讲后半（p24 之后）要做的事，在图上也有位置</b>：<span class='k'>把那个从「采数据」回到循环开头的箭头拆开</span> —— <b>让一批数据能在循环里多转几圈</b>。<br><br><span class='w'>知道自己在图上的哪个位置，比记住算法名字有用得多。</span>", "link": {"t": "你学过的对应：CS224R L02 精读 p25（「很多成功方法把模仿学习和强化学习结合」—— 位置就在这张图的初始化那一行）", "href": "L02-精读.html"}, "res": {"tag": "推断", "v": "<b>这张三框图对你的课题有一个直接用处：把你的搜索也画成这三个框，然后看你在每个框里用的是什么。</b><br><br>· <span class='k'>初始化</span> —— 随机？还是用人工 workflow 当起点？（L02 主线卡里讨论过：<b>当先验而不是当模仿目标</b>）<br>· <span class='k'>采数据</span> —— 选哪些配置去评估？（<b>这是你最该下功夫的地方</b>，对应 CSE 541 的实验设计/纯探索）<br>· <span class='k'>估计</span> —— 你的代理模型，或者干脆没有（直接用观测分数）<br>· <span class='k'>改进</span> —— 你的搜索策略怎么根据新结果更新<br><br><b>把这四格填出来，你的方法和 baseline 的差别就一目了然了</b> —— <span class='w'>而且能看出 AFlow 之类的工作是在哪一格和你不同</span>（简报 §2 已核：它在「采数据」那一格用的是 Boltzmann 爬山）。<br><br><b>这也是 related work 那一节的现成骨架</b>：<span class='k'>不是逐篇罗列，而是按格子对照</span>。", "ref": "本讲 p11–12 的三框图；科研简报 §2"}},
{"r": [14, 14], "t": "该拟合哪一个：答案是「只拟合 V，其余用采到的下一步补出来」", "star": 4, "quote": "Estimating expected return — Should we fit V^π, Q^π, or A^π?  (use the sampled s_{t+1}).  Let's just fit V^π!  ∇_θJ(θ) ≈ (1/N) Σ_i Σ_t ∇_θ log π_θ(a_{i,t}|s_{i,t}) A^π(s_{i,t}, a_{i,t}).", "one": "<b>梯度式子里要的是 A，但这一页决定<span class='k'>只去拟合 V</span>。</b>理由是：<span class='w'>有了 V，再借用轨迹里<b>已经采到</b>的那个 s_{t+1}，Q 和 A 都能当场算出来</span> —— <b>不用再训第二个网络。</b>", "eq": "问题（p14）：我们要的是 A，那该拟合哪一个？\n\n  候选     要学什么            代价\n  ─────────────────────────────────────────────────────\n  V^π(s)   **一个**输入是状态的函数      最便宜\n  Q^π(s,a) 输入是状态**与动作**         动作空间大时更难学\n  A^π(s,a) 同上，而且还要先有 V         最贵\n\n答案（p14）：**Let's just fit V^π!**\n\n────────────────────────────────────────\n为什么只拟合 V 就够了 —— 因为轨迹里已经有 s_{t+1} 了（p14 小字 use the sampled s_{t+1}）：\n\n  由定义：  Q^π(s_t, a_t)  =  r(s_t, a_t)  +  𝔼_{s_{t+1}}[ V^π(s_{t+1}) ]\n                              └ 这一步的奖励 ┘   └ 之后照 π 走 ┘\n\n  用轨迹里**采到的那一个** s_{t+1} 作为单样本估计：\n\n            Q^π(s_t, a_t)  ≈  r(s_t, a_t)  +  V̂^π_φ(s_{t+1})\n\n  再减掉 V（p6 的关系式 ②）：\n\n       **Â^π(s_t, a_t)  ≈  r(s_t, a_t)  +  V̂^π_φ(s_{t+1})  −  V̂^π_φ(s_t)**\n\n  ⇒ 一个网络（V̂_φ）+ 轨迹里已有的 (r, s_{t+1})，优势就出来了。\n     这一行就是 p22 完整算法的第 3 步。", "pts": ["<b>这个选择的全部好处是「只训一个网络」，而代价藏在那个单样本估计里。</b><span class='k'>用采到的那<b>一个</b> s_{t+1} 去代替对 s_{t+1} 的期望，是一次采样近似</span> —— <b>环境随机性大时，这一步会引入方差</b>。<span class='w'>讲义没展开，但这是 Actor-Critic 与后面 Q-learning 那一族的一个分野点。</span>", "<b>注意这里又一次用到了 L01 p33 那条「动力学未知」的性质，而且用法很取巧。</b><span class='k'>我们算不出 <code>𝔼_{s_{t+1}}[V(s_{t+1})]</code>（那要知道 <code>p(s_{t+1}|s_t,a_t)</code>）</span>；<b>但我们不需要算 —— 环境已经替我们采了一个样本出来</b>。<span class='w'>「用环境的采样代替对动力学的求期望」是整个无模型 RL 的基本手法。</span>", "<b>为什么不直接拟合 Q？因为 Q 的输入多了动作那一维。</b><span class='k'>动作空间大（或连续）时，同样的数据量要覆盖 (s,a) 的联合空间，比只覆盖 s 难得多</span>。<b>所以在 Actor-Critic 里学 V 更省数据</b> —— <span class='w'>而 L06 的 Q-learning 会反过来选 Q，因为那边根本不维护显式的策略，必须靠 Q 来选动作。</span>", "<b>但这个「只拟合 V」的决定在本讲后半会被推翻一次，值得先埋个伏笔。</b><span class='k'>p31 加了回放缓冲区之后，V 不够用了</span> —— <b>因为缓冲区里的 s' 是旧策略走出来的，而 V 的定义绑着「之后按当前 π 走」</b>。<span class='w'>到那时讲义会把 V 划掉，换成 Q。</span>", "<b>把 p14 这一行和 p22 第 3 步对照着看，你会发现它们是同一个式子。</b><span class='k'>p14 是推导，p22 是算法里的一行代码</span>。<b>中间差的只有一个折扣因子 γ</b>（p21 补的）—— <span class='w'>所以这一页其实已经把整个 critic 的用法写完了，剩下十页都在讲「V̂_φ 本身怎么训」。</span>"], "tbl": {"cap": "三个候选：为什么选 V", "head": ["", "V^π(s)", "Q^π(s,a)", "A^π(s,a)"], "rows": [["输入", "<b>只有状态</b>", "状态 + 动作", "状态 + 动作"], ["数据覆盖难度", "<b>最低</b>", "高（要覆盖 (s,a) 联合）", "高"], ["能直接给梯度用吗", "否", "可以但更吵", "<b>是</b>"], ["<b>本讲的选择</b>", "<b>✓ 只拟合它</b>", "—", "<b>用 r + V̂(s') − V̂(s) 当场算</b>"], ["靠什么补出来", "—", "<b>轨迹里已采到的 s_{t+1}</b>", "再减一个 V̂(s)"], ["⚠ 后面会推翻", "<b>p31 加回放缓冲区后 V 不够用，换成 Q</b>", "—", "—"]]}, "say": "<b>这一页只有四行字，但它决定了整个 Actor-Critic 的形状，值得把那个取巧的地方说透。</b><br><br>我们想要的是 <code>Q^π(s_t,a_t) = r + 𝔼_{s_{t+1}∼p(·|s_t,a_t)}[V^π(s_{t+1})]</code>。<br><br><span class='k'>那个期望是对<b>未知的动力学</b>取的 —— 按理说算不出来。</span><br><br><b>但我们根本不需要算：环境在采轨迹的时候，已经从 <code>p(·|s_t,a_t)</code> 里替我们抽了一个样本出来，那就是 s_{t+1}。</b><br><br><span class='w'>于是「对未知分布求期望」变成了「用手上这一个样本代替」。</span><br><br><b>这个手法在无模型 RL 里无处不在</b>，而且它的代价也一直是同一个：<span class='k'>单样本估计 ⇒ 方差</span>。<b>环境越随机，这一步越不准</b> —— <span class='w'>而下面几页讨论的 MC / 自举 / N 步，本质上就是在选「用多少个这样的单样本估计串起来」。</span>", "link": {"t": "你学过的对应：CS224R L01 p40（V 与 Q 的定义，以及从 V 推 Q 为什么需要动力学）", "href": "L01-精读.html"}},
{"r": [15, 17], "t": "蒙特卡洛：最诚实的估法，代价是你不能把世界倒回去", "star": 4, "quote": "Estimating V^π — Version 1: Monte Carlo estimation.  ← original single sample estimate.  ← multi-sample estimate (but can't reset the world).  Step 1: Aggregate dataset of single sample estimates.  Step 2: Supervised learning to fit estimated value function.", "one": "<b>最朴素的估法：想知道 <code>V^π(s)</code>，就从 s 出发跑到底，把拿到的奖励加起来。</b><span class='k'>跑很多次取平均当然更准</span> —— <b>但讲义当场否掉了：<span class='w'>can't reset the world</span></b>（你没法把世界倒回那个状态再来一次）。", "eq": "想要的（p15–16）：\n\n  单样本估计：  V^π(s)  ≈  Σ_{t'=t}^{T} r(s_{t'}, a_{t'})\n                （从 s 出发跑**一次**，把奖励加起来）\n\n  多样本估计：  V^π(s)  ≈  (1/M) Σ_{m=1}^{M} [ 从 s 出发跑第 m 次的回报和 ]\n                ⚠ **but can't reset the world**\n                （真实环境里你没法回到同一个 s 再来一次）\n\n────────────────────────────────────────\n于是实际做法（p17）：\n\n  **Step 1**: 攒一个**单样本估计**的数据集\n\n       𝒟 = { ( s_{i,t},  y_{i,t} ) }，  其中  **y_{i,t} = Σ_{t'=t}^{T} r(s_{i,t'}, a_{i,t'})**\n\n       ——「这条轨迹从第 t 步往后实际拿到了多少」\n\n  **Step 2**: 监督学习拟合\n\n       min_φ  Σ_{i,t}  ‖ V̂^π_φ(s_{i,t})  −  y_{i,t} ‖²\n\n  ⇒ 注意这就是一个**普通的回归问题**：输入状态，输出一个数。\n     L02 那套「网络该输出什么」的讨论在这里不适用 ——\n     这里要的确实只是**条件均值**，而 ℓ2 回归给的正是条件均值。", "pts": ["<b>「can't reset the world」这句否定是一个真实的物理约束，不是理论洁癖。</b><span class='k'>仿真器里你确实可以存档读档、从同一个状态反复试</span>；<b>而真机、真人、LLM 评估里都不行</b>。<span class='w'>所以多样本估计在仿真里是可用的（有些算法就这么做），在真实场景里不可用。</span>", "<b>但神经网络的泛化悄悄帮回了一部分，这一点值得想一下。</b><span class='k'>虽然每个状态只有一个样本，但相近的状态会被网络归到一起</span> —— <b>于是「对同一状态多次采样取平均」在某种程度上被「对相似状态的样本一起拟合」替代了</b>。<span class='w'>这是函数逼近在 RL 里的一个隐性收益，讲义没提但很实在。</span>", "<b>注意这一步是<span class='k'>无偏</span>的：<code>y_{i,t}</code> 的期望正好是 <code>V^π(s_{i,t})</code>。</b><b>所以蒙特卡洛估值不引入任何偏差</b>，<span class='w'>唯一的毛病是方差大</span> —— <b>因为它把从 t 到 T 的全部随机性（环境的 + 策略的）都累在一个标签里</b>。<span class='k'>T 越长，这个标签越吵。</span>", "<b>Step 2 是一个<span class='w'>普通的监督回归</span>，这和 L02 那场「网络该输出分布而不是一个数」的讨论不冲突。</b><span class='k'>那里要的是动作的分布（多模态），所以单个数不够</span>；<b>这里要的本来就是一个期望值（条件均值），ℓ2 回归给的正好对</b>。<span class='w'>同一个工具，在不同目标下一次是错一次是对 —— 判据是「你要的是分布还是期望」。</span>", "<b>这个做法有一个很实际的限制：必须等轨迹跑完才能算标签。</b><span class='k'><code>y_{i,t} = Σ_{t'=t}^{T} r</code> 里有 T</span> —— <b>没跑到头就算不出来</b>。<span class='w'>所以蒙特卡洛不能用于不会终止的任务，也不能边跑边学</b>。<b>下一页的自举正好解决这一条。</b>"], "tbl": {"cap": "蒙特卡洛估值：好在哪、卡在哪", "head": ["", "评价"], "rows": [["<b>偏差</b>", "<b>无偏 —— y 的期望正好是 V^π(s)</b>"], ["<b>方差</b>", "<b>大 —— 从 t 到 T 的全部随机性都累在一个标签里，T 越长越吵</b>"], ["多采几次取平均？", "<b>✗ can't reset the world（仿真里可以，真实环境里不行）</b>"], ["神经网络有没有帮上忙", "<b>有 —— 相近状态被归到一起拟合，相当于隐性地多采了样</b>"], ["Step 2 用什么损失", "<b>普通 ℓ2 回归（这里要的本来就是条件均值，所以是对的）</b>"], ["<b>致命限制</b>", "<b>必须等轨迹跑完才能算标签 ⇒ 不能用于无终止任务、不能边跑边学</b>"]]}, "say": "<b>「can't reset the world」这句话值得和 L02 p30 那张照片放在一起看。</b><br><br><span class='k'>L02 p30：Yevgen 在镜头外不停地把积木摆回原位 —— 那张照片讲的正是「reset 在真实世界里要人手动做」。</span><br><br><b>而这一页说的是同一件事的另一面</b>：<span class='w'>既然 reset 这么贵，那「从同一个状态跑很多次取平均」这个估值方法就不可用</span>。<br><br><b>两处合起来给出一个判断依据</b>：<br>· <span class='k'>在仿真里</span>：reset 免费 ⇒ 多样本估计可用 ⇒ 蒙特卡洛的方差问题可以靠多采缓解；<br>· <span class='k'>在真机 / 真人 / LLM 评估上</span>：reset 昂贵或不可能 ⇒ <b>只能用单样本估计</b> ⇒ 方差问题必须靠别的办法解决。<br><br><span class='w'>「别的办法」就是下一页的自举 —— 它不需要跑到底，也不需要 reset。</span>", "link": {"t": "你学过的对应：CS224R L02 精读 p30（Yevgen 那张照片：reset 在真实世界里要人手动做）", "href": "L02-精读.html"}},
{"r": [18, 18], "t": "自举：用自己现在的估计，去造自己下一步的标签", "star": 5, "quote": "Estimating V^π — Version 2: Bootstrapping.  Step 1: Aggregate dataset of \"bootstrapped\" estimates: y_{i,t} = r(s_{i,t}, a_{i,t}) + V̂^π_φ(s_{i,t+1}).  Step 2: Supervised learning to fit estimated value function.  ← update labels every gradient update!  Also referred to as a form of temporal difference learning.", "one": "<b>不等轨迹跑完了：只走一步，剩下的用<span class='k'>自己当前的估计</span>顶上。</b><span class='w'>标签里出现了 V̂_φ 自己</span> —— <b>这就是「自举」（bootstrapping）这个名字的来历：拽着自己的鞋带把自己提起来。</b>", "eq": "自举的标签（p18）：\n\n  **y_{i,t}  =  r(s_{i,t}, a_{i,t})  +  V̂^π_φ(s_{i,t+1})**\n                └ 真实走了一步的奖励 ┘   └ **自己现在的估计** ┘\n\n  对照蒙特卡洛：\n\n  MC：  y_{i,t} = r_t + r_{t+1} + r_{t+2} + … + r_T        ← 全是真实奖励\n  自举：y_{i,t} = r_t + **V̂_φ(s_{t+1})**                    ← 一步真实 + 其余靠估计\n\n────────────────────────────────────────\n两条关键注记（p18）：\n\n  ⚠ **update labels every gradient update!**\n     标签里含有 V̂_φ，而 φ 每步都在变 ⇒ **标签是移动的**\n     （监督学习里标签是固定的，这里不是 —— 这是 RL 特有的麻烦）\n\n  · **Also referred to as a form of temporal difference learning**\n     时序差分（TD）学习 —— 名字来自那个「差」：\n\n         δ  =  r_t + V̂_φ(s_{t+1})  −  V̂_φ(s_t)\n               └─── 新的估计 ───┘   └ 旧的估计 ┘\n\n     ⇒ 而这个 δ 正好就是 p14 推出来的那个 **优势估计**。\n        TD 误差与优势，在一步情形下是同一个量。", "pts": ["<b>「标签里含有自己」这件事是 RL 和监督学习最深的一条分界，值得停一下。</b><span class='k'>监督学习里标签是外部给的、固定的</span>；<b>这里标签由当前模型自己算出来，模型一更新标签就变</b>。<span class='w'>所以这不是在拟合一个固定的目标，而是在追一个会跑的目标</span> —— <b>收敛性因此要另外论证（而且在用神经网络时并不总是成立）。</b>", "<b>「update labels every gradient update!」那个感叹号是在提醒一个实现陷阱。</b><span class='k'>如果你算一次标签、然后在它上面训很多步，那些标签很快就过期了</span>。<b>实践中的标准做法是用一个「目标网络」（target network）<span class='w'>慢一拍</span>地提供 V̂</b> —— <span class='k'>这样标签不会每步都跳</span>。<b>讲义这里没展开，L06 的 Q-learning 会正面讲。</b>", "<b>TD 误差 <code>δ = r + V̂(s') − V̂(s)</code> 和 p14 那个优势估计是<span class='k'>同一个式子</span>，这个重合不是巧合。</b><span class='w'>「比我原本以为的好多少」= 「这个动作的优势」</span>。<b>所以 critic 的训练信号和 actor 的更新权重，用的是同一个量</b> —— <span class='k'>这是 Actor-Critic 实现起来比看上去简洁的原因。</span>", "<b>自举把蒙特卡洛的两个毛病同时解决了。</b><span class='k'>① 不用等轨迹跑完 ⇒ 可以边跑边学，也能处理无终止任务</span>；<span class='k'>② 标签里只含一步的真实随机性 ⇒ 方差小得多</span>。<b>代价只有一个，但很重：<span class='w'>有偏</span></b> —— <span class='w'>因为 V̂_φ(s_{t+1}) 本身是估出来的，它错了，标签就跟着错。</span>", "<b>刚开始训练时，这个偏差尤其严重，而且有自我强化的风险。</b><span class='k'>V̂_φ 随机初始化 ⇒ 标签几乎是噪声 ⇒ 用噪声训出来的 V̂ 又去造下一批标签</span>。<b>它最终能收敛，靠的是那一项<span class='w'>真实的</span> <code>r</code></b> —— <span class='k'>真实奖励是唯一的外部锚点，信息就是从它一步步往回传的</span>。"], "tbl": {"cap": "蒙特卡洛 vs 自举：一笔明确的交易", "head": ["", "蒙特卡洛", "<b>自举 / TD</b>"], "rows": [["标签", "Σ_{t'=t}^T r（全是真实奖励）", "<b>r_t + V̂_φ(s_{t+1})</b>"], ["偏差", "<b>无偏</b>", "<b>有偏（V̂ 自己可能是错的）</b>"], ["方差", "<b>大（累积 t 到 T 的全部随机性）</b>", "<b>小（只有一步的随机性）</b>"], ["要等轨迹跑完吗", "<b>要</b>", "<b>不要 —— 能边跑边学</b>"], ["能处理无终止任务吗", "<b>不能</b>", "<b>能</b>"], ["标签固定吗", "<b>固定</b>", "<b>会动 —— update labels every gradient update!</b>"], ["外部锚点", "全部奖励", "<b>只有那一项真实的 r</b>"]]}, "say": "<b>「bootstrapping」这个词在统计里还有另一个完全不同的意思，值得分清，否则读文献会撞车。</b><br><br>· <span class='w'>统计里的 bootstrap</span>：从样本里<b>有放回地重采样</b>，用来估计统计量的分布。<br>· <span class='k'>RL 里的 bootstrapping</span>：<b>用自己当前的估计去构造学习目标</b>。<br><br><span class='w'>两者毫无关系，只是共用了「拽自己鞋带」这个比喻。</span><br><br><b>而 RL 这个用法里，那个比喻其实相当贴切</b>：<span class='k'>你用一个还不准的 V̂ 去造标签，训出一个稍微准一点的 V̂，再用它去造更好的标签</span>。<br><br><b>听起来像永动机，但它不是</b> —— <span class='w'>因为每一轮的标签里都掺进了一项<b>真实的</b> <code>r</code></span>。<b>信息就是靠那一项，从有奖励的地方一步一步往回渗的。</b><br><br><span class='k'>这也解释了为什么稀疏奖励下 TD 学得慢：奖励离起点越远，信息要渗过的步数就越多</span> —— 而 p20 的 N 步回报正是在缩短这条路径。", "res": {"tag": "推断", "v": "<b>「用自己的估计造自己的标签」这个模式，在你的课题里如果出现，要格外小心 —— 它有自我强化错误的风险。</b><br><br><span class='k'>一个具体的场景</span>：你用代理模型预测某些没跑过的配置的分数，<b>然后把这些<span class='w'>预测值</span>当成数据去训练/更新代理模型本身</b>，或者用它们去做剪枝决策、再把剪枝结果当成「这片区域不好」的证据。<br><br><b>这就是自举，而且比 RL 那边更危险</b>：<span class='k'>RL 的标签里至少掺着一项真实的 r 当锚点</span>；<b>而「用预测值反哺模型」如果没有新的真实评估进来，就是纯粹的自我循环</b> —— <span class='w'>模型会越来越自信地重复自己最初的偏见</span>。<br><br><b>所以判据很清楚：每一轮更新里，必须有<span class='k'>真实评估</span>这个外部锚点。</b><br><br><b>而这也给了你一个可以主动做的检查</b>：<span class='w'>统计「被剪掉的区域里，后来被真实评估证实确实不好的比例」</span> —— <b>如果你从不回去验证被剪掉的区域，你就永远不会发现剪错了</b>。偶尔抽样验证一下被剪区域，成本不高，但能挡住最危险的那类失败。", "ref": "本讲 p18 的自举；真实 r 作为外部锚点那一条是补的"}},
{"r": [19, 20], "t": "偏差与方差摆在同一张图上，然后给出那个可调的旋钮", "star": 5, "quote": "Think-pair-share: Estimating V^π: Monte Carlo vs. Bootstrap.  Monte Carlo: y_{i,t} = Σ_{t'=t}^T r(s_{i,t'}, a_{i,t'}) — supervise with roll-out's summed rewards.  Bootstrapped: y_{i,t} = r(s_{i,t},a_{i,t}) + V̂^π_φ(s_{i,t+1}) — supervise using reward and current value estimate.  r = -1, r = 1, r = 0 along trajectory.  Is there middle ground?  Can we balance bias and variance?  N-step returns: y_{i,t} = Σ_{t'=t}^{t+n−1} r(s_{i,t'},a_{i,t'}) + V̂^π_φ(s_{i,t+n}).  often works the best in practice!  n > 1, n < T.  Bootstrapped: using r+V → less variance than MC.  Monte Carlo: using Σ_t^T r → lower bias than 1-step bootstrap.", "one": "<b>p19 画了一张很干净的图把问题摆出来</b>：两条轨迹从同一片区域出发，<span class='k'>一条走到 r = −1，另一条走到 r = +1，中间全是 0</span>。<b>问同一个状态上 MC 和 TD 各给出什么。</b><span class='w'>而 p20 的答案是一个旋钮：N 步回报。</span>", "eq": "p19 的配图（think-pair-share）：\n\n  两条轨迹，从下方出发，在中途**交叉**，然后分开：\n      一条走到 **r = −1**（红点）\n      一条走到 **r = +1**（绿点）\n      **r = 0 along trajectory**（中途全是 0）\n\n  在交叉附近的**蓝点**与下方的**粉点**上，问：\n      V̂^π_MC(s) ≈ ?      V̂^π_TD(s) ≈ ?\n\n  要点：\n    **MC** 的标签完全由「这一条轨迹最后走到哪」决定\n        ⇒ 蓝点上两条轨迹给出 **+1 与 −1 两个差很远的标签** ⇒ **方差大**\n    **TD** 的标签是 r + V̂(下一个状态)\n        ⇒ 相邻状态的估计互相牵制，**平滑得多** ⇒ **方差小**\n        ⇒ 但如果 V̂ 本身偏了，整片区域会**一起偏** ⇒ **有偏**\n\n  p19 的收尾设问：\n    **Is there middle ground?  Can we balance bias and variance?**\n\n────────────────────────────────────────\np20 的答案：**N 步回报**\n\n  **y_{i,t}  =  Σ_{t'=t}^{t+n−1} r(s_{i,t'}, a_{i,t'})  +  V̂^π_φ(s_{i,t+n})**\n                └── 走 n 步真实奖励 ──┘        └ 第 n 步之后交给估计 ┘\n\n  两个端点就是前两页：\n      n = 1  →  自举（TD）\n      n = T  →  蒙特卡洛\n\n  讲义的两句评价：\n      **Bootstrapped（用 r+V）→ less variance than MC**\n      **Monte Carlo（用 Σr）  → lower bias than 1-step bootstrap**\n\n  推荐取值：**n > 1, n < T**，并注明 **often works the best in practice!**", "pts": ["<b>p19 那张图的设计很讲究：两条轨迹<span class='k'>交叉</span>之后才分开去往 +1 和 −1。</b><span class='w'>这意味着在交叉点附近，两条轨迹的状态几乎相同，但 MC 标签一个是 +1、一个是 −1</span>。<b>同样的输入、相反的标签 —— 这就是 MC 方差大的最直观画面。</b>", "<b>而 TD 在同一个点上会给出接近的估计，因为它只看一步，剩下的交给 V̂。</b><span class='k'>相邻状态共享同一个 V̂_φ，于是估计天然是平滑的</span>。<b>代价是：如果 V̂_φ 在那片区域整体偏高，所有点会<span class='w'>一起</span>偏高</b> —— <span class='w'>方差小了，但错得很一致。</span>", "<b>N 步回报把两端连成了一条连续的谱，而 n 就是那个旋钮。</b><span class='k'>n 越小 ⇒ 越依赖估计 ⇒ 偏差大、方差小</span>；<span class='k'>n 越大 ⇒ 越依赖真实奖励 ⇒ 偏差小、方差大</span>。<b>而讲义说最好的取法在中间：<code>n > 1, n < T</code>，<span class='w'>often works the best in practice!</span></b>", "<b>为什么中间最好，有一个直觉上的解释：真实奖励的信息价值随距离递减。</b><span class='k'>前几步的真实奖励信息量大、噪声小</span>；<b>而几十步之后的奖励，和当前这个状态的因果联系已经很弱，主要贡献的是噪声</b>。<span class='w'>N 步回报等于说：近处用真的，远处用估的。</span>", "<b>这个旋钮后来被做成了连续的版本，知道名字有好处。</b><span class='k'>GAE（Generalized Advantage Estimation）用一个 λ ∈ [0,1] 对所有 n 做指数加权平均</span>，<b>于是不用离散地挑 n</b>。<span class='w'>PPO 的标准实现里用的就是 GAE</span> —— <b>所以你在 L05 读到的 PPO，它的优势估计正是这一页的连续化版本。</b>"], "tbl": {"cap": "n 这个旋钮：两端与中间", "head": ["", "n = 1（自举/TD）", "<b>1 < n < T（N 步）</b>", "n = T（蒙特卡洛）"], "rows": [["标签", "r + V̂(s_{t+1})", "<b>n 步真实奖励 + V̂(s_{t+n})</b>", "全部真实奖励"], ["偏差", "<b>大</b>", "<b>中</b>", "<b>无</b>"], ["方差", "<b>小</b>", "<b>中</b>", "<b>大</b>"], ["要等轨迹跑完吗", "不要", "<b>等 n 步</b>", "<b>要</b>"], ["讲义评价", "less variance than MC", "<b>often works the best in practice!</b>", "lower bias than 1-step"], ["连续化版本", "—", "<b>GAE（用 λ 对所有 n 加权）</b>", "—"]]}, "say": "<b>这一页的偏差-方差权衡，和 L03 那一讲的四件降方差手段放在一起，能看出一条很清楚的升级线：</b><br><br>· <span class='k'>L03 的因果性与基线</span>：<b>无偏</b>的降方差 —— 白赚，没有代价。<br>· <span class='k'>L04 的 critic</span>：<b>有偏</b>的降方差 —— 这是一笔交易。<br><br><b>而这一页做的事，是把那笔交易从「要不要做」变成「做多少」。</b><br><br><span class='w'>n = T 就是不做（纯 MC，无偏）；n = 1 就是全做（纯 TD，偏差最大）；中间任选。</span><br><br><b>把一个二选一变成一个连续旋钮，这是一个在方法设计上很值得学的动作。</b><span class='k'>很多看起来对立的方法，其实是同一个谱的两端</span> —— 找到那个谱，你就得到了一整族方法，而且通常中间那一段比两端都好。<br><br><b>这一讲后面还会再出现一次同样的模式</b>：<span class='w'>p35 的「more off-policy vs. less off-policy」也是一个谱</span>，<b>两端分别是「每批只走一步」和「全部历史数据都复用」</b>。", "link": {"t": "你学过的对应：CS224R L03 精读（四件降方差手段，以及「白赚 vs 交易」那个分级）", "href": "L03-精读.html"}, "res": {"tag": "推断", "v": "<b>「把二选一变成一个连续旋钮」这个动作，对你的课题可能直接是一个贡献点。</b><br><br>你的搜索里有若干处是二选一的：<br>· <span class='w'>剪枝 vs 不剪枝</span>（硬剪掉，还是只降低优先级？）<br>· <span class='w'>信代理模型 vs 信真实评估</span>（用预测值决策，还是必须真跑？）<br>· <span class='w'>探索 vs 利用</span><br><br><b>第一条尤其值得想</b>：<span class='k'>现在的 dominance-pruning 大概率是硬剪 —— 一旦判定被支配就彻底删掉</span>。<b>但完全可以做成一个旋钮</b>：<span class='w'>按「被支配的置信度」给配置降权，而不是直接归零</span>。<br><br><b>好处有两个</b>：① <span class='k'>剪错了还有机会救回来</span>（而硬剪是不可逆的）；② <b>重要性采样那条硬前提（q ≠ 0）重新成立了</b> —— <span class='w'>降权之后概率仍然非零，于是日志还能用于离线评估</span>（L03 主线卡里标出的那个限制，就这么被解开了）。<br><br>⚠ 代价是搜索效率下降（你仍然会偶尔去试被支配的配置）。<b>所以这又是一个旋钮，而不是一个免费的改进</b> —— 但<span class='k'>「硬剪枝是 λ=0 的特例」这个叙述本身就比「我们用硬剪枝」强</b>。", "ref": "本讲 p20 的 N 步回报；对照 L03 主线卡里「剪枝掉的配置 q=0」那条限制"}},
{"r": [21, 22], "t": "补上折扣因子，然后五步写完整个 Actor-Critic", "star": 5, "quote": "Aside: discount factors.  A Full Algorithm Walkthrough — 1. Sample batch of data {(s_{1,i}, a_{1,i}, …, s_{T,i}, a_{T,i})} from π_θ.  2. Fit V̂^{π_θ}_ϕ to summed rewards in data.  3. Evaluate Â^{π_θ}(s_{t,i}, a_{t,i}) = r(s_{t,i}, a_{t,i}) + γV̂^{π_θ}_ϕ(s_{t+1,i}) − V̂^{π_θ}_ϕ(s_{t,i}) ∀t, i.  4. Evaluate ∇_θJ(θ) ≈ Σ_{t,i} ∇_θ log π_θ(a_{t,i}|s_{t,i}) Â^{π_θ}(s_{t,i}, a_{t,i}).  5. Update θ ← θ + α∇_θJ(θ).  \"actor-critic algorithm\"", "one": "<b>整讲到此收口：五步，而且每一步前面都讲过了。</b><span class='k'>第 2 步是 critic 的训练，第 3 步是那个 TD 误差，第 4–5 步是 L03 的策略梯度</span> —— <b>Actor 和 Critic 在这五行里第一次并排出现。</b>", "eq": "完整算法（p22，讲义称之为 **actor-critic algorithm**）：\n\n  **1.** 用 π_θ 采一批数据 { (s_{1,i}, a_{1,i}, …, s_{T,i}, a_{T,i}) }\n\n  **2.** 把 V̂^{π_θ}_φ 拟合到数据里的回报和\n         （用 p15–20 三种方法里的任意一种：MC / 自举 / N 步）\n                                                        ← **critic 的训练**\n\n  **3.** 对所有 t, i 评估优势：\n\n         **Â^{π_θ}(s_{t,i}, a_{t,i})  =  r(s_{t,i},a_{t,i})  +  γ·V̂_φ(s_{t+1,i})  −  V̂_φ(s_{t,i})**\n                                        └────── 就是那个 TD 误差 ──────┘\n\n  **4.** 评估梯度：\n\n         ∇_θ J(θ)  ≈  Σ_{t,i}  ∇_θ log π_θ(a_{t,i}|s_{t,i}) · Â^{π_θ}(s_{t,i}, a_{t,i})\n                                                        ← **actor 的更新方向**\n\n  **5.** θ ← θ + α∇_θ J(θ)\n\n  （带 N 步的版本：y_{i,t} = Σ_{t'=t}^{t+n−1} r  +  **γⁿ**·V̂_φ(s_{i,t+n})）\n\n────────────────────────────────────────\n折扣因子 γ（p21，讲义标为 Aside）：\n\n  它干两件事：\n    ① **数学上**：让无限长任务的回报和收敛（Σγᵗr 有界）\n    ② **实践上**：把「远处的奖励」打折 ⇒ **降方差**\n       —— 远处的奖励与当前动作的因果联系弱，打折等于少信它\n\n  ⚠ 注意 γ 和上一页的 n 是**两个不同的旋钮**，都在调同一件事：\n     n：走几步真实奖励之后交给估计\n     γ：真实奖励本身随距离衰减多快", "pts": ["<b>第 3 步那一行同时是三样东西，认出这个重合，整个算法就通了。</b><span class='k'>它是 p14 推出的优势估计</span>、<span class='k'>是 p18 的 TD 误差 δ</span>、<span class='k'>也是 critic 训练时的残差</span>。<b>同一个量，actor 拿它当权重，critic 拿它当误差信号。</b><span class='w'>所以实现时它只算一次。</span>", "<b>折扣因子 γ 被讲义标成 Aside（插叙），但它在实践中是一个要调的关键超参。</b><span class='k'>γ 太小 ⇒ 策略变得短视，学不会需要长期铺垫的行为</span>；<span class='k'>γ 太大（接近 1）⇒ 方差大、训练不稳</span>。<b>常见取值 0.95–0.99</b>，<span class='w'>而它的合适值与「一个时间步代表多长」直接相关（回到 p7 讲稿那个追问）</span>。", "<b>γ 和 n 是两个在调同一件事的旋钮，但方式不同。</b><span class='k'>n 是「硬截断」：走 n 步真实的，之后全部交给估计</span>；<span class='k'>γ 是「软衰减」：所有步都要，但越远权重越小</span>。<b>实践中两个一起用</b>，<span class='w'>而 GAE 的 λ 其实是第三个旋钮</span> —— 三个都在回答同一个问题：<b>你有多信远处的真实奖励。</b>", "<b>这五步里，第 2 步是整个算法最脆弱的地方。</b><span class='k'>critic 没训好 ⇒ 优势估计是错的 ⇒ actor 朝错的方向更新 ⇒ 采来的数据分布变差 ⇒ critic 更难训</span>。<b>这是一个会自我强化的失败回路</b>，<span class='w'>也是 Actor-Critic 比纯策略梯度难调的根本原因</span>。", "<b>注意第 1 步明写着 from π_θ —— 这个算法仍然是 on-policy 的。</b><span class='k'>每轮都要用当前策略重新采一批</span>。<b>这一讲前半解决的是「数据用得更充分」，不是「数据能复用」</b> —— <span class='w'>后者是 p25 之后那半讲的事</span>。"], "tbl": {"cap": "五步各自对应前面哪一页", "head": ["步", "做什么", "<b>出处</b>", "属于谁"], "rows": [["1", "用 π_θ 采一批", "L03", "—"], ["<b>2</b>", "<b>拟合 V̂_φ</b>", "<b>p15–p20（三种方法任选）</b>", "<b>critic</b>"], ["<b>3</b>", "<b>Â = r + γV̂(s') − V̂(s)</b>", "<b>p14 的推导 = p18 的 TD 误差</b>", "<b>两者共用</b>"], ["4", "∇J ≈ Σ ∇log π · Â", "p10", "<b>actor</b>"], ["5", "θ ← θ + α∇J", "L03", "actor"], ["<b>⚠ 最脆弱的一步</b>", "<b>第 2 步 —— critic 没训好会拖垮整个回路</b>", "—", "—"]]}, "say": "<b>这五步值得和 L03 的算法并排写一遍，差别只有一行：</b><br><br><b>L03（策略梯度）：</b><br>1. 采一批 → 2. 算 <code>Σ_{t'≥t} r − b</code> → 3. 算梯度 → 4. 更新<br><br><b>L04（Actor-Critic）：</b><br>1. 采一批 → <span class='k'>2. **训一个 V̂_φ**</span> → 3. 算 <code>Â = r + γV̂(s') − V̂(s)</code> → 4. 算梯度 → 5. 更新<br><br><span class='w'>多出来的就是第 2 步，以及由它带来的第 3 步形态变化。</span><br><br><b>而整讲前 21 页，全部是在论证这一步为什么值得加</b>：<br>· <span class='k'>p8</span>：不加的话，数据里的信息提取不出来<br>· <span class='k'>p9–10</span>：加了之后权重从「单次实现」变成「期望的估计」<br>· <span class='k'>p14–20</span>：这个估计具体怎么做，以及它的偏差-方差代价<br><br><b>一讲加一步，而那一步值二十页的论证 —— 这是一个很好的「方法论文该怎么写」的样本。</b>", "res": {"tag": "推断", "v": "<b>「同一个量，actor 当权重、critic 当误差」这个复用，在你的课题里有一个对应，而且能省一半工作量。</b><br><br><span class='k'>你的代理模型的预测误差 <code>(真实分数 − 预测分数)</code></span>，同时是两样东西：<br>· <b>代理模型的训练信号</b>（拿它做梯度下降）；<br>· <b>「这个配置比我以为的好多少」</b> —— <span class='w'>一个可以直接用于搜索决策的量</span>。<br><br><b>误差为正（实际比预测好）⇒ 这片区域值得多看</b>；<span class='k'>而这正是基于模型的优化里「期望改进」那一族判据的朴素版本</span>。<br><br><b>更有用的是它的诊断价值</b>：<span class='w'>把这个残差按配置的某个属性分组（例如按算子种类、按配置长度），看残差是否系统性偏向某一组</span> —— <b>偏了就说明代理模型在那一类上有系统偏差，而剪枝正建立在它的判断上</b>。<br><br><b>这个检查几乎不花钱</b>（日志里本来就有预测值和真实值），<span class='k'>但能提前发现「剪枝正在系统性地剪错某一类配置」这种最危险的失败</span>。", "ref": "本讲 p22 第 3 步（TD 误差与优势是同一个量）"}},
{"r": [23, 23], "t": "小结：observe 与 learn to estimate，一词之差", "star": 2, "quote": "Review so far — Policy gradients: observe what is good vs. bad, then do more of good stuff.  Actor-critic: learn to estimate what is good vs. bad, then do more of the good stuff — i.e. get a better policy gradient by using neural network to estimate value function.  How to estimate value (\"policy evaluation\"): Supervised learning directly on observed sum of future rewards; Supervised learning on current reward + value estimate of next state; Hybrid: Supervised learning on sum of next n rewards + value of state after that.  What about off-policy versions?", "one": "<b>一句话把两讲的关系说清楚了：<span class='k'>observe</span>（观察）→ <span class='k'>learn to estimate</span>（学着估计）。</b><span class='w'>而三种估值方法在这里第一次被并排列出，p24 会给它们填上正式名字。</span>", "eq": "两讲的对照（p23 原文）：\n\n  **Policy gradients**：\n      **observe** what is good vs. bad, then do more of good stuff\n\n  **Actor-critic**：\n      **learn to estimate** what is good vs. bad, then do more of the good stuff\n      i.e. get a better policy gradient by using neural network to estimate value function\n\n────────────────────────────────────────\n三种估值方法（p23 并排列出，p24 填上名字）：\n\n  ① 直接对「观察到的未来奖励和」做监督学习\n       → **Monte Carlo estimation**（蒙特卡洛估计）\n\n  ② 对「当前奖励 + 下一状态的价值估计」做监督学习\n       → **bootstrapping** / **temporal difference learning**（自举 / 时序差分）\n\n  ③ 混合：对「接下来 n 步奖励之和 + 那之后那个状态的价值」做监督学习\n       → **N-step returns**（N 步回报）\n\n  这一整段的名字（p24）：**policy evaluation**（策略评估）\n\n────────────────────────────────────────\np23 的收尾设问：**What about off-policy versions?**\n  ⇒ 下半讲（p25–p35）的全部内容。", "pts": ["<b>「policy evaluation」这个名字值得记住，它是 RL 里一个标准术语。</b><span class='k'>给定一个策略，估计它的值函数 —— 这件事本身是一个独立的子问题</span>。<b>它和「policy improvement」（用值函数改进策略）合起来叫 policy iteration</b>，<span class='w'>是整个动态规划/RL 理论的骨架</span>。<b>Actor-Critic 就是这两步交替进行的一个实例。</b>", "<b>三种方法的排列顺序是按「依赖估计的程度」递增的，而不是按复杂度。</b><span class='k'>MC 完全不依赖估计 → N 步部分依赖 → TD 完全依赖</span>。<b>看懂这条轴，你就知道任何一个新方法该放在哪个位置</b>。<span class='w'>（GAE 不是第四种方法，它是在这条轴上做连续加权。）</span>", "<b>注意 p23 这句 i.e. get a better policy gradient by using neural network to estimate value function —— 它强调的是 better policy gradient。</b><span class='k'>Actor-Critic 不是另一个算法家族，它仍然是策略梯度</span>，<b>只是把权重算得更好了</b>。<span class='w'>这与 L06 的 Q-learning 不同，那边会彻底不要显式的策略。</span>", "<b>收尾那个设问 What about off-policy versions? 把这一讲剩下的一半接上了。</b><span class='k'>前半解决「数据里的信息用得更充分」，后半解决「数据本身能不能复用」</span>。<b>两件事正交，而且后半要在前半的基础上做</b> —— <span class='w'>所以 p25 的算法就是 p22 那五步，只在第 4 步插了重要性权重。</span>"], "tbl": {"cap": "三种估值方法，以及它们的正式名字（p24 填的）", "head": ["做法（p23 的描述）", "<b>正式名字（p24）</b>", "依赖估计的程度"], "rows": [["直接对观察到的未来奖励和做监督", "<b>Monte Carlo estimation</b>", "<b>完全不依赖</b>"], ["对「当前奖励 + 下一状态价值估计」做监督", "<b>bootstrapping / TD learning</b>", "<b>完全依赖</b>"], ["混合：n 步奖励 + 之后那个状态的价值", "<b>N-step returns</b>", "<b>部分依赖（n 调）</b>"], ["<b>这一整段的名字</b>", "<b>policy evaluation</b>", "—"], ["与之配对的另一半", "<b>policy improvement（用值函数改进策略）</b>", "—"]]}, "say": "<b>把这一讲前半压成一句话：<span class='k'>加一个 critic，把梯度里那个权重从「这一次实际拿到多少」换成「期望能拿到多少」。</span></b><br><br><b>而代价是一笔明确的交易</b>：<span class='w'>方差小了，偏差来了</span>。三种估值方法就是在这笔交易上的三个位置。<br><br><b>下半讲（p25 之后）要做的是另一件完全不同的事</b>：<span class='k'>让一批数据能被反复使用</span>。<br><br><b>两件事可以叠加，而叠加之后就是现代的主流算法</b>：<br>· <span class='w'>critic + 轻度离策略（多走几步 + 裁剪）</span> → **PPO**（L05，你已经读过）<br>· <span class='w'>critic + 重度离策略（回放缓冲区）</span> → **SAC**（p34 会点名）<br><br><b>所以这一讲是一个分岔点</b>：<span class='k'>往左走通向 PPO，往右走通向 SAC</span>，而 p35 会把这两条路的取舍明确摆出来。", "link": {"t": "你学过的对应：CS224R L05 精读（critic + 轻度离策略 = PPO，这一讲的左边那条路）", "href": "L05-精读.html"}},
{"r": [24, 27], "t": "版本一：同一套五步，只在第 4 步插一个重要性权重", "star": 5, "quote": "Off-Policy Actor-Critic Methods — Version 1: Multiple Gradient Steps.  1. Sample batch of data from π_θ.  2. Fit V̂^{π_θ}_ϕ to summed rewards in data.  3. Evaluate Â^{π_θ}(s_{t,i},a_{t,i}) = r + γV̂_ϕ(s_{t+1,i}) − V̂_ϕ(s_{t,i}).  4. Evaluate ∇_{θ'}J(θ') ≈ Σ_{t,i} [π_{θ'}(a_{i,t}|s_{i,t})/π_θ(a_{i,t}|s_{i,t})] ∇_{θ'} log π_{θ'}(a_{t,i}|s_{t,i}) Â^{π_θ}(s_{t,i},a_{t,i}) ← use importance weights here.  5. Update θ ← θ + α∇_θJ(θ).  What can go wrong if you take too many gradient steps?  Advantages are based on old policy, will get out-dated.  Policy will increase probability on actions with high advantages.  💡Idea 1: Use KL constraint on policy. We will see this in LLM preference optimization.  💡Idea 2: Can we bound the importance weights?  Doesn't directly constrain policy, but removes incentives → Key idea behind proximal policy optimization (PPO).", "one": "<b>这四页做的事非常克制：p22 那五步一字不改，只在第 4 步插一个重要性权重。</b><span class='k'>于是一批数据能走多步梯度</span> —— <b>而「走太多步会怎样」的答案，直接引出了 PPO。</b>", "eq": "版本一 = p22 五步 + 一处改动（p25）：\n\n  1. 用 π_θ 采一批\n  2. 拟合 V̂^{π_θ}_φ\n  3. 评估 Â^{π_θ}(s_{t,i},a_{t,i}) = r + γV̂_φ(s_{t+1,i}) − V̂_φ(s_{t,i})\n  4. 评估梯度   ← **use importance weights here**\n\n     ∇_{θ'}J(θ') ≈ Σ_{t,i} **[ π_{θ'}(a_{i,t}|s_{i,t}) / π_θ(a_{i,t}|s_{i,t}) ]**\n                            · ∇_{θ'} log π_{θ'}(a_{t,i}|s_{t,i})\n                            · Â^{**π_θ**}(s_{t,i}, a_{t,i})\n  5. θ ← θ + α∇J ，**回到第 4 步再走一次**\n\n  ⇒ 那个重要性权重就是 L03 p23 推出来的「逐时刻的常见最终形式」。\n\n────────────────────────────────────────\n走太多步会怎样（p26–27）：\n\n  · **Policy will increase probability on actions with high advantages**\n  · **Advantages are based on old policy, will get out-dated**\n     ⚠ 注意 Â 的上标是 **π_θ**（旧策略），不是 π_{θ'}\n     走得越远，这个优势估计就越不是在描述当前策略\n\n────────────────────────────────────────\n两个补救（p27）：\n\n  💡 **Idea 1: Use KL constraint on policy**\n        E_{s∼π_θ}[ D_KL( π_{θ'}(·|s) ‖ π_θ(·|s) ) ] ≤ δ\n        注记：**We will see this in LLM preference optimization**\n\n  💡 **Idea 2: Can we bound the importance weights?**\n        **Doesn't directly constrain policy, but removes incentives**\n        → **Key idea behind proximal policy optimization (PPO)**", "pts": ["<b>看清这一版有多克制：算法结构完全没变，只多了一个乘数。</b><span class='k'>L04 前半加的是 critic（改权重的<b>内容</b>），这里加的是重要性权重（改权重的<b>归属</b>）</span>。<b>两件事正交，所以能直接叠</b> —— <span class='w'>这也印证了 .a 片开头那条「两讲各动不同零件」。</span>", "<b>p26 那两句话合起来才是完整的毛病，单看任何一句都不够。</b><span class='k'>「策略会提高高优势动作的概率」+「优势是基于旧策略的、会过期」</span> = <b>你在拼命朝一个已经不准的方向走</b>。<span class='w'>走得越久，偏得越远，而且算法自己察觉不到。</span>", "<b>Idea 1 和 Idea 2 的区别，p27 用一句话点得很准：<span class='k'>Doesn't directly constrain policy, but removes incentives</span>。</b><b>KL 约束是「禁止你走太远」；裁剪权重是「让你没有动机走太远」</b> —— <span class='w'>后者不加硬约束，只是把跑出范围之后的梯度抹平，于是策略自己就停下来了</span>。<b>这个「改激励而不是加禁令」的设计思路，比具体公式更值得学。</b>", "<b>p27 那句注记 We will see this in LLM preference optimization 是一条重要的前向指路。</b><span class='k'>KL 约束会在 L09（RLHF / DPO）里再次出现，而且是核心角色</span> —— <b>那里约束的是「微调后的模型别离原始模型太远」</b>。<span class='w'>同一个工具，一次用来稳定训练，一次用来防止模型跑偏。</span>", "<b>注意 Idea 2 最后那行直接点名 PPO，而你已经读过 L05 了。</b><span class='k'>所以这里是一个闭环：L03 推出重要性权重 → L04 指出它要被约束 → L05 给出裁剪这个具体做法</span>。<b>三讲讲同一件事，而这一页是中间那个「为什么需要」。</b>"], "tbl": {"cap": "两个 Idea：禁令 vs 改激励", "head": ["", "💡 Idea 1：KL 约束", "<b>💡 Idea 2：裁剪重要性权重</b>"], "rows": [["怎么起作用", "<b>直接禁止策略走太远</b>", "<b>不加禁令，只是去掉走太远的激励</b>"], ["讲义原话", "Use KL constraint on policy", "<b>Doesn't directly constrain policy, but removes incentives</b>"], ["实现难度", "<b>高（要解带约束的优化）</b>", "<b>低（截断一个比值）</b>"], ["成品算法", "TRPO；<b>以及 L09 的偏好优化</b>", "<b>PPO</b>"], ["本课在哪再见", "<b>L09 RLHF / DPO</b>", "<b>L05（已读）</b>"]]}, "say": "<b>把 L03、L04、L05 三讲在这一点上串起来，会看到一条完整的因果链：</b><br><br>· <span class='k'>L03 p21–23</span>：推出重要性权重，让旧数据合法。<b>但留下一句警告：p 和 q 要很接近才行。</b><br>· <span class='k'>L04 p26–27（本页）</span>：说明「不接近」具体会怎样 —— <b>优势过期，而策略还在朝它拼命走</b>。然后给出两个补救思路。<br>· <span class='k'>L05</span>：把 Idea 2 做成具体算法 —— <b>裁剪</b>。<br><br><b>注意这一页在链条里的位置：它是唯一讲「为什么需要」的那一环。</b><br><br><span class='w'>只读 L03 你会觉得重要性采样挺好用；只读 L05 你会觉得裁剪是个工程技巧。</span><br><br><b>而这一页告诉你：裁剪解决的是一个具体的、会让训练崩掉的问题 —— 优势估计的过期。</b><br><br><span class='k'>读论文时碰到一个看起来「只是个技巧」的设计，值得回头找它对应的那个「为什么需要」。找不到的话，多半是你漏了一篇。</span>", "link": {"t": "你学过的对应：CS224R L05 精读（Idea 2 的成品：裁剪重要性比值）", "href": "L05-精读.html"}, "res": {"tag": "推断", "v": "<b>「改激励而不是加禁令」这个设计思路，对你的剪枝机制可能是一个更好的形态。</b><br><br><span class='k'>你现在的 dominance-pruning 是一条禁令</span>：判定被支配就删掉，不许再访问。<b>而 Idea 2 的做法是：不禁止，只是让访问它变得没有吸引力</b>。<br><br><b>落到你的问题上</b>：<span class='w'>与其把被支配的配置从候选集里删掉，不如给它的「预期收益」打一个折</span> —— <b>搜索自然就不会去了，但它仍然在候选集里、概率仍然非零</b>。<br><br><b>这解开两个具体的麻烦</b>：<br>① <span class='k'>重要性采样的硬前提（q ≠ 0）重新成立</span> —— 日志可以用于离线评估（L03 主线卡标出的那个限制）；<br>② <span class='k'>剪错了还有机会救回来</span>，而硬剪是不可逆的。<br><br>⚠ <b>代价要认</b>：搜索效率会下降一点（偶尔还是会去试被支配的）。<b>但这正好是一个可调的旋钮</b>，<span class='w'>而且「硬剪枝 = 折扣为 0 的特例」这个叙述比「我们用硬剪枝」在论文里强得多</span>。", "ref": "本讲 p27 的 removes incentives；对照 L03 主线卡的 q≠0 限制"}},
{"r": [28, 30], "t": "回放缓冲区，以及讲义直接写在幻灯上的那句「算法现在是坏的」", "star": 5, "quote": "Off-Policy Actor-Critic Methods — Can we be even more off-policy?  So far: use one batch of policy data for one gradient step (fully on-policy); use one batch of policy data for multiple gradient steps (starting to be off-policy).  Can we reuse data from previous batches, i.e. all of the past trial-and-error data?  Key ideas: maintain a buffer of all past data; adjust equations to remove on-policy assumptions — \"replay buffer\".  1. collect experience {s_i, a_i} from π_θ(a|s) (& add to replay buffer).  2. sample a batch {s_i, a_i, r_i, s'_i} from buffer 𝓡.  3. update V̂^π_ϕ using targets y_i = r_i + γV̂^π_ϕ(s'_i) for each s_i ← not the right target value.  4. evaluate Â^π(s_i,a_i) = r(s_i,a_i) + γV̂^π_ϕ(s'_i) − V̂^π_ϕ(s_i).  5. ∇_θJ(θ) ≈ (1/N)Σ_i ∇_θ log π_θ(a_i|s_i) Â^π(s_i,a_i) ← not the action π_θ would have taken!  6. θ ← θ + α∇_θJ(θ).  The algorithm is currently broken 😢", "one": "<b>野心再放大一档：不只复用这一批，而是复用<span class='k'>全部历史数据</span>。</b>做法是存一个 replay buffer。<b>然后讲义做了一件很少见的事 ——<span class='w'>把写出来的算法当场判定为「坏的」，并用红圈标出两处错在哪</span>。</b>", "eq": "三档野心（p28）：\n\n  ① 一批数据走**一步**梯度           —— fully on-policy\n  ② 一批数据走**多步**梯度           —— starting to be off-policy（p25 的版本一）\n  ③ **复用全部历史数据**             —— 本页要做的\n     原文：Can we reuse data from previous batches,\n           i.e. **all of the past trial-and-error data**?\n\n  两个关键做法：\n    · **maintain a buffer of all past data**        ← 这个 buffer 叫 **replay buffer**\n    · **adjust equations to remove on-policy assumptions**\n\n────────────────────────────────────────\n直接写出来的算法（p29–30）：\n\n  1. 用 π_θ 采经验 {s_i, a_i}（**并加进 replay buffer**）\n  2. 从缓冲区 𝓡 里采一个 minibatch {s_i, a_i, r_i, s'_i}\n  3. 用目标 y_i = r_i + γV̂^π_φ(s'_i) 更新 V̂^π_φ    ⚠ **not the right target value**\n  4. 评估 Â^π(s_i,a_i) = r + γV̂_φ(s'_i) − V̂_φ(s_i)\n  5. ∇_θJ(θ) ≈ (1/N) Σ_i ∇_θ log π_θ(a_i|s_i)·Â^π(s_i,a_i)\n                                 ⚠ **not the action π_θ would have taken!**\n  6. θ ← θ + α∇_θJ(θ)\n\n  损失：ℒ(φ) = (1/N) Σ_i ‖ V̂^π_φ(s_i) − y_i ‖²\n\n  **The algorithm is currently broken 😢**\n\n────────────────────────────────────────\n两处毛病的共同根源，一句话：\n\n  **缓冲区里的 (a_i, s'_i) 都是<旧>策略产生的，而 V^π / Â^π 的定义\n    全都绑着「按<当前> π 走」。**", "pts": ["<b>讲义把一个明知是错的算法完整写出来，再标出错处 —— 这个教法值得单独说一句。</b><span class='k'>直接给正确版本，你会以为那些细节是天经地义的</span>；<b>先给错的，你才知道每一处修改各自在挡哪个洞</b>。<span class='w'>p30 → p31 → p32 这三页就是三次定点修补。</span>", "<b>第一处毛病（第 3 步）：<code>V̂^π_φ(s'_i)</code> 不是对的目标。</b><span class='k'>V^π 的定义是「从这个状态出发，<b>之后按当前 π 走</b>」</span>；<b>而缓冲区里那个 s'_i，是<span class='w'>旧</span>策略走到的</b>。<span class='w'>用它去估当前策略的值，等于在问一个错的问题。</span>", "<b>第二处毛病（第 5 步）：<code>a_i</code> 不是当前策略会选的动作。</b><span class='k'>策略梯度的推导里，a 必须是从 π_θ 采出来的</span>；<b>而缓冲区里的 a_i 是旧策略选的</b>。<span class='w'>讲义的批注很直白：not the action π_θ would have taken!</span>", "<b>两处毛病其实是同一个根：缓冲区里的东西全都带着「旧策略」的烙印。</b><span class='k'>而 V^π、A^π、策略梯度这三样东西的定义里，都藏着「按当前 π 走」这个前提</span>。<b>所以 p28 那句 adjust equations to remove on-policy assumptions 是整段的纲领</b> —— <span class='w'>要么改式子，要么别用缓冲区。</span>", "<b>注意 p28 把三档野心列成一条递进，这和 .b 片 p20 的 n 那个旋钮是同一种结构。</b><span class='k'>「一批走一步 → 一批走多步 → 复用全部历史」也是一个谱</span>，<b>而 p35 会把这个谱的两端取舍明确摆出来</b>。<span class='w'>这一讲里出现了两个这样的谱，都值得记住它们的两端是什么。</span>"], "tbl": {"cap": "三档离策略程度（p28 的递进）", "head": ["档", "做法", "讲义的叫法", "<b>代表算法</b>"], "rows": [["①", "一批数据走<b>一步</b>梯度", "<b>fully on-policy</b>", "L03 / L04 p22"], ["②", "一批数据走<b>多步</b>梯度", "<b>starting to be off-policy</b>", "<b>p25 版本一 → PPO</b>"], ["③", "<b>复用全部历史数据</b>", "replay buffer", "<b>p29–34 → SAC</b>"], ["③ 的两个关键做法", "<b>存下所有历史 + 改式子去掉 on-policy 假设</b>", "—", "—"], ["<b>直接写出来会怎样</b>", "<b>The algorithm is currently broken 😢</b>", "—", "—"]]}, "say": "<b>「先给一个坏掉的算法」这个教法，在整门课里不多见，但它正好对应了一个很实用的读论文习惯。</b><br><br><span class='k'>很多论文的方法一节里，会有若干个看起来很琐碎的技术细节</span>：目标网络、重采动作、停梯度、裁剪……<br><br><b>这些细节单独看都像工程调优，但它们通常各自在挡一个具体的洞。</b><br><br><span class='w'>而论文往往不会告诉你那个洞是什么 —— 因为作者早就在心里把坏版本排除掉了。</span><br><br><b>所以读到一处不理解的细节时，有用的问法不是「这是什么」，而是「<span class='k'>去掉它会怎样</span>」。</b><br><br>这一讲接下来的两页，正好是把这个问法演示了一遍：<br>· <span class='w'>p31</span>：去掉「换成 Q 并重采 a'」会怎样 → 目标值是错的<br>· <span class='w'>p32</span>：去掉「重采 a」会怎样 → 梯度不是策略梯度<br><br><b>而 p33 还会给出一个「问了但修不了」的例子 —— 那同样有价值，因为它告诉你这个方法的边界在哪。</b>", "link": {"t": "你学过的对应：本片 p24–27（版本一只走多步；这里要的是复用全部历史，野心大一档）", "href": "L04-精读.html"}, "tip": {"t": "replay buffer 在别处也见过，但这里的用法不同", "w": true, "v": "<b>回放缓冲区最有名的出场是 DQN（深度 Q 网络），但那里它解决的是另一个问题，值得分清。</b><br><br>· <span class='k'>DQN 里的 replay buffer</span>：主要为了<b>打散样本之间的相关性</b>。连续采来的 (s,a,r,s') 高度相关，直接拿去做随机梯度下降会让训练极不稳定；<span class='w'>从缓冲区里随机采 minibatch，相当于把时间上的相关性洗掉</span>。<br>· <span class='k'>本页的 replay buffer</span>：主要为了<b>数据效率</b> —— <span class='w'>让一条昂贵的经验被用很多次，而不是用一次就扔</span>（p35 会把这条收益明确写出来）。<br><br><b>两个理由都成立，而且同时起作用</b>，但知道哪个是主要动机，才能判断「缓冲区该多大」这类问题：<br>· 为了<span class='k'>打散相关性</span> ⇒ 缓冲区只要比一条轨迹长就够；<br>· 为了<span class='k'>数据效率</span> ⇒ 越大越好，<b>但越大就意味着里面的数据越旧</b>，<span class='w'>而 p33 那个「状态分布不对」的问题也就越严重</span>。<br><br><b>⇒ 缓冲区大小本身又是一个旋钮</b>，而且它调的正是本讲反复出现的那个东西：<span class='k'>你愿意为数据效率，牺牲多少「数据代表当前策略」这件事</span>。"}},
{"r": [31, 32], "t": "两处定点修补：把 V 换成 Q，把动作重新采一遍", "star": 5, "quote": "Version 2: Fixing the value function — V^π(s_t) = Σ_{t'=t}^T E_{π_θ}[r(s_{t'},a_{t'})|s_t] (crossed out).  Q^π(s_t,a_t) = Σ_{t'=t}^T E_{π_θ}[r(s_{t'},a_{t'})|s_t,a_t] — \"total reward we get if we take a_t in s_t... and then follow the policy π\".  3. update Q̂^π_ϕ using targets y_i = r_i + γV̂^π_ϕ(s'_i) = r_i + γQ̂^π_ϕ(s'_i, a'_i) for each s_i, a_i.  a'_i ∼ π_θ(a'_i|s'_i) — not from replay buffer 𝓡!  V^π(s_t) = E_{a∼π(a_t|s_t)}[Q(s_t,a_t)].  Version 2: Fixing the policy update — use the same trick, but this time for a_i rather than a'_i!  sample a^π_i ∼ π_θ(a|s_i).  ∇_θJ(θ) ≈ (1/N)Σ_i ∇_θ log π_θ(a^π_i|s_i) Â^π(s_i, a^π_i) — not from replay buffer 𝓡!  higher variance, but convenient — why is higher variance OK here?  in practice: ∇_θJ(θ) ≈ (1/N)Σ_i ∇_θ log π_θ(a^π_i|s_i) Q̂^π(s_i, a^π_i).", "one": "<b>两页，两处修补，用的是<span class='k'>同一个技巧</span>：凡是需要「当前策略会怎么做」的地方，<span class='w'>就现场从 π_θ 采一个动作</span>，而不是用缓冲区里那个旧的。</b>", "eq": "修补一：值函数（p31）\n\n  问题：V^π 的定义绑着「之后按当前 π 走」，而缓冲区里的 s' 是旧策略走到的\n  做法：**把 V 划掉，换成 Q**（讲义真的在 V^π 那一行上画了红杠）\n\n     Q^π(s_t, a_t)  =  Σ_{t'=t}^T 𝔼_{π_θ}[ r(s_{t'},a_{t'}) | s_t, a_t ]\n     讲义的白话：total reward we get if we take a_t in s_t … and then follow the policy π\n\n  新的目标值：\n\n     y_i  =  r_i + γ·V̂^π_φ(s'_i)\n          =  **r_i + γ·Q̂^π_φ(s'_i, a'_i)**,   其中 **a'_i ∼ π_θ(a'|s'_i)**\n                                                      ⚠ **not from replay buffer 𝓡!**\n\n  依据就是 .a 片 p6 那条关系式：\n     **V^π(s_t)  =  𝔼_{a ∼ π(·|s_t)}[ Q^π(s_t, a) ]**\n     —— 要的是「按当前策略对动作取平均」，那就**现采一个当前策略的动作**。\n\n────────────────────────────────────────\n修补二：策略更新（p32）\n\n  问题：第 5 步里的 a_i 来自缓冲区，不是 π_θ 会选的动作\n  做法：**use the same trick, but this time for a_i rather than a'_i!**\n\n     采  **a^π_i ∼ π_θ(a | s_i)**     ← 状态 s_i 用缓冲区的，**动作现采**\n\n     ∇_θ J(θ) ≈ (1/N) Σ_i  ∇_θ log π_θ(**a^π_i**|s_i) · Â^π(s_i, **a^π_i**)\n                                              ⚠ **not from replay buffer 𝓡!**\n\n  评语（p32）：**higher variance, but convenient**\n  留给读者的问题：**why is higher variance OK here?**\n\n  实践中（p32 底部）：直接用 Q 而不是 A —\n     ∇_θJ(θ) ≈ (1/N) Σ_i ∇_θ log π_θ(a^π_i|s_i) · **Q̂^π(s_i, a^π_i)**", "pts": ["<b>两处修补是同一个技巧的两次应用，认出这一点就不用分别记。</b><span class='k'>规则是：<b>状态</b>可以用缓冲区里的旧状态，<b>动作</b>必须从当前策略现采</b></span>。<span class='w'>因为「旧状态」只是「我去过的地方」，没有策略烙印；而「旧动作」直接带着旧策略的偏好。</span>", "<b>为什么换成 Q 就解决了问题？因为 Q 把动作显式地写进了参数里。</b><span class='k'>V(s') 隐含地对动作按「某个策略」取了平均，而你无法指定是哪个策略</span>；<b>Q(s', a') 让你能自己指定 a' 从哪来</b> —— <span class='w'>于是「现采一个当前策略的动作」这个修补才有地方落脚</span>。", "<b>注意 p31 的推导是<span class='k'>反着</span>用 .a 片 p6 那条关系式的。</b><span class='w'>正着用是「从 Q 回到 V」（对动作取平均）</span>；<b>这里反着用：既然 V 是 Q 的平均，那我就用「一个采样的 Q」去代替 V</b>。<span class='k'>这和 L03 p16 把对数梯度技巧反着用是同一类动作 —— 同一个恒等式，两个方向。</span>", "<b>p32 那个留给读者的问题 why is higher variance OK here? 值得自己答一遍。</b><span class='k'>一个合理的答案：这个额外方差来自「对动作采样」，而它是<b>无偏</b>的</span>；<b>而且你从巨大的回放缓冲区里采 minibatch，样本量远大于 on-policy 时的一批</b> —— <span class='w'>方差被样本量摊掉了</span>。<b>⚠ 这是我的推断，讲义把它留成了开放问题。</b>", "<b>p32 底部那行「in practice 用 Q 而不是 A」是一个实用的简化。</b><span class='k'>因为 a^π_i 是从 π_θ 现采的，对它取期望时 V(s_i) 这一项是一个与动作无关的常数</span> —— <b>而常数基线不改变梯度的期望（L03 p16 证过）</b>。<span class='w'>所以减不减 V 都无偏，实践中省掉这一步。</span>"], "tbl": {"cap": "两处修补：同一个技巧的两次应用", "head": ["", "修补一（p31 值函数）", "<b>修补二（p32 策略更新）</b>"], "rows": [["坏在哪", "V̂(s'_i) 不是对的目标值", "<b>a_i 不是 π_θ 会选的动作</b>"], ["改什么", "<b>V → Q</b>", "<b>a_i → a^π_i</b>"], ["动作从哪来", "<b>a'_i ∼ π_θ(·|s'_i) 现采</b>", "<b>a^π_i ∼ π_θ(·|s_i) 现采</b>"], ["共同的规则", "<b>状态用缓冲区的，动作必须现采</b>", "<b>同左</b>"], ["依据", "<b>V^π(s) = 𝔼_{a∼π}[Q^π(s,a)]（反着用）</b>", "策略梯度要求 a ∼ π_θ"], ["代价", "要学 Q 而不是 V（输入多一维）", "<b>higher variance, but convenient</b>"]]}, "say": "<b>这两页的修补规则可以压成一句话，而且它在整个离策略 RL 里都成立：</b><br><br><span class='k'><b>状态可以是旧的，动作必须是新的。</b></span><br><br><b>理由值得想清楚</b>：<br>· <span class='w'>一个旧状态 s_i 只是说明「我的策略曾经到过这里」</span>。它是一个<b>位置</b>，不带策略的偏好。<br>· <span class='w'>而一个旧动作 a_i 说明的是「<b>旧策略</b>在这里会这么做」</span>。它直接编码了旧策略。<br><br><b>所以凡是式子里需要「当前策略会怎么做」的地方，旧动作就是错的，必须现采。</b><br><br><span class='k'>而这一条也正好解释了 p33 为什么有一个修不了的问题</span>：<b>状态虽然「不带策略偏好」，但<span class='w'>哪些状态会出现在缓冲区里</span>，本身是由旧策略决定的</b>。<br><br><span class='w'>动作可以现采，状态没法现采 —— 你没法让环境回到一个「当前策略才会去的」状态。</span><b>这就是下一页那句 nothing we can do here 的来历。</b>", "link": {"t": "你学过的对应：本片 .a p6（V^π(s) = 𝔼_{a∼π}[Q^π(s,a)] —— 这里把它反着用了）", "href": "L04-精读.html"}, "res": {"tag": "推断", "v": "<b>「状态可以是旧的，动作必须是新的」这条规则，在你的课题里有一个很干净的对应，而且能救你的历史日志。</b><br><br>你的日志里有大量「配置 → 分数」记录，<span class='k'>它们是在旧的搜索策略下采的</span>。按这条规则拆开：<br><br>· <span class='w'>「某个配置的真实分数」—— 这是环境的性质，<b>不带策略烙印</b></span>，<b>永远可以复用</b>；<br>· <span class='w'>「当时的搜索策略会选哪个配置」—— 这<b>带策略烙印</b></span>，<b>不能直接拿来当「现在该选哪个」</b>。<br><br><b>所以你的日志里，那一半是永久资产，另一半会过期。</b><span class='k'>而很多人把整份日志当成一个整体，要么全信要么全不信 —— 这是浪费</span>。<br><br><b>具体做法</b>：<span class='w'>把「配置 → 分数」的映射存成一个永久的查找表/训练集（它永不过期）</span>，<b>而「该去试哪个」每轮都用当前策略重新算</b>。<br><br><b>这样你的评估预算就真的是累积的了</b> —— <span class='k'>每一次昂贵的评估都永久地留在资产里，而不是随着搜索策略更新而贬值</span>。", "ref": "本讲 p31–32 的修补规则；对照 L03 p21 的重要性采样前提"}, "tip": {"t": "一个该自己验的细节：为什么 a' 要重采，而 r 和 s' 不用", "v": "<b>修补后的目标是 <code>y_i = r_i + γ·Q̂_φ(s'_i, a'_i)</code>，其中只有 <code>a'_i</code> 是现采的。</b><span class='w'>那 <code>r_i</code> 和 <code>s'_i</code> 为什么可以用缓冲区里的旧值？</span><br><br><b>因为它们是<span class='k'>环境</span>的输出，不是<span class='k'>策略</span>的输出。</b><br><br>给定 <code>(s_i, a_i)</code>，环境给出的 <code>r_i</code> 和 <code>s'_i</code> 服从 <code>p(s'|s,a)</code> 与奖励函数 —— <span class='w'>这两样东西<b>不依赖策略</b></span>，<b>所以旧策略采的和新策略采的，分布完全一样</b>。<br><br><span class='k'>而 <code>a'_i</code> 要服从 <code>π_θ(·|s'_i)</code>，这直接就是策略本身</span> —— <b>旧的就是错的。</b><br><br><b>这条区分可以推广成一句判据</b>：<span class='w'>缓冲区里的东西，凡是「环境产生的」都能复用，凡是「策略产生的」都要重采</span>。<br>· 环境产生：<code>r</code>、<code>s'</code>　⇒ <b>复用</b><br>· 策略产生：<code>a</code>、<code>a'</code>　⇒ <b>重采</b><br>· ⚠ 介于两者之间：<code>s</code> 本身 —— <b>它由环境产生，但「哪些 s 会进缓冲区」由策略决定</b>。<span class='k'>这正是 p33 那个修不了的问题。</span>"}},
{"r": [33, 34], "t": "最后一个问题修不了，讲义直接说「接受它」", "star": 4, "quote": "Version 2: Anything else?  Any remaining problems?  s_i didn't come from p_θ(s).  nothing we can do here, just accept it.  intuition: we want optimal policy on p_θ(s) but we get optimal policy on a broader distribution.  Version 2: Some implementation details — can also use reparameterization trick to better estimate the gradient (for Gaussian policy); also fancier ways to fit Q-functions (more on this in next two lectures).  Example practical algorithm: Haarnoja, Zhou, Abbeel, Levine. Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor. 2018.", "one": "<b>修完两处之后，讲义问「还有问题吗」，然后给出一个<span class='k'>修不了</span>的：<code>s_i</code> 不是从当前策略的状态分布来的。</b><span class='w'>而答案是四个字：nothing we can do here, just accept it。</span>", "eq": "剩下的那个问题（p33）：\n\n  **s_i didn't come from p_θ(s)**\n  （缓冲区里的状态，不是当前策略会访问到的那个分布）\n\n  讲义的回答：**nothing we can do here, just accept it**\n\n  直觉（p33 原文）：\n     **we want optimal policy on p_θ(s)**\n     **but we get optimal policy on a <broader> distribution**\n\n  读法：你本来想要「在当前策略会去的那些状态上最优」的策略；\n        实际得到的是「在一个**更宽**的状态分布上最优」的策略。\n        —— 不是错，是**目标被悄悄放宽了**。\n\n  ⚠ 这正是 L03 p23 那个被 often approximated as 1 扔掉的\n     **状态分布比值** π_{θ'}(s)/π_θ(s)。\n     L03 把它近似掉，这里连近似都不装了，直接说「接受它」。\n\n────────────────────────────────────────\n实现细节（p34）：\n\n  · **reparameterization trick** —— 高斯策略下更好地估计梯度\n  · 更讲究的 Q 拟合方式 —— **more on this in next two lectures**（L05/L06）\n  · 例子算法：**Soft Actor-Critic (SAC)**\n       Haarnoja, Zhou, Abbeel, Levine. 2018.\n       Off-Policy Maximum Entropy Deep RL with a Stochastic Actor", "pts": ["<b>「nothing we can do here, just accept it」这句话在教材里很少见，但它很诚实，而且信息量不小。</b><span class='k'>它告诉你这不是一个待解决的 open problem，而是这个方法框架的<b>结构性边界</b></span>。<b>你没法让环境回到「当前策略才会去的」状态 —— 动作可以现采，状态不能。</b>", "<b>「optimal policy on a broader distribution」这个说法值得记，它把一个缺点重新描述成了一个性质。</b><span class='w'>你的策略在「比实际需要更宽的状态集合上」是好的</span>。<b>这不全是坏事</b> —— <span class='k'>它意味着策略对分布漂移有一点额外的稳健性</span>。<b>代价是在真正会去的那些状态上，它不是最优的。</b>", "<b>把这一页和 L03 p23 接起来，能看到同一个问题的两次出场。</b><span class='k'>L03：状态分布比值「often approximated as 1」—— 装作它不存在</span>；<span class='k'>L04 本页：直接说「接受它」</span>。<b>两次都没解决，只是诚实程度不同</b>。<span class='w'>而这正是整个离策略 RL 的理论软肋 —— 知道它在哪，比以为它不存在要好。</span>", "<b>p34 点名的 SAC 是这条路线的成品，而且它的名字里每个词都对应本讲的一个零件。</b><span class='k'>Soft（最大熵）· Actor-Critic（本讲）· Off-Policy（p28 之后）· with a Stochastic Actor（L01 p39 那两条理由）</span>。<b>标题读懂了，算法的骨架就有了。</b>", "<b>reparameterization trick 被一笔带过，但它解决的是一个真问题。</b><span class='k'>策略梯度要对「从 π_θ 采样」这件事求导，而采样本身不可导</span>；<b>重参数化把随机性挪到外面（a = μ_θ(s) + σ_θ(s)·ε，ε ∼ 𝒩(0,1)），于是梯度能直接穿过去</b>。<span class='w'>它比对数梯度技巧方差小得多，但要求动作分布可重参数化（高斯可以，离散不行）。</span>"], "tbl": {"cap": "三个问题：两个修好了，一个只能接受", "head": ["问题", "能修吗", "<b>怎么处理</b>"], "rows": [["目标值 V̂(s') 不对", "<b>能</b>", "<b>换成 Q，a' 从 π_θ 现采（p31）</b>"], ["a_i 不是 π_θ 会选的", "<b>能</b>", "<b>a^π 从 π_θ 现采（p32）</b>"], ["<b>s_i 不是来自 p_θ(s)</b>", "<b>不能</b>", "<b>nothing we can do here, just accept it</b>"], ["为什么不能", "<b>动作可以现采，状态没法现采</b>", "<b>你没法让环境回到某个状态</b>"], ["后果", "<b>在一个更宽的分布上最优，而非在真正会去的状态上最优</b>", "—"], ["L03 的对应", "<b>那个 often approximated as 1 的状态分布比值</b>", "<b>同一个问题，两次出场</b>"]]}, "say": "<b>把这一讲里「修好的」和「修不了的」分开列，是复习这半讲最好的方式：</b><br><br><b>修好的（都用同一个技巧：动作现采）</b><br>· <span class='k'>p31</span>：V → Q，a' 从 π_θ 采<br>· <span class='k'>p32</span>：a_i → a^π_i，从 π_θ 采<br><br><b>修不了的</b><br>· <span class='w'>p33</span>：s_i 的分布。**just accept it**<br><br><b>而这个分界线的位置是有道理的</b>：<span class='k'>动作是你（策略）产生的，所以你随时可以重新产生一个；状态是环境产生的，你没有控制权</span>。<br><br><b>「哪些东西我能重新生成、哪些不能」—— 这个问法在很多地方都管用。</b><br><br><span class='w'>而且注意讲义的态度：它没有把这个缺陷藏起来，也没有假装它不重要，而是明确标出来并说明后果（optimal policy on a broader distribution）。</span><br><br><b>这比「不提」和「过度强调」都好，也是写自己论文时值得学的分寸。</b>", "link": {"t": "你学过的对应：CS224R L03 精读 p23（那个 often approximated as 1 的状态分布比值 —— 同一个问题）", "href": "L03-精读.html"}, "res": {"tag": "推断", "v": "<b>「在一个更宽的分布上最优」这个说法，对你的课题有一个意外的正面意义，值得想一想。</b><br><br>你的搜索会收敛到某一片配置区域。<span class='k'>如果你只用「当前搜索策略会去的那些配置」来训代理模型，模型就只在那一小片准</span> —— <b>而剪枝恰恰需要它在<span class='w'>没去过</span>的区域给出判断</b>。<br><br><b>反过来，用全部历史数据（包括早期那些被淘汰的配置）去训代理模型，正是 p33 说的「更宽的分布」</b>：<span class='w'>模型在你真正会去的那片区域上可能不是最优的，但它在更宽的范围里都还算靠谱</span>。<br><br><b>对剪枝来说，后者才是你要的</b> —— <span class='k'>剪枝判断的是「这片我没去过的区域值不值得去」，那就需要一个在宽分布上靠谱的模型，而不是一个在窄区域里极准的模型</span>。<br><br>⚠ <b>但这有一个代价要认</b>：<span class='w'>在你最终要交付的那片区域上，模型的精度会低于「只用那片数据训」的版本</span>。<b>所以合理的做法可能是两个模型</b>：一个宽的用于剪枝，一个窄的用于最终排序。<b>这是一个设计选择，不是自动成立的结论。</b>", "ref": "本讲 p33 的 broader distribution；对照 L03 p23"}},
{"r": [35, 37], "t": "收尾：两条路的取舍，以及一句「PPO 更好调」", "star": 3, "quote": "More off-policy vs. less off-policy actor critic?  ← more off-policy (i.e. with replay buffer).  ← less off-policy (i.e. no replay buffer).  + Off-policy with replay buffer (e.g. soft actor-critic) can be far more data efficient.  - They can also generally be harder to tune hyperparameters, less stable (than e.g. PPO).  Next Week (last big online RL method): Q-learning.  Practical implementation of online RL algorithms.", "one": "<b>整讲收在一条取舍上，而且讲义把两边都说了。</b><span class='k'>用回放缓冲区（SAC 那条路）数据效率<b>高得多</b></span>；<span class='w'>但超参更难调、更不稳定 —— 讲义直接拿 PPO 当对照</span>。", "eq": "一条谱（p35）：\n\n  less off-policy  ←───────────────────────────→  more off-policy\n  （不用回放缓冲区）                            （用回放缓冲区）\n     PPO 那一侧                                    SAC 那一侧\n\n两句评价（p35 原文）：\n\n  **+ Off-policy with replay buffer (e.g. soft actor-critic)\n     can be far more data efficient**\n\n  **− They can also generally be harder to tune hyperparameters,\n     less stable (than e.g. PPO)**\n\n────────────────────────────────────────\n为什么数据效率高：每一条采到的经验会被反复使用很多次，而不是用一次就扔。\n为什么难调：\n   · 缓冲区里新旧数据混在一起，分布随训练变化\n   · 要学 Q 而不是 V（输入多一维）\n   · 每步都要从 π_θ 现采动作（p31/p32），多一处随机性\n   · 那个「状态分布不对」的问题（p33）始终在\n\n────────────────────────────────────────\n下一讲（p37）：**Q-learning** —— last big online RL method\n              以及 Practical implementation of online RL algorithms", "pts": ["<b>这是本讲第二次出现「一条谱」的结构，值得和 .b 片 p20 的 n 放在一起看。</b><span class='k'>p20 的谱：n = 1（全靠估计）↔ n = T（全靠真实奖励）</span>；<span class='k'>p35 的谱：不用缓冲区 ↔ 用缓冲区</span>。<b>两次都是「两端各有代价，实践中在中间或按场景选」</b>。", "<b>「data efficient」在这里的含义很具体：同一条经验被用了多少次。</b><span class='k'>on-policy：一次就扔；回放缓冲区：反复采样，可能用几十上百次</span>。<b>所以在采样昂贵的场景下，这个差别是决定性的</b> —— <span class='w'>而在仿真里（采样几乎免费），稳定性反而更值钱，这就是 PPO 在很多地方更受欢迎的原因。</span>", "<b>「less stable than e.g. PPO」这句点名对照很有信息量。</b><span class='k'>它承认 PPO 虽然在数据效率上不如 SAC，但在「能不能跑对」这件事上更好</span>。<b>这与 L03 主线卡那条判断一致</b>：<span class='w'>PPO 统治 LLM 后训练靠的不是更好的理论，是更容易跑对。</span>", "<b>把这一讲的两条路和你的场景对上，判据其实很清楚：看你的瓶颈在哪。</b><span class='k'>采样贵（真机、真人、LLM 评估）⇒ 往 more off-policy 走，数据效率优先</span>；<span class='k'>采样便宜（仿真）、但调参时间贵 ⇒ 往 less off-policy 走，稳定性优先</span>。", "<b>p37 预告 Q-learning 是「最后一个大的在线 RL 方法」，这个定位值得注意。</b><span class='k'>L03 策略梯度 → L04 Actor-Critic → L06 Q-learning，三讲把在线 RL 的主干走完</span>。<b>之后的课程转向别的轴</b>：<span class='w'>L07 离线、L08 奖励从哪来、L09/L10 用在 LLM 上、L11 有模型、L12–L13 多任务与元</span>。"], "tbl": {"cap": "两条路的取舍（p35）", "head": ["", "less off-policy（PPO 那侧）", "<b>more off-policy（SAC 那侧）</b>"], "rows": [["用回放缓冲区吗", "<b>不用</b>", "<b>用</b>"], ["一条经验用几次", "<b>几次（同一批走多步）</b>", "<b>很多次</b>"], ["数据效率", "中", "<b>far more data efficient</b>"], ["稳定性 / 调参", "<b>更好调、更稳</b>", "<b>harder to tune, less stable</b>"], ["学 V 还是 Q", "V 就够", "<b>必须 Q（p31）</b>"], ["什么时候选它", "<b>仿真便宜、调参时间贵</b>", "<b>采样昂贵（真机 / 真人 / LLM 评估）</b>"]]}, "say": "<b>这一讲到此结束。把它压成一句话：<span class='k'>加一个 critic，让梯度的权重从「这一次拿到多少」变成「期望能拿到多少」；然后想办法让采来的数据能反复用。</span></b><br><br><b>两件事，各自带着一个代价：</b><br>· <span class='w'>critic</span> → 方差小了，<b>偏差来了</b>（.b 片 p19–20 那个旋钮）<br>· <span class='w'>复用数据</span> → 数据效率高了，<b>稳定性差了</b>（本页这条谱）<br><br><b>而本讲出现的两个「修不了的问题」都指向同一处</b>：<span class='k'>状态分布</span>。<br>· <span class='w'>L03 p23</span>：状态分布比值 often approximated as 1<br>· <span class='w'>L04 p33</span>：s_i didn't come from p_θ(s)，just accept it<br><br><b>这是离策略 RL 的理论软肋，两讲都碰到了，都没解决。</b><br><br><span class='k'>知道一个领域的软肋在哪，比知道它的最新成果在哪更有用</span> —— <b>因为软肋的位置几年不会变，而最新成果半年就换一批。</b>", "link": {"t": "你学过的对应：CS224R L05 精读（PPO —— 这条谱上 less off-policy 那一端的成品）", "href": "L05-精读.html"}, "res": {"tag": "推断", "v": "<b>p35 那条取舍对你的课题，答案是明确偏向一侧的，而且理由很硬。</b><br><br><span class='k'>你的采样（每次评估一个配置）极其昂贵</span>，<b>而你的「调参时间」相对便宜</b>（你可以在本地反复跑搜索逻辑，不用每次都调 LLM）。<br><br><b>⇒ 按这一页的判据，你应该毫不犹豫地站在 more data-efficient 那一侧</b>：<span class='w'>每一次评估的结果都要被反复榨取，而不是用一次就扔</span>。<br><br><b>具体落到三条</b>：<br>① <span class='k'>永久保存所有「配置 → 分数」记录</span>（p31–32 主线卡里说的那个「永不过期的资产」）；<br>② <span class='k'>每轮搜索都重新用<b>全部</b>历史训代理模型</span>，而不是只用最近一批；<br>③ <span class='k'>同一次评估里的副产品也记下来</span>（各级输出、token 消耗、失败样本），<b>这些是免费的额外信息</b>。<br><br>⚠ <b>而这一页提醒的代价也要认</b>：<span class='w'>数据复用得越狠，「分布混杂」带来的不稳定就越明显</span>。<b>对你具体就是：早期的烂配置会一直留在训练集里，可能让代理模型在好配置那一片欠拟合</b> —— <span class='k'>这是可以用加权（近期数据权重高）来缓解的，但要显式处理，不能假装没有。</span>", "ref": "本讲 p35 的取舍；对照 p33 的 broader distribution"}}

var TH = {"title": "L04 接上课题的哪一段：加一个 critic，以及两个修不了的问题", "arc": "这一讲做了两件正交的事，<b>而且各自带着一个明确的代价</b>：<br><br>① <b>加一个 critic</b>（p6–p23）—— 把梯度里那个权重从「<span class='w'>这一次实际拿到多少</span>」换成「<span class='k'>期望能拿到多少</span>」。<b>代价：方差小了，偏差来了。</b>而 p20 的 N 步回报把这笔交易做成了一个可调旋钮（<code>n=1</code> 全靠估计、<code>n=T</code> 全靠真实奖励，<b>often works the best in practice 的是中间</b>）。<br><br>② <b>让数据能反复用</b>（p24–p35）—— 从「一批走一步」到「一批走多步」再到「复用全部历史」。<b>代价：数据效率高了，稳定性差了</b>（p35 直接拿 PPO 当对照：<span class='w'>harder to tune, less stable</span>）。<br><br><b>整讲最值得学的不是算法，是讲义的两个教法</b>：<br>· <span class='k'>p30 把一个明知是坏的算法完整写出来，再用红圈标出两处错在哪</span>（<b>The algorithm is currently broken 😢</b>），然后 p31/p32 逐处修。<b>⇒ 读论文碰到不理解的技术细节时，有用的问法不是「这是什么」，而是「去掉它会怎样」。</b><br>· <span class='k'>p33 诚实地标出一个修不了的问题</span>：<b>s_i didn't come from p_θ(s)，nothing we can do here, just accept it</b>。<br><br><b>两处修补其实是同一条规则</b>：<span class='k'><b>状态可以是旧的，动作必须是新的</b></span>。更准的说法是——<b>凡是「环境产生的」（r、s'）都能复用，凡是「策略产生的」（a、a'）都要重采</b>；而 <code>s</code> 卡在中间（由环境产生，但<span class='w'>哪些 s 会进缓冲区由策略决定</span>），<b>这正是那个修不了的问题。</b><br><br><b>⚠ 一条贯穿两讲的软肋</b>：L03 p23 把状态分布比值「often approximated as 1」，L04 p33 干脆说「just accept it」——<span class='k'>同一个问题，两次出场，两次都没解决</span>。<b>这是整个离策略 RL 的理论软肋。知道一个领域的软肋在哪，比知道它的最新成果在哪更有用</b>——<span class='w'>软肋的位置几年不变，最新成果半年换一批。</span><br><br><b>对你课题最有用的三条</b>（都在各页科研格里展开）：<br>· <span class='k'>A = Q − V 那个减法</span> → <b>控制变量</b>：只改一个算子、在同一基底上比差值，把「配置其余部分本来就好不好」这块纯方差减掉；<br>· <span class='k'>「环境产生的可复用、策略产生的要重采」</span> → <b>你的日志里有一半是永久资产</b>（配置→分数的映射永不过期），另一半（当时该选谁）会过期。很多人把整份日志当一个整体，要么全信要么全不信，<span class='w'>这是浪费</span>；<br>· <span class='k'>p35 的取舍</span> → 你的采样极贵、调参相对便宜，<b>判据明确偏向「每条经验反复榨取」那一端</b>。", "pitfalls": [{"v": "<b>把 Q 当成「这个动作好不好」。</b>Q 的定义是「先走 a，<span class='k'>之后按 π 走</span>」——<b>它被那条尾巴拖着</b>。p7 打鼓例里，<span class='w'>Q(s, 练鼓) 不是 1，而是「练这一个时间步之后能学会的概率」，讲稿明说 that probability could be 0</b></span>。⇒ <b>一个烂策略会让所有 Q 值都显得很低</b>，哪怕那个动作本身是对的。<b>所以 Q 评的从来不是「这个动作好不好」，而是「这个动作 + 这个策略 好不好」。</b>", "tag": "已核", "ref": "本讲 p6 的定义与 p7 打鼓例；讲稿里学生关于「练 pan>减掉「配置其余部分的好坏」。<br><br><b>两个一起用，剩下的方差才是你真正想测的那个信号</b> —— 而且都不花一次额外评估。", "tag": "推断", "ref": "本讲 p6 的 A = Q − V；对照 L03 p16 的基线"}, {"q": "你的历史日志还能用吗？搜索策略已经更新好几轮了。", "a": "<b>用 p31–32 那条规则拆开看，答案是「一半能、一半不能」。</b><br><br><span class='k'>规则：凡是「环境产生的」都能复用，凡是「策略产生的」都要重采。</span><br><br>拆到你的日志上：<br>· <span class='w'>「某个配置的真实分数」</span> —— <b>环境的性质，不带策略烙印，<span class='k'>永远可以复用</span></b>；<br>· <span class='w'>「当时的搜索策略会选哪个」</span> —— <b>带策略烙印，不能直接当成「现在该选哪个」</b>。<br><br><b>⇒ 所以把「配置 → 分数」存成一个<span class='k'>永久的查找表 / 训练集</span>（它永不过期），而「该去试哪个」每轮用当前策略重新算。</b><br><br><b>这样你的评估预算才真的是累积的</b> —— <span class='w'>每一次昂贵的评估都永久地留在资产里，而不是随着搜索策略更新而贬值</span>。<br><br><span class='k'>很多人把整份日志当成一个整体，要么全信要么全不信 —— 对一个评估极贵的场景，这是实打实的浪费。</span>", "tag": "推断", "ref": "本讲 p31–32 的修补规则"}, {"q": "你的代理模型为什么要用全部历史数据训，而不是只用最近的？", "a": "<b>p33 那句「optimal policy on a broader distribution」给了一个反直觉但正确的理由。</b><br><br><span class='k'>如果只用「当前搜索策略会去的那些配置」训代理模型，模型就只在那一小片准</span> —— <b>而剪枝恰恰需要它在<span class='w'>没去过</span>的区域给出判断</b>。<br><br><b>用全部历史（包括早期那些被淘汰的配置）训，正是「更宽的分布」</b>：<span class='w'>在你真正会去的那片上可能不是最优，但在更宽的范围里都还算靠谱</span>。<br><br><b>对剪枝来说，后者才是你要的。</b><br><br>⚠ <b>但代价要认，而且 p35 已经预警了</b>：<span class='k'>数据复用得越狠，「分布混杂」带来的不稳定就越明显</span> —— <b>早期的烂配置会一直留在训练集里，可能让模型在好配置那一片欠拟合</b>。<br><br><b>可以用加权缓解（近期数据权重高），但要显式处理</b>。<span class='w'>或者干脆两个模型：一个宽的用于剪枝，一个窄的用于最终排序。</span>", "tag": "推断", "ref": "本讲 p33 的 broader distribution 与 p35 的取舍"}, {"q": "你用代理模型的预测去做剪枝，这不会自我强化错误吗？", "a": "<b>会，而且你的处境比 RL 那边<span class='k'>更危险</span> —— 这个要正面答。</b><br><br><span class='w'>p18 的自举听起来像永动机（用不准的估计造标签，训出更准的估计），它不是</span>，<b>因为每一轮的标签里都掺着一项<span class='k'>真实的</span> <code>r</code></b>。<span class='w'>信息就是靠那一项，从有奖励的地方一步步往回渗的。</span><br><br><b>而「用预测值反哺模型 / 用预测值剪枝再把剪枝结果当证据」如果没有新的真实评估进来，就是纯粹的自我循环</b> —— <span class='k'>模型会越来越自信地重复自己最初的偏见</span>。<br><br><b>所以判据很清楚：每一轮更新里，必须有<span class='k'>真实评估</span>这个外部锚点。</b><br><br><b>而这也给了你一个该主动做的检查</b>：<span class='w'>统计「被剪掉的区域里，后来被真实评估证实确实不好的比例」</span>。<b>如果你从不回去验证被剪掉的区域，就永远不会发现剪错了</b> —— <span class='
