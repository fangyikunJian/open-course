别人采的），但 off-policy 不必离线</b> —— <span class='w'>本讲后半就是一个「在线但 off-policy」的算法。</span>", "<b>这一页的代价对你的问题尤其刺眼。</b><span class='k'>在仿真里「每步梯度重采一批」只是慢；而在「每个样本都要调一次 LLM」的场景里，这个代价直接决定了方法可不可行</span>。<b>所以 LLM 后训练（RLHF）用的几乎都是 off-policy 或「轻度 off-policy」的变体</b>，<span class='w'>而 PPO 正是其中最流行的那个</span>。", "<b>注意讲义把 on/off-policy 标成了「attribute of online RL algorithms」。</b><span class='k'>也就是说这是在线算法内部的一个分类维度</span>，<b>不是和在线/离线并列的另一个二分</b>。<span class='w'>这个措辞上的细节，正好印证了上面那条「两组词互相独立」。</span>", "<b>下一页开始的整条线索，目标只有一个：<span class='k'>在同一批数据上多走几步梯度</span>。</b>讲稿把野心说得很小：<b>「it's only going to be a little off-policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data」</b>。<span class='w'>不是「能用任意旧数据」，只是「能多榨几步」。</span><b>这个克制的目标，正是 PPO 的全部动机。</b>"], "tbl": {"cap": "两组最容易混的词：它们互相独立", "head": ["", "问的是什么", "本讲的策略梯度", "<b>L07 离线 RL</b>"], "rows": [["<b>offline / online</b>", "<b>要不要用学到的策略产生新数据</b>", "<b>online</b>（要采）", "<b>offline</b>（不采）"], ["<b>on- / off-policy</b>", "<b>数据必须来自当前策略吗</b>", "<b>vanilla 是 on-policy</b>", "<b>必然 off-policy</b>"], ["两者的关系", "<b>独立的两个维度</b>", "在线 + on-policy", "离线 + off-policy"], ["本讲后半是什么", "—", "<b>在线 + off-policy（轻度）</b>", "—"], ["为什么要 off-policy", "—", "<b>在同一批数据上多走几步梯度</b>", "根本没有新数据可采"]]}, "say": "<b>讲稿在进入下一页时把这一讲后半的野心说得很克制，这句值得记住，因为它正好是 PPO 的动机：</b><br><br>「<span class='k'>Can we derive an off-policy version of the policy gradient? And it's only going to be a little off-policy. And by that, I mean, we're just going to try to be able to take more than one gradient step on a single batch of data.</span>」<br><br><b>「only going to be a little off-policy」——「只是稍微离一点策略」。</b><br><br><span class='w'>目标不是「能用任意来源的旧数据」（那是 L07 离线 RL 的野心，难得多）</span>，<b>只是「别采一批只走一步，太浪费」</b>。<br><br><b>认清这个克制的目标，后面两页就好懂了</b>：<span class='k'>重要性采样是为了让旧数据合法，KL 约束是为了保证「旧」得不要太远</span> —— <b>两样东西都是在维护「a little」这个词</b>。<br><br>而本课 L05（你已经做过精读）的 PPO，标题里那个 off-policy 说的就是这个程度：<span class='w'>「同一批数据，你敢用它走几步梯度」</span>。", "link": {"t": "你学过的对应：CS224R L05 精读 p1（「off-policy 不是一个新算法，而是一个程度」）", "href": "L05-精读.html"}},
{"r": [21, 22], "t": "重要性采样：用旧策略的样本估新策略的期望，代价是一个会爆炸的连乘", "star": 5, "quote": "Off-policy version of policy gradient?  Importance sampling.  What if we want to use samples from p̄(τ)?  Using proposal distribution q (e.g. previous policy).  Note: Important for q to have non-zero support for high probability p(x).  Say we want to update our latest policy π_θ′ … but we want to use samples from π_θ.  ∇_{θ′}J(θ′) = E_{τ∼p_θ(τ)}[ (Π_{t=1}^T π_{θ′}(a_t|s_t)/π_θ(a_t|s_t)) (Σ_{t=1}^T ∇_{θ′} log π_{θ′}(a_t|s_t)) ((Σ_{t'=t}^T r(s_{t'},a_{t'})) − b) ].  This can become very small or very large, for larger T.", "one": "<b>重要性采样是一个一行就能写出来的恒等式：想要 p 下的期望，但只有 q 的样本，那就给每个样本乘上 <code>p/q</code>。</b><span class='k'>用在轨迹上，这个比值是 T 个比值的连乘</span> —— <b>而连乘在 T 大时非爆即灭。</b>", "eq": "重要性采样的恒等式（p21）：\n\n  想算   E_{x∼p}[ f(x) ]，  但只有 q 的样本：\n\n    E_{x∼p}[f(x)]  =  ∫ p(x) f(x) dx\n                   =  ∫ q(x) · (p(x)/q(x)) · f(x) dx\n                   =  **E_{x∼q}[ (p(x)/q(x)) · f(x) ]**\n                                 └─ 重要性权重 ─┘\n\n  q 叫 **proposal distribution**（提议分布），这里就是**旧策略**。\n\n  ⚠ 唯一的硬前提（p21 原文）：\n     **Important for q to have non-zero support for high probability p(x)**\n     —— p 有概率的地方，q 不能是 0。否则那块区域你永远采不到，\n        而它在 p 下却很重要 ⇒ 估计必错，且错得看不出来。\n\n────────────────────────────────────────\n用到轨迹上（p22）：\n\n  比值 p_{θ'}(τ) / p_θ(τ) 里，**初始分布与动力学全约掉了**\n  （它们不含 θ —— 和 `.a` 片 p9 消掉它们是同一个理由）：\n\n    p_{θ'}(τ)/p_θ(τ)  =  **Π_{t=1}^{T}  π_{θ'}(a_t|s_t) / π_θ(a_t|s_t)**\n\n  于是\n\n    ∇_{θ'}J(θ') = E_{τ∼p_θ(τ)}[ (Π_{t=1}^T 比值) · (Σ_t ∇log π_{θ'}) · (Σ_{t'≥t} r − b) ]\n\n  ⚠ 问题（p22 原文）：**This can become very small or very large, for larger T**\n\n  为什么：T 个略大于 1 的数连乘 → 指数爆炸；\n          T 个略小于 1 的数连乘 → 指数衰减到 0。\n          T = 200（L01 p34 那个机器人）时，每个比值偏差 1% 就是 1.01²⁰⁰ ≈ **7.3 倍**。", "pts": ["<b>那个连乘里「动力学约掉了」这件事，和 `.a` 片 p9 是同一个性质在第二次救场。</b><span class='k'>p_{θ'}(τ)/p_θ(τ) 的分子分母里，<code>p(s₁)</code> 和 <code>p(s_{t+1}|s_t,a_t)</code> 逐项相同</span>，<b>于是只剩策略的比值</b>。<span class='w'>如果动力学也依赖 θ，这个比值根本算不出来（因为动力学是未知的）。</span><b>策略梯度之所以可行，这条性质被用了两次。</b>", "<b>把那个 1.01²⁰⁰ ≈ 7.3 自己算一遍，比记住「会爆炸」有用。</b><span class='k'>每一步的比值只偏离 1 百分之一，200 步之后就是 7 倍</span>；<b>反过来 0.99²⁰⁰ ≈ 0.13</b>。<span class='w'>而真实的策略更新带来的单步比值偏离远不止 1%。</span><b>所以这不是「长序列时要小心」，是「长序列时这个式子直接没法用」。</b>", "<b>「q 必须在 p 有概率的地方非零」这条前提，有一个很实际的后果：确定性策略不能当提议分布。</b><span class='k'>确定性策略在除了一个动作之外的所有地方概率都是 0</span>，<b>于是新策略想探索的任何别的动作，权重分母都是 0</b>。<span class='w'>这又一次解释了 L01 p39 那条「为什么策略要随机」—— 随机性不只是为了探索，也是为了让旧数据可复用。</span>", "<b>讲稿给了一条比幻灯更实用的判据：p 和 q 越像越好。</b><span class='k'>「this importance sampling technique is really going to work best when p and q — or when your old policy and your new policy — are very similar to each other」</span>。<b>这句话直接推出了 p25 的 KL 约束</b> —— <span class='w'>既然「越像越好」，那就显式地强制它们像。</span>", "<b>重要性采样本身是一个远超 RL 的通用工具，讲者专门点了这一句。</b><span class='k'>「importance sampling is actually a really cool technique that's useful outside of reinforcement learning as well」</span> —— <b>统计里的离线策略评估、蒙特卡洛积分、变分推断里都有它</b>。<span class='w'>而它的失效模式（权重方差爆炸）在哪里都一样，认准了这个模式，换个领域也认得出来。</span>"], "tbl": {"cap": "重要性采样的三个要件，以及各自的失效方式", "head": ["要件", "是什么", "<b>失效时会怎样</b>"], "rows": [["<b>比值 p/q</b>", "重要性权重", "<b>方差爆炸，估计不可用</b>"], ["<b>q 的支撑</b>", "<b>p 有概率处 q 必须非零</b>", "<b>那块区域永远采不到，估计有偏且看不出来</b>"], ["<b>p 与 q 的接近程度</b>", "越像方差越小", "<b>差太远 ⇒ 少数样本主导整个估计</b>"], ["<b>轨迹上的额外问题</b>", "<b>比值是 T 项连乘</b>", "<b>T=200、单步偏 1% ⇒ 7.3 倍</b>"], ["对应的补救", "—", "<b>p23 改逐时刻 · p25 加 KL 约束</b>"]]}, "say": "<b>讲稿里关于支撑那条前提，讲者说得比幻灯严厉：</b><br><br>「<span class='k'>…proposal distribution to have nonzero support in scenarios where your new policy has probability. This is actually very important for it to work. If q of x is 0, this is not [well] defined. But that's really the only catch here. And in general, this importance sampling technique is really going to work best when p and q — or when your old policy and your new policy — are very similar to each other.</span>」<br><br><b>两句话给了两个层次的要求：</b><br>· <span class='w'>硬要求</span>：q 不能是 0 —— 否则式子<b>没有定义</b>；<br>· <span class='k'>软要求</span>：p 和 q 要尽量像 —— 否则式子有定义但<b>方差大到没用</b>。<br><br><b>软要求那一条就是下面两页的全部内容</b>：<span class='w'>p23 把比值从「整条轨迹」缩小到「每一步」，p25 干脆用 KL 把两个策略绑在一起</span>。<br><br>而这两招合起来，就是 PPO 的骨架 —— <span class='k'>你在 L05 精读里已经见过它的成品形态</span>。", "link": {"t": "你学过的对应：本片 `.a` p9（动力学自己消失，这一页第二次用到同一条性质）", "href": "L03-精读.html"}, "res": {"tag": "推断", "v": "<b>重要性采样在你的课题里有一个几乎一对一的对应，而且是你迟早要面对的：<span class='k'>用旧日志评估新的搜索策略</span>。</b><br><br>你的历史日志是在<span class='w'>旧的搜索策略下</span>收集的 —— 哪些配置被评估过，取决于当时的算法。<b>现在你想回答「如果换一个搜索策略，结果会怎样」，而又不想重跑实验</b>。<span class='k'>这正是离线策略评估（off-policy evaluation），用的就是这一页的恒等式。</span><br><br><b>好消息是你的处境比这一页好得多</b>：<br>· <span class='w'>你的「轨迹」很短</span>（选一个配置，或构造几步），<b>不是 T=200 的连乘，爆炸问题轻得多</b>；<br>· <span class='w'>你的动力学是确定的</span>，所以比值里能约掉的更多。<br><br><b>坏消息是那条硬前提可能真的不满足</b>：<span class='k'>如果旧策略从来没评估过某一片配置（被剪枝剪掉了），那里的 q = 0</span> —— <b>而新策略恰恰可能想去那里</b>。<span class='w'>这时重要性采样<b>没有定义</b>，不是「估得不准」。</span><br><br><b>⇒ 所以「剪枝过的日志不能直接拿来做离线比较」是一个真实的技术限制，值得在论文里写明，而不是悄悄用。</b>", "ref": "本讲 p21 的支撑前提；对照 CS224R L07 离线 RL"}},
{"r": [23, 23], "t": "把连乘拆成逐时刻：代价是一个被直接当成 1 的比值", "star": 5, "quote": "What if we consider the expectation over timesteps instead of trajectories?  ∇_{θ′}J(θ′) ≈ (1/N) Σ_{i=1}^N Σ_{t=1}^T [ π_{θ′}(s_{i,t}, a_{i,t}) / π_θ(s_{i,t}, a_{i,t}) ] ∇_{θ′} log π_{θ′}(a_{i,t}|s_{i,t}) ((Σ_{t'=t}^T r(s_{i,t'}, a_{i,t'})) − b).  Common final form: ∇_{θ′}J(θ′) ≈ (1/N) Σ_{i=1}^N Σ_{t=1}^T [ π_{θ′}(a_{i,t}|s_{i,t}) / π_θ(a_{i,t}|s_{i,t}) ] ∇_{θ′} log π_{θ′}(a_{i,t}|s_{i,t}) ((Σ_{t'=t}^T r) − b).  Much less likely to explode/vanish …but, hard to measure.  π_{θ′}(s_{i,t}) / π_θ(s_{i,t}) often approximated as 1.", "one": "<b>连乘会炸，那就别对整条轨迹做重要性采样，改成对每一个时刻做。</b><span class='k'>每一步只乘一个比值，不连乘，爆炸问题基本消失</span> —— <b>但这里偷偷扔掉了一个东西：状态分布的比值，它被直接近似成了 1。</b>", "eq": "换一个角度看期望（p23）：\n\n  原来：对**整条轨迹** τ 取期望 ⇒ 比值是 T 项连乘 ⇒ 爆炸\n  现在：对**每一个 (s_t, a_t)** 取期望 ⇒ 每项只乘**一个**比值\n\n  严格写出来，每一步的比值应该是**状态-动作对**的比值：\n\n      π_{θ'}(s_{i,t}, a_{i,t}) / π_θ(s_{i,t}, a_{i,t})\n      =  [ π_{θ'}(s_{i,t}) / π_θ(s_{i,t}) ]  ·  [ π_{θ'}(a_{i,t}|s_{i,t}) / π_θ(a_{i,t}|s_{i,t}) ]\n         └── **状态分布的比值** ──┘           └──── 动作的比值 ────┘\n              ↓\n         **often approximated as 1**（讲义原话）\n\n────────────────────────────────────────\n于是得到 **Common final form**（常见的最终形式）：\n\n  ∇_{θ'}J(θ') ≈ (1/N) Σ_{i=1}^N Σ_{t=1}^T\n        [ **π_{θ'}(a_{i,t}|s_{i,t}) / π_θ(a_{i,t}|s_{i,t})** ]\n      · ∇_{θ'} log π_{θ'}(a_{i,t}|s_{i,t})\n      · ( Σ_{t'=t}^T r(s_{i,t'}, a_{i,t'}) − b )\n\n  两句评价（p23 原文）：\n    · **Much less likely to explode/vanish**\n    · **…but, hard to measure**（指那个被扔掉的状态比值，没法测）\n\n⚠ 这就是 PPO 里那个重要性比值的来源。你在 L05 精读里见到的就是它。", "pts": ["<b>被近似成 1 的那一项是「两个策略访问状态的分布之比」，而它正是 L02 复合误差那一页的 <code>p_π(s)</code>。</b><span class='k'>新策略会去不同的地方，所以这个比值一般<b>不</b>等于 1</span>。<b>讲义自己承认它 hard to measure —— 因为要测它就得知道策略的稳态状态分布，而那需要真的去跑。</b>", "<b>所以这一步是本讲唯一一处<span class='w'>有偏</span>的近似，而且是整个 PPO 家族的理论软肋。</b><span class='k'>前面的因果性、基线、代理目标全都是无偏的（或精确等价的）</span>；<b>到这里为止一路严谨，最后一步把一个未知量设成了 1</b>。<span class='w'>这不是讲义偷懒，是这个领域的现状。</span>", "<b>但这个近似在「两个策略很接近」时是合理的，而这恰好解释了为什么必须有 p25 的 KL 约束。</b><span class='k'>θ' ≈ θ ⇒ 两者访问的状态分布也接近 ⇒ 比值 ≈ 1</span>。<b>所以 KL 约束不只是在压重要性权重的方差，它还在<span class='k'>为这个被扔掉的项买单</span></b> —— <span class='w'>一个动作，两个作用。</span>", "<b>「逐时刻」这个改动为什么能去掉连乘，值得想一下。</b><span class='k'>轨迹级的比值问的是「这<b>整条</b>轨迹在新策略下有多大可能」</span>；<b>逐时刻的比值只问「<b>这一步</b>的动作在新策略下有多大可能」</b>。<span class='w'>前者是 T 个概率的联合，后者是边缘的 —— 代价就是丢掉了它们之间的耦合（即那个状态分布项）。</span>", "<b>把这一页和 L05 的 PPO 接起来：PPO 做的事就是给这个比值<span class='k'>加一个裁剪</span>。</b><span class='w'>比值太大或太小时把它截断，于是目标函数的<b>形状</b>变了（不是步长变了）</span> —— <b>这正是你在 L05 精读里读到的那条「clipping 改的是目标的形状而不是步长」</b>。<span class='k'>而它要裁的，就是这一页这个比值。</span>"], "tbl": {"cap": "两种重要性采样写法，以及各自付的代价", "head": ["", "轨迹级（p22）", "<b>逐时刻（p23，常见形式）</b>"], "rows": [["比值长什么样", "<b>Π_{t=1}^T 的连乘</b>", "<b>每步一个，不连乘</b>"], ["会不会爆/灭", "<b>会（T=200、单步偏 1% ⇒ 7.3 倍）</b>", "<b>Much less likely</b>"], ["有偏吗", "<b>无偏</b>", "<b>有偏 —— 扔掉了状态分布比值</b>"], ["扔掉的是什么", "—", "<b>π_{θ'}(s)/π_θ(s)，often approximated as 1</b>"], ["为什么能扔", "—", "<b>θ'≈θ 时它确实≈1 ⇒ 所以要 KL 约束</b>"], ["下游", "没人这么用", "<b>PPO 裁的就是这个比值</b>"]]}, "say": "<b>讲稿里这一步的过渡写得很坦白，把「约不掉」这件事明说了：</b><br><br>「<span class='k'>Now there's some details — we've shown this in terms of p of tau, now how do we actually do this in terms of pi of a given S? That actually gets a little bit trickier. We can write down p of tau and this ratio as the product of these different probabilities. Unfortunately, some of the probabilities cancel out. Bu[t…]</span>」<br><br><b>「That actually gets a little bit trickier」—— 从轨迹换到单步，不是一个自然的改写，是一次真实的取舍。</b><br><br><span class='w'>幻灯上那句 often approximated as 1 读起来轻飘飘，但它是整条推导里唯一一处「我们知道它不对，但先这么办」。</span><br><br><b>读论文时碰到这类句子要停一下</b>：<span class='k'>approximated as、assumed to be、for simplicity we take 这几个词组后面，往往藏着整篇文章最脆弱的那个假设</span>。<b>而审稿人也正是从这里下手。</b><br><br>这一条对你写自己的论文同样成立 —— <span class='w'>与其把这种近似藏在脚注里，不如像这张幻灯一样写在正文上，再说明它什么时候成立</span>。", "link": {"t": "你学过的对应：CS224R L05 精读（PPO：裁剪的正是这一页这个比值）", "href": "L05-精读.html"}, "res": {"tag": "推断", "v": "<b>「approximated as 1」这一步，在你的课题里有一个对应，而且你的处境更好 —— 这值得写出来当一个优势。</b><br><br>这里扔掉的是<span class='k'>「两个策略访问状态的分布之比」</span>，扔掉的理由是没法测。<b>而你的「状态」是配置，「动力学」是确定的</b>：<span class='w'>选了哪些算子，配置就是什么，没有随机转移</span>。<br><br><b>所以在你的问题里，这个状态分布比值是<b>可以真的算出来的</b></b> —— <span class='k'>它就是「新搜索策略选中配置 x 的概率 / 旧搜索策略选中 x 的概率」，而两个策略你都写得出来</span>。<b>不需要近似成 1。</b><br><br><b>这意味着你做离线策略评估时可以比 RL 那边严谨一档</b>：<span class='w'>他们被迫丢掉一项，你不用</span>。<br><br>⚠ <b>但上一页那条硬前提仍然卡着你</b>：<span class='k'>旧策略概率为 0 的配置（被剪掉的那些），比值没有定义</span>。<b>所以你能做的是「在旧策略支撑集内的严谨评估」，而不是「对全空间的评估」</b> —— 这个边界要讲清楚。", "ref": "本讲 p23 的 approximated as 1；对照 p21 的支撑前提"}},
{"r": [24, 25], "t": "终于能多走几步了——但走多远要由 KL 来管", "star": 5, "quote": "Off-policy policy gradient.  Common final form.  Full algorithm: 1. sample {τ_i} from π_θ(a_t|s_t)  2. compute ∇_θJ(θ) using {τ_i}  3. θ ← θ + α∇_θJ(θ).  Can take multiple gradient steps on the same batch.  What if our policy changes a lot before sampling new data?  Data no longer reflects states that policy will visit.  Gradient estimate less accurate.  Can we constrain the policy to not stray too far during gradient updates?  One common choice: E_{s∼π_θ}[D_KL(π_{θ′}(· | s) ‖ π_θ(· | s))] ≤ δ.", "one": "<b>有了重要性比值，算法里那个「每步重采」的约束就松开了：<span class='k'>同一批数据可以走多步梯度</span>。</b>但走多了就回到老问题——<span class='w'>数据不再反映策略会去的状态</span>。<b>于是加一条 KL 约束，把「走多远」显式地管起来。</b>", "eq": "改动只有一处（p24）：\n\n  1. 用 π_θ 采一批 {τ_i}\n  2. 用 {τ_i} 算梯度（带重要性比值）\n  3. θ ← θ + α∇J\n  ↑ **回到第 2 步，用同一批数据再走一次** ← Can take multiple gradient steps on the same batch\n\n  省下的是第 1 步 —— 而第 1 步才是贵的那一步（要和环境交互）。\n\n────────────────────────────────────────\n代价（p24 原文，三句递进）：\n\n  · What if our policy changes a lot before sampling new data?\n  · **Data no longer reflects states that policy will visit.**\n  · **Gradient estimate less accurate.**\n\n  ⚠ 注意第二句说的正是 p23 扔掉的那一项：\n     θ' 离 θ 越远，π_{θ'}(s)/π_θ(s) 离 1 越远，那个近似就越不成立。\n\n────────────────────────────────────────\n补救（p25）：显式约束两个策略的距离\n\n  Can we constrain the policy to not stray too far during gradient updates?\n\n  One common choice：\n\n      **E_{s ∼ π_θ} [ D_KL( π_{θ'}(·|s) ‖ π_θ(·|s) ) ]  ≤  δ**\n       └ 状态按**旧**策略采 ┘ └─ 在每个状态上比两个动作分布 ─┘  └ 预算 ┘\n\n  读法：**平均而言**，新策略在旧策略去过的那些状态上，\n        给出的动作分布不能和旧策略差太多。\n\n  δ 是你给的「信任半径」—— 这就是 trust region 这个名字的来历。", "pts": ["<b>看清这一页省下的到底是什么：省的是<span class='k'>采数据</span>，不是省计算。</b><span class='w'>多走几步梯度反而更费算力</span>；<b>但在真机、真人、LLM 评估这些场景里，采数据比算梯度贵好几个数量级</b>。<span class='k'>所以这是一笔非常划算的交易 —— 前提是你的瓶颈在采样而不在算力。</span>", "<b>KL 约束同时在为两件事买单，这一点前面分开出现过，这里合流了。</b>① <span class='w'>压住重要性权重的方差</span>（p21 的「p 和 q 越像越好」）；② <span class='w'>让 p23 那个「状态比值≈1」的近似站得住</span>。<b>一个约束，两个作用</b> —— <span class='k'>这也是为什么它不是可选项而是必需品。</span>", "<b>注意 KL 的方向和期望下标，两个都是刻意的。</b><span class='k'>期望对 <code>s ∼ π_θ</code> 取（旧策略访问的状态）</span> —— 因为你只有旧策略的样本；<span class='k'>KL 写成 <code>D_KL(π_{θ'} ‖ π_θ)</code></span>。<b>KL 不对称，换个方向是另一个量、另一种行为</b>。<span class='w'>这类细节在实现时抄反了不会报错，只会让算法表现莫名其妙。</span>", "<b>「≤ δ」是一个<span class='k'>约束</span>，不是一个惩罚项，这个区别在后续算法里被反复拿来做文章。</b><b>TRPO</b> 真的去解这个带约束的优化（用二阶近似）；<span class='w'>而 PPO 放弃了显式约束，改用裁剪来<b>近似</b>达到同样效果</span> —— <b>这正是 PPO 比 TRPO 简单得多、也流行得多的原因</b>。<span class='k'>你在 L05 精读里读到的就是后者。</span>", "<b>把整条线索串起来看，这一讲后半其实只做了一件事：<span class='k'>让「采一批数据」这件事更值钱</span>。</b>重要性采样让旧数据合法 → 逐时刻形式让它不爆炸 → KL 约束让它别走太远。<b>三步都是为了同一个目标</b>，<span class='w'>而讲稿一开始就把这个目标说小了：「only a little off-policy」。</span>"], "tbl": {"cap": "后半讲的三步，各自解决什么", "head": ["步骤", "解决什么", "新引入的问题", "<b>由谁兜底</b>"], "rows": [["<b>重要性采样（p21–22）</b>", "<b>让旧策略的数据合法</b>", "<b>轨迹级连乘会爆/灭</b>", "p23"], ["<b>改逐时刻（p23）</b>", "<b>去掉连乘</b>", "<b>扔掉了状态分布比值（有偏）</b>", "<b>p25 的 KL</b>"], ["<b>KL 约束（p25）</b>", "<b>压方差 + 让那个近似站得住</b>", "多一个超参 δ", "—"], ["<b>合起来</b>", "<b>同一批数据能走多步梯度</b>", "—", "—"], ["下游", "<b>TRPO 真解这个约束；PPO 用裁剪近似它</b>", "—", "<b>L05</b>"]]}, "say": "<b>把这一页和 L05 的 PPO 并排，你会看到同一个问题的两代答案：</b><br><br>· <span class='k'>本页（TRPO 的思路）</span>：写下约束 <code>E[D_KL] ≤ δ</code>，然后**真的去解**这个带约束的优化问题。严谨，但要算二阶信息，实现复杂。<br>· <span class='k'>L05（PPO 的思路）</span>：不解约束，直接**裁剪重要性比值**。<span class='w'>比值跑出 [1−ε, 1+ε] 就截断，于是目标函数的<b>形状</b>变了</span> —— 策略想跑太远时，梯度自然消失。<br><br><b>你在 L05 精读里读到的那条「clipping 改的是目标的<b>形状</b>而不是<b>步长</b>」，到这里才有完整的来龙去脉</b>：<span class='k'>它改的形状，正是在模拟这一页这个 KL 约束</span>。<br><br><b>这也是一个值得记住的工程模式</b>：<span class='w'>有一个理论上正确但难解的约束，就找一个便宜的替代物，让它在实践中产生近似相同的效果</span>。<b>PPO 之所以统治了 LLM 后训练，靠的不是更好的理论，是更容易跑对。</b>", "link": {"t": "你学过的对应：CS224R L05 精读（PPO 的裁剪 —— 本页 KL 约束的那个便宜替代物）", "href": "L05-精读.html"}, "res": {"tag": "推断", "v": "<b>「KL 约束 = 别让新策略离旧策略太远」这个想法，对你的搜索有一个直接可用的形态，而且理由和这里完全一致。</b><br><br>你的搜索策略每轮会根据新的评估结果更新。<span class='k'>如果一次更新把搜索重心挪得太远，那你之前积累的日志对新策略就没有参考价值了</span> —— <b>而你的日志非常贵，这个浪费承受不起</b>。<br><br><b>两个可落地的做法</b>：<br>· <span class='w'>显式限制每轮搜索分布的变化</span>（例如新旧配置选择分布的 KL ≤ δ），<b>让日志能跨轮复用</b>；<br>· <span class='w'>或者用 PPO 的办法</span>：不加约束，但对「重要性权重过大」的那些历史样本做裁剪或降权。<br><br><b>第二条更省事而且更贴你的实际</b>：<span class='k'>裁剪本质上是在说「这条旧样本对新策略太不代表了，别太信它」</span>，<b>而这正是你拿旧日志做任何推断时都该做的事</b>。<br><br>⚠ 要注意的是<span class='w'>这与剪枝有张力</span>：剪枝是故意把搜索分布推得很远（整片区域概率归零），<b>而 KL 约束是在阻止这件事</b>。<span class='k'>两者怎么共存，是你需要想清楚的一个设计点</span> —— 可能的答案是「剪枝作用于可行域，KL 作用于可行域内部的分配」。", "ref": "本讲 p24–25；对照 CS224R L05 的裁剪"}},
{"r": [26, 28], "t": "回顾：一讲之内从「第一个 RL 算法」走到了 PPO 的门口", "star": 2, "quote": "Review — Online RL via policy gradients: On-policy algorithm, differentiating the RL objective; Baselines, causality for reducing gradient variance; collect batch of data, improve policy by applying gradient.  Derived off-policy policy gradient: importance sampling; KL constraint on policy; collect batch of data, apply multiple gradient updates.  Intuition: Do more high reward stuff, less low reward stuff; Gradient still very noisy, best with large batch sizes and dense rewards.  Key learning goals: Key intuition behind policy gradients; How to implement, when to use policy gradients.  the basis for: + part of default project.  Next time: Actor critic methods → basis for popular algorithms like PPO → build closely on policy gradients!", "one": "<b>一讲走完了两段路</b>：<span class='k'>前半从目标函数推出 vanilla policy gradient（on-policy）</span>，<span class='k'>后半把它改造成能多走几步的 off-policy 版本</span>。<b>而 p27 底下那行小字说明了为什么要学它：it's the basis for ... part of default project。</b>", "eq": "p26 的两段回顾：\n\n  **在线 RL via 策略梯度**\n    · on-policy 算法，直接对 RL 目标求导\n    · 基线、因果性 —— 都是为了**降梯度方差**\n    · 采一批数据 → 应用梯度 → 改进策略\n\n  **推导出的离策略策略梯度**\n    · 重要性采样\n    · 策略上的 KL 约束\n    · 采一批数据 → **在同一批上走多步梯度**\n\n  直觉（两条，原文）：\n    · **Do more high reward stuff, less low reward stuff**\n    · **Gradient still very noisy, best with large batch sizes and dense rewards**\n\n────────────────────────────────────────\n整讲的降方差手段一共四件，按出现顺序：\n\n  ① 因果性（`.a` p13）—— 只用未来奖励      · 无偏\n  ② 基线（p16）—— 减一个常数              · 无偏\n  ③ 大批量（p17）—— 多采几条轨迹平均掉     · 无偏，但费样本\n  ④ 密集奖励（p17）—— 改奖励函数本身       · **改的是问题，不是算法**\n\n  ⚠ 前三件都没能解决 p17 叠外套那个毛病 —— 那要等 L04 的值函数。\n\n────────────────────────────────────────\np28 预告：\n  Actor critic methods → **basis for popular algorithms like PPO**\n                       → build closely on policy gradients!", "pts": ["<b>把整讲的降方差手段列齐，会发现它们解决的不是同一件事。</b><span class='k'>因果性和基线是「同样的数据，更好的估计」</span>；<span class='w'>大批量是「花更多数据换更好的估计」</span>；<span class='w'>密集奖励是「换一个更好解的问题」</span>。<b>只有前两件是白赚的。</b>", "<b>p27 底下那行「the basis for: + part of default project」值得注意。</b><span class='k'>默认项目是「用 RL 微调一个 LLM」（L01 p12）</span>，<b>而那条路上跑的就是策略梯度的后代</b>。<span class='w'>所以这一讲不是理论铺垫，它是那个项目要动手写的东西。</span>", "<b>这一讲与 L02 的关系，到结尾可以说清楚了：策略梯度 = 加权的模仿学习。</b><span class='k'>代理目标（p18）就是「每条样本带权重的最大似然」</span>；<b>权重为正就多做、为负就少做</b>。<span class='w'>L02 建立的那套代码骨架（输出分布、算对数似然），在这里原样复用。</span>", "<b>注意 p26 两段的第三行形成了对照，那正是这一讲的全部收获。</b>前半：<span class='k'>collect batch → improve policy by applying gradient</span>（一批走一步）；后半：<span class='k'>collect batch → apply multiple gradient updates</span>（一批走多步）。<b>只差一个词，但那个词值一整套重要性采样加 KL 约束。</b>", "<b>下一讲的位置写得很明确：Actor-Critic 是 PPO 的基础，而且 build closely on policy gradients。</b><span class='w'>也就是说 L04 不会推翻这一讲的任何东西，只会在它上面加一个值函数</span> —— <b>用来修 p17 叠外套那个「中间步骤拿不到信用」的洞</b>。"], "tbl": {"cap": "整讲四件降方差手段：代价各不相同", "head": ["手段", "在哪页", "有偏吗", "<b>代价</b>"], "rows": [["<b>因果性</b>（只用未来奖励）", "`.a` p13", "<b>无偏</b>", "<b>零 —— 白赚</b>"], ["<b>基线</b>（减常数）", "p16", "<b>无偏</b>", "<b>零 —— 白赚</b>"], ["<b>大批量</b>", "p17", "无偏", "<b>费样本</b>"], ["<b>密集奖励</b>", "p17", "—", "<b>改的是问题本身</b>"], ["<b>都没解决的</b>", "<b>p17 叠外套：中间步骤拿不到信用</b>", "—", "<b>→ L04 值函数</b>"]]}, "say": "<b>这一讲结束时，你手上应该有两样东西，而它们的性质很不一样：</b><br><br><b>一个算法</b>：vanilla policy gradient，以及它的 off-policy 改造。<span class='w'>这个会被后面的 Actor-Critic、PPO 一层层替换掉。</span><br><br><b>一组手法</b>：对数梯度技巧、因果性、基线、代理目标、重要性采样、KL 约束。<span class='k'>这些不会被替换，它们会在后面每一讲里反复出现</span>。<br><br><b>所以复习这一讲的正确方式，是确认那六个手法你每一个都能说出「它解决什么、代价是什么」</b>，而不是背那个梯度公式。<br><br>· <span class='k'>对数梯度技巧</span> → 把 ∇ 挪进期望里（并且顺便让动力学消失）<br>· <span class='k'>因果性</span> → 砍掉一半与本步无关的噪声，无偏<br>· <span class='k'>基线</span> → 让低于平均的行为拿到负梯度，无偏<br>· <span class='k'>代理目标</span> → 一次反传算完，梯度不变<br>· <span class='k'>重要性采样</span> → 旧数据变合法，代价是方差<br>· <span class='k'>KL 约束</span> → 把那个代价压住<br><br><b>六条里有四条是「白赚或等价」，只有重要性采样那一条是真的在拿准确性换样本效率。</b>", "link": {"t": "你学过的对应：CS224R L05 精读（下下讲：PPO —— 本讲后半那三步的成品形态）", "href": "L05-精读.html"}, "res": {"tag": "推断", "v": "<b>这一讲给你的最可迁移的东西，是那个「降方差手段按代价分级」的习惯。</b><br><br>你的瓶颈是评估预算，<span class='k'>而评估噪声直接决定了你需要多少次评估才能分辨两个配置</span>。<b>所以任何能降方差的手段，都等价于省评估次数</b>。<br><br><b>按本页那个分级，逐条对照你的问题</b>：<br>· <span class='w'>白赚的（无偏且不费样本）</span>：<b>配对比较</b>（同一批测试样本 + 固定种子评估所有候选，见 p16 那一条）、<b>控制变量</b>（只改一个算子时复用其余部分的结果）；<br>· <span class='w'>费样本的</span>：加大每个配置的重复评估次数 —— <b>直接消耗预算，但有时必须</b>；<br>· <span class='w'>改问题的</span>：换一个方差更小的评估指标（例如用连续分数而不是通过/不通过）—— <span class='k'>对应这里的「密集奖励」，而且同样要小心它是否还是你真正关心的那个目标</span>。<br><br><b>第一类应该先榨干再考虑第二类</b>。<span class='k'>这听起来显然，但实践中大多数人直接跳到第二类（多跑几次），因为那不需要动脑子。</span>", "ref": "本讲四件降方差手段；对照 CSE 541 L06 的淘汰判据对方差的依赖"}}
];

var TH = {"title": "L03 接上课题的哪一段：六个手法，其中四个是白赚的", "arc": "这一讲是全课的转折：<b>L02 的模仿学习绕开了那行目标函数，这一讲正面去求它的导数</b>。而整讲真正该带走的不是那个梯度公式（它会被 L04 的 Actor-Critic、L05 的 PPO 一层层替换掉），是<span class='k'>六个会在后面每一讲反复出现的手法</span>：<br><br>· <b>对数梯度技巧</b>（`.a` p8）—— 把 ∇ 挪进期望里，<span class='w'>顺便让未知的动力学自己消失</span>（这条性质后面还会再救一次场）<br>· <b>因果性</b>（`.a` p13）—— 只用未来奖励，<b>无偏</b><br>· <b>基线</b>（p16）—— 减一个常数让低于平均的行为拿负梯度，<b>无偏</b><br>· <b>代理目标</b>（p18）—— 一次反传算完，<b>梯度完全不变</b><br>· <b>重要性采样</b>（p21–23）—— 让旧数据合法，<span class='w'>代价是方差，而且扔掉了一项</span><br>· <b>KL 约束</b>（p25）—— 把那个代价压住<br><br><span class='k'>六条里有四条是白赚或精确等价的，只有重要性采样那一条是真的在拿准确性换样本效率。</span><b>这个分级本身比任何单条手法都值钱。</b><br><br><b>讲者用三个例子逐层逼出了下一讲</b>：`.a` p12 回报全负 ⇒ 鼓励「向前倒」（因果性修）→ `.a` p14 回报全正 ⇒ 连踉跄也鼓励（基线修）→ <b>p17 叠外套：稀疏奖励让三条轨迹的梯度完全相同（修不了，要等 L04 的值函数）</b>。<br><br><b>对你课题最有用的两条</b>：<br>① <span class='k'>p16 的基线</span> —— 「减一个共同成分，期望不变、方差下降」，直接对应<b>配对比较</b>：用同一批测试样本、固定种子评估所有候选配置，<span class='w'>不增加任何评估次数就能降方差</span>。<br>② <span class='k'>p21–23 的重要性采样</span> —— 这就是「用旧日志评估新搜索策略」。<b>你的处境比 RL 那边好</b>（轨迹短、动力学确定，那个被近似成 1 的状态比值你<span class='w'>真的能算出来</span>），<b>但那条硬前提卡着你</b>：被剪枝剪掉的配置 q = 0，比值<b>没有定义</b>，不是「估得不准」。<br><br>⚠ <b>材料形态提醒</b>：28 页里 p1 标题、p2 课务、p27 重复提纲、p28 预告 —— 真内容是 p3–p26。<span class='w'>⚠ 讲者当场承认 p10 与 p18 的公式有同一处笔误：第二个求和号应当在第一个<b>里面</b></span>，按幻灯原样抄会抄错，两片的 `eq` 格都写成了正确形式。", "pitfalls": [{"v": "<b>把 p18 的「代理目标」和 L02 的「凸替代损失」当成同一回事。</b><span class='k'>L02 是真的换了目标函数（0/1 → 凸损失），保证也跟着换，有代价</span>；<b>这里梯度<span class='w'>完全相同</span>，只是换了算得更快的写法，纯赚</b>。两者唯一的共同点是都叫 surrogate。<br>⇒ 连带的一条：<b>代理目标的<span class='k'>数值</span>没有意义</b>（它不是期望回报）。训练时打印的那个 loss 上升下降都不说明什么，要看进展得另外记录真实平均回报 —— <span class='w'>这是初学策略梯度最常见的困惑</span>。", "tag": "已核", "ref": "本讲 p18；讲稿「I'm calling it surrogate because it's not the same as the very first objective」"}, {"v": "<b>实现代理目标时忘了把回报项 detach。</b><span class='k'>括号里那个 <code>Σ_{t'≥t} r − b</code> 必须当成常数，不参与求导</span>。<b>让梯度流进去的话，你算出来的就不是 ∇J 了</b> —— <span class='w'>而且不会报错，训练照跑，只是学不动</span>。这类静默算错一个梯度的 bug 最难查。", "tag": "推断", "ref": "本讲 p18 的代理目标形式；detach 这一条讲义未明写，是实现上的必然要求"}, {"v": "<b>把 offline/online 和 on-/off-policy 混用。</b><span class='k'>offline/online 问「要不要用学到的策略去产生新数据」；on-/off-policy 问「新数据必须来自<b>当前</b>策略，还是也能用<b>旧</b>策略的」</span>。<b>两个维度独立</b>：离线 RL 必然 off-policy，但 off-policy 不必离线 —— <span class='w'>本讲后半就是一个「在线但 off-policy」的算法</span>。讲义把 on/off-policy 标成 attribute of online RL algorithms，正是这个意思。", "tag": "已核", "ref": "本讲 p20 的定义；对照 L02 p16 的 offline/online"}, {"v": "<b>以为逐时刻的重要性采样（p23）和轨迹级的（p22）是等价改写。</b><span class='k'>它扔掉了状态分布的比值 π_θ'(s)/π_θ(s)，讲义原话是 often approximated as 1</span>。<b>这是本讲唯一一处<span class='w'>有偏</span>的近似</b> —— 前面因果性、基线、代理目标全是无偏或精确等价的。<b>而它正是整个 PPO 家族的理论软肋</b>：一路严谨到最后一步，把一个未知量设成了 1。<span class='k'>KL 约束存在的理由之一就是让这个近似站得住。</span>", "tag": "已核", "ref": "本讲 p23 的 often approximated as 1 与 hard to measure"}, {"v": "<b>用确定性策略当重要性采样的提议分布。</b>p21 的硬前提是 <span class='k'>q 在 p 有概率的地方必须非零</span>，<b>而确定性策略除一个动作外处处为 0</b> —— <span class='w'>新策略想探索的任何别的动作，权重分母都是 0，式子<b>没有定义</b></span>（不是「估得不准」）。⇒ 这又一次解释了 L01 p39 的「为什么策略要随机」：<b>随机性不只是为了探索，也是为了让旧数据可复用</b>。", "tag": "推断", "ref": "本讲 p21 的支撑前提；确定性策略那个推论是补的"}], "ammo": [{"q": "你的评估那么贵，有没有不增加评估次数就能降噪声的办法？", "a": "<b>有，而且这一讲给了它的数学依据：p16 的基线。</b><br><br><span class='k'>减掉一个常数 b，梯度的期望一点不变（无偏），方差却降下来了</span>。证明只有三行，关键是「概率密度积分为一，而 1 的梯度是 0」。<br><br><b>搬到你的问题上就是<span class='w'>配对比较</span></b>：两次评估的噪声里有一大块是「这批测试样本本身难易」造成的，<span class='k'>对所有候选配置是<b>共同</b>的</span>。<b>用同一批测试样本、固定随机种子评估全部候选，然后比较「配置分数 − 该批平均分」</b> —— 共同成分被减掉，差值的期望不变、方差明显下降。<br><br><b>这在统计上叫 paired comparison，统计效力比独立两组高得多，而且不花一次额外评估。</b><br><br>⚠ 前提：同一批样本要能重复用于不同配置，且 LLM 采样的随机性要固定种子，否则配不上对。", "tag": "推断", "ref": "本讲 p16 的无偏性证明；配对比较是标准统计手法"}, {"q": "你能不能用已有的日志，离线评估一个新的搜索策略？", "a": "<b>这正是 p21–23 的重要性采样，而你的处境<span class='k'>比 RL 那边好</span>，有两条可以写出来：</b><br><br>① <span class='w'>你的「轨迹」很短</span>（选一个配置，或构造几步），<b>不是 T=200 的连乘</b> —— p22 那个「1.01²⁰⁰ ≈ 7.3 倍」的爆炸问题基本不存在。<br>② <span class='w'>你的动力学是确定的</span>（选了哪些算子，配置就是什么），<b>所以 p23 那个被近似成 1 的状态分布比值，你是真的能算出来的</b> —— 它就是「新策略选中配置 x 的概率 / 旧策略选中 x 的概率」，两个策略你都写得出来。<b>不需要近似。</b><br><br><b>⇒ 你做离线策略评估可以比 RL 那边严谨一档。</b><br><br>⚠ <b>但那条硬前提卡着你，而且必须写明</b>：<span class='k'>被剪枝剪掉的那些配置，旧策略概率为 0</span>，<b>重要性比值<span class='w'>没有定义</span></b>。所以你能做的是「<b>在旧策略支撑集内</b>的严谨评估」，不是对全空间的评估。<b>「剪枝过的日志不能直接拿来做全空间的离线比较」是一个真实的技术限制，悄悄用会被抓。</b>", "tag": "推断", "ref": "本讲 p21 的支撑前提与 p23 的状态比值；对照 CS224R L07 离线 RL"}, {"q": "你的搜索策略每轮更新，之前的日志不就作废了吗？", "a": "<b>这正是 p20 那个 on-policy 困境，而 p24–25 给了标准解法。</b><br><br>问题一样：<span class='k'>搜索策略一更新，之前的日志就不是「当前策略」采的了</span>。而你的日志<b>非常贵</b>，这个浪费承受不起。<br><br><b>两个可落地的做法</b>：<br>· <span class='w'>显式限制每轮搜索分布的变化</span>（新旧配置选择分布的 KL ≤ δ），<b>让日志能跨轮复用</b> —— 这是 TRPO 的思路；<br>· <span class='w'>不加约束，但对重要性权重过大的历史样本裁剪或降权</span> —— 这是 PPO 的思路，<b>更省事也更贴实际</b>。<span class='k'>裁剪本质上是在说「这条旧样本对新策略太不代表了，别太信它」。</span><br><br>⚠ <b>要想清楚一个张力</b>：<span class='w'>剪枝是故意把搜索分布推得很远（整片区域概率归零），而 KL 约束是在阻止这件事</span>。<b>可能的调和是「剪枝作用于<b>可行域</b>，KL 作用于可行域<b>内部</b>的分配」</b> —— 这是一个设计点，不是自动成立的。", "tag": "推断", "ref": "本讲 p20、p24–25；对照 CS224R L05 的裁剪"}, {"q": "你汇报的那些内部指标，哪些是可以解读的？", "a": "<b>p18 教了一个该养成的条件反射：<span class='k'>看到一个被优化的量，先问它本身可不可解读</span>。</b><br><br>代理目标的<b>数值</b>没有意义（它不是期望回报），<span class='w'>只有它的梯度有意义</span>。讲者专门澄清过这一点。<br><br><b>你的搜索里也有两类量，报结果时要分开</b>：<br>· <span class='k'>可解读的</span>：代理模型的预测分数 —— 可以画趋势、可以和真值比校准；<br>· <span class='w'>不可解读的</span>：UCB 的上界（它是<b>刻意乐观</b>的，不是对分数的估计）、剪枝阈值、以及 CSE 541 L10 那个信息增益 <code>Σ‖x_t‖²_{V_t⁻¹}</code>（它只能看「有没有按理论预期压平」）。<br><br><b>把一个「只有梯度/排序有意义」的量当成真实指标去汇报，是很容易被审稿人抓住的错误。</b>", "tag": "推断", "ref": "本讲 p18；对照 CSE 541 L10 的信息增益诊断量"}], "papers": [{"t": "Williams, Simple Statistical Gradient-Following Algorithms for Connectionist Reinforcement Learning", "id": "Machine Learning 1992（REINFORCE 原始论文）", "why": "<b>`.a` p10 那个算法的出处。</b><span class='k'>标题里 Simple 这个词是认真的</span> —— 整个算法就是「采一批、按回报加权、走一步梯度」。<b>它比深度学习早了二十年</b>，而今天 LLM 后训练里跑的东西，骨架还是它。"}, {"t": "Schulman et al., Trust Region Policy Optimization (TRPO)", "id": "ICML 2015", "why": "<b>p25 那个 KL 约束的成品。</b>它<span class='w'>真的去解</span>那个带约束的优化（用二阶近似），<b>所以严谨但实现复杂</b>。<span class='k'>读它主要是为了理解 PPO 在简化什么</span> —— 而不是为了实现它。"}, {"t": "Schulman et al., Proximal Policy Optimization Algorithms (PPO)", "id": "arXiv 2017", "why": "<b>本讲后半三步的最终形态，也是 L05 的主角。</b><span class='k'>它放弃显式 KL 约束，改用裁剪重要性比值来近似同样的效果</span>。<b>PPO 统治 LLM 后训练靠的不是更好的理论，是更容易跑对</b> —— <span class='w'>这个「用便宜的替代物模拟昂贵的约束」是一个很值得记住的工程模式</span>。"}, {"t": "Schulman et al., High-Dimensional Continuous Control Using Generalized Advantage Estimation (GAE)", "id": "ICLR 2016", "why": "<b>p17 叠外套那个洞的正面回答。</b><span class='k'>本讲的基线只能是常数；GAE 把它换成依赖状态的值函数，并给了一个在偏差与方差之间连续调节的参数 λ</span>。<b>先读 L04 Actor-Critic 再读它</b>，顺序反了会觉得是凭空冒出来的。"}, {"t": "本课 L04：Actor-Critic", "id": "lecture_4（37 页）", "why": "<b>p28 明写的下一讲，而且 build closely on policy gradients</b> —— 它不推翻本讲任何东西，<span class='k'>只是把基线从「一个常数」换成「一个依赖状态的值函数」</span>。<b>p17 那个「叠了袖子却拿不到信用」的洞，就是在那里补上的。</b>"}, {"t": "本课 L05：离策略 Actor-Critic 与 PPO", "id": "本站已有精读", "why": "<b>本讲后半的直接下游。</b>你在那份精读里读到的「<span class='w'>off-policy 不是一个新算法，而是一个程度：同一批数据你敢用它走几步梯度</span>」，<span class='k'>到这一讲才有了完整的来龙去脉</span> —— 以及那条「裁剪改的是目标的<b>形状</b>而不是步长」，它改的形状正是 p25 这个 KL 约束。"}]};

      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=SRC+"?p="+p+"#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
