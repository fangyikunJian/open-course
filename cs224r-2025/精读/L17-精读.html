<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS224R 第十七讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs224r-2025-l17">

<div id="bar">
  <h1>CS224R 第十七讲 · <span>用强化学习提升机器人智能</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 79</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../corpus/slides/17_rl_for_robotics.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs224r-2025</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/L17-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "p2 那张「模仿学习 vs 强化学习」的对照表，讲者给了什么限定？", "o": ["它只适用于机器人领域", "这是两类算法的严格定义", "它比较的是「真正奏效的那些」模仿学习与强化学习 —— 是对最成功案例的归纳，不是定义；而且明确说不是在比高低（AlphaGo 与 LLM 都先用模仿学习热启动）", "它来自一篇综述论文"], "a": 2, "why": "<span class='k'>三条特征里第二条最有意思：模仿学习要「清洗数据、只留好的」，而 RL 里「rollout 产生的每一个数据点都是公平竞争的」——好坏通吃，所以能学出很精确的行为。</span><b>第三条也有个后半句常被漏掉：RL 不只造专才，它也可以把一个通才<b>专化</b>。</b>"}, {"q": "讲者认为 AlphaGo、LLM 推理、机器人灵巧性这三次成功共用哪两个前提？", "o": ["深度网络与 GPU", "奖励说得清（能自动算）+ 评估跑得起（能规模化）", "大模型与大数据", "模仿学习预训练与微调"], "a": 1, "why": "<b>重点不在奖励稀疏不稀疏——AlphaGo 的奖励极稀疏，但看一眼棋盘就能判定。重点在<b>能不能自动算</b>。</b><span class='w'>而讲者还点出这三件事相隔七八年发生，两个要素始终没变。落到机器人上，拿到这两样的办法只有一个：仿真——「把物理问题变成了数字问题，于是随算力扩展」。</span>"}],
5: [{"q": "那七段真实世界视频，讲者强调的关键事实是什么？", "o": ["每种地形都单独微调过", "全部来自同一套权重，零样本部署、没有任何针对地形的调参，而且全程是盲的（只用本体感觉历史）", "用了多个策略投票", "都是在仿真里录的"], "a": 1, "why": "<span class='k'>「零样本」在这里的准确含义是：仿真里训完直接搬上真机，<b>一次都没碰过真实世界</b>——不是「在一种地形上微调后泛化到别的」。</span><b>而「全程是盲的」这个限定让 p18 那个关键洞察更有分量：如果看不见，它凭什么知道脚下是油还是沙？</b>"}, {"q": "草地那一段视频，讲者补了一句什么？它为什么重要？", "o": ["草地摩擦系数最低", "草地上必须降低速度", "「就算你有视觉，在这种情形下也看不到下面的地面」—— 它提前回答了一个很自然的质疑：有些情形下视觉根本帮不上忙，必须靠本体感觉的鲁棒性", "草地是训练分布内的"], "a": 2, "why": "<span class='w'>其余几段各有难点：碎石（脚卡住，反复试后察觉并继续）· 楼梯（看不见，踉跄但不摔）· 泥地（脚陷进去，加大力气拔出来）。</span><b>而 p12 那个标题 One Policy to Walk them All 把目标说得很准：不是七个策略，是一个。</b>"}],
14: [{"q": "RMA 在仿真里学走路，和普通的「域随机化」差在哪一步？", "o": ["差在把这些参数作为输入喂给策略：普通域随机化训的是「对一切都还行」的鲁棒策略（只能取折中），而这里训的是「知道自己在什么情形下并据此调整」的策略", "用了更长的训练时间", "用了更大的网络", "随机化的参数更多"], "a": 0, "why": "<b>讲者一句话点透：「it's <b>not oblivious or blind</b> to the environment. It's actually <b>aware</b> of what it's dealing with」。</b><span class='k'>这个被压缩的参数向量叫 extrinsics（外在参数）z_t，完整物理参数约 17–18 维，压缩后约 8 维。</span>"}, {"q": "奖励函数里「Minimize hardware damage」这一项，为什么必须人为加进去？", "o": ["因为硬件损坏难以量化", "因为 PPO 不支持约束", "因为仿真里根本没有「硬件损坏」这个概念 —— 必须把真实世界的约束注入仿真的奖励里，学出来的东西才可能迁移过去", "因为电机参数是随机化的"], "a": 2, "why": "<span class='w'>⚠ 讲者对奖励工程的坦白值得记：实际有 <b>10 个</b>奖励函数，「不太优雅，但我们尽量做得有原则」；而被问到怎么配权重时的回答是「<b>没有好办法，这是实话</b>」——实用做法是一次只加一个奖励，把指数级的复杂度降成逐个添加。</span>"}],
17: [{"q": "RMA 的关键洞察是「从观测历史估计 extrinsics」。这个信号里为什么会含有环境信息？", "o": ["因为历史里包含了传感器读数", "因为 50 步足够长", "因为神经网络能拟合任何函数", "因为预期与实测的落差编码了环境：你下的指令隐含一个预期运动，如果腿滑得比预期多，这个偏离量就告诉你「你滑了，而且不是故意的」"], "a": 3, "why": "<b>⇒ 这正好解释了为什么那些结果能「全程是盲的」：机器人不需要<b>看见</b>油污，它只需要注意到<b>自己滑了</b>——环境的物理性质会印在你自己的运动误差上。</b><span class='k'>而人工标定行不通的理由很具体：在客厅标好了，一换到沙地或覆盖物上就得重标。</span>"}, {"q": "讲稿提到一个反常识的事实：多数成功的 sim2real 策略其实<b>不</b>用历史。为什么？", "o": ["历史数据难以采集", "历史会增加推理延迟", "RNN 难以训练", "用了历史，策略就从「以状态为索引」变成「以状态和时间为索引」，更容易在仿真里学到可被利用的捷径 —— 比如周期性推它一把，它会学会「在预期被推的那一刻特别稳」"], "a": 3, "why": "<b>解法是把那个周期也随机化掉。⇒ <b>用历史是有代价的，必须配更仔细的随机化</b>。</b><span class='w'>另注意讲者把 RMA 归类为<b>上下文学习</b>而非微调：「学习发生在前向传播本身里」——不改权重只改输入，所以才能在零点几秒内完成。</span>"}],
19: [{"q": "第二阶段用 DAgger 训 Adaptation Module，关键细节是什么？", "o": ["用教师走过的状态做标注", "数据分布由学生产生，标签由教师给：跑学生收数据（一开始全是烂数据），再用教师编码器逐点监督「本该预测什么」，然后回仿真重复", "教师和学生交替训练", "用强化学习微调学生"], "a": 1, "why": "<b>如果反过来在教师走过的状态上标注，学生一旦偏离就没数据可参考——正是 L02 讲的复合误差。</b><span class='k'>而「特权信息 → 蒸馏」这个三步套路（用作弊信息训强教师 → 学生在自己分布上跑 → 教师逐点监督）在 p51 的视觉版本里会原样再用一遍。</span>"}, {"q": "测试时 Adaptation Module 只跑 10 Hz 而 Base Policy 跑 100 Hz。这个设计是怎么来的？", "o": ["是为了匹配传感器采样率", "完全是意外 —— 板上算力只够这样，而且训练时两者是 100 Hz 同步的、这个不匹配完全没被考虑过；但性能没有掉，因为环境参数变化得比动作慢得多", "是为了节省功耗而刻意设计的", "是训练时就按这个比例设定的"], "a": 1, "why": "<b>⚠ 但别当成普遍规律：它成立的前提是<b>被估计的量变化缓慢</b>。</b><span class='w'>如果环境参数本身高频变化（比如踩在不断晃动的板子上），10 Hz 可能就不够了——讲者自己说的也是「够拿到我们想要的结果」而不是「任何情况下都够」。</span>"}, {"q": "有人问「能不能跳过第一阶段、直接端到端训第二阶段」。答案是什么？", "o": ["能，但要更多算力，而且更危险 —— 在仿真里给它的信息越多，它越可能学会钻环境、物理或奖励结构的空子", "不能，因为学生没有特权信息", "不能，因为梯度无法回传", "能，而且效果更好"], "a": 0, "why": "<b>⇒ 所以两阶段不只是省算力，它还<b>限制了学生能看到的东西</b>，从而减少了可被利用的捷径。</b><span class='k'>这和「用历史会学到周期性推搡的捷径」是同一个担忧的两种形态。</span>"}],
21: [{"q": "三组室内测试各打一个不同的物理量。活动木板那一组打的是什么？", "o": ["打的是摩擦，因为木板很滑", "打的是电机强度", "打的是地面本身的可预测性 —— 板子会随脚移动，「没有任何关于地面的明确估计可言」；前两组地面至少是固定的（只是滑或重），这一组连「地在哪」都在变", "打的是机器人的平衡感"], "a": 2, "why": "<span class='k'>另两组：橄榄油打摩擦（脚上包塑料「既是为了增加难度，也是为了保护机器人的脚」），抛 5 公斤打质量（机器人自重 12 kg，相当于突然多背半个自己）。</span><b>⚠ 而贯穿的限定是：全程是盲的——它看不见油、看不见砸下来的重物、看不见板子在动。</b>"}, {"q": "抛 5 公斤那一段慢放里，讲者让你注意什么？", "o": ["先被压下去，再爬回来 —— 不是「扛住了」，而是先塌陷、再调整、最后回到原来的步态；适应是一个有过程的动作", "机器人改变了行进方向", "机器人完全没有受影响", "机器人停下来等待"], "a": 0, "why": "<span class='w'>讲稿：「you see that the bot actually goes down. If you focus on the green dots, in a few steps it tries to go back up and recover the regular motion style」。</span><b>三组合起来覆盖三类扰动：摩擦（接触的性质）· 质量（自身的性质）· 地形（环境的几何），正好对上 p14 随机化的那几个参数。</b>"}],
29: [{"q": "「关掉适应模块」这个对照实验具体是怎么做的？为什么这个做法很干净？", "o": ["只估第一个时间步然后冻住，之后不再更新；干净在于两边的网络、权重、输入通道完全一样，唯一差别是「z_t 要不要持续更新」", "降低适应模块的更新频率到 1 Hz", "换成一个更小的适应模块", "把适应模块整个删掉，改用固定的默认值"], "a": 0, "why": "<b>它隔离出来的正是 p18 那两个词：Continuously 与 online。</b><span class='k'>⚠ 而这个消融只有在环境<b>中途</b>变化时才区分得出来——如果重物从一开始就在身上，「只估第一步」也能估对。所以实验故意设计成<b>抛</b>过来。</span>"}, {"q": "关掉适应之后，机器人的失败方式是什么？它说明了什么？", "o": ["电机过热导致停机", "被压得往前倾，而它不知道该给前腿加力矩、也不知道该抬高离地间隙 —— 说明问题不是「策略能力不足」而是「策略缺少关于当前情形的信息」", "它选择了站着不动", "策略发散，动作变成随机"], "a": 1, "why": "<b>这两个补偿动作策略本来是会做的（带适应的那版就做了），它只是<b>不知道现在需要做</b>。</b><span class='w'>泡沫垫那组同一个故事，讲稿的措辞是「because it hasn't <b>detected</b> that event or that change」——问题是没检测到事件，不是不会应对。</span>"}],
32: [{"q": "讲者对适应模块输出的那两条曲线，给了什么坦白？", "o": ["它们是手工设计的特征", "这是学出来的 extrinsics，不好解释 —— 「我们没法轻易解释它们，但我们看到发生了某种变化」；它是网络自己学的压缩表示，没有被约束成可解释的物理量", "它们只在仿真里有意义", "它们精确对应摩擦系数和负载"], "a": 1, "why": "<b>⇒ 这张图能证明的只有一件事：发生事件时它变了，而且变化与行为的恢复同步（注意因果顺序：<b>事件被检测到 → 然后才恢复</b>）。</b><span class='k'>而「不可解释」恰恰是 p37 那个反直觉结果的另一面：它没有被强迫去预测真实物理量——而强迫它去预测反而更差。</span>"}, {"q": "抛重物那一组里，最硬的那个定量证据是什么？", "o": ["适应完成之后，力矩稳定到的新水平比事件之前更高 —— 因为身上确实多了 5 公斤，维持同样步态本来就需要更大力矩；这说明适应不是「压回原状」而是切换到了适合新情形的新工作点", "步态频率变慢了", "冲击瞬间的力矩很高", "四只脚的触地时间变长了"], "a": 0, "why": "<b>这比「它没摔倒」强得多：「没摔倒」可以是运气，而力矩稳态的改变只能由「它真的察觉并补偿了」来解释。</b><span class='w'>而且这个证据是<b>定量</b>的、可从图上读出，不依赖主观判断视频里走得好不好。</span>"}],
37: [{"q": "四条基线里最反直觉的结果是哪一条？", "o": ["RMA w/o Adaptation 与完整 RMA 相当", "测试时微调比 RMA 更好", "Robust 基线的成功率最高", "显式做系统辨识（直接预测摩擦、质量）不但不如 RMA，甚至不如那个什么都不估的 Robust 基线"], "a": 3, "why": "<b>讲者给了两条理由，而第二条才是要害：精确预测本来就难，<b>而且对最终任务来说也没有必要</b>——「你不需要知道摩擦是 0.3 还是 0.35，你只需要知道该多使点劲」。</b><span class='k'>⇒ 它输在<b>解了一个比需要的更难的问题</b>。而这条教训在 p42–p44 的「地形图」那里会再出现一次。</span>"}, {"q": "Robust 基线（域随机化但不喂参数）的毛病是什么？根本原因呢？", "o": ["需要更多训练样本", "无法泛化到新地形", "训练不稳定，容易发散", "保守、成功率反而更低、力矩和冲击都更大；根本原因是「它对周围环境一无所知，只能尽可能用力以保证不摔倒」"], "a": 3, "why": "<b>⇒ 不知道情况，就只能一律用最大的力气——又费电、又伤硬件、成功率还更低。</b><span class='w'>而讲者还承认了一处差距：用特权信息的<b>教师</b>与蒸馏出来的 RMA 学生之间仍有小差距——蒸馏不是无损的。</span>"}],
39: [{"q": "前半讲刚证明了盲策略能走遍七种地形。那为什么还要视觉？讲者给了两个理由。", "o": ["为了在黑暗中工作", "为了减少本体感觉传感器的数量", "为了识别物体和导航", "① 有些情形非看不可（跨沟、踏脚石、跳跃要提前知道落脚点）；② 效率、优雅与寿命 —— 「如果每次上楼梯都要先撞一下，那是个很不优雅的策略，而且硬件撑不了多久」"], "a": 3, "why": "<b>值得记的区分：本体感觉只能告诉你<b>已经发生</b>的事（我滑了、我陷了），视觉才能告诉你<b>将要发生</b>的事——前者是反应式补偿，后者是预判式规划。</b><span class='k'>而理由二正好呼应 p16 那条奖励项 Minimize hardware damage。</span>"}],
42: [{"q": "「先建地形图再喂给控制器」这条路线，讲者认为错在哪？", "o": ["地图分辨率不够高", "错在你先解了一个比最终任务更难的问题：建一张精确的度量地图本身就很难（非刚体、位姿漂移），而「那一步你已经丢了信息，而且再也找不回来」", "控制器无法处理高维输入", "地图更新频率太低"], "a": 1, "why": "<b>因果被点成一句话：「<b>因为我们在解一个更难的问题，所以我们丢了信息</b>——而如果直接把感知输入喂给策略，本来不会丢。」</b><span class='w'>具体例子：有时候「边缘在哪」就足够告诉你怎么迈那一步，但一旦转成度量地图，你就得再训练策略去对付各种噪声。</span>"}, {"q": "这条教训在本讲里出现过两次。另一次是哪里？", "o": ["两阶段训练那里", "RNN vs transformer 那里", "奖励函数设计那里", "p37 的系统辨识基线：被迫精确估摩擦（而你只需要知道「该多使点劲」），结果连什么都不估的 Robust 基线都不如 —— 和这里「被迫精确估地形高度，而你只需要知道边缘在哪」是同一个错误"], "a": 3, "why": "<b>一讲之内同一条教训出现两次，而且两次都有实验支持——这不是巧合，是讲者的中心论点。</b><span class='k'>提炼成可迁移的原则：<b>别在流水线中间插入一个比最终任务更难的子问题</b>。p44 的解法是「把视觉与控制紧耦合」——不建中间表示。</span>"}],
45: [{"q": "视觉版的两阶段训练里，第一阶段喂的 scandots（地形高度）是怎么处理的？", "o": ["用随机值替代", "加了与真实传感器匹配的噪声", "完全不加噪声，喂的是完美的地形高度 —— 因为第一阶段的任务不是学会对付噪声，而是在理想信息下学会走路；对付噪声是第二阶段学生的事，而学生面对的是真实深度图不是人造噪声", "只在部分地形上提供"], "a": 2, "why": "<span class='k'>这也呼应 p42–p44：人造的地图噪声和真实的感知噪声不是一回事，照着前者训出来的鲁棒性未必管用。</span><b>而分两阶段在这里还有一个非常具体的工程理由：把昂贵的<b>渲染</b>从强化学习的循环里挪出去——直接训第二阶段会慢一个数量级。</b>"}, {"q": "部署策略用了 RNN。讲者对这个选择说了什么？", "o": ["RNN 在这个任务上优于 transformer", "坦白说 RNN「不以保存很长程信息著称，这也是社区后来转向 transformer 的原因」，而且他们没有做 transformer 的消融来看会不会更好", "RNN 只用于处理深度图", "RNN 是因为算力限制才选的"], "a": 1, "why": "<b>「我们没做这个消融」——直接承认一个没验证的设计选择，这比含糊带过要好。</b><span class='w'>而整个结构与 RMA 一模一样，只是「特权信息」从物理参数换成了完美地形高度——说明那个两阶段套路是一个可以反复用的<b>模板</b>。</span>"}],
53: [{"q": "机器人上楼梯时涌现出了「髋关节外展」（把腿向侧面张开）。这为什么可能？", "o": ["因为用了更大的动作空间", "因为训练地形里包含了侧向移动的示范", "因为奖励里鼓励侧向运动", "因为没有任何预设步态或足部运动 —— 「我们让它通过搜索用强化学习自己学」，于是它找出了一个人类不会用、但对这个身体合理的办法"], "a": 3, "why": "<span class='k'>「through search」这三个字呼应 p3 对 AlphaGo 的评价（发现人没见过的新行为），也呼应 p78 那句 sparse reward + lots of search。</span><b>第二个涌现行为是落脚规划：<b>只在需要时才迈步</b>，而不像预设步态那样按固定节拍动。p57 把两件事并列成 Map Free, Gait Free。</b>"}, {"q": "讲稿里关于「重试」的那个观察是什么？它为什么重要？", "o": ["后一次尝试比前一次更合理，而权重完全没变 —— 讲者称之为「在被喂进模型的上下文里学习」；重要在于它是上下文学习在真机上的证据", "重试会导致硬件损坏", "重试次数越多成功率越低", "重试需要重新估计 extrinsics"], "a": 0, "why": "<b>⇒ 这和 L16 p43 那条「没有上下文就会一直往前撞」正好是正反两面：<b>有上下文的重试会改进，无上下文的重试只是重复</b>。</b><span class='w'>另记一个现场演示的瑕疵：有一场里右脚脚垫掉了、机器人开始瘸着走，但它把整场演示走完了——这种意外反而是鲁棒性最好的证据。</span>"}],
59: [{"q": "对比表里最值得盯的是楼梯那一行（Blind 16.64 / Map Based 6.74 / Ours 31.24）。它说明了什么？", "o": ["楼梯是最难的地形", "地图法需要更好的传感器", "盲策略在楼梯上有特殊优化", "错误的信息比没有信息更糟：带噪的落脚点估计会主动把策略骗到错误的位置去踩，而完全没有估计时策略至少会老实地用本体感觉试探 —— 不是收益为零，是负收益"], "a": 3, "why": "<b>讲者直说：「在楼梯上，瞎走并学会盲目落脚，比用一张有噪声、给你不准确落脚点估计的地图要好。」</b><span class='k'>这正是 p42–p44 那个论证的实证兑现；加上 p37 的系统辨识，同一条教训在这一讲有了两处独立的实验证据。</span>"}, {"q": "幻灯自己写出的那条规律「Performance gap is larger on challenging terrains」，对读实验表有什么含义？", "o": ["应该为每种地形单独训练策略", "在简单任务上分不出高下，不等于方法之间没有差别 —— 反过来说，如果你的基准全是简单任务，你会得出「几种方法差不多」的错误结论", "应该只在困难地形上做评估", "困难地形的方差更大，结果不可信"], "a": 1, "why": "<b>这是 L16 p24 之后第二次撞上同一条读表经验。</b><span class='w'>⚠ 另注意一个公平性细节：Map Based 那一版的噪声是从<b>已有文献</b>的分布里采样的，不是作者自编——这让对比更可信，但也意味着结论依赖那个噪声模型的真实性。</span>"}],
61: [{"q": "手内转物任务里，网络判断「碰到东西了」用的是什么信号？", "o": ["关节电流的变化", "指尖的触觉传感器", "视觉估计的物体位姿", "指令的关节位置与实际到达的关节位置之差：没接触时两条线重合，一接触就分开（实际到不了指令位置）—— 一个不需要任何触觉硬件的「免费接触传感器」"], "a": 3, "why": "<b>⇒ 这和 L17.a p18 那个腿的洞察是<b>同一个机制</b>：预期与实测的落差编码了环境。腿那边是「我让你走你却滑了 ⇒ 地面很滑」，手这边是「我让你弯到这个角度你却弯不过去 ⇒ 那里有个东西」。</b><span class='k'>而估出接触还能推出更多：哪几根手指在什么位置碰到，就勾勒出了物体的形状与大小。</span>"}, {"q": "讲者对这个「接触检测」的解释加了什么限定？", "o": ["这是一个假说而不是已验证的机制 ——「因为我们并不确切知道模型在做什么，一个假设是它用本体感觉历史做接触检测」", "它只在低速下成立", "它需要额外的校准", "它只在刚性物体上成立"], "a": 0, "why": "<b>这和 p32 那条「学出来的 extrinsics 我们解释不了」是同一种诚实。</b><span class='w'>而真机演示里两个细节很说明难度：橘子皮「力气稍大一点就会完全变形」；还有一个适配器「在训练数据和仿真里都没见过——我们不会把物体模拟到这种精细程度」。</span>"}],
68: [{"q": "无人机那组里，讲者特意强调控制层级很低。为什么这一点重要？", "o": ["因为低层控制更省算力", "因为高层控制会引入延迟", "因为它直接控制每个螺旋桨的电机转速，「没有抽象到让这个问题变容易的层级」—— 如果在高层抽象上控制（指定期望姿态让底层控制器实现），适应不同机型就容易得多，因为底层替你吸收了差异", "因为电机转速更容易仿真"], "a": 2, "why": "<span class='k'>泛化跨度是整讲最大的一组：同一套权重飞两台无人机，上面那台<b>重 4 倍、臂长 3 倍</b>。而 extrinsics 的含义也换了——这里估的是「我现在是哪一台」，讲者用的词是 morphology（形态）：<b>不是环境变了，是身体变了</b>。</span>"}, {"q": "讲者提到无人机「刚起飞时会晃一下」。这个细节说明了什么？", "o": ["这是 extrinsics 在线估计的直接可见证据：它还在估自己在飞哪一台，估计需要几步观测才能收敛，收敛之前行为不稳", "控制器增益没调好", "电池电压不稳", "螺旋桨存在制造差异"], "a": 0, "why": "<b>⇒ 这正对应 p29 那个消融里「只估第一步」为什么不够——<b>第一步的估计本来就不准</b>。</b><span class='w'>到这里，腿、手、无人机三个应用已经把同一个机制演示了三遍。</span>"}],
71: [{"q": "运动控制三四年前就做到了敏捷可靠，而操作至今没有。讲者给了哪两条原因？", "o": ["硬件不够精密 + 传感器不够多", "缺少大规模机器人数据集", "① 仿真不够用（刚体接触对运动控制够用，操作要模拟可变形物体、面团、切菜）；② 奖励写不出来（「跟踪某个速度」就是完整的任务说明，而切菜要量每片的大小，还取决于你究竟要做什么菜）", "算力不够 + 数据不够"], "a": 2, "why": "<b>这正好回到开场 p3/p4 那两个要素——整场讲座设计得最好的一处呼应。</b><span class='k'>而奖励那一条最致命的是<b>不可复用</b>：「就算你花工夫写出那条奖励，那也只给你<b>一个</b>任务，拿不到操作的通用性……而且就算写对了一个，它也扩展不到别的任何事情上」。</span>"}, {"q": "讲者关于「工程节奏」说了一句很有分量的话。是什么？", "o": ["让第一件事跑通和让第十件事跑通花的时间差不多，因为管线很简单 —— 一旦打通一条路，后面就能很容易地大量产出", "工程进度取决于硬件迭代", "每个新任务都要从头开始", "第一个结果最重要，后面都是重复"], "a": 0, "why": "<b>⇒ 说的是<b>边际成本</b>：难的是打通第一条路，之后每条新路都便宜。</b><span class='w'>而两条答案的性质很不一样：<b>仿真是「算力不够」的问题（会随时间改善），奖励是「人工不可扩展」的问题（不会自己变好）</b>——这也是下一页为什么对两者给出不同对策。</span>"}],
76: [{"q": "「用一个大模型当通用奖励模型」，讲者说 Could work，但那个但书是什么？", "o": ["大模型无法处理机器人数据", "大模型的判断不够一致", "RL will exploit weaknesses if they exist —— 而且他给了两个现成的证据：RLHF 继续调下去模型会完全跑偏；DeepSeek 那篇也说，不用可验证/规则型奖励的话，RL 迟早开始钻奖励的空子", "大模型推理太慢"], "a": 2, "why": "<b>⇒ 指向很明确：凡是奖励来自一个「<b>学出来的模型</b>」而不是一条「<b>可验证的规则</b>」，RL 迟早会去钻它的空子。</b><span class='k'>这反过来给开场 p3 那条 well specified rewards 加了一层含义：rule-based 不只是「可自动化」，更是「<b>没有空子可钻</b>」。</span>"}, {"q": "讲者为什么对「通用奖励模型」这个难题仍然乐观？", "o": ["因为可以用多个模型投票", "因为最坏情况是让人来标全部奖励，而「人是很能扩展的，我们有几十亿个」", "因为可以用仿真生成奖励", "因为大模型会继续变强"], "a": 1, "why": "<b>这把「人工标注」从「不可扩展的瓶颈」重新定位成了「一个很贵但确实能扩展的后备方案」——对比 p75 那条「每个任务都要手写一个奖励，而且不可复用」：<b>手写奖励不可扩展，但人类打分可以</b>。</b><span class='w'>而仿真那一边的对策是押算力（the bitter lesson）。两者结构对称：一个赌算力会涨，一个赌人力可堆。</span>"}],
78: [{"q": "「超越人类」在这一页不是口号，它背后的机制是什么？", "o": ["更精确的仿真", "更长的训练时间", "更大的模型与更多的数据", "不同的身体 + 不受人类先验约束的搜索：电驱动的执行器与硅基的计算与人不同，而只要不把人的先验（比如预设步态）强加进去，搜索就可能找出人想不到的解法"], "a": 3, "why": "<b>证据就在 p55：因为<b>没有规定步态</b>，那只矮机器人才找出了「把腿向侧面张开上台阶」这个人类不会用的办法。</b><span class='k'>方法论依据是一句：Learnings from AlphaGo — <b>Sparse reward + lots of search</b>。两个要素缺一不可：稀疏奖励（别用密集塑形奖励把人的偏好框进去）+ 大量搜索（才可能撞上反直觉的解）。</span>"}, {"q": "这一页的主张与本讲前面的内容之间有一处张力，讲者没有挑明。是什么？", "o": ["他主张端到端，却用了两阶段训练", "他主张零样本部署，却做了真机微调", "他主张仿真不可靠，却全程用仿真训练", "他在终章主张「稀疏奖励 + 大量搜索」，而他自己的 RMA 用了十个手工塑形奖励，还承认「不太优雅」、权重「没有好办法」调 —— 那恰恰不是稀疏奖励"], "a": 3, "why": "<b>⇒ 所以「稀疏奖励 + 大量搜索」是一个<b>方向性主张</b>，不是他已在用的做法，读的时候要把两者分开。</b><span class='w'>而这种张力本身值得记：一个领域<b>当下能跑通的做法</b>，和它<b>认为自己应该走的方向</b>，常常不是一回事。</span>"}]
};

var N = [
{"r": [1, 4], "t": "两个成功要素：奖励说得清，评估跑得起", "star": 3, "quote": "<b>What is reinforcement learning?</b><br><em><b>Imitation Learning</b> — Used in: VLMs, video generation, image segmentation, etc. Characteristics: <b>Relies heavily on off-policy data</b> · <b>Learns from good examples</b> · <b>Gives generalists</b></em><br><em><b>Reinforcement learning</b> — Used in: Game playing, reasoning, <b>robotics</b>. Characteristics: <b>On policy data</b> · <b>Uses good as well as bad data</b> · <b>Gives Specialists</b></em><br><b>What has reinforcement learning achieved?</b><br><em>- <b>AlphaGo</b>: Learned to <b>exceed what humans can do</b><br>- <b>Reasoning in LLMs</b>: <b>Coherent over long horizon</b><br>- <b>Dexterity in robotics</b>: <b>Reliability</b></em><br><em><b>What enabled these successes? &nbsp;- Well specified rewards &nbsp;- Scalable evaluation of policies</b></em><br><b>Zooming in on robotics</b> — <em>Well specified rewards → <b>Programmatically calculate them</b> &nbsp;·&nbsp; Scalable evaluation → <b>Simulation</b> &nbsp;·&nbsp; <b>Simulation to real?</b></em>", "one": "<b>三个相隔七八年的成功——AlphaGo、LLM 推理、机器人灵巧性——共用同样两个前提：奖励能说清楚，策略能大规模评估。而机器人拿到这两样的办法只有一个：仿真。</b>", "pts": ["<b>p2 那张对照表值得整张背下来，但<b>先记住讲者给它的限定</b>，否则会读成教条。</b> <span class='k'>原话：「I'm going to compare <b>imitation learning that actually works</b> with <b>reinforcement learning that actually works</b>. That doesn't mean that there don't exist RL algorithms which don't follow these characteristics. But these are the characteristics of <b>the ones that have been the most successful</b>」</span>。<b>⇒ 这是对<b>成功案例</b>的归纳，不是对两类算法的定义。</b>", "<b>三条特征里，第二条最有意思：<b>模仿学习只用好数据，强化学习好坏通吃</b>。</b> <span class='w'>讲稿：「In imitation learning, you take your data set, you <b>clean it up</b>, you get the good data set and then you use that to train your model. But in RL, <b>every data point that is generated during the policy rollout is fair game</b>」</span>。<b>⇒ 而这正是 RL 强的地方：「you learn from <b>not just the positive but also the negative data</b> which gives you very precise behaviors」。</b>", "<b>第三条「泛才 vs 专才」也要加个限定。</b> <span class='k'>讲稿：RL「either gives you <b>specialists</b> or it <b>helps you specialize pre-trained general models</b>」</span>——<b>后半句很重要：RL 不只是造专才，它也可以把一个通才<b>专化</b>。</b>", "⚠️ <b>而讲者明确说<b>不是在比高低</b>，这一点别读漏：「That is not to say that one is strictly better than the other」。</b> <span class='w'>证据就在那三个成功案例里：<b>AlphaGo 用模仿学习热启动自对弈，LLM 也是先用模仿学习预热再做推理训练</b></span>。<b>⇒ 实践中两者是<b>接力</b>而不是竞争。</b>", "<b>p3 问的是一个很好的问题：<b>RL 到底做成了什么别的办法做不成的事</b>？三条答案各指一种能力。</b> <span class='k'><b>AlphaGo</b> → <b>超过人</b>（发现人没见过的新行为）；<b>LLM 推理</b> → <b>长程连贯</b>（远超模仿学习预训练能达到的）；<b>机器人灵巧性</b> → <b>可靠性</b></span>。", "⚠️ <b>然后是全讲的论点：<b>这三件事共用两个前提——<b>奖励说得清</b>，<b>评估跑得起</b></b>。</b>", "<b><b>第一个要素</b>：奖励不必密集，但必须<b>清楚</b>。</b> <span class='w'>AlphaGo 的奖励极稀疏（整盘棋只有赢/输），但<b>看一眼棋盘就能判定</b>；DeepSeek-R1 用的是 <b>rule-based reward function</b>，而讲者强调的是后果：「since it is rule-based <b>you can automate it</b> and you can get it very cleanly and clearly <b>at scale</b>」</span>。<b>⇒ 重点不在稀疏不稀疏，在<b>能不能自动算</b>。</b>", "<b><b>第二个要素</b>：能不能大规模地把策略跑起来并评估。</b> <span class='k'>AlphaGo 把围棋放进仿真，于是「it <b>scales beautifully with compute</b>. We can just throw compute at it… and we can <b>convert that compute to data</b>」；LLM 则是「roll them out in a cluster and evaluate them using some form of an automatic reward function」</span>。", "<b>⇒ 讲者还点出一个观察，说明这两条不是事后总结：<b>这三件事相隔七八年发生，而两个要素始终没变</b>。</b>", "<b>p4 把它落到机器人上，而答案只有一个词：<b>仿真</b>。</b> <span class='w'>「Well specified rewards → <b>programmatically calculate them</b>」（因为仿真里你有世界的全部状态）；「Scalable evaluation → <b>Simulation</b>」</span>。<b>⇒ 讲稿那句概括最准：<b>「we have converted a <b>physical problem to a digital problem</b> which now just will scale with compute」</b>。</b>", "<b>⇒ 但这只解决了「在仿真里做机器人」，而不是「在真实世界里做机器人」。于是 p4 结尾那个问号 <b><em>Simulation to real?</em></b> 就是整场讲座剩下的全部内容。</b>"], "eq": "⚠ 先记住讲者给 p2 那张表的限定（否则会读成教条）：\n   「I'm going to compare **imitation learning that actually works** with\n     **reinforcement learning that actually works**… these are the characteristics\n     of **the ones that have been the most successful**」\n   ⇒ 对**成功案例**的归纳，不是对两类算法的定义\n\n**p2 对照表**：\n                模仿学习                      强化学习\n   用在哪      VLM · 视频生成 · 图像分割      博弈 · 推理 · **机器人**\n   数据        **大量 off-policy**            **on-policy**\n   用什么数据  **只用好的**（清洗过）          **好坏通吃**\n   产出        **泛才**                       **专才**（或把通才专化）\n\n   第二条最有意思：\n     「In imitation learning, you **clean it up**, you get the good data set…\n       But in RL, **every data point generated during the policy rollout\n       is fair game**」\n     ⇒ 「you learn from **not just the positive but also the negative data**\n        which gives you very precise behaviors」\n\n   ⚠ 讲者明确**不是在比高低**：「That is not to say that one is strictly\n     better than the other」\n     证据：**AlphaGo 用模仿学习热启动自对弈；LLM 先用模仿学习预热再做推理训练**\n     ⇒ 实践中两者是**接力**而不是竞争\n\n**p3 RL 到底做成了什么别的办法做不成的事**（三条各指一种能力）：\n   **AlphaGo**     → **超过人**（发现人没见过的新行为）\n   **LLM 推理**    → **长程连贯**\n   **机器人灵巧性** → **可靠性**\n\n⚠⚠ 全讲的论点：**这三件事共用两个前提**\n   **① Well specified rewards（奖励说得清）**\n     不必密集，但必须**清楚**：\n       AlphaGo 奖励极稀疏（只有赢/输），但**看一眼棋盘就能判定**\n       DeepSeek-R1 用 **rule-based reward function**\n       「since it is rule-based **you can automate it**…\n         very cleanly and clearly **at scale**」\n     ⇒ 重点不在稀疏不稀疏，在**能不能自动算**\n\n   **② Scalable evaluation of policies（评估跑得起）**\n     AlphaGo：把围棋放进仿真 ⇒「it **scales beautifully with compute**…\n       we can **convert that compute to data**」\n     LLM：在集群上 roll out，用自动奖励函数评估\n\n   ⇒ 这三件事**相隔七八年**发生，而两个要素**始终没变**\n\n**p4 落到机器人上**，答案只有一个词：**仿真**\n   Well specified rewards → **Programmatically calculate them**（仿真里有全部状态）\n   Scalable evaluation    → **Simulation**\n   讲稿的概括最准：\n     「we have converted a **physical problem to a digital problem**\n       which now just will scale with compute」\n\n⇒ 但这只解决了「在仿真里做机器人」\n   于是 p4 结尾那个问号 **Simulation to real?** 就是整场讲座剩下的全部内容", "tbl": {"head": ["", "模仿学习（成功的那些）", "强化学习（成功的那些）"], "rows": [["数据来源", "<b>大量 off-policy</b>", "<b>on-policy</b>"], ["用哪些数据", "<b>只用好的（清洗过）</b>", "<b>好坏通吃</b>"], ["产出", "<b>泛才</b>", "<b>专才 / 把通才专化</b>"], ["典型战场", "VLM · 视频生成 · 图像分割", "博弈 · 推理 · 机器人"], ["⚠ 两者关系", "<b>接力（先模仿热启动）</b>", "<b>不是竞争</b>"]]}, "say": "原话（那张表的限定——描述的是成功案例的共性，不是定义）：<em>“one thing to note here is that <b>I'm going to compare imitation learning that actually works with reinforcement learning that actually works. That doesn't mean that there don't exist reinforcement learning algorithms which don't follow this characteristics. But these are the characteristics of the ones that have been the most successful at actually solving extremely hard problems.</b>”</em><br><br>原话（好坏通吃才是 RL 强的地方）：<em>“In imitation learning, you take your data set, <b>you clean it up, you get the good data set</b> and then you use that to train your model. But in reinforcement learning, <b>every data point that is generated during the policy rollout is fair game</b>. So you can use all of that to improve and update your policy and that actually is one of the things that makes reinforcement learning quite powerful. So <b>you learn from not just the positive but also the negative data</b> which kind of gives you very precise behaviors that you want.”</em><br><br>原话（两个要素，以及「相隔七八年而要素没变」）：<em>“I would like to point out two things which let on-policy reinforcement learning shine in all three of these domains. The first is <b>well specified rewards</b>… for AlphaGo the reward was a very sparse one. It was <b>very clear if you won the game</b>… Similarly for reasoning in LLMs… they say that we use a <b>rule-based reward function</b> which is very clear to evaluate and <b>now since it is rule-based you can automate it and you can get it very cleanly and clearly at scale</b>. And the second critical component is <b>can we run these policies at scale</b>… <b>all of these results happened 7 to 8 years spaced out by 7 to 8 years and all of these successes still have these very two key ingredients</b>.”</em>", "res": {"tag": "推断", "v": "<b>这一页给了你一个<b>非常好用的定位句式</b>，而且你的问题在两个要素上<b>都</b>及格——这件事值得在引言里直接说出来。</b><br><span class='k'>讲者的论点是：RL 的三次大成功共用两个前提——<b>奖励说得清</b>（能自动算）与<b>评估跑得起</b>（能规模化）</span>。<b>⇒ 逐条对照你的问题：</b><br><b>① <b>奖励说得清</b>：<code>G = Acc − λ·Cost</code> 是<b>完全程序化</b>的</b>——<span class='w'>Acc 由标准答案判定（benchmark 自带），Cost 由 token 数与单价算出，<b>两边都不需要人打分</b></span>。<b>⇒ 这正是讲者说的「rule-based ⇒ 可自动化 ⇒ 可规模化」那一条。</b><br><b>② <b>评估跑得起</b>：你的「仿真」就是<b>离线重放</b></b>——<span class='k'>配置可以在固定的 query 集上随便跑，不需要真实用户、不需要线上流量，<b>物理问题已经是数字问题</b></span>。<b>⇒ 讲者那句「converted a physical problem to a digital problem which now just will scale with compute」对你<b>字面</b>成立，而且你连转换都不用做。</b><br><b>⇒ 所以可以这样开头：<b>强化学习三次大的成功都建立在「奖励可程序化计算」与「策略可规模化评估」之上；而配置选择这个问题天然同时满足这两条——这正是它值得用有保证的方法去做、而不是靠手工调的原因。</b></b><span class='w'>这比「我们用 bandit 算法」有分量得多。</span><br><b>⚠ 但有一处你必须<b>主动</b>承认，否则这个类比会被拆穿：<b>你的「仿真」不是免费的</b>。</b> <span class='k'>AlphaGo 的仿真每步几乎零成本，所以「throw compute at it」成立；<b>而你每评估一次配置都要付真金白银的 API 费用</b></span>。<b>⇒ 这恰恰是你方法存在的理由：<b>因为评估不便宜，所以才需要实验设计去省它</b>。</b><br><b>⇒ 一个很漂亮的说法是：<b>我们的设定满足「奖励可程序化」，但只<b>部分</b>满足「评估可规模化」——评估是可自动化的，却不是廉价的。我们的方法正是补上这个缺口：用实验设计把「可自动化」变成「可负担」。</b></b><br><b>最后 p2 那条「好坏通吃」对你也有一条直接含义，而且它呼应 L15 p43 的事后重标注：<b>失败的 run 也是数据</b>。</b> <span class='w'>模仿学习要清洗数据只留好的，而你这边<b>一个配置跑砸了同样是关于那个配置的证据</b>——不该丢，也不该只记一个端到端的 0。</span>", "ref": "本讲 p2–p4（逐字核对）· 讲稿（两个要素、数字化那句）· L15 p43 · 简报 §1 §2 §4b（已核）"}},
{"r": [5, 13], "t": "先看结果：同一套权重，零样本，而且全程是盲的", "star": 2, "quote": "<b>One Policy to Walk them All</b><br><b>Rapid Motor Adaptation for Legged Robots</b> — <em>Ashish Kumar, Zipeng Fu, Deepak Pathak, Jitendra Malik（RSS 2021）</em><br>〔p5–p11 真实世界视频：碎石 · 看不见的楼梯 · 草地 · 向左倾斜的坡 · 建筑工地 · 泥地 · 沙地〕", "one": "<b>七段视频，七种地形，而讲者强调的是一个数字：一。同一套权重，零样本部署，没有任何针对地形的调参——而且机器人全程是盲的。</b>", "pts": ["<b>讲者把结果放在方法<b>之前</b>，理由他自己说了：<b>先让你相信这事真能成</b>。</b> <span class='k'>「before I get into how we solve these sim to real problem, <b>let me convince you first that this actually works</b>」</span>。<b>⇒ 这是一个值得学的讲法：先给证据，再讲机制。</b>", "<b>七段视频覆盖的地形差别很大，而每一段都有一个具体的难点。</b> <span class='w'><b>碎石</b>：脚卡住了，「it keeps trying and then figures out that there's something and then continues to walk」；<b>楼梯</b>：机器人看不见，所以「a bit fumbly… but it can still get them and <b>doesn't fall</b>」；<b>草地</b>：「<b>even if you had vision in this scenario, you would not see the ground underneath</b>」</span>。", "<b>⇒ 草地那一句值得单独留意，因为它提前回答了一个很自然的质疑：<b>有些情形下视觉根本帮不上忙</b>，必须靠本体感觉的鲁棒性。</b>", "<b>其余几段：<b>向左倾斜的坡</b>（左边是个大沟，而它没有一路漂过去）；<b>建筑工地</b>（讲者家门口，「we were able to <b>repeat</b> this」）；<b>泥地</b>（脚会陷，但「it knows how to correct for it by <b>applying more force</b> and then just getting out of it」）；<b>沙地</b>。</b>", "⚠️ <b>而全页的要点是那个被强调两次的事实：<b>这些全部来自<b>同一套</b>权重</b>。</b> <span class='k'>原话：「all of these results are from the <b>exact exact same policy</b>. So the <b>exact same weights</b> deployed <b>zero shot</b> in the real world <b>without any tuning or specific improvement related to any of these terrains</b>」</span>。", "<b>⇒ 「零样本」这三个字在这里的含义要说准：<b>策略在仿真里训完就直接搬上真机，没有在任何真实地形上微调过</b>。</b> <span class='w'>不是「在一种地形上微调后泛化到别的」，而是<b>一次都没碰过真实世界</b>。</span>", "⚠️ <b>还有一个更容易被漏掉、但同样关键的限定：<b>这些结果全是盲的</b>。</b> <span class='k'>讲稿：「<b>All of these results are blind by the way. There's no vision.</b> All of these just use <b>proprioception history</b>」</span>。<b>⇒ 机器人<b>看不见</b>地形，它只知道自己的关节位置和刚才发过的指令。</b>", "<b>⇒ 这个限定让整件事的难度陡然上升，也让后面那个「关键洞察」（p18）更有分量：<b>如果看不见，那它凭什么知道脚下是油还是沙？</b></b> <span class='w'>答案就是本体感觉历史里的那个「落差」。</span>", "<b>p12 那个标题 <b><em>One Policy to Walk them All</em></b> 是个玩笑式的双关，但它把目标说得很准：<b>不是七个策略，是一个</b>。</b>", "<b>最后记一下出处与年份：<b>RMA（Rapid Motor Adaptation），RSS 2021</b></b>。 <span class='k'>⇒ 讲者后面会提到，这些结果是「3 到 4 年前」的，而这个时间差在 p75 会变成一个论点：<b>运动控制早就做到了，而操作还没有——为什么？</b></span>"], "eq": "讲者把结果放在方法**之前**，理由他自己说了：\n   「before I get into how we solve these sim to real problem,\n     **let me convince you first that this actually works**」\n   ⇒ 值得学的讲法：**先给证据，再讲机制**\n\n七段视频，每段一个具体难点：\n   **碎石**：脚卡住 →「it keeps trying and then figures out that there's\n           something and then continues to walk」\n   **楼梯**：机器人看不见 →「a bit fumbly… but it can still get them and **doesn't fall**」\n   **草地**：「**even if you had vision in this scenario, you would not see\n           the ground underneath**」\n           ⇒ 提前回答了一个质疑：**有些情形视觉根本帮不上忙**\n   **斜坡**：左边是大沟，而它没有一路漂过去\n   **建筑工地**：讲者家门口，「we were able to **repeat** this」\n   **泥地**：脚会陷，但「it knows how to correct for it by **applying more force**」\n   **沙地**\n\n⚠⚠ 全页的要点（被强调两次）：**这些全部来自同一套权重**\n   「all of these results are from the **exact exact same policy**.\n     So the **exact same weights** deployed **zero shot** in the real world\n     **without any tuning or specific improvement related to any of these terrains**」\n\n   「零样本」在这里的准确含义：\n     **仿真里训完直接搬上真机，没有在任何真实地形上微调过**\n     不是「在一种地形上微调后泛化」，而是**一次都没碰过真实世界**\n\n⚠⚠ 另一个容易漏、同样关键的限定：**这些结果全是盲的**\n   「**All of these results are blind by the way. There's no vision.**\n     All of these just use **proprioception history**」\n   ⇒ 机器人**看不见**地形，只知道自己的关节位置和刚才发过的指令\n   ⇒ 难度陡升，也让 p18 那个「关键洞察」更有分量：\n     **如果看不见，它凭什么知道脚下是油还是沙？**\n\np12 标题 **One Policy to Walk them All**（玩笑式双关，但目标说得准）：\n   **不是七个策略，是一个**\n\n出处：**RMA（Rapid Motor Adaptation），RSS 2021**\n   ⇒ 讲者后面说这些结果是「3 到 4 年前」的，\n     而这个时间差在 p75 会变成一个论点：\n     **运动控制早就做到了，而操作还没有 —— 为什么？**", "tbl": {"head": ["七段视频", "难点", "机器人怎么应对"], "rows": [["<b>碎石</b>", "脚卡住", "<b>反复试，察觉后继续走</b>"], ["<b>楼梯</b>", "<b>看不见</b>", "<b>踉跄但不摔</b>"], ["<b>草地</b>", "<span class='w'>⚠ 有视觉也看不到地面</span>", "<b>靠本体感觉的鲁棒性</b>"], ["<b>泥地</b>", "脚陷进去", "<b>加大力气拔出来</b>"], ["⚠ 共同点", "<b>同一套权重 · 零样本 · 全程盲的</b>", "—"]]}, "say": "原话（同一套权重、零样本、没有任何调参）：<em>“the important point here is that <b>all of these results are from the exact exact same policy. So the exact same weights deployed zero shot in the real world without any tuning or specific improvement related to any of these terrains.</b> And the question is how do we get it?”</em><br><br>原话（草地那一段：有视觉也没用）：<em>“We also tried this on this grass patch. <b>Even if you had vision in this scenario, you would not see the ground underneath.</b> So you need like a certain level of robustness just to get through some of these.”</em><br><br>原话（全是盲的，只用本体感觉历史）：<em>“<b>All of these results are blind by the way. There's no vision. All of these just use proprioception history.</b> And I evaluated it on a bunch of places including my mattress, on foam, taking a step down, step up and all of these. And it was relatively robust in all of these scenarios.”</em>", "res": {"tag": "推断", "v": "<b>这几页反复强调的那句「<b>same weights</b>」（七种地形、一套权重、零样本）对你的用处，是它站在一个<b>你迟早要做的选择</b>的对面。</b><br><span class='k'>那个选择是：<b>一套策略管所有工作流，还是每个工作流训一个专门的？</b></span><br><b>⇒ 「每个工作流一个」几乎总是更容易做出好数字 —— 它能过拟合那个工作流的节点结构。而这一讲的整个论点是：<b>那不值得</b>，因为真正有价值的东西是「同一套权重换个环境也能用」。</b><br><b>⇒ 但要注意讲者是<b>靠什么</b>做到这一点的，而这是关键：<b>不是让策略对所有环境都鲁棒，而是让它在线认出自己在哪个环境里</b>。</b><span class='w'>⚠ 这个区别就是 p37 那张表里 RMA 与 Robust 的差别 —— <b>后者「对一切都扛得住」，结果力矩大、jerk 高、成功率反而低</b>。</span><br><b>⇒ 映到你的问题：<b>一套路由策略 + 一个「当前是什么工作流/什么 query」的在线估计量</b>，而不是「一套对所有工作流都稳妥的保守路由」（那等于永远用大模型）、也不是「每个工作流一个专用模型」（那不可推广）。</b><br><b>⚠ 而这条路线有一个你必须回答的问题，讲者在 p37 已经替你问了：<b>你那个在线估计量，该不该被约束成可解释的真实物理量？</b></b> <span class='k'>他的答案是<b>不该</b>（见 p32/p37 的科研格）。<b>⇒ 所以你的「当前工作流的特征向量」允许是一个学出来的低维嵌入，不必是「节点数、平均 token 数、工具调用次数」这类手工特征。</b></span><br><b>⇒ 最后一个可以直接搬的<b>实验设计</b>：<b>按环境分列地报，而不是只给一个平均数</b>。</b> <span class='w'>讲者在七种地形上<b>分别</b>报成功率，而这让读者能看出方法在哪类地形上收益大。<b>⇒ 你的对应是按工作流、按任务类型分列 —— 很可能你的收益高度集中在几类任务上，而那个分布本身就是一个结果。</b></span>", "ref": "本讲 p5–p13（逐字核对）· 讲稿（same weights / 全程盲）· p37 · 简报 §1 §2 §4d（已核）"}},
{"r": [14, 16], "t": "在仿真里学走路：把特权信息<b>直接喂给</b>策略", "star": 3, "quote": "<b>Learn to Walk in Simulation</b><br><em><b>Mass · COM · Friction · Terrain Height · Motor Strength</b> → <b>Environmental Factor Encoder</b> → <b>z<sub>t</sub></b>（<b>Extrinsics</b>）<br>x(t), a(t−1) + z<sub>t</sub> → <b>Base Policy</b> → a<sub>t</sub> → Physics Simulation</em><br><em>Important: <b>Reward Function minimizes work and ground impact</b>（Biomechanics and Energetics）</em><br><b>Reward Function</b> — <em><b>Forward Walking</b> · <b>Energetics</b> · <b>Stability + Minimize hardware damage</b></em>", "one": "<b>做法反直觉：既然仿真里什么都能拿到，那就把质量、摩擦、地形高度这些真实世界里绝对拿不到的参数，直接喂给策略。于是策略不是对环境「鲁棒」，而是对环境「知情」。</b>", "pts": ["<b>起手式讲者说得很干脆：<b>仿真里一切都是你的</b>。</b> <span class='k'>「let's just <b>pretend that this simulation is the real world</b> and <b>everything we can access is fair game</b>」</span>。", "<b>第一步先训一个最朴素的东西：一个能在<b>某一组</b>物理参数下走路的策略。</b> <span class='w'>但讲者立刻否掉了它：「this would be a very <b>narrow</b> policy that can walk in one scenario… <b>But this is not good enough</b> because we actually don't want a single policy. <b>We want a generalist policy</b> that can work in all of these scenarios」</span>。", "<b>于是第二步：<b>把这些物理参数随机化</b>——质量、质心、摩擦、地形高度、电机强度。</b> <span class='k'>到这里为止还是标准的<b>域随机化</b>（domain randomization），没有新东西</span>。", "⚠️ <b><b>而真正不一样的是第三步，也是全页的要点</b>：<b>把这些参数<b>作为输入喂给策略</b></b>。</b> <span class='w'>原话：「and the important part is <b>we will let the policy have access to all of these parameters</b>」</span>。", "<b>⇒ 这个区别有多大？讲者用一句话点透：<b>「it's <b>not oblivious or blind</b> to the environment. It's actually <b>aware</b> of what it's dealing with」</b>。</b> <span class='k'>⇒ 普通的域随机化是训一个「对所有情形都还行」的<b>鲁棒</b>策略；而这里是训一个「<b>知道</b>自己在什么情形下、并据此调整」的策略</span>。<b>⇒ 前者只能取一个折中，后者可以针对每种情形给出最优动作。</b>", "<b>这个被压缩的参数向量 <code>z_t</code> 有个名字：<b>extrinsics</b>（外在参数）。</b> <span class='w'>讲稿后面提到维度：完整物理参数大约 17–18 维，压缩后的 extrinsics 大约 8 维——<b>约 2 倍压缩</b></span>。", "<b>⚠ 但这一步显然有个大问题，而讲者留到 p17 才说：<b>真实世界里你拿不到这些参数</b>。所以这一整套在部署时会直接失效。</b> <span class='k'>⇒ 这是一个标准的<b>「特权信息」</b>套路：先用只有仿真里才有的信息训出一个好策略（<b>教师</b>），再想办法让一个只用可观测量的<b>学生</b>去逼近它。</span>", "<b>奖励函数那一页看着朴素，但有两处值得记。</b> <span class='w'><b>三块</b>：<b>Forward Walking</b>（任务本身）· <b>Energetics</b>（能耗）· <b>Stability + Minimize hardware damage</b>（稳定 + 别弄坏硬件）</span>。", "<b>⚠ 第三块那个「别弄坏硬件」是一个<b>仿真里本来不存在</b>的概念，必须人为注入。</b> <span class='k'>讲稿：「in simulation there's <b>no concept of hardware damage</b>. So we need to <b>inject all of those biases</b> so that it can learn something which can actually transfer to the real world」</span>。<b>⇒ 这是 sim2real 的一个典型动作：<b>把真实世界的约束写进仿真的奖励里</b>。</b>", "<b>⚠ 而讲者对奖励工程的坦白值得照录：<b>实际有 10 个奖励函数</b>，「This is <b>not very elegant</b>, but we tried to be as principled as we can」。</b> <span class='w'>讲稿后面还答了「这么多奖励怎么配权重」：<b>「there's <b>no good way</b> to do it. That is the real answer」</b>；实用做法是<b>一次只加一个奖励</b>，看当前缺什么，加进去后只调它相对其他的系数——「instead of this <b>exponential complexity</b>, you can reduce it somewhat to just adding one at a time」</span>。<b>⇒ 而他也承认「the coefficients we get are probably <b>not the most optimal</b>」。</b>", "<b>训练规模：<b>约 10 亿个样本</b>，用 PPO。</b>"], "eq": "起手式：**仿真里一切都是你的**\n   「let's just **pretend that this simulation is the real world**\n     and **everything we can access is fair game**」\n\n第一步：训一个能在**某一组**物理参数下走路的策略\n   立刻被否掉：「this would be a very **narrow** policy… **not good enough**\n     because we **want a generalist policy**」\n\n第二步：**把物理参数随机化**（质量 · 质心 · 摩擦 · 地形高度 · 电机强度）\n   ⇒ 到这里还是标准的**域随机化**，没有新东西\n\n⚠⚠ **第三步才是要点：把这些参数作为输入喂给策略**\n   「and the important part is **we will let the policy have access\n     to all of these parameters**」\n\n   区别有多大（一句话点透）：\n     「it's **not oblivious or blind** to the environment.\n       It's actually **aware** of what it's dealing with」\n   ⇒ 普通域随机化 = 训一个「对所有情形都还行」的**鲁棒**策略（只能取折中）\n     这里 = 训一个「**知道**自己在什么情形下并据此调整」的策略（可给每种情形最优动作）\n\n压缩后的参数向量叫 **extrinsics（外在参数）z_t**\n   维度：完整物理参数约 17–18 维，压缩后约 8 维（**约 2 倍压缩**）\n\n⚠ 但显然有个大问题（p17 才说）：**真实世界里拿不到这些参数**\n   ⇒ 标准的**「特权信息」**套路：\n     先用只有仿真才有的信息训出好策略（**教师**），\n     再让只用可观测量的**学生**去逼近它\n\n**奖励函数三块**：\n   **Forward Walking**（任务本身）\n   **Energetics**（能耗）\n   **Stability + Minimize hardware damage**（稳定 + 别弄坏硬件）\n\n   ⚠ 第三块是**仿真里本来不存在**的概念，必须人为注入：\n     「in simulation there's **no concept of hardware damage**.\n       So we need to **inject all of those biases** so that it can learn\n       something which can actually transfer to the real world」\n     ⇒ sim2real 的典型动作：**把真实世界的约束写进仿真的奖励里**\n\n   ⚠ 讲者对奖励工程的坦白（值得照录）：\n     实际有 **10 个**奖励函数\n     「This is **not very elegant**, but we tried to be as principled as we can」\n     「这么多奖励怎么配权重？」——「there's **no good way** to do it.\n       That is the real answer」\n     实用做法：**一次只加一个奖励**，看当前缺什么，加进去后只调它相对其他的系数\n       「instead of this **exponential complexity**, you can reduce it\n         to just adding one at a time」\n     而且承认「the coefficients we get are probably **not the most optimal**」\n\n训练规模：**约 10 亿个样本**，PPO", "tbl": {"head": ["", "普通域随机化", "RMA 的做法"], "rows": [["参数随机化了吗", "<b>随机化了</b>", "<b>随机化了</b>"], ["参数喂给策略吗", "<span class='w'>⚠ 没有</span>", "<b>喂了（z<sub>t</sub>）</b>"], ["策略学到什么", "<b>对一切都还行（折中）</b>", "<b>知道当前是什么情形并据此调整</b>"], ["讲者的说法", "<span class='w'>oblivious / blind</span>", "<b>aware of what it's dealing with</b>"], ["⚠ 部署时的问题", "<span class='w'>没有</span>", "<b>z<sub>t</sub> 拿不到（p17）</b>"]]}, "say": "原话（仿真里一切都是你的，以及「把参数喂给策略」这一步）：<em>“let's just <b>pretend that this simulation is the real world and everything we can access is fair game</b>… So this would be a very narrow policy that can walk in one scenario… <b>But this is not good enough</b> because we actually don't want a single policy. We want a generalist policy that can work in all of these scenarios. So we will randomize all of these parameters in simulation. And <b>the important part is we will let the policy have access to all of these parameters</b>. So now when we train this policy, it can walk not just for any specific value of mass or friction. It would have seen a huge range of it and it will know how to walk accordingly. So <b>it's not oblivious or blind to the environment. It's actually aware of what it's dealing with.</b>”</em><br><br>原话（硬件损坏在仿真里不存在，必须注入）：<em>“there are a bunch of reward functions which minimize energetics. And then the last one is like stability and minimizing hardware damage because <b>in simulation there's no concept of hardware damage. So we need to inject all of those biases so that it can learn something which can actually transfer to the real world.</b>”</em><br><br>原话（10 个奖励函数怎么配权重——「没有好办法」）：<em>“how do we balance between all of these different rewards? <b>There's no good way to do it. That is the real answer. I think it's a very hard problem.</b> The practical way to do it is to <b>add one reward at a time</b> and then try to see what is lacking in the current set of rewards, add a new reward and then <b>tune only that reward relative to every other reward</b>. So instead of this <b>exponential complexity</b>, you can kind of reduce it somewhat to just adding one at a time. But the coefficients we get are probably <b>not the most optimal</b> you can get.”</em>", "res": {"tag": "推断", "v": "<b>这几页有两样东西对你有用，而它们指向相反的方向 —— 一样是该学的，一样是该当成警告的。</b><br>⚠️ <b><b>该学的：把你知道的东西<b>喂给</b>决策，而不是训练一个对它鲁棒的决策。</b></b><br><span class='k'>p15 那句 <b>aware vs oblivious</b> 是整讲的技术枢纽：随机化环境参数是常规做法，而<b>把那些参数也作为输入交给策略</b>才是关键的一步。少了这一步，你得到的是 Robust 基线（p37：保守、费力、成功率反而低）</span>。<br><b>⇒ 映到你的问题，这条对应一个很具体的设计决定：<b>你的路由策略应该<b>看得到</b>它能看到的一切</b></b> —— prompt 长度、任务类型标签、节点在工作流中的位置、前序节点的输出长度与自洽程度、历史上这类 query 的降档成功率。<span class='w'>⚠ 一个只看「节点编号」的路由策略就是 oblivious 的那一版，而它一定会退化成「要么全用大的、要么全用小的」。</span><br><b><b>该当成警告的：那十个手工奖励，和讲者自己的三句话。</b></b><br><span class='k'>p16 的十个奖励里，只有 <em>Forward Walking</em> 是真正的任务，其余九个是塑形项。而讲者说得很直：<b>「it's <b>not very elegant</b>」「there is <b>no good way</b> to tune these coefficients」「the coefficients we get are probably <b>not the most optimal</b>」</b></span>。<br>⚠️ <b>⇒ 对你的意义：<b>你的 <code>G = Acc − λ·Cost</code> 只有<b>一个</b>需要调的系数，而这是一个被低估的优势</b>。</b> <span class='w'>讲者在一个十系数的加权和上束手无策；而你只有 <code>λ</code>，所以你<b>能</b>做一件他做不到的事：<b>扫一条完整的 λ 曲线，把帕累托前沿画出来</b>。</span><br><b>⇒ 建议把这件事做成论文里的一张主图：<b>横轴 Cost、纵轴 Acc，你的方法画成一条曲线，各个固定档位的基线画成散点</b>。</b> <span class='k'>这样你就不必论证「λ 该取多少」这个没有正确答案的问题 —— <b>你给出整条前沿，让读者自己选工作点</b>。而这同时也消掉了「你是不是调 λ 调出来的结果」这个质疑。</span><br><b>⚠ 最后一条纪律，来自讲者的坦率本身：<b>他把「系数没调好」这件事说出来了，而这没有削弱那篇论文</b>。</b> <span class='w'>⇒ 所以你那些「我们没有调到最优」「这个超参是拍的」也直接写出来。<b>审稿人在意的是你知不知道哪里不严谨，而不是你是否样样都最优。</b></span>", "ref": "本讲 p14–p16（逐字核对）· 讲稿（not very elegant / no good way / not the most optimal）· p37 · 简报 §1 §2 §4b（已核）"}},
{"r": [17, 18], "t": "部署的坎，和那个关键洞察：落差里藏着答案", "star": 3, "quote": "<b>How can we deploy it?</b><br><em>Mass · COM · Friction · Terrain Height · Motor Strength → Environmental Factor Encoder<br><b>Unknown Extrinsics · Unavailable</b>（During Deployment）</em><br><b>Key Insight — Extrinsics from Observation History</b><br><em>x(t−50), a(t−50) … x(t−1), a(t−1) → <b>Adaptation Module</b> → z<sub>t</sub> → Base Policy → a<sub>t</sub></em><br><em><b>Discrepancy b/w expected movement and actual measured movement</b><br><b>Continuously estimate these extrinsics online</b></em>", "one": "<b>真实世界里你不知道地面摩擦是多少。但你知道自己刚才下了什么指令、以及身体实际动成了什么样——两者的落差，就是环境在告诉你它是什么。</b>", "pts": ["<b>p17 把问题摆明：<code>z_t</code> 在真实世界里 <b><em>Unknown · Unavailable</em></b>。</b> <span class='k'>⇒ 上一页那个「知情的策略」在部署时拿不到它赖以知情的那个输入</span>。", "<b>讲者先否掉了最笨的办法——<b>人工标定</b>——而理由很具体。</b> <span class='w'>「even if I <b>estimated that in my living room</b>, it would still not be enough because <b>the moment I get to something which is not my living room</b>, let's say sand or mulch or any of those, it would fail to work and <b>I have to retune it again</b>」</span>。<b>⇒ 标定一次只对一种环境有效，而目标恰恰是「一套权重走遍所有地形」。</b>", "⚠️ <b>于是关键洞察登场，而它的漂亮之处在于<b>不需要新的传感器</b>：<b>从观测历史里把 <code>z_t</code> 估出来</b>。</b> <span class='k'>输入是最近 <b>50 步</b>的 <code>(x, a)</code>——状态与下过的指令</span>。", "<b>为什么这个信号里会含有环境信息？讲稿那个例子说得最清楚，值得背下来。</b> <span class='w'>「you give a command to walk and then <b>one of your legs slips more than what you expected it to</b>. <b>The discrepancy between your signal and what you actually commanded will tell you that you actually slipped.</b> <b>This was not intentional.</b>」</span>", "<b>⇒ 核心是一个<b>预期 vs 实测</b>的对比：<b>你下的指令隐含了一个预期的运动；实际发生的运动如果偏离了它，这个偏离量就编码了环境</b>。</b> <span class='k'>滑了多少 → 摩擦有多小；下沉了多少 → 地面有多软；需要多大力矩才动 → 负载有多重</span>。", "<b>⇒ 而这正好解释了 p5–p11 那个「全程是盲的」为什么可能：<b>机器人不需要<b>看见</b>油污，它只需要注意到自己滑了</b>。</b> <span class='w'>环境的物理性质不必直接观测，它会<b>印在你自己的运动误差上</b>。</span>", "<b>⚠ 注意两个限定词：<b><em>Continuously</em></b> 与 <b><em>online</em></b>。</b> <span class='k'>估计不是开局做一次就完事，而是<b>每一步都在更新</b>——讲稿强调是「in <b>fractions of a second</b> at runtime」</span>。<b>⇒ 这很要紧，因为环境会<b>中途变化</b>（有人往机器人身上扔了 5 公斤重物），而中途变化恰恰是 p29–p31 那组对照实验要测的。</b>", "<b>⇒ 讲者把这种做法归类为<b>上下文学习</b>（in-context learning），而不是微调。</b> <span class='w'>原话（在和基线对比时）：「The RMA style is closer to <b>in context learning</b> where you take the history of everything and then <b>the learning happens in the feed forward pass itself</b>」</span>。<b>⇒ 不改权重，只改输入——所以才能在零点几秒内完成。</b>", "<b>⚠ 最后记一个讲稿里很有价值的反常识提醒：<b>多数成功的 sim2real 策略其实<b>不</b>用历史</b>。</b> <span class='k'>「most successful sim-to-real policies are actually the ones which <b>don't have a history</b>. They usually just use the <b>current state</b>」</span>；<b>理由是：一旦用了历史，策略就从「以状态为索引」变成「以状态和时间为索引」，而这<b>更容易在仿真里学到可被利用的捷径</b>。</b>", "<b>⇒ 讲者给的具体例子很有画面感：<b>如果你周期性地推机器人一把，它会学会「在预期被推的那一刻变得特别稳」</b>——这在仿真里得分很高，到真机上就没用。</b> <span class='w'>解法是把那个周期也随机化掉。⇒ <b>用历史是有代价的，必须配更仔细的随机化</b>。</span>"], "eq": "p17 把问题摆明：z_t 在真实世界里 **Unknown · Unavailable**\n   ⇒ 上一页那个「知情的策略」，在部署时拿不到它赖以知情的那个输入\n\n先否掉最笨的办法 —— **人工标定**：\n   「even if I **estimated that in my living room**, it would still not be enough\n     because **the moment I get to something which is not my living room**,\n     let's say sand or mulch… **I have to retune it again**」\n   ⇒ 标定一次只对一种环境有效，而目标恰恰是「一套权重走遍所有地形」\n\n⚠⚠ **关键洞察（漂亮在不需要新传感器）**：**从观测历史里把 z_t 估出来**\n   输入 = 最近 **50 步**的 (x, a)：状态与下过的指令\n\n   为什么这个信号里含有环境信息（这个例子值得背）：\n     「you give a command to walk and then **one of your legs slips more than\n       what you expected it to**. **The discrepancy between your signal and\n       what you actually commanded will tell you that you actually slipped.\n       This was not intentional.**」\n\n   ⇒ 核心是**预期 vs 实测**：\n     **你下的指令隐含一个预期运动；实际运动偏离它的量就编码了环境**\n       滑了多少      → 摩擦有多小\n       下沉了多少    → 地面有多软\n       多大力矩才动  → 负载有多重\n\n   ⇒ 这正好解释了 p5–p11 那个「全程是盲的」为什么可能：\n     **机器人不需要看见油污，它只需要注意到自己滑了**\n     环境的物理性质不必直接观测，它会**印在你自己的运动误差上**\n\n⚠ 两个限定词：**Continuously** 与 **online**\n   不是开局估一次，而是**每一步都在更新**（「in **fractions of a second** at runtime」）\n   ⇒ 很要紧，因为环境会**中途变化**（有人扔 5 公斤重物上来）\n     而中途变化正是 p29–p31 那组对照实验要测的\n\n⇒ 讲者把这种做法归类为**上下文学习**（in-context learning）而非微调：\n   「The RMA style is closer to **in context learning** where you take the history\n     of everything and then **the learning happens in the feed forward pass itself**」\n   ⇒ **不改权重，只改输入** —— 所以才能在零点几秒内完成\n\n⚠ 一个很有价值的反常识提醒：**多数成功的 sim2real 策略其实不用历史**\n   「most successful sim-to-real policies are actually the ones which\n     **don't have a history**. They usually just use the **current state**」\n   理由：一旦用历史，策略就从「以状态为索引」变成「以状态和时间为索引」，\n         **更容易在仿真里学到可被利用的捷径**\n   具体例子：**周期性地推机器人一把 ⇒ 它会学会「在预期被推的那一刻特别稳」**\n             （仿真里得分很高，真机上没用）\n   解法：把那个周期也随机化掉\n   ⇒ **用历史是有代价的，必须配更仔细的随机化**", "tbl": {"head": ["拿到 extrinsics 的三条路", "怎么做", "问题"], "rows": [["<b>人工标定</b>", "<b>在当前环境测一次</b>", "<span class='w'>⚠ 换个地方就要重标</span>"], ["<b>显式系统辨识</b>", "<b>直接预测摩擦、质量……</b>", "<span class='w'>⚠ 难，而且没必要（p38）</span>"], ["<b>RMA：从历史估</b>", "<b>预期动作 vs 实测动作的落差</b>", "<b>⚠ 用历史更易学到捷径</b>"], ["RMA 属于哪一类", "<b>上下文学习（不改权重）</b>", "<b>零点几秒完成</b>"]]}, "say": "原话（为什么落差里藏着环境信息——这段值得背）：<em>“the reason this signal has the right thing that we care about is let's say that <b>you give a command to walk and then one of your legs slips more than what you expected it to</b>. <b>Your the discrepancy between your signal and what you actually commanded will tell you that you actually slipped. This was not intentional. You slipped forward.</b> So the idea is to use the history of this signal to estimate what these extrinsics are… which will let us estimate this online at runtime <b>in fractions of a second</b>.”</em><br><br>原话（人工标定为什么不行）：<em>“this vector is unknown in the real world. And <b>even if I estimated that in my living room, it would still not be enough because the moment I get to something which is not my living room, let's say sand or mulch or any of those, it would fail to work and I have to retune it again.</b>”</em><br><br>原话（多数成功的 sim2real 策略不用历史，以及周期性推搡那个捷径）：<em>“<b>most successful sim-to-real policies are actually the ones which don't have a history. They usually just use the current state to deploy.</b> And my guess for why that is the case is because the moment you have only the current state… <b>it becomes a state indexed policy as opposed to a state and time indexed policy</b>. So if you were to have a history, you need to make sure that the distribution you see in your history, you randomize it sufficiently enough that when you go into the real world, <b>there's no exploitation that happened during training</b>… <b>if you give a periodic push to the robot, it is very common for the robot to just learn to be very robust when it expects the push</b>. When it has a long enough context or it has a notion of time — but when you randomize that as well then you can get around it.”</em>", "res": {"tag": "推断", "v": "<b>这一页的机制可以<b>整个搬到</b>你那条「逐 query 自适应」上，而且它把一个你一直说得比较虚的东西落成了具体可实现的方案。</b><br><span class='k'>RMA 的逻辑链是：<b>① 有一个决定最优行为的隐变量（环境参数）；② 它在部署时观测不到；③ 但它会在「预期 vs 实测」的落差上留下印记；④ 于是从执行历史里把它估出来，喂给策略</b></span>。<br><b>⇒ 你的问题有<b>完全一样</b>的结构。隐变量是<b>这条 query 有多难</b>——它决定了最优档位配置，而你在<b>开跑之前看不到它</b>（只看 query 文本很难判断）。</b><br><b>⇒ 而它同样会在执行过程中留下印记，而且你的「落差信号」比机器人那边还丰富：</b><br><span class='w'>· <b>重试次数</b>（反思节点打回了几次）· <b>中间输出的长度与波动</b>（模型是不是在绕圈）· <b>自评分数的轨迹</b>（是在收敛还是在震荡）· <b>各节点的实际耗时与 token 消耗</b>（与该节点的典型值相比偏离多少）</span><br><b>⇒ 这些全都是「我预期这一步该这样，实际却那样」的度量，而且<b>全部免费</b>——它们是执行的副产品，不需要额外调用。</b><br><b>⇒ 于是一个很具体、也很可做的方法出来了：<b>用前几个节点的执行轨迹，在线估计这条 query 的难度，再据此决定<b>后续</b>节点的档位</b>。</b><span class='k'>前半程用保守档位探路，看落差信号，难就给后半程升档，不难就继续省。</span><br><b>⇒ 这比「按 query 文本静态分类难度」强得多，因为<b>执行信号比文本信号准</b>——正如机器人不去<b>看</b>地面是不是油，而是去<b>感觉</b>自己滑了。</b><br><b>⚠ 但三条限定必须一起带上，否则这个方案会翻车：</b><br><b>① <b>只能影响还没执行的节点</b></b>（<span class='w'>前几个节点的成本已经花掉了，所以这个机制省的是<b>后半程</b>的钱</span>）；<b>② <b>讲者那条「多数成功的 sim2real 不用历史」的警告对你同样成立</b></b>——<span class='k'>用执行历史做决策，会让策略变得「以时间为索引」，更容易学到<b>benchmark 特有的捷径</b>（比如「这个数据集里第 3 步重试过的题通常是难题」）。<b>要用不同来源的 query 混合训练来打掉这种捷径。</b></span><b>③ <b>这会让你的 <code>G</code> 不再是配置的函数，而是「策略」的函数</b></b>——<span class='w'>同一条 query 在不同执行路径下可能走到不同配置</span>。<b>⇒ 那你的线性模型 <code>G(x) = xᵀθ</code> 就要重新定义 <code>x</code>（变成实际执行的那个配置，而不是事先指定的那个），而且<b>倾向性要记录下来</b>（L14 p2）。这是一个实质性的建模改动，不能顺手加。</b>", "ref": "本讲 p18（逐字核对）· 讲稿（落差那个例子、周期性推搡的捷径）· L14 p2 · 简报 §2 §4b §4e（已核）"}},
{"r": [19, 20], "t": "两阶段训练，和一个没人设计过的频率不匹配", "star": 3, "quote": "<b>Training Summary</b><br><em><b>Phase 1</b>: Mass/COM/Friction/Terrain Height/Motor Strength → <b>Environmental Factor Encoder</b> → z<sub>t</sub> → <b>Base Policy</b> → a<sub>t</sub>（Physics Simulation）<br><b>Phase 2</b>: x(t−50),a(t−50) … → <b>Adaptation Module</b> → z<sub>t</sub> → Base Policy → a<sub>t</sub> &nbsp;（<b>Regress</b>；*Trainable Modules in Red）</em><br><b>Test Time</b><br><em>Adaptation Module <b>10 Hz</b> &nbsp;·&nbsp; Base Policy <b>100 Hz</b></em>", "one": "<b>第一阶段用特权信息训出一个好策略，第二阶段冻住它、只训一个「从历史猜出特权信息」的模块。而上线之后那两个模块跑在不同频率上——这不是设计，是板子上的算力只够这样，但性能居然没掉。</b>", "pts": ["<b>两阶段的分工很清楚，而且第二阶段<b>只训一个模块</b>。</b> <span class='k'><b>Phase 1</b>：用特权信息（真实的物理参数）端到端训出 Environmental Factor Encoder + Base Policy；<b>Phase 2</b>：<b>冻住 Base Policy</b>，只训 Adaptation Module，让它从 50 步历史里<b>回归</b>出同一个 <code>z_t</code></span>。<b>⇒ 幻灯用红色标出「可训练模块」，两阶段的红色部分是不同的。</b>", "<b>这是一个标准的<b>教师—学生</b>结构，而讲稿明确说用的是 <b>DAgger</b>。</b> <span class='w'>原话：「we will use <b>dagger</b> in which you <b>roll out the student policy</b> to generate the data distribution and then you use the <b>teacher</b> to supervise <b>every single point</b>」</span>。", "<b>⚠ 注意 DAgger 在这里的那个关键细节（也正是 L02 讲的那个撇号）：<b>数据分布由学生产生，标签由教师给</b>。</b> <span class='k'>讲稿把流程说得很细：先随机初始化 Adaptation Module → 跑它收数据（一开始全是烂数据）→ 用教师编码器逐步监督「本该预测什么」→ 监督学习更新 → 拿回仿真再跑 → 重复</span>。<b>⇒ 如果反过来（在教师走过的状态上标注），学生一旦偏离就没数据可参考——这正是 L02 复合误差的老问题。</b>", "<b>⇒ 所以这里的「特权信息 → 蒸馏」套路可以总结成三步：<b>① 用作弊的信息训一个强教师；② 让学生在自己的分布上跑；③ 用教师逐点监督学生</b>。</b> <span class='w'>而这套路在 p51 的视觉版本里会<b>原样再用一遍</b>（那里特权信息换成了完美地形高度）。</span>", "<b>讲稿里有人问「能不能跳过第一阶段、直接端到端训第二阶段」，答案是<b>能，但更贵也更危险</b>。</b> <span class='k'>「you can with <b>more compute</b>. But you need to be careful with sim2real because <b>the more information you give it in sim</b>… it might learn to <b>exploit</b> things of either your environment or physics in simulation or <b>your reward structure</b>」</span>。<b>⇒ 两阶段不只是省算力，它还<b>限制了学生能看到的东西</b>，从而减少了可被利用的捷径。</b>", "⚠️ <b>p20 那个频率是全页最有意思的一处，而它完全是个<b>意外</b>。</b> <span class='w'>Base Policy 跑 <b>100 Hz</b>，Adaptation Module 只跑 <b>10 Hz</b></span>；<b>而讲稿说得很直白：「this is <b>not by choice</b>, it's because of <b>whatever compute is available on board</b>」。</b>", "<b>⇒ 更要紧的是：<b>训练时两者是 100 Hz 同步的，这个不匹配完全没被考虑过</b>。</b> <span class='k'>「this was <b>not accounted for during training</b>. In training we train everything at <b>100 Hz in lock step</b>」</span>；<b>而结果是 <b>「we see that the performance doesn't drop」</b>。</b>", "<b>⇒ 这件事本身是一个有信息量的观察：<b>环境参数变化得比动作慢得多</b>。</b> <span class='w'>摩擦、负载、地形这些东西在 0.1 秒内基本不变，所以 10 Hz 的更新频率绰绰有余</span>；<b>⇒ 而这又一次印证了 L15 p9 那条「不同层次可以跑在不同频率上」——只是这里是被硬件逼出来的，不是设计出来的。</b>", "<b>⚠ 但别把这当成普遍规律：<b>它成立的前提是被估计的量变化缓慢</b>。</b> <span class='k'>如果环境参数本身高频变化（比如踩在不断晃动的板子上，p27 那个例子），10 Hz 可能就不够了</span>。<b>⇒ 讲者自己也说这是「good enough to get the results that we want」，而不是「在任何情况下都够」。</b>"], "eq": "**两阶段分工**（第二阶段**只训一个模块**）：\n   **Phase 1**：用**特权信息**（真实物理参数）端到端训\n                Environmental Factor Encoder + Base Policy\n   **Phase 2**：**冻住 Base Policy**，只训 Adaptation Module\n                让它从 50 步历史里**回归**出同一个 z_t\n   幻灯用红色标「可训练模块」，两阶段的红色部分不同\n\n标准的**教师—学生**结构，用的是 **DAgger**：\n   「we will use **dagger** in which you **roll out the student policy** to generate\n     the data distribution and then you use the **teacher** to supervise\n     **every single point**」\n\n   ⚠ 关键细节（正是 L02 讲的那个撇号）：\n     **数据分布由学生产生，标签由教师给**\n   流程：随机初始化 Adaptation Module → 跑它收数据（一开始全是烂数据）\n         → 用教师编码器逐步监督「本该预测什么」→ 监督学习更新\n         → 拿回仿真再跑 → 重复\n   ⇒ 反过来（在教师走过的状态上标注）则学生一偏离就没数据可参考\n     —— 正是 L02 复合误差的老问题\n\n⇒ **「特权信息 → 蒸馏」三步套路**：\n   ① 用作弊的信息训一个强教师\n   ② 让学生在**自己的分布**上跑\n   ③ 用教师**逐点**监督学生\n   （p51 的视觉版本会原样再用一遍，特权信息换成完美地形高度）\n\n「能不能跳过第一阶段、直接端到端训第二阶段？」——**能，但更贵也更危险**：\n   「you can with **more compute**. But you need to be careful with sim2real\n     because **the more information you give it in sim**… it might learn to\n     **exploit** things of either your environment or physics in simulation\n     or **your reward structure**」\n   ⇒ 两阶段不只是省算力，它还**限制了学生能看到的东西**，减少可被利用的捷径\n\n⚠⚠ **p20 的频率完全是个意外**：\n   Base Policy **100 Hz** · Adaptation Module **10 Hz**\n   「this is **not by choice**, it's because of **whatever compute is\n     available on board**」\n\n   更要紧的是：**训练时两者是 100 Hz 同步的，这个不匹配完全没被考虑过**\n     「this was **not accounted for during training**.\n       In training we train everything at **100 Hz in lock step**」\n   而结果是 **「we see that the performance doesn't drop」**\n\n   ⇒ 有信息量的观察：**环境参数变化得比动作慢得多**\n     摩擦、负载、地形在 0.1 秒内基本不变 ⇒ 10 Hz 绰绰有余\n   ⇒ 又一次印证 L15 p9「不同层次可跑在不同频率上」\n     —— 只是这里是被硬件逼出来的，不是设计出来的\n\n   ⚠ 别当普遍规律：**前提是被估计的量变化缓慢**\n     若环境参数本身高频变化（踩在不断晃动的板子上，p27），10 Hz 可能不够\n     讲者自己说的是「good enough to get the results that we want」", "tbl": {"head": ["", "Phase 1（教师）", "Phase 2（学生）"], "rows": [["输入", "<b>真实物理参数（特权）</b>", "<b>50 步观测历史</b>"], ["训什么", "<b>Encoder + Base Policy</b>", "<b>只训 Adaptation Module</b>"], ["Base Policy", "<b>训</b>", "<span class='w'>冻住并复制</span>"], ["用什么算法", "<b>PPO（强化学习）</b>", "<b>DAgger（监督）</b>"], ["数据分布谁产生", "—", "<b>⚠ 学生自己（标签由教师给）</b>"], ["测试时频率", "<b>100 Hz</b>", "<b>10 Hz（硬件所迫，性能没掉）</b>"]]}, "say": "原话（DAgger 在这里怎么用——学生产生分布、教师逐点监督）：<em>“we will use dagger in which you <b>roll out the student policy to generate the data distribution</b> and then you use the <b>teacher to supervise every single point</b> of the student policy… we initialize the adaptation module which is random weights. We run the phase 2 policy, collect the data. <b>Initially it's just going to be bad data</b> because it hasn't learned to do anything meaningful. And then we'll use the teacher encoder to supervise at every time step <b>what should the prediction have been</b>. And then we will just use supervised learning to update the adaptation module. We will take it back in simulation. We will roll it again… and then repeat.”</em><br><br>原话（能不能直接端到端训——能，但信息给多了它会学会钻空子）：<em>“can we just directly train phase 2? And the answer is yes, you can <b>with more compute</b>. But you need to be careful with sim2real because <b>the more information you give it in sim</b>, which is possible if you have a very very long and dense history, <b>it might learn to exploit things of either your environment or physics in simulation or your reward structure</b>.”</em><br><br>原话（10 Hz vs 100 Hz 完全是意外，而性能没掉）：<em>“the base policy runs at 100 Hz and the adaptation module, which is the one that estimates this extrinsics, that only runs at 10 hertz and <b>this is not by choice it's because of whatever compute is available on board</b>, and we see that <b>the performance doesn't drop</b>. So <b>this was not accounted for during training</b>. In training we train everything at <b>100 Hz in lock step</b>.”</em>", "res": {"tag": "推断", "v": "<b>「特权信息 → 蒸馏」这个三步套路，是这一讲里<b>第二件</b>你可以直接拿去用的东西，而且它解决的是一个你绕不开的难题：<b>你想预测的那个量，只有事后才知道</b>。</b><br><span class='k'>RMA 的处境是：<b>最优动作取决于摩擦系数，而摩擦系数部署时测不到</b>。它的解法不是「想办法测摩擦」，而是「<b>先假装能测，训一个强教师；再训一个学生从可观测的东西里把它猜出来</b>」</span>。<br><b>⇒ 你的同构处境是：<b>这条 query 最优的档位配置，只有把所有配置都跑一遍才知道</b>。</b><span class='w'>而你当然不可能在线上对每条 query 都穷举。</span><br><b>⇒ 于是三步套路照搬：</b><br><b>① <b>造教师</b>：在一个<b>小</b>的离线集合上<b>穷举</b>配置，得到每条 query 的真实最优配置</b>（<span class='k'>这正是你简报 §4d 里那条「最强的一招不是 OPE，是穷举 oracle」——穷举在小规模上是做得到的</span>）。<b>这个教师用了「特权信息」：它看过所有配置的结果。</b><br><b>② <b>训学生</b>：学生只能看<b>可观测特征</b>（query 文本、前几个节点的执行信号），输出「该用哪个配置」。</b><br><b>③ <b>⚠ 用 DAgger 而不是普通监督</b>：让学生<b>在自己选出的配置下</b>跑，再用教师标注「本该选什么」。</b><span class='w'>这一步是整个套路里最容易被省掉、也最不能省的——因为学生一旦偏离，普通监督就没有数据覆盖那些状态了（L02 的复合误差）。</span><br><b>⇒ 这给了你一条通往「逐 query 自适应」的<b>可实现</b>路径，而且它回避了那个最难的部分：<b>你不需要在线估计难度，你只需要离线学会「从可观测特征映射到配置」</b>。</b><br><b>⚠ 两条必须带上的限定：</b><br><b>· <b>教师的穷举集必须足够多样</b></b>——<span class='k'>如果穷举用的那批 query 难度分布很窄，学生学到的映射就只在那个窄带里对（这正是 L16 p23 那条「起点要铺开」）</span>。<br><b>· <b>讲者那条「信息给多了会学会钻空子」的警告，在你这里是真实风险</b></b>。<span class='w'>如果学生能看到的特征里混进了<b>与难度相关但与因果无关</b>的东西（比如 query 的长度、某个 benchmark 特有的格式标记），它会学会用那个捷径。</span><b>⇒ 对策和讲者一样：<b>把那个维度随机化掉</b>——用多个来源的 query 混合训练，让捷径失效。</b><br><b>最后那个「频率不匹配却没掉性能」的意外，对你也有一条便宜的推论：<b>难度估计不必每个节点都做一次</b>。</b> <span class='k'>query 的难度在一次执行内基本不变（就像摩擦在 0.1 秒内不变）</span>。<b>⇒ 所以估一次、或者在前两个节点后估一次就够了，<b>不需要每步都重估</b>——这直接省掉了大部分开销。</b>", "ref": "本讲 p19–p20（逐字核对）· 讲稿（DAgger 流程、信息给多了会钻空子）· L02（复合误差）· L16 p23 · 简报 §4d（已核）"}, "link": {"t": "你学过的对应：本课 L02 精读（DAgger）—— 这里把它用在了「学生从历史回归出特权信息」上，而那个「数据分布由学生产生、标签由教师给」的撇号，正是 L02 讲的那一个", "href": "L02-精读.html"}},
{"r": [21, 28], "t": "室内评测：橄榄油、抛过来的 5 公斤、和会跑的木板", "star": 2, "quote": "<b>Indoors Evaluation</b><br><em><b>Oily surface and plastic wrapped feet</b> &nbsp;·&nbsp; <b>5kg payload throw</b> &nbsp;·&nbsp; <b>Planks - uneven footholds and moving surfaces</b> &nbsp;·&nbsp; <b>RMA - Indoors</b></em>", "one": "<b>三组测试各打一个不同的物理量：油面打摩擦，抛重物打质量，活动板打地面本身的可预测性。而三组都是在讲者自家客厅做的。</b>", "pts": ["<b>这几页是「可控的室内评测」，和 p5–p11 那些野外视频互补：<b>野外证明泛化，室内证明机制</b>。</b> <span class='k'>室内可以<b>精确地</b>改变某一个物理量，从而验证适应模块到底在适应什么</span>。", "<b><b>第一组 · 油面</b>：塑料布上倒橄榄油，而且机器人<b>脚上也包了塑料</b>。</b> <span class='w'>讲稿解释了包塑料的两个目的：「<b>partially to make it challenging, but also to protect the feet of the robot</b>」</span>。<b>⇒ 这一组打的是<b>摩擦</b>。结果是「it slips a bit here, but it <b>continues to march forward without an issue</b>」，慢放能看到打滑的瞬间它<b>保持了平衡没有翻</b>。</b>", "<b><b>第二组 · 抛 5 公斤</b>：而这个数字要配着机器人的自重看才有感觉。</b> <span class='k'>讲稿：机器人自重 <b>12 kg</b>，所以「<b>5 kg is roughly half the weight of the robot</b>」</span>。<b>⇒ 相当于一个 70 公斤的人背上突然多了 35 公斤。</b>", "<b>⚠ 而这一组最值得看的是慢放里的<b>恢复过程</b>：<b>先被压下去，再爬回来</b>。</b> <span class='w'>讲稿：「you see that <b>the bot actually goes down</b>. If you focus on the green dots, in a few steps <b>it tries to go back up and recover the regular motion style</b> that it is working with」</span>。<b>⇒ 这不是「扛住了」，而是<b>先塌陷、再调整、最后回到原来的步态</b>——适应是一个有过程的动作，不是瞬时的。</b>", "<b><b>第三组 · 活动木板</b>：打的是一个更根本的东西——<b>地面本身不可信</b>。</b> <span class='k'>讲稿：「this plank <b>just moves with the foot</b>. So there's <b>no clear estimate of the ground</b> that you can get」</span>。<b>⇒ 前两组至少地面是固定的（只是滑或者重），这一组连「地在哪」都在变。</b>", "<b>⇒ 三组合起来覆盖了三类扰动：<b>摩擦（接触的性质）· 质量（自身的性质）· 地形（环境的几何）</b>，正好对上 p14 随机化的那几个参数。</b>", "<b>讲稿还提到评测范围比幻灯上展示的更广：<b>「a bunch of places including my <b>mattress</b>, on <b>foam</b>, taking a <b>step down</b>, <b>step up</b>」</b>，而且「relatively robust in all of these scenarios」。</b>", "⚠️ <b>但读这几页要带一个清醒的判断：<b>这一整节是<b>定性的</b>，没有一个数字</b>。</b> <span class='w'>「它继续往前走了」「它保持了平衡」「相对鲁棒」——都是看视频得出的描述，<b>没有成功率、没有重复次数、没有误差棒</b></span>。<b>⇒ 真正的定量结果要等到 p29（消融）和 p37（基线对比），而那两处才是仿真里跑的、有数的。</b>", "<b>⇒ 为什么会这样？因为<b>真机实验的样本量天然很小</b>。</b> <span class='k'>每一次「倒油、放机器人、录视频」都要人在场、要清场、要修机器人（这也是为什么要给脚包塑料「to protect the feet」）。<b>想在真机上得到一个带误差棒的成功率，成本是仿真的几百倍</b></span>。<b>⇒ 所以这个领域普遍的做法是：<b>定量结果在仿真里做，真机实验只用来证明「这事在现实里真的发生了」</b>。</b>", "<b>⇒ 这个分工本身是合理的，但它有一个代价要知道：<b>你无法从这些视频里判断方法的<b>可靠性</b></b>——你只知道「成功过」，不知道「十次成几次」。</b> <span class='w'>⇒ 而讲者在 p74 讲 Tesla 的操作结果时，恰恰就自己点出了这一点（「these results are <b>not very reliable</b>」）。<b>同一位讲者，在自己更有信心的那一半用视频，在没信心的那一半主动说不可靠——这个对比值得记。</b></span>", "<b>⚠ 最后别忘了一个贯穿的限定（p5 已经说过，这里仍然成立）：<b>全程是盲的</b>。</b> <span class='w'>机器人看不见油、看不见砸下来的重物、看不见板子在动</span>。<b>⇒ 它只能从自己的动作误差里<b>推断</b>出这些——这正是下两页（p29–p36）要验证的事。</b>", "<b>⇒ 顺带留意「盲」在这里的<b>准确</b>含义，别读成「没有传感器」：<b>它有关节编码器、有 IMU，只是<b>没有外部感知</b></b>（相机、激光雷达、足底接触）。</b> <span class='k'>讲稿的措辞是「all of these just use <b>proprioception history</b>」—— <b>本体</b>感觉，也就是「关于自己身体的感觉」，而不是「关于世界的感觉」。</span><b>⇒ 这个区分到 p39 会变成整个后半讲的出发点。</b>"], "eq": "这几页是**可控的室内评测**，与 p5–p11 的野外视频互补：\n   **野外证明泛化，室内证明机制**\n   室内可以**精确地**改变某一个物理量，验证适应模块到底在适应什么\n\n**第一组 · 油面**（打**摩擦**）：\n   塑料布上倒橄榄油，机器人**脚上也包了塑料**\n   「**partially to make it challenging, but also to protect the feet of the robot**」\n   结果：「it slips a bit here, but it **continues to march forward without an issue**」\n   慢放能看到打滑的瞬间它**保持平衡没有翻**\n\n**第二组 · 抛 5 公斤**（打**质量**）：\n   机器人自重 **12 kg** ⇒「**5 kg is roughly half the weight of the robot**」\n   相当于 70 公斤的人突然多背 35 公斤\n\n   ⚠ 最值得看的是慢放里的**恢复过程**：**先被压下去，再爬回来**\n     「you see that **the bot actually goes down**. If you focus on the green dots,\n       in a few steps **it tries to go back up and recover the regular motion style**」\n     ⇒ 不是「扛住了」，而是**先塌陷、再调整、最后回到原步态**\n       —— 适应是一个**有过程**的动作，不是瞬时的\n\n**第三组 · 活动木板**（打**地面本身的可预测性**）：\n   「this plank **just moves with the foot**.\n     So there's **no clear estimate of the ground** that you can get」\n   ⇒ 前两组地面至少是固定的（只是滑或重），这一组连「地在哪」都在变\n\n⇒ 三组覆盖三类扰动：\n   **摩擦（接触的性质）· 质量（自身的性质）· 地形（环境的几何）**\n   正好对上 p14 随机化的那几个参数\n\n讲稿提到范围更广：「a bunch of places including my **mattress**, on **foam**,\n   taking a **step down**, **step up**」，而且「relatively robust in all of these」\n\n⚠ 贯穿的限定（p5 已说，这里仍成立）：**全程是盲的**\n   看不见油、看不见砸下来的重物、看不见板子在动\n   ⇒ 只能从自己的**动作误差**里推断 —— 正是 p29–p36 要验证的事", "tbl": {"head": ["三组室内测试", "打的是哪个物理量", "难点"], "rows": [["<b>橄榄油 + 包塑料的脚</b>", "<b>摩擦</b>", "<b>打滑</b>"], ["<b>抛 5 kg（自重 12 kg）</b>", "<b>质量 / 负载</b>", "<b>⚠ 突然多半个自重</b>"], ["<b>会跑的木板</b>", "<b>地形几何</b>", "<span class='w'>⚠ 连「地在哪」都在变</span>"], ["共同限定", "<b>全程是盲的</b>", "<b>只能从动作误差推断</b>"]]}, "say": "原话（油面那组，以及为什么给脚包塑料）：<em>“This is my living room and I'll pour some oil in it. This is a plastic tarp. I think that is <b>olive oil</b>… And then the robot's feet also have plastic covered on top of it. <b>Partially to make it challenging, but also to protect the feet of the robot.</b> And it slips a bit here, but it <b>continues to march forward without an issue</b>.”</em><br><br>原话（5 公斤是自重的一半，以及先塌陷再恢复）：<em>“here I'm throwing a 5 kg payload on the robot and it seems to be doing fine. Just to be clear, <b>this robot is 12 kgs. 5 kg is roughly half the weight of the robot.</b> I can make this a bit slower and you see that <b>the bot actually goes down</b>. If you focus on the green dots, in a few steps <b>it tries to go back up and recover the regular motion style</b> that it is working with.”</em><br><br>原话（活动木板：地面本身不可信）：<em>“here it's like the foot hold is not even stable. So <b>this plank just moves with the foot. So there's no clear estimate of the ground that you can get.</b> And it's still walking.”</em><br><br>原话（范围比幻灯上更广，而措辞一律是定性的）：<em>“<b>All of these results are blind by the way. There's no vision. All of these just use proprioception history.</b> And I evaluated it on a bunch of places including my <b>mattress</b>, on <b>foam</b>, taking a <b>step down step up</b> and all of these. And it was <b>relatively robust in all of these scenarios</b>.”</em>", "res": {"tag": "推断", "v": "<b>这一节对你的用处不在那三个测试，而在那个<b>定量 / 定性的分工</b> —— 因为你也要做同样的分工，而且你那条线划在哪里会被审稿人追问。</b><br><span class='k'>机器人这边的分工是：<b>定量结果在仿真里做（可重复、可跑几千次），真机只用来证明「这事在现实里真的发生了」</b>。而真机那半<b>没有数</b>，只有视频和「relatively robust」这样的措辞</span>。<br><b>⇒ 你的对应分工是：<b>在固定测试集上跑，和在真实流量上跑</b>。</b><span class='w'>前者可重复、可换种子、可报误差棒；后者只能跑一遍，而且分布不受你控制。</span><br><b>⇒ 建议把两者<b>明确分开报</b>，并学机器人这边的措辞纪律：<b>定量的那半给数（成功率、<code>G</code>、误差棒、种子数），定性的那半只说「发生了什么」，不要偷偷当证据使</b>。</b><br><b>⚠ 而你有一个机器人这边<b>没有</b>的便宜，应该用足：<b>你的「真机」几乎不贵</b>。</b><span class='k'>倒一次油要清场、要修机器人（这就是为什么要给脚包塑料「to protect the feet」）；而你跑一条 query 就是几分钱。<b>⇒ 所以「真机样本量天然小」这个在机器人领域被接受的借口，在你这里<b>不成立</b></b> —— 审稿人会（也应该）要求你在真实设定上也给带误差棒的数字。</span><br><b>⇒ 具体说：<b>至少 3 个随机种子，报均值与标准差；并按任务类型分列，而不是只给一个总平均</b>。</b> <span class='w'>这是一件你<b>做得到</b>而机器人领域做不到的事，所以它不是额外负担，<b>而是你应该主动展示的严谨度</b>。</span><br>⚠️ <b>另一条更要紧的提醒来自「定性视频看不出可靠性」这个问题：<b>你的方法一定会有「省错了」的时候</b>（该用大模型的地方用了小的），而<b>平均 <code>G</code> 会把这些失败藏起来</b>。</b><span class='k'>⇒ 所以除了均值，<b>报分布的左尾</b>：有多少比例的 query 因为降档而从「对」变成了「错」？<b>这个数比平均 <code>G</code> 更能说明你的方法安不安全，而且审稿人一定会问</b>。</span><br><b>⇒ 顺带一个写作上的观察：同一位讲者在自己更有信心的那半（运动控制）用视频，在没信心的那半（p74 的操作结果）主动说「<b>not very reliable</b>」。<b>这个对比就是「诚实的分寸」长什么样。</b></b>", "ref": "本讲 p21–p28（逐字核对）· 讲稿（relatively robust 的措辞、保护机器人的脚）· p74 · 简报 §2 §4d（已核）"}},
{"r": [29, 31], "t": "把适应模块关掉：同样的重量，它就栽了", "star": 3, "quote": "<b>Comparison to RMA w/o Adaptation</b><br><em><b>RMA 8kg payload</b> &nbsp;vs&nbsp; <b>RMA w/o Adaptation</b></em>", "one": "<b>这是全讲唯一的消融：只关掉「持续更新」这一件事，别的都不变。结果是机器人被压得往前倾，而它不知道该多使点劲——因为它压根没察觉身上多了东西。</b>", "pts": ["<b>先看这个对照的<b>做法</b>，它设计得很干净。</b> <span class='k'>「w/o Adaptation」不是把适应模块删掉，而是<b>只估第一个时间步、然后冻住</b>——「we estimate the extrinsics at the <b>first time step</b> and then we <b>freeze</b> that update and then we <b>don't update</b> the extrinsics for the rest of the run」</span>。", "<b>⇒ 所以这是一个很精确的消融：<b>两边的网络、权重、输入通道完全一样，唯一的差别是「<code>z_t</code> 要不要持续更新」</b>。</b> <span class='w'>它隔离出来的正是 p18 那两个词：<em>Continuously</em> 与 <em>online</em>。</span>", "<b>负重也加到了 <b>8 kg</b>，而这个数字比上一组更夸张。</b> <span class='k'>讲稿：这台机器人<b>出厂标称载重约 3 kg</b>，所以 8 kg 是「<b>maxing this out</b>」，而且会让「motors heat much faster」</span>。<b>⇒ 即便如此，<b>带适应的那一版还能走</b>（「it can still manage to walk」）。</b>", "⚠️ <b>而关掉适应之后的失败方式很具体，值得记住，因为它说明了适应模块到底补了什么。</b> <span class='w'>讲稿：「the weight actually <b>tilts the bot forward</b> and <b>it doesn't know to correct for it</b> by applying <b>more force or torque in the front legs</b> or get back to a <b>higher clearance</b>, and just ends up <b>tilting forward</b> when it doesn't have enough torque to clear for the next step」</span>。", "<b>⇒ 拆开看，它缺的是两个具体的补偿动作：<b>① 前腿加力矩（对抗前倾）；② 抬高离地间隙（免得迈不过去）</b>。</b> <span class='k'>⇒ 这两个动作<b>策略本来是会做的</b>（带适应的那版就做了），它只是<b>不知道现在需要做</b>。</span>", "<b>⇒ 所以这个消融证明的不是「策略能力不足」，而是「<b>策略缺少关于当前情形的信息</b>」——而这正好回到 p15 那句话：<b>aware vs oblivious</b>。</b>", "<b>泡沫垫那一组也是同一个故事：<b>即使脚陷进去，带适应的能处理；而关掉之后「it doesn't know to again apply more force to get higher clearance… <b>because it hasn't detected that event or that change</b>」</b>。</b> <span class='w'>⇒ 注意最后那半句——问题是<b>没检测到事件</b>，不是不会应对。</span>", "<b>⚠ 一个容易忽略但很重要的点：<b>这个消融只有在环境<b>中途</b>变化时才区分得出来</b>。</b> <span class='k'>如果重物从一开始就在身上，那么「只估第一步」也能估对</span>。<b>⇒ 所以实验故意设计成<b>抛</b>过来——<b>让变化发生在运行中间</b>，这才测得到「持续更新」的价值。</b>", "<b>⇒ 这也解释了为什么 p18 要强调 <em>Continuously</em>：<b>真实世界里环境是会变的</b>（踩进水坑、背上东西、地面从硬变软），而一次性标定对付不了这个。</b>"], "eq": "对照的**做法**（设计得很干净）：\n   「w/o Adaptation」**不是**把适应模块删掉，而是\n   **只估第一个时间步、然后冻住**\n     「we estimate the extrinsics at the **first time step** and then we\n       **freeze** that update and **don't update** the extrinsics for the rest」\n\n   ⇒ 很精确的消融：**网络、权重、输入通道完全一样，\n     唯一差别是「z_t 要不要持续更新」**\n     隔离出来的正是 p18 那两个词：**Continuously** 与 **online**\n\n负重加到 **8 kg**（比上一组更夸张）：\n   这台机器人**出厂标称载重约 3 kg** ⇒ 8 kg 是「**maxing this out**」\n   而且「motors heat much faster」\n   即便如此，**带适应的那一版还能走**（「it can still manage to walk」）\n\n⚠ 关掉适应之后的失败方式（说明了适应模块到底补了什么）：\n   「the weight actually **tilts the bot forward** and **it doesn't know to\n     correct for it** by applying **more force or torque in the front legs**\n     or get back to a **higher clearance**, and just ends up **tilting forward**」\n\n   拆开看，缺的是两个具体补偿动作：\n     ① **前腿加力矩**（对抗前倾）\n     ② **抬高离地间隙**（免得迈不过去）\n   ⇒ 这两个动作**策略本来会做**（带适应的那版就做了），\n     它只是**不知道现在需要做**\n\n⇒ 所以这个消融证明的不是「策略能力不足」，而是\n   **「策略缺少关于当前情形的信息」** —— 回到 p15 那句 **aware vs oblivious**\n\n泡沫垫那组同一个故事：\n   关掉之后「it doesn't know to apply more force to get higher clearance…\n     **because it hasn't detected that event or that change**」\n   ⇒ 注意最后半句：问题是**没检测到事件**，不是不会应对\n\n⚠ 容易忽略但重要：**这个消融只有在环境中途变化时才区分得出来**\n   如果重物从一开始就在身上，「只估第一步」也能估对\n   ⇒ 所以实验故意设计成**抛**过来 —— **让变化发生在运行中间**\n     这才测得到「持续更新」的价值\n\n⇒ 也解释了 p18 为什么强调 Continuously：\n   **真实世界里环境是会变的**（踩进水坑、背上东西、地面从硬变软）\n   一次性标定对付不了这个", "tbl": {"head": ["", "RMA（带适应）", "RMA w/o Adaptation"], "rows": [["z<sub>t</sub> 怎么来", "<b>每步持续更新</b>", "<b>只估第一步，之后冻住</b>"], ["网络与权重", "<b>一样</b>", "<b>一样</b>"], ["8 kg 负重下", "<b>还能走</b>", "<span class='w'>⚠ 前倾、迈不过去</span>"], ["缺了什么", "—", "<b>前腿加力矩 + 抬高离地间隙</b>"], ["根本原因", "—", "<b>⚠ 没检测到事件，不是不会应对</b>"], ["什么时候才测得出差别", "—", "<b>环境在运行中途变化时</b>"]]}, "say": "原话（消融的做法：只估第一步然后冻住）：<em>“let's see what happens if we switch off this adaptation module. So what this means is <b>we estimate the extrinsics at
