{"r": [76, 77], "t": "仿真押算力，奖励模型押人——以及那句「RL 会钻你奖励的空子」", "star": 3, "quote": "<b>Simulation?</b><br><em>- We can, in fact model complex scenarios like <b>deformable objects</b>, etc. However, <b>they are slow</b>.<br>- <b>Learn from the bitter lesson and bet on compute</b><br>&nbsp;&nbsp;“<b>The biggest lesson that can be read from 70 years of AI research is that general methods that leverage computation are ultimately the most effective, and by a large margin</b>” — Rich Sutton</em><br><b>General reward model?</b><br><em>- Most obvious answer are large models trained for general understanding<br>- <b>Could work, but RL will exploit weaknesses if they exist</b><br>&nbsp;&nbsp;<b>Worst case: humans label everything for us!</b></em>", "one": "<b>两个难题，两种乐观的理由。仿真押的是算力会继续涨；而通用奖励模型押的是——最坏情况下还有人可以标，而人有几十亿个。</b>", "pts": ["<b><b>仿真这一边</b>，讲者的诊断比「做不到」要精确：<b>可变形物体其实<b>能</b>模拟，只是<b>慢</b></b>。</b> <span class='k'>「We <b>can, in fact, model</b> complex scenarios like deformable objects… <b>However, they are slow</b>」；而更复杂的交互目前确实模拟不了</span>。", "<b>⇒ 而「慢」是一个<b>会随时间自己变好</b>的问题，所以他的对策是<b>押算力</b>。</b> <span class='w'>「there's <b>no obvious fundamental reason</b> why we cannot simulate more complex scenarios <b>as we get more compute</b>… if we bet on compute then the hope is <b>as compute progresses, simulation can progress</b>」</span>。", "<b>依据是 Rich Sutton 的 <b>the bitter lesson</b>（苦涩的教训），而讲者直接建议读原文：「it's a very short piece… I <b>highly recommend everyone to read it</b>」。</b> <span class='k'>引的那一句是：<b>「general methods that <b>leverage computation</b> are ultimately the most effective, <b>and by a large margin</b>」</b></span>。", "⚠️ <b><b>奖励模型这一边</b>才是对你最要紧的一页，而且它的论证很硬。</b> <span class='w'>最显然的想法是：<b>训一个大模型做通用理解，拿它来定义奖励</b></span>。<b>讲者说 <b><em>Could work</em></b>，但紧接着是一句很重的但书：<b><em>RL will exploit weaknesses if they exist</em></b>。</b>", "<b>⇒ 而他给了<b>两个现成的证据</b>，都不是假想的。</b> <span class='k'><b>① RLHF</b>：「when we do RLHF, <b>if we continue tuning with RLHF, we see that the model goes completely out of distribution</b> from what you would like it to do」；<b>② DeepSeek 那篇</b>：「they find that <b>if you don't use verifiable rewards or rule-based rewards</b> like they do, <b>at some point RL can start exploiting the rewards</b> that you have defined for them」</span>。", "<b>⇒ 注意这两个例子的指向：<b>凡是奖励来自一个「学出来的模型」而不是一条「可验证的规则」，RL 迟早会去钻它的空子</b>。</b> <span class='w'>⇒ 而这正好反过来印证了开场 p3 那条「<b>well specified rewards</b>」——那里强调的「rule-based 所以可自动化」，现在多了一层含义：<b>rule-based 所以<b>没有空子可钻</b></b>。</span>", "<b>⚠ 那么讲者为什么对这一条仍然乐观？理由很意外，而且带点幽默：<b>最坏情况是让人来标</b>。</b> <span class='k'>「the absolute worst case is we get <b>humans to label all the rewards</b> for us, and <b>humans are very scalable because we have billions of them</b>」</span>。", "<b>⇒ 这个说法值得想一想：它把「人工标注」从「不可扩展的瓶颈」重新定位成了「<b>一个很贵但确实能扩展的后备方案</b>」。</b> <span class='w'>⇒ 对比 p75 那条「每个任务都要手写一个奖励，而且不可复用」——<b>手写奖励不可扩展，但人类打分可以</b>。</span>", "<b>⇒ 所以两个难题的对策结构是对称的：<b>仿真押「算力会涨」，奖励押「人力可堆」</b>。</b> <span class='k'>两者都是在赌一个<b>能随规模扩展的东西</b>，而这正是 the bitter lesson 的精神。</span>"], "eq": "**仿真这一边**（诊断比「做不到」精确）：\n   **可变形物体其实能模拟，只是慢**\n   「We **can, in fact, model** complex scenarios like deformable objects…\n     **However, they are slow**」；更复杂的交互目前确实模拟不了\n\n   ⇒ 「慢」是一个**会随时间自己变好**的问题 ⇒ 对策是**押算力**\n     「there's **no obvious fundamental reason** why we cannot simulate more\n       complex scenarios **as we get more compute**… **as compute progresses,\n       simulation can progress**」\n\n   依据：Rich Sutton 的 **the bitter lesson**（讲者建议读原文，「very short piece」）\n     「general methods that **leverage computation** are ultimately\n       the most effective, **and by a large margin**」\n\n⚠⚠ **奖励模型这一边**（对课题最要紧，论证很硬）：\n   最显然的想法：**训一个大模型做通用理解，拿它定义奖励**\n   讲者：**Could work**，但紧接着是重重的但书：\n     **RL will exploit weaknesses if they exist**\n\n   **两个现成的证据**（不是假想的）：\n     **① RLHF**：「if we continue tuning with RLHF, we see that the model\n        **goes completely out of distribution** from what you would like it to do」\n     **② DeepSeek**：「if you **don't use verifiable rewards or rule-based rewards**…\n        **at some point RL can start exploiting the rewards** you have defined」\n\n   ⇒ 指向很明确：**凡是奖励来自一个「学出来的模型」而不是一条「可验证的规则」，\n     RL 迟早会去钻它的空子**\n   ⇒ 反过来印证开场 p3 那条 **well specified rewards**：\n     那里强调「rule-based 所以可自动化」，现在多一层：\n     **rule-based 所以没有空子可钻**\n\n⚠ 讲者为什么仍然乐观（理由意外且带点幽默）：**最坏情况是让人来标**\n   「the absolute worst case is we get **humans to label all the rewards** for us,\n     and **humans are very scalable because we have billions of them**」\n\n   ⇒ 这把「人工标注」从「不可扩展的瓶颈」重新定位成\n     **「一个很贵但确实能扩展的后备方案」**\n   ⇒ 对比 p75「每个任务都要手写一个奖励，而且不可复用」：\n     **手写奖励不可扩展，但人类打分可以**\n\n⇒ 两个难题的对策结构**对称**：\n   **仿真押「算力会涨」，奖励押「人力可堆」**\n   两者都在赌一个**能随规模扩展的东西** —— 正是 the bitter lesson 的精神", "tbl": {"head": ["两个难题", "诊断", "对策", "赌的是什么"], "rows": [["<b>仿真</b>", "<b>能模拟，但慢</b>", "<b>押算力</b>", "<b>算力会继续涨</b>"], ["<b>通用奖励模型</b>", "<span class='w'>⚠ RL 会钻它的空子</span>", "<b>最坏让人来标</b>", "<b>人有几十亿个</b>"], ["⚠ 证据一", "<b>RLHF 调久了模型完全跑偏</b>", "—", "—"], ["⚠ 证据二", "<b>不用可验证奖励，RL 迟早钻空子</b>", "—", "—"]]}, "say": "原话（仿真：能模拟但慢，所以押算力）：<em>“For some scenarios like deformable objects, <b>it is true that we can simulate it except that we cannot simulate it very fast</b>. And then there are some other more complex interactions that we cannot simulate at all. But there's <b>no obvious fundamental reason why we cannot simulate more complex scenarios as we get more compute</b>. So if we <b>bet on compute</b> then the hope is <b>as compute progresses simulation can progress</b>… And if we are to learn from the <b>bitter lesson</b>, then compute would be the right bet to take here.”</em><br><br>原话（RL 会钻奖励模型的空子——两个现成的证据）：<em>“can we train a very general large big model for general understanding of the world and somehow use that to define the rewards… <b>This could work but RL as we know has exploited weaknesses in the model if they exist.</b> So <b>when we do RLHF, if we continue tuning with RLHF, we see that the model goes completely out of distribution from what you would like it to do</b>. Same with the <b>deepseek</b> paper, they find that <b>if you don't use verifiable rewards or rule-based rewards like they do, at some point RL can start exploiting the rewards that you have defined for them</b>.”</em><br><br>原话（为什么仍然乐观：人很能扩展）：<em>“So I was optimistic about simulation. Why am I optimistic about this general reward model which also seems to be a very hard problem to solve? <b>The reason I'm optimistic is because the absolute worst case is we get humans to label all the rewards for us and humans are very scalable because we have billions of them.</b>”</em>", "res": {"tag": "推断", "v": "<b>p77 这一页直接限定了我在 L15 主线卡里给过你的一条建议，所以这里要把那条建议<b>改一下</b>。</b><br><span class='k'>我当时建议：用一个强模型当裁判，给每个节点打「这一步做对了没有」的标签，用来做信用分配。而这一页说的是：<b>凡是奖励来自一个「学出来的模型」而不是一条「可验证的规则」，RL 迟早会钻它的空子</b>——而且给了两个现成的证据（RLHF 调久了跑偏、DeepSeek 不用可验证奖励就会被钻）</span>。<br><b>⇒ 关键在于<b>你的优化压力有多大</b>。如果裁判的分数只是<b>事后报告</b>，钻空子无从谈起；但一旦它<b>进入决策回路</b>（用它来选配置、来决定升不升档），你就在对它做优化——而被优化的裁判一定会被钻。</b><br><b>⇒ 具体会怎么钻？不难想：<b>搜索会偏向那些「让裁判打高分」而不是「真的更好」的配置</b>。</b> <span class='w'>比如裁判偏好更长、更有条理的中间输出，于是搜索就系统性地选出「话多」的配置——而话多意味着 token 多，<b>恰好与你的 Cost 目标相反</b>，而你还会以为自己找到了好配置。</span><br><b>⇒ 所以修正后的建议是：<b>节点级裁判可以用于分析与解释，但不要让它进入 <code>G</code> 的定义或搜索的目标函数</b>。</b> <span class='k'>你的 <code>G</code> 必须锚在<b>可验证</b>的东西上——Acc 来自标准答案，Cost 来自 token 计数。这两样都是 rule-based，<b>没有空子可钻</b>，而这正是开场 p3 说的那个「well specified reward」的真正含义。</span><br><b>⇒ 这其实是你相对很多 agentic 工作的一个<b>优势</b>，值得在论文里点明：<b>我们的目标函数完全由可验证的量构成，因此不存在奖励模型被利用的风险——而这正是当前用 LLM-as-judge 的方法所面临的问题。</b></b><br><b>⚠ 而那条「<b>最坏情况是让人来标，而人有几十亿个</b>」的乐观，对你有一个<b>相反</b>方向的提醒。</b> <span class='w'>讲者能这么说，是因为他要的标注量虽大但单价低（看视频打个分）；<b>而你如果要靠人标 Acc，标的是「这个数学题答对了吗」「这段代码对吗」——单价高得多，而且需要专业判断</b></span>。<b>⇒ 所以「人工兜底」这条后路对你<b>没有</b>对他那么宽。<b>更该做的是守住「只做 Acc 可程序化判定的任务」这条边界</b>（p75 科研格那条）。</b><br><b>最后 the bitter lesson 那条对你有一条冷静的提醒：<b>你的方法本质上是在「省算力」，而苦涩的教训说的是长期押算力的人会赢</b>。</b> <span class='k'>⇒ 怎么调和？你的定位应该是「<b>在给定预算下把钱花对</b>」，而不是「<b>比用大模型更好</b>」——前者随算力变便宜仍然成立（总有预算约束），后者会被算力进步直接碾过去。<b>这个措辞上的区别，决定了你的工作五年后还站不站得住。</b></span>", "ref": "本讲 p76–p77（逐字核对）· 讲稿（RLHF 与 DeepSeek 两个证据、人很能扩展）· p3 · p75 科研格 · L15 主线卡 · 简报 §1 §2 §4b（已核）"}},
{"r": [78, 79], "t": "超越人类：与人持平只是第一步", "star": 2, "quote": "<b>Superhuman capabilities</b><br><em><b>Learnings from AlphaGo: Sparse reward + lots of search!</b></em><br><em><b>Can we get robots that exceed human capability?</b></em>", "one": "<b>讲者最后把目标往上抬了一层：现在整个领域都在追「和人一样」，而那一天到来时固然是文明级的事件——但它只是第一步。</b>", "pts": ["<b>讲者先承认了现状，包括他自己整场讲的东西：<b>机器人学习的目标被设定成「与人持平」</b>。</b> <span class='k'>「most of the definition that I've used during the course of the talk and most work in robot learning tries to approach robotics as <b>achieving parity with human</b>」</span>。", "<b>⇒ 而他对这个目标的评价并不低：<b>「the day we achieve that, it will be a <b>civilization changing event</b>」</b>。</b> <span class='w'>⇒ 所以这不是在贬低现有工作，而是在它之上再加一层。</span>", "⚠️ <b>但紧接着的转折是全页的要点：<b><em>However, that will just be the <b>first step</b></em></b>。</b>", "<b>理由基于一个很具体的观察：<b>机器人的身体和人的身体<b>不一样</b></b>。</b> <span class='k'>「the actuators that we make, driven by <b>electrical torque</b>, and the computers which are based on <b>silicon as opposed to carbon</b>… it is possible that they can <b>exploit all of that</b> to achieve capabilities which <b>humans have not thought of or cannot figure out how to do</b>」</span>。", "<b>⇒ 具体可能是：<b>更快、更高效、更好，或者比人<b>敏捷得多</b></b>。</b> <span class='w'>⇒ 这里的逻辑和 p53–p56 那个「髋关节外展」其实是同一个：<b>那只矮机器人找出的上楼办法，人不会用，因为人的身体不是那样的</b>。</b>", "<b>⇒ 所以「超越人类」在这里不是一句口号，而是有<b>机制</b>的：<b>不同的身体 + 不受人类先验约束的搜索 = 人想不到的解法</b>。</b> <span class='k'>⇒ 而「不受人类先验约束」正是 p55 那条 <b>No predefined gait</b> 的价值。</span>", "<b>而方法论的依据只有一句：<b>Learnings from AlphaGo: <b>Sparse reward + lots of search!</b></b></b> <span class='w'>⇒ 两个要素缺一不可：<b>稀疏奖励</b>（不要用密集的塑形奖励把人的偏好强加进去，那会把搜索框死在人类已知的解法附近）+ <b>大量搜索</b>（才可能撞上那些反直觉的解）</span>。", "<b>⇒ 讲者在 p3 就说过 AlphaGo「learned to <b>exceed what humans can do</b> by figuring out <b>innovative or new behaviors that humans have not seen before</b>」——<b>整场讲座在这里首尾呼应</b>。</b>", "<b>⚠ 但要留意这条建议和前面内容之间的一处<b>张力</b>，讲者没有挑明。</b> <span class='k'>他自己的 RMA 用的是<b>十个</b>手工奖励函数（p16），而且承认「不太优雅」、权重「没有好办法」调——<b>那恰恰是密集的塑形奖励，不是稀疏奖励</b></span>。<b>⇒ 所以「稀疏奖励 + 大量搜索」是一个<b>方向性的主张</b>，而不是他已经在用的做法。读的时候要把两者分开。</b>", "<b>⇒ 这种张力本身也值得记：<b>一个领域当下能跑通的做法，和它认为自己应该走的方向，常常不是一回事</b>。</b> <span class='k'>⇒ 而把这种张力明说出来（而不是假装一致），恰恰是这场讲座值得学的地方——p75 那个「为什么操作还没成」也是同样的坦率。</span>"], "eq": "讲者先承认现状（包括他自己整场讲的东西）：\n   **机器人学习的目标被设定成「与人持平」**\n   「most work in robot learning tries to approach robotics as\n     **achieving parity with human**」\n   而他对这个目标评价并不低：\n     「the day we achieve that, it will be a **civilization changing event**」\n\n⚠ 转折是全页要点：**However, that will just be the first step**\n\n理由基于一个具体观察：**机器人的身体和人的身体不一样**\n   「the actuators that we make, driven by **electrical torque**, and the\n     computers which are based on **silicon as opposed to carbon**…\n     they can **exploit all of that** to achieve capabilities which\n     **humans have not thought of or cannot figure out how to do**」\n   具体可能：更快、更高效、更好，或比人**敏捷得多**\n\n   ⇒ 这与 p53–p56 的「髋关节外展」是同一个逻辑：\n     **那只矮机器人找出的上楼办法，人不会用，因为人的身体不是那样的**\n\n⇒ 「超越人类」在这里不是口号，而是有**机制**的：\n   **不同的身体 + 不受人类先验约束的搜索 = 人想不到的解法**\n   而「不受人类先验约束」正是 p55 那条 **No predefined gait** 的价值\n\n方法论依据只有一句：**Learnings from AlphaGo: Sparse reward + lots of search!**\n   两个要素缺一不可：\n     **稀疏奖励** —— 不要用密集塑形奖励把人的偏好强加进去\n                    （那会把搜索框死在人类已知的解法附近）\n     **大量搜索** —— 才可能撞上那些反直觉的解\n\n   ⇒ p3 就说过 AlphaGo「learned to **exceed what humans can do** by figuring out\n     **innovative or new behaviors that humans have not seen before**」\n     —— **整场讲座在这里首尾呼应**\n\n⚠ 一处**张力**（讲者没挑明）：\n   他自己的 RMA 用的是**十个**手工奖励函数（p16），承认「不太优雅」、\n   权重「没有好办法」调 —— **那恰恰是密集的塑形奖励，不是稀疏奖励**\n   ⇒ 「稀疏奖励 + 大量搜索」是一个**方向性主张**，不是他已在用的做法\n     读的时候要把两者分开\n\n⇒ 这种张力本身值得记：\n   **一个领域当下能跑通的做法，和它认为自己应该走的方向，常常不是一回事**\n   而把张力明说出来（而不是假装一致），正是这场讲座值得学的地方\n   （p75「为什么操作还没成」也是同样的坦率）", "tbl": {"head": ["", "与人持平（当前目标）", "超越人类（下一步）"], "rows": [["讲者的评价", "<b>文明级的事件</b>", "<b>但只是第一步</b>"], ["凭什么可能", "—", "<b>电驱动执行器 · 硅基计算（身体不同）</b>"], ["方法", "<b>模仿 + 手工奖励</b>", "<b>稀疏奖励 + 大量搜索</b>"], ["已有先例", "—", "<b>AlphaGo</b>"], ["⚠ 与本讲的张力", "<b>RMA 用了 10 个手工奖励</b>", "<b>那不是稀疏奖励</b>"]]}, "say": "原话（与人持平只是第一步，而身体不同是超越的基础）：<em>“most of the definition that I've used during the course of the talk and most work in robot learning tries to approach robotics as <b>achieving parity with human. The day we achieve that, it will be a civilization changing event. However, that will just be the first step</b> in everything that we can achieve from robotics because <b>the actuators that we make, driven by electrical torque, and the computers which are based on silicon as opposed to carbon</b> than what we have, <b>it is possible that they can exploit all of that to achieve capabilities which humans have not thought of or cannot figure out how to do</b>. So they could do things <b>much faster, more efficiently or better, or can be much more agile</b> than what humans are. And then one system that we know which has already done it is AlphaGo where <b>the key was to use a sparse reward and then lots and lots of search</b> to get it to discover new behaviors which are beyond what humans could think.”</em>", "res": {"tag": "推断", "v": "<b>这一页对你的用处不在「超越人类」那个愿景，而在它背后那条机制，以及讲者<b>没有挑明的那处张力</b>。</b><br><span class='k'>机制是：<b>不同的身体 + 不受人类先验约束的搜索 = 人想不到的解法</b>。而证据是 p55 那个髋关节外展——因为<b>没有规定步态</b>，所以搜索找出了一个人类不会用的办法</span>。<br><b>⇒ 对你，这条机制指向一个很具体的问题：<b>你的搜索空间里，有多少是「人类先验」塞进去的？</b></b><br><span class='w'>你的配置空间是「每个节点选一个档位」——而<b>节点是谁定的？工作流结构是谁定的？档位有哪几档是谁定的？</b>都是人（或 AFlow 在人定的算子集合上搜的）</span>。<b>⇒ 这就是你的「预设步态」。</b><br><b>⇒ 讲义不会让你立刻去掉它（那是另一篇论文），但它给了你一个<b>该怎么说</b>的框架：<b>明确区分「我们搜索的那一层」与「我们固定的那一层」，并指出固定的那一层可能挡住了更好的解</b>。</b> <span class='k'>这比含糊地说「未来工作包括搜索工作流结构」要有力，因为它给出了<b>为什么</b>那是一个真问题。</span><br><b>⚠ 而那处张力对你的论文写作有一条直接的教训，可能是这一页最值得带走的东西。</b><br><span class='w'>讲者在终章主张「稀疏奖励 + 大量搜索」，而他自己的方法用了<b>十个手工塑形奖励</b>，还承认权重「没有好办法」调。他没有把这个矛盾挑明</span>。<b>⇒ 而你读出来了——这说明<b>读者会读出来</b>。</b><br><b>⇒ 所以反过来要求自己：<b>如果你的方法里有一处与你主张的原则不一致，自己先说</b>。</b> <span class='k'>你很可能有这样一处：比如你主张「不该依赖人工先验」，但你的节点划分、档位设置、λ 的取值范围全是人定的；或者你主张「分布无关的保证」，但你的线性假设是一个很强的分布假设</span>。<b>⇒ 自己点出来并给出理由（「我们在这一层做了人工设定，因为 X；放开它是未来工作」），比被审稿人点出来好得多。</b><br><b>⇒ 而讲者在 p75 其实<b>做对了</b>这件事（坦率地说「为什么操作还没成」「这些结果不太可靠」「这不是机器人公司今天在用的」），只是在最后一页没做。<b>两相对照，正好是一个关于学术诚实的现成案例。</b></b>", "ref": "本讲 p78（逐字核对）· p55 · p16 · p75 · L15 p17 主线卡 · 简报 §1 §4d（已核）"}}
];

var TH = {"title": "L17 接上课题的哪一段：一张「这问题能不能用 RL 做」的检查表、一个你能直接照搬的两阶段架构，和一条被讲了两遍的警告", "arc": "<b>这一讲是整门课里离你的课题最远的一讲（全程机器人、没有一个 LLM），但它恰恰是<b>方法论密度最高</b>的一讲 —— 因为讲者被迫把「为什么这类问题能做成、那类不能」讲清楚了，而那套判据是跨领域的。有五处接得很紧，其中一处要<b>推翻</b>我在 L15 给过你的一条建议。</b><br><br><b>① <b>p3–p4 给了你一张检查表</b>，而你的问题在这张表上过关。</b><br><span class='k'>讲者开场就说，RL 在机器人上成了，靠的是两个要素：<b>Well specified rewards</b>（奖励写得出来，而且是 rule-based 所以能自动算）+ <b>Scalable evaluation of policies</b>（评估跑得起，靠的是仿真）。而 p75 他用<b>同一张表</b>解释了「运动控制三四年前就成了、操作至今没成」</span>。<br><b>⇒ 逐条过你的问题，结论相当有利：<b>① <code>G = Acc − λ·Cost</code> 是完备的任务说明，而且一条管所有配置</b>（不需要为每个工作流重写）；<b>② 评估可自动化、可重放</b>。</b><span class='w'>⇒ 所以<b>你的问题在这张表上更像运动控制而不像操作</b>——这是一个很具体、也很有力的「这件事做得成」的论证，比泛泛地说「我们的设定便于实验」强得多。</span><br><b>⚠ 而 p75 那条「<b>奖励不可复用</b>」告诉你会在<b>哪里</b>失去这个优势：<b>一旦 Acc 不再来自标准答案、而要靠一个为特定任务写的评判标准，你就掉到操作那一侧了</b></b>（开放式生成、摘要、创意写作全是这一类）。<b>⇒ 所以主动声明边界：<b>本方法适用于 Acc 可程序化判定的任务</b>。这不是示弱，是说明你知道边界在哪、而且那个边界有理由。</b><br><br><b>② <b>p19–p27 那个两阶段架构是这一讲对你最直接的技术产出</b>，而且它有一个你需要的东西：<b>一个现成的 bound</b>。</b><br><span class='k'>做法是：<b>第一阶段</b>用<b>特权信息</b>（摩擦、质量这些仿真里才知道的真值 <code>e_t</code>）训出一个教师策略；<b>第二阶段</b>把特权信息<b>换成可观测的历史</b>，用监督学习让学生去回归教师的中间表示 <code>z_t</code>，再用 <b>DAgger</b> 收集状态分布</span>。<br><b>⇒ 映到你的问题上，这是一个<b>完整的方案骨架</b>：<b>第一阶段</b>离线、不计成本，用最强的配置（甚至 oracle 标签）算出「这条 query 的每个节点该用什么档」的<b>理想答案</b>；<b>第二阶段</b>训一个只看<b>线上可得的特征</b>（prompt、节点类型、前几个节点的中间输出）的轻量策略去回归它。</b><br><span class='w'>⇒ 而这个结构解决的正是你的核心困难：<b>「该用大模型还是小模型」这件事，最可靠的判据只有事后才知道（答案对不对），而决策必须事前做</b>。两阶段把这个矛盾拆开了：让事后的信息去<b>教</b>，而不是去<b>用</b>。</span><br><b>⚠⚠ 而 DAgger 这一步对你的「写 bound」这条验收标准是个礼物：<b>DAgger 本身就是一个 no-regret reduction，它给的界形如 <code>J(π̂) ≲ J(π*) + O(T·ε_N)</code></b>（<code>ε_N</code> 是在自己诱导的状态分布上的监督损失）。</b><span class='k'>⇒ 这意味着你不必从零造一个界：<b>把你的第二阶段写成一个模仿学习问题，界就是现成的</b>，再和你的分布无关保证拼起来。这条路比自己硬推一个新界要稳得多，<b>而且审稿人认</b>。</span><br><br><b>③ <b>p37 和 p42–p44 把同一条警告讲了两遍</b>，而这是整讲最反直觉的结果。</b><br><span class='w'><b>第一遍（p37）</b>：四个基线里，<b>显式做系统辨识（直接回归出摩擦、质量的真值）比什么都不自适应的 Robust 基线还差</b>。讲者的解释是：「it's also <b>not necessary</b> to solve for the final downstream task」。<b>第二遍（p42–p44）</b>：用视觉重建地形图再规划落脚点，输给端到端 ——「<b>since we are solving a harder problem, we are losing information</b>」</span>。<br><b>⇒ 一句话：<b>不要把一个比最终任务更难的中间问题塞进你的流程里</b>。</b><br><b>⇒ 这条直接命中你的一个设计诱惑：<b>先预测「这条 query 的难度」或「这个节点需要多强的模型」，再按预测去选档</b>。</b><span class='k'>那是一个<b>更难</b>的中间问题（难度是个没有真值的量），而你真正需要的只是「<b>升档能不能把这条 query 救回来</b>」这个<b>二元</b>判断。<b>⇒ 按后者直接训，而不是先估一个难度分数再定阈值。</b></span><br><b>⇒ 而 RMA 自己给出的正面做法就是 <code>z_t</code>：<b>一个低维、不可解释、但对决策够用的中间量</b>（p32 讲者坦承那三张分析图「we cannot interpret them very easily」）。<b>你的对应物允许同样不可解释 —— 只要它能让 <code>G</code> 变高。</b></b><br><br>⚠️ <b>④ <b>p77 推翻了我在 L15 主线卡里给过你的一条建议</b>，这一条请以这里为准。</b><br><span class='w'>我当时建议：用一个强模型当<b>节点级裁判</b>，给每步打「做对了没有」的标签来做信用分配。而 p77 的原话是：用大模型做通用奖励模型 <b>Could work, but RL will exploit weaknesses if they exist</b> —— 而且讲者给了<b>两个现成的证据</b>：RLHF 继续调下去模型会完全跑偏；DeepSeek 那篇也说，不用可验证/规则型奖励，RL 迟早开始钻奖励的空子</span>。<br><b>⇒ 关键在<b>优化压力</b>：裁判的分数只作<b>事后报告</b>时无妨；一旦它<b>进入搜索的目标函数</b>，你就在对它做优化，而被优化的裁判一定会被钻。</b><br><b>⇒ 会怎么钻？<b>搜索会偏向那些「让裁判打高分」而不是「真的更好」的配置</b>。</b><span class='k'>比如裁判偏好更长、更有条理的中间输出，于是搜索系统性地选出「话多」的配置 —— 而话多意味着 token 多，<b>恰好与你的 Cost 目标相反</b>，你还会以为自己找到了好配置。</span><br><b>⇒ 修正后的建议：<b>节点级裁判可以用于分析与解释，但不要进入 <code>G</code> 的定义或搜索的目标函数</b>。<code>G</code> 必须锚在可验证的量上 —— Acc 来自标准答案，Cost 来自 token 计数。</b><span class='w'>⇒ 而这其实是你相对很多 agentic 工作的<b>优势</b>，值得在论文里点明：<b>我们的目标函数完全由可验证的量构成，因此不存在奖励模型被利用的风险 —— 而这正是当前依赖 LLM-as-judge 的方法面临的问题</b>。</span><br><br><b>⑤ <b>p29 那个消融是一个值得照抄的实验设计</b>。</b><br><span class='k'>讲者要证明「自适应<b>在线持续起作用</b>」，而不只是「开头估一次就够了」。做法很干净：<b>在第一步之后把 <code>z_t</code> 冻住</b>，后面全程不更新 —— 性能掉下来，于是「持续估计」这件事的价值被单独隔离出来了</span>。<br><b>⇒ 你的对应消融：<b>只在第一个节点决定一次档位配置、后续节点全部沿用</b>，对比<b>逐节点决定</b>。</b><span class='w'>如果两者差不多，那你整篇文章的卖点（<b>节点级</b>而非工作流级）就被自己的实验否掉了——<b>所以这个消融必须做，而且要早做</b>。</span><br><b>⇒ 这是一类特别有价值的消融：<b>它不是去证明方法好，而是去证明方法里那个「最关键的设计选择」真的必要</b>。p29 和 p37 合起来就是一套完整的「必要性论证」。</b>", "pitfalls": [{"v": "<b>把「先预测难度、再按难度选档」当成一个自然的两步法。</b> <span class='k'>p37 和 p42–p44 把这条路堵了两次：<b>显式做系统辨识比不自适应还差</b>；<b>重建地形图再规划输给端到端</b>。讲者的两句解释是同一个意思 ——「not necessary to solve for the final downstream task」「since we are solving a harder problem, we are losing information」</span>。<b>⚠ 而「难度」比「摩擦系数」还糟：<b>摩擦至少在仿真里有真值，而难度连真值都没有</b>，你只能拿某个代理量（比如 token 数、某个模型的困惑度）去凑</b>。<span class='w'>⇒ 直接训「<b>升档能不能把这条 query 救回来</b>」这个二元判断。它是你真正需要的量，而且<b>有真值</b>（跑两遍就知道）。</span>", "tag": "推断", "ref": "本讲 p37 p42–p44（逐字核对）· 讲稿（两句解释）· 简报 §1 §4b"}, {"v": "<b>让一个学出来的裁判进入搜索的目标函数。</b> <span class='k'>p77：<b>RL will exploit weaknesses if they exist</b>，两个现成证据（RLHF 调久了跑偏、DeepSeek 不用可验证奖励就被钻）</span>。<b>⚠ 这条在你这里格外危险，因为<b>被钻的方向恰好与你的目标反向</b>：裁判偏好啰嗦的输出 ⇒ 搜索选出话多的配置 ⇒ token 变多 ⇒ Cost 升高，而你的 <code>G</code> 看起来还变好了</b>。<span class='w'>⇒ 把裁判留在分析里，<code>G</code> 只用可验证的量。<b>而且这一点要在论文里<b>主动</b>说成优势，不要默默处理掉。</b></span>", "tag": "推断", "ref": "本讲 p77（逐字核对）· 讲稿（RLHF 与 DeepSeek 两个证据）· L15 主线卡（本条推翻它）· 简报 §1 §4b"}, {"v": "<b>不做「只决定一次」的消融就宣称节点级有价值。</b> <span class='k'>p29 的做法是现成的模板：<b>第一步之后把 <code>z_t</code> 冻住</b>，隔离出「持续估计」的贡献</span>。<b>⚠ 你的版本是<b>只在第一个节点决定一次、后续沿用</b>。而这个消融有可能<b>否掉你的卖点</b> —— 如果逐节点决定只比一次性决定好 0.3 个点，那「节点级」这个标题就撑不住了。</b><span class='w'>⇒ <b>所以要早做</b>，在把论文结构定下来之前做。如果结果不利，你还有时间换故事（比如改成「工作流级 + 预算分配」），<b>而不是在投稿前三天发现</b>。</span>", "tag": "推断", "ref": "本讲 p29（逐字核对）· 简报 §2 §4d"}, {"v": "<b>把中间表示的不可解释当成缺陷去修。</b> <span class='k'>p32 讲者摊开三张分析图，然后直接说「<b>we cannot interpret them very easily</b>」；p66 对接触检测的解释也只敢说「<b>one hypothesis</b>」。而方法照样是 RSS 的论文、照样上了真机</span>。<b>⇒ 你那个「节点该用什么档」的中间量<b>允许</b>不可解释，只要它能让 <code>G</code> 变高。</b><span class='w'>⚠ 但要学他们的<b>写法</b>：<b>把分析图放上去、把观察到的趋势说出来、把解释不了的地方明说</b>。<b>这比硬编一个漂亮的解释安全得多 —— 编出来的解释一旦被审稿人用一个反例戳破，整篇的可信度一起掉。</b></span>", "tag": "推断", "ref": "本讲 p32 p66（逐字核对）· 简报 §4d"}, {"v": "<b>照抄「稀疏奖励 + 大量搜索」而不看讲者自己在做什么。</b> <span class='k'>p78 终章主张 <b>Sparse reward + lots of search</b>（AlphaGo 的教训），而 p16 他自己的方法用了<b>十个手工塑形奖励</b>，还承认「不太优雅」、权重「没有好办法」调</span>。<b>⚠ 讲者没有挑明这处矛盾，<b>而你读出来了 —— 这说明审稿人也会读出来</b>。</b><span class='w'>⇒ 教训是关于你自己的写作：<b>如果你的方法里有一处与你主张的原则不一致，自己先说</b>。你很可能有一处 —— 比如主张「分布无关的保证」，而你的线性假设其实是一个很强的分布假设。<b>自己点出来并给理由，比被审稿人点出来好得多。</b></span>", "tag": "推断", "ref": "本讲 p78 p16（逐字核对）· 简报 §3 §4d"}, {"v": "<b>把 the bitter lesson 读成「你的方向没前途」。</b> <span class='k'>p76 引 Sutton：「general methods that <b>leverage computation</b> are ultimately the most effective, <b>and by a large margin</b>」。而你的方法本质上是在<b>省</b>算力</span>。<b>⚠ 这个张力是真的，而解法在<b>措辞</b>上：你的定位应该是「<b>在给定预算下把钱花对</b>」，不是「<b>比用大模型更好</b>」。</b><span class='w'>前者随算力变便宜<b>仍然成立</b>（总有预算约束，预算只会被更贵的模型重新吃掉），后者会被算力进步直接碾过去。<b>⇒ 这个区别决定了你的工作五年后还站不站得住，值得在 intro 的第一段就定准。</b></span>", "tag": "推断", "ref": "本讲 p76（逐字核对）· Sutton, The Bitter Lesson (2019) · 简报 §1 §3"}], "ammo": [{"q": "你凭什么认为这个问题能用学习的办法做成？", "a": "<b>有两个必要条件，而我们两个都满足（本讲 p3–p4 给出的那张表，p75 又用同一张表解释了「为什么运动控制成了而操作没成」）。</b><br><b>① <b>奖励写得出来，而且一条管所有情况</b>：<code>G = Acc − λ·Cost</code> 是完备的任务说明。</b><span class='k'>这正是讲者说运动控制为什么成的那个性质 ——「<b>跟踪某个速度</b>这条奖励写完就是<b>完整</b>的任务说明，再随机化地形就能得到通用策略」。<b>我们不需要为每个工作流重写一个 G</b></span>。<b>② <b>评估可自动化、可重放</b>：和仿真在机器人里的作用一样。</b><br><b>⚠ 而讲者指出的反例很有参考价值：操作做不成，是因为切菜的奖励要「量每片的大小」，而那<b>取决于你究竟要做什么菜</b>——写一条只换来一个任务，不可复用。</b><span class='w'>⇒ 我们明确声明边界：<b>本方法适用于 Acc 可程序化判定的任务</b>（数学、代码、问答、抽取）；<b>需要主观评判的开放式生成不在范围内</b>，因为那里第一个条件就不成立。</span>", "tag": "推断", "ref": "本讲 p3–p4 p75（逐字核对）· 讲稿（切菜那个奖励、不可复用）· 简报 §1 §2"}, {"q": "既然事后才知道答案对不对，你怎么可能在事前决定用哪个模型？", "a": "<b>用两阶段训练把这个矛盾拆开 —— 这是本讲 p19–p27 那套 RMA 架构的核心思路，而它在机器人上已经跑通了三个身体（腿、手、无人机）。</b><br><span class='k'><b>第一阶段</b>离线、不计成本：用特权信息（这里就是「答案对不对」）算出每条 query 每个节点的<b>理想档位</b>。<b>第二阶段</b>训一个只看<b>线上可得</b>特征的轻量策略去回归第一阶段的中间表示</span>。<br><b>⇒ 关键的措辞是：<b>让事后的信息去「教」，而不是去「用」</b>。</b><span class='w'>RMA 里对应的是「仿真里知道摩擦系数，真机上不知道」—— 解法不是去真机上测摩擦，而是<b>让学生从可观测的历史里把它估出来</b>。</span><br><b>⚠ 而第二阶段用 <b>DAgger</b> 收状态分布这一点不是细节，它是我们<b>界的来源</b>：<b>DAgger 是一个 no-regret reduction，给出 <code>J(π̂) ≲ J(π*) + O(T·ε_N)</code></b>，其中 <code>ε_N</code> 是在策略自己诱导的分布上的监督损失。</b><span class='k'>⇒ 所以我们的保证不是凭空造的：<b>第二阶段是一个标准的模仿学习问题，界是现成的</b>，我们在它之上再叠分布无关的那一层。</span>", "tag": "推断", "ref": "本讲 p19–p27（逐字核对）· RMA (RSS 2021) · DAgger (AISTATS 2011，界的形式待核对原文) · 简报 §1 §3"}, {"q": "为什么不先预测这条 query 的难度，再按难度分配模型？那样不是更可解释吗？", "a": "<b>因为那是一个<b>比最终任务更难</b>的中间问题，而本讲用两个独立实验证明了这条路会<b>更差</b>。</b><br><span class='w'><b>p37</b>：四个基线里，<b>显式做系统辨识（直接回归摩擦、质量的真值）比完全不自适应的 Robust 基线还差</b>。讲者的解释是「it's also <b>not necessary</b> to solve for the final downstream task」。<b>p42–p44</b>：用视觉重建地形图再规划，输给端到端 ——「<b>since we are solving a harder problem, we are losing information</b>」</span>。<br><b>⇒ 「难度」比「摩擦系数」还糟：<b>摩擦在仿真里至少有真值，难度连真值都没有</b>。而我们真正需要的只是一个<b>有真值</b>的二元判断：<b>升档能不能把这条 query 救回来</b>（跑两遍就知道）。</b><br><b>⚠ 关于可解释性我们不回避：<b>我们的中间表示确实不好解释</b>。</b><span class='k'>但这和 RMA 的处境一样 —— p32 作者摊开三张分析图后直接说「<b>we cannot interpret them very easily</b>」，而那仍然是 RSS 的论文、仍然上了真机。<b>我们报告观察到的趋势，并明说哪些解释不了。</b></span>", "tag": "推断", "ref": "本讲 p37 p42–p44 p32（逐字核对）· 讲稿（not necessary / losing information）· 简报 §1 §4b"}, {"q": "你怎么证明「节点级」这件事真的有必要？工作流级一次决定不够吗？", "a": "<b>这正是我们的核心消融，设计照的是本讲 p29 那个模板。</b><br><span class='k'>讲者要证明自适应是<b>在线持续</b>起作用、而不只是开头估一次：做法是<b>在第一步之后把 <code>z_t</code> 冻住</b>，后面全程不更新 —— 性能掉下来，「持续估计」的贡献就被单独隔离出来了</span>。<br><b>⇒ 我们的对应版本：<b>只在第一个节点决定一次配置、后续节点全部沿用</b>，对比<b>逐节点决定</b>。</b><span class='w'>这个消融直接检验标题里那个词。<b>如果两者差不多，我们的卖点就不成立 —— 所以这个结果我们必报，不管它朝哪边</b>。</span><br><b>⚠ 而 p29 还有一个值得学的细节：讲者在<b>七种地形上分别</b>报这个消融，而不是报一个平均数。</b><span class='k'>⇒ 我们同样<b>按任务类型分开报</b>：很可能节点级的收益集中在几类难任务上，而在简单任务上一次决定就够了。<b>那个分布本身就是一个结果</b>，比一个平均数有信息得多。</span>", "tag": "推断", "ref": "本讲 p29（逐字核对，含按七种地形分列）· 简报 §2 §4d"}, {"q": "这和 the bitter lesson 不是正好相反吗？你在手工设计一个省算力的办法。", "a": "<b>不矛盾，因为我们优化的是<b>给定预算下的分配</b>，不是「用更少算力打赢更多算力」。</b><br><span class='w'>Sutton 那条教训说的是「<b>能利用算力的通用方法</b>最终胜出」。而我们的方法恰恰是<b>随算力一起受益</b>的：算力变便宜不会让预算约束消失 —— <b>它会被更贵的模型重新吃掉</b>，而「每个节点该花多少」这个问题反而更尖锐</span>。<br><b>⇒ 我们的定位是「<b>在给定预算下把钱花对</b>」，而不是「<b>比用大模型更好</b>」。前者随算力进步仍然成立，后者会被碾过去。</b><br><b>⚠ 而讲者自己在 p76 的用法也是这个意思：他押算力是为了<b>仿真能跑得更快</b>，不是为了不做方法 —— <b>他那十个手工奖励一个都没少</b>（p16）。</b><span class='k'>⇒ 顺带说，这处张力在本讲里也存在：p78 主张「稀疏奖励 + 大量搜索」，而 p16 用了十个手工塑形奖励。<b>我们选择把自己的同类张力明说出来</b>（见我们对线性假设的讨论）。</span>", "tag": "推断", "ref": "本讲 p76 p78 p16（逐字核对）· Sutton, The Bitter Lesson (2019) · 简报 §1 §3"}], "papers": [{"t": "Kumar*, Fu*, Pathak*, Malik — <b>RMA: Rapid Motor Adaptation for Legged Robots</b>", "id": "RSS 2021（本讲 p19–p37 的主体，讲者本人的工作）", "why": "<b>你要引「特权信息训教师、可观测历史训学生」这个架构时，引这篇。</b> <span class='k'>它的三件事都对你有用：<b>① 两阶段训练</b>（第一阶段吃仿真里才有的 <code>e_t</code>，第二阶段只吃 <code>o_{t-k:t}</code> 去回归 <code>z_t</code>）；<b>② 低维不可解释的中间表示是允许的</b>（p32）；<b>③ 消融怎么设计</b>（p29 冻住 <code>z_t</code>）</span><b>⇒ 而最值得抄的是它的<b>论证顺序</b>：先说问题（真机上测不到摩擦）、再说为什么直接的办法不行（系统辨识更差，p37）、最后才给自己的办法。<b>你的 intro 可以照这个顺序写。</b></b>"}, {"t": "Ross, Gordon, Bagnell — <b>A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning</b>（DAgger）", "id": "AISTATS 2011（本讲 p27 第二阶段用的就是它）", "why": "⚠️ <b>这一篇对你的「写 bound」这条验收标准最直接有用，建议优先读。</b> <span class='w'>本讲只把 DAgger 当成一个工程步骤（「收集学生自己诱导的状态分布」），但它<b>本身是一个带界的归约</b>：把模仿学习化成 no-regret 在线学习，得到 <code>J(π̂) ≤ J(π*) + O(T·ε_N) </code>，<code>ε_N</code> 是在<b>自己的分布上</b>的损失</span>。<b>⇒ 对你的意义：<b>你的第二阶段如果写成一个模仿学习问题，界就不用自己造</b>。</b><span class='k'>⇒ 而它界里那个 <code>T</code>（时间步数）在你这里就是<b>工作流的节点数</b> —— 一个小得多的数（通常 3–8，而机器人是上千步）。<b>这是你相对机器人场景的一个实打实的便宜，值得在分析里点出来。</b></span>"}, {"t": "Agarwal*, Kumar*, Malik, Pathak — <b>Legged Locomotion in Challenging Terrains using Egocentric Vision</b>", "id": "CoRL 2022（本讲 p39–p60 的视觉版本）", "why": "<b>为了那条「<b>不要去解一个更难的中间问题</b>」的论证读它。</b> <span class='w'>它最有用的结果是那张表：<b>Stairs 上 Blind 16.64 / Map Based 6.74 / Ours 31.24</b> —— <b>重建地形图再规划，比什么都看不见还差一半</b>。而讲者的解释只有一句：「since we are solving a harder problem, we are <b>losing information</b>」</span>。<b>⇒ 你每次想加一个「先估计某个中间量」的模块时，把这张表拿出来看一眼。</b><span class='k'>⇒ 另外 p53–p56 那个<b>髋关节外展</b>（没有规定步态，所以搜出了人不会用的上楼办法）是「不塞人类先验」的最好例子，可以用来说明你为什么不手工规定档位分配规则。</span>"}, {"t": "DeepSeek-AI — <b>DeepSeek-R1</b>（可验证奖励 / rule-based rewards 那一段）", "id": "2025（本讲 p77 讲者点名引用的两个证据之一）", "why": "⚠️ <b>这一篇是你论文里那句「我们的目标函数不存在被利用的风险」的<b>反面引用</b>。</b> <span class='w'>讲者在 p77 的原话：「if you <b>don't use verifiable rewards or rule-based rewards</b> like they do, at some point <b>RL can start exploiting the rewards</b> that you have defined」—— 加上 RLHF 调久了模型跑偏那个例子，构成了「<b>学出来的奖励会被钻</b>」的两个现成证据</span>。<b>⇒ 用法：先引它说明「用学出来的裁判有风险」，再说<b>我们的 <code>G</code> 完全由可验证的量构成</b>（Acc 来自标准答案、Cost 来自 token 计数）。</b><span class='k'>⇒ 这一手把一个你本来就有的、却容易被当成「设定简单」的特点，变成一个<b>有文献支撑的设计优势</b>。</span>"}, {"t": "Sutton — <b>The Bitter Lesson</b>", "id": "2019（本讲 p76 讲者引用并「highly recommend everyone to read it」）", "why": "<b>很短，值得读一遍原文，而且读它是为了<b>把自己的定位说准</b>。</b> <span class='k'>引的那句是：「general methods that <b>leverage computation</b> are ultimately the most effective, <b>and by a large margin</b>」</span><b>⚠ 而它和你的方向有真实的张力：你本质上在省算力。</b><span class='w'>⇒ 读完要带走的是一句措辞上的纪律：<b>把你的工作定位成「在给定预算下把钱花对」，而不是「比用大模型更好」</b>。前者随算力变便宜仍然成立（预算约束不会消失，只会被更贵的模型吃掉），后者会被算力进步直接碾过去。<b>这个区别决定了你的工作五年后还站不站得住。</b></span>"}]};

      localStorage.removeItem("l17p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      var nf=frame.cloneNode(false); nf.removeAttribute("src");
      frame.parentNode.replaceChild(nf,frame); frame=nf;
      frame.src=SRC+HASH;
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
