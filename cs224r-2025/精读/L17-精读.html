 the first time step and then we freeze that update and then we don't update the extrinsics for the rest of the run</b>.”</em><br><br>原话（8 公斤是标称载重的两倍多，以及关掉之后的失败方式）：<em>“it looks like it is 8 kg. This is like a 12 kg robot and 8 kg is very high and you can see the bot is struggling a bit. So <b>the rated payload for this robot when I bought it was around 3 kg. So I'm maxing this out</b>, leads heats the motors much faster, but it can still manage to walk. <b>If you switch off this adaptation module, so the weight actually tilts the bot forward and it doesn't know to correct for it by applying more force or torque in the front legs or get back to a higher clearance, and just ends up tilting forward when it doesn't have enough torque to clear for the next step.</b>”</em><br><br>原话（泡沫垫那组：问题是没检测到事件）：<em>“Same thing with the foam. Even if it is getting stuck, it seems to manage that fine. But here it doesn't know to again apply more force to get higher clearance to continue walking <b>because it hasn't detected that event or that change</b>.”</em>", "res": {"tag": "推断", "v": "<b>这个消融的<b>设计</b>比它的结论更值得你学，因为它示范了怎么把一个机制隔离出来测——而你那套方法里有好几个机制混在一起。</b><br><span class='k'>它的做法是：<b>不删模块，只关掉「持续更新」这一个性质</b>。网络、权重、输入通道全都不变，唯一的差别是 <code>z_t</code> 冻不冻</span>。<b>⇒ 于是结论可以精确归因：差别<b>只</b>来自「在线持续估计」这一件事。</b><br><b>⇒ 对照你现在可能会做的消融：「有逐节点分配 vs 没有」——<b>这个对照太粗了</b>，因为两边差的不止一件事。</b><span class='w'>关掉逐节点分配的同时，你也关掉了「不同节点可以不同」「可以逐 query 变化」「搜索算法选出来的」这三件事。</span><br><b>⇒ 按 RMA 的做法重新设计，你应该做的是<b>逐性质</b>的消融：</b><br><span class='k'>· <b>关掉「跨节点可变」</b>：仍然逐 query 自适应，但同一条 query 内所有节点用同一档位 ⇒ 测「节点间异质性」值多少<br>· <b>关掉「跨 query 可变」</b>：仍然逐节点分配，但所有 query 用同一套配置 ⇒ 测「query 间异质性」值多少<br>· <b>关掉「搜索」</b>：保留两种异质性，但配置用随机/启发式选 ⇒ 测「算法」值多少</span><br><b>⇒ 三行，每行只关一个性质，而不是一次关三个。</b><span class='w'>这正是 L15 p16 那句「想清楚好处从哪来」的操作化版本，而 RMA 给了一个具体范例。</span><br><b>⚠ 而第二条最值得你认真看，因为它可能揭穿一件事：<b>如果「所有 query 用同一套配置」表现得几乎一样好，那么你的「逐 query 自适应」就是多余的</b>。</b> <span class='k'>这完全可能——如果 query 之间难度差异不大，一套固定配置就够了</span>。<b>⇒ 与其等审稿人问，不如自己先测并报出来。</b><br><b>另外那条「只有环境<b>中途</b>变化时才测得出差别」的洞察，对你也有一个直接的类比：<b>如果你的 query 难度在执行过程中「揭示」得很早，那逐节点自适应的价值就小</b>。</b> <span class='w'>讲义那边重物是<b>抛</b>过来的，所以必须持续更新；而如果难度从第一个节点就看得出来，那估一次就够了（这也呼应 p20 那个 10 Hz 的意外）</span>。<b>⇒ 可做的检验：<b>看「用前 k 个节点的信号预测最优配置」的准确率随 k 怎么变</b>。如果 k=1 就饱和了，就别做复杂的在线适应。</b>", "ref": "本讲 p29–p31（逐字核对）· 讲稿（冻住第一步、前倾的失败方式）· p15 · p20 · L15 p16 · 简报 §4c §4d（已核）"}},
{"r": [32, 36], "t": "适应模块到底在做什么：三张图，和一条讲者自己都读不懂的曲线", "star": 3, "quote": "<b>Analysis of Adaptation Module</b><br><em>三张图：① <b>步态图</b>（四只脚，线实心 = 触地）② <b>右前膝的请求力矩</b>（Knee Tau<sub>RL</sub>）③ 适应模块的两个分量（油面组取 <b>z1, z5</b>；抛重物组取 <b>z2, z7</b>）</em><br><em>Oily surface and plastic wrapped feet &nbsp;·&nbsp; 5kg payload throw</em>", "one": "<b>三张图叠在一起看：脚一打滑，步态乱了、力矩变了、而适应模块的输出也跟着跳了一下。至于它跳的那个值是什么意思——讲者自己说解释不了。</b>", "pts": ["<b>先搞清楚三张图各是什么，它们是同一段时间的三个切面。</b> <span class='k'>① <b>步态图</b>：四只脚各一行，<b>线是实心的就表示这只脚在触地</b>（硬件有足底传感器）；② <b>右前膝的请求力矩</b>；③ 从适应模块输出的 <code>z_t</code> 里挑出来的<b>两个分量</b></span>。", "<b>⚠ 为什么只挑两个分量？因为它们「变化最明显」。</b> <span class='w'>讲稿：「I chose these two because they <b>show the most variation</b> in the course of this run」</span>。<b>⇒ 这是一个诚实的说明——<b>这是挑出来给你看的，不是全部</b>。</b>", "<b><b>油面那一组</b>的故事：脚一滑，三张图同时有反应。</b> <span class='k'>「the moment it slips there's some <b>shuffling in the gait</b>. We also see a variation in the <b>torque profile</b>, and we see that <b>the adaptation module changes its value</b> to capture that something has happened」</span>。", "<b>⇒ 而恢复过程也在图上：「after that, it seems to have <b>recovered to the same gait pattern</b> and a similar torque profile as before <b>once the event is detected</b>」。</b> <span class='w'>⇒ 注意因果顺序：<b>事件被检测到 → 然后才恢复</b>。</span>", "⚠️ <b>而讲者对第三张图的坦白值得照录，因为它是一个很重要的限定：<b>「Since these are <b>learned</b> extrinsics, <b>we cannot interpret them very easily</b>. But we see that <b>some change has happened</b>」</b>。</b>", "<b>⇒ 也就是说：<b><code>z_t</code> 的某一维到底代表「摩擦」还是「负载」还是别的什么，没人知道</b>。</b> <span class='k'>它是网络自己学出来的一个 8 维压缩表示，<b>没有被约束成可解释的物理量</b></span>。<b>⇒ 这张图能证明的只有一件事：<b>发生事件时它变了，而且变化与行为的恢复同步</b>。</b>", "<b>⇒ 这个限定很要紧，因为它正好是 p37 那个反直觉结果的<b>另一面</b>：<b>不可解释，恰恰是因为它没有被强迫去预测真实的物理量</b>——而下一页会说，强迫它去预测反而更差。</b>", "<b><b>抛重物那一组</b>多出一个很有信息量的细节，而且它是整页最硬的证据。</b> <span class='w'>重物落下的瞬间力矩很高（冲击），这不奇怪；<b>奇怪的是适应完成之后</b>：「the torque it saturates to after it is done with adapting to this event is <b>higher than before</b>」</span>。", "<b>⇒ 为什么？「<b>because it needs more torque to balance the weight that it is carrying</b>」——<b>它身上确实多了 5 公斤，所以维持同样的步态本来就需要更大的力矩</b>。</b> <span class='k'>⇒ 这说明适应不是「把扰动压回去然后恢复原状」，而是<b>切换到了一个适合新情形的新工作点</b>。</b>", "<b>⇒ 这是一个比「它没摔倒」强得多的证据：<b>力矩稳态的改变，说明策略确实改变了行为，而不只是碰巧扛住了</b>。</b> <span class='w'>⚠ 而且这个证据是<b>定量</b>的、可以从图上读出来的，不依赖主观判断视频里机器人走得好不好。</span>", "⚠️ <b>最后一个容易被跳过、却很说明方法论的细节：<b>画这张步态图用的足底传感器，策略自己是<b>看不到</b>的</b>。</b> <span class='k'>讲稿：「there <b>are feet sensors in the hardware</b> which let us plot this」。而 p15 那张输入表里<b>没有</b>足底接触信号 —— 策略的输入只有关节位置、速度和上一步动作</span>。", "<b>⇒ 所以这里有一个清楚的分工，值得作为一条通用做法记住：<b>策略只用部署时能依赖的输入；分析可以用任何你拿得到的仪器</b>。</b> <span class='w'>⇒ 足底传感器贵、易坏、未必每台机器都有，所以不进策略；但它在实验室里能给你一张干净的触地图，所以进分析。</span>", "<b>⇒ 这个分工对应到你自己的工作，是一条很实用的纪律：<b>「决策能看什么」和「我能测什么」是两张不同的清单，而混起来就是泄漏</b>。</b> <span class='k'>你的分析里可以用标准答案、可以用更大模型的判断、可以用事后的重试记录；<b>但这些一样都不能进入决策的输入</b>。⇒ 写代码时把这两张清单<b>物理上分开</b>（两个 dataclass、两条管线），比靠记性可靠。</span>", "<b>⚠ 而这也解释了为什么这三张图只能做<b>定性</b>的证据：<b>它们是单次运行的轨迹，不是统计</b>。</b> <span class='w'>一次打滑、一次抛重物，各一张图。<b>⇒ 想说「适应模块普遍有效」，靠的是 p29 的消融和 p37 的基线表（那两处是仿真里跑的、有数的）；这三张图的作用是<b>说明机制长什么样</b>，而不是证明它成立。</b></span>"], "eq": "**三张图是同一段时间的三个切面**：\n   ① **步态图**：四只脚各一行，**线实心 = 这只脚在触地**（硬件有足底传感器）\n   ② **右前膝的请求力矩**（Knee Tau_RL）\n   ③ 适应模块输出 z_t 里挑出来的**两个分量**\n\n   ⚠ 为什么只挑两个：「I chose these two because they **show the most variation**」\n     ⇒ 诚实的说明 —— **这是挑出来给你看的，不是全部**\n\n**油面那组**：脚一滑，三张图同时有反应\n   「the moment it slips there's some **shuffling in the gait**. We also see a\n     variation in the **torque profile**, and we see that **the adaptation module\n     changes its value** to capture that something has happened」\n   恢复：「after that, it seems to have **recovered to the same gait pattern**…\n          **once the event is detected**」\n   ⇒ 注意因果顺序：**事件被检测到 → 然后才恢复**\n\n⚠⚠ 讲者对第三张图的坦白（很重要的限定）：\n   「Since these are **learned** extrinsics, **we cannot interpret them very easily**.\n     But we see that **some change has happened**」\n\n   ⇒ **z_t 的某一维代表「摩擦」还是「负载」还是别的，没人知道**\n     它是网络自己学出来的 8 维压缩表示，**没有被约束成可解释的物理量**\n   ⇒ 这张图能证明的只有：**发生事件时它变了，而且变化与行为恢复同步**\n\n   ⇒ 这个限定正是 p37 那个反直觉结果的**另一面**：\n     **不可解释，恰恰因为它没有被强迫去预测真实物理量**\n     —— 而下一页会说，强迫它去预测反而**更差**\n\n**抛重物那组**多出一个最硬的证据：\n   重物落下瞬间力矩很高（冲击）—— 不奇怪\n   **奇怪的是适应完成之后**：\n     「the torque it saturates to after it is done with adapting to this event\n       is **higher than before**」\n   为什么：「**because it needs more torque to balance the weight\n             that it is carrying**」\n     —— 身上确实多了 5 公斤，维持同样步态本来就需要更大力矩\n\n   ⇒ 适应不是「把扰动压回去然后恢复原状」，\n     而是**切换到了一个适合新情形的新工作点**\n   ⇒ 这比「它没摔倒」强得多：\n     **力矩稳态的改变说明策略确实改变了行为，而不只是碰巧扛住了**\n   ⚠ 而且这个证据是**定量**的、可从图上读出，\n     不依赖主观判断视频里走得好不好", "tbl": {"head": ["三张图", "看什么", "事件发生时"], "rows": [["<b>步态图</b>", "<b>四只脚什么时候触地</b>", "<b>步态出现紊乱</b>"], ["<b>右前膝力矩</b>", "<b>请求了多大力矩</b>", "<b>力矩剖面变化</b>"], ["<b>z<sub>t</sub> 的两个分量</b>", "<span class='w'>⚠ 含义不可解释</span>", "<b>数值跳变</b>"], ["⚠ 抛重物组的硬证据", "<b>适应后力矩稳态<b>更高</b></b>", "<b>因为真的多背了 5 kg</b>"]]}, "say": "原话（三张图同时有反应，以及「事件被检测到之后才恢复」）：<em>“if you see that <b>the moment it slips there's some shuffling in the gait</b>. We also see a variation in the <b>torque profile</b>, and we see that <b>the adaptation module changes its value to capture that something has happened</b>. <b>Since these are learned extrinsics, we cannot interpret them very easily. But we see that some change has happened.</b> And after that, it seems to have <b>recovered to the same gait pattern</b> and a similar torque profile as before <b>once the event is detected</b>.”</em><br><br>原话（适应之后力矩稳态更高——整页最硬的证据）：<em>“for this example, there's the 5 kg payload which is dropped, which means that at the time of impact, the force is probably even more… And we see that there's again the shuffling of this gait. And the torque is very high at the moment when this drops. <b>But it comes back to a regular gait. But the torque that it saturates to after it is done with adapting to this event — the torque it saturates to is higher than before because it needs more torque to balance the weight that it is carrying.</b>”</em>", "res": {"tag": "推断", "v": "<b>那个「适应后力矩稳态更高」的证据，是一个<b>实验设计上的范例</b>，而你的论文正缺这种东西。</b><br><span class='k'>它的妙处在于：<b>不是去证明「系统表现更好」，而是去证明「系统的内部工作点确实改变了，而且改变的方向与物理解释一致」</b></span>。<b>⇒ 「它没摔倒」可以是运气；而「它稳定到了一个更高的力矩，因为确实多背了 5 公斤」<b>只能</b>由「它真的察觉并补偿了」来解释。</b><br><b>⇒ 你需要一个同类的证据，而且你有材料做：<b>证明「逐节点档位分配确实在<b>按节点难度</b>分配，而不是碰巧凑出一个好分数」</b>。</b><br><span class='w'>可做的形式：<b>把搜出来的最优配置里「各节点被分到大模型的频率」，与一个独立测出的「各节点难度指标」画成散点图</b></span>。<b>⇒ 那个难度指标要<b>独立于你的搜索过程</b>——比如「把该节点单独换成小模型时，该节点输出质量的下降幅度」。</b><b>如果两者相关，那就说明你的方法学到的是<b>结构</b>而不是噪声；如果不相关，那你的提升来自别的东西，而你需要知道是什么。</b><br><b>⚠ 而讲者那句「<b>学出来的 extrinsics 我们解释不了</b>」，对你有一条相反方向的提醒，值得认真想。</b><br><span class='k'>RMA 可以不解释 <code>z_t</code>，因为它的交付物是<b>一个能走路的机器人</b>——用户不关心中间表示</span>。<b>⇒ 而你的交付物很可能<b>包含</b>解释：「<b>哪些节点值得花钱</b>」本身就是一个有价值的结论，甚至可能比那几个百分点的 <code>G</code> 提升更有价值。</b><br><b>⇒ 所以你<b>不</b>应该学 RMA 走「学一个不可解释的压缩表示」那条路。</b> <span class='w'>你的 <code>θ</code>（逐节点逐档位的系数）天然是可解释的——<b>这是你的线性模型相对黑盒方法的一个真实优势</b>，而不只是一个为了可分析而做的妥协。</span><br><b>⇒ 这句话值得写进论文：<b>我们选择线性模型不只是为了可分析性，也因为它的参数直接回答了实践者真正关心的问题——「钱该花在哪个节点上」。</b></b><br><b>⚠ 最后一条方法上的：那个「只挑了变化最明显的两个分量」的诚实说明也该学。</b> <span class='k'>你报节点级结果时，如果只展示几个最显著的节点，<b>要明说是挑出来的</b>，并把完整的表放进附录。</b>", "ref": "本讲 p32–p36（逐字核对）· 讲稿（不可解释、力矩稳态更高）· p37 · 简报 §1 §4c §4d（已核）"}},
{"r": [37, 38], "t": "四条基线，和那个反直觉的结果：显式估物理量反而更差", "star": 3, "quote": "<b>Quantitative Comparison</b> — 四条基线<br><b>Existing Attempts at Learning General Policies</b><br><em>• <b>Domain Randomization (Robust)</b><br>• <b>System Identification</b><br>• <b>Fine tuning at test time in the real world</b></em>", "one": "<b>最值得记的不是 RMA 赢了，而是输的那一条输得多难看：直接去预测摩擦和质量，不但不如 RMA，甚至不如一个压根不估环境的笨策略。</b>", "pts": ["<b>四条基线对应四种「怎么应对未知环境」的思路，值得逐条看清它们各自赌的是什么。</b>", "<b><b>① Robust（域随机化但不喂参数）</b>：赌的是「我不需要知道环境，我只要对一切都扛得住」。</b> <span class='k'>做法就是 p14 那一套减掉「把参数喂给策略」这一步</span>。<b>⇒ 讲者的评价很具体：「a bit <b>conservative</b>, but it also has a <b>weaker success rate</b>. And the amount of <b>torque</b> it's exerting is also <b>higher</b>. The amount of <b>jerk</b> that it experiences is higher」。</b>", "<b>⇒ 而原因一句话点透：<b>「because it has <b>no idea of the environment</b> around it. It is just trying to be <b>as aggressive as possible</b> to make sure that it does not fall」</b>。</b> <span class='w'>⇒ 不知道情况，就只能<b>一律用最大的力气</b>——又费电、又伤硬件、成功率还更低。</span>", "⚠️ <b><b>② System Identification（直接预测摩擦、质量这些物理量）</b>：这是最「正统」的思路，而它的结果最意外。</b> <span class='k'>做法是不去预测压缩的 <code>z_t</code>，而是<b>直接预测真实的物理参数</b></span>。", "<b>⇒ 结果是：<b>不但不如 RMA，而且「interestingly <b>it's lower than having a robust policy</b> which is just agnostic to it」——连那个什么都不估的笨策略都不如</b>。</b>", "<b>⇒ 讲者给了两条理由，而<b>第二条才是真正的要害</b>。</b> <span class='w'><b>理由一</b>：精确预测本来就难——「you might not even <b>detect the full scope of the slip</b> or you might not even know <b>exactly how much the mass is</b>」</span>；<b><b>理由二</b>：<b>「it's also <b>not necessary</b> to solve for the final downstream task of walking robustly」</b>——<b>你根本不需要知道摩擦系数是 0.3 还是 0.35，你只需要知道「该多使点劲」</b>。</b>", "<b>⇒ 所以这条基线输在<b>解了一个比需要的更难的问题</b>：它被迫去估一个精确的物理量，而那个精度既达不到、也用不上，于是误差反而污染了下游。</b> <span class='k'>⚠ 这条教训在本讲会<b>再出现一次</b>——p42–p44 的「地形图」是同一个错误的视觉版本。</span>", "<b><b>③ 测试时微调</b>：赌的是「到了真实世界再改权重」。</b> <span class='w'>而讲者把 RMA 与它的区别讲得很清楚：「The RMA style is closer to <b>in context learning</b> where you take the history of everything and then <b>the learning happens in the feed forward pass itself</b>, which lets it do it in <b>fractions of a second</b> instead of trying to estimate that at inference time by <b>rolling out policies</b>」</span>。<b>⇒ 一个要跑很多次才能改进，一个一次前向就完成。</b>", "<b><b>④ RMA w/o Adaptation</b>：就是 p29 那个消融，性能低于完整的 RMA。</b>", "<b>⚠ 最后讲者还承认了一处差距，这种诚实值得记：<b>教师与学生之间有小差距</b>。</b> <span class='k'>「there's a <b>small amount of gap</b> between what we get from the <b>expert</b>（用特权信息的那个）and from distilling it into an RMA method which can actually be deployed」</span>。<b>⇒ 蒸馏不是无损的——学生从历史里估出来的 <code>z_t</code> 毕竟不如真值。</b>", "<b>把 p38 和这一页并起来看：<b>三条已有路线各自的失败方式，正好定义了 RMA 的位置</b></b>——<span class='w'>比 Robust 更知情、比系统辨识更不贪心、比测试时微调更快</span>。", "<b>⚠ 读这张表要留意它报了<b>三类指标</b>，而不只是成功率，这个选择本身有讲究。</b> <span class='k'><b>① 成功率</b>（走完没摔）；<b>② 力矩</b>（花了多少劲）；<b>③ jerk</b>（加速度的变化率，衡量动作有多<b>颠</b>）</span>。<b>⇒ 后两个不是「附加的工程指标」——<b>它们是硬件寿命和能耗的直接代理</b>，而这正好对上 p16 那十个奖励里的 <em>Energetics</em> 与 <em>Minimize hardware damage</em>。</b>", "⚠️ <b>⇒ 而 Robust 这一行最值得想清楚：<b>它同时「更保守」<b>和</b>「成功率更低」</b>。</b> <span class='w'>这两件事直觉上该是反的——越保守应该越不容易摔</span>。<b>⇒ 但它保守的方式是<b>对一切都绷着</b>：力矩拉满、动作僵硬、jerk 很高，像人在冰面上走路时那种全身紧张。<b>⇒ 结论是：<b>「小心」如果不是针对当前情形的小心，就既不省力、也不管用</b>。</b></b>", "<b>⇒ 这一条对比其实比「RMA 比 Robust 强」这个结论更有意思，因为它说明了<b>强在哪</b>：<b>不是更小心，而是小心得有针对性</b>。</b> <span class='k'>⇒ 带适应的策略在平地上可以放松（省力矩），只在检测到异常时才绷紧；而 Robust 没有这个开关，<b>只能全程按最坏情况活着</b>。</span>", "<b>⚠ 最后一个读表的提醒：这张表是<b>仿真里</b>跑的。</b> <span class='w'>讲者前面那一大段真机视频（p21–p28）<b>没有对应的定量基线对比</b>——真机上只有 RMA 自己的消融（p29），没有和系统辨识、测试时微调的真机对拼</span>。<b>⇒ 这不是造假，是这个领域的通例（真机实验太贵）。<b>但读的时候要知道：「比基线强」这个结论的证据是仿真的，「在真实世界能用」这个结论的证据是视频的，两者没有在同一处交汇。</b></b>"], "eq": "四条基线 = 四种「怎么应对未知环境」的思路\n\n**① Robust（域随机化但不喂参数）**\n   赌的是：「我不需要知道环境，我只要对一切都扛得住」\n   做法 = p14 那一套**减掉**「把参数喂给策略」\n   评价：「a bit **conservative**, but **weaker success rate**.\n           **torque** is **higher**. **jerk** is higher」\n   原因一句话：「because it has **no idea of the environment** around it.\n     It is just trying to be **as aggressive as possible** to make sure it does not fall」\n   ⇒ 不知道情况就只能**一律用最大力气** —— 费电、伤硬件、成功率还更低\n\n⚠⚠ **② System Identification（直接预测摩擦、质量）** —— 最「正统」，结果最意外\n   做法：不预测压缩的 z_t，而**直接预测真实物理参数**\n   结果：不但不如 RMA，而且\n     「interestingly **it's lower than having a robust policy**\n       which is just agnostic to it」\n     —— **连那个什么都不估的笨策略都不如**\n\n   两条理由，**第二条才是要害**：\n     理由一：精确预测本来就难\n       「you might not even **detect the full scope of the slip** or\n         you might not even know **exactly how much the mass is**」\n     理由二：**「it's also not necessary to solve for the final downstream\n               task of walking robustly」**\n       ⇒ **你不需要知道摩擦是 0.3 还是 0.35，你只需要知道「该多使点劲」**\n\n   ⇒ 它输在**解了一个比需要的更难的问题**：\n     被迫去估一个精确物理量，而那个精度既达不到、也用不上，\n     于是误差反而污染了下游\n   ⚠ 这条教训本讲会**再出现一次** —— p42–p44 的「地形图」是它的视觉版本\n\n**③ 测试时微调**：赌的是「到了真实世界再改权重」\n   RMA 与它的区别：\n     「The RMA style is closer to **in context learning**… **the learning happens\n       in the feed forward pass itself**, which lets it do it in **fractions of a\n       second** instead of estimating at inference time by **rolling out policies**」\n   ⇒ 一个要跑很多次才能改进，一个**一次前向就完成**\n\n**④ RMA w/o Adaptation**：p29 那个消融，低于完整 RMA\n\n⚠ 讲者承认的一处差距（诚实值得记）：\n   「there's a **small amount of gap** between what we get from the **expert**\n     and from distilling it into an RMA method which can actually be deployed」\n   ⇒ **蒸馏不是无损的** —— 学生从历史估出的 z_t 毕竟不如真值\n\np38 + 这一页：**三条已有路线各自的失败方式，正好定义了 RMA 的位置**\n   比 Robust 更**知情**、比系统辨识更**不贪心**、比测试时微调更**快**", "tbl": {"head": ["四条基线", "赌的是什么", "怎么输的"], "rows": [["<b>Robust（域随机化）</b>", "<b>不必知道环境，扛住就行</b>", "<b>保守 · 力矩大 · 成功率反而低</b>"], ["<b>System Identification</b>", "<b>把物理量精确估出来</b>", "<span class='w'>⚠ 连 Robust 都不如</span>"], ["<b>测试时微调</b>", "<b>到真实世界再改权重</b>", "<b>要反复 rollout，慢</b>"], ["<b>RMA w/o Adaptation</b>", "<b>估一次就够</b>", "<b>环境中途变化就垮</b>"], ["<b>RMA</b>", "<b>只估「够用的压缩量」并持续更新</b>", "<b>⚠ 与教师仍有小差距</b>"]]}, "say": "原话（Robust 基线为什么力矩和冲击都更高）：<em>“if you compare that with robust, we see that it is <b>a bit conservative, but it also has a weaker success rate. And the amount of torque it's exerting is also higher. The amount of jerk that it experiences is higher because it has no idea of the environment around it. It is just trying to be as aggressive as possible to make sure that it does not fall.</b>”</em><br><br>原话（系统辨识输得最意外，以及那条要害理由）：<em>“in this instantiation of system identification what we try to do is instead of trying to predict the extrinsics which is a compressed version of these environment parameters, we directly go for these sys ID parameters. So we directly try to predict friction and all of these other parameters. And <b>this is a hard problem to predict exactly what the friction is because you might not even detect the full scope of the slip or you might not even know exactly how much the mass is, but it's also not necessary to solve for the final downstream task of walking robustly</b>. And we see the gap in performance if we try to explicitly estimate these parameters, and <b>interestingly it's lower than having a robust policy which is just agnostic to it</b>.”</em><br><br>原话（RMA 更像上下文学习，所以快）：<em>“The RMA style is closer to <b>in context learning</b> where you take the history of everything and then <b>the learning happens in the feed forward pass itself</b>. So you'll see all of these parameters and then you estimate how the network should behave, which lets it do it <b>in fractions of a second</b> instead of trying to estimate that at inference time by <b>rolling out policies</b>.”</em>", "res": {"tag": "推断", "v": "<b>系统辨识那条基线的失败，是这一讲里对你<b>最有警示价值</b>的一个结果，而且它直接针对一条我在 L15 主线卡里给过你的建议。</b><br><span class='k'>结论是：<b>被迫去精确估计一个中间物理量，不但不如估一个「够用的压缩量」，甚至不如什么都不估</b>。理由是那个精度「既达不到，对下游任务也没必要」</span>。<br><b>⇒ 而我在 L15 建议过你给每个节点打一个「这一步做对了没有」的标签（节点级信用分配）。<b>这一页提醒了那条建议的风险</b>：如果那个节点级判别器<b>不够准</b>，它可能比不打标签<b>更糟</b>——因为你会拿一个有偏的中间信号去指导配置选择。</b><br><b>⇒ 所以那条建议要加一个前置检验：<b>先量一下判别器自身的准确率，再决定用不用它</b>。</b><span class='w'>而且判据不是「准确率够高吗」，而是讲者那两条：<b>① 你估得准吗？② 这个精度对最终决策有必要吗？</b></span><br><b>⇒ 第 ② 条尤其值得想：<b>你真的需要知道「节点 j 的输出质量是 0.7 还是 0.8」吗？</b></b> <span class='k'>你真正要的决策只是「这个节点该不该升档」——那是一个<b>二元</b>判断，远比估一个连续质量分容易</span>。<b>⇒ 按 RMA 的教训，你应该直接去学那个<b>够用的量</b>（升不升档），而不是先精确估质量再推导。</b><br><b>⚠ 而 Robust 基线那条教训也有直接对应，而且它描述了一个你很可能见过的现象：<b>不知道情况就一律用最大力气</b>。</b><br><span class='w'>讲义的 Robust 策略「因为完全不知道周围环境，就尽可能地用力，以保证不摔倒」——结果是力矩更大、冲击更大、成功率反而更低</span>。<b>⇒ 你的对应是：<b>不做配置选择就全用大模型</b>。那正是「一律用最大力气」。</b><br><b>⇒ 而讲义给了一个你可能没想到的论点：<b>这样做不只是贵，它的成功率<b>也</b>可能更低</b>。</b> <span class='k'>机器人那边是因为过度用力带来冲击；而在你这边，<b>全用大模型未必在所有节点上都更好</b>——更强的模型可能在简单的格式化节点上过度发挥（加解释、改格式），反而破坏下游解析</span>。<b>⇒ 这是一个<b>可检验</b>的假设，而且如果成立就是一个很有力的结果：<b>存在某些节点，降档不仅省钱而且更准</b>。</b><br><b>⚠ 最后那条「蒸馏有小差距」的诚实，也值得照搬：<b>如果你做了「穷举教师 → 可部署学生」那套（L17.a p19 科研格），一定要把教师与学生的差距报出来</b>。</b> <span class='w'>那个差距就是「用可观测特征替代穷举」的代价，而审稿人一定会想知道它有多大。</span>", "ref": "本讲 p37–p38（逐字核对）· 讲稿（系统辨识那两条理由、Robust 的力矩与冲击）· L15 主线卡 · L17.a p19 科研格 · 简报 §4b §4d（已核）"}},
{"r": [39, 41], "t": "为什么要视觉：一个是非看不可，一个是别老撞楼梯", "star": 2, "quote": "<b>Why do we need vision?</b> &nbsp;·&nbsp; <b>Perception enables precise and agile locomotion</b><br><b>Legged Locomotion in Challenging Terrains using Egocentric Vision</b><br><em>Ananye Agarwal*, Ashish Kumar*, Jitendra Malik, Deepak Pathak（<b>CoRL 2022</b>）</em>", "one": "<b>前半讲刚证明了「盲着也能走遍七种地形」，所以这一页得先回答一个合理的质疑：那还要视觉干什么？两个理由，第二个比第一个更现实。</b>", "pts": ["<b>这个提问的位置很讲究：<b>它出现在证明了「盲策略很能打」<b>之后</b></b>。</b> <span class='k'>讲稿自己把质疑摆出来了：「<b>do we even need vision for walking?</b> Can we not just do without any vision altogether <b>given the results we have already seen</b>?」</span>。<b>⇒ 先把自己的成果当成反方论据，再回答——这是一个诚实的讲法。</b>", "<b><b>理由一：有些情形非看不可。</b></b> <span class='w'>「if you are to cross these <b>gaps or stepping stones</b> or make a <b>jump</b>, <b>you need vision</b> to estimate how to make that jump」</span>。<b>⇒ 盲策略能应付的是「地面性质变了」（滑、软、不平），但应付不了「<b>前面根本没有地</b>」——跨沟和踏脚石要求你<b>提前</b>知道落脚点在哪。</b>", "<b>⇒ 这个区分值得记：<b>本体感觉只能告诉你<b>已经发生</b>的事（我滑了、我陷了），视觉才能告诉你<b>将要发生</b>的事</b>。</b> <span class='k'>⇒ 前者是反应式的补偿，后者是预判式的规划。</span>", "⚠️ <b><b>理由二更现实，而且讲者自己说它是「效率、优雅与寿命」的论证</b>：别每次上楼梯都先撞一下。</b> <span class='w'>原话：「if you have to <b>collide with a staircase every single time</b> that you climb it, it's a very <b>inelegant</b> policy and <b>the hardware will probably not survive for long</b>」</span>。", "<b>⇒ 盲策略的工作方式是<b>撞上去才知道有东西</b>，然后靠鲁棒性化解。</b> <span class='k'>这在实验室里能跑出漂亮的视频，但在<b>一台要长期服役的机器</b>上是不可接受的——每一次碰撞都是对关节和电机的损耗</span>。<b>⇒ 这正好呼应 p16 那条奖励项：<b>Minimize hardware damage</b>。</b>", "<b>⇒ 所以两个理由指向两类不同的收益：<b>理由一扩大了「能做什么」，理由二改善了「做得多体面、机器能撑多久」</b>。</b> <span class='w'>讲者的措辞是「you can potentially get to results which are <b>much better</b> than what we can achieve without vision」。</span>", "<b>p40 那句标语把两者合起来了：<b><em>Perception enables <b>precise</b> and <b>agile</b> locomotion</em></b>——<b>精确</b>（落脚落得准）与<b>敏捷</b>（不必为了保险而放慢、加力）。</b>", "<b>⚠ 最后留意这篇工作的署名：<b>Ananye Agarwal\\* 与 Ashish Kumar\\*</b> 并列第一（星号），CoRL 2022。</b> <span class='k'>⇒ 讲者本人是 RMA 的一作，而这一篇是把 RMA 的思路<b>加上视觉</b>之后的续作——两篇的结构会高度相似，读的时候可以对照着看。</span>"], "eq": "提问的位置很讲究：**出现在证明了「盲策略很能打」之后**\n   讲稿自己把质疑摆出来：\n     「**do we even need vision for walking?** Can we not just do without any\n       vision altogether **given the results we have already seen**?」\n   ⇒ 先把自己的成果当成反方论据，再回答 —— 诚实的讲法\n\n**理由一：有些情形非看不可**\n   「if you are to cross these **gaps or stepping stones** or make a **jump**,\n     **you need vision** to estimate how to make that jump」\n   ⇒ 盲策略能应付「地面性质变了」（滑、软、不平）\n     但应付不了「**前面根本没有地**」—— 跨沟和踏脚石要求**提前**知道落脚点\n\n   ⇒ 值得记的区分：\n     **本体感觉只能告诉你已经发生的事（我滑了、我陷了）\n       视觉才能告诉你将要发生的事**\n     前者是**反应式**补偿，后者是**预判式**规划\n\n⚠ **理由二更现实**（讲者自称是「效率、优雅与寿命」的论证）：\n   **别每次上楼梯都先撞一下**\n   「if you have to **collide with a staircase every single time** that you climb it,\n     it's a very **inelegant** policy and **the hardware will probably\n     not survive for long**」\n\n   ⇒ 盲策略的工作方式是**撞上去才知道有东西**，再靠鲁棒性化解\n     实验室里能跑出漂亮视频，但在**要长期服役的机器**上不可接受\n     —— 每次碰撞都是对关节和电机的损耗\n   ⇒ 呼应 p16 那条奖励项：**Minimize hardware damage**\n\n⇒ 两个理由指向两类收益：\n   **理由一扩大了「能做什么」\n     理由二改善了「做得多体面、机器能撑多久」**\n   讲者：「you can potentially get to results which are **much better**\n           than what we can achieve without vision」\n\np40 标语把两者合起来：\n   **Perception enables precise and agile locomotion**\n   **精确**（落脚落得准）+ **敏捷**（不必为保险而放慢、加力）\n\n⚠ 署名：**Ananye Agarwal\\* 与 Ashish Kumar\\*** 并列第一，CoRL 2022\n   讲者本人是 RMA 的一作，这一篇是 RMA **加上视觉**的续作\n   ⇒ 两篇结构高度相似，可以对照着看", "tbl": {"head": ["", "本体感觉（盲策略）", "视觉"], "rows": [["能告诉你什么", "<b>已经发生的事（我滑了）</b>", "<b>将要发生的事（前面有沟）</b>"], ["应对方式", "<b>反应式补偿</b>", "<b>预判式规划</b>"], ["对付「地面性质变了」", "<b>可以</b>", "<b>可以</b>"], ["对付「前面没有地」", "<span class='w'>⚠ 不行</span>", "<b>可以</b>"], ["上楼梯的方式", "<span class='w'>⚠ 撞上去才知道</span>", "<b>提前抬腿</b>"], ["对硬件寿命", "<span class='w'>⚠ 每次都在损耗</span>", "<b>友好</b>"]]}, "say": "原话（先把质疑摆出来，再回答）：<em>“everything that I've shown up until now is blind… So the first question is <b>do we even need vision for walking? Can we not just do without any vision altogether given the results we have already seen?</b> And the answer is that there are two scenarios. In one case <b>vision is critical like if you are to cross these gaps or stepping stones or make a jump you need vision to estimate how to make that jump</b>. And the second argument is more of an <b>efficiency and elegance and longevity</b> argument. So <b>if you have to collide with a staircase every single time that you climb it, it's a very inelegant policy and the hardware will probably not survive for long</b>. So for both of these reasons, if you have vision in the loop, you can potentially get to results which are <b>much better</b> than what we can achieve without vision.”</em>", "res": {"tag": "推断", "v": "<b>这一页最该带走的不是「视觉有用」，而是那个<b>区分</b>：<b>本体感觉只能告诉你<b>已经发生</b>的事，视觉才能告诉你<b>将要发生</b>的事</b>。而这条区分在你的问题里有一个非常直接的对应。</b><br><span class='k'><b>事后的信号</b>：这条 query 答错了、这个节点的输出格式不对、下游节点触发了重试。<b>事前的信号</b>：这条 prompt 的长度与句式、任务类型、它在历史上同类 query 里的降档成功率</span>。<br><b>⇒ 而你的两阶段训练（见 L17.a p19 的科研格）正好把两者都用上了，<b>各在各的位置</b>：<b>事后信号用来<b>教</b>（第一阶段的特权信息），事前信号用来<b>决策</b>（第二阶段的输入）</b>。</b><span class='w'>⚠ 这个分工必须守住 —— 一旦事后信号漏进第二阶段的输入，你就有了泄漏，而且是那种在离线评测里看不出来的泄漏。</span><br><b>⚠ 具体说，这是一条很容易踩的线：<b>「前序节点触发了重试」这个特征，在决策<b>当前</b>节点时是合法的（它已经发生了），但在决策<b>前序</b>节点时是泄漏的</b>。</b> <span class='k'>⇒ 所以你的特征必须按<b>节点下标</b>严格切：<b>第 <code>k</code> 个节点的决策只能看第 <code>1..k−1</code> 个节点的产物</b>。写代码时这一条要有断言，不要靠记性。</span><br><b>⇒ 而第二个理由（<b>别每次上楼梯都先撞一下</b>）映过来也很实在：<b>你的方法不只是省钱，它还减少「先答错再重试」的次数</b>。</b><span class='w'>讲者把这叫「efficiency, elegance 和硬件寿命」的论证。你的对应是<b>延迟</b>：一次失败的重试意味着用户多等了一整轮。<b>⇒ 所以除了 Acc 和 Cost，<b>把平均延迟也报出来</b> —— 这是一个你本来就改善了、却容易忘了说的收益。</b></span><br><b>⇒ 顺带留意讲者提问的<b>位置</b>：他是在证明了「盲策略很能打」<b>之后</b>才问「我们真需要视觉吗」。</b> <span class='k'>⇒ 这个叙事顺序值得照抄：<b>先把简单方法做到最强，再论证为什么还需要更多</b>。如果你先摆出复杂方法，读者会怀疑简单方法是不是被你故意做弱了。</span>", "ref": "本讲 p39–p41（逐字核对）· 讲稿（两个理由、撞楼梯那段）· L17.a p19 科研格 · 简报 §1 §2 §4d（已核）"}},
{"r": [42, 44], "t": "地形图是条错路：错在你先解了一个更难的问题", "star": 3, "quote": "<b>Typical approach: build terrain maps from vision</b><br><em><b>But terrain maps are very noisy!</b></em><br><b>Noisy maps wipe out signal => degraded performance</b><br><b>Do we really need terrain maps?</b> — <em><b>We tightly couple vision and control</b></em>", "one": "<b>常见做法是先用视觉建一张地形图，再把图交给控制器。而问题不在图建得不够好——问题在于「建图」本身是一个比你真正需要的更难的问题，而你在那一步已经把信息丢了。</b>", "pts": ["<b>常见的流水线是<b>两段式</b>：<b>视觉 → 显式地形图 → 控制器</b>。</b> <span class='k'>幻灯引了两篇代表作（Miki et al., Science Robotics 2022；Kim et al., ICRA 2020），然后下了一句判决：<b><em>But terrain maps are very noisy!</em></b></span>", "<b>讲稿把这条路线的毛病<b>定位</b>得很准，而且它不是「图不够准」这种程度的批评。</b> <span class='w'>原话：「there's a <b>fundamental flaw</b> in this approach which is <b>first of all you're solving a very hard problem which is building an explicit map</b>」</span>。", "<b>⇒ 建图<b>本身</b>就是个硬问题：非刚体、位姿估计漂移，任何一样都会让图变脏。</b> <span class='k'>「if you have <b>non-rigid objects</b> or if you have <b>estimate drift</b> in your estimate of your pose or any of these, it will end up converging to <b>very noisy maps</b>」</span>。", "⚠️ <b>但真正致命的是下一句，它说的是<b>不可逆性</b>：<b>「that is a phase where <b>you have already lost information and there is no way you can recover that information</b>」</b>。</b> <span class='w'>⇒ 一旦把像素压成了一张有噪声的度量地图，<b>原始图像里那些有用但没被编码进地图的东西就永远拿不回来了</b>。</span>", "<b>⇒ 而因果关系被讲者点成了一句话，这句最值得记：<b>「<b>since we are solving a harder problem, we are losing information</b> that we would not have lost if we were to <b>directly use the perception input in the policy</b>」</b>。</b> <span class='k'>⇒ <b>不是「做得不够好所以丢了信息」，而是「因为去解了一个更难的问题，所以必然丢信息」</b>。</span>", "<b>讲稿给的具体例子把这件事落地了：<b>有时候你需要的只是「边缘在哪」</b>。</b> <span class='w'>「<b>Maybe the edges were enough to tell you how to take that step.</b> But the moment you convert it to a <b>metric map</b> and then try to give that into the policy, now you need to train your policy to be <b>robust to all of these different kinds of noise</b>」</span>。<b>⇒ 你本来只需要一个粗糙的定性信息（台阶边缘在那儿），却被迫先去估一个精确的定量量（每个格子的高度是多少厘米），然后再对付那个估计带来的噪声。</b>", "⚠️ <b>⇒ 而这<b>正是 p37 那条系统辨识基线失败的同一个错误</b>，只是换了个场合。</b> <span class='k'>那边是「被迫精确估摩擦，而你只需要知道该多使点劲」；这边是「被迫精确估地形高度，而你只需要知道边缘在哪」</span>。<b>⇒ 一讲之内同一条教训出现两次，而且两次都有实验支持——这不是巧合，是讲者的中心论点。</b>", "<b>⇒ 把它提炼成一句可迁移的原则：<b>别在流水线中间插入一个比最终任务更难的子问题</b>。</b> <span class='w'>如果那个中间量<b>既难估、又比最终决策需要的精度高</b>，那它只会把误差放大再传下去。</span>", "<b>p44 给出的解法只有一句：<b><em>We tightly couple vision and control</em></b>（把视觉与控制<b>紧耦合</b>）。</b> <span class='k'>⇒ 即<b>不建中间表示</b>，让深度图像直接进策略，由策略自己决定从里面提取什么</span>。<b>⇒ 这和 RMA 的 <code>z_t</code> 是同一个哲学：<b>学一个「够用的」表示，而不是一个「正确的」表示</b>。</b>", "<b>⚠ 但也要看到这条路的代价：<b>紧耦合意味着你失去了模块化</b>。</b> <span class='w'>建图那条路线的好处是地图可以被别的模块复用、可以被人检查、可以单独调试；而紧耦合之后，中间那个表示<b>没人看得懂</b>（正如 p32 那个「学出来的 extrinsics 解释不了」）</span>。<b>⇒ 讲者没有提这个代价，但它是真实存在的取舍。</b>"], "eq": "常见流水线是**两段式**：**视觉 → 显式地形图 → 控制器**\n   幻灯引了两篇代表作，然后判决：**But terrain maps are very noisy!**\n\n讲稿把毛病**定位**得很准（不是「图不够准」这种程度的批评）：\n   「there's a **fundamental flaw**… **you're solving a very hard problem\n     which is building an explicit map**」\n   建图本身就是硬问题：**非刚体**、**位姿估计漂移** ⇒ 图必然脏\n\n⚠⚠ 真正致命的是**不可逆性**：\n   「that is a phase where **you have already lost information\n     and there is no way you can recover that information**」\n   ⇒ 一旦把像素压成有噪声的度量地图，\n     **原始图像里那些有用但没被编码进地图的东西就永远拿不回来**\n\n⇒ 因果被点成一句话（最值得记）：\n   「**since we are solving a harder problem, we are losing information**\n     that we would not have lost if we were to\n     **directly use the perception input in the policy**」\n   ⇒ **不是「做得不够好所以丢信息」，而是「因为去解了更难的问题，所以必然丢信息」**\n\n具体例子（把这件事落地）：**有时候你需要的只是「边缘在哪」**\n   「**Maybe the edges were enough to tell you how to take that step.**\n     But the moment you convert it to a **metric map**… now you need to train\n     your policy to be **robust to all of these different kinds of noise**」\n   ⇒ 本来只需一个**粗糙的定性信息**（台阶边缘在那儿）\n     却被迫先估一个**精确的定量量**（每格高度多少厘米），再对付它带来的噪声\n\n⚠⚠ **这正是 p37 那条系统辨识基线失败的同一个错误**，换了个场合：\n   p37：被迫精确估**摩擦**，而你只需要知道「该多使点劲」\n   这里：被迫精确估**地形高度**，而你只需要知道「边缘在哪」\n   ⇒ 一讲之内同一条教训出现两次，两次都有实验支持\n     —— 不是巧合，是**讲者的中心论点**\n\n⇒ 提炼成可迁移的原则：\n   **别在流水线中间插入一个比最终任务更难的子问题**\n   若那个中间量**既难估、又比最终决策需要的精度高**，\n   它只会把误差放大再传下去\n\np44 的解法：**We tightly couple vision and control**（紧耦合）\n   ⇒ **不建中间表示**，深度图像直接进策略，由策略自己决定提取什么\n   ⇒ 与 RMA 的 z_t 同一个哲学：\n     **学一个「够用的」表示，而不是一个「正确的」表示**\n\n⚠ 这条路的代价（讲者没提，但真实存在）：**紧耦合意味着失去模块化**\n   建图那条路：地图可被别的模块复用、可被人检查、可单独调试\n   紧耦合之后：中间表示**没人看得懂**（正如 p32 的 extrinsics 解释不了）", "tbl": {"head": ["", "建地形图（常见做法）", "紧耦合（本讲）"], "rows": [["流水线", "<b>视觉 → 地图 → 控制器</b>", "<b>视觉 → 控制器</b>"], ["中间要解什么问题", "<b>⚠ 建一张精确的度量地图</b>", "<span class='w'>不解</span>"], ["那个问题难吗", "<b>⚠ 比最终任务还难</b>", "—"], ["信息损失", "<span class='w'>⚠ 不可逆</span>", "<b>没有</b>"], ["模块化", "<b>有（图可复用、可检查）</b>", "<span class='w'>⚠ 失去</span>"], ["同一个错误在哪也出现过", "<b>p37 的系统辨识</b>", "—"]]}, "say": "原话（建图的根本毛病：解了一个更难的问题，而且信息不可逆地丢了）：<em>“the most common approach to add vision is to <b>decouple it entirely from control and then build an explicit map</b>… And the reason there's a <b>fundamental flaw</b> in this approach is <b>first of all you're solving a very hard problem which is building an explicit map. So your map will always be noisy.</b> So if you have <b>non-rigid objects</b> or if you have <b>estimate drift</b> in your estimate of your pose or any of these, it will end up converging to very noisy maps. So that is a phase where <b>you have already lost information and there is no way you can recover that information</b>, and then you feed that into the controller. So <b>since we are solving a harder problem, we are losing information that we in other scenarios would not have lost if we were to directly use the perception input in the policy</b>.”</em><br><br>原话（有时你需要的只是边缘）：<em>“here's an example of how people add noise to the real terrain. <b>Maybe the edges were enough to tell you how to take that step. But the moment you convert it to a metric map and then try to give that into the policy, now you need to train your policy to be robust to all of these different kinds of noise</b>, which is okay for simple scenarios but becomes very challenging the moment you need to <b>precisely estimate where the gap is</b> and avoid stepping on that.”</em>", "res": {"tag": "推断", "v": "<b>这是这一讲的中心论点第二次出现，而且它现在足够硬，可以当成一条你该遵守的设计原则：<b>别在流水线中间插入一个比最终任务更难的子问题</b>。</b><br><span class='k'>两次的形态：p37 被迫精确估<b>摩擦</b>（而你只需要「该多使点劲」）；这里被迫精确估<b>地形高度</b>（而你只需要「边缘在哪」）。两次都有实验支持，而且两次都<b>输给了什么都不估的基线</b></span>。<br><b>⇒ 你的流水线里有一个一模一样的候选错误，而且我之前就推荐过它：<b>节点级质量评分</b>。</b><br><span class='w'>那条建议是：给每个节点的输出打一个「这一步做得多好」的连续分数，再拿它去指导配置选择</span>。<b>⚠ 而按这一页的判据，它<b>很可能</b>是一个「更难的中间问题」：</b><br><b>· <b>它难估</b></b>——<span class='k'>「这一步的输出质量是 0.7 还是 0.8」需要一个裁判模型，而裁判本身有噪声、有偏好、还会被下游的表述方式影响</span>；<b>· <b>而且那个精度用不上</b></b>——<span class='w'>你真正要的决策只是「这个节点该不该升档」，一个<b>二元</b>判断</span>。<br><b>⇒ 所以按 RMA 的做法，正确的路子是<b>跳过那个中间量</b>：<b>直接学一个从「可观测的执行特征」到「配置」的映射，不要中途去估一个质量分</b>。</b><span class='k'>这正是 p44 那句「紧耦合」的翻版。</span><br><b>⚠ 但这条原则有一个<b>重要的例外</b>，而你恰好落在例外里，所以不能照搬到底。</b><br><span class='w'>讲者没提的那个代价是：<b>紧耦合失去了模块化与可解释性</b>。而他承受得起，因为他的交付物是一个会走路的机器人——没人关心中间表示</span>。<b>⇒ 而你的交付物<b>包含</b>解释：「哪些节点值得花钱」本身就是结论。</b><br><b>⇒ 所以对你，正确的折中是：<b>决策路径上不要插入难估的中间量（照搬这一页），但要保留一个<b>可解释的参数化</b>（你的 <code>θ</code>）作为输出</b>。</b><span class='k'>也就是说：<b>别让中间表示去背解释的责任，让最终模型的参数去背</b>。</span><br><b>⇒ 一个很具体的落法：<b>节点级评分可以<b>报告</b>，但不要进入决策回路</b>。</b> <span class='w'>用它做事后分析（「我们发现节点 3 的质量与升档收益相关」），而不是用它做在线决策——这样既拿到了可解释性，又避免了「噪声中间量污染下游」。</span>", "ref": "本讲 p42–p44（逐字核对）· 讲稿（信息不可逆、边缘那个例子）· p37 · L15 主线卡 · 简报 §4b §4d（已核）"}},
{"r": [45, 52], "t": "同一套两阶段，换了特权信息：从完美地形高度到第一视角深度", "star": 3, "quote": "<b>Phase 1: Learning to Walk with Privileged Terrain Information</b><br><em>o<sub>t</sub> + <b>Scandots (m<sub>t</sub>)</b> + [friction, payload…] → RNN/MLP → z<sub>t</sub> → a<sub>t</sub><br><b>PPO in IsaacGym</b> &nbsp;·&nbsp; <b>Reward = (Track Velocity) + (Minimize Energy)</b></em><br><b>How do we deploy it?</b> — <em>scan dots, [friction, payload…] <b>Cannot directly measure in real world</b></em><br><b>Phase 2: Learning to Walk with Egocentric Depth</b> — <em><b>Regress</b> · <b>Copy and Freeze</b></em><br><b>Deployment Policy</b> — <em>Egocentric Depth → d<sub>t</sub> RNN ; o<sub>t</sub> → o<sub>t</sub> RNN → MLP → a<sub>t</sub></em>", "one": "<b>结构和 RMA 一模一样，只是「特权信息」从物理参数换成了完美的地形高度。这说明那个两阶段套路不是为某个问题定制的——它是一个可以反复用的模板。</b>", "pts": ["<b>先把<b>相同</b>的部分认出来，这比记细节重要：<b>这就是 L17.a p19 那个两阶段，原样再用一遍</b>。</b> <span class='k'><b>Phase 1</b>：用只有仿真里才有的信息训一个强教师；<b>Phase 2</b>：冻住主干，用 DAgger 训一个学生，从<b>可观测</b>的东西里把那份特权信息回归出来</span>。", "<b>⇒ 变的只有「特权信息是什么」：<b>RMA 那边是物理参数（摩擦、质量…），这边是 <b>scandots</b>——地形高度的采样点</b>。</b> <span class='w'>而且讲者强调这一阶段的 scandots 是<b>完美</b>的：「This is <b>perfect</b> terrain height that we feed into the model. <b>We don't add any noise to it.</b>」</span>", "<b>⚠ 「不加噪声」这个选择值得停一下，因为它和常见直觉相反。</b> <span class='k'>很多人会想「反正真实世界有噪声，不如训练时就加上去」；而这里<b>故意不加</b>——因为第一阶段的任务<b>不是</b>学会对付噪声，而是<b>在理想信息下学会走路</b></span>。<b>⇒ 对付噪声是第二阶段学生的事，而学生面对的是<b>真实的深度图</b>，不是人造噪声。</b>", "<b>⇒ 这也呼应了 p42–p44：<b>人造的地图噪声和真实的感知噪声不是一回事</b>，照着前者训练出来的鲁棒性未必管用。</b>", "<b>第一阶段为什么能训得动？因为它<b>不用渲染图像</b>。</b> <span class='w'>讲稿：「It is <b>much faster to train</b> because you <b>don't need to render any perception inputs</b>」</span>；<b>而反过来，「if you try training the second phase <b>directly</b> it would be an <b>order of magnitude slower</b> because <b>rendering depth takes a lot of time</b>」。</b>", "<b>⇒ 所以两阶段在这里有一个<b>非常具体</b>的理由：<b>把昂贵的渲染从强化学习的循环里挪出去</b>。</b> <span class='k'>RL 要几亿次交互，渲染不起；而监督蒸馏需要的样本少得多，渲染得起</span>。<b>⇒ 这比 RMA 那边「限制学生能看到的东西」又多了一条实打实的工程理由。</b>", "<b>p48 的训练地形覆盖了五类：<b>Rough Flat · Slopes · Gaps · Stairs · Stepping Stones</b>。</b> <span class='w'>⇒ 而目标还是老样子：<b>一个</b>策略走遍全部。</span>", "⚠️ <b>而这里有一个幻灯上没强调、却非常值得注意的变化：<b>奖励从十条减到了两条</b>。</b> <span class='k'>讲稿原话：「We use <b>PPO</b> in simulation. This time we use <b>Isaac Gym</b>. And the rewards are to <b>track a target velocity</b> and then <b>minimize energy</b>」——<b>就这两条</b></span>。<b>⇒ 对比 L17.a p16 那张 RMA 的奖励表：<b>十条</b>，而讲者自己说「不太优雅」、权重「没有好办法」调。</b>", "<b>⇒ 这是整讲里一个真实的<b>进步</b>，而且方向正是 p78 终章主张的那个方向（<b>少塑形、多搜索</b>）。</b> <span class='w'>⚠ 它也部分化解了我在 p78 指出的那处张力：<b>讲者主张稀疏奖励，而他<b>后一篇</b>工作确实比<b>前一篇</b>少用了八条塑形项</b>。</span><b>⇒ 所以那处张力更准确的说法是：<b>十条奖励是 2021 年那篇的做法，而这个领域在往更少的方向走</b>——而不是「他说一套做一套」。</b>", "<b>⇒ 为什么能减掉八条？一个合理的推测是<b>更换了仿真器</b>。</b> <span class='k'>RMA 用的是另一套，这篇用 <b>Isaac Gym</b>（GPU 并行，吞吐量高出一两个数量级）。<b>⇒ 而塑形奖励的作用本来就是「帮搜索更快找到解」；当你能跑的交互多了两个数量级，很多塑形项就不再必要了</b></span>。<b>⚠ 这个推测讲者没说，但它和 the bitter lesson（p76）正好同向：<b>算力上来了，手工先验就能撤掉</b>。</b>", "<b>⇒ 对读者的实际用处：<b>看到一篇论文有十几个奖励项时，先问它是哪一年的、用的什么仿真器</b>。</b> <span class='w'>很多塑形项是<b>算力受限时代的产物</b>，照抄到今天的设置里可能纯属负担，甚至把搜索框死在一个次优解附近。</span>", "<b>p50 把坎摆明：<b>scandots 与 [friction, payload…] 在真实世界里 <em>Cannot directly measure</em></b>。</b> <span class='k'>⇒ 和 p17 那一页是同一个困境，只是这次缺的东西更多——既缺物理参数，也缺地形高度。</span>", "<b>p51 的 Phase 2 因此要同时回归<b>两样</b>东西：从第一视角深度回归出 scandots 的编码，以及 extrinsics。</b> <span class='w'>幻灯标了 <b>Copy and Freeze</b>——MLP（动作头）从第一阶段原样搬过来、冻住</span>。", "<b>p52 的部署策略里有一个新零件：<b>两个 RNN</b>（一个吃深度 <code>d_t</code>，一个吃本体观测 <code>o_t</code>）。</b> <span class='k'>讲稿解释用 RNN 是为了「give you a slightly <b>longer context</b>」</span>。", "⚠️ <b>而讲者对 RNN 的坦白很值得记，因为它既说明了局限也说明了实验的边界：<b>「RNNs… are <b>not known to preserve very long horizon information</b>, which is why most of the community moved to <b>transformers</b>… <b>we did not ablate using a transformer instead</b> for this task to see if that improves performance or not」</b>。</b> <span class='w'>⇒ 「我们没做这个消融」——直接承认了一个没验证的设计选择，这比含糊带过要好。</span>"], "eq": "先认出**相同**的部分（比记细节重要）：\n   **这就是 L17.a p19 那个两阶段，原样再用一遍**\n     Phase 1：用只有仿真才有的信息训一个**强教师**\n     Phase 2：冻住主干，用 **DAgger** 训**学生**，从**可观测**的东西回归出特权信息\n\n⇒ 变的只有「特权信息是什么」：\n   RMA：物理参数（摩擦、质量…）\n   这边：**scandots** —— 地形高度的采样点\n\n   ⚠ 而且 Phase 1 的 scandots 是**完美**的：\n     「This is **perfect** terrain height that we feed into the model.\n       **We don't add any noise to it.**」\n\n   「不加噪声」与常见直觉相反，值得停一下：\n     很多人想「反正真实世界有噪声，训练时就加上去」\n     这里**故意不加** —— 第一阶段的任务**不是**学会对付噪声，\n     而是**在理想信息下学会走路**\n     对付噪声是第二阶段学生的事，而学生面对的是**真实深度图**，不是人造噪声\n   ⇒ 呼应 p42–p44：**人造的地图噪声和真实的感知噪声不是一回事**\n\n第一阶段为什么训得动：**不用渲染图像**\n   「It is **much faster to train** because you **don't need to render\n     any perception inputs**」\n   反过来：「if you try training the second phase **directly** it would be an\n     **order of magnitude slower** because **rendering depth takes a lot of time**」\n\n   ⇒ 两阶段在这里有一个**非常具体**的理由：\n     **把昂贵的渲染从强化学习的循环里挪出去**\n     RL 要几亿次交互，渲染不起；监督蒸馏样本少得多，渲染得起\n   ⇒ 比 RMA 那边「限制学生能看到的东西」又多了一条工程理由\n\np48 训练地形五类：**Rough Flat · Slopes · Gaps · Stairs · Stepping Stones**\n   目标还是：**一个**策略走遍全部\n\np50 把坎摆明：scandots 与 [friction, payload…]\n   **Cannot directly measure in real world**\n   ⇒ 与 p17 同一个困境，只是这次缺的更多（物理参数 + 地形高度）\n\np51 Phase 2 要同时回归**两样**：从第一视角深度回归出 scandots 的编码 + extrinsics\n   MLP（动作头）**Copy and Freeze**，从第一阶段原样搬过来\n\np52 部署策略有个新零件：**两个 RNN**（一个吃深度 d_t，一个吃本体观测 o_t）\n   用 RNN 是为了「give you a slightly **longer context**」\n\n⚠ 讲者对 RNN 的坦白（既说明局限也说明实验边界）：\n   「RNNs… are **not known to preserve very long horizon information**,\n     which is why most of the community moved to **transformers**…\n     **we did not ablate using a transformer instead** for this task」\n   ⇒ 「我们没做这个消融」—— 直接承认一个没验证的设计选择，比含糊带过好", "tbl": {"head": ["", "RMA（L17.a）", "视觉版（本页）"], "rows": [["特权信息是什么", "<b>物理参数（摩擦、质量…）</b>", "<b>scandots（完美地形高度）</b>"], ["学生看什么", "<b>50 步本体感觉历史</b>", "<b>第一视角深度 + 本体历史</b>"], ["蒸馏方式", "<b>DAgger</b>", "<b>DAgger</b>"], ["动作头", "<b>复制并冻结</b>", "<b>Copy and Freeze</b>"], ["⚠ 分两阶段的额外理由", "限制学生能看到的东西", "<b>把昂贵的渲染挪出 RL 循环</b>"], ["⚠ 没验证的选择", "—", "<b>没做 transformer 的消融</b>"]]}, "say": "原话（第一阶段喂的是完美地形高度，不加噪声；而且训得快）：<em>“in the first phase of training it's the same as before with this additional terrain height information. <b>We don't add any noise to it. This is perfect terrain height that we feed into the model</b> and then we encode all of that, give it to an MLP and then train this whole system with reinforcement learning. <b>It is much faster to train because you don't need to render any perception inputs.</b> The recipe is the same as before. We use PPO in simulation. This time we use Isaac gym.”</em><br><br>原话（为什么不能直接训第二阶段：渲染太慢）：<em>“here if you try training the second phase directly <b>it would be an order of magnitude slower because rendering depth takes a lot of time</b>. So this gives you a significant speed up over how to train it and lets you deploy it in the real world as well very robustly.”</em><br><br>原话（用 RNN 的理由，以及「我们没做 transformer 的消融」）：<em>“the one change that we've made here is the use of <b>RNN</b>. So we use RNN so they can give you a <b>slightly longer context</b>. So RNNs are recurrent neural networks which integrate information over time but <b>they're not known to preserve very long horizon information which is why most of the community moved to transformers</b> when they wanted to do very long sequence modeling. We used RNN which gives a good enough context to the model but <b>we did not ablate using a transformer instead for this task to see if that improves performance or not</b>.”</em>", "res": {"tag": "推断", "v": "⚠️ <b>这几页藏着这一讲对你<b>最可操作</b>的一条：<b>把昂贵的那一步从搜索/训练的循环里挪出去</b>。</b><br><span class='k'>讲者的原话是：第一阶段「<b>much faster to train because you don't need to render any perception inputs</b>」，而如果直接训第二阶段，「it would be <b>an order of magnitude slower</b> because rendering depth takes a lot of time」</span>。<br><b>⇒ 做法的本质是：<b>RL 需要上亿次交互，所以 RL 阶段不能碰昂贵的东西；而监督蒸馏只需要少得多的样本，所以昂贵的东西放到蒸馏阶段</b>。</b><br><b>⇒ 你的昂贵那一步是什么？<b>跑一遍完整的工作流并判对错</b>。而 AFlow 式搜索的成本几乎全在这里 —— 每评估一个候选都要真跑。</b><br><b>⇒ 于是对应的结构就浮出来了：<b>把「真跑一遍」从搜索内循环里挪出去</b>。</b> <span class='w'>具体可以是：① 先用一个<b>缓存/代理</b>评估候选（对一个固定的小子集预先跑出所有档位组合的结果，之后查表而不是真跑）；② 搜索在表上进行；③ 只对最终少数候选做完整评估</span>。<b>⚠ 而这正是「把渲染挪出 RL 循环」的同构做法：<b>预算从「候选数 × 完整评估」变成「一次性建表 + 候选数 × 查表」</b>。</b><br><b>⇒ 这件事值得单独量化并报出来：<b>搜索成本降低了多少倍</b>。</b> <span class='k'>讲者报的是「一个数量级」。如果你能报出一个类似的倍数，那本身就是一个贡献点，而且它<b>与你的主结果互不依赖</b>（即使节点级路由的收益不大，搜索加速仍然成立）。</span><br><b>⚠ 第二条是关于「<b>不给第一阶段加噪声</b>」的：<b>别手软地削弱你的教师</b>。</b> <span class='w'>常见直觉是「反正线上有噪声，训练时就加上」；而这里<b>故意给完美的地形高度</b>，因为第一阶段的任务<b>不是</b>学会应对噪声，而是<b>在信息齐全的条件下学出最好的行为</b>，噪声留给第二阶段去对付</span>。<b>⇒ 你的对应：<b>第一阶段算理想档位时就用最可靠的判据（标准答案、多次采样投票），不要提前模拟线上的不确定性</b>。把不确定性全部压到第二阶段。</b><br><b>⇒ 最后一条是关于<b>写作</b>的：讲者明说「<b>we did not ablate using a transformer</b>」。</b> <span class='k'>⇒ 把你<b>没做</b>的消融明确列出来（「我们没有比较 X 与 Y，因为 Z」）。<b>这比留给审稿人发现要好得多，而且通常只需要一句话。</b></span>", "ref": "本讲 p45–p52（逐字核对）· 讲稿（渲染挪出循环、一个数量级、不加噪声、没做 transformer 消融）· 简报 §1 §2 §4b（已核）"}},
{"r": [53, 58], "t": "涌现行为：因为没规定步态，它自己学会了把腿张开上楼", "star": 3, "quote": "<b>Stairs are designed for humans</b> — <em><b>26cm / 17cm</b></em> &nbsp;·&nbsp; <b>Stairs are challenging for small robots</b><br><b>No predefined gait => emergent hip abduction</b> &nbsp;·&nbsp; <b>Emergent footstep planning</b> &nbsp;·&nbsp; <b>Map Free, Gait Free</b><br><em>Live demo at New Zealand (CoRL 2022) &nbsp;·&nbsp; Live demo at New Orleans</em>", "one": "<b>楼梯是按人的尺寸造的，而这只机器人矮到台阶几乎和它一样高。因为没人规定它该怎么迈腿，它自己找出了一个人不会想到的办法：把腿向侧面张开。</b>", "pts": ["<b>先看那两个数把问题的难度钉住：<b>台阶 26 cm 宽、17 cm 高</b>，而这只机器人很矮。</b> <span class='k'>讲稿：「if you see, the height of the step is <b>almost as high as the robot</b>」</span>。<b>⇒ 换算成人：相当于你要爬一段每级都到你大腿根的台阶。</b>", "<b>讲者还点出一个下楼时特有的困难，而它纯粹是尺寸带来的。</b> <span class='w'>「the amount of tilt you would see in a <b>taller</b> robot would be much smaller… whereas for a <b>small</b> robot, it needs to use <b>majority of its leg</b> and the discrepancy will be much higher <b>just because the legs are smaller</b>」</span>。<b>⇒ 腿短 ⇒ 下一级台阶要用掉整条腿的行程 ⇒ 姿态变化剧烈。</b>", "⚠️ <b>而解法是<b>涌现</b>出来的，不是设计的：<b>髋关节外展</b>——把腿向<b>侧面</b>张开再抬上去。</b> <span class='k'>讲稿：「what it learns is it learns to <b>move the leg out sideways</b> to climb all of these stairs」</span>。<b>⇒ 侧向张开可以绕开「正前方抬不了那么高」的限制，这是一个人类不会用、但对这个身体合理的办法。</b>", "<b>⇒ 而它之所以可能，是因为<b>什么都没规定</b>：<b>「this is possible because we <b>don't use any predefined gait or foot motions</b> or any of that. And we let it be learned using reinforcement learning <b>through search</b>」</b>。</b> <span class='w'>⇒ 「through search」这三个字呼应了 p3 对 AlphaGo 的评价（「发现人没见过的新行为」），也呼应 p78 那句 <b>sparse reward + lots of search</b>。</span>", "<b>第二个涌现行为是<b>落脚规划</b>，而它的判据很具体：<b>只在需要时才迈步</b>。</b> <span class='k'>讲稿：「this footstep planning is also <b>emergent</b>. So <b>it only takes a step when it needs to</b>. It <b>doesn't constantly move its feet</b>, [as] if we had a predefined gait of any sort」</span>。<b>⇒ 预设步态的机器人会按固定节拍迈腿；而这个会<b>停下来等</b>，直到有必要动。</b>", "<b>⇒ p57 那句 <b><em>Map Free, Gait Free</em></b> 把两件事并列了：<b>既没有中间地图，也没有预设步态</b>。</b> <span class='w'>两者是同一个哲学的两面——<b>别替策略做它自己能学会的决定</b>。</span>", "⚠️ <b>讲稿里还有一个很值得记的观察，它关于<b>重试</b>：<b>后一次尝试比前一次更合理</b>。</b> <span class='k'>原话：「<b>it doesn't always get everything in one shot. It sometimes needs to try and retry, and the retries make more sense than the previous try.</b> That is an example of <b>learning within the context</b> of what is fed into the model」</span>。", "<b>⇒ 这一条很要紧，因为它是<b>上下文学习在真机上的证据</b>：权重没有变，但第二次尝试确实用上了第一次的信息。</b> <span class='w'>⇒ 这和 L16 p43 那条「没有上下文就会一直往前撞」正好是正反两面——<b>有上下文的重试会改进，无上下文的重试只是重复</b>。</span>", "<b>p58 两场现场演示（CoRL 2022，新西兰与新奥尔良）值得单记，因为现场演示的说服力和视频不同。</b> <span class='k'>讲稿还提了一个瑕疵：有一场里「the right foot padding just <b>came off</b> and started <b>limping</b>, <b>but it continued to do the full demo</b>」</span>。<b>⇒ 脚垫掉了、瘸了，但把整场演示走完了——这种意外反而是鲁棒性最好的证据。</b>", "⚠️ <b>最后把「<b>涌现</b>」这个词的含义钉清楚，因为它在文献里被用得很滥，而这里它有<b>精确</b>的意思。</b> <span class='k'>这两个行为之所以算涌现，是因为它们<b>三处都没出现过</b>：<b>① 不在奖励里</b>（奖励只有跟踪速度和省能量，没有一项说「把腿向外张开」）；<b>② 不在动作参数化里</b>（没有预设步态、没有预设落脚相位）；<b>③ 不在训练数据里</b>（没有示范，是纯 RL 搜出来的）</span>。", "<b>⇒ 所以判断一个行为算不算涌现，就问这三件事：<b>它被奖励了吗？它被编码进动作空间了吗？它被示范过吗？</b></b> <span class='w'>⚠ 三个都否，才叫涌现。<b>⇒ 而文献里大量「涌现」其实是第二类：行为被写进了动作参数化（比如一个「跨步」原语），然后作者报告模型「学会了跨步」。</b></span>", "<b>⇒ 这个标准对你读论文有直接用处，而对你写论文的用处更大：<b>如果你要声称什么东西是涌现的，先自己过这三问</b>。</b> <span class='k'>⇒ 比如「我们的路由策略学会了在数学题上升档」—— 如果你的奖励里有 Acc，而数学题恰好是 Acc 最敏感的一类，那这不是涌现，<b>这就是奖励在起作用</b>，照实说反而更可信。</span>"], "eq": "两个数钉住难度：**台阶 26 cm 宽、17 cm 高**，而机器人很矮\n   「the height of the step is **almost as high as the robot**」\n   ⇒ 换算成人：每级台阶都到你大腿根\n\n下楼时特有的困难（纯粹由尺寸带来）：\n   「the amount of tilt in a **taller** robot would be much smaller…\n     for a **small** robot, it needs to use **majority of its leg** and the\n     discrepancy will be much higher **just because the legs are smaller**」\n   ⇒ 腿短 ⇒ 下一级要用掉整条腿的行程 ⇒ 姿态变化剧烈\n\n⚠ 解法是**涌现**出来的，不是设计的：**髋关节外展**\n   「what it learns is it learns to **move the leg out sideways** to climb stairs」\n   ⇒ 侧向张开绕开了「正前方抬不了那么高」的限制\n     —— 一个人类不会用、但对这个身体合理的办法\n\n⇒ 之所以可能，是因为**什么都没规定**：\n   「this is possible because we **don't use any predefined gait or foot motions**…\n     And we let it be learned using reinforcement learning **through search**」\n   ⇒ 「through search」呼应 p3 对 AlphaGo 的评价（发现人没见过的新行为）\n     也呼应 p78 那句 **sparse reward + lots of search**\n\n第二个涌现行为：**落脚规划**，判据很具体 —— **只在需要时才迈步**\n   「this footstep planning is also **emergent**. So **it only takes a step when\n     it needs to**. It **doesn't constantly move its feet**」\n   ⇒ 预设步态的机器人按固定节拍迈腿；这个会**停下来等**，直到有必要动\n\np57 **Map Free, Gait Free** 把两件事并列：\n   **既没有中间地图，也没有预设步态**\n   ⇒ 同一哲学的两面：**别替策略做它自己能学会的决定**\n\n⚠ 一个很值得记的观察（关于**重试**）：**后一次尝试比前一次更合理**\n   「**it doesn't always get everything in one shot. It sometimes needs to try\n     and retry, and the retries make more sense than the previous try.**\n     That is an example of **learning within the context** of what is fed into the model」\n\n   ⇒ 这是**上下文学习在真机上的证据**：\n     权重没变，但第二次尝试确实用上了第一次的信息\n   ⇒ 与 L16 p43「没有上下文就会一直往前撞」正好是正反两面：\n     **有上下文的重试会改进，无上下文的重试只是重复**\n\np58 两场现场演示（CoRL 2022，新西兰与新奥尔良）\n   讲稿提到的瑕疵：有一场里「the right foot padding just **came off** and started\n     **limping**, **but it continued to do the full demo**」\n   ⇒ 脚垫掉了、瘸了，但把整场走完 —— 这种意外反而是鲁棒性最好的证据", "tbl": {"head": ["两个涌现行为", "表现", "为什么可能"], "rows": [["<b>髋关节外展</b>", "<b>把腿向侧面张开再抬上去</b>", "<b>没有预设步态</b>"], ["<b>落脚规划</b>", "<b>只在需要时才迈步</b>", "<b>没有固定节拍</b>"], ["<b>⚠ 有上下文的重试</b>", "<b>后一次比前一次更合理</b>", "<b>权重没变，用上了前一次的信息</b>"], ["p57 的口号", "<b>Map Free, Gait Free</b>", "<b>别替策略做它能学会的决定</b>"]]}, "say": "原话（因为没规定步态，才涌现出侧向张腿）：<em>“I think stairs are designed for humans and this robot is extremely short. So relative to the height of the robot these stairs are tall. So there isn't enough clearance under the robot to just raise its leg and then take the step… So, what it learns is <b>it learns to move the leg out sideways to climb all of these stairs. And this is possible because we don't use any predefined gait or foot motions or any of that. And we let it be learned using reinforcement learning through search.</b>”</em><br><br>原话（落脚规划也是涌现的：只在需要时才迈步）：<em>“And <b>this footstep planning is also emergent. So it only takes a step when it needs to. It doesn't constantly move its feet</b> [as] if we had a predefined gait of any sort. And we see that it's actually quite smooth and seems to work <b>with intention and precision</b>.”</em><br><br>原话（重试比前一次更合理——上下文学习的真机证据）：<em>“one thing to note here is that <b>it doesn't always get everything in one shot. It sometimes needs to try and retry and the retries make more sense than the previous try. That is an example of learning within the context of what is fed into the model.</b>”</em>", "res": {"tag": "推断", "v": "<b>那条「<b>后一次尝试比前一次更合理</b>」的观察，是这一讲对你最直接可用的一条，因为它把 L16 那个「一直往前撞」的反例补成了正例。</b><br><span class='k'>讲者说的是：机器人常常一次过不去，<b>但它的重试不是重复</b>——第二次的动作比第一次更合理，而且权重<b>完全没有变</b>。他把这叫做「learning within the context」</span>。<br><b>⇒ 对照 L16 p43 那个反例：没有上下文的腿式机器人「<b>不知道自己刚才已经试过往前走了</b>」，于是一直往前撞。</b><b>两处合起来给了你一个很干净的判据：<b>重试要不要带上下文，决定了它是「改进」还是「重复」</b>。</b><br><b>⇒ 落到你的工作流上，这条是可以立刻执行的：<b>重试时必须把「上一次试了什么、失败在哪」放进上下文</b>。</b> <span class='w'>而且注意这不需要改权重、不需要训练——<b>它纯粹是一个 prompt 构造问题</b></span>。<b>⇒ 成本接近零，而收益是把「无效重试」变成「有效重试」。</b><br><b>⇒ 而它对你的 <code>G</code> 有一个双重效果，值得分开想：</b><br><span class='k'><b>① 提高 Acc</b>（重试更可能成功）；<b>② 降低 Cost</b>（更少的重试次数就能成功）</span>。<b>⚠ 注意这两个方向<b>同向</b>——这在你的问题里不常见，因为 Acc 和 Cost 通常是此消彼长的。<b>凡是能同时改善两者的改动，都应该优先做，而且它们不需要做 λ 扫描就知道是赚的。</b></b><br><b>⇒ 建议把这类改动单独归一类并在论文里点明：<b>「帕累托改进」</b>（同时提升 Acc 与降低 Cost），与「权衡型」改动（升档换准确率）分开报。</b> <span class='w'>审稿人会很欣赏这个区分，因为它说明你清楚自己每一步在换什么。</span><br><b>⚠ 另外「没有预设步态所以涌现出侧向张腿」那条，对你有一个克制的提醒。</b> <span class='k'>讲者的论点是「别替策略做它自己能学会的决定」；而你的工作流结构（节点怎么分、谁连谁）<b>是人定的</b>，不是搜出来的</span>。<b>⇒ 这是你方法的一个<b>已知限制</b>（L15 主线卡那条先有鸡先有蛋也指向它），而这一页提醒你：<b>人定的结构可能恰好挡住了某个更好的解</b>，就像预设步态会挡住侧向张腿。</b><b>⇒ 诚实的处理是在限制一节写明：我们固定工作流结构，而结构本身的搜索留作未来工作。</b>", "ref": "本讲 p55–p58（逐字核对）· 讲稿（重试更合理、没有预设步态）· L16 p43 · L15 p17 主线卡 · 简报 §2 §4b（已核）"}, "link": {"t": "你学过的对应：本课 L16 精读（p43）—— 那里是反例「没有上下文就会一直往前撞」，这里是正例「带上下文的重试一次比一次合理」，两处合起来正好是一条判据", "href": "L16-精读.html"}},
{"r": [59, 60], "t": "对比表：在楼梯上，瞎走比用噪声地图强一倍", "star": 3, "quote": "<b>Performance is better without maps</b> — <em>Average Distance</em><br><em>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <b>Blind</b> &nbsp; <b>Map Based</b> &nbsp; <b>Ours</b><br>Slopes &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 34.72 &nbsp;&nbsp;&nbsp; 36.14 &nbsp;&nbsp;&nbsp;&nbsp; <b>43.98</b><br>Stepping Stones &nbsp; 1.02 &nbsp;&nbsp;&nbsp;&nbsp; 1.09 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <b>18.83</b><br>Stairs &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <b>16.64</b> &nbsp;&nbsp;&nbsp; <b>6.74</b> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <b>31.24</b><br>Discrete Obstacles &nbsp; 32.41 &nbsp;&nbsp; 29.08 &nbsp;&nbsp;&nbsp;&nbsp; <b>40.13</b></em><br><em><b>Performance gap is larger on challenging terrains</b></em>", "one": "<b>四行数字里最该盯的是楼梯那一行：16.64 / 6.74 / 31.24。用了噪声地图的那一版，比什么都看不见的瞎走还差一倍多——多给的信息不是没用，是有害。</b>", "pts": ["<b>三列分别是：<b>Blind</b>（完全不用视觉，就是前半讲那个 RMA 式的盲策略）· <b>Map Based</b>（建地形图再喂给控制器，且训练时也加了噪声）· <b>Ours</b>（深度直接进策略）。</b> <span class='k'>指标是 <b>Average Distance</b>（平均走出的距离），越大越好。</span>", "<b>先读最容易的一行：<b>踏脚石</b>——<b>1.02 / 1.09 / 18.83</b>。</b> <span class='w'>盲策略和地图法<b>都基本走不动</b>（1 左右），而直接用深度的走出了 <b>18.83</b>，差了将近二十倍</span>。<b>⇒ 这印证了 p39 的理由一：<b>踏脚石是「非看不可」的情形</b>，盲策略在这里没有任何办法。</b>", "⚠️ <b>而最值得盯的是<b>楼梯</b>那一行：<b>Blind 16.64 · Map Based 6.74 · Ours 31.24</b>。</b> <span class='k'><b>用了地图的那一版，比什么都看不见的瞎走还差一倍多</b></span>。", "<b>⇒ 讲者把这件事直接说了出来，而且用词很直白：<b>「for stairs <b>it's better to be blind</b> and just learn to put your steps blindly <b>than to use a map which is noisy</b> and which gives you an <b>inaccurate estimate of where you might have to place your foot</b>」</b>。</b>", "<b>⇒ 这是整张表最有信息量的一格，因为它说明：<b>多给的信息不是「没用」，而是「有害」</b>。</b> <span class='w'>一个带噪的落脚点估计，会把策略<b>骗到</b>错误的地方去踩；而完全没有估计时，策略至少会老老实实地用本体感觉去试探</span>。<b>⇒ <b>错误的信息比没有信息更糟</b>，这是一条很硬的经验。</b>", "<b>⇒ 而这正好是 p42–p44 那个论证的<b>实证兑现</b>：<b>「建图」这一步丢了信息又加了噪声，于是整条路线不如不走</b>。</b> <span class='k'>⇒ 加上 p37 的系统辨识，<b>同一条教训在这一讲里有了两处独立的实验证据</b>。</span>", "<b>再看<b>坡</b>那一行：<b>34.72 / 36.14 / 43.98</b>——三者差距最小。</b> <span class='w'>⇒ 因为坡是最简单的地形，<b>盲策略本来就够用</b>，视觉带来的边际收益小</span>。", "<b>⇒ 幻灯自己把这个规律写出来了：<b><em>Performance gap is larger on challenging terrains</em></b>。</b> <span class='k'>⇒ 这和 L16 p24 那条读表经验是同一个：<b>在简单任务上分不出高下，不等于方法之间没有差别</b></span>。<b>⇒ 反过来说：<b>如果你的基准全是简单任务，你会得出「几种方法差不多」的错误结论</b>。</b>", "<b>⚠ 读这张表时还要留意一个公平性问题：<b>Map Based 那一版的噪声是怎么加的</b>。</b> <span class='w'>讲稿说：「if we sample from the <b>same distribution that other works have done</b>, we see that the sim performance goes down significantly」</span>。<b>⇒ 即噪声模型取自<b>已有文献</b>，而不是作者自己编的——这一点让对比更可信，但也意味着结论依赖于那个噪声模型的真实性。</b>", "<b>讲者给出的总结是一个关于<b>瓶颈位置</b>的判断：<b>「you need the final action head to know <b>whatever it needs to from perception directly</b>, <b>without adding any noise or any bottlenecks</b>, for it to work well」</b>。</b> <span class='k'>⇒ 注意 <b>bottleneck</b> 这个词：中间表示不只是加噪声，它还是一个<b>信息瓶颈</b>——能通过的只有被编码进去的那部分。</span>"], "eq": "三列：\n   **Blind**（完全不用视觉，前半讲那个 RMA 式盲策略）\n   **Map Based**（建地形图再喂控制器，训练时也加了噪声）\n   **Ours**（深度直接进策略）\n   指标 **Average Distance**（平均走出的距离），越大越好\n\n**踏脚石**：1.02 / 1.09 / **18.83**\n   盲策略和地图法**都基本走不动**（1 左右），直接用深度走出近二十倍\n   ⇒ 印证 p39 理由一：**踏脚石是「非看不可」的情形**\n\n⚠⚠ **楼梯**（最该盯的一行）：**Blind 16.64 · Map Based 6.74 · Ours 31.24**\n   **用了地图的那一版，比什么都看不见的瞎走还差一倍多**\n\n   讲者直说：「for stairs **it's better to be blind** and just learn to put your\n     steps blindly **than to use a map which is noisy** and which gives you an\n     **inaccurate estimate of where you might have to place your foot**」\n\n   ⇒ **多给的信息不是「没用」，而是「有害」**\n     带噪的落脚点估计会把策略**骗到**错误的地方去踩\n     而完全没有估计时，策略至少会老老实实用本体感觉试探\n   ⇒ **错误的信息比没有信息更糟** —— 一条很硬的经验\n\n   ⇒ 这正是 p42–p44 那个论证的**实证兑现**\n     加上 p37 的系统辨识，**同一条教训在这一讲有两处独立实验证据**\n\n**坡**：34.72 / 36.14 / 43.98 —— 三者差距最小\n   因为坡最简单，**盲策略本来就够用**，视觉边际收益小\n\n⇒ 幻灯自己写出了规律：**Performance gap is larger on challenging terrains**\n   与 L16 p24 那条读表经验同一个：\n   **在简单任务上分不出高下，不等于方法之间没有差别**\n   反过来：**如果基准全是简单任务，你会得出「几种方法差不多」的错误结论**\n\n⚠ 公平性：**Map Based 那一版的噪声是怎么加的**\n   「if we sample from the **same distribution that other works have done**,\n     we see that the sim performance goes down significantly」\n   ⇒ 噪声模型取自**已有文献**而非作者自编 —— 让对比更可信\n     但也意味着结论依赖那个噪声模型的真实性\n\n讲者的总结（关于**瓶颈位置**）：\n   「you need the final action head to know **whatever it needs to from\n     perception directly**, **without adding any noise or any bottlenecks**」\n   ⚠ 注意 **bottleneck** 这个词：中间表示不只是加噪声，\n     它还是一个**信息瓶颈** —— 能通过的只有被编码进去的那部分", "tbl": {"head": ["地形", "Blind", "Map Based", "Ours"], "rows": [["Slopes（最简单）", "34.72", "36.14", "<b>43.98</b>"], ["Stepping Stones", "<span class='w'>1.02</span>", "<span class='w'>1.09</span>", "<b>18.83</b>"], ["<b>Stairs</b>", "<b>16.64</b>", "<span class='w'>⚠ 6.74</span>", "<b>31.24</b>"], ["Discrete Obstacles", "32.41", "29.08", "<b>40.13</b>"], ["<b>⚠ 规律</b>", "—", "<b>越难差距越大</b>", "—"]]}, "say": "原话（楼梯上瞎走比用噪声地图强）：<em>“<b>One interesting thing is for stairs it's better to be blind and just learn to put your steps blindly than to use a map which is noisy and which gives you an inaccurate estimate of where you might have to place your foot.</b>”</em><br><br>原话（简单地形差距小，越难差距越大；以及噪声取自已有文献）：<em>“we see that the gap is not that much for simple terrains like a slope. But the moment we get to more challenging terrains, <b>a map-based method is almost as bad as blind</b>. Because <b>if we sample from the same distribution that other works have done</b>, we see that the sim performance goes down significantly. So <b>you need the final action head to know whatever it needs to from perception directly without adding any noise or any bottlenecks</b> for it to work well in this scenario.”</em>", "res": {"tag": "推断", "v": "<b>楼梯那一格（16.64 vs 6.74）是这一讲最该带走的一个数，因为它把一句软话变成了硬证据：<b>错误的信息比没有信息更糟</b>。</b><br><span class='k'>一个带噪的落脚点估计会<b>主动把策略骗到</b>错误的位置；而完全没有估计时，策略至少会老实地用本体感觉试探</span>。<b>⇒ 这不是「收益为零」，而是<b>负收益</b>。</b><br><b>⇒ 对你最直接的靶子还是那个<b>节点级裁判</b>（我在 L15 主线卡里推荐、在 L17.b 已经加过一次限定的那条）。这一页把限定变成了一个可操作的判据：</b><br><b><b>在把裁判接进决策回路之前，先确认它比「不用裁判」强</b>——而且基线要用<b>真正的</b>不用裁判，不是用一个更差的裁判。</b> <span class='w'>具体做法：三条线对比——① 完全不用节点级信号（只看端到端 <code>G</code>）；② 用裁判打分；③ 用<b>真值</b>（在小规模穷举集上能拿到的那个 oracle 节点级标签）</span>。<br><b>⇒ 这正好对应讲义的 Blind / Map Based / Ours 三列，而且第 ③ 条给了你一个上界：<b>如果连用真值都提升不大，那裁判做得再准也没意义；如果用真值提升很大而用裁判反而变差，那就是楼梯那一格的重演</b>。</b><br><b>⚠ 而讲者那个 <b>bottleneck</b>（信息瓶颈）的用词，提醒了另一个我之前没强调的风险。</b> <span class='k'>中间表示的问题<b>不只是</b>加噪声——它还<b>限制了能通过的信息</b>：只有被编码进去的那部分才能到达下游</span>。<b>⇒ 映射到你这里：如果你把节点的输出压成一个<b>标量</b>质量分，那么「它错在哪里」这个信息就<b>永久丢失</b>了。</b><span class='w'>而「错在格式」与「错在内容」对「该不该升档」的含义完全不同——前者可能改 prompt 就够，后者才需要更强的模型。</span><br><b>⇒ 所以如果要保留节点级信号，<b>别压成一个标量</b>，至少保留一个粗粒度的<b>错误类型</b>。</b> <span class='k'>这个建议的代价几乎为零（裁判本来就要输出理由），而它避免的正是「信息瓶颈」那一类损失。</b><br><b>⚠ 最后那条读表经验也要带走：<b>Performance gap is larger on challenging terrains</b>。</b> <span class='w'>这是 L16 p24 之后<b>第二次</b>撞上它</span>。<b>⇒ 对你：<b>如果你的 benchmark 整体偏易，各配置都接近满分，你会得出「逐节点分配没什么用」的错误结论</b>——而真相可能只是你的测试集分不出高下。<b>这是在设计评估集时就要防的，事后补救不了。</b></b>", "ref": "本讲 p60（逐字核对）· 讲稿（楼梯那一格、bottleneck）· p37 · p42–p44 · L16 p24 · L15 主线卡 · 简报 §4b §4d（已核）"}},
{"r": [61, 67], "t": "手内操作：从「指令与实际的差」里读出接触", "star": 3, "quote": "<b>Application to dexterous manipulation</b> — <em>Qi* et al. <b>In-Hand Object Rotation via Rapid Motor Adaptation</b>. CoRL 2022.</em><br><b>Generalization across Objects with Different Physical Properties</b><br><em><b>Weight</b>: 5 g → 198 g &nbsp;·&nbsp; <b>Coefficient of Friction</b>: Small / Large &nbsp;·&nbsp; <b>Center of Mass</b>: Higher than Finger / Lower than Finger &nbsp;·&nbsp; <b>Shape</b>: Cube / Cup</em><br><b>Proprioceptive history for Contact Detection</b><br><em>Actions vs Joint Position &nbsp;—&nbsp; <b>Joint Position != Action</b>（Pinky Finger in Contact / No Contact on Pinky Finger）</em>", "one": "<b>同一套 RMA 的办法换到手上：在手里转物体，从 5 克的羽毛球到 200 克的冰球。而它判断手里是什么的方式，和腿判断地面是什么一样——看指令和实际之间的那道缝。</b>", "pts": ["<b>任务是<b>在手里转动物体</b>，而这是一个与走路很不一样的问题：<b>接触点多、而且不断在变</b>。</b> <span class='k'>⇒ 但讲者要说明的恰恰是：<b>同一套办法不用改就能搬过来</b></span>。", "<b>泛化的跨度很大，而且是沿着<b>四个独立的物理维度</b>展开的。</b> <span class='w'><b>重量</b>：5 g 到 198 g（<b>差 40 倍</b>）；<b>摩擦</b>：冰球 vs 猕猴桃（一个极滑、一个粗糙）；<b>质心</b>：高于手指 vs 低于手指（后者是因为有重物吊在下面）；<b>形状</b>：立方体 vs 杯子</span>。<b>⇒ 讲稿提到的实物还有纸巾、羽毛球、橘子皮。</b>", "<b>⚠ 而训练方式和前面完全一样：<b>仿真训练、真机零样本</b>。</b> <span class='k'>「this was also trained in simulation, deployed in the real world <b>zero shot</b>」</span>。", "⚠️ <b>p64–p66 是这几页的技术核心，而它给出的是一个<b>很朴素、也很漂亮</b>的信号：<b>指令的关节位置 vs 实际到达的关节位置</b>。</b>", "<b>⇒ 判据只有一句：<b><code>Joint Position != Action</code></b>。</b> <span class='w'>讲稿：「the time when it is <b>not in contact</b> correlates with the bottom part of the graph where <b>they do overlap with each other</b>, and the time when it <b>does make contact</b> is at the top where <b>it's not able to achieve the desired joint position</b> that it is commanding」</span>。", "<b>⇒ 道理很直白：<b>没碰到东西时，你让手指到哪它就到哪；碰到了，它就到不了了</b>。</b> <span class='k'>于是「指令与实际的落差」就是一个<b>免费的接触传感器</b>——不需要任何触觉硬件。</span>", "<b>⇒ 而接触信息又能推出更多东西：<b>「if you can estimate contacts, you can figure out the <b>shape and size</b> of the object」</b>。</b> <span class='w'>⇒ 哪几根手指在什么位置碰到了东西，就勾勒出了物体的轮廓。</span>", "⚠️ <b>⇒ 注意这和 L17.a p18 那个腿的洞察<b>是同一个机制</b>：<b>预期与实测的落差编码了环境</b>。</b> <span class='k'>腿那边是「我让你走你却滑了 ⇒ 地面很滑」；手这边是「我让你弯到这个角度你却弯不过去 ⇒ 那里有个东西」</span>。<b>⇒ 同一个原理，两个完全不同的身体。</b>", "<b>⚠ 但讲者对这个解释加了一个重要限定，不能当成已证实的机制：<b>「<b>since we don't know exactly what the model is doing</b>, <b>one hypothesis</b> is it uses proprioceptive history for contact detection」</b>。</b> <span class='w'>⇒ 这是研究者<b>看图提出的假说</b>，而不是从网络内部验证出来的。和 p32 那条「学出来的 extrinsics 解释不了」是同一种诚实。</span>", "<b>p67 两个真机细节很能说明难度。</b> <span class='k'><b>橘子皮</b>：「if you apply a <b>slightly larger force than necessary</b>, it will <b>completely deform</b>」——力大一点就捏坏了；<b>一个适配器</b>：「has <b>not been seen in training data and simulation</b>. <b>We don't simulate objects to this level of granularity</b>」</span>。<b>⇒ 后一条尤其值得记：<b>仿真里压根没有这种精细的物体，而策略照样处理了</b>——这是泛化而不是记忆。</b>"], "eq": "任务：**在手里转动物体** —— 与走路很不一样（**接触点多、不断在变**）\n   而讲者要说明的恰恰是：**同一套办法不用改就能搬过来**\n\n泛化沿**四个独立物理维度**展开：\n   **重量**：5 g → 198 g（**差 40 倍**）\n   **摩擦**：冰球 vs 猕猴桃（极滑 vs 粗糙）\n   **质心**：高于手指 vs 低于手指（后者因为有重物吊在下面）\n   **形状**：立方体 vs 杯子\n   讲稿提到的实物还有：纸巾、羽毛球、橘子皮\n\n⚠ 训练方式完全一样：**仿真训练、真机零样本**\n\n⚠⚠ **p64–p66 的技术核心**（朴素而漂亮的信号）：\n   **指令的关节位置 vs 实际到达的关节位置**\n   判据一句话：**Joint Position != Action**\n\n   「the time when it is **not in contact** correlates with the bottom part\n     where **they do overlap with each other**, and the time when it\n     **does make contact** is at the top where **it's not able to achieve\n     the desired joint position**」\n\n   ⇒ 道理很直白：**没碰到东西时你让手指到哪它就到哪；碰到了，它就到不了了**\n     于是「指令与实际的落差」就是一个**免费的接触传感器**\n     —— 不需要任何触觉硬件\n\n   ⇒ 接触又能推出更多：\n     「if you can **estimate contacts**, you can figure out the\n       **shape and size** of the object」\n     哪几根手指在什么位置碰到东西，就勾勒出了物体轮廓\n\n⚠⚠ **与 L17.a p18 那个腿的洞察是同一个机制**：\n   **预期与实测的落差编码了环境**\n     腿：我让你走你却滑了 ⇒ 地面很滑\n     手：我让你弯到这个角度你却弯不过去 ⇒ 那里有个东西\n   ⇒ 同一个原理，两个完全不同的身体\n\n⚠ 讲者的限定（不能当成已证实的机制）：\n   「**since we don't know exactly what the model is doing**,\n     **one hypothesis** is it uses proprioceptive history for contact detection」\n   ⇒ 研究者**看图提出的假说**，不是从网络内部验证出来的\n     与 p32「学出来的 extrinsics 解释不了」是同一种诚实\n\np67 两个真机细节（很能说明难度）：\n   **橘子皮**：「if you apply a **slightly larger force than necessary**,\n     it will **completely deform**」—— 力大一点就捏坏了\n   **一个适配器**：「has **not been seen in training data and simulation**.\n     **We don't simulate objects to this level of granularity**」\n   ⇒ 后一条尤其值得记：**仿真里压根没有这种精细物体，而策略照样处理了**\n     —— 这是泛化而不是记忆", "tbl": {"head": ["", "腿（L17.a p18）", "手（本页）"], "rows": [["信号是什么", "<b>指令运动 vs 实际运动</b>", "<b>指令关节位置 vs 实际关节位置</b>"], ["落差意味着", "<b>滑了 / 陷了 / 负重了</b>", "<b>碰到东西了</b>"], ["推出什么", "<b>摩擦、质量、地形</b>", "<b>物体的形状与大小</b>"], ["要额外传感器吗", "<b>不要</b>", "<b>不要（免费的接触传感器）</b>"], ["⚠ 确定吗", "<span class='w'>extrinsics 不可解释</span>", "<span class='w'>⚠ 这只是一个假说</span>"]]}, "say": "原话（接触检测的判据：碰到了就到不了指令位置）：<em>“One hypothesis — since we don't know exactly what the model is doing — is it uses proprioceptive history for contact detection. So if you look at this and if you look at the bottom joint that's what we have plotted. So we have the <b>actions</b> and then we have the <b>joint position which is actually achieved</b>. And if you look at the time when it makes the contact or not, it turns out that <b>the time when it is not in contact correlates with the bottom part of the graph where they do overlap with each other, and the time when it does make contact is at the top of the graph where it's in contact and then it's not able to achieve the desired joint position that it is commanding</b>. And this is enough signal for the network to estimate it. And <b>if you can estimate contacts, you can figure out the shape and size of the object</b>.”</em><br><br>原话（橘子皮与那个仿真里没有的适配器）：<em>“in the center one, this is an <b>orange peel</b>. So <b>if you apply a slightly larger force than necessary, it will completely deform</b>. And on the right is an <b>adapter</b>. This <b>has not been seen in training data and simulation. We don't simulate objects to this level of granularity.</b>”</em>", "res": {"tag": "推断", "v": "<b>这一页给你的是一个<b>找免费信号</b>的方法，而那个方法比它的具体形式更值得学。</b><br><span class='k'>方法是：<b>你发出的指令你是知道的；实际发生了什么你也能观测到；那么两者之差就是一个你本来就拥有、却没在用的信号</b>。腿那边是「我让你走你却滑了 ⇒ 地面很滑」，手这边是「我让你弯到这个角度你却弯不过去 ⇒ 那里有个东西」。<b>两处都不需要加任何传感器。</b></span><br><b>⇒ 那么在你的问题里，「指令」与「实际」各是什么？这个问题值得认真想一遍，因为答案不只一个：</b><br><b>① <b>格式</b>：你要求节点输出 JSON / 要求它只回一个数字 —— 而它<b>没照做</b>。</b> <span class='w'>格式违规是一个<b>零成本、强相关</b>的信号：小模型在它吃不住的任务上，第一个崩的往往是格式。<b>⇒ 而你本来就要解析输出，所以这个信号你已经在采集了，只是扔掉了。</b></span><br><b>② <b>长度</b>：你给了一个预期长度（few-shot 示例的长度就隐含了它）—— 而实际输出长得多或短得多。</b><br><b>③ <b>自洽</b>：同一个节点采两次，两次答得不一样。</b> <span class='k'>这一条要花钱（多采一次），但它是最直接的「这个档位撑不住」的证据，而且<b>可以只在可疑的节点上采</b>。</span><br><b>④ <b>下游的反应</b>：后一个节点触发了重试、或者它的输出里出现了「信息不足」这类措辞。</b><br><b>⇒ 这四样的共同点，正是这一页的要点：<b>它们都不是「预测难度」，而是「观测到了不一致」</b>。</b><span class='w'>⚠ 而这正好避开了 p37 那个陷阱 —— <b>不要去解「这条 query 多难」这个更难的问题，去看「有没有迹象说明现在不对劲」</b>。</span><br><b>⚠ 但这一页也给了一个必须照抄的限定：<b>讲者说这只是 one hypothesis，因为「我们并不确切知道模型在做什么」</b>。</b> <span class='k'>⇒ 所以你报这些信号时，<b>报相关性，不要宣称机制</b>：「格式违规率与降档失败率相关（<code>r</code> = …）」是可以说的；「小模型因为能力不足所以格式崩了」是一个<b>你没验证过</b>的因果故事。</b></span><br><b>⇒ 顺带，那个「仿真里压根没有这种精细物体，而策略照样处理了」的细节对你有一条安慰：<b>泛化到没见过的输入是可能的，而证明它的办法就是故意在测试集里放训练分布里没有的东西</b>。</b> <span class='w'>⇒ 你的版本：留出一类<b>训练时完全没出现过</b>的任务类型，单独报它的结果。<b>这比在同分布测试集上多刷一个点有说服力得多。</b></span>", "ref": "本讲 p61–p67（逐字核对）· 讲稿（one hypothesis、橘子皮与适配器）· L17.a p18 · p37 · 简报 §1 §2 §4b（已核）"}},
{"r": [68, 70], "t": "无人机：同一套权重飞两台差四倍重的机器", "star": 2, "quote": "<b>Application to drone flight</b>", "one": "<b>第三个应用，而这次跨度最大：同一套权重同时控制两台无人机，上面那台重四倍、臂长三倍。而它直接控制每个螺旋桨的转速，没有任何中间抽象。</b>", "pts": ["<b>这几页只有视频没有文字，但讲稿把数字给全了，而且这些数字是整讲泛化跨度最大的一组。</b> <span class='k'>「the same policy controlling the drone at the top and the bottom. So <b>the same weights</b> which tries to estimate the <b>mass and arm length</b>… The top drone is <b>four times heavier</b> than the one at the bottom. And the <b>arm length is also three times</b>」</span>。", "<b>⇒ 四倍质量、三倍臂长，而且<b>一套权重</b>——这比腿那边（12 kg 的机器人背 8 kg）跨度还大，因为这里变的是<b>机身本身</b>而不只是负载。</b>", "<b>⚠ 而且 extrinsics 的含义也跟着换了：这里要估的是<b>质量与臂长</b>，也就是<b>「我现在是哪一台无人机」</b>。</b> <span class='w'>讲稿：「the same weights is able to <b>estimate what morphology it's operating in</b> and it's able to adapt and fly the drones」</span>。<b>⇒ <b>morphology</b>（形态）这个词用得准：不是环境变了，是<b>身体</b>变了。</b>", "<b>⇒ 这其实比「环境自适应」更强：<b>同一个大脑装在不同的身体上，靠落差信号认出自己是谁</b>。</b> <span class='k'>⇒ 而这又一次是同一个机制：发出指令、观察实际响应、从差异里推断。</span>", "⚠️ <b>讲者特意强调了一个容易被忽略的点：<b>控制的层级很低</b>。</b> <span class='w'>「It's <b>directly controlling the motor velocity of each of the propellers</b>. So <b>it's not abstracting away to a level where this becomes an easy problem</b>」</span>。", "<b>⇒ 这句话值得记，因为它防的是一种常见的「注水」：<b>如果你在一个高层抽象上控制（比如直接指定期望姿态，让底层控制器去实现），那适应不同机型就容易得多</b>——因为底层控制器替你吸收了差异。</b> <span class='k'>⇒ 而这里是<b>直接给每个螺旋桨发转速</b>，没有任何中间层兜底。</span>", "<b>鲁棒性测试也很直接：<b>拿网球打螺旋桨</b>。</b> <span class='w'>讲稿：「we'll take a <b>tennis ball and shoot it at the fins</b>… And it's still quite robust to it」</span>。", "<b>⚠ 还有一个很有画面感的细节：<b>刚起飞时它会晃一下</b>。</b> <span class='k'>「initially it <b>wobbles a bit</b>. I think it's <b>still trying to estimate what drone it is flying</b>」</span>。<b>⇒ 这是 extrinsics 在线估计的<b>直接可见证据</b>：估计需要几步观测才能收敛，而在收敛之前行为是不稳的。</b>", "<b>⇒ 这个「开头晃一下」对应到腿那边，就是 p29 那个消融里讲的「只估第一步」为什么不够——<b>第一步的估计本来就不准</b>。</b> <span class='w'>⇒ 三个应用（腿、手、无人机）到这里已经把同一个机制演示了三遍，而讲者下一节才转向「还剩什么没解决」。</span>"], "eq": "这几页只有视频，但讲稿把数字给全了（整讲泛化跨度最大的一组）：\n   「**the same weights** which tries to estimate the **mass and arm length**…\n     The top drone is **four times heavier**… the **arm length is also three times**」\n\n   ⇒ 四倍质量、三倍臂长，**一套权重**\n     比腿那边（12 kg 机器人背 8 kg）跨度还大\n     —— 因为这里变的是**机身本身**而不只是负载\n\n⚠ extrinsics 的含义也跟着换了：这里估的是**质量与臂长**\n   也就是 **「我现在是哪一台无人机」**\n   「the same weights is able to **estimate what morphology it's operating in**」\n   ⇒ **morphology（形态）**这个词用得准：**不是环境变了，是身体变了**\n\n   ⇒ 这比「环境自适应」更强：\n     **同一个大脑装在不同的身体上，靠落差信号认出自己是谁**\n   ⇒ 又一次是同一机制：发出指令 → 观察实际响应 → 从差异里推断\n\n⚠ 讲者特意强调的一点：**控制的层级很低**\n   「It's **directly controlling the motor velocity of each of the propellers**.\n     So **it's not abstracting away to a level where this becomes an easy problem**」\n\n   ⇒ 这句防的是一种常见的「注水」：\n     **如果在高层抽象上控制（指定期望姿态，让底层控制器实现），\n       适应不同机型就容易得多** —— 底层控制器替你吸收了差异\n   ⇒ 而这里是**直接给每个螺旋桨发转速**，没有任何中间层兜底\n\n鲁棒性测试：**拿网球打螺旋桨**，「it's still quite robust to it」\n\n⚠ 很有画面感的细节：**刚起飞时它会晃一下**\n   「initially it **wobbles a bit**. I think it's **still trying to estimate\n     what drone it is flying**」\n   ⇒ 这是 extrinsics 在线估计的**直接可见证据**：\n     估计需要几步观测才能收敛，收敛之前行为不稳\n\n⇒ 「开头晃一下」正对应 p29 那个消融里「只估第一步」为什么不够\n   —— **第一步的估计本来就不准**\n⇒ 三个应用（腿、手、无人机）已把同一机制演示三遍，\n   讲者下一节才转向「还剩什么没解决」", "tbl": {"head": ["三个应用", "extrinsics 估的是什么", "泛化跨度"], "rows": [["<b>腿（RMA）</b>", "<b>摩擦、质量、地形</b>", "<b>七种地形 · 背 8 kg</b>"], ["<b>手（在手转物）</b>", "<b>接触 ⇒ 形状与大小</b>", "<b>5 g → 198 g · 冰球到猕猴桃</b>"], ["<b>无人机</b>", "<b>⚠ 质量与臂长（我是哪台）</b>", "<b>重 4 倍 · 臂长 3 倍</b>"], ["共同机制", "<b>指令与实际的落差</b>", "<b>在线、持续、不改权重</b>"]]}, "say": "原话（同一套权重飞两台差四倍的无人机，而且直接控制螺旋桨转速）：<em>“the same thing can be applied to drone flight as well. So we have the same policy controlling the drone at the top and the bottom. So <b>the same weights which tries to estimate the mass and arm length</b> of all of these drones. <b>The top drone is four times heavier than the one at the bottom. And the arm length is also three times.</b> And the same weights is able to <b>estimate what morphology it's operating in</b> and it's able to adapt and fly the drones. <b>It's directly controlling the motor velocity of each of the propellers. So, it's not abstracting away to a level where this becomes an easy problem.</b>”</em><br><br>原话（起飞时晃一下，因为还在估自己是哪台）：<em>“this is another drone with a higher mass. <b>initially it wobbles a bit. I think it's still trying to estimate what what drone it is flying.</b> And then we'll take a <b>tennis ball and shoot it at the fins</b>. So these are the propellers of the drone… And it's still quite robust to it.”</em>", "res": {"tag": "推断", "v": "<b>这一页有两样东西对你有用，而第二样是一个<b>没人提醒过你</b>的问题。</b><br><b><b>第一样：<code>morphology</code> 这个词。</b>讲者说策略估的是「<b>what morphology it's operating in</b>」—— <b>不是环境变了，是身体变了</b>。</b><br><span class='k'>⇒ 映到你的问题，这正好是「<b>换了一个工作流</b>」与「<b>换了一条 query</b>」的区别：前者改的是<b>结构</b>（节点数、拓扑、算子类型），后者改的是<b>输入</b></span>。<b>⇒ 而这一页说的是：<b>同一套权重可以同时适应这两种变化</b>，只要你把两者都当成「要在线估计的东西」而不是「要分别训练的情形」。</b><br><b>⇒ 这给了你一个很具体的、也很有力的实验：<b>在若干个工作流上训一套路由策略，然后在一个<b>训练时没见过的工作流</b>上零样本测试</b>。</b> <span class='w'>讲者的版本是「重 4 倍、臂长 3 倍」；你的版本是「节点数多一倍、多了一类没见过的算子」。<b>⇒ 如果这个实验成立，它比任何同分布的提升都更能说明你做出了一个方法而不是一组调好的参数。</b></span><br>⚠️ <b><b>第二样：那个「刚起飞时会晃一下」。</b>讲者说它「<b>still trying to estimate what drone it is flying</b>」—— 而这是一个<b>冷启动代价</b>。</b><br><b>⇒ 这一条对你格外要紧，因为<b>你的时间轴短得多</b>。</b> <span class='k'>无人机晃几百毫秒就收敛了，占全程的比例微不足道；而<b>你的工作流只有 3–8 个节点</b>。如果你的在线估计量需要两三个节点才收敛，<b>那就是一半的工作流都在「晃」</b></span>。<br><b>⇒ 所以<b>第一个节点的决策是你最弱的一环</b>，而这不是实现细节，是一个结构性的问题：<b>第一个节点没有任何历史可看</b>。</b><br><b>⇒ 三条可行的应对，按推荐顺序：<b>① 第一个节点一律用高档</b>（成本可控，因为只有一个节点，而它的错误会污染整条链）；<b>② 从 prompt 本身提取事前特征</b>（长度、任务类型、关键词），这是唯一在第一个节点就可得的信息；<b>③ 把第一个节点的决策交给一个单独的、只看 prompt 的小分类器</b>，与后续节点的策略分开训。</b><br><b>⚠ 而无论选哪条，<b>这个问题必须在论文里写出来</b>。</b> <span class='w'>它是你的方法与「工作流级一次决定」之间差异的<b>核心所在</b> —— 如果第一个节点只能盲猜，那你的节点级优势就只体现在后面那几个节点上，<b>而那个事实决定了你的收益上限</b>。<b>⇒ 自己把这个上限算出来并报告，比让审稿人估它要好得多。</b></span>", "ref": "本讲 p68–p70（逐字核对）· 讲稿（morphology、起飞时晃一下）· p29 · 简报 §1 §2 §4d（已核）"}},
{"r": [71, 75], "t": "还剩什么：为什么运动控制三四年前就成了，而操作还没有", "star": 3, "quote": "<b>So what's left to solve?</b> &nbsp;·&nbsp; <b>Humanoids</b><br><b>Getting to reliability and dexterity</b> — <em>Epic Kitchens</em><br><em>- <b>Simulation technology is still very primitive</b></em>", "one": "<b>讲者把整场的结论收成一个问题：运动控制三四年前就做到了敏捷又可靠，为什么操作还不行？答案正好是开场那两个要素——仿真不够用，奖励写不出来。</b>", "pts": ["<b>讲者先交代了 Tesla 那边的进展，而这几段视频的共同点是「和前面一样的配方」。</b> <span class='k'><b>双足上坡</b>：同样是仿真训练、真机<b>零样本</b>；而双足比四足难得多——「a biped is <b>much less forgiving</b> because it's a much more unstable system and you need to be more reactive」；<b>机器人跳舞</b>：「All <b>realtime onboard autonomous</b>」</span>。", "⚠️ <b>而有一句关于<b>工程节奏</b>的话很有分量，值得单独记：<b>「Getting the first thing to work and the 10th thing to work <b>does not take very long</b> because <b>the pipeline is very simple</b>. Once you get one thing to work, you can actually <b>pump out a lot more results very easily</b>」</b>。</b> <span class='w'>⇒ 这说的是<b>边际成本</b>：难的是打通第一条路，之后每条新路都便宜。</span>", "<b>操作那一半进展就不一样了，而讲者没有粉饰。</b> <span class='k'>做法：同一个神经网络<b>吃语言指令</b>；「<b>The key ingredient is the use of videos.</b> We learned this from <b>videos and a little bit of robot data</b>」（用的是人的第一视角视频）</span>；<b>但结论是：「we can get decent performance on these tasks, but <b>they're not very reliable</b>」。</b>", "<b>⇒ 于是全讲收束到一个很干净的问题：<b>运动控制的结果是三四年前的，而且很敏捷、很可靠；为什么操作到今天还做不到同样的水平？</b></b>", "<b>⚠ 答案正好回到开场 p3/p4 那<b>两个要素</b>，而这个结构上的呼应是整场讲座设计得最好的一处。</b>", "<b><b>第一条：仿真不够用。</b></b> <span class='w'>运动控制之所以能成，是因为「<b>rigid body contact was good enough</b> to get very robust locomotion」；而操作要模拟<b>可变形物体</b>——「if you have to <b>chop vegetables</b>, we need to simulate that… and <b>deformable objects, dough</b>, and everything in simulation to get the sim-to-real transfer to work」</span>。<b>⇒ 幻灯的措辞是 <b><em>Simulation technology is still very primitive</em></b>。</b>", "⚠️ <b><b>第二条：奖励写不出来。</b>而这一条幻灯上没有，只在讲稿里，却可能比第一条更要命。</b> <span class='k'>运动控制的奖励是<b>完备</b>的：「if you programmatically write out a reward which asks you to <b>track a certain velocity</b>, <b>it's complete. This is the full task specification</b>」——写完这一条，再随机化地形，就能得到一个通用策略</span>。", "<b>⇒ 而操作不是这样。切菜的奖励要「<b>measure the size of each of the slices</b> that are cut」，而且「<b>that itself will depend on what exactly is it that you're trying to cook</b>」。</b> <span class='w'>⇒ 同一个动作，目标不同，奖励就不同。</span>", "⚠️ <b>⇒ 但最致命的是<b>不可复用</b>这一点：<b>「let's say you put in the work to write that reward — <b>that only gets you one task. It doesn't get you the full generality of manipulation</b>… it's a very <b>manual</b> process and <b>even if you get one of this right, it will not scale to anything else</b>」</b>。</b> <span class='k'>⇒ 想拉伸面团？再写一个。想往面团上撒面粉？再写一个。<b>每个任务一条，而且互相不通用</b>。</span>", "<b>⇒ 所以两条答案的性质很不一样，这个区分值得想清楚：<b>仿真是「算力不够」的问题（会随时间改善），而奖励是「人工不可扩展」的问题（不会自己变好）</b>。</b> <span class='w'>⇒ 这也正是下一页为什么对两者给出了<b>不同</b>的对策。</span>"], "eq": "Tesla 那边的进展（共同点：**和前面一样的配方**）：\n   **双足上坡**：仿真训练、真机**零样本**\n     而双足比四足难得多 ——「a biped is **much less forgiving**\n       because it's a much more unstable system」\n   **机器人跳舞**：「All **realtime onboard autonomous**」\n\n⚠ 一句关于**工程节奏**的话（值得单记）：\n   「Getting the first thing to work and the 10th thing to work **does not take\n     very long** because **the pipeline is very simple**. Once you get one thing\n     to work, you can **pump out a lot more results very easily**」\n   ⇒ 说的是**边际成本**：难的是打通第一条路，之后每条新路都便宜\n\n操作那一半（讲者没有粉饰）：\n   同一个神经网络**吃语言指令**\n   「**The key ingredient is the use of videos.** We learned this from\n     **videos and a little bit of robot data**」（人的第一视角视频）\n   但：「we can get decent performance… but **they're not very reliable**」\n\n⇒ 全讲收束到一个干净的问题：\n   **运动控制的结果是三四年前的、而且敏捷可靠；\n     为什么操作到今天还做不到同样水平？**\n\n⚠ 答案正好回到开场 p3/p4 那**两个要素**（整场设计得最好的一处呼应）：\n\n**第一条：仿真不够用**\n   运动控制能成，因为「**rigid body contact was good enough**」\n   操作要模拟**可变形物体** ——「if you have to **chop vegetables**…\n     and **deformable objects, dough**, and everything in simulation」\n   幻灯：**Simulation technology is still very primitive**\n\n⚠ **第二条：奖励写不出来**（幻灯上没有，只在讲稿里，却可能更要命）\n   运动控制的奖励是**完备**的：\n     「programmatically write out a reward which asks you to **track a certain\n       velocity** — **it's complete. This is the full task specification**」\n     写完这一条，再随机化地形，就得到一个通用策略\n\n   操作不是这样：切菜的奖励要\n     「**measure the size of each of the slices** that are cut」\n     而且「**that itself will depend on what exactly is it\n       that you're trying to cook**」\n   ⇒ 同一个动作，目标不同，奖励就不同\n\n⚠⚠ 最致命的是**不可复用**：\n   「let's say you put in the work to write that reward — **that only gets you\n     one task. It doesn't get you the full generality of manipulation**…\n     it's a very **manual** process and **even if you get one of this right,\n     it will not scale to anything else**」\n   ⇒ 想拉伸面团？再写一个。想撒面粉？再写一个。\n     **每个任务一条，互相不通用**\n\n⇒ 两条答案的性质很不一样（这个区分值得想清楚）：\n   **仿真是「算力不够」的问题（会随时间改善）\n     奖励是「人工不可扩展」的问题（不会自己变好）**\n   ⇒ 正是下一页为什么对两者给出**不同**的对策", "tbl": {"head": ["", "运动控制（已做成）", "操作（还没有）"], "rows": [["仿真够用吗", "<b>刚体接触就够</b>", "<span class='w'>⚠ 要可变形物体、面团</span>"], ["奖励写得出来吗", "<b>「跟踪某个速度」就是完整任务说明</b>", "<span class='w'>⚠ 切菜要量每片的大小</span>"], ["奖励能复用吗", "<b>一条管所有地形</b>", "<span class='w'>⚠ 一条只管一个任务</span>"], ["问题的性质", "—", "<b>仿真缺算力 · 奖励缺可扩展性</b>"]]}, "say": "原话（为什么运动控制成了而操作没成——第一条：仿真）：<em>“if you go back to the two things which got locomotion to work well. One was <b>the simulation technology was ready. Rigid body contact was good enough to get very robust locomotion.</b> But when it comes to manipulation and if you have to <b>chop vegetables</b>, we need to simulate that. And then we need to simulate <b>deformable objects, dough</b> and everything in simulation to get the sim-to-real transfer to work for this.”</em><br><br>原话（第二条：奖励写不出来，而且写出来也不可复用）：<em>“the second comparison are <b>rewards which are much easier to specify for locomotion</b>. So if you programmatically write out a reward which asks you to <b>track a certain velocity, it's complete. This is the full task specification</b> and now you can just randomize the terrain and then you can get a general policy out of it. <b>But that's not true for manipulation.</b> So… if you want to chop a vegetable and even if you had the full state of simulation, you would still need to come up with a reward which <b>measures the size of each of the slices</b> that are cut and so on — and <b>that itself will depend on what exactly is it that you're trying to cook</b> eventually. So that's one reward, and let's say you put in the work to write that reward — <b>that only gets you one task. It doesn't get you the full generality of manipulation.</b>… So it's a very <b>manual</b> process and <b>even if you get one of this right, it will not scale to anything else</b>.”</em><br><br>原话（打通第一条路之后，后面便宜得多）：<em>“<b>Getting the first thing to work and the 10th thing to work does not take very long because the pipeline is very simple. Once you get one thing to work, you can actually pump out a lot more results very easily.</b>”</em>", "res": {"tag": "推断", "v": "<b>这一页把整场的论点闭环了，而那个闭环对你有一条很实在的用处：<b>它给了你一个判断「什么问题适合用 RL/自动搜索去做」的检查表</b>。</b><br><span class='k'>两条检查项就是开场那两个要素：<b>① 奖励写得出来吗，而且写一条能管很多任务吗？② 评估跑得起吗？</b></span><b>⇒ 讲者用它解释了「运动控制成了、操作没成」，而你可以用它解释<b>你的问题为什么可做</b>。</b><br><b>⇒ 逐条过一遍你的问题，结论相当有利：</b><br><b>① <b>奖励</b>：<code>G = Acc − λ·Cost</code> 是<b>完备</b>的任务说明，而且<b>一条管所有配置</b></b>——<span class='w'>这正是讲者说运动控制「写完一条、再随机化地形就能得到通用策略」的那种性质；<b>你不需要为每个工作流重写一个 G</b></span>；<b>② <b>评估</b>：可自动化、可重放。</b><br><b>⇒ 所以你的问题在这张检查表上<b>更像运动控制而不像操作</b>——这是一个很有力的、也很具体的「这件事做得成」的论证。</b><br><b>⚠ 但那条「<b>奖励不可复用</b>」的警告，指出了你会<b>在哪里</b>失去这个优势，而这一点值得提前想清楚：<b>一旦你的 Acc 不再来自标准答案，而要靠一个为特定任务写的评判标准，你就掉进操作那一侧了</b>。</b><br><span class='k'>讲者的切菜例子是「每片的大小取决于你究竟要做什么菜」；你的对应是「<b>这个回答好不好，取决于用户究竟想要什么</b>」——开放式生成、摘要、创意写作全都是这一类</span>。<b>⇒ 在这些任务上，<code>Acc</code> 没有可程序化的定义，而你整套方法赖以成立的第一个要素就塌了。</b><br><b>⇒ 所以你的适用范围应当<b>主动</b>声明：<b>本方法适用于 Acc 可程序化判定的任务（数学、代码、问答、抽取），不适用于需要主观评判的开放式生成。</b></b> <span class='w'>这不是示弱——<b>恰恰相反，它说明你清楚自己方法的边界在哪，而这个边界有一个讲得通的理由</b>。</span><br><b>⚠ 最后那句「打通第一条路之后，第十条就很便宜」对你有一条实验安排上的建议：<b>先把一个工作流上的完整管线打通，再铺开到别的工作流</b>。</b> <span class='k'>而且<b>报告这个边际成本</b>——「第一个工作流花了 X 人天，后三个各花了 Y」——是一个很有说服力的、却常被忽略的结果：它证明你的方法是<b>可推广的流程</b>而不是一次性的调参。</b>", "ref": "本讲 p75（逐字核对）· 讲稿（两条答案、奖励不可复用、第十条很便宜）· p3–p4 · 简报 §1 §2 §4d（已核）"}},
