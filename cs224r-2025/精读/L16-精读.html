code> 之间的差距被压平，<b>你需要多得多的样本才能把它们分开</b></b>（<span class='w'>L09 的 <code>ρ_*</code> 里差距 <code>Δ</code> 在分母上，差距小 ⇒ 样本量暴涨</span>）。<b>反过来全是<b>简单题</b>，所有配置都接近满分，同样分不开——<b>连最小的模型都够用</b>。</b><br><b>⇒ 所以最有信息量的评估集是<b>难度铺开</b>的，而且最好在「不同档位会给出不同答案」的那个难度带上<b>加密采样</b>。</b> <span class='k'>⚠ 这和讲义说的「both easy and hard」是同一件事，但对你还多一层：<b>你可以主动挑 query</b>，而机器人不能挑初始状态。</b><br><b>⇒ 这条和 L07 的 G-最优设计可以接起来，而且接得很自然</b>：<span class='w'>G-最优设计回答「在<b>配置</b>空间里怎么分配预算」，而这一条提醒你<b>query 空间也是一个要分配的维度</b></span>。<b>完整的设计问题是二维的：<b>测哪些配置 × 在哪些 query 上测</b>。</b><br><b>⚠ 而你现在多半只优化了第一维——第二维是「benchmark 给什么就用什么」。</b> <span class='k'>⇒ 这可能是一个未被利用的、而且相当便宜的改进：<b>先用一小批 query 估出每条 query 的「区分度」（不同档位在它上面的表现差异），再把后续预算集中到高区分度的那些上</b>。</span><br><b>⚠ 但有一个必须讲清的代价，否则这就是作弊：<b>按区分度挑 query 会让你的 <code>Ĝ</code> 对真实 query 分布有偏</b>。</b> <span class='w'>你选出的配置在「难分辨的那些 query」上最优，而不是在真实流量上最优</span>。<b>⇒ 正确的做法是<b>重要性加权纠回去</b>（L14 p2 那个 <code>1/P</code>，而且你<b>知道</b> <code>P</code>，因为是你自己挑的）——这正好把 L14 那套机器用上了。</b>", "ref": "本讲 p23（逐字核对，含 Kakade & Langford 出处）· 讲稿（even in episodic settings）· L07 p4 · L09 p11 · L14 p2 · 简报 §4b §4c（已核）"}},
{"r": [24, 26], "t": "结果：专门设计过的才行，以及真机上是什么样", "star": 2, "quote": "<b>Forward backward results · EARL Benchmark</b><br><em><b>Training: reset every 200k steps</b> &nbsp;·&nbsp; <b>Evaluation: policy performance from s₀</b></em><br><em>对比：<b>oracle SAC (episodic)</b> · <b>SAC (non-episodic, no backward policy)</b> · <b>FBRL</b> · <b>MEDAL</b> · <b>VaPRL</b>(goal curriculum) · <b>R3L</b>(state novelty)</em><br>〔出处〕<em>EARL: Sharma*, Xu* et al. <b>Autonomous Reinforcement Learning: Formalism and Benchmarking</b>, ICLR 2022</em><br><b>Forward-backward RL on real robots</b> — <em>Vanilla FBRL（Demo initialized, <b>VLM-provided rewards</b>）· MEDAL（Demo initialized, <b>learned rewards</b>）</em>", "one": "<b>基准的设定很极端：每 20 万步才给一次复位。结论是两层的——为无复位专门设计过的算法明显更好；而任务越复杂，FBRL 与 MEDAL 的领先越明显。</b>", "pts": ["<b>先看基准的设定，它把「自主」推到了很极端的程度：<b>每 20 万环境步才复位一次</b>。</b> <span class='k'>⇒ 这正是 p11 那个星号（「可以放松成低频复位」）的具体数值</span>。<b>而评估用的是<b>部署策略评估</b>：<em>policy performance from s₀</em>。</b>", "<b>对比的六条线分两类，看清楚哪条是什么很重要。</b> <span class='w'><b>两条参照</b>：<code>oracle SAC (episodic)</code>——能频繁复位的上界；<code>SAC (non-episodic, no backward policy)</code>——什么都不做的下界</span>；<b><b>四条正经方法</b>：FBRL · MEDAL · VaPRL（目标课程）· R3L（状态新颖性）。</b>", "<b>第一层结论很直接：<b>什么都不做的 SAC 学不出好策略</b>（和 p16 那条鱼的实验一致），而 oracle 能学出来。</b> <span class='k'>⇒ 这确认了问题确实出在复位上，不是出在算法本身</span>。", "<b>第二层结论是：<b>为这个设定专门设计过的算法，明显好过不设计的</b>。</b> <span class='w'>讲稿：「the main takeaway here is that <b>these algorithms that are specifically designed for this autonomous or reset-free learning setting are able to do much better than if you don't design it for that case</b>」</span>。", "<b>⚠ 第三层才是方法之间的比较，而它<b>只有在复杂任务上才显出来</b>。</b> <span class='k'>讲稿：简单环境里「they all perform fairly similarly」；而「as we move towards more complex environments, we see that <b>forward-backward RL and MEDAL are able to do the best</b>」，相比之下靠「鼓励访问新状态」或「目标课程」的那两个就差一些</span>。", "<b>⇒ 这是一个值得记的读表习惯：<b>在简单任务上分不出高下，不等于方法之间没有差别</b>。</b> <span class='w'>要在足够难的任务上才看得出来——而这也是为什么基准要包含多个难度。</span>", "<b>p26 的真机视频有两个细节值得注意，它们说明了「全自主」在工程上还需要什么。</b> <span class='k'>两边都是 <b>Demo initialized</b>（用演示初始化）；而奖励：<b>vanilla FBRL 用 VLM 给的奖励，MEDAL 用学出来的奖励</b></span>。", "⚠️ <b>⇒ 讲稿点明了这件事的意义：<b>奖励也是人工监督的一种</b>。</b> <span class='w'>原话：「rewards are also something that provide [supervision]. And so using reward learning algorithms <b>in conjunction with</b> autonomous or reset-free algorithms is also quite common, and in both of these circumstances, <b>the rewards were using models rather than using humans</b>. So that this entire process can be autonomous, and <b>you can actually run it overnight</b>」</span>。", "<b>⇒ 所以「真正的自主」需要<b>两件事同时解决</b>：<b>不需要人复位</b>（本讲）<b>＋ 不需要人打分</b>（奖励学习）。只解决一件，人还是得守着。</b>", "<b>⚠ 最后记一条讲稿里很诚实的话，读这类结果时该带着：<b>这些方法还在研究阶段</b>。</b> <span class='k'>原话：「these works… they're still certainly still in the <b>research stages</b>, I think. <b>This is not something that robot companies are using today.</b>」</span>", "<b>讲稿还回答了一个和 L15 p17 完全同构的提问：<b>没有好的后向策略就难学前向，没有好的前向策略后向又没东西可撤——怎么破？</b></b> <span class='w'>答案是：「you can provide <b>demonstrations, both for the forward task and for the backward task</b>, and use that to help bootstrap the learning process for both」；除此之外「it is just generally a challenge」</span>。<b>⇒ 又一次是那个先有鸡先有蛋，而解法又一次是「拿一点外部数据把两边都启动起来」。</b>"], "eq": "基准设定（把「自主」推到极端）：**每 20 万环境步才复位一次**\n   ⇒ 正是 p11 那个星号（「可放松成低频复位」）的具体数值\n   评估用**部署策略评估**：policy performance from s₀\n\n六条线分两类：\n   **两条参照**：oracle SAC (episodic) —— 能频繁复位的**上界**\n                SAC (non-episodic, no backward policy) —— 什么都不做的**下界**\n   **四条方法**：FBRL · MEDAL · VaPRL（目标课程）· R3L（状态新颖性）\n\n**第一层结论**：什么都不做的 SAC 学不出好策略（与 p16 的鱼一致），oracle 能\n   ⇒ 确认问题出在**复位**上，不是算法本身\n\n**第二层结论**：\n   「**these algorithms that are specifically designed for this autonomous or\n     reset-free learning setting are able to do much better than if you don't\n     design it for that case**」\n\n⚠ **第三层**（方法之间的比较）**只有在复杂任务上才显出来**：\n   简单环境里「they all perform fairly similarly」\n   「as we move towards more complex environments, we see that\n     **forward-backward RL and MEDAL are able to do the best**」\n   靠「鼓励访问新状态」或「目标课程」的那两个差一些\n\n   ⇒ 读表习惯：**在简单任务上分不出高下，不等于方法之间没有差别**\n     要在足够难的任务上才看得出来 —— 这也是基准要含多个难度的原因\n\np26 真机（两个细节说明「全自主」在工程上还需要什么）：\n   两边都是 **Demo initialized**\n   奖励：vanilla FBRL 用 **VLM 给的**，MEDAL 用 **学出来的**\n\n⚠ 讲稿点明意义：**奖励也是人工监督的一种**\n   「using reward learning algorithms **in conjunction with** autonomous or\n     reset-free algorithms is also quite common, and in both of these\n     circumstances, **the rewards were using models rather than using humans**.\n     So that this entire process can be autonomous, and **you can actually\n     run it overnight**」\n\n   ⇒ **真正的自主需要两件事同时解决**：\n     **不需要人复位**（本讲）＋ **不需要人打分**（奖励学习）\n     只解决一件，人还是得守着\n\n⚠ 讲稿里很诚实的一句（读这类结果时该带着）：\n   「these works… they're still **in the research stages**…\n     **This is not something that robot companies are using today.**」\n\n又一个与 L15 p17 同构的提问：\n   **没有好的后向策略就难学前向，没有好的前向策略后向又没东西可撤**\n   答：「you can provide **demonstrations, both for the forward task and for\n         the backward task**, and use that to help bootstrap both」\n       除此之外「it is just generally a challenge」\n   ⇒ 又一次先有鸡先有蛋，解法又一次是「拿一点外部数据把两边都启动起来」", "tbl": {"head": ["EARL 基准上的六条线", "是什么", "表现"], "rows": [["<b>oracle SAC (episodic)</b>", "<b>能频繁复位（上界）</b>", "<b>好</b>"], ["<b>SAC (non-episodic)</b>", "<b>什么都不做（下界）</b>", "<span class='w'>差</span>"], ["<b>FBRL · MEDAL</b>", "<b>专门设计的</b>", "<b>⚠ 复杂任务上最好</b>"], ["<b>VaPRL · R3L</b>", "目标课程 / 状态新颖性", "<span class='w'>复杂任务上差一些</span>"], ["⚠ 简单任务上", "—", "<b>几种差不多，分不出高下</b>"]]}, "say": "原话（两层结论，以及方法差别只在复杂任务上显现）：<em>“the main takeaway here is that <b>these algorithms that are specifically designed for this autonomous or reset-free learning setting are able to do much better than if you don't design it for that case</b>. And in this simple environment, <b>they all perform fairly similarly</b>. And then as we move towards more complex environments, we see that <b>forward-backward RL and MEDAL are able to do the best</b>. Whereas, simply, if you instead try to encourage it to visit various states or goals, those algorithms aren't doing quite as well.”</em><br><br>原话（奖励也是监督，所以奖励也得让模型给）：<em>“One other thing that I'll mention is that <b>rewards are also something that provide [supervision]</b>. And so using reward learning algorithms <b>in conjunction with</b> autonomous or reset-free algorithms is also quite common, and in both of these circumstances, <b>the rewards were using models rather than using humans</b>. So that this entire process can be autonomous, and <b>you can actually run it overnight</b>, for example.”</em><br><br>原话（这些方法还在研究阶段）：<em>“I should also mention that these works — most that are doing these, they're still — I mean, certainly, <b>still in the research stages</b>, I think. <b>This is not something that robot companies are using today.</b>”</em>"},
{"r": [27, 29], "t": "任务循环：把「撤销」换成「练点别的」", "star": 3, "quote": "<b>Autonomous RL with task cycles</b><br><em>Task 1: <b>put cup in coffee machine</b> · Task 2: <b>pick up cup</b> · Task 3: <b>replace cup</b> · Task 4: <b>clean up spill from cup</b>…</em>〔图上每个任务有 fail / succeed 两条出边〕<br><b>Algorithm</b><br><em>1. Initialize <b>task-conditioned policy π(·|s,z)</b><br>2. Repeat:<br>&nbsp;&nbsp;1. <b>Propose task z<sub>i</sub> to practice based on s</b><br>&nbsp;&nbsp;2. Roll out π(·|s,z<sub>i</sub>) for H steps<br>&nbsp;&nbsp;3. Update π using <b>r(s,a,z)</b><br>&nbsp;&nbsp;4. <b>No reset or very infrequent reset</b><br><b>Test time: Deploy π</b></em>", "one": "<b>FBRL 的后向策略只为了撤销而存在，最后被扔掉。任务循环把这件事换了个方向：别撤销，去练另一个从这里能练的任务——于是每一步都在学有用的东西。</b>", "pts": ["<b>动机从那个咖啡杯的例子最容易看明白。</b> <span class='k'>机器人要把杯子放进咖啡机（任务 1），结果<b>手滑把杯子掉了</b></span>。<b>传统做法是人过来把杯子摆回去；FBRL 的做法是学一个「把杯子放回原位」的后向策略。</b>", "<b>⇒ 而任务循环的提法是：<b>既然杯子现在在地上，那此刻该练的不是「把杯子放进咖啡机」，而是「把杯子捡起来」</b>。</b> <span class='w'>讲稿：「because it made a mistake, the second task shouldn't be to turn on the coffee machine. Instead, <b>it should be to pick up the cup</b>」</span>。", "⚠️ <b>⇒ 关键的转变在于：<b>「捡起杯子」本身就是一个你<b>想要</b>机器人会的技能，不是为了复位而学的废动作</b>。</b> <span class='k'>⇒ 这直接消掉了 FBRL 那条减号（后向策略最终被扔掉）：<b>这里测试时 <code>Deploy π</code>，整个多任务策略全部留用</b></span>。", "<b>所以结构上的差别是：<b>FBRL/MEDAL 训两个策略、扔一个；任务循环训一个多任务策略、全留</b>。</b> <span class='w'>这是三条路线里最「不浪费」的一条。</span>", "<b>那张图上每个任务有 <b>fail / succeed</b> 两条出边，构成一个<b>循环图</b>而不是一条链。</b> <span class='k'>讲稿：「we practice task 1. Then if we fail, we practice task 2. And then task 2 maybe is <b>resetting</b> task 1… If we do succeed at task 1, we might move to task 3」</span>。<b>⇒ 有些任务<b>兼任</b>了别的任务的复位器——这是循环图带来的免费好处。</b>", "<b>算法只比 FBRL 多一个新零件：<b>第 ① 步的「提议任务」</b>。</b> <span class='w'>其余的（滚动 H 步、更新、不复位、测试时部署）都一样</span>；<b>而策略从「两个单任务策略」变成了「一个 <b>task-conditioned</b> 策略 <code>π(·|s,z)</code>」。</b>", "<b>⚠ 注意提议那一步的措辞：<b><em>Propose task z_i to practice <b>based on s</b></em></b>——<b>依据当前状态</b>提议。</b> <span class='k'>讲稿点明了这一步在干什么：「we'll practice a different task that is <b>possible to practice from that state</b> and <b>exclude tasks that are not feasible</b> from that state」</span>。<b>⇒ 提议器的职责是<b>筛掉此刻做不了的任务</b>。</b>", "<b>这个设计还顺手解决了 L16.b p19 那个「前向后向难度不匹配」的问题。</b> <span class='w'>讲稿：「this can actually address some of the challenges that we talked about with regard to <b>imbalance in tasks</b>, where if you haven't yet successfully run the forward policy to actually change the state… <b>you can keep on running the policy for a task that makes sense</b>」</span>。<b>⇒ 前向还没学会、后向无事可做的僵局，在循环图里不存在——总有一个任务是此刻可练的。</b>", "<b>⚠ 代价也要说清：<b>你需要为<b>所有</b>任务各准备一个奖励函数</b>（<code>r(s,a,z)</code>）。</b> <span class='k'>FBRL 只要两个（<code>r_f</code>、<code>r_b</code>），任务循环要 <code>|z|</code> 个</span>。<b>⇒ 而这正是 p32 那个「用图像当目标」的技巧要解决的问题。</b>", "<b>最后记一个更新上的细节，讲稿提到了：<b>用 off-policy 算法的话，一次交互可以更新<b>所有</b>任务</b>。</b> <span class='w'>「If we have more on-policy algorithm, then this would be updating it for <b>this particular task</b>. If we have an <b>off-policy</b> algorithm, we could update it for <b>any</b> of the tasks」</span>。<b>⇒ 又一次是「off-policy 让数据能被重复利用」——和 L15 p43 的事后重标注是同一个理由。</b>"], "eq": "动机（咖啡杯的例子）：\n   机器人要把杯子放进咖啡机（任务 1），结果**手滑把杯子掉了**\n   传统：人过来摆回去\n   FBRL：学一个「把杯子放回原位」的后向策略\n   **任务循环**：既然杯子现在在地上，**此刻该练的是「把杯子捡起来」**\n     「because it made a mistake, the second task shouldn't be to turn on the\n       coffee machine. Instead, **it should be to pick up the cup**」\n\n⚠ 关键转变：**「捡起杯子」本身就是你想要机器人会的技能，\n   不是为了复位而学的废动作**\n   ⇒ 直接消掉 FBRL 那条减号（后向策略被扔掉）\n     这里 **Test time: Deploy π** —— 整个多任务策略**全部留用**\n\n结构差别：\n   FBRL / MEDAL  训**两个**策略，**扔一个**\n   任务循环       训**一个多任务**策略，**全留**   ← 三条路线里最不浪费的\n\n那张图：每个任务有 **fail / succeed** 两条出边 ⇒ **循环图**而不是链\n   「we practice task 1. Then if we fail, we practice task 2.\n     And then task 2 maybe is **resetting** task 1…\n     If we do succeed at task 1, we might move to task 3」\n   ⇒ 有些任务**兼任**了别的任务的复位器 —— 循环图带来的免费好处\n\n算法只比 FBRL 多一个新零件：**第 ① 步「提议任务」**\n   其余（滚动 H 步、更新、不复位、测试时部署）都一样\n   策略从「两个单任务策略」变成「一个 **task-conditioned** 策略 π(·|s,z)」\n\n⚠ 提议那一步的措辞：**Propose task z_i to practice based on s**（依据当前状态）\n   「we'll practice a different task that is **possible to practice from that\n     state** and **exclude tasks that are not feasible** from that state」\n   ⇒ 提议器的职责是**筛掉此刻做不了的任务**\n\n顺手解决了 p19 那个「前向后向难度不匹配」：\n   「this can address… **imbalance in tasks**, where if you haven't yet\n     successfully run the forward policy to change the state…\n     **you can keep on running the policy for a task that makes sense**」\n   ⇒ 前向没学会、后向无事可做的僵局，在循环图里不存在\n\n⚠ 代价：**要为所有任务各准备一个奖励函数** r(s,a,z)\n   FBRL 只要两个（r_f、r_b），任务循环要 |z| 个\n   ⇒ 这正是 p32「用图像当目标」要解决的问题\n\n更新上的细节：**off-policy 的话，一次交互可以更新所有任务**\n   「on-policy… updating it for **this particular task**.\n     **off-policy**… we could update it for **any** of the tasks」\n   ⇒ 又一次「off-policy 让数据能被重复利用」\n     —— 与 L15 p43 的事后重标注同一个理由", "tbl": {"head": ["", "FBRL / MEDAL", "任务循环"], "rows": [["训几个策略", "<b>两个</b>", "<b>一个（多任务）</b>"], ["测试时", "<span class='w'>扔掉后向</span>", "<b>全部留用</b>"], ["失败之后做什么", "<b>撤销，回到起点</b>", "<b>练一个此刻能练的任务</b>"], ["要几个奖励函数", "<b>2 个</b>", "<span class='w'>⚠ |z| 个</span>"], ["难度不匹配的僵局", "<span class='w'>⚠ 会卡住</span>", "<b>不存在</b>"]]}, "say": "原话（咖啡杯掉了之后该练什么）：<em>“if you have a robot that's trying to make coffee, maybe the first subtask is to put the cup in the coffee machine. And maybe if it attempts that, it actually <b>drops the cup on accident</b>. And then, traditionally, what you would do is you would have a human reset the cup back to where it started. But we don't want to do that. And so, instead, maybe the second task is — <b>because it made a mistake, the second task shouldn't be to turn on the coffee machine. Instead, it should be to pick up the cup.</b>”</em><br><br>原话（提议任务时要筛掉此刻做不了的）：<em>“we can have this graph or cycle of different tasks that we're trying, at different points in time, depending on the state we're in. <b>We'll practice a different task that is possible to practice from that state and exclude tasks that are not feasible from that state.</b>”</em><br><br>原话（顺手解决了前向后向难度不匹配）：<em>“this can actually address some of the challenges that we talked about with regard to <b>imbalance in tasks</b>, where if you haven't actually yet successfully run the forward policy to actually change the state — and you may not even be in a state where it makes sense to run the backward policy — then <b>you can keep on running the policy for a task that makes sense</b>.”</em>"},
{"r": [30, 33], "t": "该练哪个任务？这是一个被点名的公开问题", "star": 3, "quote": "<b>How to identify which task to collect data for?</b><br><em><b>In general: an open research question.</b> &nbsp;·&nbsp; <b>One idea: Ask a vision language model.</b></em><br>〔出处〕<em>Zhou*, Atreya*, Lee, Walke, Mees, Levine. <b>SOAR: Autonomous Improvement of Instruction Following Skills via Foundation Models</b></em><br><b>Alternatives to Forward-Backward RL?</b> — <em>3. <b>Set up task that can be done repetitively</b>（“forward-forward RL”?）</em>", "one": "<b>循环图里那一步「提议下一个该练什么」，讲义直接标成了公开问题。现成的办法有两条：把图写死，或者问一个视觉语言模型此刻能做什么。</b>", "pts": ["<b>p30/p31 两个例子先说明任务循环<b>确实能跑</b>，而且它们覆盖了两种很不一样的形态。</b> <span class='k'><b>手内操作</b>（Gupta 等 2021）：拿起物体、翻面、旋转——讲稿描述得很生动：「at the beginning… you'll basically just be like <b>practicing picking it up from the hand and putting it back, picking it up, putting it down</b>. And then <b>once you get better at picking it up</b>, then you'll start to actually rotate it or flip it over」</span>。<b>⇒ 能力是<b>按顺序长出来</b>的，而循环图自动适应了这个顺序。</b>", "<b><b>腿式机器人</b>（Laura Smith 等 2021）：同时学前进、后退，<b>以及爬起来</b>。</b> <span class='w'>讲稿：「if it's too far to the back, then it doesn't want to keep on going backwards, and so then you'll practice the task of going forwards」</span>。<b>⇒ 「走到边界了就练反方向」——复位在这里<b>就是另一个任务</b>。</b>", "⚠️ <b>p32 把那个新零件的难处挑明了，而且用的是很直接的措辞：<b><em>How to identify which task to collect data for? In general: <b>an open research question</b></em></b>。</b> <span class='k'>讲稿还加了一句「this is also at the <b>bleeding edge</b> of research in some ways」</span>。", "<b>现成的两条路，各有各的毛病。</b> <span class='w'><b>① 写死</b>：预先定义任务集合<b>和那张图</b>——「if you failed task 1, then you should practice task 2」。简单可靠，但不可扩展，而且要人来设计</span>；<b><b>② 学一个提议器</b>：训练一个模型来提议该练什么。</b>", "<b>而 SOAR 走的是第 ② 条的一个很巧的变体：<b>问视觉语言模型「此刻这个场景里能做什么」</b>。</b> <span class='k'>讲稿的例子很具体：看着这一帧，能做的有「打开玩具微波炉」「拿起香蕉」「推茄子」「移动锅」；<b>而「拿起胡萝卜」不行，因为画面里没有胡萝卜</b></span>。<b>⇒ VLM 在这里的作用是<b>把「此刻可行」这件事判出来</b>——正是 p29 提议步骤要的那个筛选。</b>", "<b>⚠ 讲稿里有一个很好的提问：<b>这和分层里的高层策略有什么区别？</b> 答案点得很准。</b> <span class='w'>「its purpose is actually <b>quite different</b>. So the purpose here is having it propose things that you could do in the environment <b>that you could practice</b>. Whereas, in a hierarchical system, the high-level policy goal is to say <b>what is the next subtask that will achieve some outcome</b>」</span>。", "<b>⇒ 一句话分开：<b>提议器要「广」（给我很多能练的东西），高层策略要「准」（给我通向目标的那一步）</b>。</b> <span class='k'>形式一样，目的相反——一个服务探索，一个服务利用。</span>", "<b>讲稿还提到 SOAR 用了一个很实用的技巧，而它解决的正是 p29 那条代价（要为每个任务写奖励）。</b> <span class='w'>做法是把提议出来的任务<b>喂给图像编辑扩散模型，生成一张目标图像</b>，然后训练策略去够那张图</b></span>。<b>⇒ 「it can be quite challenging to define a reward function for all of the different tasks. Whereas, <b>if you have an image of the task that you're trying to accomplish, then your reward function can be based on whether or not you're close to this image</b>」。</b><span class='k'>⇒ 这正好接上 L15 p38 的图像子目标：<b>用图像当目标，奖励就是「离它有多近」</b>。</b>", "<b>p33 的第三条路最朴素，但有它的道理：<b>把任务设计成可以反复做的</b>。</b> <span class='w'>讲稿的例子是<b>给商家叠餐巾</b>——要叠的餐巾多得叠不完，所以根本不需要复位，叠完一条拿下一条就行</span>。<b>⇒ 老师承认这方面「isn't necessarily a lot of research」，但它提醒了一件事：<b>有时候改任务比改算法便宜</b>。</b>"], "eq": "p30/p31 两个例子（任务循环确实能跑，覆盖两种形态）：\n   **手内操作**（Gupta 等 2021）：拿起、翻面、旋转\n     「at the beginning… **practicing picking it up and putting it back**…\n       and **once you get better at picking it up**, then you'll start to rotate it」\n     ⇒ 能力是**按顺序长出来**的，循环图自动适应了这个顺序\n   **腿式机器人**（Laura Smith 等 2021）：前进 + 后退 + **爬起来**\n     「if it's too far to the back… then you'll practice the task of going forwards」\n     ⇒ **复位在这里就是另一个任务**\n\n⚠ p32 把新零件的难处挑明：\n   **How to identify which task to collect data for?\n     In general: an open research question.**\n   讲稿还加了一句：「this is also at the **bleeding edge** of research」\n\n现成的两条路：\n   ① **写死**：预定义任务集合**和那张图**（failed task 1 → practice task 2）\n      简单可靠，但不可扩展、要人设计\n   ② **学一个提议器**：训练模型提议该练什么\n\nSOAR = ② 的一个巧变体：**问 VLM「此刻这个场景里能做什么」**\n   例子：这一帧能做的有「打开玩具微波炉」「拿起香蕉」「推茄子」「移动锅」\n         **而「拿起胡萝卜」不行 —— 画面里没有胡萝卜**\n   ⇒ VLM 的作用是**把「此刻可行」判出来**，正是 p29 提议步骤要的筛选\n\n⚠ 好提问：**这和分层里的高层策略有什么区别？**\n   「its purpose is **quite different**. here… propose things that you could do\n     in the environment **that you could practice**. Whereas, in a hierarchical\n     system, the high-level policy goal is **what is the next subtask that will\n     achieve some outcome**」\n   ⇒ 一句话分开：\n     **提议器要「广」（给我很多能练的），高层策略要「准」（给我通向目标的那一步）**\n     形式一样，目的相反 —— 一个服务探索，一个服务利用\n\nSOAR 的实用技巧（解决 p29 那条「要为每个任务写奖励」的代价）：\n   把提议出的任务喂给**图像编辑扩散模型生成目标图像**，训练策略去够那张图\n   「it can be challenging to define a reward function for all the different tasks.\n     Whereas, **if you have an image of the task you're trying to accomplish,\n     then your reward function can be based on whether you're close to this image**」\n   ⇒ 接上 L15 p38 的图像子目标\n\np33 第三条路（最朴素但有道理）：**把任务设计成可以反复做的**\n   例子：**给商家叠餐巾** —— 餐巾多得叠不完，根本不需要复位\n   老师承认这方面「isn't necessarily a lot of research」\n   ⇒ 但它提醒一件事：**有时候改任务比改算法便宜**", "tbl": {"head": ["「该练哪个任务」的两条路", "怎么做", "毛病"], "rows": [["<b>① 写死</b>", "<b>预定义任务集合 + 转移图</b>", "<span class='w'>不可扩展，要人设计</span>"], ["<b>② 学提议器（SOAR）</b>", "<b>问 VLM「此刻能做什么」</b>", "<span class='w'>⚠ 仍是前沿，不稳定</span>"], ["<b>提议器 vs 高层策略</b>", "<b>提议器要「广」</b>", "<b>高层策略要「准」</b>"], ["<b>奖励怎么办</b>", "<b>生成目标图像，比「离它多近」</b>", "<b>省掉逐任务写奖励</b>"]]}, "say": "原话（提议器与分层高层策略的区别）：<em>“The question is, how is this different from hierarchical learning? … this task proposer, you can think of it — it shares some similarities with the high-level policy that's telling you what to do in a certain circumstance. But <b>its purpose is actually quite different</b>. So the purpose here is actually having it <b>propose things that you could do in the environment that you could practice</b>. Whereas, in a hierarchical system, the high-level policy goal is to say like, <b>what is the next subtask that will achieve some outcome</b> at the end of the day. And so this is actually something where you want it to give you <b>lots of different things</b> that allow you to learn lots of different things. Whereas, a high-level policy, you're much more <b>goal directed</b>.”</em><br><br>原话（VLM 判断此刻可行什么，以及用目标图像省掉逐任务奖励）：<em>“you could ask a language model to say, what are the different things that I could do in this environment to get better… We could open this toy microwave. We could pick up the banana. We could push the eggplant, move the pot. <b>But if we instead told it to pick up the carrot, that's not something that you can do in the scene.</b> … with this approach, you need to update this using a reward function for each task. And <b>it can be quite challenging to define a reward function for all of the different tasks. Whereas, if you have an image of the task that you're trying to accomplish, then your reward function can be based on whether or not you're close to this image.</b>”</em>", "res": {"tag": "推断", "v": "<b>p32 这一页对你有一个相当直接的用处：<b>讲义明确标成「公开问题」的那件事，你手上恰好有一个有定理的答案</b>。</b><br><span class='k'>问题是「<b>该去为哪个任务收集数据？</b>」，而讲义给的现成办法是「写死一张图」或「问 VLM 此刻能做什么」——<b>两条都是启发式的</b></span>。<b>⇒ 而这在形式上就是<b>实验设计 / 主动学习</b>：在一堆候选的测量动作里，挑那个最能减少不确定性的。</b><br><b>⇒ 你学过的 <b>CSE 541 L07 的 G-最优设计</b>正是这个问题的最优解</b>：<span class='w'><code>min_λ max_{x∈𝒳} xᵀA(λ)^{-1}x</code>，而且 <code>λ*</code> <b>不需要任何真实奖励</b>就能算，只依赖候选集合的几何</span>。<b>⇒ 两者的对应是逐项的：讲义的「哪个任务」↔ 你的「哪个配置」；讲义的「此刻可行吗」↔ 你的「这个配置在当前预算下跑得起吗」。</b><br><b>⚠ 但要诚实说清一处<b>不</b>对应的地方，否则这个类比会被拆穿：<b>讲义那边的候选是受<b>当前状态</b>约束的</b></b>（<span class='k'>杯子在地上，就只能练「捡杯子」；画面里没胡萝卜，就不能练「拿胡萝卜」</span>）；<b>而你的配置空间<b>不受状态约束</b>——任何配置你随时都能跑。</b><br><b>⇒ 这个差别对你是<b>有利</b>的：<b>你的实验设计问题比机器人那边<b>容易</b></b></b>。<span class='w'>机器人要在「可行集随状态变化」的约束下做设计，这正是它成为公开问题的原因之一；而你的可行集是固定的全集，G-最优设计直接适用。</span><br><b>⇒ 所以这给了你一句很好的定位：<b>在机器人领域「选哪个任务去练」仍是开放问题，因为可行集随状态变化；而在我们的设定里可行集是固定的，于是实验设计的经典解（G-最优设计）可以直接用——这正是我们相对启发式搜索的优势所在。</b></b><br><b>而「提议器要<b>广</b>、高层策略要<b>准</b>」这个区分，对你也有一条实际含义。</b> <span class='k'>你的流程里这两件事<b>都</b>有：<b>搜索阶段</b>要广（覆盖配置空间、别坍缩）；<b>最终部署</b>要准（挑那个 <code>G</code> 最高的）</span>。<b>⇒ 用同一个准则做这两件事是错的——而「用当前最优来决定下一步测什么」恰恰就是在用「准」的准则做「广」的事。</b><span class='w'>这是第四次撞上同一条了（L07 p3、L15 的 FTL、L16 p17 的坍缩，以及这里）。</span>", "ref": "本讲 p32（逐字核对）· 讲稿（提议器 vs 高层策略、VLM 判可行）· L07 p4 p5 · L15 p30 · 本讲 p17 · 简报 §4b §4c（已核）"}},
{"r": [34, 39], "t": "部署之后呢：人也会犯错，然后在一瞬间调整过来", "star": 2, "quote": "<b>So far…</b><br><em>We've looked at learning policies without resets: Can improve the quality of the policy through autonomous practice.</em><br><em>What happens after we deploy the policy?</em><br><em><b>Obviously, everything works perfectly and nothing ever goes wrong.</b></em><br><em><b>The natural world is complex, and something likely will go wrong, despite preparation.</b></em><br><b>Even humans make mistakes and adapt</b>〔开门视频：钥匙没对准锁孔，人把钥匙抽回来重插〕", "one": "<b>前半讲解决的是「训练时没人帮忙」。这一页转到下半场：训练得再好，部署之后还是会出岔子——而人遇到这种事是在一瞬间当场调整的，不是回去重训。</b>", "pts": ["<b>这一页的写法值得一提：<b>先写一句反讽，下一页再把它推翻</b>。</b> <span class='k'>p35：「What happens after we deploy the policy? <b>Obviously, everything works perfectly and nothing ever goes wrong.</b>」；p36 加上一句：「<b>The natural world is complex, and something likely will go wrong, despite preparation.</b>」</span>", "<b>⇒ 这个安排是在提醒一件容易被忽略的事：<b>前半讲所有的努力都是为了「学出一个好策略」，而这默认了「好策略部署之后就一直好」</b>。</b> <span class='w'>而这个默认在真实世界里不成立。</span>", "<b>p37–p39 用一段开门的视频把「当场调整」这件事演出来了，而细节很关键。</b> <span class='k'>讲稿：「the person is trying to apply force, and <b>the key actually isn't correctly in the hole</b>. And then they try again by <b>removing the key backwards, and then putting it back into the keyhole</b>」</span>。", "⚠️ <b>⇒ 要注意的是<b>时间尺度</b>：「the person makes a mistake, and then adapts, really, <b>in a split second</b>」——<b>一瞬间</b>。</b> <span class='w'>人没有「回去重新训练」，也没有「多试一百次」；他在<b>同一次尝试里</b>就改了策略。</span>", "<b>⇒ 这正是下一节要定义的那个设定：<b>不是「多试几次学会」，而是「这一次就得解决」</b>。</b>", "<b>把三种设定的时间结构摆开，这一讲的两半就连起来了。</b> <span class='k'><b>分幕 RL</b>：反复试 → 部署；<b>无复位 RL</b>（本讲前半）：不停地试、不复位 → 部署；<b>单生命 RL</b>（本讲后半）：先有训练数据 → <b>只有一次机会</b></span>。", "<b>⚠ 注意这三者<b>不是</b>互相替代的，而是三个不同的阶段。</b> <span class='w'>你可以先用无复位 RL 把策略练好（前半讲），<b>然后</b>在部署时还要面对单生命的问题（后半讲）</span>。<b>⇒ p35 那句「We've looked at… <b>What happens after</b> we deploy」就是在做这个衔接。</b>", "<b>最后记一个措辞：这一节的标题用的是 <b>adapt</b>（适应）而不是 <b>learn</b>（学习）。</b> <span class='k'>⇒ 差别在于时间尺度和数据量：<b>学习</b>是从很多经验里慢慢改进，<b>适应</b>是从极少的经验里立刻改变行为</span>。<b>而后面会看到，这个差别决定了算法要在<b>哪个空间</b>里动手（p43–44）。</b>"], "eq": "这一页的写法：**先写一句反讽，下一页再把它推翻**\n   p35：「What happens after we deploy the policy?\n          **Obviously, everything works perfectly and nothing ever goes wrong.**」\n   p36：「**The natural world is complex, and something likely will go wrong,\n           despite preparation.**」\n\n   ⇒ 在提醒一件容易被忽略的事：\n     **前半讲所有努力都是为了「学出一个好策略」，\n       而这默认了「好策略部署之后就一直好」** —— 真实世界里不成立\n\np37–p39 开门视频（细节很关键）：\n   「the person is trying to apply force, and **the key actually isn't correctly\n     in the hole**. And then they try again by **removing the key backwards,\n     and then putting it back into the keyhole**」\n\n⚠ 要注意的是**时间尺度**：\n   「the person makes a mistake, and then adapts, really, **in a split second**」\n   ⇒ 人没有「回去重新训练」，也没有「多试一百次」\n     他在**同一次尝试里**就改了策略\n   ⇒ 正是下一节要定义的设定：**不是「多试几次学会」，而是「这一次就得解决」**\n\n**三种设定的时间结构**（这一讲的两半就连起来了）：\n   **分幕 RL**：反复试 → 部署\n   **无复位 RL**（本讲前半）：不停地试、不复位 → 部署\n   **单生命 RL**（本讲后半）：先有训练数据 → **只有一次机会**\n\n⚠ 三者**不是**互相替代，而是三个不同阶段：\n   可以先用无复位 RL 把策略练好（前半讲），\n   **然后**在部署时还要面对单生命的问题（后半讲）\n   p35 那句「We've looked at… **What happens after** we deploy」就是在做衔接\n\n措辞：这一节用的是 **adapt**（适应）而不是 **learn**（学习）\n   差别在时间尺度与数据量：\n     **学习** = 从很多经验里慢慢改进\n     **适应** = 从极少的经验里立刻改变行为\n   ⇒ 这个差别决定了算法要在**哪个空间**里动手（p43–44）", "tbl": {"head": ["", "分幕 RL", "无复位 RL", "单生命 RL"], "rows": [["训练阶段", "<b>反复试 + 复位</b>", "<b>不停地试，不复位</b>", "<b>先有训练数据</b>"], ["测试阶段", "<span class='w'>部署，不再学</span>", "<span class='w'>部署，不再学</span>", "<b>⚠ 边做边学，只有一次机会</b>"], ["关键词", "learn", "learn", "<b>adapt</b>"], ["时间尺度", "很多次尝试", "很多次尝试", "<b>一瞬间</b>"], ["三者关系", "—", "—", "<b>⚠ 不是替代，是三个阶段</b>"]]}, "say": "原话（那句反讽，以及它要引出的东西）：<em>“we've been trying to learn policies without resets. You'd improve the quality of the policy through practice, but then at some point, we're actually going to be deploying the policy. And ideally, this policy will be pretty good. And maybe you're in a scenario where, <b>obviously, everything's going to work perfectly. Nothing will ever go wrong</b>, when you actually go and deploy your policy. <b>But in practice, that's not the case.</b> And the natural world, things will go wrong, despite having a lot of training.”</em><br><br>原话（开门视频：一瞬间的当场调整）：<em>“here's a video where a person is trying to open a door. And if you look really carefully, you'll notice that, actually, <b>the person makes a mistake, and then adapts, really, in a split second</b> in order to accomplish the task. So if you play this video again, we'll see that right here, the person is trying to apply force, and <b>the key actually isn't correctly in the hole</b>. And then they try again by <b>removing the key backwards, and then putting it back into the keyhole</b>.”</em>"},
{"r": [40, 42], "t": "单生命 RL：一条命，而且场景是没见过的", "star": 3, "quote": "<b>Single-Life Reinforcement Learning (SLRL)</b><br><em><b>Given prior data in train env(s), agent has one “life” to autonomously complete task in novel, OOD scenario.</b></em><br><em><b>Can we fine-tune with RL in a single episode at test time?</b></em><br><b>How to approach single-life RL?</b><br><em>Can we fine-tune with vanilla reinforcement learning, but at test time?</em><br><em><b>Agent fails to handle or recover from out-of-distribution states without interventions.</b></em><br>〔出处〕<em>Chen, Sharma, Levine, Finn. <b>You Only Live Once: Single-Life Reinforcement Learning</b>, NeurIPS '22</em>", "one": "<b>设定有两个刺：只有一条命（不能重来），而且环境是训练时没见过的。于是「在测试时继续跑 RL」这个最直接的想法失败了——它确实在更新，但就是爬不起来。</b>", "pts": ["<b>定义要逐个短语读，因为每个短语都在加一道约束。</b> <span class='k'>① <b><em>Given prior data in train env(s)</em></b>——不是从零开始，你有训练环境里的经验；② <b><em>one “life”</em></b>——<b>一次机会，不能重来</b>；③ <b><em>autonomously</em></b>——没有人干预；④ <b><em>novel, OOD scenario</em></b>——<b>场景是训练时没见过的</b></span>。", "<b>⇒ 第 ② 和第 ④ 条合起来才是真正的难点：<b>既不能多试，又不能指望见过</b>。</b> <span class='w'>只要少一条，问题都会容易很多——能多试就退化成无复位 RL；见过就退化成普通部署。</span>", "<b>讲稿给了一个很好记的例子：<b>在平地上训练过的腿式机器人，遇到了一个没见过的障碍</b>。</b> <span class='k'>「you have training experience in flat ground. And then at some point, you encounter some obstacle that you hadn't seen before, and you need to figure out how to get over this obstacle, <b>despite not having seen this during training</b>」</span>。", "<b>p42 试的是最自然的想法：<b>在测试时继续用普通 RL 微调</b>——边跑边做 TD 更新或策略梯度。</b> <span class='w'>讲稿：「If we make a mistake, maybe we can just update our policy with TD updates or policy gradients, <b>live, as we're rolling out our policy</b>」</span>。", "⚠️ <b>结果一半成功一半失败，而失败的那一半很说明问题。</b> <span class='k'>成功的一半：「the policy actually <b>does figure out how to get over the first obstacle</b>, even though it has never seen that obstacle before」</span>；<b>失败的一半：「eventually, it actually <b>gets stuck on flipped over</b>」——<b>翻过去了，爬不起来</b>。</b>", "<b>⇒ 而最值得注意的是讲稿强调的那一点：<b>RL 还在跑</b>。</b> <span class='w'>「even though it's running reinforcement learning, and you can see it's somewhat trying to get up, <b>it essentially gets stuck</b>. And <b>even though you're still running reinforcement learning, still running the policy, and still running updates</b>, it isn't able to recover from these states that it hasn't seen before」</span>。", "<b>⇒ 所以结论不是「RL 没更新」，而是<b>「更新了也没用」</b>。</b> <span class='k'>⇒ 这和 L16.a p5 那个「卡住」是同一个现象的升级版：<b>那里是策略确定性地停在原地；这里是策略在努力、在更新，但更新的方向改变不了局面</b></span>。", "<b>幻灯把原因写成一句：<b><em>Agent fails to handle or recover from out-of-distribution states <b>without interventions</b></em></b>——注意结尾那三个字。</b> <span class='w'>它在说：这个问题<b>本来</b>是靠人干预解决的（有人把机器人扶起来），而单生命设定恰恰不允许干预</span>。", "<b>⚠ 为什么普通 RL 在这里不够？可以这样想：<b>RL 的更新量级是为「很多次尝试」设计的</b>。</b> <span class='k'>梯度下降每一步只挪一点点，靠大量步数累积；而单生命只给你几十上百步</span>。<b>⇒ 所以问题不在 RL 的原理，在<b>它改变行为的速度</b>——这正是下一页两个想法都在攻的点。</b>", "<b>最后记一下这篇的名字，起得很直白：<b><em>You Only Live Once</em></b>（NeurIPS 2022）。</b>"], "eq": "**定义**（逐个短语读，每个都在加一道约束）：\n   ① **Given prior data in train env(s)** —— 不是从零开始，有训练环境的经验\n   ② **one “life”**                      —— **一次机会，不能重来**\n   ③ **autonomously**                    —— 没有人干预\n   ④ **novel, OOD scenario**             —— **场景是训练时没见过的**\n\n   ⇒ **② + ④ 合起来才是真正的难点：既不能多试，又不能指望见过**\n     少一条都容易很多：能多试 → 退化成无复位 RL；见过 → 退化成普通部署\n\n例子（很好记）：**平地上训练过的腿式机器人，遇到没见过的障碍**\n   「you need to figure out how to get over this obstacle,\n     **despite not having seen this during training**」\n\np42 试最自然的想法：**测试时继续用普通 RL 微调**（边跑边做 TD 更新或策略梯度）\n\n⚠ 结果一半成功一半失败：\n   成功：「the policy **does figure out how to get over the first obstacle**,\n           even though it has never seen that obstacle before」\n   失败：「eventually, it actually **gets stuck on flipped over**」\n          —— **翻过去了，爬不起来**\n\n   最值得注意的是讲稿强调的那一点：**RL 还在跑**\n     「**even though you're still running reinforcement learning, still running\n       the policy, and still running updates**, it isn't able to recover」\n\n   ⇒ 结论不是「RL 没更新」，而是**「更新了也没用」**\n   ⇒ 与 L16.a p5 那个「卡住」是同一现象的升级版：\n     那里是策略**确定性地停在原地**\n     这里是策略**在努力、在更新，但更新的方向改变不了局面**\n\n幻灯写成一句：**Agent fails to handle or recover from OOD states\n   without interventions** —— 注意结尾那三个字\n   它在说：这个问题**本来**是靠人干预解决的（有人把机器人扶起来），\n   而单生命设定恰恰**不允许**干预\n\n⚠ 为什么普通 RL 不够：**RL 的更新量级是为「很多次尝试」设计的**\n   梯度下降每步只挪一点点，靠大量步数累积\n   而单生命只给你几十上百步\n   ⇒ 问题不在 RL 的原理，在**它改变行为的速度**\n     —— 正是下一页两个想法都在攻的点\n\n出处名字很直白：**You Only Live Once**（NeurIPS 2022）", "say": "原话（在测试时跑 RL：过了第一个障碍，然后翻过去爬不起来）：<em>“So the policy actually does figure out how to get over the first obstacle, even though it has never seen that obstacle before. And then, eventually, it actually <b>gets stuck on flipped over</b>. And <b>even though it's running reinforcement learning</b>, and you can see it's somewhat trying to get up, <b>it essentially gets stuck. And even though you're still running reinforcement learning, still running the policy, and still running updates, it isn't able to recover from these states that it hasn't seen before, without interventions.</b>”</em>", "res": {"tag": "推断", "v": "<b>「更新了也没用」这个现象对你有一个很具体的映射，而且它解释了一类你可能已经见过、却归错因的失败。</b><br><span class='k'>讲义的情形是：机器人翻过去了，RL 还在更新，但更新改变不了局面——因为<b>更新的幅度</b>配不上<b>处境的严重程度</b></span>。<b>⇒ 你的工作流里的同构情形是：某条 query 进了一个坏状态（上游产出了垃圾输入 / 反思环陷入同义重复），而你的<b>重试机制还在跑</b>——换一个采样种子、再调用一次、温度调高一点。</b><br><b>⇒ 但这些都是在<b>同一个层级</b>上扰动，而问题出在更高的层级。</b> <span class='w'>重采样改变不了「上游用的是 7B 所以输出本来就不够好」这件事</span>。<b>⇒ 于是你会看到和讲义完全一样的现象：<b>系统在忙、在重试、在花钱，但不会好转</b>。</b><br><b>⇒ 这给了你一个可以直接加的判据：<b>区分「值得重试的失败」与「该换配置的失败」</b>。</b> <span class='k'>前者是随机性导致的（同样的输入重采样有机会成功），后者是能力导致的（重采样一百次也不会成功）</span>。<b>⚠ 而你现在的重试逻辑多半没有做这个区分——它对两种失败一视同仁地重试，于是在第二种上纯烧钱。</b><br><b>⇒ 一个便宜的检测：<b>看连续几次重试的输出之间的差异度</b>。</b> <span class='w'>如果重试产出的结果彼此高度相似（而且都不对），那就是能力问题不是运气问题</span>——<b>这时候该做的是升档或换路径，而不是再试一次。⇒ 这既省钱又直接改善 <code>G</code>，而且只需要一个相似度函数。</b><br><b>⚠ 另外那个定义里的 <b>OOD</b> 对你也是要正视的，而且比机器人那边更隐蔽。</b> <span class='k'>你在 benchmark 上搜出的最优配置，部署到真实流量上时，query 分布是<b>不一样</b>的</span>。<b>⇒ 讲义的 OOD 是看得见的（地上多了一个障碍）；而你的 OOD 是看不见的——<b>query 还是文字，但难度分布变了</b>，而你的配置是按旧分布调的。</b><br><b>⇒ 所以至少要报一个数：<b>最优配置在 benchmark 上的 <code>G</code> 与在一个留出的、分布不同的集合上的 <code>G</code> 差多少</b>。</b> <span class='w'>差得多，说明你的配置选择对分布敏感，那本身是一个重要的发现；差得少，那是你方法稳健性的证据。<b>两种结果都值得报。</b></span>", "ref": "本讲 p42（逐字核对）· 讲稿（翻过去爬不起来）· L16.a p5 · L15 p5 科研格 · 简报 §4b §4d（已核）"}},
{"r": [43, 44], "t": "两个有用的想法：往熟悉的地方靠，和在技能空间里适应", "star": 3, "quote": "<b>How to approach single-life RL? &nbsp; A few useful ideas:</b><br><em>- <b>Guide the learning process towards good, familiar states to avoid getting stuck</b><br>- <b>Leverage pre-training</b><br>&nbsp;&nbsp;- <b>Pre-trained skills can allow for adaptation in skill space rather than in action space</b><br>&nbsp;&nbsp;- <b>Pre-trained LLMs may be able to reason through how to adapt</b></em><br><em><b>Adaptation in low-level action space</b>〔RMA: Rapid Motor Adaptation for Legged Robots, RSS 2021〕 &nbsp;vs&nbsp; <b>Adaptation in high-level skill space</b>〔Commonsense Reasoning for Legged Robot Adaptation with Vision-Language Models, ICRA 2025〕</em>", "one": "<b>第一个想法是换目标：别再朝着终点优化了，先朝着「我认得的地方」走。第二个是换空间：与其微调权重，不如在一组已有技能之间切换——那是换策略，不是换参数。</b>", "pts": ["<b><b>想法一：把学习过程往「熟悉的好状态」引，而不是往目标引。</b></b> <span class='k'>讲稿把对比说得很清楚：「if you're running RL updates, you are running them <b>with regard to the task of getting to the goal</b>. And <b>if instead</b> you tried to run RL updates <b>to get back to states that are familiar</b>, like good states that you visited in your previous experience, then you might have a better time at <b>getting unstuck</b>」</span>。", "<b>⇒ 这是一个<b>换目标函数</b>的办法，而且它的逻辑很干净：<b>卡住的时候，「回到我认得的地方」比「到达终点」容易得多，而且一旦回去了，原来的策略就又能用了</b>。</b> <span class='w'>讲义的说法是这些熟悉状态「might be closer to the ones that are at the goal and <b>help perturb the agent back to something that it knows</b>」。</span>", "<b>⚠ 注意这里<b>需要先验数据</b>才成立：「familiar」是相对<b>训练时见过的状态</b>说的。</b> <span class='k'>⇒ 所以这个想法只在单生命设定里有意义（定义里第 ① 条就是「有训练环境的先验数据」），对从零开始的 RL 没用</span>。", "<b>效果在视频里：「it does get stuck on its back, but <b>it is able to get back up</b> after trying… and then make it to the goal state」。</b> <span class='w'>对比 p42 那个一直翻着爬不起来的——同一个环境，换了目标就出来了。</span>", "⚠️ <b><b>想法二：换一个<b>空间</b>去适应。</b> 这一条更根本，而且讲稿的论证很有说服力。</b> <span class='k'>「if you're trying to run reinforcement learning on the <b>policy weights</b>, like in the <b>low-level action space</b>, <b>you can only change the policy so much</b>. And there's <b>only so many ways you can adapt</b>」</span>。", "<b>⇒ 核心是一个<b>幅度</b>问题：微调权重只能让行为小幅偏移，而单生命的处境往往需要<b>换一个完全不同的办法</b>。</b> <span class='w'>讲稿：「if you could adapt in a <b>higher level space</b>, if you had some set of <b>pre-trained skills</b>, then you might be able to adapt <b>more drastically</b> and actually <b>try to change a strategy</b> that you're taking, rather than just changing the weights or the actions」</span>。", "<b>⇒ 那个腿式机器人的例子把差别演得最清楚：<b>如果只有「往前走」这一个技能，它就会一直往前撞；而如果有「往前、往后、往左、爬起来」几个技能可以切换，它就能试出一条路</b>。</b> <span class='k'>讲稿：「if you just keep on running a policy <b>without any context</b>, it'll just keep on trying to go forward. <b>Because it doesn't know that it tried going forward before</b>」</span>。", "<b>⚠ 那半句「<b>因为它不知道自己刚才已经试过往前走了</b>」点出了另一个要素：<b>上下文</b>。</b> <span class='w'>「with context and adaptation, then you can figure out how to…」——要能在策略之间切换，还得记住自己试过什么</span>。", "<b>p44 把两种适应空间配了出处，正好是一组对照</b>：<span class='k'><b>低层动作空间</b>——RMA（RSS 2021），从近期历史里快速适应，能应付<b>小幅</b>的分布外（不同地形）；<b>高层技能空间</b>——用视觉语言模型做常识推理（ICRA 2025），应付<b>差别大得多</b>的情形</span>。", "<b>⇒ 讲稿的判断是：<b>「if you have things that are more drastically different from what you've seen before, it can be very helpful to adapt in a more high-level space」</b>——<b>偏离越大，越要往高层去适应</b>。</b>", "<b>第三个想法只提了一句，但方向很明确：<b>预训练的语言模型可能有常识，能推理出该怎么适应</b>。</b> <span class='w'>讲稿在安全那个问答里又提了一次：这些模型「may have some common sense, suggesting maybe you shouldn't walk or run into a person, or maybe you should wait」。</span>"], "eq": "**想法一：把学习过程往「熟悉的好状态」引，而不是往目标引**\n   「if you're running RL updates, you are running them **with regard to the task\n     of getting to the goal**. And **if instead** you tried to run RL updates\n     **to get back to states that are familiar**… then you might have a better\n     time at **getting unstuck**」\n\n   ⇒ 换**目标函数**，逻辑很干净：\n     **卡住时「回到我认得的地方」比「到达终点」容易得多，\n       而一旦回去了，原来的策略就又能用了**\n\n   ⚠ 需要**先验数据**才成立：「familiar」是相对训练时见过的状态说的\n     ⇒ 只在单生命设定里有意义，对从零开始的 RL 没用\n\n   效果：「it does get stuck on its back, but **it is able to get back up**\n           after trying… and then make it to the goal state」\n\n⚠⚠ **想法二：换一个空间去适应**（更根本）\n   「if you're trying to run RL on the **policy weights**, like in the\n     **low-level action space**, **you can only change the policy so much**.\n     And there's **only so many ways you can adapt**」\n\n   ⇒ 核心是**幅度**问题：微调权重只能小幅偏移，\n     而单生命的处境往往需要**换一个完全不同的办法**\n   「if you could adapt in a **higher level space**, if you had **pre-trained\n     skills**, then you might be able to adapt **more drastically** and\n     **try to change a strategy**, rather than just changing the weights」\n\n   腿式机器人的例子（差别演得最清楚）：\n     只有「往前走」一个技能 ⇒ 一直往前撞\n     有「往前/往后/往左/爬起来」可切换 ⇒ 能试出一条路\n     「if you just keep on running a policy **without any context**, it'll just\n       keep on trying to go forward. **Because it doesn't know that it tried\n       going forward before**」\n\n   ⚠ 那半句点出另一个要素：**上下文**\n     要能在策略之间切换，还得**记住自己试过什么**\n\np44 两种适应空间的对照（配了出处）：\n   **低层动作空间** —— RMA（RSS 2021），从近期历史快速适应\n                      能应付**小幅**分布外（不同地形）\n   **高层技能空间** —— VLM 常识推理（ICRA 2025），应付**差别大得多**的情形\n\n   判断：「if you have things that are **more drastically different** from what\n           you've seen before, it can be **very helpful to adapt in a more\n           high-level space**」\n   ⇒ **偏离越大，越要往高层去适应**\n\n第三个想法（只提了一句，方向明确）：\n   **预训练的语言模型可能有常识，能推理出该怎么适应**\n   安全问答里又提一次：这些模型「may have some common sense, suggesting\n     maybe you shouldn't walk or run into a person, or maybe you should wait」", "tbl": {"head": ["", "在低层动作空间适应", "在高层技能空间适应"], "rows": [["改的是什么", "<b>策略权重 / 动作</b>", "<b>选哪个技能（换策略）</b>"], ["能改多大", "<span class='w'>⚠ 只能小幅偏移</span>", "<b>可以换一整套打法</b>"], ["适合多大的分布外", "<b>小（不同地形）</b>", "<b>大（没见过的障碍）</b>"], ["还需要什么", "近期历史", "<b>⚠ 上下文（记住试过什么）</b>"], ["代表工作", "<b>RMA（RSS 2021）</b>", "<b>VLM 常识推理（ICRA 2025）</b>"]]}, "say": "原话（想法一：朝熟悉状态优化而不是朝目标优化）：<em>“when you're getting stuck, you end up in this state that it's hard to recover from. And if you're doing reinforcement learning updates… <b>you are running reinforcement learning updates, with regard to the task of getting to the goal</b>. And <b>if instead of trying to run RL updates to get to the goal, if you instead tried to run RL updates to get back to states that are familiar, like good states that you visited in your previous experience, then you might have a better time at getting unstuck</b>, where, for example, these states might be closer to the ones that are at the goal and help perturb the agent back to something that it knows.”</em><br><br>原话（想法二：权重只能改这么多，要换空间）：<em>“if you're trying to run reinforcement learning on the policy weights, like in the low-level action space, <b>you can only change the policy so much. And there's only so many ways you can adapt.</b> And if instead, if you could adapt in a higher level space, if you had some set of pre-trained skills, then <b>you might be able to actually adapt more drastically and actually try to change a strategy that you're taking, rather than just changing the weights or the actions that you're using</b>.”</em><br><br>原话（没有上下文就会一直往前撞）：<em>“say that you have this legged robot that's trying to reach a goal over here. Then, if all the agent sees is this image right here, tries to go forward, goes backward, <b>if you just keep on running a policy without any context, it'll just keep on trying to go forward. Because it doesn't know that it tried going forward before.</b> If instead you try different strategies like moving left, moving backwards, <b>with context and adaptation</b>, then you can figure out how to ultimately… problem solve its way through these different obstacles.”</em>", "res": {"tag": "推断", "v": "<b>「在技能空间里适应，而不是在动作空间里适应」这一条，对你几乎是逐字可搬的——而且它正好给你的<b>逐节点档位</b>找到了一个名分。</b><br><span class='k'>讲义的论证是：微调权重只能让行为<b>小幅</b>偏移，而处境需要的是<b>换一套打法</b>；所以要在一组预训练技能之间切换</span>。<b>⇒ 你的工作流里，「动作空间」是什么？是<b>重采样、调温度、改措辞</b>——全都是小幅扰动。而「技能空间」是什么？<b>正是你的配置空间：换节点档位、换路径、换分解粒度</b>。</b><br><b>⇒ 于是你可以这样说你方法的定位：<b>我们提供的是一个「技能空间」——一组结构化的、可切换的系统配置，使得失败时的适应可以发生在策略层面而不是采样层面。</b></b><span class='w'>这比「我们做模型选择」有分量得多，而且有讲义的论证撑着。</span><br><b>⇒ 而「偏离越大越要往高层适应」那条判断，给了你一个<b>可操作的分级响应</b>：</b><br><span class='k'><b>小偏差</b>（输出格式略有问题）→ 重采样就够了（低层）；<b>中偏差</b>（某节点质量明显不行）→ <b>给那个节点升档</b>（中层）；<b>大偏差</b>（整类 query 都做不好）→ <b>换工作流结构</b>（高层）</span>。<b>⇒ 三级，而且<b>代价递增</b>——这是一个很自然、也很好讲的设计。</b><br><b>⚠ 而「想法一」（往熟悉的状态靠）在你这里对应一条非常实际的<b>兜底策略</b>：<b>失败时回退到已知可用的配置，而不是继续探索</b>。</b> <span class='w'>讲义的逻辑是「回到我认得的地方比到达终点容易，而且回去了原来的策略就又能用」</span>；<b>⇒ 你的版本：某条 query 在搜出来的「最优」配置上反复失败时，<b>退回全大模型的基线配置</b>跑一次。</b><span class='k'>代价是这条 query 变贵了，但<b>它会出结果</b>——而不是烧满预算还是 0 分。</b><br><b>⇒ 这对你的 <code>G</code> 分布有一个很值钱的效果：<b>它砍掉了左尾</b>。</b> <span class='w'>而左尾（卡住的那些 query）正是 L16.a p5 科研格说的那个重尾来源</span>。<b>⇒ 平均 <code>G</code> 可能只升一点，但<b>方差会明显下降</b>，而更低的方差直接意味着更少的测量就能把配置分开（L09 的 <code>ρ_*</code> 里方差在分子上）。<b>这是一个同时改善性能和统计效率的改动。</b></b><br><b>⚠ 最后那个「没有上下文就会一直往前撞」的细节别漏了：<b>你的重试必须知道自己试过什么</b>。</b> <span class='k'>如果每次重试都是无状态的（同样的 prompt、同样的配置），那它就是那个一直往前撞的机器人。<b>把「已经试过什么、失败在哪」写进重试的上下文</b>，是一个一行改动、却决定成败的细节。</span>", "ref": "本讲 p43–p44（逐字核对）· 讲稿（权重只能改这么多、没有上下文就一直往前撞）· L16.a p5 科研格 · L09 p11 · 简报 §2 §4b（已核）"}},
{"r": [45, 46], "t": "收尾：自主的两半，以及安全那个没解决的问题", "star": 2, "quote": "<b>Summary</b><br><em>- Why aren't robots autonomous already?<br>- Defining the problem: autonomous RL<br>- Developing the algorithms<br>&nbsp;&nbsp;- Learning policies without human intervention<br>&nbsp;&nbsp;- Single life RL</em><br><b>Next time</b> — <em>Guest lecture from <b>Ashish Kumar (Tesla Optimus)</b></em>", "one": "<b>这一讲是两半：训练时没人帮忙（无复位），部署后没人救场（单生命）。而两半共用同一个核心动作——当你到了一个不该在的地方，怎么自己回来。</b>", "pts": ["<b>把整讲压成一句：<b>「自主」要解决的是同一件事在两个阶段的两种形态——到了不该在的地方，怎么<b>自己</b>回来</b>。</b> <span class='k'><b>训练阶段</b>：试完一次之后怎么回到能再试的状态（无复位 RL）；<b>部署阶段</b>：遇到没见过的情况怎么当场脱困（单生命 RL）</span>。", "<b>前半的三条路线按「拿什么换自主」分，这样记最清楚。</b> <span class='w'><b>FBRL</b>：拿<b>一半算力</b>换（训两个策略扔一个）；<b>MEDAL</b>：拿<b>一小批演示</b>换（而且顺带把起点铺开，样本效率更高）；<b>任务循环</b>：拿<b>多个奖励函数</b>换（而且什么都不浪费，策略全留）</b></span>。", "<b>后半的两个想法按「改什么」分：<b>想法一改<b>目标</b>（朝熟悉状态而不是朝终点）；想法二改<b>空间</b>（在技能之间切换而不是微调权重）</b>。</b>", "<b>⚠ 而贯穿全讲、出现了三次的那个词是 <b>卡住</b>。</b> <span class='k'>p5 的「漂走了回不来」、p17 的「赖在目标不走」、p42 的「翻过去爬不起来」——<b>三种形态，同一个毛病</b></span>。<b>⇒ 而每一次的解法都是同一类：<b>给系统一条回到已知良好区域的通道</b>（后向策略 / 分布匹配 / 朝熟悉状态优化）。</b>", "<b>讲稿最后回答了一个这一讲没解决的问题，而且答得很坦率：<b>安全约束怎么办</b>。</b> <span class='w'>风险是具体的：腿式机器人可能摔坏自己，机械臂可能把玻璃杯掉地上、或者用力过猛撞坏东西</span>。", "<b>给出的办法有两类。</b> <span class='k'><b>① 学一个恢复策略</b>：「learn some notion of safety and learn <b>when you're actually in a high risk state</b>, and then go back to a state that is less risky」——这其实就是想法一的安全版；<b>② 在控制器上直接加硬约束</b>：别把电机用到过热、给机器人围一个盒子限制它能施力的范围</span>。", "⚠️ <b>但老师点出了一个绕不过去的循环，这是全讲最诚实的一句：<b><em>to learn safety, you need examples of failing. So it's generally a pretty tricky problem.</em></b></b> <span class='w'>⇒ 要学会「什么是危险」，就得先危险几次。而硬约束不是哪里都加得上（「that's not possible everywhere」）。</span>", "<b>⇒ 这和前面那些「先有鸡先有蛋」是同一个家族，但更棘手：<b>前面那些循环靠一点演示数据就能打破，而安全这个循环要打破，代价是真实的损坏</b>。</b>", "<b>最后记两条这一讲明确点名的<b>公开问题</b>，它们是留下的研究线索</b>：<span class='k'>① <b>该为哪个任务收集数据（p32）</b>——「an open research question」，而且「bleeding edge」；② <b>单生命 RL 的整套做法（p43）</b>——「also bleeding edge of research」</span>。<b>⇒ 外加一条现状判断：这些无复位方法「仍在研究阶段，机器人公司今天并没有在用」（p26）。</b>", "<b>下一讲是客座：<b>Ashish Kumar（Tesla Optimus）</b>，讲 sim2real 与人形机器人。</b> <span class='w'>⇒ 从「怎么在真机上自主地训」转到「怎么把仿真里训的搬到真机上」——两条互补的路。</span>"], "eq": "整讲压成一句：**「自主」是同一件事在两个阶段的两种形态 ——\n   到了不该在的地方，怎么自己回来**\n   **训练阶段**：试完一次后怎么回到能再试的状态（无复位 RL）\n   **部署阶段**：遇到没见过的情况怎么当场脱困（单生命 RL）\n\n前半三条路线（按「拿什么换自主」分）：\n   **FBRL**     拿**一半算力**换（训两个策略扔一个）\n   **MEDAL**    拿**一小批演示**换（顺带把起点铺开，样本效率更高）\n   **任务循环** 拿**多个奖励函数**换（什么都不浪费，策略全留）\n\n后半两个想法（按「改什么」分）：\n   想法一 改**目标**（朝熟悉状态而不是朝终点）\n   想法二 改**空间**（在技能之间切换而不是微调权重）\n\n⚠ 贯穿全讲、出现三次的词是 **卡住**：\n   p5  漂走了回不来\n   p17 赖在目标不走\n   p42 翻过去爬不起来\n   ⇒ **三种形态，同一个毛病**\n     而每次的解法都是同一类：**给系统一条回到已知良好区域的通道**\n     （后向策略 / 分布匹配 / 朝熟悉状态优化）\n\n讲稿最后答的那个没解决的问题：**安全约束怎么办**\n   风险很具体：腿式机器人摔坏自己，机械臂把玻璃杯掉地上、用力过猛撞坏东西\n\n   两类办法：\n     ① **学一个恢复策略**：「learn **when you're actually in a high risk state**,\n        and then go back to a state that is less risky」（想法一的安全版）\n     ② **在控制器上加硬约束**：别把电机用到过热、围一个盒子限制施力范围\n\n⚠ 绕不过去的循环（全讲最诚实的一句）：\n   **to learn safety, you need examples of failing.\n     So it's generally a pretty tricky problem.**\n   ⇒ 要学会「什么是危险」，就得先危险几次\n     而硬约束不是哪里都加得上（「that's not possible everywhere」）\n   ⇒ 与前面那些先有鸡先有蛋同一个家族，但**更棘手**：\n     那些循环靠一点演示数据就能打破，\n     **而安全这个循环要打破，代价是真实的损坏**\n\n这一讲明确点名的**公开问题**：\n   ① **该为哪个任务收集数据**（p32）—— an open research question，bleeding edge\n   ② **单生命 RL 的整套做法**（p43）—— also bleeding edge of research\n   外加现状判断：这些无复位方法「仍在研究阶段，机器人公司今天并没有在用」（p26）\n\n下一讲：客座 **Ashish Kumar（Tesla Optimus）**，sim2real 与人形机器人\n   ⇒ 从「怎么在真机上自主地训」转到「怎么把仿真里训的搬到真机上」", "tbl": {"head": ["三条无复位路线", "拿什么换自主", "有没有浪费"], "rows": [["<b>FBRL</b>", "<b>一半算力</b>（训两个扔一个）", "<span class='w'>有</span>"], ["<b>MEDAL</b>", "<b>一小批演示</b>", "<span class='w'>有（仍扔后向）</span>"], ["<b>任务循环</b>", "<b>多个奖励函数</b>", "<b>没有（策略全留）</b>"], ["⚠ 都没解决的", "<b>安全</b>", "<b>学安全需要先失败几次</b>"]]}, "say": "原话（安全：学恢复策略，加硬约束，以及那个绕不过去的循环）：<em>“another circumstance that might require human oversight is, if you're in scenarios where you could make <b>safety critical mistakes</b> — if you are a legged robot, you can fall in a way that damages the robot. If you're a manipulator, you could drop a glass onto the floor… There's actually work that builds very directly upon some of these ideas, where you actually try to <b>learn some notion of safety and learn when you're actually in a high risk state, and then go back to a state that is less risky</b>… The other practical thing to do is to try to, to the extent possible, <b>impose safety constraints on the controller itself</b> so that you're not using the motors to the point in which they'll overheat, or have a box around the robot… Now, <b>that's not possible everywhere</b>. And learning notions of safety might be the only way to actually address the problem in general. <b>Although to learn safety, you need examples of failing. So it's generally a pretty tricky problem.</b>”</em>"}
];

var TH = {"title": "L16 接上课题的哪一段：它给了你一个学名、一个公开问题的现成答案，和一条砍掉左尾的兜底", "arc": "<b>这一讲表面上全是机器人，但它有四处和课题接得很紧，而且其中一处是直接把你手上的工具按在一个被点名的公开问题上。</b><br><br><b>① <b>p13 给了你一个学名</b>：<b>deployed policy evaluation</b>（部署策略评估）vs <b>continuing policy evaluation</b>（持续策略评估）。</b><br><span class='k'>前者是「学出来的策略有多好」（<code>J(π)</code>，从初始分布出发跑一幕），后者是「这一辈子一共拿到多少奖励」（average reward RL）。两个例子把差别钉死了：<b>火星车</b>要的是这一路采集到的数据，<b>机器人厨师</b>不在乎训练时做砸多少顿饭</span>。<br><b>⇒ 你做的是 deployed policy evaluation —— 搜索阶段跑的烂配置是<b>训练成本</b>，不计入目标；你报的是最终配置的 <code>G</code>。</b><span class='w'>这句话可以原样写进论文，而且 EARL（ICLR 2022）那条线有现成引用。</span><br><b>⚠ 但要主动挑明一处紧张：<b>「成本」在你这里出现了两次</b></b>——<code>G</code> 里的 <code>λ·Cost</code>（最终配置每次推理的成本，属于部署评估）与<b>搜索阶段烧掉的调用</b>（训练成本，按定义不计入）。<span class='k'>一个只看总账单的审稿人会把两者加起来问你。稳妥的报法是两个数都给，再附一条摊销曲线：搜索成本摊到多少条 query 才回本。</span><br><br><b>② <b>p17 的「状态分布坍缩」是你这学期第<b>四</b>次撞上同一条道理</b>，而四次用的是四种语言。</b><br><span class='w'>CSE 541 L07 p3 用特征分解说（测得少的方向贡献大）· L15/L01 用跟随领先者的灾难说 · 本讲 p17 用「数据挤在目标附近、奖励很好看但策略学不会」说 · 本讲 p32 又用「该练哪个任务」说一遍</span>。<b>⇒ 四门课、四种数学、同一个结论：<b>信息来自覆盖，不来自重复</b>；而且四次都附带同一个警告——<b>坍缩时你看到的指标是好看的</b>。</b><br><b>⇒ 对你最尖锐的推论：<b>逐次淘汰会<b>主动</b>制造坍缩</b>。</b> <span class='k'>那是算法的设计意图（把预算集中到存活候选），但副作用是<b>被砍掉的那片区域你再也拿不到数据</b>。砍错了（有 <code>δ</code> 概率）你不会知道，因为剩下的测量都在幸存者身上，而它们的 <code>Ĝ</code> 看起来都正常</span>。<b>⇒ 这给了 L15 那条「误砍不可逆」一个更狠的版本：<b>误砍不仅不可逆，而且不可见</b>。</b><br><br><b>③ <b>p32 把「该为哪个任务收集数据」明确标成了公开问题，而你手上有一个有定理的答案。</b></b><br><span class='w'>讲义给的现成办法只有两条，都是启发式的：把任务图写死，或者问 VLM 此刻能做什么</span>。<b>⇒ 而这在形式上就是<b>实验设计</b>，CSE 541 L07 的 <b>G-最优设计</b>正是它的最优解——而且 <code>λ*</code> 不需要任何真实奖励，只依赖候选集合的几何。</b><br><b>⚠ 更有意思的是<b>不</b>对应的那一处，而它对你有利</b>：<span class='k'>讲义那边的候选受<b>当前状态</b>约束（杯子在地上就只能练「捡杯子」，画面里没胡萝卜就不能练「拿胡萝卜」），而你的配置空间<b>不受状态约束</b>——任何配置随时都能跑</span>。<b>⇒ 所以：<b>在机器人领域这仍是开放问题，部分是因为可行集随状态变化；而我们的可行集是固定的，于是实验设计的经典解可以直接用。</b>这是一句很好的定位。</b><br><br><b>④ <b>p43 的「在技能空间而不是动作空间里适应」给了你的逐节点档位一个名分。</b></b><br><span class='w'>讲义的论证是幅度问题：微调权重「只能把策略改这么多」，而处境往往需要<b>换一整套打法</b>，所以要在预训练技能之间切换</span>。<b>⇒ 你的工作流里，「动作空间」是重采样、调温度、改措辞——全是小幅扰动；<b>「技能空间」正是你的配置空间</b>：换节点档位、换路径、换分解粒度。</b><br><b>⇒ 于是方法的定位可以升一级：<b>我们提供的是一个技能空间——一组结构化、可切换的系统配置，使失败时的适应发生在策略层面而不是采样层面。</b></b><span class='k'>而「偏离越大越要往高层适应」那条判断，直接给出一个三级响应：小偏差重采样 → 中偏差给那个节点升档 → 大偏差换工作流结构，代价递增。</span><br><br><b>最后一条是可以今天就写进代码的：<b>p43 想法一（朝熟悉状态而不是朝终点优化）= 失败时回退到已知可用的基线配置</b>。</b><br><span class='w'>某条 query 在搜出来的「最优」配置上反复失败时，退回全大模型跑一次。代价是这条变贵了，但<b>它会出结果</b>，而不是烧满预算还 0 分</span>。<b>⇒ 对 <code>G</code> 分布的效果是<b>砍掉左尾</b>，而左尾正是 p5 那个重尾来源。<b>平均 <code>G</code> 可能只升一点，但方差会明显下降——而方差在 <code>ρ_*</code> 的分子上，更低的方差直接意味着更少的测量就能把配置分开。这是一个同时改善性能和统计效率的改动。</b></b>", "pitfalls": [{"v": "<b>把「搜索阶段烧掉的调用」和「最终配置的推理成本」混成一个数报。</b> <span class='k'>p13 的区分正好切在这里：前者是<b>训练成本</b>（按 deployed policy evaluation 的定义不计入目标），后者是 <code>G</code> 里的 <code>λ·Cost</code>（属于部署评估）</span>。<b>⚠ 但一个只看总账单的审稿人会把两者加起来问你「你省的还没搜的多」</b>。<span class='w'>⇒ 两个数都给，再附一条<b>摊销曲线</b>：搜索成本摊到多少条 query 才回本。<b>如果你的方法花 5000 次调用去搜、而最终配置每条省 0.3 分钱，那个回本点是一个很具体也很好讲的数。</b></span>", "tag": "推断", "ref": "本讲 p13（逐字核对）· 讲稿（火星车/厨师）· 简报 §2 §4d"}, {"v": "<b>把「估计方差在下降」当成「搜索在进步」。</b> ⚠ <span class='k'>p17 的坍缩最毒的地方是<b>它看起来像成功</b>：奖励在涨、曲线好看、数据在积累，而你要的能力完全没长出来</span>。<b>⇒ 你这边的同构现象：搜索把预算越来越集中到少数几个配置上，于是 <code>Ĝ</code> 的方差越来越小、曲线越来越漂亮——<b>但那只是因为你在反复测同几个东西</b></b>。<span class='w'>⇒ 两者在坍缩时恰好同时发生，所以方差下降<b>不能</b>当作进展的证据。该看的是<b>覆盖</b>：你实测的 <code>log|V_T|</code>（CSE 541 L10 p4 那个量）有没有在涨。</span>", "tag": "推断", "ref": "本讲 p17（逐字核对）· L07 p3 · L10 p4 · 简报 §4b §4c"}, {"v": "<b>误砍一个候选之后，指望后续指标会提示你。</b> <span class='k'>不会。被砍掉的那片区域你<b>再也拿不到数据</b>，剩下的测量都在幸存者身上，而它们的 <code>Ĝ</code> 看起来完全正常</span>。<b>⇒ 所以「误砍不可逆」还要加一句：<b>误砍不可见</b>。</b><span class='w'>两条防护：① <b>留一条「复活」通道</b>——像讲义那个「偶尔复位」的兜底一样，每隔几轮拿一小份预算去重测<b>已被砍掉</b>的候选里最靠近边界的那几个（成本很小，但把「不可见」变成「可见」）；② <b>报告淘汰边界附近的间隔</b>——最后一轮砍掉的那个，它的置信上界离幸存者的下界差多少。差得少，说明你的结论很脆。</span>", "tag": "推断", "ref": "本讲 p17 · p11（偶尔复位的兜底）· L07 p6 · L15 p21 科研格"}, {"v": "<b>重试逻辑对「运气差」和「能力不够」一视同仁。</b> <span class='k'>p42 的现象是：机器人翻过去了，<b>RL 还在跑、更新也在做</b>，但更新改变不了局面——「更新了也没用」</span>。<b>⇒ 你的同构：某条 query 进了坏状态，而你的重试还在换种子、调温度、再调一次——<b>全是在同一个层级上扰动，而问题在更高层级</b></b>。<span class='w'>⇒ 一个便宜的判据：<b>看连续几次重试的输出之间的差异度</b>。彼此高度相似而且都不对 ⇒ 是能力问题不是运气问题，该升档或换路径，而不是再试一次。</span><b>⚠ 还有一个一行改动但决定成败的细节：<b>重试必须知道自己试过什么</b>——无状态的重试就是那个「一直往前撞」的机器人（讲稿：「it doesn't know that it tried going forward before」）。</b>", "tag": "推断", "ref": "本讲 p42 p43–p44（逐字核对）· 讲稿（没有上下文就一直往前撞）· 简报 §4b"}, {"v": "<b>把评估用的 query 集当成固定输入，不当成设计变量。</b> <span class='k'>p23 那条 Pro 引的是 Kakade &amp; Langford（ICML 2002）：<b>从多样的起点练比总从同一个起点练更高效，而且「就算在分幕设定下也成立」</b></span>。<b>⇒ 对你：<b>评估集的难度分布本身是一个设计变量</b></b>。<span class='w'>全是难题 ⇒ 配置都接近 0 分、差距被压平 ⇒ 需要多得多的样本才能分开（<code>ρ_*</code> 里 <code>Δ</code> 在分母上）；全是简单题 ⇒ 都接近满分，同样分不开。<b>最有信息量的是难度铺开、并在「不同档位会给出不同答案」的那个难度带上加密采样。</b></span><b>⚠ 但按区分度挑 query 会让 <code>Ĝ</code> 对真实分布有偏，必须用重要性加权纠回去——而你<b>知道</b> <code>P</code>，因为是你自己挑的（L14 p2）。</b>", "tag": "推断", "ref": "本讲 p23（含 Kakade & Langford 出处）· 讲稿（even in episodic settings）· L09 p11 · L14 p2"}, {"v": "<b>只在 benchmark 上验证最优配置，不查分布外。</b> <span class='k'>p40 的 SLRL 定义里 <b>OOD</b> 是明写的；而你的 OOD 比机器人那边<b>更隐蔽</b>——讲义那边看得见（地上多了个障碍），你这边 query 还是文字，<b>但难度分布变了</b>，而你的配置是按旧分布调的</span>。<b>⇒ 至少报一个数：<b>最优配置在 benchmark 上的 <code>G</code>，与在一个分布不同的留出集上的 <code>G</code>，差多少</b>。</b><span class='w'>差得多 ⇒ 你的配置选择对分布敏感，那本身是重要发现；差得少 ⇒ 那是稳健性的证据。<b>两种结果都值得报，而不报是真的会被问。</b></span>", "tag": "推断", "ref": "本讲 p40–p42（逐字核对）· 简报 §1 §4d"}], "ammo": [{"q": "你优化的到底是什么？搜索过程中烧掉的调用算不算？", "a": "<b>我们优化的是 <b>deployed policy evaluation</b>（部署策略评估），这是一个有标准名字的设定（本讲 p13，EARL/ICLR 2022 那条线）。</b> <span class='k'>它衡量的是「<b>学出来的那个东西有多好</b>」，而不是「学习过程中一共拿到多少奖励」——后者叫 continuing policy evaluation，是 average reward RL</span>。<br><b>讲义给的两个例子把差别钉死了</b>：<span class='w'><b>火星车</b>在意这一路采集到的数据（学习过程中的失败是<b>真实损失</b>）；<b>机器人厨师</b>不在乎训练时做砸多少顿饭（那只是<b>训练成本</b>）</span>。<b>⇒ 我们是厨师那一侧：搜索阶段跑的烂配置是训练成本。</b><br><b>⚠ 但我们<b>不</b>回避「成本在这里出现了两次」这件事，而且两个数都报</b>：<span class='k'>① <code>G</code> 里的 <code>λ·Cost</code> —— 最终配置<b>每次推理</b>的成本，属于部署评估；② <b>搜索开销</b> —— 训练成本，单列一栏</span>。<b>⇒ 外加一条<b>摊销曲线</b>：搜索成本摊到多少条 query 才回本。这个数一给，「你省的还没搜的多」这个质疑就自动答完了。</b>", "tag": "已核", "ref": "本讲 p13（逐字核对）· 讲稿（火星车/厨师）· EARL, ICLR 2022 · 简报 §2 §4d"}, {"q": "你怎么决定下一步去测哪个配置？这不是个启发式吗？", "a": "<b>不是启发式，而且这个问题在别的领域正好是<b>公开问题</b>——我们的设定让它变得可解。</b> <span class='k'>本讲 p32 明确把「<b>该为哪个任务收集数据</b>」标成 “an open research question”，现成的两条路只有「把任务图写死」或「问视觉语言模型此刻能做什么」，<b>都是启发式的</b></span>。<br><b>⇒ 而它在形式上就是<b>实验设计</b>：在一堆候选测量动作里挑最能减少不确定性的那个。</b> <span class='w'>我们用的是 <b>G-最优设计</b>：<code>min_λ max_{x∈𝒳} xᵀA(λ)^{-1}x</code>，由 Kiefer–Wolfowitz 保证 <code>f_G(λ*) = d</code>、支撑集只有 <code>d(d+1)/2</code> 个点；<b>而且 <code>λ*</code> 不需要任何真实奖励就能算</b>，只依赖候选集合的几何</span>。<br><b>⚠ 为什么那边是公开问题而我们这边不是？因为一处关键的结构差异：<b>机器人的可行任务集随当前状态变化</b></b>（<span class='k'>杯子在地上就只能练「捡杯子」；画面里没胡萝卜就不能练「拿胡萝卜」</span>）<b>，所以设计问题带着一个会变的约束集。<b>而我们的配置空间不受状态约束——任何配置随时都能跑</b>，于是经典解直接适用。</b><br><b>⇒ 这正是我们相对启发式搜索的优势所在，而且它是结构性的，不是调参调出来的。</b>", "tag": "已核", "ref": "本讲 p32（逐字核对）· 讲稿（VLM 判可行）· L07 p4 p5 · 简报 §4c"}, {"q": "你的方法不就是「给每个节点选个模型」吗？说成一个框架是不是夸大了？", "a": "<b>它是一个<b>技能空间</b>，而「在技能空间里适应而不是在动作空间里适应」是一条有论证的设计原则（本讲 p43–p44）。</b><br><span class='k'>讲义的论证是<b>幅度</b>问题：「if you're trying to run RL on the <b>policy weights</b>, like in the low-level action space, <b>you can only change the policy so much</b>」；而真正的困境往往需要<b>换一整套打法</b>，所以要在一组预训练技能之间切换</span>。<br><b>⇒ 映射过来：在 LLM 工作流里，<b>动作空间</b>是重采样、调温度、改措辞——全是小幅扰动；<b>技能空间</b>才是换节点档位、换路径、换分解粒度。</b><b>我们提供的正是后者：一组结构化、可切换的系统配置，使得失败时的适应发生在<b>策略层面</b>而不是<b>采样层面</b>。</b><br><b>⇒ 而讲义那条「<b>偏离越大，越要往高层适应</b>」直接给出一个分级响应，我们也是这么实现的</b>：<span class='w'><b>小偏差</b>（格式略有问题）→ 重采样；<b>中偏差</b>（某节点质量明显不行）→ 给那个节点升档；<b>大偏差</b>（整类 query 都做不好）→ 换工作流结构</span>。<b>三级，代价递增。</b><br><b>⚠ 而且我们实现了那个常被忽略的要素：<b>上下文</b>——重试必须知道自己试过什么。</b> <span class='k'>讲义的反例很准：没有上下文的策略「doesn't know that it tried going forward before」，于是一直往前撞。无状态的重试就是那个机器人。</span>", "tag": "推断", "ref": "本讲 p43–p44（逐字核对）· 讲稿（权重只能改这么多、没有上下文就一直往前撞）· 简报 §1 §2"}, {"q": "有些 query 会把预算烧光还拿不到结果，你怎么处理？", "a": "<b>我们按本讲 p43 的「想法一」做了兜底：<b>失败时回退到已知可用的状态，而不是继续在原地优化</b>。</b> <span class='k'>讲义的原话是「<b>if instead</b> of trying to run RL updates to get to the goal, you instead tried to run RL updates <b>to get back to states that are familiar</b>… then you might have a better time at <b>getting unstuck</b>」</span>。<br><b>⇒ 我们的版本：某条 query 在搜出来的最优配置上反复失败、且重试输出高度相似（说明是能力问题不是运气问题）时，<b>退回全大模型的基线配置跑一次</b>。</b> <span class='w'>代价是这条 query 变贵了，但<b>它会出结果</b>，而不是烧满预算还 0 分。</span><br><b>⇒ 对 <code>G</code> 分布的效果是<b>砍掉左尾</b>，而这不只是性能问题，<b>也是统计问题</b></b>：<span class='k'>卡住的那些 query 是重尾的来源（Cost 顶到上限而 Acc 为 0），它们会同时污染均值和方差估计；而方差在识别复杂度 <code>ρ_*</code> 的分子上</span>。<b>⇒ 所以这个兜底<b>同时</b>改善了最终性能和分辨配置所需的样本量——我们报了加兜底前后的 <code>G</code> 分布，而不只是均值。</b><br><b>⚠ 另外这也是讲义提的那个更一般的道理：<b>「卡住」在这一讲里出现了三次</b></b>（<span class='w'>漂走了回不来 · 赖在目标不走 · 翻过去爬不起来</span>），<b>而每一次的解法都是同一类：<b>给系统一条回到已知良好区域的通道</b>。</b>", "tag": "推断", "ref": "本讲 p43 · p5 · p17 · p42（逐字核对）· L09 p11 · 简报 §4b"}, {"q": "你怎么知道你的搜索没有过早收敛到一小块区域？", "a": "<b>这正是本讲 p17 说的<b>状态分布坍缩</b>，而它最危险的地方是<b>看起来像成功</b>。</b> <span class='k'>讲义的描述很准：智能体漂到目标附近就待着不走，「you're getting lots of reward. <b>And so the learning process is great.</b>」——但「you're <b>not actually visiting the states that will yield a good policy</b>」</span>。<br><b>⇒ 我们这边的同构现象是：预算越来越集中到少数配置上，于是 <code>Ĝ</code> 的方差越来越小、曲线越来越漂亮——<b>而那只是因为在反复测同几个东西</b>。</b><span class='w'>所以我们<b>不</b>把「方差下降」当作进展的证据。</span><br><b>⇒ 我们看的是<b>覆盖</b>：实测的 <code>log|V_T|</code>（信息矩阵的行列式，CSE 541 L10 的椭圆势引理界住的正是它）。</b> <span class='k'>它只依赖测过哪些配置的特征向量、<b>不依赖任何结果</b>，所以可以直接算，也可以在花钱之前比较两个采集方案</span>。<br><b>⇒ 另外我们留了一条<b>复活通道</b>：每隔几轮拿一小份预算去重测已被砍掉的候选里最靠近边界的那几个。</b> <span class='w'>这对应讲义 p11 那个「偶尔复位」的兜底——因为<b>误砍不仅不可逆，而且不可见</b>（被砍掉的区域再也拿不到数据，而幸存者的 <code>Ĝ</code> 看起来完全正常）</span>。<b>成本很小，但它把「不可见」变成了「可见」。</b>", "tag": "推断", "ref": "本讲 p17 · p11（逐字核对）· L10 p4 · L07 p3 · L07 p6 · 简报 §4b §4c"}], "papers": [{"t": "Sharma*, Xu* et al. — <b>Autonomous Reinforcement Learning: Formalism and Benchmarking (EARL)</b>", "id": "ICLR 2022（本讲 p24–p25 的基准与 p13 那对定义的出处）", "why": "<b>你要引「deployed policy evaluation」这个名字时，引这篇。</b> <span class='k'>它把自主 RL 形式化了，并且明确区分了「学出来的策略有多好」与「一辈子的平均奖励」两种评估</span>。<b>⇒ 而它的基准设定本身也值得看一眼：<b>每 20 万步才复位一次</b>，评估却是 policy performance from <code>s₀</code>——<b>一个「训练时几乎没有监督、但评估标准不降」的设计</b>，和你「搜索预算受限、但最终配置的标准不降」是同一种结构。</b>"}, {"t": "Chen, Sharma, Levine, Finn — <b>You Only Live Once: Single-Life Reinforcement Learning</b>", "id": "NeurIPS 2022（本讲 p40–p43 的出处）", "why": "<b>「一条命 + 分布外」这个设定，以及那两个应对想法的出处。</b> <span class='w'>对你最有用的是<b>想法一</b>：卡住时把优化目标从「到达终点」换成「回到熟悉的状态」</b></span>。<b>⇒ 它给了你那条「失败时回退到基线配置」的理论说法，而不只是一个工程 hack。</b><span class='k'>⚠ 另外它也示范了一个诚实的负面结果：<b>在测试时直接跑普通 RL 会失败，而且失败时「更新照跑、就是没用」</b>——这种「我先试了最直接的办法并说明它为什么不行」的写法，值得在自己论文里学。</span>"}, {"t": "Kakade &amp; Langford — <b>Approximately Optimal Approximate Reinforcement Learning</b>", "id": "ICML 2002（本讲 p23 那条 Pro 引的就是它）", "why": "<b>「从多样的起点练比总从同一个起点练更高效」的出处，而且这条<b>「就算在分幕设定下也成立」</b>。</b> <span class='w'>也就是说它<b>不是</b>一个「无复位设定的补救」，而是一条一般性的样本效率结论</span>。<b>⇒ 对你：<b>评估集的难度分布是一个设计变量</b>，而不是 benchmark 给什么就用什么。</b><span class='k'>⚠ 但按区分度挑 query 会让估计对真实分布有偏，要用重要性加权纠回去——而你<b>知道</b>那个倾向性，因为是你自己挑的（CSE 541 L14 p2）。</span>"}, {"t": "Zhou*, Atreya*, Lee, Walke, Mees, Levine — <b>SOAR: Autonomous Improvement of Instruction Following Skills via Foundation Models</b>", "id": "本讲 p32 对「该练哪个任务」给出的那条现成办法", "why": "<b>讲义把「该为哪个任务收集数据」标成公开问题，而 SOAR 是现有的最好答案之一：<b>问一个视觉语言模型此刻场景里能做什么</b>。</b> <span class='k'>它还顺带解决了「要为每个任务写奖励」这条代价——把提议的任务喂给图像编辑模型生成目标图像，奖励就是「离这张图多近」</span>。<b>⇒ 对你这是一条<b>对照</b>而不是方案：它说明在可行集随状态变化时，人们只能退到基础模型的常识上；<b>而你的可行集固定，所以可以用有保证的实验设计，这正是你的位置。</b></b>"}, {"t": "本课 L15 — <b>模仿与强化学习中的分层</b>", "id": "两讲是一组：L15 末页预告的就是本讲", "why": "<b>三处接口</b>：<span class='w'>① 本讲 p5 的「卡住」就是 L15 p5 那条「策略确定性地停在同一状态」的真机版；② 本讲 p26 那个「没有好的后向就难学前向、反之亦然」的提问，与 L15 p17 的<b>先有鸡先有蛋</b>完全同构，而且解法一样（拿一点演示把两边都启动起来）；③ 本讲 p32 的<b>任务提议器</b>与 L15 的<b>高层策略</b>形式相同、目的相反——<b>提议器要「广」服务探索，高层策略要「准」服务利用</b></span>。<b>⇒ 第 ③ 条对你尤其要紧：<b>用同一个准则去做这两件事是错的</b>，而「用当前最优来决定下一步测什么」恰恰就是在用「准」的准则做「广」的事。</b>"}]};

    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=SRC+"?p="+p+"#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
