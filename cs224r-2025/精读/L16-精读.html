<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS224R 第十六讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs224r-2025-l16">

<div id="bar">
  <h1>CS224R 第十六讲 · <span>机器人上的 RL：自主学习</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 46</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../corpus/slides/16_cs224r_autonomy_2025.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs224r-2025</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/L16-精读.html</code>。</p>
    </div>

</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
5: [{"q": "讲稿说一条轨迹的内部「完全自主」，那不自主的是哪一步？", "o": ["奖励计算那一步", "两条轨迹之间那一步 —— 怎么从上一次结束的状态回到起点；课程前面一直假装这一步会「magically」发生，而实际上是人伸手去摆", "策略更新那一步", "动作采样那一步"], "a": 1, "why": "<b>env.reset() 是仿真里「很友好的小工具」，但「We can't reset the physical world to our own will」。</b><span class='k'>而真正致命的是次数——RL 往往要几千次试验，不是试三次就解决，所以人工复位不是偶尔帮忙，是每一次试验都要来一遍。</span>"}, {"q": "p8 那三段视频里，讲者对第一段的评价是什么？它点出了什么荒谬之处？", "o": ["「他现在干的活大概比机器人还多」—— 你本来想让机器人替你干活，结果你在替机器人做准备工作，而且是几千遍", "机器人需要更好的传感器", "视频是加速播放的", "机器人学得比人快"], "a": 0, "why": "<span class='w'>三段分别是 Yevgen 给学打冰球的机器人捡球、Ali 给学开门的机器人关门、Archit 给学叠毛巾的机器人把毛巾铺回去。</span><b>⚠ 而这个问题是「连续世界」特有的而非「机器人」特有的——任何在不能回滚的环境里学习的系统都有它。</b>"}],
9: [{"q": "自主 RL 定义的三行里，「Initialize once at the beginning」为什么不是废话？", "o": ["因为初始化需要时间", "因为它堵一个漏洞：不许用「多次初始化」绕开「不许复位」—— 否则你可以声称自己没有 reset，只是「又初始化了一次」", "因为初始状态分布要固定", "因为要保证可复现"], "a": 1, "why": "<b>而整页最该留意的是那个星号：can relax this constraint to reset occasionally, or at low frequency。</b><span class='k'>这一笔把问题从「有没有复位」变成「多久复位一次」——一个连续谱。EARL 基准就落在这个谱上：每 20 万步才复位一次。</span>"}, {"q": "允许「偶尔复位」这个放松，讲稿给了什么实际理由？", "o": ["为了对比实验公平", "它是一个兜底 ——「just in case it does get stuck in a really challenging state」，防的正是进了出不来的状态就永远出不来", "为了减少方差", "为了加快收敛"], "a": 1, "why": "<span class='w'>讲稿还给了一个很有人情味的理由：只要过程是自主的，花多长时间就没那么要紧了——「because you can go to sleep while your robot is trying to learn」。</span><b>自主性把「时间成本」换成了「挂机成本」，后者便宜得多。</b>"}],
12: [{"q": "部署策略评估与持续策略评估，最本质的差别是什么？", "o": ["期望是对谁取的：部署评估衡量一个固定策略，而持续评估的期望「isn't under a single policy, it's over the learning process itself」—— 它衡量的是整个学习过程", "一个用折扣一个不用", "一个有复位一个没有", "一个在仿真一个在真机"], "a": 0, "why": "<b>火星车 vs 机器人厨师：对火星车，学习过程中的失败是<b>真实损失</b>；对厨师，那只是<b>训练成本</b>。</b><span class='k'>⚠ 另注意持续评估 ≠ 不复位——这一页讲的是评估指标，p11 讲的是环境设定，是两个维度。</span>"}, {"q": "讲稿里学生问「只跑一条轨迹为什么还要写期望」，答案是什么？", "o": ["因为奖励有噪声", "因为策略是随机的", "因为要衡量的是算法而不是单次运行 —— 环境的随机性、采样批次的随机性都会带来波动，所以要对算法的多次运行取期望", "因为环境是随机的，必须取期望才有定义"], "a": 2, "why": "<b>这条对任何做实验的人都适用：报一次运行的结果，报的是那次运行；报算法，就得多跑几次。</b><span class='w'>而学习过程本身的随机性往往比环境的随机性更大，这一点很容易被低估。</span>"}],
14: [{"q": "自主 RL 的价值，讲义给的理由是什么？", "o": ["提高控制频率", "降低硬件损耗", "解锁数据：自主 → 更多数据 → 更强泛化。有人盯着时数据量的上限是人的工时；自主之后上限变成硬件耐久与电费，高出好几个数量级", "省下人力成本"], "a": 2, "why": "<b>⚠ 但要留意那个 may：more data <b>may</b> unlock greater generalization——这是有条件的期望，取决于数据的<b>多样性</b>而不只是数量。</b><span class='k'>而这恰是这一讲的内在张力：自主是为了拿到更多数据，但天真的自主恰恰会让数据变得更单调（p17 的状态分布坍缩）。</span>"}],
15: [{"q": "把幕加长（少给复位）的实验结果是什么？为什么这个结果特别值得警觉？", "o": ["幕长没有影响", "只在复杂任务上才变差", "幕越长学出来的策略越差，到 5 万/10 万步基本学不会；值得警觉是因为这还只是一个很简单的「把鱼游到指定位置」的任务", "幕越长学得越好，因为探索更充分"], "a": 2, "why": "<b>幻灯上那行小字也别跳过：Note: this measures the deployed policy evaluation。</b><span class='k'>换成持续评估曲线可能完全不一样——一个漂到奖励区就赖着不走的智能体，按「一辈子的平均奖励」算分数可能不低。同一组实验换个指标结论可能反过来。</span>"}],
17: [{"q": "「状态分布坍缩」这个挑战为什么比「漂移」更难发现？", "o": ["因为它发生得更晚", "因为它只在高维状态空间出现", "因为它看起来像成功：智能体确实到了目标、奖励很高、学习曲线很好看，但数据全挤在终点附近，起点到终点那一路的状态一个都没有", "因为它需要更长的轨迹才能观察到"], "a": 2, "why": "<b>讲稿的原话把这个反讽说透了：you're getting lots of reward. And so the learning process is great. But… you're not actually visiting the states that will yield a good policy。</b><span class='w'>用 ρ*（从起点到目标的最优状态分布）来统一：漂移 = 离开 ρ*，坍缩 = 不覆盖 ρ*。</span>"}, {"q": "幻灯左边那行「Episodic Learning: Can always retry from initial state distribution」在说什么？", "o": ["分幕学习只适用于仿真", "它描述的不是限制而是一个被白拿的好处：复位一直在偷偷帮你维持状态分布——既把漂走的你拉回来，又强制数据覆盖起点附近", "分幕学习需要更多样本", "分幕学习是一种限制"], "a": 1, "why": "<b>⇒ 下一页的想法因此很自然：既然复位这么有用又不能指望人做，那就学一个策略来做复位。</b><span class='k'>而这也解释了 p16 那组曲线：幕越长，漂走了没人拉回来，赖着不走也没人赶走。</span>"}],
18: [{"q": "FBRL 的那条减号「backward policy is ultimately discarded」意味着什么？讲稿怎么评价？", "o": ["后向策略会损害前向策略", "算法有 bug", "后向策略需要单独的硬件", "你训了两个策略却只部署一个——本质是拿一半算力去买自主性；讲稿说这「有点浪费，但它换来了自主学习，而那很不错」"], "a": 3, "why": "<span class='w'>值不值取决于那一半算力和一个人力的相对价格——对真机实验，这个交换几乎总是划算的。</span><b>⚠ 另注意两个策略通常<b>不</b>共享信息：可以共享图像编码器，但不共享策略，因为「做」和「撤销」是两件很不一样的事。</b>"}, {"q": "讲稿提到 FBRL 的一个真实困难（用开关门那个任务举例），是什么？", "o": ["前向后向的难度可能严重不匹配：前向是关门、后向是开门，而开门可能比关门难得多 ⇒ 两个策略学习速度不同，整个过程更难", "需要两倍的回放缓冲", "后向奖励无法定义", "两个策略会互相干扰"], "a": 0, "why": "<span class='k'>另一个例子是后空翻：翻一个后空翻很难，而「站起来准备翻」容易得多。</span><b>而「跑多少步换一次」这个参数，结论和 L15 p21 一样：简单的固定步数在实践中胜出。</b>"}],
20: [{"q": "MEDAL 把后向策略的目标从「回到 s₀」改成「回到专家走过的那一片」。关键认识是什么？", "o": ["专家分布更容易到达", "专家分布的奖励更密集", "你要学的不是「从起点出发怎么走」，而是「在这条路上的任何一点该怎么走」—— 只从起点练，中段的覆盖要靠前向策略自己走过去，而它一开始走不过去", "s₀ 难以精确复位"], "a": 2, "why": "<b>算法与 FBRL 只差两处：第 0 步多了「给一小批演示」，第 6 步多了「更新学出来的 r_b」，其余五步一字未改。</b><span class='w'>r_b 用判别器学：区分「策略访问的状态」与「演示里的状态」，后向策略则去骗它。</span>"}, {"q": "既然目标状态也在演示里，为什么后向策略不干脆赖在目标状态？", "o": ["因为目标状态的奖励被屏蔽了", "因为后向策略有探索噪声", "因为有显式的惩罚项", "因为 r_b 本质是状态分布匹配目标：只停在一个点会被判别器识破（「只在目标状态，那多半来自策略而不是专家演示」）；形式化就是两个状态分布之间的散度"], "a": 3, "why": "<b>⇒ 分布匹配天然地阻止了坍缩，而那正是挑战 2。</b><span class='k'>p23 把两个挑战都勾掉了：后向策略避免状态分布坍缩（挑战 2），同时让智能体不漂走（挑战 1）。</span>"}, {"q": "MEDAL 那条 Pro（起点铺开 ⇒ 样本效率更高）有一个容易被忽略的限定，是什么？", "o": ["只对目标条件任务成立", "只在演示足够多时成立", "只在无复位设定下成立", "它「就算在分幕设定下也成立」—— 也就是说即使你有复位能力，从多样的起点练也比总从同一个起点练更高效（Kakade & Langford, ICML 2002）"], "a": 3, "why": "<b>⇒ 所以这不只是自主学习的技巧，而是一条更一般的原则：训练起点要铺开，有难有易。</b><span class='w'>既有靠近目标的简单起点（容易拿到成功信号），也有远离目标的困难起点（练完整能力）。</span>"}],
24: [{"q": "EARL 基准的结果分三层。第三层（方法之间的比较）有什么前提？", "o": ["需要足够多的随机种子", "需要关闭探索噪声", "需要 oracle 作为参照", "它只有在复杂任务上才显出来：简单环境里几种方法表现差不多，越复杂 FBRL 与 MEDAL 越领先"], "a": 3, "why": "<b>⇒ 读表习惯：在简单任务上分不出高下，不等于方法之间没有差别。</b><span class='k'>前两层分别是：什么都不做的 SAC 学不出好策略（确认问题出在复位上），以及专门为这个设定设计过的算法明显好过不设计的。</span>"}, {"q": "p26 的真机实验里，两种方法的奖励分别由谁提供？讲稿点出了什么意义？", "o": ["一个用 VLM 给的奖励、一个用学出来的奖励；意义是奖励也是人工监督的一种——真正的自主需要「不用人复位」加「不用人打分」两件事同时解决，这样才能「挂着跑一整夜」", "都由人实时打分；意义是人机协作", "都用仿真里标定好的奖励；意义是 sim2real", "都用稀疏的任务完成信号；意义是简化设计"], "a": 0, "why": "<span class='w'>⚠ 还要记住讲稿里很诚实的一句：这些方法「仍然处在研究阶段……目前机器人公司并没有在用」。</span><b>另外那个「没有好的后向就难学前向、反之亦然」的提问，和 L15 p17 的先有鸡先有蛋完全同构，解法也一样：拿一点演示把两边都启动起来。</b>"}],
27: [{"q": "任务循环相对 FBRL，最根本的改变是什么？", "o": ["用了更强的 RL 算法", "不需要奖励函数", "不需要多任务策略", "失败之后不是去「撤销」，而是去练一个此刻能练的任务 —— 而那个任务本身就是你想要机器人会的技能，所以测试时整个多任务策略全部留用，不像 FBRL 要扔掉后向策略"], "a": 3, "why": "<span class='k'>咖啡杯的例子：杯子掉地上了，此刻该练的不是「把杯子放进咖啡机」而是「把杯子捡起来」。</span><b>它还顺手解决了 p19 那个「前向后向难度不匹配」的僵局——循环图里总有一个任务是此刻可练的。⚠ 代价是要为所有任务各准备一个奖励函数。</b>"}, {"q": "算法第 ① 步「Propose task z_i to practice <b>based on s</b>」里，依据当前状态提议是为了什么？", "o": ["为了平衡各任务的数据量", "为了避免灾难性遗忘", "为了筛掉此刻做不了的任务 ——「practice a task that is possible to practice from that state and exclude tasks that are not feasible from that state」", "为了减少方差"], "a": 2, "why": "<span class='w'>另记一个更新上的细节：用 off-policy 算法的话，一次交互可以更新<b>所有</b>任务，而 on-policy 只能更新当前这个。</span><b>又一次是「off-policy 让数据能被重复利用」——和 L15 p43 的事后重标注同一个理由。</b>"}],
30: [{"q": "「该为哪个任务收集数据」这个问题，讲义给了什么定性？", "o": ["已经被 SOAR 解决了", "明确标成「an open research question」，讲稿还说这是 bleeding edge；现成的两条路是把任务图写死，或者问视觉语言模型此刻场景里能做什么", "只是工程问题不是研究问题", "取决于奖励函数的设计"], "a": 1, "why": "<span class='k'>SOAR 的例子很具体：这一帧里能做的有「打开玩具微波炉」「拿起香蕉」「推茄子」，而「拿起胡萝卜」不行——画面里没有胡萝卜。</span><b>VLM 在这里的作用正是把「此刻可行」判出来。</b>"}, {"q": "任务提议器和分层里的高层策略，形式相似但目的相反。怎么区分？", "o": ["提议器用 VLM 而高层策略用神经网络", "提议器要「广」（给我很多能练的东西，服务探索），高层策略要「准」（给我通向目标的那一步，服务利用）", "提议器更简单", "提议器只在训练时用"], "a": 1, "why": "<b>讲稿原话：its purpose is actually quite different。</b><span class='w'>SOAR 还用了一个实用技巧解决「要为每个任务写奖励」这条代价：把提议的任务喂给图像编辑模型生成目标图像，奖励就是「离这张图多近」——正好接上 L15 p38 的图像子目标。</span>"}],
34: [{"q": "p37–p39 那段开门视频，最该注意的细节是什么？", "o": ["钥匙是错的那把", "人重复了很多次", "时间尺度：人「在一瞬间」就调整过来了 —— 没有回去重新训练，也没有多试一百次，而是在同一次尝试里改了策略", "人用了两只手"], "a": 2, "why": "<b>这正是下一节要定义的设定：不是「多试几次学会」，而是「这一次就得解决」。</b><span class='k'>也因此这一节用的词是 adapt（适应）而不是 learn（学习）——学习是从很多经验里慢慢改进，适应是从极少经验里立刻改变行为。</span>"}, {"q": "分幕 RL、无复位 RL、单生命 RL 三者是什么关系？", "o": ["只能三选一", "后者依次取代前者", "三者是同一件事的不同名字", "不是互相替代，而是三个不同阶段：可以先用无复位 RL 把策略练好，然后在部署时还要面对单生命的问题"], "a": 3, "why": "<span class='w'>p35 那句「We've looked at… <b>What happens after</b> we deploy」就是在做这个衔接。</span><b>而那句反讽「Obviously, everything works perfectly and nothing ever goes wrong」提醒的是：前半讲所有努力都默认了「好策略部署之后就一直好」。</b>"}],
40: [{"q": "单生命 RL 的定义里，哪两条合起来才是真正的难点？", "o": ["只有一次机会（不能重来）＋ 场景是训练时没见过的（OOD）—— 少一条都容易很多：能多试就退化成无复位 RL，见过就退化成普通部署", "没有先验数据，且时间有限", "没有奖励函数，且状态不可观测", "需要人干预，且环境随机"], "a": 0, "why": "<span class='k'>讲稿的例子：平地上训练过的腿式机器人遇到一个没见过的障碍。</span><b>而这篇工作的名字起得很直白：You Only Live Once（NeurIPS 2022）。</b>"}, {"q": "在测试时直接用普通 RL 微调，失败的方式是什么？为什么说这个失败特别说明问题？", "o": ["RL 更新发散了", "策略退化成随机动作", "机器人过了第一个障碍，然后翻过去爬不起来；特别说明问题是因为RL 还在跑、更新也在做 —— 结论不是「没更新」而是「更新了也没用」", "RL 的奖励信号消失了"], "a": 2, "why": "<b>⇒ 问题不在 RL 的原理，在它<b>改变行为的速度</b>：梯度下降每步只挪一点，靠大量步数累积，而单生命只给你几十上百步。</b><span class='w'>幻灯那句结尾的三个字也别漏：without <b>interventions</b>——这个问题本来是靠人干预解决的。</span>"}],
43: [{"q": "「想法一：把学习过程往熟悉的好状态引」为什么管用？它有什么前提？", "o": ["因为它减少了更新次数；前提是算力受限", "因为它降低了探索噪声；前提是策略是随机的", "因为熟悉状态的奖励更高；前提是奖励稠密", "因为卡住时「回到我认得的地方」比「到达终点」容易得多，而一旦回去了原来的策略就又能用；前提是要有训练时的先验数据（「熟悉」是相对见过的状态说的）"], "a": 3, "why": "<b>所以这个想法只在单生命设定里有意义，对从零开始的 RL 没用。</b><span class='k'>效果在视频里：同一个环境，换了目标，机器人就从翻倒状态爬起来了。</span>"}, {"q": "「想法二：在技能空间而不是动作空间里适应」，核心论证是什么？", "o": ["动作空间不可微", "是一个幅度问题：微调权重「只能把策略改这么多」、「能适应的方式就那么几种」，而单生命的处境往往需要换一整套打法 —— 偏离越大，越要往高层去适应", "技能空间维度更低，优化更快", "技能空间的梯度更稳定"], "a": 1, "why": "<span class='w'>腿式机器人的例子：只有「往前走」一个技能就会一直往前撞；有几个技能可切换就能试出一条路。</span><b>⚠ 还有一个要素别漏：<b>上下文</b>——「因为它不知道自己刚才已经试过往前走了」。要能在策略之间切换，还得记住自己试过什么。</b>"}],
45: [{"q": "讲稿最后关于「安全」的回答里，那个绕不过去的循环是什么？", "o": ["要学会「什么是危险」，就得先危险几次 ——「to learn safety, you need examples of failing」；而在控制器上加硬约束又不是哪里都加得上", "安全与自主互相矛盾", "安全约束会降低性能", "安全需要人工标注"], "a": 0, "why": "<b>⇒ 这和前面那些「先有鸡先有蛋」是同一个家族，但更棘手：那些循环靠一点演示数据就能打破，而安全这个循环要打破，代价是真实的损坏。</b><span class='k'>给出的两类办法是：学一个恢复策略（想法一的安全版），以及在控制器上直接加硬约束。</span>"}, {"q": "贯穿全讲出现了三次的那个毛病是什么？", "o": ["「卡住」—— p5 漂走了回不来、p17 赖在目标不走、p42 翻过去爬不起来；三种形态同一个毛病，而每次的解法都是同一类：给系统一条回到已知良好区域的通道", "分布外泛化", "奖励稀疏", "样本效率低"], "a": 0, "why": "<b>后向策略 / 分布匹配 / 朝熟悉状态优化——三种解法都在做同一件事。</b><span class='w'>而这一讲明确点名了两个公开问题：该为哪个任务收集数据（p32），以及单生命 RL 的整套做法（p43），外加一条现状判断：这些方法「仍在研究阶段，机器人公司今天并没有在用」。</span>"}]
};

{"r": [1, 4], "t": "今天要补的那一环：「自主」其实有两层意思", "star": 2, "quote": "<b>RL for Robots: Autonomous Learning</b><br><b>Plan for Today</b><br><em>- Why aren't robots autonomous already?<br>- Defining the problem: autonomous RL<br>- Developing the algorithms<br>&nbsp;&nbsp;- Learning policies without human intervention<br>&nbsp;&nbsp;- Single life RL</em><br><em><b>Goal: Build autonomous agents that can learn and interact in the real world</b></em>", "one": "<b>强化学习已经比模仿学习更「自主」了——智能体在自己试错。但在真实机器人上跑一遍就会发现：试完一次之后，是人把场景摆回去的。</b>", "pts": ["<b>先接上上一讲：L15 的末页预告的正是这一讲（<em>learning with autonomy</em> 与 <em>sim2real</em>）。</b> <span class='k'>⇒ 两讲连起来是一组：L15 讲「策略怎么组织」（分层），这一讲讲「怎么在真实机器人上把它训出来」</span>。<b>而下一讲（p46）是 Tesla Optimus 团队的客座讲者讲 sim2real。</b>", "<b>开场的对比值得记，因为它说明「自主」这个词在这一讲里是有<b>层次</b>的。</b> <span class='w'>讲稿：模仿学习是「训练智能体去模仿专家给的示范」；而强化学习是「智能体<b>通过试错在练</b>」</span>；<b>⇒ 「练」这件事本身<b>已经</b>比模仿更自主了，因为智能体在从自己的经验里学。</b>", "⚠️ <b>但紧接着那句转折是全讲的起点：<b>「<em>it actually isn't entirely autonomous in practice, when you think about running these algorithms on physical robots</em>」</b>。</b> <span class='k'>⇒ 在仿真里自主，在真机上不自主——而差别<b>不在算法里</b>，在算法<b>没写出来</b>的那一步。</span>", "<b>p14 把「自主」的两层意思拆得很清楚，这是读这一讲前要先分开的一对概念。</b> <span class='w'>① <b>部署时</b>自主运行（<em>operate</em> with minimal human supervision）——这是大家默认在想的那个；② <b>训练时</b>自主（<em>**train**</em> with minimal human supervision）——幻灯特意在 train 两边加了星号</span>。<b>⇒ 这一讲讲的是第 ②。</b>", "<b>提纲里那个 <code>Goal</code> 一句写得很直白：<b>造出能在真实世界里自己学、自己交互的智能体</b>。</b> <span class='k'>讲稿展开成「on their own, learn, interact, practice, get better <b>without a human in the loop</b>」</span>——<b>注意这四个动词都落在<b>学习过程</b>上，不是落在部署上。</b>", "<b>提纲的三块各管一件事，读的时候按这个分：<b>① 为什么现在还不自主（p5–8）；② 问题怎么定义、怎么评估（p9–14）；③ 算法（p15–44，又分「无人干预地学策略」与「单生命 RL」两段）</b>。</b> <span class='w'>⇒ 和 L15 一样，这一讲也是按<b>问题结构</b>而不是按算法组织的。</span>", "<b>⚠ 最后留意一个本讲自己限定的范围：<b>这里讲的「自主」是「不需要人把环境摆回去」，不是「不需要奖励函数」</b>。</b> <span class='k'>奖励从哪来是另一个问题（L08 奖励学习那一讲的内容）</span>；<b>⇒ 不过讲稿在 p26 提了一句，真机实验里奖励确实也是用模型给的（VLM 或学出来的），「so that this entire process can be autonomous, and you can actually run it overnight」。</b>"], "eq": "接上一讲：L15 末页预告的正是这一讲（learning with autonomy · sim2real）\n   L15：策略**怎么组织**（分层）\n   L16：怎么在**真实机器人上把它训出来**\n   L17（p46）：Tesla Optimus 客座讲者讲 sim2real\n\n开场的对比（「自主」是有层次的）：\n   模仿学习 = 训练智能体**模仿**专家示范\n   强化学习 = 智能体**通过试错在练**\n   ⇒ 「练」**已经**比模仿更自主（从自己的经验里学）\n\n⚠ 全讲的起点就是紧接着那句转折：\n   「**it actually isn't entirely autonomous in practice,\n     when you think about running these algorithms on physical robots**」\n   ⇒ 仿真里自主，真机上不自主\n     而差别**不在算法里**，在算法**没写出来**的那一步\n\n**「自主」的两层意思**（p14 拆得很清楚，要先分开）：\n   ① **部署时**自主运行  operate with minimal human supervision\n   ② **训练时**自主      **train** with minimal human supervision ← 幻灯给 train 加了星号\n   ⇒ **这一讲讲的是第 ②**\n\nGoal 一句：造出能在真实世界里自己学、自己交互的智能体\n   讲稿展开：「on their own, learn, interact, practice, get better\n               **without a human in the loop**」\n   ⇒ 四个动词都落在**学习过程**上，不是部署上\n\n提纲三块（读的时候按这个分）：\n   ① 为什么现在还不自主        p5–8\n   ② 问题怎么定义、怎么评估     p9–14\n   ③ 算法                      p15–44\n      （又分「无人干预地学策略」与「单生命 RL」两段）\n   ⇒ 和 L15 一样，按**问题结构**而不是按算法组织\n\n⚠ 本讲自己限定的范围：\n   这里的「自主」= **不需要人把环境摆回去**，**不是**「不需要奖励函数」\n   奖励从哪来是另一个问题（L08 奖励学习）\n   不过 p26 提了一句：真机实验里奖励确实也用模型给（VLM 或学出来的）\n   「so that this entire process can be autonomous,\n     and you can actually **run it overnight**」", "tbl": {"head": ["「自主」的两层", "指什么", "本讲讲哪层"], "rows": [["<b>部署时自主</b>", "<b>operate</b> 不需要人盯着", "<span class='w'>不是本讲重点</span>"], ["<b>训练时自主</b>", "<b>train</b> 不需要人摆回场景", "<b>✓ 本讲</b>"], ["⚠ 不包括", "<span class='w'>奖励函数从哪来</span>", "<span class='w'>L08 的内容</span>"]]}, "link": {"t": "你学过的对应：本课 L15 精读（分层）—— L15 末页预告的就是这一讲；两讲连起来是「策略怎么组织」与「怎么在真机上训出来」", "href": "L15-精读.html"}},
{"r": [5, 8], "t": "env.reset() 只在仿真里有", "star": 3, "quote": "<b>Reinforcement Learning = Trial-and-Error</b> — <em>Learn a policy π to go from s₀ to g. Repeat: Execute actions from the policy π → Observe data from the environment → Update the policy π</em><br><b>Standard Reinforcement Learning</b> — <em>How does this happen?</em>〔配一段 gym 的代码截图〕<em><b>Only in simulation!</b></em><br><b>The Continual Real World</b> — <em>“Grasp the mug” · “Navigate to the basketball court” · “Learn how to shelf a book”</em> &nbsp; <em><b>Several thousands of trials!</b></em>", "one": "<b>每条轨迹的内部都是全自主的——动作由策略采样、控制权完全在智能体手里。不自主的是两条轨迹<b>之间</b>那一步：怎么回到起点。而课堂上一直把这一步当成理所当然。</b>", "pts": ["<b>讲稿把那个被跳过的缺口描述得非常精确，值得逐句跟。</b> <span class='k'>「as you're rolling out your policy, <b>this part is fully autonomous</b>. Control is fully with the policy π」——<b>一条轨迹内部完全自主</b></span>；<b>「one little catch is that after you've attempted the task… when you then attempt the task again, <b>magically</b>, you'll somehow get back over here」。</b>", "<b>⇒ 问题不在轨迹<b>里</b>，在轨迹<b>之间</b>。而「<em>magically</em>」这个词是故意用的：课程前面十几讲一直假装这一步不存在。</b> <span class='w'>讲稿：「we've been assuming that a human or, somehow, you'll <b>magically</b> get reset to this initial starting place」</span>。", "<b>p6 那张 gym 代码截图配的一句红字 <b><em>Only in simulation!</em></b> 把这件事坐实了。</b> <span class='k'>讲稿：仿真里你可以「take actions for a thousand time steps. And then once we're done, then we can call <b>env.reset</b>, which is a very nice little friendly utility. But that's something that we can only really do in simulation. <b>We can't reset the physical world to our own will.</b>」</span>", "<b>⇒ <code>env.reset()</code> 这一行在真实世界里对应的是<b>一个人伸手去摆</b>——这就是这一讲要消除的东西。</b>", "<b>p7 三个例子把「复位」在不同形态上的样子讲清楚了，而它们<b>难度不一样</b>。</b> <span class='w'><b>导航</b>：小车拐错弯，得想办法从那个物理位置绕回起点、或者从拐错的地方另找路；<b>抓取</b>：机械臂把杯子<b>碰倒</b>了，要再练抓取，杯子得先回到够得着的地方；<b>上架</b>：书掉了，得回到「书在手边」的初始状态</span>。", "⚠️ <b>而让这件事真正致命的是<b>次数</b>：<b><em>Several thousands of trials!</em></b></b> <span class='k'>讲稿：「reinforcement learning often takes many attempts. It's <b>not a matter of trying three times</b> and then solving the task… <b>every time the agent tries again</b>, that means that you have some human intervention」</span>。<b>⇒ 人工复位不是偶尔帮个忙，是<b>每一次试验都要来一遍</b>，几千次。</b>", "<b>p8 那三段视频是全讲最有说服力的一页，因为它们把抽象问题变成了画面。</b> <span class='w'>讲稿点了名：<b>Yevgen</b> 在旁边给学打冰球的机器人捡球（「he's probably <b>doing more work than the robot</b> is right now」）；<b>Ali</b> 在给学开门的机器人<b>关门</b>；<b>Archit</b>（本学期来做过客座）在给学叠毛巾的机器人把毛巾铺回去</span>。", "<b>⇒ 「人比机器人干得还多」这句吐槽点出了核心荒谬之处：<b>你本来是想让机器人替你干活，结果你在替机器人做准备工作，而且是几千遍</b>。</b>", "<b>最后记一个结构性的点：<b>这个问题是「连续世界」特有的，不是「机器人」特有的</b>。</b> <span class='k'>p7 的标题是 <em>The Continual <b>Real World</b></em></span>；<b>⇒ 任何在一个<b>不能回滚</b>的环境里学习的系统都有这个问题——真实世界不提供撤销键。</b>"], "eq": "讲稿把那个被跳过的缺口描述得非常精确：\n   「as you're rolling out your policy, **this part is fully autonomous**.\n     Control is fully with the policy π」          ← 一条轨迹**内部**完全自主\n   「after you've attempted the task… when you attempt the task again,\n     **magically**, you'll somehow get back over here」\n\n   ⇒ 问题不在轨迹**里**，在轨迹**之间**\n     「magically」是故意用的 —— 前面十几讲一直假装这一步不存在\n     「we've been assuming that a human or, somehow, you'll **magically** get reset」\n\np6（gym 代码截图 + 一句红字）：**Only in simulation!**\n   「…then we can call **env.reset**, which is a very nice little friendly utility.\n     But that's something we can only really do in simulation.\n     **We can't reset the physical world to our own will.**」\n   ⇒ env.reset() 在真实世界里对应的是**一个人伸手去摆**\n\np7 三个例子（复位的不同形态，难度不一样）：\n   **导航**：小车拐错弯 → 从那个物理位置绕回起点，或从拐错处另找路\n   **抓取**：机械臂把杯子**碰倒** → 杯子得先回到够得着的地方\n   **上架**：书掉了 → 回到「书在手边」的初始状态\n\n⚠ 真正致命的是**次数**：**Several thousands of trials!**\n   「RL often takes many attempts. It's **not a matter of trying three times**…\n     **every time the agent tries again**, that means you have some human intervention」\n   ⇒ 人工复位不是偶尔帮忙，是**每一次试验都要来一遍**，几千次\n\np8 三段视频（把抽象问题变成画面，讲稿点了名）：\n   **Yevgen** 给学打冰球的机器人捡球\n     ——「he's probably **doing more work than the robot** is right now」\n   **Ali** 给学开门的机器人**关门**\n   **Archit**（本学期来做过客座）给学叠毛巾的机器人把毛巾铺回去\n\n   ⇒ 核心的荒谬：**你本来想让机器人替你干活，\n     结果你在替机器人做准备工作，而且是几千遍**\n\n结构性的点：**这个问题是「连续世界」特有的，不是「机器人」特有的**\n   p7 的标题是 The Continual **Real World**\n   ⇒ 任何在**不能回滚**的环境里学习的系统都有这个问题\n     —— 真实世界不提供撤销键", "say": "原话（轨迹内部自主，轨迹之间「变魔术」）：<em>“when we're rolling out these policies, we are sampling actions from our policy distribution and acting according to the agent's own actions. And so each of these trajectories are under the control of the robot or the agent. And as you're rolling out your policy, <b>this part is fully autonomous</b>. Control is fully with the policy pi. But one thing, one little catch is that after you've attempted the task, once you're in a state over here… when you then attempt the task again, <b>magically, you'll somehow get back over here</b> and attempt the task from this starting place. And we haven't really talked about how do you get from here, all the way back to here.”</em><br><br>原话（env.reset 只在仿真里有）：<em>“if we're in a simulation-based environment, then what we can do is we can create the environment, take actions for a thousand time steps. And then once we're done, then we can call <b>env.reset</b>, which is a very nice little friendly utility. But that's something that we can only really do in simulation. <b>We can't reset the physical world to our own will.</b>”</em><br><br>原话（人比机器人干得还多）：<em>“this video on the left is a video of a robot, learning how to hit a hockey puck into a goal. And you can see that the human here — this is a friend of mine, Yevgen — <b>he's probably doing more work than the robot is right now</b>, as it attempts to do this. Here's another example, where Ali is <b>closing the doors so that the robot can learn how to open them</b>. And here's an example where Archit… is resetting the robot so that it can attempt to fold the towel.”</em>", "res": {"tag": "推断", "v": "<b>「真实世界不提供撤销键」这件事在你的工作流里有一个具体的形态，而且它决定了你能不能用某些评估方法。</b><br><span class='k'>你的评估是<b>可以</b>复位的：每条 query 独立重跑，起点永远是干净的——这正是 <code>env.reset()</code> 在仿真里成立的那种情形</span>。<b>⇒ 这是一个<b>优势</b>，值得明确意识到：你处在这一讲说的「幸运」那一侧。</b><br><b>⇒ 但有两处例外，而它们恰好是你最容易踩的坑：</b><br><b>① <b>带外部副作用的节点</b></b>——<span class='w'>如果工作流里有节点会写文件、调用外部 API、改数据库，那么「重跑这条 query」就<b>不是</b>干净的复位了</span>。<b>第二次跑时环境已经被第一次改过。⇒ 这会让你的重复测量产生相关性，而你的置信区间假设的是独立。</b><span class='k'>⚠ 如果有这种节点，要么沙箱化，要么在报告里声明。</span><br><b>② <b>缓存</b></b>——<span class='w'>LLM 服务端或你自己的缓存会让第二次调用变快、变便宜、甚至返回完全相同的结果</span>。<b>⇒ 这对 Cost 的测量是<b>致命</b>的：你测的是缓存命中率，不是真实成本。<b>做重复测量前必须确认缓存是关的</b>，这是一行配置却能毁掉整组数据。</b><br><b>而这一页真正值得搬的是那个<b>视角</b>：<b>去数一数你的流程里「人伸手摆一下」的地方有几处</b>。</b> <span class='k'>讲义的荒谬之处是「人比机器人干得还多」；而在一个研究流程里，等价的问题是「这套自动化里还有多少步要我手动介入」</span>。<b>⇒ 具体到你这里，值得查的几处：失败的 run 要不要手动重跑？结果表要不要手动合并？λ 扫描要不要手动改参数再跑一遍？</b><br><b>⇒ 这不只是省力的问题。<b>每一处人工介入都是一个不被记录的自由度</b></b>——<span class='w'>你手动重跑了哪些失败、按什么标准重跑的，这些决定不会进日志，却会影响结果</span>。<b>⇒ 讲义说自主「解锁更多数据」（p14）；而对你，自主首先解锁的是<b>可复现性</b>。</b>", "ref": "本讲 p5–p8（逐行核对）· 讲稿（Yevgen/Ali/Archit 三段视频）· p14 · 简报 §4b §4e（已核）"}},
{"r": [9, 11], "t": "自主 RL 的定义，和那个很要紧的星号", "star": 3, "quote": "<b>Reset Environment</b> — <em><b>Problem: this requires human supervision</b></em> &nbsp;·&nbsp; <em>What if we increase H? &nbsp; <b>Fewer environment resets, less human supervision</b></em><br><b>Autonomous RL: Definition</b><br><em><b>Agent interacts autonomously</b><br><b>No environment resets</b><sup>*</sup><br><b>Initialize once at the beginning</b></em><br><em><sup>*</sup>can relax this constraint to <b>reset occasionally, or at low frequency</b></em>", "one": "<b>定义只有三行，而最有信息量的是那个星号：允许偶尔复位。它把一个非黑即白的问题变成了一个连续谱——真正的变量是「多久复位一次」。</b>", "pts": ["<b>p10 先给出了一个<b>看起来</b>能解决问题的想法，而这个想法之所以重要，是因为它会在 p16 被实验否掉。</b> <span class='k'>想法很直接：<b>把 <code>H</code>（每幕的长度）加长</b>。幕越长，复位次数越少，需要的人工监督就越少</span>。<b>⇒ 而且好处是你<b>什么算法都不用改</b>，课上学过的那些原样能跑。</b>", "<b>讲稿把这个诱惑说得很明白：「we might be able to apply <b>the same exact reinforcement learning algorithms</b> that we've learned about in the course, just with less supervision」。</b> <span class='w'>⇒ 留着这个念头读 p16–p17，那两页就是在回答「为什么不行」。</span>", "<b>p11 的定义只有三行，但每一行都在排除某种「作弊」。</b> <span class='k'>① <b><em>Agent interacts autonomously</em></b>——交互过程中没有人；② <b><em>No environment resets</em></b>——不许把世界摆回去；③ <b><em>Initialize once at the beginning</em></b>——只在最开始初始化<b>一次</b></span>。", "<b>第 ③ 行容易被当成废话，其实它是在堵一个漏洞：<b>不许用「多次初始化」绕开「不许复位」</b>。</b> <span class='w'>否则你可以声称自己没有 reset，只是「又初始化了一次」</span>。", "⚠️ <b>而那个星号是整页最该留意的地方：<b><em>can relax this constraint to reset occasionally, or at low frequency</em></b>（可以放松成偶尔复位、或者低频复位）。</b>", "<b>⇒ 这一笔把问题从「有没有复位」变成了<b>「多久复位一次」</b>——一个连续谱，而不是一个二选一。</b> <span class='k'>后面 EARL 基准的设定正是落在这个谱上：<b>每 20 万步才复位一次</b>（p24）</span>。<b>⇒ 所以「自主 RL」在实践中的含义不是「零人工」，而是<b>「把人工介入压到可以忽略的频率」</b>。</b>", "<b>这个放松有很实际的理由，讲稿顺带说了：<b>偶尔复位是一个兜底</b>。</b> <span class='w'>原话（在 FBRL 那里）：「You can also have a reset very infrequently, so occasionally reset it, <b>just in case it does get stuck in a really challenging state</b>」</span>。<b>⇒ 它防的正是 L15 p5 那个「卡住」：一旦进了出不来的状态，没有兜底就永远出不来。</b>", "<b>⚠ 还有一个很有人情味的理由，讲稿在 p19 附近提到：<b>只要过程是自主的，花多长时间就没那么要紧了</b>。</b> <span class='k'>原话：「if this process is autonomous, then the number of time steps actually matters a little bit less <b>because you can go to sleep while your robot is trying to learn</b>」</span>。<b>⇒ 自主性把「时间成本」换成了「挂机成本」，而后者便宜得多。</b>"], "eq": "p10 先给一个**看起来**能解决问题的想法（它会在 p16 被实验否掉）：\n   **把 H（每幕长度）加长** ⇒ 幕越长，复位越少，人工监督越少\n   好处：**什么算法都不用改**，课上学过的原样能跑\n   讲稿：「we might be able to apply **the same exact RL algorithms**\n           that we've learned about in the course, just with less supervision」\n   ⇒ 留着这个念头读 p16–p17，那两页就是在回答「为什么不行」\n\n**p11 定义**（三行，每行都在排除某种「作弊」）：\n   ① **Agent interacts autonomously**     交互过程中没有人\n   ② **No environment resets**            不许把世界摆回去\n   ③ **Initialize once at the beginning** 只在最开始初始化**一次**\n\n   第 ③ 行不是废话 —— 它堵的是\n   **「不许用多次初始化绕开不许复位」**\n   （否则可以声称没有 reset，只是「又初始化了一次」）\n\n⚠⚠ **那个星号是整页最该留意的地方**：\n   **can relax this constraint to reset occasionally, or at low frequency**\n\n   ⇒ 把问题从「**有没有**复位」变成「**多久复位一次**」\n     —— 一个连续谱，不是二选一\n   后面 EARL 基准正落在这个谱上：**每 20 万步才复位一次**（p24）\n   ⇒ 「自主 RL」的实践含义不是「零人工」，\n     而是**「把人工介入压到可以忽略的频率」**\n\n放松的两个实际理由（讲稿）：\n   ① **偶尔复位是兜底**：\n      「occasionally reset it, **just in case it does get stuck\n        in a really challenging state**」\n      ⇒ 防的正是 L15 p5 那个「卡住」—— 进了出不来的状态，\n        没有兜底就永远出不来\n   ② ⚠ 很有人情味的那个理由：\n      「if this process is autonomous, then the number of time steps\n        actually matters a little bit less **because you can go to sleep\n        while your robot is trying to learn**」\n      ⇒ 自主性把「时间成本」换成了「挂机成本」，后者便宜得多", "tbl": {"head": ["定义的三行", "它排除了什么"], "rows": [["<b>Agent interacts autonomously</b>", "交互过程中有人盯着"], ["<b>No environment resets*</b>", "把世界摆回初始状态"], ["<b>Initialize once at the beginning</b>", "<b>⚠ 用「多次初始化」绕开「不许复位」</b>"], ["<b>* 可偶尔 / 低频复位</b>", "<b>把问题变成「多久一次」的连续谱</b>"]]}, "say": "原话（加长 H 这个诱惑，以及它诱人在哪）：<em>“what if we could just increase h? What if we just increase the length of the episodes in which our agents are attempting the task? And if we increase the length of the episodes, then in principle, we won't require as much human supervision. And we might be able to apply <b>the same exact reinforcement learning algorithms that we've learned about in the course, just with less supervision</b> during the learning process.”</em><br><br>原话（偶尔复位是一个兜底，防的是卡住）：<em>“You can also have a reset very infrequently, so occasionally reset it, <b>just in case it does get stuck in a really challenging state</b>.”</em><br><br>原话（自主性把时间成本换成挂机成本）：<em>“ideally, if this process is autonomous, then the number of time steps actually matters a little bit less <b>because you can go to sleep while your robot is trying to learn</b>.”</em>"},
{"r": [12, 13], "t": "两种评估：火星车还是厨师", "star": 3, "quote": "<b>Autonomous RL: Evaluation</b><br><em>We might care about two different things:<br>- <b>The amount of reward recovered over the course of its life (ex: Mars rover)</b><br>- <b>The quality of the learned policy (ex: robot chef)</b></em><br><em><b>Deployed Policy Evaluation = Quality of policy learned</b><br>J(π) = 𝔼<sub>s₁∼p(s₁), a<sub>t</sub>∼π</sub>[ Σ<sub>t</sub> r(s<sub>t</sub>,a<sub>t</sub>) ]<br>（Start from initial state distribution · Take actions according to π · Total reward over the episode）</em><br><em><b>Continuing Policy Evaluation* = Reward accumulated over lifetime</b><br>（Average over reward accumulated in the lifetime）&nbsp; <sup>*</sup><b>average reward RL</b></em><br><em>We'll look at algorithms for both!</em>", "one": "<b>火星车在意的是「这一路上一共采集到多少数据」，厨师在意的是「学完之后做菜做得好不好」。两者要的不是同一个数，而且优化它们的算法也不一样。</b>", "pts": ["<b>这一页给了一对名字，而这对名字值得记住，因为它把一个常被混在一起的区分讲清楚了。</b>", "<b><b>部署策略评估</b>（Deployed Policy Evaluation）= <b>学出来的策略有多好</b>。</b> <span class='k'><code>J(π) = E_{s₁∼p(s₁), a_t∼π}[Σ_t r(s_t,a_t)]</code>——从初始状态分布抽一个起点，按策略走一幕，把奖励加起来</span>。<b>⇒ 这就是课程前面一直在用的那个目标函数，<b>一个字没变</b>。</b>", "<b><b>持续策略评估</b>（Continuing Policy Evaluation）= <b>一辈子一共拿到多少奖励</b>。</b> <span class='w'>讲稿写成 <code>lim_{H→∞} (1/H)Σ_{t=1}^H r_t</code> 的期望，并点明这叫 <b>average reward RL</b>（平均奖励强化学习）</span>。", "⚠️ <b>两者的差别比「换一个公式」深得多，而讲稿点出的那一处最要紧：<b>期望是对谁取的</b>。</b> <span class='k'>原话：「this expectation <b>isn't under a single policy. It's over the learning process itself</b>」</span>。<b>⇒ 部署评估衡量的是<b>一个固定策略</b>；持续评估衡量的是<b>整个学习过程</b>——包括它学得快不快、中间犯了多少错。</b>", "<b>那两个例子把差别说得最清楚，而且它们是<b>互斥</b>的。</b> <span class='w'><b>火星车</b>：你要的是它在这一路上采集到的科学数据。「You <b>don't really care</b> about whether it learned a good policy that you're going to deploy after the learning process」——学习结束之后那个策略好不好，<b>无所谓</b></span>；<b><b>机器人厨师</b>：训练过程中做砸多少顿饭都不要紧，你在意的是之后能不能稳定地给客人做菜。</b>", "<b>⇒ 关键在于：<b>对火星车，学习过程中的失败是<b>真实损失</b>；对厨师，学习过程中的失败只是<b>训练成本</b></b>。</b> <span class='k'>两者要优化的东西因此不同，算法也不同——幻灯说 <em>We'll look at algorithms for both!</em></span>", "<b>⚠ 一个容易搞混的地方：<b>持续评估不等于「不复位」</b>。</b> <span class='w'>这一页讲的是<b>评估指标</b>，p11 讲的是<b>环境设定</b>，两者是两个维度</span>。<b>⇒ 你完全可以在无复位的环境里关心「最终策略有多好」（这正是后面 FBRL/MEDAL 做的事，p24 的评估写着 <em>Evaluation: policy performance from s₀</em>）。</b>", "<b>讲稿里学生问了一个很好的问题：<b>只跑一条轨迹，为什么还要写期望？</b></b> <span class='k'>答案是：如果你只想知道这一次跑得怎么样，那确实直接测就行；<b>但要衡量的是<b>算法</b>而不是单次运行</b>——环境的随机性、采样批次的随机性都会带来波动</span>。<b>⇒ 「if you want to measure how good <b>the algorithm</b> is, you want an expectation over <b>multiple runs of the algorithm</b>」。</b>", "<b>⇒ 这条对任何做实验的人都适用：<b>报一次运行的结果，报的是那次运行；报算法，就得多跑几次</b>。</b> <span class='w'>而学习过程本身的随机性往往比环境的随机性更大，这一点很容易被低估。</span>"], "eq": "**两个名字**（把一个常被混在一起的区分讲清楚了）：\n\n**部署策略评估** Deployed Policy Evaluation = **学出来的策略有多好**\n   J(π) = E_{s₁∼p(s₁), a_t∼π}[ Σ_t r(s_t, a_t) ]\n   从初始状态分布抽起点 → 按策略走一幕 → 把奖励加起来\n   ⇒ **就是课程前面一直在用的那个目标函数，一个字没变**\n\n**持续策略评估** Continuing Policy Evaluation = **一辈子一共拿到多少奖励**\n   讲稿：lim_{H→∞} (1/H) Σ_{t=1}^{H} r_t 的期望\n   别名：**average reward RL**（平均奖励强化学习）\n\n⚠⚠ 差别比「换个公式」深得多 —— **期望是对谁取的**：\n   「this expectation **isn't under a single policy.\n     It's over the learning process itself**」\n   ⇒ 部署评估衡量**一个固定策略**\n     持续评估衡量**整个学习过程**（学得快不快、中间犯了多少错）\n\n**两个例子（互斥）**：\n   **火星车**：要的是这一路采集到的科学数据\n     「You **don't really care** about whether it learned a good policy\n       that you're going to deploy after the learning process」\n   **机器人厨师**：训练时做砸多少顿饭都不要紧，\n     在意的是之后能不能稳定给客人做菜\n\n   ⇒ 关键：**对火星车，学习过程中的失败是真实损失；\n            对厨师，学习过程中的失败只是训练成本**\n     两者优化的东西不同，算法也不同（We'll look at algorithms for both!）\n\n⚠ 容易搞混：**持续评估 ≠ 不复位**\n   这一页讲的是**评估指标**，p11 讲的是**环境设定** —— 两个维度\n   ⇒ 完全可以在无复位环境里关心「最终策略有多好」\n     （FBRL/MEDAL 正是如此：p24 写着 Evaluation: policy performance from s₀）\n\n讲稿里的好问题：**只跑一条轨迹，为什么还要写期望？**\n   只想知道这次跑得怎样 ⇒ 直接测就行\n   但要衡量的是**算法**而不是单次运行 ——\n   环境的随机性、采样批次的随机性都会带来波动\n   「if you want to measure how good **the algorithm** is,\n     you want an expectation over **multiple runs of the algorithm**」\n   ⇒ **报一次运行的结果，报的是那次运行；报算法，就得多跑几次**\n     而学习过程本身的随机性往往比环境的随机性更大，很容易被低估", "tbl": {"head": ["", "部署策略评估", "持续策略评估"], "rows": [["衡量什么", "<b>学出来的策略有多好</b>", "<b>一辈子的平均奖励</b>"], ["公式", "<b>J(π)（课程一直用的那个）</b>", "<b>lim (1/H)Σr<sub>t</sub>（average reward RL）</b>"], ["期望对谁取", "<b>一个固定策略</b>", "<b>⚠ 整个学习过程</b>"], ["例子", "<b>机器人厨师</b>", "<b>火星车</b>"], ["学习中的失败算什么", "<b>训练成本</b>", "<span class='w'>⚠ 真实损失</span>"]]}, "say": "原话（火星车 vs 厨师，以及「无所谓」那半句）：<em>“One thing that we might care about is the amount of reward recovered over the course of its life. As one example of this, imagine that you're deploying the <b>Mars Rover</b>, and you want the Rover to be able to collect scientific data. <b>You don't really care about whether it learned a good policy that you're going to deploy after the learning process.</b> You really care about whether or not it did a good job, as it was deployed, as it was learning… Or you could [care] about the quality of the learned policy. An example of this is that if you're learning how to <b>cook meals</b>, maybe there's some training process. And <b>you don't really care that much about during the training process, how well it was able to cook</b> as it was learning. But then you really care about, then can I deploy this system and have it be able to cook meals effectively, repeatedly for a variety of customers in the future.”</em><br><br>原话（期望是对学习过程取的，不是对某个策略取的）：<em>“we would want to be considering what is the average reward that it saw during that learning process… So this would be a limit, evaluating average reward and the limit in which h goes to infinity… And there should be an expectation over this quantity. Now, <b>this expectation isn't under a single policy. It's over the learning process itself.</b> So that's another difference from measuring how good a learned policy is.”</em><br><br>原话（学生问「只跑一条为什么要期望」）：<em>“If you want to evaluate just a single lifetime or a single rollout of your learning process, then you could just measure precisely that, run it and see how well it does. Now, in practice, there's variability that's caused by variability in the environment, variability in your learning process, like how you sample batches and so forth. And you may want to measure, like at the algorithm level, how good is your algorithm at this problem? And <b>if you want to measure how good the algorithm is, you want an expectation over multiple runs of the algorithm</b>.”</em>", "res": {"tag": "推断", "v": "<b>这一页给了你一个<b>学名</b>，而你一直在用这个区分、却没有名字可引。</b><br><span class='k'>你做的是 <b>deployed policy evaluation</b>：你在意的是<b>最终选出来的那个配置</b>的 <code>G</code>，而<b>不</b>在意搜索过程中跑了多少个烂配置</span>。<b>⇒ 那正是「机器人厨师」那一侧：<b>训练时做砸的饭不计入评价</b>。</b><br><b>⇒ 这给了你一句可以直接写进论文的话：<b>我们优化的是 deployed policy evaluation——搜索阶段的调用是训练成本，不计入目标函数；我们报告的是最终配置在留出集上的 G。</b></b><span class='w'>比含糊地说「我们做离线选择」清楚得多，而且 EARL 那条线有现成的引用。</span><br><b>⚠ 但这里有一个你必须<b>主动</b>挑明的紧张关系，否则会被审稿人抓住：<b>你的目标函数里本来就有成本项</b>。</b><br><span class='k'>于是「成本」在你这里出现了<b>两次</b>，而且性质完全不同：① <b><code>G</code> 里的 <code>λ·Cost</code></b>——那是<b>最终配置每次推理</b>的成本，属于部署评估；② <b>搜索阶段烧掉的调用</b>——那是训练成本，按部署评估的定义<b>不</b>计入</span>。<b>⇒ 这两个不能混为一谈，但一个只看总账单的审稿人会把它们加在一起问你。</b><br><b>⇒ 稳妥的报法是<b>两个数都给</b>：<b>最终配置的 <code>G</code></b>（主结果）+ <b>达到它所花的搜索预算</b>（方法开销，单独一栏）。</b> <span class='w'>再给一条摊销曲线：搜索成本摊到多少条 query 上就回本了</span>。<b>⇒ 如果你的方法要跑 5000 次调用去搜，而最终配置每条 query 省 0.3 分钱，那回本点是一个很具体、也很好讲的数。</b><br><b>而<b>持续评估</b>那一侧在你这里也不是空的——它对应的是「<b>边服务边调</b>」的场景</b>：<span class='k'>系统上线后持续根据真实流量调整各节点档位，此时每一次错误的档位选择都在真实地损害用户</span>。<b>⇒ 那就是火星车那一侧，而且那时候该用的算法完全不同（要控遗憾，而不是最后选一个好的）——这正是 L14/L10 那条遗憾线的适用场合。</b><br><b>⇒ 所以一个干净的定位是：<b>本文做 deployed policy evaluation（离线选配置）；在线自适应留作未来工作，并指出那时候目标函数要换成遗憾。</b></b><span class='w'>把两者的界划清楚，比假装只有一种设定要可信。</span><br><b>最后一条实验纪律，来自那个「期望对谁取」的问答：<b>你报的是算法还是那一次运行？</b></b> <span class='k'>你的搜索过程<b>本身有随机性</b>（采样哪些 query、平局怎么破、LLM 的温度）</span>。<b>⇒ 只跑一遍搜索然后报结果，报的是那一次的运气。<b>至少跑 3–5 个种子，报均值与范围</b>——而且这比多测几条 query 更重要，因为学习过程的方差往往大于环境的方差。</b>", "ref": "本讲 p12–p13（逐字核对）· 讲稿（火星车/厨师、期望对学习过程取、算法 vs 单次运行）· L14 主线卡 · 简报 §2 §4b §4d（已核）"}},
{"r": [14, 14], "t": "为什么值得做：自主解锁的是数据", "star": 2, "quote": "<b>Why is autonomous RL important?</b><br><em>Robotics ↔ Autonomy<br>- We want robots to <b>operate</b> with minimal human supervision<br>- We want robots to <b>*train*</b> with minimal human supervision</em><br><em>RL on real robots is promising path towards <b>high success rate, reliability</b>.</em><br><em><b>Autonomy unlocks more data, more data may unlock greater generalization.</b></em>", "one": "<b>自主的理由不是「省人力」，而是「解锁数据」——而数据才是泛化的来源。这条链子有三环：自主 → 更多数据 → 更强泛化。</b>", "pts": ["<b>这一页只有四行，但它回答的是「费这么大劲图什么」，而给出的理由比「省人力」要深。</b>", "<b>前两行把 L16.a p1 说过的那两层再点一遍，这次把星号加在了 <code>train</code> 上。</b> <span class='k'>部署时自主（<em>operate</em>）是大家默认在想的；而<b>训练时自主</b>（<em>**train**</em>）才是这一讲的内容</span>。", "<b>第三行是一个<b>和模仿学习的对比</b>，而且这个对比在讲稿里更明确。</b> <span class='w'>原话：「reinforcement learning on real robots is a promising path towards achieving <b>really high success rates, really high reliability compared to imitation learning</b>」</span>。<b>⇒ 理由在 L15 p41 讲过：<b>模仿学习的上界永远是专家</b>；而 RL 能从自己的经验里改进，理论上能超过示教者。</b>", "⚠️ <b>第四行是全页的要点，而且它是一条<b>三环的链子</b>：<b>自主 → 更多数据 → 更强泛化</b>。</b> <span class='k'>原话：「if you're able to train with minimal human supervision, then you're able to <b>collect more data</b>, and more data may also unlock <b>both greater reliability and also greater generalization</b>」</span>。", "<b>⇒ 所以自主的价值<b>不在省下那个人</b>，而在于：有人盯着的时候，数据量的上限是<b>人的工时</b>。</b> <span class='w'>一个人一天能给机器人复位几百次，这就是天花板</span>；<b>而自主之后，天花板变成了硬件的耐久度和电费——高出好几个数量级。</b>", "<b>⚠ 但要留意第四行里那个 <b><em>may</em></b>：「more data <b>may</b> unlock greater generalization」。</b> <span class='k'>这是一个有条件的期望，不是定论——更多数据能不能换来泛化，取决于数据的<b>多样性</b>而不只是数量</span>。<b>⇒ 而这恰好是后面要处理的问题：无复位学习很容易产生<b>高度重复</b>的数据（p17 的「状态分布坍缩」），那种数据再多也不解锁泛化。</b>", "<b>⇒ 把这一页和 p17 对照着读，这一讲的内在张力就出来了：<b>自主是为了拿到更多数据，但天真的自主恰恰会让数据变得更单调</b>。</b> <span class='w'>后面所有算法（FBRL、MEDAL、任务循环）本质上都在解这同一个矛盾。</span>", "<b>最后记一个措辞上的细节：标题写的是 <b><em>Robotics ↔ Autonomy</em></b>，用的是<b>双向</b>箭头。</b> <span class='k'>⇒ 不只是「机器人需要自主」，也是「自主这个问题天然长在机器人身上」——因为只有在不可回滚的物理世界里，复位才是个问题。</b>"], "eq": "这一页回答的是「费这么大劲图什么」，而理由比「省人力」深\n\n前两行（L16.a p1 那两层，这次星号加在 train 上）：\n   部署时自主 operate  —— 大家默认在想的\n   **训练时自主 *train*** —— 这一讲的内容\n\n第三行（与模仿学习的对比，讲稿更明确）：\n   「RL on real robots is a promising path towards achieving\n     **really high success rates, really high reliability\n     compared to imitation learning**」\n   ⇒ 理由在 L15 p41：**模仿学习的上界永远是专家**\n     而 RL 能从自己的经验里改进，理论上能超过示教者\n\n⚠⚠ 第四行是要点，而且是一条**三环的链子**：\n   **自主 → 更多数据 → 更强泛化**\n   「if you're able to train with minimal human supervision, then you're able to\n     **collect more data**, and more data may also unlock **both greater\n     reliability and also greater generalization**」\n\n   ⇒ 自主的价值**不在省下那个人**，而在于：\n     有人盯着时，数据量的上限是**人的工时**\n     （一个人一天能复位几百次，这就是天花板）\n     自主之后，天花板变成硬件耐久度和电费 —— 高好几个数量级\n\n⚠ 但留意第四行那个 **may**：「more data **may** unlock greater generalization」\n   有条件的期望，不是定论\n   更多数据能否换来泛化，取决于数据的**多样性**而不只是数量\n   ⇒ 而这恰是后面要处理的问题：无复位学习很容易产生**高度重复**的数据\n     （p17 的「状态分布坍缩」），那种数据再多也不解锁泛化\n\n⇒ 和 p17 对照着读，这一讲的内在张力就出来了：\n   **自主是为了拿到更多数据，但天真的自主恰恰会让数据变得更单调**\n   后面所有算法（FBRL、MEDAL、任务循环）本质上都在解这同一个矛盾\n\n措辞细节：标题是 **Robotics ↔ Autonomy**，**双向**箭头\n   ⇒ 不只是「机器人需要自主」，也是「自主这个问题天然长在机器人身上」\n     —— 只有在不可回滚的物理世界里，复位才是个问题", "tbl": {"head": ["自主解锁什么", "有人盯着时的上限", "自主之后的上限"], "rows": [["<b>数据量</b>", "<span class='w'>人的工时（一天几百次）</span>", "<b>硬件耐久 + 电费</b>"], ["<b>泛化</b>", "<span class='w'>受数据量限制</span>", "<b>⚠ 要数据够<b>多样</b>才行</b>"], ["⚠ 内在张力", "—", "<b>天真的自主让数据更单调（p17）</b>"]]}, "res": {"tag": "推断", "v": "<b>那条「自主 → 更多数据 → 更强泛化」的链子，在你这里要换一个环节，而换完之后结论反而更强。</b><br><span class='k'>讲义的瓶颈是<b>人工复位的工时</b>；你的瓶颈不是人，是<b>钱</b>——每次评估一个配置都要真金白银的 LLM 调用</span>。<b>⇒ 所以对你，等价的链子是：<b>测量效率 → 更多配置被评估 → 更可信的最优配置</b>。</b><br><b>⇒ 而你的整套方法（G-最优设计定分配、逐次淘汰砍候选、线性结构让测量跨配置迁移）正是在抬高这条链子的第一环。</b> <span class='w'>这给了你一个比「我们的方法更准」更有力的叙事：<b>我们让同样的预算覆盖更多配置</b>。</span><br><b>⚠ 但那个 <b><em>may</em></b> 的警告对你同样成立，而且形态几乎一样：<b>测得多不等于测得好</b>。</b> <span class='k'>这是第三次撞上同一条道理了——CSE 541 L07 p3 用特征分解说过（「一堆测量全挤在同一个方向上，总次数再多，垂直方向仍然什么都不知道」），L15 的 FTL 失败说过，这里 p17 的「状态分布坍缩」还要再说一遍</span>。<b>⇒ 三门课、三种语言，指的是同一件事：<b>信息来自覆盖，不来自重复</b>。</b><br><b>⇒ 这个三重印证值得写进论文的 motivation，因为它说明「按信息价值分配预算」不是一个 bandit 领域的小技巧，而是一条跨领域的共识。</b><br><b>而第三行那个「RL 比模仿学习更可靠」的论据，对你有一个<b>反向</b>的含义，值得想清楚。</b> <span class='w'>讲义说模仿学习的上界是专家，所以要用 RL 超过它</span>；<b>⇒ 而你的工作<b>不</b>试图超过任何上界——你要的是「用更少的钱接近大模型的表现」。</b><span class='k'>⇒ 所以你的上界是明确的、也是你<b>接受</b>的：<b>全部节点都用最强模型</b>。</b><br><b>⇒ 这一点要在论文里明说，因为它能挡掉一类质疑：<b>有人会问「你的方法能不能超过全大模型」——答案是不能，而且<b>不应该</b>能；你优化的是 <code>G = Acc − λ·Cost</code>，而全大模型在 <code>λ=0</code> 时就是最优解。</b></b><span class='w'>你的贡献在 <code>λ>0</code> 的那一整条曲线上，不在端点。把这句话准备好。</span>", "ref": "本讲 p14（逐字核对）· 讲稿（自主解锁数据）· p17 · L07 p3 · L15 p41 · 简报 §1 §2 §4c（已核）"}},
{"r": [15, 16], "t": "把幕加长试试：实验直接否掉了这条路", "star": 3, "quote": "<b>What about standard RL algorithms?</b><br><em>What happens when episode length increases?</em><br><em><b>1000 steps · 2000 steps · 10,000 steps · 50,000 steps · 100,000 steps</b></em><br><em><b>Note: this measures the deployed policy evaluation.</b></em>", "one": "<b>幕越长，需要的人工复位越少——听上去是白捡的。但实验给出的是一组单调下降的曲线：少给复位，最后学出来的策略就越差，哪怕任务非常简单。</b>", "pts": ["<b>这一页回答的是 p10 那个诱人的想法：<b>既然复位要人，那把幕加长不就行了？</b></b> <span class='k'>算法一个字都不用改，监督量自然下降</span>。<b>⇒ 实验设计得很干净：同一个 SAC，只改幕长，跑五档。</b>", "⚠️ <b>结果是<b>单调变差</b>：1000 步能学会；2000 步差一点；1 万步更差；到 5 万、10 万步，<b>基本学不会了</b>。</b> <span class='w'>讲稿：「as we increase and make the episode length longer, and as a result reduce the supervision required for training, the algorithm at the very end is <b>hardly able to learn how to do the task at all</b>」</span>。", "<b>而最让人警觉的是任务有多简单。</b> <span class='k'>讲稿特意补了一句：「this is a <b>very simple</b> fish control task, where your goal is to navigate with what the fish can do to a particular position. So <b>pretty simple task</b>. <b>Even for the simple task</b>, if you increase your episode length and don't give it resets very frequently, you aren't able to learn a good policy」</span>。<b>⇒ 连这么简单的任务都扛不住，复杂任务就更不用说了。</b>", "<b>幻灯上那行小字 <b><em>Note: this measures the deployed policy evaluation</em></b> 很要紧，别跳过。</b> <span class='w'>它在说：纵轴量的是「<b>学出来的策略从初始状态出发有多好</b>」（上一页那两个定义里的第一个），<b>不是</b>「这一辈子一共拿了多少奖励」</span>。", "<b>⇒ 这个说明之所以必要，是因为如果换成<b>持续</b>评估，曲线可能长得完全不一样。</b> <span class='k'>一个漂到奖励区就赖着不走的智能体，按「一辈子的平均奖励」算可能分数不低</span>；<b>但按「它学会了一个能从头做到尾的策略吗」算，它是失败的。<b>而后者才是这一页在量的东西。</b></b>", "<b>⚠ 所以这一页其实<b>同时</b>示范了上一页那对定义为什么必须分清：<b>同一组实验，换一个评估指标，结论可能反过来</b>。</b> <span class='w'>讲义把指标写在图上，是一个值得学的习惯。</span>", "<b>讲稿在给出原因之前先把问题抛给了学生（「Does anyone have hypotheses for why we're not getting a good policy?」），而学生答对了第一条。</b> <span class='k'>学生的答案：「it can make a mistake and do something that's bad, maybe leads it to a part of the state space that is <b>very hard to recover from</b>」</span>。<b>⇒ 老师补充说在这个鱼的环境里倒不至于「把尾巴弄断」，但<b>确实会漂离好的状态分布</b>——这就是下一页的挑战 1。</b>", "<b>⇒ 读这一页的正确姿势是：<b>先自己想一想为什么会变差，再翻下一页</b>。</b> <span class='w'>因为两个挑战里，第一个大多数人想得到，第二个（状态分布坍缩）要绕一个弯。</span>"], "eq": "回答 p10 那个诱人的想法：**既然复位要人，把幕加长不就行了？**\n   算法一个字不用改，监督量自然下降\n   实验很干净：同一个 SAC，只改幕长，跑五档\n\n⚠ 结果是**单调变差**：\n   1000 步    能学会\n   2000 步    差一点\n   10,000 步  更差\n   50,000 / 100,000 步  **基本学不会了**\n   「the algorithm at the very end is **hardly able to learn\n     how to do the task at all**」\n\n最让人警觉的是任务有多简单：\n   「this is a **very simple** fish control task… **Even for the simple task**,\n     if you increase your episode length and don't give it resets very frequently,\n     you aren't able to learn a good policy」\n   ⇒ 连这么简单的任务都扛不住，复杂任务更不用说\n\n幻灯那行小字别跳过：**Note: this measures the deployed policy evaluation**\n   纵轴量的是「**学出来的策略从初始状态出发有多好**」（p13 的第一个定义）\n   **不是**「这一辈子一共拿了多少奖励」\n\n   ⇒ 为什么这个说明必要：换成**持续**评估，曲线可能完全不一样\n     一个漂到奖励区就赖着不走的智能体，\n     按「一辈子的平均奖励」算可能分数不低；\n     但按「它学会了一个能从头做到尾的策略吗」算，它是**失败**的\n     —— **而后者才是这一页在量的东西**\n\n⚠ 所以这一页**同时**示范了 p13 那对定义为什么必须分清：\n   **同一组实验，换一个评估指标，结论可能反过来**\n   讲义把指标写在图上，是值得学的习惯\n\n讲稿先把问题抛给学生（「Does anyone have hypotheses for why…?」）\n   学生答对了第一条：「it can make a mistake… maybe leads it to a part of\n     the state space that is **very hard to recover from**」\n   老师补充：鱼的环境里倒不至于「把尾巴弄断」，但**确实会漂离好的状态分布**\n   ⇒ 这就是下一页的挑战 1\n\n⇒ 读这一页的正确姿势：**先自己想为什么会变差，再翻下一页**\n   两个挑战里第一个大多数人想得到，第二个（状态分布坍缩）要绕一个弯", "tbl": {"head": ["幕长", "人工复位频率", "学出来的策略"], "rows": [["<b>1000 步</b>", "<span class='w'>高</span>", "<b>能学会</b>"], ["<b>2000 步</b>", "较高", "差一点"], ["<b>10,000 步</b>", "中", "更差"], ["<b>50,000 / 100,000 步</b>", "<b>很低</b>", "<span class='w'>⚠ 基本学不会</span>"], ["⚠ 而且任务是", "—", "<b>一个很简单的鱼游到指定位置</b>"]]}, "say": "原话（单调变差，而且任务很简单）：<em>“if you increase the length of the episodes during training by a factor of 2, we see that the algorithm does worse, and then we increase it by a factor of 10. We see that it does even worse. And basically, as we increase and make the episode length longer, and as a result reduce the supervision required for training, <b>the algorithm at the very end is hardly able to learn how to do the task at all</b>… And I should mention this is a <b>very simple fish control task</b>, where your goal is to navigate with what the fish can do to a particular position. So pretty simple task. <b>Even for the simple task</b>, if you increase your episode length and don't give it resets very frequently, you aren't able to learn a good policy.”</em><br><br>原话（学生答对的第一条）：<em>“So the first issue that can happen is it can make a mistake and do something that's bad, maybe leads it to <b>a part of the state space that is very hard to recover from</b>. In this particular environment, I don't think it's possible for it to break its tail or something, but <b>you can basically drift away from the state distribution that's good</b>.”</em>"},
{"r": [17, 17], "t": "两个挑战：漂走了，和挤成一团", "star": 3, "quote": "<b>The Challenge of Learning Autonomously</b><br><em><b>Episodic Learning</b>: Can always retry the task from initial state distribution</em><br><em><b>Non-Episodic Learning</b>:<br><b>Challenge 1: exploration can cause the agent to drift far away</b><br><b>Challenge 2: state distribution collapse</b> → <b>The agent never learns a good policy</b></em>", "one": "<b>第一个挑战是「走丢了」——探索把你带到一个回不来的地方。第二个更阴：你明明成功了、奖励也拿到了，但数据全挤在终点附近，于是你永远学不会怎么从起点走过去。</b>", "pts": ["<b>讲稿引入了一个记号把两个挑战统一起来，很值得借用：<b><code>ρ*</code> = 从起点走到目标的<b>最优状态分布</b></b>。</b> <span class='k'>⇒ 两个挑战都是相对 <code>ρ*</code> 说的：<b>漂移 = 离开 <code>ρ*</code>；坍缩 = 数据不覆盖 <code>ρ*</code></b></span>。", "<b><b>挑战 1 · 漂移</b>：探索会把你带离好状态的区域，而且可能回不来。</b> <span class='w'>讲稿：「As we're learning, we might simply deviate from where the set of good states is. And <b>because of this drift, it might be very hard to recover</b> and get closer to the parts that have high reward」</span>。<b>⇒ 这一条直觉，大多数人一想就能想到。</b>", "⚠️ <b><b>挑战 2 · 状态分布坍缩</b>要绕一个弯，而讲稿自己说它 <b>a little bit more nuanced</b>。</b> <span class='k'>场景是这样的：假设你<b>成功</b>了——漂着漂着终于到了目标。好事。<b>然后呢？你就待在那儿了</b></span>。", "<b>⇒ 「待在那儿」为什么是灾难？因为<b>你开始在那一小块区域里疯狂收集数据，而且奖励很高</b>。</b> <span class='w'>讲稿：「you might simply <b>stay in this region</b> of the state space. And if you start collecting a lot of data in this part of the state space, <b>you're getting lots of reward. And so the learning process is great.</b>」</span>", "<b>⇒ 但接下来那一句是转折：<b>「But then, if your goal is to learn a policy that starts from here and goes to here, <b>you're not actually visiting the states that will yield a good policy</b>」</b>。</b> <span class='k'>⇒ <b>你的回放缓冲里全是终点附近的状态</b>，而起点到终点那一路上的状态<b>一个都没有</b>。</span>", "<b>⇒ 于是结论很硬：<b>「if you don't have states from the optimal policy, <b>you won't know what to do or what actions to take</b>, when you're in this part of the state space」</b>——幻灯写成 <b><em>The agent never learns a good policy</em></b>。</b>", "<b>⚠ 这一条最毒的地方在于<b>它看起来像成功</b>：奖励曲线在涨，损失在降，数据在积累。</b> <span class='w'>所有常看的指标都好看，而你要的那个能力完全没长出来</span>。<b>⇒ 这是一个典型的「指标与目标脱钩」，而它和上一页那行小字（部署评估 vs 持续评估）是同一件事的两面。</b>", "<b>把两个挑战和「幕加长」连起来，p16 那组曲线就解释通了</b>：<span class='k'>幕越长，① 漂走之后<b>没人把你拉回来</b>，② 一旦赖在某处<b>也没人把你赶走</b></span>。<b>⇒ 而<b>复位</b>恰好同时解决这两件事——它既把你从漂走的地方拉回来，又强制你的数据覆盖起点附近。</b>", "<b>⇒ 所以幻灯左边那行 <b><em>Episodic Learning: Can always retry the task from initial state distribution</em></b> 不是在描述一个限制，<b>是在描述一个被白拿的好处</b>。</b> <span class='w'>复位一直在偷偷帮你维持状态分布，而我们从来没意识到。</span>", "<b>⇒ 下一页的想法因此很自然：<b>既然复位这么有用，那就学一个策略来做复位</b>。</b>"], "eq": "讲稿引入一个统一记号（值得借用）：\n   **ρ\\* = 从起点走到目标的最优状态分布**\n   ⇒ 两个挑战都是相对 ρ\\* 说的：\n     **漂移 = 离开 ρ\\*；坍缩 = 数据不覆盖 ρ\\***\n\n**挑战 1 · 漂移**（大多数人一想就到）：\n   「we might simply deviate from where the set of good states is.\n     And **because of this drift, it might be very hard to recover**」\n\n⚠ **挑战 2 · 状态分布坍缩**（讲稿自称 a little bit more nuanced）：\n   场景：假设你**成功**了 —— 漂着漂着终于到了目标。好事。**然后你就待在那儿了。**\n\n   为什么是灾难：你开始在那一小块区域里疯狂收集数据，**而且奖励很高**\n     「you might simply **stay in this region**… you're getting lots of reward.\n       **And so the learning process is great.**」\n\n   转折：「But then, if your goal is to learn a policy that starts from here and\n           goes to here, **you're not actually visiting the states that will\n           yield a good policy**」\n   ⇒ **回放缓冲里全是终点附近的状态**，起点到终点那一路的状态**一个都没有**\n\n   结论：「if you don't have states from the optimal policy,\n           **you won't know what to do or what actions to take**」\n   幻灯：**The agent never learns a good policy**\n\n⚠ 最毒的地方：**它看起来像成功**\n   奖励曲线在涨、损失在降、数据在积累 —— 所有常看的指标都好看\n   而你要的那个能力完全没长出来\n   ⇒ 典型的「指标与目标脱钩」，与 p16 那行小字是同一件事的两面\n\n两个挑战 ↔ 「幕加长」（p16 那组曲线就解释通了）：\n   幕越长 ⇒ ① 漂走之后**没人把你拉回来**\n            ② 一旦赖在某处**也没人把你赶走**\n   而**复位恰好同时解决这两件事** ——\n   既把你从漂走的地方拉回来，又强制你的数据覆盖起点附近\n\n⇒ 幻灯左边那行 **Episodic Learning: Can always retry the task from\n   initial state distribution** 不是在描述一个限制，\n   **是在描述一个被白拿的好处**\n   复位一直在偷偷帮你维持状态分布，而我们从来没意识到\n\n⇒ 下一页的想法因此很自然：**既然复位这么有用，那就学一个策略来做复位**", "tbl": {"head": ["", "挑战 1 · 漂移", "挑战 2 · 状态分布坍缩"], "rows": [["发生了什么", "<b>离开 ρ*，回不来</b>", "<b>到了目标就赖着不走</b>"], ["任务成功了吗", "<span class='w'>没有</span>", "<b>⚠ 成功了</b>"], ["奖励好看吗", "<span class='w'>不好看</span>", "<b>⚠ 很好看</b>"], ["缺了什么", "回到 ρ* 的能力", "<b>起点到终点那一路的状态</b>"], ["容易发现吗", "<b>容易</b>", "<span class='w'>⚠ 不容易，看着像成功</span>"], ["复位为什么管用", "<b>把你拉回来</b>", "<b>强制覆盖起点附近</b>"]]}, "say": "原话（挑战 2 的完整推演——注意「学习过程很棒」那句反讽）：<em>“The other challenge is actually <b>a little bit more nuanced</b>, and in particular, say that we drift away. But maybe… if you are able to eventually get to the goal, which is good. You got reward. From there, <b>you might simply stay in this region of the state space</b>. And if you start collecting a lot of data in this part of the state space, <b>you're getting lots of reward. And so the learning process is great.</b> But then, if your goal is to learn a policy that starts from here and goes to here, <b>you're not actually visiting the states that will yield a good policy</b>… And if you don't have states from the optimal policy, <b>you won't know what to do or what actions to take, when you're in this part of the state space</b>.”</em><br><br>原话（用 ρ* 把两个挑战统一起来）：<em>“so two challenges, if we think about this <b>rho star as the optimal state distribution for getting from start to goal</b>, then in an episodic learning, you can always retry the task from the initial state distribution. Whereas, in autonomous learning or non-episodic learning, you'll continue from where you left off, and that exploration might lead you to <b>drift away from the set of good states</b>… And then even if you do eventually get to the goal, <b>your state distribution in your replay buffer might collapse and might be concentrated around the goal rather than capturing the state distribution that's around the optimal policy</b>.”</em>", "res": {"tag": "推断", "v": "<b>「状态分布坍缩」是你这学期<b>第三次</b>撞上同一条道理了，而三次用的是三种完全不同的语言——这件事本身就值得写进论文。</b><br><span class='k'>① <b>CSE 541 L07 p3</b>（线性代数的说法）：<code>xᵀ(XᵀX)^{-1}x = Σ_i (xᵀu_i)²/d_i</code>，测得少的方向贡献大 ⇒ <b>一堆测量全挤在同一个方向上，总次数再多，垂直方向上仍然什么都不知道</b>；② <b>CS224R L15 / CSE 541 L01</b>（在线学习的说法）：跟随领先者把赌注全押在当前最优上，对抗下灾难性失败；③ <b>本讲</b>（强化学习的说法）：数据坍缩到目标附近，奖励很好看，但策略永远学不会</span>。<br><b>⇒ 三门课、三种数学、同一个结论：<b>信息来自覆盖，不来自重复</b>。</b> <span class='w'>而且三次都附带同一个警告：<b>坍缩时你看到的指标是好看的</b>。</span><br><b>⇒ 对你最直接的含义：<b>逐次淘汰会主动制造坍缩</b>。</b> <span class='k'>这正是淘汰算法的设计意图——把预算集中到存活候选上。但它的副作用是：<b>被砍掉的那片区域，你以后再也拿不到它的数据</b></span>。<b>⇒ 如果砍错了（而砍错是有 <code>δ</code> 概率的），你不会知道，因为剩下的测量都在幸存者身上，<b>而它们的 <code>Ĝ</code> 看起来都很正常</b>。</b><br><b>⇒ 这给了 L15 那条「误砍不可逆」一个更尖锐的版本：<b>误砍不仅不可逆，而且不可见</b>。</b><span class='w'>没有任何后续指标会提示你砍错了。</span><br><b>⇒ 两条可做的防护：</b><br><b>① <b>留一个「复活」通道</b></b>——<span class='k'>像讲义那个「偶尔复位」的兜底一样，每隔几轮拿出一小份预算去重测<b>已经被砍掉</b>的候选中最接近边界的那几个</span>。<b>成本很小，但它把「不可见」变成了「可见」。</b><br><b>② <b>报告淘汰边界附近的间隔</b></b>——<span class='w'>如果最后一轮砍掉的那个候选，它的置信上界离幸存者的下界只差一点点，那么你的结论就很脆</span>。<b>⇒ 报这个间隔（而不只是报最终 <code>G</code>），等于主动交代了结论有多稳。</b><br><b>⚠ 另外那个「看起来像成功」的陷阱，在你的实验里有一个具体形态值得查：<b>如果你的搜索把预算越来越集中到少数几个配置上，<code>Ĝ</code> 的方差会越来越小，曲线会越来越漂亮</b>。</b> <span class='k'>但那只是因为你在反复测同几个东西</span>。<b>⇒ 所以别把「估计方差在下降」当成「搜索在进步」——这两者在坍缩时恰好同时发生。</b>", "ref": "本讲 p17（逐字核对）· 讲稿（ρ* 与坍缩的完整推演）· L07 p3 · L15 p30 · L01.b p30 · 简报 §4b §4c（已核）"}, "link": {"t": "你学过的对应：CSE 541 L07 精读（G-最优设计）—— p3 那个特征分解讲的是同一件事的线性代数版：测得少的方向贡献大，所以反复测相似的东西等于没测", "href": "../../bandits-cse541/精读/L07-精读.html"}},
{"r": [18, 19], "t": "FBRL：那就学一个「撤销」策略", "star": 3, "quote": "<b>How to autonomously learn an effective policy?</b> — <em>Learns successfully if allowed to frequently retry from the initial state distribution. &nbsp; <b>Key idea: learn a policy to reset?</b></em><br><b>Algorithm: Forward-Backward RL (FBRL)</b><br><em>Define r<sub>b</sub>(s,a) for reaching s₀<br>1. Initialize forward policy π<sub>f</sub> and backward policy π<sub>b</sub><br>2. Repeat:<br>&nbsp;&nbsp;1. Roll out π<sub>f</sub> for H steps &nbsp; 2. Update π<sub>f</sub> using r<sub>f</sub>(s,a)<br>&nbsp;&nbsp;3. Roll out π<sub>b</sub> for H steps &nbsp; 4. Update π<sub>b</sub> using r<sub>b</sub>(s,a)<br>&nbsp;&nbsp;5. <b>No reset or very infrequent reset</b><br><b>Test time: Discard π<sub>b</sub>. Deploy π<sub>f</sub></b></em><br><em><b>+ simple</b> &nbsp;·&nbsp; <b>− backward policy is ultimately discarded</b></em>", "one": "<b>既然复位这件事这么有用，又不能指望人来做，那就把它也当成一个强化学习任务：学一个专门负责「把场面恢复原样」的策略。</b>", "pts": ["<b>想法的推导只有两步，而且很顺：<b>① 允许频繁从初始分布重试，就能学成（p18 上半句）；② 人不能做这件事 ⇒ 那就学一个策略来做</b>。</b> <span class='k'>幻灯把第二步写成一个带问号的提问：<em>Key idea: learn a policy to <b>reset</b>?</em></span>", "<b>于是有了两个策略，分工很直白：<b><code>π_f</code>（前向）做任务，<code>π_b</code>（后向）<b>撤销</b>任务</b>。</b> <span class='w'>讲稿：「a reset policy or a backwards policy that's trying to <b>undo</b> the task rather than do the task forward」</span>。", "<b>算法循环只有四步，而第五步是整个算法的要点：<b>No reset</b>。</b> <span class='k'>跑前向 H 步 → 更新前向 → 跑后向 H 步 → 更新后向 → <b>不复位，直接回到跑前向</b></span>。<b>⇒ 两个策略交替占用同一个物理世界，谁也不需要人帮忙。</b>", "<b>⚠ 多出来的东西只有一个：<b>第二个奖励函数 <code>r_b</code></b>，它奖励「回到初始状态分布」。</b> <span class='w'>这是实打实的额外工作——你得<b>定义</b>什么叫「回到起点」，而这件事在有些任务上并不显然</span>。", "<b>更新步骤本身没有新东西：<b>用你喜欢的任何 RL 算法</b>。</b> <span class='k'>讲稿：「you can use your favorite reinforcement learning algorithm for this」</span>。<b>⇒ FBRL 是一个<b>外层结构</b>，不是一个新的学习算法——这一点和 L15 的分层是同一种性质。</b>", "<b>测试时 <b><em>Discard π_b. Deploy π_f</em></b>——后向策略<b>扔掉</b>。</b> <span class='w'>这也正是那条减号：<em>backward policy is ultimately discarded</em></span>；<b>讲稿的评价很实在：「in some ways, it seems a little bit <b>wasteful</b> to learn this policy, but it does enable the autonomous learning which is quite nice」。</b>", "<b>⇒ 所以 FBRL 的本质是<b>拿一半的算力去买自主性</b>：你训了两个策略，只用一个。</b> <span class='k'>值不值，取决于那一半算力和一个人力的相对价格——而对真机实验，这个交换几乎总是划算的。</span>", "<b>「跑多少步换一次」这个参数，讲稿给了实用建议。</b> <span class='w'>最简单的就是固定 <code>H</code> 步。更聪明的做法可以动态调（前向还什么都不会时，后向其实没什么可撤的，所以开头可以让前向多跑一会儿），<b>但「固定步数更简单」</b></span>。<b>⇒ 这和 L15 p21「何时换子目标」的结论是同一个：<b>简单的固定步数在实践中胜出</b>。</b>", "<b>讲稿里有一个很好的提问：<b>两个策略之间要不要共享信息？</b></b> <span class='k'>答案是可以但通常不：「you could consider <b>sharing data between the two and relabeling the rewards</b>… In practice, it's fairly common to <b>actually not share much information</b>. You can also share an image encoder… but they are actually trying to learn, in some ways, <b>very different things</b>」</span>。<b>⇒ 共享表示（图像编码器）可以，共享策略不行——因为「做」和「撤销」是两件不同的事。</b>", "<b>⚠ 最后记一个讲稿点出的真实困难，它在下一页会被部分解决：<b>前向和后向的难度可能严重不匹配</b>。</b> <span class='w'>开关门那个任务里，<b>前向是关门、后向是开门，而开门可能比关门难得多</b></span>；<b>讲稿还举了后空翻：翻一个后空翻很难，而「站起来准备翻」容易得多。<b>⇒ 难度不匹配 ⇒ 两个策略学习速度不同 ⇒ 整个过程更难。</b></b>"], "eq": "想法的推导（两步，很顺）：\n   ① 允许频繁从初始分布重试，就能学成（p18 上半句）\n   ② 人不能做这件事 ⇒ **那就学一个策略来做**\n   幻灯写成带问号的提问：Key idea: learn a policy to **reset**?\n\n两个策略，分工直白：\n   **π_f（前向）做任务 · π_b（后向）撤销任务**\n   讲稿：「a backwards policy that's trying to **undo** the task\n           rather than do the task forward」\n\n算法循环（四步，而第五步是要点）：\n   跑 π_f H 步 → 更新 π_f（用 r_f）\n   跑 π_b H 步 → 更新 π_b（用 r_b）\n   **⑤ No reset** —— 不复位，直接回到跑前向\n   ⇒ 两个策略交替占用同一个物理世界，谁也不需要人帮忙\n   **Test time: Discard π_b. Deploy π_f**\n\n⚠ 多出来的东西只有一个：**第二个奖励函数 r_b**（奖励「回到初始状态分布」）\n   这是实打实的额外工作 —— 你得**定义**什么叫「回到起点」，\n   而这件事在有些任务上并不显然\n\n更新步骤没有新东西：「you can use your **favorite** RL algorithm for this」\n   ⇒ FBRL 是一个**外层结构**，不是新的学习算法（与 L15 的分层同一种性质）\n\n那条减号：**backward policy is ultimately discarded**\n   讲稿：「it seems a little bit **wasteful** to learn this policy,\n           but it does enable the autonomous learning which is quite nice」\n   ⇒ FBRL 的本质是**拿一半算力去买自主性**：训两个策略，只用一个\n     值不值取决于那一半算力与一个人力的相对价格\n     —— 对真机实验，这个交换几乎总是划算的\n\n「跑多少步换一次」：最简单的就是**固定 H 步**\n   更聪明的做法可动态调（前向还什么都不会时后向没什么可撤的）\n   **但固定步数更简单**\n   ⇒ 与 L15 p21「何时换子目标」同一个结论：**简单的固定步数在实践中胜出**\n\n讲稿里的好提问：**两个策略要不要共享信息？**\n   「you could consider **sharing data between the two and relabeling the rewards**…\n     In practice, it's fairly common to **actually not share much information**.\n     You can also share an image encoder… but they are actually trying to learn,\n     in some ways, **very different things**」\n   ⇒ 共享**表示**（图像编码器）可以，共享**策略**不行\n     —— 「做」和「撤销」是两件不同的事\n\n⚠ 一个真实困难（下一页部分解决）：**前向与后向的难度可能严重不匹配**\n   开关门任务：**前向是关门、后向是开门，而开门可能比关门难得多**\n   后空翻：翻一个后空翻很难，「站起来准备翻」容易得多\n   ⇒ 难度不匹配 ⇒ 两策略学习速度不同 ⇒ 整个过程更难", "tbl": {"head": ["", "前向策略 π<sub>f</sub>", "后向策略 π<sub>b</sub>"], "rows": [["做什么", "<b>完成任务</b>", "<b>撤销任务 / 回到起点</b>"], ["奖励", "<b>r<sub>f</sub>（任务奖励）</b>", "<b>r<sub>b</sub>（⚠ 要额外定义）</b>"], ["测试时", "<b>部署</b>", "<span class='w'>⚠ 扔掉</span>"], ["难度", "任务本身", "<span class='w'>⚠ 可能比前向还难（开关门）</span>"], ["要共享参数吗", "<b>可共享图像编码器</b>", "<b>但不共享策略</b>"]]}, "say": "原话（后向策略最终被扔掉，有点浪费但换来了自主）：<em>“the upside of this algorithm is quite simple. One of the downsides is that this backward policy that's trying to undo the task — ultimately, this is not particularly useful. So in some ways, <b>it seems a little bit wasteful to learn this policy, but it does enable the autonomous learning which is quite nice</b>.”</em><br><br>原话（两个策略要不要共享信息）：<em>“is there any information sharing between the forward policy and backward policy? If you're using replay buffers, you could consider <b>sharing data between the two and relabeling the rewards</b> for the forward policy for backward policy, and vice-versa. <b>In practice, it's fairly common to actually not share much information.</b> You can also share an image encoder, for example, share some of the weights. That can be helpful, but <b>they are actually trying to learn, in some ways, very different things</b>.”</em><br><br>原话（前向后向难度不匹配，是个真实困难）：<em>“the other thing that I should mention, actually, that's cool about this particular task is <b>the forward task is to close the door, and the backward task is to open the door. And the backward task is, actually, depending on where the arm starts, it can actually be quite a bit harder than the forward task.</b> And so you could, sometimes, have these mismatches between how hard it is to do the forward task and how hard it is to do the backward task… Similarly, if your forward task is to do a <b>backflip</b>, maybe doing a backflip is really challenging, but getting up and standing up to start doing the backflip is comparably easier. And so it's fairly common to have a mismatch in that difficulty.”</em>"},
{"r": [20, 23], "t": "MEDAL：别退回起点，退回专家走过的那一片", "star": 3, "quote": "<b>Alternatives to Forward-Backward RL?</b><br><em>1. <b>Learn to reset to expert state distribution</b>（forward-backward with modified backward reward）<br>2. <b>Practice cycle of different tasks</b><br>3. <b>Set up task that can be done repetitively</b>（“forward-forward RL”?）</em><br><b>Algorithm: Modified backward policy reward — MEDAL（Matching Expert Distributions for Autonomous Learning）</b><br><em>Modified reward r<sub>b</sub>(s,a): <b>learned reward for matching state distribution in demos</b>.<br>0. <b>Given a small set of demonstrations</b> … 6. <b>Update learned reward r<sub>b</sub>(s,a)</b></em><br><em>Addressing <b>challenge 2</b>: backward policy avoids collapse of state distribution &nbsp;·&nbsp; Addressing <b>challenge 1</b>: agent doesn't drift away</em><br><em><b>Pro: Forward policy tries the task from wide set of initial states, both easy and hard, improving the sample efficiency</b>〔Kakade &amp; Langford, ICML 2002〕</em>", "one": "<b>FBRL 每次都把你送回同一个起点。MEDAL 改成把你送回「专家走过的那一路上的任意一处」——于是前向策略练到的不只是开局，而是整条路。</b>", "pts": ["<b>先看三条替代路线的结构，它们是按「改什么」分的。</b> <span class='k'>① 改<b>后向奖励</b>（这一页）；② 改成<b>多任务循环</b>（p28–32）；③ 改<b>任务本身</b>，设计成可以反复做的（p33，老师戏称 “forward-forward RL”）</span>。", "<b>MEDAL 的动机很值得想一遍：<b>为什么非要回到<b>起点</b>？</b></b> <span class='w'>讲稿：「we also need to know how to take good actions, <b>all along the expert state distribution</b> as well. And so… instead of going back all the way to the beginning every single time, we could actually <b>reset to different states along the expert state distribution</b>」</span>。", "<b>⇒ 关键的认识是：<b>你要学的不是「从起点出发怎么走」，而是「在这条路上的<b>任何</b>一点该怎么走」</b>。</b> <span class='k'>只从起点练，你在中段的覆盖是靠前向策略自己走过去的——而它一开始走不过去</span>。", "<b>算法与 FBRL 只差两处，这个对比很干净。</b> <span class='w'><b>第 0 步</b>：多了「给一小批演示」；<b>第 6 步</b>：多了「更新学出来的奖励 <code>r_b</code>」</b></span>。<b>其余五步一字未改。</b>", "<b>那个 <code>r_b</code> 怎么学？用<b>判别器</b>，而这个手法在奖励学习那一讲（L08）出现过。</b> <span class='k'>讲稿：「this reward function will be trained to <b>distinguish states visited by the policy and states visited in the demonstrations</b>. And then… when you're training the backward policy, you'll be trying to <b>trick this reward function</b> into thinking that it's visiting states from the expert and not from the policy」</span>。<b>⇒ 一个标准的对抗式设置。</b>", "<b>⚠ 讲稿里有一个很尖的学生提问值得单独记：<b>既然目标状态也在演示里，后向策略为什么不干脆赖在目标状态？</b></b> <span class='w'>答案是：<code>r_b</code> 本质上是一个<b>状态分布匹配</b>目标，不是「到达某个状态」的目标</span>；<b>「if it <b>only</b> resets to the goal state, then the discriminator will learn that <b>if you're only in the goal state, then that's probably coming from the policy and not from the expert demos</b>」。</b>", "<b>⇒ 判别器会识破「只去一个点」，因为专家的分布是<b>铺开</b>的。老师还点明了形式化的说法：<b>这可以写成后向策略状态分布与专家状态分布之间的<b>散度</b></b>。</b> <span class='k'>⇒ 这一条很漂亮：<b>分布匹配天然地阻止了坍缩</b>，而这正是挑战 2。</b>", "<b>p23 把两个挑战都勾掉了：<b>后向策略避免了状态分布坍缩（挑战 2），同时也让智能体不会漂走（挑战 1）</b>。</b>", "⚠️ <b>而那条 <b>Pro</b> 是这一页最值得带走的，因为它是一个<b>独立于自主性</b>的好处</b>：<b><em>Forward policy tries the task from wide set of initial states, both easy and hard, improving the sample efficiency</em></b>，引的是 <b>Kakade &amp; Langford, ICML 2002</b>。", "<b>⇒ 讲稿把这一点说得更明确：<b>「there's actually work that shows that if you were to do this… then you'd actually learn a bit more efficiently than always starting from the initial state distribution, <b>even in episodic learning settings</b>」</b>。</b> <span class='w'>⇒ 注意 <b>even in episodic settings</b>——<b>就算你有复位能力，从多样的起点练也比总从同一个起点练更高效</b>。</b></span>", "<b>⇒ 所以 MEDAL 不只是「自主学习的一个技巧」，它顺带兑现了一条更一般的原则：<b>训练起点要铺开，有难有易</b>。</b> <span class='k'>既有靠近目标的简单起点（容易拿到成功信号），也有远离目标的困难起点（练完整能力）。</b>"], "eq": "三条替代路线（按「改什么」分）：\n   ① 改**后向奖励**（这一页 MEDAL）\n   ② 改成**多任务循环**（p28–32）\n   ③ 改**任务本身**，设计成可反复做的（p33，老师戏称 “forward-forward RL”）\n\nMEDAL 的动机（值得想一遍）：**为什么非要回到起点？**\n   「we also need to know how to take good actions, **all along the expert\n     state distribution** as well… instead of going back all the way to the\n     beginning every single time, we could **reset to different states\n     along the expert state distribution**」\n\n   ⇒ 关键认识：**你要学的不是「从起点出发怎么走」，\n     而是「在这条路上的任何一点该怎么走」**\n     只从起点练，中段的覆盖要靠前向策略自己走过去 —— 而它一开始走不过去\n\n与 FBRL 只差两处（其余五步一字未改）：\n   **第 0 步**：给一小批**演示**\n   **第 6 步**：更新**学出来的** r_b\n\nr_b 怎么学：**判别器**（L08 奖励学习那一讲的手法）\n   「trained to **distinguish states visited by the policy and states visited\n     in the demonstrations**」\n   「when training the backward policy, you'll be trying to **trick this reward\n     function** into thinking it's visiting states from the expert」\n   ⇒ 标准的对抗式设置\n\n⚠ 尖锐的学生提问：**目标状态也在演示里，后向策略为什么不赖在目标状态？**\n   答：r_b 本质是**状态分布匹配**目标，不是「到达某状态」的目标\n   「if it **only** resets to the goal state, then the discriminator will learn\n     that **if you're only in the goal state, that's probably coming from the\n     policy and not from the expert demos**」\n   ⇒ 判别器会识破「只去一个点」，因为专家的分布是**铺开**的\n     形式化：**后向策略状态分布与专家状态分布之间的散度**\n   ⇒ **分布匹配天然地阻止了坍缩** —— 正是挑战 2\n\np23：两个挑战都勾掉\n   后向策略**避免状态分布坍缩**（挑战 2）· **让智能体不漂走**（挑战 1）\n\n⚠⚠ 那条 **Pro** 是最值得带走的（一个**独立于自主性**的好处）：\n   **Forward policy tries the task from wide set of initial states,\n     both easy and hard, improving the sample efficiency**\n   〔Kakade & Langford. Approximately Optimal Approximate RL. ICML 2002〕\n\n   讲稿更明确：「there's work that shows that if you were to do this…\n     you'd actually learn a bit more efficiently than always starting from\n     the initial state distribution, **even in episodic learning settings**」\n   ⇒ **就算你有复位能力，从多样的起点练也比总从同一个起点练更高效**\n\n⇒ MEDAL 不只是自主学习的技巧，它兑现了一条更一般的原则：\n   **训练起点要铺开，有难有易**\n   既有靠近目标的简单起点（容易拿到成功信号）\n   也有远离目标的困难起点（练完整能力）", "tbl": {"head": ["", "FBRL", "MEDAL"], "rows": [["后向策略退到哪", "<b>初始状态 s₀</b>", "<b>专家走过的那一片</b>"], ["r<sub>b</sub> 怎么来", "<b>手写（到达 s₀）</b>", "<b>判别器学出来</b>"], ["额外需要什么", "<span class='w'>无</span>", "<b>一小批演示</b>"], ["解挑战 1（漂移）", "<b>解</b>", "<b>解</b>"], ["解挑战 2（坍缩）", "<span class='w'>部分</span>", "<b>解（分布匹配天然防坍缩）</b>"], ["⚠ 额外好处", "—", "<b>起点铺开 ⇒ 样本效率更高</b>"]]}, "say": "原话（为什么不回到起点而回到专家分布，以及那个「就算在分幕设定下也更高效」）：<em>“in forward-backward RL, we're trying the task, going back, trying the task, going back. And ultimately, we want to be able to complete the task from the initial state distribution, but <b>we also need to know how to take good actions, all along the expert state distribution as well</b>. And so one of the things that we could do is <b>instead of going back all the way to the beginning, every single time, we could actually reset to different states along the expert state distribution</b>. And there's actually work that shows that if you were to do this and had a way to do this, then <b>you'd actually learn a bit more efficiently than always starting from the initial state distribution, even in episodic learning settings</b>.”</em><br><br>原话（为什么后向策略不会赖在目标状态——判别器会识破）：<em>“The question is, what prevents it from actually staying in the goal state? Because the goal state is part of the demonstrations… basically, the specifics of this reward function is actually a <b>state distribution matching objective</b>, where its goal is to match the states that it visits with the states in the demos. And <b>if it only resets to the goal state, then the classifier or the discriminator of this reward function will learn that if you're only in the goal state, then that's probably coming from the policy and not from the expert demos</b>. And it will be able to distinguish that. And the way that you can formalize that is you can actually think about it as a <b>divergence between the distribution of states visited by the backward policy and the distribution of states visited by the experts</b>.”</em>", "res": {"tag": "推断", "v": "<b>那条 <b>Pro</b> 对你是可以直接执行的，而且它有一篇 2002 年的论文可引：<b>训练/评估的起点要铺开，有难有易</b>。</b><br><span class='k'>讲义的版本是「从多样的初始状态练，比总从同一个起点练更高效，<b>就算你有复位能力也是如此</b>」（Kakade &amp; Langford, ICML 2002）</span>。<b>⇒ 翻译到你这里：<b>评估配置时用的那批 query，它的「难度分布」本身是一个设计变量，而你多半还没把它当成变量</b>。</b><br><b>⇒ 具体会怎样：如果你的评估集全是<b>难题</b>，那么大多数配置的 Acc 都接近 0，<code>G</
