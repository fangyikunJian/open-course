var TH = {"title": "L15 接上课题的哪一段：你的 agentic 工作流就是一个分层系统，而这一讲把它的三个设计选择逐个点了名", "arc": "<b>这一讲表面上在讲机器人，但它讲的结构和你的课题<b>是同一个</b>，而且讲义自己就把这件事说破了。</b><br><br><span class='k'>p5 列长时程任务时，四个例子里有两个是 LLM 的：<b>「修一个让神经网络训练损失爆炸的 bug」</b>和「给一份八页的报告写反馈」</span>；<b>p24 讲到「分层正热」时，老师把<b>思维链</b>明确归进了同一类现象</b>。<span class='w'>⇒ 所以「高层出中间目标、低层出动作」这个结构，在机器人和 LLM 智能体上是一回事——你的 AFlow 工作流就是它的一个实例：<b>工作流图是高层，每个节点的执行是低层，而你做的事是给低层挑能力档位</b>。</span><br><br><b>⇒ 于是这一讲的三个设计选择，逐条都落在你的问题上：</b><br><b>① <b>目标怎么表示</b>（p14）</b>——<span class='k'>三条性质里 <b>(b) 结构化：相似的行为应当有相似的 <code>g</code></b> 正是你那个线性假设的通俗版。讲义的反例是把子任务<b>编号</b>成「子任务 1 / 子任务 2」，因为编号把相似性全扔了；而你用的是<b>指示向量</b> <code>x ∈ {0,1}^{H×k}</code>，只改一个节点的两个配置只差一个坐标</span>。<b>⇒ 这给了你一句比「我们假设 G 线性」好得多的话：<b>我们的配置表示是结构化的，于是一个配置上的测量能迁移到相邻配置上——这正是样本复杂度从 <code>|𝒳|</code> 降到 <code>d</code> 的原因。</b></b><br><b>② <b>每层怎么监督</b>（p17–18）</b>——<b>这是整讲对你最重的一条，下面单说。</b><br><b>③ <b>何时换子目标</b>（p21）</b>——<span class='w'>对应你的反思/重试环什么时候退出。讲义的判决很硬：<b>必须有一个无条件的次数上限</b>，因为「判完成」出错会让系统<b>永久卡死</b>，而固定步数最多白走 <code>n</code> 步</span>。<b>⚠ 如果你的实现里没有那个上限，这是今天就该补的——它正是「一条 query 把预算烧光而 Acc 为 0」这种重尾样本的来源。</b><br><br><b>而第 ② 条值得单独展开，因为它指出了你方法里一个<b>结构性</b>的循环。</b><br><span class='k'>p17 的两行是：<b>低层该在「高层会下达的目标分布」上训，但高层还没训出来；高层该配着「学好的低层」训，但低层还没训出来</b></span>。<b>⇒ 逐字对应到你这里：<b>「档位该怎么配？取决于工作流长什么样……但最优工作流还没定。」／「工作流该怎么搜？取决于各节点有多强……但档位还没定。」</b></b><span class='w'>AFlow 搜索时假定了某个统一档位，而你一旦改掉档位，那个工作流就不一定还最优。</span><br><b>⇒ 讲义给的解法可以原样搬（p18）：<b>可以先分开做，但至少有一边要适配另一边的「毛病」</b>。</b><span class='k'><code>deficiencies</code> 这个词是故意选的——要适配的不是对方的平均行为，而是<b>对方做不好的那些地方</b>。</span><br><br><b>而「适配」最轻的实现，讲义用了整整五页去演示（p29–33）：<b>冻住低层，只用语言去改高层</b>。</b> <span class='w'>人看着机器人干活，快出错时喊一句话盖掉高层的指令；而纠正的方式<b>不是</b>把同一句指令说得更响，<b>而是换成一串低层做得到的更小指令</b></span>。<b>⇒ 你的版本几乎是免费的：<b>把下游档位信息写进规划节点的 prompt</b>（「下游执行者是一个较小的模型，请把步骤拆得更细、更明确」）。</b><br><b>⇒ 而这件事对你主线有一个不小的含义：<b>节点间的交互不是不可控的，可以靠「让上游知道下游的配置」主动削弱</b>——而交互一旦被削弱，<b>你的可加性假设就更站得住</b>。</b><span class='k'>这不只是性能优化，它是在为你的建模假设创造条件。</span><br><br><b>最后，整讲真正该背下来的是 p16 那一句，它超出了分层这个话题：<b>Think carefully about where the benefits are coming from!</b>（旁边还加了一句「在任何研究里这都值得做」）。</b><br><span class='w'>讲义用它判了一个很干脆的案子：<b>端到端训练一个带「隐式目标」的两层网络 = 一个扁平策略</b>——画两个方框不等于做出了分层，因为中间那层激活值不受任何独立约束</span>。<b>⇒ 对你就是：<b>你报告 <code>G</code> 提升了 X%，这个提升来自哪一条机制？</b>而你的方法里有三个各自都能解释提升的东西，必须分开测（见下面第一条军火）。</b>", "pitfalls": [{"v": "<b>逐节点扫描时让上游一直停在基线档位。</b> ⚠ <span class='k'>这正是 p17 那个意面失配的形态：你测到的是「<b>在上游全是基线档位的输入分布下</b>，节点 <code>j</code> 换档位的效果」；而最终系统里上游<b>也</b>会降档，节点 <code>j</code> 面对的输入会更脏</span>。<b>⇒ 后果是<b>单向</b>的：一步偏离测量会系统性地<b>高估</b>降档的安全性</b>，因为每个节点都在「别人都很好」的前提下被评估，而最终它们要同时降档。<span class='w'>⇒ 这也正是可加性失败的<b>主要机制</b>——不是抽象的交互项，就是这个「上游变脏」效应。</span><b>两条补救：可加性检验要专门测<b>多节点同时降档</b>（不只是两两组合）；报告残差时按<b>偏离基线的节点数</b>分层看。</b>", "tag": "推断", "ref": "本讲 p17（逐字核对）· 讲稿（意面失配、重叠与余量）· L07 主线卡 · 简报 §4c §4d"}, {"v": "<b>反思/重试环没有无条件的次数上限。</b> <span class='k'>p21 的判决是按<b>出错的后果</b>而不是出错的概率下的：「判完成」出错 ⇒ <b>永久卡死</b>（吸收态，确定性策略不会自己跳出来）；「固定步数」出错 ⇒ 白走 <code>n</code> 步，下次重问还能纠正</span>。<b>⚠ 而 LLM 自评恰好是最容易出错的那一类判完成</b>——<span class='w'>它要么对自己过于满意，要么反复不满意，两头都会坏事</span>。<b>⇒ 讲稿给的折中最务实：<b>以自评为主 + 硬性次数上限兜底</b>。没有上限的实现，会制造「Cost 烧到预算上限而 Acc 为 0」的重尾样本，直接污染你的 <code>G</code> 方差估计。</b>", "tag": "已核", "ref": "本讲 p21（逐字核对）· 讲稿（折中方案）· p5 · L01.a p18（Bernstein 的有界前提）"}, {"v": "<b>把「某节点升档后整体 G 提升」直接解释成「该节点变好了」。</b> ⚠ <span class='k'>p29–33 给了反例：那里<b>低层被冻住、能力一个字节没动</b>，整体性能却提升了——提升全部来自高层学会绕开它的弱点</span>。<b>⇒ 你这边的同构歧义是：升档可能让该节点<b>自己</b>答得更准，<b>也可能</b>只是让它的输出更规整、于是<b>下游</b>更容易处理</b>。<span class='w'>两者对「该不该在这个节点花钱」的含义完全不同——后者意味着你也许该改下游的解析，而不是给上游升档</span>。<b>⇒ 要区分，必须有一个<b>节点级</b>的中间质量指标，而不是只看端到端的 <code>G</code>。这是该现在就加进日志的字段。</b>", "tag": "推断", "ref": "本讲 p29–p33（逐字核对）· 讲稿（低层冻住、高层 self-correct）· 简报 §4b"}, {"v": "<b>只报一个 <code>λ</code> 下的 <code>G</code>，而且只跟「全大」「全小」两个基线比。</b> <span class='k'>p34 那个 34% 教的是怎么读（和怎么报）一个提升：<b>指标是什么、跟谁比、算力对齐了没有</b></span>。<b>⚠ 你这里三个都容易出问题</b>：<span class='w'>① <code>G</code> 依赖 <code>λ</code>，同一组结果在不同 <code>λ</code> 下排名可以完全不同 ⇒ <b>必须画整条 λ 扫描曲线</b>（而且它是免费的）；② 「全大/全小」两个基线<b>太弱</b>，至少还要有<b>随机分配同样数量的大模型节点</b>（控住「用了几次大模型」这个变量）——<b>赢不过它就说明位置不重要、只有数量重要</b>；③ 你的方法要花调用去<b>搜索</b>，而基线不用 ⇒ 必须说清这部分算不算进 Cost</span>。", "tag": "推断", "ref": "本讲 p34（逐字核对）· 讲稿（34% 与出处限定）· L16 p13 · 简报 §2 §4d"}, {"v": "<b>把「大家都这么做」当成证据。</b> <span class='k'>p23 列了四个系统（π0.5 · Gr00t N1 · Helix · Gemini Robotics）全用分层，但 p11 刚刚说过<b>分层 vs 思维链还没有定论</b>，p16 又刚警告过「想清楚好处从哪来」</span>。<b>⚠ 四个系统都用分层，也可能只是因为<b>工程上更好组织</b>（两层可以分别迭代、分别替换、部署在不同硬件上）</b>。<span class='w'>⇒ 同理，你引用「agentic 工作流很流行」时，不能把流行度当成「显式分解优于单体 CoT」的证据</span>——<b>那恰好是讲义点名的公开问题，而你有做这个比较的条件。</b>", "tag": "已核", "ref": "本讲 p23–p24 · p11 · p16（均逐字核对）"}, {"v": "<b>只记端到端的对错，把一次运行里的节点级信息扔掉。</b> <span class='k'>p43 的<b>事后重标注</b>说的正是反面：一次「失败」换个角度就是一次「成功」——只要把目标改写成它实际达成的那个</span>。<b>⇒ 你的版本：一条答错的 query 里，中间某些节点的输出可能<b>完全正确</b>，只是某一个节点拖垮了全局。只记端到端的 <code>G</code>，这些信息全扔了</b>；<span class='w'>而给每个节点单独打一个「这一步做对了没有」的标签，信息量从「每条 query 一个比特」变成「<code>H</code> 个比特」，<b>调用成本一分没多花</b></span>。<b>⚠ 代价是要造一个判别器（强模型当裁判 / 可执行性检查 / 下游表现当代理），每种都有噪声，必须报告判别器自身的准确率；而且节点级标签可能与端到端结果<b>不一致</b>（每步都对合起来却错），所以它应当<b>补充</b>而非<b>替代</b> <code>G</code>。</b>", "tag": "推断", "ref": "本讲 p43（逐字核对）· L07 p6 与主线卡（只用本轮观测）· 简报 §4b §4e"}], "ammo": [{"q": "你那套逐节点档位分配，提升到底来自哪里？", "a": "<b>这个问题讲义点名要求回答，而且给了判据：<b>Think carefully about where the benefits are coming from</b>（p16）。</b> <span class='k'>它用一个很干脆的例子立了标准：端到端训练一个带「隐式目标」的两层网络，<b>画着两个方框，实质上却是一个扁平策略</b>——因为中间那层不受任何独立约束</span>。<br><b>我们的方法里有<b>三个</b>各自都能解释提升的东西，所以我们把它们分开测</b>：<span class='w'>① <b>逐节点分配</b>本身（不同节点不同档位，vs 全局一个档位）；② <b>逐 query 自适应</b>（同一节点在不同 query 上不同档位）；③ <b>搜索算法</b>（G-最优设计 + 逐次淘汰，vs 均匀采样）</span>。<b>⇒ 三行消融：固定全局档位（关①②）· 逐节点但不逐 query（关②）· 逐节点逐 query 但均匀采样选（关③）。</b><br><b>⚠ 而且我们报一个最容易被忽略、但能证伪整套方法的数：<b>搜出来的最优配置有多「不均匀」</b></b>（<span class='k'>比如 <code>H=10</code> 里有几个用了大模型，或直接报配置的熵</span>）。<b>如果最优配置几乎总是全大或全小，那我们做的其实是<b>全局模型选择</b>，这套机器就是牛刀杀鸡；反过来如果它确实不均匀，那就直接证明了「不同节点对模型能力的需求确实不同」这个核心前提。</b>", "tag": "已核", "ref": "本讲 p16（逐字核对）· 讲稿（那段研究方法论）· p9 · 简报 §1 §4c"}, {"q": "工作流是 AFlow 在某个固定模型下搜出来的。你换了档位之后，那个工作流还最优吗？", "a": "<b>这是一个真问题，而且它有名字——<b>分层系统里的先有鸡先有蛋</b>（本讲 p17）。</b> <span class='k'>讲义的两行是：低层该在「高层会下达的目标分布」上训，但高层还没训出来；高层该配着「学好的低层」训，但低层还没训出来</span>。<b>我们这里是：<b>档位该怎么配取决于工作流，而最优工作流取决于各节点有多强</b>。</b><br><b>讲义给的解法我们照搬（p18）：<b>可以先分开做，但至少有一边要适配另一边的「毛病」</b>。</b> <span class='w'>我们固定 AFlow 搜出的工作流，然后分配档位；为弥补解耦带来的失配，我们<b>让规划节点感知下游档位</b>（单向适配——这正是讲义 p29–33 那套「冻住低层、只改高层」的轻量版）</span>。<br><b>⇒ 而且我们<b>量化</b>了这个解耦的代价：拿配好档位的系统<b>重跑一次 AFlow</b>，报告搜出的工作流变化幅度。</b> <span class='k'>变化不大 ⇒ 解耦是合理的；变化很大 ⇒ 那本身就是一个值得报告的发现</span>。<b>⚠ 把限制、补救和证据三者一起给出，比只说「我们假设工作流固定」强得多。</b>", "tag": "推断", "ref": "本讲 p17 p18（逐字核对）· p29–p33 · 简报 §2 §4c"}, {"q": "你凭什么认为一个节点上的测量能告诉你别的配置好不好？", "a": "<b>凭<b>表示的结构化</b>，而这是分层系统里一条标准的设计要求（本讲 p14）。</b> <span class='k'>讲义列了好的目标表示的三条性质，其中 (b) 是「<b>相似的行为应当有相似的 <code>g</code></b>」，并给了反例：如果你把子任务<b>编号</b>成「子任务 1 / 子任务 2」，低层就「很难搞清楚它们之间是什么关系」，只能把每个当成完全无关的新任务从头学</span>；<b>正例是 GPS 坐标——两个很近的坐标对应相似的动作。</b><br><b>⇒ 我们的配置表示属于正例那一类</b>：<span class='w'>配置写成指示向量 <code>x ∈ {0,1}^{H×k}</code>，<b>只改一个节点的两个配置只差一个坐标</b></span>。<b>⇒ 于是「在一个配置上的测量迁移到相邻配置」是有依据的，而这正是样本复杂度从 <code>|𝒳| = 2^H</code> 降到 <code>d = H×k</code> 的原因。</b><br><b>⚠ 而这条前提是<b>可检验</b>的，我们检验了它</b>：<span class='k'>用单节点偏离的数据预测双节点（及多节点）偏离的真值，报告残差<b>分布</b>而不只是均值，并按偏离节点数分层看残差是否单调增大</span>。", "tag": "已核", "ref": "本讲 p14（逐字核对）· 讲稿（编号 vs GPS 坐标）· p9 · L01.a p10 科研格 · 简报 §4c §4d"}, {"q": "既然你能逐节点配档位，为什么不干脆端到端优化整个系统？", "a": "<b>因为端到端在这里<b>不可行</b>，而且讲义给了一个很接近的教训（p16）。</b> <span class='w'>讲义说的是：端到端训一个带隐式目标的两层网络，结果<b>就是一个扁平策略</b>，分层的好处一条都拿不到</span>。<b>⇒ 我们这边更极端：<b>档位是离散的，而且 LLM 调用不可微</b>——根本没有端到端梯度可用。</b><br><b>所以真正的问题不是「要不要端到端」，而是<b>在这个离散、不可微、每次评估都要花钱的空间里怎么搜</b>。</b> <span class='k'>我们的答案是：利用配置空间的<b>乘积结构</b>（每节点独立选档）与<b>成本可加性</b>，把它建成一个线性 bandit，再用实验设计定分配、逐次淘汰砍候选</span>。<br><b>⇒ 而这条路在讲义里也有依据：p9 第 ③ 条<b>结构化探索</b>说的正是「不要在原始动作空间里探索，要在一个更高层、更有结构的空间里探索」。</b> <span class='w'>我们不去调 prompt 字句、不去搜输出空间，我们在 <code>H×k</code> 维的节点配置空间里搜——<b>这就是 structured exploration</b>。</b>", "tag": "推断", "ref": "本讲 p16 · p9（均逐字核对）· L07 p5 · 简报 §1 §4c"}, {"q": "你怎么知道是哪个节点拖垮了这条 query？", "a": "<b>这是信用分配问题，而我们借的是分层 RL 里的<b>事后重标注</b>（本讲 p43）。</b> <span class='k'>讲义里的问题是：高层下达目标 <code>g</code>、低层没做到而到了 <code>g'</code>，这条数据就没法用；解法是把它<b>改写</b>成「高层本来就想去 <code>g'</code>」，于是它变成一条成功的数据，而且描述的是低层<b>真实</b>的能力</span>。<br><b>⇒ 我们的版本：一条端到端答错的 query，里面中间若干节点的输出<b>可能完全正确</b>。</b> <span class='w'>只记端到端的 <code>G</code>，这些信息全扔了；而给每个节点单独打一个「这一步做对了没有」的标签，<b>一次运行就能为 <code>H</code> 个节点各贡献一条证据</b>——信息量从每条 query 一个比特变成 <code>H</code> 个比特，<b>而调用成本一分没多花</b></span>。<b>⇒ 这和我们的线性模型天然契合：<code>θ</code> 本来就是逐（节点,档位）的参数，节点级标签<b>直接</b>给它们提供证据，不必经端到端加总再反推。</b><br><b>⚠ 两条限制我们明说</b>：<span class='k'>① 节点级标签需要一个判别器（强模型当裁判 / 可执行性检查），它自身有噪声，我们报告它的准确率；② 节点级标签可能与端到端结果不一致（每步都对合起来却错，或中间错了后面纠回来），所以它<b>补充</b>而不<b>替代</b> <code>G</code>，而且我们报告两种信号吻合的程度</span>。", "tag": "推断", "ref": "本讲 p43（逐字核对）· 讲稿（重标注与 off-policy）· L07 p6 与主线卡 · 简报 §4b §4e"}], "papers": [{"t": "Shi, Hu, Zhao, Sharma, Pertsch, Leo, Levine, Finn — <b>Yell At Your Robot: Improving On-the-Fly from Language Corrections</b>", "id": "RSS 2024（本讲 p29–p33 的出处）", "why": "<b>「让高层去适配低层的毛病」最轻、最可抄的实现。</b> <span class='k'>做法三步：冻住低层 → 人在运行时用一句话覆盖高层的输出 → 拿这些覆盖当 DAgger 标注更新高层</span>。<b>⇒ 对你最有用的是那个<b>纠正的形态</b>：人不是把同一句指令说得更响，而是<b>换成一串低层做得到的更小指令</b></b>。<span class='w'>映射过来就是「把下游档位信息写进规划节点的 prompt」，而那几乎是免费的。</span><b>⚠ 另外注意它的关键便利：高层输出空间是语言，所以 DAgger 在<b>语言空间</b>而不是动作空间——这正是你的工作流天然具备的条件。</b>"}, {"t": "Nachum, Gu, Lee, Levine — <b>Data-Efficient Hierarchical Reinforcement Learning</b>", "id": "NeurIPS 2018（本讲 p43 的出处，HIRO）", "why": "<b><b>事后重标注用在高层动作上</b>的标准出处，也是你做节点级信用分配时该引的那一篇。</b> <span class='k'>核心是：高层的「动作」就是它下达的目标，而这个动作的效果取决于一个<b>正在变化</b>的低层；重标注把「我想去 <code>g</code> 却到了 <code>g'</code>」改写成「我本来就想去 <code>g'</code>」，于是数据描述的是低层<b>真实</b>的能力</span>。<b>⚠ 它还说明了为什么必须配 off-policy 算法（重标注后的数据不是当前策略产生的）——这一条对你同样成立，而且与 L07 主线卡那条「只用本轮观测会扔掉可用数据」是同一个张力。</b>"}, {"t": "Black*, Nakamoto*, Atreya, Walke, Finn, Kumar, Levine — <b>SuSIE: Subgoal Synthesis via Image Editing</b>", "id": "ICLR 2024（本讲 p38–p40 的出处）", "why": "<b>它示范了一个结构性的道理：<b>中间表示的选择，主要决定的不是算法好不好，而是你能用什么数据、能怎么干预</b>。</b> <span class='w'>换成图像子目标之后算法几乎没变，变的是「不再需要人工切段打标签」和「高层能吃无标注的人类视频」</span>。<b>⇒ 你的对应是「节点之间传自然语言还是结构化对象」：语言可解释、可用一句 prompt 干预；结构化对象解析零成本、错误能被 schema 直接检出，但上游必须能稳定产出合法结构——<b>而这恰恰是小模型做不好的事</b>。</b><span class='k'>⇒ 所以「某个节点能不能降档」可能取决于它的输出格式，这个变量你现在多半没控住。</span>"}, {"t": "Eysenbach, Gupta, Ibarz, Levine — <b>Diversity is all you need: Learning diverse skills without a reward function</b>", "id": "ICLR 2019（本讲 p44 的出处）", "why": "<b>问的是「能不能<b>不靠监督</b>就发现一组多样的技能」，而这对你是一个更野的延伸方向：<b>能不能不靠 AFlow、而是自己发现工作流的节点分解</b>。</b> <span class='w'>⚠ 但要带着老师的克制一起记：他对这条线的评价是「still an <b>active research area</b>」且「<b>pretty challenging to scale up</b>, especially in very large state spaces」</span>。<b>⇒ 当成一个可能的未来工作提一句是合适的，当成主线则风险很高。</b>"}, {"t": "本课 L02 — <b>模仿学习：行为克隆与 DAgger</b>", "id": "这一讲的三处都接回它", "why": "<b>三处接口</b>：<span class='k'>① p5 的「出错机会多」就是 L02 的<b>复合误差</b>（学得差 ⇒ 更早偏离 ⇒ 偏离之后错得更多）；② p29–33 的高层 DAgger 直接用的是 L02 的 DAgger；③ p41 说要用 RL 突破的那个天花板，正是 L02 讲稿里那句「<b>上界永远是专家</b>」（幻灯上完全没有）</span>。<b>⇒ 第 ③ 条对你有直接含义：<b>任何靠「模仿一个更强模型」来提升小模型的做法，上界都是那个更强模型</b>——而你的目标是用更少的钱接近它，不是超过它。把这一点在论文里讲清楚，能避免一类不必要的质疑。</b>"}]};

    var n=N[i], multi=n.r[0]!==n.r[1], h="";

    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      // ⚠ 不能换掉 iframe 元素：error/load 两个监听器是初始化时挂上去的，
      //   换元素会把它们孤儿化，「打不开？」面板就再也不会弹，
      //   读者只剩一个空白框、毫无线索（2026-10-23 我就是这么写错的）。
      //   先 about:blank、下一个 tick 再设真地址 —— 同样是新导航，元素不动。
      frame.src="about:blank";
      setTimeout(function(){ frame.src=SRC+HASH; }, 0);
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
