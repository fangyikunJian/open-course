<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS224R 第五讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "本讲标题里的 off-policy，指的是什么？", "o": ["只能用别人采的数据、不能自己采", "一类全新的算法，与 actor-critic 无关", "同一批数据能被用来走几步梯度的「程度」", "不需要值函数的方法"], "a": 2, "why": "本讲把 on-policy 与 off-policy 当作一个连续的旋钮：完全在策略 = 一批数据走一步（L04），PPO = 走几百步，SAC = 所有历史数据反复用。"}],
3: [{"q": "离策略的策略梯度公式，相比在策略版本多了什么？", "o": ["多了一个因子 π_θ′(a|s)/π_θ(a|s)", "把回报换成了优势", "多了一个基线项", "把 log 换成了平方"], "a": 0, "why": "课件 p3 的两个式子并排放着，差别只有那一个比值因子，其余结构完全一样。"}, {"q": "第一次梯度步时，重要性权重的值是多少？", "o": ["1", "0", "取决于 ε", "等于优势的大小"], "a": 0, "why": "第一步时 θ′ 还等于 θ，比值恒为 1，此时离策略公式与在策略公式完全一致。麻烦是从第二步以后才开始长出来的。"}],
4: [{"q": "优势函数 A^π(s,a) 的含义是？", "o": ["在 s 下选 a，比照策略办好多少", "策略的熵", "值函数的梯度", "从 s 出发的未来回报总和"], "a": 0, "why": "A = Q − V，读作「选 a 相对于『照策略办』的增量」。它的符号直接决定该加大还是压低这个动作的概率。"}],
7: [{"q": "在这套五步算法里，优势 Â 是什么时候算的？", "o": ["由环境直接给出", "在第 5 步之后算", "每走一步梯度都重算一次", "采样后算一次，之后走多少步梯度都不再更新"], "a": 3, "why": "第 2、3 步只在采样后各做一次，V̂ 与 Â 都是对着旧策略算的。这正是「优势是旧的」这个麻烦的来源。"}],
9: [{"q": "代理目标 J̃(θ′) = Σ (π_θ′/π_θ)·Â 里，被优化的变量是哪个？", "o": ["优势 Â", "基线 b", "折扣因子 γ", "那个比值 π_θ′/π_θ"], "a": 3, "why": "Â 是旧策略算完就冻住的常数，唯一能动的是比值。所以「最大化这个目标」在实质上就是「把正优势动作的比值推得越大越好」，而它没有上限。"}, {"q": "为什么走太多步梯度会过拟合？", "o": ["重要性权重会变成负数", "Â 只来自一批数据、本身是估计值，把比值推到极端等于全力拟合这批数据的估计误差", "梯度会数值溢出", "学习率会自动变大"], "a": 1, "why": "症状是奖励先涨得很快、然后不稳、最后可能崩掉。老师举的画面是：策略学会了「往右走是好的」但没学会「到这里要停」，于是一直走到撞进角落。"}],
10: [{"q": "课件说 Idea 2（卡住比值）「doesn't directly constrain policy, but removes incentives」。这句话的意思是？", "o": ["它不禁止策略偏离，只是让继续偏离不再有收益", "它要求两个策略完全相同", "它比 KL 约束更严格", "它把策略参数直接投影回可行域"], "a": 0, "why": "一个是加围栏（KL 约束），一个是撤奖励（截断）。PPO 选后者，因为不用算 KL、也不用解带约束的优化。"}],
11: [{"q": "只做 trick #1（截断）而不做 trick #2（取 min），会漏掉什么情况？", "o": ["比值恰好等于 1 时会除以 0", "折扣因子接近 1 时会发散", "优势为负且比值很大时，截断反而把目标抬高，等于替很糟的动作开脱", "优势为正且比值很小时，梯度会消失"], "a": 2, "why": "讲稿的数字：Â = −1000、比值 9，不截断是 −9000，截到 1.2 是 −1200 —— 后者更大，看起来更好。取 min 让截断在此失效，保留原来的重惩罚。"}, {"q": "取 min 之后，PPO 的代理目标与原代理目标是什么关系？", "o": ["是原目标的一个上界", "两者无关", "是原目标的一个下界", "相等"], "a": 2, "why": "老师的原话是「这个 min 保证了截断永远不会让目标变得更好，它确保这是原代理目标的一个下界」，于是训练在做的事是「最大化一个下界」。"}, {"q": "关于截断，下面哪种说法是对的？", "o": ["它只在优势为正时起作用", "它等价于把学习率调小", "比值走出区间后，那一项的梯度变成 0", "它保证策略一定不会变差"], "a": 2, "why": "截断改的是目标函数的形状而不是步长。出界之后梯度不是变小而是没了 —— 「继续往这个方向推不再有任何回报」。"}],
12: [{"q": "GAE 与 p7 用的一步 TD 优势，差别在哪？", "o": ["GAE 把截断范围从 0.2 改成了 0.1", "GAE 用的是 Q 而不是 V", "GAE 不需要值函数 V̂", "GAE 把 n=1..N 的多个 n 步估计加权平均起来"], "a": 3, "why": "课件原文是 use varying horizon to estimate advantage, for n = 1,…,N where N ≪ T。V̂ 照旧要拟合，GAE 换的只是「怎么用 V̂ 算优势」。"}, {"q": "课件在 N 旁边写 cut earlier for less variance，意思是？", "o": ["训练轮数要提前结束", "轨迹要提前截断以省算力", "把 n 的上限截得早一些，方差更小", "n 取得越大，偏差越小"], "a": 2, "why": "n 越大越依赖真实采样回报，方差越大。N ≪ T 就是为了不让方差失控。"}],
13: [{"q": "按 p13 的超参数，同一批数据大约被走了多少步梯度？", "o": ["约 2000 步", "10 步", "约 300 步", "1 步"], "a": 2, "why": "约 10 个 epoch、batch size 64，合起来约 300 次梯度步。对照 p7 那版的 1 步 —— 这 300 倍正是截断买到的东西。"}, {"q": "ε = 0.2 意味着重要性权重被限制在哪个区间？", "o": ["[0, 0.2]", "[0.2, 1.8]", "[0.8, 1.2]", "[−0.2, 0.2]"], "a": 2, "why": "截断区间是 [1−ε, 1+ε]。比值在这个区间内目标正常，出了区间那一项的梯度就变成 0。"}],
14: [{"q": "课件列出的两个关键想法里，哪一个才是真正的难点？", "o": ["把学习率调小", "把 batch size 调大", "留一个装全部历史数据的缓冲", "改公式，把隐含的「数据来自当前策略」的假设拿掉"], "a": 3, "why": "维护一个缓冲只是加一个列表；难的是找出算法里哪些地方偷偷假设了数据来自当前策略 —— p16 到 p20 五页做的全是这件事。"}],
15: [{"q": "装上回放缓冲后，算法坏在哪？", "o": ["奖励 r 会失真", "用混合了多个旧策略的数据拟合出的 V̂，不是任何一个具体策略的值函数", "缓冲会占满内存", "转移 s′ 不再服从真实动力学"], "a": 1, "why": "V^π 的定义里有上标 π。自举目标里的 V̂(s′) 应当对应当前策略之后的回报，但缓冲里那条数据的后续动作是旧策略选的。"}, {"q": "为什么 V 挡不住这个问题而 Q 挡得住？", "o": ["Q 与策略无关", "Q 把动作作为输入，「这一步做什么」可以指定；V 只吃状态，改不了", "Q 不需要自举", "Q 的方差更小"], "a": 1, "why": "V 只有状态一个入口，「之后按谁走」隐含在数据里、使用时没法纠正。Q 多了动作这个入口，于是当时选了什么动作就不再是问题。"}],
17: [{"q": "在 p18 的做法里，下一个动作 ā′ 是从哪来的？", "o": ["从回放缓冲里读出来", "从均匀分布随机采", "现场从当前策略 π_θ(·|s′) 采一个", "取使 Q 最大的那个动作"], "a": 2, "why": "这是整个修补的关键：(s,a,r,s′) 用旧数据（与策略无关），而「之后怎么走」必须用当前策略，所以 ā′ 现采。"}, {"q": "课件末尾的 sufficient action coverage 是在提醒什么？", "o": ["动作空间必须是离散的", "缓冲要足够大", "每个状态都要被访问无穷多次", "旧策略若从未试过某个动作，Q 在那里就是纯外推，目标会不准"], "a": 3, "why": "括号里那句「okay if a is a bit different」的 a bit 是有分量的 —— 不是任意不同都行。这正是离线 RL 的核心难题，L07 专讲。"}],
19: [{"q": "回放缓冲版里，策略更新为什么改用 Q̂ 而不是 Â？", "o": ["Q̂ 不需要神经网络", "Â 在离策略下没有定义", "放弃基线会让方差变大，但数据量大得多，扛得住", "Q̂ 的方差更小"], "a": 2, "why": "课件自己标了 higher variance，理由是 okay b/c we're now using a lot more data。这与 p4/p5「减基线降方差」构成一个明确的反转：方差要和数据量一起看。"}],
21: [{"q": "本讲 p15–p20 推出来的算法，与完整的 SAC 相比缺了什么？", "o": ["缺策略网络", "缺熵正则（名字里的 soft）与双 Q 取小", "缺回放缓冲", "缺贝尔曼方程"], "a": 1, "why": "老师说这里的算法与 SAC「非常非常接近」—— 骨架（缓冲 + 拟合 Q + 自举动作现采）都有了，但熵项与双 Q 本讲没讲。"}, {"q": "重参数化技巧解决的是什么问题？", "o": ["让 Q 函数收敛更快", "让回放缓冲占用更少内存", "让离散动作也能用高斯策略", "让采样这一步对参数可导，从而不必走 ∇log π 那条高方差的路"], "a": 3, "why": "把随机性挪到与参数无关的噪声上：a = μ_θ + σ_θ·ε。代价是要求分布可重参数化，所以它对离散动作（如语言模型的 token）走不通。"}],

24: [{"q": "p24、p25 这两个真机例子想说明什么？", "o": ["SAC 的最终性能比 PPO 高", "真机实验比仿真更容易", "只有把数据效率推到这个量级，RL 才进得了现实世界", "模仿学习已经被淘汰"], "a": 2, "why": "课件标题就是 Fully Off-Policy = Can be efficient enough for real-world RL。真机上每一步交互都要花真实时间、磨损硬件，用完即弃不可接受。"}],

28: [{"q": "为什么 LLM 的 RL 训练常用 PPO 而不是 SAC？", "o": ["SAC 不支持神经网络策略", "采样便宜且可并行，瓶颈不是数据而是算力；且 token 是离散的，重参数化走不通", "PPO 不需要奖励函数", "PPO 的数据效率更高"], "a": 1, "why": "由 p23 的取舍可以推出来：数据不是瓶颈时，PPO 的稳定好调成了决定性优点。另外 SAC 那套重参数化是为连续动作设计的。"}, {"q": "PPO 用在语言模型上时，为什么显存压力很大？", "o": ["要存多个 Q 网络", "要同时留着旧策略才能算重要性权重", "要存整个回放缓冲", "要存所有历史梯度"], "a": 1, "why": "老师提过这一点，并给了实践中的省法：不存整个旧模型，只把那一批数据上算出的概率缓存下来 —— 这就是实现里那个 old_logprobs 张量。"}]

{"r": [1, 1], "t": "这一讲要解决的是「一批数据只能走一步梯度」这件浪费事", "star": 2, "quote": "CS 224R — Off-Policy Actor Critic Methods", "one": "标题里的 <b>off-policy</b> 不是一个新算法，而是一个<span class='k'>程度</span>：同一批数据，你敢用它走几步梯度。", "pts": ["上一讲（L04）的 actor-critic 是<b>完全在策略（on-policy）</b>的：采一批数据 → 走<span class='w'>一步</span>梯度 → 数据作废 → 重采。", "这件事很浪费。真机上采 2000 个时间步可能要跑几分钟，换来的却只是一次参数更新。", "这一讲沿着「能不能多用几次」这条线走到底，中间会经过两个落脚点：<b>PPO</b>（同一批走几百步）与 <b>SAC</b>（把<span class='k'>所有历史数据</span>都留着反复用）。", "所以本讲的结构不是「两个并列的算法」，而是<b>同一个旋钮拧到两个刻度</b>：拧得越狠，数据效率越高，但越难调、越不稳。", "读之前先记住一个判据，后面每一页都能用它检查自己有没有跟上：<b>「这一页在讨论的，是怎么让旧数据还能用，还是在讨论用旧数据会坏在哪」</b>。本讲几乎每一页都落在这两类里的一类。"], "tbl": {"cap": "这条线在本课里的三个刻度", "head": ["", "L04 actor-critic", "PPO（本讲前半）", "SAC（本讲后半）"], "rows": [["一批数据走几步梯度", "1 步", "约 300 步", "全部历史数据反复用"], ["旧数据留多久", "用完即弃", "本批用完即弃", "永久留在回放缓冲里"], ["靠什么撑住", "不需要", "重要性权重 + 截断", "拟合 Q 而不是 V"], ["数据效率", "最低", "中", "最高"], ["调参难度", "最低", "中", "最高"]]}, "say": "这一讲在整门课里的位置值得先说清楚：L03 讲策略梯度、L04 讲 actor-critic，都还在「采一批、更一次」的框架里。<b>PPO 是这条线的终点，也是你在 LLM 训练里最常撞见的那个名字</b>——本讲 p28 专门有一页讲这件事，而 L09、L10 两讲会把它真正用到语言模型上。<br><br>另外提醒一句阅读顺序：<b>本讲的两半可以分开读</b>。前半（p7–p13）自成一体，读完就能看懂任何一份 PPO 实现；后半（p14–p23）是另一条独立的线，卡住了不影响前半。", "link": {"t": "你学过的对应：CS234 L08 策略梯度（似然比技巧、REINFORCE、因果性降方差）", "href": "../../reinforcement learning/theater/影片/L08-策略梯度.html"}},
{"r": [3, 3], "t": "重要性权重：让「别人采的样」能算出「我的梯度」", "star": 3, "quote": "Importance weights for off-policy policy gradient: Do more of the above average stuff, less of the below average stuff.", "one": "在策略梯度的每一项前面乘一个比值 <code>π_θ′(a|s) / π_θ(a|s)</code>，就把「旧策略采的数据」换算成了「新策略下的期望」。", "eq": "在策略：∇_θ J(θ) ≈ (1/N) Σ_i Σ_t ∇_θ log π_θ(a_{i,t}|s_{i,t}) · ( Σ_{t'≥t} r(s_{i,t'}, a_{i,t'}) − b )\n\n离策略：∇_θ′ J(θ′) ≈ (1/N) Σ_i Σ_t [ π_θ′(a_{i,t}|s_{i,t}) / π_θ(a_{i,t}|s_{i,t}) ] · ∇_θ′ log π_θ′(a_{i,t}|s_{i,t}) · ( Σ_{t'≥t} r − b )", "pts": ["课件把在策略公式的四个部件都标了名字：<b>policy log likelihood</b>（策略对数似然）、<b>reward to go</b>（往后的回报）、<b>baseline</b>（基线）、<b>samples from policy</b>（从策略采的样）。", "离策略版本只多了<span class='k'>一个因子</span>——那个比值。其余结构一字未动。", "<b>θ 与 θ′ 要分清</b>：θ 是<span class='w'>采数据时</span>的参数（采完就冻住），θ′ 是<span class='k'>此刻正在被更新</span>的参数。第一次梯度步时两者相等，比值恒为 1。", "所以「多走几步梯度」在数学上是免费的吗？不是——免费的只有<b>第一步</b>。往后每走一步，θ′ 离 θ 越远，比值离 1 越远，问题就从这里长出来。"], "tbl": {"head": ["", "在策略（L04）", "离策略（本讲）"], "rows": [["数据来自", "当前策略 π_θ", "旧策略 π_θ，θ 已冻住"], ["每批数据走几步", "1 步", "M 步（PPO 里约 300）"], ["公式差别", "—", "每项乘 π_θ′/π_θ"], ["第一步时", "—", "比值 = 1，与在策略完全一样"], ["走得越多", "—", "比值越偏离 1，越危险"]]}, "say": "老师被问到「为什么非要用重要性权重来算梯度」时的回答很干脆：<b>「这个重要性权重项，正是让你能走不止一步梯度的东西。没有它，你就没法在旧的那批数据上准确估计梯度。」</b>换句话说，重要性权重不是一个优化技巧，而是<span class='k'>离策略这件事本身的入场券</span>。<br><br>课件右下角那句 <b>“Do more of the above average stuff, less of the below average stuff.”</b>（多做高于平均的事，少做低于平均的事）说的是括号里那一坨——<b>减去基线之后，正负号才有「高于/低于平均」的含义</b>。没有基线，回报全是正的，公式就变成了「所有做过的事都多做一点」。", "tip": {"t": "这个比值的方向别记反", "v": "分子是<b>新</b>策略、分母是<b>旧</b>策略：<code>π_θ′(a|s) / π_θ(a|s)</code>。记法是「<b>我现在多想做这件事 ÷ 我当时多想做这件事</b>」。比值 &gt; 1 表示新策略比旧策略更青睐这个动作。写反了整个更新方向都是错的，而且不会报错，只会训不出来。", "w": 1}, "link": {"t": "你学过的对应：CS234 L15 批量离线 RL（重要性采样、覆盖条件、加权 IS 的偏差-方差取舍）", "href": "../../reinforcement learning/theater/影片/L15-批量离线强化学习与安全策略改进.html"}},
{"r": [4, 4], "t": "V、Q、A：三个对象，一句话各自说清", "star": 1, "quote": "advantage Aπ(s, a) - how much better it is to take a than to follow policy π at state s", "one": "优势 <code>A^π(s,a) = Q^π(s,a) − V^π(s)</code>：<b>在状态 s 下选 a，比「照策略办」好多少</b>。", "eq": "V^π(s)   = 从 s 出发、之后一直按 π 走，未来回报的期望\nQ^π(s,a) = 从 s 出发、先执行 a、之后按 π 走，未来回报的期望\nA^π(s,a) = Q^π(s,a) − V^π(s)", "pts": ["课件用两张小图把 V 与 Q 的差别画得很直白：V 是「从 s 直接 run π」，Q 是「take action a, then run π」。", "A 的符号就是<b>该不该多做这个动作</b>的判据：A &gt; 0 就加大它的概率，A &lt; 0 就压低。", "为什么要减掉 V：<span class='k'>V 是一个与动作无关的量</span>，减掉它不改变梯度的期望（这就是基线），却能大幅降低方差。", "本讲后面会出现一个反转：到了 SAC 那一侧，<span class='w'>反而故意不减 V</span>，直接用 Q——理由在 p20。", "三者都带上标 π：<b>它们是「跟着某个特定策略走」才有定义的量</b>。换一个策略，同一个 (s,a) 的 Q 与 A 就是另外的数。本讲后半「回放缓冲里的数据来自好多个旧策略」之所以是个问题，根子就在这个上标上。"], "tbl": {"cap": "三个量的定义、用途，以及本讲在哪里动它们", "head": ["量", "一句话定义", "本讲在哪动它"], "rows": [["V^π(s)", "从 s 起、之后按 π 走的未来回报期望", "p16：回放缓冲里它到底是谁的 V？"], ["Q^π(s,a)", "从 s 起、先做 a、之后按 π 走", "p17–p18：改成拟合它，因为 a 是输入"], ["A^π(s,a)", "Q − V，选 a 比照策略办好多少", "p20：故意不用它，直接用 Q̂"]]}, "say": "这一页是纯回顾，课上一带而过。但它是后面所有讨论的记号底座：<b>p9 说「优势是基于旧策略估的」、p17 说「改成拟合 Q 而不是 V」、p20 说「用 Q̂ 代替 Â」，讲的都是这一页上的三个符号在打架</b>。看不懂后面时，多半是回到这页就能解开。<br><br>老师复述 A 的来源时用的是这句话：<b>「它来自回报的和——也就是 Q 函数——减去平均的回报和——也就是值函数」</b>。把 V 读成「平均意义上的回报」，A 的符号含义就自然了：正的就是「比平均好」。", "link": {"t": "你学过的对应：CS234 L09 策略梯度 II（基线不改变期望的六步证明、折扣占用测度）", "href": "../../reinforcement learning/theater/影片/L09-策略梯度II.html"}},
{"r": [5, 5], "t": "Actor-Critic：把「往后的回报」换成「优势的估计」", "star": 2, "quote": "Estimate what is good and bad, then do more of the good stuff.", "one": "Actor-critic 与 REINFORCE 的<b>唯一</b>差别，是把括号里那坨蒙特卡洛回报换成了 <code>Â^π(s_t, a_t)</code>。", "eq": "∇_θ J(θ) ≈ (1/N) Σ_i Σ_t ∇_θ log π_θ(a_{i,t}|s_{i,t}) · A^π(s_{i,t}, a_{i,t})\n\n拟合 V̂ 的目标（n 步自举）：\ny_{i,t} = Σ_{t'=t}^{t+n−1} r(s_{i,t'}, a_{i,t'}) + γⁿ · V̂^π_φ(s_{i,t+n})", "pts": ["<b>actor</b> 是策略 π_θ，<b>critic</b> 是值函数 V̂_φ。两套参数，两个损失。", "critic 的训练就是<span class='k'>一个回归问题</span>：把 V̂_φ(s) 拟合到目标 y 上。", "n 的取值是一条连续谱：n=1 是纯自举（偏差大、方差小），n→T 是纯蒙特卡洛（无偏、方差大）。<b>这条谱到 p12 的 GAE 会被再用一次</b>——GAE 做的就是把不同 n 的估计加权平均起来。", "老师一句话总结了它与策略梯度的分野：策略梯度用「这条轨迹的回报」，actor-critic 用「<b>我们估计出来的好坏</b>」，然后「多做我们认为好的事」。", "<span class='w'>这里有一个容易滑过去的前提</span>：第 3 步算优势用的 V̂ 是<b>拟合出来的</b>，不是真值。它不准，优势就不准；优势不准，p9 讲的过拟合就更严重。<b>critic 的质量是整条链的上游。</b>"], "tbl": {"cap": "同一个 ∇log π 前面乘什么 —— 三代方法的分水岭", "head": ["方法", "乘的是", "偏差 / 方差"], "rows": [["REINFORCE", "整条轨迹的回报", "无偏 / 方差最大"], ["带基线的 PG", "回报 − b", "无偏 / 方差小一些"], ["Actor-Critic", "Â（critic 估的优势）", "有偏 / 方差小"], ["本讲（离策略）", "重要性权重 × Â", "再加一层权重方差"]]}, "say": "这一页与 p4 合起来是本讲的记号底座。值得留意的是<b>方差在本讲里被加了一层</b>：actor-critic 用 critic 换掉蒙特卡洛回报，本来是为了降方差；而离策略又在前面乘上一个重要性权重，那个权重自己是有方差的，走得越远方差越大。<b>p11 的截断，同时也是在压这个方差</b>——虽然课件是从「拆掉动机」的角度讲的。", "link": {"t": "你学过的对应：CS234 L09 actor-critic 与 n 步回报", "href": "../../reinforcement learning/theater/影片/L09-策略梯度II.html"}},
{"r": [6, 6], "t": "今天的路线图：一个旋钮，两个刻度", "star": 1, "quote": "Key learning goals: All of the key concepts for practical algorithms like PPO and SAC", "one": "课件把本讲切成两半：<b>前半</b>让同一批数据走多步梯度（→ PPO），<b>后半</b>把所有历史数据都留着用（→ SAC）。", "tbl": {"head": ["", "前半（→ PPO）", "后半（→ SAC）"], "rows": [["做法", "同一批数据走 M 步梯度", "留一个回放缓冲，全部历史数据反复用"], ["关键技术", "重要性权重 + 截断", "拟合 Q 而不是 V"], ["课件页", "p7–p13", "p14–p23"], ["离策略程度", "轻", "重"], ["代价", "几乎不增加不稳定", "更难调、更不稳"]]}, "pts": ["课件的小标题层次有一处排版错误：第二个大项写成了「b. Even more off-policy algorithm」，按顺序应当是 <b>2.</b>（p6 与 p29 两页都是这么印的）。", "「Key learning goals」那一行点名了两个算法：<b>PPO 与 SAC</b>。这是本讲要交付的东西。", "读的时候心里带一个问题：<span class='k'>这两个刻度之间的取舍到底是什么</span>？p23 会正面回答。", "前半的三个小步（重要性权重 → 约束步长 → 实用 PPO）是<b>严格递进</b>的：每一步都在补上一步留下的洞。后半的两个小步也一样（拟合 Q → 实用 SAC）。<b>跳着读会丢掉「为什么需要这一步」</b>，而那恰恰是本讲最值钱的部分。", "把这条递进写成一串因果，读起来会顺很多：<b>想省数据 ⇒ 一批走多步 ⇒ 得用重要性权重 ⇒ 权重没有上限、优势又是旧的 ⇒ 会过拟合 ⇒ 要么约束策略（KL）要么拆掉动机（截断）⇒ PPO 选截断 ⇒ 截断偶尔帮倒忙 ⇒ 再取个 min</b>。九个箭头，就是 p7 到 p11 的全部。", "后半的因果链同样短：<b>想更省数据 ⇒ 留一个回放缓冲 ⇒ 缓冲里的数据来自好多个旧策略 ⇒ V 不知道该是谁的 V ⇒ 改成拟合 Q（动作是输入，所以不怕）⇒ SAC</b>。"], "say": "这一页与 p29 是同一张幻灯（课末重复一遍）。<b>它不是新内容，看到 p29 时可以直接跳过</b>——本精读也不会在 p29 重复一遍讲解。<br><br>课件把整讲的两个大项写成了「1.」和「b.」，层次记号不一致（p6 与 p29 两页都是这么印的）。<b>按内容它应该是 1. 与 2.</b>，本精读按后者理解。这种排版小错不影响内容，但读的时候容易让人以为漏了一项。"},
{"r": [7, 8], "t": "把重要性权重插进 actor-critic：五步算法里只动了第 4 步", "star": 3, "quote": "<- use importance weights here … What can go wrong?", "one": "整套算法五步，离策略化只改<b>第 4 步那一行</b>——在梯度里乘上重要性权重。", "eq": "1. 从 π_θ 采一批数据 {(s₁,ᵢ, a₁,ᵢ, …, s_T,ᵢ, a_T,ᵢ)}\n2. 把 V̂^{π_θ}_φ 拟合到数据里的回报和\n3. 算优势  Â^{π_θ}(s_t,ᵢ, a_t,ᵢ) = r(s_t,ᵢ, a_t,ᵢ) + γ V̂_φ(s_{t+1},ᵢ) − V̂_φ(s_t,ᵢ)\n4. 算梯度  ∇_θ′ J(θ′) ≈ Σ_{t,i} [ π_θ′(a|s) / π_θ(a|s) ] · ∇_θ′ log π_θ′(a_t,ᵢ|s_t,ᵢ) · Â^{π_θ}(s_t,ᵢ, a_t,ᵢ)\n5. 更新  θ ← θ + α ∇_θ J(θ)", "pts": ["p7 与 p8 是<b>同一张幻灯的两个阶段</b>：p7 只标了「&lt;- use importance weights here」，p8 把那个带权重的梯度式子写了出来，并抛出问题「What can go wrong?」。", "第 3 步的优势用的是<span class='w'>一步 TD 残差</span>：<code>r + γV̂(s′) − V̂(s)</code>。这个选择到 p12 会被 GAE 换掉。", "注意第 2、3 步<b>只在采样后做一次</b>：V̂ 与 Â 都是<span class='w'>对着旧策略</span>算的，之后无论走多少步梯度，它们都不再更新。", "上面这一条就是全部麻烦的根源。下一页正面讲。", "顺带认一下第 4 步式子里的两个下标：<code>π_θ′(a_{i,t}|s_{i,t})</code> 的 <b>i 是第几条轨迹、t 是第几个时间步</b>。求和号 Σ_{t,i} 把一批数据里<span class='k'>所有时间步</span>都算进来——这就是 p13 说「一批 2000 个时间步」的那个 2000。", "还有一个实现上的细节：算比值需要 <b>π_θ 在这批数据上的概率</b>。所以采完数据后不能把旧策略直接扔掉，<span class='w'>要么留着旧模型，要么把当时算出的概率存下来</span>。"], "tbl": {"head": ["步骤", "算一次还是每步算", "基于哪个策略"], "rows": [["1 采数据", "一次", "π_θ（旧）"], ["2 拟合 V̂", "一次", "π_θ（旧）"], ["3 算优势 Â", "一次", "π_θ（旧）"], ["4 算梯度", "每步都算", "π_θ′（新，在变）"], ["5 更新 θ′", "每步都做", "—"]]}, "say": "老师在这里插了一句实现层面的话，对读代码很有用：<b>真正写进 PyTorch 的不是梯度式子，而是一个「代理目标」（surrogate objective），让自动微分把梯度免费求出来</b>。所以你在代码里看到的形状会和这一页的公式不一样——下一页就把那个代理目标写出来。<br><br>被问到「为什么要看代理目标而不是原来的梯度式子」时，老师的回答是：<b>「看代理目标更直观一点，能看出这些重要性权重真的是在让『提高概率』变得非常容易。」</b>而且他补了一句实话：<b>「PPO 如果你看梯度会显得复杂一些，看代理目标就简单些。」</b>——这是选择表述方式的理由，不是数学上的差别。<br><br>还有一句关于语言模型的旁注，与 L09、L10 直接相关：<b>「这在大语言模型上并不少见——你得把旧语言模型的整套权重留着才能做这件事。不过也有办法缓存：可以只把那一批数据上各处分配的概率存下来。」</b>", "tip": {"t": "读代码时的对应", "v": "任何一份 PPO 实现里，你会看到的是 <code>ratio = torch.exp(logp_new - logp_old)</code> 而不是一个除法 —— <b>因为概率在对数空间里算更稳</b>（尤其是语言模型，一个 token 的概率可能极小，直接相除会下溢）。<code>logp_old</code> 就是上面说的「存下来的旧概率」。"}},
{"r": [9, 9], "t": "会坏在哪：优势是旧的，而策略被鼓励跑得越远越好", "star": 3, "quote": "Advantages based on old policy. Policy is incentivized to differ significantly from old policy, can easily overfit.", "one": "代理目标里，比值 <code>π_θ′/π_θ</code> 对一个正优势的动作<b>没有上限</b>——谁把它推得越高，目标就越大。于是策略被<span class='w'>制度性地鼓励</span>跑离旧策略。", "eq": "代理目标（写进 PyTorch 的那个）：\n\nJ̃(θ′) ≈ Σ_{t,i} [ π_θ′(a_{i,t}|s_{i,t}) / π_θ(a_{i,t}|s_{i,t}) ] · Â^{π_θ}(s_t,ᵢ, a_t,ᵢ)\n\n课件把这一步标注为 “a convenient identity”（一个方便的恒等变形）", "pts": ["把它当成一个优化问题看：<b>Â 是常数</b>（旧策略算的，不再变），唯一的变量是那个比值。", "对 Â &gt; 0 的项，最大化目标 = 把比值推到<span class='w'>要多大有多大</span>；对 Â &lt; 0 的项，= 把比值压到 0。", "问题在于 <b>Â 本身是估计值，而且只来自一批数据</b>。把比值推到极端，等于对这一批数据的估计误差全力拟合——这就是<span class='w'>过拟合</span>。", "症状是可预测的：奖励一开始<span class='k'>涨得很快</span>，然后不稳，最后可能<span class='w'>崩掉</span>。", "<b>注意这不是「学习率太大」。</b>学习率太大是每一步都跳得太远；这里是每一步都规规矩矩，但<span class='w'>被优化的目标本身指向一个错的地方</span>——它奖励「偏离」，而偏离越远，那个旧的 Â 越不可信。<b>把学习率调小只是让崩溃来得慢一点。</b>", "课件在代理目标旁边标了一句 <b>“a convenient identity”</b>。它的意思是：这个代理目标<span class='k'>不是</span>真正要最大化的目标，只是一个「对它求梯度正好等于我们要的梯度」的表达式。<b>所以它的绝对数值没有意义，别拿它当性能指标看。</b>"], "say": "老师讲了一个很具体的过拟合画面，比「会不稳定」有用得多：<b>「一个过拟合的策略可能给某一个优势很高的动作分配极高的概率……比方说它学会了『往右走是好的』，但没学会『到这里要停』。于是它会走一条直线，然后一直朝那个方向走下去，最后撞进角落里——因为它过拟合了那一批告诉它往这边走的数据。」</b>", "tip": {"t": "一个能自己验的小推论", "v": "把 ε 设成很大（比如 100），PPO 就<b>退化回没有截断的版本</b>——因为比值几乎永远落在区间内，截断从不生效。反过来把 ε 设成 0，那么第一步之后所有梯度都是 0，策略<span class='w'>一步也走不动</span>。<b>ε 控制的不是步长，是「允许目标函数在多大范围内还讲道理」。</b>课件用的 0.2 意味着：概率比值在 0.8 到 1.2 之间时目标正常，出了这个区间就平掉。", "w": 1}, "res": {"tag": "推断", "v": "这一页的结构和你论文里那个问题同构：<b>用一批昂贵样本估出来的分数，被一个搜索过程反复最大化</b>。AFlow 的选择规则是对已评估 workflow 的分数做 Boltzmann 采样，分数同样来自有限次评估（D_V 上跑 5 次）。区别在于 PPO <span class='k'>明确承认</span>「目标是估计值、优化它会过拟合」并为此加了截断，而工作流搜索那一侧通常不设这道闸。「对估计出来的目标最大化到什么程度才停」——这正是 cost-efficiency bound 要回答的问题之一。", "ref": "本讲 p9；AFlow (arXiv:2410.10762) §3.2 与 Algorithm 1"}},
{"r": [10, 10], "t": "两条路：约束策略本身，还是拆掉偏离的动机", "star": 3, "quote": "💡Idea 1: Use KL constraint on policy. / 💡Idea 2: Can we bound the importance weights? Doesn't directly constrain policy, but removes incentives", "one": "两个办法解决同一件事。<b>Idea 1 直接管住策略</b>（KL 约束），<b>Idea 2 只拆掉动机</b>（把比值卡住）——PPO 走的是第二条。", "eq": "Idea 1（KL 约束）：  E_{s∼π_θ} [ D_KL( π_θ′(·|s) ‖ π_θ(·|s) ) ] ≤ δ\n\nIdea 2（卡住比值）：  把 π_θ′/π_θ 限制在 [1−ε, 1+ε] 之内", "pts": ["课件对 Idea 2 的定性非常准确：<b>“Doesn't directly constrain policy, but removes incentives”</b>——它没有禁止策略偏离，只是让「继续偏离」<span class='k'>不再有收益</span>。", "这是两种完全不同的干预：一个是<b>加围栏</b>，一个是<b>撤奖励</b>。PPO 选后者，因为它更便宜——不用算 KL，也不用解带约束的优化。", "课件在 Idea 1 旁边写着 “Very common. Will see in LLM preference optimization”——<span class='k'>KL 这条路在 L09 的 RLHF 里会回来</span>。", "两条路都需要保留旧策略：算比值要 π_θ，算 KL 也要 π_θ。"], "tbl": {"head": ["", "Idea 1 · KL 约束", "Idea 2 · 卡住比值（PPO）"], "rows": [["管的是", "策略之间的距离", "目标函数里的那个比值"], ["机制", "加围栏：不许走远", "撤奖励：走远也没好处"], ["实现代价", "要算 KL，要调惩罚系数", "一个 clip，一个 ε"], ["课件评价", "Very common", "PPO 的关键思想"], ["后面在哪再见", "L09 RLHF / 偏好优化", "本讲 p11–p13"]]}, "say": "两处讲稿值得记。其一，老师明说 <b>「确实有一个用 KL 约束的 PPO 版本，但那不是最常见的版本」</b>——所以你在代码里看到的 PPO 基本都是截断版。其二，关于 KL 惩罚系数：<b>「你常常会在 KL 散度前面放一个需要调的超参数……用 KL 约束时，这往往是个相当重要的超参数。」</b>这正是 PPO 宁可用截断的现实理由。", "link": {"t": "你学过的对应：CS234 L10 TRPO（把「不变差」变成可优化的下界，再把惩罚变成硬约束）", "href": "../../reinforcement learning/theater/影片/L10-策略梯度III与TRPO.html"}, "tip": {"t": "与 CS234 L10 的接口", "v": "CS234 L10 走的正是 Idea 1 那条线：从 CPI 下界出发，惩罚项系数大到没法用（γ=0.99 时是 39600ε），于是把惩罚<b>变成硬约束</b>——这就是信赖域。<b>PPO 可以看成同一个问题的「便宜做法」</b>：不解带约束的优化，只把目标函数改成一个再怎么偏离也不会继续变大的形状。"}},
{"r": [11, 11], "t": "PPO 的两个 trick：截断，再取 min", "star": 3, "quote": "Trick #1: Clip the importance weights: Policy no longer incentivized to deviate significantly. Trick #2: Take minimum w.r.t. original objective (in rare event where clipping makes objective better). This is the final PPO surrogate objective!", "one": "<b>trick #1 截断</b>拆掉了偏离的动机；<b>trick #2 取 min</b> 堵住截断反而帮倒忙的那个漏洞。两个合起来才是 PPO。", "eq": "只截断（trick #1）：\nJ̃(θ′) ≈ Σ_{t,i} clip( π_θ′/π_θ , 1−ε , 1+ε ) · Â^{π_θ}\n\n最终的 PPO 代理目标（trick #1 + #2）：\nJ̃(θ′) ≈ Σ_{t,i} min( (π_θ′/π_θ)·Â^{π_θ} ,  clip(π_θ′/π_θ, 1−ε, 1+ε)·Â^{π_θ} )", "pts": ["<b>只有 trick #1 是不够的。</b>课件自己标了原因：<span class='w'>in rare event where clipping makes objective better</span>——在少数情况下，截断会把目标<span class='k'>抬高</span>。", "什么时候会抬高：当优势是<b>负</b>的、而新策略给这个动作的概率<b>高</b>（比值很大）时，截断把一个很大的比值压小，乘上负优势后乘积反而<span class='w'>变大了</span>。", "取 min 的作用是：在这种情况下<b>不让截断生效</b>，保留原来那个更狠的惩罚。", "老师把它的意义拔到了一句话：<b>取 min 保证了这个代理目标是原目标的一个下界</b>，于是「我们是在最大化一个下界」。"], "say": "老师给了一组具体数字，把 trick #2 讲透了，<b>建议照着算一遍</b>：某个 (s,a) 的优势是 <b>−1000</b>，新策略给它的概率是 <b>0.9</b>，旧策略给的是 <b>0.1</b>，比值 = <b>9</b>。不截断：9 × (−1000) = <b>−9000</b>。截到 1+ε = 1.2：1.2 × (−1000) = <b>−1200</b>。−1200 比 −9000 大，<span class='w'>目标看起来更好了</span>——也就是说，截断在这里等于替一个很糟的动作开脱。取 min(−9000, −1200) = <b>−9000</b>，截断失效，惩罚照旧。老师的评语是：这样「就不会做这种意外了，这是件好事」。", "tbl": {"cap": "讲稿里那个例子的完整算式（Â = −1000，ε = 0.2）", "head": ["量", "值", "说明"], "rows": [["旧策略概率 π_θ(a|s)", "0.1", "采数据时的策略"], ["新策略概率 π_θ′(a|s)", "0.9", "已经被推得很高"], ["比值 w", "9", "0.9 / 0.1"], ["w · Â（原目标）", "−9000", "惩罚很重"], ["clip(w,0.8,1.2) · Â", "−1200", "截断后反而更大"], ["min(两者)", "−9000", "取 min ⇒ 截断在此不生效"]]}, "tip": {"t": "最容易记反的一点", "v": "截断<b>不是</b>「把步长调小」。它改的是<span class='k'>目标函数的形状</span>，不是学习率：比值一旦走出 [1−ε, 1+ε]，那一项对参数的梯度就<b>变成 0</b>——不是变小，是没了。所以它的效果是「继续往这个方向推，不再有任何回报」，而不是「推得慢一点」。", "w": 1}},
{"r": [12, 12], "t": "GAE：把不同步长的优势估计加权平均", "star": 2, "quote": "Trick #3: \"Generalized advantage estimation\" (GAE). Then, use varying horizon to estimate advantage: for n = 1, . . . , N, where N ≪ T. cut earlier for less variance", "one": "p7 第 3 步用的是<b>一步</b> TD 残差；GAE 把 n=1,2,…,N 的估计<span class='k'>全都算出来再加权平均</span>。", "eq": "一步（p7 用的）：  Â_t = r_t + γ V̂(s_{t+1}) − V̂(s_t)\n\nn 步：        Â_t^{(n)} = Σ_{k=0}^{n−1} γᵏ r_{t+k} + γⁿ V̂(s_{t+n}) − V̂(s_t)\n\nGAE：        Â_t = Σ_n w_n · Â_t^{(n)}，  n = 1, …, N，  N ≪ T", "pts": ["这条谱的两端你在 p5 见过：<b>n 小 = 更依赖 V̂</b>（偏差来自 V̂ 不准），<b>n 大 = 更依赖真实回报</b>（方差来自采样）。", "课件在 N 旁边标了 <b>“cut earlier for less variance”</b>——截得早一些，方差更小。这就是 <span class='w'>N ≪ T</span> 的理由。", "权重怎么选，课件直接打了个问号：<b>“How to choose weights?”</b>，并引了 GAE 作者之一的说法。实践中是一个几何衰减 λⁿ，λ 成为一个新的超参数。", "<b>V̂ 本身照旧要拟合</b>（课件：Fit V^π with Monte Carlo or bootstrapping）。GAE 换的是「怎么用 V̂ 算优势」，不是「要不要 V̂」。", "为什么加权平均能同时压偏差和方差：<b>各个 n 步估计的偏差方向大体一致（都来自同一个 V̂ 不准），而采样噪声互相独立</b>。平均把噪声抵消掉一部分，偏差却只是被重新加权——所以收益主要在方差侧。", "<span class='w'>λ 与 γ 是两个不同的东西，别混。</span>γ 是问题定义的一部分（它决定「最优策略是什么」）；λ 只是估计量的一个旋钮，<b>改 λ 不改变你要求解的问题</b>，只改变你估优势时的偏差-方差配比。"], "tbl": {"cap": "同一个优势，三种估法", "head": ["估法", "偏差来源", "方差来源", "超参数"], "rows": [["一步 TD（p7）", "V̂ 不准", "一步奖励的随机性", "无"], ["n 步", "V̂ 不准（权重更小）", "n 步奖励累积", "n"], ["GAE", "同上，被平均掉一部分", "被加权平均压低", "N 与权重（λ）"]]}, "say": "<b>这一页最值钱的是老师对 GAE 的保留态度，课件上完全看不出来。</b>被问到「GAE 的好处是什么」时他说：<b>「我觉得这个有点难讲清楚（it's a little bit hard to motivate）……可以这么看：如果只用一步回报，尤其当时间步之间挨得很近时，要是你的 V 不完全准，这个估计可能就有点偏；把这个 horizon 拉长，也许能得到更好的估计。」</b>然后补了一句更直接的：<b>「在偏差和方差上是能讲出一些道理的，但在我看来，它是不是必需的，也不是 100% 清楚（not 100% clear if it's necessary in my opinion）。」</b><br><br>这句话值得记住：<b>GAE 是 PPO 论文里的标准配置，但讲这门课的人认为它未必是必需的。</b>三个 trick 里，前两个（截断、取 min）是 PPO 之所以为 PPO 的东西，第三个更像是一个可选的方差控制件。", "tip": {"t": "别把 GAE 当成 PPO 的一部分", "v": "PPO 的<b>代理目标</b>只涉及 trick #1 与 #2（截断 + min）。GAE 是<span class='k'>怎么算那个 Â</span>的问题，和截断正交 —— 你可以用一步 TD 的 Â 跑 PPO，也可以用 GAE 的 Â 跑别的算法。课件把它列成「Trick #3」容易让人误以为三者是一体的。"}, "link": {"t": "你学过的对应：CS234 L09 n 步回报（TD(0) 与蒙特卡洛之间的连续谱）", "href": "../../reinforcement learning/theater/影片/L09-策略梯度II.html"}},
{"r": [13, 13], "t": "实用 PPO：四步，以及一组真实的超参数", "star": 3, "quote": "~2000 timesteps in batch of data · ~10 epochs when updating policy (M =~300 gradient steps with batch size 64) · clipping range ϵ =0.2 · ~500 iterations —> 1M total timesteps of experience", "one": "整个 PPO 就这四步。<b>与 p7 那版的唯一差别是第 4 步：不再走 1 步梯度，而是在截断后的代理目标上走 M 步。</b>", "eq": "1. 从 π_θ 采一批数据\n2. 把 V̂^{π_θ}_φ 拟合到数据里的回报和\n3. 算优势 Â（一步 TD 或 GAE）\n4. 在代理目标上走 M 步梯度：\n   J̃(θ′) ≈ Σ_{t,i} min( w·Â , clip(w, 1−ε, 1+ε)·Â )，  w = π_θ′/π_θ", "pts": ["<b>一批 ≈ 2000 个时间步。</b>老师提醒了这个数的含义会随任务变：「如果是一个 1000 步的长时域问题，这可能只有<span class='w'>两三条轨迹</span>；如果时域短，就是很多条。」", "<b>约 10 个 epoch，batch size 64 ⇒ 约 300 次梯度步。</b>对照 p7 那版：同一批数据，从走 1 步变成走 300 步。", "<b>ε = 0.2</b>，即比值被限制在 [0.8, 1.2]。", "<b>约 500 轮 ⇒ 总共约 100 万个时间步</b>。这是论文里常见的规模。", "课件右下角的曲线图：PPO 明显在 vanilla policy gradient 之上，横轴是<span class='k'>采集的时间步数</span>——所以图在说的是<b>数据效率</b>，不是最终性能。", "<b>第 2、3 步仍然只做一次。</b>这一点和 p7 完全一样，没有因为加了截断而改变：V̂ 与 Â 还是对着旧策略算的，走 300 步梯度的全程它们都不更新。<span class='k'>截断没有修好「优势是旧的」这件事，它只是让「优势是旧的」不再致命。</span>", "把四步和前面对照着记：<b>第 1–3 步是 L04 原样搬过来的，第 4 步换了目标函数，第 5 步并进了第 4 步</b>。整个 PPO 相对 actor-critic 的增量，就只有第 4 步那一个式子。"], "tbl": {"cap": "p13 的超参数，以及它们各自在管什么", "head": ["超参数", "值", "管什么"], "rows": [["一批时间步数", "~2000", "每轮采多少数据"], ["epoch 数", "~10", "同一批数据过几遍"], ["batch size", "64", "每步梯度用多少样本"], ["⇒ 梯度步数 M", "~300", "同一批数据被用了几次"], ["截断范围 ε", "0.2", "比值允许偏离 1 多远"], ["迭代轮数", "~500", "总共采多少轮"], ["⇒ 总经验", "~1M 步", "整个训练的数据预算"]]}, "say": "老师在这里点明了这一整讲的<b>因果收束</b>，值得逐字记下：<b>「这意味着，和之前相比，因为我们引入了截断，我们实际上可以走 300 步梯度而不会出现很不稳定的改进。所以这是好事。」</b><br><br>把这句话和 p9 并排读，本讲前半就闭合了：<b>p9 说「走太多步会过拟合」，p13 说「加了截断之后，300 步也稳」。截断买到的东西，就是这两个数之间的差距（1 步 → 300 步）。</b>", "link": {"t": "你学过的对应：CS234 L10 TRPO 的四步实用化（理论常数大到没法用，于是改成硬约束）", "href": "../../reinforcement learning/theater/影片/L10-策略梯度III与TRPO.html"}, "res": {"tag": "推断", "v": "这一页给出的是一组<b>公开的、被反复复现的默认超参</b>（ε=0.2、10 epoch、batch 64）。对你的论文有一个方法论上的用处：当你要论证「某个搜索/路由策略的收益不是调参调出来的」时，<b>拿领域公认的默认值作为对照</b>比自己扫一遍参数更有说服力，也更省算力。反过来，若你的方法只在非默认参数下才赢，那本身就是一个必须报告的结果。", "ref": "本讲 p13；Schulman et al., Proximal Policy Optimization Algorithms, arXiv:1707.06347"}},
{"r": [14, 14], "t": "再往前一步：能不能把<b>所有</b>历史数据都留着？", "star": 2, "quote": "So far: - use one batch of policy data for one gradient step (fully on-policy) - use one batch of policy data for multiple gradient steps (starting to be off-policy). Can we reuse data from previous batches, i.e. all of the past trial-and-error data?", "one": "课件在这里把「离策略的程度」明确写成了一条<b>刻度尺</b>，并往前再拧一格：不只重用这一批，而是重用<span class='k'>全部历史</span>。", "pts": ["三个刻度，课件自己列了前两个：<b>完全在策略</b>（一批走一步）→ <b>开始离策略</b>（一批走多步）→ <b>回放缓冲</b>（全部历史数据）。", "课件给出两个关键想法：<b>“maintain a buffer of all past data”</b>（留一个装全部历史数据的缓冲）与 <b>“adjust equations to remove on-policy assumptions”</b>（改公式，把在策略的假设拿掉）。", "<span class='w'>第二点是真正的难点。</span>第一点只是加一个列表；第二点要求你找出算法里哪些地方<b>偷偷假设了「数据来自当前策略」</b>——而这些假设并不显眼。", "本讲后面五页（p16–p20）做的全部是第二件事。", "<b>为什么这一步值得费这么大劲</b>：PPO 那边省下来的是「同一批数据多用几百次」，而一批只有 2000 步；回放缓冲省下来的是<span class='k'>整个训练史</span>——跑到后期，缓冲里可能有上百万条转移，每一条都还能继续产生梯度。量级完全不同。", "<span class='w'>但也别把它当免费午餐</span>：缓冲里的数据分布随训练一直在漂移，而算法要在这个漂移的分布上保持稳定。p23 会给出这笔账的另一面。"], "tip": {"t": "两种「离策略」说的不是一件事", "v": "PPO 的离策略是<b>时间上的</b>：数据来自几百步梯度之前的自己，策略只偏离了一点点。回放缓冲的离策略是<b>分布上的</b>：数据来自训练早期一个<span class='w'>可能完全不同</span>的策略。前者可以用一个 ε 卡住，后者卡不住 —— 所以后者不能靠截断解决，只能换函数（V → Q）。"}, "tbl": {"cap": "离策略的三个刻度（课件 p14 的说法 + 本讲后续）", "head": ["刻度", "数据来自", "代表算法", "课件页"], "rows": [["完全在策略", "当前这一批，用一次", "vanilla actor-critic", "L04"], ["开始离策略", "当前这一批，用 M 次", "PPO", "p7–p13"], ["回放缓冲", "全部历史批次", "SAC", "p14–p23"]]}, "say": "「回放缓冲」这个名字你在 CS234 L06（DQN）里已经见过，作用也一样：<b>把在线数据变回一个数据集</b>，打散样本相关性、提高数据利用率。差别在于 DQN 那边学的是 Q，天生就适合离策略；而这里要把它装进 <span class='k'>actor-critic</span>，于是会撞上「V 是谁的 V」这个问题——那正是 p16 的内容。", "link": {"t": "你学过的对应：CS234 L06 DQN 的经验回放与固定 Q 目标", "href": "../../reinforcement learning/theater/影片/L06-卷积网络与深度Q学习.html"}},
{"r": [15, 16], "t": "装上回放缓冲，算法当场就坏了：V 到底是谁的 V？", "star": 3, "quote": "The algorithm is currently broken 😢 — Question: When we fit Vπ on all data from replay buffer, what policy π is it learning a value function for?", "one": "缓冲里的数据来自<b>许多个不同的旧策略</b>。用它们拟合出来的 V̂，<span class='w'>不是任何一个具体策略的值函数</span>——包括不是当前策略的。", "pts": ["p15 先把流程画出来：采经验 → 加进缓冲 → 从<b>全部历史数据</b>里采小批量做更新。", "p16 在同一张图上打出「The algorithm is currently broken 😢」，然后把问题原样抛给学生。", "<b>坏在哪</b>：V^π 的定义里有上标 π（见 p4）。自举目标 <code>r + γV̂(s′)</code> 里的 V̂(s′) 应当是<span class='k'>当前策略</span>之后能拿到的回报；但缓冲里那条数据的后续动作是<span class='w'>某个旧策略</span>选的。", "换句话说：<b>V 没有「动作」这个入口</b>。它只吃状态，所以「之后按谁走」这件事是被<span class='w'>隐含在数据里</span>的，没法在使用时纠正。", "<b>再具体一点看这个漏洞</b>：自举目标是 <code>y = r + γ V̂(s′)</code>。你希望 V̂(s′) 回答「从 s′ 起、<span class='k'>按当前策略</span>走能拿多少」；但 V̂ 是拿缓冲数据拟合的，而那些数据在 s′ 之后执行的是<span class='w'>当年那个策略</span>的动作。于是 V̂(s′) 实际回答的是「从 s′ 起、按当年那些策略的某种混合走能拿多少」。两者不是一回事，而且差多少你也不知道。", "这个混合还<b>一直在变</b>：缓冲在涨，新数据来自越来越好的策略，所以 V̂ 追的那个目标本身在漂。<span class='w'>这不是「有偏差」，是「偏向哪里说不清」。</span>", "注意前面 PPO 那一侧<b>没有这个问题</b>：PPO 每轮都重新采一批、重新拟合 V̂，V̂ 始终对应那一轮的策略。<b>问题是回放缓冲带进来的，不是「走多步梯度」带进来的。</b>"], "tbl": {"cap": "为什么 V 挡不住而 Q 挡得住（p17 的伏笔）", "head": ["", "V(s)", "Q(s, a)"], "rows": [["输入", "只有状态", "状态 + 动作"], ["「之后按谁走」", "隐含在数据里，改不了", "同样隐含"], ["「当前这一步做什么」", "隐含在数据里，<b>改不了</b>", "<b>是输入，可以指定</b>"], ["旧数据能不能用", "不能直接用", "可以（动作作为输入传进去）"]]}, "say": "两处讲稿值得记。其一，老师说这个算法<b>「坏在两个地方」</b>（broken in two different ways），课件上只写了「broken」一个词，没有分开列。第一处就是自举目标里的 V̂(s′)。<br><br>其二，他把问题交给学生讨论两分钟之前，先打了个预防针：<b>「我大概应该提一句，这个问题的答案不像别的问题那么干净。」</b>——这是一句诚实的话：「V̂ 学到的是谁的值函数」确实没有一个漂亮的闭式答案，它学到的是<span class='k'>缓冲里数据分布所对应的某个混合</span>，而那个混合随着训练一直在变。", "tip": {"t": "这里容易产生的一个误解", "v": "不是「旧数据太旧所以没用」。<b>旧数据本身是完全有效的转移样本</b>（s, a, r, s′ 是环境给的，与策略无关）。坏掉的只是<span class='w'>「之后按谁走」这一段</span>——也就是自举项。所以解法不是扔数据，而是<b>换一个能把「这一步做什么」显式接住的函数</b>，那就是 Q。", "w": 1}},
{"r": [17, 18], "t": "解法：拟合 Q 而不是 V，因为动作可以当输入传进去", "star": 3, "quote": "💡What if we fit Q(s, a) instead of V(s)? -> If we fit Q(s, a), we pass the action as input (okay if a is a bit different from what policy would have done)", "one": "Q 把动作放进了<b>输入</b>。于是「缓冲里这条数据当时选的动作和现在的策略不一样」<span class='k'>不再是问题</span>——那个动作只是一个参数。", "eq": "贝尔曼恒等式（对任意 (s,a) 成立）：\nQ^{π_θ}(s,a) = r(s,a) + γ · E_{s′∼p(·|s,a),  ā′∼π_θ(·|s′)} [ Q^{π_θ}(s′, ā′) ]\n\n用缓冲里的样本近似：\nQ^{π_θ}(s_i, a_i) ≈ r(s_i, a_i) + γ · Q^{π_θ}(s′_i, ā′_i)，   其中 ā′_i ∼ π_θ(·|s′_i)", "pts": ["课件把手上有什么写得很清楚：<b>“The datapoints we have: (s, a, r, s′) + future reward”</b>，并在两处打了标记——<span class='w'>action from past policy</span>（动作来自旧策略）、<span class='w'>depends on past policy's actions</span>（依赖旧策略的动作）。后者旁边写着「Don't want to use this」。", "<b>关键的一步在 p18 的第 2 小步</b>：下一个动作 ā′ <span class='k'>不是</span>从缓冲里读的，而是<b>现场从当前策略采一个</b>（<code>ā′_i ∼ π_θ(·, s′_i)</code>）。", "这样一来：<b>(s, a, r, s′) 用旧数据</b>（这四个量与策略无关，环境给的），<b>而「之后怎么走」用当前策略</b>（现采一个动作）。两者被干净地分开了。", "课件在最后留了一句<span class='w'>限制条件</span>：<b>“Note: To be accurate, targets y_i need sufficient action coverage”</b>——目标要准，动作得有足够的覆盖。", "<b>把这个解法的逻辑讲完整</b>：p16 的病根是「之后按谁走」没法指定。换成 Q 之后，<span class='k'>第一步的动作可以指定了</span>（它是输入），而「第一步之后按谁走」则靠自举项里现采的 ā′ 来接管。两处加起来，整条未来就都交回给当前策略了。", "<span class='w'>但这个修补是有裂缝的</span>，裂缝就在最后那句话上：自举项 <code>Q(s′, ā′)</code> 里的 ā′ 是当前策略采的，可缓冲里<b>未必有人在 s′ 试过这个动作</b>。没试过，Q 在那里就只能靠网络外推——而外推的误差会顺着自举一轮轮放大。", "这正是为什么 <b>SAC 要用两个 Q 网络取较小值</b>（本讲没讲，L06、L07 会讲）：那是在压这个外推带来的高估。"], "tbl": {"cap": "一条缓冲里的数据，哪部分用旧的、哪部分用新的", "head": ["量", "来自", "为什么可以/必须这样"], "rows": [["s, a", "缓冲（旧策略选的）", "Q 把 a 当输入，不在乎它是谁选的"], ["r, s′", "缓冲（环境给的）", "与策略完全无关"], ["ā′", "<b>当前策略现采</b>", "「之后按谁走」必须是当前策略"], ["Q(s′, ā′)", "当前的 Q 网络", "自举项"]]}, "say": "老师对「为什么 Q 就没事」的解释很朴素，但正中要害：<b>「如果我们拟合 Q，我们是把动作作为输入传进去的——所以即使这个 a 和策略现在会做的有点不一样，也没关系。」</b><br><br>课件括号里那句 <b>“okay if a is a bit different from what policy would have done”</b> 里的 <span class='w'>a bit</span>（有点）是有分量的：它不是说「任意不同都行」。这正对应最后那句 <b>sufficient action coverage</b>——如果旧策略从来没试过某个动作，Q 在那里就是纯外推。<b>这是离线 RL 整个领域的核心难题，L07 会专门讲。</b>", "link": {"t": "你学过的对应：CS234 L15 覆盖条件（无偏不够，行为策略得去过那些地方）", "href": "../../reinforcement learning/theater/影片/L15-批量离线强化学习与安全策略改进.html"}},
{"r": [19, 20], "t": "两处修补：用 Q̂ 代替 Â，动作从当前策略采", "star": 3, "quote": "First: convenient to use Q̂π instead of Âπ. (i.e. no average reward baseline) — higher variance, but okay b/c we're now using a lot more data (all data in buffer). Second: current policy's actions likely better than past policy's actions.", "one": "策略更新那一行也要改两处：<b>把 Â 换成 Q̂</b>（放弃基线），<b>动作从当前策略采</b>（而不是用缓冲里那个）。", "eq": "L04 的策略更新：  ∇_θ J ≈ Σ ∇_θ log π_θ(a|s) · Â^π(s,a)，  a 取自数据\n\n本讲的版本：      ∇_θ J ≈ Σ ∇_θ log π_θ(a|s) · Q̂^π(s,a)，  a ∼ π_θ(·|s) 现采", "pts": ["<b>第一处：不减基线了。</b>课件自己承认代价——<span class='w'>higher variance</span>（方差更大），理由是「okay b/c we're now using a lot more data」：数据多了，方差扛得住。", "这是本讲里一个<b>明确的反转</b>。p4、p5 花了整页讲「减掉 V 是为了降方差」，这里反过来说「不减也行，因为数据够多」。<span class='k'>方差不是一个绝对的坏东西，它要和数据量放在一起看。</span>", "<b>第二处：动作用当前策略采。</b>理由课件写得很直白——「current policy's actions likely better than past policy's actions」（当前策略选的动作多半比旧策略好）。", "把 p18 与这里合起来看：<b>缓冲里的 (s, r, s′) 全都留用，而两处「要选一个动作」的地方都改成从当前策略现采</b>。这就是「remove on-policy assumptions」的具体落实。", "<span class='w'>还剩一处没被这两个修补盖住</span>：状态 s 仍然来自缓冲，也就是来自<b>旧策略访问过的状态分布</b>。当前策略如果已经走到了别处，那些状态就没有被训练到。课件 p21 问「Any remaining problems?」，这是其中之一。", "<b>所以严格说，这套做法只做到了「动作上离策略」，没做到「状态分布上离策略」。</b>后者在理论上要难得多——CS234 L15 讲离线评估时碰到的覆盖条件，说的是同一件事。"], "tip": {"t": "一个方便的记法", "v": "回放缓冲版的 actor-critic，可以记成<b>「状态借旧的，动作用新的」</b>：s 与 s′ 从缓冲里取（借旧的），而每一处要决定「做什么」的地方都从当前策略现采（用新的）。<span class='k'>p18 的 ā′ 和 p20 的 a，是同一个原则的两次应用。</span>"}, "tbl": {"cap": "从 L04 到本讲，策略更新式子改了什么", "head": ["", "L04 actor-critic", "本讲（回放缓冲版）"], "rows": [["乘的量", "Â = Q − V", "Q̂（不减基线）"], ["方差", "较小", "较大"], ["为什么能接受", "—", "数据量大得多（整个缓冲）"], ["动作 a 取自", "这批数据", "当前策略现采"], ["状态 s 取自", "这批数据", "缓冲（全部历史）"]]}, "say": "老师复述第一处时的措辞把取舍讲得很清楚：<b>「这会有更高的方差，但那没关系，因为我们现在用的数据多得多——是缓冲里的全部数据，而不只是当前策略采的那批。」</b><br><br>第二处他给的是同一句课件原话的口语版：<b>「当前策略的动作很可能比过去策略的动作更好。所以在这个更新里，我们会从当前策略采一个 a，而不是用缓冲里记录的那个动作。」</b>——注意这句话里藏着一个假设：<span class='w'>训练是在变好的</span>。如果训练发散了，这个理由就不成立。<br><br>到这里，课件 p22 说这套东西「非常非常接近」的那个算法就是 <b>SAC（soft actor-critic）</b>。老师提到还有两件本讲没空讲的事：用<b>重参数化技巧</b>更好地估这个梯度（对高斯策略），以及<b>更讲究的拟合 Q 的办法</b>（留给后两讲）。", "res": {"tag": "推断", "v": "这两处修补合起来是一个很干净的方法论样本，对你的论文有参考价值：<b>当「用旧数据」这件事坏掉时，先精确定位坏在哪一项，再换掉那一项，而不是整体换一套方法。</b>这里坏的是「之后按谁走」，于是把 V 换成 Q（给动作开一个入口）、把自举动作改成现采——(s,a,r,s′) 一个都没扔。你那边的节点级保真度分配同样是「旧日志能不能复用」的问题，而简报里已经判定确定性日志下 IS <span class='w'>无定义</span>（不是方差大）。同一个思路问一遍：<b>坏的到底是哪一项，能不能只换那一项？</b>比如成本那一半近乎确定、可以直接回归，就不必走重要性权重——这正是「只换坏掉的那一项」。", "ref": "本讲 p17–p20；你的科研简报 §4a「现有日志做不了 IS —— 不是方差大，是估计量不存在」与 §4e「估计量要拆成两半」"}},
{"r": [21, 22], "t": "剩下的问题，以及这套东西的名字：SAC", "star": 2, "quote": "Any remaining problems? … can also use reparameterization trick to better estimate the gradient (for Gaussian policy); also fancier ways to fit Q-functions (more on this in next two lectures). Example practical algorithm: Soft Actor-Critic", "one": "p21 把问题重新抛回来，p22 给出答案：到这一步已经<b>非常接近 SAC</b> 了，剩下的是两类工程改进。", "pts": ["<b>改进一：重参数化技巧。</b>对高斯策略，把 <code>a ∼ N(μ_θ, σ_θ)</code> 改写成 <code>a = μ_θ + σ_θ·ε, ε ∼ N(0,1)</code>，于是梯度可以<span class='k'>直接穿过采样这一步</span>流回 θ，不必走 ∇log π 那条高方差的路。", "<b>改进二：更讲究的 Q 拟合办法</b>，课件写明「more on this in next two lectures」——L06（Q-learning）与 L07（离线 RL）会讲。", "<span class='w'>注意这两条改进的性质不同</span>：重参数化是在改<b>怎么算梯度</b>（同一个目标，更好的估计量）；Q 拟合那一条是在改<b>目标本身有多可信</b>。前者是方差问题，后者是偏差问题，<span class='k'>它们不能互相替代</span>。", "课件给出的论文是 <b>Haarnoja, Zhou, Abbeel, Levine. Soft Actor-Critic. 2018</b>。", "<span class='w'>名字里的 soft 本讲没有解释。</span>它指的是在目标里加了一项<b>策略熵</b>（鼓励策略保持随机），这既改善探索也让训练更稳。本讲的推导里并没有这一项，所以严格说这里导出的是「SAC 去掉 soft 的那一半」。", "<b>p21 这一问本身是有内容的。</b>把 p16 列的两处毛病对照一下：第一处（V 不知道是谁的）已经被 p17–p18 换成 Q 解决了；第二处（策略更新里用旧动作）被 p20 解决了。那<span class='k'>还剩什么</span>？剩的是前一页提到的那条裂缝——自举项里 ā′ 可能落在缓冲从未覆盖的地方，Q 在那里是外推。", "<b>这就是为什么 p22 说「拟合 Q 还有更讲究的办法」</b>：那些办法（双 Q 取小、目标网络、保守估计）全都在处理同一件事——<span class='w'>自举 + 外推会让 Q 系统性高估</span>。L06 讲 Q-learning 时会把这条线讲完。"], "tbl": {"cap": "本讲导出的算法 vs 完整的 SAC", "head": ["成分", "本讲 p15–p20 导出", "完整 SAC"], "rows": [["回放缓冲", "有", "有"], ["拟合 Q 而非 V", "有", "有"], ["自举动作现采", "有", "有"], ["熵正则（soft）", "<b>没讲</b>", "有"], ["重参数化梯度", "提了一句", "有"], ["双 Q 取小", "没讲", "有"]]}, "say": "老师在这里的原话是：<b>「这基本上就是 soft actor-critic 算法。还有别的估这个梯度的办法，今天没时间讲，但以后的课可能会讲。拟合这个 Q 函数也有更讲究的办法，下一讲会看到。不过这里的算法，和一个叫 soft actor-critic（SAC）的东西非常非常接近。」</b><br><br><b>「非常非常接近」这个措辞值得留意</b>——它是诚实的。本讲用五页纸推出了 SAC 的骨架（缓冲 + Q + 现采动作），但没有熵项、没有双 Q。<span class='k'>读完本讲你能看懂 SAC 的代码结构，但看到 <code>alpha</code> 和 <code>q1, q2</code> 时还是会愣一下</span>——那两样东西在这门课里属于后面几讲。<br><br>值得欣赏的是这五页的<b>推导方式</b>：它不是「介绍一个叫 SAC 的算法」，而是<span class='k'>从一个需求（想重用全部历史数据）出发，撞上一个具体的毛病（V 是谁的 V），换掉坏掉的那一件（V→Q），再修补连带的两处（自举动作、策略更新的动作）</span>——走完就得到了 SAC。<b>这种「被逼出来的算法」比「被介绍的算法」好记得多，也更容易在新场景里自己推一遍。</b>", "tip": {"t": "重参数化技巧为什么值得单独记", "v": "它在 RL 之外也到处都是（VAE 就靠它）。核心是一句话：<b>把随机性从「参数决定的分布」里挪到一个与参数无关的噪声上</b>，于是采样这一步对参数就是可导的了。<span class='k'>对比 ∇log π 那条路：后者只需要能算概率密度，适用面更广但方差大；前者要求分布可重参数化，但梯度质量高得多。</span>"}},
{"r": [23, 23], "t": "这笔账的两面：数据效率 vs 好不好调", "star": 3, "quote": "+ Off-policy with replay buffer (e.g. soft actor-critic) can be far more data efficient. - They can also generally be a lot harder to tune hyperparameters, less stable (than e.g. PPO)", "one": "课件用一正一负两行把全讲的取舍收口：<b>回放缓冲换来数据效率，代价是更难调、更不稳。</b>", "pts": ["图上两条曲线：<span class='k'>橙色</span>是更离策略的（带回放缓冲），<span class='w'>棕色</span>是更不离策略的（无缓冲）。橙色明显更快到达同样的回报。读这张图时要盯住横轴——它是<b>环境交互步数</b>，不是时间，也不是算力。", "<b>正面</b>：课件写 “far more data efficient”（数据效率高得多）。老师的口语版是「你可以大大大大地更省数据」。", "<b>负面</b>：课件写 “a lot harder to tune hyperparameters, less stable”。老师点明了不稳的来源：<b>「用这些 Q 函数时，一般会比 PPO 稍微不稳一些。」</b>", "<span class='k'>这不是一句客套的「各有优劣」</span>。它有可操作的推论：<b>仿真里数据便宜 ⇒ 用 PPO（省心）；真机上数据昂贵 ⇒ 用 SAC（省数据）</b>。接下来四页的例子正是按这条线排的。", "<b>「更不稳」具体是什么样子</b>：Q 函数靠自举训练，而自举的误差会沿着时间一轮轮传播放大；再叠加函数逼近的外推，就可能出现 Q 值<span class='w'>系统性高估并持续发散</span>。症状是训练曲线先好后崩，而且换个随机种子结果大不一样。<span class='k'>PPO 没有自举的 Q，所以没有这条发散通路。</span>", "<b>「更难调」难在哪</b>：SAC 要调的东西明显更多——学习率（策略、Q、熵系数各一套）、缓冲大小、每步更新次数、目标网络的更新速率。而 PPO 那组参数（p13 列的几个）在很多任务上<span class='k'>照抄默认值就能用</span>。"], "tbl": {"cap": "怎么选：按「哪种资源更贵」来选", "head": ["", "PPO（不太离策略）", "SAC（很离策略）"], "rows": [["数据效率", "低", "<b>高</b>"], ["调参难度", "<b>低</b>", "高"], ["稳定性", "<b>好</b>", "一般"], ["什么时候选它", "仿真、数据便宜、算力充足", "真机、数据昂贵、不能多试"], ["本讲的例子", "p26 四足机器人、p27 魔方", "p24 走路、p25 精密装配"]]}, "say": "把这一页和 p13 并排读，本讲的两半才真正合上：<b>p13 说截断让你从「一批走 1 步」变成「一批走 300 步」；p23 说回放缓冲让你把这个数字推向无穷（所有历史数据都还能用），但要付稳定性的代价。</b>同一个旋钮的两个刻度，各自的账都算清楚了。<br><br><span class='w'>一个容易被忽略的角度</span>：论文里报的「数据效率」横轴是<b>环境交互步数</b>，不是墙上时间，也不是算力。SAC 每一步交互背后的计算量比 PPO 大得多（要从缓冲采样、更新多个网络）。<b>所以「更省数据」不等于「更省时间」——在仿真里，常常是 PPO 先跑完。</b>"},
{"r": [24, 25], "t": "完全离策略的价值：数据效率高到能在真机上跑 RL", "star": 2, "quote": "Fully Off-Policy = Can be efficient enough for real-world RL — Learning to walk from scratch in <2 hours with SAC", "one": "两个真机例子说明同一件事：<b>只有把数据效率推到这个量级，RL 才进得了现实世界。</b>", "pts": ["<b>p24</b>：用 SAC <span class='k'>从零学会走路，不到 2 小时</span>（Haarnoja et al., Soft Actor-Critic Algorithms and Applications, 2018）。「从零」指没有仿真预训练、没有示范。", "<b>p25</b>：HIL-SERL 做精密装配（Luo, Xu, Wu, Levine, 2024），课件旁注写着 <span class='k'>“&lt;- better, faster than imitation learning (seeded with demonstrations)”</span>——比用示范做的模仿学习<b>又好又快</b>。", "<b>为什么必须是完全离策略</b>：真机上每一步交互都要花真实时间、磨损硬件、可能需要人复位。一批 2000 步可能就是几十分钟。<span class='w'>在这种预算下，「用完即弃」是不可接受的。</span>", "p25 那条旁注值得单独记：<b>在这个任务上 RL 打赢了模仿学习</b>，而模仿学习还是有示范的。这与 L02 的结论并不矛盾——模仿学习的天花板是示范的质量，RL 没有这个天花板。", "<b>算一笔账就明白为什么非要离策略</b>：按 p13 的 PPO 参数，一轮要 2000 步交互，总共约 500 轮 ⇒ <span class='w'>100 万步</span>。真机上如果一步是 0.05 秒，100 万步就是约 <b>14 小时纯交互时间</b>，还不算复位、充电、硬件故障。而 p24 的 SAC 在 2 小时内从零学会走路——<span class='k'>差的不是一点，是一个量级</span>。", "<b>HIL 的意思是 human-in-the-loop</b>（人在回路里）。p25 那个系统允许人在训练中介入纠正，这既加速学习也保证安全。<span class='k'>这说明真机 RL 往往不是纯自动的</span>，而是把人的介入也设计进流程里。", "两个例子相隔<b>六年</b>（2018 → 2024），任务也从「走路」变成「精密装配」。<span class='k'>这条时间线本身就是进展的刻度</span>：走路是容错的（摔了再来），装配是不容错的（差一毫米就装不进去）。"], "tbl": {"cap": "两个真机例子", "head": ["", "p24 走路", "p25 精密装配"], "rows": [["算法", "SAC", "基于 SAC 的 HIL-SERL"], ["年份", "2018", "2024"], ["亮点", "从零 &lt;2 小时", "优于有示范的模仿学习"], ["为什么需要离策略", "真机交互昂贵", "真机交互昂贵 + 任务精密"]]}, "say": "老师收束这一段时说：<b>「最后，当你是完全离策略的时候，你的效率可以高到真的能在真实机器人上跑强化学习。」</b><br><br>这句话把本讲前面所有的技术细节都串成了一个目的：<span class='k'>重要性权重、截断、拟合 Q 而不是 V ——这一整套东西存在的理由，是让 RL 的数据预算降到现实世界付得起的量级。</span>如果数据是免费的（纯仿真、无限算力），本讲大半内容在工程上都可以不要。<br><br><b>这也是读这一讲时最值得带走的一条判断</b>：当你评估任何一个「提升数据效率」的方法时，先问<span class='w'>它省下来的那种资源，在你的场景里到底贵不贵</span>。同一个方法，在真机上是决定性的，在仿真里可能只是让事情变复杂。", "tip": {"t": "「从零」这个词的分量", "v": "p24 的 “from scratch” 指<b>没有仿真预训练、没有示范、没有手工设计的步态</b> —— 机器人一开始连站都站不稳，全靠试错。<span class='k'>2 小时这个数之所以震撼，是因为它同时包含了摔倒、复位、重试的全部时间。</span>对照之下，很多论文说的「几小时学会」其实是在仿真里，或者从一个已有策略微调。"}},
{"r": [26, 27], "t": "PPO 的位置：稳，但费数据 —— 所以活在仿真里", "star": 2, "quote": "PPO = Common algorithm of choice for stable, less efficient learning — Learning to walk in simulation with PPO -> transfer to real world (with careful simulation choices)", "one": "PPO 的两个例子都是<b>先在仿真里学、再迁到真机</b>。因为仿真里数据便宜，PPO 的「费数据」就不是问题，而它的「稳」变成了纯收益。", "pts": ["<b>p26</b>：四足机器人在仿真里用 PPO 学走路，再迁到真机（Tan et al., Sim-to-Real, 2018）。课件强调迁移成功需要 <span class='k'>“careful simulation choices”</span>（仔细的仿真设计）。注意它和 p24 是<b>同一个任务（走路）的两条不同路线</b>——一个真机直接学，一个仿真里学再迁。", "<b>p27</b>：OpenAI 用机械手解魔方（2019），同样是仿真里学、迁到真手。", "<span class='w'>课件在 p27 打了一个很重要的括号</span>：<b>“(though, transfer from simulation generally much harder, less successful for robot manipulation)”</b>——仿真到现实的迁移，在<b>操作类</b>任务上一般要难得多、也不那么成功。", "把 p24–p27 四页合起来看是一张清晰的分工图：<b>真机直接学 → SAC；仿真里学再迁 → PPO</b>。而第二条路在「移动」上好使，在「操作」上吃力。", "<b>为什么操作类更难迁移</b>（课件只给了结论，这里补上理由）：走路主要靠刚体动力学，仿真器算得相当准；而抓取、装配牵涉<span class='w'>接触、摩擦、形变</span>——这些恰恰是物理引擎最不准的部分。<span class='k'>迁移的难度，取决于仿真器在该任务上建模得有多好。</span>", "“careful simulation choices” 具体指什么：<b>域随机化</b>（训练时随机扰动摩擦、质量、延迟等参数，逼策略学出对参数不敏感的行为）、精心校准的动力学、以及对执行器延迟的建模。<span class='w'>这部分工作量往往比训练算法本身还大。</span>", "p27 的魔方是个很好的例子：<b>解魔方的「算法」部分根本不用学</b>（有现成求解器），RL 学的只是<span class='k'>手指怎么转动魔方</span>——即便如此，迁移仍然需要大量的域随机化工作。"], "tbl": {"cap": "四个例子的分工（p24–p27）", "head": ["页", "任务", "算法", "在哪学", "备注"], "rows": [["p24", "走路", "SAC", "真机", "从零 &lt;2 小时"], ["p25", "精密装配", "SAC 系", "真机", "胜过有示范的模仿学习"], ["p26", "四足走路", "PPO", "仿真→真机", "需仔细设计仿真"], ["p27", "解魔方", "PPO", "仿真→真手", "操作类迁移一般更难"]]}, "say": "这两页和 p23 要连起来读才有意思。<b>PPO 之所以能活在「仿真 + 迁移」这条路线上，正是因为它那条缺点（费数据）在仿真里不要钱，而它那条优点（稳、好调）在需要跑成千上万次实验的研究流程里非常值钱。</b><br><br>反过来说也成立：<span class='k'>算法的「好坏」不是绝对的，而是由哪种资源更贵决定的</span>。这一讲用两组四个例子把这件事演示了一遍，而不是只写一句「各有优劣」。<br><br>还有一个工程现实值得记：<b>仿真可以开几千个并行环境</b>，于是「2000 步一批」这件事在墙上时间里几乎是瞬间完成的。PPO 又特别适合这种并行——它的每一轮是「采一大批、算一次优势、走 M 步梯度」，<span class='k'>采样那一段是完全可并行的</span>。SAC 的更新与采样交织得更紧，并行起来反而麻烦。这是 p23 那张表背后没写出来的一条。", "tip": {"t": "sim-to-real 这条路线的隐含成本", "v": "课件说迁移需要 “careful simulation choices”，听起来像一句轻描淡写的提醒，实际上<b>这部分往往是整个项目里最花人力的环节</b>。做域随机化要决定随机哪些参数、范围多大；范围太窄迁不过去，太宽则策略学得过于保守。<span class='w'>这些决定没有理论指导，基本靠试。</span>所以「仿真里训练很便宜」只在<b>算力</b>的意义上成立，人力上未必。"}},
{"r": [28, 28], "t": "一句预告：语言模型这边，PPO 是常见选择", "star": 3, "quote": "What about RL for language models? PPO is a common choice! Will start to discuss them when talking about reward modeling next week.", "one": "整页只有一句话，但它是<b>本讲与你最关心的那条线的接口</b>：LLM 的 RL 训练里，PPO 是常见选择。", "pts": ["<b>为什么是 PPO 而不是 SAC</b>（课件没说，但由 p23 可以推）：语言模型的「环境」就是它自己生成文本，<span class='k'>采样便宜、可以大规模并行</span>——数据不是瓶颈，算力是。于是 PPO 的「稳、好调」成了决定性优点。", "另一个理由是<b>动作空间</b>：SAC 那套（重参数化、连续动作上的高斯策略）是为连续控制设计的；语言模型的动作是<span class='w'>离散的 token</span>，重参数化那条路走不通。", "课件说下周讲 reward modeling 时开始展开——对应的是 <b>L08 奖励学习、L09 RLHF/偏好优化、L10 LLM 推理</b> 三讲。", "<b>注意课件这句话的落点是 reward modeling 而不是 PPO 本身</b>。言下之意：PPO 这个算法在本讲就讲完了，到了 LLM 那边<span class='k'>真正的新问题是奖励从哪来</span>——没有游戏分数，也没有机器人摔没摔倒，只有人类的偏好。那才需要单独一讲。", "<b>你在 L09、L10 会再见到本讲的每一个零件</b>：重要性权重、截断、KL（p10 的 Idea 1 在 RLHF 里以另一种形式回来）、以及「优势怎么估」。", "<span class='w'>一个记号上的转换，提前说了省得到时候卡住</span>：LLM 的 RL 里，「状态」是<b>到目前为止的 token 序列</b>，「动作」是<b>下一个 token</b>，一条「轨迹」就是一次完整生成。于是本讲的 Σ_{t,i} 变成「对每条回复里的每个 token 求和」。", "<b>奖励的形状也变了</b>：本讲每一步都有 r(s,a)，而 LLM 这边通常<span class='k'>只在生成结束时给一个分数</span>（整条回复好不好）。中间每个 token 没有即时奖励——这正是「优势怎么估」在那边变成一个独立难题的原因。", "有了这两条转换，p11 的代理目标可以<b>一字不改</b>地搬到 LLM 上：w 是新旧模型对同一个 token 的概率比，Â 是这个 token 的优势估计。<span class='k'>PPO 在 LLM 上并没有变形，变的只是 s、a、r 各自指什么。</span>"], "tbl": {"cap": "本讲的零件，在后面三讲里各自去哪了", "head": ["本讲的东西", "在 LLM 这边变成什么", "哪一讲"], "rows": [["奖励 r(s,a)", "奖励模型（从人类偏好学出来）", "L08 / L09"], ["KL 约束（p10 Idea 1）", "对参考模型的 KL 惩罚", "L09"], ["截断（p11）", "原样保留", "L09 / L10"], ["优势估计", "组内相对基线等做法", "L10"], ["回放缓冲 / SAC", "基本不用", "—"]]}, "say": "老师在前面讲重要性权重时，已经顺手给过一条 LLM 相关的实现细节，正好接在这一页上：<b>「这在大语言模型上并不少见——你得把旧语言模型的整套权重留着才能做这件事。不过也有办法缓存：可以只把那一批数据上各处分配的概率存下来。」</b><br><br>这条提醒很实在：<span class='w'>PPO 用在 LLM 上时，显存压力的一大来源就是「得同时存着旧策略」</span>。而把旧概率缓存下来（而不是存整个模型）正是实践中常用的省法——这也解释了为什么 PPO 的 LLM 实现里总有一个 <code>old_logprobs</code> 张量。", "res": {"tag": "已核", "v": "这一页是本讲与你论文方向的直接接口：<b>LLM 的 RL 训练默认用 PPO</b>。而学习清单里那条验收标准——「能从 policy gradient 推到 PPO 的 clipped objective，并说清 GRPO 相比 PPO 去掉了什么（critic）、用什么代替（组内相对的 baseline）」——<span class='k'>前半在本讲 p3→p11 已经完整走通</span>；后半的 GRPO 不在本讲范围，要到 L10 与 DeepSeekMath 论文。把 p11 的代理目标与 GRPO 的目标并排写一遍，差别只在 Â 怎么来。", "ref": "本讲 p28；学习清单条目 5 的验收标准；GRPO 出处 Shao et al., DeepSeekMath, arXiv:2402.03300"}, "link": {"t": "你学过的对应：CS234 L10 TRPO（KL 这条线的理论源头，L09 的 RLHF 会用到）", "href": "../../reinforcement learning/theater/影片/L10-策略梯度III与TRPO.html"}}
];

var TH = {"title": "L05 接上课题的哪一段：当「用旧数据」坏掉时，先定位坏在哪一项", "arc": "这一讲表面在讲两个算法，底下讲的是<b>一个你每天都在面对的问题：手上有一批用旧配置跑出来的数据，还能不能用来评估新配置</b>。<br><br>本讲给出的答案不是「能」或「不能」，而是一套<span class='k'>定位 + 换件</span>的手法：p16 精确指出坏掉的是哪一项（自举项里「之后按谁走」说不清），p17–p18 只换那一项（V→Q，给动作开一个入口），p20 修补连带的第二处（策略更新里的动作改成现采）。<b>(s, a, r, s′) 一条都没扔。</b><br><br>这正是你简报 §4 那一节缺的东西。简报已经判定：确定性日志下 π_b(a|h) ∈ {0,1}，<span class='w'>IS 不是方差大，是无定义</span>。但「无定义」是对<b>整个估计量</b>说的——本讲提示的问法是：<b>拆开看，到底是哪一项无定义？</b>简报 §4e 自己其实已经给出了答案的一半：成本那一半近乎确定（预期 R² &gt; 0.95），可以直接回归，<span class='k'>完全不需要重要性权重</span>；真正需要 IS 的只有准确率那一半。这就是本讲「只换坏掉的那一项」在你问题上的具体落地。<br><br>与本课其余部分的接法：p11 的截断 → 你的搜索「对估计出来的目标最大化到什么程度才停」；p13 的默认超参 → 「提升不是调参调出来的」这类论证该怎么做对照；p28 的 LLM 接口 → L09、L10 两讲。", "pitfalls": [{"v": "<b>把 PPO 的截断当成「把步长调小」。</b> 它改的是目标函数的形状不是学习率：比值出界后那一项的梯度<span class='w'>变成 0</span>，不是变小。这个误解会让你在读 PPO 的消融实验时完全看错结论——调小学习率和调小 ε 做的是两件事。", "tag": "已核", "ref": "本讲 p11；讲稿「clip this ratio so that the ratio never exceeds some value」"}, {"v": "<b>以为 PPO 修好了「优势是旧的」。</b> 没有。p13 的第 2、3 步仍然只算一次，V̂ 与 Â 在 300 步梯度全程都不更新。<b>截断只是让「优势是旧的」不再致命</b>，它没有让优势变新。读 PPO 的失败案例时，这个区分很要紧。", "tag": "已核", "ref": "本讲 p7 与 p13 对照"}, {"v": "<b>把 GAE 当成 PPO 的必需件。</b> 课件把它列成「Trick #3」，但它与截断正交。<span class='k'>讲这门课的人自己对它持保留态度</span>：「它是不是必需的，也不是 100% 清楚」。你做消融时，这是一个可以独立拿掉的组件。", "tag": "已核", "ref": "本讲 p12；讲稿「not 100% clear if it's necessary in my opinion」"}, {"v": "<b>把「数据效率高」读成「跑得快」。</b> p23 那张图的横轴是<b>环境交互步数</b>。SAC 每一步交互背后的计算量远大于 PPO，而且 PPO 的采样段完全可并行。<span class='w'>在仿真里常常是 PPO 先跑完。</span>你报告自己方法的「效率」时，同一个坑在等着：省的是 token、是 GPU-秒、还是墙上时间，必须说清楚。", "tag": "推断", "ref": "本讲 p23；对照简报 §7 第 5 拳「成本口径不可信」"}, {"v": "<b>以为「换成 Q 就能用旧数据」是无条件的。</b> 课件留了一句 <code>sufficient action coverage</code>，讲稿里是「okay if a is <b>a bit</b> different」。<span class='w'>a bit 是有分量的</span>——旧策略没试过的动作，Q 在那里只是外推。这与你简报里的 deficient support 是同一个概念的两种说法。", "tag": "已核", "ref": "本讲 p18；简报 §4a"}], "ammo": [{"q": "你的搜索是在最大化一个估计出来的目标，怎么保证不是在拟合评估噪声？", "a": "本讲 p9–p11 给了一个<b>可以直接引用的先例</b>：PPO 面对的是同一个问题（Â 是一批数据估的，而优化会把它推到极端），解法不是「少走几步」而是<b>改目标函数的形状，让继续偏离不再有收益</b>。你可以据此说明自己的停止准则属于哪一类：是约束搜索（KL/信赖域那条线），还是拆掉动机（截断那条线）。<span class='k'>有先例可比，比自己发明一个说法更容易过审。</span>", "tag": "推断", "ref": "本讲 p9–p11"}, {"q": "为什么不用重要性采样评估你的新配置？", "a": "分两半答，这正是本讲「只换坏掉的那一项」的用法。<b>成本那一半</b>：给定保真度与输入长度，token 成本近乎确定，直接回归即可（预期 R² &gt; 0.95），<span class='k'>不需要任何重要性权重</span>——这是真实且可辩护的方差缩减。<b>准确率那一半</b>：确定性日志下 coverage 失效，IS 无定义，所以走 FQE + 5 折 cross-fitting，并用穷举 oracle 表当 ground truth。<b>把两半分开说，比笼统地说「IS 方差太大」强得多。</b>", "tag": "已核", "ref": "简报 §4e；本讲 p17–p20 的方法论"}, {"q": "你的实验是不是调参调出来的？", "a": "用本讲 p13 那组<b>公开默认超参</b>的做法做对照：PPO 的 ε=0.2、10 epoch、batch 64 是被反复复现的默认值。同理，你的基线应当跑<span class='k'>领域公认的默认配置</span>而不是自己扫出来的最优配置——前者更有说服力也更省算力。<b>反过来，若你的方法只在非默认参数下才赢，这本身就是必须报告的结果。</b>", "tag": "推断", "ref": "本讲 p13；简报 §7 第 6 拳"}], "papers": [{"t": "Proximal Policy Optimization Algorithms", "id": "arXiv 1707.06347", "why": "本讲 p11–p13 的原始出处。<b>要引的是它的问题设定而不是算法本身</b>：「用一批数据的估计目标做多步优化会过拟合，于是改目标函数的形状」。这句话在你的搜索场景里几乎可以原样复用。"}, {"t": "High-Dimensional Continuous Control Using Generalized Advantage Estimation（GAE）", "id": "arXiv 1506.02438", "why": "本讲 p12 的出处。<span class='w'>优先级不高</span>——讲这门课的人自己说它未必必需。除非你要做优势估计的消融，否则知道它在偏差-方差谱上的位置就够了。"}, {"t": "Soft Actor-Critic: Off-Policy Maximum Entropy Deep RL with a Stochastic Actor", "id": "arXiv 1801.01290", "why": "本讲 p22 点名的论文。与你当前课题关系较远（连续控制），<b>但它的熵正则思路与「保持探索」有关</b>，若你的搜索需要一个显式的多样性项，这是一个可引的先例。"}, {"t": "DeepSeekMath（GRPO 出处）", "id": "arXiv 2402.03300", "why": "<b>本讲没讲，但学习清单的验收标准点名了它。</b>把本讲 p11 的代理目标与 GRPO 的目标并排写一遍：结构相同，差别只在 Â 怎么来——GRPO 去掉 critic，改用组内相对的 baseline。<span class='k'>这一条验收的前半在本讲已经走通，后半要到 L10。</span>"}]};

(function(){
  var PDF="../corpus/slides/05_cs224r_offpolicy_actor_critic_2025.pdf", MAX=30;
  var frame=document.getElementById("pdf"), card=document.getElementById("card"),
      pnum=document.getElementById("pnum"), strip=document.getElementById("strip"),
      right=document.getElementById("right");
  var cur=0, map={}, cells=[];
  /* 科研格出处档位 → 类名。三档与 research/00-BRIEFING 的原始标注一致。 */
  var RESC={"已核":"t1","推断":"t2","待核":"t3"};

  /* 存档键带课程前缀 —— file:// 下所有本地页面共用一个 origin，
     两门课都用 "l01quiz" 会互相覆盖。 */
  var KEY = document.body.dataset.key;
  try {                       // 一次性迁移：早期版本用的是不带课程前缀的键
    if(!localStorage.getItem(KEY+"quiz")){
      var _old = localStorage.getItem("l05quiz");
      if(_old){
        localStorage.setItem(KEY+"quiz", _old);
        var _p = localStorage.getItem("l05p");
        if(_p) localStorage.setItem(KEY+"p", _p);
      }
      /* 搬完就把旧键删掉。不删的话它会一直躺在那儿，
         用户「清空全部记录」之后下次打开又被复活一遍。 */
      localStorage.removeItem("l05quiz");
      localStorage.removeItem("l05p");
    }
  } catch(e) {}

  N.forEach(function(n,i){ for(var p=n.r[0];p<=n.r[1];p++) map[p]=i; });

  for(var p=1;p<=MAX;p++){
    var b=document.createElement("b");
    b.title="第 "+p+" 页";
    if(map[p]!=null) b.className="has";
    b.onclick=(function(x){ return function(){ go(x); }; })(p);
    strip.appendChild(b); cells.push(b);
  }

  function navHtml(){
    return '<div class="nav"><button class="btn" id="p2">← 上一页</button>'+
           '<button class="btn" id="n2">下一页 →</button></div>';
  }
  function bindNav(){
    var a=document.getElementById("p2"), b=document.getElementById("n2");
    if(a) a.onclick=function(){ step(-1); };
    if(b) b.onclick=function(){ step(1); };
  }
  function render(p){
    var i=map[p];
    if(i==null){
      card.innerHTML='<div class="empty">这一页没有单独的讲解。<br>'+
        '它多半是上一页的<b>增量构建</b>——往前翻一页即可。</div>'+navHtml();
      bindNav(); return;
    }
    var n=N[i], multi=n.r[0]!==n.r[1], h="";
    h+='<span class="pg'+(multi?" multi":"")+'">p'+n.r[0]+(multi?"–"+n.r[1]:"")+'</span>';
    h+='<h2>'+n.t+(n.star?'<span class="star">'+Array(n.star+1).join("★")+'</span>':'')+
        qBadge(n.r[0])+'</h2>';
    if(n.quote) h+='<div class="quote">'+n.quote+'</div>';
    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**，所以加查询参数。
    frame.src=PDF+"?p="+p+"#page="+p+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
