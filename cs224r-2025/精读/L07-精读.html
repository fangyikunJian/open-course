<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS224R 第七讲 · 中文精读</title>
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --panel2:#FAF8F4; --sunken:#EDEAE3;
  --stage:#E9E6DF; --hover:#F0EDE6;
  --line:#E3DFD6; --line2:#D2CCC0;
  --dot:#DDD8CE; --dot2:#B9B1A2; --errdot:#D08A8A;
  --ink:#23272C; --ink2:#111417; --ink3:#4A525C; --dim:#616973;
  --acc:#0E7355; --acc2:#845808; --warn:#B23540; --blue:#1C6AA6;
  --mark:#FFF6DC; --codeink:#17506E; --eqink:#1E2833;
  --okink:#0B5B43; --noink:#8F2A33; --violet:#6A4BA3; --tintviolet:rgba(106,75,163,.07);
  --violetline:#D9CEEA; --warnline:#E0C6C9;
  --okfill:rgba(14,115,85,.10); --nofill:rgba(178,53,64,.09);
  --missbg:rgba(245,243,238,.97);
  --tintacc:rgba(14,115,85,.07); --tintacc2:rgba(14,115,85,.05);
  --tintblue:rgba(28,106,166,.06); --tintwarn:rgba(178,53,64,.05);
  --tintwarn2:rgba(178,53,64,.06);
  --lift:rgba(60,54,44,.022); --lift2:rgba(60,54,44,.028);
  --scrim:rgba(58,52,42,.40);
  --shadow:0 1px 2px rgba(40,34,20,.05), 0 6px 18px rgba(40,34,20,.05);

  --cjk:"PingFang SC","Microsoft YaHei","微软雅黑","Deng",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --bar:50px; --strip:36px;
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --panel:#121823; --panel2:#0d141c; --sunken:#0a0e14;
  --stage:#070a0f; --hover:#0d141c;
  --line:#212c3c; --line2:#2a3b4f;
  --dot:#18212e; --dot2:#2c3c52; --errdot:#7a3a3a;
  --ink:#e7eef7; --ink2:#f4f8fd; --ink3:#c3d2e3; --dim:#8b9ab0;
  --acc:#6fd3bb; --acc2:#f2bd63; --warn:#ff8f8f; --blue:#7fb8ff;
  --mark:#16202e; --codeink:#cfe3f5; --eqink:#dbe8f7;
  --okink:#d8fff4; --noink:#ffdede; --violet:#B48BF5; --tintviolet:rgba(180,139,245,.08);
  --violetline:#3b2f4f; --warnline:#4a2b2e;
  --okfill:rgba(111,211,187,.13); --nofill:rgba(255,143,143,.12);
  --missbg:rgba(10,14,20,.97);
  --tintacc:rgba(111,211,187,.09); --tintacc2:rgba(111,211,187,.07);
  --tintblue:rgba(127,184,255,.055); --tintwarn:rgba(255,120,120,.055);
  --tintwarn2:rgba(255,143,143,.08);
  --lift:rgba(255,255,255,.022); --lift2:rgba(255,255,255,.025);
  --scrim:rgba(6,9,13,.82);
  --shadow:0 10px 34px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.75}

#bar{height:var(--bar);display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{margin:0;font-size:14.5px;font-weight:650;white-space:nowrap}
#bar h1 span{color:var(--acc)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:7px;color:var(--dim);
  font:13px var(--cjk);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--acc);border-color:var(--acc)}
#pnum{width:48px;background:var(--sunken);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:13px var(--mono);text-align:center;padding:5px 0}
#bar .sp{flex:1}
#tot{font:12px var(--mono);color:var(--dim)}

#strip{height:var(--strip);display:flex;align-items:center;gap:2px;padding:0 14px;
  background:var(--sunken);border-bottom:1px solid var(--line);overflow-x:auto}
#strip::-webkit-scrollbar{height:0}
#strip b{flex:0 0 auto;width:13px;height:16px;border-radius:3px;background:var(--dot);
  cursor:pointer;font:0/0 a}
#strip b.has{background:var(--dot2)}
#strip b.on{background:var(--acc2)}
#strip b:hover{background:var(--acc)}

#main{display:flex;height:calc(100% - var(--bar) - var(--strip))}
/* 左栏 = 一块板，板中央摆一张 4:3 的幻灯片。
   幻灯片本身就是 363×272（4:3），把框裁成同样比例再用 view=FitH，
   这一页正好铺满框，下一页落到框外 —— 这样才是「一页」，
   而不是一个能上下滚、还露出半张下一页的阅读器。 */
#left{width:50%;min-width:280px;position:relative;background:var(--stage);
  display:flex;align-items:center;justify-content:center;padding:14px}
#stage{aspect-ratio:4/3;width:100%;max-width:100%;max-height:100%;
  border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:var(--shadow)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#drag{width:6px;cursor:col-resize;background:var(--line);flex:0 0 6px}
#drag:hover{background:var(--acc)}
#right{flex:1;overflow-y:auto;padding:24px 28px 40px}

.pg{font:11.5px var(--mono);color:var(--bg);background:var(--acc2);border-radius:999px;
  padding:2px 11px;font-weight:700;display:inline-block;margin-bottom:12px}
.pg.multi{background:var(--blue)}
h2{margin:0 0 14px;font-size:21px;font-weight:680;line-height:1.4}
/* 课件这一页自己说的话。放在最前面：先看原件怎么写，再看中文怎么讲。
   14px，低于讲解正文 15px —— 它是引文，不是结论。 */
.quote{font-size:14px;line-height:1.65;color:var(--ink3);font-style:normal;
  border-left:3px solid var(--acc2);padding:9px 0 9px 14px;margin:0 0 14px;
  background:linear-gradient(90deg,rgba(242,189,99,.07),transparent)}
.quote em{font-style:italic;color:var(--acc2)}
.quote b{color:var(--ink2)}
.one{font-size:16.5px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--acc);
  padding:9px 0 9px 14px;margin:0 0 16px;
  background:linear-gradient(90deg,var(--tintacc),transparent)}
ul{margin:0 0 16px;padding-left:0;list-style:none}
ul li{margin-bottom:11px;padding-left:22px;position:relative;line-height:1.72}
ul li::before{content:"";position:absolute;left:6px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--acc)}
b{font-weight:650;color:var(--ink2)}
.k{color:var(--acc);font-weight:650}
.w{color:var(--warn);font-weight:650}
code{font-family:var(--mono);font-size:.9em;background:var(--mark);padding:1.5px 6px;
  border-radius:4px;color:var(--codeink)}
.eq{display:block;text-align:center;background:var(--mark);border-radius:8px;padding:12px 8px;
  margin:14px 0;font-family:var(--mono);font-size:14px;color:var(--eqink);overflow-x:auto}
.say{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintblue);font-size:14px;line-height:1.72}
.say .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.tip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin:14px 0;
  background:var(--lift2);font-size:14px;line-height:1.72}
.tip .t{font-weight:700;color:var(--acc);margin-right:7px}
.tip.w2{border-color:var(--warnline);background:var(--tintwarn)}
.tip.w2 .t{color:var(--warn)}

/* 表格。ML 版那批自制笔记最有效的一件事就是表格密集 ——
   对比表 / 情况表 / 数值表。13.5px，与「解释」同档，低于正文。
   display:block + overflow-x:auto 是为了让窄窗口下表格**自己**横向滚，
   而不是把右栏撑破 —— 「右栏没有横向溢出」那条断言会量这个。 */
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:left;
  line-height:1.6;vertical-align:top}
.tbl th{background:var(--mark);color:var(--acc);font-weight:650;white-space:nowrap}
.tbl td b{color:var(--ink2)}

/* 页级科研连接。紫色 —— 与既有语义色不冲突（绿=结论 黄=引文 蓝=讲稿 红=警示）。
   tag 是出处档位，来自科研简报的原始标注，不许抹平成断言。 */
/* 「你学过的对应」。蓝 —— 与 .say（讲稿里补的）同族，两者都是「别处说过的话」。
   用的全是 theme.py 已有的变量，所以浅色暗色两套自动都成立。 */
.lnk{border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 15px;margin:12px 0;background:var(--tintblue);font-size:13.5px;line-height:1.7}
.lnk .t{color:var(--blue);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.lnk a{color:var(--blue);text-decoration:none;border-bottom:1px solid var(--blue)}
.lnk a:hover{opacity:.75}
.res{border:1px solid var(--violetline);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;
  padding:11px 15px;margin:14px 0;background:var(--tintviolet);
  font-size:14px;line-height:1.72}
.res .t{color:var(--violet);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px;
  letter-spacing:.5px}
.res .tag{font:11.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:7px;
  border:1px solid currentColor;letter-spacing:0}
.res .tag.t1{color:var(--acc)}
.res .tag.t2{color:var(--acc2)}
.res .tag.t3{color:var(--warn)}
.res .ref{display:block;margin-top:6px;font:11.5px var(--mono);color:var(--dim)}
.star{color:var(--acc2);font-size:14px;margin-left:8px;letter-spacing:1px}
.nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{flex:1;text-align:center;padding:9px}
.empty{color:var(--dim);font-size:14px;padding:36px 0;text-align:center;line-height:2}
#miss{position:absolute;inset:0;background:var(--missbg);z-index:5;display:none;
  padding:26px;color:var(--dim);font-size:13.5px;line-height:1.9}
#miss code{background:var(--mark);padding:2px 6px;border-radius:4px;color:var(--acc2)}


.qbadge{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;
  margin-left:9px;border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;font:11.5px var(--mono);color:var(--acc);cursor:pointer;
  background:var(--sunken);transition:border-color .12s}
.qbadge:hover{border-color:var(--acc)}

/* ── 自测 ── */
.quiz{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.quiz>h3{margin:0 0 12px;font-size:13px;color:var(--dim);letter-spacing:.16em;
  display:flex;align-items:center;gap:8px}
.quiz>h3 b{color:var(--acc2);font-weight:700}
.qq{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;
  background:var(--lift)}
.qq .t{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font:14px var(--cjk);padding:8px 12px;margin-bottom:7px;
  cursor:pointer;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--acc);background:var(--okfill);color:var(--okink)}
.opt.no{border-color:var(--warn);background:var(--nofill);color:var(--noink)}
.opt .m{float:right;font-weight:700;margin-left:10px}
.why{font-size:13.5px;line-height:1.7;color:var(--ink3);border-left:3px solid var(--acc);
  padding:8px 0 8px 12px;margin-top:9px;background:linear-gradient(90deg,var(--tintacc2),transparent)}
.qagain{background:none;border:0;color:var(--dim);font:12px var(--cjk);cursor:pointer;
  text-decoration:underline;padding:0;margin-left:auto}
.qagain:hover{color:var(--acc2)}
.qhist2{margin-top:8px;display:flex;align-items:center}

/* 科研主线卡。占的是上一版那个模态面板的槽位 —— 遮罩、居中盒、点背景关闭
   这套交互已经验过，换的是内容不是机制。 */
#threadPanel{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;
  align-items:center;justify-content:center;padding:28px}
#threadPanel.on{display:flex}
#threadBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:min(860px,100%);max-height:86vh;overflow:auto;padding:24px 26px}
#threadBox h3{margin:0 0 4px;font-size:18px}
#threadBox h3 .tag{font:11.5px var(--mono);color:var(--violet);border:1px solid var(--violet);
  border-radius:999px;padding:1px 8px;margin-left:8px}
#threadBox .arc{font-size:14.5px;line-height:1.8;color:var(--ink);margin:12px 0 18px;
  border-left:3px solid var(--violet);padding-left:14px;
  background:linear-gradient(90deg,var(--tintviolet),transparent)}
#threadBox h4{margin:18px 0 9px;font-size:13px;color:var(--dim);letter-spacing:.14em}
#threadBox ol{margin:0;padding-left:20px}
#threadBox li{margin-bottom:9px;font-size:14px;line-height:1.72}
#threadBox .q{color:var(--acc2);font-weight:650}
#threadBox .rf{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
#threadFoot{display:flex;gap:10px;margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line)}
#threadFoot .btn{flex:1;text-align:center}

@media (max-width:900px){
  #main{flex-direction:column} #left{width:100%;height:40%} #drag{display:none}
  #right{padding:16px 16px 30px}
}

/* ══ 双主题补丁：浅色下的可读性与质感 ══ */
html{color-scheme:light dark}
:root:not([data-theme="dark"]) #right{background:var(--bg)}
:root:not([data-theme="dark"]) .quiz,
:root:not([data-theme="dark"]) details,
:root:not([data-theme="dark"]) .opt{box-shadow:var(--shadow)}
:root:not([data-theme="dark"]) body{-webkit-font-smoothing:antialiased}
:root:not([data-theme="dark"]) h2{letter-spacing:-.1px}
:root:not([data-theme="dark"]) .one{font-weight:520}
:root:not([data-theme="dark"]) .pg{color:#fff}
:root:not([data-theme="dark"]) #strip b.on{background:var(--acc2)}
/* 主题切换按钮 */
#themeBtn{min-width:34px;text-align:center;font-size:14px;line-height:1}

</style>
</head>
<body data-key="cs224r-2025-l07">

<div id="bar">
  <h1>CS224R 第七讲 · <span>离线强化学习</span></h1>
  <button class="btn" id="prev">← 上一页</button>
  <input id="pnum" value="1" inputmode="numeric">
  <span id="tot">/ 33</span>
  <button class="btn" id="next">下一页 →</button>
  <div class="sp"></div>
  <button class="btn" id="threadBtn" hidden>科研主线</button>
  <a class="btn" id="openpdf" hidden target="_blank" rel="noopener"
     title="在新标签页打开原课件 —— 跨域 PDF 能不能内嵌取决于浏览器">原课件 ↗</a>
  <button class="btn" id="themeBtn" title="切换主题">☾</button>
  <button class="btn" id="help">打不开？</button>
</div>

<div id="strip"></div>


<div id="threadPanel"><div id="threadBox">
  <h3 id="threadTitle"></h3>
  <div class="arc" id="threadArc"></div>
  <div id="threadBody"></div>
  <div id="threadFoot"><button class="btn" id="threadClose">关闭</button></div>
</div></div>

<div id="main">
  <div id="left">
    <div id="stage"><iframe id="pdf" title="原课件"></iframe></div>
    <div id="miss">
      <p><b>左边没显示原课件？</b></p>
      <p>本页直接引用你本地的原件：<code>../corpus/slides/07_cs224r_offline_rl_2025.pdf</code>。</p>
      <p id="remotehint" hidden>线上这一份改指课程官网 / Internet Archive 的原件：
      <code id="remoteurl"></code>。若它打不开，多半是对方站临时不可达。</p>
      <p>确认文件在即可。若浏览器拦本地 iframe 读 PDF，在 <code>cs224r-2025</code> 目录下执行
      <code>python -m http.server 8080</code>，再访问
      <code>http://127.0.0.1:8080/精读/L07-精读.html</code>。</p>
    </div>
  </div>
  <div id="drag"></div>
  <div id="right"><div id="card"></div></div>
</div>

<script>

/* ══ 主题切换：浅色默认，记住选择 ══ */
(function(){
  var KEY = "mlreader-theme";
  var root = document.documentElement, btn = document.getElementById("themeBtn");
  function apply(t){
    root.setAttribute("data-theme", t);
    if (btn) btn.textContent = (t === "dark" ? "☀" : "☾");
    if (btn) btn.title = (t === "dark" ? "切到浅色" : "切到暗色");
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  apply(saved === "dark" ? "dark" : "light");
  if (btn) btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch(e){}
  });
})();

/* 每页一条。r:[起,止] = 这几页是同一张图的不同阶段，点哪页都显示同一条。
   one 一句话 · pts 要点 · say 讲稿里补的（课件上没有）· tip 提醒 */

/* ══ 题库。键 = 该单元的起始页；a 是正确项下标；why 是判完给的解释 ══ */
var Q = {
1: [{"q": "p4 的三种拟合值函数方式里，为什么只有第 ③ 种（对 Q 做 TD）能用旧策略的数据？", "o": ["因为 Q 函数的方差更小", "因为它的标签 r + γQ̂(s',a') 里，(s,a,s') 来自数据而 a' 是现场从 π_θ 采的 —— 对当前策略的依赖被收进了一个可以重采的位置", "因为它不需要自举", "因为 Q 比 V 多一个输入，表达力更强"], "a": 1, "why": "① 和 ② 的标签里含有「这个策略实际走出来的后续」，所以数据必须是当前策略采的。③ 把这个依赖换成了「给定 s'，从当前策略现场采一个 a'」—— 这个动作可以随时重采，所以 (s,a,s') 用旧数据无妨。这正是 L04 p31 那处修补。"}, {"q": "讲稿对第 ③ 种方式加了一句限定：we need this Q-function to be trained on actions that actually would resemble the actions that we're going to be evaluating it on。这个要求的根源是什么？", "o": ["神经网络的泛化能力有限", "奖励函数可能有噪声", "它是自举的 —— 标签 r + γQ̂(s',a') 里的 Q̂(s',a') 是自己算的，a' 落在没见过的地方时这个标签就是凭空编的", "数据集通常不够大"], "a": 2, "why": "讲稿把因果链说全了：because we're bootstrapping and using our own estimate of the value function at a given state as the label […] if our policy is very different from our set of old policies, this label will not be accurate。自举意味着标签的质量取决于估计在那个点上准不准。"}, {"q": "课堂上有人问 p5 那张图是不是 Q-learning。老师否认后补的那处差别是？", "o": ["Q-learning 必须是 on-policy 的", "Q-learning 用的是 V 而不是 Q", "Q-learning 的目标里不是从要学的策略采一个 a'，而是对所有 a' 取 max；而且它学的是最优策略的 Q，不是当前策略的 Q", "Q-learning 不需要回放缓冲区"], "a": 2, "why": "讲稿原话：instead of sampling from the policy that we're trying to learn a value function for, we tried to pick an action that was the best action according to that Q-function […] our goal here was to try to learn the Q-function for the optimal policy。p5 是 SAC。"}, {"q": "p3 的两句直觉句（策略梯度 vs Actor-Critic）之间的真正区别是？", "o": ["「高于平均」这个判断是从采样里现算，还是从学到的值函数里读出来", "一个有基线，一个没有", "一个是离散动作，一个是连续动作", "一个是 on-policy，一个是 off-policy"], "a": 0, "why": "两句话的结构完全一样（多做好的、少做坏的），差别在于「好不好」这个判断的来源：策略梯度用 reward-to-go 减基线，Actor-Critic 用学出来的 Q 或 A。今天要做的事是把两句里的「采数据」那一步拿掉。"}, {"q": "p6 的三个学习目标里，how offline RL can improve over imitation learning 为什么是本讲的立论前提而不是客套话？", "o": ["因为离线数据集最朴素的用法就是模仿学习，而模仿学习完全没有高估问题 —— 所以任何离线 RL 方法都必须回答「你凭什么比直接模仿好」", "因为模仿学习更简单，所以要先讲它", "因为模仿学习不需要奖励标签", "因为作业 3 要实现模仿学习"], "a": 0, "why": "模仿学习只在数据里的动作上做监督，天然不碰分布外动作。它是免费的安全基线，所以离线 RL 必须给出超过它的理由。p14–15 正面回答：奖励信息 + 拼接。"}],
7: [{"q": "p7 的三条理由里，第三条（reuse previously collected data rather than recollecting）在讲稿里的理由是关于什么的？", "o": ["关于环境的非平稳性", "关于算法开发流程：你每改一次算法就要重跑一次，如果每次重跑都要重采数据，迭代速度就被采样速度锁死了", "关于数据隐私", "关于奖励函数的可得性"], "a": 1, "why": "讲稿：probably, the first time you run the algorithm isn't—you still room for iteration on the algorithm itself. And generally, online data is more expensive than offline data for that reason, because offline data, you can reuse many times。这一条对做研究的人最贴。"}, {"q": "「离线 RL 是在线离策略 RL 的一个特例」—— 老师的回答是？", "o": ["完全错误，两者的目标函数不同", "完全正确，离线 RL 就是缓冲区不更新的 SAC", "从算法形状上看是对的，但有一处不是特例：纯离线设定下你没有能力再采数据，而在线离策略可以", "取决于数据集是否来自单一策略"], "a": 2, "why": "讲稿先肯定（that's a correct way to view it），再只否认一处（you have no ability to collect more data. And in that sense, it's not really a special case of online RL）。这个「不能」不是程度差别而是能力差别，它让一切「错了可以再试」的论证失效。"}, {"q": "p8 在括号里注明 π_β may be a mixture of policies。讲稿给出的「不必为此多写一套记号」的理由是？", "o": ["混合策略在实践中很少见", "数据集会标注每条轨迹来自哪个策略", "混合策略的加权和本身也是一个策略，所以写成单一 π_β 不损失一般性", "可以假设各个策略足够相似"], "a": 2, "why": "讲稿：you can define that mixture as some average or weighted sum over some constituent policies. So we don't lose any generality by saying that it's collected by a single policy。"}, {"q": "讲稿补的那句「动力学在数据与部署之间是相同的」有什么作用？", "o": ["说明可以用模型学习的方法", "说明奖励函数可以忽略", "把「分布偏移」的来源钉死在策略差距上 —— 偏的只有轨迹分布，而它之所以偏只因为策略不同，不是因为环境变了", "说明环境必须是确定性的"], "a": 2, "why": "原话：the distribution shift is only for these trajectories. It's only caused by the shift in the policy。这把离线 RL 和 sim-to-real、非平稳环境这些问题区分开了，也解释了为什么所有方法都围着 π_β 转：病根在策略差距上，药就只能下在那里。"}, {"q": "「如果数据集足够全面，学到的策略分布会和行为策略分布相同吗？」", "o": ["会，只要数据集覆盖了全部状态-动作对", "取决于折扣因子", "会，只要用足够大的神经网络", "一般极少发生：你本来就想比数据里的平均水平好，那就必然收窄到一个更好的子分布；就算 π_β 已经很好、你退化成在做模仿，也仍会漂移"], "a": 3, "why": "讲稿：Generally, that's extremely rare. Generally, that doesn't happen。两重理由：想变好 ⇒ 必然偏；不想变好 ⇒ L02 的复合误差仍会让你漂移。分布偏移是「想变好」的直接后果，不是数据不够多造成的。"}, {"q": "p9 的四种数据来源里，哪一种最可能让后面 AWR 那类方法退化成普通模仿学习？", "o": ["手工设计的控制器采的数据 —— 它常常是确定性的，动作分布极窄", "以前的 RL 跑出来的数据", "多种来源的混合", "人采的数据（多人混合）"], "a": 0, "why": "p18 的思考题正是问这个：若 π_β 确定，则从每个状态只见过一个动作，经验回报就等于值函数，优势全为 0，exp(0)=1，带权模仿退化成普通模仿。手工控制器正是这种情形的典型。"}],
10: [{"q": "p11 的那个正反馈环里，「策略更新」这一步扮演的角色是？", "o": ["它偶然会挑到被高估的动作", "它会主动去搜索估计误差最乐观的那个角落 —— 因为它的目标就是 argmax Q̂，而 Q̂ 的误差在支撑外最大", "它会把 Q 的误差平均掉", "它只影响探索，不影响 critic"], "a": 1, "why": "讲稿用的动词是 exploit：your policy will exploit those inaccuracies on the out of distribution actions。这不是运气不好，是优化器在高效地找模型最乐观的地方 —— 任何「拿学出来的模型当目标去优化」的场合都会这样。"}, {"q": "L06 p21 的高估和 L07 p11 的高估，病灶的区别在哪？", "o": ["两者其实是同一回事", "L06 是连续动作，L07 是离散动作", "L06 的 max 作用在支撑内（根源是有限样本噪声 + 同一网络既选又评），L07 的 argmax 跑到了支撑外（根源是那里压根没有标签）", "L06 用了目标网络，L07 没有"], "a": 2, "why": "因此药也不同：双 Q 是为 L06 那种情形设计的，但在 L07 里帮不上多少 —— 两个网络在同一片没数据的区域上都在瞎编，取较小的那个仍然是瞎编。L07 的药只能是「别去支撑外」或「把支撑外压低」。"}, {"q": "⭐ 课堂上有人问「能不能干脆把分布外动作排除掉」。这个方案的致命障碍是？", "o": ["计算量太大", "这会让 Q 函数不可微", "需要知道奖励函数", "我们并不知道什么是分布内、什么是分布外 —— 手上只有样本，而在连续状态空间里「支撑」不是一个能枚举出来的集合"], "a": 3, "why": "老师举的例子：状态 s₁ 只见过 a1，很相似但不相同的 s₂ 只见过 a2，那 (s₁,a2) 算分布内还是分布外？逐字匹配说不在，泛化说在，而你没有那个真正的支撑集。这句话决定了后半讲所有方法都不去显式判断分布内外。"}, {"q": "p11 右下角的 Another perspective: learned policy deviates too much from behavior policy，这个「换一个视角」的价值在哪？", "o": ["它说明应该用更大的网络", "它说明问题其实不严重", "它说明应该增加探索", "它把一个难以直接控制的量（Q 的误差）换成了一个可以直接约束的量（π_θ 与 π_β 的距离）"], "a": 3, "why": "第一族方法走的就是这条路：不去修 Q，而是约束策略别离 π_β 太远。讲稿：if we stayed closer to the behavior policy, then we wouldn't have this issue。"}, {"q": "「离散动作空间是不是就没有这个问题？」", "o": ["原则上若每个状态都覆盖了全部动作就没问题，但实践中总有状态没覆盖全 —— 所以离散不是豁免，只是把「覆盖够不够」变成了可以数出来的量", "取决于动作数是否超过状态数", "不是，离散动作下问题更严重", "是，离散动作下一切都在分布内"], "a": 0, "why": "讲稿：in practice, usually, there will be states, where you don't have full coverage of all actions. And you can still see overestimation in those states。连续动作连「数一数」都做不到。"}, {"q": "为什么不走「显式学一个 π̂_β 的密度模型，再约束 KL(π_θ‖π̂_β) < ε」这条最直接的路？", "o": ["那等于要求先把支撑估出来，而密度估计本身就难、其误差会原封不动变成约束的误差；而且每步要解一个带约束的优化", "KL 散度不可微", "π_β 是未知的，所以无法定义 KL", "因为 KL 约束只适用于 on-policy 方法"], "a": 0, "why": "p25 特意标明 without explicitly modeling the behavior policy。而 p16 的小字说优势加权目标「近似」一个 KL 约束目标 —— 注意是不用显式建模 π_β 地近似，这是第一族方法最漂亮的地方。"}, {"q": "p10 标题里的 (e.g. say data collected by a mediocre policy) 为什么不是随口举的例子？", "o": ["因为这是作业 3 的数据集设定", "因为 mediocre 策略的 Q 函数最好估", "因为 mediocre 的数据噪声最大", "因为 π_β 若已最优就该直接模仿、若太糟则数据里也没有好行为可拼接 —— 离线 RL 的用武之地恰恰是这个中间带"], "a": 3, "why": "数据里有好片段也有坏片段，而你想要的是只学好的那部分并把好片段接起来。p14 那张 s1→s9 的图画的就是这件事。"}],
12: [{"q": "p12 整页只有一句话 This is the core goal of offline RL methods!。它用的动词是 mitigate 而不是 solve，这个用词准确吗？", "o": ["不准确，IQL 的 Never need to query OOD actions! 说明问题已解决", "准确 —— 两族方法都留下了代价：第一族的上限被数据锁住，第二族引入了一个要调的 α；p32 最后一行写着 Still an active area of research!", "不准确，CQL 已经彻底解决了高估问题", "准确，因为高估问题在理论上不可解"], "a": 1, "why": "没有一族把问题消掉。第一族只在数据里的动作上监督策略，所以永远不会提出数据外的动作（优点也是天花板）；第二族压太轻没效果、压太狠把一切压平。"}, {"q": "「Implicit policy constraint」这个名字里的 implicit 具体指什么？", "o": ["约束只在训练初期生效", "不写出任何 KL 约束项、也不学 π_β 的密度模型，而是通过「只在数据里的动作上做监督」自动达到「别离 π_β 太远」的效果", "约束由神经网络自己学出来", "约束是近似的，所以不保证满足"], "a": 1, "why": "p16 给出的目标只有一行带权模仿，没有 π̂_β、没有约束求解器，而约束的效果在那儿。小字说明它可以被证明近似一个 KL 约束目标。"}, {"q": "讲稿在走进第一族之前先说了一段关于模仿学习的话，它为什么是第一族的全部动机？", "o": ["因为模仿学习不需要折扣因子", "因为模仿学习只用数据里的动作做监督，所以天然不碰分布外动作 —— 不是因为它检测了什么，而是因为它的监督信号里只有数据里的动作", "因为模仿学习的收敛性有保证", "因为模仿学习更容易实现"], "a": 1, "why": "原话：any approach that uses imitation learning is going to be avoiding out-of-distribution actions, somewhat implicitly because you're only going to be supervising with actions that are in the data。第一族的思路就是保留这个天然安全的骨架、再把奖励信息塞进去。"}, {"q": "p14–p23 这六页的进展路线，一直在改的是哪一样东西？", "o": ["回放缓冲区的大小", "策略网络的结构", "折扣因子的取值", "优势怎么估 —— 骨架（带权模仿）一步没动：筛轨迹 → 按优势加权 → MC 估（AWR）→ 自举估且 a' 从数据采（AWAC）→ 不对称损失（IQL）"], "a": 3, "why": "五步改的都是「怎么估那个权重」。这也是为什么 p18–19 的 AWR 值得仔细读：IQL 的策略提取那一步用的正是 AWR。"}, {"q": "p13 右边那个 Part of homework 3! 的花括号括住了第 2 与第 3 项，这暗示了什么？", "o": ["作业 3 要实现两族各一个代表：IQL（p23）与 CQL（p28）", "作业 3 要实现 Filtered BC 与 AWR", "作业 3 只要求理解不要求实现", "作业 3 要实现全部五个算法"], "a": 0, "why": "p23 写着 You will implement IQL in homework 3!，p28 写着 You will implement CQL in homework 3!。所以按作业的重要性分配注意力，p20–23 与 p25–28 是两个重心。"}, {"q": "「两族方法是互斥的」这个说法对吗？", "o": ["不对 —— IQL 里既有「只用数据里的动作」这个隐式约束，也有一个不对称损失在做有方向的偏移；分法是为了讲清楚，不是硬边界", "对，一个改策略目标、一个改 critic 目标，不能同时用", "不对，因为 CQL 其实也是一种带权模仿", "对，因为它们的理论保证不兼容"], "a": 0, "why": "IQL 那个不对称本质上是一种有方向的偏移，只不过方向是乐观的 —— 它故意高估 π_β，因为目标是估一个比 π_β 更好的策略的值。"}],
14: [{"q": "p14 的三行箭头（数据可能不最优 → 能靠奖励超过行为策略 → 好方法还能拼接）之间是什么关系？", "o": ["一个推理链，而且后两层量级不同：第二层让你超过「数据里的平均」，第三层让你超过「数据里最好的那一条」", "按历史发展顺序排列", "按实现难度排序", "三个并列的好处"], "a": 0, "why": "第一行是前提（若数据已最优就该直接模仿）。第二层靠奖励信息做筛选/加权，第三层靠值函数把不同轨迹的片段组合出一条新轨迹 —— 后者产生的是数据集里根本不存在的行为。"}, {"q": "拼接之所以可能，机制上靠的是什么？", "o": ["奖励是稠密的", "策略网络足够深", "值函数是「状态」的函数而不是「轨迹」的函数 —— 于是一条坏轨迹的好前缀依然能被正确估值、当成素材用", "数据集足够大"], "a": 2, "why": "模仿学习把轨迹当整体看（这条好/这条坏），所以坏轨迹的好前缀被整条扔掉了。值函数只问「从这个状态出发往后能拿多少」，于是前缀可以独立评价。"}, {"q": "Filtered behavior cloning 为什么拼不起来？丢素材是在哪一步？", "o": ["在筛选那一步 —— 筛选的单位是整条轨迹，r(τ) 低于 η 整条扔掉，而拼接需要的恰恰是「坏轨迹的好前缀」", "在计算 r(τ) 那一步 —— 回报求和丢失了时间信息", "在模仿那一步 —— 对数似然无法表达多峰分布", "它其实能拼接，只是效率低"], "a": 0, "why": "粒度不匹配。所以 p16 做的第一件事就是把加权粒度从「轨迹」降到「单个 transition」—— 这一步降粒度正是拼接能力的来源。"}, {"q": "讲义把 Filtered BC 评为 a good baseline to test against!，这句话该怎么读？", "o": ["它只适合离散动作空间", "认真的建议：它几乎没有超参、不会发散、二十行能实现，而离线 RL 文献里被它打败的复杂方法并不少；p32 把它列在「只想纯离线训练」的第一行", "客套话，实际上它表现很差", "它是作业 3 要实现的算法"], "a": 1, "why": "讲稿：it's good to try this first and see how well it does, and use that as a benchmark […] try to make sure that your offline RL method is doing better than this。"}, {"q": "普通模仿学习在「两条轨迹分叉」的状态上会学到什么？这和 L02 的哪条结论是同一件事？", "o": ["学到回报更高的那个方向 —— 对应 L02 的 DAgger", "学到一个随机混合策略 —— 对应 L02 的复合误差", "无法收敛 —— 对应 L02 的不可辨识", "学到两个方向的平均 —— 就是 L02 p10 那条「ℓ2 回归的解是条件均值」"], "a": 3, "why": "讲稿原话：in this state, it will take the average between these two action distributions。L02 里这条事实的后果是「绕障碍物时直撞过去」，这里的后果是「既不走向好结局也不走向坏结局」。同一个数学事实，两个灾难。"}, {"q": "课堂问「拼接是否要求两条轨迹经过同一个状态」。答案与它的限定是？", "o": ["要求严格相同，否则值函数无法共享信息", "不要求，因为值函数是表格表示的", "不要求严格相同（靠神经网络对相似状态的泛化），但效果取决于那些状态有多接近、数据集有多大 —— 所以它是强度连续的性质而非开关", "要求状态相同且动作也相同"], "a": 2, "why": "老师特意说 I actually tried to have S7 and S3 not be exactly the same state，然后加限定：the degree to this how well this works will depend on how close those states are and how large the data set is。"}],
16: [{"q": "p16 那一行目标相对 Filtered BC 做了「两处」降粒度，分别是？", "o": ["从 on-policy 降到 off-policy；从确定性降到随机性", "从 V 降到 Q；从 MC 降到 TD", "从 KL 约束降到权重；从显式降到隐式", "从筛选降到加权（二值→连续）；从轨迹降到 transition（整条→单步）"], "a": 3, "why": "第一处让「不太好但不坏」的数据也能贡献信息；第二处才是拼接能力的来源。讲稿一句话里说了两处：weight our imitation learning objective based on how good the action was in that transition。"}, {"q": "权重为什么取 exp(A) 而不是 A 本身？", "o": ["因为 exp 让梯度更大，收敛更快", "因为权重必须非负：直接用 A 会让负优势样本变成「最小化其似然」，那是在主动降低数据里某些动作的概率、容易把策略推到数据外；exp 把它换成「权重小但仍非负」", "因为 A 可能是无界的", "因为 exp 让目标变成凸的"], "a": 1, "why": "少学，而不是反着学。更深一层的理由是那条 Aside：exp(A/α) 正是「在 KL 球内最大化 Q」这个约束问题解的形状（Gibbs 变分原理那一类）。"}, {"q": "p16 的 Aside 说优势加权目标 approximates 一个 KL 约束目标。这条小字的正确用法是？", "o": ["它给出了一个严格的约束保证，可以直接在论文里引用", "它说明优势加权和 KL 约束完全等价", "它只是历史背景，没有实质内容", "它解释了 exp 的来历、让这个目标不显得像个 hack；但讲义写的是 approximates 而非 equals，近似的条件没说，要引用必须回去读 Peters et al. 与 Rawlik et al. 原文"], "a": 3, "why": "老师明确说 we won't go through the derivation。讲义给的两条出处是可靠的入口，但「近似」的具体条件必须自己去核。"}, {"q": "「implicit policy constraint」这个名字里的隐式，在 p16 这一行上具体体现为？", "o": ["约束由一个额外的神经网络学出来", "没有 π̂_β 的密度模型、没有 KL 项、没有约束求解器 —— 只需要数据里的 (s,a) 和一个优势估计，而约束的效果达到了", "约束是通过早停实现的", "约束只在训练后期生效"], "a": 1, "why": "直接解那个带约束的问题要先有 π_β 的密度模型，而 p11 的问答已说明那条路难走（密度估计的误差会原封不动变成约束的误差）。"}, {"q": "p17 把 Advantage of which policy? 放在 How to estimate 之前，为什么这个顺序重要？", "o": ["因为要先确定折扣因子", "因为「优势」是相对某个策略定义的（A^π = Q^π − V^π），π 换了同一个 (s,a) 的优势就不一样 —— 先定下是谁的优势，才能谈怎么估", "因为优势函数的估计方法取决于动作空间是否连续", "因为这决定了用 MC 还是 TD"], "a": 1, "why": "讲义选的是 A^{π_β}（用行为策略的优势），好处是数据正好来自 π_β、估它是干净的 on-policy 回归；坏处在 p19 写明：Â^{π_β} is for weaker policy than Â^{π_θ}。"}, {"q": "「这一行目标不碰分布外动作」这个说法管的范围是？", "o": ["管整个算法 —— 所以 AWR/AWAC/IQL 都绝对安全", "只管 V 的拟合，不管策略", "只管策略目标（log π_θ 里的 a 与权重里的 (s,a) 都来自 D）；优势是怎么估出来的要分别检查 —— p18 的 MC 也不碰，p20 的自举就有风险，所以才要把 a' 改成从 D 采", "只在离散动作空间下成立"], "a": 2, "why": "「不碰 OOD」这个性质必须在每一处分别检查，不能从策略目标推广到整个算法。这也是 AWAC 那一处改动的全部理由。"}, {"q": "讲稿里老师用 p14 的图算优势时，V(s3) 是怎么来的？这揭示了优势能分辨好坏的前提是什么？", "o": ["V(s3) 由折扣因子决定，前提是 γ < 1", "V(s3) 由值函数网络直接预测，前提是网络容量足够", "V(s3) 等于较大的那个 Q，前提是数据无噪声", "V(s3) 是两个结果的平均（因为 π_β 在这个状态上两边都走）—— 所以优势能分辨好坏的前提是 π_β 在那个状态上有过多样的行为"], "a": 3, "why": "原话：the value of this state will be the average of those two outcomes。这个前提在 p18 的思考题里被推到极端：若 π_β 在每个状态只做一件事，优势就全是 0。"}],
18: [{"q": "AWR 第一步为什么可以直接用蒙特卡洛拟合 V^{π_β}，而不必担心 L04 讲过的那些分布不匹配问题？", "o": ["因为蒙特卡洛是无偏的", "因为用了目标网络", "因为估的是 π_β 的值函数，而数据正好就是 π_β 采的 —— 这是一个干净的 on-policy 回归问题", "因为离线数据集很大"], "a": 2, "why": "讲稿：The data is coming from the policy that we're trying to evaluate a value function for。数据量只是额外的理由，不是根本理由。"}, {"q": "p18 思考题：若 π_β 是确定性的，AWR 会学到什么？推理链是？", "o": ["会发散，因为优势无界", "每个状态只见过一个动作 ⇒ 回归目标只有一个点 ⇒ V̂ = 经验回报 ⇒ 优势恒为 0 ⇒ exp(0)=1 ⇒ 退回普通模仿学习", "会学到最优策略，因为没有分布偏移", "会学到一个随机策略，因为权重退化成均匀分布"], "a": 1, "why": "而老师对这个退化给出肯定评价：数据里从没出现过别的动作，你凭什么知道别的动作更好？算法往「安全」那一边退化，这是好性质。"}, {"q": "这个退化情形为什么不是人为的边角情形？", "o": ["因为人类采的数据也是确定性的", "因为折扣因子通常取 1", "因为 p9 列的数据来源里，「手工设计的控制器采的数据」常常就是确定性的（某些车道上永远直行）—— 于是「动作多样性」不是加分项而是离线 RL 能起作用的前提条件", "因为所有数据集都是确定性的"], "a": 2, "why": "讲稿正面回答过这个追问：generally having more diverse actions represented in your offline data set is good for offline RL […] then you definitely want variability。"}, {"q": "讲稿那个 +10 / +1 / −5 的算例里，老师口算的 V̂ 是「that is 3, I think」。这处对吗？", "o": ["对，(10+1−5)/3 = 3", "不对，应该是 5，因为要去掉负值", "不对，(10+1−5)/3 = 2；后面给的优势 7/−2/−8 与 V=3 自洽，所以错的是那一步口算。按 V=2 是 8/−1/−7，而且三者之和正好为 0，符合「优势在 π_β 下的期望为 0」", "无法判断，取决于折扣因子"], "a": 2, "why": "结构完全不受影响，但这条「优势加权和为 0」的性质值得记住：它是你自己算优势时的免费检查 —— 若某状态上所有动作的优势加权平均不为 0，那 V̂ 就没拟合好。"}, {"q": "p19 的两条缺点里，哪一条是原理上的天花板而不是工程问题？", "o": ["Â^{π_β} is for weaker policy than Â^{π_θ} —— 你在拿一个比自己弱的策略的标准判断好坏，所以改进幅度被 π_β 的视野限住", "两条都是工程问题", "Monte Carlo estimation is noisy —— 这是原理上无法改善的", "两条都是原理问题"], "a": 0, "why": "第一条换估计方式就能改善（p20 换成自举）。第二条要等 p21 那一问 Can we estimate Q for a policy that is better than π_β? 才被撬开，答案是 IQL 的不对称损失。"}, {"q": "温度超参 α 的两端分别对应什么已知方法？", "o": ["α→∞ 对应 Q-learning；α→0 对应 SAC", "α→∞ 对应普通模仿学习（权重全为 1）；α→0 对应「只学优势最高的那些样本」，即 Filtered BC 的单步版本", "α→∞ 对应 Filtered BC；α→0 对应普通模仿学习", "两端都对应 AWR 本身，α 只影响收敛速度"], "a": 1, "why": "所以 L02 / p15 / p16 这三个方法不是三个独立的点，而是同一个目标在一个超参的三个取值。这也解释了为什么 p32 把 Filtered BC 推荐成「第一个该试的」—— 端点往往最稳。"}, {"q": "讲稿说优势函数在数据外的动作上「might be arbitrarily incorrect」，那 p19 那个 + 号（Avoids querying or training on any OOD actions）的真正含义是？", "o": ["优势函数被显式约束在数据支撑内", "不是「模型在数据外也准」，而是「我们从不在数据外评估它」—— 安全来自使用方式，不来自模型本身", "优势函数在数据外也是准的，因为神经网络能泛化", "数据外的动作被预处理剔除了"], "a": 1, "why": "原话：in this objective, we're actually only evaluating it on actions in the data set. And so you don't have any issues with going outside the support. Now, if you did evaluate it on actions outside the data set for a different reason, then it would be not accurate。"}],
20: [{"q": "AWAC 相对 AWR 的全部改动是什么？它为什么几乎是免费的？", "o": ["把 MC 换成 GAE；因为 GAE 只是一个加权和", "把 V 换成 Q；因为 Q 只是多一个输入", "引入了目标网络；因为目标网络只是参数的拷贝", "把自举目标里的 a' 从「策略采样」改成「数据集里那条样本实际的下一个动作」；因为数据集里本来就存着相邻的 (s,a,r,s',a')，连采样都不用"], "a": 3, "why": "换来的东西很实在：自举目标里每个 (s',a') 都是数据里真实出现过的对，分布外动作被结构性排除。而且讲稿指出这些 (s',a') 的 Q 是被别的样本监督着的，所以读它不是在读一个编出来的数。"}, {"q": "讲义用一个带星号的 *not* 标出 Gives Q-function estimate for π_β […] *not* π_θ。为什么会是 π_β 的？", "o": ["因为数据集是 π_β 采的", "因为 Bellman 方程里「下一步动作服从谁」决定了算出来的是谁的 Q —— 而这里 a' 来自 π_β", "因为 Q 网络用 π_β 初始化", "因为折扣因子按 π_β 校准"], "a": 1, "why": "所以 AWR 的第二条缺点（Â^{π_β} is for weaker policy）并没有被 AWAC 修掉。AWAC 修的是方差那一条，天花板那一条留给了 IQL —— 一次只修一个。"}, {"q": "⭐ p21 把 γ·Q(s',a') 重新解读成「V^{π_β}(s') 的一个样本」。这个重新解读为什么能打开新路？", "o": ["因为它说明 Q 比 V 更基本", "因为它说明自举目标有偏", "因为一旦把它看成「从样本估一个统计量」，就可以问：凭什么非得估均值？换损失就能估别的统计量", "因为它说明应该用更多样本"], "a": 2, "why": "V^{π_β}(s') = E_{a'∼π_β}[Q(s',a')]，而数据里那个 a' 正是从 π_β 采的，所以每条数据提供的 Q(s',a') 都是这个期望的一次抽样。ℓ2 损失回归一堆样本得到均值，那正好就是 V^{π_β}。"}, {"q": "「ℓ2 给的是均值」这件事，是关于什么的事实？", "o": ["关于数据分布的事实 —— 数据近似高斯", "关于值函数的事实 —— V 的定义就是期望", "关于 ℓ2 损失的事实，不是关于 V 的事实：min E[(v−x)²] 的解是 v = E[x]。换损失就换统计量", "关于神经网络的事实 —— 网络倾向于输出平均值"], "a": 2, "why": "这也是 L02 那条「ℓ2 的解是条件均值」在本讲的第三次起作用（p14 分叉状态、p16 的 V 是两个结果的平均、p21 这里）。IQL 的贡献很大一部分就是意识到这个默认后果恰好不是我们想要的。"}, {"q": "p21 要的是 best policy in data support，而不是「所有策略里最好的」。这个限定为什么重要？", "o": ["因为直方图里那个高分位仍然由数据里出现过的动作撑起来 —— 它是那些动作中较好的一撮，不是某个没人试过的动作；所以这个「乐观」和 p11 那种指向支撑外的乐观完全不同", "因为数据支撑内的策略类更小，泛化更好", "因为计算全部策略的最优太慢", "因为支撑外的策略在物理上不可实现"], "a": 0, "why": "p11 的乐观指向支撑外（没有根据，是灾难），这里的乐观指向支撑内的高分位（有数据支撑，只是取了一个偏高的统计量）。"}, {"q": "p21 那行 AWAC 更新式里没有 max、也没有策略网络参与。这带来的工程好处是？", "o": ["critic 训练完全不需要策略，于是可以先独立训到收敛再训策略 —— 这就是 p23 那条 Decoupling actor & critic training —> computationally fast", "可以用更大的学习率", "可以用表格表示", "可以省掉回放缓冲区"], "a": 0, "why": "不用在每一步前向一次策略网络去采 a'，也不用担心 actor 与 critic 互相拖累。副产品是好调试：可以单独看 critic 的损失曲线判断它学没学好。"}],
22: [{"q": "期望分位损失 ℓ^λ_2(x) = (1−λ)x² 若 x<0、否则 λx²。在 p23 里 x = V(s) − Q̂(s,a)，取 λ < 0.5 的效果是？", "o": ["低估罚得重（系数 1−λ > 0.5）、高估罚得轻 ⇒ 解被往上推 ⇒ V 落在 Q̂ 分布的高分位", "两边罚得一样，λ 只影响学习率", "高估罚得重、低估罚得轻 ⇒ 解被往下压 ⇒ V 落在低分位", "解不存在，因为损失非凸"], "a": 0, "why": "与 p23 上写的 using small λ < 0.5 一致。自己检查的最快办法：看哪一支系数大，那一支对应的错误就是「不许犯」的，于是解往另一边躲。λ 小 ⇒ 1−λ 大 ⇒ 不许低估 ⇒ 解往上躲。"}, {"q": "讲稿里老师说到这个方向时先停下来说 let me just remember what the direction is，中间还有一个 sorry。这说明什么？", "o": ["幻灯上的公式写错了", "他对这个损失不熟", "这个方向本来就容易弄反 —— 所以不该背，要能从损失的系数现场推出来；他改口之后说的是对的", "λ 的定义在文献里不统一，所以无法确定"], "a": 2, "why": "改口之后的表述（Downweighting it when it's above 0, and upweighting it when it's less than 0）与幻灯一致、也与 λ<0.5 给高分位一致。顺带：讲稿里的 expected regression 与 different tiles 都是 ASR 把 expectile / expectiles 听错了。"}, {"q": "为什么用平方的不对称版（expectile）而不是绝对值的不对称版（分位回归）？", "o": ["因为分位损失在 x=0 处不可微、且梯度大小与误差无关（永远是 ±τ），用它训网络大误差小误差推得一样狠；expectile 损失处处可微、梯度与误差成正比，就是一个「两边系数不同的 MSE」", "因为分位回归需要排序，复杂度 O(n log n)", "因为分位数在高维下没有定义", "因为 expectile 的统计效率更高"], "a": 0, "why": "这是一个「为了能插进现有训练流程而做的选择」：实现上改两行，学习率与早停经验都能沿用。"}, {"q": "期望分位（expectile）与分位（quantile）的关系可以怎么记？", "o": ["expectile 是 quantile 的离散化版本", "expectile 只对高斯分布有定义", "两者完全等价，只是记号不同", "expectile 是「均值」的推广（λ=0.5 给均值），quantile 是「中位数」的推广（τ=0.5 给中位数）"], "a": 3, "why": "形式上也对应：分位损失用绝对值的不对称版 (τ−𝟙[x<0])·x，期望分位用平方的不对称版 |λ−𝟙[x<0]|·x²。"}, {"q": "这个「有方向的乐观」和 L06/CSE541 那条「不要直接信 argmax」为什么不冲突？界限在哪？", "o": ["区别在「高」的来源：赢家诅咒里的高来自噪声（没有根据，必须折），这里的高来自数据里确实有好动作（有根据，可以取）。界限由那个状态上数据有多少动作决定 —— 只有一两个动作时两者就区分不开了", "因为 expectile 回归是无偏的", "两者其实冲突，讲义没有处理这个矛盾", "因为赢家诅咒只在离散动作下成立"], "a": 0, "why": "这也解释了为什么 λ 不能取到 0：讲稿说 if you set lambda to be 0, then you will overestimate probably，典型取值要留在中间带。"}, {"q": "照抄 IQL 代码时关于 λ / τ 有一处记号陷阱，是什么？", "o": ["λ 必须取 0.5 才稳定", "讲义的 λ 与原论文的 τ 是同一个量，可以直接互换", "原论文没有这个超参", "讲义里「λ 小 = 高分位」，而原论文用 τ 并取「τ 大 = 高分位」—— 因为误差符号定得相反（V−Q 还是 Q−V）。看到具体数值时先看清定义里误差是哪个方向"], "a": 3, "why": "两者并不矛盾，差别只在误差 x 的符号怎么定。这一条讲义没写，是对照记号推的。"}],
23: [{"q": "IQL 三式各管什么？", "o": ["① 和 ② 可以互换顺序，③ 必须最后", "① V 做策略改进（取高分位=偏向好动作） ② Q 做评估与传播（往前传一个 Bellman 步） ③ 策略做提取（把已藏在 Q−V 里的改进蒸馏成网络，不产生新改进）", "① V 做策略评估 ② Q 做策略改进 ③ 策略做提取", "三式都在做策略评估，改进完全由 AWR 那一步完成"], "a": 1, "why": "所以 IQL 的「厉害」全在 ① 那个不对称损失上。③ 与 p16/p19 的 AWR 完全相同 —— AWR 不是被淘汰的旧方法，它是 IQL 的一个零件。"}, {"q": "IQL 的 Q 更新式里没有 a'（不像 AWAC 要读数据里的下一个动作）。最关键的后果是？", "o": ["V̂(s') 代表的是一个比 π_β 更好的策略，所以自举传回来的也是那个更好策略的值", "实现更简单，单条 transition 就够", "可以用更大的 batch", "不受「数据里那个 a' 恰好很差」的影响"], "a": 0, "why": "前两条也成立，但第三条才是突破 π_β 这个天花板的机制所在。V̂(s') 已经回答了「在 s' 上该期待多少」，而那个期待取的是高分位。"}, {"q": "⭐ IQL 凭什么能明显超过 π_β，而不只是「好一个分位」？", "o": ["因为 ① 与 ② 形成复利回路：V̂ 取 Q̂ 的高分位（好一点），② 把这个偏高的 V̂ 当自举目标（抬高 Q̂），再回到 ① 又取新 Q̂ 的高分位 —— 每轮 Bellman 回传叠加一次「选好的那一侧」", "因为 λ 可以取得很小", "因为 AWR 那一步会反复迭代", "因为数据集足够大"], "a": 0, "why": "这和 L06 里 max 起的作用是同一种（max 也是靠反复回传才把最优性传遍状态空间），区别只在于：max 取「全部动作里的最大」（可能在支撑外），这里取「数据支撑内的一个高分位」。"}, {"q": "批注 policy improvement is implicit 的两层意思是？", "o": ["改进是隐藏在 Q 网络参数里的；改进需要额外的网络", "改进很慢；改进不保证收敛", "① 改进不是由显式 argmax 完成的，而是由损失的不对称性完成的；② 那个「被改进出来的策略」从头到尾没被写出来过 —— ① 式里只有 V 和 Q，直到 ③ 才用 AWR 把它显影", "改进只在数据支撑内；改进幅度由 λ 决定"], "a": 2, "why": "V̂ 代表「数据支撑内某个比 π_β 好的策略」的值函数，但那个策略是谁、长什么样，算法里没有任何地方需要知道。这就是名字里 Implicit 的来历。"}, {"q": "⭐ 课堂问「这样会不会高估」。老师回答的三段是？", "o": ["① 没有分布外动作的问题（输入全来自数据）② 相对 π_β 确实高估 —— 而这正是目的（purposefully overestimating）③ 但 λ 不能走到极端，典型取 0.2 左右那种不激进的值", "完全不会；因为只用数据里的动作；所以 λ 可以任意取", "会高估，所以需要配合双 Q", "会高估，但高估量有理论上界"], "a": 0, "why": "合起来就是：高估 π_β = 对的（那是目标）；高估到没有数据支撑的程度 = 错的（那是 p11 的病）。λ 控制的就是这条线落在哪里。"}, {"q": "纯离线训练时 λ 该不该随训练逐渐调整？", "o": ["该按验证集表现自动搜索", "不该 —— 数据全来自固定的离线数据集，λ 控制的是「比数据里的策略好多少」，数据不变这个「多少」就不该变；只有开始采在线数据时才有理由把 λ 往 0.5 挪", "该逐渐增大，以提高保守程度", "该逐渐减小，因为策略在逐渐变好"], "a": 1, "why": "讲稿：it makes sense to keep it constant because you always want to be a fixed amount better than your behavior policy。数据被更好的策略刷新了才该少取一点，否则是在重复计算同一份改进 —— 这也解释了 p32 为什么说 IQL 特别适合离线预训练+在线微调。"}, {"q": "为什么那个不对称回归是拟合到 Q̂ 而不是直接拟合到蒙特卡洛回报？", "o": ["因为 Q 是有界的", "两者都行（all these ideas are applicable to Monte Carlo as well），但 Q 的方差更小 —— 自举目标给出更低方差的回归目标", "因为蒙特卡洛需要完整轨迹，而数据集只有单步 transition", "因为蒙特卡洛回报无法用不对称损失"], "a": 1, "why": "所以 ①② 那个自举回路不是不对称损失的必要条件，它只是让它用起来更稳。"}, {"q": "三个优点里 Decoupling actor & critic training 除了「快」还有一个好处，是什么？", "o": ["可以省掉 V 网络", "可以并行化到多机", "好调试：critic 与 actor 不会互相拖累，可以单独看 critic 的损失曲线判断它学没学好 —— 这在 SAC 那种交替更新的算法里做不到", "可以用不同的优化器"], "a": 2, "why": "讲稿描述的顺序是：先把 V 和 Q 在数据上训到收敛（or we've done enough training），然后才训策略。"}],
24: [{"q": "p25 那个 max_μ 在做什么？", "o": ["对折扣因子做最大化，等价于最坏情况分析", "对策略做最大化，等价于策略改进", "对数据分布做最大化，等价于重要性采样", "μ 是动作上的一个分布；不受限时内层最优解把全部概率压在 Q 最大的动作上，取值就是 max_a Q(s,a) —— 所以 μ 是「找最高处的探照灯」，外层 argmin_Q 负责把那里压下去"], "a": 3, "why": "所以「push down on large Q-values」是字面意思。写成 max_μ 而不直接写 max_a，是为了能给 μ 加一个正则 R(μ) —— p28 正是靠这一步把整个 min-max 化简掉。"}, {"q": "p25 那个只压不抬的版本有一个逐点保证（for large enough α, Q̂^π ≤ Q^π）。它的实践问题是？", "o": ["保证只在表格情形下成立", "它需要显式建模 π_β", "那一项不区分「数据里的」与「数据外的」—— α 调大到足以压住支撑外的虚高时，支撑内本该准的 Q 也被一起拖垮，排序信息跟着丢失", "α 太大时会发散"], "a": 2, "why": "这是一个「保证成立但算法不可用」的典型例子：数学上 Q̂ ≤ Q^π 是真的，但 Q 的排序被压平，拿它取 argmax 得不到好策略。p26 那一项正是来救这件事的。"}, {"q": "⭐ p26 加上「抬高数据里的 (s,a)」那一项之后，惩罚项的形状变成一个差。这个「差」带来的关键性质是？", "o": ["惩罚变成无偏估计", "给 Q 整体加一个常数，这个差不变 —— 所以惩罚对 Q 的「整体高度」不敏感，只管「数据外比数据内高出多少」，于是不会把 Q 压垮", "惩罚变成凸的，优化更容易", "惩罚的梯度变小，训练更稳"], "a": 1, "why": "我们从来不在乎 Q 的绝对值对不对，只在乎它的排序和「数据外别虚高」。这条「只在乎排序」在 L06 p13 已经说过一次（不收敛常常只是绝对值不准）。"}, {"q": "⭐ p26 的保证从「Q̂^π ≤ Q^π 对每个 (s,a)」降级成「E_{π(a|s)}[Q̂^π] ≤ E_{π(a|s)}[Q^π]，s ∈ D」。为什么说降级后那条才是真正需要的？", "o": ["因为逐点保证在连续动作下无法验证", "因为我们拿 Q̂ 只做一件事：比较不同策略的 E_π[Q̂] 并挑最大的 —— 唯一会伤人的错误是「我以为这个策略值 100，其实只值 30」，而降级后的保证恰好排除了它", "因为期望意义的保证更容易证明", "因为逐点保证需要 α → ∞"], "a": 1, "why": "逐点保证附带保证了「每个单独动作的估值都不偏高」，而我们从不需要这件事。那部分强度是白付的，代价却是压垮排序。"}, {"q": "p26 那个保证是单向的（只保证不高估，允许低估）。在离线设定下这个方向为什么是对的？", "o": ["因为「被骗」（选出一个其实很糟的策略）在离线设定下不可恢复——没有新数据来纠正；而「漏掉」（错过一个更好的策略）只是少赚", "因为真实 Q 总是偏高的", "因为低估的概率更小", "因为低估可以事后用更大的 α 修正"], "a": 0, "why": "这个取舍方向的判断方法可以复用：先看清不同方向的错误各自有多贵，再决定保证该偏向哪一边。"}, {"q": "p25 页首那句 without explicitly modeling the behavior policy 为什么重要？", "o": ["因为压低项的 μ 由优化自己找出、抬高项的 (s,a) 直接从 D 采 —— 全程不需要知道 π_β；这和第一族的「隐式」是同一个顾虑的两种解法，都在避开「先学一个 π_β 密度模型」这条路", "因为 π_β 可能是多个策略的混合", "因为 π_β 的参数不公开", "因为建模 π_β 会引入额外的网络参数"], "a": 0, "why": "L07.a 的 p11 问答说明了为什么要避开：我们连「什么是分布内」都不知道。两族方法的共同点比看起来多 —— 都承认支撑不可知，然后各自找了一个不需要知道它的办法。"}, {"q": "CQL 的「压低」和 L06 的双 Q 都在往下压，区别是？", "o": ["双 Q 只适用于离散动作，CQL 只适用于连续动作", "双 Q 压的是支撑内「max 带来的那点系统性偏高」（量级小，无超参）；CQL 压的是「支撑外整片无根据的虚高」（量级大，需要 α）—— 两个毛病独立，所以实现里通常叠加", "两者其实是同一个技巧的不同写法", "双 Q 压 Q 值，CQL 压策略的熵"], "a": 1, "why": "这一条讲义没说，是从两者各自治什么病推出来的（支撑内的噪声偏高 vs 支撑外的无根据虚高是两个独立的毛病）。"}, {"q": "两族方法管住的东西分别是？", "o": ["第一族管住「策略去哪」（只在数据里的 (s,a) 上监督，不给机会）；第二族管住「Q 值长什么样」（允许去查，但那里偏低，去了也没好处）", "第一族管住离散动作，第二族管住连续动作", "第一族管住 critic，第二族管住 actor", "第一族管住方差，第二族管住偏差"], "a": 0, "why": "一个靠「不给机会」，一个靠「去了也没好处」。p27 的策略更新用的正是 argmax 或对 Q 做梯度上升 —— 所以 CQL 确实允许策略查询数据外的动作。"}],
27: [{"q": "⭐ 给 μ 加最大熵正则之后，内层 max 的闭式解与最优值分别是？", "o": ["μ* ∝ exp(Q(s,a))（对 Q 取 softmax）；最优值是 log Σ_a exp Q(s,a)（对数配分函数）", "μ* 无闭式解，必须迭代求", "μ* 是均匀分布；最优值是 Q 的平均", "μ* 是 δ 函数在 argmax 上；最优值是 max_a Q"], "a": 0, "why": "这就是 Gibbs 变分原理：「线性目标 + 熵」的最优值等于对数配分函数。于是整个 min-max 塌成一个普通的单层最小化 —— 幻灯的结论 Don't need to construct μ directly。"}, {"q": "化简后的 CQL 惩罚项 α·(logsumexp_a Q(s,a) − Q(s,a_数据)) 的语义是？", "o": ["惩罚策略的熵过低", "惩罚 Q 与奖励之间的不一致", "不许让「你没见过的动作」看起来比「你真见过的那个动作」好太多：数据里那个动作本来最好则差≈0 不罚；某个数据外动作虚高则差很大重罚", "惩罚 Q 的绝对值过大"], "a": 2, "why": "而且这个形式与 softmax 交叉熵一模一样（logsumexp 减去正确类别的 logit）—— 所以实现上它就是「把数据里那个动作当正确标签做一次分类」。"}, {"q": "⚠ Σ_a exp Q(s,a) 这个记号绕过了什么实际困难？", "o": ["需要存储全部动作的 Q 值，内存不够", "需要知道 π_β 的密度", "没有困难，现代框架都能高效计算", "logsumexp 只在动作离散时能精确算；连续动作下它是一个积不出来的积分，必须采样近似，于是引入采样方差和一个「采几个」的新超参 —— 所以 p32 说 CQL「只有一个超参」在连续动作下要打折"], "a": 3, "why": "CQL 论文的做法是从策略与一个均匀分布里各采若干动作做重要性加权的 logsumexp。而高维动作空间里均匀采样几乎碰不到 Q 的高处，惩罚可能严重低估真实的 max。这一整条讲义没提。"}, {"q": "⭐ p27 第 2 步（argmax 或对 Q 做梯度上升）暴露了 CQL 与第一族的根本区别，是什么？", "o": ["CQL 的策略更新不用梯度", "CQL 不需要策略网络", "CQL 的策略会主动查询数据外的动作（argmax 遍历全部动作；梯度会把 π_θ 推到任何 Q 高的地方），这与 IQL 的 Never need to query OOD actions! 完全相反", "CQL 的策略是确定性的，第一族是随机的"], "a": 2, "why": "所以 CQL 一定要有那个惩罚项：去掉它，p27 的第 2 步就是 p10 那个会炸的 SAC。一句话总结：CQL 没有改策略更新，它改了策略所看的那张地图。"}, {"q": "熵正则的权重与 α 各自在控制什么？", "o": ["熵权重控制压的「范围」（权重大 ⇒ μ* 趋均匀 ⇒ 把一整片高处都压一点；权重小 ⇒ μ* 趋 argmax ⇒ 只狠压最高那一个），α 控制压的「力度」", "熵权重控制压的「力度」，α 控制压的「范围」", "熵权重控制收敛速度，α 控制最终偏差", "两者完全等价，只保留一个即可"], "a": 0, "why": "两者效果会互相掩盖，所以实践中通常把熵权重吸收进 Q 的尺度（或固定为 1），只留 α 一个超参给用户调 —— 这也是 p32 那句 Just one hyperparameter 的来历。这一段是补的。"}, {"q": "两族方法的失败模式有什么结构性差别？", "o": ["第一族的失败是单向的（最坏退化成模仿学习，安全但平庸）；第二族是双向的（α 太小则退回会炸的情形，α 太大则 Q 排序被压平、策略退化成随机）", "第一族失败时发散，第二族失败时收敛到局部最优", "两者的失败模式相同，都是过拟合", "第一族只在连续动作下失败，第二族只在离散动作下失败"], "a": 0, "why": "这解释了 p32 的推荐顺序：如果你不想花时间调参，选第一族。"}, {"q": "CQL、双 Q、目标网络三者各治什么毛病？", "o": ["CQL 和双 Q 治高估，目标网络治低估", "CQL 治「支撑外的无根据虚高」（一片区域、量级大、需要 α）；双 Q 治「max 在带噪估计上的系统性偏高」（支撑内、量级小、无超参）；目标网络治「标签在内层循环里乱动」（优化稳定性，与高估无关）—— 三者独立可叠加", "三者都只在离线设定下需要", "三者治同一个毛病，是互相替代的方案"], "a": 1, "why": "这一条讲义没说，是从各自治什么病推出来的。它对读 CQL 的代码很有用 —— 否则会以为那些组件是多余的。"}],
29: [{"q": "⭐ p30 第 2 条 Approach 的措辞 implicitly constrain the policy to π_β by only supervising on actions in data 为什么值得当定义来记？", "o": ["因为它定义了 KL 约束的形式", "因为它是考试重点", "因为前半句是目标（约束到 π_β）、后半句是手段（只在数据里的动作上监督）—— 它把一个听起来很理论的名字还原成一行可以写进代码的检查：策略损失里那个动作是不是全部来自数据集", "因为它说明约束是软的"], "a": 2, "why": "如果是全部来自数据集，你就有了隐式约束；如果不是（像 p27 的第 2 步），你就必须另找一个安全机制。"}, {"q": "p30 第 2 句把「偏移」与「高估」接成了因果。这个方向为什么重要？", "o": ["它说明应该减小学习率", "偏移是因、高估是果 ⇒ 治法有两个入口：治因（第一族，让 π_θ 别离 π_β 太远）或治果（第二族，让高估不发生）；而 L06 的高估是另一个因，所以双 Q 在这里治不了病", "它说明应该增大数据集", "它说明高估是不可避免的"], "a": 1, "why": "同一个症状，先问因，再配药。这一点在 L07.a 的 p11 那张表里对照过。"}, {"q": "⚠ 讲稿在复述 p30 第 2 条时说的是 explicitly constrain the policy，而幻灯写的是 implicitly。该以哪个为准？", "o": ["两者都对，指的是不同的约束", "以讲稿为准，口头表述更准确", "无法判断", "以幻灯为准：整个第二节的标题就是 Implicit policy constraint methods（p6/p13/p24 三次），IQL 的名字里也是 Implicit —— 讲稿那处是口误或 ASR 听错"], "a": 3, "why": "如果按字面读成 explicitly，整族方法的要点就反了 —— 这一族恰恰是不写出 KL 项、只通过「只监督数据里的动作」达到效果。"}, {"q": "⚠ 核对讲稿后发现 p30 的五条里有一条在课堂上完全没出现，是哪一条？这意味着什么？", "o": ["第 1 条（online data is expensive）；意味着课上跳过了动机部分", "第 3 条（filtered or weighted IL as baseline）；意味着课上跳过了基线", "第 5 条（construct conservative objective by penalizing Q-values）；意味着保守方法那一族（p24–29）课上跳过了 —— 而作业 3 仍要实现 CQL，必须靠幻灯+论文自学", "第 6 条（trajectory stitching）；意味着课上跳过了拼接"], "a": 2, "why": "全文里 conservative / CQL / push down / push up / logsumexp 出现次数均为 0，而老师在讲到 p31 时自己说 This example application is for the algorithm we didn't cover。幻灯上第 5 条还在，所以读幻灯时会以为它讲过。"}, {"q": "两族方法的「上限」分别是什么？", "o": ["两者上限相同，只是收敛速度不同", "第一族的上限是「数据支撑内最好的策略」（永不提出数据外的动作）；第二族上限更高（策略可提出任何动作，只要在压低后的 Q 下仍胜出），代价是「可能更糟」（α 没调对就炸）", "第一族上限由 λ 决定，第二族上限是最优策略", "第一族上限更高，第二族更安全"], "a": 1, "why": "所以没有哪一族占优。p32 的推荐完全是按「你愿不愿意调参」和「你要不要接着做在线微调」来分的。"}, {"q": "p30 第 3 条把 Filtered BC 和 AWR 合成一条并都叫 baseline，这个归类该怎么读？", "o": ["意思是 AWR 已经被淘汰", "意思是两者超参数量相同", "意思是它们原理相同", "意思是「这两个都是你该先试一遍的对照组」，不是原理相同 —— 从能不能拼接看，AWR 比 Filtered BC 强、比 AWAC/IQL 弱；而 p32 的选型表只提 Filtered BC 不提 AWR，可见实务上 AWR 的位置被 IQL 挤掉了"], "a": 3, "why": "AWR 从算法谱系上已属「优势加权」这一支，和 IQL 共用同一个策略提取式 —— 它其实是 IQL 的一个零件。"}],
31: [{"q": "⚠ p32 写 Implicit Q-learning: Can stitch data & explicitly constrained to data support。这里的 explicitly 与「implicit policy constraint」矛盾吗？", "o": ["矛盾，幻灯写错了", "不矛盾 —— 两个词修饰不同的事：「策略约束」是隐式的（不写 KL 项），而「只用数据支撑内的动作」是显式的（每个输入都明摆着来自 D）。这句话是在和 CQL 对比：CQL 对支撑的处理才是「软」的（靠 α 压一压）", "矛盾，应以讲稿为准", "不矛盾，因为 explicitly 指的是超参数显式给出"], "a": 1, "why": "这句话的意思是「它对数据支撑的约束是明确的、结构性的，不是靠一个软惩罚去近似」。"}, {"q": "⚠ 讲稿在 p32 上加了一个幻灯没有的条件：IQL 比 Filtered BC 好，especially if you have a broader data set。为什么是「数据更宽」？", "o": ["因为更宽的数据让神经网络泛化更好", "因为 IQL 靠「在某状态的 Q 分布里取高分位」做改进，要有「分布」可取分位，那个状态上就得见过多个动作；数据窄 ⇒ 分布退化成一两个点 ⇒ 高分位与噪声的最大值区分不开", "因为更宽的数据减少了自举误差", "因为更宽的数据让 α 更容易调"], "a": 1, "why": "极端情形就是 p18 那个确定性 π_β：优势全为 0，一切退化成模仿学习。这也正是 L07.b p22 最后那条说的界限。"}, {"q": "p32 的四个情形里，哪一个的推荐是「独占的」而不是并列的权衡？这说明什么？", "o": ["「不想花时间调参」⇒ CQL 独占", "「刚拿到数据想先有个数」⇒ Filtered BC 独占", "「离线预训练 + 在线微调」⇒ IQL 独占；说明 IQL 在这个组合场景里有结构性优势（critic 训练与策略解耦，换成在线数据后 critic 几乎不用改）", "四个都是并列的权衡，没有独占"], "a": 2, "why": "前三条是并列的权衡（看你在意什么），第四条只有一个选项。讲稿：It can also be used with online data collection quite effectively, and it works quite well there。"}, {"q": "LinkedIn 那个例子里 WAU / Volume / CTR 三个指标的关系是？这指向下一讲的什么问题？", "o": ["三者独立，可分别优化；指向多智能体问题", "三者互相拉扯（多发通知 ⇒ Volume 上去、CTR 下降、长期可能把用户逼走）⇒ 没有现成的标量奖励，得自己组合出来，而「怎么组合」会悄悄决定答案；这正指向 p33 的 How do we get rewards??", "三者等价，只是单位不同；指向折扣因子的选择", "三者正相关，优化一个即可；指向探索问题"], "a": 1, "why": "论文标题里的 Multi-Objective 指的就是这件事。奖励的构造不是技术细节，它是整个问题设定的一部分。"}, {"q": "判断一个任务「非离线 RL 不可」的三条检查表是？", "o": ["数据量大、动作离散、奖励稠密", "数据有标签、环境可模拟、策略可参数化", "① 历史数据海量且免费 ② 在线试错代价真实且不可逆 ③ 反馈有长期成分（所以不是单步监督学习）—— 少了③就是普通点击率预估；少了②不如直接做在线 A/B；少了①什么方法都救不了", "状态连续、动作连续、时间有限"], "a": 2, "why": "LinkedIn 那个任务三条同时成立：通知日志天然是数据；给一百万人发一周垃圾通知流失的用户不会回来；WAU 是周级指标。"}, {"q": "⚠ Still an active area of research! 这句注对你怎么读文献有什么实际含义？", "o": ["意味着应该等理论成熟后再做实验", "离线 RL 的 benchmark 排名对实现细节与超参很敏感，「某方法比某方法好」的结论经常被后续推翻 ⇒ p32 这张表该读作「任课老师的实践经验」而非文献共识；自己的实验要带 Filtered BC 基线，引用优劣时引具体 benchmark 与版本", "意味着这些方法都还不能用于生产", "只是免责声明，可以忽略"], "a": 1, "why": "Filtered BC 最难被实现细节左右，所以它是最可靠的那个对照组 —— 这也呼应 p15 把它定位成 a good baseline to test against。"}, {"q": "p33 那个预告 How do we get rewards?? 挑出了这一讲的什么隐含假设？", "o": ["假设动力学是已知的", "假设 r(s,a) 是给定的（p8 的形式化里它只是一行）—— 而整讲所有方法都重度依赖它：Filtered BC 靠 r 筛轨迹、AWR 靠 r 算优势、CQL 的回归项里也有 r", "假设数据集是无噪声的", "假设动作空间是离散的"], "a": 1, "why": "如果奖励本身是错的或硬凑的，那些精巧的「不碰分布外动作」就全是在精确地优化一个错的目标。这正是 L08（奖励学习）与 L09（RLHF）紧跟其后的理由。"}, {"q": "讲稿关于 IDQL 多说了一句，是什么？", "o": ["IDQL 的表现不如 IQL", "IDQL 只是把策略类换成扩散模型，别无不同", "beyond using diffusion, it also is a bit different in terms of how this update is done —— 差别不只是策略类；但具体差在哪老师没说、幻灯没写，要知道就得读论文（标为待核）", "IDQL 只适用于离散动作"], "a": 2, "why": "论文标题 Implicit Q-Learning as an Actor-Critic Method with Diffusion Policies 本身也提示：那个「隐式的策略」在 IDQL 里被显式化成了 actor。"}]

{"r": [1, 6], "t": "开场：今天要用的三个旧零件 —— 三种拟合值函数的方式", "star": 3, "quote": "CS 224R Offline Reinforcement Learning.  Course reminders — Homework 2 due next Friday. (start early!!)  Project - CA mentors assigned - Fill out AWS form for GPU quota - Proposal due Friday graded fairly lightly - it's for your benefit!  Recap: Methods — Online RL with policy gradients: baseline, reward to go, policy log likelihood, samples from policy.  Do more of the above average stuff, less of the below average stuff.  Online RL with actor-critic: Estimate what is good and bad, then do more of the good stuff.  1. Estimate V^π with Monte Carlo.  2. Estimate V^π with bootstrapped / TD updates.  3. Estimate Q^π with bootstrapped / TD updates.  Recap: Full Off-Policy Actor-Critic Method, where a'_i ∼ π_θ(·|s'_i).  The plan for today — Offline RL: 1. Why offline RL? Can we just run off-policy methods? 2. Implicit policy constraint methods 3. Conservative methods.  Key learning goals: - the key challenges arising in offline reinforcement learning - two approaches for offline RL (& why they work!) - how offline RL can improve over imitation learning.  Part of homework 3!", "one": "<b>这六页的回顾看起来是客套，其实<span class='k'>是在摆零件</span>：p4 那三种拟合值函数的方式，待会儿会<b>一个一个</b>被今天的三个算法挑走用。</b><span class='w'>讲稿把这件事说得很明白 —— it's actually going to play a pretty important role in today's lecture。</span>", "eq": "p4 把前几讲拟合值函数的方式排成了三条，**编号就是讲义自己的编号**：\n\n────────────────────────────────────────\n**① 蒙特卡洛**（Estimate V^π with Monte Carlo）\n\n   min_φ  Σ_{s_t∼D}  ‖ V̂^{π_θ}_φ(s_t)  −  Σ_{t'=t}^{T} r(s_{t'}, a_{t'}) ‖²\n                        └──估计──┘       └──────标签：实际走出来的回报──────┘\n\n   标签完全来自数据，**不含任何自己的估计** ⇒ 无偏，但方差大。\n\n────────────────────────────────────────\n**② 自举 / TD（对 V）**（Estimate V^π with bootstrapped / TD updates）\n\n   min_φ  Σ_{(s,a,s')∼D}  ‖ V̂^{π_θ}_φ(s)  −  ( r(s,a)  +  γ·V̂^{π_θ}_φ(s') ) ‖²\n                                              └──标签里用了**自己**的估计──┘\n\n   方差小了，但标签里有自己 ⇒ **自举**。\n\n────────────────────────────────────────\n**③ 自举 / TD（对 Q）**（Estimate Q^π with bootstrapped / TD updates）\n\n   min_φ  Σ_{(s,a,s')∼D}  ‖ Q̂^{π_θ}_φ(s,a)  −  ( r(s,a) + γ·𝔼_{a'∼π_θ(·|s')}[ Q̂^{π_θ}_φ(s',a') ] ) ‖²\n                                                                  └── a' 从**当前策略**采 ──┘\n\n   ⇒ **只有第 ③ 种能用旧策略的数据**：(s, a, s') 来自数据集，\n     而 a' 是现场从 π_θ 采的 —— 这正是 L04 p31 那处修补。\n\n────────────────────────────────────────\np5 把 ③ 装进完整循环（就是 SAC 的骨架）：\n\n   采数据 → 存进缓冲区 → 从缓冲区采一批 → 用上面 ③ 更新 Q̂\n          → 更新策略，让它在 Q 高的动作上提高概率 → 回到第一步", "pts": ["<b>先注意 p3 那两句直觉句的顺序，它是前四讲的缩写。</b><span class='k'>策略梯度：Do more of the above average stuff, less of the below average stuff</span>（L03）；<span class='k'>Actor-Critic：Estimate what is good and bad, then do more of the good stuff</span>（L04）。<b>两句的区别只在「above average」这个判断是<span class='w'>从采样里现算</span>还是<span class='w'>从学到的值函数里读</span></b>。<b>而今天要做的事，是把这两句里的「采数据」那一步<span class='k'>彻底拿掉</span>。</b>", "<b>p4 的三条要按「标签从哪来」读，而不是按「公式长什么样」读。</b><span class='k'>① 标签全来自数据（实际回报）· ② 标签里混进了自己对下一状态的估计 · ③ 同 ② 但估的是 Q、而且下一动作是现场采的</span>。<b>这三条的差别决定了它们各自能容忍什么样的数据</b>：<span class='w'>① 和 ② 要求数据是**当前策略**采的（on-policy），因为它们估的是「这个策略的值」</span>；<b>③ 是唯一一条能吃旧策略数据的</b>。", "<b>讲稿里对 ③ 加的那句限定，是整讲的种子，值得整句背下来</b>：<span class='k'>we need this Q-function to be trained on actions that actually would resemble the actions that we're going to be evaluating it on</span>。<b>为什么会有这个要求？因为 ③ 是自举的</b> —— <span class='w'>标签 r + γQ̂(s', a') 里的 Q̂(s', a') 是**自己算的**，不是数据给的</span>。<b>如果 a' 落在训练时从没见过的地方，这个标签就是凭空编的</b>，<span class='k'>而后面整个回归都在拿这个编出来的数当真</span>。讲稿紧接着一句总结：<b>So it needs good coverage over action.</b>", "<b>这句「要有好的动作覆盖」在 L04/L06 里是一条<span class='w'>温和的建议</span>，在今天会变成<span class='k'>硬墙</span>。</b><span class='w'>原因只有一个：在线设定下，策略一旦偏到奇怪的动作上，<b>下一轮就会真的去试它、拿回真实的回报、把估计纠正过来</b></span>。<b>而离线设定下，数据集是定死的</b> —— <span class='k'>偏出去的那块永远不会有数据回来纠正它</span>。<b>同一个毛病，在线是自愈的，离线是自我强化的。</b>", "<b>p5 那个 <code>a'_i ∼ π_θ(·|s'_i)</code> 的下标写法要盯一眼</b>：<span class='k'>s'_i 带下标 i，说明它是数据集里第 i 条样本的下一状态</span>；<span class='k'>a'_i 也带下标 i，但它不是数据里的</span> —— <b>它是对第 i 条样本的 s'_i，现场从策略里采出来的一个动作</b>。<span class='w'>这个区别在纸上只差一个采样符号，在离线设定下却是全部问题的入口</span>：<b>数据集管不着这个 a'_i 取什么值</b>。", "<b>课堂上有人问 p5 是不是 Q-learning，老师明确否认并补了那处差别，这段值得单独记。</b><span class='k'>This is actually two lectures ago. This is soft actor-critic.</span> <b>Q-learning 还差最后一处改动</b>：<span class='w'>不是从「要学的策略」采一个 a'，而是对所有 a' 取 max</span>。<b>而且目的也不同</b> —— <span class='k'>SAC 学的是「当前策略」的 Q，Q-learning 学的是「最优策略」的 Q</span>。<b>讲稿原话：our goal here was to try to learn the Q-function for the optimal policy.</b> ⇒ <span class='w'>今天两族方法里，第一族（AWR/AWAC/IQL）从 SAC 这一侧长出来，第二族（CQL）从 Q-learning 那一侧长出来</span>。", "<b>p6 的三个学习目标里，第三个最容易被当成客套话，其实它是本讲的立论前提。</b><span class='k'>how offline RL can improve over imitation learning</span> —— <b>因为离线数据集的最朴素用法就是模仿学习（L02），而模仿学习<span class='w'>完全没有高估问题</span></b>（它只在数据里的动作上做监督）。<span class='w'>所以每提出一个离线 RL 方法，都得回答「你凭什么比直接模仿好」</span>。<b>p14–15 会正面回答这件事，答案是两个词：奖励信息 与 拼接。</b>"], "tbl": {"cap": "p4 三种拟合方式：差别只在「标签从哪来」", "head": ["", "① MC（V）", "② TD（V）", "<b>③ TD（Q）</b>"], "rows": [["标签", "<b>Σ_{t'≥t} r（实际回报）</b>", "<b>r + γV̂(s')</b>", "<b>r + γQ̂(s', a')，a'∼π_θ</b>"], ["标签里有自己的估计吗", "<b>没有</b>", "<b>有（自举）</b>", "<b>有（自举）</b>"], ["方差", "<b>大</b>", "<b>小</b>", "<b>小</b>"], ["能吃旧策略的数据吗", "<b>不能</b>", "<b>不能</b>", "<b>能 —— 只有这一条</b>"], ["要求数据覆盖什么", "<b>状态</b>", "<b>状态</b>", "<b>状态 + 动作（good coverage over action）</b>"], ["今天被谁用", "<b>AWR（p18–19）</b>", "<b>IQL 的 V 那一支（p23）</b>", "<b>AWAC（p20）· CQL（p25）</b>"]]}, "say": "<b>讲稿在走到 p4 之前先交代了为什么要重放这一段，这句交代本身就是提示</b>：<br><br><span class='k'>I want to quickly go through these different ways, again, because it's actually going to play a pretty important role in today's lecture.</span><br><br><b>也就是说：这不是复习，是点兵。</b><span class='w'>三条路会在后半讲被三次挑走 —— AWR 用 ①、AWAC 用 ③、IQL 把 ② 的位置换成一个不对称的损失。</span><br><br><b>然后讲稿对 ③ 加了一句限定，这句话是整讲的种子</b>：<br><br><span class='k'>one really important aspect of this last one is that because we're bootstrapping and using our own estimate of the value function at a given state as the label, we need this Q-function to be trained on actions that actually would resemble the actions that we're going to be evaluating it on. And so if our policy is very different from our set of old policies, this label will not be accurate. And then we won't be able to learn an accurate Q-function. So it needs good coverage over action.</span><br><br><b>把这段话和 p11 并排放，会发现 p11 只是把它的后果画成了一张图。</b><br><br><br><b>另外这页上有一段课堂问答，值得记下来</b> —— 有人问 p5 那张图是不是 Q-learning：<br><br><span class='w'>The question is, is this Q-learning? This is actually two lectures ago. This is soft actor-critic. In Q-learning, there is one last change to this. So in this case, we're trying to learn Q-function for the policy that we're learning. The difference that we saw in Q-learning was we were actually trying to learn the Q-function for the optimal policy. […] instead of sampling from the policy that we're trying to learn a value function for, we tried to pick an action that was the best action according to that Q-function. […] our goal here was to try to learn the Q-function for the optimal policy. And this was also something that can be done off policy, without data from the optimal policy, <b>as long as your estimates have good coverage</b>.</span><br><br><b>最后那半句又回到了「覆盖」。</b><span class='k'>讲稿在这一讲里把「good coverage」这个要求说了三次，三次都是在同一件事的不同位置上</span>。", "link": {"t": "你学过的对应：CS224R L04 精读 p31（a' 要从当前策略重采的那处修补 —— p5 的 a'_i ∼ π_θ 就是它）", "href": "L04-精读.html"}},
{"r": [7, 9], "t": "为什么要离线 RL：三条理由，和一处被精确纠正的误解", "star": 4, "quote": "Why offline RL?  Online RL process (on-policy or off-policy): Collect data → Update policy on latest data or data so far.  Offline RL process - Given static dataset - Train policy on provided dataset.  Why, or when, might offline RL be more useful? - leverage datasets collected by people, existing systems - online policy collection may be risky, unsafe - reuse previously collected data rather than recollecting (e.g. previous experiments, projects, robots, institutions).  Note: A blend of offline then online RL is also possible!  More formally: sampled from some unknown policy π_β.  s ∼ p_{π_β}(·), a ∼ π_β(·|s), s' ∼ p(·|s,a), r = r(s,a).  \"behavior policy\" π_β (Note: may be a mixture of policies).  Offline dataset.  Objective: max_θ E_{p_θ(τ)}[Σ_t r(s_t,a_t)] ← expectation under the learned policy π_θ.  distribution shift.  Where does the data come from? - human collected data - data from a hand-designed system / controller - data from previous RL run(s) - a mixture of sources.", "one": "<b>离线 RL 的定义只改了一个字：<span class='k'>数据集是给定的</span>。</b><span class='w'>但这一个字把目标函数变成了一个「在你采不到样的分布下求期望」的问题 —— 讲义在 p8 右下角用两个词点名：<b>distribution shift</b>。</span>", "eq": "p7 把两个流程并排画了出来，差别只有一处：\n\n────────────────────────────────────────\n**在线 RL**（on-policy 或 off-policy 都算）\n\n   采数据  ──→  用最新数据（或至今全部数据）更新策略\n     ↑                                    │\n     └────────────────────────────────────┘\n                  **这个环路存在**\n\n**离线 RL**\n\n   给定静态数据集 D  ──→  在 D 上训练策略  ──→  完\n\n                  **没有回路**\n\n────────────────────────────────────────\np8 把它写成形式化（注意每一行各自来自哪里）：\n\n   s   ∼  p_{π_β}(·)      ← 状态分布，由那个**未知**的行为策略诱导\n   a   ∼  π_β(·|s)        ← 动作来自 **behavior policy** π_β（可以是多个策略的混合）\n   s'  ∼  p(·|s, a)       ← 环境动力学\n   r   =  r(s, a)         ← 奖励函数\n\n   而要最大化的目标是：\n\n      max_θ  𝔼_{p_θ(τ)} [ Σ_t r(s_t, a_t) ]\n                 ↑\n              **expectation under the learned policy π_θ**\n\n   ⇒ **期望下的那个分布（π_θ 走出来的轨迹）与手上数据的分布（π_β 走出来的）不是一回事。**\n     讲义在这里写了两个词：**distribution shift**。\n\n────────────────────────────────────────\n⚠ 讲稿补了一处限定，它把这个偏移的**来源**钉死了：\n\n   动力学 p(·|s,a) 与奖励 r(s,a) 在数据与部署之间是**一样的**，\n   ⇒ 偏移**只**来自策略不同，不来自环境变了。\n\n   讲稿原话：the dynamics of the environment are going to be constant\n            between the data and the learned policy. So the distribution\n            shift is only for these trajectories. It's only caused by the\n            shift in the policy.", "pts": ["<b>p7 三条理由不是并列的三条，它们的强度递增，而且第三条最容易被低估。</b><span class='k'>① 已经有数据了（人采的、现成系统采的）</span> —— <b>这是「不用白不用」</b>；<span class='k'>② 在线采可能有风险、不安全</span> —— <b>这是「不能采」</b>（讲稿举的是自动驾驶与癫痫预防的医疗决策）；<span class='k'>③ 重用以前的数据，而不是每次重采</span> —— <b>这是「采了也亏」</b>。<span class='w'>第三条的理由在讲稿里说得最具体：你第一次跑算法的版本大概不是最终版本，而每改一次算法都要让机器人重新抓一万次，这个成本是白付的</b>。<b>讲稿的结论句：generally, online data is more expensive than offline data for that reason, because offline data, you can reuse many times.</b>", "<b>p7 底下那条小字 A blend of offline then online RL is also possible! 不是补充说明，它是本讲最后一页（p32）选型表的一半。</b><span class='k'>先用离线数据预训练、再用在线数据微调</span>，<b>这个组合在实务里比纯离线常见得多</b>（<span class='w'>讲稿举的还是开车：先学人类驾驶数据，策略够好了再带安全员上路采真实数据</span>）。<b>而 p32 会告诉你：如果你要做的是这种组合，选型答案和纯离线不一样</b>。", "<b>课堂上那个「离线 RL 是不是在线离策略 RL 的特例」的问题，老师的回答方式值得学 —— 他先肯定了一半，然后只否认一处。</b><span class='k'>肯定的那一半：that's definitely one that's very—that's a correct way to view it</span>（从算法形状上看确实像）；<span class='k'>否认的那一处：One thing that is a very strict requirement in offline RL, in pure offline RL, is that you have no ability to collect more data. And in that sense, it's not really a special case of online RL.</span> <b>要害在于：在线离策略 RL <span class='w'>可以</span>再采数据，而纯离线<span class='w'>不可以</span></b>。<b>这个「不可以」不是程度差别，是能力差别</b> —— <span class='k'>它意味着一切「错了可以再试一次」的论证在这里全部失效</span>。", "<b>p8 把 π_β 叫做 behavior policy，并在括号里注明它可以是多个策略的混合，这个括号比看起来重要。</b><span class='w'>真实数据集几乎总是混合的</span>（<b>讲稿：if this was collected by people […] it was collected by multiple people, then it's multiple policies</b>）。<b>但讲稿紧接着给出一句很干净的话，说明为什么不必为此多写一套记号</b>：<span class='k'>you can define that mixture as some average or weighted sum over some constituent policies. So we don't lose any generality by saying that it's collected by a single policy.</span> ⇒ <b>混合策略的加权和本身也是一个策略，所以「单一 π_β」这个记法不损失一般性。</b>", "<b>讲稿里还有一处限定，它把「分布偏移」这个词的含义收窄到了一个精确位置，不收窄就会和另一类问题混掉。</b><span class='k'>动力学 p(·|s,a) 与奖励 r(s,a) 在数据和部署之间是相同的</span> —— <b>偏的只有轨迹分布，而轨迹分布之所以偏，<span class='w'>只因为策略不同</span></b>。<b>这意味着离线 RL 不是在处理「环境变了」这类问题</b>（<span class='w'>那是 sim-to-real 或者非平稳环境</span>）；<b>它处理的是「同一个环境，但我只见过另一个策略在里面走过的样子」</b>。<span class='k'>这个限定也解释了为什么方法都围着 π_β 转</span>：病根在策略差距上，那药也只能下在策略差距上。", "<b>课堂上有人问「如果数据集足够全面，学到的策略分布会不会和行为策略分布相同」，老师的回答是两句都值得记的否定。</b><span class='k'>Generally, that's extremely rare. Generally, that doesn't happen.</span> <b>理由有两重</b>：<span class='w'>① 你本来就想比数据里的平均驾驶员好，那你就必然会收窄到一个更好的子分布上</span>；<span class='k'>② 就算数据里的策略已经很好、你退化成在做模仿学习，你仍然会漂移（L02 的复合误差）</span>。<b>⇒ 分布偏移不是「数据不够多」造成的，它是「你想变好」这件事的<span class='w'>直接后果</span></b>。", "<b>p9 那四行「数据从哪来」看着像凑页数，但它决定了 π_β 长什么样，而 π_β 的形状决定了方法的上限。</b><span class='k'>人采的 ⇒ π_β 大概不错但不最优，而且是多人混合（动作分布宽）</span>；<span class='k'>手工控制器采的 ⇒ π_β 常常是确定性的（动作分布极窄）</span>；<span class='k'>以前的 RL 跑出来的 ⇒ π_β 有好有坏，覆盖可能反而更宽</span>。<b>⚠ 第二种是最危险的一种，而 p18 的思考题正好就在问它</b>：<span class='w'>如果 π_β 是确定性的，优势估计会全是 0，整个算法退化成普通模仿学习</span>。<b>那一页会把它算清楚。</b>"], "tbl": {"cap": "在线 RL（含离策略） vs 离线 RL：差别不在算法，在那个回路", "head": ["", "在线 on-policy", "在线 off-policy（SAC）", "<b>离线 RL</b>"], "rows": [["数据来自", "<b>当前策略</b>", "<b>自己过去的策略（缓冲区）</b>", "<b>未知的 π_β，给定不变</b>"], ["能再采数据吗", "<b>能</b>", "<b>能</b>", "<b>不能 —— 这是硬约束</b>"], ["估计偏了会怎样", "<b>下一轮采样把它纠正回来</b>", "<b>下一轮采样把它纠正回来</b>", "<b>永远没有数据来纠正</b>"], ["数据覆盖由谁保证", "<b>探索策略（ε-贪心等）</b>", "<b>探索策略 + 缓冲区的历史多样性</b>", "<b>只能由数据集的来源保证 —— 你无法干预</b>"], ["分布偏移的来源", "<b>几乎没有</b>", "<b>π_θ 与缓冲区里的旧策略之间（有限）</b>", "<b>π_θ 与 π_β 之间（无界，且会被优化主动放大）</b>"]]}, "say": "<b>讲稿在 p7 上花了不少时间讲三条理由的具体场景，这些场景比幻灯上的短语有用得多，因为它们解释了为什么「不能采数据」有时是真的不能</b>：<br><br><span class='k'>if you're trying to learn a policy for controlling a car to drive on roads, you might have a lot of data of people driving, that could be very useful for learning a good policy for driving. And it might be unsafe to actually try to deploy your policy, especially a policy that is not very good at driving.</span><br><br><span class='w'>In other circumstances, people have looked at using reinforcement learning for figuring out good ways to treat people in medical scenarios. So, for example, there was a really cool project on a seizure prevention use case […] This is a scenario where if you have an offline method of some existing system, then you could use that to learn a policy, without having to collect data from a policy that is not good in the first place.</span><br><br><b>第三条理由讲稿标明它更微妙，而且给的理由是关于<span class='k'>算法开发流程</span>的，不是关于任务的</b>：<br><br><span class='k'>if you have a pure online RL method, it means that every single time you need to run your algorithm, you need to recollect data from your policy. And that can be pretty inefficient, because probably, the first time you run the algorithm isn't—you still room for iteration on the algorithm itself. And generally, online data is more expensive than offline data for that reason, because offline data, you can reuse many times.</span><br><br><b>这一条对做研究的人尤其贴</b>：<span class='w'>你调一个超参要重跑一次实验，如果每次重跑都要重新采数据，那你的迭代速度就被采样速度锁死了</span>。<br><br><br><b>然后是那段关于「是不是特例」的问答，老师回答得很克制</b>：<br><br><span class='k'>So the question is, can you view offline RL as a special case of online, but off-policy RL, but where you don't know the data. And that's definitely one that's very—that's a correct way to view it. One thing that is a very strict requirement in offline RL, in pure offline RL, is that you have no ability to collect more data. And in that sense, it's not really a special case of online RL. Because in online off-policy RL, you can collect more data. That said, we'll see that some of the techniques will draw upon some of these off policy techniques from an algorithm standpoint.</span><br><br><b>最后那句「技巧会借用离策略那一套」在后半讲会反复兑现</b>：<span class='w'>AWAC 就是把 SAC 的 critic 更新改了一个采样源，IQL 就是把它的 L2 损失换成不对称的</span>。<b>算法形状确实是借来的，但借来之后每一处改动都是为了「不能再采数据」这一条。</b>", "link": {"t": "你学过的对应：CS224R L02 精读（模仿学习 —— 离线数据集最朴素的用法，也是本讲必须超过的基线）", "href": "L02-精读.html"}, "res": {"tag": "推断", "v": "<b>p7 那三条理由，对你的课题是逐条成立的，而且第三条正是你现在的处境。</b><br><br><span class='k'>你的问题是「在组合结构的配置空间上找最便宜的可行配置」，而每评估一个配置要花真金白银（跑一次完整实验 / 一次编译 + 基准测试）</span>。<b>于是</b>：<br>① <span class='w'>你大概已经有一批历史评估记录</span>（以前的实验、别人的 benchmark 表、自动调参工具留下的日志）—— <b>这就是 p7 的第一条</b>；<br>② <span class='k'>某些配置评估起来可能真的代价不可接受</span>（跑崩、超时、占满机器）—— <b>这是第二条的组合优化版本</b>；<br>③ <span class='w'>你每改一次剪枝判据就要重跑一遍搜索</span>，<b>如果每次重跑都要重新评估配置，你的算法迭代速度会被评估预算锁死</b> —— <span class='k'>这正是讲稿说的 you still room for iteration on the algorithm itself</span>。<br><br><b>⇒ 一个具体的做法建议</b>：<span class='k'>把你的搜索实验设计成「离线评估 + 在线少量验证」的两段式</span> —— <b>先在历史记录上把剪枝判据与 MCTS 的超参调好（可以跑几百次，成本为零），只把最后几个候选拿去真评估</b>。<span class='w'>而这样做之后，p10–p11 那个病就会原封不动地出现在你的流程里</span>：<b>在历史记录上调出来的判据，会在历史记录没覆盖的那片配置上过度乐观</b>。<br><br>⚠ <b>标为推断</b>：讲义讲的是 MDP 上的策略学习，不是你的最优化问题；上面的对应是结构类比，<span class='w'>「历史评估日志能不能当离线数据集用」还取决于它的采集方式是否可建模成某个 π_β</span>（如果日志来自网格搜索，那 π_β 是确定性的 —— 正好撞上 p18 的那个退化情形）。", "ref": "本讲 p7 三条理由与 p9 数据来源；p18 的确定性 π_β 思考题"}},
{"r": [10, 11], "t": "⭐ 直接套 SAC 会怎样：分布外动作上的高估，而且没有新数据来纠正它", "star": 5, "quote": "Can we just use off-policy algorithms?  What happens if you optimize this using a static dataset? (e.g. say data collected by a mediocre policy)  Recall: Off-policy actor & critic updates (e.g. SAC): Q-function update: min_φ Σ_{(s,a,s')∼D} ‖Q̂^{π_θ}_φ(s,a) − (r(s,a) + γE_{a'∼π_θ(·|s')}[Q̂^{π_θ}_φ(s',a')])‖².  Subsequent policy update.  What happens when evaluating on actions not in the dataset?  Randomly init. Q-function for state s', action a'.  Q(s', a').  data support.  - Q-function will be unreliable on OOD actions - policy will seek out actions where Q-function is over-optimistic - After policy update, Q-values will become substantially overestimated.  Another perspective: learned policy deviates too much from behavior policy.", "one": "<b>一句话病理：<span class='k'>随机初始化的 Q 在没数据的动作上是乱的，而策略更新<span class='w'>专门去找</span>乱得最高的那一个</span>，然后 Q 回归又把这个乱值当真。</b><b>在线设定下这个环会被真实数据切断；离线设定下它没有出口。</b>", "eq": "出发点就是 L04/p5 那个离策略 critic 更新，**一个字没改**：\n\n   min_φ  Σ_{(s,a,s')∼D}  ‖ Q̂_φ(s,a)  −  ( r(s,a)  +  γ·𝔼_{a'∼π_θ(·|s')}[ Q̂_φ(s', a') ] ) ‖²\n                                                        └──── 问题在这里 ────┘\n\n   **(s, a, s') 来自 D；a' 来自 π_θ。而 D 管不着 π_θ 会采出什么 a'。**\n\n────────────────────────────────────────\n讲稿把它在一个具体例子上走了一遍（开车）：\n\n   数据里有的动作：  a1（保持车道）· a2 · a3        ←── data support\n   数据里没有的动作：a4（go on an adventure）\n                   a5（make a U-turn）\n                   a6（go backwards）\n\n   训练一开始，Q̂_φ 是**随机初始化**的：\n\n     Q(s', a')\n        ↑\n        │        ╱╲            ← 支撑外：**纯粹是网络初始化的形状**\n        │   ╱╲  ╱  ╲   ╱╲\n        │  ╱  ╲╱    ╲ ╱  ╲\n        │ ╱           ╲     ╲\n        └──┬──┬──┬──┬──┬──┬──→ a'\n           a1 a2 a3 │ a4 a5 a6\n           └─data support─┘\n\n   ⇒ 支撑内有标签管着它；**支撑外的高低完全是任意的**。\n\n────────────────────────────────────────\n然后那个正反馈启动（p11 的三条就是这三步）：\n\n   ① **Q-function will be unreliable on OOD actions**\n        —— 支撑外的值是编的。\n   ② **policy will seek out actions where Q-function is over-optimistic**\n        —— 策略更新的目标就是 argmax Q，它**主动**去找编得最高的地方。\n   ③ **After policy update, Q-values will become substantially overestimated**\n        —— 策略挪过去之后，a' ∼ π_θ 就落在那片编出来的高处；\n           下一轮 critic 回归把这个编出来的高值当成标签 ⇒ **它被写进了 Q 里**。\n\n   ① → ② → ③ → ① ……\n\n────────────────────────────────────────\n**在线与离线的分水岭就在这个环的出口上：**\n\n   在线：策略挪到 a5（高速掉头）之后，**下一轮真的会去开**，\n         拿回真实奖励（撞车，r 很负）⇒ Q(s,a5) 被打回去。**环被切断。**\n\n   离线：策略挪到 a5 之后，**什么也不会发生**。\n         数据集里永远不会出现一次高速掉头。\n         ⇒ **Q(s,a5) 高得毫无根据，而且会一直高下去。**", "pts": ["<b>先看清这一步里「谁在逼谁」—— 这不是估计误差偶然偏高，而是优化目标<span class='k'>主动去搜索</span>估计误差最大的地方。</b><span class='w'>策略更新那一步做的事就是 argmax_a Q̂(s,a)</span>；<b>而 Q̂ 的误差在支撑外最大、在支撑内最小</b>。<span class='k'>于是 argmax 几乎必然落在支撑外</span> —— <b>不是因为支撑外真的好，而是因为那里的数自由度最高、能随机地冒出最高的值</b>。<span class='w'>这跟「随手挑一个动作、它恰好被高估」是完全不同量级的事</span>。", "<b>把它和 L06 p21 的高估并排放，会看到一个重要的区别：病灶不同，药也不同。</b><span class='k'>L06 的高估：max 作用在<b>支撑内</b>的动作上，根源是「同一个网络既选动作又打分」，噪声为正的那个被系统性挑中</span> —— <b>那是赢家诅咒，药是「别让同一个网络既挑又评」（双 Q）</b>。<span class='k'>L07 的高估：max/argmax 作用到了<b>支撑外</b>，根源是那里压根没有标签</b> —— <b>双 Q 在这里帮不上多少忙</b>，<span class='w'>因为两个网络在同一片没数据的区域上都是在瞎编，<b>取较小的那个仍然是瞎编</b></span>。<b>⇒ 药只能是「别去支撑外」或者「把支撑外压低」，这正是后面两族方法。</b>", "<b>p11 右下角那句 Another perspective 是整讲的第二条主线，它把问题从「Q 不准」翻译成了「策略跑太远」。</b><span class='k'>learned policy deviates too much from behavior policy</span>。<b>这个翻译很有价值，因为它把一个<span class='w'>难以直接控制的量</span>（Q 的误差）换成了一个<span class='w'>可以直接约束的量</span>（π_θ 与 π_β 的距离）</b>。<b>⇒ 第一族方法（p16–23）走的就是这条路</b>：<span class='k'>不去修 Q，而是约束策略别离 π_β 太远</span>。<span class='w'>讲稿：if we stayed closer to the behavior policy, then we wouldn't have this issue</span>。", "<b>课堂上有人问「离散动作空间会不会没这个问题」，答案里那个条件句值得注意。</b><span class='k'>如果数据集在<b>每一个</b>状态上都覆盖了<b>全部</b>动作，那确实没问题 —— 一切都在分布内</b>。<b>但老师马上说这在实践中不成立</b>：<span class='w'>in practice, usually, there will be states, where you don't have full coverage of all actions. And you can still see overestimation in those states.</span> <b>⇒ 离散动作并不是豁免，它只是把「覆盖」这个要求变得可以检查</b>（<span class='k'>可以数一数每个状态见过几个动作</span>）。<b>而连续动作连检查都做不到。</b>", "<b>⭐ 另一个课堂问题是全讲最深的一处：「那把分布外动作排除掉不就行了？」—— 答案是一个关于<span class='k'>可实现性</span>的否定。</b><span class='w'>老师先承认这个方向有人做（and there are approaches for doing that）</span>，<b>然后指出那个致命的实现障碍</b>：<span class='k'>we don't actually know what's in distribution and out of distribution. So we have just samples of states and actions.</span> <b>他举的例子很小但很致命</b>：<span class='w'>状态 s₁ 的数据里只有动作 a1，一个与 s₁ 很相似但不相同的状态 s₂ 的数据里只有 a2</span>。<b>那么 (s₁, a2) 算分布内还是分布外？</b><span class='k'>技术上 a2 在 s₁ 上没见过，但 s₂ 几乎就是 s₁，所以它大概是安全的</b>。<b>⇒ 「支撑」在连续状态空间里<span class='w'>不是一个你能枚举出来的集合</span>，它只能被隐式地近似。这一句话决定了后半讲所有方法的形态：它们都不去显式判断分布内外，而是用某种<b>间接</b>手段避开它。</b>", "<b>把这个「不知道支撑在哪」和前一条「策略跑太远」接起来，就能看懂为什么这一讲的方法都显得「绕」。</b><span class='k'>最直接的三个想法都不可行</span>：<br>① <b>显式检测并排除 OOD 动作</b> ⇒ <span class='w'>做不到，不知道支撑在哪</span>；<br>② <b>显式建模 π_β 再约束 KL(π_θ‖π_β)</b> ⇒ <span class='w'>要先学一个 π_β 的密度模型，而密度估计本身就难、而且误差会直接传进约束里</span>（<b>p25 特意标了 without explicitly modeling the behavior policy，就是在避开这条</b>）；<br>③ <b>只在数据里的动作上评估 Q</b> ⇒ <span class='k'>这条可行！而且它就是第一族方法的全部内容</b>（<span class='w'>AWAC 把 a' 改成从 D 采，IQL 干脆连 Q 的输入都只用数据里的 (s,a)</span>）。<b>⇒ 「绕」不是作者不想直接，是直接的路被前面那两句话堵死了。</b>", "<b>最后提醒一个容易看漏的前提：p10 标题里那个 (e.g. say data collected by a mediocre policy) 不是随口举的例子。</b><span class='k'>如果 π_β 已经是最优策略，那你根本不需要离线 RL，直接模仿它就行（L02）</span>；<b>如果 π_β 很糟，那数据里也没有好行为可供拼接</b>。<span class='w'>离线 RL 的用武之地恰恰是「mediocre」这个中间带</span>：<b>数据里有好片段也有坏片段，而你想要的是只学好的那部分、并且把好片段<span class='k'>接起来</span></b>。<b>p14 那张 s1→s9 的图就是在画这件事。</b>"], "tbl": {"cap": "同一个「高估」，L06 与 L07 的病灶与药完全不同", "head": ["", "L06 p21（在线 Q-learning）", "<b>L07 p11（离线）</b>"], "rows": [["max/argmax 作用在哪", "<b>支撑<u>内</u>的动作上</b>", "<b>支撑<u>外</u>的动作上</b>"], ["误差从哪来", "<b>有限样本的噪声</b>", "<b>压根没有标签 —— 网络初始化的任意形状</b>"], ["机制", "<b>赢家诅咒（同一网络既选又评）</b>", "<b>优化主动搜索「编得最高」的地方</b>"], ["会被纠正吗", "<b>会 —— 下一轮真去试，拿回真实回报</b>", "<b>不会 —— 永远不会有那条数据</b>"], ["双 Q 有用吗", "<b>有 —— 正是为它设计的</b>", "<b>帮不上多少 —— 两个网络在同一片空地上都在编</b>"], ["对的药", "<b>别让同一网络既挑又评</b>", "<b>① 别去支撑外（隐式约束） ② 把支撑外压低（保守）</b>"]]}, "tip": {"t": "为什么「把分布外动作排除掉」不是一个可实现的方案", "w": true, "v": "<b>这是本讲最重要的一处「做不到」，而它只出现在讲稿的一段问答里，幻灯上一个字都没有。</b><br><br><b>问题</b>：<span class='k'>既然病根是「在支撑外的动作上评估 Q」，那更新 Q 的时候把分布外动作排除掉不就完了？</b><br><br><b>老师先承认方向对</b>：<span class='w'>Yeah, and there are approaches for doing that.</span> <b>然后给出障碍</b>：<br><br><span class='k'>Now, the unfortunate thing is we don't actually know what's in distribution and out of distribution. So we have just samples of states and actions. And for a given state, you might have one state that then chooses a1. Then you might have another state that's not exactly the same, but very similar. And that takes a2. And so in that case, a2 might technically not be seen for the first state. But you don't necessarily know—you don't know for a given state, what's in distribution and what's out of distribution.</span><br><br><b>把这段话摆成一张小表就很清楚了</b>：<br><br>· 数据里有 <b>(s₁, a1)</b> 和 <b>(s₂, a2)</b>，其中 <span class='w'>s₂ ≈ s₁ 但不相等</span>；<br>· 问：<b>(s₁, a2)</b> 在分布内吗？<br>· <span class='k'>按「逐字匹配」判 ⇒ 不在</span>（s₁ 上从没见过 a2）；<br>· <span class='k'>按「泛化」判 ⇒ 在</span>（s₂ 几乎就是 s₁，而 a2 在那里是安全的）；<br>· <b>而你手上只有样本，没有那个真正的支撑集。</b><br><br><b>⇒ 三个后果，决定了后半讲所有方法的形态：</b><br><br><b>① 没有方法会去显式判断「这个动作分布内吗」。</b><span class='w'>第一族（AWR/AWAC/IQL）的做法是<b>只用数据里成对出现的 (s,a)</b> —— 这样就根本不需要判断，因为凡是喂进去的都来自数据</span>。<b>IQL 的那句 Never need to query OOD actions! 说的就是这件事。</b><br><br><b>② 第二族（CQL）更彻底地绕开它</b>：<span class='k'>不判断哪些是 OOD，而是<b>一律</b>压低「Q 值大的地方」、同时抬高「数据里的 (s,a)」</span>。<span class='w'>净效果是支撑外被压下去 —— 但不需要知道支撑在哪</span>。<b>p25 那句 without explicitly modeling the behavior policy 正是在强调这一点。</b><br><br><b>③ 这也解释了为什么没有方法去显式学一个 π_β 的密度模型再算 KL。</b><span class='k'>那等于要求你先把支撑估出来</span>，<b>而密度估计的误差会原封不动地变成约束的误差</b>。<span class='w'>p16 那条小字说「优势加权目标<b>近似</b>一个 KL 约束目标」—— 注意是近似，而且是<b>不用显式建模 π_β</b> 地近似。这是整个第一族方法最漂亮的地方。</b>"}, "say": "<b>讲稿在这两页上先抛了一个提问，让学生自己说出病理，然后沿着学生的答案走了一遍。先看那个提问</b>：<br><br><span class='k'>Does anyone have thoughts on what will happen if you use an off policy algorithm, like soft actor critic on an offline data set?</span><br><br><b>学生的回答已经把因果链说完整了，老师只是替他整理了一遍</b>：<br><br><span class='w'>we're evaluating our Q-estimate on actions sampled from our policy, and our policy is also trying to increase likelihood on Q-values on […] actions that have high Q-values. And if we have an offline data set, and we're learning a policy that's different from the policy that collected the data, then this Q-estimate that we're supervising […] may not be accurate. Because it didn't actually necessarily see actions in the data that come from the policy we're learning.</span><br><br><b>然后是那个开车例子，它比幻灯上那张示意图具体得多</b>：<br><br><span class='k'>Here are a few of the actions in the data. Maybe this is a1. This is a2. This is a3. And there's other actions that the car could take that's not in the data set. So for example, maybe the car could go on an adventure over here. Maybe that's a4. The car could also make a U-turn. That's a5. The car could also go backwards. Maybe that's a6.</span><br><br><span class='w'>And at the beginning of training, we're going to be randomly initializing our Q-function. […] Then only some of these actions are present in the data. […] And then outside of that, your Q-function is somewhat arbitrary. And you don't actually see any data for outside that.</span><br><br><b>⭐ 下面这句是整个环路的要害</b>：<br><br><span class='k'>And then if that's outside your data, then it will still continue to think that that's a good action because it'll never actually know what the proper Q-value for that action is.</span><br><br><b>「it'll never actually know」—— 这个 never 就是在线与离线的全部区别。</b><br><br><b>老师还补了一句，把 U 形掉头那个例子说到了底</b>：<span class='w'>It never saw a car that, for example, makes a U-turn on the highway. And so the Q-value is randomly initialized for that. Some of those actions that are out of distribution will arbitrarily have higher key values. Some will have lower because it's randomly initialized, and then your policy will exploit those inaccuracies on the out of distribution actions.</span><br><br><b>注意他用的动词是 exploit。</b><span class='k'>策略不是被动地受累于估计误差，它在<b>利用</b>估计误差</b> —— <span class='w'>优化器会非常高效地找到模型最乐观的那个角落，这在任何「用学出来的模型当目标去优化」的场合都会发生</span>。<br><br><br><b>最后，关于「离散动作空间是不是就没事了」那个问答</b>：<br><br><span class='w'>So basically, everything will be the same. It's possible that your data set, if in all the states in your data set, it has full coverage of the actions, then you won't have this problem because everything will be in distribution. But in practice, usually, there will be states, where you don't have full coverage of all actions. And you can still see overestimation in those states.</span><br><br><b>⇒ 离散不是豁免，只是把「覆盖够不够」这件事变成了一个可以数出来的量。</b>", "link": {"t": "你学过的对应：CS224R L06 精读 p21（在线 Q-learning 的高估 —— 同一个词，不同的病灶，所以药也不同）", "href": "L06-精读.html"}, "res": {"tag": "推断", "v": "<b>这两页描述的失效模式，在你的课题里会以一个更锋利的形式出现，因为你的目标函数是 <span class='k'>argmin 成本</span>，而 argmin 对「乐观的错」毫无抵抗力。</b><br><br><b>把 p11 的三句话逐句翻译到你的设定</b>：<br>① <span class='w'>Q 在 OOD 动作上不可靠</span> ⇒ <b>你的成本代理模型在「从没评估过的那片配置」上不可靠</b>；<br>② <span class='k'>策略会去找 Q 过度乐观的动作</span> ⇒ <b>你的搜索会去找<span class='w'>代理模型预测最便宜</span>的配置，而那很可能只是预测误差最负的地方</b>；<br>③ <span class='w'>更新之后 Q 被系统性高估</span> ⇒ <b>你报告出来的「最优配置成本」会系统性偏低，而真去跑一遍就现形</b>。<br><br><b>⚠ 比 RL 更糟的一点</b>：<span class='k'>你的问题还有可行性约束</span>。<b>如果可行性也是用代理模型判断的，那同一个 argmin 会同时<span class='w'>低估成本</span>并<span class='w'>高估可行概率</span></b> —— <b>它会优先挑那些「看起来又便宜又安全」的配置，而「看起来」恰恰是因为没数据</b>。<span class='w'>这是 L06 的赢家诅咒在约束优化下的版本，而且它有两个方向可以诅咒你</span>。<br><br><b>⇒ 两条可以直接落到设计里的结论</b>：<br><b>① 剪枝与选择必须用悲观估计，不能用点估计。</b><span class='k'>成本用置信上界、可行性用置信下界</span> —— <b>这正是第二族（保守方法，p25–28）的思想</b>：<span class='w'>不去判断哪些配置「在支撑外」，而是一律对「看起来特别好」的那些打一个与不确定性成正比的折</span>。<br><b>② 但悲观不能一刀切。</b><span class='w'>p25 那个 α 要是取得太大，所有没评估过的配置都被压死，搜索就退化成「只在已知区域里挑」</span> —— <b>那你就彻底放弃了组合结构带来的外推能力</b>。<span class='k'>这个取舍在 p26 会被形式化成一个很干净的东西：逐点的保证换成期望意义下的保证</span>。<b>那一页值得你仔细读。</b><br><br>⚠ <b>标为推断</b>：这里把「策略」类比成「搜索/选择规则」、把「Q 函数」类比成「成本代理模型」，<span class='w'>讲义没做这个类比</span>；而且你的设定里没有自举（没有 Bellman 回路），所以<b>①→②→③ 的那个正反馈在你这里弱一些</b> —— <span class='k'>你的误差不会被写回模型再放大，除非你把搜索选出来的配置再喂回训练集（主动学习循环），那时它就完全成立了</span>。", "ref": "本讲 p11 三条；对照 CS224R L06 p21 的赢家诅咒与 CSE 541 L06 的经验均值 argmax"}},
{"r": [12, 13], "t": "一整页只有一句话：整个离线 RL 就是在治这一个病", "star": 4, "quote": "How to mitigate overestimation in offline RL?  This is the core goal of offline RL methods!  The plan for today — Offline RL: 1. Why offline RL? Can we just run off-policy methods? 2. Implicit policy constraint methods 3. Conservative methods.  Part of homework 3!", "one": "<b>p12 整页只有两行字，而它是本讲的中轴：<span class='k'>离线 RL 的全部内容就是在治 p11 那一个病</span>。</b><span class='w'>后面 20 页的两族方法，是对同一个问题的两种下手位置 —— 一种管住策略，一种管住 Q。</span>", "eq": "p12 全页内容（就这么多）：\n\n   **How to mitigate overestimation in offline RL?**\n\n   **This is the core goal of offline RL methods!**\n\n────────────────────────────────────────\n接下来两族方法的下手位置（p13 的 2 与 3）：\n\n   病：  π_θ 跑到支撑外 ──→ 在那里查 Q ──→ Q 是编的 ──→ 写回 Q ──→ 跑得更远\n            ↑                   ↑\n            │                   │\n     **第一族在这里下手**    **第二族在这里下手**\n     Implicit policy        Conservative\n     constraint methods     methods\n     （p14–23）             （p24–28）\n\n   **第一族**：让 π_θ 只在数据里的动作上被监督\n            ⇒ 它根本没机会跑到支撑外去\n            ⇒ 「约束」是**隐式**的 —— 不写出任何 KL 项，\n              却达到了「别离 π_β 太远」的效果\n\n   **第二族**：承认 π_θ 会去查支撑外，但让那里的 Q **一律偏低**\n            ⇒ 查过去也没有吸引力\n            ⇒ 代价是要调一个「压多狠」的系数 α", "pts": ["<b>p12 这种「一整页一句话」的幻灯在这门课里出现过几次，每次都是在标一个中轴，值得当书签用。</b><span class='k'>它把前 11 页和后 20 页接起来：前面是病理，后面全是药</span>。<b>而且它用的词很克制 —— mitigate，不是 solve</b>。<span class='w'>后面会看到两族方法都没有把问题消掉：第一族放弃了「可能比数据好很多」的上限，第二族引入了一个要调的超参</span>。<b>这不是作者谦虚，这是这个问题的现状</b>（<span class='k'>p32 最后一行写着 Still an active area of research!</span>）。", "<b>两族方法的名字各自标明了下手位置，读名字就能记住它们的区别。</b><span class='k'>Implicit policy constraint —— 约束<b>策略</b>，而且是<b>隐式</b>地约束</span>：<b>不写出 KL(π_θ‖π_β) < ε 这样的显式约束</b>（<span class='w'>因为那要先学一个 π_β，而 p11 的问答已经说明那条路难走</span>），<b>而是通过「只在数据里的动作上做监督」自动达到同样的效果</b>。<span class='k'>Conservative —— 改<b>Q</b></span>：<b>在 critic 的目标里直接加一项，把 Q 值大的地方往下压</b>。", "<b>「隐式」这个词要抠一下，因为它正是第一族方法的卖点所在。</b><span class='w'>显式约束的做法是：先估一个 π̂_β，再解 max_π 𝔼_π[Q] s.t. KL(π‖π̂_β) < ε</span>。<b>这条路有两处代价</b>：<span class='k'>① 要做密度估计（难，而且误差会传进约束）· ② 要在每一步解一个带约束的优化</span>。<b>而 p16 会给出一个只有一行的目标</b>：<span class='w'>θ ← argmax 𝔼_{s,a∼D}[log π_θ(a|s)·exp(A(s,a))]</span> —— <b>它看起来只是「带权的模仿学习」，但可以证明它近似上面那个带约束的问题</b>。<span class='k'>没有 π̂_β，没有约束求解器，而约束的效果在那儿</span>。<b>这是全讲最漂亮的一处。</b>", "<b>两族方法的代价各不相同，而 p32 的选型建议正是按这两种代价给的，所以现在先把它们记下来。</b><span class='k'>第一族的代价：上限被数据锁住</span> —— <b>它只在数据里的动作上监督策略，所以永远不会提出一个数据里没有的动作</b>（<span class='w'>p19 与 p23 的 + 号里都写着 Avoids querying or training on any OOD actions</span>，<b>这是优点也是天花板</b>）。<span class='k'>第二族的代价：那个 α</span> —— <b>压太轻没效果，压太狠把一切都压平</b>（<span class='w'>p32 说 CQL 的卖点正是 Just one hyperparameter，可见这一个超参是它的主要负担</span>）。", "<b>还有一个在 p13 上看不见、但对读后半讲很有用的提醒：这两族不是互斥的。</b><span class='w'>IQL（第一族的终点）里既有「只用数据里的动作」这个隐式约束，<b>也有</b>一个不对称损失在做「往某个方向少罚一点」的事</span>；<b>而那个不对称本质上是一种<span class='k'>有方向的保守</span></b>（<span class='w'>只不过它的方向是<b>乐观</b>的 —— 故意高估 π_β，因为目标是估一个比 π_β 更好的策略</span>）。<span class='k'>所以两族的分法是为了讲清楚，不是一条硬边界</span>。", "<b>最后，p13 右边那个 Part of homework 3! 的花括号正好括住了 2 与 3 两项，这个括号是有信息量的。</b><span class='k'>作业 3 要实现的是 IQL 和 CQL</span> —— <b>各族一个代表</b>（<span class='w'>p23：You will implement IQL in homework 3!；p28：You will implement CQL in homework 3!</span>）。<b>⇒ 如果你要按作业的重要性分配精读的注意力，p20–23 与 p25–28 是两个重心</b>，<span class='w'>而 p14–19 是通往第一个重心的必经之路（AWR 是 IQL 的策略提取那一步）</span>。"], "tbl": {"cap": "两族方法预览：同一个病，两个下手位置", "head": ["", "第一族：隐式策略约束（p14–23）", "第二族：保守方法（p24–28）"], "rows": [["改什么", "<b>改策略的目标（带权模仿）</b>", "<b>改 critic 的目标（加惩罚项）</b>"], ["怎么避开支撑外", "<b>只喂数据里的 (s,a) ⇒ 没机会查支撑外</b>", "<b>允许查，但把 Q 大的地方一律压低</b>"], ["要不要显式建模 π_β", "<b>不要 —— 约束是隐式的</b>", "<b>不要（p25 特意标明）</b>"], ["代表算法", "<b>Filtered BC → AWR → AWAC → <u>IQL</u></b>", "<b><u>CQL</u></b>"], ["主要代价", "<b>上限被数据锁住（不会提出数据外的动作）</b>", "<b>一个要调的 α（压太狠就全压平）</b>"], ["作业 3 要实现的", "<b>IQL（p23）</b>", "<b>CQL（p28）</b>"]]}, "say": "<b>讲稿在这里只说了一句过渡，但这句话里的 really 值得注意</b>：<br><br><span class='k'>OK, so let's talk about mitigating overestimation. This is really the core goal behind offline RL methods.</span><br><br><b>然后他没有直接进第一族，而是先插了一段关于<span class='w'>模仿学习</span>的话 —— 这段话在幻灯上对应的是 p14，但它其实是对 p12 的直接回应</b>：<br><br><span class='w'>So the one approach to offline RL is basically to do imitation learning. And the reason why imitation learning works is that you're only supervising with actions that are seen in the data. And so any approach that uses imitation learning is going to be avoiding out-of-distribution actions, somewhat implicitly because you're only going to be supervising with actions that are in the data.</span><br><br><b>⭐ 这段话是第一族方法的全部动机，而且它解释了「implicit」这个词的来历</b>：<br><br><span class='k'>模仿学习<b>天然</b>不碰分布外动作 —— 不是因为它检测了什么，而是因为它的监督信号里只有数据里的动作。</span><br><br><b>所以第一族方法的思路可以一句话概括：<span class='w'>保留模仿学习这个「天然安全」的骨架，再想办法把奖励信息塞进去</span></b>。<br><br><span class='w'>Now, we don't necessarily want to use vanilla imitation learning because the offline data may not be optimal. […] offline RL methods should provide a way to be better than the policy that underlies the data by leveraging reward information</span><br><br><b>⇒ 于是后面六页的进展路线就定下来了，每一步都在同一个骨架上多塞一点奖励信息</b>：<br><br>· <b>p15</b> <span class='k'>按轨迹回报筛一遍再模仿</span>（最粗的用法）<br>· <b>p16–17</b> <span class='k'>按每个 transition 的优势加权模仿</span>（细到单步）<br>· <b>p18–19</b> <span class='k'>优势用蒙特卡洛估（AWR）</span><br>· <b>p20–21</b> <span class='k'>优势用自举估，a' 从数据采（AWAC）</span><br>· <b>p22–23</b> <span class='k'>再把 L2 换成不对称损失，估一个比 π_β 更好的策略的值（IQL）</span><br><br><b>五步，骨架一步没动 —— 动的一直是「优势怎么估」。</b>", "link": {"t": "你学过的对应：CS224R L02 精读（模仿学习 —— 它「天然不碰分布外动作」这一点，是第一族方法的出发点）", "href": "L02-精读.html"}},
