>）。<b>⇒ 三个毛病互相独立，三个补丁可以叠加，实际的 CQL 实现里通常三者都有</b>。<span class='w'>⚠ 这一条讲义没说，是补的；但从各自治什么病可以直接推出来，而且它对读 CQL 的代码很有用（否则会以为那些组件是多余的）。</span>"], "tbl": {"cap": "两族方法的安全机制与失败模式，刚好互补", "head": ["", "第一族（IQL 等）", "<b>第二族（CQL）</b>"], "rows": [["策略会查询数据外的动作吗", "<b>不会 —— Never need to query OOD actions!</b>", "<b>会，而且主动去查（argmax / 梯度上升）</b>"], ["安全来自哪里", "<b>结构上不给机会</b>", "<b>去了也没好处 —— 那里的 Q 被压低了</b>"], ["核心超参", "<b>λ（分位）、α（温度）</b>", "<b>α（压多狠）</b>"], ["失败方向", "<b>单向 —— 最坏退化成模仿学习（安全但平庸）</b>", "<b>双向 —— α 小则炸，α 大则压平</b>"], ["能提出数据外的动作吗", "<b>不能（这是天花板）</b>", "<b>能（这是上限，也是风险）</b>"], ["连续动作下的额外代价", "<b>无</b>", "<b>logsumexp 要采样近似 ⇒ 多一个「采几个」的超参</b>"], ["actor/critic 能解耦吗", "<b>能（critic 里没有策略）</b>", "<b>不能 —— 回归项里有 𝔼_π[Q(s',a')]</b>"]]}, "tip": {"t": "补：那个 logsumexp 就是交叉熵，而它只在离散动作下算得准", "w": true, "v": "<b>幻灯上这两行写得很紧凑，有两件对实现很要紧的事它没说。<span class='k'>以下全部是补的（课堂跳过了这一段，讲稿里没有任何对应内容）</span>。</b><br><br><b>【一】那个惩罚项就是 softmax 交叉熵</b><br><br><span class='w'>化简后的惩罚是</span> <span class='k'>log Σ_a exp Q(s,a) − Q(s, a_数据)</span>。<b>把 Q(s,·) 当成一组 logit、把数据里那个动作 a_数据 当成「正确类别」</b>，<span class='w'>这个式子逐字就是 softmax 交叉熵损失</span>：<br><br><span class='k'>CE = −log softmax(Q)[a_数据] = log Σ_a exp Q(s,a) − Q(s,a_数据)</span><br><br><b>⇒ 三个实用后果</b>：<br>· <span class='w'>实现上可以直接调框架里的 <code>cross_entropy</code>（离散动作时），不用手写 logsumexp，数值稳定性也由库保证</span>；<br>· <b>语义上，CQL 的惩罚项在做一件很好懂的事：<span class='k'>训练 Q 去「分类」出哪个动作是数据里发生的那个</span></b> —— <span class='w'>于是数据里的动作 logit 最高、其余被压低</span>；<br>· <b>⚠ 但这也暴露了它的保守从哪来：<span class='k'>它把「数据里发生的那个动作」当成了唯一正确答案</span></b>。<span class='w'>如果数据里那个动作其实很差，这一项仍然在抬它 —— 靠的是回归项（真实奖励）去把它拉回来</span>。<b>⇒ α 的作用正是在「信数据」与「信奖励」之间取平衡。</b><br><br><b>【二】⚠ Σ_a 这个记号绕过了一个真实的困难</b><br><br><span class='k'>log Σ_a exp Q(s,a) 要把全部动作加一遍。</span><br>· <b>离散动作</b>：<span class='w'>能精确算（枚举所有动作，一次前向）</span>；<br>· <b>连续动作</b>：<span class='k'>这是一个积分 log ∫ exp Q(s,a) da，算不出来</span>。<br><br><b>⇒ 连续动作下必须采样近似</b>：<span class='w'>CQL 论文的做法是从当前策略与一个均匀分布里各采若干动作，做重要性加权的 logsumexp</span>。<b>代价是</b>：<br>· <span class='k'>引入采样方差</span>（<b>采少了惩罚项噪声大</b>）；<br>· <span class='k'>引入一个新超参「采几个」</span>；<br>· <span class='w'>而且在高维动作空间里，均匀采样几乎碰不到 Q 的高处 ⇒ 惩罚可能严重低估真实的 max</span>。<br><br><b>⇒ 所以 p32 那句 Conservative Q-learning: Just one hyperparameter 这个卖点，在<span class='k'>离散动作</span>下是准确的，在<span class='k'>连续动作</span>下要打折</b>。<span class='w'>做作业 3 之前先看清环境的动作空间是哪一种 —— 这决定了这一项是「一行代码」还是「一个要调的子模块」。</span>"}, "say": "<b>⚠ 同上一格：<span class='k'>p27–28 课堂上没有讲</span>（讲稿里 CQL / conservative / logsumexp 全部 0 次）。</b><b>所以这一格仍然不是引讲稿，而是按幻灯公式补的推导。</b><span class='w'>我把推导中每一处「幻灯没写、我补的」都标出来。</span><br><br><br><b>【补：那个闭式解怎么来的】</b><br><br><b>幻灯只给了结论 optimal μ(a|s) ∝ exp(Q(s,a))，没给推导。推导很短，值得自己走一遍，因为这个模式会反复遇到。</b><br><br><span class='k'>内层问题</span>（固定状态 s，对分布 μ 最大化，约束是 Σ_a μ(a) = 1、μ ≥ 0）：<br><br><span class='w'>max_μ  Σ_a μ(a)·Q(s,a)  −  Σ_a μ(a)·log μ(a)</span><br><br><b>第一项是线性的（想把质量全压在 Q 最大处），第二项是熵（想保持分散）。两者拉锯。</b><br><br><span class='k'>用拉格朗日乘子处理归一化约束，对 μ(a) 求偏导置零</span>：<br><br><span class='w'>Q(s,a) − log μ(a) − 1 − ν = 0  ⇒  log μ(a) = Q(s,a) − 1 − ν  ⇒  μ(a) ∝ exp(Q(s,a))</span><br><br><b>⇒ 这就是幻灯那一行。</b><span class='k'>归一化之后 μ*(a|s) = exp(Q(s,a)) / Σ_{a'} exp(Q(s,a'))，也就是对 Q 取 softmax</span>。<br><br><b>再把 μ* 代回目标，得到最优值</b>：<br><br><span class='w'>Σ_a μ*(a)·Q(s,a) − Σ_a μ*(a) log μ*(a)  =  **log Σ_a exp Q(s,a)**</span><br><br><b>⇒ 这正是 Gibbs 变分原理：<span class='k'>「线性目标 + 熵」的最优值等于对数配分函数</span>。</b><br><br><b>⚠ 一处记号上的提醒</b>：<span class='w'>幻灯把这一行写成 𝔼_{s∼D,a∼μ(·|s)}[Q(s,a)] = log Σ_a exp(Q(s,a))</span>。<b>严格说左边应该是「内层<b>最优值</b>（含熵项）」，而不是「在 μ* 下 Q 的期望」</b> —— <span class='k'>后者比前者少一个 ℋ(μ*) 的量</span>。<b>幻灯是省写</b>（<span class='w'>因为 R(μ) 那一项反正要加进去，两者在最终的目标里是一回事</span>）。<b>⇒ 自己推的时候要把熵项带着，否则会对不上。（这一处是我对照 Gibbs 公式看出来的，标为推断。）</b><br><br><br><b>【补：熵正则的权重在控制什么】</b><br><br><b>幻灯写的是 Common choice，没有讨论熵的权重。把两端推一下</b>：<br><br>· <span class='k'>熵权重 → ∞</span>：<b>μ* → 均匀分布 ⇒ 惩罚项 → Q 在全部动作上的平均值</b> ⇒ <span class='w'>压得温和、压得分散（相当于给整个 Q 减一个平均水平）</span>；<br>· <span class='k'>熵权重 → 0</span>：<b>μ* → 全部质量在 argmax 上 ⇒ 惩罚项 → max_a Q(s,a)</b> ⇒ <span class='w'>只狠压最高的那一个动作</span>。<br><br><b>⇒ 所以熵正则实际上在调「压的<span class='k'>范围</span>」，而 α 在调「压的<span class='k'>力度</span>」。</b><span class='w'>两者方向不同，但效果会互相掩盖 —— 这也解释了为什么实践中通常把熵权重吸收进 Q 的尺度（或者说固定为 1），只留 α 一个超参给用户调</span>。<b>（这一段是补的。）</b><br><br><br><b>【补：第 2 步那两行为什么必须和惩罚项一起出现】</b><br><br><b>把 p27 的第 2 步单独拿出来看：<span class='k'>离散情形是对 Q̂ 取 argmax，连续情形是对 Q̂ 做梯度上升</span>。</b><br><br><b>⇒ 这两行<b>就是</b> p10 那个 SAC 的策略更新，一个字没改。</b><span class='w'>而 p10/p11 已经论证过：在离线数据上照这个做，策略会跑到支撑外去利用虚高的 Q</span>。<br><br><b>⇒ 那 CQL 凭什么敢这么做？<span class='k'>因为它的 Q̂ 已经不是原来那个 Q̂ 了</span></b>。<span class='w'>惩罚项把「数据外比数据内高出的那部分」压平之后，argmax 跑过去也找不到便宜可占</span>。<br><br><b>⇒ 一句话：<span class='k'>CQL 没有改策略更新，它改了策略所看的那张地图。</span></b><b>这和第一族的做法恰好互补</b> —— <span class='w'>第一族不改地图，改的是「只许在地图上有记录的地方走」</span>。<b>（这个对照是补的。）</b>", "link": {"t": "你学过的对应：CS224R L06 精读 p16–p17（目标网络与双 Q —— 它们治的毛病与 CQL 治的互相独立，所以实现里通常叠加）", "href": "L06-精读.html"}},
{"r": [29, 30], "t": "总结：五句话收口，而每一句都指向前面一处具体的页码", "star": 4, "quote": "The plan for today — Offline RL: 1. Why offline RL? Can we just run off-policy methods? 2. Implicit policy constraint methods 3. Conservative methods.  Part of homework 3!  Summary — Why offline RL? Online data is expensive. Reusing offline data is good!  Key challenge: Overestimating Q-values because of shift between π_β and π_θ.  Approaches: 1. filtered or weighted imitation learning is a simple baseline  2. implicitly constrain the policy to π_β by only supervising on actions in data  3. construct conservative objective by penalizing Q-values.  Trajectory stitching allows offline RL methods to improve over imitation.", "one": "<b>五句话，每一句都能指回一处具体的页码。</b><span class='w'>值得注意的是第 2 条的措辞 —— <b>implicitly constrain the policy to π_β <u>by only supervising on actions in data</u></b>：它把「隐式约束」这个抽象名字还原成了一句具体的操作说明。</span>", "eq": "p30 五句话，逐句对回去：\n\n────────────────────────────────────────\n**① Why offline RL? Online data is expensive. Reusing offline data is good!**\n     ← p7 的第三条理由（讲稿里讲得最具体的那条：\n       每改一次算法就要重采一遍数据，迭代速度被采样速度锁死）\n\n**② Key challenge: Overestimating Q-values because of shift between π_β and π_θ**\n     ← p10–11 的那个正反馈环\n       （注意这句话把「分布偏移」与「高估」接成了因果：\n        偏移是因，高估是果）\n\n**③ Approach 1: filtered or weighted imitation learning is a simple baseline**\n     ← p15（Filtered BC）与 p16–19（AWR）\n       ⚠ 这里把两者合成了一条，并都标成 baseline\n\n**④ Approach 2: implicitly constrain the policy to π_β\n    by only supervising on actions in data**\n     ← p20–23（AWAC / IQL）\n       ⭐ 后半句就是「隐式」的操作定义\n\n**⑤ Approach 3: construct conservative objective by penalizing Q-values**\n     ← p25–28（CQL）\n       ⚠ 课堂跳过了这一族，所以这是你唯一能听到它被提起的地方\n\n**⑥ Trajectory stitching allows offline RL methods to improve over imitation.**\n     ← p14（那张 s1 → s9 的图）\n       ⇒ 回答了 p6 第三个学习目标\n\n────────────────────────────────────────\n**把整讲压成一条线：**\n\n   数据集给定（不能再采）\n     ↓\n   目标函数的期望在 π_θ 下，数据在 π_β 下   ⇒ **分布偏移**（p8）\n     ↓\n   自举目标要查 Q̂(s', a')，而 a' 可能在支撑外  ⇒ **无根据的虚高**（p11）\n     ↓\n   而策略更新是 argmax，它**主动**去找虚高处    ⇒ **正反馈，且无出口**（p11）\n     ↓\n   ┌─────────────────────┴─────────────────────┐\n   **第一族：别去**                      **第二族：去了也没好处**\n   只在数据里的 (s,a) 上监督              把「数据外比数据内高出的」压平\n   （p15 → p16 → p18 → p20 → p23）        （p25 → p26 → p28）\n     ↓                                        ↓\n   上限 = 数据支撑内最好的                 上限更高，但要调 α", "pts": ["<b>⭐ 第 ④ 条的措辞是全页最有价值的一处，值得当作「隐式约束」这个概念的定义来记。</b><span class='k'>implicitly constrain the policy to π_β <b>by only supervising on actions in data</b></span>。<b>前半句是目标（约束到 π_β），后半句是手段（只在数据里的动作上做监督）</b>。<span class='w'>⇒ 这句话把一个听起来很理论的名字（implicit policy constraint）还原成了一行可以写进代码的操作</span>：<b>检查你的策略损失里，那个动作是不是全部来自数据集</b>。<span class='k'>如果是，你就有了隐式约束；如果不是（像 p27 的第 2 步），你就必须另找一个安全机制</span>。", "<b>第 ② 条把「偏移」与「高估」接成了因果，这个因果方向要看清，否则会误判药方。</b><span class='k'>shift between π_β and π_θ 是<b>因</b>，overestimating Q-values 是<b>果</b></span>。<b>⇒ 于是治法有两个入口：治因（让 π_θ 别离 π_β 太远 = 第一族）或者治果（让高估不发生 = 第二族）</b>。<span class='w'>⚠ 而 L06 的高估是另一个因（有限样本噪声 + 同一网络既选又评），所以它的药（双 Q）在这里治不了病</span> —— <b>这一点在 L07.a 的 p11 那张表里对照过</b>。<span class='k'>⇒ 同一个症状，先问因，再配药。</b>", "<b>⚠ 第 ③ 条把 Filtered BC 和 AWR 合成了一条，并且都标成 baseline，这个归类值得想一下。</b><span class='w'>从算法谱系看，AWR 已经属于「优势加权」这一支，和 IQL 共用同一个策略提取式</span>；<b>但从「能不能拼接」这个实用标准看，AWR 比 Filtered BC 强（它是单步加权），比 AWAC/IQL 弱（它的优势是 π_β 的、而且用 MC 估）</b>。<span class='k'>⇒ 把它和 Filtered BC 一起叫 baseline，意思是「这两个都是你该先试一遍的对照组」，不是「它们原理相同」</span>。<b>⇒ p32 的选型表只提了 Filtered BC，没提 AWR —— 可见实务上 AWR 的位置被 IQL 挤掉了。</b>", "<b>第 ⑥ 条单独成行、放在最后，是因为它回答的是 p6 那三个学习目标里的第三个。</b><span class='k'>Trajectory stitching allows offline RL methods to improve over imitation</span>。<b>⇒ 把 p6 的三个目标和 p30 对一遍，会发现它们是严格对应的</b>：<span class='w'>「the key challenges」→ 第 ② 条 · 「two approaches (& why they work!)」→ 第 ④⑤ 条 · 「how offline RL can improve over imitation learning」→ 第 ⑥ 条</span>。<b>⇒ 这种「开头列目标、结尾逐条收口」的结构，在这门课里很一致</b>（<span class='k'>L06 的 p6 与 p29 也是这样</span>），<b>复习时可以直接拿这两页当索引用。</b>", "<b>⚠ 关于第 ⑤ 条有一件必须说明的事：<span class='k'>这是整堂课里唯一一次提到保守方法</span>。</b><span class='w'>我核对过全部讲稿：conservative / CQL / push down / push up / logsumexp 的出现次数全部为 0，而老师在讲到 p31 时自己说了 This example application is for the algorithm we didn't cover</span>。<b>⇒ 所以 p24–29 那一整段（两页公式 + 两页算法）是幻灯里有、课上跳过的</b>。<span class='k'>⇒ 对你的实际影响有两点</span>：<b>① 作业 3 要实现 CQL（p28 明写），而课上没讲过它，所以必须靠幻灯 + 论文自学</b>；<b>② 如果考试只考课上讲过的内容，这一族的分量会很轻 —— 但这件事得向助教确认，不能靠猜</b>。", "<b>最后把两族方法的「上限」并排说清楚，这是看完整讲之后最该有的判断力。</b><span class='k'>第一族的上限 = 「数据支撑内最好的策略」</span> —— <b>它永远不会提出一个数据里没有的动作，所以数据有多好，它最多就有多好（加上拼接带来的组合收益）</b>；<span class='k'>第二族的上限更高</span> —— <b>它的策略可以提出任何动作，只要那个动作在压低后的 Q 下仍然胜出</b>。<span class='w'>⇒ 代价是：这个「更高」是用「可能更糟」换来的（α 没调对就会炸）</span>。<b>⇒ 所以没有哪一族占优，p32 的推荐完全是按「你愿不愿意调参」和「你要不要接着做在线微调」来分的。</b>"], "tbl": {"cap": "p30 五句话各自指回哪一页", "head": ["p30 的句子", "指回", "那一页上真正发生的事"], "rows": [["<b>Online data is expensive</b>", "<b>p7 第三条理由</b>", "<b>每改一次算法就要重采数据 ⇒ 迭代速度被采样速度锁死</b>"], ["<b>Overestimating Q-values because of shift</b>", "<b>p10–11</b>", "<b>偏移是因、高估是果；argmax 主动找虚高处，且无出口</b>"], ["<b>filtered or weighted IL is a simple baseline</b>", "<b>p15 · p16–19</b>", "<b>按轨迹筛（不能拼接）→ 按 transition 加权（能拼接）</b>"], ["<b>implicitly constrain … by only supervising on actions in data</b>", "<b>p20–23</b>", "<b>a' 从 D 采（AWAC）→ V 取高分位（IQL）</b>"], ["<b>construct conservative objective by penalizing Q-values</b>", "<b>p25–28</b>", "<b>⚠ 课上跳过了这一族，这里是唯一一次提起</b>"], ["<b>Trajectory stitching allows … improve over imitation</b>", "<b>p14</b>", "<b>s1→s9 这条轨迹数据里不存在，是拼出来的</b>"]]}, "say": "<b>这一页讲稿有对应内容，而且基本就是幻灯的逐句展开。原话</b>：<br><br><span class='k'>And then I guess to summarize the point of offline RL. So online data is really expensive, because we have to recollect it every time we run our algorithm. And it's really, really useful to reuse offline data. One of the big challenges with offline RL is this shift between your behavior policy and your learn policy. And we talked about a filtered or weighted imitation learning method as a baseline. And we talked about how we can actually explicitly constrain the policy to the behavior policy by only supervising the policy on actions in your data. And so that allowed us to get rid or move away from this distribution shift problem. And then the trajectory stitching idea that we talked about before allows us to improve over vanilla imitation learning.</span><br><br><b>⚠ 注意一处：<span class='k'>讲稿里他说的是 <b>explicitly</b> constrain the policy，而幻灯上写的是 <b>implicitly</b> constrain the policy</b>。</b><br><br><span class='w'>这是一处口误（或者 ASR 听错）—— 整个第二节的标题就是 <b>Implicit</b> policy constraint methods（p6/p13/p24 三次出现），IQL 的名字里也是 Implicit</span>。<b>⇒ 以幻灯为准：这一族的约束是<b>隐式</b>的</b>（<span class='k'>不写出 KL 项，只通过「只监督数据里的动作」达到效果</span>）。<b>如果按字面读成 explicitly，整族方法的要点就反了。</b><br><br><br><b>另外注意讲稿这一段的覆盖范围 —— 它<span class='k'>只讲了两族里的一族</span></b>：<br><br>· <span class='w'>filtered or weighted imitation learning as a baseline</span> ✓（对应 p30 第 ③ 条）<br>· <span class='w'>constrain the policy … by only supervising on actions in your data</span> ✓（第 ④ 条）<br>· <span class='w'>trajectory stitching</span> ✓（第 ⑥ 条）<br>· <b>⚠ 第 ⑤ 条（conservative objective by penalizing Q-values）<span class='k'>讲稿里没有</span></b><br><br><b>⇒ 这与我在 p24–28 那两格里核对的结果一致：保守方法这一族课上确实跳过了。<span class='w'>而 p30 幻灯上第 ⑤ 条还在，所以你在读幻灯时会以为它讲过 —— 这正是需要标出来的地方。</span></b><br><br><br><b>最后，他在这一段结束后紧接着就提到了 p31，而那句话值得单独记</b>：<br><br><span class='k'>This example application is for the algorithm we didn't cover.</span><br><br><b>⇒ 「我们没讲的那个算法」。<span class='w'>这是老师自己对这段跳过的确认。</span></b>", "link": {"t": "你学过的对应：CS224R L06 精读 p6 与 p29（同样的「开头列目标、结尾逐条收口」结构 —— 复习时拿这两页当索引）", "href": "L06-精读.html"}},
{"r": [31, 33], "t": "一个线上应用、一张选型表，和下一讲的那个问题", "star": 4, "quote": "An example application — Optimizing policy for sending notifications to users on LinkedIn.  Prabhakar, Yuan, Yang, Sun, Muralidharan. Multi-Objective Optimization of Notifications Using Offline RL. '22.  WAU: weekly active users.  Volume: total # of notifications.  CTR: click-through-rate of notifications.  Which offline RL algorithm to use?  If you only want to train offline: Filtered behavior cloning: Good first approach to using offline data.  Conservative Q-learning: Just one hyperparameter.  Implicit Q-learning: Can stitch data & explicitly constrained to data support.  If you want offline pre-training + online fine-tuning: Implicit Q-learning: Seems most performant.  Note: Still an active area of research!  See also: IDQL (Hansen-Estruch et al. IDQL: Implicit Q-Learning as an Actor-Critic Method with Diffusion Policies. 2023).  Course reminders — Homework 2 due next Friday. (start early!!)  Project - CA mentors assigned - Fill out AWS form for GPU quota - Proposal due Friday graded fairly lightly, for your benefit!  Next time Friday lecture: How do we get rewards??", "one": "<b>p31 那个 LinkedIn 例子是离线 RL 最典型的落地形态：<span class='k'>你有海量的历史日志，而在线试错的代价是真实用户的体验</span>。</b><b>p32 的选型表按两个问题分叉</b>：<span class='w'>你愿不愿意调参（Filtered BC 还是 CQL/IQL），以及你之后要不要接在线微调（这一条上 IQL 独占）。</span>", "eq": "**p31：LinkedIn 的通知发送策略**\n\n   任务：**Optimizing policy for sending notifications to users on LinkedIn**\n\n   三个指标（讲义列出的）：\n     **WAU**     weekly active users      —— 周活跃用户\n     **Volume**  total # of notifications —— 通知总量\n     **CTR**     click-through-rate       —— 点击率\n\n   ⇒ 这三个是**互相拉扯**的（论文标题里的 Multi-Objective 就指这件事）：\n     多发通知 ⇒ Volume ↑、可能 WAU ↑，但 CTR ↓、长期还可能把人逼走\n\n   **为什么这个任务非离线不可**：\n     · 历史日志**海量**（每天发出去的通知就是数据）\n     · 在线试错的代价是**真实用户的体验**，而且不可逆\n       （给一百万人发一周垃圾通知，流失的人不会回来）\n     · 反馈有**长期**成分（WAU 是周级指标）⇒ 正是序贯决策问题\n\n   ⚠ **This example application is for the algorithm we didn't cover.**（讲稿原话）\n     ⇒ 这篇论文用的算法本课没讲。\n\n────────────────────────────────────────\n**p32：选型表（按两个问题分叉）**\n\n   **问题一：只做纯离线训练？**\n\n     **Filtered behavior cloning**  —— Good first approach to using offline data\n        ⇒ 先试这个。几乎没有超参、不会发散、二十行。\n\n     **Conservative Q-learning**    —— Just one hyperparameter\n        ⇒ 卖点是「只有一个 α 要调」\n          ⚠ 这个卖点在连续动作下要打折（logsumexp 要采样近似）\n\n     **Implicit Q-learning**        —— Can stitch data & explicitly constrained\n                                       to data support\n        ⇒ 讲稿补的条件：**especially if you have a broader data set**\n\n   **问题二：要做离线预训练 + 在线微调？**\n\n     **Implicit Q-learning**        —— **Seems most performant.**\n        ⇒ 这一栏只有一个选项。讲稿：It can also be used with online\n          data collection quite effectively, and it works quite well there.\n\n   **并注**：**Still an active area of research!**\n   **延伸**：**IDQL**（Hansen-Estruch et al. 2023）—— 用扩散模型当策略类的 IQL 变体\n\n────────────────────────────────────────\n**p33：下一讲的那个问题**\n\n   **Next time Friday lecture: How do we get rewards??**\n\n   ⇒ 这一讲从头到尾假设 r(s,a) 是给定的（p8 的形式化里它就是一行 r = r(s,a)）。\n     而 LinkedIn 那个例子正好暴露了这个假设的脆弱：\n     **「用户满意」要怎么写成一个标量奖励？**\n     ⇒ 这正是 L08（奖励学习）与 L09（RLHF）要处理的事。", "pts": ["<b>⚠ 关于 p32 那个 Implicit Q-learning 条目，幻灯上有一处用词必须纠正，否则会把两族方法搞混。</b><span class='k'>幻灯写的是 Can stitch data & <b>explicitly</b> constrained to data support</span>。<b>这里的 explicitly 和「implicit policy constraint」里的 implicit 并不矛盾，因为它们修饰的是<span class='w'>两件不同的事</span></b>：<span class='k'>「策略约束」是隐式的（不写 KL 项）</span>，<b>而「只用数据支撑内的动作」这件事是<span class='w'>显式</span>的（算法的每个输入都明摆着来自 D）</b>。<span class='w'>⇒ 这句话的意思是「它对数据支撑的约束是明确的、结构性的，不是靠一个软惩罚去近似」</span>。<b>⇒ 对照 CQL：CQL 对支撑的处理才是「软」的（靠 α 压一压），所以这个 explicitly 是在和 CQL 对比。</b>", "<b>把 p32 的三行按「你在意什么」重排一遍，比按算法名记有用得多。</b><span class='k'>在意「尽快拿到一个说得过去的结果」⇒ Filtered BC</span>（<span class='w'>先跑它，拿到一个数当底线</span>）；<span class='k'>在意「调参成本低」⇒ CQL</span>（<span class='w'>只一个 α；但注意连续动作下要加上采样那部分</span>）；<span class='k'>在意「数据宽、想要拼接」⇒ IQL</span>（<span class='w'>讲稿补的条件是 broader data set</span>）；<span class='k'>在意「之后还要在线微调」⇒ IQL，没有别的选项</span>。<b>⇒ 注意前三条是并列的权衡，第四条是独占的 —— 这个结构说明 IQL 在「离线+在线」这个组合场景里确实有结构性优势</b>（<span class='w'>因为它的 critic 训练与策略解耦，换成在线数据之后 critic 那部分几乎不用改</span>）。", "<b>⚠ 讲稿在 p32 上加了一个幻灯上没有的条件，这个条件对选型很实际。</b><span class='k'>implicit Q-learning is going to be probably work better, if you have, especially if you have a <b>broader data set</b></span>。<b>为什么是「数据更宽」？把 IQL 的机制倒推一遍就明白了</b>：<span class='w'>它靠「在某个状态上的 Q 分布里取一个高分位」来做改进</span>；<b>而要有「分布」可取分位，那个状态上就得见过<b>多个</b>动作</b>。<span class='k'>⇒ 数据窄（每个状态只有一两个动作）⇒ 分布退化成一两个点 ⇒ 高分位和「噪声的最大值」区分不开</b>（<b>这正是 L07.b p22 最后那条说的界限</b>）。<b>⇒ 极端情形就是 p18 那个确定性 π_β：优势全为 0，一切退化成模仿学习。</b>", "<b>p31 那个应用的三个指标值得多看一眼，因为它展示了一个真实任务里「奖励」有多难定。</b><span class='k'>WAU（周活跃用户）· Volume（通知总量）· CTR（点击率）</span> —— <b>三者互相拉扯</b>：<span class='w'>多发通知 ⇒ Volume 上去、短期点击数可能上去，但 CTR 下降、而且长期可能把用户逼到关闭通知甚至流失</span>。<b>⇒ 论文标题里的 Multi-Objective 指的就是这件事：<span class='k'>没有一个现成的标量奖励，得自己把多个指标组合出来</span></b>。<b>⇒ 而「怎么组合」这个选择会直接决定学出来的策略是什么样 —— 这不是一个技术细节，这是整个问题设定的一部分。<span class='w'>p33 预告的下一讲（How do we get rewards??）正是冲着这件事去的。</span></b>", "<b>再想一下为什么这个任务「非离线不可」，这个判断方法可以复用到别的场景。</b><span class='k'>三个条件同时成立时，离线 RL 几乎是唯一选项</span>：<b>① 历史数据海量且免费</b>（<span class='w'>每天发出去的通知天然就是数据</span>）；<b>② 在线试错的代价是真实且不可逆的</b>（<span class='w'>给一百万人发一周垃圾通知，流失的用户不会回来</span>）；<b>③ 反馈有长期成分，所以不是一个单步的监督学习问题</b>（<span class='w'>WAU 是周级指标，当下发不发通知会影响一周后的活跃度</span>）。<span class='k'>⇒ 把这三条当成一个检查表：少了 ③，这就是个普通的点击率预估问题；少了 ②，直接做在线 A/B 更省事；少了 ①，什么方法都救不了</span>。", "<b>⚠ 关于那句 Still an active area of research!，它不是免责声明，它对你怎么读文献有实际含义。</b><span class='w'>离线 RL 这个方向的一个现实状况是：benchmark 上的排名对实现细节与超参很敏感</span>，<b>而「某方法比某方法好」的结论经常被后续工作推翻</b>。<span class='k'>⇒ 所以 p32 这张表的正确读法是「2025 年春这门课的任课老师的实践经验」，不是「文献共识」</b>。<b>⇒ 两条实际建议</b>：<span class='w'>① 自己的实验里一定要带 Filtered BC 这个基线（它最难被实现细节左右）· ② 引用「哪个方法更好」时引具体的 benchmark 与版本，不要引课程幻灯</span>。", "<b>最后，p33 那个预告把这一讲的一个隐含假设挑了出来，值得作为整讲的收尾来想。</b><span class='k'>How do we get rewards??</span> —— <b>这一讲从头到尾都假设 r(s,a) 是给定的</b>（<span class='w'>p8 的形式化里它只是一行 r = r(s,a)，和动力学并列</span>）。<b>而整讲所有方法都<span class='k'>重度依赖</span>这个假设</b>：<span class='w'>Filtered BC 要靠 r 算轨迹回报来筛、AWR 要靠 r 算优势、CQL 的回归项里也有 r</span>。<b>⇒ 如果奖励本身是错的或者是硬凑的，上面这些精巧的「不碰分布外动作」就全是在精确地优化一个错的目标</b>。<span class='k'>⇒ 这正是 L08（奖励学习）与 L09（RLHF / 偏好优化）存在的理由，也是为什么它们紧跟在这一讲后面。</span>"], "tbl": {"cap": "p32 选型表（并上讲稿补的条件）", "head": ["你的情形", "推荐", "理由", "⚠ 注意"], "rows": [["<b>刚拿到数据，想先有个数</b>", "<b>Filtered BC</b>", "<b>Good first approach；几乎没有超参、不会发散</b>", "<b>不能拼接 —— 它是底线，不是目标</b>"], ["<b>不想花时间调参</b>", "<b>CQL</b>", "<b>Just one hyperparameter（α）</b>", "<b>连续动作下 logsumexp 要采样近似 ⇒ 这个卖点打折（补的）</b>"], ["<b>数据宽，想要拼接</b>", "<b>IQL</b>", "<b>Can stitch data & explicitly constrained to data support</b>", "<b>讲稿补的条件：especially if you have a broader data set</b>"], ["<b>离线预训练 + 在线微调</b>", "<b>IQL（唯一选项）</b>", "<b>Seems most performant；在线数据上也很有效</b>", "<b>λ 此时可往 0.5 挪（p23 那个问答）</b>"], ["<b>想往前再读一步</b>", "<b>IDQL（2023）</b>", "<b>用扩散模型当策略类的 IQL 变体</b>", "<b>讲稿：beyond using diffusion, it also is a bit different in terms of how this update is done</b>"]]}, "say": "<b>这三页讲稿有对应内容，而且补了两处幻灯上没有的东西。先看那句关于 p31 的</b>：<br><br><span class='k'>This example application is for the algorithm we didn't cover.</span><br><br><b>⇒ 这是老师自己确认 p25–28 那一族课上跳过了。</b><span class='w'>而 p31 这篇 LinkedIn 论文用的正是「没讲的那个算法」—— 所以这一页在课上只是一闪而过</span>。<br><br><br><b>然后是选型那一段，这里有一个幻灯上没有的条件</b>：<br><br><span class='k'>If you want to train offline filter behavior cloning and implicit Q-learning are both good approaches, but implicit Q-learning is going to be probably work better, if you have, <b>especially if you have a broader data set</b>. And if you want to do offline pre-training and online fine-tuning, IQL is actually a very good algorithm for doing that. It can also be used with online data collection quite effectively, and it works quite well there.</span><br><br><b>⚠ 注意两件事</b>：<br><br>· <b>① 口头版的选型里<span class='k'>只提了 Filtered BC 和 IQL</span></b>，<span class='w'>CQL 没出现</span> —— <b>和幻灯上三条并列不一样</b>。<span class='k'>这与「那一族没讲」是一致的</span>。<br>· <b>② broader data set 这个条件是口头加的</b>，<span class='w'>幻灯上没有</span>。<b>而它解释了 IQL 的机制依赖什么</b>：<span class='k'>要在某个状态的 Q 分布里取高分位，那个状态上就得见过多个动作。数据窄 ⇒ 分布退化成一两个点 ⇒ 高分位和噪声的最大值区分不开</span>。<br><br><br><b>最后是 IDQL 那一段，讲稿比幻灯多了一句</b>：<br><br><span class='w'>There's also a variant of IQL called IDQL that uses diffusion policies for your policy class right here. And it also works quite well. And so if you're interested in diving more into IQL-like algorithms, I would encourage you to check out IDQL. It is actually—beyond using diffusion, it also is a bit different in terms of how this update is done.</span><br><br><b>⇒ 最后半句值得留意：<span class='k'>IDQL 的差别<b>不只</b>是换了策略类（扩散模型），它的更新方式也不同</span>。</b><span class='w'>幻灯只写了标题（Implicit Q-Learning as an Actor-Critic Method with Diffusion Policies），从标题看也确实是把 IQL 重新解释成了一个 Actor-Critic 方法 —— 也就是说那个「隐式的策略」被显式化了</span>。<b>⚠ 但具体差在哪，老师没说、幻灯没写，<span class='k'>要知道就得去读论文</span>。标为待核。</b><br><br><br><b>⚠ 最后交代一处：p33 那页课务与 p2 几乎完全相同</b>（<span class='w'>Homework 2 due next Friday、CA mentors assigned、AWS form、Proposal due Friday</span>），<b>唯一的新内容是最后那行预告</b>：<br><br><span class='k'>Next time Friday lecture: How do we get rewards??</span><br><br><b>⇒ 两个问号。这一讲从头到尾把 r(s,a) 当成给定的，而下一讲要问它从哪来。</b>", "link": {"t": "你学过的对应：CS224R L02 精读（模仿学习 —— 它不需要奖励，这正是 p33 那个问题的另一种答法：如果拿不到奖励，就只能回去模仿）", "href": "L02-精读.html"}, "res": {"tag": "推断", "v": "<b>p31 那个「三个互相拉扯的指标」和 p33 那个问号，加在一起正好戳到你课题里一个<span class='k'>必须自己想清楚</span>的设计决定。</b><br><br><b>你的问题是「找最便宜的<u>可行</u>配置」，这个表述里已经做了一个选择</b>：<span class='w'>把多个关心的量分成了「一个要优化的」（成本）和「若干要满足的」（约束）</span>。<b>而 LinkedIn 那个例子选的是另一条路</b>：<span class='k'>把三个指标组合成一个标量目标（Multi-Objective Optimization）</span>。<br><br><b>⇒ 两条路的区别不是技术细节，它决定了整个问题的形状</b>：<br>· <span class='k'>约束形式（你选的）</span>：<b>好处是「可行」这件事有明确语义、结果容易向人解释、而且不需要在不同量纲之间定权重</b>；<span class='w'>代价是约束的边界必须说得出来（延迟 ≤ 100ms 这个 100 从哪来？），而且边界附近的解会对那个数字非常敏感</b>。<br>· <span class='k'>标量化形式（LinkedIn 选的）</span>：<b>好处是单目标优化的工具都能直接用</b>；<span class='w'>代价是那组权重必须自己定，而权重的选择会悄悄决定答案 —— 而且它通常无法从数据里学出来</b>。<br><br><b>⭐ 对你的具体建议</b>：<span class='k'>既然你已经选了约束形式，就应该在论文里<b>正面论证</b>这个选择，而不是默认它</span>。<b>最有力的论证是「约束来自外部、不由我决定」</b>（<span class='w'>比如 SLA 规定的延迟上限、硬件给定的内存上限、预算批下来的额度</span>）—— <b>这时候约束形式不只是方便，它是对问题的<span class='k'>忠实</span>表述</b>，<span class='w'>而标量化反而是在偷偷替决策者定权重</span>。<b>⇒ 这也顺带解释了「可行性」为什么值得单独建模：它不是成本的一部分，它是一道由别人划的线。</b><br><br><b>而 p33 那个问号的对应版本是：<span class='k'>你的「成本」是从哪来的？</span></b><span class='w'>如果成本是直接测出来的（运行时间、金额），那你比 RL 幸运得多 —— 奖励是客观的</span>；<b>但如果成本里混了「主观质量」这类东西</b>（<span class='k'>比如配置影响的是输出质量而不只是速度</span>），<b>那你就撞上了和 L08/L09 同一个问题</b>：<span class='w'>那个标量得由人的偏好构造出来，而构造方式本身会成为方法的一部分</span>。<b>⇒ 建议在问题设定那一节明确声明你的成本是可直接测量的（如果是），<span class='k'>这会免掉一整类质疑</span>。</b><br><br>⚠ <b>标为推断</b>：<span class='w'>讲义只是举了一个多目标的应用并预告下一讲，没有讨论「约束形式 vs 标量化」的取舍</span>。<b>上面的论证是我按你的课题设定推的；多目标优化与约束优化的等价性与差别有成熟文献（标量化与 Pareto 前沿那一套），要写进论文应当引那边，不能引本课。</b>", "ref": "本讲 p31 的三个互相拉扯的指标（WAU / Volume / CTR）与 p33 的 How do we get rewards??；⚠ 取舍论证为推断，讲义未讨论"}}

var TH = {"title": "L07 接上课题的哪一段：当你不能再采样时，argmin 就变成了敌人", "arc": "这一讲是整门课里离你的课题<b>最近</b>的一讲，近到可以几乎逐句翻译。<br><br>它的设定是：<span class='k'>给定一批别人采的数据，不能再采，而你要输出一个比数据里的策略更好的策略</span>。<br>你的设定是：<span class='k'>给定一批历史评估记录（或一个很紧的评估预算），而你要输出一个最便宜的可行配置</span>。<br><br>两边共享同一个核心困难，而讲义在 p11 把它说得比任何 bandit 教材都直白：<br><br><b>① 你的估计量在「没有数据的那片区域」上是<u>任意的</u></b>（<span class='w'>Q-function will be unreliable on OOD actions</span>）；<br><b>② 而你的目标函数是一个 argmax/argmin，它会<u>主动去搜索</u>那片区域里最乐观的角落</b>（<span class='w'>policy will seek out actions where Q-function is over-optimistic</span>，讲稿用的动词是 <b>exploit</b>）；<br><b>③ 在线设定下这个环会被下一轮真实数据切断；离线设定下<u>它没有出口</u></b>（<span class='k'>it'll never actually know what the proper Q-value for that action is</span>）。<br><br>⭐ <b>第 ③ 条是这一讲相对 L06 的全部新意，也是它对你最有价值的地方。</b><span class='w'>L06 的赢家诅咒是「偏高一点，下一轮纠正回来」；这一讲的是「偏高很多，而且永远不会被纠正」。</span><br><br>而两族解法给了你两个<b>形状完全不同</b>的工具：<br><br>· <span class='k'>第一族（隐式约束）</span>：<b>只在「有数据」的地方做监督</b>，于是你的选择规则结构上没机会跑到没数据的地方去。<span class='w'>代价是上限被数据锁住。</span><br>· <span class='k'>第二族（保守）</span>：<b>允许去，但把「没数据处的乐观」压平</b>。<span class='w'>代价是一个要调的 α。</span><br><br>⭐ 而真正值得你带走的那一条，不是任何算法，是 <b>p25 → p26 的那次「保证降级」</b>：<br><span class='k'>把「我的估计在每一点上都不偏高」换成「我对<u>自己输出的那个东西</u>的估计不偏高」</span>。<br>前者强、好听、但代价是算法不可用；后者弱、但正好覆盖唯一的使用场景。<br><b>这是一条可以直接写进你论文定理陈述方式里的方法论。</b><br><br>⚠ <b>另外必须说明：p24–p29（保守方法这一整族）课堂上跳过了</b>，<br>讲稿里 conservative / CQL / push down / logsumexp 出现次数<b>全部为 0</b>，<br>老师自己在 p31 处说 <span class='w'>This example application is for the algorithm we didn't cover</span>。<br>所以这一族的内容在精读里是<b>按幻灯公式自己推的</b>，已逐处标明。", "pitfalls": [{"v": "<b>把这一讲的高估当成 L06 那个高估的同一件事，于是以为双 Q 也能治它。</b><span class='k'>病灶不同</span>：<b>L06 的 max 作用在<u>支撑内</u>，根源是有限样本噪声 + 同一网络既选又评 ⇒ 双 Q 对症</b>；<span class='w'>这一讲的 argmax 跑到了<u>支撑外</u>，那里压根没有标签，值是网络初始化的任意形状</span> ⇒ <b>双 Q 帮不上多少 —— 两个网络在同一片空地上都在瞎编，取较小的那个仍然是瞎编</b>。<br><br><b>翻译到你的课题</b>：<span class='k'>对代理模型做集成（ensemble）并取悲观分位，能治「评估噪声导致的赢家诅咒」，但治不了「这片配置从没被评估过」</span>。<span class='w'>后者需要的是一个对<b>认知不确定性</b>敏感的量（GP 的后验方差、集成成员之间的分歧度），而不是对<b>观测噪声</b>敏感的量。</span><b>两者在实现上很像，在诊断上必须分开 —— 否则你会用对的工具去治错的病，然后以为工具没用。</b>", "tag": "推断", "ref": "本讲 p11 与 L06 p21 的对照（见 L07.a 第三条讲解里的那张表）"}, {"v": "<b>以为「把没见过的配置排除掉」是一个可实现的方案。</b>这一讲最深的一处是讲稿里那段问答：<span class='k'>we don't actually know what's in distribution and out of distribution. So we have just samples of states and actions.</span><br><br><b>老师举的例子极小但致命</b>：<span class='w'>状态 s₁ 的数据里只有动作 a1，一个与 s₁ 很相似但不相同的 s₂ 的数据里只有 a2 —— 那 (s₁, a2) 算分布内还是分布外？</span><span class='k'>逐字匹配说不在，泛化说在，而你手上没有那个真正的支撑集。</span><br><br><b>⇒ 对你的课题，这件事的形态更微妙而不是更简单</b>：<span class='w'>你的配置空间是<b>离散</b>的，所以「这个配置评估过没有」是可以精确查表的</span>；<b>但你真正需要的判断不是「这一个配置评估过没有」，而是「这片<u>子空间</u>我了解得够不够，能不能据此剪掉它」</b>。<span class='k'>而后者和连续状态空间的情形一样不可枚举 —— 组合空间的大小正是你用剪枝的理由，也正是你无法逐点检查覆盖的原因。</span><br><br><b>⇒ 实践含义：别去写一个「判断是否在支撑内」的子模块</b>（<span class='w'>这一讲的两族方法都刻意不写它</span>），<b>改为把这个判断<u>吸收进判据本身</u></b> —— <span class='k'>用「相对已实测的落差」或「置信区间的宽度」这类量，它们在没数据处自动变得保守，不需要一个显式的内/外二分</b>。", "tag": "推断", "ref": "本讲 p11 的课堂问答（只在讲稿里，幻灯上一个字都没有）"}, {"v": "<b>把 p25 那个版本（只压不抬）当成 CQL，于是在实现里只加一个「整体安全边际」。</b><span class='k'>p25 的惩罚是 Q 的<u>绝对高度</u>，α 一大就把支撑内的 Q 一起拖垮，排序信息随之丢失</span> —— <b>保证（Q̂ ≤ Q^π 逐点成立）是真的，但算法不可用</b>。<span class='w'>p26 加上「抬高数据里的 (s,a)」之后，两项合成一个<b>差</b>：给 Q 整体加常数惩罚不变，于是只压平「数据外比数据内高出的那部分」。</span><br><br><b>⇒ 对你的课题，这正是「整体加安全边际」与「罚落差」的区别</b>：<br>· <span class='w'>整体加边际 ⇒ 所有配置一起变贵 ⇒ 相对排序不变 ⇒ argmin 选出来的还是同一个（<b>白做</b>）</span>；<br>· <span class='k'>罚落差（「比任何已实测配置都便宜多少」）⇒ 只打击「看起来好得可疑」的那些 ⇒ 排序被<u>有针对性地</u>改写</span>。<br><br>⚠ <b>注意这两者的失效方式相反</b>：<span class='w'>前者毫无作用，后者如果系数过大会把所有「真正的新发现」也一起压死 —— 而那恰恰是你方法的卖点</span>。<b>所以这个系数必须在实验里扫，而且要把扫出来的曲线报出来</b>（<span class='k'>「压多狠 vs 最终真实成本」的曲线，本身就是一个有价值的消融实验</span>）。", "tag": "推断", "ref": "本讲 p25 与 p26 的对照；原始出处 Kumar et al. Conservative Q-Learning (2020)，⚠ 课堂跳过，讲稿无对应"}, {"v": "<b>追求「我的代理模型在整个配置空间上都准」这个目标。</b>这一讲 p26 那次保证降级正是在否掉这个思路：<span class='k'>No longer guaranteed that Q̂^π ≤ Q^π for all (s,a). <b>BUT</b>, guaranteed that 𝔼_{π(a|s)}[Q̂^π] ≤ 𝔼_{π(a|s)}[Q^π] for all s ∈ D.</span><br><br><b>论证只有一句：你拿这个估计量做的唯一一件事，是比较若干候选并挑一个</b>。<span class='w'>所以唯一会伤到你的错误是「我以为它值 100，其实只值 30」</span>，<b>而逐点的正确性比这强得多，强出来的部分是白付的代价</b>。<br><br><b>⇒ 对你写论文的直接影响</b>：<span class='k'>主定理应当写成「输出保证」而不是「估计保证」</span> —— <b>「以概率 1−δ，输出的配置可行且成本在最优的 (1+ε) 内」</b>，<span class='w'>而不是「代理模型在所有配置上的误差 ≤ ε」</span>。<b>后者更难证、更容易被反例打掉，而且审稿人会直接问「你要它干什么」。</b><br><br>⚠ <b>而且要把误差方向的不对称<u>明写进定理</u></b>：<span class='k'>把不可行误判成可行（被骗）在你的设定里不可恢复；把可行误判成不可行（漏掉）只损失一点最优性</b>。<span class='w'>p26 的保证就是单向的 —— 这个先例值得引为设计依据。</span>", "tag": "推断", "ref": "本讲 p26 的 BUT 那一行；⚠ 该页课堂跳过，保证的原始条件需回 Kumar et al. (2020) 核对"}, {"v": "<b>把「拼接」当成理所当然的，于是默认你的支配剪枝总是安全的。</b>讲义 p14 的拼接（s1→s3 取自一条轨迹、s7→s9 取自另一条，合成一条数据里不存在的 s1→s9）和你那套支配剪枝背后的假设是<span class='k'>同一个结构</span>：<b>好前缀 + 好后缀 = 好整体</b>。<br><br><b>⚠ 而讲稿里那个关于「交叉状态」的问答恰好给出了失效条件</b>：<span class='w'>拼接不要求 s3 与 s7 严格相同，但 the degree to this how well this works will depend on <b>how close those states are</b> and how large the data set is</span>。<br><br><b>⇒ 翻译到你那里</b>：<span class='k'>支配剪枝要求「选了 A 之后剩下的子问题」与「选了 B 之后剩下的子问题」足够相似</span>；<b>一旦存在交互约束或资源耦合，剩余问题就不同，于是「A 不如 B」在某些后缀下可能翻转，剪枝就不安全了</b>。<br><br><b>⇒ 两条该落到方法章里的东西</b>：<br>① <span class='w'>把「剩余问题的相似性」<b>显式写成</b>支配判据的前提条件，而不是隐含假设它</span>；<br>② <span class='k'>组合 nogood 的价值正在于它刻画了「哪些组合会让这个前提失效」</span> —— <b>这个定位可以直接写进 contribution 的表述里</b>。", "tag": "推断", "ref": "本讲 p14 与讲稿里关于「S7 与 S3 不必相同」的问答"}, {"v": "<b>照抄 IQL 的 λ 数值而不看误差的符号方向。</b><span class='k'>本课幻灯的写法是「λ 小 ⇒ 高分位」</span>（p23：<b>using small λ < 0.5</b>，而损失里的误差是 <b>V − Q̂</b>）；<span class='w'>IQL 原论文用 τ，并且「τ 大 ⇒ 高分位」（它的误差定义是 Q − V，符号相反）</span>。<b>两者不矛盾，但数值不能互换。</b><br><br><b>⇒ 一般规则：看到任何不对称损失的超参数值，第一件事是看清它定义里的误差是哪个方向</b>，<span class='k'>而不是直接拿数字去比或者去抄</span>。<br><br><b>⇒ 对你的课题，这一条在实现「保守的约束预测器」时会立刻用到</b>：<span class='w'>你要的是「预测值偏<b>高</b>」（偏严地判可行），而这对应哪个 λ/τ，完全取决于你把误差写成 ŷ − y 还是 y − ŷ</span>。<b>⚠ 建议在代码里写一行断言去验证它</b>（<span class='k'>造一组已知分布的合成数据，检查拟合出来的值确实落在期望的那一侧</span>）—— <b>这个方向弄反了不会报错，只会让你的「保守」悄悄变成「乐观」</b>。", "tag": "推断", "ref": "本讲 p22 的 ℓ^λ_2 定义与 p23 的 small λ < 0.5；对照 Kostrikov, Nair, Levine. Implicit Q-Learning. ICLR '22"}], "ammo": [{"q": "你用历史评估记录（或别人跑出来的 benchmark）来训代理模型、调剪枝判据，凭什么相信在它上面调出来的东西？", "a": "<b>这是 p10–p11 那个失效模式在你课题里的精确形态，而且它有一个<span class='k'>这一讲独有</span>的加重情节。</b><br><br><b>先把三步病理翻译过来</b>：<br>① <span class='w'>代理模型在「从没评估过的那片配置」上不可靠</span>（= Q-function unreliable on OOD actions）；<br>② <span class='k'>而你的目标是 <b>argmin 成本</b> —— 它会主动去找预测误差最负的地方</span>（= policy will seek out over-optimistic actions，讲稿的动词是 <b>exploit</b>）；<br>③ <b>你报出来的「最优配置成本」于是系统性偏低</b>。<br><br>⭐ <b>加重情节：你的问题还有可行性约束。</b><span class='w'>如果可行性也靠代理模型判，那同一个 argmin 会<b>同时</b>低估成本<b>并</b>高估可行概率</b></span> —— <b>它会优先挑「看起来又便宜又安全」的配置，而「看起来」恰恰因为没数据</b>。<span class='k'>这是赢家诅咒在约束优化下的版本，而它有两个方向可以诅咒你。</span><br><br><b>⇒ 三条可以直接说出口的处理（按说服力排序）</b>：<br><b>① 两段式验证（最硬，几乎零成本）</b>：<span class='w'>用历史记录<b>选</b>出 top-k 候选，再对这 k 个做<b>新的、独立的</b>真实评估，<u>只报第二步的结果</u></span>。<b>同时报出「第一步预测」与「第二步实测」的差距 —— 那个差距本身就是对这个病有多严重的直接测量</b>（<span class='k'>而这正是一个别人通常不做的分析</span>）。<br><b>② 悲观而非点估计</b>：<span class='w'>成本用置信上界、可行性用置信下界</span>（= 第二族的思想）。<b>⚠ 但要说清你没有一刀切</b>：<span class='k'>α 过大会把所有未评估区域压死，搜索退化成「只在已知区域里挑」，那就彻底放弃了组合结构带来的外推能力</b>。<br><b>③ 承认设定的限制</b>：<span class='w'>如果你的历史记录来自网格搜索，那它对应的 π_β 是<b>确定性</b>的 —— 正撞上 p18 那个退化情形（优势全为 0，算法退回模仿）</span>。<b>主动说出这一条，比被问出来好得多。</b>", "tag": "推断", "ref": "本讲 p10–p11 三条后果与讲稿里那个开车例子；p18 的确定性 π_β 思考题"}, {"q": "你的理论保证为什么只管「输出的那个配置」，不管代理模型整体的精度？这不是在偷懒吗？", "a": "<b>不是偷懒，而是 p25 → p26 那一步的标准做法 —— 而且那一步在离线 RL 里被当成<u>进步</u>而不是退让。</b><br><br><b>可以这样答</b>：<br><br>① <span class='k'>先承认强保证是可写的</span>：<b>「代理模型在全部配置上误差 ≤ ε」确实是一个更强的陈述</b>（<span class='w'>对应 CQL 的 p25 版本：for large enough α, Q̂^π ≤ Q^π <b>逐点</b>成立</span>）。<br>② <span class='k'>然后指出它的代价</span>：<b>要让它成立，保守程度必须调到足以覆盖最差的那片区域，而那个程度会把<u>有信息区域</u>的区分度一起压平</b>（<span class='w'>p25 那一项不区分支撑内外，α 一大整个 Q 被拖垮，排序信息随之丢失</span>）。<b>⇒ 保证成立，算法不可用。</b><br>③ <span class='k'>再给出使用场景的论证</span>：<b>这个估计量只用来做一件事 —— 比较候选并输出一个</b>。<span class='w'>唯一会伤人的错误是「我以为它好，其实不好」</span>，<b>而「对输出的那个对象不乐观」这条保证恰好、且仅仅排除了这件事</b>。<br>④ <span class='k'>最后给出先例</span>：<b>这正是 CQL 的 p26 所做的降级</b>（<span class='w'>𝔼_{π(a|s)}[Q̂^π] ≤ 𝔼_{π(a|s)}[Q^π]，s ∈ D</span>），<b>而约束最优臂识别的标准结论本来就是输出保证形式</b>（<span class='k'>「以概率 1−δ 输出 ε-最优且可行的臂」</span>）。<br><br><b>⇒ 一句话收口：<span class='w'>保证的强度应当配得上用途；追求「处处都准」常常要付出「哪儿都不准」的代价。</span></b><br><br>⚠ <b>标为推断</b>：<span class='w'>p26 那条保证的原始条件我没有核对（该页课堂跳过、讲稿无对应，幻灯只写了 Can show that…）</span>。<b>要在论文里把 CQL 当先例引用，必须读 Kumar et al. (2020) 的定理陈述与假设。</b>", "tag": "推断", "ref": "本讲 p25 与 p26 的保证对照；⚠ 原始条件需回 Kumar et al. (2020) 核对"}, {"q": "你的方法在「不确定」时会怎么做？会不会在没把握的地方乱猜？", "a": "<b>这一讲给了两个<span class='k'>形状完全不同</span>的答法，而「我选了哪一个、为什么」正是审稿人想听的。</b><br><br><b>【答法一：结构上不给机会（第一族）】</b><br><span class='w'>把你的选择规则设计成「只在已有信息支撑的子空间里输出」</span>。<b>好处是安全性是<u>结构性</u>的、不需要调参、不会炸</b>（<span class='k'>IQL 那条 Never need to query OOD actions! 就是这个意思</span>）。<span class='w'>代价是上限被数据锁住 —— 你不会提出一个「数据没覆盖但其实很好」的配置</span>。<b>⚠ 而这个代价对你可能很重：你方法的卖点之一正是「能组合出未评估过的配置」。</b><br><br><b>【答法二：去了也没好处（第二族）】</b><br><span class='k'>允许搜索进入未知区域，但在那里的估值上加一个与不确定性成正比的惩罚</span>。<b>好处是上限更高、保留了外推能力</b>；<span class='w'>代价是一个要调的系数，而且失效是双向的（太小则被骗，太大则压平）</span>。<br><br><b>⭐ 最有力的回答是「两个都用，而且分工明确」</b>：<br>· <span class='k'>可行性约束用答法一的态度（宁可漏掉，不可被骗）</span> —— <b>因为误判可行是不可恢复的</b>；<br>· <span class='k'>成本目标用答法二的态度（带惩罚地探索）</span> —— <b>因为成本上保守一点只是少赚，而外推能力是你的贡献所在</b>。<br><br><b>⇒ 这个分工本身就是一个可以写出来的设计决定</b>，<span class='w'>而且它比「我用了某个算法」更能说明你理解了问题的结构</span>。<b>依据就在这一讲：两族方法不是竞争关系，它们的失败模式互补（一个单向、一个双向）。</b>", "tag": "推断", "ref": "本讲 p19/p23 的 + 号（第一族）与 p25–26（第二族）；失败模式对照见 L07.c 第二条讲解里那张表"}, {"q": "你怎么判断一个基线对手是「打赢了有意义」的？", "a": "<b>p15 给了一个值得照搬的基线设计原则，而它的要点是「<span class='k'>基线要难被实现细节左右</span>」。</b><br><br><b>讲义对 Filtered BC 的定位</b>：<span class='w'>A very primitive approach to using reward information. <b>Therefore, a good baseline to test against!</b></span> <span class='k'>讲稿更直白：it's good to try this first […] try to make sure that your offline RL method is doing better than this</span>。<br><br><b>⇒ 为什么这种「原始」的基线反而最有价值？三条</b>：<br>① <span class='w'>它几乎没有超参 ⇒ 你赢它不可能被归因为「你调参调得更久」</span>；<br>② <span class='k'>它不会崩 ⇒ 你赢它不可能被归因为「基线没跑好」</span>；<br>③ <b>它的失效模式是<u>可说明的</u></b>（<span class='w'>Filtered BC 不能拼接，因为筛选的粒度是整条轨迹</span>）⇒ <b>于是「我赢在哪」有一个结构性的解释，而不只是一个数字</b>。<br><br><b>⇒ 你的对应基线</b>：<span class='k'>按历史记录里的得分排序、取前 k%、在里面挑最便宜的可行配置</span>。<b>几乎没有超参（只有 k）、不会崩、而且它的失效模式正好与你的卖点互补</b> —— <span class='w'>它只能挑出已评估过的配置，不能组合出新配置</span>。<br><br>⭐ <b>而最有说服力的做法是：<span class='k'>把这个基线的失效模式<u>构造成一个实验</u></b></b>。<span class='w'>设计一组「最优配置必须由多个部分组合而成、且该组合从未被完整评估过」的实例</span>，<b>在上面基线必然失败而你的方法成功</b>。<span class='k'>这比在标准 benchmark 上赢几个百分点有力得多，因为它把「为什么赢」变成了可验证的</b>。<b>（p14 那张 s1→s9 的图正是这类构造的最小例子。）</b>", "tag": "推断", "ref": "本讲 p15 的基线定位与讲稿里那段建议；p14 的拼接构造"}, {"q": "你的成本/约束预测器为什么不是普通的回归？", "a": "<b>p21–p23 给了一个一页就能说清、而且实现代价极低的理由：<span class='k'>普通回归（ℓ2）给你的是条件<u>均值</u>，而均值几乎从来不是你要的那个统计量</span>。</b><br><br><b>先把这件事的归属搞清楚</b>：<span class='w'>「ℓ2 的解是均值」是关于<b>损失函数</b>的事实，不是关于你的问题的事实</span>。<span class='k'>换损失就换统计量：ℓ2 → 均值 · ℓ1 → 中位数 · 分位损失 → 分位数 · 期望分位损失 → expectile</span>。<b>⇒ 所以「我用了 MSE 所以拿到均值」是一个<u>默认后果</u>，不是一个设计选择 —— 而 IQL 的贡献很大一部分就是意识到这个默认后果恰好不是想要的。</b><br><br><b>⇒ 对你的两处具体后果</b>：<br><b>① 约束侧</b>：<span class='w'>实际要求通常是「95% 的情况下延迟不超过 100ms」，而不是「平均延迟不超过 100ms」</span>。<b>用均值判可行，会系统性地把「其实常常超时」的配置判成可行。</b><br><b>② 成本侧</b>：<span class='k'>argmin 会主动利用乐观误差（见第一条弹药）</span>，<b>所以成本预测也应当偏高而不是居中</b>。<br><b>⇒ 两条方向一致：都往「不利于这个配置」的方向偏，于是 argmin 选出来的是经得起检验的那些。</b><br><br>⭐ <b>而最有说服力的那一点是<u>代价</u></b>：<span class='w'>期望分位损失 |λ − 𝟙[x<0]|·x² 就是一个「两边系数不同的 MSE」—— 处处可微、梯度与误差成正比</span>。<b>⇒ 换它基本是改一个损失函数的事，训练流程、学习率、早停策略全部沿用</b>（<span class='k'>对比分位回归：在 0 处不可微、梯度大小与误差无关，训练行为会变</span>）。<b>⇒ 这让「把均值换成保守分位」从一个研究决定降级成一个实现细节，<span class='w'>所以它值得当默认做法，而不是当一个 contribution</span>。</b><br><br>⚠ <b>两处要自己验</b>：<span class='k'>① λ/τ 的方向（见那条坑）· ② 你的数据里同一输入附近是否有多个样本</span> —— <b>若每个配置只评估过一次，你拿到的可能不是「高分位」而是「噪声」</b>。", "tag": "推断", "ref": "本讲 p21 的「ℓ2 给均值」与 p22 的期望分位损失；⚠ 搬到约束预测是推断，讲义未讨论此用途"}, {"q": "你为什么把问题写成「最便宜的可行配置」（约束形式），而不是把成本和质量加权成一个目标？", "a": "<b>p31 那个 LinkedIn 例子正好走了另一条路（Multi-Objective：把 WAU / Volume / CTR 组合成一个标量），所以这两条路的取舍是有现成对照的。</b><br><br><b>两条路各自的代价</b>：<br>· <span class='k'>约束形式（你的）</span>：<b>「可行」有明确语义、结果容易向人解释、而且<u>不需要在不同量纲之间定权重</u></b>；<span class='w'>代价是约束边界必须说得出来（延迟 ≤ 100ms 这个 100 从哪来？），而且边界附近的解对那个数字很敏感</b>。<br>· <span class='k'>标量化（LinkedIn 的）</span>：<b>单目标优化的工具都能直接用</b>；<span class='w'>代价是那组权重必须自己定，而权重会悄悄决定答案，而且它通常<u>无法从数据里学出来</u></b>。<br><br>⭐ <b>最有力的论证是「约束来自外部，不由我决定」</b>：<span class='w'>SLA 规定的延迟上限、硬件给定的内存上限、批下来的预算额度</span>。<b>这时候约束形式不只是方便，它是对问题的<u>忠实</u>表述</b> —— <span class='k'>而标量化反而是在偷偷替决策者定权重</span>。<br><br><b>⇒ 这也顺带回答了「可行性为什么值得单独建模」：它不是成本的一部分，它是一道由别人划的线。</b><br><br><b>⚠ 而 p33 那个预告（How do we get rewards??）提醒了一件该主动声明的事</b>：<span class='k'>你的「成本」是从哪来的？</span><span class='w'>如果是直接测出来的（运行时间、金额），你比 RL 幸运得多 —— 目标是客观的，<b>应当在问题设定那一节明确说出来，这会免掉一整类质疑</b></span>。<b>而如果成本里混了「主观质量」，那你就撞上了和 L08/L09 同一个问题：那个标量得由人的偏好构造出来，构造方式本身会成为方法的一部分。</b>", "tag": "推断", "ref": "本讲 p31 的三个互相拉扯的指标与 p33 的预告；⚠ 取舍论证为推断，讲义未讨论"}], "papers": [{"t": "Peng, Kumar, Zhang, Levine. Advantage-Weighted Regression: Simple and Scalable Off-Policy Reinforcement Learning", "id": "2019（p18、p19 均明引）", "why": "<b>第一族方法里最朴素的那一版，而「朴素」正是它的价值。</b><span class='k'>两步都是监督学习</span>：<b>先回归到实际回报拟合 V^{π_β}，再做带权（exp(Â/α)）的最大似然</b>。<span class='w'>没有自举、没有目标网络、没有 KL 项、没有重要性权重 —— L06 那个 deadly triad 一条边都不沾。</span><b>⇒ 读它的用途不是「要用它」，而是「用它当尺子」</b>：<span class='k'>任何更复杂的离线 RL 方法都应当先说清自己比 AWR 多拿到了什么</span>。<b>它还是 IQL 的一个零件（p23 的策略提取那一步就是它）。</b>"}, {"t": "Kostrikov, Nair, Levine. Offline Reinforcement Learning with Implicit Q-Learning", "id": "ICLR 2022（p21、p22、p23 三页都明引）", "why": "<b>这一讲的技术重心，也是作业 3 要实现的那个。</b><span class='k'>它的全部新意是一页（p22）那个期望分位损失</span>：<b>用 ℓ^λ_2 代替 ℓ2 去拟合 V，于是 V 落在 Q 分布的一个高分位上而不是均值上</b>。<span class='w'>这样做的效果是「在数据支撑内做了一次策略改进」，而那个被改进出来的策略从头到尾没有被写出来过 —— 名字里的 Implicit 指的就是这件事（p23 批注 policy improvement is implicit）。</span><br><br>⚠ <b>读它时要注意记号：原论文用 τ 且「τ 大 ⇒ 高分位」，与本课幻灯的 λ 方向相反</b>（<span class='k'>因为误差定义一个是 Q−V、一个是 V−Q</span>）。<b>照抄数值前先看清这一点。</b>"}, {"t": "Kumar, Zhou, Tucker, Levine. Conservative Q-Learning for Offline Reinforcement Learning", "id": "2020（⚠ 幻灯只标 Slide adapted from Sergey Levine，未给引用；本条由 p25–28 的公式与算法名反查）", "why": "<b>第二族的代表，p28 明写作业 3 要实现它 —— 而<span class='k'>课堂上这一族完全跳过了</span>（讲稿里 conservative / CQL / push down / logsumexp 出现次数全部为 0）。</b><span class='w'>⇒ 这是本讲唯一一篇「必须自己读论文才能补上」的。</span><br><br><b>要读的两处</b>：<br>① <span class='k'>两条保证的精确条件</span> —— <b>幻灯只写了 Can show that…，而 p25 的逐点下界与 p26 的期望下界各自需要什么假设，决定了你能不能把它当先例引用</b>；<br>② <span class='k'>连续动作下 logsumexp 的采样近似</span> —— <b>幻灯用 Σ_a 这个记号绕过了它，而这一处直接影响 p32 那句「Just one hyperparameter」在连续动作下还算不算成立</b>。<br><br>⚠ <b>本条的引用信息是我按算法名与公式反查的，幻灯没给</b> —— <span class='w'>引用前自行核对作者与年份</span>。"}, {"t": "Peters et al. (REPS) · Rawlik et al. (\"psi-learning\")", "id": "p16 的 Aside 里明引（未给年份与完整标题）", "why": "<b>p16 那条小字的出处：<span class='k'>Can show that advantage-weighted objective <u>approximates</u> KL-constrained objective</span>。</b><span class='w'>也就是说 exp(A/α) 这个权重不是随手拍的，它是「在 KL 球 D_KL(π‖π_β) < ε 内最大化 Q」这个约束问题解的形状。</span><br><br>⚠ <b>要紧的是那个词是 approximates 而不是 equals，而近似的条件讲义没说、课堂也没展开</b>（<span class='k'>老师明确说 we won't go through the derivation</span>）。<b>⇒ 如果你要在论文里用「优势加权 ⇒ 隐式 KL 约束」这个论点，必须回这两篇核对条件</b>，<span class='w'>不能引课程幻灯</span>。"}, {"t": "Prabhakar, Yuan, Yang, Sun, Muralidharan. Multi-Objective Optimization of Notifications Using Offline RL", "id": "2022（p31 明引）", "why": "<b>唯一的落地案例：LinkedIn 的通知发送策略。</b><span class='k'>三个互相拉扯的指标 —— WAU（周活跃）· Volume（通知总量）· CTR（点击率）</span>。<span class='w'>多发 ⇒ Volume 上去、CTR 下降、长期还可能把用户逼走。</span><br><br><b>对你最有用的不是算法，是它<u>怎么把问题摆成一个离线 RL 问题</u></b>：<span class='k'>三条判据同时成立 —— ① 历史日志海量且免费 ② 在线试错的代价是真实用户体验且不可逆 ③ 反馈有长期成分（WAU 是周级）</span>。<b>这三条可以当成一张检查表反过来用。</b><br><br>⚠ <b>讲稿原话：This example application is for the algorithm we didn't cover.</b> —— <span class='w'>它用的算法本课没讲。</span>"}, {"t": "Hansen-Estruch et al. IDQL: Implicit Q-Learning as an Actor-Critic Method with Diffusion Policies", "id": "2023（p32 的 See also 里明引）", "why": "<b>IQL 的后续，老师专门推荐了一句</b>（<span class='w'>if you're interested in diving more into IQL-like algorithms, I would encourage you to check out IDQL</span>）。<br><br>⚠ <b>而紧跟着那句补充值得留意：<span class='k'>beyond using diffusion, it also is a bit different in terms of how this update is done</span></b> —— <span class='w'>差别不只是把策略类换成扩散模型</span>。<b>从标题也能看出端倪：它把 IQL <u>重新解释</u>成了一个 Actor-Critic 方法，也就是把那个「隐式的策略」显式化了。</b><br><br><b>⇒ 具体差在哪，老师没说、幻灯没写。标为待核 —— 要知道只能读论文。</b>"}]};

    if(n.one) h+='<div class="one">'+n.one+'</div>';
    if(n.eq)  h+='<span class="eq">'+n.eq.replace(/\n/g,"<br>")+'</span>';
    if(n.pts) h+='<ul>'+n.pts.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul>';
    if(n.tbl && n.tbl.head) h+='<table class="tbl"><thead><tr>'+
      n.tbl.head.map(function(x){ return "<th>"+x+"</th>"; }).join("")+
      '</tr></thead><tbody>'+
      (n.tbl.rows||[]).map(function(r){
        return "<tr>"+r.map(function(c){ return "<td>"+c+"</td>"; }).join("")+"</tr>";
      }).join("")+'</tbody></table>';
    if(n.say) h+='<div class="say"><span class="t">讲稿里补的</span>'+n.say+'</div>';
    /* 你学过的对应：指回已经学完的那一讲。排在 say 之后、tip 之前 ——
       say 与 link 都是「别处说过的话」，tip 与 res 是更尖的提示，放最后。 */
    if(n.link) h+='<div class="lnk"><span class="t">你学过的对应</span>'+
      '<a href="'+n.link.href+'" target="_blank" rel="noopener">'+n.link.t+'</a></div>';
    if(n.tip) h+='<div class="tip'+(n.tip.w?" w2":"")+'"><span class="t">'+n.tip.t+'</span>'+n.tip.v+'</div>';
    /* 科研连接。tag 的三档映射成 ASCII 类名（中文类选择器在转义上脆），
       可见文字仍是中文 —— 判据要的是「档位在页面上真的可见」。 */
    if(n.res) h+='<div class="res"><span class="t">科研连接'+
      '<span class="tag '+(RESC[n.res.tag]||"t3")+'">'+n.res.tag+'</span></span>'+
      n.res.v+'<span class="ref">出处：'+n.res.ref+'</span></div>';
    card.innerHTML=h+quizHtml(n.r[0])+navHtml();
    bindNav();
    bindQuiz();
    bindBadge();
  }
  if(USE_REMOTE){
    var rh=document.getElementById("remotehint"), ru=document.getElementById("remoteurl");
    if(rh&&ru){ ru.textContent=PDF_REMOTE; rh.hidden=false; }
  }
  function go(p){
    p=Math.max(1,Math.min(MAX,parseInt(p,10)||1));
    if(p===cur) return;
    cur=p; pnum.value=p;
    // 只改 #hash 不会让 Chrome 内置 PDF 阅读器翻页 —— 实测 src 已是 #page=49
    // 而工具栏仍停在 1/78。必须让它认为这是一次**新的导航**。
    // 本地：加个查询参数就够，服务器会忽略它。
    // ⚠ 远端不能这么干：Wayback 把查询串当成**被存档 URL 的一部分**，
    //   …RLbook2020.pdf?p=1 直接 **404**（2026-10-23 实测）。
    //   所以远端改成「换掉 iframe 元素」—— 同样是一次新导航，但 URL 不变。
    var HASH="#page="+(p+POFF)+"&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    if(USE_REMOTE){
      // ⚠ 不能换掉 iframe 元素：error/load 两个监听器是初始化时挂上去的，
      //   换元素会把它们孤儿化，「打不开？」面板就再也不会弹，
      //   读者只剩一个空白框、毫无线索（2026-10-23 我就是这么写错的）。
      //   先 about:blank、下一个 tick 再设真地址 —— 同样是新导航，元素不动。
      frame.src="about:blank";
      setTimeout(function(){ frame.src=SRC+HASH; }, 0);
    } else {
      frame.src=SRC+"?p="+p+HASH;
    }
    if(openLink) openLink.href=SRC+HASH;
    render(p);
    paintStrip();
    right.scrollTop=0;
    var on=strip.querySelector("b.on");
    if(on) on.scrollIntoView({block:"nearest",inline:"center"});
    try{ localStorage.setItem(KEY+"p",p); }catch(e){}
  }


  /* ══ 自测 ════════════════════════════════════════════════════════
     记录形状： ST["起始页#题号"] = {a: 选了哪一项}
     只记「答过什么」，不记次数、不记错数、不排名 —— 这一页是为理解服务的，
     不是为考试服务的。换页回来能看见自己上次怎么答的，就够了。 */
  var ST = {};
  try { ST = JSON.parse(localStorage.getItem(KEY+"quiz") || "{}") || {}; } catch(e){ ST = {}; }
  function save(){ try{ localStorage.setItem(KEY+"quiz", JSON.stringify(ST)); }catch(e){} }

  function quizHtml(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    var h = '<div class="quiz"><h3>想一想 <b>'+qs.length+'</b> 题</h3>';
    qs.forEach(function(q,i){
      var key = start+"#"+i, d = ST[key], done = d && typeof d.a === "number";
      h += '<div class="qq" data-k="'+key+'" data-a="'+q.a+'">';
      h += '<div class="t">'+q.q+'</div>';
      q.o.forEach(function(o,j){
        /* 答过的题直接渲染成已判定态 —— 正解点亮、错项标红、选项锁死。
           上一版每次换页都重置成未答，于是「记录下来」只体现在一行计数里。 */
        var cls = "opt", mark = "";
        if(done){
          if(j === q.a){ cls += " ok"; mark = '<span class="m">✓</span>'; }
          else if(j === d.a){ cls += " no"; mark = '<span class="m">✗</span>'; }
        }
        h += '<button class="'+cls+'" data-j="'+j+'"'+(done?" disabled":"")+'>'+
             o+mark+'</button>';
      });
      h += '<div class="why"'+(done?"":' style="display:none"')+'>'+
           (done ? q.why : "")+'</div>';
      h += '<div class="qhist2"><button class="qagain">重做</button></div>';
      h += '</div>';
    });
    return h + '</div>';
  }

  function bindQuiz(){
    document.querySelectorAll(".qq").forEach(function(box){
      var key = box.dataset.k, ans = +box.dataset.a;
      var why = box.querySelector(".why"), opts = box.querySelectorAll(".opt");
      var qs = Q[key.split("#")[0]], q = qs[+key.split("#")[1]];
      opts.forEach(function(b){
        b.onclick = function(){
          var j = +b.dataset.j;
          opts.forEach(function(x){
            x.disabled = true;
            if(+x.dataset.j === ans){ x.classList.add("ok"); x.innerHTML += '<span class="m">✓</span>'; }
          });
          if(j !== ans){ b.classList.add("no"); b.innerHTML += '<span class="m">✗</span>'; }
          why.innerHTML = q.why; why.style.display = "block";
          ST[key] = {a: j}; save();
        };
      });
      bindAgain(box);
    });
  }
  function bindBadge(){
    var b = document.querySelector("#card>h2 .qbadge");
    if(b) b.onclick = function(){
      var q = document.querySelector(".quiz");
      if(q) q.scrollIntoView({behavior:"smooth", block:"start"});
    };
  }
  function bindAgain(box){
    var a = box.querySelector(".qagain");
    if(a) a.onclick = function(){
      delete ST[box.dataset.k]; save(); render(cur);
    };
  }

  function paintStrip(){
    cells.forEach(function(c,k){
      var cls = (map[k+1]!=null ? "has" : "");
      if(k+1===cur) cls += " on";
      c.className = cls;
    });
  }

  /* 标题角标：不用滚到底就知道这页有没有题 */
  function qBadge(start){
    var qs = Q[start];
    if(!qs || !qs.length) return "";
    return '<span class="qbadge" title="跳到想一想">'+qs.length+' 题 ↓</span>';
  }

  function step(d){ go(cur + d); }

  document.getElementById("prev").onclick=function(){ step(-1); };
  document.getElementById("next").onclick=function(){ step(1); };
  pnum.addEventListener("change",function(){ go(pnum.value); });
  pnum.addEventListener("keydown",function(e){
    if(e.key==="Enter"){ go(pnum.value); this.blur(); }
  });
  document.addEventListener("keydown",function(e){
    if(document.activeElement===pnum) return;
    if(e.key==="ArrowLeft"||e.key==="PageUp"){ step(-1); e.preventDefault(); }
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ step(1); e.preventDefault(); }
  });

  var miss=document.getElementById("miss");
  frame.addEventListener("error",function(){ miss.style.display="block"; });
  frame.addEventListener("load", function(){ miss.style.display="none"; });
  document.getElementById("help").onclick=function(){
    miss.style.display = miss.style.display==="block" ? "none" : "block";
  };

  var drag=document.getElementById("drag"), left=document.getElementById("left"), dragging=0;
  drag.addEventListener("mousedown",function(){ dragging=1; document.body.style.userSelect="none"; });
  document.addEventListener("mouseup",function(){ dragging=0; document.body.style.userSelect=""; });
  document.addEventListener("mousemove",function(e){
    if(!dragging) return;
    left.style.width=Math.max(20,Math.min(78,e.clientX/window.innerWidth*100))+"%";
  });

  /* ── 科研主线卡：讲级粒度 ──
     pitfalls 与 ammo 是**整讲**的结论，挂不到某一页上；
     逐页的那一半在卡片里的 .res 格。两种粒度本来就存在，压成一种会丢东西。 */
  var tp = document.getElementById("threadPanel");
  if(typeof TH !== "undefined" && TH){
    var tbtn = document.getElementById("threadBtn");
    tbtn.hidden = false;
    document.getElementById("threadTitle").innerHTML =
      TH.title + '<span class="tag">科研</span>';
    document.getElementById("threadArc").innerHTML = TH.arc || "";
    var sect = function(title, items, fmt){
      if(!items || !items.length) return "";
      return '<h4>'+title+'</h4><ol>'+items.map(fmt).join("")+'</ol>';
    };
    document.getElementById("threadBody").innerHTML =
      sect("容易踩的坑", TH.pitfalls, function(x){
        return '<li>'+x.v+'<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("审稿人会问的", TH.ammo, function(x){
        return '<li><span class="q">'+x.q+'</span><br>'+x.a+
               '<span class="rf">['+x.tag+'] '+x.ref+'</span></li>'; }) +
      sect("要读的论文", TH.papers, function(x){
        return '<li>'+x.t+' <span class="rf">'+x.id+'</span><br>'+x.why+'</li>'; });
    tbtn.onclick = function(){ tp.classList.add("on"); };
    document.getElementById("threadClose").onclick =
      function(){ tp.classList.remove("on"); };
    tp.onclick = function(e){ if(e.target === tp) tp.classList.remove("on"); };
  }

  var s=1; try{ s=parseInt(localStorage.getItem(KEY+"p"),10)||1; }catch(e){}
  go(s);
})();
</script>
</body></html>
