{"r": [14, 15], "t": "凭什么比直接模仿好：奖励信息，和「拼接」", "star": 5, "quote": "Why offline RL versus imitation learning?  Offline data may not be optimal! —> Offline RL can leverage reward information to outperform behavior policy. —> Good offline RL methods can stitch together good behaviors.  (Recall: Imitation methods can't outperform the expert.)  s1 -> s3 is good behavior.  s7 -> s9 is good behavior.  Offline RL methods can learn a policy that goes from s1 to s9!  A simple way to leverage rewards in imitation — If we have reward labels: imitate only the good trajectories?  1. Rank trajectories by return  2. Filter dataset to include top k% of data  3. Imitate filtered dataset: r(τ) = Σ_{(s_t,a_t)∈τ} r(s_t,a_t), D̃ : {τ|r(τ) > η}, max_θ Σ_{(s,a)∈D̃} log π_θ(a|s).  Filtered behavior cloning: A very primitive approach to using reward information. Therefore, a good baseline to test against!", "one": "<b>离线 RL 相对模仿学习的两个真实优势：<span class='k'>① 会看奖励（所以能超过数据里的平均水平）② 会拼接（所以能超过数据里的<span class='w'>任何一条</span>轨迹）</span>。</b><b>第二条是真正厉害的那一条，而 p15 的筛选式模仿<span class='w'>做不到</span>它</b> —— 这正是后面六页存在的理由。", "eq": "p14 的拼接图（两条轨迹，一个共享/相近的中间状态）：\n\n   轨迹 ①   s1 → s2 → s3 → s4 → s5 → s6 → **s_g**      ← 末端拿到好奖励\n                        ↑\n                     **s3**\n\n   轨迹 ②   s1 → s2 → s3 → s4 → s5 → s6 → s7 → s8 → **s9**\n                                            ↑\n                                         **s7**（≈ s3，但不相等）\n\n   讲义的标注：  **s1 -> s3 is good behavior**\n               **s7 -> s9 is good behavior**\n   结论：       **Offline RL methods can learn a policy that goes from s1 to s9!**\n\n   —— 数据里**没有任何一条**从 s1 走到 s9 的轨迹。\n      这个策略是**拼出来**的。\n\n────────────────────────────────────────\n**普通模仿学习在这里会做什么？** 讲稿说得很直接：\n\n   在那个中间状态上，它会 **take the average between these two action distributions**\n\n   ⇒ 两条轨迹在 s3 附近各往一个方向走，模仿学习学到的是**两个方向的平均**。\n     而平均方向可能两边都不是。\n     （**这就是 L02 p10 那条「ℓ2 回归的解是条件均值」，一字不差地又出现了一次。**）\n\n────────────────────────────────────────\np15 第一个方法 —— **Filtered behavior cloning**（筛选式行为克隆）：\n\n   ① 算每条轨迹的回报：   r(τ)  =  Σ_{(s_t,a_t)∈τ} r(s_t, a_t)\n   ② 按阈值筛：           D̃  =  { τ | r(τ) > η }\n                        （η 取数据里回报的某个分位，讲稿举例 **70th percentile** ⇒ 取前 30%）\n   ③ 在 D̃ 上做普通模仿：  max_θ  Σ_{(s,a)∈D̃} log π_θ(a|s)\n\n   讲义自己的评语：**A very primitive approach to using reward information.**\n                 **Therefore, a good baseline to test against!**\n\n   ⚠ **它拿到了第 ① 个优势（会看奖励），但拿不到第 ② 个（拼接）。**\n     理由：坏轨迹被**整条**滤掉了 ⇒ 「坏轨迹的前半段」这个素材直接不在训练集里。", "pts": ["<b>先把 p14 三行箭头的逻辑关系理清楚，它们不是三个并列的好处，而是一个推理链。</b><span class='k'>① Offline data may not be optimal!</span> —— <b>这是前提</b>（<span class='w'>如果数据已经最优，就该直接模仿，不需要本讲</span>）；<span class='k'>② 于是 offline RL 可以靠奖励信息超过行为策略</span> —— <b>这是第一层</b>；<span class='k'>③ 而好的离线 RL 方法还能拼接</span> —— <b>这是第二层，也是量级更大的那一层</b>。<span class='w'>第一层让你超过「数据里的平均」，第二层让你超过「数据里最好的那一条」</b>。", "<b>⭐ 拼接为什么是质变，值得掰开说。</b><span class='k'>模仿学习（含筛选式）的上限是「数据里最好的那条轨迹」</span> —— <b>它学的是「在状态 s 上，好轨迹里的人怎么做」，所以它最多复刻一条已有的轨迹</b>。<span class='w'>而拼接产生的是数据集里<b>根本不存在</b>的轨迹</b>：<b>s1→s3 这一段取自轨迹 ①，s7→s9 这一段取自轨迹 ②，合起来的 s1→s9 谁都没走过</b>。<span class='k'>⇒ 这是「组合出新解」，不是「挑出已有的好解」</span>。<b>讲义的那个感叹号打在这里是对的。</b>", "<b>拼接之所以可能，机制上只靠一样东西：<span class='k'>值函数是「状态」的函数，不是「轨迹」的函数</span>。</b><span class='w'>模仿学习把轨迹当整体看（这条好/这条坏）；而值函数只问「从这个状态出发，往后能拿多少」</span>。<b>⇒ 一旦你有了 V 或 Q，一条坏轨迹的<b>前半段</b>依然可以被正确估值</b>（<span class='k'>它坏在后半段，不坏在前半段</span>），<b>于是它的前半段就能被当成素材用</b>。<span class='w'>这是整个「用值函数而不是用轨迹标签」的收益所在。</b>", "<b>课堂上有人问「要不要假设两条轨迹经过同一个状态」，这个问题问得好，而答案揭示了拼接依赖的第二样东西。</b><span class='k'>答案是不需要严格相同</span> —— <b>老师特意说 I actually tried to have S7 and S3 not be exactly the same state</b>。<span class='w'>靠的是神经网络对相似输入给出相似输出的泛化能力</span>。<b>但他紧接着给了一个限定，这个限定很重要</b>：<span class='k'>the degree to this how well this works will depend on how close those states are and how large the data set is</b>。<b>⇒ 拼接不是一个「成立/不成立」的二值性质，它的强度取决于表示学得好不好。</b>", "<b>p15 这个最朴素的方法有两重身份，别只记第一重。</b><span class='k'>第一重：它是最简单的「用奖励信息」的办法</span>（三步，没有任何值函数）；<span class='k'>第二重也是更重要的一重：它是基线</span>。<b>讲义写的是 Therefore, a good baseline to test against!</b>，<span class='w'>讲稿说得更直白：if you're going to be trying out any offline RL method, it's good to try this first and see how well it does […] try to make sure that your offline RL method is doing better than this</b>。<b>⇒ 这不是客套</b>：<span class='k'>筛选式行为克隆几乎没有超参、不会发散、实现只要二十行</span>，<b>而离线 RL 文献里被它打败的复杂方法并不少</b>（<span class='w'>p32 把它列在「只想纯离线训练」的第一行</span>）。", "<b>它为什么拼不起来，要看清是在哪一步丢掉了素材 —— 是在<span class='k'>筛选</span>那一步，不是在模仿那一步。</b><span class='w'>筛选的单位是<b>整条轨迹</b></span>：<b>r(τ) 低于 η，整条扔掉</b>。<span class='k'>而拼接需要的恰恰是「一条差轨迹的好前缀」</span>。<b>⇒ 粒度不匹配</b>。<span class='w'>讲稿：if this is a bad trajectory, it might just filter out that trajectory entirely, and it won't actually learn how to take this good behavior and this good behavior, and figure out how to get from here to here</b>。<b>⇒ 下一页（p16）做的第一件事，就是把加权的粒度从「轨迹」降到「单个 transition」。这一步降粒度，正是拼接能力的来源。</b>", "<b>最后把这两页和 L02 接起来 —— 那条「ℓ2 的解是条件均值」在这里以一个新的后果出现。</b><span class='k'>L02 讲的是：用 ℓ2 回归拟合专家动作，在动作多峰的状态上会学出一个「中间值」，而中间值可能两边都不是</b>（<span class='w'>绕障碍那个例子：左绕右绕都行，平均是直撞过去</span>）。<b>这里是同一件事，但位置换了</b>：<span class='k'>在 s3 这个「两条轨迹分叉」的状态上，普通模仿学习学的是两个方向的平均</span>。<b>⇒ 而优势加权（p16）正是在修这个病</b>：<span class='w'>它不再对两个方向等权，而是按各自的优势加权 —— 好的那个方向权重大，坏的那个权重小（甚至指数级地小）</span>。<b>⇒ 「取平均」被换成了「按好坏取加权平均」。</b>"], "tbl": {"cap": "三种从离线数据里学策略的办法，上限各不相同", "head": ["", "普通模仿（L02）", "筛选式行为克隆（p15）", "<b>离线 RL（p16 起）</b>"], "rows": [["用奖励吗", "<b>不用</b>", "<b>用 —— 但只用到「整条轨迹好不好」</b>", "<b>用 —— 细到每个 transition</b>"], ["加权/筛选的粒度", "<b>—</b>", "<b>整条轨迹</b>", "<b>单个 (s,a)</b>"], ["能超过数据平均水平吗", "<b>不能</b>", "<b>能</b>", "<b>能</b>"], ["能超过数据里最好的那条吗（拼接）", "<b>不能</b>", "<b>不能 —— 坏轨迹被整条滤掉了</b>", "<b>能</b>"], ["分叉状态上学到什么", "<b>两个方向的平均（L02 的老病）</b>", "<b>留下来那条的方向</b>", "<b>按优势加权 —— 好方向权重指数级地大</b>"], ["会碰分布外动作吗", "<b>不会</b>", "<b>不会</b>", "<b>第一族不会；第二族会但压低它</b>"], ["超参个数", "<b>0</b>", "<b>1（阈值 η）</b>", "<b>≥1（温度 α、λ、…）</b>"]]}, "say": "<b>讲稿在这两页上把拼接讲了两遍 —— 一遍抽象、一遍具体，而且中间插了一句很诚实的自白</b>：<br><br><span class='w'>The other thing that I'll mention is that I'm not sure if there's an analogous situation. Maybe there is actually probably some analogous situation in driving, but a good offline RL method can also stitch together good behaviors.</span><br><br><b>（他想给开车场景举个拼接的例子，但当场没想出来。这其实说明拼接是个<span class='k'>结构性</span>的好处，不是一个随手能举例的好处。）</b><br><br><b>然后是具体那一遍，带着奖励的具体数值</b>：<br><br><span class='k'>say you have some trajectory in your offline data set that looks something like this. And another trajectory of your data set maybe looks something like this, and say that this one got a good reward at the end, and this one got a negative reward at the end. Then a good offline RL method should realize that this is a good behavior. And also, the first part of this trajectory […] can be a good behavior […] when you're in these states, you should essentially be able to stitch together the first part of this trajectory and the second part of the green trajectory.</span><br><br><b>⭐ 紧接着是那句关键的对比，它把普通模仿学习的毛病点在了同一个状态上</b>：<br><br><span class='k'>And if you use vanilla imitation learning, you won't get that behavior. Instead, what it will do is, in this state, it will take the average between these two action distributions.</span><br><br><b>「it will take the average」—— 这就是 L02 的那条老病。</b><span class='w'>在 L02 里它的后果是「直撞障碍物」，在这里它的后果是「既不走向好结局也不走向坏结局，而是走向中间」</b>。<b>同一个数学事实，两个不同的灾难。</b><br><br><br><b>关于 Filtered BC，讲稿补了阈值的取法和一句很实际的建议</b>：<br><br><span class='w'>And that threshold could be some percentile of the rewards in your data set, like the 70th percentile, for example, only taking the top 30% of trajectories.</span><br><br><span class='k'>So if you're going to be trying out any offline RL method, it's good to try this first and see how well it does, and use that as a benchmark. And make sure that—or ideally, try to make sure that your offline RL method is doing better than this.</span><br><br><b>然后是那句为后面六页开路的话 —— 它承认最好的离线 RL 方法其实没走远</b>：<br><br><span class='k'>now, one of the reasons why I introduced this is that, arguably, some of the best offline RL methods are actually doing something that's not all that different from this, in that they do have imitation learning component to them. And the idea here is that instead of just taking the good trajectories, we could imitate the data, but weight our imitation learning objective based on how good the action was in that transition.</span><br><br><b>⇒ 「不是筛掉，而是加权；不是按轨迹，而是按 transition」。<span class='w'>一句话里两处降粒度，第一族方法的全部骨架就在这里。</span></b>", "link": {"t": "你学过的对应：CS224R L02 精读 p10（ℓ2 回归的解是条件均值 —— 分叉状态上「取两个方向的平均」就是它）", "href": "L02-精读.html"}, "res": {"tag": "推断", "v": "<b>「拼接」这件事对你的课题有一个很直接的对应，而且它正是你那套支配剪枝（dominance pruning）背后<span class='k'>默认假设</span>的东西。</b><br><br><span class='w'>你的臂是组合结构的（一个配置由多个可选项组成），而你的搜索之所以能比「逐个枚举配置」便宜，靠的是<b>部分解可以被独立评价、然后组合</b></span>：<b>「前缀 A 在任何后缀下都不如前缀 B」⇒ 剪掉 A 的整个子树</b>。<span class='k'>这和 p14 的拼接是同一个结构</b>：<b>好前缀 + 好后缀 = 好整体</b>。<br><br><b>⭐ 而讲稿里那个关于「交叉状态」的问答，正好给出了这个假设的<span class='w'>失效条件</span>，这对你比拼接本身更有用</b>：<br>· <span class='k'>拼接要求「s3 与 s7 足够相似」</span>，严格相同不必要，但<b>相似度决定了拼接的可靠程度</b>（<span class='w'>the degree to this how well this works will depend on how close those states are</span>）；<br>· <b>翻译到你那里：支配剪枝要求「两个前缀留下的<span class='k'>剩余问题</span>足够相似」</b> —— <span class='w'>如果选了 A 之后剩下的可选项集合与选了 B 之后不一样（有交互约束、有资源耦合），那「A 不如 B」在某些后缀下可能翻转</span>，<b>剪枝就是不安全的</b>。<br><br><b>⇒ 两条可以写进方法章的东西</b>：<br><b>① 把「剩余问题的相似性」显式写成支配判据的前提条件</b>，<span class='k'>而不是隐含假设它</span>。<span class='w'>组合 nogood 之所以有用，恰恰是因为它刻画了「哪些组合会让这个前提失效」</span>。<br><b>② 基线里必须有一个「筛选式」的朴素对手。</b><span class='k'>p15 的教训是普适的</span>：<b>按历史记录里的得分排序、取前 k%、在里面挑最便宜的可行配置</b> —— <span class='w'>这个基线几乎没有超参、不会崩，而且它的失效模式（只能挑出已评估过的配置，不能组合出新配置）正好与你方法的卖点互补</b>。<b>赢它赢得干净，你的「能组合出未评估过的配置」这个论点才立得住。</b><br><br>⚠ <b>标为推断</b>：讲义讲的是 MDP 上的状态-动作值函数，你的问题没有时间维度、也没有 Bellman 回路；<span class='w'>上面的对应建立在「状态 ↔ 部分配置」「轨迹 ↔ 完整配置」这个类比上，讲义没有做这个类比</b>。", "ref": "本讲 p14 拼接图与讲稿里关于「S7 与 S3 不必相同」的问答；p15 的基线建议"}},
{"r": [16, 17], "t": "把筛选换成加权：一行目标，暗含一个 KL 约束", "star": 5, "quote": "Better way to do weighted imitation learning?  Could we weight each transition depending on how good the action is?  How do you measure how good an action is?  Recall: advantage function A.  θ ← arg max_θ E_{s,a∼D}[log π_θ(a|s) exp(A(s,a))].  standard imitation learning / with advantage weights.  Adv. weights for s3.  Aside: Can show that advantage-weighted objective approximates KL-constrained objective. See Peters et al. (REPS), Rawlik et al. (\"psi-learning\").  π_new = arg max_π E_{a∼π(·|s)} Q(s,a) s.t. D_KL(π‖π_β) < ε.  Key question: How to estimate the advantage function?  Advantage of which policy? We'll use A^{π_β} for now.", "one": "<b>整个第一族的骨架就是这一行：<span class='k'>普通模仿学习的对数似然，乘上一个 exp(优势) 的权重</span>。</b><b>它看起来只是「带权的监督学习」，但可以证明它<span class='w'>近似</span>一个带 KL 约束的策略改进问题</b> —— <span class='w'>而且不需要显式建模 π_β。这是本讲最漂亮的一处。</span>", "eq": "p16 的目标（把它和普通模仿学习并排写，差别只有一个因子）：\n\n   普通模仿学习：  max_θ  𝔼_{s,a∼D} [ log π_θ(a|s) ]\n\n   优势加权：      max_θ  𝔼_{s,a∼D} [ log π_θ(a|s) · **exp( A(s,a) )** ]\n                            └─ standard imitation ─┘  └─ advantage weights ─┘\n\n   ⇒ **每个 transition 带一个自己的权重，权重是优势的指数。**\n     优势为正 ⇒ 权重 > 1（多学它）\n     优势为负 ⇒ 权重 < 1（少学它，但不是扔掉）\n     优势为 0 ⇒ 权重 = 1（退回普通模仿）\n\n────────────────────────────────────────\n**为什么这就能拼接？** 把 p14 那张图的 s3 算一遍（讲稿里的数）：\n\n   在 s3 上，数据里有两个方向：\n\n     往 s_g 的方向：  Q(s3, a_好)  =  **1**   （末端拿到好奖励）\n     往另一边：       Q(s3, a_坏)  =  **0**\n\n     V(s3) = 两者的平均（因为 π_β 在这里两边都走） = **0.5**\n\n     ⇒ A(s3, a_好) = 1 − 0.5 = **+0.5** ⇒ 权重 exp(+0.5) ≈ 1.65\n       A(s3, a_坏) = 0 − 0.5 = **−0.5** ⇒ 权重 exp(−0.5) ≈ 0.61\n\n   ⇒ **在这个分叉状态上，策略被告知往好的那边走。**\n     而普通模仿学习在这里学的是两个方向的平均（p14/L02 的老病）。\n\n────────────────────────────────────────\np16 右下的小字（**Aside**）—— 这一行权重其实在解一个带约束的问题：\n\n   **π_new  =  argmax_π  𝔼_{a∼π(·|s)}[ Q(s,a) ]**\n              **s.t.  D_KL( π ‖ π_β )  <  ε**\n\n   讲义的说法是 **approximates**（近似），并给了两条出处：\n   **Peters et al. (REPS)** 与 **Rawlik et al. (\"psi-learning\")**。\n\n   ⇒ 读法：**那个 exp(A) 不是随手拍的加权函数**，\n     它是「在 KL 球内最大化 Q」这个问题的解的形状。\n\n────────────────────────────────────────\np17 把下一步的问题提了出来，并且**先回答了一个更前置的问题**：\n\n   **Key question: How to estimate the advantage function?**\n\n   **Advantage of which policy?  We'll use A^{π_β} for now.**\n              ↑\n      先问「谁的优势」，再问「怎么估」—— 顺序不能颠倒。\n      这个选择（用 π_β 的优势）会在 p19 变成一条**缺点**，\n      然后在 p21–23 被修掉。", "pts": ["<b>先注意这一行目标做了<span class='k'>两处</span>降粒度，而不是一处。</b><span class='w'>① 从「筛选」降到「加权」</span>：<b>p15 是二值的（留下/扔掉），这里是连续的（权重从接近 0 到很大）</b> —— <span class='k'>于是「不太好但不坏」的数据也能贡献一点信息</span>；<span class='w'>② 从「轨迹」降到「transition」</span>：<b>p15 的 r(τ) 是整条的回报，这里的 A(s,a) 是单步的优势</b> —— <span class='k'>这一处才是拼接能力的来源</span>。<b>讲稿把两处合在一句话里说：instead of just taking the good trajectories, we could imitate the data, but weight our imitation learning objective based on how good the action was in that transition。</b>", "<b>为什么权重取的是 exp(A) 而不是 A 本身？这个问题在课堂上被问了，而老师的回答分两层。</b><span class='k'>第一层（实用层）：权重必须非负</span> —— <b>它乘在 log π_θ 上，是一个「这条样本有多重要」的系数</b>；<span class='w'>如果直接用 A，负优势的样本会变成「最小化它的似然」，那是在<b>主动降低</b>某些数据里动作的概率，很容易把策略推到数据外去</b>。<b>exp 把它换成「权重很小但仍非负」</b> —— <span class='k'>少学，而不是反着学</span>。<b>第二层（理论层）就是那条 Aside：exp(A/α) 正是 KL 约束问题解的形状</b>（<span class='w'>这类「指数倾斜」的解在约束优化里到处出现，Gibbs 变分原理就是它</span>）。", "<b>⭐ 那条 Aside 值得认真读，因为它解释了「implicit」这个名字。</b><span class='k'>右边那个带约束的问题是「显式」的离线 RL 表述</span>：<b>在 KL 球 D_KL(π‖π_β) < ε 内最大化 Q</b>。<span class='w'>这个表述很合理（p11 的第二视角说得就是「别离 π_β 太远」），但直接解它要先有一个 π_β 的密度模型</b>。<b>而左边那一行只需要数据里的 (s,a) 和一个优势估计</b> —— <span class='k'>没有 π̂_β，没有 KL 项，没有约束求解器</span>。<b>⇒ 约束的效果达到了，但约束本身从来没被写出来。这就是 implicit policy constraint。</b>", "<b>⚠ 但要诚实地读那个词：讲义写的是 approximates，不是 equals。</b><span class='w'>近似在哪里，讲义没说，课堂上也没展开（老师说 we won't go through the derivation）</span>。<b>所以这条 Aside 的正确用法是「它解释了 exp 的来历、让这个目标不显得像个 hack」，而不是「它给了一个严格的约束保证」</b>。<span class='k'>如果你要在论文里引用「优势加权 ⇒ KL 约束」这件事，必须回去读 Peters et al. 与 Rawlik et al. 原文，确认近似的具体条件</span>（<b>讲义给的两条出处是可靠的入口</b>）。", "<b>课堂上那个「这和 Actor-Critic 的优势加权有什么区别」的问题很尖锐，而老师的回答里有两处确定的差别和一处模糊的解释。</b><span class='k'>确定的差别 ①：Actor-Critic 的目标里优势<b>不取指数</b>，直接乘</span>（<span class='w'>∇_θ log π_θ · A</span>）；<span class='k'>确定的差别 ②：采样源不同</span> —— <b>这里 (s,a) 来自离线数据集，而 SAC 里那个 a 来自<b>当前策略</b>，不是数据集</b>。<b>⇒ 第二条差别才是要害</b>：<span class='w'>「动作从数据来」正是避开分布外动作的那一步</span>。<b>至于更深层的「为什么一个取指数一个不取」，老师说 There isn't a very quick way to derive where those differences come from，然后给了一个很模糊的线索（见下面那张警示卡）。</b>", "<b>p17 那句 Advantage of which policy? 的位置值得注意 —— 它被放在「怎么估」<span class='k'>之前</span>。</b><span class='w'>这个顺序是对的，因为「优势」这个量本身是相对于某个策略定义的</span>：<b>A^π(s,a) = Q^π(s,a) − V^π(s)，π 换了，同一个 (s,a) 的优势就不一样</b>。<span class='k'>讲义的选择是 We'll use A^{π_β} for now</span> —— <b>用<b>行为策略</b>的优势</b>。<span class='w'>这个选择的好处是数据正好来自 π_β，所以估它是一个干净的 on-policy 回归问题（p18 会用到这一点）</span>；<b>坏处要到 p19 才写出来</b>：<span class='k'>Â^{π_β} is for weaker policy than Â^{π_θ}</span> —— <b>你是在按一个比你弱的策略的标准去判断好坏，所以提升幅度有上限</b>。<span class='w'>p21 那句 Can we estimate Q for a policy that is better than π_β? 就是在撬这个上限。</span>", "<b>最后一个容易被跳过但对理解 p18–19 很关键的点：<span class='k'>这一行目标里 π_θ 只在数据里的 (s,a) 上被评估</span>。</b><b>看清这件事</b>：<span class='w'>log π_θ(a|s) 里的 a 来自 D，权重 exp(A(s,a)) 里的 (s,a) 也来自 D</span>。<b>⇒ 整个策略目标<b>完全不查询</b>任何数据外的动作</b>。<span class='k'>这就是 p19 与 p23 的那个 + 号写的 Avoids querying or training on any OOD actions!</span>。<b>⚠ 但注意这句话管的只是<b>策略</b>目标</b>：<span class='w'>优势是怎么估出来的，那是另一件事 —— p18 用蒙特卡洛（也不碰 OOD），p20 用自举（<b>这里就有风险了</b>，所以要把 a' 改成从 D 采）</span>。<b>「不碰 OOD」这个性质必须在<b>每一处</b>分别检查，不能从策略目标推广到整个算法。</b>"], "tbl": {"cap": "同一行「带权模仿」在三个地方的差别（看采样源与权重形式）", "head": ["", "Actor-Critic（L04）", "Filtered BC（p15）", "<b>优势加权（p16）</b>"], "rows": [["目标形状", "<b>𝔼[∇log π_θ(a|s) · A]</b>", "<b>𝔼_{D̃}[log π_θ(a|s)]</b>", "<b>𝔼_D[log π_θ(a|s) · exp(A)]</b>"], ["那个 a 从哪来", "<b>当前策略（SAC）或当轮采的数据</b>", "<b>筛过的数据集 D̃</b>", "<b>离线数据集 D —— 不动</b>"], ["权重形式", "<b>A 本身（可正可负）</b>", "<b>0 或 1（二值）</b>", "<b>exp(A) （恒正）</b>"], ["负优势的样本会怎样", "<b>被反向推（降低其似然）</b>", "<b>整条轨迹被扔掉</b>", "<b>权重变小，但仍是正向学习</b>"], ["加权粒度", "<b>单步</b>", "<b>整条轨迹</b>", "<b>单步 ⇒ 能拼接</b>"], ["会查询数据外动作吗", "<b>会（SAC 的 a∼π_θ）</b>", "<b>不会</b>", "<b>策略目标不会</b>"]]}, "tip": {"t": "⚠ 那句「reverse / forward」的解释：讲稿里是 ASR 转写，字面读不通", "w": true, "v": "<b>课堂上有人问「为什么 Actor-Critic 的优势加权不取指数，而这里取」，老师先给了两条确定的差别，然后说深层原因不好快速推，只给了一个线索。那个线索在讲稿里的字面是</b>：<br><br><span class='k'>One, I don't want to confuse you, but the one way of thinking about this is, oftentimes, online RL objectives will be optimizing a <b>reverse scale</b> objective, and offline are looking more at a <b>forward tail</b> objective. But it's a longer explanation.</span><br><br><b>⚠ 「reverse scale」与「forward tail」这两个短语在 RL 文献里都不存在。</b><span class='w'>从上下文（讨论 exp 加权与 KL 约束）看，几乎可以肯定他说的是 <b>reverse KL</b> 与 <b>forward KL</b></span> —— <b>这是 ASR 把 KL 听成了 scale / tail</b>。<br><br><b>为什么这个猜测合理</b>：<span class='k'>reverse KL（D_KL(π‖π_β)）是「mode-seeking」的，它让 π 收缩到 π_β 的某一个峰上</span>；<span class='k'>forward KL（D_KL(π_β‖π)）是「mass-covering」的，它让 π 覆盖 π_β 的全部支撑</span>。<b>而「带权的最大似然」正是在最小化一个<b>加权的 forward KL</b></b>（<span class='w'>最大化 𝔼_{a∼D}[w·log π_θ(a|s)] ⟺ 最小化 D_KL(加权数据分布 ‖ π_θ)</span>）。<b>⇒ 离线方法偏好 forward 这一侧是说得通的：mass-covering 意味着策略会老老实实待在数据覆盖的地方，正是离线设定想要的。</b><br><br><b>⚠ 但我不替老师下结论。</b><span class='k'>这段只在讲稿里、只有一句、而且老师自己标明 it's a longer explanation、幻灯上一个字都没有</span>。<b>标为待核</b>：<span class='w'>要用这个论点，得去读 p16 引的 Peters et al. (REPS) 与 Rawlik et al.，或者 Levine 的离线 RL 综述里关于 KL 方向的那一节</b>。<b>考试或论文里不要把它当成本课讲过的内容。</b>"}, "say": "<b>讲稿在这两页上回答了四个课堂问题，每一个都补了幻灯上没有的东西。按顺序过一遍。</b><br><br><b>① 拼接需要轨迹交叉吗？</b><br><br><span class='k'>So the question is for this to improve over imitation learning, do we need to assume that our trajectories have intersecting states? And the brief answer is that, no, we generally don't have to assume that. And in this diagram, I actually tried to have S7 and S3 not be exactly the same state. And the reason why we don't need them to be exactly the same is that if we're using a neural network to represent the policy and the advantage function, then it will naturally—States and actions that are very similar to each other, will naturally have similar outputs from that neural network. […] Now, the degree to this how well this works will depend on how close those states are and how large the data set is, such that it can learn a representation that is collapsing those representations to something that looks similar.</span><br><br><b>⇒ 拼接靠的是泛化，而泛化的质量决定拼接的质量。这是一个强度连续的性质，不是开关。</b><br><br><br><b>② exp 会不会爆？</b><br><br><span class='w'>The question is, in practice, do we need to worry about the exponential term exploding? When we look at a practical implementation of this, we will actually add a hyperparameter that corresponds to the temperature of this. And so the practical algorithm will have 1 over alpha times the advantage. And that can help prevent this from getting extremely large.</span><br><br><b>⇒ p19 的公式里那个 1/α 就是它。</b><span class='k'>α 大 ⇒ 权重被压平 ⇒ 趋向普通模仿学习；α 小 ⇒ 权重很尖 ⇒ 趋向只学优势最高的那些动作（接近 Filtered BC）</span>。<span class='w'>所以这一个超参把 p15 和 p16 连成了一个连续的谱</b>。<br><br><br><b>③ 这和 Actor-Critic 的优势加权差在哪？</b>（老师先说 Yeah, I knew this question would come up）<br><br><span class='k'>when we talked about actor critic methods, the objective looked similar to this, except instead of exponentiating, we just had the advantage here. The other key difference was that here, we're sampling from our offline data set. And in the actor-critic objectives, the action, well, there's different versions, but we're sampling from an online data set data set, typically, and in soft actor-critic, this action actually comes from your policy, not from the data set.</span><br><br><b>⇒ 两条差别：<span class='w'>取不取指数</span> 与 <span class='w'>动作从哪来</span>。第二条是离线设定的要害。</b>（<b>第三条模糊的解释见上面那张警示卡。</b>）<br><br><br><b>④ 优势加权凭什么能拼接？</b>老师用 p14 的图算了一遍，这段值得对着公式读：<br><br><span class='k'>if we have a good advantage function, and we go back to the stitching example, for this particular state, right here, we know that the advantage of this action is high, right? Because the value, the Q-value of this is 1. The Q-value for going this way, at least in the data, is 0, and the value of this state will be the average of those two outcomes. And so the advantage for this one will be positive. And the advantage for going this direction will be negative. And so when we then take our imitation learning objective and weight it by the advantages, we're going to be telling our policy in that state, it should go to the good outcome rather than going to the bad outcome.</span><br><br><b>注意他顺手说明了 V 是怎么来的：<span class='k'>the value of this state will be the average of those two outcomes</span>。</b><span class='w'>这正是「V 是 Q 在 π_β 下的平均」这条定义在起作用 —— 而因为 π_β 在这个状态上两边都走，平均值就落在中间，于是一个方向的优势为正、另一个为负</b>。<b>⇒ 优势之所以能分辨好坏，<span class='k'>靠的正是 π_β 在那个状态上有过多样的行为</span>。这条件在 p18 的思考题里会被推到极端：如果 π_β 在每个状态上只做一件事，优势就全是 0。</b>", "link": {"t": "你学过的对应：CS224R L03 精读（KL 约束下的策略改进 —— 这里那条 Aside 指的就是同一个问题，但解法完全不同：不写约束，只改权重）", "href": "L03-精读.html"}},
{"r": [18, 19], "t": "AWR：优势用蒙特卡洛估 —— 最简单的那一版，和它的退化情形", "star": 4, "quote": "Advantage-weighted regression.  Could we weight each transition depending on how good the action is?  Key question: How to estimate the advantage function?  First simple approach — Estimate with Monte Carlo: Approximate V^{π_β}(s).  min_φ Σ_{s_t∼D} ‖V̂^{π_β}_φ(s_t) − Σ_{t'=t}^T r(s_t,a_t)‖².  Â^{π_β}(s_t,a_t) = Σ_{t'=t}^T r(s_t,a_t) − V̂^{π_β}_φ(s_t).  empirical return.  Question: What do you learn for deterministic policy π_β?  Full AWR algorithm — 1. Fit value function. 2. Train policy: max_θ E_{(s_t,a_t)∼D}[log π_θ(a_t|s_t) exp((1/α)(Σ_{t'=t}^T r(s_t,a_t) − V̂^{π_β}_φ(s_t)))].  hyperparameter α.  + Avoids querying or training on any OOD actions!  + Simple.  - Monte Carlo estimation is noisy.  - Â^{π_β} is for weaker policy than Â^{π_θ}.  Peng, Kumar, Zhang, Levine. Advantage-Weighted Regression. '19.", "one": "<b>最简单的那一版：<span class='k'>值函数用监督学习拟合实际回报，优势 = 实际回报 − 值函数，策略用上一页那一行带权模仿</span>。</b><b>全算法两步，没有自举、没有目标网络、不碰任何数据外动作</b> —— <span class='w'>而 p18 那个思考题告诉你它在什么情况下会原地退化成普通模仿学习。</span>", "eq": "**第 1 步：拟合 V^{π_β}（纯监督学习，没有自举）**\n\n   min_φ  Σ_{s_t∼D}  ‖ V̂^{π_β}_φ(s_t)  −  Σ_{t'=t}^{T} r(s_{t'}, a_{t'}) ‖²\n                                          └──── **empirical return** ────┘\n\n   ⚠ 为什么这里可以直接用蒙特卡洛，而 L04 要费劲：\n     因为估的是 **π_β** 的值函数，而**数据正好就是 π_β 采的**\n     ⇒ 这是一个干净的 **on-policy** 回归问题，没有任何分布不匹配。\n     （讲稿：The data is coming from the policy that we're trying to\n      evaluate a value function for.）\n\n**第 2 步：算优势，并喂进 p16 那一行**\n\n   Â^{π_β}(s_t, a_t)  =  Σ_{t'=t}^{T} r(s_{t'}, a_{t'})  −  V̂^{π_β}_φ(s_t)\n                        └── 这一条实际走出来的回报 ──┘     └─ 平均能拿多少 ─┘\n\n   max_θ  𝔼_{(s_t,a_t)∼D} [ log π_θ(a_t|s_t) · exp( (1/α)·Â^{π_β}(s_t,a_t) ) ]\n                                                      └ α 是温度超参 ┘\n\n────────────────────────────────────────\n**⚠ 优势有两种算法，AWR 选了后一种：**\n\n   ① 单步 TD 版：  Â(s_t,a_t)  =  r(s_t,a_t) + V̂(s_{t+1})  −  V̂(s_t)\n                 —— 讲稿说这个 **also valid**，但它依赖两个 V̂ 之差准确\n   ② 经验回报版：  Â(s_t,a_t)  =  Σ_{t'≥t} r  −  V̂(s_t)\n                 —— **AWR 用的是这个**；更简单，不依赖 V̂ 的差分精度\n\n   （讲稿还提到可以用 GAE，definitely。）\n\n────────────────────────────────────────\n**p18 的思考题：π_β 是确定性的，会学到什么？**（课堂答案）\n\n   π_β 确定 ⇒ 从每个状态只见过**一个**动作\n           ⇒ 那条轨迹的经验回报**就是**该状态的全部样本\n           ⇒ V̂(s_t)  =  Σ_{t'≥t} r   （回归的目标只有一个点，拟合后相等）\n           ⇒ Â  =  Σ_{t'≥t} r − V̂(s_t)  =  **0**\n           ⇒ 权重  exp(0/α)  =  **1**\n           ⇒ 目标变成  max_θ 𝔼_D[ log π_θ(a|s) ]  =  **普通模仿学习**\n\n   ⇒ **算法自己退回了模仿学习。**\n     老师评语：it's nice that you get that back because it means that for\n     this policy, you actually can't really do better than the behavior\n     policy in that scenario.\n\n────────────────────────────────────────\n**反过来，π_β 有多样性时优势为什么非零**（讲稿的算例）：\n\n   同一个（或相近的）状态上见过三个动作，各自的经验回报：\n\n        +10        +1        −5\n\n   V̂(s) = 这三者的平均 = **2**\n   ⇒ Â = 10 − 2 = **+8** ·  1 − 2 = **−1** ·  −5 − 2 = **−7**\n\n   ⚠ 讲稿里老师口算成 **that is 3, I think**，后面给的优势是 7 / −2 / −8\n     —— 与 V=3 自洽，**所以错的是那个均值**（(10+1−5)/3 = 2，不是 3）。\n     **结构一点不受影响**；而且 V=2 时三个优势之和正好为 0，\n     这才符合「优势在 π_β 下的期望为 0」这条性质。", "pts": ["<b>先注意这个算法有多朴素，朴素本身就是它的卖点。</b><span class='k'>第 1 步是监督学习（回归到实际回报），第 2 步是带权的监督学习（最大化加权对数似然）</span>。<b>没有自举、没有目标网络、没有两个网络互相当标签、没有 KL 项、没有重要性权重</b>。<span class='w'>讲稿的评语：it's very nice to have an algorithm, where you're doing supervised learning to fit the value function. And then you're doing weighted supervised learning to fit the policy. And it's just a very, very simple algorithm</span>。<b>⇒ 整个 L06 的「致命三角」在这里一条边都不沾</b>（<span class='k'>没有自举，所以不会发散</span>）。", "<b>⭐ 为什么这里敢用蒙特卡洛，而 L04 讲 Actor-Critic 时一直在嫌它方差大？两个理由，而第二个比第一个重要。</b><span class='k'>理由一（数据量）</span>：<span class='w'>离线数据集通常很大，而且可以反复用，所以方差不像在线设定下那么要命</span>（<b>讲稿：When you have a large offline data set, variance is a bit less of a concern</b>）。<span class='k'>理由二（简洁）</span>：<b>老师明确说这一条分量不轻 —— a big part of it is also just simplicity</b>。<b>⚠ 但他没有否认方差问题还在</b>：<span class='w'>So it's still—even when you have an offline data set, there is variance. More variance in this estimate than other estimates that we'll see in a minute</b>。<b>⇒ p19 那条缺点 Monte Carlo estimation is noisy 是作者自己承认的，p20 的 AWAC 就是来修它的。</b>", "<b>⭐ p18 那个思考题是全讲最值得自己算一遍的地方，因为它检验你是否真的理解「优势」这个量在估什么。</b><span class='k'>关键一步是：确定性 π_β ⇒ 每个状态只有一个动作样本 ⇒ 回归的目标只有一个点 ⇒ V̂ 拟合之后正好等于那个经验回报 ⇒ 优势恒为 0</span>。<b>然后 exp(0) = 1，整个权重消失</b>。<span class='w'>⇒ 带权模仿退化成普通模仿</span>。<b>而老师对这个退化的评价是肯定的，理由很干净</b>：<span class='k'>数据里从没出现过别的动作，你凭什么知道别的动作更好？在那种数据上你本来就不该指望超过 π_β</span>。<b>⇒ 算法的退化方向是「安全」的那一边，这是一个好性质（对比一下：如果它在这种数据上<b>反而</b>给出很大的权重，那才是灾难）。</b>", "<b>把这个退化情形接回 p9 的「数据从哪来」，就能看出它不是一个人为的边角情形。</b><span class='k'>手工设计的控制器采的数据，常常就是确定性的</span>（<span class='w'>讲稿举的例子：某些车道上永远直行，从没见过左转右转</span>）。<b>⇒ 如果你的离线数据集来自一个确定性控制器，那 AWR 这类方法<b>原理上</b>就不可能超过它</b>。<span class='k'>这个结论对实践很有用</span>：<b>它意味着「数据集的动作多样性」不是一个「有则更好」的东西，而是「离线 RL 能不能起作用」的<b>前提条件</b></b>。<span class='w'>讲稿里老师也正面回答过这个追问：generally having more diverse actions represented in your offline data set is good for offline RL, especially if you think that your expert is not the optimal thing to do, then you definitely want variability</span>。", "<b>⚠ 讲稿里那个 +10 / +1 / −5 的算例有一处口算错误，值得记下来，因为它正好牵涉到一条该知道的性质。</b><span class='k'>老师说 V̂ 是这三个数的平均，「that is 3, I think」</span>；<b>但 (10 + 1 − 5)/3 = <b>2</b></b>。<span class='w'>他后面报的优势 7 / −2 / −8 与 V = 3 是自洽的，所以错的是那一步口算，不是后面的推导</b>。<b>按 V = 2 应该是 <b>8 / −1 / −7</b></b>。<span class='k'>⭐ 而且修正之后反而更对</span>：<b>8 + (−1) + (−7) = 0</b> —— <span class='w'>这正符合「优势在 π_β 下的期望为 0」这条基本性质（𝔼_{a∼π_β}[A^{π_β}(s,a)] = 𝔼[Q] − V = 0）</span>。<b>⇒ 这条性质可以当成你自己算优势时的一个免费检查：如果一个状态上所有动作的优势加权平均不是 0，那 V̂ 就没拟合好。</b>", "<b>p19 那两条缺点要分清轻重 —— 第一条是工程问题，第二条是<span class='k'>原理上的天花板</span>。</b><span class='w'>① Monte Carlo estimation is noisy</span>：<b>这是方差问题，换一种估计方式就能改善（p20 换成自举）</b>。<span class='k'>② Â^{π_β} is for weaker policy than Â^{π_θ}</span>：<b>这条更深</b> —— <span class='w'>你用的是「行为策略的优势」，也就是在拿一个比你弱的策略的标准来判断动作好坏</span>。<b>⇒ 后果：你能改进的幅度被 π_β 的视野限住了</b>（<span class='k'>讲稿：we can only improve so much over the data set as a result</span>）。<b>而 p21 那一问 Can we estimate Q for a policy that is better than π_β? 正是冲着这一条来的，IQL 的那个不对称损失就是答案。</b>", "<b>最后把 α 的两端想清楚，它把这一讲的前三个方法连成了一条连续的谱。</b><span class='k'>α → ∞</span>：<b>权重 exp(Â/α) → 1，全部样本等权</b> ⇒ <span class='w'>普通模仿学习（L02）</span>；<span class='k'>α → 0</span>：<b>权重变成极尖的指数，只有优势最高的那些样本还有分量</b> ⇒ <span class='w'>近似「只学最好的那一小部分数据」，也就是 Filtered BC（p15）的单步版本</span>；<span class='k'>α 取中间值</span>：<b>就是 AWR</b>。<b>⇒ 这三个方法不是三个独立的点，而是同一个目标在一个超参的三个取值</b>。<span class='w'>这也解释了为什么 p32 把 Filtered BC 推荐成「第一个该试的」—— 它是这条谱的一个端点，而端点往往最稳。</span>"], "tbl": {"cap": "p18 那个思考题的两种数据：π_β 确定 vs π_β 有多样性", "head": ["", "π_β 确定性（如手工控制器）", "<b>π_β 有多样性（如多人采的数据）</b>"], "rows": [["每个状态见过几个动作", "<b>一个</b>", "<b>多个</b>"], ["V̂(s) 回归的目标", "<b>只有一个点</b>", "<b>多个点 —— 拟合出的是平均</b>"], ["优势 Σr − V̂", "<b>恒为 0</b>", "<b>有正有负（加权和为 0）</b>"], ["权重 exp(Â/α)", "<b>恒为 1</b>", "<b>有大有小</b>"], ["算法实际在做什么", "<b>普通模仿学习</b>", "<b>带权模仿 —— 能超过 π_β，能拼接</b>"], ["这是好事吗", "<b>是 —— 那种数据上本来就不该指望超过 π_β</b>", "<b>是 —— 这才是离线 RL 的用武之地</b>"]]}, "say": "<b>这两页上讲稿回答了五个问题，而其中三个都在同一件事上打转：「优势会不会是 0」。按顺序摊开。</b><br><br><b>① 为什么这里可以用蒙特卡洛（不是因为数据多，至少不只是）</b><br><br><span class='k'>So the question is, are we bringing up this Monte Carlo because, with offline data set, we have enough data that sum of rewards is more accurate, and we don't have the variance issues that we saw before? That's definitely one reason. When you have a large offline data set, variance is a bit less of a concern. And these are more accurate. That said, a big part of it is also just simplicity. And it's nice. Yeah, it's very nice to have an algorithm, where you're doing supervised learning to fit the value function. And then you're doing weighted supervised learning to fit the policy. And it's just a very, very simple algorithm. […] So it's still—even when you have an offline data set, there is variance. More variance in this estimate than other estimates that we'll see in a minute.</span><br><br><b>⇒ 他既承认了数据量这个理由，也坦白了「简单」占了很大比重，<span class='w'>而且没有否认方差问题还在</span>。这是一段很诚实的回答。</b><br><br><br><b>② 那个思考题的课堂答案（学生答的，老师补了一句）</b><br><br><span class='k'>so what was said is that if you're always taking the same action, then the sum of rewards will be the same as v, because you don't actually see any variability in your actions. And that means that your advantage estimates will all be 0. And then taking that one step further, if you then plug this into this equation, if all your advantage estimates are 0, then this exponentiated term is going to be 1. And then you actually just get back vanilla imitation learning. And that's actually—it's nice that you get that back because it means that for this policy, you actually can't really do better than the behavior policy in that scenario because you don't see any variability in different actions you can take. And so this algorithm then falls back on imitation learning in that scenario.</span><br><br><b>⭐ 注意 falls back 这个词。<span class='k'>算法在信息不足时退回到最保守的做法，而不是胡乱放大权重</span> —— 这是一个好算法该有的样子。</b><br><br><br><b>③ 那是不是意味着采数据时该故意偏离专家？</b><br><br><span class='w'>yeah, generally having more diverse actions represented in your offline data set is good for offline RL, especially if you think that your expert is not the optimal thing to do, then you definitely want variability. Because, then, you could actually have a potential to outperform the expert in your data.</span><br><br><b>⇒ 「动作多样性」是离线 RL 能超过 π_β 的<span class='k'>前提</span>，不是一个可选的加分项。</b><br><br><br><b>④ 实践中优势真的常常是 0 吗？</b><br><br><span class='w'>So the true advantage function for this policy is not 0 for other actions. It's just that we don't see those other actions in the data. And in practice, if you have variability in the actions, then you will get advantages that are very different from 0. […] It really depends on how broad your data set is.</span><br><br><b>⚠ 这句区分很重要：<span class='k'>真实的优势不是 0，是我们<b>估</b>出来的优势是 0</span>。</b><span class='w'>信息不在数据里，不等于信息不存在 —— 这和 L06 p7 那个「起点那行 Q 全是 0」是同一类情形：0 在那里的意思是「没有信息」，不是「不好」</span>。<br><br><br><b>⑤ 优势函数在数据外的动作上会给出什么？</b><br><br><span class='k'>So in this objective, we're actually only evaluating it on actions in the data set. And so you don't have any issues with going outside the support. Now, if you did evaluate it on actions outside the data set for a different reason, then it would be not accurate. It'll just be whatever was the result of the neural network optimization. If it's close to the data, it might be reasonable. If it's far from the data, it might be arbitrarily incorrect.</span><br><br><b>⇒ 这句话把 p19 那个 + 号的真正含义说清楚了：<span class='w'>不是「优势函数在数据外也准」，而是「我们从不在数据外评估它」</span>。<b>安全来自使用方式，不来自模型本身。</b></b><br><br><br><b>最后是那个算例，连同那处口算</b>：<br><br><span class='w'>maybe say this gets plus 10. This gets plus 1. This gets minus 5. Your value function for this estimate is going to be the average of these numbers so that is 3, I think. And the sum of rewards for taking this action is going to be 10. And so then the sum of rewards minus your value estimate will be seven.</span><br><br><b>⚠ (10 + 1 − 5)/3 = <b>2</b>，不是 3。</b><span class='k'>后面的 7 / −2 / −8 都是按 V = 3 推的，所以只是那一步口算滑了</span>；<b>按 V = 2 是 8 / −1 / −7，而且这三个数加起来正好是 0</b> —— <span class='w'>符合「优势在 π_β 下的期望为 0」这条性质，反而更干净</span>。<b>⇒ 结构完全不受影响，但这条「加权和为 0」的性质值得记住，它是你自己算优势时的免费检查。</b>", "link": {"t": "你学过的对应：CS224R L06 精读 p7（那个「起点那行 Q 全是 0」—— 0 的意思是「没有信息」而不是「不好」，与这里优势全为 0 是同一类情形）", "href": "L06-精读.html"}},
{"r": [20, 21], "t": "AWAC：把 a' 改成从数据里采 —— 然后问出全讲最漂亮的那个问题", "star": 5, "quote": "Can we do better?  Want to estimate advantages using TD updates, without querying Q on OOD actions.  Estimate Q-function: min_ψ E_{(s,a,s')∼D}[(Q̂^π_ψ(s,a) − (r + γE_{a'∼π(·|s)}[Q̂^π_ψ(s',a')]))²].  a' ∼ D.  advantage-weighted actor-critic (AWAC).  Note: Gives Q-function estimate for π_β underlying the data, *not* π_θ.  AWAC update: Q̂^{π_β} ← arg min_Q E_{(s,a,s',a')∼D}[(Q(s,a) − (r + γQ(s',a')))²].  Can we estimate Q for a policy that is better than π_β?  a sample of V^{π_β}(s') = E_{a∼π_β(·|s)}[Q(s,a)].  Histogram of V(s).  Idea: Use an asymmetric loss function.  best policy in data support.  ℓ2 loss gives us this!  Can we use another loss to get this?  Kostrikov, Nair, Levine. Implicit Q-Learning. ICLR '22.", "one": "<b>AWAC 的全部改动就一处：<span class='k'>自举目标里的 a' 不从策略采，而从数据集里取那条样本<b>实际</b>的下一个动作</span>。</b><b>一行改完之后 p21 问了一个更野的问题</b>：<span class='w'>既然 ℓ2 损失让我们拟合到「平均」，那换一个损失能不能拟合到「分位数」—— 也就是拿到一个<b>比 π_β 更好的策略</b>的值？</span>", "eq": "**p20：AWAC —— 一处改动**\n\n   AWR 的毛病（p19 第一条）：蒙特卡洛方差大。\n   自然的想法：用自举（TD）来估，方差小。\n   但 L07 p11 已经说了：自举要查 Q̂(s', a')，**a' 一旦落在数据外就是编的**。\n\n   于是：\n\n     L04/SAC：  目标 = r + γ·Q̂(s', **a'**),  **a' ∼ π_θ(·|s')**   ← 危险\n     AWAC：     目标 = r + γ·Q̂(s', **a'**),  **a' ∼ D**            ← 安全\n                                              ↑\n                        用数据集里**这条样本后面实际发生的那个动作**\n\n   ⇒ 数据集里存的本来就是 (s, a, r, s', **a'**) 这样的相邻对，\n     所以这个改动**不需要任何额外东西**，连采样都不用。\n\n   写全了就是 p21 那一行：\n\n     Q̂^{π_β}  ←  argmin_Q  𝔼_{(s,a,s',a')∼D} [ ( Q(s,a) − (r + γ·Q(s',a')) )² ]\n\n   讲义的提醒：**Gives Q-function estimate for π_β underlying the data, *not* π_θ**\n   —— 因为 a' 是 π_β 采的，所以这样自举出来的是 **π_β 的 Q**。\n\n────────────────────────────────────────\n**p21：然后问出了那个关键问题**\n\n   **Can we estimate Q for a policy that is better than π_β?**\n\n   切入点是重新看那个目标里的 γ·Q(s', a')：\n\n     𝔼_{a'∼π_β(·|s')}[ Q(s', a') ]  =  **V^{π_β}(s')**\n\n     而我们每次只拿到**一个** a'，所以\n     **Q(s', a') 是 V^{π_β}(s') 的一个<u>样本</u>**（讲义：a sample of V^{π_β}(s')）\n\n   ⇒ 用 ℓ2 损失回归一堆样本，得到的是它们的 **均值** ⇒ 正好是 V^{π_β}。\n\n────────────────────────────────────────\n**关键的那张图（p21 右侧）：某个状态上 Q(s,·) 的直方图**\n\n           数量\n            ↑\n            │       ▂▄█▆▃\n            │     ▁▄█████▅▂\n            │   ▁▃███████████▄▂▁\n            └──────┬──────────┬────→ Q(s,a) 的取值\n                   │          │\n              **均值**    **数据支撑内最好的策略**\n           = V^{π_β}      = best policy in data support\n          （ℓ2 给你这个）  （**我们想要这个**）\n\n   讲义的两句批注：\n     **ℓ2 loss gives us this!**         ← 指均值那一侧\n     **Can we use another loss to get this?**  ← 指右边那一侧\n\n   ⇒ **Idea: Use an asymmetric loss function.**\n     （下一页 p22 就讲这个损失长什么样。）", "pts": ["<b>先看清 AWAC 这一处改动有多廉价 —— 它几乎是免费的。</b><span class='k'>数据集里本来就存着相邻的 (s, a, r, s', a')</span>（<span class='w'>因为轨迹是连续的，s' 后面那个动作当然也在数据里</span>）。<b>所以把 a' ∼ π_θ 换成 a' ∼ D，实现上只是「别去调策略网络采样，直接读下一条记录」</b>。<span class='k'>⇒ 没有新网络、没有新超参、没有新采样</span>。<b>而换来的东西很实在</b>：<span class='w'>从此自举目标里的每一个 (s', a') 都是数据里真实出现过的对，<b>分布外动作被结构性地排除了</b></span>。", "<b>但这一处改动也付出了代价，而讲义用一个带星号的 *not* 标了出来。</b><span class='k'>Gives Q-function estimate for π_β underlying the data, *not* π_θ</span>。<b>为什么？因为自举目标里 a' 是 π_β 采的</b> —— <span class='w'>Bellman 方程里那个「下一步的动作服从谁」决定了你算出来的是谁的 Q</span>。<b>⇒ 于是 AWR 的第二条缺点（Â^{π_β} is for weaker policy）<b>并没有被修掉</b></b>。<span class='k'>AWAC 修的是第一条（方差），第二条留给了 IQL</span>。<b>⇒ 这是一个很干净的「一次只修一个」的推进路线，值得注意作者是怎么安排的。</b>", "<b>⭐ p21 那个重新解读是全讲最有想象力的一步，把它慢放一下。</b><span class='w'>原来我们看 γ·Q(s', a') 的眼光是「这是自举目标的一部分」</span>；<b>p21 换了一个眼光：<span class='k'>Q(s', a') 是 V^{π_β}(s') 的一个样本</span></b>。<b>为什么？因为 V^{π_β}(s') = 𝔼_{a'∼π_β}[Q(s',a')]，而数据里那个 a' 正是从 π_β 采的</b> —— <span class='w'>所以每条数据提供的 Q(s',a') 都是这个期望的一次抽样</span>。<b>⇒ 一旦换成这个眼光，接下来那句话就自然了</b>：<span class='k'>既然在做「从样本估一个统计量」，那凭什么非得估<b>均值</b>？</span>", "<b>「估均值」这件事是被<span class='k'>损失函数</span>选中的，不是被问题本身决定的 —— 这是整页的技术核心。</b><span class='w'>ℓ2 损失 min 𝔼[(v − x)²] 的解是 v = 𝔼[x]（均值）</span>；<b>这是一个关于 ℓ2 的事实，不是关于 V 的事实</b>。<span class='k'>换损失就换统计量</span>：<b>绝对值损失给中位数、分位损失给分位数、而 p22 的「期望分位（expectile）」损失给的是一个介于两者之间的东西</b>。<span class='w'>⇒ 这条思路在统计里很老（分位回归），但把它用在 Bellman 回路里是 IQL 的贡献</span>。<b>⚠ 顺带一提：L02 那条「ℓ2 的解是条件均值」在本讲已经是第三次起作用了</b>（<span class='k'>p14 的分叉状态、p16 的 V 是两个结果的平均、p21 这里</span>）。", "<b>为什么「数据支撑内最好的策略」是一个合理的目标，而不是贪心过头？这里有一个很关键的限定。</b><span class='k'>我们要的不是「所有策略里最好的」，而是 best policy <b>in data support</b></span>。<b>⇒ 这个目标天然被数据支撑封住了</b>：<span class='w'>直方图里那个右侧的高分位，仍然是由<b>数据里出现过的动作</b>贡献的 —— 它只是那些动作中较好的那一撮，不是某个没人试过的动作</span>。<b>⇒ 所以这个「乐观」和 p11 那个灾难性的乐观完全不同</b>：<span class='k'>p11 的乐观指向支撑外（没有根据），这里的乐观指向支撑内的高分位（有数据支撑，只是取了一个偏高的统计量）</span>。", "<b>把 AWR → AWAC → IQL 这三步的改动位置列清楚，会发现它们改的是三个互不干扰的地方。</b><span class='k'>AWR → AWAC：换了「优势怎么估」</span>（<span class='w'>蒙特卡洛 → 自举</span>），<b>修方差</b>；<span class='k'>AWAC → IQL：换了「自举时用什么损失」</span>（<span class='w'>ℓ2 → 不对称</span>），<b>修「只能估 π_β」这条天花板</b>；<b>而三者的<b>策略提取</b>那一步完全相同</b> —— <span class='w'>都是 p16 那一行带权模仿（p23 明写 Extract policy with AWR）</span>。<b>⇒ 所以 p18–19 的 AWR 不是被淘汰的旧方法，它是 IQL 的一个零件。</b>", "<b>最后一个值得留意的工程细节：p21 的更新式里<span class='k'>没有 max、没有策略网络参与</span>，这让它格外省事。</b><span class='w'>看那一行：Q̂ ← argmin_Q 𝔼_{(s,a,s',a')∼D}[(Q(s,a) − (r + γQ(s',a')))²]</span> —— <b>全部四个量都来自数据集，整个 critic 训练<b>完全不需要策略</b></b>。<span class='k'>⇒ critic 可以先独立训到收敛，然后再训策略</span>。<b>这正是 p23 那条优点 Decoupling actor & critic training —> computationally fast 的来源</b>（<span class='w'>不用在每一步都前向一次策略网络去采 a'，也不用担心 actor 与 critic 互相拖累</span>）。"], "tbl": {"cap": "自举目标里那个 a' 从哪来：三种选择，三种后果", "head": ["", "SAC / L04（a' ∼ π_θ）", "Q-learning / L06（max_{a'}）", "<b>AWAC（a' ∼ D）</b>"], "rows": [["a' 的来源", "<b>当前策略现场采</b>", "<b>对全部动作取最大</b>", "<b>数据集里实际发生的下一个动作</b>"], ["估出来的是谁的 Q", "<b>π_θ 的</b>", "<b>最优策略的</b>", "<b>π_β 的</b>"], ["会碰分布外动作吗", "<b>会 —— 离线设定下这是灾难</b>", "<b>会，而且 max 专门往那里跑</b>", "<b>不会 —— 结构性排除</b>"], ["需要策略网络参与 critic 训练吗", "<b>需要</b>", "<b>不需要（但要能算 argmax）</b>", "<b>不需要 ⇒ actor/critic 可解耦</b>"], ["改进的上限", "<b>能超过 π_β（但会崩）</b>", "<b>最优（但会崩）</b>", "<b>只到 π_β —— 这是它的天花板</b>"], ["下一步怎么撬这个上限", "<b>—</b>", "<b>—</b>", "<b>换损失：取分位数而不是均值（p22–23）</b>"]]}, "say": "<b>讲稿在 p20 上把那处改动说得非常轻描淡写，而轻描淡写本身是信息 —— 它真的就只是一行</b>：<br><br><span class='k'>Now, it'd be really nice to be able to not just use Monte Carlo and be able to use TD updates or use bootstrapped updates, without having to query Q on out-of-distribution actions. And the issue that we saw with our previous objective, right here, was we were querying the Q function out-of-distribution actions right here. Now, one very simple thing that we could do is instead of querying actions sampled from the policy that we're learning, we could just sample a prime from our data set. And this is, yeah, a very simple modification. And this will prevent—this will make sure that the a prime that we're seeing is actually always seen in the data. And we will actually have supervision targets for this s prime, a prime.</span><br><br><b>注意最后半句：<span class='w'>we will actually have supervision targets for this s prime, a prime</span>。</b><span class='k'>数据里真实出现过的 (s', a')，它的 Q 是被别的样本监督着的 —— 所以读它不是在读一个编出来的数</span>。<br><br><b>然后老师立刻点明代价还在</b>：<br><br><span class='w'>Now, note this is getting rid of one of the weaknesses of the original advantage weighted regression algorithm, which is that we're able to use bootstrapping, but we're still going to be estimating the value function for pi beta, and not for the policy that we're learning. So that's still one downside with this approach.</span><br><br><br><b>⭐ 接下来是 p21 那段重新解读，这是整讲最值得慢读的一段</b>：<br><br><span class='k'>So from here, it'd be good to think about if we can estimate a Q for a policy that's better than the behavior policy. And one of the ways to think about this is that, when we're trying to minimize this bootstrapped objective, this target, right here, this is a sample of v of s prime. So like we saw here, v of s prime, we're estimating the mean, the average of the outcomes, the average of the expected future rewards. But actually, there's a distribution of outcomes that's represented in the data.</span><br><br><b>「But actually, there's a distribution of outcomes」—— 转折就在这句。</b><br><br><span class='w'>And so if we think about that distribution—so we have our value function. And if we thought about the value function for a given state, when you are taking different actions, you see different sums of rewards. And so there's actually some underlying distribution for that in your data, for a given state. […] And then when we do Monte Carlo regression, if this distribution has a mean, maybe, right here, then this is what when we do when we're trying to fit like the Monte Carlo estimate for our behavior policy, then we get this average right here. We're averaging over the rewards that we're seeing.</span><br><br><span class='k'>Now, if we wanted to try to learn a value function for a policy that's better than pi beta, we could then—we could think about, maybe, instead of trying to fit the mean of the outcomes that we see, maybe we could try to fit some other percentile. So this is the mean, but maybe, if instead, we could try to fit the 70th percentile or something like that, then maybe we could actually get a value function for a policy that is better than our behavior policy.</span><br><br><b>⇒ 这一步的美妙之处在于它<span class='w'>没有引入任何新的信息来源</span>。</b><span class='k'>同一批数据、同一个回归问题，只是换了一个「想要哪个统计量」的问题 —— 就从「π_β 的值」变成了「比 π_β 更好的某个策略的值」</span>。<b>而那个「更好的策略」是谁？它从来没被显式写出来</b>（<span class='w'>这正是 implicit Q-learning 名字里 implicit 的另一层含义，p23 会标明 policy improvement is implicit</span>）。<br><br><b>最后他把要用什么工具也点了</b>：<br><br><span class='w'>So how do we do that? […] when we use an l2 loss, we have some error. […] if we instead wanted to try to get a value estimate for this, what we could do is, if we instead of having this symmetric loss […] you can instead use a loss function that looks like this. And you can actually show that loss functions like this will actually instead try—basically, you'll be penalized less for making errors in a particular direction. And this will actually give you a value function that looks more like this, that's actually better than your behavior policy.</span>", "link": {"t": "你学过的对应：CS224R L04 精读 p31（a' ∼ π_θ 那处修补 —— AWAC 把它反过来改成 a' ∼ D，因为离线设定下「重采动作」正是不能做的事）", "href": "L04-精读.html"}},
{"r": [22, 22], "t": "插页：期望分位回归 —— 换一个损失，就换一个统计量", "star": 4, "quote": "Aside: Expectile regression.  Instead of getting the mean of a random variable, can we get a higher or lower expectile?  Expectile regression loss: ℓ^λ_2(x) = (1−λ)x² if x < 0, λx² otherwise.  Example with a 2D random variable.  Kostrikov, Nair, Levine. Implicit Q-Learning. ICLR '22.", "one": "<b>一个两行的损失函数：<span class='k'>把平方误差按「误差的正负」分别乘上 λ 与 1−λ</span>。</b><b>λ = 0.5 就是普通 ℓ2（给均值）；λ 偏离 0.5，解就偏向分布的一侧</b> —— <span class='w'>这是整个 IQL 的全部技术内容，而它只占一页。</span>", "eq": "**定义**（讲义原式，x 是误差）：\n\n              ⎧  (1 − λ)·x²     若  x  <  0\n   ℓ^λ_2(x) = ⎨\n              ⎩      λ ·x²     否则（x ≥ 0）\n\n   **λ = 0.5** ⇒ 两支都是 0.5x² ⇒ **就是普通的 ℓ2 损失**（差一个常数倍）\n\n────────────────────────────────────────\n**图形（λ < 0.5 的情形）**\n\n     ℓ(x)\n      ↑\n      │ ╲                      ← 左支陡（权重 1−λ 大）\n      │  ╲                        ⇒ **x < 0 罚得重**\n      │   ╲\n      │    ╲        ╱\n      │     ╲    ╱              ← 右支平（权重 λ 小）\n      │      ╲ ╱                   ⇒ **x > 0 罚得轻**\n      └───────┼──────────→ x\n              0\n\n────────────────────────────────────────\n**⚠ 方向要自己推一遍，这里极容易弄反。**\n（讲稿里老师说到一半自己改了口 —— 说明它确实容易反。）\n\n   在 p23 里，这个损失是这样用的：\n\n     V(s) ← argmin_V 𝔼_{(s,a)∼D} [ ℓ^λ_2( **V(s) − Q̂(s,a)** ) ]\n                                        └── 这就是 x ──┘\n\n   于是：\n     x < 0  ⟺  V(s) < Q̂(s,a)   ⟺  **V 把这个样本<u>低</u>估了**\n     x > 0  ⟺  V(s) > Q̂(s,a)   ⟺  **V 把这个样本<u>高</u>估了**\n\n   取 **λ < 0.5**：\n     · x < 0（低估）的权重 = 1 − λ  >  0.5  ⇒ **低估罚得重**\n     · x > 0（高估）的权重 =     λ  <  0.5  ⇒ **高估罚得轻**\n\n   ⇒ 最优的 V 会被**往上**推 ⇒ 落在 Q̂ 分布的一个**高分位**上。\n   ⇒ 这正是 p21 想要的 **best policy in data support**。\n\n   （λ > 0.5 则反过来，得到低分位 —— 那是悲观估计，本讲没用到，\n     但在安全 RL 与风险敏感决策里正是要用的那一侧。）\n\n────────────────────────────────────────\n**为什么叫「期望分位（expectile）」而不是「分位（quantile）」**\n\n   分位回归用的是**绝对值**的不对称版：  ρ_τ(x) = (τ − 𝟙[x<0])·x\n   期望分位用的是**平方**的不对称版：    ℓ^λ(x) = |λ − 𝟙[x<0]|·x²\n\n   ⇒ 期望分位是「均值」的推广，分位是「中位数」的推广。\n     λ = 0.5 给均值，τ = 0.5 给中位数。\n   ⇒ 用平方的好处：**处处可微**，梯度与误差成正比，\n     放进神经网络训练里和普通 MSE 一样好养。", "pts": ["<b>这一页是全讲唯一一处纯技术插页（讲义自己标了 Aside），但它承载的分量不轻 —— 它是 IQL 与 AWAC 之间唯一的区别。</b><span class='k'>AWAC 与 IQL 的算法骨架几乎相同</span>（<span class='w'>都是自举估 Q、都只用数据里的动作、策略提取都用 AWR</span>）；<b>差别就在于 IQL 多了一个 V 网络，而那个 V 是用这个不对称损失拟合的</b>。<span class='w'>⇒ 一页的技术，换来了「突破 π_β 这个天花板」的能力</span>。", "<b>⭐ 把「换损失换统计量」这件事单独记住，它远不止用在这一处。</b><span class='k'>同一批样本 {x_i}，回归出来的那个标量取什么值，<b>完全由损失决定</b></span>：<span class='w'>ℓ2（平方）→ 均值 · ℓ1（绝对值）→ 中位数 · 分位损失 → 任意分位 · 期望分位损失 → 任意 expectile</span>。<b>⇒ 所以每当你看到一个方法「回归到某个目标」，都应该问一句：它在估这个分布的哪个统计量？</b><span class='k'>而且那通常不是作者刻意选的，而是 ℓ2 的默认后果</span>。<b>IQL 的贡献很大一部分就是意识到「这里的默认后果恰好不是我们想要的」。</b>", "<b>⚠ 方向这件事必须自己推一遍，不要背。</b><span class='w'>我在上面的公式格里把 x = V − Q̂ 代进去推了一遍，结论是 λ < 0.5 给<b>高</b>分位</span>；<b>这与 p23 上写的 using small λ < 0.5 一致，所以推导是对的</b>。<span class='k'>但它确实容易弄反 —— 讲稿里老师说到一半自己改了口</span>（<b>upweighting it when it is— sorry. Downweighting it with it's above 0, and upweighting it when it's less than 0</b>）。<b>⇒ 自己检查的最快办法：<span class='w'>看哪一支的系数大，那一支对应的错误就是「不许犯」的那种错误，于是解会往另一边躲</span></b>。<b>λ 小 ⇒ 1−λ 大 ⇒ x<0 那支系数大 ⇒ 不许低估 ⇒ 解往上躲 ⇒ 高分位。</b>", "<b>为什么用平方的不对称版（expectile）而不是绝对值的不对称版（分位回归）？这是一个很实际的工程选择。</b><span class='k'>分位损失 ρ_τ(x) = (τ − 𝟙[x<0])·x 在 x = 0 处不可微，而且梯度的大小与误差无关</span>（<span class='w'>永远是 ±τ 或 ±(1−τ)</span>）。<b>⇒ 用它训神经网络，大误差和小误差推得一样狠，收敛行为和 MSE 很不一样</b>。<span class='k'>而期望分位损失处处可微，梯度与误差成正比</span> —— <b>它就是一个「两边系数不同的 MSE」，实现上改两行、调参经验也可以沿用</b>。<span class='w'>⇒ 这是一个「为了能插进现有训练流程而做的选择」，很典型。</span>", "<b>另外注意讲义给的那个二维示例的意思（p22 右侧那张图）。</b><span class='k'>Example with a 2D random variable</span> —— <b>它画的是：同一个二维随机变量，λ 取不同值时「期望分位回归线」落在哪里</b>。<span class='w'>λ = 0.5 那条是普通的回归线（条件均值）；λ 偏小的那些线在上方，λ 偏大的在下方</span>。<b>⇒ 这张图的用处是让你看到「一族 λ 给出一族曲线」</b>，<span class='k'>而不是「一个 λ 给出一个修正」</span>。<b>IQL 要做的是从这一族里挑一条偏上的（典型取 λ ≈ 0.7–0.9 的那一侧，对应这里 λ 的记法是 0.1–0.3）。</b>", "<b>⚠ 一处记号上的提醒，查文献时会撞到：<span class='k'>讲义这里的 λ 与 IQL 原论文的 τ 方向是相反的</span>。</b><span class='w'>讲义的写法里「λ 小 ⇒ 高分位」（p23：using small λ < 0.5）</span>；<b>而 IQL 原论文用的是 τ，写成 ℓ_2^τ(u) = |τ − 𝟙[u<0]|u²，其中 u = Q − V，并且取 <b>τ 大</b>（如 0.7、0.9）得到高 expectile</b>。<span class='k'>两者并不矛盾 —— 差别只在误差 x 的符号怎么定（V − Q 还是 Q − V）</span>。<b>⇒ 所以读到 λ 或 τ 的具体数值时，第一件事是看清它定义里的误差是哪个方向</b>，<span class='w'>而不是直接拿数字去比</span>。<b>（这一条讲义没写，是我对照记号推的，标为推断。）</b>", "<b>最后，这个不对称的「乐观」和 L06/CSE541 那条「不要直接信 argmax」看起来方向相反，值得想清楚为什么不冲突。</b><span class='k'>赢家诅咒说的是：在<b>很多</b>带噪估计里取最大，那个最大值会系统性偏高 —— 所以要往下压</span>。<span class='w'>这里说的是：在<b>一个</b>状态的 Q 分布里取一个高分位，而这个分位是由<b>数据里出现过的动作</b>撑起来的 —— 所以它有根据</span>。<b>⇒ 两者的区别在于「高」的来源</b>：<span class='k'>前者的高来自噪声（没有根据，必须折），后者的高来自数据里确实有好动作（有根据，可以取）</span>。<b>⚠ 但这个区分是有条件的：如果某个状态上数据只有一两个动作，那「高分位」和「噪声的最大值」就区分不开了</b>。<span class='w'>这也解释了为什么 λ 不能取到 0（讲稿：if you set lambda to be 0, then you will overestimate probably），典型取值要留在中间带。</span>"], "tbl": {"cap": "换损失 = 换统计量（这一页的通用版本）", "head": ["损失", "形式", "最优解是什么统计量", "可微吗"], "rows": [["<b>ℓ2（平方）</b>", "<b>x²</b>", "<b>均值</b>", "<b>是</b>"], ["<b>ℓ1（绝对值）</b>", "<b>|x|</b>", "<b>中位数</b>", "<b>否（x=0 处）</b>"], ["<b>分位损失</b>", "<b>(τ − 𝟙[x<0])·x</b>", "<b>第 τ 分位数</b>", "<b>否</b>"], ["<b>期望分位损失（本页）</b>", "<b>|λ − 𝟙[x<0]|·x²</b>", "<b>第 λ 个 expectile</b>", "<b>是 —— 所以能插进神经网络训练</b>"]]}, "say": "<b>讲稿在这一页上的叙述有两处值得注意：一处是老师当场改口，另一处是 ASR 把术语听错了。先看改口那段</b>：<br><br><span class='k'>This loss function is going to behave differently, if the error is less than 0, versus if the error is greater than 0. And let me just remember what the direction is. So if it's less than 0—so we will have—and the base case is just x squared or e squared. Then, we'll have some hyperparameter that weights our loss by some value. And if lambda is 0.5, then this is the typical l2 objective, because it will be e squared, both less than 0 and above 0. And if lambda is less than 0.5, then it will be downweighting the loss, when it's greater than 0 and upweighting it when it is—<b>sorry</b>. Downweighting it with it's above 0, and upweighting it when it's less than 0.</span><br><br><b>⚠ 注意 And let me just remember what the direction is 和中间那个 sorry。</b><span class='w'>老师自己要停下来想一下方向，然后说到一半改了口 —— 这不是他不熟，这是这个方向<b>本来就容易反</b></span>。<b>⇒ 所以不要背这个方向，要能从损失的系数现场推出来</b>（<span class='k'>系数大的那一支是「不许犯」的错误，解往另一边躲</span>）。<b>改口之后他说的是对的：λ < 0.5 ⇒ x>0 罚得轻、x<0 罚得重。</b><br><br><b>然后是术语那处</b>：<br><br><span class='w'>This is called <b>expected regression</b>. It's a cool trick. You can think about it in terms of rather than just error, some arbitrary random variable x. And if you define different values of this lambda term, then you get these asymmetric losses that look like this, where, again, if lambda is greater than 0.5, then you see it as asymmetric in this direction versus, if it's less, you see asymmetric in the other direction. And here's another visualization, where if you're trying to—the mean of this random variable is shown in the red curve, but then, you can get different tiles with different values of lambda.</span><br><br><b>⚠ 讲稿里写的是 expected regression，幻灯上写的是 <b>Expectile regression</b>。</b><span class='k'>这是 ASR 把 expectile 听成了 expected</span>；<b>同一段里 different tiles 也是把 different expectiles 听掉了前半截</b>。<span class='w'>⇒ 查文献时用 expectile regression 这个词（统计里是 Newey & Powell 1987 提出的，这一条讲义没给，是补的背景）</span>。<br><br><br><b>最后，讲稿里老师用一句话说了这个损失在直觉上在干什么，这句比公式好记</b>：<br><br><span class='k'>And this will be penalizing you for overestimating and underestimating, but it won't be penalizing you as much, if you overestimate a little bit. Basically, if you're off by a little bit.</span><br><br><b>⇒ 「两种错都罚，但高估罚得轻一点」—— 于是解会稳定地偏高一点。<span class='w'>不是「不罚高估」（那样解会跑到无穷），而是「少罚一点」（所以解落在一个确定的高分位上）</span>。这个区别是这个损失能用的原因。</b>", "link": {"t": "你学过的对应：CS224R L02 精读 p10（ℓ2 的解是条件均值 —— 这一页就是把这条事实反过来用：既然损失决定统计量，那就换损失）", "href": "L02-精读.html"}, "res": {"tag": "推断", "v": "<b>这一页对你的课题是<span class='k'>可以直接搬</span>的那种，而且搬的方向与讲义相反 —— 你要的是低分位，不是高分位。</b><br><br><span class='w'>你的问题里有一个约束（可行性 / 预算 / 延迟上限之类），而约束通常不是用均值表述的</span>：<b>「这个配置在 95% 的情况下延迟不超过 100ms」才是实际要求，「平均延迟不超过 100ms」没人会这么写</b>。<span class='k'>而如果你用普通 MSE 训一个延迟预测器，你拿到的恰好是条件均值 —— 它系统性地低于那个你真正关心的高分位</span>。<b>⇒ 用均值去判可行性，会系统性地把「其实常常超时」的配置判成可行。</b><br><br><b>⇒ 两个具体用法</b>：<br><b>① 约束侧用高 expectile（λ 小）。</b><span class='w'>训一个 ℓ^λ_2 回归器去预测约束量，取一个偏保守的 λ</span> ⇒ <b>预测值偏高 ⇒ 判可行时偏严 ⇒ 给出的「可行」更可信</b>。<span class='k'>这比「训均值再手工加一个安全边际」干净得多，因为安全边际的大小由数据自己决定，而不是你拍的常数</span>。<br><b>② 成本侧用低 expectile（λ 大）或者<u>反过来</u>用高 expectile 做悲观估计。</b><span class='w'>你要找最便宜的，所以成本预测器的乐观误差会被 argmin 主动利用（这是 L07.a 那条科研格说的事）</span> ⇒ <b>成本侧应该<b>高</b>估，也就是同样取 λ 小的那一侧</b>。<span class='k'>⇒ 注意这两条方向是一致的：约束与成本都往「不利于这个配置」的方向偏，于是 argmin 选出来的配置是经得起检验的那些</b>。<br><br><b>⭐ 而本页最有迁移价值的那条，是那个<span class='w'>可微</span>的理由</b>：<b>分位回归在 0 处不可微、梯度与误差无关，而期望分位损失就是一个「两边系数不同的 MSE」</b>。<span class='k'>⇒ 如果你的代理模型是神经网络或梯度提升树，换成这个损失基本是改一个损失函数的事，训练流程、学习率、早停策略都能沿用</span>。<b>这让「把均值换成保守分位」从一个研究决定降级成一个实现细节 —— 代价极低，所以值得当默认做法。</b><br><br>⚠ <b>标为推断</b>：<span class='w'>讲义讲的是在 Bellman 回路里用它来绕开 OOD 动作，与你的「用它来保守地估约束」是不同的用途</span>；而且<b>你的设定里样本可能极少</b>（每个配置只评估过一次），<span class='k'>而 expectile 要估准需要同一输入附近有多个样本</span> —— <b>这一点必须先验证，否则你拿到的不是「高分位」而是「噪声」</b>。<br><br>⚠ 另有一处记号陷阱：<span class='w'>讲义的 λ 小 = 高分位，而 IQL 原论文的 τ 大 = 高分位（因为误差符号定得相反）</span>。<b>照抄代码前先看清那一行里误差是 V−Q 还是 Q−V。</b>", "ref": "本讲 p22 的 ℓ^λ_2 定义与 p23 的 using small λ < 0.5；记号方向对照 Kostrikov, Nair, Levine. Implicit Q-Learning. ICLR '22"}},
{"r": [23, 23], "t": "IQL 全算法：三式各管一事，而「策略改进」从来没被写出来", "star": 5, "quote": "Can we do better?  Want to estimate advantages using TD updates, without querying Q on OOD actions.  Full algorithm — Fit V̂ with expectile loss: V(s) ← arg min_V E_{(s,a)∼D}[ℓ^λ_2(V(s) − Q̂(s,a))] -> implicit Q-learning (IQL) using small λ < 0.5.  Update Q̂ with typical MSE loss: Q(s,a) ← arg min_Q E_{(s,a,s')∼D}[(Q(s,a) − (r + γV̂(s')))²].  Extract policy with AWR: π̂ ← arg max_π E_{s,a∼D}[log π(a|s) exp((1/α)(Q̂(s,a) − V̂(s)))].  + Never need to query OOD actions!  + Decoupling actor & critic training —> computationally fast.  + Policy (still) only trained on actions in data.  policy improvement is implicit.  You will implement IQL in homework 3!  Kostrikov, Nair, Levine. Implicit Q-Learning. ICLR '22.", "one": "<b>三行算法，三个零件各管一事：<span class='k'>V 用不对称损失取 Q 的高分位（偷偷做了策略改进）· Q 用普通 MSE 自举到 V（把改进传播出去）· 策略用 AWR 提取（从不碰数据外动作）</span>。</b><b>全程没有任何一处 max，也没有任何一处对策略采样 —— 这就是 implicit 的意思。</b>", "eq": "**三式（讲义原序）**\n\n────────────────────────────────────────\n**① 用期望分位损失拟合 V̂**（这一步做了策略改进）\n\n   V(s)  ←  argmin_V  𝔼_{(s,a)∼D} [ ℓ^λ_2( V(s) − Q̂(s,a) ) ]\n                                    └─ λ < 0.5 ⇒ V 落在 Q̂ 的高分位 ─┘\n\n   ⇒ V̂(s) ≈ 「在 s 上，数据支撑内<b>较好</b>的那些动作的 Q」\n     而不是「π_β 的平均」。\n   ⇒ **这一步就是策略改进** —— 但没有任何策略出现在式子里。\n\n**② 用普通 MSE 自举 Q̂**（这一步把改进传播出去）\n\n   Q(s,a)  ←  argmin_Q  𝔼_{(s,a,s')∼D} [ ( Q(s,a) − (r + γ·**V̂(s')**) )² ]\n                                                        └ 用 ① 的 V̂ ┘\n\n   ⚠ 注意这里**没有 a'** —— 因为 V̂(s') 已经把「下一步该选哪个动作」\n     这件事吸收进去了。于是：\n     · 不需要从策略采 a'（AWAC 还要读数据里的 a'）\n     · 不需要 max_{a'}（Q-learning 要）\n     ⇒ **输入里只有 (s, a) 与 s'，全部来自数据。**\n\n**③ 用 AWR 提取策略**（这一步与 p16/p19 完全相同）\n\n   π̂  ←  argmax_π  𝔼_{s,a∼D} [ log π(a|s) · exp( (1/α)·( Q̂(s,a) − V̂(s) ) ) ]\n                                                      └── 优势 Â ──┘\n\n────────────────────────────────────────\n**⭐ ① 与 ② 合起来形成一个「改进会复利」的回路：**\n\n   V̂ 是 Q̂ 的高分位        （① 比 π_β 好一点）\n     ↓ 喂给 ②\n   Q̂ 自举到这个偏高的 V̂   （② 把「好一点」传到上一步）\n     ↓ 喂给 ①\n   V̂ 又取新 Q̂ 的高分位    （① 再好一点）\n     ↓ …\n\n   ⇒ 每过一轮 Bellman 回传，那个「比 π_β 好一点」就往前传一步、并且叠加。\n     这正是 Q-learning 里 max 所做的事 —— **但这里用的是一个分位，而且\n     只在数据支撑内取。**\n   ⇒ 讲义批注：**policy improvement is implicit**\n\n────────────────────────────────────────\n**三个优点（讲义原文）与各自的来源**\n\n   **+ Never need to query OOD actions!**\n       ← ① 的输入是数据里的 (s,a)；② 的输入是数据里的 (s,a,s')；③ 同理\n   **+ Decoupling actor & critic training —> computationally fast**\n       ← ①② 里完全没有策略 ⇒ critic 可以先独立训到收敛\n   **+ Policy (still) only trained on actions in data.**\n       ← ③ 就是带权模仿，a 来自 D\n\n   **You will implement IQL in homework 3!**", "pts": ["<b>先把三式各自管什么钉死，这是读懂这一页的全部。</b><span class='k'>① V 那一步做的是「策略改进」</span>（<span class='w'>取高分位 = 偏向好动作</span>）；<span class='k'>② Q 那一步做的是「策略评估 / 传播」</span>（<span class='w'>把 V 的信息往前传一个 Bellman 步</span>）；<span class='k'>③ 策略那一步做的是「提取」</span>（<span class='w'>把已经藏在 Q−V 里的改进变成一个可执行的策略</span>）。<b>⇒ 注意 ③ 不产生任何新的改进</b>，<span class='w'>它只是把 ①② 已经学到的东西蒸馏成一个网络。所以 IQL 的「厉害」全在 ① 那个损失上</b>。", "<b>⭐ ② 式里<span class='k'>没有 a'</span> 这件事值得单独看一眼，它是 IQL 比 AWAC 更干净的地方。</b><span class='w'>AWAC 的目标是 r + γ·Q(s', a')，需要从数据里读出那条样本的下一个动作 a'</span>；<b>IQL 的目标是 r + γ·V̂(s')，<b>根本不需要 a'</b></b>。<span class='k'>因为 V̂(s') 这个量已经回答了「在 s' 上该期待多少」这个问题</span>。<b>⇒ 三个后果</b>：<span class='w'>① 实现更简单（不用存相邻动作对，单条 transition 就够）· ② 不受「数据里那个 a' 恰好很差」的影响 · ③ 而最关键的是：V̂(s') 代表的是一个<b>比 π_β 好</b>的策略，所以自举传回来的也是那个更好策略的值</span>。", "<b>⭐ 那条「改进会复利」的回路是本页最该想明白的事，而它解释了 IQL 凭什么能明显超过 π_β。</b><span class='k'>单看 ① 一次，V̂ 只比 π_β 的 V 高一点（高了一个 λ 决定的分位）</span>；<b>但 ② 把这个偏高的 V̂ 当成自举目标，于是 Q̂ 也整体抬高；再回到 ①，又在新的 Q̂ 上取高分位</b>。<span class='w'>⇒ 每一轮 Bellman 回传都叠加一次「选好的那一侧」</span>。<b>⇒ 这和 Q-learning 里 max 所起的作用是同一种</b>（<span class='k'>L06 的那个 max 也是靠反复回传才把最优性传遍整个状态空间的</span>），<b>区别只在于：max 取的是「全部动作里的最大」（可能在支撑外），而这里取的是「数据支撑内的一个高分位」</b>。", "<b>「policy improvement is implicit」这句批注有两层意思，别只读一层。</b><span class='k'>第一层：改进不是由一个显式的 argmax 或 argmax_π 完成的</span>，<b>而是由一个损失函数的不对称性完成的</b>。<span class='k'>第二层更有意思：那个「被改进出来的策略」从头到尾<b>没有被写出来过</b></span>。<b>① 式里只有 V 和 Q，没有 π</b>；<span class='w'>V̂ 代表的是「数据支撑内某个比 π_β 好的策略」的值函数，但那个策略是谁、长什么样，算法里没有任何地方需要知道</span>。<b>⇒ 直到 ③ 那一步，才用 AWR 把它「显影」出来。<span class='k'>名字里的 Implicit 指的就是这件事。</span></b>", "<b>⭐ 课堂上那个「这样不会高估吗」的问答是本页最重要的补充，因为它说明<span class='k'>这个高估是故意的，而且是有界的</span>。</b><span class='w'>老师的回答分三段</span>：<b>① 首先，没有分布外动作的问题</b>（<span class='k'>we're never going to be passing as input actions that are not in the data. And that was one of the major sources of overestimation before</span>）；<b>② 其次，相对 π_β 确实是高估的 —— 而这正是目的</b>（<span class='k'>you will be getting an overestimate of the pi beta. And the reason for that is you're actually trying to estimate the value of a policy that's better than pi beta. […] So you're purposefully overestimating the pi beta</span>）；<b>③ 但 λ 不能走到极端</b>（<span class='w'>if you set lambda to be 0, then you will overestimate probably. And typically, you'll choose some value that's maybe 0.2 […] that's more in the middle that's not so aggressive</span>）。<b>⇒ 把三段合起来：<span class='k'>高估 π_β = 对的（那是目标）；高估到没有数据支撑的程度 = 错的（那是 p11 的病）。λ 控制的就是这条线落在哪里。</span></b>", "<b>把这个「有根据的乐观」和 L06 的赢家诅咒并排放，是本讲收尾时最该带走的那组对比。</b><span class='k'>L06 的 max_a Q̂：在带噪的估计里取最大 ⇒ 系统性偏高 ⇒ 没有根据 ⇒ 必须折（双 Q）</span>。<span class='k'>IQL 的高分位：在数据支撑内的 Q 分布里取一个偏高的分位 ⇒ 也偏高 ⇒ 但偏高的部分由真实出现过的好动作撑着 ⇒ 可以取</span>。<b>⚠ 两者之间的界限由「那个状态上数据有多少动作」决定</b>：<span class='w'>动作多，高分位是真的好动作；动作只有一两个，高分位和噪声最大值就区分不开了</span>。<b>⇒ 这就是为什么 λ 要留在中间带，而不是取到 0。</b>", "<b>最后两个实用点，为作业 3 做准备。</b><span class='k'>① 为什么用 Q 而不直接用蒙特卡洛回报做那个不对称回归</span>：<span class='w'>讲稿说两者都行（all these ideas are applicable to Monte Carlo as well），但 Q 的方差更小 —— It's nice to use Q because Q is lower variance than this sum of rewards</span>。<span class='k'>② λ 要不要随训练变</span>：<b>纯离线应保持常数</b>（<span class='w'>讲稿：it makes sense to keep it constant because you always want to be a fixed amount better than your behavior policy</span>）；<b>只有在开始采在线数据时，才有理由把 λ 往 0.5 挪</b>（<span class='k'>因为那时数据集本身已经被一个更好的策略偏移过了，再往上取分位就是在重复计算同一份改进</span>）。<b>⇒ 这个回答顺带解释了 p32 为什么说 IQL 特别适合「离线预训练 + 在线微调」。</b>"], "tbl": {"cap": "第一族五步走完：每一步修掉上一步的哪条缺点", "head": ["", "优势怎么估", "会碰 OOD 动作吗", "估的是谁的值", "留下的缺点"], "rows": [["<b>普通模仿（L02）</b>", "<b>不估 —— 不看奖励</b>", "<b>不会</b>", "<b>—</b>", "<b>上限 = π_β，且分叉状态取平均</b>"], ["<b>Filtered BC（p15）</b>", "<b>按整条轨迹回报筛</b>", "<b>不会</b>", "<b>—</b>", "<b>粒度太粗 ⇒ 不能拼接</b>"], ["<b>AWR（p18–19）</b>", "<b>蒙特卡洛：Σr − V̂</b>", "<b>不会</b>", "<b>π_β</b>", "<b>方差大；上限仍是 π_β</b>"], ["<b>AWAC（p20–21）</b>", "<b>自举，a' 从 D 取</b>", "<b>不会</b>", "<b>π_β</b>", "<b>方差修好了；上限仍是 π_β</b>"], ["<b>IQL（p22–23）</b>", "<b>自举 + V 取高分位</b>", "<b>不会</b>", "<b>数据支撑内一个<u>更好</u>的策略</b>", "<b>多一个 λ；仍不会提出数据外的动作</b>"]]}, "say": "<b>讲稿在这一页上回答了三个问题，三个都对实现有直接影响。</b><br><br><b>① 这样会不会高估？（最重要的那个）</b><br><br><span class='k'>So one thing to note about this algorithm is, we're never going to be passing as input actions that are not in the data. And that was one of the major sources of overestimation before. Now depending on how you set lambda, if you set lambda to be 0, then you will overestimate probably. And typically, you'll choose some value that's maybe 0.2 or 0.2, something like that's more in the middle that's not so aggressive. And you will be getting an overestimate of the pi beta. And the reason for that is you're actually trying to estimate the value of a policy that's better than pi beta. So you're trying to estimate V pi for a policy pi that's better than pi beta. So you're purposefully overestimating the pi beta.</span><br><br><b>⭐ purposefully overestimating —— 这个词组是本页的钥匙。</b><span class='w'>把它和 p11 的「substantially overestimated」放在一起看：同一个词，一个是病、一个是药</span>。<b>区别在于前者的高估指向<b>没有数据</b>的地方，后者的高估指向<b>数据里较好的那一撮</b></b>。<br><br><br><b>② λ 要不要随训练逐渐调？</b><br><br><span class='w'>The question is, because we're going to be gradually improving our policy, would it make sense to gradually decrease lambda? So we're not actually collecting data from our policy. And so all the data is coming from our offline data set. And in that case, it makes sense to keep it constant because you always want to be a fixed amount better than your behavior policy. Now, if you did in principle actually do start collecting some online data, then things will change a little bit, because then you'll actually be skewing your data set to a better policy. And in that case, it actually might make sense, potentially, to bring lambda closer to 0, or sorry, closer to 0.5. Because you'll then have data from a better policy—a policy better than your behavior policy.</span><br><br><b>⇒ 逻辑很干净：<span class='k'>λ 控制的是「比数据里的策略好多少」。数据不变 ⇒ 这个「多少」不该变。数据被更好的策略刷新了 ⇒ 就该少取一点，否则是在重复计算同一份改进。</span></b>（<b>注意他又改了一次口：closer to 0, or sorry, closer to 0.5 —— 这个方向真的容易说反。</b>）<br><br><br><b>③ 为什么拟合的是 Q，而不直接对蒙特卡洛回报做那个不对称回归？</b><br><br><span class='k'>So we could also use Monte Carlo returns with this and use the spectral-like objective with this term. It's nice to use Q because Q is lower variance than this sum of rewards right here. And we can fit a Q-function, using the bootstrapped backups. So all these ideas are applicable to Monte Carlo as well. But using Q-functions, like when you can use this bootstrapped objective, which you could only do with Q-functions, then you'll get a lower variance target.</span><br><br><b>⇒ 「这些想法对蒙特卡洛也适用，只是方差更大」。<span class='w'>所以 ①② 那个自举回路不是不对称损失的必要条件，它只是让它用起来更稳。</span></b>（<span class='k'>顺带：spectral-like 又是一处 ASR 听错，上下文里指的是 expectile-like。</span>）<br><br><br><b>最后，三个优点的那段总结，讲稿说得比幻灯清楚一点</b>：<br><br><span class='w'>So pros of this algorithm, we don't need to query out of distribution actions. The policy is still only trained on actions in the data. And we're decoupling actor and critic training. So we just do these critic training. We're fitting a value function and a Q-function on our data. And then once we're done with that, and that's converged, or we've done enough training, then we train our policy.</span><br><br><b>⇒ 注意那个顺序：<span class='k'>critic 先训到收敛，然后才训策略</span>。<b>这不只是「快」，它还让训练过程好调试</b> —— <span class='w'>critic 和 actor 不会互相拖累，你可以单独看 critic 的损失曲线判断它学没学好，而这在 SAC 那种交替更新的算法里做不到</span>。</b>", "link": {"t": "你学过的对应：CS224R L06 精读 p11–p12（Q-learning 用 max 做隐式的策略改进 —— IQL 用「高分位」替掉那个 max，于是改进仍然发生，却不会跑到支撑外）", "href": "L06-精读.html"}},
{"r": [24, 26], "t": "⭐ 第二族：保守方法 —— 两项变三项，保证从「逐点」降级成「期望」", "star": 5, "quote": "The plan for today — Offline RL: 1. Why offline RL? Can we just run off-policy methods? 2. Implicit policy constraint methods 3. Conservative methods.  Part of homework 3!  How to mitigate overestimation in offline RL?  Recall: Randomly init. Q-function for state s', action a'.  Q(s',a').  data support.  Can we discourage overestimation? without explicitly modeling the behavior policy.  What if we just push down on large Q-values?  Q̂^π = arg min_Q max_μ E_{(s,a,s')∼D}[(Q(s,a) − (r(s,a) + γE_π[Q(s',a')]))²] + α E_{s∼D,a∼μ(·|s)}[Q(s,a)].  standard critic update / push down on large Q-values.  Can show that for large enough α, Q̂^π ≤ Q^π.  − α E_{(s,a)∼D}[Q(s,a)].  push up on Q-values for (s,a) in the data.  No longer guaranteed that Q̂^π ≤ Q^π for all (s,a).  BUT, guaranteed that E_{π(a|s)}[Q̂^π(s,a)] ≤ E_{π(a|s)}[Q^π(s,a)] for all s ∈ D.  Conservative Q-learning (CQL).  Slide adapted from Sergey Levine.", "one": "<b>第二族的全部想法就一句话：<span class='k'>Q 值大的地方，一律往下压</span>。</b><b>p25 只压不抬，拿到一个<span class='w'>逐点</span>的下界但会把 Q 整体压垮；p26 加一项「把数据里的 (s,a) 抬起来」，于是惩罚变成一个<span class='k'>相对差</span></b> —— <span class='w'>逐点的保证丢了，换来一个「对输出的那个策略而言不高估」的保证。而后者才是你真正需要的。</span>", "eq": "**p25：两项 —— 标准 critic 更新 + 压低**\n\n   Q̂^π  =  argmin_Q  **max_μ**  { 𝔼_{(s,a,s')∼D}[ ( Q(s,a) − (r + γ𝔼_π[Q(s',a')]) )² ]\n                                  └────── standard critic update ──────┘\n                               +  α·𝔼_{s∼D, a∼μ(·|s)}[ Q(s,a) ] }\n                                  └── **push down on large Q-values** ──┘\n\n   **那个 max_μ 是怎么起作用的？**（μ 是动作上的一个分布）\n\n     内层 max_μ 𝔼_{a∼μ(·|s)}[Q(s,a)]  —— μ 不受限时，最优解是\n     **把全部概率放在 Q 最大的那个动作上** ⇒ 取值 = **max_a Q(s,a)**\n\n     ⇒ 外层 argmin_Q 要把这一项压小 ⇒ **压的正是那个最大值所在的位置**。\n     ⇒ 「push down on large Q-values」这句话是**字面意思**：\n       μ 负责**找出** Q 哪里最高，Q 负责**把那里压下去**。\n\n   **保证**：**for large enough α, Q̂^π ≤ Q^π** —— 这是一个**逐点**的下界，\n           在**每一个** (s,a) 上都成立。\n\n   ⚠ **但代价是它压得太狠了**：这一项不区分「数据里的」和「数据外的」，\n     α 一大，**连数据里那些本该准的 Q 也被一起压垮**。\n     ⇒ 最后 Q 整体塌掉，排序信息跟着一起没了。\n\n────────────────────────────────────────\n**p26：加第三项 —— 把数据里的抬起来**\n\n   …  +  α·𝔼_{s∼D, a∼μ(·|s)}[ Q(s,a) ]   **−**  α·𝔼_{(s,a)∼D}[ Q(s,a) ]\n         └──── 压低（μ 找的最高处）────┘        └── **抬高（数据里的 (s,a)）** ──┘\n\n   **把这两项合起来看，它是一个差**：\n\n     α · ( 𝔼_{a∼μ}[Q(s,a)]  −  𝔼_{a∼π_β}[Q(s,a)] )\n          └─ Q 在「最高处」的值 ─┘   └─ Q 在「数据里」的值 ─┘\n\n   ⇒ 惩罚的不再是 Q 的**绝对高度**，而是\n     **「Q 在数据外比在数据内高出多少」**这个**落差**。\n\n   ⇒ 后果一：**Q 整体加一个常数，惩罚不变** ⇒ **不会把 Q 压垮**。\n   ⇒ 后果二：**逐点的下界没了**（讲义：No longer guaranteed that Q̂^π ≤ Q^π for all (s,a)）。\n\n────────────────────────────────────────\n**换来的那个保证（p26 的 BUT 那一行）**\n\n   **𝔼_{π(a|s)}[ Q̂^π(s,a) ]  ≤  𝔼_{π(a|s)}[ Q^π(s,a) ]      对所有 s ∈ D**\n     └── 我们估的策略价值 ──┘      └── 真实的策略价值 ──┘\n\n   ⇒ 「**在数据里出现过的每个状态上，我们对<u>自己这个策略</u>的价值估计不会偏高。**」\n\n   ⭐ **这恰好就是需要的那条保证**，理由见下面的 pts：\n     策略是靠最大化 𝔼_π[Q̂] 选出来的，\n     所以要防的就是「𝔼_π[Q̂] 比真实的 𝔼_π[Q^π] 高」这件事 ——\n     **逐点的下界比这更强，强出来的部分是白付的代价。**", "pts": ["<b>先把这一族和第一族的分工说清楚：<span class='k'>第一族管住的是「策略去哪」，第二族管住的是「Q 值长什么样」</span>。</b><span class='w'>第一族（AWR/AWAC/IQL）的做法是只在数据里的 (s,a) 上做监督，于是策略<b>没机会</b>提出数据外的动作</span>；<b>第二族允许策略去查数据外（p27 的策略更新用的正是 argmax 或者对 Q 做梯度上升），但让那里的 Q <b>一律偏低</b>，查过去也没有吸引力</b>。<span class='k'>⇒ 一个靠「不给机会」，一个靠「去了也没好处」</span>。", "<b>⭐ 那个 max_μ 看着吓人，其实只是「max_a」的一个可以加正则的写法，想通这一点整页就不难了。</b><span class='w'>μ 是动作上的一个分布，内层 max_μ 𝔼_{a∼μ}[Q(s,a)] 在 μ 不受任何限制时，最优解就是把全部概率压在 Q 最大的那个动作上</span>，<b>于是这一项的值就是 max_a Q(s,a)</b>。<span class='k'>⇒ 所以 μ 的角色是「找出 Q 哪里最高」，而外层的 argmin_Q 负责「把那里压下去」</span>。<b>为什么要写成 max_μ 而不直接写 max_a？因为这样可以给 μ 加一个正则项 R(μ)</b> —— <span class='w'>p28 就是靠这一步把整个 min-max 化简成一个可微的闭式表达式</span>。", "<b>⚠ p25 那个版本有一个<span class='k'>致命</span>的实践问题，而幻灯只用一句「for large enough α」轻轻带过了。</b><span class='w'>那一项 α·𝔼_{a∼μ}[Q] 压的是「Q 最大的地方」，而它<b>完全不区分</b>那个地方在不在数据支撑内</span>。<b>⇒ 在数据密集的状态上，Q 最大的那个动作很可能正是数据里的那个好动作 —— 它也被一起压了</b>。<span class='k'>α 一大，整个 Q 函数被向下拖，而 Q 的<b>绝对值</b>一旦塌掉，用它取 argmax 得到的排序也会被噪声淹没</span>。<b>⇒ 逐点的下界是真的（数学上成立），但它是一个「太强所以没用」的保证。p26 那一项正是来救这件事的。</b>", "<b>⭐ p26 那一项加进来之后，最该注意的是<span class='k'>两项合成了一个差</span>，而「差」这个形状带来了一个很漂亮的性质。</b><span class='w'>α·(𝔼_{a∼μ}[Q] − 𝔼_{a∼π_β}[Q])</span> —— <b>给 Q 整体加一个常数 c，这个差一点不变</b>（<span class='k'>两边各多一个 c，抵消掉了</span>）。<b>⇒ 惩罚项对 Q 的「整体高度」完全不敏感，它只管「数据外比数据内高出多少」</b>。<span class='w'>⇒ 于是 Q 不会被整体压垮，而落差会被压平</span>。<b>这正是我们想要的：<span class='k'>我们从来不在乎 Q 的绝对值对不对，只在乎它的<b>排序</b>和「数据外别虚高」</span></b>（<b>⚠ 这条「只在乎排序」在 L06 p13 已经说过一次了：那里讲的是「不收敛常常只是绝对值不准，排序对了 argmax 出来的策略照样好」</b>）。", "<b>⭐⭐ p26 那个「保证降级」是本页最该想明白的事，而它的要点是：<span class='k'>降级之后的那条才是真正需要的那条</span>。</b><b>先看两条保证的区别</b>：<span class='w'>p25 的 Q̂^π ≤ Q^π 对<b>每一个</b> (s,a) 成立（逐点）</span>；<span class='w'>p26 的 𝔼_{π(a|s)}[Q̂^π] ≤ 𝔼_{π(a|s)}[Q^π] 只对<b>在 π 下取期望之后</b>、而且只在 s ∈ D 上成立</span>。<b>后者弱得多</b> —— <span class='k'>它允许某些单个动作的 Q 被高估，只要「按 π 的概率加权之后」总体不高估</span>。<b>那为什么说这才是需要的？因为<span class='w'>策略是靠最大化 𝔼_π[Q̂] 选出来的</span></b>：<b>你最终拿 Q̂ 去做的唯一一件事，就是比较不同策略的 𝔼_π[Q̂]，然后挑最大的那个</b>。<span class='k'>⇒ 要防的风险只有一个：「我以为这个策略值 100，其实只值 30」。而 p26 的保证恰好就排除了这件事。</span>", "<b>把这条「保证要配得上用途」的思路单独记下来，它是一个可以带走的方法论。</b><span class='w'>p25 → p26 的这一步在数学上是「把一个强保证换成一个弱保证」，听起来像退步</span>；<b>但因为那个强保证的代价是「算法不可用」，而弱保证正好覆盖了唯一的使用场景，所以这一步是<span class='k'>纯赚</span></b>。<b>⇒ 一般的说法是：<span class='w'>先看清你打算拿这个估计量<b>做什么</b>，再决定需要多强的保证</b></span>。<span class='k'>追求「处处都准」往往要付出「哪儿都不准」的代价</span>（<b>这和 L06 p13 那条「不收敛也能用」是同一个教训的两次出场</b>）。", "<b>再注意 p25 页首那句限定：<span class='k'>without explicitly modeling the behavior policy</span>，它解释了这一族为什么值得存在。</b><span class='w'>看那个压低项与抬高项：压低项的 μ 由优化自己找出来，抬高项的 (s,a) 直接从 D 采 —— <b>全程不需要知道 π_β 是什么</b></span>。<b>⇒ 这和第一族的「隐式」是<span class='k'>同一个顾虑的两种解法</span></b>：<span class='w'>都在避开「先学一个 π_β 的密度模型」这条路（L07.a 的 p11 问答说明了为什么要避开 —— 我们连「什么是分布内」都不知道）</span>。<b>⇒ 两族方法的共同点比看起来多：它们都承认「支撑」不可知，然后各自找了一个不需要知道它的办法。</b>", "<b>最后，这一族和 L06 的双 Q 要分清，它们都在「压低」但压的东西不同。</b><span class='k'>双 Q 压的是「max 带来的那一点系统性偏高」</span> —— <b>作用在支撑<b>内</b>，量级小，不需要超参</b>；<span class='k'>CQL 压的是「支撑外整片虚高的区域」</span> —— <b>量级大，而且需要一个 α 来定压多狠</b>。<span class='w'>⇒ 所以这两个技巧不冲突，实践中 CQL 的实现里通常也带着双 Q</span>。<b>⚠ 这一条讲义没说，是补的；但从两者各自治什么病可以直接推出来（支撑内的噪声偏高 vs 支撑外的无根据虚高是两个独立的毛病）。</b>"], "tbl": {"cap": "p25 两项 vs p26 三项：加一项，换一种保证", "head": ["", "p25（两项：只压不抬）", "<b>p26（三项：压 + 抬）= CQL</b>"], "rows": [["惩罚项的形状", "<b>α·𝔼_{a∼μ}[Q]（绝对高度）</b>", "<b>α·(𝔼_{a∼μ}[Q] − 𝔼_{a∼D}[Q])（相对落差）</b>"], ["Q 整体加一个常数，惩罚会变吗", "<b>会变 —— 所以它会把 Q 整体往下拖</b>", "<b>不变 —— 两边抵消</b>"], ["实践后果", "<b>α 一大，连数据里的 Q 也被压垮，排序信息丢失</b>", "<b>只压平「数据外比数据内高出的那部分」</b>"], ["保证", "<b>Q̂^π ≤ Q^π 对每个 (s,a)（逐点）</b>", "<b>𝔼_{π(a|s)}[Q̂^π] ≤ 𝔼_{π(a|s)}[Q^π]，s ∈ D（期望意义）</b>"], ["保证的强弱", "<b>强</b>", "<b>弱 —— 允许单个动作被高估</b>"], ["够用吗", "<b>太强，强出来的代价是算法不可用</b>", "<b>刚好够 —— 策略就是靠最大化 𝔼_π[Q̂] 选出来的</b>"], ["要不要显式建模 π_β", "<b>不要</b>", "<b>不要</b>"]]}, "say": "<b>⚠⚠ 这一格必须先交代一件事：<span class='k'>这三页（以及接下来的 p27–28）课堂上没有讲</span>。</b><br><br><b>我在 `corpus/transcripts/L07.txt` 全文里数过</b>：<span class='w'><b>conservative</b> 0 次 · <b>CQL</b> 0 次 · <b>push down</b> 0 次 · <b>push up</b> 0 次 · <b>logsumexp</b> 0 次</span>。<b>讲稿从 IQL 的三个优点那段直接跳到</b><span class='k'>And then I guess to summarize the point of offline RL</span><b>，中间没有任何关于保守方法的内容</b>。<span class='w'>而且老师自己在讲到 p31 那个 LinkedIn 应用时说了一句 <b>This example application is for the algorithm we didn't cover.</b></span> —— <b>⇒ 这一段是幻灯里有、课上跳过的（大概是时间不够）。</b><br><br><b>所以本格以下的内容<span class='k'>不是引讲稿</span>，而是我按幻灯上的公式自己推的，并逐条标明哪些是补的。</b><span class='w'>需要引老师原话的地方我会说明「幻灯原文」还是「补的」—— 不会让补充内容看起来像老师说过的话。</span><br><br><br><b>【按幻灯公式推导 ① 那个 max_μ 到底在做什么】</b><br><br><b>幻灯只写了 max_μ 和一句 push down on large Q-values，没有解释两者的关系。关系是这样的</b>：<br><br>· <span class='k'>μ(·|s) 是动作上的一个概率分布，内层要最大化 𝔼_{a∼μ(·|s)}[Q(s,a)]</span>；<br>· <b>在「μ 可以是任意分布」的情形下，这个最大化问题的解是退化的</b> —— <span class='w'>把全部概率质量放在使 Q(s,a) 最大的那个 a 上</span>；<br>· <b>于是内层的取值就是 max_a Q(s,a)</b>；<br>· <span class='k'>外层 argmin_Q 要把「惩罚项 + 回归项」整体压小，而惩罚项就是这个最大值 ⇒ 它会把 Q 的最高处压下去</b>。<br><br><b>⇒ 一句话：<span class='w'>μ 是「找最高处的探照灯」，Q 是「被压的那个」。</span></b><b>这也解释了幻灯为什么写成 min-max 而不是直接写 max_a</b>：<span class='k'>写成对 μ 的优化，才能在 p28 给 μ 加一个熵正则，从而把这个 min-max 化简掉</span>。<br><br><br><b>【按幻灯公式推导 ② 为什么 p25 一个人不够用】</b><br><br><b>幻灯在 p25 写了 Can show that for large enough α, Q̂^π ≤ Q^π，然后 p26 立刻加了第三项。为什么要加？幻灯没说。补上</b>：<br><br>· <span class='w'>p25 那个压低项作用在「Q 最大的地方」，而它<b>不区分</b>那个地方在不在数据支撑内</b></span>；<br>· <b>在数据密集的状态上，Q 最高的那个动作很可能就是数据里那个<b>好</b>动作</b> —— <span class='k'>它也会被压</b>；<br>· <b>α 调大到足以压住支撑外的虚高时，支撑内的 Q 也被拖下去了</b>；<br>· <span class='w'>⇒ 最后得到一个「处处偏低」的 Q。它满足 Q̂ ≤ Q^π（保证是真的），但<b>排序被压平</b>，拿它取 argmax 就得不到好策略了</span>。<br><br><b>⇒ 这是一个「保证成立但算法不可用」的典型例子。<span class='k'>p26 加那一项，正是为了把「压低」限制在<u>落差</u>上而不是<u>高度</u>上。</span></b><br><br><br><b>【按幻灯公式推导 ③ 为什么降级后的保证反而是对的】</b><br><br><b>幻灯用 No longer guaranteed … BUT, guaranteed that … 把两条保证并排写了，但没说为什么后者够用。补上这个论证</b>：<br><br>· <span class='k'>问：我们拿 Q̂ 来做什么？</span><b>答：只做一件事 —— 比较不同策略的 𝔼_π[Q̂]，挑最大的那个（p27 的第 2 步）。</b><br>· <span class='w'>⇒ 唯一会伤到我们的错误是：「𝔼_π[Q̂] 很高，但 𝔼_π[Q^π] 很低」</span> —— <b>也就是我以为这个策略很好，其实不好</b>。<br>· <b>而 p26 的保证 𝔼_{π(a|s)}[Q̂^π] ≤ 𝔼_{π(a|s)}[Q^π]（s ∈ D）<span class='k'>恰好排除了这件事</span></b>：<span class='w'>我们对自己输出的那个策略的估值<b>不会偏高</b>，最多偏低</span>。<br>· <b>偏低有什么后果？<span class='k'>我可能错过一个更好的策略（保守 ⇒ 漏掉机会），但不会选出一个糟糕的策略（不会被骗）</span></b>。<b>在离线设定下，这个取舍方向是对的</b> —— <span class='w'>因为「被骗」是不可恢复的（没有新数据来纠正），而「漏掉」只是少赚</span>。<br>· <b>⇒ 至于逐点的 Q̂ ≤ Q^π：<span class='k'>它附带保证了「每个单独动作的估值都不偏高」，而我们从来不需要这件事</span></b>。<b>那部分强度是白付的，而且代价高昂（压垮排序）。</b><br><br><b>⚠ 以上三段推导都是补的。</b><span class='w'>幻灯标了 Slide adapted from Sergey Levine，原始出处是 Kumar et al. 的 CQL 论文（2020）与 Levine 的离线 RL 课程/综述；要引用「为什么期望意义的保证够用」这个论证，应该去读那边的定理陈述，而不是引本课</span>。", "link": {"t": "你学过的对应：CS224R L06 精读 p13（「不收敛常常只是绝对值不准，排序对了 argmax 出来的策略照样好」—— p26 的那个「差」形状守住的正是排序）", "href": "L06-精读.html"}, "res": {"tag": "推断", "v": "<b>这三页里有两样东西可以直接搬进你的方法设计，而第二样比第一样值钱。</b><br><br><b>【一】那个「压落差而不压高度」的形状</b><br><br><span class='w'>你的成本代理模型在未评估过的配置上会偏乐观（见 L07.a 那条科研格）。最朴素的对策是「整体加一个安全边际」</span>，<b>但那等于 p25</b>：<span class='k'>你压住了虚高，同时也把已评估配置之间的差别一起压平了，而你的搜索靠的正是那些差别</span>。<br><br><b>⇒ p26 的形状给了更好的对策</b>：<span class='w'>惩罚项写成「这个配置的预测成本<b>比已实测配置低多少</b>」这个落差</span>，<b>而不是「预测成本的绝对值」</b>。<span class='k'>⇒ 代理模型整体偏移不受罚，但「比任何实测过的都好」这件事要受罚</b> —— <b>而「比任何实测过的都好」恰恰是最可疑的那种预测</b>。<br><br><b>【二】⭐ 那条「保证要配得上用途」的方法论</b><br><br><b>这一条对你写论文的理论部分直接有用。先问清楚你的保证是给什么用的</b>：<br>· <span class='w'>你要输出的是<b>一个</b>配置（最便宜的可行配置）</span>；<br>· <span class='k'>你需要的保证是「<b>我输出的那个</b>配置确实可行、而且成本确实接近最优」</span>；<br>· <b>你<b>不</b>需要「我的代理模型在全部 2^n 个配置上都准」</b> —— <span class='w'>那是一个强得多的陈述，而且几乎肯定证不出来（或者只能在荒谬的样本量下证出来）</span>。<br><br><b>⇒ 这正是 p25 → p26 那一步的结构</b>：<span class='k'>把「逐点正确」换成「对输出的那个对象正确」</span>。<b>在约束最优臂识别的文献里，这对应的正是「输出保证」而不是「一致估计」</b> —— <span class='w'>例如「以概率 1−δ 输出的臂是 ε-最优且可行的」这类陈述，它只约束输出，不约束对每条臂的估计</span>。<br><br><b>⇒ 两条具体建议</b>：<br><b>① 把你的主定理写成「输出保证」而不是「估计保证」。</b><span class='k'>后者更难证、更容易被反例打掉，而且审稿人会问「你要它干什么」</span>。<br><b>② 在误差方向上<u>不对称</u>地设计。</b><span class='w'>p26 的保证是单向的（只保证不高估，允许低估）</span>，<b>而你的情形同样单向</b>：<span class='k'>把不可行配置误判成可行（被骗）是不可恢复的；把可行配置误判成不可行（漏掉）只是损失一点最优性</b>。<b>⇒ 所以可行性判据应当刻意偏向「宁可漏掉」，并且在定理里把这个不对称<span class='w'>明写出来</span>，而不是当成一个实现细节。</b>（<b>这和 L07.b p22 那条科研格里「约束侧取高分位」是同一件事的理论版本。</b>）<br><br>⚠ <b>标为推断</b>：<span class='w'>p25/p26 的两条保证是关于 MDP 上 Q 函数的陈述，我没有核对它们的原始条件（幻灯只写了 Can show that…，而课堂跳过了这一段、讲稿里一个字都没有）</span>。<b>上面搬过来的是「保证的<u>形状</u>」与「取舍的<u>方向</u>」，不是任何具体的界。</b><span class='k'>要在论文里引用 CQL 的保证，必须去读 Kumar et al. (2020) 的定理陈述与假设 —— 不能引本课幻灯。</span>", "ref": "本讲 p25「for large enough α, Q̂^π ≤ Q^π」与 p26 的 BUT 那一行；原始出处 Kumar et al. Conservative Q-Learning (2020)，幻灯标 Slide adapted from Sergey Levine。⚠ 本段推导课堂未讲、讲稿无对应"}},
{"r": [27, 28], "t": "CQL 全算法，和那个把 min-max 消掉的 logsumexp", "star": 5, "quote": "How to mitigate overestimation in offline RL?  Conservative Q-learning (CQL) — Full algorithm: 1. Update Q̂^π using L_CQL using D.  2. Update policy π.  If actions are discrete: π(a|s) = 1 if a = arg max_ā Q̂^π(s,ā), 0 otherwise.  If actions are continuous: θ ← θ + η∇_θ E_{s∼D,a∼π_θ(·|s)}[Q̂^π(s,a)].  You will implement CQL in homework 3!  How compute objective L_CQL?  Q̂^π = arg min_Q max_μ E_{(s,a,s')∼D}[(Q(s,a) − (r(s,a) + γE_π[Q(s',a')]))²] + α E_{s∼D,a∼μ(·|s)}[Q(s,a)] − α E_{(s,a)∼D}[Q(s,a)] + R(μ).  regularizer.  Common choice: With max entropy regularizer R, optimal μ(a|s) ∝ exp(Q(s,a)).  Then: E_{s∼D,a∼μ(·|s)}[Q(s,a)] = log Σ_a exp(Q(s,a)).  Don't need to construct μ directly.  Slide adapted from Sergey Levine.", "one": "<b>给 μ 加一个最大熵正则，内层那个 max 就有了闭式解 <span class='k'>μ(a|s) ∝ exp(Q(s,a))</span>，而它的取值正好是 <span class='k'>log Σ_a exp Q(s,a)</span>。</b><b>于是整个 min-max 塌成一个可微的项</b> —— <span class='w'>Don't need to construct μ directly。实现上只要在 critic 损失里加一行 logsumexp 减去数据里那个 Q。</span>", "eq": "**p28 的完整目标（三项 + 一个正则）**\n\n   Q̂^π = argmin_Q max_μ { 𝔼_{(s,a,s')∼D}[ (Q(s,a) − (r + γ𝔼_π[Q(s',a')]))² ]   ← 标准回归\n                        + α·𝔼_{s∼D, a∼μ(·|s)}[ Q(s,a) ]                     ← 压低\n                        − α·𝔼_{(s,a)∼D}[ Q(s,a) ]                           ← 抬高\n                        + **R(μ)** }                                        ← **regularizer**\n\n────────────────────────────────────────\n**取 R(μ) = 最大熵正则，内层的 max 就能解出来**\n\n   内层问题（固定 s，对 μ 最大化）：\n\n     max_μ  { Σ_a μ(a)·Q(s,a)  +  **ℋ(μ)** }       其中 ℋ(μ) = −Σ_a μ(a) log μ(a)\n              └─ 想把质量放在 Q 大的地方 ─┘   └─ 想保持分散 ─┘\n\n   这是一个标准的「线性目标 + 熵」问题，解是 **Gibbs / softmax 分布**：\n\n     **μ*(a|s)  ∝  exp( Q(s,a) )**        ← 幻灯原文：optimal μ(a|s) ∝ exp(Q(s,a))\n\n   把 μ* 代回去，最优值就是**对数配分函数**：\n\n     **𝔼_{a∼μ*(·|s)}[Q(s,a)]  =  log Σ_a exp( Q(s,a) )**\n         （幻灯原文的 Then: 那一行）\n\n   ⚠ 注意左边写的是 𝔼_{a∼μ*}[Q]，严格说这一行是「内层**最优值**（含熵项）」\n     而不是「在 μ* 下 Q 的期望」—— 幻灯把两者写成了等号，是省写。\n     **（这一处是我对照 Gibbs 变分公式看出来的，标为推断。）**\n\n────────────────────────────────────────\n**⇒ 整个 min-max 塌成一个可微的损失**\n\n   L_CQL(Q)  =  回归项  +  α·( **log Σ_a exp Q(s,a)**  −  **Q(s, a_数据)** )\n                             └─ 所有动作的「软最大」─┘   └─ 数据里那个动作 ─┘\n\n   ⇒ **惩罚 = 「软最大」与「数据里那个」的差**\n     · 若数据里那个动作恰好就是 Q 最大的 ⇒ 差 ≈ 0 ⇒ **不罚**\n     · 若某个数据外的动作 Q 虚高         ⇒ 差 很大 ⇒ **重罚**\n\n   ⇒ **幻灯的结论：Don't need to construct μ directly.**\n     实现上不需要任何额外的网络或采样分布，加一行 logsumexp 就行。\n\n────────────────────────────────────────\n**p27：有了 L_CQL 之后，算法只有两步**\n\n   **1. Update Q̂^π using L_CQL using D**\n   **2. Update policy π**\n\n   而第 2 步分两种情形：\n\n     **离散动作**：  π(a|s) = 1  若 a = argmax_ā Q̂^π(s, ā)，否则 0\n                  —— 就是 L06 的那个贪心策略，不含参数\n\n     **连续动作**：  θ ← θ + η·∇_θ 𝔼_{s∼D, a∼π_θ(·|s)}[ Q̂^π(s,a) ]\n                  —— 对 Q 做梯度上升（SAC 的那个 actor 更新）\n\n   ⚠ **注意第 2 步<u>会</u>查询数据外的动作**（argmax 遍历全部动作；\n     梯度上升会把 π_θ 推到任何 Q 高的地方）。\n     ⇒ **这与第一族完全相反**（IQL：Never need to query OOD actions!）。\n     ⇒ 而这正是 CQL <u>必须</u>有那个保守惩罚的原因：\n       它不靠「不去」，它靠「去了也没好处」。", "pts": ["<b>⭐ 这个化简是全讲技术上最漂亮的一处，而它的模式值得单独记住：<span class='k'>给内层的 max 加一个熵正则，min-max 就塌成一个闭式的可微项</span>。</b><span class='w'>原始形式 argmin_Q max_μ 是一个双层优化 —— 实现上要么交替更新两个东西、要么对 μ 做采样近似，都麻烦且不稳</span>。<b>而加了熵之后，内层有解析解，于是整个问题变回一个普通的单层最小化</b>。<span class='k'>⇒ 这个技巧在机器学习里到处出现</span>（<span class='w'>soft Q-learning 的 soft 就是它、最大熵 RL 的 log-sum-exp 就是它、softmax 这个名字本身就是它</span>）。<b>看到 min-max 先问一句「内层能不能加个熵正则」，是一个很有用的反射。</b>", "<b>把那个闭式解的两端想清楚，就知道「熵正则」在这里控制什么。</b><span class='k'>μ* ∝ exp(Q)</span>：<b>熵的权重大 ⇒ μ* 接近均匀分布 ⇒ 惩罚项接近「Q 的平均值」⇒ 压得温和、压得分散</b>；<span class='k'>熵的权重小 ⇒ μ* 接近「全部质量在 argmax 上」⇒ 惩罚项接近 max_a Q ⇒ 只狠压最高的那一个</span>。<span class='w'>⇒ 所以熵正则实际上在调「压的范围」：是只压最高处，还是把一整片高处都压一点</span>。<b>⚠ 讲义只给了 Common choice 这一个档位，没有讨论这个权重怎么选；p32 说 CQL 的卖点是 Just one hyperparameter，那一个指的是 α</b>（<span class='k'>熵的权重通常被吸收进 Q 的尺度里，不单独调 —— 这一句是补的</span>）。", "<b>⭐ 把化简后的惩罚项读一遍，会发现它的语义非常直白，甚至可以当成一句话记住整个 CQL。</b><span class='k'>α·( logsumexp_a Q(s,a) − Q(s, a_数据) )</span> —— <b>「所有动作的软最大」减去「数据里实际发生的那个动作」</b>。<span class='w'>⇒ 如果数据里那个动作本来就是最好的，这个差接近 0，不罚</span>；<span class='w'>⇒ 如果某个没人试过的动作 Q 被抬得很高，这个差就很大，重罚</span>。<b>⇒ 一句话版的 CQL：<span class='k'>不许让「你没见过的动作」看起来比「你真见过的动作」好太多</span></b>。<b>⚠ 注意这个形式和交叉熵损失长得一模一样</b>（<span class='w'>logsumexp 减去正确类别的 logit，正是 softmax 交叉熵</span>）—— <b>所以从实现角度看，CQL 的惩罚项就是「把数据里那个动作当成正确标签，做一次分类」</b>。<span class='k'>这一条讲义没写，是补的，但它让这一项的实现与调试变得非常熟悉。</span>", "<b>⚠ 这里有一个重要的实践限制，幻灯用 Σ_a 这个记号悄悄绕过去了：<span class='k'>logsumexp 只有在动作离散时才能精确算</span>。</b><span class='w'>Σ_a exp(Q(s,a)) 要把全部动作加一遍 —— 离散动作可以（枚举），连续动作不行（积不出来）</span>。<b>⇒ 连续动作下必须用采样近似这个积分</b>（<span class='k'>CQL 论文的做法是从策略和一个均匀分布里各采若干动作，做重要性加权的 logsumexp</span>），<b>而这就引入了采样方差与一个「采几个」的新超参</b>。<span class='w'>⇒ 所以 p32 说 CQL「只有一个超参」这个卖点，在连续动作设定下其实要打一点折</span>。<b>⚠ 这一整条讲义没有提，是补的；但它对作业 3 的实现是实际的（要看清你的环境动作空间是哪一种）。</b>", "<b>⭐ p27 第 2 步暴露了 CQL 与第一族的<span class='k'>根本区别</span>，这是全讲最该带走的对比之一。</b><span class='w'>看那两行策略更新</span>：<b>离散情形是 argmax_ā 遍历<b>全部</b>动作；连续情形是对 Q 做梯度上升，而梯度会把 π_θ 推到<b>任何</b> Q 高的地方</b>。<span class='k'>⇒ CQL 的策略<b>会</b>查询数据外的动作，而且是主动去查</b>。<b>这与 IQL 那条 Never need to query OOD actions! 完全相反</b>。<span class='w'>⇒ 两族的安全机制因此是互补的</span>：<b>第一族靠「结构上不给机会」（策略只在数据里的动作上被监督），第二族靠「去了也没好处」（那里的 Q 已经被压低）</b>。<span class='k'>⇒ 而这也说明为什么 CQL 一定要有那个惩罚项：去掉它，p27 的第 2 步就是 p10 那个会炸的 SAC。</span>", "<b>把两族方法的「失败模式」对照一下，对选型有直接帮助。</b><span class='k'>第一族（IQL）失败时，表现为「不够好」</span>：<b>它从不提出数据外的动作，所以最坏情况是退化成模仿学习（p18 那个确定性 π_β 的情形就是一例）</b> —— <span class='w'>安全但平庸</span>。<span class='k'>第二族（CQL）失败时，表现为「α 没调对」</span>：<b>α 太小 ⇒ 惩罚不够 ⇒ 退回 p11 那个会炸的情形；α 太大 ⇒ 压过头 ⇒ Q 排序被压平 ⇒ 策略退化成随机</b>。<span class='w'>⇒ 一个的失败是单向的（只会偏保守），一个是双向的（两头都能坏）</span>。<b>⇒ 这解释了 p32 的推荐顺序：如果你不想花时间调参，选第一族。</b>", "<b>最后，CQL 与双 Q、与 L06 那套补丁的关系值得理清，因为它们在实现里常常同时出现。</b><span class='k'>CQL 治的是「支撑外的无根据虚高」</span>（<b>一片区域，量级大，需要 α</b>）；<span class='k'>双 Q 治的是「max 在带噪估计上的系统性偏高」</span>（<b>支撑内，量级小，不需要超参</b>）；<span class='k'>目标网络治的是「标签在内层循环里乱动」</span>（<b>优化稳定性，与高估无关</b
