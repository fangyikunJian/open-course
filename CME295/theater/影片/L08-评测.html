      note("⚠ 所以模型卡里会有「安全」一节，但<b>不做跨模型对比</b>",640,352,"y");
      setCap("用安全基准前，<b>先去看它具体测了什么</b>。");
    },"最后一条限定，讲者讲得很细，<b>而它纠正了一个很普遍的误读</b>：  <b>安全基准的分数，不能拿来跨模型比较。</b>  理由：<b>safety is a bit subjective with respect to the LLM provider. Every company has its own policy. So you cannot necessarily compare performance on a given benchmark across models, just because all these providers might not claim they want to perfectly solve that benchmark 100%.</b>  <em>也就是说——一家公司在某个安全基准上得分低，可能不是因为它「不安全」，而是因为它的政策和这个基准的假设不一致。</em>  <b>讲者说这就是为什么：模型卡里通常有「安全」一节描述他们做了什么工作，但不会给出跨模型的基准对比。</b>  ⚠ <b>他给的实务建议是：</b>  <b>when you execute a safety benchmark, you should check the content of the benchmark in order to put a meaning behind it.</b>  <em>——去看它具体测了哪些行为，判断它的假设是否和你的政策一致。否则那个数字对你没有意义。</em>");
  SUM(5087,8,{h:"四类基准，以及它们为什么几乎全是选择题",
    k:"<b>知识</b>（MMLU，约 60 学科四选一，⚠ 主要量<b>预训练做得好不好</b>）· <b>推理</b>（AIME 答案是三位数 · PIQA 物理常识二选一）· <b>代码</b>（SWE-bench）· <b>安全</b>（HarmBench）。",
    m:"⚠ 共同设计原则：<b>让答案可被硬编码提取</b>。因为用 LaaJ 来判会<b>再引入一层误差</b>（前四集刚讲完裁判有偏差且「绝非穷举」）。<b>基准牺牲「像真实场景」换来「可比性」。</b>",
    w:"<b>SWE-bench 的出题方式</b>值得学：筛出「修了 issue <b>且同时引入测试</b>」的真实 PR —— 那组测试<b>自带一个原作者写的客观判据</b>（改之前不过、改之后过）。这正是第六讲说的「可验证奖励」。",
    e:"⚠ <b>HarmBench 是唯一靠分类器判定的</b>，所以<b>判据自己也会出错</b>；它还把<b>意图与能力分开</b>（试图作恶但失败也算攻击成功）。⚠ <b>安全基准跨模型不可比</b> —— 每家政策不同、没人追求 100%，用之前<b>先看它具体测了什么</b>。"});
  QUIZ(5087,8,{t:"公开基准为什么大多设计成选择题或有固定答案格式？",
    o:["因为选择题的题目更容易大批量生成","因为自由作答需要用 LLM 裁判评分，会再引入一层误差","因为选择题更接近真实用户的使用方式","因为固定格式可以减少模型的推理 token 消耗"],
    a:1,
    w:"讲者的理由：<b>doing so introduces another layer of potential errors — the LLM-as-a-Judge isn't necessarily perfect</b>。前四集刚讲完裁判有位置/冗长/自我偏好三个偏差且「绝非穷举」，若基准依赖它，模型间的分数差异里就掺进了裁判的偏差。所以要 <b>a hard-coded way to extract the answer</b>。⚠ 这是<b>牺牲「像真实场景」换「可比性」</b>的权衡。<s>「容易生成」</s>MMLU 等基准的题目大多来自真实考试，并不便宜。<s>「更接近真实使用」</s>恰恰相反。<s>「减少 token」</s>不是设计动机。"});
});

KP("9 · <b>pass^k</b> · 帕累托前沿 · 数据污染 · 古德哈特　<small>讲义 p152–169</small>",function(){
  /* 钩子 */
  S(6072,function(){
      clearScene();setEq(null);setBig(null);
      boxNode(110,110,300,56,"模拟的「用户」","y");
      note("<b>由另一个大模型扮演</b>",260,195,"r");
      arrow(414,138,500,138,"sm",0);
      boxNode(540,110,300,56,"被测智能体","g");
      arrow(844,138,930,138,"sm",0);
      boxNode(950,110,210,56,"工具 / 数据库","b");
      note("判分看<b>数据库最终状态</b>对不对",640,290,"g");
      note("为什么用户要模拟：多轮对话<b>没法硬编码</b>",640,358,"y");
      setCap("<b>tau-bench</b>（Tool-Agent-User）。航空与零售两个领域。");
    },"上一集那些基准都是单轮的。<b>智能体怎么评？</b>  <b>tau-bench</b>——<em>τ 取自 Tool-Agent-User</em>。它提供两个领域（<b>航空和零售</b>）的工具集，一套<b>政策</b>（<em>智能体能做什么、不能做什么</em>），以及一批任务。  ⚠ <b>最有意思的设计在用户那一侧：用户是由另一个大模型模拟的。</b>  讲者解释了为什么必须这样：<b>the user interaction with the agent cannot be hard-coded, because further turns will depend on previous ones.</b>  <em>你没法预先写死用户的第二句话——它取决于智能体第一步做了什么。</em>  <b>怎么判分？看数据库的最终状态。</b>讲者：calculating a reward that's a function of the <b>database change</b>——<em>用户想改签，那就看票务记录最终是不是改对了</em>。  ⚠ <b>这个判据很聪明：它绕开了「评判对话质量」这件难事，直接看「事情办成了没有」。</b>");
  /* 错误答案 */
  S(6084,function(){
      clearScene();setEq(null);
      setBig("第六讲那个 pass@k，这里直接用就行","k 次里至少成功一次");
      setCap("<s>要的恰恰相反</s>：自动化场景要的是<b>每次都成</b>。");
    },"第六讲讲过 <b>pass@k</b>——<b>k 次尝试里至少一次成功</b>的概率。<b>这里直接用？</b>  <b>不行，而且理由很有说服力。</b>  <em>pass@k 适合的是那种「你可以多试几次、而且能判断哪次对了」的场景——比如写代码，生成十个版本挑能跑通的那个。</em>  <b>但 tau-bench 测的是「用智能体去自动化客服流程」。</b>讲者点明了这个场景真正在乎的东西：  <b>an agent in the loop here could be a way to see if automating the agent side of things could help. And in order to truly know whether it can help, you want to have reliability and consistency in mind.</b>  <em>一个航空公司的改签机器人，十次里有一次办对，是完全不可用的——因为出错的那九次，每一次都是一个真实用户被坑了，而且你没有机会「重试」。</em>  <b>自动化要的不是「有可能成功」，是「每次都成功」。</b>");
  /* 铺陈 */
  S(6096,function(){
      clearScene();setEq(null);setBig(null);
      boxNode(110,105,460,58,"pass@k（第六讲）","y");
      note("k 次里<b>至少一次</b>成功",340,195,"y");
      note("适合：能多试、能判对错的场景",340,243,"y");
      boxNode(730,105,440,58,"pass^k（这一讲）","g");
      note("k 次<b>全部</b>成功",950,195,"g");
      note("适合：要<b>可靠性</b>的自动化场景",950,243,"g");
      note("讲者说这是个 <b>funny word play</b> —— 一个 @ 换成了 ^",640,352,"r");
      setCap("两个符号差一点，<b>含义正好相反</b>。");
    },"于是 tau-bench 引入了 <b>pass^k</b>——讲者说这是个 <b>funny word play</b>：  · <b>pass@k</b>：k 次里<b>至少一次</b>成功。 · <b>pass^k</b>：k 次<b>全部</b>成功。  <b>一个 @ 换成 ^，含义正好相反。</b>  ⚠ <b>而两者的适用场景也正好相反：</b> · <b>pass@k</b> 适合「<em>可以多试、而且能判断哪次对了</em>」——<b>人在环里挑</b>。 · <b>pass^k</b> 适合「<em>只能跑一次、而且没人检查</em>」——<b>全自动</b>。  <b>这个区分值得记住，因为它直接对应你打算怎么部署这个系统。</b>  ⚠ 讲者在这里做了个很好的教学处理：<b>他说时间不够推导 pass^k 的公式，但让大家回去参考第六讲 pass@k 的推导自己做</b>——<em>I just want you to be convinced that this is indeed the formula. If you're not convinced, please feel free to do it at home.</em>  <em>（思路是一样的：从 n 个样本里抽 k 个，算「全部成功」而不是「全部失败」。）</em>");
  /* 主体 */
  S(6108,function(){
      clearScene();setEq(null);setBig(null);
      curve([[180,350],[320,280],[480,235],[660,205],[860,190],[1060,182]],"fit g");
      note("纵轴：性能",170,140,"b");
      note("横轴：价格（或延迟、上下文长度…）",640,392,"b");
      note("边界上这些 = <b>帕累托前沿</b>",820,255,"g");
      note("前沿之下的，<b>在这个维度上被支配</b>",400,180,"r");
      setCap("讲者给了自己的用法，但强调 <b>not global recommendations</b>。");
    },"讲完基准，讲者给了一个很重要的定位：  <b>benchmarks are here to characterize the profile of your LLM. So it's not all good or all bad.</b>  <em>不同模型各有长短，没有一个在所有维度上都最好。</em>  <b>怎么系统地看？画帕累托前沿。</b>把性能对另一个你在乎的维度（<em>价格、延迟、安全、上下文长度</em>）画出来，<b>边界上那些模型就是「在这个价位上你能买到的最好」</b>。  ⚠ <b>讲者给了自己的实际用法，而且特意加了限定：</b>  <b>Sonnet 模型写代码很好用；要又快又便宜时用 Gemini Flash。</b>但紧接着：<b>these are not, by any means, global recommendations. Your own use case and your own experience can guide you into having a profile of models that suits your tasks best.</b>  <em>这个限定本身就是在示范：讲出自己的经验，同时说清它的适用范围。</em>");
  /* 主体 */
  S(6120,function(){
      clearScene();setEq(null);setBig(null);
      boxNode(240,105,800,58,"基准的题目和答案，可能已经进了训练语料","r");
      note("那分数就不再反映能力，只反映<b>记住了多少</b>",640,205,"r");
      note("三种对策：",640,268,"g");
      note("哈希值核对 · 屏蔽名单（防联网查到）· 用<b>全新考题</b>",640,322,"g");
      note("⚠ 数学这类领域有「每年出新题」这个奢侈条件",640,382,"y");
      setCap("基准有效的前提是：<b>模型没见过它</b>。");
    },"基准还有一个前提性的问题：<b>数据污染</b>。  讲者说得很直接：<b>these benchmarks are as good as the assumption of whether you have seen the actual benchmark results or not. So make sure you haven't seen them.</b>  <em>如果基准的题目和答案已经出现在训练语料里，那分数反映的就不是能力，而是「记住了多少」。</em>  <b>三种对策</b>： · <b>哈希值</b>——<em>核对题目有没有出现在语料里</em>。 · <b>屏蔽名单</b>——<em>工具调用场景下，禁止访问可能含有答案的网站</em>。 · <b>用全新考题</b>——讲者说数学领域有这个 <b>luxury</b>：<em>AIME 每年出新题，模型肯定没见过</em>。  ⚠ <b>注意第三条的含义：它说明大多数领域没有这个奢侈条件。</b>  <em>而且污染很难完全排除——训练语料有几万亿 token，谁也没法逐条检查。所以基准分数总是带着一个「可能虚高」的不确定性。</em>");
  /* 反驳 */
  S(6132,function(){
      clearScene();setEq(null);setBig(null);
      boxNode(190,110,900,70,"When a measure becomes a target, it ceases to be a good measure","r");
      note("第五讲：奖励模型是代理 ⇒ <b>奖励黑客</b>",640,240,"y");
      note("第五集：LaaJ 分数是代理 ⇒ <b>别过度优化</b>",640,295,"y");
      note("这一集：基准是代理 ⇒ <b>古德哈特定律</b>",640,350,"r");
      setCap("同一个形状，这门课里出现了<b>三次</b>。");
    },"讲者用<b>古德哈特定律</b>收尾整讲：  <b>When a measure becomes a target, it ceases to be a good measure.</b> （<em>当一个度量变成目标，它就不再是一个好度量。</em>）  ⚠ <b>请把这三处放在一起看，它们是同一个结构：</b>  · <b>第五讲</b>：奖励模型是人类偏好的代理 ⇒ <em>优化太狠就钻它空子（奖励黑客）</em>。 · <b>本讲第五集</b>：LaaJ 分数是人工评分的代理 ⇒ <em>别对着代理过度优化</em>。 · <b>这一集</b>：基准分数是真实能力的代理 ⇒ <em>一旦全行业都盯着它，它就失效了</em>。  <b>三次，同一个形状。</b>  讲者给的结论很克制也很实在：<b>benchmark results are to be weighed against what you're truly looking for. These results don't necessarily tell you whether a model is good for you or not.</b>  他提了 <b>ChatBot Arena</b>（<em>真人对战打分</em>）作为一种更贴近真实体验的补充，<b>但最后那句才是重点</b>：  <b>ultimately, you should be the one trying out these models and see for yourself which one corresponds to your use case.</b>  <em>——没有任何一个数字能替你做这个判断。</em>");
  SUM(6072,9,{h:"pass^k · 帕累托前沿 · 数据污染 · 古德哈特",
    k:"<b>tau-bench</b> 评智能体：<b>用户由另一个大模型模拟</b>（多轮对话没法硬编码），判分看<b>数据库最终状态</b>。它引入 <b>pass^k</b> = k 次<b>全部</b>成功的概率。",
    m:"⚠ <b>pass@k 与 pass^k 的适用场景正好相反</b>：前者适合「可以多试、有人挑」（第六讲写代码），后者适合「只跑一次、没人检查」的<b>自动化</b> —— 自动化要的是<b>可靠性</b>，十次办对一次是不可用的。",
    w:"基准画的是<b>画像不是排名</b>：把性能对价格/延迟/上下文长度画出来，边界上那些是<b>帕累托前沿</b>。⚠ 讲者给了自己的用法（Sonnet 写代码、Gemini Flash 图快省）<b>但特意声明这不是普适建议</b>。",
    e:"⚠ <b>数据污染</b>：基准有效的前提是模型没见过它。对策是哈希核对、屏蔽名单、以及<b>用全新考题</b>（数学才有这个奢侈条件）。⚠ 收尾的<b>古德哈特定律</b>——「当一个度量变成目标，它就不再是好度量」——与第五讲的奖励黑客、本讲第五集的「别优化代理」<b>是同一个结构，出现了三次</b>。"});
  QUIZ(6072,9,{t:"tau-bench 为什么用 pass^k 而不是第六讲的 pass@k？",
    o:["因为智能体任务的单次成功率太低，pass@k 会饱和","因为 pass^k 的计算复杂度更低","因为它测的是自动化场景，需要的是可靠性——每次都成功，而不是至少成功一次","因为智能体无法并行多次尝试"],
    a:2,
    w:"讲者的理由：要判断「自动化这件事能不能帮上忙」，<b>you want to have reliability and consistency in mind</b>。一个航空改签机器人十次办对一次是<b>完全不可用</b>的——出错的九次每次都坑了一个真实用户，而且没有重试机会。所以要的是 <b>k 次全部成功</b>的概率。⚠ 两者适用场景正好相反：pass@k 适合「可以多试、有人挑」，pass^k 适合「只跑一次、没人检查」。<s>「会饱和」</s>不是讲者给的理由。<s>「复杂度更低」</s>两者都是简单组合数。<s>「无法并行」</s>可以并行，但<b>并行与否不改变「要不要每次都成」这个需求</b>。"});
});

KP("完",function(){
  S(6520,function(){
      clearScene();setBig(null);setCap(null);setEq(null);
      setTitle("CME295 · Lecture 8","度量这件事，没有免费的",
      "下一讲：全课回顾与 2025 的前沿");
    },"把九集收成一条链：<b>每一次「让评测变便宜」，都是在用一层近似换成本。</b>  <b>人工评分</b>（最接近真相，但贵）→ <b>规则指标</b>（便宜了，但不容措辞变化）→ <b>LLM 当裁判</b>（灵活了，但有偏差）→ <b>公开基准</b>（可比了，但会被污染、会被当成目标）。  ⚠ <b>而这条链上有一个反复出现的陷阱，它是本讲真正的主题：</b>  <b>你优化的那个东西，和你真正想要的东西，从来不是同一个。</b>  · 第五讲：<em>奖励模型是人类偏好的代理 ⇒ 奖励黑客</em>。 · 这一讲第五集：<em>LaaJ 分数是人工评分的代理 ⇒ 别过度优化它</em>。 · 这一讲第九集：<em>基准是真实能力的代理 ⇒ 古德哈特定律</em>。  <b>三次，同一个形状。</b>所以讲者给的最后一条建议很朴素，也很对：<b>基准能帮你画出模型的「画像」，但最终该由你自己试，看哪个适合你的场景。</b>  还有一条很实用的方法论，在第七集：<b>面对一堆乱七八糟的失败时，先把它们分类，再成组地解决。</b>讲者的原话是 <em>being very organized here is going to help you a lot</em>。  下一讲是最后一讲：<b>全课回顾，以及 2025 年的前沿。</b>");
});
